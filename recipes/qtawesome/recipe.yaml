# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: qtawesome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/QtAwesome/qtawesome-${{ version }}.tar.gz
  sha256: b2bf9351beb335095006892796f072ffd9755a2d7e5113dc71918dcd9ba4ef4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - qtpy

tests:
  - python:
      imports:
        - qtawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spyder-ide/qtawesome
  license: MIT
  license_file: LICENSE.txt
  summary: FontAwesome icons in PyQt and PySide applications
  description: |
    FontAwesome icons in PyQt and PySide applications

extra:
  recipe-maintainers:
    - SylvainCorlay
    - ccordoba12
    - dalthviz

#### CFE metadata AND comments
