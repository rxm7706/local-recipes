# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: qtawesome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qtawesome/qtawesome-${{ version }}.tar.gz
  sha256: b2bf9351beb335095006892796f072ffd9755a2d7e5113dc71918dcd9ba4ef4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  python:
    entry_points:
      - qta-browser = qtawesome.icon_browser:run
      - qta-install-fonts-all-users = qtawesome:install_bundled_fonts_system_wide

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - qtpy

tests:
  - python:
      imports:
        - qtawesome
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pyqt
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Iconic fonts in PyQt and PySide applications
  homepage: https://github.com/spyder-ide/qtawesome

extra:
  recipe-maintainers:
    - SylvainCorlay
    - ccordoba12
    - dalthviz
