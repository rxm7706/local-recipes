# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.6"

package:
  name: pyshp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyshp/pyshp-${{ version }}.tar.gz
  sha256: 4c4b5a4138815c93defd6ebe50bae885b7e58984f431cdb7bb5d00718ac71daf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyshp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyshp/
  license: MIT
  license_file: LICENSE
  summary: Pure Python read/write support for ESRI Shapefile format
  description: |
    Pure Python read/write support for ESRI Shapefile format
  repository: https://github.com/GeospatialPython/pyshp

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf

#### CFE metadata AND comments
