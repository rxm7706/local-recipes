# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.45.0"
  python_min: "3.12"

package:
  name: chaostoolkit-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chaostoolkit-lib/chaostoolkit_lib-${{ version }}.tar.gz
  sha256: 305db446de8cbfdfa390ee23e5a2cb3307a376bad4b9714f48dc9fdcd93794ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - pyyaml >=6.0.1
    - importlib-metadata >=6.7.0
    - charset-normalizer >=3.3.2
    - python-json-logger >=2.0.7
    - if: win
      then:
        - colorama

tests:
  - python:
      imports:
        - chaoslib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://chaostoolkit.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Chaos Toolkit core library
  description: |
    Chaos Toolkit core library
  repository: https://github.com/chaostoolkit/chaostoolkit-lib
  documentation: https://chaostoolkit.org

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
