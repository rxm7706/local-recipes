# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: deepsnap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepsnap/deepsnap-${{ version }}.tar.gz
  sha256: 656a934757c72ff251291d687d95143e7841c487373f53e30d2c05d4aac40d8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - deepsnap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snap-stanford/deepsnap
  license: MIT
  license_file: LICENSE
  summary: Deepsnap package
  description: |
    Deepsnap package

extra:
  recipe-maintainers:
    - rxm7706

