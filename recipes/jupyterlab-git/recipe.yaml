# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.54.1"

package:
  name: jupyterlab-git
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-git/jupyterlab_git-${{ version }}.tar.gz
  sha256: eb9adadf351c8e28f3a990952d294e30885768d636e88cdc72d3c6ac5c0e88b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - jupyter-server <3,>=2.0.1
    - jupyterlab-git-core >=0.52.0
    - traitlets ~=5.0

tests:
  - python:
      imports:
        - jupyterlab_git
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyterlab/jupyterlab-git
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A JupyterLab extension for version control using git
  description: |
    A JupyterLab extension for version control using git
  repository: https://github.com/jupyterlab/jupyterlab-git.git

extra:
  recipe-maintainers:
    - jtpio
    - krassowski
    - dlqqq
    - dbast
    - blink1073
    - fcollonval
    - bollwyvl

