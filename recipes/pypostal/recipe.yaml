# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: pypostal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyPostal/pyPostal-${{ version }}.tar.gz
  sha256: 961849750395ab72306b961c586ac04764f6d781bc205632a327cb7359a2f3c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypostal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/hudora/pyPostal/#readme
  license: MIT
  license_file: LICENSE
  summary: pyPostal is an Interface for sending real (paper-based) letters via API (Pixelletter)
  description: |
    pyPostal is an Interface for sending real (paper-based) letters via API (Pixelletter)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
