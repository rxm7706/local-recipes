# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.5.0"

package:
  name: django-tailwind
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-tailwind/django_tailwind-${{ version }}.tar.gz
  sha256: c4b40820663ac3932f6951b82b91e3773361a46d9bde972bc8a338eee3c5d045

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=4.2.20
    - pytailwindcss >=0.3.0

tests:
  - python:
      imports:
        - tailwind
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/timonweb/django-tailwind
  license: MIT
  license_file: LICENSE
  summary: Tailwind CSS Framework for Django projects
  description: |
    Tailwind CSS Framework for Django projects

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
