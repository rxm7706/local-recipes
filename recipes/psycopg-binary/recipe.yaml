# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.4"

package:
  name: psycopg-binary
  version: ${{ version }}

source:
  url: https://github.com/psycopg/psycopg/archive/refs/tags/${{ version }}.tar.gz
  sha256: 714f0e916a0d239f42dc0554bab31cd2b79d9d11b7a96cd397116dba7c658abf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.3.1
    - wheel >=0.37
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - psycopg.psycopg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://psycopg.org/
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: PostgreSQL database adapter for Python -- C optimisation distribution
  description: |
    PostgreSQL database adapter for Python -- C optimisation distribution
  repository: https://github.com/psycopg/psycopg
  documentation: https://psycopg.org/psycopg3/docs/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
