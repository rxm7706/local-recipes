# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: ixnetwork-restpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ixnetwork-restpy/ixnetwork_restpy-${{ version }}.tar.gz
  sha256: 020f111ae594aff85b4394bf2291e15a2bd3ba177c2f979802e012f253a17ac2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - websocket-client
    - setuptools
    - packaging

tests:
  - python:
      imports:
        - uhd_restpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ixnetwork-restpy/
  license: MIT
  license_file: LICENSE
  summary: The IxNetwork Python Client
  description: |
    The IxNetwork Python Client
  repository: https://github.com/OpenIxia/ixnetwork_restpy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
