# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dask-glm
  version: "0.3.2"
  sha256: c947a566866698a01d79978ae73233cb5e838ad5ead6085143582c5e930b9a4a

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3
    - setuptools
    - setuptools_scm
    - pip
  run:
    - python >=3
    - dask
    - scikit-learn >=0.18
    - scipy >=0.18.1
    - sparse >=0.7.0
    - multipledispatch >=0.4.9
    - numpy

tests:
  - python:
      imports:
        - dask_glm
        - dask_glm.estimators
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Generalized Linear Models in Dask
  description: |
    Generalized Linear Models for parallel and
    distributed machine learning, built using dask.
  homepage: http://github.com/dask/dask-glm
  repository: https://github.com/dask/dask-glm
  documentation: http://dask-glm.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - TomAugspurger
    - cicdw
    - fjetter
