# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: nautobot-bgp-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nautobot-bgp-models/nautobot_bgp_models-${{ version }}.tar.gz
  sha256: 106ff509081b916b778b71cd96c1d79e2821d56643ededeb5f08f6fa1f57493b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - nautobot <4.0.0,>=3.0.0
    - netutils <2.0.0,>=1.6.0
    - toml <0.11.0,>=0.10.2

tests:
  - python:
      imports:
        - nautobot_bgp_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nautobot/nautobot-app-bgp-models
  license: Apache-2.0
  license_file: LICENSE
  summary: Nautobot BGP Models App
  description: |
    Nautobot BGP Models App
  repository: https://github.com/nautobot/nautobot-app-bgp-models
  documentation: https://docs.nautobot.com/projects/bgp-models/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

