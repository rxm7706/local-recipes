# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openlineage-dbt
  version: "1.50.0"
  python_min: '3.10'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenLineage/OpenLineage/archive/refs/tags/${{ version }}.tar.gz
  sha256: 393af02649095ff829dfc1f4193b61a6955cff1243facb8131429d6ec986096b

build:
  number: 0
  noarch: python
  script:
    - cd integration/dbt
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.4,<0.10.0
  run:
    - python >=${{ python_min }},<4.0
    - tqdm >=4.62.0
    - openlineage-integration-common ==1.50.0
    - dbt-core >=1.0.0

tests:
  - python:
      imports:
        - openlineage.dbt
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: OpenLineage integration with dbt
  homepage: https://github.com/OpenLineage/OpenLineage
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
