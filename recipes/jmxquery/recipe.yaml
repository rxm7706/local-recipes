# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: jmxquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jmxquery/jmxquery-${{ version }}.tar.gz
  sha256: f0bdb002591eec6eea0e16546baa35448f8b66acaf6dd72ed049c3a666afc06b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jmxquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dgildeh/jmxquery
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A JMX Interface for Python to Query runtime metrics in a JVM
  description: |
    A JMX Interface for Python to Query runtime metrics in a JVM

extra:
  recipe-maintainers:
    - rxm7706

