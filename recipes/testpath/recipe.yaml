# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: testpath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/testpath/testpath-${{ version }}.tar.gz
  sha256: 2f1b97e6442c02681ebe01bd84f531028a7caea1af3825000f52345c30285e0f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - testpath
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Testpath is a collection of utilities for Python code working with files and commands.
  description: |
    Testpath contains functions to check things on the filesystem,
    and tools for mocking system commands and recording calls to those.
  homepage: https://testpath.readthedocs.io
  repository: https://github.com/jupyter/testpath
  documentation: https://testpath.readthedocs.io

extra:
  recipe-maintainers:
    - minrk
    - takluyver
    - ocefpaf
