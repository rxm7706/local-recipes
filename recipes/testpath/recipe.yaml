# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: testpath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/testpath/testpath-${{ version }}.tar.gz
  sha256: 2f1b97e6442c02681ebe01bd84f531028a7caea1af3825000f52345c30285e0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2.0,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - testpath
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/testpath/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Test utilities for code working with files and commands
  description: |
    Test utilities for code working with files and commands
  repository: https://github.com/jupyter/testpath
  documentation: https://testpath.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - minrk
    - takluyver
    - ocefpaf

