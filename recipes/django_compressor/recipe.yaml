    - pkg:pypi/django-compressor@${{ version }}
  cfe-upstream-repo: https://github.com/django-compressor/django-compressor
  cfe-upstream-homepage: https://github.com/django-compressor/django-compressor
  cfe-import-names: [compressor]
  cfe-source-kind: pypi-sdist
