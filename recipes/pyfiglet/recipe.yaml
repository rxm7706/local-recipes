# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: pyfiglet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfiglet/pyfiglet-${{ version }}.tar.gz
  sha256: db9c9940ed1bf3048deff534ed52ff2dafbbc2cd7610b17bb5eca1df6d4278ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyfiglet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pwaller/pyfiglet
  license: MIT
  license_file: LICENSE
  summary: Pure-python FIGlet implementation
  description: |
    Pure-python FIGlet implementation

extra:
  recipe-maintainers:
    - thewchan
    - pmlandwehr

#### CFE metadata AND comments
