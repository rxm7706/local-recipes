# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.4.16"

package:
  name: automat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/Automat/automat-${{ version }}.tar.gz
  sha256: 0017591a5477066e90d26b0e696ddc143baafd87b588cfac8100bc6be9634de0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=35.0.2
    - wheel >=0.29.0
    - setuptools-scm
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - automat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Automat/
  license: MIT
  license_file: LICENSE
  summary: Self-service finite-state machines for the programmer on the go.
  description: |
    Self-service finite-state machines for the programmer on the go.
  repository: https://github.com/glyph/automat/
  documentation: https://automat.readthedocs.io/

extra:
  recipe-maintainers:
    - CJ-Wright
    - ocefpaf

#### CFE metadata AND comments
