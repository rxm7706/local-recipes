# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: anchor-exp
  version: "0.0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/anchor_exp-${{ version }}.tar.gz
  sha256: de233047012e75cc0d4302ae85596932e95a5792ef23dcc5aab33361ceadc65b

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - numpy
    - scipy
    - spacy
    - lime
    - scikit-learn >=0.22

tests:
  - python:
      imports:
        - anchor
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Anchor explanations for machine learning models
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: http://github.com/marcotcr/anchor

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: anchor-exp
  cfe-upstream-registry: pypi
  cfe-upstream-name: anchor-exp
  cfe-purls:
