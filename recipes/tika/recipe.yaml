# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tika
  version: "3.3.2"
  compress_type: tar.gz
  hash: 468a5302249162351f65cfe05632d3869c0350d726aef82a75e7b04fa5cac8ab

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ compress_type }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ compress_type }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  python:
    entry_points:
      - tika-python = tika.tika:main
  preserve_egg_dir: true

requirements:
  host:
    - pip
    - python
  run:
    - python
    - setuptools
    - requests

tests:
  - python:
      imports:
        - tika
        - tika.tests
      pip_check: false
  - script:
      - tika-python --help

about:
  license_file: LICENSE.txt
  license: Apache-2.0
  summary: Apache Tika Python library
  homepage: http://github.com/chrismattmann/tika-python
  repository: https://github.com/chrismattmann/tika-python
  documentation: https://github.com/chrismattmann/tika-python

extra:
  recipe-maintainers:
    - pmlandwehr
    - chrismattmann
