{% set version = "3.1.0" %}

package:
  name: prov
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/prov/prov-{{ version }}.tar.gz
  sha256: e3ecbf6345e46b1958b286bd1b090c5baffa942015ecf04b44a8cc63830f8a92

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - wheel

  run:
    # prov 3.0 has no unconditional runtime dependencies; the entries below
    # mirror its rdf/xml/dot/graph extras so that the conda package stays
    # full-featured (conda has no equivalent of extras).
    - python >={{ python_min }}
    - networkx >=2.0
    - pydot >=1.2.0
    - lxml >=3.3.5
    - rdflib >=7.0.0,<8

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - prov
    - prov.serializers
    - prov.model
  commands:
    - pip check
    - prov-convert --help
    - prov-compare --help

about:
  home: https://github.com/trungdong/prov
  license: MIT
  license_file: LICENSE
  summary: A library for W3C Provenance Data Model supporting PROV-JSON, PROV-XML and PROV-O (RDF)

extra:
  recipe-maintainers:
    - satra
    - trungdong
