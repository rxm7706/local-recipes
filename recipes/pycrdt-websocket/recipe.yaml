# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.4"
  python_check_max: "3.14"

package:
  name: pycrdt-websocket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycrdt-websocket/pycrdt_websocket-${{ version }}.tar.gz
  sha256: 6d90f36f4a1d51b3736caf8698fc3745ff44bb20cb820ff0033bfc76d4737da9

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - anyio >=3.6.2,<5
    - pycrdt >=0.14.0,<0.15.0
    - pycrdt-store >=0.1.5,<0.2.0

tests:
  - python:
      imports: pycrdt.websocket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - channels
        - httpx-ws >=0.5.2
        - hypercorn >=0.16.0
        - nodejs 24.*
        - pytest-timeout
        - python ${{ python_min }}.*
        - sniffio
        - trio >=0.25.0
    files:
      source:
        - tests/
    script:
      - cd tests && npm install --ignore-scripts && cd ..
      - pytest -vv --tb=long --color=yes --timeout=60

about:
  license: MIT
  license_file: LICENSE
  summary: WebSocket connector for pycrdt
  homepage: https://pypi.org/project/pycrdt-websocket
  repository: https://github.com/y-crdt/pycrdt-websocket
  documentation: https://y-crdt.github.io/pycrdt-websocket

extra:
  recipe-maintainers:
    - davidbrochart
