# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21"

package:
  name: python-graphviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphviz/graphviz-${{ version }}.tar.gz
  sha256: 20743e7183be82aaaa8ad6c93f8893c923bd6658a04c32ee115edb3c8a835f78

build:
  number: 0
  noarch: python
  script:
    - python -m pip install --no-deps --ignore-installed "${{ SRC_DIR }}"

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - graphviz >=2.46.1

tests:
  - python:
      imports:
        - graphviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  license: MIT
  license_file: LICENSE.txt
  summary: Simple Python interface for Graphviz
  description: |
    This package facilitates the creation and rendering of graph
    descriptions in the DOT language of the Graphviz graph
    drawing software from Python.


  homepage: https://github.com/xflr6/graphviz
  repository: https://github.com/xflr6/graphviz
  documentation: https://graphviz.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham
    - scopatz

#### CFE metadata AND comments
