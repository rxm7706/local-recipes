# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: python-cobol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-cobol/python_cobol-${{ version }}.tar.gz
  sha256: fd0fa4bb505d9a8928c2cacac36403c1daaaf3e306902fb10588ee1f2561a04a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_cobol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/royopa/python-cobol
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Python code to parse and denormalize COBOL Copybooks
  description: |
    Python code to parse and denormalize COBOL Copybooks

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
