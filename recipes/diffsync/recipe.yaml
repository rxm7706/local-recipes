# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.3"

package:
  name: diffsync
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffsync/diffsync-${{ version }}.tar.gz
  sha256: 4fe22ccfff783409eee2801513d51adabd2afcc5162e0f55f26d7ea9f8395115

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - packaging >=21.3
    - pydantic <3.0.0,>=2.0.0
    - structlog >=20.1.0
    - typing_extensions >=4.0.1

tests:
  - python:
      imports:
        - diffsync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://diffsync.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Library to easily sync/diff/update 2 different data sources
  description: |
    Library to easily sync/diff/update 2 different data sources
  repository: https://github.com/networktocode/diffsync
  documentation: https://diffsync.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: diffsync
