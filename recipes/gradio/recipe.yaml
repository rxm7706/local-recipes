# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.24.0"

package:
  name: gradio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gradio/gradio-${{ version }}.tar.gz
  sha256: 2072be0c0803da1859f918a45dc568fafc7b0eebd581943bee8acc78f752e166

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-requirements-txt
    - hatch-fancy-pypi-readme >=22.5.0
  run:
    - python >=${{ python_min }}
    - anyio <5.0,>=3.0
    - audioop-lts <=0.2.2
    - brotli >=1.1.0
    - fastapi <1.0,>=0.115.2
    - gradio-client ==2.6.0
    - groovy-python ~=0.1
    - hf-gradio <1.0,>=0.4.1
    - httpx <1.0,>=0.24.1
    - huggingface-hub <2.0,>=1.16.0
    - jinja2 <4.0
    - markupsafe <4.0,>=2.0
    - numpy <3.0,>=1.0
    - orjson ~=3.0
    - packaging
    - pandas <4.0,>=1.0
    - pillow <13.0,>=8.0
    - pydantic <=3.0,>=2.0
    - pydub <1.0
    - python-multipart <1.0,>=0.0.18
    - pytz >=2017.2
    - pyyaml <7.0,>=5.0
    - safehttpx <0.2.0,>=0.1.7
    - semantic_version ~=2.0
    - starlette <2.0,>=1.0.1
    - tomlkit <0.15.0,>=0.12.0
    - typer <1.0,>=0.12
    - typing_extensions ~=4.0
    - uvicorn >=0.14.0

tests:
  - python:
      imports:
        - gradio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gradio-app/gradio
  license: Apache-2.0
  license_file: LICENSE
  summary: Python library for easily interacting with trained machine learning models
  description: |
    Python library for easily interacting with trained machine learning models

extra:
  recipe-maintainers:
    - freddyaboulton
    - jeongseok-meta
    - abidlabs
    - Sclare87

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gradio
