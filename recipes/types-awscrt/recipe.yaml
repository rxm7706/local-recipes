# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: types-awscrt
  version: "0.36.2"
  lib_version: ${{ version.split(".post")[0] }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 9bd66995d210acb8e92a70e0d1078752b0833a36bca73f088742bc3fd8a6b363

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - pip

tests:
  - requirements:
      run:
        - pip
        - poetry
        - python ${{ python_min }}
    script:
      - pip check
      - python -c "import importlib; importlib.import_module('awscrt-stubs')"

about:
  summary: Type annotations for AWS awscrt ${{ lib_version }} library
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/youtype/types-awscrt
  repository: https://github.com/youtype/types-awscrt

extra:
  recipe-maintainers:
    - vemel
