# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: address-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/address-parser/address_parser-${{ version }}.tar.gz
  sha256: e56bfda9b04c5f834e76802b9d4ec8b0e7a5bedf9a227a07e319563169f9bd53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - address_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CivicKnowledge/address_parser
  license: MIT
  license_file: LICENSE
  summary: Address parser
  description: |
    Address parser

extra:
  recipe-maintainers:
    - rxm7706

