# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pinecone-plugin-inference
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pinecone_plugin_inference-${{ version }}.tar.gz
  sha256: eff826178e1fe448577be2ff3d8dbb072befbbdc2d888e214624523a1c37cd8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pinecone-plugin-interface >=0.0.7,<0.0.8
    - urllib3

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pip check

about:
  summary: Embeddings plugin for Pinecone SDK
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://www.pinecone.io

extra:
  recipe-maintainers:
    - isuruf
