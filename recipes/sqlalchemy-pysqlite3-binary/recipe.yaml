# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: sqlalchemy-pysqlite3-binary
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-pysqlite3-binary/sqlalchemy-pysqlite3-binary-${{ version }}.tar.gz
  sha256: f6d1b4932ba586f56989a81108b83a1fd1595fa7b1e3258c413acc21e39056da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pysqlite3-binary
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_pysqlite3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hoehrmann/sqlalchemy-pysqlite3
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy dialect to use pysqlite3 dbapi2
  description: |
    SQLAlchemy dialect to use pysqlite3 dbapi2

extra:
  recipe-maintainers:
    - rxm7706

