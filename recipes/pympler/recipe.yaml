# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: pympler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Pympler/pympler-${{ version }}.tar.gz
  sha256: 1eaa867cb8992c218430f1708fdaccda53df064144d1c5656b1e6f1ee6000424

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pympler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pympler/pympler
  license: Apache-2.0
  license_file: LICENSE
  summary: A development tool to measure, monitor and analyze the memory behavior of Python objects.
  description: |
    A development tool to measure, monitor and analyze the memory behavior of Python objects.

extra:
  recipe-maintainers:
    - CJ-Wright
    - thewchan
    - pb01ka

