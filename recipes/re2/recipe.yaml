# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# see https://github.com/google/re2/blob/2023-06-01/CMakeLists.txt#L32-L34
# changes more rarely than version
schema_version: 1

context:
  version: 2025-11-05
  dotversion: ${{ version | replace('-', '.') }}
  soversion: 11

recipe:
  name: re2-split
  version: ${{ dotversion }}

source:
  url: http://github.com/google/re2/archive/${{ version }}.tar.gz
  sha256: 87f6029d2f6de8aa023654240a03ada90e876ce9a4676e258dd01ea4c26ffd67

build:
  number: 2
  prefix_detection:
    ignore_binary_files: false

requirements:
  build:
    - cmake
    - ninja
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - libabseil
    # only for build testing; these don't have run-exports
    - if: build_platform == target_platform
      then: benchmark
    - if: build_platform == target_platform
      then: gtest

outputs:
  # re2 has a rarely-changing SOVERSION, and it's enough to depend on
  # (and run-export) the output that contains the library artefact
  - package:
      name: re2
    build:
      script:
        file: ${{ 'install.bat' if win else 'install.sh' if unix else '' }}
    requirements:
      build:
        - cmake
      host:
        - ${{ pin_subpackage("libre2-" ~ soversion, exact=True) }}
      run:
        - ${{ pin_subpackage("libre2-" ~ soversion, exact=True) }}
      run_exports:
        - ${{ pin_subpackage("libre2-" ~ soversion, upper_bound=None) }}
        - re2
    tests:
      - files:
          recipe:
            - cmake_test/
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
            - pkg-config
        script:
          - if: linux
            then: test -f ${PREFIX}/lib/libre2.so
          - if: osx
            then: test -f ${PREFIX}/lib/libre2.dylib
          - if: win
            then: if not exist %LIBRARY_LIB%\re2.lib exit 1
          - if: unix
            then: test ! -f ${PREFIX}/lib/libre2.a
          - if: win
            then: if exist %LIBRARY_LIB%\re2_static.lib exit 1
          - if: unix
            then: test -f ${PREFIX}/include/re2/re2.h
          - if: win
            then: if not exist %LIBRARY_INC%\re2\re2.h exit 1
          - pkg-config --print-errors --exact-version "${{ soversion }}.0.0" re2
          - cd cmake_test
          - cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 .
          - cmake --build .
          - if: unix
            then: ./re2_example
          - if: win
            then: re2_example.exe
  # the versioned library artefact
  - package:
      name: libre2-${{ soversion }}
    build:
      script:
        file: ${{ 'install.bat' if win else 'install.sh' if unix else '' }}
    requirements:
      build:
        # for strong run-exports
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - libabseil
      run_exports:
        - ${{ pin_subpackage("libre2-" ~ soversion, upper_bound=None) }}
      run_constraints:
        - re2 ${{ dotversion }}.*
    tests:
      - script:
          - if: linux
            then: test -f ${PREFIX}/lib/libre2.so.${{ soversion }}
          - if: osx
            then: test -f ${PREFIX}/lib/libre2.${{ soversion }}.dylib
          - if: win
            then: if not exist %LIBRARY_BIN%\re2.dll exit 1
          - if: linux
            then: test ! -f ${PREFIX}/lib/libre2.so
          - if: osx
            then: test ! -f ${PREFIX}/lib/libre2.dylib
          - if: win
            then: if exist %LIBRARY_LIB%\re2.lib exit 1

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: |
    RE2 is a fast, safe, thread-friendly alternative to backtracking regular expression
    engines like those used in PCRE, Perl, and Python. It is a C++ library.
  homepage: https://github.com/google/re2/
  repository: https://github.com/google/re2/

extra:
  recipe-maintainers:
    - h-vetinari
    - scopatz
    - isuruf
    - wesm
    - xhochy
    - kszucs
    - pitrou
  feedstock-name: re2
