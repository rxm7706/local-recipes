schema_version: 1

context:
  version: "26.5.0"

package:
  name: groupdocs-comparison-net
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/groupdocs-comparison-net/groupdocs_comparison_net-26.5.0-py3-none-macosx_10_14_x86_64.whl
  sha256: 35d83d03d4dc16da985f3c35c7229f091b37300784fbd30578b71e903b958e73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - groupdocs_comparison_net
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://products.groupdocs.com/comparison/python-net/
  license: LicenseRef-Proprietary
  license_file: LICENSE
  summary: GroupDocs.Comparison for Python via .NET - Compare documents and detect differences
  description: |
    GroupDocs.Comparison for Python via .NET - Compare documents and detect differences
  documentation: https://docs.groupdocs.com/comparison/python-net/

extra:
  recipe-maintainers:
    - rxm7706

