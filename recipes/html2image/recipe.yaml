# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.7"

package:
  name: html2image
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/html2image/html2image-${{ version }}.tar.gz
  sha256: 8644fd424cff2805977f4583f965b0235733f9eb08569e4c02f6befe6e7fafcc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - requests
    - websocket-client ~=1.0

tests:
  - python:
      imports:
        - html2image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vgalin/html2image
  license: MIT
  license_file: LICENSE
  summary: Package acting as a wrapper around the headless mode of existing web browsers to generate images from URLs and from HTML+CSS strings or files.
  description: |
    Package acting as a wrapper around the headless mode of existing web browsers to generate images from URLs and from HTML+CSS strings or files.
  repository: https://github.com/vgalin/html2image

extra:
  recipe-maintainers:
    - jan-janssen

