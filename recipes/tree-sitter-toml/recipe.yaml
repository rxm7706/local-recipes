# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: tree-sitter-toml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tree-sitter-toml/tree_sitter_toml-${{ version }}.tar.gz
  sha256: 29e257612fa8f0c1fcbc4e7e08ddc561169f1725265302e64d81086354144a70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bindings.python.tree_sitter_toml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tree-sitter-grammars/tree-sitter-toml
  license: MIT
  license_file: LICENSE
  summary: TOML grammar for tree-sitter
  description: |
    TOML grammar for tree-sitter

extra:
  recipe-maintainers:
    - rxm7706

