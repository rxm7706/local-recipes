# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.20"

package:
  name: langchainplus-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchainplus-sdk/langchainplus_sdk-${{ version }}.tar.gz
  sha256: 3d300e2e3290f68cc9d842c059f9458deba60e776c9e790309688cad1bfbb219

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pydantic
    - requests
    - tenacity

tests:
  - python:
      imports:
        - langchainplus_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchainplus-sdk/
  license: MIT
  license_file: LICENSE
  summary: Client library to connect to the LangSmith LLM Tracing and Evaluation Platform.
  description: |
    Client library to connect to the LangSmith LLM Tracing and Evaluation Platform.

extra:
  recipe-maintainers:
    - rxm7706

