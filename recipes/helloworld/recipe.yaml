# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1dev"

package:
  name: helloworld
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/helloworld/helloworld-0.1dev.zip
  sha256: 48def89eb52140a22adef44e0b2d32e8e20d81b8cbcae11ce41c52ac47d759c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - helloworld
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: UNKNOWN
  description: |
    UNKNOWN

extra:
  recipe-maintainers:
    - rxm7706

