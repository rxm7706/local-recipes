# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.118"
  version_us: ${{ version | replace(".", "_") }}

package:
  name: nss
  version: ${{ version }}

source:
  url: https://ftp.mozilla.org/pub/security/nss/releases/NSS_${{ version_us }}_RTM/src/nss-${{ version }}.tar.gz
  sha256: 06f2d34c7c421da430b9d78fc6590105500b9439efa19cdaa0a57ed7dc948aad
  patches:
    # Adds auto-generated nss.pc and nss-config script, and allows building without nspr in the source tree
    - nss-3.55-standalone-1.patch
    - if: osx and arm64
      then: remove_hw_accel_osxarm64.patch

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - autoconf
    - cmake
    - pkg-config
    - make
  host:
    - nspr
    - libsqlite
    - zlib
  run_exports:
    - ${{ pin_subpackage('nss', upper_bound='x') }}

tests:
  - script:
      - if: unix
        then: test -f ${PREFIX}/lib/libnspr4${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libplds4${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libplc4${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libsoftokn3${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libsoftokn3.chk
      - if: unix
        then: test -f ${PREFIX}/lib/libnss3${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libsmime3${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libssl3${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libnssckbi${SHLIB_EXT}

about:
  license: MPL-2.0
  license_file: nss/COPYING
  summary: A set of libraries designed to support cross-platform development of security-enabled client and server applications.
  description: |
    Network Security Services (NSS) is a set of libraries designed to support
    cross-platform development of security-enabled client and server
    applications. Applications built with NSS can support SSL v3, TLS,
    PKCS #5, PKCS #7, PKCS #11, PKCS #12, S/MIME, X.509 v3 certificates,
    and other security standards.
  homepage: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS
  repository: https://hg.mozilla.org/projects/nss
  documentation: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS

extra:
  recipe-maintainers:
    - hmaarrfk
    - marcelotrevisani
    - jakirkham
