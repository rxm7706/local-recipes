# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11"

package:
  name: django-sqlserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-sqlserver/django-sqlserver-${{ version }}.tar.gz
  sha256: 1b2891a44433ca973f4ff3f7274ae5cbe02664d5d754f537460156edfef7b88e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlserver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/denisenkom/django-sqlserver
  license: MIT
  license_file: LICENSE
  summary: Django backend database support for MS SQL Server and pytds.
  description: |
    Django backend database support for MS SQL Server and pytds.

extra:
  recipe-maintainers:
    - rxm7706

