# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: flake8-docstrings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flake8-docstrings/flake8_docstrings-${{ version }}.tar.gz
  sha256: 4c8cc748dc16e6869728699e5d0d685da9a10b0ea718e090b1ba088e67a941af

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flake8
    - pydocstyle

tests:
  - python:
      imports:
        - flake8_docstrings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pycqa/flake8-docstrings
  license: MIT
  license_file: LICENSE
  summary: Extension for flake8 which uses pydocstyle to check docstrings
  description: |
    Extension for flake8 which uses pydocstyle to check docstrings

extra:
  recipe-maintainers:
    - dopplershift

