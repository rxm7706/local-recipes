# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: html2docx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/html2docx/html2docx-${{ version }}.tar.gz
  sha256: 13ef5653d7a3ffe625251705f15ae203938ce2f98be93e62f6fdf80630c33d2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-docx
    - tinycss2

tests:
  - python:
      imports:
        - html2docx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/erezlife/html2docx
  license: MIT
  license_file: LICENSE
  summary: Convert valid HTML input to docx.
  description: |
    Convert valid HTML input to docx.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: html2docx
  cfe-upstream-registry: pypi
  cfe-upstream-name: html2docx
  cfe-purls:
    - pkg:conda/html2docx@${{ version }}?channel=conda-forge
    - pkg:pypi/html2docx@${{ version }}
  cfe-upstream-repo: https://github.com/erezlife/html2docx
  cfe-upstream-homepage: https://github.com/erezlife/html2docx
