# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: autosemver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autosemver/autosemver-${{ version }}.tar.gz
  sha256: 6dec39e5099382998b8c6864961f8314374368535e799bdd311d93721cde0810

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - dulwich
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - autosemver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/david-caro/python-autosemver
  license: GPLv3
  license_file: LICENSE
  summary: Tools to handle automatic semantic versioning in python
  description: |
    Tools to handle automatic semantic versioning in python

extra:
  recipe-maintainers:
    - rxm7706

