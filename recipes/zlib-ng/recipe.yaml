# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Obtain from ZLIB_VERSION in zlib.h.in; https://github.com/zlib-ng/zlib-ng/blob/VERSION/zlib.h.in#L61
# Please do not reset the build number unless zlib_api changed. It needs to be
# incremental across both outputs using version and these using zlib_api.
schema_version: 1

context:
  version: "2.3.3"
  zlib_api: "1.3.1"
  number: 1

recipe:
  name: zlib-ng
  version: ${{ version }}

source:
  url: https://github.com/zlib-ng/zlib-ng/archive/refs/tags/${{ version }}.tar.gz
  sha256: f9c65aa9c852eb8255b636fd9f07ce1c406f061ec19a2e7d508b318ca0c907d1

build:
  number: ${{ number }}
  script: {}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then: make
  host:
    - if: compat == "yes"
      then: gtest
  run_exports:
    - if: compat == "no"
      then: ${{ pin_subpackage('zlib-ng', upper_bound='x.x') }}

outputs:
  # zlib-ng gets built when compat is NOT enabled; versioned with the regular zlib-ng release
  - package:
      name: zlib-ng
    build:
      skip: compat == "yes"
  # zlib and libzlib get built when compat is enabled; they are versioned after the zlib API
  - package:
      name: libzlib
      version: ${{ zlib_api }}
    files:
      include:
        - if: linux
          then: lib/libz.so.*
        - if: osx
          then: lib/libz.*.dylib
        - if: win
          then: Library/bin/zlib.dll
        - if: win
          then: zlib.dll
    build:
      string: h${{ PKG_HASH }}_ng_${{ version | replace(".", "") }}_${{ number }}
      skip: compat == "no"
      track_features:
        - zlib-ng-compat
    requirements:
      run:
        - ${{ pin_subpackage('zlib-ng-compat', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
    tests:
      - script:
          - if: unix
            then: test ! -e $PREFIX/include/zlib.h
          - if: unix
            then: test ! -e $PREFIX/lib/libz.a
          - if: unix
            then: test ! -e $PREFIX/lib/libz${SHLIB_EXT}
          - if: win
            then: if not exist %LIBRARY_BIN%\zlib.dll exit 1
          - if: win
            then: if not exist %PREFIX%\zlib.dll exit 1
  - package:
      name: zlib
      version: ${{ zlib_api }}
    files:
      include:
        - "**/*"
      exclude:
        - if: linux
          then: lib/libz.so.*
        - if: osx
          then: lib/libz.*.dylib
        - if: win
          then: Library/bin/zlib.dll
        - if: win
          then: Library/bin/zlib1.dll
        - if: win
          then: zlib.dll
    build:
      number: ${{ number }}
      string: h${{ PKG_HASH }}_ng_${{ version | replace(".", "") }}_${{ number }}
      skip: compat == "no"
      track_features:
        - zlib-ng-compat
    requirements:
      run:
        - ${{ pin_subpackage("libzlib", exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
    tests:
      - script:
          - if: unix
            then: test -e $PREFIX/include/zlib.h
          - if: unix
            then: test -e $PREFIX/include/zconf.h
          - if: unix
            then: test -e $PREFIX/lib/libz.a
          - if: unix
            then: test -e $PREFIX/lib/libz${SHLIB_EXT}
          - if: unix
            then: test -e $PREFIX/lib/pkgconfig/zlib.pc
          - if: unix
            then: grep "ZLIB_VERSION.*${{ zlib_api }}\.zlib-ng" $PREFIX/include/zlib.h
          - if: win
            then: if not exist %LIBRARY_INC%\zlib.h exit 1
          - if: win
            then: if not exist %LIBRARY_INC%\zconf.h exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\zlib.lib exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\zlibstatic.lib exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\pkgconfig\zlib.pc exit 1
  - package:
      name: zlib-ng-compat
    build:
      number: ${{ number }}
      skip: compat == "no"
  # *-wapi targets are built on Windows with compat enabled
  - package:
      name: libzlib-wapi
      version: ${{ zlib_api }}
    files:
      include:
        - Library/bin/zlibwapi.dll
    build:
      string: h${{ PKG_HASH }}_ng_${{ version | replace(".", "") }}_${{ number }}
      skip: compat == "no" or not win
      track_features:
        - zlib-ng-compat
    requirements:
      run:
        - ${{ pin_subpackage('zlib-ng-compat', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
    tests:
      - script:
          - if not exist %LIBRARY_BIN%\zlibwapi.dll exit 1
  - package:
      name: zlib-wapi
      version: ${{ zlib_api }}
    files:
      include:
        - Library/lib/zlibwapi.lib
        - Library/include/zlib.h
    build:
      number: ${{ number }}
      string: h${{ PKG_HASH }}_ng_${{ version | replace(".", "") }}_${{ number }}
      skip: compat == "no" or not win
      track_features:
        - zlib-ng-compat
    requirements:
      run:
        - ${{ pin_subpackage("libzlib-wapi", exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
    tests:
      - script:
          - if not exist %LIBRARY_INC%\zlib.h exit 1
          - if not exist %LIBRARY_LIB%\zlibwapi.lib exit 1

tests:
  - script:
      - if: unix and compat == "no"
        then: test -e $PREFIX/include/zlib-ng.h
      - if: unix and compat == "no"
        then: test -e $PREFIX/include/zconf-ng.h
      - if: unix and compat == "no"
        then: test -e $PREFIX/lib/libz-ng${SHLIB_EXT}
      - if: unix and compat == "no"
        then: test -e $PREFIX/lib/pkgconfig/zlib-ng.pc
      - if: win and compat == "no"
        then: if not exist %LIBRARY_INC%\zlib-ng.h exit 1
      - if: win and compat == "no"
        then: if not exist %LIBRARY_INC%\zconf-ng.h exit 1
      - if: win and compat == "no"
        then: if not exist %LIBRARY_BIN%\zlib-ng2.dll exit 1
      - if: win and compat == "no"
        then: if not exist %LIBRARY_LIB%\zlib-ng.lib exit 1.
      - if: win and compat == "no"
        then: if not exist %LIBRARY_LIB%\pkgconfig\zlib-ng.pc exit 1

about:
  license: Zlib
  license_file: LICENSE.md
  summary: zlib data compression library for the next generation systems
  homepage: https://github.com/zlib-ng/zlib-ng
  repository: https://github.com/zlib-ng/zlib-ng

extra:
  feedstock-name: zlib-ng
  recipe-maintainers:
    - hmaarrfk
    - mgorny
    - isuruf
