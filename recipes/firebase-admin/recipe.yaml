# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.5.0"

package:
  name: firebase-admin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/firebase-admin/firebase_admin-${{ version }}.tar.gz
  sha256: 6e2810cec954c6e69f21fd6dac9db152a0ba3fe11b7f8793830ad1e3a0032e20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cachecontrol >=0.14.3
    - google-api-core >=2.25.1,<3.0.0a0
    - grpcio >=1.59.0,<2.0.0
    - grpcio-status >=1.59.0,<2.0.0
    - google-cloud-firestore >=2.21.0
    - google-cloud-storage >=3.1.1
    - pyjwt >=2.10.1
    - cryptography >=3.4.0
    - httpx ==0.28.1
    - h2 >=3,<5

tests:
  - python:
      imports:
        - firebase_admin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://firebase.google.com/docs/admin/setup/
  license: Apache-2.0
  license_file: LICENSE
  summary: Firebase Admin Python SDK
  description: |
    Firebase Admin Python SDK
  repository: https://github.com/firebase/firebase-admin-python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: firebase-admin
  cfe-upstream-registry: pypi
  cfe-upstream-name: firebase-admin
  cfe-purls:
    - pkg:conda/firebase-admin@${{ version }}?channel=conda-forge
    - pkg:pypi/firebase-admin@${{ version }}
  cfe-upstream-repo: https://github.com/firebase/firebase-admin-python
  cfe-upstream-homepage: https://firebase.google.com/docs/admin/setup/
  cfe-import-names: [firebase_admin]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T16:08:45Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T16:08:45Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-16T16:10:00Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
