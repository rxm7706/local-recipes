# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.91.0"

package:
  name: kernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kernel/kernel-${{ version }}.tar.gz
  sha256: 61a1692121851ad7754a5f5bb24afcb6d1a904290cc1a49aaef037ecb22d1e20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - anyio <5,>=3.5.0
    - distro <2,>=1.7.0
    - httpx <1,>=0.23.0
    - pydantic <3,>=1.9.0
    - sniffio
    - typing_extensions <5,>=4.14

tests:
  - python:
      imports:
        - kernel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kernel/kernel-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: The official Python library for the kernel API
  description: |
    The official Python library for the kernel API
  repository: https://github.com/kernel/kernel-python-sdk

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: kernel
  cfe-upstream-registry: pypi
  cfe-upstream-name: kernel
  cfe-purls:
    - pkg:conda/kernel@${{ version }}?channel=conda-forge
    - pkg:pypi/kernel@${{ version }}
  cfe-upstream-repo: https://github.com/kernel/kernel-python-sdk
  cfe-upstream-homepage: https://github.com/kernel/kernel-python-sdk
  cfe-import-names: [kernel]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:41:28Z
