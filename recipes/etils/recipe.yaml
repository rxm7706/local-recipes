# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.0"

package:
  name: etils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/etils/etils-${{ version }}.tar.gz
  sha256: 8136e7f4c4173cd0af0ca5481c4475152f0b8686192951eefa60ee8711e1ede4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - etils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/etils
  license: Apache-2.0
  license_file: LICENSE
  summary: Collection of common python utils
  description: |
    Collection of common python utils
  documentation: https://etils.readthedocs.io

extra:
  recipe-maintainers:
    - ngam
    - traversaro

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: etils
