# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: asyncio-contextmanager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncio-contextmanager/asyncio-contextmanager-${{ version }}.tar.gz
  sha256: 93b4620cd79623c3988c9f43e6f502263968645cd13aed3327a7ec8be43221d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncio_contextmanager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sashgorokhov/asyncio-contextmanager
  license: MIT
  license_file: LICENSE
  summary: Decorator that turns async generator functions into async context managers.
  description: |
    Decorator that turns async generator functions into async context managers.

extra:
  recipe-maintainers:
    - rxm7706

