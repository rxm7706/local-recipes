# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: click-repl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/click-repl/click-repl-${{ version }}.tar.gz
  sha256: 17849c23dba3d667247dc4defe1757fff98694e90fe37474f3feebb69ced26a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - click
    - prompt-toolkit

tests:
  - python:
      imports:
        - click_repl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/untitaker/click-repl
  license: MIT
  license_file: LICENSE
  summary: REPL plugin for Click
  description: |
    REPL plugin for Click

extra:
  recipe-maintainers:
    - rxm7706
    - izahn

