# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.traversing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.traversing/zope_traversing-${{ version }}.tar.gz
  sha256: bd27945c4434f225ad451d8664d7b023306e40b6563060fce821e89f12b82412

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - transaction
    - zope.component
    - zope.i18n
    - zope.i18nmessageid
    - zope.interface >=4.0.4
    - zope.location >=3.7.0
    - zope.proxy
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zope.traversing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.traversing
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Resolving paths in the object hierarchy
  description: |
    Resolving paths in the object hierarchy

extra:
  recipe-maintainers:
    - rxm7706

