# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: faicons
  version: "0.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/faicons-${{ version }}.tar.gz
  sha256: 6b7d7b19180179b6b83783f91bf6c9311c0f00ae0f97d41be1d24d9942361659

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - htmltools >=0.1.4.9002

tests:
  - python:
      imports:
        - faicons
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An interface to Font-Awesome for use in Shiny.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rstudio/py-faicons

extra:
  recipe-maintainers:
    - daylinmorgan
