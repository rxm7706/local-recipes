# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2021.6.25"

package:
  name: netapp-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netapp-lib/netapp-lib-${{ version }}.tar.gz
  sha256: d60e050923324bc4fa17f4fc04ea9a9388759c98acf20f6368e96e0381533690

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - xmltodict
    - lxml
    - six

tests:
  - python:
      imports:
        - netapp_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://netapp.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: netapp-lib is required for Ansible deployments to interact with NetApp storage systems.
  description: |
    netapp-lib is required for Ansible deployments to interact with NetApp storage systems.

extra:
  recipe-maintainers:
    - rxm7706

