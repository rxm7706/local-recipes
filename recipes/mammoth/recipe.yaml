# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1"

package:
  name: mammoth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mammoth/mammoth-${{ version }}.tar.gz
  sha256: 40521e02568583b671d9976b0fbeed50be734b40f73ca8e1939ab7146bf69bbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cobble <0.2,>=0.1.3

tests:
  - python:
      imports:
        - mammoth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwilliamson/python-mammoth
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Convert Word documents from docx to simple and clean HTML and Markdown
  description: |
    Convert Word documents from docx to simple and clean HTML and Markdown

extra:
  recipe-maintainers:
    - sarthakpati
    - johnhany97

#### CFE metadata AND comments
