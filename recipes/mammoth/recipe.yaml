# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mammoth
  version: "1.12.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mammoth-${{ version }}.tar.gz
  sha256: 40521e02568583b671d9976b0fbeed50be734b40f73ca8e1939ab7146bf69bbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mammoth=mammoth.cli:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - cobble >=0.1.3,<0.2

tests:
  - python:
      imports:
        - mammoth
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - mammoth --help

about:
  summary: Convert Word documents from docx to simple and clean HTML and Markdown
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://github.com/mwilliamson/python-mammoth

extra:
  recipe-maintainers:
    - sarthakpati
    - johnhany97
