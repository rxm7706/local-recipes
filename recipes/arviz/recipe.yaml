# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"
  python_min: "3.12"

package:
  name: arviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arviz/arviz-${{ version }}.tar.gz
  sha256: 9e332c0a0da370cb1c00823678065e9b0462fbdf1efa0f38c37485cc78c8a576

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4,<4
  run:
    - python >=${{ python_min }}
    - arviz-base <1.4.0,>=1.3.0
    - arviz-stats <1.4.0,>=1.3.0
    - arviz-plots <1.4.0,>=1.3.0

tests:
  - python:
      imports:
        - arviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arviz/
  license: Apache-2.0
  license_file: LICENSE
  summary: Expose features from _ArviZverse_ refactored packages together in the ``arviz`` namespace.
  description: |
    Expose features from _ArviZverse_ refactored packages together in the ``arviz`` namespace.
  repository: https://github.com/arviz-devs/arviz
  documentation: https://python.arviz.org

extra:
  recipe-maintainers:
    - maresb
    - ericmjl
    - canyon289
    - aloctavodia
    - ColCarroll
    - ahartikainen
    - OriolAbril

