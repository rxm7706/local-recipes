# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-mcp-adapters
  version: 0.3.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_mcp_adapters-${{ version }}.tar.gz
  sha256: e08d4a74a0934d558ddb807ecbb8f89466c93a0d06c1fb58974b93b4703de01c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.3.3,<2.0.0
    - mcp >=1.24.0
    - typing_extensions >=4.14.0
    - pydantic
tests:
  - python:
      imports:
        - langchain_mcp_adapters
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Make Anthropic Model Context Protocol (MCP) tools compatible with LangChain and LangGraph agents.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/langchain-mcp-adapters/
  repository: https://github.com/langchain-ai/langchain-mcp-adapters

extra:
  recipe-maintainers:
    - rxm7706

