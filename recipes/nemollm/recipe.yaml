# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.5"

package:
  name: nemollm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nemollm/nemollm-0.3.5-py3-none-any.whl
  sha256: de3962d82d557ce5f3d773144361b897a181028b8e1bbdf94804eff865eead88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3
    - requests-futures
    - requests-toolbelt
    - tqdm
    - typing_extensions

tests:
  - python:
      imports:
        - nemollm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nemollm
  license: MIT
  license_file: LICENSE
  summary: Python client library for the NeMo LLM API
  description: |
    Python client library for the NeMo LLM API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
