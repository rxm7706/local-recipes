# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.18"

package:
  name: sempy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sempy/sempy-${{ version }}.tar.gz
  sha256: d313d3ff732764cf0eb4f071bb365d38acb47a2ed04d17059453402300b14338

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sempy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.sempy.org
  license: MIT
  license_file: LICENSE
  summary: A Python implementation of the spectral element method
  description: |
    A Python implementation of the spectral element method

extra:
  recipe-maintainers:
    - rxm7706

