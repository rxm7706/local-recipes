# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-instrumentation-jinja2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-jinja2/opentelemetry_instrumentation_jinja2-${{ version }}.tar.gz
  sha256: 6aad5e4189423ed5d6ede83123b0aa8ff21434c0efd734b34736bd11cefc7432

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - jinja2
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - wrapt <3.0.0,>=1.0.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.jinja2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-jinja2
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry jinja2 instrumentation
  description: |
    OpenTelemetry jinja2 instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - mariusvniekerk

#### CFE metadata AND comments
