    - pkg:pypi/ecs-logging@${{ version }}
  cfe-upstream-repo: https://github.com/elastic/ecs-logging-python
  cfe-upstream-homepage: https://github.com/elastic/ecs-logging-python
  cfe-import-names: [ecs_logging]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ecs-logging-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.3.0

  cfe-forge-blocker-list:
