# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: ecs-logging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/ecs-logging/ecs_logging-${{ version }}.tar.gz
  sha256: be7f618e71e10c33a61165aea58813ebd702f6c0044538155871cb9a1609ab4e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ecs_logging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/elastic/ecs-logging-python
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Logging formatters for ECS (Elastic Common Schema) in Python
  description: |
    Logging formatters for ECS (Elastic Common Schema) in Python
  repository: https://github.com/elastic/ecs-logging-python
  documentation: https://github.com/elastic/ecs-logging-python

extra:
  recipe-maintainers:
    - deantvv

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ecs-logging
  cfe-upstream-registry: pypi
  cfe-upstream-name: ecs-logging
