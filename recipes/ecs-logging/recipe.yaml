# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ecs-logging
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/ecs-logging-${{ version }}.tar.gz
  sha256: d4b791f044e8b96a4707edd4156a35fbe0e593c27ba5f05bae6b007cfab7622c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
    - flit >=2,<3
  run:
    - python >=3.3

tests:
  - python:
      imports:
        - ecs_logging
      pip_check: true

about:
  summary: Logging formatters for ECS (Elastic Common Schema) in Python
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/elastic/ecs-logging-python
  repository: https://github.com/elastic/ecs-logging-python

extra:
  recipe-maintainers:
    - deantvv
