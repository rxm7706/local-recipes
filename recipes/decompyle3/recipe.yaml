# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.9.3"

package:
  name: decompyle3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/decompyle3/decompyle3-${{ version }}.tar.gz
  sha256: 66cedaea6b998b3711cdc9993254e91e692bc45d18da7e309acade4f3b15173f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - spark-parser <1.9.2,>=1.8.9
    - xdis <6.3,>=6.1.1

tests:
  - python:
      imports:
        - decompyle3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rocky/python-decompile3/
  license: GPL3
  license_file: LICENSE
  summary: Python cross-version byte-code decompiler
  description: |
    Python cross-version byte-code decompiler

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: decompyle3
  cfe-upstream-registry: pypi
  cfe-upstream-name: decompyle3
  cfe-purls:
    - pkg:conda/decompyle3@${{ version }}?channel=conda-forge
    - pkg:pypi/decompyle3@${{ version }}
  cfe-upstream-repo: https://github.com/rocky/python-decompile3/
  cfe-upstream-homepage: https://github.com/rocky/python-decompile3/
  cfe-import-names: [decompyle3]
