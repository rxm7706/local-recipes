# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pandas-accumulate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-accumulate/pandas_accumulate-${{ version }}.tar.gz
  sha256: 985ca6c1cf25dc8bd6ebdc745e706f03cb8cdeba4539edd871f09dc5387b1a22

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas

tests:
  - python:
      imports:
        - pandas_accumulate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pandas-accumulate/
  license: MIT
  license_file: LICENSE
  summary: Accumulate Pandas series
  description: |
    Accumulate Pandas series

extra:
  recipe-maintainers:
    - rxm7706

