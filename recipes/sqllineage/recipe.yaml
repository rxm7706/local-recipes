# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.8"

package:
  name: sqllineage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqllineage/sqllineage-${{ version }}.tar.gz
  sha256: d5c7496b09f9ceec1b24aa4bdc3a19d8f6f2d7133848fa8a742148e756cf4715

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - networkx >=2.4
    - rustworkx >=0.16.0
    - sqlalchemy >=1.4.0
    - sqlfluff >=3.2.0
    - sqlparse >=0.5.4

tests:
  - python:
      imports:
        - sqllineage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://reata.github.io/sqllineage/
  license: MIT
  license_file: LICENSE
  summary: SQL Lineage Analysis Tool powered by Python
  description: |
    SQL Lineage Analysis Tool powered by Python
  repository: https://github.com/reata/sqllineage.git
  documentation: https://sqllineage.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan

