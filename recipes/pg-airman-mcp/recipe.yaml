# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"
  python_min: "3.12"

package:
  name: pg-airman-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pg-airman-mcp/pg_airman_mcp-${{ version }}.tar.gz
  sha256: 9cb873157efc4a8d04f71cbcd8af20f47a87fe42552ff6674f2f77a2ac5f8ec3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - attrs >=25.3.0
    - humanize >=4.8.0
    - instructor >=1.7.9
    - mcp >=1.9.2
    - pglast ==7.2.0
    - psycopg-pool >=3.2.6
    - psycopg >=3.2.8
    - pyjwt >=2.12.1
    - pytest-cov >=7.0.0

tests:
  - python:
      imports:
        - pg_airman_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pg-airman-mcp/
  license: MIT
  license_file: LICENSE
  summary: PostgreSQL Tuning and Analysis Tool
  description: |
    PostgreSQL Tuning and Analysis Tool

extra:
  recipe-maintainers:
    - rxm7706

