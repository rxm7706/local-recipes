# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: mermaid-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mermaid-python/mermaid-python-${{ version }}.tar.gz
  sha256: 0d9e4d90d7487453760bdb09b7722a6c5a333c6b76479171df3abc6311d53830

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython

tests:
  - python:
      imports:
        - mermaid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mermaid-python/
  license: MIT
  license_file: LICENSE
  summary: A package for generating diagrams using Mermaid JS
  description: |
    A package for generating diagrams using Mermaid JS

extra:
  recipe-maintainers:
    - rxm7706

