# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: java-utilities
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/java-utilities/java-utilities-${{ version }}.tar.gz
  sha256: 4d90e27f284f0ca1a9da9eb9a504e67c94af46e6d27a6cae0e933732ad9a4b5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - main

tests:
  - python:
      imports:
        - main.python.java_utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/devinrsmith/java-utilities
  license: Apache-2.0
  license_file: LICENSE
  summary: Java utilities
  description: |
    Java utilities
  repository: https://github.com/devinrsmith/java-utilities

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
