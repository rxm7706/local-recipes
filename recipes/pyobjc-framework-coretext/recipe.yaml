# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyobjc-framework-CoreText
  version: "12.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name.replace('-', '_').lower() }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: af740e784d7c592c34025ec7165f4f6c1a69b5a2d9075f06e41e4f77c212aed2

build:
  number: 1
  skip: (not osx) or match(python, ">=2,<3") or python_impl == 'pypy'
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - wheel
    - pip
  #- libffi
  run:
    - python
    - pyobjc-core >=${{ version }}
    - pyobjc-framework-cocoa >=${{ version }}
    - pyobjc-framework-quartz >=${{ version }}

tests:
  - python:
      imports:
        - PyObjCTools
        - CoreText
      pip_check: true

about:
  summary: Wrappers for the framework CoreText on macOS
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pythonhosted.org/pyobjc-framework-CoreText/

extra:
  recipe-maintainers:
    - Tobias-Fischer
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyobjc-framework-coretext
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyobjc-framework-coretext
  cfe-purls:
    - pkg:conda/pyobjc-framework-coretext@${{ version }}?channel=conda-forge
    - pkg:pypi/pyobjc-framework-coretext@${{ version }}
  cfe-upstream-repo: https://github.com/ronaldoussoren/pyobjc
  cfe-upstream-homepage: https://github.com/ronaldoussoren/pyobjc
