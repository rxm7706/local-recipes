# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: beads-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/beads-mcp/beads_mcp-${{ version }}.tar.gz
  sha256: e37eb0bb832590c946be4fe697e023e85f5c3741eadc23d3d1d6ccc9eebaa514

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastmcp ==3.3.1
    - pydantic-settings ==2.14.0
    - pydantic ==2.13.3

tests:
  - python:
      imports:
        - beads_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gastownhall/beads
  license: MIT
  license_file: LICENSE
  summary: MCP server for beads issue tracker.
  description: |
    MCP server for beads issue tracker.
  repository: https://github.com/gastownhall/beads
  documentation: https://github.com/gastownhall/beads/blob/main/integrations/beads-mcp/README.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
