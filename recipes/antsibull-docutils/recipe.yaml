# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: antsibull-docutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-docutils/antsibull_docutils-${{ version }}.tar.gz
  sha256: be0d66ca40b8a8828f4ea45a142fc0e7e5af9e6a0c54082056e4999da402bb0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - docutils

tests:
  - python:
      imports:
        - antsibull_docutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-docutils/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Antsibull docutils helpers
  description: |
    Antsibull docutils helpers

extra:
  recipe-maintainers:
    - rxm7706

