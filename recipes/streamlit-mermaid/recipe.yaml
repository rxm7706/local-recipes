# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: streamlit-mermaid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-mermaid/streamlit_mermaid-${{ version }}.tar.gz
  sha256: f4247fc4c063b7c406f3546c843572b0d7a89ddabfd04dface4a8abb70ba9b19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - streamlit <2.0.0,>=1.0.0
    - altair <5
    - setuptools <76.0.0,>=75.6.0

tests:
  - python:
      imports:
        - streamlit_mermaid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-mermaid/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

