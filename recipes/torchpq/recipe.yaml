# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0.6"

package:
  name: torchpq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torchpq/torchpq-${{ version }}.tar.gz
  sha256: 2ae57f2534d4203e7d08611673386b57906d73410489a6e8ef51d1e12217178f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch

tests:
  - python:
      imports:
        - torchpq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DeMoriarty/TorchPQ
  license: MIT
  license_file: LICENSE
  summary: Efficient implementations of Product Quantization and its variants
  description: |
    Efficient implementations of Product Quantization and its variants

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
