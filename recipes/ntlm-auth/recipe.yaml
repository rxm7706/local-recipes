# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ntlm-auth
  version: "1.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c9667d361dc09f6b3750283d503c689070ff7d89f2f6ff0d38088d5436ff8543

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ntlm_auth
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Calculates NTLM Authentication codes
  description: |
    This library handles the low-level details of NTLM authentication for use in authenticating
    with a service that uses NTLM. It will create and parse the 3 different message types in
    the order required and produce a base64 encoded value that can be attached to the HTTP header.
  homepage: https://github.com/jborean93/ntlm-auth
  repository: https://github.com/jborean93/ntlm-auth

extra:
  recipe-maintainers:
    - synapticarbors
