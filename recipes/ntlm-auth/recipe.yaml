# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: ntlm-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/ntlm-auth/ntlm-auth-${{ version }}.tar.gz
  sha256: c9667d361dc09f6b3750283d503c689070ff7d89f2f6ff0d38088d5436ff8543

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ordereddict

tests:
  - python:
      imports:
        - ntlm_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jborean93/ntlm-auth
  license: MIT
  license_file: LICENSE
  summary: Creates NTLM authentication structures
  description: |
    Creates NTLM authentication structures

extra:
  recipe-maintainers:
    - synapticarbors

