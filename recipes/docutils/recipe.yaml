    - pkg:pypi/docutils@${{ version }}
  cfe-upstream-repo: https://sourceforge.net/p/docutils/code/
  cfe-upstream-homepage: https://docutils.sourceforge.io
  cfe-import-names: [docutils]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
