# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: clickhouse-connect
  version: "1.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: b981e9596b59492602a949e5729fe91d01cda8aca08f561e4be43626a2e4e636

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - cython
    - pip
  run:
    - python
    - certifi
    - urllib3 >=1.26
    - if: win
      then: python-tzdata
    - zstandard
    - lz4

tests:
  - python:
      imports:
        - clickhouse_connect
      pip_check: true

about:
  summary: ClickHouse core driver, SqlAlchemy, and Superset libraries
  license: Apache-2.0
  license_file: LICENSE
  description: |
    A suite of Python packages for connecting Python to ClickHouse:

    - Pandas DataFrames
    - Numpy Arrays
    - PyArrow Tables
    - SQLAlchemy 1.3 and 1.4 (limited feature set)
    - Apache Superset 1.4+

    PyPI: [https://pypi.org/project/clickhouse-connect/](https://pypi.org/project/clickhouse-connect/)

    ---

    :fire: The conda-forge recipe was generated with [Conda-Forger App](https://sugatoray-conda-forger.streamlit.app/).

    :point_right: [![Streamlit App](https://static.streamlit.io/badges/streamlit_badge_black_white.svg)](https://sugatoray-conda-forger.streamlit.app/)

    [_streamlit-conda-forger-app]: https://sugatoray-conda-forger.streamlit.app/

  homepage: https://github.com/ClickHouse/clickhouse-connect
  repository: https://github.com/ClickHouse/clickhouse-connect
  documentation: https://clickhouse.com/docs/en/integrations/language-clients/python/intro

extra:
  recipe-maintainers:
    - sugatoray
    - gforsyth
    - genzgd
    - joe-clickhouse
