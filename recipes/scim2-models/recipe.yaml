# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.12"

package:
  name: scim2-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scim2-models/scim2_models-${{ version }}.tar.gz
  sha256: 3a57c5ec10dc1007e5f4391d3bddeaca974be8d55e9ede4a1de20019ad3a920b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.9,<0.9.0
  run:
    - python >=${{ python_min }}
    - email-validator
    - pydantic >=2.12.0

tests:
  - python:
      imports:
        - scim2_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/scim2-models/
  license: Apache-2.0
  license_file: LICENSE
  summary: SCIM2 models serialization and validation with pydantic
  description: |
    SCIM2 models serialization and validation with pydantic
  documentation: https://scim2-models.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
