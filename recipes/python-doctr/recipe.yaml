# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: python-doctr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-doctr/python_doctr-${{ version }}.tar.gz
  sha256: 6fc54316ea7915e1fa96bf58e9434b16e1511c3c61dff16d0802f18c71a5d9c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch <3.0.0,>=2.0.0
    - torchvision >=0.15.0
    - onnx <3.0.0,>=1.12.0
    - numpy <3.0.0,>=1.16.0
    - scipy <2.0.0,>=1.4.0
    - h5py <4.0.0,>=3.1.0
    - opencv <5.0.0,>=4.5.0
    - pypdfium2 <6.0.0,>=4.11.0
    - pyclipper <2.0.0,>=1.2.0
    - shapely <3.0.0,>=1.6.0
    - langdetect <2.0.0,>=1.0.9
    - rapidfuzz <4.0.0,>=3.0.0
    - huggingface-hub <2.0.0,>=0.20.0
    - pillow >=9.2.0
    - defusedxml >=0.7.0
    - anyascii >=0.3.2
    - validators >=0.18.0
    - tqdm >=4.30.0

tests:
  - python:
      imports:
        - doctr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-doctr/
  license: Apache-2.0
  license_file: LICENSE
  summary: "Document Text Recognition (docTR): deep Learning for high-performance OCR on documents."
  description: |
    Document Text Recognition (docTR): deep Learning for high-performance OCR on documents.
  documentation: https://mindee.github.io/doctr

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-doctr
