# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: netwulf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netwulf/netwulf-${{ version }}.tar.gz
  sha256: 8a18a5afbd2fa430a1dc1d4bd07a9369009ebae121de1e58953dcd426aed05bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - networkx
    - numpy
    - simplejson

tests:
  - python:
      imports:
        - netwulf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/benmaier/netwulf
  license: MIT
  license_file: LICENSE
  summary: Interactively visualize networks with Ulf Aslak's d3-tool from Python.
  description: |
    Interactively visualize networks with Ulf Aslak's d3-tool from Python.
  repository: https://github.com/benmaier/netwulf/
  documentation: https://netwulf.rtfd.io

extra:
  recipe-maintainers:
    - rxm7706

