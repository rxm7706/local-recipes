# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: nest-asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nest-asyncio/nest_asyncio-${{ version }}.tar.gz
  sha256: 6f172d5449aca15afd6c646851f4e31e02c598d553a667e38cafa997cfec55fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nest_asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/erdewit/nest_asyncio
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Patch asyncio to allow nested event loops
  description: |
    Patch asyncio to allow nested event loops

extra:
  recipe-maintainers:
    - pavelzw
    - yehoshuadimarsky
    - SylvainCorlay
    - dhirschfeld

