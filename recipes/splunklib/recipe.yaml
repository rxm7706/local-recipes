    - pkg:pypi/splunklib@${{ version }}
  cfe-upstream-repo: https://github.com/IntegralDefense/splunklib
  cfe-upstream-homepage: https://github.com/IntegralDefense/splunklib
  cfe-import-names: [splunklib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
