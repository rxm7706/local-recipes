# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: splunklib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splunklib/splunklib-${{ version }}.tar.gz
  sha256: d8015f05a4ae9799d63b7f52ba617c3ed75d4cbce113f8b96281ec100606173e
  patches:
    - patches/0001-pycrypto-to-pycryptodome.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pycryptodome
    - requests

tests:
  - python:
      imports:
        - splunklib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/IntegralDefense/splunklib
  license: Apache-2.0
  license_file: LICENSE
  summary: A simple library for performing splunk search automation.
  description: |
    IntegralDefense helper for automating Splunk searches over the REST API
    (PyPI name ``splunklib``). This is not the official Splunk Python SDK
    (PyPI ``splunk-sdk``), which also imports as ``splunklib``.
  repository: https://github.com/IntegralDefense/splunklib

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: splunklib
  cfe-upstream-registry: pypi
  cfe-upstream-name: splunklib
  cfe-purls:
