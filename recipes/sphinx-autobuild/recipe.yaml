# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.8.25"

package:
  name: sphinx-autobuild
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-autobuild/sphinx_autobuild-${{ version }}.tar.gz
  sha256: 9cf5aab32853c8c31af572e4fecdc09c997e2b8be5a07daf2a389e270e85b213

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}
    - colorama >=0.4.6
    - sphinx
    - starlette >=0.35
    - uvicorn >=0.25
    - watchfiles >=0.20
    - websockets >=11

tests:
  - python:
      imports:
        - sphinx_autobuild
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sphinx-autobuild/
  license: MIT
  license_file: LICENSE
  summary: Rebuild Sphinx documentation on changes, with hot reloading in the browser.
  description: |
    Rebuild Sphinx documentation on changes, with hot reloading in the browser.
  repository: https://github.com/sphinx-doc/sphinx-autobuild
  documentation: https://github.com/sphinx-doc/sphinx-autobuild#readme

extra:
  recipe-maintainers:
    - jrderuiter
    - xhochy
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
