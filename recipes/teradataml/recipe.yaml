# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.0.0.11"

package:
  name: teradataml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/teradataml/teradataml-20.0.0.11-py3-none-any.whl
  sha256: f13631294b6ca044b7eea8fb0feb394c2c78efd7b59a2e31d71d87fb3c44a986

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - teradatasql >=20.0.0.26
    - teradatasqlalchemy >=20.0.0.9
    - pandas >=1.0
    - psutil
    - requests >=2.25.1
    - pyjwt >=2.8.0
    - cryptography >=42.0.5
    - sqlalchemy >=2.0
    - python-dotenv
    - oauthlib >=3.2.2
    - requests-oauthlib >=2.0.0
    - pydantic >=2.10.6
    - pyyaml >=6.0.2

tests:
  - python:
      imports:
        - teradataml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.teradata.com/
  license: MIT
  license_file: LICENSE
  summary: Teradata Vantage Python package for Advanced Analytics
  description: |
    Teradata Vantage Python package for Advanced Analytics

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
