# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: py-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py_utils/py_utils-${{ version }}.tar.gz
  sha256: ea0a99429bf1214bcc062a5e327275ec313463bb4fb71418ce5edf11f10257f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - py_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eyalev/py_utils
  license: MIT
  license_file: LICENSE
  summary: Utils for various scenarios
  description: |
    Utils for various scenarios

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: py_utils
  cfe-upstream-registry: pypi
  cfe-upstream-name: py_utils
  cfe-purls:
