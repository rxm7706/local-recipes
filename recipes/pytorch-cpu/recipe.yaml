# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# if you wish to build release candidate number X, append the version string with "-rcX"
# Use a higher build number for the CUDA variant, to ensure that it's
# preferred by conda's solver, and it's preferentially
# installed where the platform supports it.
# see https://github.com/pytorch/pytorch/blame/v{{ version }}/.ci/docker/ci_commit_pins/triton.txt
# pytorch and triton are released in tandem, see notes in their release process
# https://github.com/pytorch/pytorch/blob/main/RELEASE.md#triton-dependency-for-the-release
# these tests are for the libtorch output below, but due to
# a particularity of conda-build, that output is defined in
# the global build stage, including tests
schema_version: 1

context:
  version: "2.13.0"
  triton: "3.7.1"
  torch_libs: '[
        "c10", "shm", "torch", "torch_cpu", "torch_global_deps"
    ] + (cuda_compiler_version != "None" and target_platform.startswith("linux")) * [
        "torch_cuda_linalg"
    ] + (cuda_compiler_version != "None") * [
        "c10_cuda", "caffe2_nvrtc", "torch_cuda"
    ]'

recipe:
  name: libtorch
  version: ${{ version | replace("-", ".") }}

source:
  - url: https://download.pytorch.org/source_code/test/pytorch-v${{ version }}.tar.gz
    sha256: e77c5d8e7fb721625cd009274668d80f588b10958c9432c6a9f78c3fae79448d
  # The "pytorch-v" tarballs contain submodules; the "pytorch-" ones don't.
  - url: https://github.com/pytorch/pytorch/releases/download/v${{ version }}/pytorch-v${{ version }}.tar.gz
    sha256: 66614a19060f69cfd63cd0295f65a1241bd15df2fa65c60ae51066c11c2ce812
    patches:
      - patches/0001-Force-usage-of-python-3-and-error-without-numpy.patch
      # conda-specific: make setup.py honor $CMAKE_ARGS so conda's cross-compilation
      # toolchain reaches cmake before project(). Upstream PR #177640 moved env-var
      # forwarding into cmake/EnvVarForwarding.cmake (include()d after project()),
      # which is too late for the setup.py build path; honoring CMAKE_ARGS (as
      # scikit-build-core/conda-forge do) puts it on the command line in time.
      - patches/0002-Honor-the-CMAKE_ARGS-environment-variable-in-setup.p.patch
      # conda-specific patch, lets us override CUDA paths
      - patches/0003-Allow-overriding-CUDA-related-paths.patch
      # fix BLAS calling convention for openblas
      - patches/0004-Use-BLAS_USE_CBLAS_DOT-for-OpenBLAS-builds.patch
      - patches/0005-Fix-FindOpenBLAS.patch
      # point to headers that are now living in $PREFIX/include instead of $SP_DIR/torch/include;
      # this includes the MPS Metal shader JIT compiler, which must search there too for the
      # c10/metal headers it embeds, otherwise torch.compile on MPS fails
      - patches/0006-use-our-own-PREFIX-for-include-paths-etc.patch
      - patches/0007-make-ATEN_INCLUDE_DIR-relative-to-TORCH_INSTALL_PREF.patch
      - if: win
        then: patches/0008-remove-DESTINATION-lib-from-CMake-install-TARGETS-di.patch
      - patches/0009-avoid-deprecated-find_package-CUDA-in-caffe2-CMake-m.patch
      # skip a test that fails with numpy v2.3; still triggers as of pytorch v2.9
      - patches/0010-skip-test_norm_matrix_degenerate_shapes-on-numpy-2.3.patch
      # backport https://github.com/pytorch/pytorch/pull/127702
      - patches/0011-Define-PY_SSIZE_T_CLEAN-before-include-Python.h.patch
      # backport https://github.com/pytorch/pytorch/pull/166824
      - patches/0012-Add-USE_SYSTEM-options-for-KLEIDI-CUDNN_FRONTEND-CUT.patch
      - patches/0013-Fix-building-kineto-against-system-fmt.patch
      - patches/0014-Use-Intel-LLVM-openmp.patch
      - if: cuda_compiler_version != "None"
        then: patches/0015-for-win-CUDA-remove-USE_CUDA-guard-for-skip-in-compi.patch
      - patches/0016-Declare-_tryToInferTypeImpl-with-TORCH_PYTHON_API.patch
      # escape backslashes/quotes when CMAKE_CXX_FLAGS etc. are baked into
      # macros.h build strings, so the Windows (MSVC) build of caffe2/core/common.cc
      # doesn't choke on backslash paths -> C4129/C2065 'EHsc'
      - patches/0017-Escape-backslashes-quotes-in-macros.h-build-strings-.patch
      # support the cuDSS 0.8 API (new cudssDataType_t enum + offsetType arg in
      # cudssMatrixCreateCsr) so we can build against libcudss >=0.8; upstreamable
      - patches/0018-Update-cuDSS-matrix-create-calls-for-cuDSS-0.8-API.patch
      # Handlers.cpp uses std::unordered_map / std::vector without including them;
      # fails to compile on osx-arm64 metal builds (from AnacondaRecipes)
      - patches/0019-Add-missing-includes-in-c10d-control_plane-Handlers..patch
      # pytest-xdist cannot serialize torch builtin function objects in
      # unittest subTest metadata
      - patches/0020-Use-serializable-subtest-labels-in-autograd-test.patch
      # TODO: upstream this
      - patches/0021-Set-CPU-flags-via-add_definitions.patch
      # https://github.com/pytorch/pytorch/pull/189388
      - patches/0022-Set-Python_SOABI-when-cross-compiling-so-extension-m.patch
      # conda-forge: disable bundling win32 libraries
      - patches/0023-Disable-bundling-win32-runtime-libraries.patch
      - patches_submodules/tensorpipe/0001-switch-away-from-find_package-CUDA.patch

build:
  # This logic allows two rc variants to be defined in the conda_build_config, but only one to actually be built.
  # We want to be able to define two variants in the cbc so we can assign different labels to each in the upload channel
  # (by zipping is_rc with channel_targets). This prevents rc builds being used unless specifically requested.
  number: ${{ build }}
  string: ${{ 'cpu_${{ blas_impl }}_h${{ PKG_HASH }}_${{ build }}' if cuda_compiler_version == "None" else "cuda${{ cuda_compiler_version | replace('.', '') }}_${{ blas_impl }}_h${{ PKG_HASH }}_${{ build }}" if cuda_compiler_version != "None" else '' }}
  skip: is_rc
  prefix_detection:
    ignore_binary_files: true
  dynamic_linking:
    missing_dso_allowlist:
      - if: linux
        then: "*/libcuda.so.*"
      - if: win
        then: "*/nvcuda.dll"

requirements:
  # Keep this list synchronized (except for python*, numpy*) in outputs
  # We use python to build libtorch as well because it is easier
  build:
    # When you change 3.12 here, change it in build.sh/bld.bat as well
    - if: build_platform != target_platform
      then: python 3.12
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy  *
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: cuda_compiler_version != "None"
      then: ${{ compiler('cuda') }}
    - if: linux and aarch64 and cuda_compiler_version != "None"
      then: arm-variant * ${{ arm_variant_type }}
    - if: win
      then: libuv
    - llvm-openmp
    - cmake
    - ninja
    # Keep libprotobuf here so that a compatibile version
    # of protobuf is installed between build and host
    - libprotobuf
    - protobuf
    - if: linux
      then: make
    - if: win
      then: sccache
    - if: unix
      then: grep
    - if: unix
      then: rsync
  host:
    # GPU requirements
    - cuda-cudart-dev
    - cuda-cupti-dev
    - if: linux
      then: cuda-driver-dev
    - cuda-nvml-dev
    - cuda-nvrtc-dev
    - cuda-nvtx-dev
    - cuda-profiler-api
    - cuda-version ${{ cuda_compiler_version }}
    - cusparselt
    - libcublas-dev
    - libcudnn-dev
    - libcudss-dev
    - if: linux
      then: libcufile-dev
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - libmagma-devel
    - if: linux
      then: nccl
    - if: linux and cuda_compiler_version=="12.9" and arm_variant_type!="tegra"
      then: nccl <2.29
    - nvtx-c
    # other requirements
    - python 3.12
    - numpy *
    - pip
    - setuptools <82
    - pyyaml
    - requests
    - six
    - if: blas_impl == "mkl"
      then: mkl-devel
    - if: blas_impl == "mkl"
      then: libcblas * *_mkl
    - if: blas_impl != "mkl"
      then: libblas
    - if: blas_impl != "mkl"
      then: libcblas
    - if: blas_impl != "mkl"
      then: liblapack
    - if: not win
      then: onednn
    - libabseil
    - libprotobuf
    - llvm-openmp
    - sleef
    - libuv
    - if: unix
      then: pkg-config
    - typing_extensions
    - pybind11
    - pybind11-abi
    - eigen
    - zlib
    - fmt
    - packaging
  run:
    - if: blas_impl == "mkl"
      then: libblas * *${{ blas_impl }}
    # cuda-cupti-dev used to be pinned too widely on Windows
    - if: win and cuda_compiler_version != "None"
      then: ${{ pin_compatible("cuda-cupti", upper_bound="x.x.x") }}
  run_exports:
    - ${{ pin_subpackage('libtorch', upper_bound='x.x') }}
  ignore_run_exports:
    by_name:
      - python *
      - numpy *
      - libmagma_sparse
    from_package:
      - python *
      - numpy *
      - if: build_platform != target_platform
        then: cross-python_${{ target_platform }}
  run_constraints:
    - if: cuda_compiler_version == "None"
      then: pytorch-cpu ${{ version }}
    - if: cuda_compiler_version == "None"
      then: pytorch-gpu <0.0a0
    - if: cuda_compiler_version != "None"
      then: pytorch-gpu ${{ version }}
    - if: cuda_compiler_version != "None"
      then: pytorch-cpu <0.0a0
    - if: cuda_compiler_version != "None"
      then: pytorch ${{ version }} cuda${{ cuda_compiler_version | replace('.', '') }}_${{ blas_impl }}_*_${{ build }}
    - if: cuda_compiler_version == "None"
      then: pytorch ${{ version }} cpu_${{ blas_impl }}_*_${{ build }}
    - if: unix and blas_impl != "mkl"
      then: libopenblas * openmp_*
    - if: unix and blas_impl != "mkl"
      then: openblas * openmp_*

outputs:
  - package:
      name: libtorch
  - package:
      name: pytorch
    build:
      string: ${{ 'cpu_${{ blas_impl }}_py${{ CONDA_PY }}_h${{ PKG_HASH }}_${{ build }}' if cuda_compiler_version == "None" else "cuda${{ cuda_compiler_version | replace('.', '') }}_${{ blas_impl }}_py${{ CONDA_PY }}_h${{ PKG_HASH }}_${{ build }}" if cuda_compiler_version != "None" else '' }}
      prefix_detection:
        ignore_binary_files: true
      script:
        file: ${{ 'build.sh' if unix else 'bld.bat' if win else '' }}
    requirements:
      build:
        - python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: numpy
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: cuda_compiler_version != "None"
          then: ${{ compiler('cuda') }}
        - if: linux and aarch64 and cuda_compiler_version != "None"
          then: arm-variant * ${{ arm_variant_type }}
        - cmake
        - ninja
        # Keep libprotobuf here so that a compatibile version
        # of protobuf is installed between build and host
        - libprotobuf
        - protobuf
        - if: linux
          then: make
        - if: win
          then: sccache
      host:
        - ${{ pin_subpackage('libtorch', exact=True) }}
        # GPU requirements
        - cuda-cudart-dev
        - cuda-cupti-dev
        - if: linux
          then: cuda-driver-dev
        - cuda-nvml-dev
        - cuda-nvrtc-dev
        - cuda-nvtx-dev
        - cuda-profiler-api
        - cuda-version ${{ cuda_compiler_version }}
        - cusparselt
        - libcublas-dev
        - libcudnn-dev
        - libcudss-dev
        - if: linux
          then: libcufile-dev
        - libcufft-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - libmagma-devel
        - if: linux
          then: nccl
        - if: linux and cuda_compiler_version=="12.9" and arm_variant_type!="tegra"
          then: nccl <2.29
        - nvtx-c
        # other requirements
        - python
        - numpy
        - pip
        - setuptools <82
        - pyyaml
        - requests
        - six
        - if: blas_impl == "mkl"
          then: mkl-devel
        - if: blas_impl == "mkl"
          then: libcblas * *_mkl
        - if: blas_impl != "mkl"
          then: libcblas
        - if: blas_impl != "mkl"
          then: liblapack
        - if: not win
          then: onednn
        - libabseil
        - libprotobuf
        - llvm-openmp
        - pybind11
        - pybind11-abi
        - eigen
        - sleef
        - libuv
        - if: unix
          then: pkg-config
        - typing_extensions
        - zlib
        - fmt
        - packaging
      run:
        - ${{ pin_subpackage('libtorch', exact=True) }}
        - llvm-openmp
        - if: blas_impl == "mkl"
          then: libblas * *${{ blas_impl }}
        - if: blas_impl != "mkl"
          then: nomkl
        - if: cuda_compiler_version != "None" and not win
          then: triton ==${{ triton }}
        # avoid that people without GPUs needlessly download ~0.5-1GB
        - if: cuda_compiler_version != "None"
          then: __cuda
        - python
        # other requirements, see https://github.com/pytorch/pytorch/blame/main/requirements.txt
        - filelock
        - fsspec
        - jinja2
        - networkx
        - optree >=0.13.0
        - pybind11
        - setuptools <82
        - sympy >=1.13.3
        - typing_extensions >=4.10.0
        # cuda-cupti-dev used to be pinned too widely on Windows
        - if: win and cuda_compiler_version != "None"
          then: ${{ pin_compatible("cuda-cupti", upper_bound="x.x.x") }}
      run_exports:
        - ${{ pin_subpackage('pytorch', upper_bound='x.x') }}
        - ${{ pin_subpackage('libtorch', upper_bound='x.x') }}
      ignore_run_exports:
        by_name:
          - libmagma_sparse
      run_constraints:
        - if: cuda_compiler_version == "None"
          then: pytorch-cpu ${{ version }}
        - if: cuda_compiler_version == "None"
          then: pytorch-gpu <0.0a0
        - if: cuda_compiler_version != "None"
          then: pytorch-gpu ${{ version }}
        - if: cuda_compiler_version != "None"
          then: pytorch-cpu <0.0a0
    tests:
      - python:
          imports:
            - torch
            - torch._C
          pip_check: false
  - package:
      name: pytorch-tests
    build:
      string: ${{ 'cpu_${{ blas_impl }}_py${{ CONDA_PY }}_h${{ PKG_HASH }}_${{ build }}' if cuda_compiler_version == "None" else "cuda${{ cuda_compiler_version | replace('.', '') }}_${{ blas_impl }}_py${{ CONDA_PY }}_h${{ PKG_HASH }}_${{ build }}" if cuda_compiler_version != "None" else '' }}
      prefix_detection:
        ignore_binary_files: true
    requirements:
      host:
        - if: linux and aarch64 and cuda_compiler_version != "None"
          then: arm-variant * ${{ arm_variant_type }}
        - python
      run:
        - if: cuda_compiler_version != "None"
          then: pytorch ${{ version }} cuda*_${{ blas_impl }}_py${{ CONDA_PY }}*${{ build }}
        - if: cuda_compiler_version == "None"
          then: pytorch ${{ version }} cpu_${{ blas_impl }}_py${{ CONDA_PY }}*${{ build }}
    tests:
      - files:
          recipe:
            - cmake_test/
          source:
            - test
            - tools
        requirements:
          run:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - if: cuda_compiler_version != "None"
              then: ${{ compiler('cuda') }}
            - ninja
            - boto3
            - hypothesis
            - pytest <9.1
            - tabulate
            - pydot
            - pip
            - expecttest
            - xmlrunner
            - pyyaml
            - pytest-flakefinder
            - pytest-rerunfailures
            - pytest-xdist
            - cmake
            - if: cuda_compiler_version != "None"
              then: cuda-nvrtc-dev
            - if: cuda_compiler_version != "None"
              then: nvtx-c
            - pytest-timeout
        script:
          - pip check
          - python -c "import torch; print(torch.__version__)"
          - if: x86 and cuda_compiler_version == "None"
            then: python -c "import torch; assert torch.backends.mkldnn.m.is_available()"
          - python -c "import torch; torch.tensor(1).to('cpu').numpy(); print('numpy support enabled!!!')"
          - python -c "import torch; import numpy"
          - python -c "import numpy; import torch"
          - python -c "import numpy as np;import torch;x = torch.tensor([2], dtype=torch.complex128);res = torch.dot(x, x); assert res.real == 4.0, res"
          - if: linux or osx
            then: python -c "import torch; assert torch.distributed.is_available()"
          - if: osx
            then: python -c "import torch; assert torch.backends.mps.is_available()"
          - if: cuda_compiler_version != "None"
            then: python -c "import torch; assert torch.backends.cuda.is_built()"
          - if: cuda_compiler_version != "None"
            then: python -c "import torch; assert torch.backends.cudnn.is_available()"
          - if: cuda_compiler_version != "None"
            then: python -c "import torch; assert torch.backends.cudnn.enabled"
          - if: cuda_compiler_version != "None"
            then: python -c "import torch; assert torch.version.cuda is not None"
          - if: unix
            then: test -f $PREFIX/lib/libtorch_python${SHLIB_EXT}
          - if: win
            then: if not exist %LIBRARY_BIN%\torch_python.dll exit 1
          - if: win
            then: if not exist %SP_DIR%\torch\lib\torch_python.lib exit 1
          - if: unix
            then: export OMP_NUM_THREADS=4
          - if: unix
            then: export ONEDNN_VERBOSE=all
          - if: win
            then: set ONEDNN_VERBOSE=all
          - if: not aarch64 or match(python, "==3.12")
            then: pytest ${{ jobs }} ${{ tests }} -k "not (${{ skips }})" -m "not hypothesis" --durations=50 --timeout=1200 --disable-warnings --force-short-summary
          - if: match(python, "!=3.14") and unix
            then: test ! -f $SP_DIR/functorch/__pycache__/__init__.cpython-314.pyc
          - if: match(python, "!=3.14") and win
            then: if exist %SP_DIR%\functorch\__pycache__\__init__.cpython-314.pyc exit 1
          - cd cmake_test
          - mkdir build build2
          - cd build
          - if: unix
            then: cmake -GNinja -DWITH_TORCH_PYTHON=ON $CMAKE_ARGS ..
          - if: win
            then: cmake -GNinja -DWITH_TORCH_PYTHON=ON %CMAKE_ARGS% ..
          - if: unix
            then: cmake --build .
          - if: win
            then: cmake --build . --config Release
          - cd ../build2
          - if: unix
            then: cmake -GNinja -DWITH_TORCH_PYTHON=ON -DTorch_DIR=$SP_DIR/torch/share/cmake/Torch $CMAKE_ARGS ..
          - if: win
            then: cmake -GNinja -DWITH_TORCH_PYTHON=ON -DTorch_DIR=%SP_DIR%/torch/share/cmake/Torch %CMAKE_ARGS% ..
          - if: unix
            then: cmake --build .
          - if: win
            then: cmake --build . --config Release
  - package:
      name: ${{ 'pytorch-cpu' if cuda_compiler_version == "None" else '' }}
  - package:
      name: ${{ 'pytorch-gpu' if cuda_compiler_version != "None" else '' }}
    build:
      string: ${{ 'cpu_${{ blas_impl }}_h${{ PKG_HASH }}_${{ build }}' if cuda_compiler_version == "None" else "cuda${{ cuda_compiler_version | replace('.', '') }}_${{ blas_impl }}_h${{ PKG_HASH }}_${{ build }}" if cuda_compiler_version != "None" else '' }}
      prefix_detection:
        ignore_binary_files: true
    requirements:
      host:
        - if: linux and aarch64 and cuda_compiler_version != "None"
          then: arm-variant * ${{ arm_variant_type }}
      run:
        - if: cuda_compiler_version != "None"
          then: pytorch ${{ version }} cuda*_${{ blas_impl }}*${{ build }}
        - if: cuda_compiler_version == "None"
          then: pytorch ${{ version }} cpu_${{ blas_impl }}*${{ build }}
    tests:
      - python:
          imports:
            - torch
          pip_check: false

tests:
  - files:
      recipe:
        - cmake_test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - if: cuda_compiler_version != "None"
          then: ${{ compiler('cuda') }}
        - if: cuda_compiler_version != "None"
          then: cuda-nvrtc-dev
        - if: cuda_compiler_version != "None"
          then: nvtx-c
        - cmake
        - ninja
        - pkg-config
    script:
      - if: linux
        then: test -f $PREFIX/lib/lib${{ each_lib }}.so
      - if: osx
        then: test -f $PREFIX/lib/lib${{ each_lib }}.dylib
      - if: win
        then: if not exist %LIBRARY_BIN%\${{ each_lib }}.dll exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\${{ each_lib }}.lib exit 1
      - if: linux
        then: test -f $PREFIX/share/cmake/Torch/TorchConfig.cmake
      - if: win
        then: if not exist %LIBRARY_PREFIX%\share\cmake\Torch\TorchConfig.cmake exit 1
      - cd cmake_test
      - if: unix
        then: cmake -GNinja $CMAKE_ARGS .
      - if: win
        then: cmake -GNinja %CMAKE_ARGS% .

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICE
    - third_party/CMake/Copyright.txt
  summary: PyTorch is an optimized tensor library for deep learning using GPUs and CPUs.
  description: |
    PyTorch is a Python package that provides two high-level features:
    - Tensor computation (like NumPy) with strong GPU acceleration
    - Deep neural networks built on a tape-based autograd system
    You can reuse your favorite Python packages such as NumPy, SciPy, and Cython to extend PyTorch when needed.
  homepage: https://pytorch.org/
  repository: https://github.com/pytorch/pytorch
  documentation: https://pytorch.org/docs/

extra:
  recipe-maintainers:
    - baszalmstra
    - benjaminrwilson
    - beckermr
    - h-vetinari
    - hmaarrfk
    - jeongseok-meta
    - mgorny
    - sodre
    - Tobias-Fischer
  feedstock-name: pytorch-cpu
