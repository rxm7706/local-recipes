# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.deprecation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.deprecation/zope_deprecation-${{ version }}.tar.gz
  sha256: 18727ebda8e63a6d4bd28a290e8b46852e9f14473debb5cc40a0a2dccfadf15f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.deprecation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.deprecation
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Deprecation Infrastructure
  description: |
    Zope Deprecation Infrastructure

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin

#### CFE metadata AND comments
