# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: greenback
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d1441f542ec9c6efb32a9250dd954a5b1cc1eb789294c19b1eb747f49cab818c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - greenlet !=0.4.17
    - sniffio
    - outcome

tests:
  - python:
      imports:
        - greenback
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: Reenter an asyncio or Trio event loop from synchronous code
  description: |
    greenback is a small library that allows you to call back into async code
    from a syntactically synchronous function, as long as the synchronous function
    was originally called from an async task (running in an asyncio or Trio event loop)
    that set up a greenback "portal".
  license: MIT
  license_file:
    - LICENSE
    - LICENSE.MIT
  # The doc_url and dev_url are optional.
  homepage: https://github.com/oremanj/greenback
  repository: https://github.com/oremanj/greenback
  documentation: https://greenback.readthedocs.io/

extra:
  recipe-maintainers:
    - peterbygrave
