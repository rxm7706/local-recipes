# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.10"

package:
  name: pkgutil_resolve_name
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pkgutil_resolve_name/pkgutil_resolve_name-${{ version }}.tar.gz
  sha256: 357d6c9e6a755653cfd78893817c0853af365dd51ec97f3d358a819373bbd174

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pkgutil_resolve_name
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/graingert/pkgutil-resolve-name
  license: MIT
  license_file: LICENSE
  summary: Resolve a name to an object.
  description: |
    Resolve a name to an object.

extra:
  recipe-maintainers:
    - thewchan

