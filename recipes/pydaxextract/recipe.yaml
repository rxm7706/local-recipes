# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: pydaxextract
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyDaxExtract/PyDaxExtract-${{ version }}.tar.gz
  sha256: 61244cc7cace51aaf7f0e8472ee704b8036197a8fcd396ed67ff51f35a82513a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dax_extract
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/doug.shawhan/pydaxextract
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Extract Table Relationships, m expressions, and DAX expressions from Power BI template.
  description: |
    Extract Table Relationships, m expressions, and DAX expressions from Power BI template.
  repository: https://gitlab.com/doug.shawhan/pydaxextract/tree/dev
  documentation: https://pydaxextract.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

