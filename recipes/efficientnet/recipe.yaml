# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: efficientnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/efficientnet/efficientnet-${{ version }}.tar.gz
  sha256: a92e7715453f6043942d9c8d995464e8d319494f08d1d458600abbd5c43544bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - keras-applications
    - scikit-image

tests:
  - python:
      imports:
        - efficientnet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/qubvel/efficientnet
  license: Apache-2.0
  license_file: LICENSE
  summary: EfficientNet model re-implementation. Keras and TensorFlow Keras.
  description: |
    EfficientNet model re-implementation. Keras and TensorFlow Keras.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: efficientnet
  cfe-upstream-registry: pypi
  cfe-upstream-name: efficientnet
  cfe-purls:
