# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: fast-map
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fast-map/fast_map-${{ version }}.tar.gz
  sha256: 6d67c23c91b853a1eeacce9be95220fb76c00e772368010c32809afb86cacff9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fast_map
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/michalmonday/fast_map
  license: MIT
  license_file: LICENSE
  summary: Combines multiprocessing and multithreading for fast computation.
  description: |
    Combines multiprocessing and multithreading for fast computation.

extra:
  recipe-maintainers:
    - rxm7706

