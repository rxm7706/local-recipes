# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.7"

package:
  name: llama-index-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-cli/llama_index_cli-${{ version }}.tar.gz
  sha256: 9fcd19ebd5615ac690d1c2be4733aa46106504642c17b09c6928740837b39199

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - llamaindex-cli = llama_index.cli.command_line:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core >=0.13.0,<0.15
    - llama-index-embeddings-openai >=0.6.0,<0.7
    - llama-index-llms-openai >=0.7.0,<0.8

tests:
  - python:
      imports:
        - llama_index.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - ${{ python_min }}.*
    script:
      - llamaindex-cli --help

about:
  homepage: https://docs.llamaindex.ai/en/stable/getting_started/starter_tools/rag_cli/
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-cli
  license: MIT
  license_file: LICENSE
  summary: llama-index cli
  description: |
    llama-index cli

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen

