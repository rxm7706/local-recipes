# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# inclusive
# exclusive
schema_version: 1

context:
  name: panflute
  version: "2.1.3"
  pandoc_minimum_version: "2.11.0.4"
  pandoc_maximum_version: "2.18"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/panflute-${{ version }}.tar.gz
  sha256: cb94244fe766893bb2f172ebb827ec3ded761b8fffa84e4c84b678b9f8a9ff95

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - panflute=panflute:main
      - panfl=panflute:panfl

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - click >=6,<9
    - python >=3.6
    - pyyaml >=3,<7
  run_constraints:
    - pandoc >=${{ pandoc_minimum_version }},<${{ pandoc_maximum_version }}

tests:
  - python:
      imports:
        - panflute
      pip_check: true
  - requirements:
      run:
        - pip
        - pandoc >=${{ pandoc_minimum_version }},<${{ pandoc_maximum_version }}
    script:
      - echo '# Testing' | pandoc -F panflute
      - panfl --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pythonic Pandoc filters
  homepage: https://github.com/sergiocorreia/panflute
  repository: https://github.com/sergiocorreia/panflute
  documentation: http://scorreia.com/software/panflute/

extra:
  recipe-maintainers:
    - ickc
    - kiwi0fruit
