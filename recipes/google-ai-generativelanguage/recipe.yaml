# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: google-ai-generativelanguage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-ai-generativelanguage/google_ai_generativelanguage-${{ version }}.tar.gz
  sha256: d82f35ade52887476d4586e3cd22fb95492edac47505370e0cb71148168dd94b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8

tests:
  - python:
      imports:
        - google.ai.generativelanguage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-ai-generativelanguage
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Ai Generativelanguage API client library
  description: |
    Google Ai Generativelanguage API client library

extra:
  recipe-maintainers:
    - jan-janssen

