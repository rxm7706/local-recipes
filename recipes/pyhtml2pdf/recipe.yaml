# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pyhtml2pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhtml2pdf/pyhtml2pdf-${{ version }}.tar.gz
  sha256: 3e2457b82535bed7a9125e03096a5766144180c2a606ae753f137ec1e2064681

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - selenium
    - webdriver-manager
    - pikepdf

tests:
  - python:
      imports:
        - pyhtml2pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kumaF/pyhtml2pdf
  license: MIT
  license_file: LICENSE
  summary: Simple python wrapper to convert HTML to PDF with headless Chrome via selenium.
  description: |
    Simple python wrapper to convert HTML to PDF with headless Chrome via selenium.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
