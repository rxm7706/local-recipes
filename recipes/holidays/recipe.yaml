# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.102"

package:
  name: holidays
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/holidays/holidays-${{ version }}.tar.gz
  sha256: fc29b2fc76d262c822a200c50095e2dadc974b3e41e245875a33f1436bafe7d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - python-dateutil <3,>=2.9.0.post0

tests:
  - python:
      imports:
        - holidays
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/holidays/
  license: MIT
  license_file: LICENSE
  summary: Open World Holidays Framework
  description: |
    Open World Holidays Framework
  repository: https://github.com/vacanza/holidays/
  documentation: https://holidays.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - bletham
    - rpanai
    - synapticarbors

