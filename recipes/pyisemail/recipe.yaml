# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: pyisemail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyIsEmail/pyisemail-${{ version }}.tar.gz
  sha256: daf4b3fb2150a38f406b0aaba729e19fcd638a6d1c0549c25ff54c7b804618f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - dnspython >=2.0.0

tests:
  - python:
      imports:
        - pyisemail
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/michaelherold/pyIsEmail
  license: MIT
  license_file: LICENSE
  summary: Simple, robust email validation
  description: |
    Simple, robust email validation
  repository: https://github.com/michaelherold/pyIsEmail

extra:
  recipe-maintainers:
    - mrakitin

