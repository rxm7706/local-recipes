# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: stable-baselines3
  version: "2.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stable_baselines3-${{ version }}.tar.gz
  sha256: 92b46c6099a0e8f99163ff09e26729e4d0a68b33dc8598626ca13ade3c0b3a61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - gymnasium >=0.29.1,<1.3.0
    - numpy >=1.20,<3.0
    - pytorch >=2.3,<3.0
    - cloudpickle
    - pandas
    - matplotlib-base

tests:
  - python:
      imports:
        - stable_baselines3
        - stable_baselines3.a2c
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pytorch version of Stable Baselines, implementations of reinforcement learning algorithms.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/DLR-RM/stable-baselines3
  repository: https://github.com/DLR-RM/stable-baselines3
  documentation: https://stable-baselines3.readthedocs.io/

extra:
  recipe-maintainers:
    - YYYasin19
    - cyprienc
    - pavelzw
