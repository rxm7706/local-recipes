# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: langgraph-checkpoint-mongodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-checkpoint-mongodb/langgraph_checkpoint_mongodb-${{ version }}.tar.gz
  sha256: 21833db58637993b2e4f989d96093cd23f41d13f17b697a12a17f87ad6d987a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >1.24
  run:
    - python >=${{ python_min }}
    - langchain-mongodb >=0.8.0
    - langgraph-checkpoint >=3.0.0
    - pymongo <4.17,>=4.12

tests:
  - python:
      imports:
        - langgraph.checkpoint.mongodb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-checkpoint-mongodb/
  license: MIT
  license_file: LICENSE
  summary: Library with a MongoDB implementation of LangGraph checkpoint saver.
  description: |
    Library with a MongoDB implementation of LangGraph checkpoint saver.

extra:
  recipe-maintainers:
    - rxm7706

