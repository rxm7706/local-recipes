# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: agent-memory-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-memory-client/agent_memory_client-${{ version }}.tar.gz
  sha256: 7178a38682ec61538002adec34140c7751387b82fbab8c214edf766b6d913d85

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.0
    - pydantic >=2.0.0
    - python-ulid >=3.0.0

tests:
  - python:
      imports:
        - agent_memory_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/redis-developer/agent-memory-server
  license: Apache-2.0
  license_file: LICENSE
  summary: Python client for the Agent Memory Server REST API
  description: |
    Python client for the Agent Memory Server REST API
  repository: https://github.com/redis-developer/agent-memory-server
  documentation: https://github.com/redis-developer/agent-memory-server/tree/main/docs

extra:
  recipe-maintainers:
    - rxm7706

