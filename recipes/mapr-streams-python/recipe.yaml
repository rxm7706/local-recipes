# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: mapr-streams-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mapr-streams-python/mapr-streams-python-${{ version }}.tar.gz
  sha256: b6e59d1cbc863078c902b77cde6bb047307328d016e15a3ba1d35b47fb29738b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - confluent_kafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mapr/private-confluent-kafka-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Python client for Data Fabric Streams
  description: |
    Python client for Data Fabric Streams

extra:
  recipe-maintainers:
    - rxm7706

