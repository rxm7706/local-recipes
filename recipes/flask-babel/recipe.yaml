# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: flask-babel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-babel/flask_babel-${{ version }}.tar.gz
  sha256: dbeab4027a3f4a87678a11686496e98e1492eb793cbdd77ab50f4e9a2602a593

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pytz
    - flask
    - babel
    - jinja2

tests:
  - python:
      imports:
        - flask_babel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-babel/flask-babel
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Adds i18n/l10n support for Flask applications.
  description: |
    Adds i18n/l10n support for Flask applications.
  repository: https://github.com/python-babel/flask-babel
  documentation: https://python-babel.github.io/flask-babel/

extra:
  recipe-maintainers:
    - pmlandwehr
    - xylar

#### CFE metadata AND comments
