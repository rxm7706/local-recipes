# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "11.88.0"

package:
  name: appdynamics-proxysupport-linux-x64
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/a/appdynamics-proxysupport-linux-x64/appdynamics_proxysupport_linux_x64-11.88.0-py2.py3-none-any.whl
  sha256: d83a38e176c255021fb052102c506b29b554d8260ac4c9b4d21bfca13db62dcf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - appdynamics_proxysupport_linux_x64
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.appdynamics.com
  license: Proprietary
  license_file: LICENSE
  summary: Proxysupport for AppDynamics Python agent
  description: |
    Proxysupport for AppDynamics Python agent

extra:
  recipe-maintainers:
    - rxm7706

