# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: libcudf-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libcudf-cu12/libcudf_cu12-26.8.0-py3-none-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: fe53da40c635eec00a026f4068a01b968f2181e780607e2d3790e60af5b2af10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - libkvikio-cu12 ==26.8.*
    - librmm-cu12 ==26.8.*
    - nvidia-libnvcomp-cu12 ==5.3.0.16
    - nvidia-nvjitlink-cu12 <13,>=12.9
    - rapids-logger ==0.2.*

tests:
  - python:
      imports:
        - libcudf_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cudf
  license: Apache-2.0
  license_file: LICENSE
  summary: cuDF - GPU Dataframe (C++)
  description: |
    cuDF - GPU Dataframe (C++)

extra:
  recipe-maintainers:
    - rxm7706

