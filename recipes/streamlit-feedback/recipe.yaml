# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: streamlit-feedback
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-feedback/streamlit-feedback-${{ version }}.tar.gz
  sha256: 4c34429aaea308cbf902bb353260600ecab6f455bc60faf34b8083492523aa8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_feedback
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-feedback/
  license: MIT
  license_file: LICENSE
  summary: Streamlit component that allows you to collect user feedback in your apps
  description: |
    Streamlit component that allows you to collect user feedback in your apps

extra:
  recipe-maintainers:
    - rxm7706

