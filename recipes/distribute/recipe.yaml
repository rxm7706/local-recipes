# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.3"

package:
  name: distribute
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/distribute/distribute-0.7.3.zip
  sha256: 3dc7a8d059dcf72f0ead2fa2144a24ee0ef07dce816e8c3545d7345767138c5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distribute
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://packages.python.org/distribute
  license: PSF-2.0
  license_file: LICENSE
  summary: distribute legacy wrapper
  description: |
    distribute legacy wrapper

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
