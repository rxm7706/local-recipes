{% set name = "json5" %}
{% set version = "0.17.3" %}
{% set python_min = python_min|default("3.8") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/json5-{{ version }}.tar.gz
  sha256: 8d0278ad34ebaa9c3af76d9519274811830224a2d1cd5af156dbd067f461b8a4

build:
  entry_points:
    - pyjson5=json5.tool:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - json5
  commands:
    - pip check
    - pyjson5 --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/dpranke/pyjson5
  summary: A Python implementation of the JSON5 data format.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - ian-r-rose
