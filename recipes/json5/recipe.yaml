# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: json5
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json5/json5-${{ version }}.tar.gz
  sha256: 7424d1f1eb1d56da6e3d70643f53619862b4ce81440bdb8ecfd6f875e5ba4a71

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/json5/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python implementation of the JSON5 data format.
  description: |
    A Python implementation of the JSON5 data format.
  repository: https://github.com/dpranke/pyjson5

extra:
  recipe-maintainers:
    - rxm7706
    - ian-r-rose

#### CFE metadata AND comments
