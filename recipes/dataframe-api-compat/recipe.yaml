# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.7"

package:
  name: dataframe-api-compat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dataframe-api-compat/dataframe_api_compat-${{ version }}.tar.gz
  sha256: 07b611e76269186a29a8cb46275f7dbc5d206f748b43121995978606a1d337dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - packaging

tests:
  - python:
      imports:
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/data-apis/dataframe-api-compat
  license: MIT
  license_file: LICENSE
  summary: Implementation of the DataFrame Standard for pandas and Polars
  description: |
    Implementation of the DataFrame Standard for pandas and Polars

extra:
  recipe-maintainers:
    - rxm7706

