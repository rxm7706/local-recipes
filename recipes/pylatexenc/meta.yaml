{% set name = "pylatexenc" %}
{% set version = "2.11" %}
{% set sha256 = "5f622ef586dbffeb8ccd6ac210431ff0acf41d74275de179696e38006c28b862" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://github.com/phfaist/pylatexenc/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  noarch: python
  entry_points:
    - latexwalker = pylatexenc.latexwalker.__main__:main
    - latex2text = pylatexenc.latex2text.__main__:main
    - latexencode = pylatexenc.latexencode.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pylatexenc
  commands:
    - latexwalker --help
    - latex2text --help
    - latexencode --help

about:
  home: https://github.com/phfaist/pylatexenc
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Simple LaTeX parser providing latex-to-unicode and unicode-to-latex conversion
  doc_url: https://pylatexenc.readthedocs.io/en/latest
  dev_url: https://github.com/phfaist/pylatexenc

extra:
  recipe-maintainers:
    - milljm
