# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: espeakng-loader
  version: ${{ version }}

build:
  number: 0
  noarch: python
  script:
    - if: unix
      then: |
        set -ex
        cp -a "${RECIPE_DIR}/pyproject.toml" "${RECIPE_DIR}/README.md" "${RECIPE_DIR}/espeakng_loader" .
        ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - espeak-ng

tests:
  - python:
      imports:
        - espeakng_loader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # Resolution must be real, not merely importable: both paths have to
      # exist in the prefix, and the library has to actually dlopen.
      - python -c "import espeakng_loader as e, os; p=e.get_library_path(); assert os.path.exists(p), p; print('lib ', p)"
      - python -c "import espeakng_loader as e, os; p=e.get_data_path(); assert os.path.isdir(p), p; print('data', p)"
      - python -c "import espeakng_loader as e; assert e.load_library() is not None; print('dlopen OK')"
      # The path must point INTO this prefix, never at a vendored copy or a
      # stale build tree -- the upstream wheel's exact failure.
      - python -c "import espeakng_loader as e, sys; assert e.get_data_path().startswith(sys.prefix), (e.get_data_path(), sys.prefix); print('resolves into sys.prefix OK')"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/thewh1teagle/espeakng-loader
  repository: https://github.com/thewh1teagle/espeakng-loader
  summary: Shared-library loader for eSpeak NG, resolved from the conda prefix
  description: |
    Provides the `espeakng_loader` module that TTS front-ends such as
    kokoro-onnx import to locate the eSpeak NG shared library and its data
    directory.

    This conda build keeps upstream's public API — `get_library_path`,
    `get_data_path`, `load_library`, `make_library_available` — but resolves
    them from the active prefix's `espeak-ng` package rather than from a
    vendored copy inside the Python package. It therefore ships no binaries
    and depends on `espeak-ng`.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

