# CFE comments
# Header:
#    # DELIBERATE DIVERGENCE FROM UPSTREAM -- read before bumping.
#    #
#    # This does NOT repackage the PyPI wheels. Those wheels (6 per-platform,
#    # ~9.5 MB each) bundle a prebuilt libespeak-ng whose data directory is
#    # COMPILED IN as the upstream CI machine's build tree:
#    #   /home/runner/work/espeakng-loader/espeakng-loader/espeak-ng/
#    #       _dynamic/share/espeak-ng-data/phontab
#    # Nothing overrides it -- not phonemizer's EspeakWrapper.set_data_path()
#    # (which kokoro-onnx already calls correctly), not ESPEAK_DATA_PATH.
#    # Verified 2026-09-07 with a control: a stock `pip install kokoro-onnx`
#    # fails IDENTICALLY on Python 3.12 (upstream-supported) and 3.14, and
#    # succeeds the moment PHONEMIZER_ESPEAK_LIBRARY names a real espeak-ng.
#    # Repackaging that wheel would ship a package that builds green and
#    # cannot synthesise -- the G51/G73 trap.
#    #
#    # So the module is authored here against the SAME public API (the four
#    # functions kokoro-onnx and phonemizer call) and resolves to the
#    # `espeak-ng` conda package instead. conda records espeak-ng's data path
#    # in info/has_prefix and rewrites it at install time, which is exactly
#    # the relocation the wheel cannot do.
#    #
#    # Version tracks upstream's 0.2.4 because kokoro-onnx pins
#    # `espeakng-loader>=0.2.4`; the API is upstream's, only the resolution
#    # differs.
# build:
#    # pip install (not a bare file copy) so a real .dist-info lands:
#    # kokoro-onnx declares espeakng-loader>=0.2.4 and `pip check` resolves
#    # that against installed distribution metadata. A copied module would
#    # import fine and still fail pip_check.
#    # noarch: python is correct -- this package is pure Python and ships no
#    # binaries; the per-platform content lives in its espeak-ng run dep.
# tests:
#    # Deliberately beyond `imports`: the script tests assert both paths
#    # EXIST, that the library actually dlopens, and that resolution lands
#    # inside sys.prefix. An import-only test passes on precisely the broken
#    # configuration this package was written to eliminate.
#    # sys.prefix, not CONDA_PREFIX: the latter describes the shell's
#    # activated env, which is not necessarily the interpreter running the
#    # code (a direct /path/to/env/bin/python call, a subprocess, a Jupyter
#    # kernel borrowed from another env).
####
