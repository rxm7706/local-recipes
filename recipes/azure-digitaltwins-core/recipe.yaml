# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: azure-digitaltwins-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-digitaltwins-core/azure_digitaltwins_core-${{ version }}.tar.gz
  sha256: e01ea57d5429ce67aa5d423d1d363dfaf39e7a03a90c924d5662270fc443a8a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core <2.0.0,>=1.29.0
    - isodate >=0.6.1

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/digitaltwins/azure-digitaltwins-core
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Azure DigitalTwins Core Client Library for Python
  description: |
    Microsoft Azure Azure DigitalTwins Core Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

