# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.3.0"
  python_min: "3.11"

package:
  name: testfixtures
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/testfixtures/testfixtures-${{ version }}.tar.gz
  sha256: d807ceb9bdd6ea7cc0663370dd5568339056b35dc15c26effd1ae267e323acf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12

tests:
  - python:
      imports:
        - testfixtures
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Simplistix/testfixtures
  license: MIT
  license_file: LICENSE.txt
  summary: A collection of helpers and mock objects for unit tests and doc tests.
  description: |
    A collection of helpers and mock objects for unit tests and doc tests.
  repository: https://github.com/Simplistix/testfixtures
  documentation: http://testfixtures.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
    - cjw296

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: testfixtures
