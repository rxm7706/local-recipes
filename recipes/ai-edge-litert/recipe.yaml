# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: ai-edge-litert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/a/ai-edge-litert/ai_edge_litert-2.2.0-cp310-cp310-macosx_12_0_arm64.whl
  sha256: ca4f1232735f906af978eae43e97e59b29d84e9c1cc1d56a4018ffd7e6e18f7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - backports.strenum
    - flatbuffers
    - numpy >=1.23.2
    - tqdm
    - typing_extensions
    - protobuf
    - ml-dtypes

tests:
  - python:
      imports:
        - ai_edge_litert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.tensorflow.org/lite/
  license: Apache-2.0
  license_file: LICENSE
  summary: LiteRT is for mobile and embedded devices.
  description: |
    LiteRT is for mobile and embedded devices.

extra:
  recipe-maintainers:
    - rxm7706

