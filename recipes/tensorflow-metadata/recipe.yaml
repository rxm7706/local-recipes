# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.21.0"

package:
  name: tensorflow-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tensorflow-metadata/tensorflow_metadata-${{ version }}.tar.gz
  sha256: 2108ed8ea40df9ac4f7c506a62e9ecf5dcd40678b3308dcee2ec9e0e59d60609

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <70
    - wheel
  run:
    - python >=${{ python_min }}
    - absl-py <3.0.0,>=0.9
    - protobuf <=6.32,>=4.21.6
    - googleapis-common-protos <2,>=1.56.4

tests:
  - python:
      imports:
        - tensorflow_metadata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tensorflow-metadata/
  license: Apache-2.0
  license_file: LICENSE
  summary: Library and standards for schema and statistics.
  description: |
    Library and standards for schema and statistics.

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - oblute
    - ndmaxar
    - ngam
    - ehfd

