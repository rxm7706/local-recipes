# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: munch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/munch/munch-${{ version }}.tar.gz
  sha256: 542cb151461263216a4e37c3fd9afc425feeaf38aaa3025cd2a981fadb422235

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pbr >=3.0
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - munch
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A dot-accessible dictionary (a la JavaScript objects)
  homepage: http://github.com/Infinidat/munch

extra:
  recipe-maintainers:
    - ocefpaf
