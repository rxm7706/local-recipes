# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: munch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/munch/munch-${{ version }}.tar.gz
  sha256: 542cb151461263216a4e37c3fd9afc425feeaf38aaa3025cd2a981fadb422235

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - munch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Infinidat/munch
  license: MIT
  license_file: LICENSE.txt
  summary: A dot-accessible dictionary (a la JavaScript objects)
  description: |
    A dot-accessible dictionary (a la JavaScript objects)

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: munch
  cfe-upstream-registry: pypi
  cfe-upstream-name: munch
  cfe-purls:
    - pkg:conda/munch@${{ version }}?channel=conda-forge
    - pkg:pypi/munch@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/Infinidat/munch
  cfe-import-names: [munch]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/munch-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-4.0.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:52:40Z
