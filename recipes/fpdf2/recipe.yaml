# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.8"

package:
  name: fpdf2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fpdf2/fpdf2-${{ version }}.tar.gz
  sha256: 9e94e155e85e8053329a9a1fce8b566fd7a7c5bb79e98a1a3952d379b947c5b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
    - fonttools
  run:
    - python >=${{ python_min }}
    - defusedxml
    - pillow !=9.2.*,>=8.3.2
    - fonttools >=4.34.0

tests:
  - python:
      imports:
        - fpdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://py-pdf.github.io/fpdf2/
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: Simple & fast PDF generation for Python
  description: |
    Simple & fast PDF generation for Python
  repository: https://github.com/py-pdf/fpdf2
  documentation: https://py-pdf.github.io/fpdf2/

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
    - thewchan

#### CFE metadata AND comments
