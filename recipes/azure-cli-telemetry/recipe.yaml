# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-cli-telemetry
  version: 1.1.0.post20250227030620

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 371b5249bfcaf0c133679f3a3f3a79168219dc69f03c7f6ac4b42e01b5a6db33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - applicationinsights >=0.11.1,<0.12
    - portalocker >=1.6,<3

tests:
  - python:
      imports:
        - azure
        - azure.cli
        - azure.cli.telemetry
        - azure.cli.telemetry.components
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Microsoft Azure CLI Telemetry Package
  homepage: https://github.com/Azure/azure-cli
  repository: https://github.com/Azure/azure-cli/tree/main/src/azure-cli-telemetry
  documentation: https://docs.microsoft.com/en-us/cli/azure

extra:
  recipe-maintainers:
    - dhirschfeld
    - andreyz4k
