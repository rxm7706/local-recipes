# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-system-metrics
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_system_metrics-${{ version }}.tar.gz
  sha256: c8b82821ccc95c5f2c516bb72356f75673ced51364eed583a14bf3b85fa6a0c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - opentelemetry-semantic-conventions ==0.65b0
    - python >=${{ python_min }}
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-api >=1.11,<2.dev0
    - opentelemetry-sdk >=1.25,<2.0
    - psutil >=5.9.0,<8
    # - opentelemetry-semantic-conventions ==0.63b0

tests:
  - python:
      imports:
        - opentelemetry.metrics
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry System Metrics Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-system-metrics.

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-instrumentation
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-sdk
