# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: flex-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flex-config/flex_config-${{ version }}.tar.gz
  sha256: 032a059b90f793a6647948fd58169ef3ccb012324ba5cef4ce457aa3dbf26849

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - pydantic

tests:
  - python:
      imports:
        - flex_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/emann/flex-config
  license: MIT
  license_file: LICENSE
  summary: Easily configure Python apps via environment variables, YAML, and AWS SSM Param Store.
  description: |
    Easily configure Python apps via environment variables, YAML, and AWS SSM Param Store.
  repository: https://github.com/emann/flex-config
  documentation: https://emann.github.io/flex-config

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
