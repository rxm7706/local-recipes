# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.0"

package:
  name: django-pivot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-pivot/django_pivot-${{ version }}.tar.gz
  sha256: 30ed4e16d0ee6c7c7c1b5157b4541b10454a34ffe574228c927fea2316fcb792

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=3.2

tests:
  - python:
      imports:
        - django_pivot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/martsberger/django-pivot
  license: MIT
  license_file: LICENSE
  summary: Create pivot tables and histograms from ORM querysets
  description: |
    Create pivot tables and histograms from ORM querysets

extra:
  recipe-maintainers:
    - rxm7706

