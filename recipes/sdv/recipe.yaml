# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.38.0"

package:
  name: sdv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sdv/sdv-${{ version }}.tar.gz
  sha256: 34c2fa49a1b7043678b3910e5d7e899e45524de7c79a1b159e5f0e5cecf57dce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - boto3 <2.0.0,>=1.28
    - botocore <2.0.0,>=1.31
    - cloudpickle >=2.1.0
    - python-graphviz >=0.13.2
    - numpy >=1.22.2
    - pandas <3,>=1.4.0
    - tqdm >=4.29
    - copulas >=0.12.1
    - ctgan >=0.11.1
    - deepecho >=0.7.0
    - rdt >=1.18.2
    - sdmetrics >=0.28.1
    - platformdirs >=4.0
    - pyyaml >=6.0.1

tests:
  - python:
      imports:
        - sdv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sdv/
  license: BUSL-1.1
  license_file: LICENSE
  summary: Generate synthetic data for single table, multi table and sequential data
  description: |
    Generate synthetic data for single table, multi table and sequential data
  repository: https://github.com/sdv-dev/SDV/

extra:
  recipe-maintainers:
    - amontanez24
    - fealho
    - frances-h
    - pvk-developer
    - rwedge
    - gsheni
    - R-Palazzo
    - sarahmish

