# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.0"

package:
  name: pytest-mongodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-mongodb/pytest-mongodb-${{ version }}.tar.gz
  sha256: 74749592abb9edd7fab5e28374f40eddffe5683cf0f6cd42db562c0ce30b99d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - mongomock
    - pymongo
    - pyyaml

tests:
  - python:
      imports:
        - pytest_mongodb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdomke/pytest-mongodb
  license: MIT
  license_file: LICENSE
  summary: pytest plugin for MongoDB fixtures
  description: |
    pytest plugin for MongoDB fixtures

extra:
  recipe-maintainers:
    - rxm7706

