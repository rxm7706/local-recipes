# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: a2a-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a-python/a2a_python-${{ version }}.tar.gz
  sha256: cda7871a63b1dc9978aac63e9f835ea47a3e4b1a37f2a47cefd85438e64ea87b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - a2a_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lukehinds/a2a-python
  license: MIT
  license_file: LICENSE
  summary: Python A2A Implementation
  description: |
    Python A2A Implementation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
