# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.65b0

package:
  name: opentelemetry-semantic-conventions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-semantic-conventions/opentelemetry_semantic_conventions-${{ version }}.tar.gz
  sha256: f9b2b81e9d5b64f11bc952075e7e9c7fb0aab075c7fd1c46d597f1b919852d60

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >=${{ python_min }}
    - opentelemetry-api ==1.44.0
    - typing-extensions >=4.5.0
    # - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.semconv
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Semantic Conventions
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-semantic-conventions

extra:
  recipe-maintainers:
    - timkpaine
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
