# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-constance
  version: 4.3.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_constance-${{ version }}.tar.gz
  sha256: 081177483d272b664cf768deae76fc2fbb0a777076f45620b6fde4d9075ee2b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - django >=4.2
tests:
  - python:
      imports:
        - constance
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Django live settings with pluggable backends, including Redis.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jazzband/django-constance

extra:
  recipe-maintainers:
    - rxm7706

