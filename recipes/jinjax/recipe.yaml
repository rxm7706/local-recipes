# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65"

package:
  name: jinjax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jinjax/jinjax-${{ version }}.tar.gz
  sha256: 2fb5b141a3f38db01e268fb768f3a404355ff9934ae885efcfb764d576fd7cd2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2 >=3.0
    - markupsafe >=2.0

tests:
  - python:
      imports:
        - jinjax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jinjax.scaletti.dev/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Replace your HTML templates with Python server-Side components
  description: |
    Replace your HTML templates with Python server-Side components
  documentation: https://jinjax.scaletti.dev/guides/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
