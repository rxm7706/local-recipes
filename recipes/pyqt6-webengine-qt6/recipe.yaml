# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.11.1"

package:
  name: pyqt6-webengine-qt6
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/PyQt6-WebEngine-Qt6/pyqt6_webengine_qt6-6.11.1-py3-none-macosx_10_14_x86_64.whl
  sha256: a20fccfa6d345b804fa718ae2b4db3cda4a66bb5ea83b14a6266b8c6d168477c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyqt6_webengine_qt6
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.riverbankcomputing.com/software/pyqt/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: The subset of a Qt installation needed by PyQt6-WebEngine.
  description: |
    The subset of a Qt installation needed by PyQt6-WebEngine.

extra:
  recipe-maintainers:
    - rxm7706

