# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.5"

package:
  name: dbt-semantic-interfaces
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-semantic-interfaces/dbt_semantic_interfaces-${{ version }}.tar.gz
  sha256: 666faeb3306e157e67edf9bfacccb0f4bd0b1a11315bf892029084f8e5fcbbef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click <8.4,>=7.0
    - importlib-metadata <9,>=6.0
    - jinja2 <4,>=3.1.6
    - jsonschema <5,>=4.0
    - more-itertools <11.0,>=8.0
    - pydantic <3,>=1.10
    - python-dateutil <3,>=2.0
    - pyyaml <7,>=6.0
    - typing_extensions <5,>=4.4

tests:
  - python:
      imports:
        - dbt_semantic_interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dbt-semantic-interfaces/
  license: Apache-2.0
  license_file: LICENSE
  summary: The shared semantic layer definitions that dbt-core and MetricFlow use
  description: |
    The shared semantic layer definitions that dbt-core and MetricFlow use

extra:
  recipe-maintainers:
    - thewchan
    - maresb

