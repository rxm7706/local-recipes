# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dbt-semantic-interfaces
  version: "0.10.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dbt_semantic_interfaces-${{ version }}.tar.gz
  sha256: 666faeb3306e157e67edf9bfacccb0f4bd0b1a11315bf892029084f8e5fcbbef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.4,<5
    - pydantic >=1.10,<3
    - jsonschema >=4.0,<5
    - pyyaml >=6.0,<7
    - more-itertools >=8.0,<11.0
    - jinja2 >=3.1.6,<4
    - click >=7.0,<8.4
    - python-dateutil >=2.0,<3
    - importlib-metadata <9,>=6.0
    - typing-extensions >=4.4,<5

tests:
  - python:
      imports:
        - dbt_semantic_interfaces
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The shared semantic layer definitions that dbt-core and MetricFlow use
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dbt-labs/dbt-semantic-interfaces

extra:
  recipe-maintainers:
    - thewchan
    - maresb
