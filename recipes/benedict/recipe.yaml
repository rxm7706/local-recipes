# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: benedict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/BeneDict/BeneDict-${{ version }}.tar.gz
  sha256: e6f66b544393fd628110e79af8854b88aa825606247e28c28decdf010c9d5df3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - benedict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/SurrealAI/BeneDict
  license: GPLv3
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

