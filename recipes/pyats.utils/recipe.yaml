# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats.utils/pyats_utils-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: a46b07206888c4c9d9ec86892bbc49967e6d2c1aff58298145fda8db4ec5e5a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - distro
    - cryptography
    - pyats.datastructures <26.8.0,>=26.7.0
    - pyats.topology <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS Utils: Utilities Module"
  description: |
    pyATS Utils: Utilities Module

extra:
  recipe-maintainers:
    - rxm7706

