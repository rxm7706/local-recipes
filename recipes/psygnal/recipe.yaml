# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.1"

package:
  name: psygnal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/psygnal/psygnal-${{ version }}.tar.gz
  sha256: f64f62dee2306fc1c22050a59b6c6cdad126e04b0cf50e393ff858a1da719096

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.8.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - psygnal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyapp-kit/psygnal
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Fast python callback/event system modeled after Qt Signals
  description: |
    Fast python callback/event system modeled after Qt Signals
  documentation: https://psygnal.readthedocs.io

extra:
  recipe-maintainers:
    - tlambert03

#### CFE metadata AND comments
