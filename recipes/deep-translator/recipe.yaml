# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.4"

package:
  name: deep-translator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deep-translator/deep_translator-${{ version }}.tar.gz
  sha256: 801260c69231138707ea88a0955e484db7d40e210c9e0ae0f77372ffda5f4bf5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - requests

tests:
  - python:
      imports:
        - deep_translator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nidhaloff/deep_translator
  license: MIT
  license_file: LICENSE
  summary: A flexible free and unlimited python tool to translate between different languages in a simple way using multiple translators
  description: |
    A flexible free and unlimited python tool to translate between different languages in a simple way using multiple translators
  repository: https://github.com/nidhaloff/deep_translator
  documentation: https://deep-translator.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
