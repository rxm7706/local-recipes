# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.6"

package:
  name: wrangle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wrangle/wrangle-${{ version }}.tar.gz
  sha256: c05e0eedba718c78082542c6071c93d606e38ed0196291c52a3eadac685f415d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scikit-learn
    - scipy
    - statsmodels >=0.11.0
    - tensorflow

tests:
  - python:
      imports:
        - wrangle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://autonom.io
  license: MIT
  license_file: LICENSE
  summary: Wrangle - Data Preparation for Deep Learning
  description: |
    Wrangle - Data Preparation for Deep Learning

extra:
  recipe-maintainers:
    - rxm7706

