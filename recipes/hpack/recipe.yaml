# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: hpack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hpack/hpack-${{ version }}.tar.gz
  sha256: 0895cfa3b5531fc65fe439c05eb65144f123bf7a394fcaa56aa423548d8e45c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82
    - wheel >=0.46.3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hpack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/hpack/
  license: MIT
  license_file: LICENSE
  summary: Pure-Python HPACK header encoding
  description: |
    Pure-Python HPACK header encoding
  repository: https://github.com/python-hyper/hpack/
  documentation: https://python-hyper.org/

extra:
  recipe-maintainers:
    - primozgodec
    - astaric

#### CFE metadata AND comments
