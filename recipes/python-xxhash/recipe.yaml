# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.0"
  pip_name: xxhash
  name: python-xxhash

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pip_name[0] }}/${{ pip_name }}/${{ pip_name }}-${{ version }}.tar.gz
  sha256: 6cc4eefbb542a5d6ffd6d70ea9c502957c925e800f998c5630ecc809d6702bae

build:
  number: 0
  script:
    - if: unix
      then: export XXHASH_LINK_SO=1
    - if: win
      then: SET XXHASH_LINK_SO=1
    - ${{ PYTHON }} -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=63
    - if: win and match(python, "<3.5")
      then: msinttypes
    - pip
    - xxhash
  run:
    - python
    - xxhash

tests:
  - python:
      imports:
        - xxhash
      pip_check: true

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Python binding for xxHash
  homepage: https://github.com/ifduyue/python-xxhash

extra:
  recipe-maintainers:
    - mariusvniekerk
