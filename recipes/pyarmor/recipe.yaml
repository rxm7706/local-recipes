# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.2.6"

package:
  name: pyarmor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyarmor/pyarmor-${{ version }}.tar.gz
  sha256: 98db8a0bda19ff69153bde06a85e544e297f7479be1159caef42d0cee888a7ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyarmor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dashingsoft/pyarmor
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A tool used to obfuscate python scripts, bind obfuscated scripts to fixed machine or expire obfuscated scripts.
  description: |
    A tool used to obfuscate python scripts, bind obfuscated scripts to fixed machine or expire obfuscated scripts.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
