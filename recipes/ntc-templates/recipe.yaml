# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.2.0"

package:
  name: ntc-templates
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/ntc-templates/ntc_templates-${{ version }}.tar.gz
  sha256: 79fef745d12b6dbdc1f7c00665327790adc91fd981199b0a9adb04f4b365cd97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - textfsm >=1.1.0

tests:
  - python:
      imports:
        - ntc_templates
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ntc-templates.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  summary: TextFSM Templates for Network Devices, and Python wrapper for TextFSM's CliTable.
  description: |
    TextFSM Templates for Network Devices, and Python wrapper for TextFSM's CliTable.
  repository: https://github.com/networktocode/ntc-templates
  documentation: https://ntc-templates.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ntc-templates
  cfe-upstream-registry: pypi
  cfe-upstream-name: ntc-templates
