# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.16.0"

package:
  name: allure-python-commons
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/allure-python-commons/allure_python_commons-${{ version }}.tar.gz
  sha256: ecdc92bafea074bab96b5f2c4eb3100825340188f5aece608ae80eced709b36f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs >=16.0.0
    - pluggy >=0.4.0

tests:
  - python:
      imports:
        - allure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://allurereport.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Contains the API for end users as well as helper functions and classes to build Allure adapters for Python test frameworks
  description: |
    Contains the API for end users as well as helper functions and classes to build Allure adapters for Python test frameworks
  repository: https://github.com/allure-framework/allure-python

extra:
  recipe-maintainers:
    - kenodegard
    - nsoranzo

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: allure-python
