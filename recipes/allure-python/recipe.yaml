# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: allure-python
  version: "2.16.0"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/allure-framework/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 9abc3da20209a89d082fc5f7bd197f5ef7438c2f88a3a4012918ffe6c48e98c4

build:
  number: 0

outputs:
  - package:
      name: allure-python-commons
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - attrs >=16.0.0
        - pluggy >=0.4.0
    tests:
      - python:
          imports:
            - allure
            - allure_commons
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
  - package:
      name: allure-behave
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - behave >=1.2.5
        - ${{ pin_subpackage('allure-python-commons', exact=True) }}
    tests:
      - python:
          imports:
            - allure_behave
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
  - package:
      name: allure-nose2
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - nose2
        - ${{ pin_subpackage('allure-python-commons', exact=True) }}
    tests:
      - python:
          imports:
            - allure_nose2
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
  - package:
      name: allure-pytest
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - pytest >=4.5.0
        - ${{ pin_subpackage('allure-python-commons', exact=True) }}
    tests:
      - python:
          imports:
            - allure_pytest
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
  - package:
      name: allure-pytest-bdd
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - pytest >=4.5.0
        - pytest-bdd >=5.0.0
        - ${{ pin_subpackage('allure-python-commons', exact=True) }}
    tests:
      - python:
          imports:
            - allure_pytest_bdd
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
  - package:
      name: allure-robotframework
    build:
      noarch: python
      script:
        file: install.sh
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >=${{ python_min }}
        - robotframework
        - ${{ pin_subpackage('allure-python-commons', exact=True) }}
    tests:
      - python:
          imports:
            - AllureLibrary
            - allure_robotframework
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Allure integrations for Python test frameworks
  homepage: https://github.com/allure-framework/allure-python

extra:
  recipe-maintainers:
    - kenodegard
    - nsoranzo
