    - pkg:pypi/allure-python-commons@${{ version }}
  cfe-upstream-repo: https://github.com/allure-framework/allure-python
  cfe-upstream-homepage: https://allurereport.org/
  cfe-import-names: [allure]
  cfe-source-kind: pypi-sdist
