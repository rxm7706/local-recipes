# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.5"

package:
  name: e
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/e/e-${{ version }}.tar.gz
  sha256: 1ce64149fd260237e8f53d5b4863466875594e77341ec47d340c0d2c6d3b5942

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - e
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: UNKNOWN
  license_file: LICENSE
  summary: Evaluate and display command line expressions with
        python -me expr
  description: |
    Evaluate and display command line expressions with
        python -me expr

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
