# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"
  python_min: "3.12"

package:
  name: pymqrest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymqrest/pymqrest-${{ version }}.tar.gz
  sha256: 7043f21373d4080f69a107170cc8ab4381706a69e8b2f7dc271921502b69aeec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - pymqrest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wphillipmoore/mq-rest-admin-python
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python wrapper for the IBM MQ REST API
  description: |
    Python wrapper for the IBM MQ REST API
  repository: https://github.com/wphillipmoore/mq-rest-admin-python
  documentation: https://wphillipmoore.github.io/mq-rest-admin-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
