# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.7"

package:
  name: nose
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nose/nose-${{ version }}.tar.gz
  sha256: f1bffef9cbc82628f6e7d7b40d7e255aefaa1adb6a1b1d26c69a8b79e6208a98

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nose
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://readthedocs.org/docs/nose/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: nose extends unittest to make testing easier
  description: |
    nose extends unittest to make testing easier

extra:
  recipe-maintainers:
    - mariusvniekerk
    - jakirkham
    - msarahan
    - scopatz
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nose
  cfe-upstream-registry: pypi
  cfe-upstream-name: nose
  cfe-purls:
    - pkg:conda/nose@${{ version }}?channel=conda-forge
    - pkg:pypi/nose@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://readthedocs.org/docs/nose/
  cfe-import-names: [nose]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/nose-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3.7

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T02:03:23Z
