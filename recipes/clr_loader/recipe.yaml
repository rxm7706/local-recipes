# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: clr_loader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clr_loader/clr_loader-${{ version }}.tar.gz
  sha256: 2e073e9aaf49d1ae2f56ecba27987ad5fb68be4bcd9dd34a5bed8f0e4e128366

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
  run:
    - python >=${{ python_min }}
    - cffi >=1.17

tests:
  - python:
      imports:
        - clr_loader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/clr_loader/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Generic pure Python loader for .NET runtimes
  description: |
    Generic pure Python loader for .NET runtimes
  documentation: https://pythonnet.github.io/clr-loader/

extra:
  recipe-maintainers:
    - m-rossi

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clr_loader
  cfe-upstream-registry: pypi
  cfe-upstream-name: clr-loader
