    - pkg:pypi/clr-loader@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/clr_loader/
  cfe-import-names: [clr_loader]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/clr_loader-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.3.1

  cfe-forge-blocker-list:
