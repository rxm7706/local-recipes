{% set name = "cucumber-expressions" %}
{% set version = "20.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cucumber_expressions-{{ version }}.tar.gz
  sha256: 0d216ec26e36c71b3e5643f2e72c41f9b266ef04eaa0c7e47a6e3b2caf523b1a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.9.0,<0.10.0
    - pip
  run:
    - python >={{ python_min }},<4.0

test:
  imports:
    - cucumber_expressions
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cucumber/cucumber-expressions
  summary: Cucumber Expressions - a simpler alternative to Regular Expressions
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
