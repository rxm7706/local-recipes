# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.8.4"

package:
  name: python3-ldap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-ldap/python3-ldap-${{ version }}.tar.gz
  sha256: f18a0e64f717a60f3bfb74b83a3298830efff0860d90d21619e158a90f9e9494

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ldap3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cannatag/ldap3
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: project renamed ldap3 - please install the ldap3 package instead of python3-ldap
  description: |
    project renamed ldap3 - please install the ldap3 package instead of python3-ldap

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
