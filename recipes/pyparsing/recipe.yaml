# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.2"

package:
  name: pyparsing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyparsing/pyparsing-${{ version }}.tar.gz
  sha256: c777f4d763f140633dcb6d8a3eda953bf7a214dc4eff598413c070bcdc117cbc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyparsing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyparsing/pyparsing/
  license: MIT
  license_file: LICENSE
  summary: pyparsing - Classes and methods to define and execute parsing grammars
  description: |
    pyparsing - Classes and methods to define and execute parsing grammars
  repository: https://github.com/pyparsing/pyparsing.git
  documentation: https://pyparsing-docs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
    - msarahan
    - ocefpaf
    - jan-janssen

