# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.28.3"

package:
  name: proto-plus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/proto-plus/proto_plus-${{ version }}.tar.gz
  sha256: 5f91b30dafa6bb38d432c5557a6ee1d35ffd40b4b1e0e3ca27260448560b91d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - proto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/proto-plus
  license: Apache-2.0
  license_file: LICENSE
  summary: Beautiful, Pythonic protocol buffers
  description: |
    Beautiful, Pythonic protocol buffers
  repository: https://github.com/googleapis/google-cloud-python
  documentation: https://googleapis.dev/python/proto-plus/latest/

extra:
  recipe-maintainers:
    - xylar
    - tswast

