# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: click-spinner
  version: "0.1.10"
  sha256: 87eacf9d7298973a25d7615ef57d4782aebf913a532bba4b28a37e366e975daf

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - click_spinner
      pip_check: false
  - files:
      source:
        - tests
    requirements:
      run:
        - click
        - pytest
        - six
    script:
      - pytest tests

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Show that your command line app is active
  description: |
    Sometimes you would just like to show the user some progress, but a
    progress bar is not suitable because you don’t know how much longer it
    would take. In these cases you might want to display a simple spinner
    using the spinner() function.
  homepage: https://github.com/click-contrib/click-spinner
  repository: https://github.com/click-contrib/click-spinner

extra:
  recipe-maintainers:
    - astamminger
