    - pkg:pypi/shodan@${{ version }}
  cfe-upstream-repo: https://github.com/achillean/shodan-python
  cfe-upstream-homepage: https://github.com/achillean/shodan-python
  cfe-import-names: [shodan]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
