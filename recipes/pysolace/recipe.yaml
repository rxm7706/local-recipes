# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.53"

package:
  name: pysolace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pysolace/pysolace-0.9.53-cp310-cp310-macosx_10_15_x86_64.whl
  sha256: 21b83c02a013110d727cd6781747e16b4d4de8341f3c9ba005fe86008dfdc0ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - loguru >=0.6.0
    - msgpack >=1.0.3
    - orjson >=3.3.1
    - typer >=0.10.0

tests:
  - python:
      imports:
        - pysolace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yvictor/pysolace
  license: MIT
  license_file: LICENSE
  summary: Python client library for Solace PubSub+ event broker, enabling easy integration for messaging applications.
  description: |
    Python client library for Solace PubSub+ event broker, enabling easy integration for messaging applications.
  repository: https://github.com/yvictor/pysolace

extra:
  recipe-maintainers:
    - rxm7706

