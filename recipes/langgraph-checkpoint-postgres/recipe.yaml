# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.2"

package:
  name: langgraph-checkpoint-postgres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-checkpoint-postgres/langgraph_checkpoint_postgres-${{ version }}.tar.gz
  sha256: 1cd404803ff895a2b79f3ac04ce92b775e6b999715f8333fce674c6d927bba95

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langgraph-checkpoint <5.0.0,>=4.1.0
    - orjson >=3.11.5
    - psycopg-pool >=3.2.0
    - psycopg >=3.2.0

tests:
  - python:
      imports:
        - langgraph.store.postgres
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-checkpoint-postgres/
  license: MIT
  license_file: LICENSE
  summary: Library with a Postgres implementation of LangGraph checkpoint saver.
  description: |
    Library with a Postgres implementation of LangGraph checkpoint saver.
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-postgres

extra:
  recipe-maintainers:
    - rxm7706

