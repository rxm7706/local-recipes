# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.0.0"

package:
  name: py-cpuinfo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-cpuinfo/py-cpuinfo-${{ version }}.tar.gz
  sha256: 3cdbbf3fac90dc6f118bfd64384f309edeadd902d7c8fb17f02ffa1fc3f49690

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cpuinfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/workhorsy/py-cpuinfo
  license: MIT
  license_file: LICENSE
  summary: Get CPU info with pure Python
  description: |
    Get CPU info with pure Python

extra:
  recipe-maintainers:
    - mstimberg

