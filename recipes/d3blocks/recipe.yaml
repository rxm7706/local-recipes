# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: d3blocks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/d3blocks/d3blocks-${{ version }}.tar.gz
  sha256: 510d2a443f6c9bf47e75739357a69d0eb9be2436f2f68e3801dd9d85a801cadb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - colourmap >=1.1.10
    - datazets >=0.1.7
    - d3graph >=3.0.0
    - ismember >=1.0.1
    - pandas
    - tqdm
    - requests
    - jinja2

tests:
  - python:
      imports:
        - d3blocks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://erdogant.github.io/d3blocks
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Python package d3blocks.
  description: |
    Python package d3blocks.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
