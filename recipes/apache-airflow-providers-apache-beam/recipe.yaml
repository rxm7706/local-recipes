# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.3"

package:
  name: apache-airflow-providers-apache-beam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-apache-beam/apache_airflow_providers_apache_beam-${{ version }}.tar.gz
  sha256: fe88b2bf9591c6fc66ad2d0a270190cd781847809dd6af630f36ee954bb99e67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.12.0
    - apache-beam >=2.69.0
    - pyarrow >=16.1.0
    - numpy >=1.22.4

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-apache-beam/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-apache-beam for Apache Airflow
  description: |
    Provider package apache-airflow-providers-apache-beam for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-apache-beam/6.2.3

extra:
  recipe-maintainers:
    - xylar

