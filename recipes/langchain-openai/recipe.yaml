# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: langchain-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-openai/langchain_openai-${{ version }}.tar.gz
  sha256: e7100c89a6180e3fdf8d02b29a0f2b6c532da91428fc1b57aa93ebbc8acc0ce9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - certifi >=2024.6.2
    - langchain-core <2.0.0,>=1.5.4
    - openai <4.0.0,>=2.45.0
    - tiktoken <1.0.0,>=0.7.0

tests:
  - python:
      imports:
        - langchain_openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/oss/python/integrations/providers/openai
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting OpenAI and LangChain
  description: |
    An integration package connecting OpenAI and LangChain
  repository: https://github.com/langchain-ai/langchain
  documentation: https://reference.langchain.com/python/integrations/langchain_openai/

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
    - raybellwaves

