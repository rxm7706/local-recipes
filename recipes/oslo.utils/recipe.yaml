# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: oslo.utils
  version: "10.1.1"
  bundle: tar.gz
  hash: c8ac3ee295303cc5776c4d8e1d4ef10078ece60ede4931177e4f07aca58f81ab

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/61/16/8cb5305abd34606bd9a5ee1c6fbe5db97981d323c8454f1d872c1781dcc8/oslo_utils-${{ version }}.tar.gz
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pbr !=2.1.0,>=2.0.0
  run:
    - python >=${{ python_min }}
    - iso8601 >=0.1.11
    - oslo.i18n >=3.15.3
    - netaddr >=0.10.0
    - debtcollector >=1.2.0
    - pyparsing >=2.1.0
    - packaging >=20.4
    - python-tzdata >=2022.4
    - PyYAML >=3.13
    - psutil >=3.2.2

tests:
  - python:
      imports:
        - oslo_utils
        - oslo_utils.encodeutils
        - oslo_utils.eventletutils
        - oslo_utils.excutils
        - oslo_utils.fileutils
        - oslo_utils.importutils
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE
  license: Apache-2.0
  summary: Support for common utility type functions, such as encoding, exception handling, string manipulation, and time handling.
  homepage: https://docs.openstack.org/developer/oslo.utils/
  repository: https://git.openstack.org/cgit/openstack/oslo.utils
  documentation: https://docs.openstack.org/developer/oslo.utils/

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj
