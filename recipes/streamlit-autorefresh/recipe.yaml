# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: streamlit-autorefresh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-autorefresh/streamlit-autorefresh-${{ version }}.tar.gz
  sha256: a89abf23f2c4e52d37be442115cd5566b41f382e3c09ff08817e17a25f50b8ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_autorefresh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kmcgrady/streamlit-autorefresh
  license: MIT
  license_file: LICENSE
  summary: Simple way to autorefresh your Streamlit apps
  description: |
    Simple way to autorefresh your Streamlit apps

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
