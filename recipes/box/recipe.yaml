# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: box
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/box/box-${{ version }}.tar.gz
  sha256: 3255adae67d2edd0ea864b97fa6cd6342d1a8403380b0024446f5dd647540396

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.8.1
    - columnar ==1.3.1
    - executing ==0.8.2
    - loguru
    - python-dateutil ==2.8.2
    - timeago ==1.0.14

tests:
  - python:
      imports:
        - box
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/box/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: box
  cfe-upstream-registry: pypi
  cfe-upstream-name: box
  cfe-purls:
    - pkg:conda/box@${{ version }}?channel=conda-forge
    - pkg:pypi/box@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/box/
  cfe-upstream-homepage: https://pypi.org/project/box/
  cfe-import-names: [box]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
