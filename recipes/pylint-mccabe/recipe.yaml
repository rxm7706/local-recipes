# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: pylint-mccabe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-mccabe/pylint-mccabe-${{ version }}.tar.gz
  sha256: f3628affbc6064c08477243915f6752f3ef59fb82803b00be92f30d0ef7bbf29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pylint
    - mccabe

tests:
  - python:
      imports:
        - pylint_mccabe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/pylint-mccabe/
  license: MIT
  license_file: LICENSE
  summary: McCabe complexity checker as a PyLint plugin
  description: |
    McCabe complexity checker as a PyLint plugin

extra:
  recipe-maintainers:
    - rxm7706

