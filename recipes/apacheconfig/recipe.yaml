# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: apacheconfig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apacheconfig/apacheconfig-${{ version }}.tar.gz
  sha256: c53204f37bb010cfd88d05d65ef579b4627aa76c8ec6db726243bc63dc90bb70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ply
    - six

tests:
  - python:
      imports:
        - apacheconfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/etingof/apacheconfig
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Apache config file parser
  description: |
    Apache config file parser

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: apacheconfig
  cfe-upstream-registry: pypi
  cfe-upstream-name: apacheconfig
