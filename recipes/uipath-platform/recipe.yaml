# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.18"
  python_min: "3.11"

package:
  name: uipath-platform
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uipath-platform/uipath_platform-${{ version }}.tar.gz
  sha256: 8449c3486a82b00928094ed85974771f2e772047ab95d50dce19d55360da9a1a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio >=4.0.0
    - httpx >=0.28.1
    - pydantic-function-models >=0.1.11
    - sqlparse >=0.5.5
    - tenacity >=9.0.0
    - truststore >=0.10.1
    - uipath-core <0.6.0,>=0.5.30

tests:
  - python:
      imports:
        - uipath.platform
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uipath.com
  license: MIT
  license_file: LICENSE
  summary: HTTP client library for programmatic access to UiPath Platform
  description: |
    HTTP client library for programmatic access to UiPath Platform
  repository: https://github.com/UiPath/uipath-python
  documentation: https://uipath.github.io/uipath-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: uipath-platform
