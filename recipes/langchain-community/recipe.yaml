# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-community
  version: "0.4.2"
  build: 0
  python_max: '",<3.12a0" if python_min == "3.10" else ""'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_community-${{ version }}.tar.gz
  sha256: a99308160d53d7e9b5965ee665e5173709914338210089fd5788ad724432c21e

build:
  number: ${{ build }}
  string: pymin${{ python_min|replace('.', '') }}_h${{ PKG_HASH }}_${{ build }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - langchain-classic >=1.0.7,<2.0.0
    - python >=${{ python_min }}${{ python_max }}
    - langchain-core >=1.4.0,<2.0.0
    - sqlalchemy >=1.4.0,<3.0.0
    - requests >=2.32.5,<3.0.0
    - pyyaml >=5.3.0,<7.0.0
    - numpy >=1.26.2
    - aiohttp >=3.8.3,<4.0.0
    - tenacity !=8.4.0,>=8.1.0,<10.0.0
    - pydantic-settings >=2.10.1,<3.0.0
    - langsmith >=0.1.125,<1.0.0
    - httpx-sse >=0.4.0,<1.0.0

tests:
  - python:
      imports:
        - langchain_community
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Community contributed LangChain integrations.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain
  repository: https://github.com/langchain-ai/langchain/tree/master/libs/community
  documentation: https://api.python.langchain.com/en/stable/community_api_reference.html

extra:
  recipe-maintainers:
    - dlqqq
    - 3coins
    - pavelzw
    - hinthornw
    - baskaryan
    - hwchase17
    - ccurme
    - sydney-runkle
    - agola11
    - jan-janssen
