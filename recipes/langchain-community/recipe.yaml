# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: langchain-community
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-community/langchain_community-${{ version }}.tar.gz
  sha256: a99308160d53d7e9b5965ee665e5173709914338210089fd5788ad724432c21e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp <4.0.0,>=3.8.3
    - httpx-sse <1.0.0,>=0.4.0
    - langchain-classic <2.0.0,>=1.0.7
    - langchain-core <2.0.0,>=1.4.0
    - langsmith <1.0.0,>=0.1.125
    - numpy >=1.26.2
    - pydantic-settings <3.0.0,>=2.10.1
    - pyyaml <7.0.0,>=5.3.0
    - requests <3.0.0,>=2.32.5
    - sqlalchemy <3.0.0,>=1.4.0
    - tenacity !=8.4.0,<10.0.0,>=8.1.0

tests:
  - python:
      imports:
        - langchain_community
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Community contributed LangChain integrations.
  description: |
    Community contributed LangChain integrations.
  repository: https://github.com/langchain-ai/langchain-community/tree/main/libs/community
  documentation: https://reference.langchain.com/python/langchain_community/

extra:
  recipe-maintainers:
    - dlqqq
    - 3coins
    - pavelzw
    - hinthornw
    - baskaryan
    - hwchase17
    - ccurme
    - sydney-runkle
    - agola11
    - jan-janssen

