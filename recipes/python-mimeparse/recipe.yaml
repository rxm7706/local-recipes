# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: python-mimeparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-mimeparse/python_mimeparse-${{ version }}.tar.gz
  sha256: 5b9a9dcf7aa82465e31bd667f5cb7000604811dce83554f1c8a43693a32cb303

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=47
    - wheel >=0.34
  run:
    - python >=${{ python_min }}
    - python-mimeparse

tests:
  - python:
      imports:
        - python_mimeparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/falconry/python-mimeparse
  license: MIT
  license_file: LICENSE
  summary: A module provides basic functions for parsing mime-type names and matching them against a list of media-ranges.
  description: |
    A module provides basic functions for parsing mime-type names and matching them against a list of media-ranges.

extra:
  recipe-maintainers:
    - MementoRC
    - anguslees
    - pmlandwehr

