# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.post12"

package:
  name: sklearn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sklearn/sklearn-${{ version }}.tar.gz
  sha256: 54cff9e20839b7b202321178228af4d9388bedf78425d9299fd9ee170d68802e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sklearn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sklearn/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: deprecated sklearn package, use scikit-learn instead
  description: |
    deprecated sklearn package, use scikit-learn instead

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
