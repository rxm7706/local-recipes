# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.0"

package:
  name: tensorflow-decision-forests
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/decision-forests/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6b957ec79ac02e093c7fe9cb93e65701f35bb001c871f0edff5b2b6d41f34627

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - tensorflow ==2.19.0
    - six
    - absl-py
    - wheel
    - wurlitzer
    - tf-keras ~=2.19
    - ydf >=0.11.0

tests:
  - python:
      imports:
        - tensorflow_decision_forests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tensorflow/decision-forests
  license: Apache-2.0
  license_file: LICENSE
  summary: Collection of training and inference decision forest algorithms.
  description: |
    Collection of training and inference decision forest algorithms.

extra:
  recipe-maintainers:
    - rxm7706

