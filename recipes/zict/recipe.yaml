# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: zict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zict/zict-${{ version }}.tar.gz
  sha256: e321e263b6a97aafc0790c3cfb3c04656b7066e6738c37fffcca95d803c9fba5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://zict.readthedocs.io/en/latest/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Mutable mapping tools
  description: |
    Mutable mapping tools

extra:
  recipe-maintainers:
    - mrocklin
    - jrbourbeau

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zict
  cfe-upstream-registry: pypi
  cfe-upstream-name: zict
  cfe-purls:
    - pkg:conda/zict@${{ version }}?channel=conda-forge
    - pkg:pypi/zict@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://zict.readthedocs.io/en/latest/
  cfe-import-names: [zict]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/zict-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-3.0.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T07:30:35Z
