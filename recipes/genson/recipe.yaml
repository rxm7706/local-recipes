# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: genson
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/genson/genson-${{ version }}.tar.gz
  sha256: bc7f1c1bae87a21ca44d81149aec95a3f4468d676de9b8b08caa064f3c50b3da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=44
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - genson
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wolverdude/genson/
  license: MIT
  license_file: LICENSE
  summary: GenSON is a powerful, user-friendly JSON Schema generator.
  description: |
    GenSON is a powerful, user-friendly JSON Schema generator.

extra:
  recipe-maintainers:
    - pmlandwehr
    - fhoehle

#### CFE metadata AND comments
