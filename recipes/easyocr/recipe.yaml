# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: easyocr
  version: "1.7.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/jaidedai/easyocr/archive/v${{ version }}.tar.gz
  sha256: 1c20356483964c7c80ccf86f2a0957cfed47768e9bbc99b9ff2eb47cb9cb1448
  patches:
    - 0001-remove-ninja-requirement.patch

build:
  number: 0
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - easyocr= easyocr.cli:main

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - ${{ compiler('cxx') }}
    - if: linux
      then: ${{ cdt('mesa-libgl-devel') }}
    - if: linux
      then: ${{ cdt('mesa-dri-drivers') }}
    - if: linux
      then: ${{ cdt('libselinux') }}
    - if: linux
      then: ${{ cdt('libxdamage') }}
    - if: linux
      then: ${{ cdt('libxxf86vm') }}
    - if: linux
      then: ${{ cdt('libxext') }}
    - pip
    - python
    - setuptools
  run:
    - ninja
    - numpy
    - pillow
    - python-bidi
    - py-opencv
    - pyclipper
    - python
    - pytorch
    - pyyaml
    - scikit-image
    - scipy
    - shapely
    - torchvision >=0.5
    - ninja

tests:
  - python:
      imports:
        - easyocr
      pip_check: true
  - requirements:
      run:
        - if: linux
          then: libopencv *=headless*
        - pip
    script:
      - easyocr --help

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Ready-to-use OCR with 80+ supported languages and popular writing scripts.
  homepage: https://www.jaided.ai/
  repository: https://github.com/jaidedai/easyocr
  documentation: https://www.jaided.ai/easyocr/documentation/

extra:
  recipe-maintainers:
    - thewchan
