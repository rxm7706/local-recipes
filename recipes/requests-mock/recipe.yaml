# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1"

package:
  name: requests-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-mock/requests-mock-${{ version }}.tar.gz
  sha256: e9e12e333b525156e82a3c852f22016b9158220d2f47454de9cae8a77d371401

build:
  number: 1
  noarch: python
  script: python -m pip install . --no-deps --ignore-installed

requirements:
  host:
    - setuptools
    - setuptools-scm
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - requests >=2.22,<3

tests:
  - python:
      imports:
        - requests_mock
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: requests-mock provides a building block to stub out the HTTP requests portions of your testing code.
  description: requests-mock provides a building block to stub out the HTTP requests portions of your testing code.
  homepage: https://github.com/jamielennox/requests-mock
  documentation: https://requests-mock.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nicoddemus
