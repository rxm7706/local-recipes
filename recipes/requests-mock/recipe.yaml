# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1"

package:
  name: requests-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-mock/requests-mock-${{ version }}.tar.gz
  sha256: e9e12e333b525156e82a3c852f22016b9158220d2f47454de9cae8a77d371401

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=56
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.22

tests:
  - python:
      imports:
        - requests_mock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://requests-mock.readthedocs.io/
  license: Apache-2
  license_file: LICENSE
  summary: Mock out responses from the requests package
  description: |
    Mock out responses from the requests package
  repository: https://github.com/jamielennox/requests-mock

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
