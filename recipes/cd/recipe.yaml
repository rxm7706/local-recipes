# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: cd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/CD/CD-1.1.0.zip
  sha256: 8afb77a3d873ff182d57e27f0e0b332a5914adbe5f0a25f5dea4584f35137424

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.headfristlabs.com
  license: UNKNOWN
  license_file: LICENSE
  summary: A simple printer of nester lists
  description: |
    A simple printer of nester lists

extra:
  recipe-maintainers:
    - rxm7706

