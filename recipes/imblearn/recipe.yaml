# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0"

package:
  name: imblearn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imblearn/imblearn-${{ version }}.tar.gz
  sha256: d8fbb662919c1b16f438ad91a8256220e53bcf6815c9ad5502c518b798de34f2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imblearn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/imbalanced-learn/
  license: MIT
  license_file: LICENSE
  summary: Toolbox for imbalanced dataset in machine learning.
  description: |
    Toolbox for imbalanced dataset in machine learning.

extra:
  recipe-maintainers:
    - rxm7706

