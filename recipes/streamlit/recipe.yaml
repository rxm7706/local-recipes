# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.61.1"

package:
  name: streamlit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit/streamlit-${{ version }}.tar.gz
  sha256: 68acf1ff1b6005b19205c2777d832deea0c1edd6fbbf7f43f091b96220e5e35f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.5.1
    - wheel
  run:
    - python >=${{ python_min }}
    - altair !=5.4.0,!=5.4.1,<7,>=5.0.0
    - blinker <2,>=1.5.0
    - click <9,>=7.0
    - numpy <3,>=1.23
    - packaging >=20
    - pandas <4,>=1.4.0
    - pillow <13,>=7.1.0
    - pydeck <1,>=0.8.0b4
    - protobuf <8,>=5.26.1
    - pyarrow <25,>=7.0
    - requests <3,>=2.27
    - tenacity <10,>=8.1.0
    - toml <2,>=0.10.1
    - typing_extensions <5,>=4.10.0
    - starlette <1.4.0,>=0.46.0
    - uvicorn <1,>=0.30.0
    - httptools <1,>=0.6.3
    - anyio <5,>=4.0.0
    - python-multipart <1,>=0.0.10
    - websockets <17,>=12.0.0
    - itsdangerous <3,>=2.1.2

tests:
  - python:
      imports:
        - streamlit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://streamlit.io
  license: Apache-2.0
  license_file: LICENSE
  summary: A faster way to build and share data apps
  description: |
    A faster way to build and share data apps
  repository: https://github.com/streamlit/streamlit
  documentation: https://docs.streamlit.io/

extra:
  recipe-maintainers:
    - vdonato
    - raybellwaves
    - kmcgrady
    - jroes
    - xhochy
    - lukasmasuch
    - mayagbarnes
    - raethlein
    - sfc-gh-bnisco
    - sfc-gh-lwilby
    - sfc-gh-nbellante

