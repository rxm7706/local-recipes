# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: streamlit-audiorec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-audiorec/streamlit-audiorec-${{ version }}.tar.gz
  sha256: 0d1bf9490a7cd2c90529262f309a59fa566f0b2e83eecf03f26e5c42d241eb51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - st_audiorec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stefanrmmr/streamlit-audio-recorder
  license: MIT
  license_file: LICENSE
  summary: "Record audio from the user's microphone in apps that are deployed to the web. (via Browser Media-API) [GitHub ☆ 160+: steamlit-audio-recorder]"
  description: |
    Record audio from the user's microphone in apps that are deployed to the web. (via Browser Media-API) [GitHub ☆ 160+: steamlit-audio-recorder]

extra:
  recipe-maintainers:
    - rxm7706

