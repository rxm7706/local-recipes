# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: confluent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/confluent/confluent-${{ version }}.tar.gz
  sha256: 6f740ded9d6fc1c30fbd706138803fde5c10c5521245ba7316e99ba44bc50814

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0.1
    - schema >=0.7.5

tests:
  - python:
      imports:
        - confluent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/monstermichl/confluent.git
  license: MIT
  license_file: LICENSE
  summary: confluent keeps your language specific configs in sync
  description: |
    confluent keeps your language specific configs in sync

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: confluent
  cfe-upstream-registry: pypi
  cfe-upstream-name: confluent
  cfe-purls:
