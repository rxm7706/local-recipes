    - pkg:pypi/confluent@${{ version }}
  cfe-upstream-repo: https://github.com/monstermichl/confluent.git
  cfe-upstream-homepage: https://github.com/monstermichl/confluent.git
  cfe-import-names: [confluent]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
