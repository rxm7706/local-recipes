# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: bitmap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bitmap/bitmap-${{ version }}.tar.gz
  sha256: e7fb8fcdade2223348132c108619f93178b563f584ed552aa5d3c6f946958a2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - future

tests:
  - python:
      imports:
        - bitmap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wanji/bitmap
  license: MIT
  license_file: LICENSE
  summary: .
  description: |
    .

extra:
  recipe-maintainers:
    - rxm7706

