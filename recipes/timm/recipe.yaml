# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.28"

package:
  name: timm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/timm/timm-${{ version }}.tar.gz
  sha256: 3789d313fdd5541a327b60180d70dbb4bdec73db8ff0655e413db3c3d134a9a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - pytorch
    - torchvision
    - pyyaml
    - huggingface-hub
    - safetensors

tests:
  - python:
      imports:
        - timm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/pytorch-image-models
  license: Apache-2.0
  license_file: LICENSE
  summary: PyTorch Image Models
  description: |
    PyTorch Image Models
  documentation: https://huggingface.co/docs/timm/en/index

extra:
  recipe-maintainers:
    - deepsworld
    - ndmaxar
    - oblute
    - rluria14
    - thewchan

