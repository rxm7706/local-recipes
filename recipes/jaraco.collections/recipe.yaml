# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.1"

package:
  name: jaraco.collections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jaraco.collections/jaraco_collections-${{ version }}.tar.gz
  sha256: dab81970bad6f0ab53b20745f1b01da37926e4c0fcd425046aa45e0d8efa18ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - jaraco.text

tests:
  - python:
      imports:
        - jaraco.collections
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jaraco.collections/
  license: MIT
  license_file: LICENSE
  summary: Collection objects similar to those in stdlib by jaraco
  description: |
    Collection objects similar to those in stdlib by jaraco
  repository: https://github.com/jaraco/jaraco.collections

extra:
  recipe-maintainers:
    - carlodri

