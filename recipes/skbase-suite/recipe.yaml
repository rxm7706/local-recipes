# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: scikit-base
  version: "1.1.0"

recipe:
  name: ${{ name|lower }}-suite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 568195e85a695762ca522e477971f86c835760335b959b1c22d958d1d5277de6

build:
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

outputs:
  - package:
      name: ${{ name|lower }}
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-index --no-compile
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - setuptools
      run:
        - python >=${{ python_min }},<3.15
    tests:
      - python:
          imports:
            - skbase
            - skbase.base
            - skbase.lookup
            - skbase.testing
            - skbase.validate
          pip_check: true
          python_version: ${{ python_min }}
  - package:
      name: ${{ name|lower }}-all-extras
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - python >=${{ python_min }},<3.15
        - ${{ pin_subpackage("scikit-base", exact=True) }}
        - pandas
        - numpy
    tests:
      - python:
          imports:
            - skbase
            - skbase.base
            - skbase.lookup
            - skbase.testing
            - skbase.validate
          pip_check: true
          python_version: ${{ python_min }}

about:
  summary: Base classes for sklearn-like parametric objects
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/sktime/skbase
  repository: https://github.com/sktime/skbase
  documentation: https://skbase.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mcre-be
    - dhirschfeld
    - yarnabrina
    - fkiraly
