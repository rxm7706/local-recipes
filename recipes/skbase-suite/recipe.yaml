# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: scikit-base
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scikit-base/scikit_base-${{ version }}.tar.gz
  sha256: 568195e85a695762ca522e477971f86c835760335b959b1c22d958d1d5277de6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >61
    - wheel
    - toml
    - python-build
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - skbase
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sktime/skbase
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Base classes for sklearn-like parametric objects
  description: |
    Base classes for sklearn-like parametric objects
  documentation: https://github.com/sktime/skbase

extra:
  recipe-maintainers:
    - mcre-be
    - dhirschfeld
    - yarnabrina
    - fkiraly

