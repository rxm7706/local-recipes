# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.1"

package:
  name: pydata-google-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydata-google-auth/pydata-google-auth-${{ version }}.tar.gz
  sha256: 0a51ce41c601ca0bc69b8795bf58bedff74b4a6a007c9106c7cbcdec00eaced2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - google-auth <3.0dev,>=1.25.0
    - google-auth-oauthlib >=0.4.0

tests:
  - python:
      imports:
        - pydata_google_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydata/pydata-google-auth
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: PyData helpers for authenticating to Google APIs
  description: |
    PyData helpers for authenticating to Google APIs

extra:
  recipe-maintainers:
    - leahecole
    - chalmerlowe
    - tswast

#### CFE metadata AND comments
