# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydata-google-auth
  version: "1.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pydata-google-auth-${{ version }}.tar.gz
  sha256: 0a51ce41c601ca0bc69b8795bf58bedff74b4a6a007c9106c7cbcdec00eaced2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - google-auth >=1.25.0,<3.0
    - google-auth-oauthlib >=0.4.0

tests:
  - python:
      imports:
        - pydata_google_auth
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Helpers for authenticating to Google APIs from Python.
  description: |
    pydata-google-auth adds helpers to authenticate with end-user credentials
    to Google APIs from Python. It wraps the official google-auth and
    google-auth-oauthlib libraries.
  homepage: https://github.com/pydata/pydata-google-auth
  repository: https://github.com/pydata/pydata-google-auth
  documentation: http://pydata-google-auth.readthedocs.io/

extra:
  recipe-maintainers:
    - leahecole
    - chalmerlowe
    - tswast
