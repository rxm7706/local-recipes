# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: openfeature-flagd-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openfeature-flagd-api/openfeature_flagd_api-${{ version }}.tar.gz
  sha256: 58d481c0e4bf806ca94a67e12457a8d1823cf772c1801ce20f50d011d8764b5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build ~=0.9.0
  run:
    - python >=${{ python_min }}
    - openfeature-sdk >=0.8.2

tests:
  - python:
      imports:
        - openfeature.contrib.tools.flagd.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-feature/python-sdk-contrib
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenFeature flagd evaluator API definition
  description: |
    OpenFeature flagd evaluator API definition

extra:
  recipe-maintainers:
    - rxm7706

