# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: jupter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupter/jupter-${{ version }}.tar.gz
  sha256: 77a65c7e7fbc168d0e06885bdb0025eacf725eb0d7cc8e5ab169b18e482fb9b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - my_package
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jupter/
  license: MIT
  license_file: LICENSE
  summary: A package with useful functions like nothing
  description: |
    A package with useful functions like nothing

extra:
  recipe-maintainers:
    - rxm7706

