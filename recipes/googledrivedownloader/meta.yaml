{% set name = "googledrivedownloader" %}
{% set version = "1.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 100920eb4e9069b48bc2f0445edf2ebc52814bc8d410385d0b2c902cad64cc9b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - requests

test:
  imports:
    - googledrivedownloader
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://pypi.org/project/googledrivedownloader/
  summary: Minimal class to download shared files from Google Drive.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - ndmaxar
    - oblute
    - davide-f
