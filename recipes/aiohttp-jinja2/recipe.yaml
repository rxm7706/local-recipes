# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aiohttp-jinja2
  version: "1.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a3a7ff5264e5bca52e8ae547bbfd0761b72495230d438d05b6c0915be619b0e2

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.9.0
    - jinja2 >=3.0.0

tests:
  - python:
      imports:
        - aiohttp_jinja2
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: jinja2 template renderer for aiohttp.web (http server for asyncio)
  homepage: https://github.com/aio-libs/aiohttp-jinja2/
  documentation: http://aiohttp-jinja2.readthedocs.org/

extra:
  recipe-maintainers:
    - apmorton
    - epruesse
