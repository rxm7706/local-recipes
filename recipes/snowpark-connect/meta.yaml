{% set name = "snowpark-connect" %}
{% set version = "1.36.0" %}
{% set python_min = "3.10" %}
{% set python_max = "3.13" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/snowpark_connect-{{ version }}.tar.gz
  sha256: 96b5bb9245bc59d2c182f650f4d80e16b5fa9a37523a699eb0639934eb087ed4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }},<{{ python_max }}
    - snowpark-connect-deps-1 ==3.56.6
    - snowpark-connect-deps-2 ==3.56.6
    - certifi >=2025.1.31
    - cloudpickle
    - fsspec
    - jpype1 !=1.7.0,!=1.7.1
    - protobuf >=3.20.2,<6.34
    - s3fs >=2025.3.0
    - snowflake.core >=1.0.5,<2
    - snowflake-snowpark-python >=1.53.0,<1.54.0
    - snowflake-connector-python >=3.18.0
    - sqlglot >=26.3.8
    - aiobotocore >=2.23.0,<4
    - py4j >=0.10.9.7,<0.10.10.0
    - pandas >=1.0.5,<3.0
    - pyarrow >=14.0.1,<15.0.0|>=23.0.1,<25.0.0
    - grpcio >=1.48.2,<=1.78.0
    - grpcio-status >=1.41.1,<=1.78.0
    - googleapis-common-protos >=1.56.4
    - numpy >=1.15
    - gcsfs >=2025.2.0
  run_constrained:
    - jdk4py ==17.0.9.2
    - snowpark-connect-deps-iceberg >=1.0.2

test:
  imports:
    - snowflake.snowpark_connect
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://www.snowflake.com
  summary: Snowpark Connect for Spark
  license: Apache-2.0
  license_file:
    - LICENSE-binary
    - NOTICE-binary
    - LICENSE.txt

extra:
  recipe-maintainers:
    - sfc-gh-manowotka
    - sfc-gh-azhan
    - sfc-gh-ckonigsmark
    - sfc-gh-igarish
    - sfc-gh-kgadomski
    - sfc-gh-pwojcik
    - sfc-gh-saroskar
    - sfc-gh-skumbham
