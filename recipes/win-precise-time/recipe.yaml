# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: win-precise-time
  version: "1.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/win-precise-time-${{ version }}.tar.gz
  sha256: 89274785cbc5f2997e01675206da3203835a442c60fd97798415c6b3c179c0b9

build:
  number: 4
  skip: match(python, "<3.7") or (not win) or (python_impl == 'pypy')
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=62.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - win_precise_time
      pip_check: true

about:
  summary: This Windows-only library provides a few improvements over the builtin time functions.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/zariiii9003/win-precise-time
  documentation: https://win-precise-time.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
