# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.2"

package:
  name: blueprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/blueprint/blueprint-${{ version }}.tar.gz
  sha256: 8bd3066028b953a431355dbed7786740b8f59ba090ffab74a0da41e2c27ed8f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - blueprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://devstructure.com/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: reverse engineer server configuration
  description: |
    reverse engineer server configuration

extra:
  recipe-maintainers:
    - rxm7706

