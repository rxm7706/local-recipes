# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: cmaes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmaes/cmaes-${{ version }}.tar.gz
  sha256: 69a252b0291d08100351e37c2918c7c6d929b02ab7dcd9dd14fc02c7c98cc1b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - cmaes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CyberAgentAILab/cmaes
  license: MIT
  license_file: LICENSE
  summary: Lightweight Covariance Matrix Adaptation Evolution Strategy (CMA-ES) implementation for Python 3.
  description: |
    Lightweight Covariance Matrix Adaptation Evolution Strategy (CMA-ES) implementation for Python 3.

extra:
  recipe-maintainers:
    - ciela
    - NaokiHamada
    - ha-mano
    - nomuramasahir0
    - c-bata

