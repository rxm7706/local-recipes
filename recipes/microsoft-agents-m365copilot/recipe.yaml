# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.0"

package:
  name: microsoft-agents-m365copilot
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/26/98/01a8c34c4568ecdb146c3afce1bf2d32c1f93894b7a1e6d0aeb89956454e/microsoft_agents_m365copilot-1.10.0.tar.gz
  sha256: 20e55bdc3e8fc8bc1bd1b558ec0da50e8e414e6dab469462fea76fea46412e0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - poetry-core
  - pip
  run:
  - python >=${{ python_min }}
  - microsoft-agents-m365copilot-core >=1.0.0
  - microsoft-kiota-authentication-azure >=1.8.0,<2.0.0
  - microsoft-kiota-bundle >=1.8.0,<2.0.0
  - httpx >=0.23.0

tests:
- python:
    imports:
    - microsoft_agents_m365copilot
    pip_check: true
    python_version:
    - ${{ python_min }}.*
    - "*"

about:
  summary: Microsoft Agents M365 Copilot Python SDK
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/Agents-M365Copilot/tree/main/python
  repository: https://github.com/microsoft/Agents-M365Copilot
  documentation: https://github.com/microsoft/Agents-M365Copilot/tree/main/python/packages/microsoft_agents_m365copilot

extra:
  recipe-maintainers:
  - rxm7706
  cfe-local-build-status: blocked
  cfe-local-build-datetime: '2026-10-09T11:06:27Z'
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
