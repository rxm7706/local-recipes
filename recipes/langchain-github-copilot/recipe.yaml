# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: langchain-github-copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/langchain-github-copilot/langchain_github_copilot-0.4.0-py3-none-any.whl
  sha256: dd1e9888f1cc61723d01564feef262856bf2cfeef6537efd073a117ead67a193

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - langchain-core <0.4.0,>=0.3.15
    - python-dotenv <2.0.0,>=1.0.1

tests:
  - python:
      imports:
        - langchain_github_copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-github-copilot/
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting GitHub Copilot and LangChain
  description: |
    An integration package connecting GitHub Copilot and LangChain
  repository: https://github.com/datalayer/langchain-github-copilot

extra:
  recipe-maintainers:
    - rxm7706

