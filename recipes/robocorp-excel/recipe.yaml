# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robocorp-excel
  version: "0.5.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robocorp_excel-${{ version }}.tar.gz
  sha256: 7a3dec4dc23ed6bbd08e1acbbfc1ad7e5f6b3b2028bada802164297e3c825a3a

build:
  number: 0
  noarch: python
  script:
    - if: win
      then: echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md
    - if: unix
      then: cp -R ${{ RECIPE_DIR }}/README.md ${{ SRC_DIR }}/README.md
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - pillow >=9.1.1
    - xlrd >=2.0.1,<3.0.0
    - xlwt >=1.3.0,<2.0.0
    - xlutils >=2.0.0,<3.0.0
    - openpyxl >=3.0.9,<4.0.0
    - typing-extensions >=4.5.0,<5.0.0
    - types-openpyxl >=3.1.5,<4.0.0

tests:
  - python:
      imports:
        - robocorp.excel
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Robocorp Excel automation library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/robocorp/robo/

extra:
  recipe-maintainers:
    - rxm7706
