# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: constructs
  version: "10.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/constructs-${{ version }}.tar.gz
  sha256: 9f6e4eb1f6b8b1ac8dcbc85457dcbb1e3f9bd93bbeef03154f6cc7fbbba74b06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=70.0.0,<70.1.dev0
    - wheel >=0.42,<1.dev0
    - pip
  run:
    - python >=${{ python_min }}
    - python-jsii >=1.139.0,<2.0.0
    - publication >=0.0.3
    - typeguard ==2.13.3

tests:
  - python:
      imports:
        - constructs
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A programming model for composable configuration
  license: Apache-2.0
  license_file:
    - NOTICE
    - LICENSE
  homepage: https://github.com/aws/constructs
  repository: https://github.com/aws/constructs

extra:
  recipe-maintainers:
    - ocefpaf
