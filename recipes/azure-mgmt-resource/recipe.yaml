# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.0.0"

package:
  name: azure-mgmt-resource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-resource/azure_mgmt_resource-${{ version }}.tar.gz
  sha256: 54227c5db06d3be4dd4b77ad885b273e9eb2606d1de653c5b534066cfbb60c0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-mgmt-core >=1.6.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-mgmt-resource/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Resource Management Client Library for Python
  description: |
    Microsoft Azure Resource Management Client Library for Python

extra:
  recipe-maintainers:
    - janjagusch
    - Maxyme
    - dhirschfeld

