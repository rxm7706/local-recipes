  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
####
# CFE comments
# source:
#    # GitHub monorepo tag archive (G54): langflow-base lives in the
#    # langflow-ai/langflow monorepo at src/backend/base. version (0.10.0) !=
#    # the monorepo tag (1.10.0) -> carry a separate monorepo_tag context var
#    # (autotick cannot dual-bump). hatchling backend (G55).
# build:
#    # LEAN re-architecture (mirrors the langflow-suite langflow-base output):
#    # the 16 optional integrations are sed-stripped from src/backend/base/
#    # pyproject.toml [project.dependencies] and demoted to run_constraints, so
#    # langflow-base is NOT langflow[full]. Range-restricted sed (only the
#    # [project.dependencies] block) so [project.optional-dependencies] groups
#    # are untouched.
# requirements:
#  run:
#    # lfx pinned ==1.10.0 (the sibling langflow-family package). Prerequisite
#    # blockers (absent from conda-forge + local channel): lfx, opendsstar.
#    # G10 spellings: docstring_parser, jaraco.context, prometheus_client.
####
