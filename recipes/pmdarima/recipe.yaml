# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pmdarima
  version: "2.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b87f9d9f5b7dc2ddbd053687c2264e26ac98fd4118e843c7e9bc3dd7343e5c1a

build:
  number: 2
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy >=1.21.2
    - if: build_platform != target_platform
      then: pybind11
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - cython >=0.29,!=0.29.18,!=0.29.31
    - numpy >=1.21.2
    - packaging >=17.1
    - pip
    - python
    - setuptools >=38.6.0,!=50.0.0
  run:
    - cython >=0.29,!=0.29.18,!=0.29.31
    - joblib >=0.11
    - numpy >=1.21.2
    - pandas >=0.19
    - python
    - scikit-learn >=0.22
    - scipy >=1.3.2
    - setuptools >=38.6.0,!=50.0.0
    - packaging >=17.1
    - statsmodels >=0.13.2
    - urllib3

tests:
  - python:
      imports:
        - pmdarima
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Pmdarima (originally pyramid-arima, for the anagram of 'py' + 'arima') is a statistical library designed to fill the void in Python's time series analysis capabilities
  homepage: https://github.com/alkaline-ml/pmdarima

extra:
  recipe-maintainers:
    - tomasvanpottelbergh
    - cdesouza21
