# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.15"

package:
  name: google-colabsqlviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/google-colabsqlviz/google_colabsqlviz-0.2.15-py3-none-any.whl
  sha256: 0582f5683085534585d5eb22542ea81470b9bcd64bed52076b0d74b68a2e97c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bigframes <3.0.0,>=2.35.0
    - ipython <8.0.0,>=7.34.0
    - protobuf <7.0.0,>=6.31.1
    - pyarrow >=18.1.0
    - anywidget >=0.9.3

tests:
  - python:
      imports:
        - google_colabsqlviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/google-colabsqlviz/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Visualization libraries for Colab
  description: |
    Visualization libraries for Colab

extra:
  recipe-maintainers:
    - rxm7706

