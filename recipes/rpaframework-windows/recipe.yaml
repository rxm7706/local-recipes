schema_version: 1

context:
  name: rpaframework-windows
  version: "7.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/rpaframework_windows-${{ version }}.tar.gz
  sha256: e90940c831c7dc0d7f31ec7cf18819bfdc6871a08d273ea9c90a102c8a122b8f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - windows-record = "RPA.scripts.record:main"

requirements:
  host:
    - python >=3.8,<4.0
    - poetry >=0.12
    - poetry-core
    - pip
    - six
  #   - typing
  run:
    - python >=3.8.0,<4.0.0
    - dataclasses >=0.7.0,<0.8.0
    - rpaframework-core >=11.0.0,<12.0.0
    - robotframework >=4.0.0,!=4.0.1,<6.0.0
    - robotframework-pythonlibcore >=4.0.0,<5.0.0
    - pynput-robocorp-fork >=5.0.0,<6.0.0
    - if: win
      then: uiautomation >=2.0.15,<3.0.0
    - if: win
      then: comtypes >=1.1.11,<2.0.0
    - psutil >=5.9.0,<6.0.0
    - if: win
      then: pywin32-on-windows
    - fire >=0.4.0,<0.5.0
    - if: win
      then: __win

tests:
  - python:
      imports:
        - RPA.Windows
      pip_check: false

about:
  summary: Windows library for RPA Framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://rpaframework.org/

extra:
  recipe-maintainers:
    - rxm7706
