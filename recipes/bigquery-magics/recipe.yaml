# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.1"

package:
  name: bigquery-magics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bigquery-magics/bigquery_magics-${{ version }}.tar.gz
  sha256: 6922f182dc9eae67cb8f38c9a05c6584b053d449face68c1fef34705061c5dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - db-dtypes <2.0.0,>=1.1.1
    - google-cloud-bigquery <4.0.0,>=3.41.0
    - ipywidgets >=7.7.1
    - ipython >=7.23.1
    - ipykernel >=5.5.6
    - packaging >=24.2.0
    - pandas >=1.5.3
    - pyarrow >=12.0.0
    - pydata-google-auth >=1.5.0
    - tqdm <5.0.0,>=4.7.4
    - pyopenssl >=23.3.0

tests:
  - python:
      imports:
        - bigquery_magics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/bigquery-magics
  license: Apache-2.0
  license_file: LICENSE
  summary: Google BigQuery magics for Jupyter and IPython
  description: |
    Google BigQuery magics for Jupyter and IPython

extra:
  recipe-maintainers:
    - tswast

