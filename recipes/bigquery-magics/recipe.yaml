# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bigquery-magics
  version: "0.15.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6922f182dc9eae67cb8f38c9a05c6584b053d449face68c1fef34705061c5dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - pyopenssl >=23.3.0
    - python >=${{ python_min }}
    - db-dtypes >=1.1.1,<2.0.0
    - google-cloud-bigquery-core >=3.41.0,<4.0.0
    - ipywidgets >=7.7.1
    - ipython >=7.23.1
    - ipykernel >=5.5.6
    - packaging >=24.2.0
    - pandas >=1.5.3
    - pyarrow >=12.0.0
    - pydata-google-auth >=1.5.0
    - tqdm >=4.7.4,<5.0.0

tests:
  - python:
      imports:
        - bigquery_magics
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Google BigQuery magics for Jupyter and IPython
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/python-bigquery-magics

extra:
  recipe-maintainers:
    - tswast
