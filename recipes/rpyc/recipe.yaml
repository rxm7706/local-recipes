# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.2"

package:
  name: rpyc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rpyc/rpyc-${{ version }}.tar.gz
  sha256: 8e780a6a71b842128a80a337c64adfb6f919014e069951832161c9efc630c93b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.6.0
  run:
    - python >=${{ python_min }}
    - plumbum

tests:
  - python:
      imports:
        - rpyc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://rpyc.readthedocs.org
  license: MIT
  license_file: LICENSE
  summary: Remote Python Call (RPyC) is a transparent and symmetric distributed computing library
  description: |
    Remote Python Call (RPyC) is a transparent and symmetric distributed computing library
  repository: https://github.com/tomerfiliba-org/rpyc

extra:
  recipe-maintainers:
    - mtsolmn
    - comrumino
    - jacobfeder

#### CFE metadata AND comments
