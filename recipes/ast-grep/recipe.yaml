# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.45.0"

package:
  name: ast-grep
  version: ${{ version }}

source:
  url: https://github.com/ast-grep/ast-grep/archive/refs/tags/${{ version }}.tar.gz
  sha256: 996e9d879f095d3ccef55754d3a32d61e1ae03cfaecdcff5e247bfa5b649b27a

build:
  number: 0
  # ppc64le stays skipped. `win` is deliberately NOT skipped: upstream ships
  # first-class Windows builds -- release assets include
  # app-x86_64-pc-windows-msvc.zip and npm publishes
  # @ast-grep/cli-win32-x64-msvc -- so there is no inherent blocker, and the
  # missing win-64 conda package is what makes headroom-ai (and anything else
  # depending on the ast-grep binary) uninstallable on Windows.
  skip: ppc64le
  script:
    env:
      # conda-forge canonical Rust env block (example_recipes/rust).
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # PEP 540 -- guards the Windows cp1252 decode trap where cargo output
      # containing non-ASCII bytes breaks rattler-build's UTF-8 reader (G19).
      PYTHONUTF8: "1"
    content:
      # One multi-line entry per platform: CFLAGS needs shell expansion, and
      # `script.env` does not shell-expand, nor do env vars carry across
      # separate list entries (SKILL.md G1).
      - if: unix
        then: |
          export CFLAGS="${CFLAGS} -D_BSD_SOURCE"
          cargo auditable install --locked --no-track --bins --root "${PREFIX}" --path ./crates/cli
          cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        else: |
          cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path ./crates/cli
          cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    # tree-sitter grammars pulled from crates.io ship C++ external scanners
    # (scanner.cc), so a C++ toolchain is required even though the ast-grep
    # repo itself contains no C++ sources.
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - sg --version
      - ast-grep --version
      - if: unix
        then:
          - test -x "${PREFIX}/bin/ast-grep"
          - test -x "${PREFIX}/bin/sg"
        else:
          - if not exist "%LIBRARY_BIN%\ast-grep.exe" exit 1
          - if not exist "%LIBRARY_BIN%\sg.exe" exit 1

about:
  summary: ast-grep(sg) is a CLI tool for code structural search, lint, and rewriting.
  description: |
    ast-grep is an AST-based tool to search code by pattern code. Think it as
    your old-friend grep but it matches AST nodes instead of text. You can
    write patterns as if you are writing ordinary code. It will match all code
    that has the same syntactical structure. You can use $ sign + upper case
    letters as wildcard, e.g. $MATCH, to match any single AST node. Think it as
    REGEX dot ., except it is not textual.
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE
  homepage: https://github.com/ast-grep/ast-grep
  repository: https://github.com/ast-grep/ast-grep
  documentation: https://ast-grep.github.io/

extra:
  recipe-maintainers:
    - asford
    - danielnachun
    - moritzwilksch
    - rxm7706

