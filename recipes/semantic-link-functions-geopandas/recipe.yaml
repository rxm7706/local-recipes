# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.2"

package:
  name: semantic-link-functions-geopandas
  version: ${{ version }}

source:
  url: https://github.com/microsoft/semantic-link-functions/archive/refs/tags/${{ version }}.tar.gz
  sha256: c8adcd036e467db6ad5f56f7a90afb16d63003e3e093bde622cc9ba42b85e62f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - geopandas
    - folium
    - mapclassify
    - semantic-link-sempy ==0.14.2

tests:
  - python:
      imports:
        - holidays.sempy_functions_holidays
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/semantic-link-functions
  license: MIT
  license_file: LICENSE
  summary: Semantic link functions for Geopandas. Enables conversion of a FabricDataFrame to a GeoDataFrame.
  description: |
    Semantic link functions for Geopandas. Enables conversion of a FabricDataFrame to a GeoDataFrame.

extra:
  recipe-maintainers:
    - rxm7706

