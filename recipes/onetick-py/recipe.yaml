# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.207.0"

package:
  name: onetick-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/onetick-py/onetick_py-${{ version }}.tar.gz
  sha256: 2fb85bfd2bc32ef027706b1062982d82391186699b54537e9f52ced9f55b6cbc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - coolname >=2.0.0
    - numpy >=1.20.3
    - packaging >=21.0
    - pandas >=1.5.2
    - python-dateutil >=2.8.2
    - python-dotenv >=1.0.0
    - python-tzdata >=2022.5
    - tzlocal >=4.2

tests:
  - python:
      imports:
        - onetick
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/onetick-py/
  license: MIT
  license_file: LICENSE
  summary: Python package that allows you to work with OneTick
  description: |
    Python package that allows you to work with OneTick
  repository: https://github.com/onemarketdata/onetick-py
  documentation: https://docs.pip.distribution.sol.onetick.com

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
