# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.6.1"

package:
  name: django-db-file-storage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-db-file-storage/django-db-file-storage-${{ version }}.tar.gz
  sha256: f0c4540ed6b772e8b3141eae3222acde4c29ab771477a5c999013a3980856c7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - db_file_storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/victor-o-silva/db_file_storage
  license: MIT
  license_file: LICENSE
  summary: Custom FILE_STORAGE for Django. Saves files in your database instead of your file system.
  description: |
    Custom FILE_STORAGE for Django. Saves files in your database instead of your file system.

extra:
  recipe-maintainers:
    - rxm7706

