# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: responsibleai-text
  version: "0.2.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/responsibleai_text-${{ version }}.tar.gz
  sha256: 030912182530f8a6a74c3f435cd651dc466dd6cc28ca7505f054558183b9cebf

build:
  number: 0
  noarch: python
  script:
    - if: unix
      then: cp -R ${{ RECIPE_DIR }}/requirements.txt ${{ SRC_DIR }}/requirements.txt
    - if: win
      then: echo f | xcopy /f /y /S %RECIPE_DIR%\requirements.txt %SRC_DIR%\requirements.txt
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8
    - numpy >=1.17.2
    - pandas >=0.25.1
    - scikit-learn >=0.22.1
    - scipy >=1.4.1
    - semver >=2.13.0,<2.14.dev0
    - nlp-feature-extractors ==0.1.0
    - responsibleai >=0.34.1

tests:
  - python:
      imports:
        - responsibleai_text
      pip_check: true

about:
  summary: SDK API to assess text Machine Learning models.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/responsible-ai-toolbox

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
