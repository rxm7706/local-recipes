# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.30.2212.8"

package:
  name: ixnetwork
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/i/IxNetwork/IxNetwork-9.30.2212.8-py2.py3-none-any.whl
  sha256: 764b41e947b4d8f83679ca63e624d0972568ee8e573c3a2fb57d04934f8ff83f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - backports.ssl
    - backports.ssl-match-hostname
    - pyopenssl
    - requests
    - websocket-client

tests:
  - python:
      imports:
        - ixnetwork
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ixiacom/ixnetwork-api-py
  license: MIT
  license_file: LICENSE
  summary: IxNetwork Low Level API
  description: |
    IxNetwork Low Level API

extra:
  recipe-maintainers:
    - rxm7706

