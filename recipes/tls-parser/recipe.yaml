# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: tls-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tls-parser/tls_parser-${{ version }}.tar.gz
  sha256: fc9c1c4bcb646317bf0f1a9396bad1423346a445fd34a86ccc6c3a7e434ebde3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tls_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nabla-c0d3/tls_parser
  license: MIT
  license_file: LICENSE
  summary: Small library to parse TLS records.
  description: |
    Small library to parse TLS records.

extra:
  recipe-maintainers:
    - rxm7706

