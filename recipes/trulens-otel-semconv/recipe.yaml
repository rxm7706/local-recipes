# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.13.0"

package:
  name: trulens-otel-semconv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trulens-otel-semconv/trulens_otel_semconv-${{ version }}.tar.gz
  sha256: 4adbd12a5afda082f55e653bca4d77b38656892605cddce45adc43ae146e665a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - opentelemetry-semantic-conventions >=0.36b0

tests:
  - python:
      imports:
        - trulens.otel.semconv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://trulens.org/
  license: MIT
  license_file: LICENSE
  summary: Semantic conventions for spans produced by TruLens.
  description: |
    Semantic conventions for spans produced by TruLens.
  repository: https://github.com/truera/trulens
  documentation: https://trulens.org/getting_started/

extra:
  recipe-maintainers:
    - rxm7706

