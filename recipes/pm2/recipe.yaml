# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pm2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pm2/pm2-${{ version }}.tar.gz
  sha256: 6ec6efa707a6683e3b1f55e4651370e72a5a02525ab46a813e9608965912efc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=0.8.0

tests:
  - python:
      imports:
        - pm2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://projects.yakupkaya.me/pm2
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Professional Python wrapper for PM2 (Process Manager 2) with async support
  description: |
    Professional Python wrapper for PM2 (Process Manager 2) with async support
  repository: https://github.com/y4kupkaya/PM2
  documentation: https://docs.yakupkaya.me/pm2

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pm2
