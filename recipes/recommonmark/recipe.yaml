# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: recommonmark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/recommonmark/recommonmark-${{ version }}.tar.gz
  sha256: bdb4db649f2222dcd8d2d844f0006b958d627f732415d399791ee436a3686d67

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cm2html = recommonmark.scripts:cm2html
      - cm2latex = recommonmark.scripts:cm2latex
      - cm2man = recommonmark.scripts:cm2man
      - cm2pseudoxml = recommonmark.scripts:cm2pseudoxml
      - cm2xetex = recommonmark.scripts:cm2xetex
      - cm2xml = recommonmark.scripts:cm2xml

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - commonmark >=0.8.1
    - docutils >=0.11
    - sphinx >=1.3.1

tests:
  - python:
      imports:
        - recommonmark
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - cm2html --help
      - cm2latex --help
      - cm2man --help
      - cm2pseudoxml --help
      - cm2xetex --help
      - cm2xml --help

about:
  license: MIT
  license_file: license.md
  summary: A docutils-compatibility bridge to CommonMark
  description: |
    A docutils-compatibility bridge to CommonMark.
    This allows you to write CommonMark inside of Docutils & Sphinx projects.
  homepage: https://github.com/rtfd/recommonmark
  repository: https://github.com/rtfd/recommonmark
  documentation: http://recommonmark.readthedocs.org

extra:
  recipe-maintainers:
    - CJ-Wright
    - ocefpaf
