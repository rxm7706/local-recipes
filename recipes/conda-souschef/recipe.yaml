# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: conda-souschef
  version: "3.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/conda_souschef-${{ version }}.tar.gz
  sha256: 0df9fa12d826ab349e8006e498c6067b3a5161cf5b860baf08601829cb1b200b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools >=30.3.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.15.3
    - ruamel.yaml.jinja2

tests:
  - python:
      imports:
        - souschef
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Project to handle conda recipes
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/marcelotrevisani/souschef
  repository: https://github.com/marcelotrevisani/souschef

extra:
  recipe-maintainers:
    - marcelotrevisani
