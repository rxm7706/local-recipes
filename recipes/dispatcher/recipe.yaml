# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: dispatcher
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dispatcher/dispatcher-${{ version }}.tar.gz
  sha256: b82ee55904098c418d412262ff871a1ebc1cf91ea5d9cfb30e950fec3b8c0edb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dispatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/olivierverdier/dispatch
  license: MIT
  license_file: LICENSE
  summary: A library for event-driven programming
  description: |
    A library for event-driven programming

extra:
  recipe-maintainers:
    - rxm7706

