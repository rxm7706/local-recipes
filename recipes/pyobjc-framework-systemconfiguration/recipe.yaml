# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyobjc-framework-SystemConfiguration
  version: "12.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/50/14/4d4a417e7594a0ef919b804449cb3bb4b53194a5e940fd9e4fed304db51f/pyobjc_framework_systemconfiguration-12.2.2.tar.gz
  sha256: 9a82d5a1214e49697843f39e72718a5d606378999e94b5b4591bd429bb8e6ada
  <conda_recipe_manager.types.SentinelType object at 0x752103951be0>:  #patches:
    #- patches/0001-Remove-werror-from-compile-flags.patch

build:
  number: 0
  skip: (not osx) or match(python, ">=2,<3") or python_impl == 'pypy' or (arm64 and match(python, "<3.9"))
  script:
    # force pyobjc to use conda-forge's chosen SDK
  - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    # force ignoring invalid compiler flag (-Wl,-export-dynamic)
  - if: match(python, "==3.7") or match(python, "==3.8")
    then: export CFLAGS="${CFLAGS} -Wno-unused-command-line-argument"
  - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
  - if: build_platform != target_platform
    then: python
  - if: build_platform != target_platform
    then: cross-python_${{ target_platform }}
  - ${{ compiler('c') }}
  - ${{ stdlib("c") }}
  host:
  - python
  - setuptools
  - wheel
  - pip
  run:
  - python
  - pyobjc-core >=${{ version }}
  - pyobjc-framework-cocoa >=${{ version }}

tests:
- python:
    imports:
    - PyObjCTools
    - SystemConfiguration
    pip_check: true

about:
  summary: Wrappers for the framework SystemConfiguration on macOS
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pythonhosted.org/pyobjc-framework-SystemConfiguration/

extra:
  recipe-maintainers:
  - rxm7706

#### CFE metadata AND comments
