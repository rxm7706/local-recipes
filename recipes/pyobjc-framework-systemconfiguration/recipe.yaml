# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyobjc-framework-SystemConfiguration
  version: "12.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name.replace('-', '_').lower() }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: 877a90eafe3df72625e50d61fc9c6dbd40e8cdabab7c4101992090107bb71ddb
  <conda_recipe_manager.types.SentinelType object at 0x752103951be0>:  #patches:
    #- patches/0001-Remove-werror-from-compile-flags.patch

build:
  number: 0
  skip: (not osx) or match(python, ">=2,<3") or python_impl == 'pypy' or (arm64 and match(python, "<3.9"))
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    # force ignoring invalid compiler flag (-Wl,-export-dynamic)
    - if: match(python, "==3.7") or match(python, "==3.8")
      then: export CFLAGS="${CFLAGS} -Wno-unused-command-line-argument"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - wheel
    - pip
  run:
    - python
    - pyobjc-core >=${{ version }}
    - pyobjc-framework-cocoa >=${{ version }}

tests:
  - python:
      imports:
        - PyObjCTools
        - SystemConfiguration
      pip_check: true

about:
  summary: Wrappers for the framework SystemConfiguration on macOS
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pythonhosted.org/pyobjc-framework-SystemConfiguration/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
