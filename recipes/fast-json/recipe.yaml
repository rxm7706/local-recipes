# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: fast-json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fast-json/fast-json-${{ version }}.tar.gz
  sha256: a1e706410cdc1b7bcab14383cdab9e093d7ca872ff761927c162bd7fda83ad2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fast_json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fast-json/
  license: Apache-2.0
  license_file: LICENSE
  summary: Combines best parts of json and ujson for fast serialization
  description: |
    Combines best parts of json and ujson for fast serialization

extra:
  recipe-maintainers:
    - rxm7706

