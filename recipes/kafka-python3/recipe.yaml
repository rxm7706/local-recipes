# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: kafka-python3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kafka-python3/kafka-python3-${{ version }}.tar.gz
  sha256: 01b911bb5402a7c4f9af3ea382bb060e9aa487b5dec249cf5e798c6e9822a62f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - kafka3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dpkp/kafka-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Pure Python client for Apache Kafka
  description: |
    Pure Python client for Apache Kafka

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: kafka-python3
