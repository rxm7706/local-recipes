# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: asyncio-pool
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncio-pool/asyncio_pool-${{ version }}.tar.gz
  sha256: d7ba5e299ba58d4fb0cebbc722989d1f880df4c4b19e37055075b3dabc062c5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncio_pool
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gistart/asyncio-pool
  license: MIT
  license_file: LICENSE
  summary: Pool of asyncio coroutines with familiar interface
  description: |
    Pool of asyncio coroutines with familiar interface

extra:
  recipe-maintainers:
    - rxm7706

