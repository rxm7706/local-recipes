# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.4.27"

package:
  name: generators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/generators/generators-${{ version }}.tar.gz
  sha256: fdf7912a89ef7818897c0666f9fb87caa264e4066c65bc1b6b0fca330a05311f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - generators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CodyKochmann/generators
  license: MIT
  license_file: LICENSE
  summary: a high performance pipeline processor written in python
  description: |
    a high performance pipeline processor written in python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
