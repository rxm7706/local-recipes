# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.0"

package:
  name: vine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vine/vine-${{ version }}.tar.gz
  sha256: 8b62e981d35c41049211cf62a0a1242d8c1ee9bd15bb196ce38aefd6799e61e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - t
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/celery/vine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python promises.
  description: |
    Python promises.

extra:
  recipe-maintainers:
    - anthchirp
    - frol

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: vine
  cfe-upstream-registry: pypi
  cfe-upstream-name: vine
  cfe-purls:
    - pkg:conda/vine@${{ version }}?channel=conda-forge
    - pkg:pypi/vine@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/celery/vine
  cfe-import-names: [t]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/vine-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-5.1.0

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T07:06:25Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T07:06:25Z
  cfe-local-build-status: build-clean-test-blocked
  cfe-local-build-datetime: 2026-08-18T07:06:25Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
