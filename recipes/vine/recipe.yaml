# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: vine
  version: "5.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/vine-${{ version }}.tar.gz
  sha256: 8b62e981d35c41049211cf62a0a1242d8c1ee9bd15bb196ce38aefd6799e61e0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vine
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python promises
  description: |
    This is a special implementation of promises in that it can be used both
    for promise of a value and lazy evaluation. The biggest upside for this
    is that everything in a promise can also be a promise, e.g. filters,
    callbacks and errbacks can all be promises.
  homepage: https://pypi.org/project/vine/
  repository: https://github.com/celery/vine
  documentation: https://vine.readthedocs.io/

extra:
  recipe-maintainers:
    - anthchirp
    - frol
