# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: excel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/e/excel/excel-1.0.1-py2.py3-none-any.whl
  sha256: e08b023af3b6c82bcf75ee8d9bd9cecab18816b4212dc00755f47d782ab13089

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - excel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://aka.ms/python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: This package name is reserved by Microsoft Corporation
  description: |
    This package name is reserved by Microsoft Corporation

extra:
  recipe-maintainers:
    - rxm7706

