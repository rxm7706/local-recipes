# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: mermaid-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mermaid-cli/mermaid_cli-${{ version }}.tar.gz
  sha256: a9116e898c4fefaced3a1256ac9a9741e973f30d9c82d49b9674832413e92b79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8.0.0
    - playwright >=1.30.0
    - colorama >=0.4.4

tests:
  - python:
      imports:
        - mermaid_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/seigok/mermaid-cli-python
  license: MIT
  license_file: LICENSE
  summary: Command-line interface and Python library for mermaid diagrams
  description: |
    Command-line interface and Python library for mermaid diagrams

extra:
  recipe-maintainers:
    - rxm7706

