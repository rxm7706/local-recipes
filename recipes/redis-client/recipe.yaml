# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: redis-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/redis-client/redis-client-${{ version }}.tar.gz
  sha256: 7b30c18789ba226541f950d70df0e05008d1c407a8f47502742c7cf4ec99b7f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - redis-py

tests:
  - python:
      imports:
        - redis_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GraphtyLove/redis_client_python
  license: MIT
  license_file: LICENSE
  summary: A simple client for Redis
  description: |
    A simple client for Redis
  repository: https://github.com/GraphtyLove/redis_client_python

extra:
  recipe-maintainers:
    - rxm7706

