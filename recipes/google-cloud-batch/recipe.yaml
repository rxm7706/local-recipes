# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.22.2"

package:
  name: google-cloud-batch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-batch/google_cloud_batch-${{ version }}.tar.gz
  sha256: 4711998f0f25c1379bb7eb3bea953df311b07aa06ea2fc6bc4d72ff96a6ed953

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.batch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-batch
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Batch API client library
  description: |
    Google Cloud Batch API client library

extra:
  recipe-maintainers:
    - xylar

