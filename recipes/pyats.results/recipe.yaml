schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.results
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats.results/pyats_results-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: bdf54db52a516803a812ce14282f1add630538e20f9a236f7edc3f8e373f0b7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyats.results
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS Results: Representing Results using Objects"
  description: |
    pyATS Results: Representing Results using Objects

extra:
  recipe-maintainers:
    - rxm7706

