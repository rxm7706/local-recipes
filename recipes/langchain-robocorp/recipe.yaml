# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.10.post1"

package:
  name: langchain-robocorp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-robocorp/langchain_robocorp-${{ version }}.tar.gz
  sha256: ca7f13902ad60fcae5c4ef149ee3cafbfbd24c6996561cacb54dc08b692efd30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - langchain-core >=0.2.24,<0.3
    - requests >=2.31.0,<3.0.0
    - types-requests >=2.31.0,<3.0.0

tests:
  - python:
      imports:
        - langchain_robocorp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/langchain-ai/langchain
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting Robocorp Action Server and LangChain
  description: |
    An integration package connecting Robocorp Action Server and LangChain
  repository: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen

