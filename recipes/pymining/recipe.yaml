# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: pymining
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymining/pymining-${{ version }}.tar.gz
  sha256: 70f0b7fdce7a3057c208e5605f4960c6928c96989e7c073ed3443901f0094b9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymining
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bartdag/pymining
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Small collection of data mining algorithms
  description: |
    Small collection of data mining algorithms

extra:
  recipe-maintainers:
    - rxm7706

