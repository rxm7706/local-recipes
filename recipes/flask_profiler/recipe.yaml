    - pkg:pypi/flask-profiler@${{ version }}
  cfe-upstream-repo: https://github.com/muatik/flask-profiler
  cfe-upstream-homepage: https://github.com/muatik/flask-profiler
  cfe-import-names: [flask_profiler]
