# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: flask_profiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask_profiler/flask_profiler-${{ version }}.tar.gz
  sha256: fc9f2875a4f22223ddc04ffacd75792854162c4cdbef165598a51f898521ac51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_profiler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/muatik/flask-profiler
  license: MIT
  license_file: LICENSE
  summary: API endpoint profiler for Flask framework
  description: |
    API endpoint profiler for Flask framework

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask_profiler
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask_profiler
  cfe-purls:
