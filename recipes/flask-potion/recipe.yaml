    - pkg:pypi/flask-potion@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://potion.readthedocs.org/en/latest/
  cfe-import-names: [flask_potion]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-potion-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.16.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

