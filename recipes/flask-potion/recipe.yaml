# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: flask-potion
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Potion/Flask-Potion-${{ version }}.tar.gz
  sha256: ed55a6d118d2c11985241d312e3fa6224d49127e13a86de65a762235fdc5da0a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flask_potion
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://potion.readthedocs.org/en/latest/
  license: MIT
  license_file: LICENSE
  summary: Powerful REST API framework for Flask and SQLAlchemy
  description: |
    Powerful REST API framework for Flask and SQLAlchemy

extra:
  recipe-maintainers:
    - corburn

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-potion
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-potion
