# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"
  sha256: cdacd1691a130e217295d915ab8ca803debef413fd6e5773cb1459cdc8658fe5

package:
  name: flask-potion
  version: ${{ version }}

source:
  url: https://github.com/biosustain/potion/archive/8a42ccb21422d405cdb9a62319754e43477d2bc1.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python
    - pip
  run:
    - python
    - flask >=0.10
    - jsonschema >=2.4.0
    - aniso8601 >=0.84
    - blinker >=1.3
    - six >=1.8.0

tests:
  - python:
      imports:
        - flask_potion
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Powerful REST API framework for Flask and SQLAlchemy
  homepage: http://potion.readthedocs.org/en/latest/
  repository: https://github.com/biosustain/potion

extra:
  recipe-maintainers:
    - corburn
