# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: msgraph-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msgraph-core/msgraph_core-${{ version }}.tar.gz
  sha256: 1eecc9089ead63ab9cfca4cfb0751fc664088d6a53fc9ee1fc0574eddfba030b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.5.0
    - wheel
  run:
    - python >=${{ python_min }}
    - microsoft-kiota-abstractions <2.0.0,>=1.11.6
    - microsoft-kiota-authentication-azure <2.0.0,>=1.11.6
    - microsoft-kiota-http <2.0.0,>=1.11.6
    - httpx >=0.23.0

tests:
  - python:
      imports:
        - msgraph_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoftgraph/msgraph-sdk-python-core#readme
  license: MIT
  license_file: LICENSE
  summary: Core component of the Microsoft Graph Python SDK
  description: |
    Core component of the Microsoft Graph Python SDK
  documentation: https://github.com/microsoftgraph/msgraph-sdk-python-core/docs

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
