# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: initialize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/initialize/initialize-${{ version }}.tar.gz
  sha256: dc259fe77ed4a5040a9086dde3589d038c65f34d85ede4d132101209423ac605

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - initialize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AngrySoilder/initialize
  license: MIT
  license_file: LICENSE
  summary: Automating Automation by creating automatic project structure
  description: |
    Automating Automation by creating automatic project structure

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: initialize
  cfe-upstream-registry: pypi
  cfe-upstream-name: initialize
