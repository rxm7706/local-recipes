# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.8.16"
  python_min: "3.12"

package:
  name: tifffile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tifffile/tifffile-${{ version }}.tar.gz
  sha256: 523a18b8183253e1e594162eed45f157c959d8cff6decde3f2d58f20a5a45389

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=2.1

tests:
  - python:
      imports:
        - tifffile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.cgohlke.com
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Read and write TIFF files
  description: |
    Read and write TIFF files
  repository: https://github.com/cgohlke/tifffile
  documentation: https://www.cgohlke.com/docs/tifffile/

extra:
  recipe-maintainers:
    - blink1073
    - ericpre
    - jakirkham
    - mrakitin
    - ocefpaf
    - stuarteberg

