# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.12"
  name: tifffile
  version: "2026.7.31"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 79b1f4b1aba3ef3e6b6f1691a32abb62f5d7383faa52a12771c695232ba40bee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - tifffile = tifffile:main
      - tiffcomment = tifffile.tiffcomment:main
      - tiff2fsspec = tifffile.tiff2fsspec:main
      - lsm2bin = tifffile.lsm2bin:main

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=2.1
    - imagecodecs >=2026.5.10
  run_constraints:
    - matplotlib-base >=3.3

tests:
  - python:
      imports:
        - tifffile
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - tifffile --help
      - tiff2fsspec --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Read and write image data from and to TIFF files.
  homepage: https://github.com/cgohlke/tifffile

extra:
  recipe-maintainers:
    - blink1073
    - ericpre
    - jakirkham
    - mrakitin
    - ocefpaf
    - stuarteberg
