# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: sumy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sumy/sumy-${{ version }}.tar.gz
  sha256: 5bdf1af5286801a74e9b5fd3aa58c3ab2316318a42de3c12f38f9737bee6cfc2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - breadability >=0.1.20
    - docopt-ng >=0.6.3
    - lxml-html-clean >=0.1.0
    - nltk !=3.10.1,>=3.9.1
    - pycountry >=18.2.23
    - requests >=2.32.4
    - setuptools <82,>=70.0.0

tests:
  - python:
      imports:
        - sumy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miso-belica/sumy
  license: Apache-2.0
  license_file: LICENSE
  summary: Module for automatic summarization of text documents and HTML pages.
  description: |
    Module for automatic summarization of text documents and HTML pages.
  repository: https://github.com/miso-belica/sumy

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sumy
  cfe-upstream-registry: pypi
  cfe-upstream-name: sumy
  cfe-purls:
    - pkg:conda/sumy@${{ version }}?channel=conda-forge
    - pkg:pypi/sumy@${{ version }}
  cfe-upstream-repo: https://github.com/miso-belica/sumy
  cfe-upstream-homepage: https://github.com/miso-belica/sumy
  cfe-import-names: [sumy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sumy-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.13.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

