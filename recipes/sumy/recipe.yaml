# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sumy
  version: "0.11.0"
  py_ver: PY_VER

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sumy-${{ version }}.tar.gz
  sha256: 1c52dcfda3072d87c7ae85a100c53a93f5b1f758466a1a1369f86aff1bb0129d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - sumy = sumy.__main__:main
      - sumy-${{ py_ver }} = sumy.__main__:main
      - sumy_eval = sumy.evaluation.__main__:main
      - sumy_eval-${{ py_ver }} = sumy.evaluation.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - breadability >=0.1.20
    - docopt >=0.6.1,<0.7
    - nltk >=3.0.2
    - pycountry >=18.2.23
    - python >=${{ python_min }}
    - requests >=2.7.0

tests:
  - python:
      imports:
        - sumy
        - sumy.evaluation
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - sumy --help
      - sumy-${{ py_ver }} --help
      - sumy_eval --help
      - sumy_eval-${{ py_ver }} --help

about:
  summary: Module for automatic summarization of text documents and HTML pages.
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/miso-belica/sumy

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz
