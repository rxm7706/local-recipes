# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.11"

package:
  name: python-fasthtml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-fasthtml/python_fasthtml-${{ version }}.tar.gz
  sha256: 7d054cdb35999f7d61ef582e22efe0d74fce37499327e4ebf2680d6e18bb568d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - fastcore >=2.1.2
    - python-dateutil
    - starlette >=1.0.1
    - oauthlib
    - itsdangerous
    - uvicorn >=0.30
    - httpx2
    - python-multipart
    - beautifulsoup4

tests:
  - python:
      imports:
        - fasthtml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-fasthtml/
  license: Apache-2.0
  license_file: LICENSE
  summary: The fastest way to create an HTML app
  description: |
    The fastest way to create an HTML app
  repository: https://github.com/AnswerDotAI/fasthtml
  documentation: https://www.fastht.ml/docs/

extra:
  recipe-maintainers:
    - synapticarbors

#### CFE metadata AND comments
