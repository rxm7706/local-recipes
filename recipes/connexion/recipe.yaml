# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: connexion
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/connexion/connexion-${{ version }}.tar.gz
  sha256: 63e4b32c170c297f245b63e26a78e299d4df86f8f6f37ef1f70db62efaba77cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.2.0
  run:
    - python >=${{ python_min }}
    - jinja2 >=3.0.0
    - pyyaml >=5.1
    - asgiref >=3.4
    - httpx >=0.23
    - inflection >=0.3.1
    - jsonschema >=4.17.3
    - python-multipart >=0.0.15
    - requests >=2.27
    - starlette >=0.35
    - typing_extensions >=4.6.1
    - werkzeug >=2.2.1

tests:
  - python:
      imports:
        - connexion
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/connexion/
  license: Apache-2.0
  license_file: LICENSE
  summary: Connexion - API first applications with OpenAPI/Swagger
  description: |
    Connexion - API first applications with OpenAPI/Swagger
  repository: https://github.com/spec-first/connexion

extra:
  recipe-maintainers:
    - rvalieris
    - xylar

#### CFE metadata AND comments
