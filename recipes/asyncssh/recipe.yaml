# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.24.0"

package:
  name: asyncssh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncssh/asyncssh-${{ version }}.tar.gz
  sha256: 4064c590e59ce2e8d82a2f66d35f3120d765828b4df5e3dbfb07b4a8c24686c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography >=48.0.1
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - asyncssh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://asyncssh.timeheart.net
  license: EPL-2.0
  license_file: LICENSE
  summary: "AsyncSSH: Asynchronous SSHv2 client and server library"
  description: |
    AsyncSSH: Asynchronous SSHv2 client and server library
  repository: https://github.com/ronf/asyncssh
  documentation: https://asyncssh.readthedocs.io

extra:
  recipe-maintainers:
    - apmorton
    - vamega

