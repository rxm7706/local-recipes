# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.52.3"

package:
  name: uvicorn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uvicorn/uvicorn-${{ version }}.tar.gz
  sha256: 18857b9e6579300be55c91c0a1cfd37d9a2cf0cabea33b88275f199eb73b8b58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=7.0
    - h11 >=0.8
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - uvicorn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uvicorn.dev/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The lightning-fast ASGI server.
  description: |
    The lightning-fast ASGI server.
  repository: https://github.com/Kludex/uvicorn

extra:
  recipe-maintainers:
    - carlodri
    - ocefpaf
    - xhochy

#### CFE metadata AND comments
