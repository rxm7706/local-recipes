# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: os0
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/os0/os0-${{ version }}.tar.gz
  sha256: 4e097c08e01da9243e3129f3f71d0a8f9150634dd17fd1bf6b230383082abc75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - os0
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://zeroincombenze-tools.readthedocs.io
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: OS indipendent interface
  description: |
    OS indipendent interface
  repository: https://github.com/zeroincombenze/tools
  documentation: https://zeroincombenze-tools.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

