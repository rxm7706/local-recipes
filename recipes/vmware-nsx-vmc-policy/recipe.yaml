# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0.1"

package:
  name: vmware-nsx-vmc-policy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmware-nsx-vmc-policy/vmware-nsx-vmc-policy-${{ version }}.tar.gz
  sha256: 5f09d97dd4855f75a5052972547ebd8413c4ed57a9fbfbf5dc5320b397cc181a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vmware_nsx_vmc_policy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/vmware-nsx-vmc-policy/
  license: MIT
  license_file: LICENSE
  summary: Python bindings for nsx vmc policy
  description: |
    Python bindings for nsx vmc policy

extra:
  recipe-maintainers:
    - rxm7706

