# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: jupyter-kernel-gateway
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-kernel-gateway/jupyter_kernel_gateway-${{ version }}.tar.gz
  sha256: 900690c4c0e796867355468d685f7fa1cf3c7775d08e871c157f77d65fbd6d7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter-client >=8.6
    - jupyter-core >=5.7
    - jupyter-server >=2.12
    - requests >=2.31
    - tornado >=6.4
    - traitlets >=5.14.1

tests:
  - python:
      imports:
        - kernel_gateway
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jupyter-incubator/kernel_gateway
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A web server for spawning and communicating with Jupyter kernels
  description: |
    A web server for spawning and communicating with Jupyter kernels

extra:
  recipe-maintainers:
    - blink1073
    - parente
    - lresende
    - kevin-bates
    - bollwyvl

