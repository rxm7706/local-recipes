# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.13"

package:
  name: google-cloud-jupyter-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-jupyter-config/google_cloud_jupyter_config-${{ version }}.tar.gz
  sha256: 0835cd565c082df366f3d0e2b0676888ae00c7594520bc3463521b3b8b25ad6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cachetools
    - jupyter-server >=2.4.0
    - traitlets

tests:
  - python:
      imports:
        - google.cloud.jupyter_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudPlatform/jupyter-extensions/tree/master/google-cloud-jupyter-config
  license: Apache-2.0
  license_file: LICENSE
  summary: Jupyter configuration utilities using gcloud
  description: |
    Jupyter configuration utilities using gcloud

extra:
  recipe-maintainers:
    - rxm7706

