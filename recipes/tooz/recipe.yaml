# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.0.1"
  python_min: "3.11"

package:
  name: tooz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tooz/tooz-${{ version }}.tar.gz
  sha256: 2c332f668ad910b46b54e7f1db98166a0a79ce8c4d8148206d503c4517d4ceb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - stevedore >=1.16.0
    - voluptuous >=0.8.9
    - msgpack >=0.4.0
    - fasteners >=0.7
    - tenacity >=5.0.0
    - futurist >=1.2.0
    - oslo.utils >=4.7.0
    - oslo.serialization >=1.10.0

tests:
  - python:
      imports:
        - tooz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/tooz
  license: Apache-2.0
  license_file: LICENSE
  summary: Coordination library for distributed systems.
  description: |
    Coordination library for distributed systems.
  repository: https://opendev.org/openstack/tooz

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tooz
  cfe-upstream-registry: pypi
  cfe-upstream-name: tooz
