# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: starlette-prometheus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/starlette-prometheus/starlette_prometheus-${{ version }}.tar.gz
  sha256: 77d1e9cfad572206e8de242975bd00a62e33685eb330389f2add04e4d719d47d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - starlette >=0.12.2
    - prometheus_client >=0.12

tests:
  - python:
      imports:
        - starlette_prometheus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PeRDy/starlette-prometheus
  license: GPL-3.0+
  license_file: LICENSE
  summary: Prometheus integration for Starlette
  description: |
    Prometheus integration for Starlette
  repository: https://github.com/PeRDy/starlette-prometheus

extra:
  recipe-maintainers:
    - rxm7706

