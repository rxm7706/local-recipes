# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0rc19"

package:
  name: microsoft-agents-m365copilot-beta
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-agents-m365copilot-beta/microsoft_agents_m365copilot_beta-${{ version }}.tar.gz
  sha256: 1627982d9500908858a4a16b9679844f4837e13120700faa7642d270ef375e41

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - wheel
    - setuptools >=42.0.0
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0
    - microsoft-agents-m365copilot-core >=1.0.0rc1
    - microsoft-kiota-authentication-azure <2.0.0,>=1.8.0
    - microsoft-kiota-bundle <2.0.0,>=1.8.0

tests:
  - python:
      imports:
        - microsoft_agents_m365copilot_beta
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Agents-M365Copilot/tree/main/python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Agents M365 Copilot Python SDK (Beta)
  description: |
    Microsoft Agents M365 Copilot Python SDK (Beta)
  repository: https://github.com/microsoft/Agents-M365Copilot
  documentation: https://github.com/microsoft/Agents-M365Copilot/tree/main/python/packages/microsoft_agents_m365copilot_beta#readme

extra:
  recipe-maintainers:
    - rxm7706

