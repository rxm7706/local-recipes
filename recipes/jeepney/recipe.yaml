# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jeepney
  version: "0.9.0"
  sha256: cf0e9e845622b81e4a28df94c40345400256ec608d0e55bb8a3feaa9163f5732

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3.11
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jeepney
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Pure Python DBus interface
  description: |
    This is a low-level, pure Python DBus protocol client. It has
    an I/O-free core, and integration modules for different event
    loops.
  homepage: https://gitlab.com/takluyver/jeepney
  repository: https://gitlab.com/takluyver/jeepney
  documentation: https://jeepney.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - ccordoba12
    - takluyver
