# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: jeepney
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jeepney/jeepney-${{ version }}.tar.gz
  sha256: cf0e9e845622b81e4a28df94c40345400256ec608d0e55bb8a3feaa9163f5732

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jeepney
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jeepney/
  license: MIT
  license_file: LICENSE
  summary: Low-level, pure Python DBus protocol wrapper.
  description: |
    Low-level, pure Python DBus protocol wrapper.
  repository: https://gitlab.com/takluyver/jeepney
  documentation: https://jeepney.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - ccordoba12
    - takluyver

#### CFE metadata AND comments
