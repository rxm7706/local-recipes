# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: router
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/router/router-${{ version }}.tar.gz
  sha256: 4ca308adec8b57bb4021a4ffd0d517e5ddd495c19f0a3e96b95b08a3fe87b88e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urlparse

tests:
  - python:
      imports:
        - router
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.tipfy.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: A simple yet extensible URL routing library for Python
  description: |
    A simple yet extensible URL routing library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: router
  cfe-upstream-registry: pypi
  cfe-upstream-name: router
