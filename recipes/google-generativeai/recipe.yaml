# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.6"

package:
  name: google-generativeai
  version: ${{ version }}

source:
  url: https://github.com/google/generative-ai-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e58365ea1c36da40e07c8917cd50b647f6eaf4189f6682728d79327c84ab7e70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-ai-generativelanguage ==0.6.15
    - google-api-core
    - google-api-python-client
    - google-auth >=2.15.0
    - protobuf
    - pydantic
    - tqdm
    - typing_extensions

tests:
  - python:
      imports:
        - google.generativeai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/generative-ai-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Generative AI High level API client library and tools.
  description: |
    Google Generative AI High level API client library and tools.

extra:
  recipe-maintainers:
    - jan-janssen
    - moritzwilksch

