# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: pytoolconfig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytoolconfig/pytoolconfig-${{ version }}.tar.gz
  sha256: 51e6bd1a6f108238ae6aab6a65e5eed5e75d456be1c2bf29b04e5c1e7d7adbae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend >=1.0.5
  run:
    - python >=${{ python_min }}
    - tomli >=2.0.1
    - packaging >=23.2

tests:
  - python:
      imports:
        - pytoolconfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bageljrkhanofemus/pytoolconfig
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Python tool configuration
  description: |
    Python tool configuration

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
