# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: ansible-navigator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-navigator/ansible_navigator-${{ version }}.tar.gz
  sha256: 579532a02acbaf8899bc378541421c5d2c5358fd46dd39822547615902299fe4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
  run:
    - python >=${{ python_min }}
    - ansible-builder >=3.0.0
    - ansible-runner <3,>=2.3.1
    - ansible-lint >=6.19.0
    - jinja2
    - jsonschema
    - onigurumacffi <2,>=1.1.0
    - pyyaml
    - setuptools >=63.1.0
    - python-tzdata

tests:
  - python:
      imports:
        - ansible_navigator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/ansible-navigator
  license: Apache-2.0
  license_file: LICENSE
  summary: A text-based user interface (TUI) for the Red Hat Ansible Automation Platform
  description: |
    A text-based user interface (TUI) for the Red Hat Ansible Automation Platform
  documentation: https://ansible-navigator.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

