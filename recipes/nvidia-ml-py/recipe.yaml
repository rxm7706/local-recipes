# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nvidia-ml-py
  version: "13.610.43"
  major_version: ${{ version.split(".")[0]|int }}
  sha256: 65437eb73d68d0c62c931ca4d45038472faff03bd0b8729abba4b899f70d60f2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script:
    - rm example.py
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
  run_constraints:
    - nvidia-ml ==9999999999
    - pynvml ~=${{ major_version }}.0

tests:
  - python:
      imports:
        - pynvml
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python Bindings for the NVIDIA Management Library
  license: BSD-3-Clause
  license_file: README.txt
  homepage: http://www.nvidia.com
  repository: https://developer.nvidia.com/nvidia-management-library-nvml
  documentation: https://docs.nvidia.com/deploy/nvml-api/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
    - XuehaiPan
