# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: django-pymssql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-pymssql/django-pymssql-${{ version }}.tar.gz
  sha256: cdb801c253aedc76052a6ee828dcdda70ffad815080a5b5357453aa2bb96edbf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlserver_pymssql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aaugustin/django-pymssql
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django database backend for Microsoft SQL Server that works on non-Windows systems.
  description: |
    Django database backend for Microsoft SQL Server that works on non-Windows systems.

extra:
  recipe-maintainers:
    - rxm7706

