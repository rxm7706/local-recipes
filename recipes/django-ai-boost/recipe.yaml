# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"
  python_min: "3.12"

package:
  name: django-ai-boost
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-ai-boost/django_ai_boost-${{ version }}.tar.gz
  sha256: ba0dfd42f4a28f06f40210d22ccabe64ba5970538bc9d127329c3c2f91f64b3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - fastmcp <4,>=3.2.4

tests:
  - python:
      imports:
        - django_ai_boost
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vintasoftware/django-ai-boost
  license: MIT
  license_file: LICENSE
  summary: A Model Context Protocol (MCP) server for Django applications, inspired by Laravel Boost
  description: |
    A Model Context Protocol (MCP) server for Django applications, inspired by Laravel Boost

extra:
  recipe-maintainers:
    - rxm7706

