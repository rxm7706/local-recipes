# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "1.4.0"

package:
  name: flagembedding
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/FlagEmbedding/flagembedding-${{ version }}.tar.gz
    sha256: 2079c14ecf0341d64519785e53c0401122a752e5b6a0ac497f23c02f0d21b3b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install .

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=1.6.0
    - transformers >=4.44.2
    - datasets >=2.19.0
    - accelerate >=0.20.1
    - sentence-transformers
    - peft
    - sentencepiece
    - protobuf

tests:
  - python:
      imports:
        - FlagEmbedding
      pip_check: false
      python_version: ${{ python_min }}

about:
  homepage: https://github.com/FlagOpen/FlagEmbedding
  summary: FlagEmbedding
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - moritzwilksch
