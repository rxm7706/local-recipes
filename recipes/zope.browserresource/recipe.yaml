# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.browserresource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.browserresource/zope_browserresource-${{ version }}.tar.gz
  sha256: bd7acda7ec111ddaf325b03c777d3bc2ed193319fcf760c4d258fd19f73b434b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.component >=3.8.0
    - zope.configuration
    - zope.contenttype >=4.0.1
    - zope.i18n
    - zope.interface
    - zope.location
    - zope.publisher >=3.8
    - zope.schema
    - zope.traversing >3.7

tests:
  - python:
      imports:
        - zope.browserresource
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.browserresource/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Browser resources implementation for Zope.
  description: |
    Browser resources implementation for Zope.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
