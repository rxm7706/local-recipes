# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: llama-index-readers-llama-parse
  version: "0.6.1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_readers_llama_parse-${{ version }}.tar.gz
  sha256: 66eb378632522170a4190bb9691ba2d74c4a475becbf5bad4e88a0cb5b7159a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.13.0,<0.15
    - llama-parse >=0.5.0

tests:
  - python:
      imports:
        - llama_index.readers.llama_parse
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: llama-index readers llama-parse integration
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/readers/llama-index-readers-llama-parse

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
