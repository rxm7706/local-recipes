# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: llama-index-readers-llama-parse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-readers-llama-parse/llama_index_readers_llama_parse-${{ version }}.tar.gz
  sha256: 66eb378632522170a4190bb9691ba2d74c4a475becbf5bad4e88a0cb5b7159a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - llama-parse >=0.5.0

tests:
  - python:
      imports:
        - llama_index.readers.llama_parse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-readers-llama-parse/
  license: MIT
  license_file: LICENSE
  summary: llama-index readers llama-parse integration
  description: |
    llama-index readers llama-parse integration

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen

#### CFE metadata AND comments
