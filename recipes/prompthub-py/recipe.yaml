# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: prompthub-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prompthub-py/prompthub_py-${{ version }}.tar.gz
  sha256: d2d145213c86712d1951b840e77b8193b9605de77eb5119ce737ba66a058ca29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - requests
    - pyyaml

tests:
  - python:
      imports:
        - prompthub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/prompthub-py/
  license: Apache-2.0
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

