# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0"

package:
  name: reportlab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reportlab/reportlab-${{ version }}.tar.gz
  sha256: e4494a0c6623ae213bb856fba523171b2b54a7bf629fda02d5e525a7b899a784

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - pillow >=9.0.0
    - charset-normalizer

tests:
  - python:
      imports:
        - reportlab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.reportlab.com/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The Reportlab Toolkit
  description: |
    The Reportlab Toolkit

extra:
  recipe-maintainers:
    - bkpoon

#### CFE metadata AND comments
