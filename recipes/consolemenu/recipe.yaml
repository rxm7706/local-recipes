# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: consolemenu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ConsoleMenu/ConsoleMenu-${{ version }}.tar.gz
  sha256: 3f541cb396694faa3052a378b9a431cd4485b02a376a100bf2971cf9dfc948b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - consolemenu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ConsoleMenu/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Simplest console menu you've ever seen.
  description: |
    Simplest console menu you've ever seen.

extra:
  recipe-maintainers:
    - rxm7706

