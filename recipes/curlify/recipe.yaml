# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: curlify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/curlify/curlify-${{ version }}.tar.gz
  sha256: 7b488ff3c924dba3433a1cc74044c0942da21f0a97fa26c3138319ba640ca412

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - curlify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ofw/curlify
  license: MIT
  license_file: LICENSE
  summary: Convert Requests request objects to curl commands.
  description: |
    Convert Requests request objects to curl commands.

extra:
  recipe-maintainers:
    - kcemenike

#### CFE metadata AND comments
