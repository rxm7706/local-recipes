# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.1"

package:
  name: charset-normalizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/charset-normalizer/charset_normalizer-${{ version }}.tar.gz
  sha256: 6117b84ea48435e5356dc737f5121485c30920ba43375fa7b434fd753df0eac3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68,<84.1
  run:
    - python >=${{ python_min }}
    - -build-hook

tests:
  - python:
      imports:
        - _build_hook
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/charset-normalizer/
  license: MIT
  license_file: LICENSE
  summary: The Real First Universal Charset Detector. Open, modern and actively maintained alternative to Chardet.
  description: |
    The Real First Universal Charset Detector. Open, modern and actively maintained alternative to Chardet.
  repository: https://github.com/jawah/charset_normalizer
  documentation: https://charset-normalizer.readthedocs.io/

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
