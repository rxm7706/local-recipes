# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  name: aider-chat
  version: "0.86.2"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: https://github.com/Aider-AI/aider/archive/refs/tags/v${{ version }}.tar.gz
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f38a9d322f5609f0c13af82d50c6a11170185b3fdf26956e4a7e89ba19819159
  patches:
    - patches/relax-requirements.patch

build:
  noarch: python
  script:
    content:
      - ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
  number: 0
  python:
    entry_points:
      - aider = aider.main:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=68
    - setuptools-scm
  run:
    - aiohttp ==3.13.3
    - aiosignal ==1.4.0
    - annotated-doc ==0.0.4
    - backoff
    - beautifulsoup4 ==4.14.3
    - certifi ==2026.1.4
    - configargparse
    - diff-match-patch
    - diskcache
    - fastapi ==0.128.8
    - fastuuid ==0.14.0
    - flake8
    - frozenlist >=1.7.0
    - gitdb
    - gitpython
    - google-ai-generativelanguage ==0.6.15
    - google-api-core
    - google-api-python-client ==2.178.0
    - google-auth ==2.40.3
    - google-auth-httplib2
    - google-generativeai ==0.8.5
    - googleapis-common-protos
    - grep-ast ==0.9.0
    - grpcio >=1.62.0,<1.74.0
    - grpcio-status
    - hf-xet >=1.2.0
    - huggingface_hub ==1.4.1
    - importlib-metadata ==7.2.1
    - importlib-resources
    - json5 ==0.13.0
    - jsonschema
    - litellm ==1.81.10
    - markdown-it-py ==4.0.0
    - mccabe
    - mixpanel
    - multidict >=6.7.0
    - networkx ==3.4.2
    - numpy ==1.26.4
    - openai ==2.20.0
    - orjson >=3.11.5
    - oslex
    - packaging ==26.0
    - pathspec
    - pexpect
    - pillow ==12.1.1
    - posthog ==7.8.6
    - prompt_toolkit ==3.0.52
    - propcache >=0.3.1
    - protobuf >=4.21.6,<6.0.0dev
    - psutil
    - pycparser >=2.22
    - pydub
    - pycodestyle
    - pydantic
    - pydantic-core
    - pyflakes
    - pypandoc
    - pyperclip
    - pysoundfile
    - python >=${{ python_min }}
    - python-sounddevice
    - PyYAML
    - rich >=13.7.1
    - rpds-py ==0.30.0
    - scipy >=1.15.2
    - shellingham ==1.5.4
    - shtab
    - smmap
    - socksio
    - python-sounddevice
    - soupsieve
    - starlette ==0.52.1
    - tokenizers ==0.22.2
    - tree-sitter-c-sharp
    - tree-sitter-embedded-template
    - tree-sitter-language-pack ==0.13.0
    - tree-sitter-yaml ==0.7.2
    - typer ==0.23.0
    - typer-slim ==0.23.0
    - typing-extensions ==4.15.0
    - watchfiles

tests:
  - python:
      imports:
        - aider
        - aider.main
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - aider --help
      - if: unix
        then:
          - cp -r aider/website ${CONDA_PREFIX}/lib/python${{ python_min }}/site-packages/aider
          # A few tests fail
          - (AIDER_ANALYTICS=false python -m pytest tests/ -k "not test_model_accepts_settings_attribute and not TestRepoMapAllLanguages and not test_no_verify_ssl_sets_model_info_manager and not test_scrape_with_playwright_error_handling and not test_deprecated_args_show_warnings and not test_model_alias_in_warning 
            and not test_get_repo_map_with_identifiers and not test_repo_map_refresh_auto and not test_repo_map_refresh_files and not test_no_verify_ssl_flag_sets_model_info_manager and not test_cmd_web_imports_playwright and not test_scrape_actual_url_with_playwright and not test_scrape_self_signed_ssl") || true
    requirements:
      run:
        - botocore
        - pip
        - pyopenssl
        - pytest
        - python ${{ python_min }}.*
        - urllib3
    files:
      source:
        - tests/
        - aider/website/

about:
  homepage: https://github.com/Aider-AI/aider
  summary: 'aider is AI pair programming in your terminal.'
  description: |
    Aider lets you pair program with LLMs to start a new
    project or build on your existing codebase.
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://aider-chat.org/
  repository: https://github.com/Aider-AI/aider

extra:
  recipe-maintainers:
    - MementoRC

