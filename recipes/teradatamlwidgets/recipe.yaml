# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.0.0.7"

package:
  name: teradatamlwidgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/teradatamlwidgets/teradatamlwidgets-20.0.0.7-py3-none-any.whl
  sha256: bbea04ff4040a60417ebdd7e425c9a085cf8cf34acf15fdc0c75ad70fee3cc1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - teradataml >=20.00.00.01
    - ipywidgets >=8.1.1
    - ipyevents >=2.0.1

tests:
  - python:
      imports:
        - teradatamlwidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://teradata.com
  license: MIT
  license_file: LICENSE
  summary: Teradataml Widgets
  description: |
    Teradataml Widgets

extra:
  recipe-maintainers:
    - rxm7706

