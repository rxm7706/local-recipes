# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"
  python_min: "3.11"

package:
  name: envoy-data-plane
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/envoy_data_plane/envoy_data_plane-${{ version }}.tar.gz
  sha256: 79d6aecab054eecd79d5fa64bf6c775bf7f56ba7cb0b9cf9b34bf8f4c55b79e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-build-scripts
    - betterproto2-compiler >=0.9.0,<0.10
    - grpcio-tools >=1.75.1
    - requests
    - structlog
  run:
    - python >=${{ python_min }}
    - betterproto2 <0.10,>=0.9.0

tests:
  - python:
      imports:
        - envoy_data_plane
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/envoy_data_plane/
  license: MIT
  license_file: LICENSE
  summary: Python dataclasses for the Envoy Data-Plane-API
  description: |
    Python dataclasses for the Envoy Data-Plane-API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: envoy_data_plane
  cfe-upstream-registry: pypi
  cfe-upstream-name: envoy_data_plane
