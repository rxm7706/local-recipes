# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: streamlit-free-text-select
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-free-text-select/streamlit_free_text_select-${{ version }}.tar.gz
  sha256: 57e820108e508a947d4bf0b76c3b9fc8d27bc56c7d08b7134724a8cefe542aa2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_free_text_select
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-free-text-select/
  license: MIT
  license_file: LICENSE
  summary: A Streamlit component that allows you to select from a list of options or enter a custom value.
  description: |
    A Streamlit component that allows you to select from a list of options or enter a custom value.

extra:
  recipe-maintainers:
    - rxm7706

