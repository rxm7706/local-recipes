# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: torchcrf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/TorchCRF/TorchCRF-${{ version }}.tar.gz
  sha256: c916064e9b498a9f238a5f733e510ec3f271fd482e2970563a675cbf390d34fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch

tests:
  - python:
      imports:
        - TorchCRF
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/s14t284/TorchCRF
  license: MIT
  license_file: LICENSE
  summary: An Implementation of Conditional Random Fields in pytorch
  description: |
    An Implementation of Conditional Random Fields in pytorch

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: torchcrf
  cfe-upstream-registry: pypi
  cfe-upstream-name: TorchCRF
