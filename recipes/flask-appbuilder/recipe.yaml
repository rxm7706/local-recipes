# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.2"

package:
  name: flask-appbuilder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-appbuilder/flask_appbuilder-${{ version }}.tar.gz
  sha256: 0527623394b40b859ff47056e3621a61eefaaa16ccf188f272c64294307587ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - yaml
    - apispec <7,>=6.0.0
    - colorama <1,>=0.3.9
    - click <9,>=8
    - email-validator >=1.0.5
    - flask <4,>=2
    - flask-babel <5,>=3
    - flask-limiter <5,>3
    - flask-login <0.7,>=0.3
    - flask-sqlalchemy <4,>=2.4.0
    - flask-wtf <2,>=0.14.2
    - flask-jwt-extended <5.0.0,>=4.0.0
    - jsonschema <5,>=3
    - marshmallow <5,>=3.18.0
    - marshmallow-sqlalchemy <3.0.0,>=0.22.0
    - python-dateutil <3,>=2.3
    - prison <1.0.0,>=0.2.1
    - pyjwt <3.0.0,>=2.0.0
    - sqlalchemy <3,>=1.4.0
    - sqlalchemy-utils <1,>=0.32.21
    - wtforms <4
    - werkzeug <4

tests:
  - python:
      imports:
        - flask_appbuilder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dpgaspar/flask-appbuilder/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple and rapid application development framework, built on top of Flask. includes detailed security, auto CRUD generation for your models, google charts and much more.
  description: |
    Simple and rapid application development framework, built on top of Flask. includes detailed security, auto CRUD generation for your models, google charts and much more.

extra:
  recipe-maintainers:
    - halldc
    - xylar

