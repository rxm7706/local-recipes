# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.5"

package:
  name: jupytext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupytext/jupytext-${{ version }}.tar.gz
  sha256: 605026446d605aa54fd7f7fc69df6ae51c7a46053d4cebf05afdc64d66de3df0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - jupyter-builder >=1.0.0
  run:
    - python >=${{ python_min }}
    - markdown-it-py >=1.0
    - mdit-py-plugins
    - nbformat
    - packaging
    - pyyaml
    - tomli

tests:
  - python:
      imports:
        - jupytext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupytext/jupytext
  license: MIT
  license_file: LICENSE
  summary: Jupyter notebooks as Markdown documents, Julia, Python or R scripts
  description: |
    Jupyter notebooks as Markdown documents, Julia, Python or R scripts
  repository: https://github.com/jupytext/jupytext
  documentation: https://jupytext.org

extra:
  recipe-maintainers:
    - grst
    - mwouts

