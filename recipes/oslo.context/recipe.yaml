# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: oslo.context
  version: "6.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/oslo_context-${{ version }}.tar.gz
  sha256: 7e1fb03c6a97167959f37d930300154e0ee837ecdb85798c2bbe8878b56caaaf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - pbr !=2.1.0,>=2.0.0
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pbr !=2.1.0,>=2.0.0
    - debtcollector >=1.2.0

tests:
  - python:
      imports:
        - oslo_context
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: The Oslo context library has helpers to maintain useful information about a request context.
  homepage: https://docs.openstack.org/oslo.context/latest/
  repository: https://docs.openstack.org/infra/manual/developers.html

extra:
  recipe-maintainers:
    - tschoonj
