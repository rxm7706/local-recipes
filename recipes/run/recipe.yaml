# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: run
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/run/run-${{ version }}.tar.gz
  sha256: 4fedf927ccee02e797912af574d31a6d394073716db6864beb2bb75e05df3f36

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - run
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tehmaze/run
  license: MIT
  license_file: LICENSE
  summary: Python process run control
  description: |
    Python process run control

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
