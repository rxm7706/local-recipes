# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.1"

package:
  name: django-guid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-guid/django_guid-${{ version }}.tar.gz
  sha256: 701274b253d8cd92aa1d72f383e9ac245f17dc94038dd8d04b5719d479e3baea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - django <5.0,>=4.2
    - packaging

tests:
  - python:
      imports:
        - django_guid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snok/django-guid
  license: MIT
  license_file: LICENSE
  summary: Middleware that enables single request-response cycle tracing by injecting a unique ID into project logs
  description: |
    Middleware that enables single request-response cycle tracing by injecting a unique ID into project logs
  repository: https://github.com/snok/django-guid
  documentation: https://django-guid.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - sumanth-manchala

