# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-guid
  version: "3.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_guid-${{ version }}.tar.gz
  sha256: 701274b253d8cd92aa1d72f383e9ac245f17dc94038dd8d04b5719d479e3baea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - django >=4
    - packaging

tests:
  - python:
      imports:
        - django_guid
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Middleware that enables single request-response cycle tracing by injecting a unique ID into project logs
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/snok/django-guid
  repository: https://github.com/snok/django-guid
  documentation: https://django-guid.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - sumanth-manchala
