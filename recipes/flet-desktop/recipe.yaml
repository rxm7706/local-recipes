# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.86.5"

package:
  name: flet-desktop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flet-desktop/flet_desktop-${{ version }}.tar.gz
  sha256: 3268f419110a33622aee2d60cfcf88ffd0182b52c2a1fb741ed508bc67bef719

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flet ==0.86.5
    - rich >=13.0.0

tests:
  - python:
      imports:
        - flet_desktop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://flet.dev
  license: Apache-2.0
  license_file: LICENSE
  summary: Flet Desktop client in Flutter
  description: |
    Flet Desktop client in Flutter
  repository: https://github.com/flet-dev/flet
  documentation: https://flet.dev/docs

extra:
  recipe-maintainers:
    - rxm7706

