# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.11.1"

package:
  name: chainlit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chainlit/chainlit-${{ version }}.tar.gz
  sha256: 74b7f801c63f39e7b4d99fd1fa9654df4a97ce01a07c739558566d750b5de3b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiofiles >=23.1.0
    - asyncer <0.1.0,>=0.0.8
    - audioop-lts <0.3.0,>=0.2.1
    - click <9.0.0,>=8.1.3
    - dataclasses-json <0.7.0,>=0.6.7
    - fastapi >=0.116.1
    - filetype <2.0.0,>=1.2.0
    - httpx >=0.23.0
    - lazify <0.5.0,>=0.4.0
    - literalai ==0.1.201
    - mcp <2.0.0,>=1.11.0
    - nest-asyncio <2.0.0,>=1.6.0
    - packaging >=23.1
    - pydantic-settings >=2.10.1
    - pydantic <3,>=2.7.2
    - pyjwt <3.0.0,>=2.8.0
    - python-dotenv <2.0.0,>=1.0.0
    - python-multipart <1.0.0,>=0.0.18
    - python-socketio <6.0.0,>=5.11.0
    - starlette >=0.47.2
    - syncer <3.0.0,>=2.0.3
    - tomli <3.0.0,>=2.0.1
    - uvicorn >=0.35.0
    - watchfiles <2.0.0,>=1.1.1

tests:
  - python:
      imports:
        - chainlit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://chainlit.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Build Conversational AI.
  description: |
    Build Conversational AI.
  repository: https://github.com/Chainlit/chainlit
  documentation: https://docs.chainlit.io/

extra:
  recipe-maintainers:
    - timkpaine

#### CFE metadata AND comments
