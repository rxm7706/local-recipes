# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.11.1"

package:
  name: chainlit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chainlit/chainlit-${{ version }}.tar.gz
  sha256: 74b7f801c63f39e7b4d99fd1fa9654df4a97ce01a07c739558566d750b5de3b6

build:
  number: 0
  noarch: python
  script:
    - cd backend
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - chainlit = chainlit.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0
    #- literalai ==0.1.201
    - dataclasses-json >=0.6.7,<0.7.0
    - fastapi >=0.116.1
    - starlette >=0.47.2
    - uvicorn >=0.35.0
    - python-socketio >=5.11.0,<6.0.0
    - aiofiles >=23.1.0
    - syncer >=2.0.3,<3.0.0
    - asyncer >=0.0.8,<0.1.0
    - mcp >=1.11.0,<2.0.0
    - nest-asyncio >=1.6.0,<2.0.0
    - click >=8.1.3,<9.0.0
    - tomli >=2.0.1,<3.0.0
    - pydantic >=2.7.2,<3
    - python-dotenv >=1.0.0,<2.0.0
    - watchfiles >=1.1.1,<2.0.0
    - filetype >=1.2.0,<2.0.0
    - lazify >=0.4.0,<0.5.0
    - packaging >=23.1
    - python-multipart >=0.0.18,<1.0.0
    - pyjwt >=2.8.0,<3.0.0
    #- audioop-lts >=0.2.1,<0.3.0
    #- pydantic-settings >=2.10.1

tests:
  - python:
      imports:
        - chainlit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - chainlit --help

about:
  summary: Build Conversational AI.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://chainlit.io/
  documentation: https://docs.chainlit.io/
  repository: https://github.com/chainlit/chainlit

extra:
  recipe-maintainers:
    - timkpaine
