# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.53.0"

package:
  name: openlineage-python
  version: ${{ version }}

source:
  url: https://github.com/OpenLineage/OpenLineage/archive/refs/tags/${{ version }}.tar.gz
  sha256: f78ef097dd2f9e67b359d5624b9b3eabed2b44f5058fe4d2f2afad08c5781eaa

build:
  number: 0
  noarch: python
  script:
    - cd client/python
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ol-generate-code = openlineage.client.generator.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.4,<0.13.0
  run:
    - python >=${{ python_min }},<4.0
    - attrs >=20.0
    - python-dateutil >=2.8.2
    - pyyaml >=5.4
    - requests >=2.32.4
    - httpx2 >=2.12.0
    - packaging >=21.0

tests:
  - python:
      imports:
        - openlineage.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openlineage-python/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenLineage Python Client
  description: |
    OpenLineage Python Client

extra:
  recipe-maintainers:
    - rxm7706
    - millsks
    - xylar

#### CFE metadata AND comments
