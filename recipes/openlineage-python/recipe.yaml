# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.52.0"

package:
  name: openlineage-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/o/openlineage-python/openlineage_python-1.52.0-py3-none-any.whl
  sha256: e1bd73b3066021eecf69cc5c3571f6fd7e253768ea941f2c76f18969ea0ecb20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs >=20.0
    - python-dateutil >=2.8.2
    - pyyaml >=5.4
    - requests >=2.32.4
    - httpx >=0.27.0
    - packaging >=21.0

tests:
  - python:
      imports:
        - openlineage_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openlineage-python/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenLineage Python Client
  description: |
    OpenLineage Python Client

extra:
  recipe-maintainers:
    - rxm7706
    - millsks
    - xylar

