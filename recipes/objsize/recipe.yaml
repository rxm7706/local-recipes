# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: objsize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/objsize/objsize-${{ version }}.tar.gz
  sha256: df17998cf6ef4b24d52abee5020484491230e3f4af71a8ff0098c7455ad4d91c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - objsize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/liran-funaro/objsize
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Traversal over Python's objects subtree and calculate the total size of the subtree in bytes (deep size).
  description: |
    Traversal over Python's objects subtree and calculate the total size of the subtree in bytes (deep size).

extra:
  recipe-maintainers:
    - xylar

