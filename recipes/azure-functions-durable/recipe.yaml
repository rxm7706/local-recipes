# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: azure-functions-durable
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-functions-durable/azure_functions_durable-${{ version }}.tar.gz
  sha256: 8ba754a44fa57fbb2c314d48fea38a3cf4b43919ff2f6df42ef42b7c8f4a8d52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-functions >=1.12.0
    - aiohttp >=3.14.1
    - requests <3,>=2.33.0
    - python-dateutil >=2.8.0
    - furl >=2.1.0
    - opentelemetry-api >=1.32.1
    - opentelemetry-sdk >=1.32.1

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-functions-durable-python
  license: MIT
  license_file: LICENSE
  summary: Durable Functions For Python
  description: |
    Durable Functions For Python

extra:
  recipe-maintainers:
    - rxm7706

