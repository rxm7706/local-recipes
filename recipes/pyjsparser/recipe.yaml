# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyjsparser
  version: "2.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyjsparser-${{ version }}.tar.gz
  sha256: be60da6b778cc5a5296a69d8e7d614f1f870faf94e1b1b6ac591f2ad5d729579

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyjsparser
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Fast javascript parser (based on esprima.js)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/PiotrDabkowski/pyjsparser
  repository: https://github.com/PiotrDabkowski/pyjsparser
  documentation: https://github.com/PiotrDabkowski/pyjsparser

extra:
  recipe-maintainers:
    - dschreij
    - smathot
    - xylar
