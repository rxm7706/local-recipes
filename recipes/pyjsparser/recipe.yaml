# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.1"

package:
  name: pyjsparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyjsparser/pyjsparser-${{ version }}.tar.gz
  sha256: be60da6b778cc5a5296a69d8e7d614f1f870faf94e1b1b6ac591f2ad5d729579

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyjsparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PiotrDabkowski/pyjsparser
  license: MIT
  license_file: LICENSE
  summary: Fast javascript parser (based on esprima.js)
  description: |
    Fast javascript parser (based on esprima.js)

extra:
  recipe-maintainers:
    - dschreij
    - smathot
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyjsparser
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyjsparser
