    - pkg:pypi/pyjsparser@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/PiotrDabkowski/pyjsparser
  cfe-import-names: [pyjsparser]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pyjsparser-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.7.1

  cfe-forge-blocker-list:
