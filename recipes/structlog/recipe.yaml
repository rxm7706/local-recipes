# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: structlog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/structlog/structlog-${{ version }}.tar.gz
  sha256: f63a716cbd1b1291cf7661de7794b455acfa4c43c5bcf1630e6ad5ddc1adb3b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme >=22.8.0
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - structlog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/structlog/
  license: MIT OR Apache-2.0
  license_file: LICENSE
  summary: Structured Logging for Python
  description: |
    Structured Logging for Python
  repository: https://github.com/hynek/structlog
  documentation: https://www.structlog.org/

extra:
  recipe-maintainers:
    - vamega
    - aldanor
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: structlog
  cfe-upstream-registry: pypi
  cfe-upstream-name: structlog
