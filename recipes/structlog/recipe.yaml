    - pkg:pypi/structlog@${{ version }}
  cfe-upstream-repo: https://github.com/hynek/structlog
  cfe-upstream-homepage: https://pypi.org/project/structlog/
  cfe-import-names: [structlog]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
