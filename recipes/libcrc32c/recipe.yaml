# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: crc32c
  version: "1.1.2"

package:
  name: lib${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/google/${{ name }}/archive/${{ version }}.tar.gz
  sha256: ac07840513072b7fcebda6e821068aa04889018f24e10e46181068fb214d7e56

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
  run:
  run_exports:
    - ${{ pin_subpackage("libcrc32c", upper_bound="x.x") }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/libcrc32c${SHLIB_EXT}
      - if: unix
        then: test -f $PREFIX/include/crc32c/crc32c.h
      - if: unix
        then: test -f $PREFIX/lib/cmake/Crc32c/Crc32cTargets.cmake
      - if: win
        then: if not exist %PREFIX%\\Library\\bin\\crc32c.dll exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\crc32c.lib exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\include\\crc32c\\crc32c.h exit 1

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: CRC32C implementation with support for CPU-specific acceleration instructions
  homepage: https://github.com/google/crc32c

extra:
  recipe-maintainers:
    - xhochy
    - tswast
