# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.0"

package:
  name: purestorage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/purestorage/purestorage-${{ version }}.tar.gz
  sha256: 195ca34b46ecb157896ac5aac3c669a76d0ec50993d8a48a9a87d5a83fdf6529

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - purestorage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/purestorage/rest-client
  license: MIT
  license_file: LICENSE
  summary: Pure Storage FlashArray REST Client
  description: |
    Pure Storage FlashArray REST Client

extra:
  recipe-maintainers:
    - rxm7706

