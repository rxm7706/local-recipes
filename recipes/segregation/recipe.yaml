# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.5"
  python_min: "3.12"

package:
  name: segregation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/segregation/segregation-${{ version }}.tar.gz
  sha256: 9e3697e18072dffc3674049eb02e25d199fbdb7712abb5632d664dbd54b6b23e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=1.1.0
    - joblib >=1.5.0
    - libpysal >=4.12.1
    - mapclassify >=2.8
    - matplotlib-base >=3.10
    - numba >=0.60
    - numpy >=2.0.0
    - pandas >=2.3.0
    - pyproj >=3
    - scikit-learn >=1.5.0
    - scipy >=1.14.0
    - seaborn-base
    - tqdm

tests:
  - python:
      imports:
        - segregation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/segregation/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Analytics for spatial and non-spatial segregation in Python.
  description: |
    Analytics for spatial and non-spatial segregation in Python.
  repository: https://github.com/pysal/segregation

extra:
  recipe-maintainers:
    - renanxcortes
    - sjsrey
    - knaaptime
    - ocefpaf
    - jGaboardi
    - martinfleis

#### CFE metadata AND comments
