# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.0.1"

package:
  name: uuid6
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uuid6/uuid6-${{ version }}.tar.gz
  sha256: cd0af94fa428675a44e32c5319ec5a3485225ba2179eefcf4c3f205ae30a81bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uuid6
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/oittaa/uuid6-python
  license: MIT
  license_file: LICENSE
  summary: New time-based UUID formats which are suited for use as a database key
  description: |
    New time-based UUID formats which are suited for use as a database key

extra:
  recipe-maintainers:
    - deepsihag
    - xylar

