# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: myst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/myst/myst-${{ version }}.tar.gz
  sha256: 7929dab96cb9493338838874a91321227c62864f13fb0c98cf13b88a4ae18065

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - google-auth
    - google-auth-oauthlib
    - pytz
    - requests
    - urllib3
    - tenacity

tests:
  - python:
      imports:
        - myst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/myst/
  license: Apache-2.0
  license_file: LICENSE
  summary: This is the official Python library for the Myst Platform.
  description: |
    This is the official Python library for the Myst Platform.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: myst
  cfe-upstream-registry: pypi
  cfe-upstream-name: myst
  cfe-purls:
    - pkg:conda/myst@${{ version }}?channel=conda-forge
    - pkg:pypi/myst@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/myst/
  cfe-upstream-homepage: https://pypi.org/project/myst/
  cfe-import-names: [myst]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
