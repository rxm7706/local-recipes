# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: pandocfilters
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandocfilters/pandocfilters-${{ version }}.tar.gz
  sha256: 002b4a555ee4ebc03f8b66307e287fa492e4a77b4ea14d3f934328297bb4939e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pandocfilters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jgm/pandocfilters
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utilities for writing pandoc filters in python
  description: |
    Utilities for writing pandoc filters in python

extra:
  recipe-maintainers:
    - ickc
    - minrk

