# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: middleware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/middleware/middleware-${{ version }}.tar.gz
  sha256: e5370d5781c440637cb87be4964fc5cb9cec7d4c9a5bb6a7bf0bbae326639c5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - middleware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidbetz/middleware
  license: MIT
  license_file: LICENSE
  summary: Python module to add general middleware
  description: |
    Python module to add general middleware

extra:
  recipe-maintainers:
    - rxm7706

