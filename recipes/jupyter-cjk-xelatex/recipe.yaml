# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: jupyter-cjk-xelatex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-cjk-xelatex/jupyter-cjk-xelatex-${{ version }}.tar.gz
  sha256: 6b95a571be659ff1563e6f71d4cf00dab4ed5c7ada0c483d3284f9e72a94c106

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - console
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rainx/jupyter-cjk-xelatex
  license: MIT
  license_file: LICENSE
  summary: Handle the encoding error for jupyter nbconvert to convert notebook to pdf document
  description: |
    Handle the encoding error for jupyter nbconvert to convert notebook to pdf document

extra:
  recipe-maintainers:
    - rxm7706

