# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.0"

package:
  name: google-adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-adk/google_adk-${{ version }}.tar.gz
  sha256: 283e16dc5ffab7684e17098f7282470339e88a3d16ecfa62b4025680672c906b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}
    - aiohttp !=3.14.2
    - aiosqlite >=0.21
    - authlib <2,>=1.6.6
    - click <9,>=8.1.8
    - fastapi <1,>=0.133
    - google-auth >=2.47
    - google-genai <3,>=2.12.1
    - python-graphviz <1,>=0.20.2
    - httpx <1,>=0.27
    - jsonschema <5,>=4.23
    - opentelemetry-api <=1.43,>=1.39
    - opentelemetry-sdk <=1.43,>=1.39
    - packaging >=21
    - pydantic <3,>=2.12
    - python-dotenv <2,>=1
    - python-multipart <1,>=0.0.9
    - pyyaml <7,>=6.0.2
    - requests <3,>=2.32.4
    - starlette <2,>=1.3.1
    - tenacity <10,>=9
    - typing_extensions <5,>=4.5
    - tzlocal <6,>=5.3
    - uvicorn <1,>=0.34
    - watchdog <7,>=6
    - websockets <16,>=15.0.1

tests:
  - python:
      imports:
        - google.adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://google.github.io/adk-docs/
  license: Apache-2.0
  license_file: LICENSE
  summary: Agent Development Kit
  description: |
    Agent Development Kit
  documentation: https://google.github.io/adk-docs/

extra:
  recipe-maintainers:
    - soapy1
    - jan-janssen

