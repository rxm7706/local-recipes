# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: glean-mcp-proxy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glean-mcp-proxy/glean_mcp_proxy-${{ version }}.tar.gz
  sha256: e9f924d89afd85debd7e404e8a0113ab206ac6f907038502922fd2fd1083304a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - aiohttp
    - cachetools
    - fastapi
    - fastmcp <4.0.0,>=3.1.1
    - mcp
    - openapi-spec-validator <0.8.0,>=0.7.2
    - pydantic <3.0,>=2.0
    - pyjwt <3.0,>=2.0
    - python-dotenv
    - requests
    - tomli <3.0,>=2.0
    - uvicorn

tests:
  - python:
      imports:
        - mcp_proxy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/glean-mcp-proxy/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Expose OpenAPI endpoints to MCP
  description: |
    Expose OpenAPI endpoints to MCP

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
