# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: collections2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/collections2/collections2-${{ version }}.tar.gz
  sha256: c474b07b46ae915f5598227ac77668c6ad74a9d58e526d658c3d2dbb13753454

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - collections2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/therealfakemoot/BetterOrderedDict/
  license: MIT
  license_file: LICENSE
  summary: A set of improved data types inspired by the standard library's collections module.
  description: |
    A set of improved data types inspired by the standard library's collections module.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
