# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: pytest-arraydiff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-arraydiff/pytest_arraydiff-${{ version }}.tar.gz
  sha256: 70e2a9183af5b4f05f694727beb30eb5fc6712632b240ef259ec60984a629b1a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.1
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - pytest >=6.2
    - numpy

tests:
  - python:
      imports:
        - pytest_arraydiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-arraydiff
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pytest plugin to help with comparing array output from tests
  description: |
    pytest plugin to help with comparing array output from tests

extra:
  recipe-maintainers:
    - astrofrog
    - drdavella
    - mwcraig

