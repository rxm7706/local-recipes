# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: msgraph-sdk
  version: "1.48.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/msgraph_sdk-${{ version }}.tar.gz
  sha256: 0f5d667d0d1aed64539f623aba021525e6cce2d968ef16c5c0a0f0a49fb6908c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - azure-identity >=1.12.0
    - microsoft-kiota-serialization-json >=1.8.0,<2.0.0
    - microsoft-kiota-serialization-text >=1.8.0,<2.0.0
    - microsoft-kiota-serialization-form >=1.8.0,<2.0.0
    - microsoft-kiota-serialization-multipart >=1.8.0,<2.0.0
    - msgraph-core >=1.3.1

tests:
  - python:
      imports:
        - msgraph
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The Microsoft Graph Python SDK
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoftgraph/msgraph-sdk-python

extra:
  recipe-maintainers:
    - maresb
