# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.61.0"

package:
  name: msgraph-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msgraph-sdk/msgraph_sdk-${{ version }}.tar.gz
  sha256: fe3b2e21715d9523e3b15082421011a0067873f3b48c431208be988f17b34ed9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - azure-identity >=1.12.0
    - microsoft-kiota-serialization-json <2.0.0,>=1.8.0
    - microsoft-kiota-serialization-text <2.0.0,>=1.8.0
    - microsoft-kiota-serialization-form <2.0.0,>=1.8.0
    - microsoft-kiota-serialization-multipart <2.0.0,>=1.8.0
    - msgraph-core >=1.5.1

tests:
  - python:
      imports:
        - msgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoftgraph/msgraph-sdk-python#readme
  license: MIT
  license_file: LICENSE
  summary: The Microsoft Graph Python SDK
  description: |
    The Microsoft Graph Python SDK
  documentation: https://github.com/microsoftgraph/msgraph-sdk-python/docs

extra:
  recipe-maintainers:
    - maresb

#### CFE metadata AND comments
