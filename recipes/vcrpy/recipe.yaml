# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.3.0"

package:
  name: vcrpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vcrpy/vcrpy-${{ version }}.tar.gz
  sha256: 46d64e77e8d95e5c76c7d9a94ff05d8b38b2ae4e1d4869eb0235024b6fcb5212

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - pyyaml
    - wrapt

tests:
  - python:
      imports:
        - vcr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kevin1024/vcrpy
  license: MIT
  license_file: LICENSE.txt
  summary: Automatically mock your HTTP interactions to simplify and speed up testing
  description: |
    Automatically mock your HTTP interactions to simplify and speed up testing

extra:
  recipe-maintainers:
    - dopplershift

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: vcrpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: vcrpy
  cfe-purls:
    - pkg:conda/vcrpy@${{ version }}?channel=conda-forge
    - pkg:pypi/vcrpy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/kevin1024/vcrpy
  cfe-import-names: [vcr]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/vcrpy-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-8.3.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T12:35:28Z
