# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2"

package:
  name: python-browserstack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Python-BrowserStack/Python-BrowserStack-${{ version }}.tar.gz
  sha256: 0e652e934f3aadcee3c38716ce61032f5bfcbebf9432cd97d0498a976c95a6b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - browserstack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/Python-BrowserStack
  license: MIT
  license_file: LICENSE
  summary: First functional release
  description: |
    First functional release

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
