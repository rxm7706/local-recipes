# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: httpx-aiohttp
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/httpx_aiohttp-${{ version }}.tar.gz
  sha256: d4796b981f04734f1d1db9b4d9326ea16bc994f126460b93b69036262cd4a9d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.10.0,<4
    - httpx >=0.27.0

tests:
  - python:
      imports:
        - httpx_aiohttp
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Aiohttp transport for HTTPX
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/karpetrosyan/httpx-aiohttp

extra:
  recipe-maintainers:
    - jan-janssen
