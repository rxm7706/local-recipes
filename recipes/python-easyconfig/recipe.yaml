# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: python-easyconfig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Python-EasyConfig/Python-EasyConfig-${{ version }}.tar.gz
  sha256: b548f19ab850b55154f61162f314e3dbb276e11e3b26951b8a8fa0683c06bb29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - easyconfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RussellLuo/easyconfig
  license: MIT
  license_file: LICENSE
  summary: A simple library for loading configurations easily in Python, inspired by `flask.config`.
  description: |
    A simple library for loading configurations easily in Python, inspired by `flask.config`.

extra:
  recipe-maintainers:
    - rxm7706

