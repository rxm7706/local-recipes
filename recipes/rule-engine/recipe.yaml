# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.2"

package:
  name: rule-engine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rule-engine/rule_engine-${{ version }}.tar.gz
  sha256: dd871030a2eee062f3869fa952c3b93dbf56b21c8c01b73ca71e4c3ac8c5a4ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - lib
    - python-dateutil ~=2.7

tests:
  - python:
      imports:
        - lib.rule_engine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zeroSteiner/rule-engine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A lightweight, optionally typed expression language with a custom grammar for matching arbitrary Python objects.
  description: |
    A lightweight, optionally typed expression language with a custom grammar for matching arbitrary Python objects.

extra:
  recipe-maintainers:
    - drbixx
    - teake

#### CFE metadata AND comments
