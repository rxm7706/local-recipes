# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.7"

package:
  name: jupyterlab-amphi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-amphi/jupyterlab_amphi-${{ version }}.tar.gz
  sha256: 2b3858cf7cb7714a4d630604a952b715117c6c47faa594b64c7ebb77a9813198

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_amphi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://amphi.ai
  license: MIT
  license_file: LICENSE
  summary: Amphi is a no-code ETL extension for Jupyterlab.
  description: |
    Amphi is a no-code ETL extension for Jupyterlab.
  repository: https://github.com/amphi-ai/jupyterlab-amphi.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
