# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: spacey
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacey/spacey-${{ version }}.tar.gz
  sha256: d5680d496cff5db3e44364300605114dae9a60d4914f76526a0bd55a3254b5fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spacey
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mkatychev/spacey
  license: MIT
  license_file: LICENSE
  summary: A simple pure python library for the most common GIS functionality.
  description: |
    A simple pure python library for the most common GIS functionality.

extra:
  recipe-maintainers:
    - rxm7706

