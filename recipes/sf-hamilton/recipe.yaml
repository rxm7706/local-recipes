# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.90.0"

package:
  name: sf-hamilton
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/sf-hamilton/sf_hamilton-1.90.0-py3-none-any.whl
  sha256: 09b75e2c8b857bde57e097f3a0f6e4759ee7574876df77c62840051fb2c4bce9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - apache-hamilton ==1.90.0

tests:
  - python:
      imports:
        - sf_hamilton
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/apache/hamilton
  license: Apache-2.0
  license_file: LICENSE
  summary: This package has moved to apache-hamilton. Install apache-hamilton instead.
  description: |
    This package has moved to apache-hamilton. Install apache-hamilton instead.
  documentation: https://hamilton.apache.org/

extra:
  recipe-maintainers:
    - thewchan

