# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nfoursid
  version: "1.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d65ba1bb98715f6310d0136aecdc997313caa239c08cc95f7e48378f77d06a24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.3
    - numpy >=1.19
    - pandas >=1.1

tests:
  - python:
      imports:
        - nfoursid
        - nfoursid.tests
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -m unittest discover -v nfoursid.tests

about:
  license: MIT
  license_file: LICENSE
  summary: Implementation of N4SID, Kalman filtering and state-space models
  homepage: https://github.com/spmvg/nfoursid
  repository: https://github.com/spmvg/nfoursid
  documentation: https://nfoursid.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - spmvg
