# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: behave-xray
  version: ${{ version }}

source:
  url: https://github.com/fundakol/behave-xray/archive/refs/tags/${{ version }}.tar.gz
  sha256: f16925c98faed528bf1c14801b9b2d53efa2a10cf77e81881852ce317a323bd8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - behave
    - pluggy
    - requests

tests:
  - python:
      imports:
        - behave_xray
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fundakol/behave-xray
  license: Apache-2.0
  license_file: LICENSE
  summary: Behave JIRA XRAY results uploader
  description: |
    Behave JIRA XRAY results uploader

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: behave-xray
