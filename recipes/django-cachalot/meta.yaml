{% set name = "django-cachalot" %}
{% set version = "2.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/django_cachalot-{{ version }}.tar.gz
  sha256: 7d3b12022abc811e344deac8830228e2d027ed8dcf762e1116dccde74d360512

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - django-debug-toolbar
    - jinja2
    - python >={{ python_min }},<4.0
    - django >=4.2,<6.2
    # - Django <6.1,>=4.2
    # - Django <6.2,>=4.2

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - cachalot
  commands:
    - pip check

about:
  home: https://github.com/BertrandBordage/django-cachalot
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'No effort, no worry, maximum performance. '
  description: |
    Caches your Django ORM queries and automatically invalidates them.
  doc_url: http://django-cachalot.readthedocs.io/en/latest/
  dev_url: https://github.com/BertrandBordage/django-cachalot

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - sannykr
