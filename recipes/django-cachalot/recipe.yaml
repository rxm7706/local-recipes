# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-cachalot
  version: "2.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_cachalot-${{ version }}.tar.gz
  sha256: 7d3b12022abc811e344deac8830228e2d027ed8dcf762e1116dccde74d360512

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - django-debug-toolbar
    - jinja2
    - python >=${{ python_min }},<4.0
    - django >=4.2,<6.2
    # - Django <6.1,>=4.2
    # - Django <6.2,>=4.2

tests:
  - python:
      imports:
        - cachalot
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: No effort, no worry, maximum performance.
  description: |
    Caches your Django ORM queries and automatically invalidates them.
  homepage: https://github.com/BertrandBordage/django-cachalot
  repository: https://github.com/BertrandBordage/django-cachalot
  documentation: http://django-cachalot.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - sannykr
