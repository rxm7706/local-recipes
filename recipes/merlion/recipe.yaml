# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: merlion
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/merlion/merlion-${{ version }}.tar.gz
  sha256: 2ef99815b8be92c6d45651511e44fa435a44c0d72f54540290b1ec4e2f7ca7d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lightgbm
    - pandas
    - optuna

tests:
  - python:
      imports:
        - merlion
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thufirtan/merlion
  license: MIT
  license_file: LICENSE
  summary: Machine Learning Package
  description: |
    Machine Learning Package

extra:
  recipe-maintainers:
    - rxm7706

