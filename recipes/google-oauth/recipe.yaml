# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: google-oauth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-oauth/google-oauth-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - google_oauth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miedzinski/google-oauth
  license: MIT
  license_file: LICENSE
  summary: OAuth2 for Google APIs
  description: |
    OAuth2 for Google APIs

extra:
  recipe-maintainers:
    - rxm7706

