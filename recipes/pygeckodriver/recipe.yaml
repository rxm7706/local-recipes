# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.33.0"

package:
  name: pygeckodriver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygeckodriver/pygeckodriver-${{ version }}.tar.gz
  sha256: 11a431f96aaae2fbb5a2b6ffae62740031f7eaab9cbe79de2860152ed9a7c870

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pygeckodriver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/parklam/pygeckodriver
  license: Apache-2.0
  license_file: LICENSE
  summary: A package to sync gecko driver to lastest version
  description: |
    A package to sync gecko driver to lastest version

extra:
  recipe-maintainers:
    - rxm7706

