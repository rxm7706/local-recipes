# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: pipwin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pipwin/pipwin-${{ version }}.tar.gz
  sha256: 34791e633760240ac970ef41bf4cee4c31616ba31d9f58112e9bb83bab276746

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pipwin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lepisma/pipwin
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: pipwin installs compiled python binaries on windows provided by Christoph Gohlke
  description: |
    pipwin installs compiled python binaries on windows provided by Christoph Gohlke

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pipwin
