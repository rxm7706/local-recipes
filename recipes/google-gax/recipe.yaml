# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: google-gax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-gax/google-gax-${{ version }}.tar.gz
  sha256: 1d844c56f942d98f12a1b0ecabe8a17d69bef41ff513edd97253bcde02ffd929

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dill
    - future
    - googleapis-common-protos
    - grpcio
    - google-auth
    - ply
    - protobuf
    - requests

tests:
  - python:
      imports:
        - google
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/gax-python
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Google API Extensions
  description: |
    Google API Extensions

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
