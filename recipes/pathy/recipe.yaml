# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.2"

package:
  name: pathy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathy/pathy-${{ version }}.tar.gz
  sha256: 18e5bebae74d6a56e09ead1adc92d8794c1e7a33f45411c080f79ff2a4c31fae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pathlib-abc <0.6,>=0.5.2
    - smart-open >=5.2.1

tests:
  - python:
      imports:
        - pathy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/justindujardin/pathy
  license: Apache-2.0
  license_file: LICENSE
  summary: pathlib.Path subclasses for local and cloud bucket storage
  description: |
    pathlib.Path subclasses for local and cloud bucket storage

extra:
  recipe-maintainers:
    - conda-forge/spacy
    - justindujardin

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pathy
  cfe-upstream-registry: pypi
