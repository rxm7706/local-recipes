# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-rq
  version: "2.2.0"
  sha256: f8d8998f60f915c7229a365e2e3d232be7aa27d32f3bbb3219a04a7e7a62a95c

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  build:
    - python
    - setuptools
  run:
    - python
    - django >=1.8
    - rq >=0.5.5

tests:
  - script:
      - python -c "import django; from django.conf import settings; settings.configure(INSTALLED_APPS=['django_rq'], RQ_QUEUES={}); django.setup(); import django_rq"

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A simple app that provides django integration for RQ (Redis Queue)
  description: |
    Django integration with RQ, a Redis based Python queuing library. Django-RQ
    is a simple app that allows you to configure your queues in django's settings.py
    and easily use them in your project.
  homepage: https://github.com/ui/django-rq
  repository: https://github.com/ui/django-rq
  documentation: https://github.com/ui/django-rq

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
