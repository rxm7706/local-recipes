# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: img2table
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/img2table/img2table-${{ version }}.tar.gz
  sha256: 584334b46c898d733a2a44941df96bed2fefb2cd5e89ae57830614e6119be06f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
  run:
    - python >=${{ python_min }}
    - numpy
    - pypdfium2 >=4.30.0
    - opencv-contrib-python >=4
    - beautifulsoup4
    - xlsxwriter >=3.0.6

tests:
  - python:
      imports:
        - img2table
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xavctn/img2table
  license: MIT
  license_file: LICENSE
  summary: img2table is a table identification and extraction Python Library for PDF and images, based on OpenCV image processing
  description: |
    img2table is a table identification and extraction Python Library for PDF and images, based on OpenCV image processing

extra:
  recipe-maintainers:
    - rxm7706

