# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: ansible-pygments
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-pygments/ansible_pygments-${{ version }}.tar.gz
  sha256: a8c0c54c2f0237367b722f02941dfc52ecc850cb669b0e2ca842d0c0b8a7262d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.7
  run:
    - python >=${{ python_min }}
    - pygments >=2.4.0

tests:
  - python:
      imports:
        - ansible_pygments
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ansible-pygments/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Tools for building the Ansible Distribution
  description: |
    Tools for building the Ansible Distribution
  repository: https://github.com/ansible-community/ansible-pygments

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
