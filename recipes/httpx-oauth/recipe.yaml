# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: httpx-oauth
  version: "0.17.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d279997ea80e7fc6f713acc8ed0fcc07ec319bae939753a2579d1fb7a753167b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatch-regex-commit
    - hatchling
    - pip
    - python ${{ python_min }}
  run:
    - httpx >=0.18
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - httpx_oauth
        - httpx_oauth.clients
        - httpx_oauth.integrations
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
    requirements:
      run:
        - fastapi
        - pip
        - pytest <8.0.0
        - pytest-asyncio
        - pytest-mock
        - respx
        - requests
        - starlette
        - python ${{ python_min }}
    script:
      - pytest -vvv --capture=tee-sys tests

about:
  summary: Async OAuth client using HTTPX.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/frankie567/httpx-oauth
  documentation: https://frankie567.github.io/httpx-oauth/

extra:
  recipe-maintainers:
    - frankie567
    - thewchan
