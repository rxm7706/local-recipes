# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: vmc-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmc-client/vmc_client-${{ version }}.tar.gz
  sha256: 9e038d434d2815ee428653b725a3031d7099438bdb3ca1c4c1178fde241b0a30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpx <0.28.0,>=0.27.2
    - pydantic >2
    - loguru <0.8.0,>=0.7.2

tests:
  - python:
      imports:
        - vmc_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/vmc-client/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

