# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: cssselect2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cssselect2/cssselect2-${{ version }}.tar.gz
  sha256: 759aa22c216326356f65e62e791d66160a0f9c91d1424e8d8adc5e74dddfc6fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - tinycss2
    - webencodings

tests:
  - python:
      imports:
        - cssselect2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://doc.courtbouillon.org/cssselect2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: CSS selectors for Python ElementTree
  description: |
    CSS selectors for Python ElementTree
  repository: https://github.com/Kozea/cssselect2/
  documentation: https://doc.courtbouillon.org/cssselect2/

extra:
  recipe-maintainers:
    - johanneskoester
    - rxm7706

#### CFE metadata AND comments
