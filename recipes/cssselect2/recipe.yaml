# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cssselect2
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cssselect2-${{ version }}.tar.gz
  sha256: 759aa22c216326356f65e62e791d66160a0f9c91d1424e8d8adc5e74dddfc6fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - tinycss2
    - webencodings

tests:
  - python:
      imports:
        - cssselect2
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: CSS selectors for Python ElementTree
  description: |
    cssselect2 is a straightforward implementation of CSS3 Selectors for markup documents.
  homepage: https://github.com/Kozea/cssselect2
  repository: https://github.com/Kozea/cssselect2
  documentation: http://cssselect2.readthedocs.io

extra:
  recipe-maintainers:
    - johanneskoester
    - rxm7706
