schema_version: 1

context:
  # Cognition publishes no git tags and no changelog feed; the version of record
  # is the promoted build in https://static.devin.ai/cli/current/manifest.json.
  # Bump `version` and all five sha256 values together from that manifest.
  version: "3000.2.17"

package:
  name: devin-cli
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      url: https://static.devin.ai/cli/${{ version }}/devin-${{ version }}-x86_64-unknown-linux.tar.gz
      sha256: f0e1e9363afc6ee68c4ef87bab4aeb7ff5cc08a5fa838350ef3ceefdbb2a2be2

  - if: target_platform == "linux-aarch64"
    then:
      url: https://static.devin.ai/cli/${{ version }}/devin-${{ version }}-aarch64-unknown-linux.tar.gz
      sha256: 116dc71ef085a922bc3ff0ea0377d4b26c529a431d58246e36572913e2d25624

  - if: target_platform == "osx-64"
    then:
      url: https://static.devin.ai/cli/${{ version }}/devin-${{ version }}-x86_64-apple-darwin.tar.gz
      sha256: 8d4d9d627b9344898442e14fff87003b376dd9a1abf524372206f1727b21cd28

  - if: target_platform == "osx-arm64"
    then:
      url: https://static.devin.ai/cli/${{ version }}/devin-${{ version }}-aarch64-apple-darwin.tar.gz
      sha256: 60e2edd321f5cd5e1cfdf3d6d5e12064f25326ca8e36a8ad71f43d000745dff8

  - if: target_platform == "win-64"
    then:
      url: https://static.devin.ai/cli/${{ version }}/devin-${{ version }}-x86_64-pc-windows.zip
      sha256: dab924834d7254f98cc85410bc800cf23774714e90779e43a9b13c6fe5f97d01

build:
  number: 0
  dynamic_linking:
    # MUST stay false. `devin` is a ~133 MB stripped static-PIE Rust executable
    # with no dynamic conda deps. Conda's default post-build binary relocation
    # (RPATH patching / prefix rewriting) CORRUPTS it: the installed file came
    # out 142,456,305 bytes against upstream's 138,593,160 (+3.8 MB, different
    # sha256) and then segfaulted on any invocation, including `--version`,
    # even under `env -i`. The unmodified upstream binary runs fine. There is
    # nothing to relocate here, so turning it off is both correct and required.
    binary_relocation: false

tests:
  - if: unix
    then:
      - requirements:
          run:
            - ripgrep
        script:
          content: |
            set -euxo pipefail
            devin --version | rg '${{ version }}'
            test -f "${PREFIX}/share/devin/docs/index.mdx"
    else:
      - requirements:
          run:
            - ripgrep
        script:
          content: |
            devin --version | rg "${{ version }}"
            if errorlevel 1 exit /b 1

about:
  homepage: https://devin.ai/cli/
  documentation: https://docs.devin.ai
  license: LicenseRef-Cognition-Devin-CLI-Proprietary
  license_file: LICENSE.txt
  summary: Devin CLI — Cognition's agent in your terminal (PROPRIETARY, local build only, not redistributable)
  description: |
    The Devin CLI is a terminal client for Cognition's Devin coding agent. It
    authenticates against Cognition's service and runs agent sessions locally
    against your codebase.

    PROPRIETARY SOFTWARE. This recipe repackages Cognition's published,
    prebuilt release binary (a self-contained static Rust executable) for local
    installation only. It is NOT open source, NOT eligible for conda-forge, and
    the built artifact MUST NOT be uploaded to any channel — Cognition's terms
    of service grant no redistribution right. Using the CLI requires your own
    Devin account and entitlement; this package conveys no license to the
    Software.

extra:
  recipe-maintainers:
    - rxm7706

