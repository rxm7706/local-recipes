# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: evdev
  version: "1.9.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/evdev-${{ version }}.tar.gz
  sha256: 2c140e01ac8437758fa23fe5c871397412461f42d421aa20241dc8fe8cfccbc9

build:
  # C_INCLUDE_PATH is manually parsed by setup.py, required to be set to the Linux kernel header directory
  number: 0
  skip: not linux
  script: C_INCLUDE_PATH=${CONDA_BUILD_SYSROOT}/usr/include ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools >=61.0
  run:
    - python

tests:
  - python:
      imports:
        - evdev
      pip_check: true

about:
  summary: Bindings to the Linux input handling subsystem
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/gvalkov/python-evdev
  documentation: https://python-evdev.readthedocs.io

extra:
  recipe-maintainers:
    - ehfd
    - gvalkov
