# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: branca
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/branca/branca-${{ version }}.tar.gz
  sha256: e5040f4c286e973658c27de9225c1a5a7356dd0702a7c8d84c0f0dfbde388fe7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=41.2
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - jinja2 >=3

tests:
  - python:
      imports:
        - branca
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-visualization/branca
  license: MIT
  license_file: LICENSE.txt
  summary: Generate complex HTML+JS pages with Python
  description: |
    Generate complex HTML+JS pages with Python

extra:
  recipe-maintainers:
    - BibMartin
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: branca
  cfe-upstream-registry: pypi
  cfe-upstream-name: branca
  cfe-purls:
    - pkg:conda/branca@${{ version }}?channel=conda-forge
    - pkg:pypi/branca@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/python-visualization/branca
  cfe-import-names: [branca]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/branca-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.8.2

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T06:47:54Z
