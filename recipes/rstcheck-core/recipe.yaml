# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rstcheck-core
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 3fce3e9f9d250659db021b158e63a373298140dab9aa37ea917373c962bfa04e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - docutils >=0.7
    - importlib-metadata >=1.6
    - pydantic >=2
    - typing-extensions >=3.7.4

tests:
  - python:
      imports:
        - rstcheck_core
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Checks syntax of reStructuredText and code blocks nested within it
  homepage: https://pypi.org/project/rstcheck-core
  repository: https://github.com/rstcheck/rstcheck-core
  documentation: http://rstcheck-core.rtfd.io

extra:
  recipe-maintainers:
    - kynan
