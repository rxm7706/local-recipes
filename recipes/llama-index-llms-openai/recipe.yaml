# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.10"

package:
  name: llama-index-llms-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-openai/llama_index_llms_openai-${{ version }}.tar.gz
  sha256: aa8dabf08ea0b9740fc9dae9677f05049254be5e929794a886692eaf26973def

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.14.5
    - openai <3,>=1.108.1

tests:
  - python:
      imports:
        - llama_index.llms.openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-openai/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms openai integration
  description: |
    llama-index llms openai integration

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw

