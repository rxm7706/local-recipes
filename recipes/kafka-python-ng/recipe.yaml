# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kafka-python-ng
  version: "2.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/kafka-python-ng-${{ version }}.tar.gz
  sha256: 87ad3a766e2c0bec71d9b99bdd9e9c5cda62d96cfda61a8ca16510484d6ad7d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - setuptools-scm
    - pip
  run:
    - python >=3.8

tests:
  - python:
      imports:
        - kafka
      pip_check: true

about:
  summary: Pure Python client for Apache Kafka
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/wbarnha/kafka-python-ng

extra:
  recipe-maintainers:
    - wbarnha
