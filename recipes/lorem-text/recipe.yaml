# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0"

package:
  name: lorem-text
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lorem-text/lorem_text-${{ version }}.tar.gz
  sha256: 03013aabdbc33e7280d92c20ba041b9d8f21187e0164a9323fd173be6825c865

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lorem_text
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/lorem-text/
  license: MIT
  license_file: LICENSE
  summary: Dummy lorem ipsum text generator
  description: |
    Dummy lorem ipsum text generator

extra:
  recipe-maintainers:
    - rxm7706

