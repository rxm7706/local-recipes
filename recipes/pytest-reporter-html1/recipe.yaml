# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.5"

package:
  name: pytest-reporter-html1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-reporter-html1/pytest_reporter_html1-${{ version }}.tar.gz
  sha256: 8f80a123cf292a1fefc75ea86af7818719394e300ccbc1c8313789f00ee1b015

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - pytest-reporter >=0.4.0
    - jinja2
    - ansi2html >=1.3.0
    - htmlmin2
    - docutils >=0.22

tests:
  - python:
      imports:
        - pytest_reporter_html1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-reporter-html1/
  license: MIT
  license_file: LICENSE
  summary: A basic HTML report template for Pytest
  description: |
    A basic HTML report template for Pytest
  repository: https://github.com/christiansandberg/pytest-reporter-html1.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
