    - pkg:pypi/duckdb-engine@${{ version }}
  cfe-upstream-repo: https://github.com/Mause/duckdb_engine
  cfe-upstream-homepage: https://pypi.org/project/duckdb-engine/
  cfe-import-names: [duckdb_engine]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
