# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: duckdb-engine
  package_name: ${{ name | replace("-", "_") }}
  version: "0.17.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ package_name }}/${{ package_name }}-${{ version }}.tar.gz
  sha256: 396b23869754e536aa80881a92622b8b488015cf711c5a40032d05d2cf08f3cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - python-duckdb >=0.5.0,<=1.0.0
    - sqlalchemy >=1.3.22,<=2.0.35
    - packaging >=21.3

tests:
  - python:
      imports:
        - duckdb_engine
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pyarrow
        - pytest >=8.0.0,<9
        - pytest-remotedata >=0.4.0,<0.5
        - pytest-snapshot >=0.9.0,<1
        - hypothesis >=6.75.2,<7
        - pandas >=1,<2
        - fsspec >=2025.2.0,<2026.0.0
        - mypy >=1.4,<2
    script:
      - pytest --remote-data --pyargs duckdb_engine

about:
  license: MIT
  license_file: LICENSE.txt
  summary: SQLAlchemy driver for duckdb
  description: SQLAlchemy driver for duckdb
  homepage: https://github.com/Mause/duckdb_engine
  repository: https://github.com/Mause/duckdb_engine

extra:
  recipe-maintainers:
    - gforsyth
    - cpcloud
    - pavelzw
