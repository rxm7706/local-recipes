# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.0"

package:
  name: duckdb-engine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/duckdb-engine/duckdb_engine-${{ version }}.tar.gz
  sha256: 396b23869754e536aa80881a92622b8b488015cf711c5a40032d05d2cf08f3cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - python-duckdb >=0.5.0
    - packaging >=21
    - sqlalchemy >=1.3.22

tests:
  - python:
      imports:
        - duckdb_engine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/duckdb-engine/
  license: MIT
  license_file: LICENSE.txt
  summary: SQLAlchemy driver for duckdb
  description: |
    SQLAlchemy driver for duckdb
  repository: https://github.com/Mause/duckdb_engine

extra:
  recipe-maintainers:
    - gforsyth
    - cpcloud
    - pavelzw

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: duckdb-engine
  cfe-upstream-registry: pypi
