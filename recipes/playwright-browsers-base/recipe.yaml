# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: playwright-browsers-base
  version: ${{ version }}

build:
  number: 1
  noarch: generic
  script:
    - if: unix
      then: |
        set -ex
        mkdir -p "${PREFIX}/etc/conda/activate.d" "${PREFIX}/etc/conda/deactivate.d"
        mkdir -p "${PREFIX}/share/ms-playwright"
        cp "${RECIPE_DIR}/activate.sh"   "${PREFIX}/etc/conda/activate.d/playwright-browsers.sh"
        cp "${RECIPE_DIR}/deactivate.sh" "${PREFIX}/etc/conda/deactivate.d/playwright-browsers.sh"
        cp "${RECIPE_DIR}/activate.bat"   "${PREFIX}/etc/conda/activate.d/playwright-browsers.bat"
        cp "${RECIPE_DIR}/deactivate.bat" "${PREFIX}/etc/conda/deactivate.d/playwright-browsers.bat"
        # conda does not track empty directories; this keeps share/ms-playwright
        # present even when no browser package is installed, so a bare
        # `playwright install` has the right target already pointed at it.
        printf 'Playwright browser root managed by conda.\n' > "${PREFIX}/share/ms-playwright/README"
      else: |
        mkdir "%PREFIX%\etc\conda\activate.d" 2>nul
        mkdir "%PREFIX%\etc\conda\deactivate.d" 2>nul
        mkdir "%PREFIX%\share\ms-playwright" 2>nul
        copy /Y "%RECIPE_DIR%\activate.sh"    "%PREFIX%\etc\conda\activate.d\playwright-browsers.sh"
        copy /Y "%RECIPE_DIR%\deactivate.sh"  "%PREFIX%\etc\conda\deactivate.d\playwright-browsers.sh"
        copy /Y "%RECIPE_DIR%\activate.bat"   "%PREFIX%\etc\conda\activate.d\playwright-browsers.bat"
        copy /Y "%RECIPE_DIR%\deactivate.bat" "%PREFIX%\etc\conda\deactivate.d\playwright-browsers.bat"
        echo Playwright browser root managed by conda.> "%PREFIX%\share\ms-playwright\README"

tests:
  - package_contents:
      files:
        - etc/conda/activate.d/playwright-browsers.sh
        - etc/conda/deactivate.d/playwright-browsers.sh
        - share/ms-playwright/README
  - if: unix
    then:
      script:
        # The activation hook must be a no-op when the operator already chose a
        # path, and must point into the prefix otherwise. Each assignment is its
        # own statement: `VAR=x . file` is a TEMPORARY assignment in bash, so the
        # value reverts once the sourced file returns and the assertion would
        # read whatever the test env's own activation already set.
        - export PLAYWRIGHT_BROWSERS_PATH=/opt/mine; unset PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA; . "${PREFIX}/etc/conda/activate.d/playwright-browsers.sh"; test "${PLAYWRIGHT_BROWSERS_PATH}" = /opt/mine
        - unset PLAYWRIGHT_BROWSERS_PATH PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA; CONDA_PREFIX="${PREFIX}"; . "${PREFIX}/etc/conda/activate.d/playwright-browsers.sh"; test "${PLAYWRIGHT_BROWSERS_PATH}" = "${PREFIX}/share/ms-playwright"
        # ...and the deactivate hook must leave an operator value alone while
        # clearing one the activate hook set.
        - export PLAYWRIGHT_BROWSERS_PATH=/opt/mine; unset PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA; . "${PREFIX}/etc/conda/deactivate.d/playwright-browsers.sh"; test "${PLAYWRIGHT_BROWSERS_PATH}" = /opt/mine
        # Both hooks must survive `set -u`. Conda activation is sourced into the
        # caller's shell, and a bare ${VAR} reference to an unset variable aborts
        # it under nounset -- which is exactly how this broke the first time.
        - set -u; unset PLAYWRIGHT_BROWSERS_PATH PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA; CONDA_PREFIX="${PREFIX}"; . "${PREFIX}/etc/conda/activate.d/playwright-browsers.sh"; test "${PLAYWRIGHT_BROWSERS_PATH}" = "${PREFIX}/share/ms-playwright"
        - set -u; unset PLAYWRIGHT_BROWSERS_PATH PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA; . "${PREFIX}/etc/conda/deactivate.d/playwright-browsers.sh"

about:
  homepage: https://playwright.dev/docs/browsers
  repository: https://github.com/microsoft/playwright
  documentation: https://playwright.dev/docs/browsers#managing-browser-binaries
  summary: Points PLAYWRIGHT_BROWSERS_PATH at the conda prefix for playwright-* browser packages
  description: |
    Playwright resolves its browser binaries through `PLAYWRIGHT_BROWSERS_PATH`,
    defaulting to a machine-global `~/.cache/ms-playwright` populated by a
    network `playwright install`. That cache is shared across every
    environment on the host, is not described by any lock file, and is
    unavailable in an air-gapped deployment.

    This package owns a conda activation hook that redirects Playwright to
    `$CONDA_PREFIX/share/ms-playwright`, so the `playwright-chromium`,
    `playwright-chromium-headless-shell`, `playwright-firefox`,
    `playwright-webkit` and `playwright-ffmpeg` packages become the source of
    the browsers and the environment is reproducible from the lock alone.

    The hook never overrides an operator-supplied `PLAYWRIGHT_BROWSERS_PATH`;
    it only fills the variable in when it is unset, and only unsets on
    deactivation what it itself set.

    It carries no browser binaries. Install a `playwright-*` browser package
    alongside it.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

