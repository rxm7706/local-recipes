# CFE comments
# Header:
#    # Hand-authored: there is no upstream artifact to package. This is the
#    # ENABLER for the five playwright-* browser packages -- exactly one
#    # package may own etc/conda/activate.d/playwright-browsers.sh, or conda
#    # reports a clobber when two browser packages ship the same path. Every
#    # browser package run-depends on this one.
# build:
#    # noarch: generic -- a shell/bat fragment plus an empty-directory anchor,
#    # nothing platform-specific. The README file exists solely because conda
#    # does not track empty directories: without a tracked file inside it,
#    # share/ms-playwright/ would not be created, and a bare `playwright
#    # install` into the activated env would have to mkdir it itself.
#    # The activation hook is deliberately NON-DESTRUCTIVE. It fills
#    # PLAYWRIGHT_BROWSERS_PATH only when unset and records that it did so in
#    # PLAYWRIGHT_BROWSERS_PATH_SET_BY_CONDA, which the deactivate hook keys
#    # off. An operator pointing at a shared /opt/pw-browsers or a CI cache
#    # mount keeps their value through activate AND deactivate. Overriding it
#    # would silently break exactly the setups that already work.
# tests:
#    # Both branches of that rule are executed, not merely asserted to exist:
#    # a pre-set value must survive the hook, and an unset one must land on
#    # the prefix path. A contents-only test would pass on a hook that does
#    # the opposite of what it claims.
# about:
#    # Apache-2.0 matches microsoft/playwright, whose documented environment
#    # contract this package implements; the scripts themselves are authored
#    # here. No browser binary and no upstream code ships in this package.
####
