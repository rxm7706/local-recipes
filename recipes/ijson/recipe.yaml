# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.1"

package:
  name: ijson
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ijson/ijson-${{ version }}.tar.gz
  sha256: af40bd1a85f55db0b8b30715c858761306bd92d5590148636f75c3309e6e76bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ijson
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ICRAR/ijson
  license: BSD-3-Clause AND ISC
  license_file: LICENSE.txt
  summary: Iterative JSON parser with standard Python iterator interfaces
  description: |
    Iterative JSON parser with standard Python iterator interfaces

extra:
  recipe-maintainers:
    - rmax
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ijson
  cfe-upstream-registry: pypi
  cfe-upstream-name: ijson
  cfe-purls:
    - pkg:conda/ijson@${{ version }}?channel=conda-forge
    - pkg:pypi/ijson@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ICRAR/ijson
  cfe-import-names: [ijson]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ijson-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T09:42:48Z
