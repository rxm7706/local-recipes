# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.23.4"

package:
  name: pm4py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pm4py/pm4py-${{ version }}.tar.gz
  sha256: 1f8168a4dcbf1f0c1ada686fa37b53ffb4ea57c1841328d83831d561cf6a4b09
  patches:
    - patches/0001-inline-install-requires.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - networkx
    - python-graphviz
    - scipy
    - lxml
    - matplotlib-base
    - pytz
    - tqdm
    - cvxopt

tests:
  - python:
      imports:
        - pm4py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://processintelligence.solutions/
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: Process mining for Python
  description: |
    Process mining for Python
  repository: https://github.com/process-intelligence-solutions/pm4py
  documentation: https://processintelligence.solutions/pm4py/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pm4py
  cfe-upstream-registry: pypi
  cfe-upstream-name: pm4py
  cfe-purls:
    - pkg:conda/pm4py@${{ version }}?channel=conda-forge
    - pkg:pypi/pm4py@${{ version }}
  cfe-upstream-repo: https://github.com/process-intelligence-solutions/pm4py
  cfe-upstream-homepage: https://processintelligence.solutions/
  cfe-import-names: [pm4py]
