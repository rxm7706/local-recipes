# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: garak
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/garak/garak-${{ version }}.tar.gz
  sha256: 71962ecf7c3a09d27f0cee0b9cf26f7ecbceb122264fcfd487ddbf9a72b4a750

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - mikeshardmind-base2048 >=1.0.2
    - transformers <6.0,>=5.14.1
    - datasets <4.0,>=3.0.0
    - colorama >=0.4.3
    - tqdm >=4.67.1
    - cohere >=5.16.0
    - anthropic >=0.40.0
    - openai <3.0,>=2.0
    - replicate >=0.8.3
    - google-api-python-client >=2.0
    - backoff >=2.1.1
    - nltk ==3.10.0
    - accelerate >=0.23.0
    - avidtools ==0.1.2
    - stdlibs >=2022.10.9
    - langchain >=1.3.14
    - cmd2 ==2.4.3
    - pytorch >=2.13.0
    - sentencepiece >=0.1.99
    - markdown >=3.10.0
    - numpy >=2.0.0
    - zalgolib >=0.2.2
    - ecoji >=0.1.1
    - deepl ==1.17.0
    - litellm >=1.84.0
    - llm >=0.31
    - jsonpath-ng >=1.6.1
    - huggingface-hub >=1.0
    - lorem ==0.1.1
    - xdg-base-dirs >=6.0.1
    - wn ==0.9.5
    - ollama-python >=0.4.7
    - nvidia-riva-client ==2.16.0
    - google-cloud-translate >=2.0.4
    - grpcio-tools >=1.71.0
    - langdetect ==1.0.9
    - tiktoken >=0.7.0
    - mistralai ==1.5.2
    - pillow >=12.3.0
    - ftfy >=6.3.1
    - websockets >=13.0
    - boto3 >=1.28.0
    - py-markdown-table >=1.2.0
    - if: win
      then:
        - python-magic-bin

tests:
  - python:
      imports:
        - garak
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NVIDIA/garak
  license: MIT
  license_file: LICENSE
  summary: LLM vulnerability scanner
  description: |
    LLM vulnerability scanner

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: garak
  cfe-upstream-registry: pypi
  cfe-upstream-name: garak
  cfe-purls:
    - pkg:conda/garak@${{ version }}?channel=conda-forge
    - pkg:pypi/garak@${{ version }}
  cfe-upstream-repo: https://github.com/NVIDIA/garak
  cfe-upstream-homepage: https://github.com/NVIDIA/garak
  cfe-import-names: [garak]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
