# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: pyenchant
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyenchant/pyenchant-${{ version }}.tar.gz
  sha256: 825288246b5debc9436f91967650974ef0d5636458502619e322c476f1283891

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - enchant
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyenchant.github.io/pyenchant/
  license: LGPL-2.1
  license_file: LICENSE
  summary: Python bindings for the Enchant spellchecking system
  description: |
    Python bindings for the Enchant spellchecking system
  repository: https://github.com/pyenchant/pyenchant

extra:
  recipe-maintainers:
    - izahn
    - soapy1

#### CFE metadata AND comments
