# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyenchant
  version: "3.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyenchant-${{ version }}.tar.gz
  sha256: 825288246b5debc9436f91967650974ef0d5636458502619e322c476f1283891

build:
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - enchant
    - hunspell
    - hunspell-en

tests:
  - python:
      imports:
        - enchant
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python bindings for the Enchant spellchecking system
  license: LGPL-2.1-only
  license_file: LICENSE.txt
  homepage: https://pyenchant.github.io/pyenchant/

extra:
  recipe-maintainers:
    - izahn
    - soapy1
