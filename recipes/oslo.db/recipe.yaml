# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "18.1.0"

package:
  name: oslo.db
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.db/oslo_db-${{ version }}.tar.gz
  sha256: 075e86ce23c0c21db1d35091f1dcb21b05449c89c3a4326da4f2d3fb8330223f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - alembic >=0.9.6
    - debtcollector >=1.2.0
    - oslo.i18n >=3.15.3
    - oslo.config >=5.2.0
    - oslo.utils >=3.33.0
    - sqlalchemy >=2.0.5
    - stevedore >=1.20.0
    - testresources >=2.0.0
    - testscenarios >=0.4

tests:
  - python:
      imports:
        - oslo_db
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.db
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Database library
  description: |
    Oslo Database library
  repository: https://opendev.org/openstack/oslo.db

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
