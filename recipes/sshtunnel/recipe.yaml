# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: sshtunnel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sshtunnel/sshtunnel-${{ version }}.tar.gz
  sha256: e7cb0ea774db81bf91844db22de72a40aae8f7b0f9bb9ba0f666d474ef6bf9fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - paramiko

tests:
  - python:
      imports:
        - sshtunnel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pahaz/sshtunnel
  license: MIT
  license_file: LICENSE
  summary: Pure python SSH tunnels
  description: |
    Pure python SSH tunnels

extra:
  recipe-maintainers:
    - basnijholt
    - pahaz
    - fernandezcuesta
    - BrentDorsey
    - xylar

