# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: pyeapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyeapi/pyeapi-${{ version }}.tar.gz
  sha256: 05920677246823cd3dddf7d4d0f831fbc86fd416f356706a03bc56a291d78f3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyeapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arista-eosplus/pyeapi
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Client for eAPI
  description: |
    Python Client for eAPI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyeapi
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyeapi
  cfe-purls:
    - pkg:conda/pyeapi@${{ version }}?channel=conda-forge
    - pkg:pypi/pyeapi@${{ version }}
  cfe-upstream-repo: https://github.com/arista-eosplus/pyeapi
  cfe-upstream-homepage: https://github.com/arista-eosplus/pyeapi
  cfe-import-names: [pyeapi]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
