# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pymysql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyMySQL/pymysql-${{ version }}.tar.gz
  sha256: 6c7b17ca686988104d7426c27895b455cdeea3e9d3ceb1270f0c3704fead8c33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymysql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyMySQL/
  license: MIT
  license_file: LICENSE
  summary: Pure Python MySQL Driver
  description: |
    Pure Python MySQL Driver
  documentation: https://pymysql.readthedocs.io/

extra:
  recipe-maintainers:
    - djsutherland
    - synapticarbors
    - thewchan

