# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pysocks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PySocks/PySocks-${{ version }}.tar.gz
  sha256: 3f8804571ebe159c380ac6de37643bb4685970655d3bba243530d6558b799aa0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysocks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Anorov/PySocks
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: "A Python SOCKS client module. See https://github.com/Anorov/PySocks for more information."
  description: |
    A Python SOCKS client module. See https://github.com/Anorov/PySocks for more information.

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysocks
  cfe-upstream-registry: pypi
  cfe-upstream-name: pysocks
  cfe-purls:
    - pkg:conda/pysocks@${{ version }}?channel=conda-forge
    - pkg:pypi/pysocks@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/Anorov/PySocks
  cfe-import-names: [pysocks]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pysocks-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.1

  cfe-forge-blocker-list:
