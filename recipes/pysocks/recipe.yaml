# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pysocks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/P/PySocks/PySocks-${{ version }}.tar.gz
  sha256: 3f8804571ebe159c380ac6de37643bb4685970655d3bba243530d6558b799aa0

build:
  number: 7
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - ${{ virtual_pkg|default("__unix") }}
    - win_inet_pton

tests:
  - python:
      imports:
        - socks
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license_file: LICENSE
  license: BSD-3-Clause
  summary: A Python SOCKS client module. See https://github.com/Anorov/PySocks for more information.
  homepage: https://github.com/Anorov/PySocks
  repository: https://github.com/Anorov/PySocks
  documentation: https://github.com/Anorov/PySocks/blob/master/README.md

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
