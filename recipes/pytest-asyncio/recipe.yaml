# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: pytest-asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-asyncio/pytest_asyncio-${{ version }}.tar.gz
  sha256: c6c0d2259945122819f171a32ecea2c349ead889ee28176caaf492143424be42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - backports-asyncio-runner <2,>=1.1
    - pytest <10,>=8.4
    - typing_extensions >=4.12

tests:
  - python:
      imports:
        - pytest_asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-asyncio
  license: Apache-2.0
  license_file: LICENSE
  summary: Pytest support for asyncio
  description: |
    Pytest support for asyncio
  repository: https://github.com/pytest-dev/pytest-asyncio
  documentation: https://pytest-asyncio.readthedocs.io

extra:
  recipe-maintainers:
    - sodre
    - bollwyvl

