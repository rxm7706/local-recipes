# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18.0"

package:
  name: netutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netutils/netutils-${{ version }}.tar.gz
  sha256: dd584b856f3b454bb8ab00b415c6ca2c11ba254382db9444944e67d71e8bff19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - netutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://netutils.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Common helper functions useful in network automation.
  description: |
    Common helper functions useful in network automation.
  repository: https://github.com/networktocode/netutils
  documentation: https://netutils.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
