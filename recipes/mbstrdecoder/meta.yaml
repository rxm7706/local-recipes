{% set name = "mbstrdecoder" %}
{% set version = "1.1.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8cbfba26938befd8a35e3cc06ca0632f61320b7b2be7df32550b895e1725b1ce

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - releasecmd
  run:
    - chardet >=3.0.4,<6
    - python >={{ python_min }}

test:
  imports:
    - mbstrdecoder
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/thombashi/mbstrdecoder
  summary: multi-byte character string decoder
  dev_url: https://github.com/thombashi/mbstrdecoder
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - basnijholt
