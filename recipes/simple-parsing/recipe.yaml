# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.9"

package:
  name: simple-parsing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simple-parsing/simple_parsing-${{ version }}.tar.gz
  sha256: 0ff184ebaa6606420989ddbcb5650b21c62e2a59ec5388bc76c3343bda872cde

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - docstring_parser ~=0.15
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - simple_parsing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/simple-parsing/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A small utility to simplify and clean up argument parsing scripts.
  description: |
    A small utility to simplify and clean up argument parsing scripts.

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
