# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: langchain-githubcopilot-chat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-githubcopilot-chat/langchain_githubcopilot_chat-${{ version }}.tar.gz
  sha256: e83cfef4249749ff2384d2e819df97f84ad60b576108f16534439c6060bb4cb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - langchain-core <2.0.0,>=1.1.0
    - langchain-openai <2.0.0,>=0.3.0

tests:
  - python:
      imports:
        - langchain_githubcopilot_chat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/BANG404/langchain-githubcopilot-chat
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting GithubcopilotChat and LangChain
  description: |
    An integration package connecting GithubcopilotChat and LangChain
  repository: https://github.com/BANG404/langchain-githubcopilot-chat

extra:
  recipe-maintainers:
    - rxm7706

