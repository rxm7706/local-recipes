# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: h5netcdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h5netcdf/h5netcdf-${{ version }}.tar.gz
  sha256: 9b396a4cc346050fc1a4df8523bc1853681ec3544e0449027ae397cb953c7a16

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - packaging
    - numpy

tests:
  - python:
      imports:
        - h5netcdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://h5netcdf.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: netCDF4 via h5py
  description: |
    netCDF4 via h5py
  documentation: https://h5netcdf.org

extra:
  recipe-maintainers:
    - hmaarrfk
    - jhamman
    - ocefpaf
    - shoyer
    - kmuehlbauer

