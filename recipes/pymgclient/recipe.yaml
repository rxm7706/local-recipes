# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: pymgclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymgclient/pymgclient-${{ version }}.tar.gz
  sha256: 9499b865355447c1ffb5a9a0c9e87eb718b9d2e83c743722b7414d17bf47d807

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
    - cmake >=3.8
  run:
    - python >=${{ python_min }}
    - pyopenssl
    - networkx
    - python-tzdata

tests:
  - python:
      imports:
        - python.mgclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymgclient/
  license: Apache-2.0
  license_file: LICENSE
  summary: Memgraph database adapter for Python language
  description: |
    Memgraph database adapter for Python language
  repository: https://github.com/memgraph/pymgclient
  documentation: https://memgraph.github.io/pymgclient

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
