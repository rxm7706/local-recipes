# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.15"

package:
  name: molecule-plugins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/molecule-plugins/molecule_plugins-${{ version }}.tar.gz
  sha256: df4cab8d9e13ed448fc33d72af1fbae54883e9255a42c021ae7e875dfd3374c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - molecule >=25.1.0
    - if: linux
      then:
        - python-selinux
        - python-selinux

tests:
  - python:
      imports:
        - molecule_plugins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible-community/molecule-plugins
  license: MIT
  license_file: LICENSE
  summary: Molecule Plugins
  description: |
    Molecule Plugins
  documentation: https://molecule.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
