# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.39.1"

package:
  name: e2b
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/e2b/e2b-${{ version }}.tar.gz
  sha256: 458ca8dc4c1ed39e66fed6dcefae02b4328b79c7f04b707622f259fcec392293

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.10.0,<0.11.0
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.8.2
    - wcmatch <12,>=10.1
    - protobuf-py <0.2,>=0.1.1
    - httpx <1.0.0,>=0.27.0
    - h2 <5,>=4
    - attrs >=23.2.0
    - packaging >=24.1
    - typing_extensions >=4.10.0
    - dockerfile-parse <3,>=2.0.1
    - rich >=14.0.0
    - connectrpc <0.12,>=0.11.1
    - pyqwest <0.10,>=0.9.0

tests:
  - python:
      imports:
        - e2b
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://e2b.dev/
  license: MIT
  license_file: LICENSE
  summary: E2B SDK that give agents cloud environments
  description: |
    E2B SDK that give agents cloud environments
  repository: https://github.com/e2b-dev/e2b/tree/main/packages/python-sdk

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: e2b
  cfe-upstream-registry: pypi
  cfe-upstream-name: e2b
  cfe-purls:
    - pkg:conda/e2b@${{ version }}?channel=conda-forge
    - pkg:pypi/e2b@${{ version }}
  cfe-upstream-repo: https://github.com/e2b-dev/e2b/tree/main/packages/python-sdk
  cfe-upstream-homepage: https://e2b.dev/
  cfe-import-names: [e2b]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
