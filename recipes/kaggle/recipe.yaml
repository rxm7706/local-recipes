# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.4"

package:
  name: kaggle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kaggle/kaggle-${{ version }}.tar.gz
  sha256: 28a58f6c1b9f46ce2afdfb439e0c4e91219e818b377ea4254f4e479456d8cb78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bleach
    - jupytext
    - kagglesdk <1.0,>=0.1.35
    - packaging
    - protobuf
    - python-dateutil
    - python-dotenv
    - python-slugify
    - requests
    - tqdm
    - urllib3 >=1.15.1

tests:
  - python:
      imports:
        - kaggle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kaggle/kaggle-cli
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Access Kaggle resources anywhere
  description: |
    Access Kaggle resources anywhere

extra:
  recipe-maintainers:
    - ngam
    - CurtLH
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: kaggle
  cfe-upstream-registry: pypi
  cfe-upstream-name: kaggle
