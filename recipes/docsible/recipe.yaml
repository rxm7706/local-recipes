# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: docsible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docsible/docsible-${{ version }}.tar.gz
  sha256: cb9720505b3dc5352dff8fa4654211aacc81f862d2780b4ebcfd4e674278ff31

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click <9.0.0,>=8.1.7
    - pyyaml <7.0.0,>=6.0.1
    - jinja2 <4.0.0,>=3.1.2

tests:
  - python:
      imports:
        - docsible
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/docsible/docsible
  license: MIT
  license_file: LICENSE
  summary: Document generator for ansible role/collection
  description: |
    Document generator for ansible role/collection
  repository: https://github.com/docsible/docsible

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: docsible
  cfe-upstream-registry: pypi
  cfe-upstream-name: docsible
  cfe-purls:
    - pkg:conda/docsible@${{ version }}?channel=conda-forge
    - pkg:pypi/docsible@${{ version }}
  cfe-upstream-repo: https://github.com/docsible/docsible
  cfe-upstream-homepage: https://github.com/docsible/docsible
  cfe-import-names: [docsible]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:54:38Z
