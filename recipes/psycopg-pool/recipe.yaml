# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: psycopg-pool
  version: "3.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: b10b10b7a175d5cc1592147dc5b7eec8a9e0834eb3ed2c4a92c858e2f51eb63c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80.3.1
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.6

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - psycopg >=3.0
    script:
      - pip check
      - python -c "import psycopg_pool"

about:
  summary: Connection Pool for Psycopg
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  homepage: https://psycopg.org/psycopg3/
  repository: https://github.com/psycopg/psycopg/
  documentation: https://www.psycopg.org/psycopg3/docs/advanced/pool.html

extra:
  recipe-maintainers:
    - xylar
