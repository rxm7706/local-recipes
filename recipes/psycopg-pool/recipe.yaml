# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.1"

package:
  name: psycopg-pool
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/psycopg-pool/psycopg_pool-${{ version }}.tar.gz
  sha256: b10b10b7a175d5cc1592147dc5b7eec8a9e0834eb3ed2c4a92c858e2f51eb63c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.3.1
    - wheel >=0.37
  run:
    - python >=${{ python_min }}
    - psycopg
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - psycopg_pool
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://psycopg.org/
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  summary: Connection Pool for Psycopg
  description: |
    Connection Pool for Psycopg
  repository: https://github.com/psycopg/psycopg
  documentation: https://www.psycopg.org/psycopg3/docs/advanced/pool.html

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
