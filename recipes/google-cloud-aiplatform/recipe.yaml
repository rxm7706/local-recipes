# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.164.0"

package:
  name: google-cloud-aiplatform
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-aiplatform/google_cloud_aiplatform-${{ version }}.tar.gz
  sha256: 51fb881523631e591a3d11a46cb9d7bd390e05127fe1d08c596ddce3e45fed2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core !=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,!=2.5.*,!=2.6.*,!=2.7.*,<3.0.0,>=1.34.1
    - google-auth <3.0.0,>=2.47.0
    - certifi >=2023.7.22
    - proto-plus <2.0.0,>=1.22.3
    - protobuf !=4.21.0,!=4.21.1,!=4.21.2,!=4.21.3,!=4.21.4,!=4.21.5,<7.0.0,>=3.20.2
    - packaging >=14.3
    - google-cloud-storage <4.0.0,>=1.32.0
    - google-cloud-bigquery !=3.20.0,<4.0.0,>=1.15.0
    - google-cloud-resource-manager <3.0.0,>=1.3.3
    - google-genai <3.0.0,>=1.37.0
    - pydantic <3
    - typing_extensions
    - docstring_parser <1

tests:
  - python:
      imports:
        - vertexai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/python-aiplatform
  license: Apache-2.0
  license_file: LICENSE
  summary: Vertex AI API client library
  description: |
    Vertex AI API client library

extra:
  recipe-maintainers:
    - xylar

