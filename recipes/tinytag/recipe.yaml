# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  name: tinytag
  version: "2.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 84850f8045424b944475b9754bc35c7e09bcae1ab08d1f88d9293aa33af39a27

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tinytag
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/tinytag/tinytag
  summary: Python library for reading audio file metadata
  description: |
    tinytag is a Python library for reading audio file metadata
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/tinytag/tinytag
  repository: https://github.com/tinytag/tinytag

extra:
  recipe-maintainers:
    - pavelzw
