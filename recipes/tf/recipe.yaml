# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: tf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tf/tf-${{ version }}.tar.gz
  sha256: 0b345131c14c08f440cb6c33907fc40adf29354643e6d5b44a429a8e4b2a5a07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - msgpack <2.0.0,>=1.1.0
    - cryptography >43
    - grpcio <2.0.0,>=1.67.1
    - protobuf <6.0.0,>=5.28.3

tests:
  - python:
      imports:
        - tf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hfern/tf
  license: MIT
  license_file: LICENSE
  summary: Python Terraform Provider framework
  description: |
    Python Terraform Provider framework

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tf
  cfe-upstream-registry: pypi
  cfe-upstream-name: tf
  cfe-purls:
    - pkg:conda/tf@${{ version }}?channel=conda-forge
    - pkg:pypi/tf@${{ version }}
  cfe-upstream-repo: https://github.com/hfern/tf
  cfe-upstream-homepage: https://github.com/hfern/tf
  cfe-import-names: [tf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:02:50Z
