# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.66b1"

package:
  name: opentelemetry-instrumentation-pymongo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-pymongo/opentelemetry_instrumentation_pymongo-${{ version }}.tar.gz
  sha256: 3317c1cf5e68e0896e361f3ed2eeddba3388836f2c64191257ec0e5e69b16a09

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.pymongo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-pymongo
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry pymongo instrumentation
  description: |
    OpenTelemetry pymongo instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

