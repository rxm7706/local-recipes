# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: lightecc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightecc/lightecc-${{ version }}.tar.gz
  sha256: 31c10d460ed0b105878318b886306d89925567a80a3b051faa3bfd2fae71ea58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm

tests:
  - python:
      imports:
        - lightecc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serengil/LightECC
  license: MIT
  license_file: LICENSE
  summary: A Lightweight Elliptic Curve Cryptography Arithmetic Library for Python with Support for Prime and Binary Fields
  description: |
    A Lightweight Elliptic Curve Cryptography Arithmetic Library for Python with Support for Prime and Binary Fields

extra:
  recipe-maintainers:
    - rxm7706

