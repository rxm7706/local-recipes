# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: absolufy_imports
  version: "0.3.1"

package:
  name: ${{ name|replace("_", "-") }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c90638a6c0b66826d1fb4880ddc20ef7701af34192c94faf40b95d32b59f9793

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - absolufy-imports = absolufy_imports:main

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - absolufy_imports
      pip_check: true

about:
  summary: A tool and pre-commit hook to automatically convert relative imports to absolute.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/MarcoGorelli/absolufy-imports

extra:
  recipe-maintainers:
    - cpcloud
