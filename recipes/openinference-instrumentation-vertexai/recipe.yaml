# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.18"

package:
  name: openinference-instrumentation-vertexai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation-vertexai/openinference_instrumentation_vertexai-${{ version }}.tar.gz
  sha256: da6d5f8b60a3d42a65252ecffd389efbc4c2be1186d46d6974da2a9d986b253c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation >=0.1.51
    - openinference-semantic-conventions >=0.1.31
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.vertexai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-vertexai
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference VertexAI Instrumentation
  description: |
    OpenInference VertexAI Instrumentation

extra:
  recipe-maintainers:
    - RogerHYang

