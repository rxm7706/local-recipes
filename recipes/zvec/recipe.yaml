    - pkg:pypi/zvec@${{ version }}
  cfe-upstream-repo: https://github.com/alibaba/zvec
  cfe-upstream-homepage: https://github.com/alibaba/zvec
  cfe-import-names: [python.zvec]
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
