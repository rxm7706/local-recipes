# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-daemon
  version: "3.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/python_daemon-${{ version }}.tar.gz
  sha256: f7b04335adc473de877f5117e26d5f1142f4c9f7cd765408f0877757be5afbf4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - changelog-chug
    - docutils
    - setuptools >=62.4.0
    - pip
  run:
    - python >=${{ python_min }}
    - lockfile >=0.10

tests:
  - python:
      imports:
        - daemon
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Library to implement a well-behaved Unix daemon process.
  # The package states that parts are licensed under Apache-2.0 and other
  # parts under GPL-3.0-or-later. The final contents of the package are all
  # licensed as Apache-2.0. Thus only one license applies to this package.
  license: Apache-2.0
  license_file: LICENSE.ASF-2
  homepage: https://pagure.io/python-daemon/
  repository: https://pagure.io/python-daemon/

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin
    - ocefpaf
    - xylar
