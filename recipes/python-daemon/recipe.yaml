# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.2"

package:
  name: python-daemon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-daemon/python_daemon-${{ version }}.tar.gz
  sha256: f7b04335adc473de877f5117e26d5f1142f4c9f7cd765408f0877757be5afbf4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - wheel
    - setuptools >=62.4.0
    - docutils
    - changelog-chug
  run:
    - python >=${{ python_min }}
    - lockfile >=0.10

tests:
  - python:
      imports:
        - util
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-daemon/
  license: Apache-2.0
  license_file: LICENSE
  summary: Library to implement a well-behaved Unix daemon process.
  description: |
    Library to implement a well-behaved Unix daemon process.
  repository: https://pagure.io/python-daemon/

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin
    - ocefpaf
    - xylar

#### CFE metadata AND comments
