    - pkg:pypi/yaml-config@${{ version }}
  cfe-upstream-repo: https://github.com/GreenBuildingRegistry/yaml-config
  cfe-upstream-homepage: https://github.com/GreenBuildingRegistry/yaml-config
  cfe-import-names: [yamlconf]
