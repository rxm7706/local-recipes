# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: yaml-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yaml-config/yaml-config-${{ version }}.tar.gz
  sha256: 5924c92d8e7c49fa9ab2ef8bb3122794b261f217b14e69698a481d4e3ba535b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - typing

tests:
  - python:
      imports:
        - yamlconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GreenBuildingRegistry/yaml-config
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python client for reading yaml based config files
  description: |
    Python client for reading yaml based config files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: yaml-config
  cfe-upstream-registry: pypi
  cfe-upstream-name: yaml-config
  cfe-purls:
