# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: harness-mcp-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/harness-mcp-server/harness_mcp_server-${{ version }}.tar.gz
  sha256: 23bf620da065eb659b3d8f6dd0ea3f39627368a98949462505dc61123dd7e33b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.24.0
    - pydantic-settings >=2.0
    - pydantic >=2.0
    - python-dotenv >=1.0.0

tests:
  - python:
      imports:
        - harness_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/harness-mcp-server/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: MCP server for Harness API integration
  description: |
    MCP server for Harness API integration

extra:
  recipe-maintainers:
    - rxm7706

