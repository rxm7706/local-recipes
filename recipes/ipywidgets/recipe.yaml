# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.8"

package:
  name: ipywidgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipywidgets/ipywidgets-${{ version }}.tar.gz
  sha256: 61f969306b95f85fba6b6986b7fe45d73124d1d9e3023a8068710d47a22ea668

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - comm >=0.1.3
    - ipython >=6.1.0
    - traitlets >=4.3.1
    - widgetsnbextension ~=4.0.14
    - jupyterlab-widgets ~=3.0.15

tests:
  - python:
      imports:
        - ipywidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter interactive widgets
  description: |
    Jupyter interactive widgets

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - SylvainCorlay
    - willingc
    - jasongrout
    - maartenbreddels
    - pbugnion
    - jtpio
    - martinRenou
    - vidartf
    - bollwyvl

