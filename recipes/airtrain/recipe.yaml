# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.68"

package:
  name: airtrain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airtrain/airtrain-${{ version }}.tar.gz
  sha256: d4f02c4bfc3be8de99dccb2ad60dd83d1a9f35935f528db9933c9af6bc5be436

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - pydantic >=2.10.6
    - openai >=1.60.1
    - python-dotenv >=1.0.1
    - pyyaml >=6.0.2
    - firebase-admin >=6.6.0
    - loguru >=0.7.3
    - requests >=2.32.3
    - boto3 >=1.36.6
    - together >=1.3.13
    - anthropic >=0.45.0
    - groq >=0.15.0
    - cerebras-cloud-sdk >=1.19.0
    - google-genai >=1.0.0
    - fireworks-ai >=0.15.12
    - google-generativeai >=0.8.4
    - click >=8.0.0
    - rich >=13.3.1
    - prompt-toolkit >=3.0.36
    - colorama >=0.4.6
    - typer >=0.9.0
    - posthog >=3.7.0

tests:
  - python:
      imports:
        - airtrain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rosaboyle/airtrain.dev
  license: MIT
  license_file: LICENSE
  summary: A platform for building and deploying AI agents with structured skills
  description: |
    A platform for building and deploying AI agents with structured skills
  documentation: https://docs.airtrain.dev/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: airtrain
  cfe-upstream-registry: pypi
  cfe-upstream-name: airtrain
  cfe-purls:
