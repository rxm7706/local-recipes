    - pkg:pypi/airtrain@${{ version }}
  cfe-upstream-repo: https://github.com/rosaboyle/airtrain.dev
  cfe-upstream-homepage: https://github.com/rosaboyle/airtrain.dev
  cfe-import-names: [airtrain]
