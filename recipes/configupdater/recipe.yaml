# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2"

package:
  name: configupdater
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ConfigUpdater/ConfigUpdater-${{ version }}.tar.gz
  sha256: 9fdac53831c1b062929bf398b649b87ca30e7f1a735f3fbf482072804106306b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=46.1.0
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - configupdater
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyscaffold/configupdater
  license: MIT
  license_file: LICENSE.txt
  summary: Parser like ConfigParser but for updating configuration files
  description: |
    Parser like ConfigParser but for updating configuration files
  repository: https://github.com/pyscaffold/configupdater/
  documentation: https://configupdater.readthedocs.io/

extra:
  recipe-maintainers:
    - maresb
    - FlorianWilhelm
    - abravalheri

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: configupdater
  cfe-upstream-registry: pypi
