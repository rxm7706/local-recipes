    - pkg:pypi/configupdater@${{ version }}
  cfe-upstream-repo: https://github.com/pyscaffold/configupdater/
  cfe-upstream-homepage: https://github.com/pyscaffold/configupdater
  cfe-import-names: [configupdater]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
