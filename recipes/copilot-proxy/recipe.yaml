# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: copilot-proxy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/copilot-proxy/copilot_proxy-${{ version }}.tar.gz
  sha256: d0451e410377817e5a1284344c396caddc542d0ccc8afffcd3c51c6f23040fdb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - fastapi >=0.110
    - httpx >=0.27
    - uvicorn >=0.27
    - openai >=1.0.0

tests:
  - python:
      imports:
        - copilot_proxy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/modpotato/copilot-proxy
  license: MIT
  license_file: LICENSE
  summary: GitHub Copilot-compatible proxy for Z.AI GLM coding models
  description: |
    GitHub Copilot-compatible proxy for Z.AI GLM coding models
  repository: https://github.com/modpotato/copilot-proxy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
