# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.0"

package:
  name: urllib3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urllib3/urllib3-${{ version }}.tar.gz
  sha256: 231e0ec3b63ceb14667c67be60f2f2c40a518cb38b03af60abc813da26505f4c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0,<2
    - hatch-vcs >=0.4.0,<0.6.0
    - setuptools-scm >=8,<11
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - urllib3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/urllib3/
  license: MIT
  license_file: LICENSE.txt
  summary: HTTP library with thread-safe connection pooling, file post, and more.
  description: |
    HTTP library with thread-safe connection pooling, file post, and more.
  repository: https://github.com/urllib3/urllib3
  documentation: https://urllib3.readthedocs.io

extra:
  recipe-maintainers:
    - shazow
    - sethmlarson
    - ocefpaf
    - pquentin
    - illia-v

#### CFE metadata AND comments
