# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.3.1"

package:
  name: cuda-bindings
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/cuda-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 731f2bcae67f7fa7acd1720c4457239b9f1f1f279c8d4fbfd23a164220abe8e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.0.0
  run:
    - python >=${{ python_min }}
    - cuda-pathfinder >=1.4.2
    - if: linux
      then:
        - cuda-toolkit

tests:
  - python:
      imports:
        - cuda_python_test_helpers.cuda_python_test_helpers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cuda-bindings/
  license: LicenseRef-NVIDIA-SOFTWARE-LICENSE
  license_file: LICENSE
  summary: Python bindings for CUDA
  description: |
    Python bindings for CUDA
  repository: https://github.com/NVIDIA/cuda-python
  documentation: https://nvidia.github.io/cuda-python/

extra:
  recipe-maintainers:
    - rwgk
    - rparolin
    - bdice
    - jakirkham
    - leofang
    - m3vaz
    - mmccarty
    - vyasr
    - vzhurba01
    - kkraus14
    - oleksandr-pavlyk

