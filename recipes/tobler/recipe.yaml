# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"
  python_min: "3.12"

package:
  name: tobler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tobler/tobler-${{ version }}.tar.gz
  sha256: 9d199bee5f14fed64ef392700e15ea72dfb68543f2293b505071ee6d2f62efe9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=1.0
    - joblib >=1.4
    - libpysal >=4.10
    - numpy >=2.0
    - pandas >=2.2
    - rasterio >=1.4
    - rasterstats >=0.20
    - scipy >=1.13
    - statsmodels >=0.14
    - tqdm >=4.67

tests:
  - python:
      imports:
        - tobler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/tobler/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Tobler is a Python library for areal interpolation.
  description: |
    Tobler is a Python library for areal interpolation.
  repository: https://github.com/pysal/tobler

extra:
  recipe-maintainers:
    - knaaptime
    - sjsrey
    - martinfleis
    - jGaboardi

#### CFE metadata AND comments
