# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: mmdc
  version: ${{ version }}

source:
  url: https://github.com/mohammadraziei/mmdc/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d579f10307ca5d6e13c540ddb146d0256199925fe977d7d5eebee3e7858a533d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - quickjs-ng >=0.15.1
    - resvg-py >=0.3.2
    - termaid >=0.7.1

tests:
  - python:
      imports:
        - mmdc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mmdc/
  license: MIT
  license_file: LICENSE
  summary: A pure Python library to render Mermaid diagrams to SVG, PNG, and PDF without Node.js, npm, or any external browser dependencies. Built with a high-performance embedded engine, it’s designed for seamless documentation automation and robust CI/CD pipelines.
  description: |
    A pure Python library to render Mermaid diagrams to SVG, PNG, and PDF without Node.js, npm, or any external browser dependencies. Built with a high-performance embedded engine, it’s designed for seamless documentation automation and robust CI/CD pipelines.
  repository: https://github.com/mohammadraziei/mmdc
  documentation: https://mohammadraziei.github.io/mmdc

extra:
  recipe-maintainers:
    - rxm7706

