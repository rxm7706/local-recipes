# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: memgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/memgraph/memgraph-${{ version }}.tar.gz
  sha256: a9a5059cb5f8f754226191bc31268a777dc1e6ede7b9f6ec163573409060fe82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - memgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mfayoumi/memgraph
  license: MIT
  license_file: LICENSE
  summary: In memory graph database
  description: |
    In memory graph database

extra:
  recipe-maintainers:
    - rxm7706

