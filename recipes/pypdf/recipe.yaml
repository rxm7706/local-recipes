# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.16.1"

package:
  name: pypdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypdf/pypdf-${{ version }}.tar.gz
  sha256: c4d1b43ddae921387321cf63936cd16a7743b91d2da92f165c149a195c972ba9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<5
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - pypdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pypdf/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  description: |
    A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  repository: https://github.com/py-pdf/pypdf
  documentation: https://pypdf.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - MartinThoma
    - bollwyvl

#### CFE metadata AND comments
