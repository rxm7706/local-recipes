schema_version: 1

context:
  version: "0.1.1.post2209072238"

package:
  name: thop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/thop/thop-0.1.1.post2209072238-py3-none-any.whl
  sha256: 01473c225231927d2ad718351f78ebf7cffe6af3bed464c4f1ba1ef0f7cdda27

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch

tests:
  - python:
      imports:
        - thop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Lyken17/pytorch-OpCounter/
  license: MIT
  license_file: LICENSE
  summary: A tool to count the FLOPs of PyTorch model.
  description: |
    A tool to count the FLOPs of PyTorch model.

extra:
  recipe-maintainers:
    - rxm7706

