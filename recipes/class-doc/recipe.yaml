# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.6"

package:
  name: class-doc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/class-doc/class-doc-${{ version }}.tar.gz
  sha256: f5e036ed9b7f6de528affdd9f038851910b342d4c1c1252983a55ff080b530e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - more-itertools

tests:
  - python:
      imports:
        - class_doc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/danields761/class-doc
  license: MIT
  license_file: LICENSE
  summary: Extract attributes docstrings defined in various ways
  description: |
    Extract attributes docstrings defined in various ways
  repository: https://github.com/danields761/class-doc

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
