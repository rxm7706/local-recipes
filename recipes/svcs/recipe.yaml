# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: svcs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/svcs/svcs-${{ version }}.tar.gz
  sha256: 71550e3b228d529448136d78013b2d65528eec4632b8779f8f89c1d8585eed99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - attrs >=21.3.0
    - typing_extensions >=4.13.0

tests:
  - python:
      imports:
        - svcs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/svcs/
  license: MIT
  license_file: LICENSE
  summary: A Flexible Service Locator
  description: |
    A Flexible Service Locator
  repository: https://github.com/hynek/svcs
  documentation: https://svcs.hynek.me/

extra:
  recipe-maintainers:
    - tdsmith

#### CFE metadata AND comments
