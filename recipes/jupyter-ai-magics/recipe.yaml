# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyter-ai-magics
  version: "2.31.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jupyter_ai_magics-${{ version }}.tar.gz
  sha256: cc2397f5e81ba37eb3e6a8968edd6af3d5efd93baaf3369e5334717986bf36ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling >=1.4.0
    - hatch-nodejs-version
    - pip
    - hatch-jupyter-builder
  run:
    - python >=${{ python_min }}
    - ipython
    - importlib-metadata >=5.2.0
    - langchain >=0.3.0,<0.4.0
    - langchain-community >=0.3.0,<0.4.0
    - pydantic >=2.10.0,<3.0
    - click >=8.1,<9
    - jsonpath-ng >=1.5.3,<2

tests:
  - python:
      imports:
        - jupyter_ai_magics
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Jupyter AI magic commands
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jupyterlab/jupyter-ai

extra:
  recipe-maintainers:
    - dlqqq
    - 3coins
    - andrii-i
    - srdas
