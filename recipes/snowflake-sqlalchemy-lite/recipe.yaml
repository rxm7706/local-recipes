# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: snowflake-sqlalchemy-lite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snowflake-sqlalchemy-lite/snowflake-sqlalchemy-lite-${{ version }}.tar.gz
  sha256: cf30d77488707517eae051f77a42092372d665438fc2fe680a12464d1e132d2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snowflake.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/snowflake-sqlalchemy-lite/
  license: Apache-2.0
  license_file: LICENSE
  summary: Snowflake SQLAlchemy Dialect LITE!
  description: |
    Snowflake SQLAlchemy Dialect LITE!

extra:
  recipe-maintainers:
    - rxm7706

