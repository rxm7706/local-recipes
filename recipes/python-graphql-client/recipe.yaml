# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: python-graphql-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-graphql-client/python_graphql_client-${{ version }}.tar.gz
  sha256: fdbd03115dde8776db02e60414b83b018d7d95e5752d6d5fabf21c99265f5b9d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - requests
    - websockets

tests:
  - python:
      imports:
        - python_graphql_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/prodigyeducation/python-graphql-client
  license: MIT
  license_file: LICENSE
  summary: Python GraphQL Client
  description: |
    Python GraphQL Client

extra:
  recipe-maintainers:
    - rxm7706

