{% set name = "langchain-classic" %}
{% set version = "1.0.8" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/8d/65/6b5e8a7ff2f2968652c88a67dcecb925b9d8f0a0ce9458c76cd5a0dbd138/langchain_classic-{{ version }}.tar.gz
  sha256: ada0cc341a8a5b80fb24d73bdfaaeb849056ee2d8a41cc468355163fd3667484

build:
  number: {{ build+100 if python_min == "3.10" else build }}
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - langchain-core >=1.4.4,<2.0.0
    - langchain-text-splitters >=1.1.2,<2.0.0
    - langsmith >=0.1.17,<1.0.0
    - pydantic >=2.7.4,<3.0.0
    - sqlalchemy >=1.4.0,<3.0.0
    - requests >=2.0.0,<3.0.0
    - pyyaml >=5.3.0,<7.0.0
{% if python_min == "3.10" %}
    - python >=3.10,<3.11
    - async-timeout >=4.0.0,<5.0.0
{% else %}
    - python >={{ python_min }}
{% endif %}

test:
  imports:
    - langchain_classic
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/langchain-ai/langchain/
  doc_url: https://reference.langchain.com/python/langchain_classic/
  summary: Building applications with LLMs through composability
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/langchain
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy
