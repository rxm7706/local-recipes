# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-classic
  version: "1.0.8"
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/8d/65/6b5e8a7ff2f2968652c88a67dcecb925b9d8f0a0ce9458c76cd5a0dbd138/langchain_classic-${{ version }}.tar.gz
  sha256: ada0cc341a8a5b80fb24d73bdfaaeb849056ee2d8a41cc468355163fd3667484

build:
  number: ${{ build+100 if python_min == "3.10" else build }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.4.4,<2.0.0
    - langchain-text-splitters >=1.1.2,<2.0.0
    - langsmith >=0.1.17,<1.0.0
    - pydantic >=2.7.4,<3.0.0
    - sqlalchemy >=1.4.0,<3.0.0
    - requests >=2.0.0,<3.0.0
    - pyyaml >=5.3.0,<7.0.0
    - python >=3.10,<3.11
    - async-timeout >=4.0.0,<5.0.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - langchain_classic
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Building applications with LLMs through composability
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain/
  repository: https://github.com/langchain-ai/langchain/tree/master/libs/langchain
  documentation: https://reference.langchain.com/python/langchain_classic/

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy
