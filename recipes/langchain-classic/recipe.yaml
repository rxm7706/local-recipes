# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.8"

package:
  name: langchain-classic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-classic/langchain_classic-${{ version }}.tar.gz
  sha256: ada0cc341a8a5b80fb24d73bdfaaeb849056ee2d8a41cc468355163fd3667484

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - async-timeout <5.0.0,>=4.0.0
    - langchain-core <2.0.0,>=1.4.4
    - langchain-text-splitters <2.0.0,>=1.1.2
    - langsmith <1.0.0,>=0.1.17
    - pydantic <3.0.0,>=2.7.4
    - pyyaml <7.0.0,>=5.3.0
    - requests <3.0.0,>=2.0.0
    - sqlalchemy <3.0.0,>=1.4.0

tests:
  - python:
      imports:
        - langchain_classic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Building applications with LLMs through composability
  description: |
    Building applications with LLMs through composability
  repository: https://github.com/langchain-ai/langchain
  documentation: https://reference.langchain.com/python/langchain_classic/

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy

