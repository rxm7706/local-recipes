# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2.2"

package:
  name: tdigest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tdigest/tdigest-${{ version }}.tar.gz
  sha256: 8deffc8bac024761786f43d9444e3b6c91008cd690323e051f068820a7364d0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - accumulation-tree
    - pyudorandom

tests:
  - python:
      imports:
        - tdigest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CamDavidsonPilon/tdigest
  license: MIT
  license_file: LICENSE
  summary: T-Digest data structure
  description: |
    T-Digest data structure

extra:
  recipe-maintainers:
    - rxm7706

