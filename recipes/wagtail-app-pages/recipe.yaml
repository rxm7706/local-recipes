# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.7"

package:
  name: wagtail-app-pages
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail-app-pages/wagtail_app_pages-${{ version }}.tar.gz
  sha256: 4eeaeb702c5badc741b802fe3b32ce1504460f43848d1b8d13a603cd4e91c627

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail <7.3,>=6.0

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwesterhof/wagtail_app_pages
  license: MIT
  license_file: LICENSE
  summary: Full MVC support for wagtail pages
  description: |
    Full MVC support for wagtail pages

extra:
  recipe-maintainers:
    - rxm7706

