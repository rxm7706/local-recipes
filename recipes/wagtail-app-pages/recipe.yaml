# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-app-pages
  version: "0.3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/b8/05/863dc90661a55ed1ee75aa3aec90ce13aa1ed09c0450b129e17f373c0a92/wagtail_app_pages-0.3.9.tar.gz
  sha256: ab2e829d779303550aacb64f69079b6aef3b60e0b6cac0bc74f50726e95fce64

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  run:
  - python >=${{ python_min }}
  - wagtail >=6.0,<7.5

tests:
- python:
    imports:
    - wagtail_app_pages
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: Full MVC support for wagtail pages
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mwesterhof/wagtail_app_pages

extra:
  recipe-maintainers:
  - rxm7706

