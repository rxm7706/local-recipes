# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-app-pages
  version: "0.3.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail_app_pages-${{ version }}.tar.gz
  sha256: b1df49d91c6d51d3eaa73fe0e51f6efbfe439440238324e332880b337f5c34bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=6.0,<7.5

tests:
  - python:
      imports:
        - wagtail_app_pages
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Full MVC support for wagtail pages
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mwesterhof/wagtail_app_pages

extra:
  recipe-maintainers:
    - rxm7706

