{% set name = "wagtail-app-pages" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_app_pages-{{ version }}.tar.gz
  sha256: b1df49d91c6d51d3eaa73fe0e51f6efbfe439440238324e332880b337f5c34bb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - wagtail >=6.0,<7.5

test:
  imports:
    - wagtail_app_pages
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mwesterhof/wagtail_app_pages
  summary: Full MVC support for wagtail pages
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
