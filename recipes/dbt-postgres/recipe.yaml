# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: dbt-postgres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-postgres/dbt_postgres-${{ version }}.tar.gz
  sha256: 0a8558e03776231969a9614075eb31eb7daca03bcee1db7bc36f85f027826965

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    # Note: psycopg2-binary is noarch, and works also for linux, so instead of adding
    # an os-dependent requirement, we instead use psycopg2-binary for simplicity.
    - python >=${{ python_min }}
    - psycopg2-binary >=2.9,<3.0
    - dbt-adapters >=1.7.0,<2.0
    - dbt-core >=1.8.0
    - dbt-common >=1.0.4,<2.0
    - agate >=1.0,<2.0

tests:
  - python:
      imports:
        - dbt.adapters.postgres
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The dbt-postgres package contains all of the code enabling dbt to work with a Postgres database.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dbt-labs/dbt-postgres

extra:
  recipe-maintainers:
    - maresb
    - rxm7706

#### CFE metadata AND comments
