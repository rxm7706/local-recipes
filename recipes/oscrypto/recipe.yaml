# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: oscrypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oscrypto/oscrypto-${{ version }}.tar.gz
  sha256: 6f5fef59cb5b3708321db7cca56aed8ad7e662853351e7991fcf60ec606d47a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - asn1crypto

tests:
  - python:
      imports:
        - oscrypto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wbond/oscrypto
  license: MIT
  license_file: LICENSE
  summary: TLS (SSL) sockets, key generation, encryption, decryption, signing, verification and KDFs using the OS crypto libraries. Does not require a compiler, and relies on the OS for patching. Works on Windows, OS X and Linux/BSD.
  description: |
    TLS (SSL) sockets, key generation, encryption, decryption, signing, verification and KDFs using the OS crypto libraries. Does not require a compiler, and relies on the OS for patching. Works on Windows, OS X and Linux/BSD.

extra:
  recipe-maintainers:
    - talues
    - soapy1

