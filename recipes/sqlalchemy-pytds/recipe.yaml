# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: sqlalchemy-pytds
  version: ${{ version }}

source:
  url: https://github.com/m32/sqlalchemy-tds/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f0b543a17bdb1b77781135ad83306e5841a27bfb949951b253d58de4d70c9c3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-tds
    - sqlalchemy >=2.0

tests:
  - python:
      imports:
        - sqlalchemy_pytds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/m32/sqlalchemy-tds
  license: MIT
  license_file: LICENSE
  summary: A Microsoft SQL Server TDS connector for SQLAlchemy.
  description: |
    A Microsoft SQL Server TDS connector for SQLAlchemy.

extra:
  recipe-maintainers:
    - rxm7706

