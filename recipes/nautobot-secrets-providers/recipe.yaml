# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"

package:
  name: nautobot-secrets-providers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nautobot-secrets-providers/nautobot_secrets_providers-${{ version }}.tar.gz
  sha256: 8f6d499ba2d1cb4aed41c212122c61c31941571406edca05944197a3d3f7312c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - nautobot <4.0.0,>=3.0.0

tests:
  - python:
      imports:
        - nautobot_secrets_providers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nautobot/nautobot-app-secrets-providers
  license: Apache-2.0
  license_file: LICENSE
  summary: Nautobot Secrets Providers App
  description: |
    Nautobot Secrets Providers App
  repository: https://github.com/nautobot/nautobot-app-secrets-providers
  documentation: https://docs.nautobot.com/projects/secrets-providers/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

