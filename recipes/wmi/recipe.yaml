# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: wmi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WMI/WMI-${{ version }}.tar.gz
  sha256: b6a6be5711b1b6c8d55bda7a8befd75c48c12b770b9d227d31c1737dbf0d40a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pywin32

tests:
  - python:
      imports:
        - wmi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://timgolden.me.uk/python/wmi.html
  license: http://www.opensource.org/licenses/mit-license.php
  license_file: LICENSE
  summary: Windows Management Instrumentation
  description: |
    Windows Management Instrumentation

extra:
  recipe-maintainers:
    - rxm7706

