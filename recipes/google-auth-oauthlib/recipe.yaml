# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: google-auth-oauthlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-auth-oauthlib/google_auth_oauthlib-${{ version }}.tar.gz
  sha256: 18b5e28880eb8eba9065c436becdc0ee8e4b59117a73a510679c82f70cd363d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-auth !=2.43.0,!=2.44.0,!=2.45.0,<3.0.0,>=2.15.0
    - requests-oauthlib >=0.7.0

tests:
  - python:
      imports:
        - google_auth_oauthlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth-oauthlib
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Authentication Library
  description: |
    Google Authentication Library

extra:
  recipe-maintainers:
    - jan-janssen
    - cpcloud
    - jreback
    - parthea
    - tswast

