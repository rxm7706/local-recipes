# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: dash-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-auth/dash_auth-${{ version }}.tar.gz
  sha256: 72df43248c15e121f8d5d710981e880deb2df546b564f2951a10ca50d7d92f6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash >=1.1.1
    - flask
    - werkzeug

tests:
  - python:
      imports:
        - dash_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://plotly.com/dash
  license: MIT
  license_file: LICENSE
  summary: Dash Authorization Package.
  description: |
    Dash Authorization Package.

extra:
  recipe-maintainers:
    - raybellwaves

#### CFE metadata AND comments
