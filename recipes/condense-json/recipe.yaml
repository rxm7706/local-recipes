# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: condense-json
  version: "1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/condense_json-${{ version }}.tar.gz
  sha256: c455b54bbbab89a69f598b09f2003a89b738df20d30e6aa341c495401ec5b349

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }},<4.0

tests:
  - python:
      imports:
        - condense_json
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Python function for condensing JSON using replacement strings
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/condense-json

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: condense-json
  cfe-upstream-registry: pypi
  cfe-upstream-name: condense-json
  cfe-purls:
