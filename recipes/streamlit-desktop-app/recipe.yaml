# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.4"

package:
  name: streamlit-desktop-app
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-desktop-app/streamlit_desktop_app-${{ version }}.tar.gz
  sha256: b8b9d62ff42fb0670bc14b161625009149b836389d60f809089fd4eb1df8799c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - pyinstaller <7.0.0,>=6.11.1
    - pywebview <6.0.0,>=5.3.2
    - requests <3.0.0,>=2.32.3
    - streamlit >=1.13.0

tests:
  - python:
      imports:
        - streamlit_desktop_app
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ohtaman/streamlit-desktop-app
  license: Apache-2.0
  license_file: LICENSE
  summary: Easily convert Streamlit apps into standalone desktop applications.
  description: |
    Easily convert Streamlit apps into standalone desktop applications.
  repository: https://github.com/ohtaman/streamlit-desktop-app
  documentation: https://github.com/ohtaman/streamlit-desktop-app#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
