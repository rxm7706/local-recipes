# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydyf
  version: "0.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 394dddf619cca9d0c55715e3c55ea121a9bf9cbc780cdc1201a2427917b86b64

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pydyf
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A low-level PDF generator.
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://www.courtbouillon.org/pydyf
  repository: https://github.com/CourtBouillon/pydyf
  documentation: https://doc.courtbouillon.org/pydyf/

extra:
  recipe-maintainers:
    - liZe
    - BastianZim
