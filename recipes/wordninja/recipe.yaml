# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wordninja
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/wordninja-${{ version }}.tar.gz
  sha256: 1a1cc7ec146ad19d6f71941ee82aef3d31221700f0d8bf844136cf8df79d281a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - wordninja
      pip_check: true

about:
  summary: Probabilistically split concatenated words.
  license: MIT
  # License packaged in for now; will check with upstream
  license_file: LICENSE
  homepage: https://github.com/keredson/wordninja

extra:
  recipe-maintainers:
    - thewchan
