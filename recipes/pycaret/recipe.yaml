# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.2"

package:
  name: pycaret
  version: ${{ version }}

source:
  url: https://github.com/pycaret/pycaret/archive/refs/tags/${{ version }}.tar.gz
  sha256: aa89ed0a5795e05200e0e3d44ec3ee96bfea499d5db2df5e37ce903a5bff6ace

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython >=5.5.0
    - ipywidgets >=7.6.5
    - tqdm >=4.62.0
    - numpy <1.27,>=1.21
    - pandas <2.2.0
    - jinja2 >=3
    - scipy <=1.11.4,>=1.6.1
    - joblib <1.4,>=1.2.0
    - scikit-learn >1.4.0
    - pyod >=1.1.3
    - imbalanced-learn >=0.12.0
    - category-encoders >=2.4.0
    - lightgbm >=3.0.0
    - numba >=0.55.0
    - requests >=2.27.1
    - psutil >=5.9.0
    - markupsafe >=2.0.1
    - importlib-metadata >=4.12.0
    - nbformat >=4.2.0
    - cloudpickle
    - deprecation >=2.1.0
    - python-xxhash
    - matplotlib-base <3.8.0
    - scikit-plot >=0.3.7
    - yellowbrick >=1.4
    - plotly >=5.14.0
    - kaleido >=0.2.1
    - schemdraw ==0.15
    - plotly-resampler >=0.8.3.1
    - statsmodels >=0.12.1
    - sktime ==0.26.0
    - tbats >=1.1.3
    - pmdarima >=2.0.4

tests:
  - python:
      imports:
        - pycaret
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pycaret/pycaret
  license: MIT
  license_file: LICENSE
  summary: PyCaret - An open source, low-code machine learning library in Python.
  description: |
    PyCaret - An open source, low-code machine learning library in Python.

extra:
  recipe-maintainers:
    - kellend-git
    - mpaulonis

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pycaret
