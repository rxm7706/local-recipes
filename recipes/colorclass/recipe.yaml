# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: colorclass
  version: "2.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6d4fe287766166a98ca7bc6f6312daf04a0481b1eda43e7173484051c0ab4366

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colorclass
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Colorful worry-free console applications for Linux, Mac OS X, and Windows.
  description: |
    Yet another ANSI color text library for Python. Provides “auto colors” for
    dark/light terminals. Works on Linux, OS X, and Windows. For Windows support
    you just need to call `Windows.enable()` in your application.
  homepage: https://github.com/matthewdeanmartin/colorclass
  repository: https://github.com/matthewdeanmartin/colorclass

extra:
  recipe-maintainers:
    - carlodri
