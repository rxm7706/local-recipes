# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.2"

package:
  name: colorclass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colorclass/colorclass-${{ version }}.tar.gz
  sha256: 6d4fe287766166a98ca7bc6f6312daf04a0481b1eda43e7173484051c0ab4366

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colorclass
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/matthewdeanmartin/colorclass
  license: MIT
  license_file: LICENSE
  summary: Colorful worry-free console applications for Linux, Mac OS X, and Windows.
  description: |
    Colorful worry-free console applications for Linux, Mac OS X, and Windows.
  repository: https://github.com/matthewdeanmartin/colorclass
  documentation: https://github.com/matthewdeanmartin/colorclass

extra:
  recipe-maintainers:
    - carlodri

