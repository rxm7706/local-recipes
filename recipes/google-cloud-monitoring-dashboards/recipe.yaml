# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-cloud-monitoring-dashboards
  version: "2.15.3"
  sha256: c0544b6263844ab2ea9be4ca842e229112d2dad6bb62dd2efd4de22f46ca9a03

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.6
    - pip >=18.1
  run:
    - python >=3.6
    - google-api-core-grpc >=1.26.0,<2.0.0dev
    - proto-plus >=0.4.0
    - packaging >=14.3

tests:
  - python:
      imports:
        - grpc
        - google.cloud.monitoring_dashboard
        - google.cloud.monitoring_dashboard.v1
      pip_check: false

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Monitoring Dashboards API client library
  description: |
    Monitoring Dashboards API is a Google Cloud service that lets client applications manage dashboard configurations used in the Stackdriver UI.
    See the [quick start guide](https://googleapis.dev/python/monitoring-dashboards/latest/index.html#quick-start).

  homepage: https://github.com/googleapis/python-monitoring-dashboards
  repository: https://github.com/googleapis/python-monitoring-dashboards
  documentation: https://googleapis.dev/python/monitoring-dashboards/latest/index.html

extra:
  recipe-maintainers:
    - parthea
