# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash-html-components
  filename: dash_html_components
  version: "2.0.0"
  sha256: 8703a601080f02619a6390998e0b3da4a5daabe97a1fd7a9cebc09d015f26e50

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ filename }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ filename }}-${{ version }}.tar.gz

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - dash >=2.0.0  # not listed in the setup.py

tests:
  - python:
      imports:
        - dash_html_components
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  # TODO : Update this once plotly packages it correctly:
  # https://github.com/plotly/dash-html-components/pull/46
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE.txt
  summary: Dash UI HTML component suite
  homepage: https://plot.ly/dash
  repository: https://github.com/plotly/dash-html-components

extra:
  recipe-maintainers:
    - moorepants
