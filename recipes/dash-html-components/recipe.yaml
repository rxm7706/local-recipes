# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: dash-html-components
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-html-components/dash_html_components-${{ version }}.tar.gz
  sha256: 8703a601080f02619a6390998e0b3da4a5daabe97a1fd7a9cebc09d015f26e50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash

tests:
  - python:
      imports:
        - dash_html_components
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/plotly/dash-html-components
  license: MIT
  license_file: LICENSE
  summary: Vanilla HTML components for Dash
  description: |
    Vanilla HTML components for Dash

extra:
  recipe-maintainers:
    - moorepants

#### CFE metadata AND comments
