# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.9"

package:
  name: polyfile-weave
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/polyfile-weave/polyfile_weave-${{ version }}.tar.gz
  sha256: 12341fab03e06ede1bfebbd3627dd24015fde5353ea74ece2da186321b818bdb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - abnf ~=2.2.0
    - chardet >=5.0.0
    - cint >=1.0.0
    - fickling >=0.0.8
    - filelock <3.20.0,>=3.13.0
    - python-graphviz >=0.20.1
    - intervaltree >=2.4.0
    - jinja2 >=2.1.0
    - kaitaistruct >=0.11
    - networkx >=2.6.3
    - pillow >=5.0.0
    - pyyaml >=3.13
    - pdfminer.six >=20251230

tests:
  - python:
      imports:
        - polyfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zbirenbaum/polyfile-weave
  license: Apache-2.0
  license_file: LICENSE
  summary: A utility to recursively map the structure of a file.
  description: |
    A utility to recursively map the structure of a file.

extra:
  recipe-maintainers:
    - rxm7706

