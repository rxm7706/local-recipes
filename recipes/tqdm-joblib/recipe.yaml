# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: tqdm-joblib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tqdm-joblib/tqdm_joblib-${{ version }}.tar.gz
  sha256: 34dd63c92e1b88b5118661a41eaf91001cac2687bfe217a4b6a9ab1bbf0f1c64

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - tqdm
    - joblib

tests:
  - python:
      imports:
        - tqdm_joblib
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Tracking progress of joblib.Parallel execution
  license: CC-BY-SA-4.0
  license_file: LICENSE.txt
  homepage: https://github.com/louisabraham/tqdm_joblib

extra:
  recipe-maintainers:
    - FGarridoV
    - sandervancranenburgh
