{% set version = "1.45.1" %}

package:
  name: opentelemetry-sdk
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-sdk/opentelemetry_sdk-{{ version }}.tar.gz
  sha256: 63d24a6ca645019a631e6a51999c73e93adcac1196ca640b8ae78a7cc4762bf3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >={{ python_min }}
    - opentelemetry-api ==1.45.1
    - opentelemetry-semantic-conventions ==0.66b1
    - typing-extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - pyyaml >=6.0
    # - jsonschema >=4.0
    # - pyyaml >=6.0
    # - jsonschema >=4.0
    # - opentelemetry-configuration ==0.65b0
    # - opentelemetry-configuration ==0.66b0
    # - opentelemetry-configuration ==0.66b1

test:
  imports:
    - opentelemetry.sdk
    - opentelemetry.sdk.resources
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-sdk
  summary: OpenTelemetry Python SDK
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pb01ka
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-semantic-conventions
