# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-sdk/opentelemetry_sdk-${{ version }}.tar.gz
  sha256: cebe7f65dc12f26ead75c6064de12fd2a9052e5060c0272d402cfa203aae123b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ==1.44.0
    - opentelemetry-semantic-conventions ==0.65b0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - opentelemetry.sdk.util
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Python SDK
  description: |
    OpenTelemetry Python SDK
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - pb01ka
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-semantic-conventions

