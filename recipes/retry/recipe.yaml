# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"

package:
  name: retry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/retry/retry-${{ version }}.tar.gz
  sha256: f8bfa8b99b69c4506d6f5bd3b0aabf77f98cdb17f3c9fc3f5ca820033336fba4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - decorator
    - py

tests:
  - python:
      imports:
        - retry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/invl/retry
  license: Apache-2.0
  license_file: LICENSE
  summary: Easy to use retry decorator.
  description: |
    Easy to use retry decorator.

extra:
  recipe-maintainers:
    - sodre

