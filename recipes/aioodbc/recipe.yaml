# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: aioodbc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioodbc/aioodbc-${{ version }}.tar.gz
  sha256: cbccd89ce595c033a49c9e6b4b55bbace7613a104b8a46e3d4c58c4bc4f25075

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - setuptools_scm_git_archive
  run:
    - python >=${{ python_min }}
    - pyodbc >=5.0.1

tests:
  - python:
      imports:
        - aioodbc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aio-libs/aioodbc
  license: Apache-2.0
  license_file: LICENSE
  summary: ODBC driver for asyncio.
  description: |
    ODBC driver for asyncio.
  documentation: https://uddsketch.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
