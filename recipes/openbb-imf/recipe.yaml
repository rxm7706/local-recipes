# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.3"

package:
  name: openbb-imf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-imf/openbb_imf-${{ version }}.tar.gz
  sha256: 891ffbb940c49993944410fdb499757f127e8ffc940f33e4d4346a981787798f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - async-lru <3,>=2
    - defusedxml >=0.7.1
    - openbb-core <2.0.0,>=1.6.10
    - openbb-economy <2.0.0,>=1.6.1
    - openbb-platform-api <2.0.0,>=1.3.5

tests:
  - python:
      imports:
        - openbb_imf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-imf/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: "https://datahelp.imf.org/knowledgebase/articles/630877-api"
  description: |
    https://datahelp.imf.org/knowledgebase/articles/630877-api

extra:
  recipe-maintainers:
    - rxm7706

