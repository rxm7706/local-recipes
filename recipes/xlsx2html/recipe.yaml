# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.4"

package:
  name: xlsx2html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlsx2html/xlsx2html-${{ version }}.tar.gz
  sha256: 010cf660f9c00eb00cc58b6c7a7e7c3394d3a2fd16965cdfdda6b9ad004e947f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - openpyxl >=2.4.8
    - babel >=2.3.4
    - packaging >=20.4

tests:
  - python:
      imports:
        - xlsx2html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Apkawa/xlsx2html
  license: MIT
  license_file: LICENSE
  summary: A simple export from xlsx format to html tables with keep cell formatting
  description: |
    A simple export from xlsx format to html tables with keep cell formatting

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
