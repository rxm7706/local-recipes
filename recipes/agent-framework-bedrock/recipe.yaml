# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0b260604"
  python_min: "3.10"

package:
  name: agent-framework-bedrock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-bedrock/agent_framework_bedrock-${{ version }}.tar.gz
  sha256: 07c927df0516dba84fe3a784201bd28c63fcf1dc12e744d17eb3a16135eca2f8

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - agent-framework-core <2,>=1.8.0
    - boto3 <2.0.0,>=1.35.0
    - botocore <2.0.0,>=1.35.0

tests:
  - python:
      imports:
        - agent_framework.amazon
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: |
    Amazon Bedrock integration for Microsoft Agent Framework.
  homepage: https://pypi.org/project/agent-framework-bedrock/
  repository: https://github.com/microsoft/agent-framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
    - mgorny
