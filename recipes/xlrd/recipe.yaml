# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: xlrd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlrd/xlrd-${{ version }}.tar.gz
  sha256: 08b5e25de58f21ce71dc7db3b3b8106c1fa776f3024c54e45b45b374e89234c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xlrd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.python-excel.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Library for developers to extract data from Microsoft Excel (tm) .xls spreadsheet files
  description: |
    Library for developers to extract data from Microsoft Excel (tm) .xls spreadsheet files

extra:
  recipe-maintainers:
    - cokelaer
    - notestaff
    - mjhoptics

