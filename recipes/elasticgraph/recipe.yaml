# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: elasticgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/elasticgraph/elasticgraph-${{ version }}.tar.gz
  sha256: f3b1d25cd7f9cde29878f24ce8c9076e861227c17311bfb3b6d1a0abf2233e54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2
    - d3graph

tests:
  - python:
      imports:
        - elasticgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/rwsdatalab/rwsdatalab/public/codebase/tools/elasticgraph
  license: MIT
  license_file: LICENSE
  summary: Network Graph using D3js with grouping of nodes and elastic edges.
  description: |
    Network Graph using D3js with grouping of nodes and elastic edges.

extra:
  recipe-maintainers:
    - rxm7706

