# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.33.0.20260712"

package:
  name: types-requests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-requests/types_requests-${{ version }}.tar.gz
  sha256: 2141b67ab534a5c5cd2dac5034f2a35f42e699c5bf185eee608c5246a069d7fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 >=2

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
  - package_contents:
      site_packages:
        - requests-stubs/__init__.pyi

about:
  summary: Typing stubs for requests
  license: Apache-2.0 AND MIT
  license_file: LICENSE
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
