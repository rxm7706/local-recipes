# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0.1"

package:
  name: lime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lime/lime-${{ version }}.tar.gz
  sha256: 76960e4f055feb53e89b5022383bafc87b63f25bac6265984b0a333d1a57f781

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/marcotcr/lime
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Local Interpretable Model-Agnostic Explanations for machine learning classifiers
  description: |
    Local Interpretable Model-Agnostic Explanations for machine learning classifiers

extra:
  recipe-maintainers:
    - proinsias
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lime
  cfe-upstream-registry: pypi
  cfe-upstream-name: lime
  cfe-purls:
    - pkg:conda/lime@${{ version }}?channel=conda-forge
    - pkg:pypi/lime@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/marcotcr/lime
  cfe-import-names: [lime]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/lime-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.0.1

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T01:16:56Z
