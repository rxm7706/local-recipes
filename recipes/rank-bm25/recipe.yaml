# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: rank-bm25
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rank-bm25/rank_bm25-${{ version }}.tar.gz
  sha256: 096ccef76f8188563419aaf384a02f0ea459503fdf77901378d4fd9d87e5e51d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - rank_bm25
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dorianbrown/rank_bm25
  license: Apache2.0
  license_file: LICENSE
  summary: Various BM25 algorithms for document ranking
  description: |
    Various BM25 algorithms for document ranking

extra:
  recipe-maintainers:
    - moritzwilksch

