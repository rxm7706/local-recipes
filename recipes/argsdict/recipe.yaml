# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: argsdict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/argsdict/argsdict-${{ version }}.tar.gz
  sha256: 38b437e7f2ff0bcf2935f5039d0cfd12cc0090928c4541159dafaff4c00c83e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - argsdict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Julynx/argsdict
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Simple command-line argument parser.
  description: |
    Simple command-line argument parser.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: argsdict
  cfe-upstream-registry: pypi
  cfe-upstream-name: argsdict
