# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.6.3"

package:
  name: jupyter_console
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter_console/jupyter_console-${{ version }}.tar.gz
  sha256: 566a4bf31c87adbfadf22cdf846e3069b59a71ed5da71d6ba4d8aaad14a53539

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  python:
    entry_points:
      - jupyter-console = jupyter_console.app:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter_client >=7.0.0
    - ipython
    - ipykernel >=6.14
    - jupyter_core >=4.12,!=5.0.*
    - prompt_toolkit >=3.0.30
    - pyzmq >=17
    - traitlets >=5.4
    - pygments

tests:
  - python:
      imports:
        - jupyter_console
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - jupyter-console -h

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter terminal console
  homepage: http://jupyter.org

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - blink1073
    - Carreau
    - davidbrochart
