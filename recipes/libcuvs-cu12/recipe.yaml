# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.1"
  python_min: "3.11"

package:
  name: libcuvs-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libcuvs-cu12/libcuvs_cu12-26.8.1-py3-none-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
  sha256: 103c8e31cdc38b6cb08cccb3d08b8b8ff1a4524df659ebfe7a1294d4bd38ec93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-toolkit ==12.*
    - libraft-cu12 ==26.8.*
    - librmm-cu12 ==26.8.*
    - nvidia-nccl-cu12 >=2.19
    - nvidia-nvjitlink-cu12 <13,>=12.9

tests:
  - python:
      imports:
        - libcuvs_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cuvs
  license: Apache-2.0
  license_file: LICENSE
  summary: cuVS: Vector Search on the GPU (C++)
  description: |
    cuVS: Vector Search on the GPU (C++)
  documentation: https://docs.rapids.ai/api/cuvs/stable/

extra:
  recipe-maintainers:
    - rxm7706

