    - pkg:pypi/betterproto@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/danielgtaylor/python-betterproto
  cfe-import-names: [betterproto]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/betterproto-feedstock
  cfe-forge-recipe-updates-needed: 
