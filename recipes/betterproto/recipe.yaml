# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.5"

package:
  name: betterproto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/betterproto/betterproto-${{ version }}.tar.gz
  sha256: 74a3ab34646054f674d236d1229ba8182dc2eae86feb249b8590ef496ce9803d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - betterproto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/danielgtaylor/python-betterproto
  license: MIT
  license_file: LICENSE.txt
  summary: A better Protobuf / gRPC generator & library
  description: |
    A better Protobuf / gRPC generator & library

extra:
  recipe-maintainers:
    - asford

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: betterproto
  cfe-upstream-registry: pypi
  cfe-upstream-name: betterproto
