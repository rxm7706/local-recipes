# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.1"

package:
  name: ovirt-imageio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ovirt-imageio/ovirt_imageio-${{ version }}.tar.gz
  sha256: 7dbb735728c5a80a7cc39165d54f7504c250842ef714a1a7f928c47b7a873cff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ovirt_imageio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/oVirt/ovirt-imageio
  license: MIT
  license_file: LICENSE
  summary: Transfer disk images on oVirt system
  description: |
    Transfer disk images on oVirt system
  documentation: http://ovirt.github.io/ovirt-imageio/

extra:
  recipe-maintainers:
    - rxm7706

