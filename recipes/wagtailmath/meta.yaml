{% set name = "wagtailmath" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wagtailmath-{{ version }}.tar.gz
  sha256: 9321f369e9161067983ed19df3e0ae045a0a7772f223a0663b07aa1a0b16d212

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - django >=5.2
    - wagtail >=7.0

test:
  imports:
    - wagtailmath
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/JamesRamm/wagtailmath
  summary: Wagtail StreamField block for rendering mathematical equations
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
