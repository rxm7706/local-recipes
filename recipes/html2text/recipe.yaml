    - pkg:pypi/html2text@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/Alir3z4/html2text/
  cfe-import-names: [html2text]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/html2text-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2025.4.15

  cfe-forge-blocker-list:
