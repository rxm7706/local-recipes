# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: tft
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tft/tft-${{ version }}.tar.gz
  sha256: 74f8e23e7b76c1b31375e79ff2d63ca4ba24fb4137adccec741bf3d9a0b37011

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - pytorch
    - einops
    - pywavelets
    - torchvision

tests:
  - python:
      imports:
        - tft
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tft/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Time-Frequency Transformers
  description: |
    Time-Frequency Transformers

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tft
  cfe-upstream-registry: pypi
  cfe-upstream-name: tft
