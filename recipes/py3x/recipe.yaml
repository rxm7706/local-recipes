# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.1"

package:
  name: py3x
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py3x/py3x-${{ version }}.tar.gz
  sha256: cd65d74badcfd87eb98d14007df754bcbff344ab97fd4b4ed56be9be34308b6c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - py3x
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/uedak/py3x
  license: MIT
  license_file: LICENSE
  summary: python3 extension
  description: |
    python3 extension

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: py3x
  cfe-upstream-registry: pypi
  cfe-upstream-name: py3x
