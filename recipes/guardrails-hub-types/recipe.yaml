# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: guardrails-hub-types
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/guardrails-hub-types/guardrails_hub_types-${{ version }}.tar.gz
  sha256: a5ad863fd6b354e41c3d83d8c1e835f7243a0ae0ec944b6601d1e3ee5d806a51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - guardrails_hub_types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/guardrails-hub-types/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Guardrails Hub Types.
  description: |
    Guardrails Hub Types.

extra:
  recipe-maintainers:
    - rxm7706

