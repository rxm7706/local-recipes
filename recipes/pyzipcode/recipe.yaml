# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: pyzipcode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyzipcode/pyzipcode-${{ version }}.tar.gz
  sha256: 4146386c3f45dc9b5c30e537da60c7d58fac54d6312f24a718340f3c235cff1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyzipcode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vangheem/pyzipcode
  license: MIT
  license_file: LICENSE
  summary: query zip codes and location data
  description: |
    query zip codes and location data

extra:
  recipe-maintainers:
    - rxm7706

