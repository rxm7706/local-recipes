# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.7"

package:
  name: snuggs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snuggs/snuggs-${{ version }}.tar.gz
  sha256: 501cf113fe3892e14e2fee76da5cd0606b7e149c411c271898e6259ebde2617b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pyparsing

tests:
  - python:
      imports:
        - snuggs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mapbox/snuggs
  license: MIT
  license_file: LICENSE
  summary: Snuggs are s-expressions for Numpy
  description: |
    Snuggs are s-expressions for Numpy

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
