# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: mermaid-magic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mermaid-magic/mermaid_magic-${{ version }}.tar.gz
  sha256: f65b3095312fb42aa6d064be3e6f642df62da0cd1fd7024de57389627b308513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython

tests:
  - python:
      imports:
        - mermaid_magic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mermaid-magic/
  license: MIT
  license_file: LICENSE
  summary: IPython magic for rendering Mermaid diagrams
  description: |
    IPython magic for rendering Mermaid diagrams
  repository: https://github.com/vbalasu/mermaid-magic

extra:
  recipe-maintainers:
    - rxm7706

