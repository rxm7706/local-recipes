# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: latex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/latex/latex-${{ version }}.tar.gz
  sha256: bf10c3fe27e9f3adccebc12e90ec239c86dcba101b89221f6775918211482a79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - latex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mbr/latex
  license: MIT
  license_file: LICENSE
  summary: Wrappers for calling LaTeX/building LaTeX documents.
  description: |
    Wrappers for calling LaTeX/building LaTeX documents.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: latex
  cfe-upstream-registry: pypi
  cfe-upstream-name: latex
  cfe-purls:
    - pkg:conda/latex@${{ version }}?channel=conda-forge
    - pkg:pypi/latex@${{ version }}
  cfe-upstream-repo: http://github.com/mbr/latex
  cfe-upstream-homepage: http://github.com/mbr/latex
  cfe-import-names: [latex]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T00:01:57Z
