# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.5.0"

package:
  name: music21
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/music21/music21-${{ version }}.tar.gz
  sha256: f72676fb953cb592bfb4e3bb246b0a234446f89088aa8a55ec9b5fcef2ce3db2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.8.1
  run:
    - python >=${{ python_min }}
    - chardet
    - joblib
    - jsonpickle
    - matplotlib-base
    - more-itertools
    - numpy >=1.26.4
    - requests
    - webcolors >=1.5

tests:
  - python:
      imports:
        - music21
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cuthbertLab/music21
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Toolkit for Computer-Aided Musical Analysis and Computational Musicology.
  description: |
    A Toolkit for Computer-Aided Musical Analysis and Computational Musicology.
  documentation: https://www.music21.org/music21docs/

extra:
  recipe-maintainers:
    - jacobtylerwalls

