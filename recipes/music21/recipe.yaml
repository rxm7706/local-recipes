# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.11"
  name: music21
  version: "10.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f72676fb953cb592bfb4e3bb246b0a234446f89088aa8a55ec9b5fcef2ce3db2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - chardet
    - joblib
    - jsonpickle
    - matplotlib-base
    - more-itertools
    - numpy >=1.26.4
    - requests
    - webcolors >=1.5

tests:
  - python:
      imports:
        - music21
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - python -m music21.stream.tests

about:
  license: BSD-3-Clause OR LGPL-3.0-or-later
  license_file: LICENSE
  summary: A Toolkit for Computer-Aided Musical Analysis.
  description: |
    People use music21 to answer questions from musicology using computers,
    to study large datasets of music, to generate musical examples, to teach
    fundamentals of music theory, to edit musical notation, study music and
    the brain, and to compose music (both algorithmically and directly).
  homepage: https://github.com/cuthbertLab/music21
  repository: https://github.com/cuthbertLab/music21
  documentation: https://www.music21.org/music21docs/

extra:
  recipe-maintainers:
    - jacobtylerwalls
