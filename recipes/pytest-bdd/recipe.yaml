# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-bdd
  version: "8.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ef0896c5cd58816dc49810e8ff1d632f4a12019fb3e49959b2d349ffc1c9bfb5

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pytest-bdd = pytest_bdd.scripts:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - mako
    - gherkin-official >=29.0.0,<30.0.0
    - packaging
    - parse
    - parse_type
    - pytest >=7.0.0
    - typing_extensions

tests:
  - python:
      imports:
        - pytest_bdd
      pip_check: true
      python_version: ["${{ python_min }}.*", "*"]
  - script:
      - pytest-bdd --help

about:
  homepage: https://github.com/pytest-dev/pytest-bdd
  license: MIT
  license_file: LICENSE.txt
  summary: BDD for pytest
  description: pytest-bdd implements a subset of the Gherkin language to enable automating project requirements testing and to facilitate behavioral driven development.
  repository: https://github.com/pytest-dev/pytest-bdd
  documentation: https://pytest-bdd.readthedocs.io/

extra:
  recipe-maintainers:
    - m0nonoke
    - PertuyF
    - breathe
    - killua156
