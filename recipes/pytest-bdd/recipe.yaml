# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.0"

package:
  name: pytest-bdd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-bdd/pytest_bdd-${{ version }}.tar.gz
  sha256: ef0896c5cd58816dc49810e8ff1d632f4a12019fb3e49959b2d349ffc1c9bfb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - mako
    - gherkin-official <30.0.0,>=29.0.0
    - packaging
    - parse
    - parse-type
    - pytest >=7.0.0
    - typing_extensions

tests:
  - python:
      imports:
        - pytest_bdd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pytest-bdd.readthedocs.io/
  license: MIT
  license_file: LICENSE.txt
  summary: BDD for pytest
  description: |
    BDD for pytest
  repository: https://github.com/pytest-dev/pytest-bdd
  documentation: https://pytest-bdd.readthedocs.io/

extra:
  recipe-maintainers:
    - m0nonoke
    - PertuyF
    - breathe
    - killua156

