# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.0"

package:
  name: tree-sitter-regex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tree-sitter-regex/tree_sitter_regex-${{ version }}.tar.gz
  sha256: 5d29111b3f27d4afb31496476d392d1f562fe0bfe954e8968f1d8683424fc331

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.4.0
    - wheel
  run:
    - python >=${{ python_min }}
    - bindings

tests:
  - python:
      imports:
        - bindings.python.tree_sitter_regex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tree-sitter/tree-sitter-regex
  license: MIT
  license_file: LICENSE
  summary: Regex grammar for tree-sitter
  description: |
    Regex grammar for tree-sitter

extra:
  recipe-maintainers:
    - rxm7706

