# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: semgrep
  version: "1.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/semgrep-${{ version }}.tar.gz
  sha256: b73c67dc94fe487f4fe87e0c0e8193602c8dd79cf1f841b1209d610239acc46a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - wheel
    - pip
  run:
    - python >=3.8
    - attrs  #>=21.3
    - boltons >=21.0  #,<22.0
    - click-option-group >=0.5,<1.0
    - click >=8.1,<9.0
    - colorama >=0.4.0,<0.5.0
    - defusedxml >=0.7.1,<0.8.0
    - exceptiongroup >=1.2.0,<1.3.0
    - glom >=22.1,<24.0  # Pip needs Gloom 22.1.0 requires attrs <=19.1.0, Pin changed from <23.0
    - jsonschema >=4.6,<5.0
    - packaging >=21.0
    - peewee >=3.14,<4.0
    - requests >=2.22,<3.0
    - rich >=12.6.0
    - ruamel.yaml >=0.16.0,<0.18
    - tomli >=2.0.1,<2.1.0
    - typing-extensions >=4.2,<5.0
    - urllib3 >=1.26  #,<3.0
    - wcmatch >=8.3,<9.0

tests:
  - python:
      imports:
        - semdep
        - semgrep
      pip_check: false
  - <conda_recipe_manager.types.SentinelType object at 0x6ffcf4afdbe0>:
      requirements:
        run:
          - pip

about:
  summary: Lightweight static analysis for many languages. Find bug variants with patterns that look like source code.
  license: LGPL-2.1-only
  license_file: LICENSE
  homepage: https://github.com/returntocorp/semgrep

extra:
  recipe-maintainers:
    - rxm7706
