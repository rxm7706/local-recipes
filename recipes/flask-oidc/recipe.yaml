# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.0"

package:
  name: flask-oidc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-oidc/flask_oidc-${{ version }}.tar.gz
  sha256: e72378fcea8f90ccab874836a61f1783092a900c965e52587c1307e38b2e2153

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - authlib <2.0.0,>=1.2.0
    - blinker <2.0.0,>=1.4.0
    - flask <4.0.0,>=0.12.2
    - requests <3.0.0,>=2.20.0

tests:
  - python:
      imports:
        - flask_oidc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fedora-infra/flask-oidc
  license: BSD-2-Clause
  license_file: LICENSE
  summary: OpenID Connect extension for Flask
  description: |
    OpenID Connect extension for Flask
  repository: https://github.com/fedora-infra/flask-oidc

extra:
  recipe-maintainers:
    - mxr-conda
    - mgorny

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-oidc
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-oidc
