    - pkg:pypi/flask-oidc@${{ version }}
  cfe-upstream-repo: https://github.com/fedora-infra/flask-oidc
  cfe-upstream-homepage: https://github.com/fedora-infra/flask-oidc
  cfe-import-names: [flask_oidc]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-oidc-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

