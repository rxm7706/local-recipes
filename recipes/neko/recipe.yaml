# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.11"

package:
  name: neko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/neko/neko-${{ version }}.tar.gz
  sha256: 4ff325cc4380e158b97946651c06413add20092749f62836ce21aad5ddfed813

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - neko
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Frederick-S/neko
  license: MIT
  license_file: LICENSE
  summary: A simple static site generator.
  description: |
    A simple static site generator.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
