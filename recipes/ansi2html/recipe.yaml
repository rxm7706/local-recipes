# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.2"

package:
  name: ansi2html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansi2html/ansi2html-${{ version }}.tar.gz
  sha256: 3453bf87535d37b827b05245faaa756dbab4ec3d69925e352b6319c3c955c0a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45.0.0
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - typing_extensions

tests:
  - python:
      imports:
        - ansi2html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pycontribs/ansi2html
  license: LGPLv3+
  license_file: LICENSE
  summary: Convert text with ANSI color codes to HTML or to LaTeX
  description: |
    Convert text with ANSI color codes to HTML or to LaTeX
  documentation: https://ansi2html.readthedocs.io/

extra:
  recipe-maintainers:
    - nehaljwani

