# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: llama-index-postprocessor-cohere-rerank
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-postprocessor-cohere-rerank/llama_index_postprocessor_cohere_rerank-${{ version }}.tar.gz
  sha256: c617a0568b3333ebee4088d7802eb6157ed449d6849c45152930651401dbbef0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cohere <7,>=5.15
    - llama-index-core <0.15,>=0.13.0
    - tenacity <10,>=8.2.0

tests:
  - python:
      imports:
        - llama_index.postprocessor.cohere_rerank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-postprocessor-cohere-rerank/
  license: MIT
  license_file: LICENSE
  summary: llama-index postprocessor cohere rerank integration
  description: |
    llama-index postprocessor cohere rerank integration

extra:
  recipe-maintainers:
    - JaRoSchm

