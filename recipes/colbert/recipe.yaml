# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.40"

package:
  name: colbert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Colbert/Colbert-${{ version }}.tar.gz
  sha256: 4bccdb254c6bb06373fae65273e9741d252e4921755d5fa2c7a0e79783779759

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colbert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Colbert/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Accountancy utilities for your small (french) business
  description: |
    Accountancy utilities for your small (french) business

extra:
  recipe-maintainers:
    - rxm7706

