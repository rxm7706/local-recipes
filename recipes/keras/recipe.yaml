# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.15.1"
  python_min: "3.11"

package:
  name: keras
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keras/keras-${{ version }}.tar.gz
  sha256: 92ae7c1dd7f61041953dc2d42253181ee099086f0b58ae36fcf98147a6f08a29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - absl-py
    - numpy
    - rich
    - namex
    - h5py
    - optree
    - ml-dtypes
    - packaging

tests:
  - python:
      imports:
        - keras.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://keras.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Multi-backend Keras
  description: |
    Multi-backend Keras
  repository: https://github.com/keras-team/keras

extra:
  recipe-maintainers:
    - ngam
    - mariusvniekerk
    - croth1
    - ocefpaf
    - xhochy
    - hmaarrfk

