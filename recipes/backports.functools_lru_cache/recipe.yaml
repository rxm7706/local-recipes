# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: backports.functools-lru-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backports.functools-lru-cache/backports.functools_lru_cache-${{ version }}.tar.gz
  sha256: dcbfa5e0dae8a014168807c9e026d33eead71df5af76c1fb78fd248bf07f6f99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=56
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - backports
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jaraco/backports.functools_lru_cache
  license: MIT
  license_file: LICENSE
  summary: Backport of functools.lru_cache
  description: |
    Backport of functools.lru_cache

extra:
  recipe-maintainers:
    - mariusvniekerk
    - stuertz

