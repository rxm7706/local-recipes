# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: backports.functools_lru_cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backports.functools_lru_cache/backports.functools_lru_cache-${{ version }}.tar.gz
  sha256: dcbfa5e0dae8a014168807c9e026d33eead71df5af76c1fb78fd248bf07f6f99

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools_scm
    - backports
  run:
    - python >=${{ python_min }}
    - setuptools
    - backports

tests:
  - python:
      imports:
        - backports.functools_lru_cache
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Backport of functools.lru_cache from Python 3.3 as published at ActiveState.
  homepage: https://github.com/jaraco/backports.functools_lru_cache
  repository: https://github.com/jaraco/backports.functools_lru_cache
  documentation: https://pypi.python.org/pypi/backports.functools_lru_cache

extra:
  recipe-maintainers:
    - mariusvniekerk
    - stuertz
