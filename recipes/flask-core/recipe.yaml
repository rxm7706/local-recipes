# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.0"

package:
  name: flask-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-core/flask-core-${{ version }}.tar.gz
  sha256: 80f5a2bb0b57363e76f989fb57fbffe05946c6c132d9dc9d075f4c1c54d30c95

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - psycopg2
    - sqlalchemy
    - cryptography

tests:
  - python:
      imports:
        - flask_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/secedu/flask-core
  license: MIT
  license_file: LICENSE
  summary: A modular Flask core for CTF war-games, originally created for CS6443
  description: |
    A modular Flask core for CTF war-games, originally created for CS6443

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
