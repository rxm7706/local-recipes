# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.60.0"

package:
  name: tox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tox/tox-${{ version }}.tar.gz
  sha256: 6f93bb580d35e00fc69cfec1116eecbe21155f747753ca5019374f7c69b2eac9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cachetools >=7.0.3
    - colorama >=0.4.6
    - filelock >=3.25
    - packaging >=26
    - platformdirs >=4.9.4
    - pluggy >=1.6
    - pyproject-api >=1.10
    - python-discovery >=1.4.4
    - tomli-w >=1.2
    - tomli >=2.4
    - typing_extensions >=4.15
    - virtualenv >=21.1

tests:
  - python:
      imports:
        - tox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://tox.wiki
  license: MIT
  license_file: LICENSE
  summary: tox is a generic virtualenv management and test command line tool
  description: |
    tox is a generic virtualenv management and test command line tool
  repository: https://github.com/tox-dev/tox
  documentation: https://tox.wiki

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - kalefranz
    - sannykr
    - bollwyvl

#### CFE metadata AND comments
