schema_version: 1

context:
  version: "3.0.1"

package:
  name: azure-mgmt-datalake-nspkg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-datalake-nspkg/azure-mgmt-datalake-nspkg-3.0.1.zip
  sha256: deb192ba422f8b3ec272ce4e88736796f216f28ea5b03f28331d784b7a3f4880

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-mgmt-nspkg

tests:
  - python:
      imports:
        - azure_mgmt_datalake_nspkg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Data Lake Management Namespace Package [Internal]
  description: |
    Microsoft Azure Data Lake Management Namespace Package [Internal]

extra:
  recipe-maintainers:
    - rxm7706

