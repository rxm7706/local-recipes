# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.2"

package:
  name: sprox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sprox/sprox-${{ version }}.tar.gz
  sha256: 5cfeee951be07b51d1e219d20fbafd6293f6c1e5d3f579a4aecd7c63621aa55f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sprox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.sprox.org
  license: MIT
  license_file: LICENSE
  summary: A package for creation of web widgets directly from database schema.
  description: |
    A package for creation of web widgets directly from database schema.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sprox
