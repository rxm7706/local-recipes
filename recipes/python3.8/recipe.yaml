# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: python3.8
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3.8/python3_8-${{ version }}.tar.gz
  sha256: 9b170f94d483883c6f0098dbe364f5dab4a2d76e378c100f12476f996754d022

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python3.8/
  license: MIT
  license_file: LICENSE
  summary: A Python 3.8 package
  description: |
    A Python 3.8 package

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python3.8
