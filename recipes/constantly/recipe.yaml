# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "23.10.4"

package:
  name: constantly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/constantly/constantly-${{ version }}.tar.gz
  sha256: aa92b70a33e2ac0bb33cd745eb61776594dc48764b06c35e0efd050b7f1c7cbd

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68.2
    - versioneer ==0.29
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - constantly
      pip_check: true
      python_version: ["${{ python_min }}.*", "*"]

about:
  homepage: https://github.com/twisted/constantly
  license: MIT
  license_file: LICENSE
  summary: Symbolic constants in Python
  description: |
    A library that provides symbolic constant support.
    It includes collections and constants with text, numeric, and bit flag values.
    Originally twisted.python.constants from the Twisted project.
  documentation: http://constantly.readthedocs.io/en/latest
  repository: https://github.com/twisted/constantly

extra:
  recipe-maintainers:
    - isuruf
    - killua156
