# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "23.10.4"

package:
  name: constantly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/constantly/constantly-${{ version }}.tar.gz
  sha256: aa92b70a33e2ac0bb33cd745eb61776594dc48764b06c35e0efd050b7f1c7cbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.2
  run:
    - python >=${{ python_min }}
    - versioneer

tests:
  - python:
      imports:
        - constantly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/twisted/constantly
  license: MIT
  license_file: LICENSE
  summary: Symbolic constants in Python
  description: |
    Symbolic constants in Python

extra:
  recipe-maintainers:
    - isuruf
    - killua156

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: constantly
  cfe-upstream-registry: pypi
  cfe-upstream-name: constantly
  cfe-purls:
    - pkg:conda/constantly@${{ version }}?channel=conda-forge
    - pkg:pypi/constantly@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/twisted/constantly
  cfe-import-names: [constantly]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/constantly-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T07:15:51Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T07:15:51Z
