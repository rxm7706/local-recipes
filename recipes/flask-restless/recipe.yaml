# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.0"

package:
  name: flask-restless
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Restless/Flask-Restless-${{ version }}.tar.gz
  sha256: 1de47fe80abd47239c9a1804e0ba5da1d23b9f40cfc26202d16bed37f178c2b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flask_restless
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jfinkels/flask-restless
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A Flask extension for easy ReSTful API generation
  description: |
    A Flask extension for easy ReSTful API generation

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-restless
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-restless
