    - pkg:pypi/flask-restless@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/jfinkels/flask-restless
  cfe-import-names: [flask_restless]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-restless-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.17.0

  cfe-forge-blocker-list:
