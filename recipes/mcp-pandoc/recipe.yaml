# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.1"
  python_min: "3.11"

package:
  name: mcp-pandoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-pandoc/mcp_pandoc-${{ version }}.tar.gz
  sha256: 07aea7a0d9f2717f94d7fa92e87635cb7c64727107e662e303028ab1e30d9219

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - jsonschema >=4.25.1
    - mcp <3,>=2
    - pandoc >=2.4
    - pandocfilters >=1.5.0
    - panflute >=2.3.1
    - pypandoc >=1.14
    - pyyaml >=6.0.2

tests:
  - python:
      imports:
        - mcp_pandoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-pandoc/
  license: MIT
  license_file: LICENSE
  summary: MCP to interface with pandoc to convert files to different formats with enhanced features like Mermaid diagram conversion and defaults file support.
  description: |
    MCP to interface with pandoc to convert files to different formats with enhanced features like Mermaid diagram conversion and defaults file support.

extra:
  recipe-maintainers:
    - rxm7706

