# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: patsy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/patsy/patsy-${{ version }}.tar.gz
  sha256: cdc995455f6233e90e22de72c37fcadb344e7586fb83f06696f54d92f8ce74c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.4

tests:
  - python:
      imports:
        - patsy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydata/patsy
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A Python package for describing statistical models and for building design matrices.
  description: |
    A Python package for describing statistical models and for building design matrices.

extra:
  recipe-maintainers:
    - bollwyvl
    - croth1

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: patsy
