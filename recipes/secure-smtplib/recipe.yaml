# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: secure-smtplib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/secure-smtplib/secure-smtplib-${{ version }}.tar.gz
  sha256: 3d4903f6612626ccd9b77ef05313cb3c3952a59a4d756cda2377b272fabad8b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - secure_smtplib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/graingert/secure-smtplib
  license: MIT
  license_file: LICENSE
  summary: Secure SMTP subclasses for Python 2
  description: |
    Secure SMTP subclasses for Python 2

extra:
  recipe-maintainers:
    - rxm7706

