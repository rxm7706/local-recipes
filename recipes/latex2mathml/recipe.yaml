# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: latex2mathml
  version: "3.77.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/latex2mathml-${{ version }}.tar.gz
  sha256: e2f501d1878f2e489c3f6f12786bef74c62f712d2770f7f3c837eb20a55d0a1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - latex2mathml = latex2mathml.converter:main
      - l2m = latex2mathml.converter:main

requirements:
  host:
    - python >=3.8,<4.0
    - poetry-core
    - pip
  run:
    - python >=3.8,<4.0

tests:
  - python:
      imports:
        - latex2mathml
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - latex2mathml -V
      - l2m -V

about:
  summary: Pure Python library for LaTeX to MathML conversion
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/roniemartinez/latex2mathml

extra:
  recipe-maintainers:
    - 48762
