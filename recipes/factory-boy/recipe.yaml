# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.3"

package:
  name: factory-boy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/factory-boy/factory_boy-${{ version }}.tar.gz
  sha256: 866862d226128dfac7f2b4160287e899daf54f2612778327dd03d0e2cb1e3d03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - faker >=0.7.0

tests:
  - python:
      imports:
        - factory
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/FactoryBoy/factory_boy
  license: MIT
  license_file: LICENSE
  summary: A versatile test fixtures replacement based on thoughtbot's factory_bot for Ruby.
  description: |
    A versatile test fixtures replacement based on thoughtbot's factory_bot for Ruby.

extra:
  recipe-maintainers:
    - rxm7706

