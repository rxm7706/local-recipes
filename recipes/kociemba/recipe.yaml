# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: kociemba
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kociemba/kociemba-${{ version }}.tar.gz
  sha256: b77435d7b0e93e9c7963e487e8cc3820540bd1c9bb9fe5665999d3a8deac9ee6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cffi
    - future

tests:
  - python:
      imports:
        - kociemba
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/muodov/kociemba
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python/C implementation of Herbert Kociemba's Two-Phase algorithm for solving Rubik's Cube
  description: |
    Python/C implementation of Herbert Kociemba's Two-Phase algorithm for solving Rubik's Cube

extra:
  recipe-maintainers:
    - rxm7706

