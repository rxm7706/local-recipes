# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-tornasync
  version: 0.6.0.post2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d781b6d951a2e7c08843141d3ff583610b4ea86bfa847714c76edefb576bbe5d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - pytest >=3.0
    - python >=${{ python_min }}
    - tornado >=5.0

tests:
  - python:
      imports:
        - pytest_tornasync
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: py.test plugin for testing Python 3.5+ Tornado code
  homepage: https://github.com/eukaryote/pytest-tornasync
  repository: https://github.com/eukaryote/pytest-tornasync

extra:
  recipe-maintainers:
    - lincrosenbach
    - igorcandeia
    - kfasolin
    - nicoddemus
