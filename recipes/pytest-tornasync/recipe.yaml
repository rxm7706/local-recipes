# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0.post2"

package:
  name: pytest-tornasync
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-tornasync/pytest-tornasync-${{ version }}.tar.gz
  sha256: d781b6d951a2e7c08843141d3ff583610b4ea86bfa847714c76edefb576bbe5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest
    - tornado

tests:
  - python:
      imports:
        - pytest_tornasync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eukaryote/pytest-tornasync
  license: http://www.opensource.org/licenses/mit-license.php
  license_file: LICENSE
  summary: py.test plugin for testing Python 3.5+ Tornado code
  description: |
    py.test plugin for testing Python 3.5+ Tornado code

extra:
  recipe-maintainers:
    - lincrosenbach
    - igorcandeia
    - kfasolin
    - nicoddemus

