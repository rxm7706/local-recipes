# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyflowchart
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/pyflowchart-${{ version }}.tar.gz
  sha256: 4268699c4d11d1ab4e5276a12441f7eea6468ee3d87fadb54a4d2449cc3526c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - astunparse
    - chardet

tests:
  - python:
      imports:
        - pyflowchart
      pip_check: true

about:
  summary: Python codes to Flowcharts.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cdfmlr/pyflowchart

extra:
  recipe-maintainers:
    - julian-belina
