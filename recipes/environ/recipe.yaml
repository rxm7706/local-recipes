# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: environ
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/environ/environ-${{ version }}.tar.gz
  sha256: 4df7f1dfeb7d1c988d2e19a8bd5d547a526e0400aeb35adf732032472f35dcb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - environ
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Stack Based Globals Management
  description: |
    Stack Based Globals Management

extra:
  recipe-maintainers:
    - rxm7706

