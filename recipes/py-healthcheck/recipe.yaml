# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.1"

package:
  name: py-healthcheck
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-healthcheck/py-healthcheck-${{ version }}.tar.gz
  sha256: 60bbaab729a89098f0e6723ba5b6ab4ca8bde79b1a1bdb324f2b9e39df33780d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - six

tests:
  - python:
      imports:
        - healthcheck
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ateliedocodigo/py-healthcheck
  license: MIT
  license_file: LICENSE
  summary: Adds healthcheck endpoints to Flask or Tornado apps
  description: |
    Adds healthcheck endpoints to Flask or Tornado apps

extra:
  recipe-maintainers:
    - rxm7706

