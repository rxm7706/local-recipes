# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: streamlit-plotly-events
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-plotly-events/streamlit-plotly-events-${{ version }}.tar.gz
  sha256: 1fe25dbf0e5d803aeb90253be04d7b395f5bcfdf3c654f96ff3c19424e7f9582

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit
    - plotly

tests:
  - python:
      imports:
        - streamlit_plotly_events
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/null-jones/streamlit-plotly-events
  license: MIT
  license_file: LICENSE
  summary: Plotly chart component for Streamlit that also allows for events to bubble back up to Streamlit.
  description: |
    Plotly chart component for Streamlit that also allows for events to bubble back up to Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

