# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: marshmallow-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/marshmallow-sqlalchemy/marshmallow_sqlalchemy-${{ version }}.tar.gz
  sha256: e51192c204770645a2fab0d72f44f8789272eef75951f84b1608d6b4b0bfe0e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - marshmallow >=3.18.0
    - sqlalchemy <3.0,>=1.4.40

tests:
  - python:
      imports:
        - marshmallow_sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/marshmallow-sqlalchemy/
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy integration with the marshmallow (de)serialization library
  description: |
    SQLAlchemy integration with the marshmallow (de)serialization library
  repository: https://github.com/marshmallow-code/marshmallow-sqlalchemy

extra:
  recipe-maintainers:
    - frol
    - mediocretech

