# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: st-pages
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/st-pages/st_pages-${{ version }}.tar.gz
  sha256: 2641cfbff1c768ff146858ed742d282b30a3a4c3e4f7717898705bbaee717736

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - streamlit >=1.36.0

tests:
  - python:
      imports:
        - st_pages
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/st-pages/
  license: MIT
  license_file: LICENSE
  summary: An experimental version of Streamlit Multi-Page Apps
  description: |
    An experimental version of Streamlit Multi-Page Apps

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: st-pages
  cfe-upstream-registry: pypi
  cfe-upstream-name: st-pages
  cfe-purls:
    - pkg:conda/st-pages@${{ version }}?channel=conda-forge
    - pkg:pypi/st-pages@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/st-pages/
  cfe-upstream-homepage: https://pypi.org/project/st-pages/
  cfe-import-names: [st_pages]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
