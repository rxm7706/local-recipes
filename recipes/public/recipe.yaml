# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.12.3"

package:
  name: public
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/public/public-${{ version }}.tar.gz
  sha256: 2919ef9037e2a2d2563f8431adaa09b6b129d5398d0a687e42f00593484a9aa2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - public
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andrewp-as-is/public.py
  license: Unlicense
  license_file: LICENSE
  summary: replace __all__ with @public.add decorator
  description: |
    replace __all__ with @public.add decorator

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: public
  cfe-upstream-registry: pypi
  cfe-upstream-name: public
  cfe-purls:
