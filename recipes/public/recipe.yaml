    - pkg:pypi/public@${{ version }}
  cfe-upstream-repo: https://github.com/andrewp-as-is/public.py
  cfe-upstream-homepage: https://github.com/andrewp-as-is/public.py
  cfe-import-names: [public]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
