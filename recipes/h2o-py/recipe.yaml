# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: h2o
  version: "3.46.0.12"

package:
  name: ${{ name|lower }}-py
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 64279024cadea9c19ed49580c7733aa21bb9aff302805a1ae2f6cdf2e3cea0d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - colorama >=0.3.8
    - future
    - python >=${{ python_min }}
    - requests
    - tabulate
    - numpy

tests:
  - python:
      imports:
        - h2o
        - h2o.automl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: H2O, Fast Scalable Machine Learning, for python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/h2oai/h2o-3

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: h2o-py
  cfe-upstream-registry: pypi
  cfe-upstream-name: h2o-py
  cfe-purls:
    - pkg:conda/h2o-py@${{ version }}?channel=conda-forge
    - pkg:pypi/h2o-py@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/h2oai/h2o-3
  cfe-import-names: [h2o, h2o.automl]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/h2o-py-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T01:27:09Z
