# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.17.1"

package:
  name: botframework-connector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/b/botframework-connector/botframework_connector-4.17.1-py2.py3-none-any.whl
  sha256: 929d242a242f16c7c637eec7c239a84fd7f5f5bb7f95968407d3a9aa9d7bdf8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - msrest ==0.7.*
    - pyjwt >=2.4.0
    - botbuilder-schema ==4.17.1
    - msal >=1.31.1

tests:
  - python:
      imports:
        - botframework_connector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.github.com/Microsoft/botbuilder-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Bot Framework Bot Builder SDK for Python.
  description: |
    Microsoft Bot Framework Bot Builder SDK for Python.

extra:
  recipe-maintainers:
    - rxm7706

