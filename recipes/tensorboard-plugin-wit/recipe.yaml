# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: tensorboard-plugin-wit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/tensorboard-plugin-wit/tensorboard_plugin_wit-1.8.1-py3-none-any.whl
  sha256: ff26bdd583d155aa951ee3b152b3d0cffae8005dc697f72b44a8e8c2a77a8cbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tensorboard_plugin_wit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://whatif-tool.dev
  license: Apache-2.0
  license_file: LICENSE
  summary: What-If Tool TensorBoard plugin.
  description: |
    What-If Tool TensorBoard plugin.

extra:
  recipe-maintainers:
    - jschueller

