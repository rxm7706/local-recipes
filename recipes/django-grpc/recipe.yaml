# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-grpc
  version: "1.2.15"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-grpc-${{ version }}.tar.gz
  sha256: eb80b1e5dcf855f421ffd363571cecd592ea298a5dbbc8b6b7306288cac81d3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - django >=4.2
    - protobuf >=4.21.4
    - grpcio >=1.47.0,<2.0.0
    - grpcio-tools >=1.47.0,<2.0.0

tests:
- python:
    imports:
      - django_grpc
      - django_grpc_testtools
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: Easy Django based gRPC service
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/gluk-w/django-grpc

extra:
  recipe-maintainers:
    - rxm7706

