# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-grpc
  version: "1.2.20"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-grpc/django_grpc-${{ version }}.tar.gz
  sha256: 46ec3e8001bd2e13ef286d82142b606b4ff5af2f27ff7afdfb5a21f86774345a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - setuptools
    - django >=4.2,<7.0
    - protobuf
    - grpcio
    - grpcio-tools
    - grpcio-reflection

tests:
  - python:
      imports:
        - django_grpc
        - django_grpc_testtools
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Easy Django based gRPC service
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/gluk-w/django-grpc

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka

