# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.5"

package:
  name: autogen-agentchat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autogen-agentchat/autogen_agentchat-${{ version }}.tar.gz
  sha256: 8d9c718db52ef24a518806b3a0ef848f0e4c1902877675dc0abed73a8e6e7755

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - autogen-core ==0.7.5

tests:
  - python:
      imports:
        - autogen_agentchat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/autogen-agentchat/
  license: MIT
  license_file: LICENSE
  summary: AutoGen agents and teams library
  description: |
    AutoGen agents and teams library

extra:
  recipe-maintainers:
    - raybellwaves
    - jan-janssen

