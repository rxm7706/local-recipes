# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.3"

package:
  name: tzdata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tzdata/tzdata-${{ version }}.tar.gz
  sha256: 4a1518b8993086a7982523e071643f3c0e5f213e75b21318e78bcabfff9d1415

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tzdata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/tzdata
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider of IANA time zone data
  description: |
    Provider of IANA time zone data
  repository: https://github.com/python/tzdata
  documentation: https://tzdata.python.org

extra:
  recipe-maintainers:
    - ocefpaf
    - mbargull
    - pganssle
    - h-vetinari

#### CFE metadata AND comments
