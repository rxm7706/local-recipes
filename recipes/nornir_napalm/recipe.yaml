# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: nornir_napalm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nornir_napalm/nornir_napalm-${{ version }}.tar.gz
  sha256: 428f41bf498aa48de893e39c6d6acee39a9376c0decd8f4eba2f40e18ea266b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - napalm <6,>=5
    - nornir <4,>=3.0.0a0

tests:
  - python:
      imports:
        - nornir_napalm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nornir_napalm/
  license: Apache-2.0
  license_file: LICENSE
  summary: NAPALM's plugins for nornir
  description: |
    NAPALM's plugins for nornir
  repository: https://github.com/nornir-automation/nornir_napalm

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
