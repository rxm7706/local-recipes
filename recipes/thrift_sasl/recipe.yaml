# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: thrift-sasl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/thrift-sasl/thrift_sasl-${{ version }}.tar.gz
  sha256: 5bdd5b760d90a13d9b3abfce873db0425861aa8d6bf25912d3cc0467a4f773da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pure-sasl
    - six
    - thrift

tests:
  - python:
      imports:
        - thrift_sasl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cloudera/thrift_sasl
  license: Apache-2.0
  license_file: LICENSE
  summary: Thrift SASL Python module that implements SASL transports for Thrift (`TSaslClientTransport`).
  description: |
    Thrift SASL Python module that implements SASL transports for Thrift (`TSaslClientTransport`).

extra:
  recipe-maintainers:
    - xylar
    - mariusvniekerk
    - ericdill
    - wesm

#### CFE metadata AND comments
