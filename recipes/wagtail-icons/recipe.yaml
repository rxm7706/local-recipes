# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: wagtail-icons
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail-icons/wagtail-icons-${{ version }}.tar.gz
  sha256: 3764a6036b37c2d00f18befe40f1faaee38bd2c6bdcf16d7d07a1f8c8afa4b29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - wagtail

tests:
  - python:
      imports:
        - wagtail_icons
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/wagtail-icons/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

