# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.1"

package:
  name: tkcalendar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkcalendar/tkcalendar-${{ version }}.tar.gz
  sha256: 5edf958c0a59429e90309e9b805b2e229192bbcab952460247204d7030eea5cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - babel

tests:
  - python:
      imports:
        - tkcalendar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/j4321/tkcalendar
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Calendar and DateEntry widgets for Tkinter
  description: |
    Calendar and DateEntry widgets for Tkinter

extra:
  recipe-maintainers:
    - rxm7706

