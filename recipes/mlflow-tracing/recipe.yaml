# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.15.1"

package:
  name: mlflow-tracing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mlflow-tracing/mlflow_tracing-${{ version }}.tar.gz
  sha256: ba1c4d873151c0ceeab37f53daf0997feea18a1c092358995072dc53e1944a29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <=82.0.1
  run:
    - python >=${{ python_min }}
    - cachetools <8,>=5.0.0
    - databricks-sdk <1,>=0.20.0
    - opentelemetry-api <3,>=1.9.0
    - opentelemetry-proto <3,>=1.9.0
    - opentelemetry-sdk <3,>=1.9.0
    - packaging <27
    - protobuf <8,>=3.12.0
    - pydantic <3,>=2.0.0

tests:
  - python:
      imports:
        - mlflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mlflow.org
  license: Apache-2.0
  license_file: LICENSE
  summary: MLflow Tracing SDK is an open-source, lightweight Python package that only includes the minimum set of dependencies and functionality to instrument your code/models/agents with MLflow Tracing.
  description: |
    MLflow Tracing SDK is an open-source, lightweight Python package that only includes the minimum set of dependencies and functionality to instrument your code/models/agents with MLflow Tracing.
  documentation: https://mlflow.org/docs/latest

extra:
  recipe-maintainers:
    - rxm7706

