# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: moonshine-voice
  version: ${{ version }}

source:
  url: https://github.com/moonshine-ai/moonshine/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0eac05ab136834ac5d01e8f1cc2dde87048bcc9b37d92149042ab70b0c822d18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - python-sounddevice
    - requests
    - tqdm
    - filelock
    - platformdirs
    - google-crc32c

tests:
  - python:
      imports:
        - micro.stt-training.stt_training
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/moonshine-ai/moonshine
  license: MIT
  license_file: LICENSE
  summary: Fast, accurate, on-device AI library for building interactive voice applications
  description: |
    Fast, accurate, on-device AI library for building interactive voice applications
  repository: https://github.com/moonshine-ai/moonshine
  documentation: https://github.com/moonshine-ai/moonshine

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
