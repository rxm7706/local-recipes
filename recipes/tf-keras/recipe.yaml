# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.21.0"

package:
  name: tf-keras
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tf-keras/tf_keras-${{ version }}.tar.gz
  sha256: f9af0f2546cd5532de0fae7a481f34a1ca2253737d4cd1000f6b713dc733f770

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tensorflow <2.22,>=2.21

tests:
  - python:
      imports:
        - tf_keras
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://keras.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Deep learning for humans.
  description: |
    Deep learning for humans.

extra:
  recipe-maintainers:
    - conda-forge/keras

#### CFE metadata AND comments
