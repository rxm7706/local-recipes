# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: multipledispatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multipledispatch/multipledispatch-${{ version }}.tar.gz
  sha256: 5c839915465c68206c3e9c473357908216c28383b425361e5d144594bf85a7e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - multipledispatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mrocklin/multipledispatch/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Multiple dispatch
  description: |
    Multiple dispatch

extra:
  recipe-maintainers:
    - pmlandwehr
    - cpcloud

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: multipledispatch
  cfe-upstream-registry: pypi
  cfe-upstream-name: multipledispatch
  cfe-purls:
    - pkg:conda/multipledispatch@${{ version }}?channel=conda-forge
    - pkg:pypi/multipledispatch@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/mrocklin/multipledispatch/
  cfe-import-names: [multipledispatch]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/multipledispatch-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.0.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

