    - pkg:pypi/pydataverse@${{ version }}
  cfe-upstream-repo: https://github.com/gdcc/pyDataverse
  cfe-upstream-homepage: https://github.com/gdcc/pyDataverse
  cfe-import-names: [pyDataverse]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pydataverse-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.3.5

  cfe-forge-blocker-list:
