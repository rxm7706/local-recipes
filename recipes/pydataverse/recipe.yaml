# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydataverse
  version: "0.3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bd3c4bdd98d57fcc6344c7931ee2485acd623743565f90a08bb8f07cf0241601

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
    - poetry
  run:
    - python >=3.8
    - httpx >=0.27,<0.30
    - jsonschema >=4.21.1

tests:
  - python:
      imports:
        - pyDataverse
      pip_check: true

about:
  summary: A Python module for the Dataverse APIs and its data-types
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/gdcc/pyDataverse
  repository: https://github.com/gdcc/pyDataverse
  documentation: https://pydataverse.readthedocs.io

extra:
  recipe-maintainers:
    - PennyHow
    - izahn
    - pdurbin
