# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.5"

package:
  name: pydataverse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyDataverse/pydataverse-${{ version }}.tar.gz
  sha256: bd3c4bdd98d57fcc6344c7931ee2485acd623743565f90a08bb8f07cf0241601

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpx <0.30,>=0.27
    - jsonschema <5.0.0,>=4.21.1

tests:
  - python:
      imports:
        - pyDataverse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gdcc/pyDataverse
  license: MIT
  license_file: LICENSE.txt
  summary: A Python module for Dataverse.
  description: |
    A Python module for Dataverse.
  repository: https://github.com/gdcc/pyDataverse

extra:
  recipe-maintainers:
    - PennyHow
    - izahn
    - pdurbin

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydataverse
  cfe-upstream-registry: pypi
  cfe-upstream-name: pydataverse
  cfe-purls:
