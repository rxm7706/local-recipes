# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.32"

package:
  name: python-multipart
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-multipart/python_multipart-${{ version }}.tar.gz
  sha256: be54b7f3fa167bb83e4fcd936b887b708f4e57fe75911c02aebf53efaf8d938e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - multipart
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kludex/python-multipart
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: A streaming multipart parser for Python
  description: |
    A streaming multipart parser for Python
  repository: https://github.com/Kludex/python-multipart
  documentation: https://kludex.github.io/python-multipart/

extra:
  recipe-maintainers:
    - carlodri
    - thewchan
    - davidbrochart

#### CFE metadata AND comments
