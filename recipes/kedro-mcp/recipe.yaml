# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: kedro-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kedro-mcp/kedro_mcp-${{ version }}.tar.gz
  sha256: 73a6a14b50d03a97da3d8728450e06bf83642a28ae61b8aa59c54c5a93524c35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - fastmcp >=0.3

tests:
  - python:
      imports:
        - kedro_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kedro-org/kedro-mcp
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: MCP server with Kedro prompts and tools (local stdio, zero-install via uvx).
  description: |
    MCP server with Kedro prompts and tools (local stdio, zero-install via uvx).

extra:
  recipe-maintainers:
    - rxm7706

