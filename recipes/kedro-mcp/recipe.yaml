# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: kedro-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kedro-mcp/kedro_mcp-${{ version }}.tar.gz
  sha256: 73a6a14b50d03a97da3d8728450e06bf83642a28ae61b8aa59c54c5a93524c35
  patches:
    - patches/0001-migrate-off-third-party-fastmcp-to-official-mcp-sdk.patch

build:
  number: 1  # bumped from 0: same-version rebuild with real content changes (the fastmcp->mcp source patch below)
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - kedro-mcp = kedro_mcp.server:main_stdio

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - mcp >=2.0.0
    - fastmcp >=4.0.0b5

tests:
  - python:
      imports:
        - kedro_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kedro-org/kedro-mcp
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: MCP server with Kedro prompts and tools (local stdio, zero-install via uvx).
  description: |
    MCP server with Kedro prompts and tools (local stdio, zero-install via uvx).
  repository: https://github.com/kedro-org/kedro-mcp

extra:
  recipe-maintainers:
    - rxm7706

