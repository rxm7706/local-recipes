  cfe-forge-recipe-updates-needed: "n/a -- carries a local-only source patch (see below), not submittable upstream as-is"
  cfe-forge-blocker-list:
    - "Source patch replaces upstream's third-party `fastmcp` dependency with the official `mcp` SDK's `mcp.server.mcpserver.MCPServer` (fastmcp's own API, renamed, per https://py.sdk.modelcontextprotocol.io/v2/migration/#fastmcp-renamed-to-mcpserver). Motivation: kedro-org/kedro discussion #5387 confirms MCP support stays out of Kedro core and experimentation continues in kedro-mcp -- so this package's own fastmcp compatibility is not going to be fixed upstream any time soon. Root cause: kedro-mcp's `fastmcp>=0.3` floor is so loose the solver can land on ANY fastmcp build; every conda-forge fastmcp 3.x build (ceiling 3.4.7) hard-requires mcp<2.0 (conflicting with this workspace's mcp>=2.1.1 floor), and fastmcp 2.14.3 has no mcp upper bound but is runtime-broken (ImportError: cannot import name 'McpError') -- so no available fastmcp release worked here at all. The patched server.py verified functionally identical to upstream (same @mcp.tool()/@mcp.prompt() decorator API, same PromptMessage/TextContent construction) via a live stdio initialize handshake."
