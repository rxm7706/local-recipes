# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: cvprac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cvprac/cvprac-${{ version }}.tar.gz
  sha256: f09e006ec43a79ad56ddbd7eea27daf67c3fb36fd61a42ce562905c0ece70bf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.27.0
    - packaging >=23.2

tests:
  - python:
      imports:
        - cvprac
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aristanetworks/cvprac
  license: BSD-3
  license_file: LICENSE
  summary: Arista Cloudvision(R) Portal Rest API Client written in python
  description: |
    Arista Cloudvision(R) Portal Rest API Client written in python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
