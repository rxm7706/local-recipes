# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: graphql-relay
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphql-relay/graphql-relay-${{ version }}.tar.gz
  sha256: 1ff1c51298356e481a0be009ccdff249832ce53f30559c1338f22a0e0d17250c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install -vv .

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - poetry-core >=1,<2
  run:
    - python >=${{ python_min }}
    - graphql-core >=3.2,<3.3
    - typing_extensions >=4.1,<5

tests:
  - python:
      imports:
        - graphql_relay
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest >=6.2,<7
        - pytest-asyncio >=0.14,<1
        - pytest-cov >=2.11,<3
        - pytest-describe >=1,<2
        - pyyaml >=5.4,<6
        - python ${{ python_min }}
    script:
      - pytest --cov graphql_relay --no-cov-on-fail --cov-report term-missing:skip-covered --cov-fail-under 91

about:
  license_file: LICENSE
  license: MIT
  summary: Relay library for graphql-core
  homepage: https://github.com/graphql-python/graphql-relay-py

extra:
  recipe-maintainers:
    - pmlandwehr
    - bollwyvl
