# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: streamlit-card
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-card/streamlit_card-${{ version }}.tar.gz
  sha256: 8001cd5edd8a6e2db36ee81f37dc645f08f78c21a2ba968403176c68b4f33cb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_card
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gamcoh/st-card
  license: MIT
  license_file: LICENSE
  summary: A streamlit component, to make UI cards
  description: |
    A streamlit component, to make UI cards

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
