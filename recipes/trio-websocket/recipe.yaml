# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.2"

package:
  name: trio-websocket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trio-websocket/trio_websocket-${{ version }}.tar.gz
  sha256: 22c72c436f3d1e264d0910a3951934798dcc5b00ae56fc4ee079d46c7cf20fae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - outcome >=1.2.0
    - trio >=0.11
    - wsproto >=0.14
    - exceptiongroup

tests:
  - python:
      imports:
        - trio_websocket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-trio/trio-websocket
  license: MIT
  license_file: LICENSE
  summary: WebSocket library for Trio
  description: |
    WebSocket library for Trio
  repository: https://github.com/python-trio/trio-websocket

extra:
  recipe-maintainers:
    - bollwyvl

