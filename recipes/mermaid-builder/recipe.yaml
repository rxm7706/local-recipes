# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: mermaid-builder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mermaid-builder/mermaid_builder-${{ version }}.tar.gz
  sha256: 3016ef25668bcb28de4a4746aabdfaa531c06a7e7f89fa1596e6a274c7c73705

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mermaid_builder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/romaninozemtsev/python-mermaid-builder
  license: MIT
  license_file: LICENSE
  summary: MermaidJS markup builder for Python
  description: |
    MermaidJS markup builder for Python

extra:
  recipe-maintainers:
    - rxm7706

