# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: safehttpx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/safehttpx/safehttpx-${{ version }}.tar.gz
  sha256: db201c0978c41eddb8bb480f3eee59dd67304fdd91646035e9d9a720049a9d23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx

tests:
  - python:
      imports:
        - safehttpx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gradio-app/safehttpx
  license: MIT
  license_file: LICENSE
  summary: A small Python library created to help developers protect their applications from Server Side Request Forgery (SSRF) attacks.
  description: |
    A small Python library created to help developers protect their applications from Server Side Request Forgery (SSRF) attacks.

extra:
  recipe-maintainers:
    - HeavyTony2

