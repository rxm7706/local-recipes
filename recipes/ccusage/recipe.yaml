# CFE comments
# Header:
#    # Packaged 2026-07-12 (user request: token-usage/cost observability
#    # tooling). Upstream moved ryoppippi/ccusage -> ccusage/ccusage; the
#    # GitHub repo's license shows NOASSERTION at the API level but the
#    # LICENSE file and the npm metadata are plain MIT.
# build:
#    # Zero runtime npm deps (fully bundled dist), so the canonical
#    # pnpm-licenses third-party-disclaimer step is omitted; the npm
#    # symlink -> bash-wrapper replacement mirrors the caveman recipe
#    # (noarch packages cannot ship symlinks), hence the __unix gate.
# context:
#    # 19.0.3 -> 20.0.20 (2026-09-07): the <20 pin is LIFTED, on evidence.
#    #
#    # Why it was pinned: from 20.x the npm dist stopped being pure JS. It is
#    # now a ~475 KB shim (bin: ./src/cli.js) whose getNativePackageName()
#    # resolves one of six @ccusage/ccusage-<platform>-<arch>
#    # optionalDependencies -- a Bun-compiled static-PIE ELF -- and spawns it.
#    # At 20.0.17 that binary segfaulted (exit 139) on this build host, first
#    # intermittently and then 10/10, and there is no source-build path
#    # because bun is not on conda-forge. So 19.0.3, the last node-runnable
#    # release, was held.
#    #
#    # Why it is lifted -- and why the original diagnosis was WRONG. The
#    # upstream binary never was the problem. Evidence, in order:
#    #   1. @ccusage/ccusage-linux-x64 20.0.20 pulled straight from npm and run
#    #      outside any conda build: `--version` 10/10 clean, plus `--help` and
#    #      `daily --help`. (10 runs deliberately -- the 20.0.17 failure showed
#    #      as intermittent survival first, so one green run proves nothing.)
#    #   2. The same version built into a conda package STILL segfaulted at
#    #      status 139 in the test env.
#    #   3. sha256 of the binary inside the built package != sha256 of the npm
#    #      original: 4,346,528 -> 4,352,649 bytes, 584 differing bytes, first
#    #      difference at offset 41 (inside the ELF header). rattler-build's
#    #      binary relocation had rewritten ELF sections to patch RPATH,
#    #      shifting every offset in Bun's embedded bundle.
#    #   4. With `binary_relocation: false` the packaged binary is
#    #      BYTE-IDENTICAL to upstream's and the tests pass.
#    # So "the vendor's binary segfaults on this host" was a misattribution:
#    # a self-inflicted corruption. Any prebuilt single-file binary with an
#    # embedded payload (Bun, Deno, PyInstaller, Go with embedded assets) is
#    # exposed to the same failure -- suspect relocation before the vendor.
#    #
#    # This remains a REPACKAGED PREBUILT BINARY, which is the standing
#    # conda-forge blocker recorded above -- lifting the version pin does not
#    # make the package submittable. On any future bump, diff the packaged
#    # binary against the npm original before trusting a green build; a green
#    # `npm install` proves only that the tarball unpacked.
####
