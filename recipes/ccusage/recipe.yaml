# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  # 20.x unblocked 2026-09-07 -- by `binary_relocation: false` below, NOT by
  # an upstream fix. The old <20 pin blamed the Bun binary for segfaulting;
  # the binary was fine and OUR build was corrupting it. See the CFE
  # comments for the measurement.
  version: "20.0.20"

package:
  name: ccusage
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/ccusage/-/ccusage-${{ version }}.tgz
  sha256: df1991b91f4e592a56dbd19557e513484b7486318fb6e0b98d4569c708ebaed3

build:
  number: 0
  # Per-arch (NOT noarch), following the openspec/bmalph pattern: each
  # platform's npm global install lays down its native bin shims (symlinks
  # on unix, .cmd on win), which a single noarch artifact cannot provide.
  dynamic_linking:
    # MUST stay false for 20.x. The shipped @ccusage/ccusage-<platform>
    # payload is a Bun-compiled static-PIE ELF with an embedded bundle at
    # fixed internal offsets. rattler-build's default binary relocation
    # rewrites ELF sections to patch RPATH, which grows the file (measured:
    # 4,346,528 -> 4,352,649 bytes, first difference at offset 41, inside
    # the ELF header) and shifts every embedded offset -- the binary then
    # segfaults with status 139 on any invocation. Nothing needs relocating
    # here anyway: the payload is statically linked and the rest of the
    # package is JavaScript.
    binary_relocation: false
  script:
    - if: unix
      then:
        - export npm_config_prefix="${PREFIX}"
        - npm pack --ignore-scripts
        - npm install -g ./ccusage-${{ version }}.tgz
      else:
        - call npm config set prefix "%PREFIX%"
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm pack --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm install --userconfig nonexistentrc -g ccusage-${{ version }}.tgz
        - if %ERRORLEVEL% neq 0 exit 1

requirements:
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      # --version and --help both dispatch THROUGH the shim into the
      # prebuilt native binary, so they are the regression guard for the
      # 20.0.17 segfault; `daily --help` additionally exercises a real
      # subcommand path rather than only the argv-0 fast path.
      - ccusage --version
      - ccusage --help
      - ccusage daily --help
  - if: unix
    then:
      script:
        - test -f "${PREFIX}/lib/node_modules/ccusage/package.json"
        # The shim resolves @ccusage/ccusage-<platform>-<arch> via
        # createRequire; if npm ever installs with --omit=optional the CLI
        # degrades to "native binary is not available for <platform>", so
        # assert the native package actually landed.
        - test -d "${PREFIX}/lib/node_modules/ccusage/node_modules/@ccusage"

about:
  summary: Analyze your Claude Code token usage and costs from local JSONL files
  description: |
    ccusage is a CLI tool for analyzing Claude Code usage from local JSONL
    files: daily/monthly/session/blocks reports, live monitoring, model
    breakdowns, and cost estimates. The npm distribution is a
    zero-dependency bundled build; this package installs it into the conda
    environment and exposes the ``ccusage`` command.
  homepage: https://ccusage.com
  repository: https://github.com/ccusage/ccusage
  documentation: https://ccusage.com
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ccusage
  cfe-upstream-registry: npm
  cfe-upstream-name: ccusage
  cfe-purls:
    - pkg:conda/ccusage@${{ version }}?channel=conda-forge
    - pkg:npm/ccusage@${{ version }}
  cfe-upstream-repo: https://github.com/ccusage/ccusage
  cfe-upstream-homepage: https://ccusage.com
  cfe-import-names: []
  cfe-source-kind: npm-registry-tarball
  cfe-noarch: compiled
  cfe-pip-check: "false:not-a-python-package"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - "20.x repackages a prebuilt Bun native binary - no source build path (bun is not on conda-forge), so this is not conda-forge-submittable; fine for a private channel"
  cfe-last-checked: 2026-09-07T13:20:00Z
  cfe-generated-by-version: 8.76.0
  cfe-generated-at-datetime: "2026-07-12T16:20:00Z"
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-09-07T13:20:00Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
