# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: src
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/src/src-0.0.7.zip
  sha256: 2a33bd2995800b2d3fc80efb94a300951413e02ede94691aef58bffbd69e5b0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mitchellrj/src
  license: Apache-2.0
  license_file: LICENSE
  summary: UNKNOWN
  description: |
    UNKNOWN

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
