# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"
  python_min: "3.11"

package:
  name: hygeos-core
  version: ${{ version }}

source:
  url: https://github.com/hygeos/core/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5a71f472f7ebb3a1efcdbbcb40320a5f8d5c806237b6159456a8c2e52cab36ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }},<3.14
    - pip
    - poetry-core >=1
  run:
    - python >=${{ python_min }},<3.14
    - dask
    - h5netcdf
    - lxml
    - numba
    - python-dotenv
    - toml
    - tqdm
    - xarray

tests:
  - python:
      imports:
        - core
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A collection of common procedures for generic programming purposes
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/hygeos/core

extra:
  recipe-maintainers:
    - fsteinmetz
    - danschef
