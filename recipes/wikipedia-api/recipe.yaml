# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: wikipedia-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/Wikipedia-API/wikipedia_api-${{ version }}.tar.gz
  sha256: acc6965ed4b6948c61de5f6d1edcc49654e2fc7f7239f26111ccb4ea5796cc1d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click ==8.4.1
    - httpx ==0.28.1
    - tenacity ==9.1.4

tests:
  - python:
      imports:
        - wikipediaapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/martin-majlis/Wikipedia-API
  license: MIT
  license_file: LICENSE
  summary: Python Wrapper for Wikipedia
  description: |
    Python Wrapper for Wikipedia
  repository: https://github.com/martin-majlis/Wikipedia-API

extra:
  recipe-maintainers:
    - BastianZim
    - martin-majlis

#### CFE metadata AND comments
