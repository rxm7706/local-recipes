# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: traittypes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/traittypes/traittypes-${{ version }}.tar.gz
  sha256: 212feed38d566d772648768b78d3347c148ef23915b91c02078188e631316c86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - traitlets >=4.2.2

tests:
  - python:
      imports:
        - traittypes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://ipython.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Scipy trait types
  description: |
    Scipy trait types

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jasongrout
    - maartenbreddels
    - vidartf
    - martinRenou

#### CFE metadata AND comments
