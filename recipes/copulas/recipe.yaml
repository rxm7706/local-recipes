# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.1"

package:
  name: copulas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/copulas/copulas-${{ version }}.tar.gz
  sha256: adec8f65c98f16816bde5a03e9e7e7b3df91f3fb22ef9fd5023ebba8dd1628c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - pandas <3,>=1.4.0
    - plotly >=5.10.0
    - scipy >=1.7.3

tests:
  - python:
      imports:
        - copulas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/copulas/
  license: BUSL-1.1
  license_file: LICENSE
  summary: Create tabular synthetic data using copulas-based modeling.
  description: |
    Create tabular synthetic data using copulas-based modeling.
  repository: https://github.com/sdv-dev/Copulas/

extra:
  recipe-maintainers:
    - conda-forge/sdv

#### CFE metadata AND comments
