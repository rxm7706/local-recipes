# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: django_db
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django_db/django_db-${{ version }}.tar.gz
  sha256: 8639b6f78f04f34294cb465b308992a84297df41033519efd85b3a6b186b5296

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - django_db
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jdxin0/django_db
  license: MIT
  license_file: LICENSE
  summary: A simple way to use django orm not in a classic django project
  description: |
    A simple way to use django orm not in a classic django project

extra:
  recipe-maintainers:
    - rxm7706

