# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.4.4"

package:
  name: tzlocal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tzlocal/tzlocal-${{ version }}.tar.gz
  sha256: 8dbb8660838688a7b6ba4fed31d18dedf842afb4d47ca050d6d891c2c15f3be4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tzlocal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tzlocal/
  license: MIT
  license_file: LICENSE.txt
  summary: tzinfo object for the local timezone
  description: |
    tzinfo object for the local timezone

extra:
  recipe-maintainers:
    - ericdill
    - licode
    - tacaswell
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tzlocal
  cfe-upstream-registry: pypi
  cfe-upstream-name: tzlocal
  cfe-purls:
    - pkg:conda/tzlocal@${{ version }}?channel=conda-forge
    - pkg:pypi/tzlocal@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/tzlocal/
  cfe-import-names: [tzlocal]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/tzlocal-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T07:00:17Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T07:00:17Z
