# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.46.1"
  python_min: "3.11"

package:
  name: unstructured-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unstructured-client/unstructured_client-${{ version }}.tar.gz
  sha256: f187bd289e4ed6d453af35e22ddd3c0a5d776e35442d4fa24a31ecd57a1b84b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=25.1.0
    - httpcore >=1.0.9
    - httpx >=0.28.1
    - pydantic >=2.12.5
    - pypdf >=6.9.2
    - pypdfium2 >=5.6.0
    - requests-toolbelt >=1.0.0

tests:
  - python:
      imports:
        - unstructured_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/unstructured-client/
  license: MIT
  license_file: LICENSE
  summary: Python Client SDK for Unstructured API
  description: |
    Python Client SDK for Unstructured API

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: unstructured-client
  cfe-upstream-registry: pypi
  cfe-upstream-name: unstructured-client
  cfe-purls:
    - pkg:conda/unstructured-client@${{ version }}?channel=conda-forge
    - pkg:pypi/unstructured-client@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/unstructured-client/
  cfe-import-names: [unstructured_client]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/unstructured-client-feedstock
  cfe-forge-recipe-updates-needed: 
