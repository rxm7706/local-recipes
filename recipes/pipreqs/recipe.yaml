# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: pipreqs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pipreqs/pipreqs-${{ version }}.tar.gz
  sha256: f33298d235ff76def369cb9a3594d084d9badc70cebba1e8cb271fcd4fdc0183

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - yarg
    - docopt
    - nbconvert
    - ipython

tests:
  - python:
      imports:
        - pipreqs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bndr/pipreqs
  license: Apache-2.0
  license_file: LICENSE
  summary: Pip requirements.txt generator based on imports in project
  description: |
    Pip requirements.txt generator based on imports in project
  repository: https://github.com/bndr/pipreqs

extra:
  recipe-maintainers:
    - proinsias
    - ericmjl

#### CFE metadata AND comments
