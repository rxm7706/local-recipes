# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: infoblox-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/infoblox-client/infoblox-client-${{ version }}.tar.gz
  sha256: d21920a1fe8b2c0c29dab60e97cae02d348561e41aba293b062e2bce19accd51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - infoblox_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/infobloxopen/infoblox-client
  license: Apache-2.0
  license_file: LICENSE
  summary: Client for interacting with Infoblox NIOS over WAPI
  description: |
    Client for interacting with Infoblox NIOS over WAPI

extra:
  recipe-maintainers:
    - rxm7706

