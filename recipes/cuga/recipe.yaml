# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: cuga
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cuga/cuga-${{ version }}.tar.gz
  sha256: 57b36e41d3f92ea9dfdda33fcdcae0ad7e909061412ec1cef9d729a70a040475

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - langchain >=1.0
    - langchain-ibm >=0.3.9
    - langchain-openai
    - langchain-core >=1.3.3
    - aiohttp >=3.13.4
    - httpx
    - docker-py
    - langgraph
    - markdownify
    - uvicorn
    - fastapi
    - langfuse
    - dynaconf >=3.2.13
    - playwright >=1.59.0
    - browsergym-core ==0.13.0
    - python-dotenv
    - loguru
    - mcp <2,>=1.23.0
    - psutil >=7.0.0
    - typer >=0.15.3
    - typer-slim >=0.15.3
    - fastmcp >=3.2.0
    - langchain-mcp-adapters
    - pyyaml >=6.0.3
    - langchain-groq >=0.3.8
    - langchain-litellm
    - litellm >=1.84.0
    - tavily-python
    - fastembed >=0.4.0
    - a2a-sdk >=0.3.22
    - sqlite-vec >=0.1.6
    - pgvector >=0.4.2
    - asyncpg >=0.30
    - pyjwt >=2.13.0
    - cryptography >=48.0.1
    - hvac >=2.0.0
    - boto3 >=1.34.0
    - langchain-docling <3.0,>=2.0
    - easyocr
    - pytorch
    - torchvision
    - langchain-ollama >=0.2.0
    - langchain-text-splitters <2.0,>=1.0
    - beautifulsoup4 >=4.12
    - psycopg >=3.2
    - toolguard >=0.2.17
    - cuga-oak-health
    - aiosmtpd

tests:
  - python:
      imports:
        - cuga
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://cuga.dev
  license: Apache-2.0
  license_file: LICENSE
  summary: CUGA is an open-source generalist agent for the enterprise, supporting complex task execution on web and APIs, OpenAPI/MCP integrations, composable architecture, reasoning modes, and policy-aware features.
  description: |
    CUGA is an open-source generalist agent for the enterprise, supporting complex task execution on web and APIs, OpenAPI/MCP integrations, composable architecture, reasoning modes, and policy-aware features.
  repository: https://github.com/cuga-project/cuga-agent

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
