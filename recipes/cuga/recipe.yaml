    - pkg:pypi/cuga@${{ version }}
  cfe-upstream-repo: https://github.com/cuga-project/cuga-agent
  cfe-upstream-homepage: https://cuga.dev
  cfe-import-names: [cuga]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
