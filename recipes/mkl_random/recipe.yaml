# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: mkl_random
  version: ${{ version }}

source:
  url: https://github.com/IntelPython/mkl_random/archive/${{ version }}.tar.gz
  sha256: aeeaabf01109830aa4a479d69b60e7b1e4e41e41ffdaa0d0be12edf7b0d456ff

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - setuptools
    - mkl-devel
    - cython
    - numpy
    - pip
  run:
    - python
    - mkl
    - numpy
  ignore_run_exports:
    by_name:
      - blas

tests:
  - python:
      imports:
        - mkl_random
        - mkl_random.mklrand
      pip_check: true
  - requirements:
      run:
        - pip
        - if: python_impl != "pypy"
          then: pytest
        - if: python_impl == "pypy"
          then: pytest <8
        - mkl-service
        - numpy
    script:
      - pytest -v --pyargs mkl_random

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  description: NumPy-based implementation of random number generation sampling using Intel (R) Math Kernel Library, mirroring numpy.random, but exposing all choices of sampling algorithms available in MKL.
  summary: Intel (R) MKL-powered package for sampling from common probability distributions into NumPy arrays.
  homepage: http://github.com/IntelPython/mkl_random

extra:
  recipe-maintainers:
    - ekomarova
    - ndgrigorian
    - xaleryb
    - jharlow-intel
