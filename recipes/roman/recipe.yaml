# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2"

package:
  name: roman
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roman/roman-${{ version }}.tar.gz
  sha256: 275fe9f46290f7d0ffaea1c33251b92b8e463ace23660508ceef522e7587cb6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - roman
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/roman
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Integer to Roman numerals converter
  description: |
    Integer to Roman numerals converter

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: roman
  cfe-upstream-registry: pypi
  cfe-upstream-name: roman
