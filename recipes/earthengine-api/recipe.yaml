# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.39"

package:
  name: earthengine-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/earthengine-api/earthengine_api-${{ version }}.tar.gz
  sha256: 4e7e69433d1d0b3f0af44d2778722ab81379ae8f49c22c77daabc8111b17d190

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - google-cloud-storage
    - google-api-python-client >=2.71.0
    - google-auth >=2.48.0
    - google-auth-httplib2 >=0.3.1
    - httplib2 <1dev,>=0.30.2
    - requests

tests:
  - python:
      imports:
        - ee
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/earthengine-api
  license: Apache-2.0
  license_file: LICENSE
  summary: Earth Engine Python API
  description: |
    Earth Engine Python API

extra:
  recipe-maintainers:
    - gino-m
    - jdbcode
    - jgarcia525
    - michaelfdewitt
    - naschmitz
    - schwehr
    - sgreenberg
    - sufyanAbbasi
    - kfriis33

