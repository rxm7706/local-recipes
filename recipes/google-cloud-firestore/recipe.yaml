# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.28.1"

package:
  name: google-cloud-firestore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-firestore/google_cloud_firestore-${{ version }}.tar.gz
  sha256: 833fefd9a8b9c68c750da1c0fdd93e4ca1a3ab728081c7d6c57c362e06accf8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - google-cloud-core <3.0.0,>=2.0.0
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.firestore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-firestore
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Firestore API client library
  description: |
    Google Cloud Firestore API client library

extra:
  recipe-maintainers:
    - xylar
    - mitchellsuter

