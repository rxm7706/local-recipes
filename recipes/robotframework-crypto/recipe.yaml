# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: robotframework-crypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robotframework-crypto/robotframework-crypto-${{ version }}.tar.gz
  sha256: 25dcf9475ff54b8c0d2f8dacfab048c369779d73e5155eec0422e11d3633ef83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - robotframework >=6.0.0
    - pynacl >=1.5.0
    - questionary >=2.0.1

tests:
  - python:
      imports:
        - CryptoClient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Snooz82/robotframework-crypto
  license: Apache-2.0
  license_file: LICENSE
  summary: A library for secure password handling.
  description: |
    A library for secure password handling.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
