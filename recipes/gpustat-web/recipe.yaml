# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: gpustat-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gpustat-web/gpustat-web-${{ version }}.tar.gz
  sha256: 4f2eb3279c62b0930721d3bc9f1fbf4938650f2c7928cf2c919a429c13009729

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - distutils

tests:
  - python:
      imports:
        - gpustat_web
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wookayin/gpustat-web
  license: MIT
  license_file: LICENSE
  summary: A web interface of gpustat --- consolidate status across multiple nodes.
  description: |
    A web interface of gpustat --- consolidate status across multiple nodes.

extra:
  recipe-maintainers:
    - rxm7706

