# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.62.0.post5"

package:
  name: azureml-mlflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/azureml-mlflow/azureml_mlflow-1.62.0.post5-py3-none-any.whl
  sha256: 0523090f20ce27f24e5d19744bc1b377d854f34f3cc5ce268338a7e3d05de455

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jsonpickle <5.0.0
    - mlflow-skinny <=3.13.0
    - azure-identity
    - msrest >=0.6.18
    - azure-core !=1.22.0,<2.0.0,>=1.8.0
    - azure-mgmt-core <2.0.0,>=1.2.0
    - azure-storage-blob <=12.27.1,>=12.5.0
    - azure-common >=1.1
    - cryptography <49.0.0
    - python-dateutil <3.0.0,>=2.7.3
    - pytz <=2025.2

tests:
  - python:
      imports:
        - azureml_mlflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.microsoft.com/python/api/overview/azure/ml/?view=azure-ml-py
  license: MIT
  license_file: LICENSE
  summary: Contains the integration code of AzureML with Mlflow.
  description: |
    Contains the integration code of AzureML with Mlflow.

extra:
  recipe-maintainers:
    - rxm7706

