# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.5.0"

package:
  name: marp-cli
  version: ${{ version }}

source:
  url: https://github.com/marp-team/marp-cli/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 075829ab03c391460a49f2e39279b3037a6300fb6484a2c79d63879704105eff

build:
  number: 1  # bumped from 0: this build sources the GitHub tag (see below) instead of the npm registry tarball -- distinct provenance under the same 4.5.0 version already uploaded to SelfExplainML as build 0
  script:
    - if: unix
      then:
        - set -ex
        - npm install --ignore-scripts
        - npm run build
        - npm pack --ignore-scripts
        - npm install --global "${SRC_DIR}/marp-team-marp-cli-${{ version }}.tgz"
        - rm -rf node_modules
        - pnpm install --ignore-scripts
        - pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
      else:
        - call npm install --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm run build
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm pack --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm install --global %SRC_DIR%/marp-team-marp-cli-${{ version }}.tgz
        - if %ERRORLEVEL% neq 0 exit 1
        - rd /s /q node_modules
        - call pnpm install --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
        - if %ERRORLEVEL% neq 0 exit 1

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - marp --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A CLI interface for Marp and Marpit based converters
  description: |
    **A CLI interface, for [Marp](https://github.com/marp-team/marp)** (using [@marp-team/marp-core](https://github.com/marp-team/marp-core)) and any slide deck converter based on [Marpit](https://marpit.marp.app/) framework.
  homepage: https://github.com/marp-team/marp-cli
  repository: https://github.com/marp-team/marp-cli

extra:
  recipe-maintainers:
    - kklein
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: marp-cli
