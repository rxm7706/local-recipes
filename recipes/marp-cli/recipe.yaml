# CFE comments
# Header:
#   conda-forge's marp-cli-feedstock tops out at 4.2.3 (nodejs 22/24 builds
#   only); this repo bumped its own `nodejs` floor to allow the 26.x LTS
#   line, which the feedstock has no build for yet. Built locally at the
#   latest upstream (4.5.0) and published to the SelfExplainML channel as a
#   stop-gap until the feedstock's autotick bot catches up. Not submitted
#   upstream -- this is a routine version-catch-up, not a new package.
# source:
#   The npm-published tarball ships a pre-built `lib/` (rollup bundle); the
#   GitHub tag ships only raw `src/` TypeScript. Switched to the GitHub tag
#   per explicit request -- added `npm install` (full deps, incl.
#   devDependencies) + `npm run build` (== `npm run clean && rollup -c`)
#   before `npm pack`, so `lib/` exists when packing. Deliberately skipped
#   `npm run types` (declaration output under `types/src/`, listed in
#   package.json's `files` but not needed by the CLI binary itself, which
#   only requires `lib/{prepare,patch,marp-cli}.js`) -- simplicity: no
#   consumer of this recipe imports marp-cli as a TS library. `--ignore-
#   scripts` on the first `npm install` skips the `prepare` hook (which
#   would otherwise run patch-package against a jsdom dev-only patch used
#   for jest tests we never run) -- irrelevant to producing `lib/`.
# build:
#   node_modules is wiped between the npm-based build and the pnpm-based
#   license-enumeration install (mixing npm's and pnpm's node_modules
#   layouts in one directory is asking for trouble); pnpm-licenses then
#   reports off a clean pnpm-installed tree, matching the npm-registry-
#   sourced version of this recipe's original pattern.
####
