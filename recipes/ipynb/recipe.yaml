# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: ipynb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipynb/ipynb-${{ version }}.tar.gz
  sha256: 8d834c777ca3885289938728cc382f081c86a58e92961e86f0aba60c96938ce5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ipynb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/yuvipanda/ipynb
  license: MIT
  license_file: LICENSE
  summary: Package / Module importer for importing code from Jupyter Notebook files (.ipynb)
  description: |
    Package / Module importer for importing code from Jupyter Notebook files (.ipynb)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ipynb
  cfe-upstream-registry: pypi
  cfe-upstream-name: ipynb
  cfe-purls:
    - pkg:conda/ipynb@${{ version }}?channel=conda-forge
    - pkg:pypi/ipynb@${{ version }}
  cfe-upstream-repo: http://github.com/yuvipanda/ipynb
  cfe-upstream-homepage: http://github.com/yuvipanda/ipynb
  cfe-import-names: [ipynb]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
