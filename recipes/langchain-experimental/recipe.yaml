# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: langchain-experimental
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-experimental/langchain_experimental-${{ version }}.tar.gz
  sha256: 1130fa7ecad5959e687295b2f7850ae3e5d8eeee6796bf9e99910806475d8acc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - langchain-core <2.0.0,>=1.4.0
    - langchain-community <1.0.0,>=0.4.2

tests:
  - python:
      imports:
        - langchain_experimental
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-experimental/
  license: MIT
  license_file: LICENSE
  summary: Building applications with LLMs through composability
  description: |
    Building applications with LLMs through composability
  repository: https://github.com/langchain-ai/langchain-experimental/tree/main/libs/experimental

extra:
  recipe-maintainers:
    - raybellwaves
    - jan-janssen

#### CFE metadata AND comments
