    - pkg:pypi/pyignite@${{ version }}
  cfe-upstream-repo: https://github.com/apache/ignite-python-thin-client
  cfe-upstream-homepage: https://github.com/apache/ignite-python-thin-client
  cfe-import-names: [pyignite]
  cfe-source-kind: pypi-sdist
