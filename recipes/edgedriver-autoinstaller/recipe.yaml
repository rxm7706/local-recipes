# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: edgedriver-autoinstaller
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/edgedriver-autoinstaller/edgedriver-autoinstaller-${{ version }}.tar.gz
  sha256: 38c396c6eb43bc95023f02ecd76cc928cba2a318a083e946bfc2cbd2b46fa930

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - edgedriver_autoinstaller
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fc-dev/python-edgedriver-autoinstaller
  license: MIT
  license_file: LICENSE
  summary: Automatically install edgedriver that supports the currently installed version of edge.
  description: |
    Automatically install edgedriver that supports the currently installed version of edge.

extra:
  recipe-maintainers:
    - rxm7706

