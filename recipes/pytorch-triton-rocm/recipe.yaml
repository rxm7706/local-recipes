# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: pytorch-triton-rocm
  version: ${{ version }}

source:
  url: https://github.com/openai/triton/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4338ca0e80a059aec2671f02bfc9320119b051f378449cf5f56a1273597a3d99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
    - wheel
    - cmake >=3.18
  run:
    - python >=${{ python_min }}
    - cmake
    - filelock
    - pytorch
    - lit-nlp

tests:
  - python:
      imports:
        - python.triton
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openai/triton/
  license: MIT
  license_file: LICENSE
  summary: A language and compiler for custom Deep Learning operations
  description: |
    A language and compiler for custom Deep Learning operations

extra:
  recipe-maintainers:
    - rxm7706

