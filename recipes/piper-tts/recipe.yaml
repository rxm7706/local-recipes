# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: piper-tts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/piper-tts/piper_tts-${{ version }}.tar.gz
  sha256: 9d097cc1aa96817c840c0a9d33644ade65e99f9b88d695546cfdf23d0b6b7b8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - scikit-build
    - setuptools
    - wheel
    - cmake
    - ninja
  run:
    - python >=${{ python_min }}
    - onnxruntime <2,>=1
    - pathvalidate <4,>=3

tests:
  - python:
      imports:
        - piper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/OHF-voice/piper1-gpl
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Fast and local neural text-to-speech engine
  description: |
    Fast and local neural text-to-speech engine

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
