# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: jupyterlab-notifications
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-notifications/jupyterlab_notifications-${{ version }}.tar.gz
  sha256: f161c7b2f7e93cd2a438feb66c06577b7b1b15ad7b16438a68e01b402c787f09

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_notifications
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwakaba2/jupyterlab-notifications
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyterlab extension to show notebook cell completion browser notifications
  description: |
    Jupyterlab extension to show notebook cell completion browser notifications
  repository: https://github.com/mwakaba2/jupyterlab-notifications.git

extra:
  recipe-maintainers:
    - mwakaba2
    - m-rossi

