# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.8"

package:
  name: pystache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystache/pystache-${{ version }}.tar.gz
  sha256: 3707518e6a4d26dd189b07c10c669b1fc17df72684617c327bd3550e7075c72c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.6

tests:
  - python:
      imports:
        - pystache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PennyDreadfulMTG/pystache
  license: MIT
  license_file: LICENSE
  summary: Mustache for Python
  description: |
    Mustache for Python
  repository: https://github.com/PennyDreadfulMTG/pystache.git
  documentation: http://mustache.github.io/

extra:
  recipe-maintainers:
    - xylar
    - kwilcox
    - jan-janssen

#### CFE metadata AND comments
