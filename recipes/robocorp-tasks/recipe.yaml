# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robocorp-tasks
  version: "4.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robocorp_tasks-${{ version }}.tar.gz
  sha256: fb254020133c89b4a5015ad0f4a13dfceeb6f68eb2459d5291fe8ce975307c94

build:
  number: 0
  noarch: python
  script:
    - if: win
      then: echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md
    - if: unix
      then: cp -R ${{ RECIPE_DIR }}/README.md ${{ SRC_DIR }}/README.md
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - robocorp-log <4,>=2.4
    - psutil >=5.0,<8.0
    - docstring_parser_fork <0.0.6,>=0.0.5
    - packaging <25.0,>=24.0

tests:
  - python:
      imports:
        - robocorp.tasks
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The automation framework for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/robocorp/robo/

extra:
  recipe-maintainers:
    - rxm7706
    - zaigner
