# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.5"

package:
  name: libaec
  version: ${{ version }}

source:
  url: https://gitlab.dkrz.de/k202009/libaec/-/archive/v${{ version }}/libaec-v${{ version }}.tar.gz
  sha256: 2e2a9a276783b8d7014cdb9127ffdb63e4c35dcd7b866d3383efda297f8cc040

build:
  number: 0

requirements:
  build:
    - cmake
    - if: not win
      then: make
    - if: win
      then: ninja
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  run_exports:
    - ${{ pin_subpackage('libaec') }}

tests:
  - script:
      - if: not win
        then: test -f ${PREFIX}/lib/libaec${SHLIB_EXT}
      - if: not win
        then: test -f ${PREFIX}/lib/libsz${SHLIB_EXT}
      - if: win
        then: if not exist %LIBRARY_LIB%\\aec.lib exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\\aec.dll exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\\szip.lib exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\\szip.dll exit 1
      - if: win
        then: if not exist %LIBRARY_INC%\\libaec.h exit 1

about:
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Adaptive Entropy Coding library
  description: |
    Libaec provides fast lossless compression of 1 up to 32 bit wide signed or unsigned integers (samples).
    The library achieves best results for low entropy data as often encountered in space imaging instrument
    data or numerical model output from weather or climate simulations. While floating point representations
    are not directly supported, they can also be efficiently coded by grouping exponents and mantissa.
    Libaec implements Golomb-Rice coding as defined in the Space Data System Standard documents 121.0-B-2
    and 120.0-G-2.
  homepage: https://gitlab.dkrz.de/k202009/libaec
  repository: https://gitlab.dkrz.de/k202009/libaec

extra:
  recipe-maintainers:
    - kmuehlbauer
    - hmaarrfk
