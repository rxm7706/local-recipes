# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gensim
  version: "4.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/piskvorky/gensim/archive/${{ version }}.tar.gz
  sha256: 0c1c8984f18512aba04332b45dc58698ac277dfa1d314a190a3f07edc48c31ac

build:
  number: 4
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - if: build_platform != target_platform
      then: cython >=3.1.3
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - cython >=3.1.3
    - pip
    - numpy
    - setuptools
    - wheel
    - wheelhouse_uploader
  run:
    - python
    - numpy >=1.21.0
    - scipy >=1.7.0
    - six >=1.5.0
    - smart_open >=1.8.1

tests:
  - python:
      imports:
        - gensim
        - gensim.corpora
        - gensim.models
        - gensim.parsing
        - gensim.scripts
        - gensim.similarities
        - gensim.test
        - gensim.topic_coherence
      pip_check: true

about:
  license: LGPL-2.1-only
  license_file: COPYING
  summary: Topic Modelling for Humans
  description: |
    Gensim is a Python library for topic modelling, document indexing
    and similarity retrieval with large corpora.
    Target audience is the natural language processing (NLP)
    and information retrieval (IR) community.
  homepage: http://github.com/RaRe-Technologies/gensim
  repository: https://github.com/RaRe-Technologies/gensim
  documentation: http://radimrehurek.com/gensim/

extra:
  recipe-maintainers:
    - souravsingh
    - mpenkov
    - HeavyTony2
