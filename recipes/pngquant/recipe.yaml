    - pkg:cargo/pngquant@${{ version }}
  cfe-upstream-repo: https://github.com/kornelski/pngquant
  cfe-upstream-homepage: https://pngquant.org/
  cfe-import-names: []
  cfe-source-kind: crates-io
  cfe-noarch: compiled
  cfe-pip-check: "false:not-a-python-package"
