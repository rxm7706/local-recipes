#    # ocrmypdf to be linux-64-only in this repo's pixi.toml.
#    #
#    # Upstream moved to Rust at 3.0.0, so the Windows skip is no longer
#    # inherent: a Rust CLI builds on win-64 like any other. This recipe adopts
#    # the canonical conda-forge Rust CLI pattern and drops the win skip.
#    #
#    # SCOPE LIMIT: only linux-64 can be verified on this host. osx-arm64 and
#    # win-64 cannot be cross-built from Linux (SKILL.md G82), so shipping them
#    # needs either a build on those machines or a conda-forge feedstock PR --
#    # the latter is out of scope while the operator has asked for local-only,
#    # no PRs. Until one of those happens, the ocrmypdf target-gate in pixi.toml
#    # stays.
# build:
#    # The deployed cf v0 recipe is missing stdlib('c') (STD-001) -- included
#    # here. pkg-config is required: libpng-sys / lcms2-sys locate their C
#    # libraries through it.
# about:
#    # License file is COPYRIGHT (not LICENSE); GPL-3.0-or-later, unchanged
#    # from the 2.x line.
#
# 2026-08-30: feedstock PR (conda-forge/pngquant-feedstock#16) added win_64 +
# osx_arm64 (build_platform: osx_64: osx_arm64, per SKILL.md Shape 2). osx_64
# CI failed: cross-compiling makes libpng-sys's build.rs fall through
# libpng-config (explicitly cross-compile-unaware) and pkg-config (the Rust
# `pkg-config` crate refuses to probe under cross-compile without
# PKG_CONFIG_ALLOW_CROSS) to its vendored-C fallback, which then hits
# `vendor/pngpriv.h:527:16: fatal error: 'fp.h' file not found` (a legacy
# Mac-Classic/Carbon path absent from the conda-forge SDK). Root-caused by
# reading libpng-sys 1.1.9's build.rs directly, not guessed. Fixed with
# PKG_CONFIG_ALLOW_CROSS=1 (added above); verified locally on linux-64 only
# (no macOS host available here) -- the osx_64/osx_arm64/win_64 legs still
# need feedstock CI to confirm.
