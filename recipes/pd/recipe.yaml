# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: pd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pd/pd-${{ version }}.tar.gz
  sha256: 46f21dd5854ee7eb4397daa43191662f787ccf4cfe78e2472564bf9ce7e7614b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MoserMichael/visual-python-strace
  license: BSD-3-Clause
  license_file: LICENSE
  summary: more detailed python backtraces (similar to backtrace module)
  description: |
    more detailed python backtraces (similar to backtrace module)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pd
  cfe-upstream-registry: pypi
  cfe-upstream-name: pd
