# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1783086339"

package:
  name: results
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/results/results-${{ version }}.tar.gz
  sha256: 562de632f1107febe02f05a2d992a4141b6a363df1a1bd1679dcd16e205d04a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - psycopg
    - click
    - pglast

tests:
  - python:
      imports:
        - results
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/results/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

