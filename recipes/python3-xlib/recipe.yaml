# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15"

package:
  name: python3-xlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-xlib/python3-xlib-${{ version }}.tar.gz
  sha256: dc4245f3ae4aa5949c1d112ee4723901ade37a96721ba9645f2bfa56e5b383f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - Xlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LiuLang/python3-xlib
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python3 X Library
  description: |
    Python3 X Library

extra:
  recipe-maintainers:
    - rxm7706

