# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: llama-index-retrievers-bm25
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-retrievers-bm25/llama_index_retrievers_bm25-${{ version }}.tar.gz
  sha256: 65bff95c5c1354854394209406d2d342ff5e62983ff2818fd2b85d5bed70bed0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bm25s >=0.2.7.post1
    - llama-index-core <0.15,>=0.13.1
    - pystemmer <3,>=2.2.0.1

tests:
  - python:
      imports:
        - llama_index.retrievers.bm25
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-retrievers-bm25/
  license: MIT
  license_file: LICENSE
  summary: llama-index retrievers bm25 integration
  description: |
    llama-index retrievers bm25 integration

extra:
  recipe-maintainers:
    - moritzwilksch

