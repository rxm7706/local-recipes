# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: google-oauth2-tool
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-oauth2-tool/google-oauth2-tool-${{ version }}.tar.gz
  sha256: b20cb27825f569a0f6bf267cbd3cd7e5224640003fd0c3d4aa0a7d48bfcbe791

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cachetools
    - google-api-python-client
    - google-auth
    - google-auth-httplib2
    - httplib2
    - oauth2client
    - pyasn1
    - pyasn1-modules
    - rsa
    - six
    - uritemplate

tests:
  - python:
      imports:
        - google_oauth2_tool
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dlancer/google-oauth2-tool
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Create OAuth2 key file from OAuth2 client id file
  description: |
    Create OAuth2 key file from OAuth2 client id file

extra:
  recipe-maintainers:
    - rxm7706

