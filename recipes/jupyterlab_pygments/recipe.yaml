# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyterlab_pygments
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 721aca4d9029252b11cfa9d185e5b5af4d54772bb8072f9b7036f4170054d35d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
    - hatch-jupyter-builder
    - hatch-nodejs-version
  run:
    - python >=${{ python_min }}
    - pygments >=2.4.1,<3
  run_constraints:
    - jupyterlab >=4.0.8,<5.0.0

tests:
  - python:
      imports:
        - jupyterlab_pygments
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - if: unix
        then: test -f ${PREFIX}/share/jupyter/labextensions/jupyterlab_pygments/package.json
      - if: win
        then: if not exist %PREFIX%\\share\\jupyter\\labextensions\\jupyterlab_pygments\\package.json (exit 1)

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pygments syntax coloring scheme making use of the JupyterLab CSS variables
  description: |
    The goal is to enable the use of JupyterLab's themes with pygments-generated HTML.
  homepage: http://github.com/JupyterLab/jupyterlab_pygments
  repository: https://github.com/JupyterLab/jupyterlab_pygments

extra:
  recipe-maintainers:
    - SylvainCorlay
    - maartenbreddels
    - martinRenou
