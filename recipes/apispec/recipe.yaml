# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.10.0"

package:
  name: apispec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apispec/apispec-${{ version }}.tar.gz
  sha256: 0a888555cd4aa5fb7176041be15684154fd8961055e1672e703abf737e8761bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - packaging >=21.3

tests:
  - python:
      imports:
        - apispec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apispec/
  license: MIT
  license_file: LICENSE
  summary: A pluggable API specification generator. Currently supports the OpenAPI Specification (f.k.a. the Swagger specification).
  description: |
    A pluggable API specification generator. Currently supports the OpenAPI Specification (f.k.a. the Swagger specification).
  repository: https://github.com/marshmallow-code/apispec

extra:
  recipe-maintainers:
    - xylar
    - rth
    - carlodri

#### CFE metadata AND comments
