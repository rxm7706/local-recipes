# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: pplotly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PPlotly/pplotly-${{ version }}.tar.gz
  sha256: 6c0018b9ad002519c0abe4fe31d05ed333b166f73d25786bba5790ddfadc27d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - plotly >=5.0.0

tests:
  - python:
      imports:
        - pplotly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pkalbhor/pplotly
  license: MIT
  license_file: LICENSE
  summary: Wrapper project of plotly.py, extra functionalities for scientific plots
  description: |
    Wrapper project of plotly.py, extra functionalities for scientific plots

extra:
  recipe-maintainers:
    - rxm7706

