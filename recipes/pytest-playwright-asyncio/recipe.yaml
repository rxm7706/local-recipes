# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: pytest-playwright-asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-playwright-asyncio/pytest_playwright_asyncio-${{ version }}.tar.gz
  sha256: d1a314387b29a50c18ffb427edf31a9d0b95a875969dcb244b3cc605e736fb0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm ==8.1.0
  run:
    - python >=${{ python_min }}
    - pytest <10.0.0,>=6.2.4
    - playwright-python >=1.18
    - pytest-base-url <3.0.0,>=1.0.0
    - python-slugify <9.0.0,>=6.0.0
    - pytest-asyncio >=0.24.0

tests:
  - python:
      imports:
        - pytest_playwright_asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/playwright-pytest
  license: Apache-2.0
  license_file: LICENSE
  summary: A pytest wrapper with async fixtures for Playwright to automate web browsers
  description: |
    A pytest wrapper with async fixtures for Playwright to automate web browsers

extra:
  recipe-maintainers:
    - rxm7706

