# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.23.0"

package:
  name: cyclopts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cyclopts/cyclopts-${{ version }}.tar.gz
  sha256: 2f764bbd90f1888073971c09576f90e594f80353588e10aa615b7d59bc009821

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - attrs >=23.1.0
    - docstring_parser <4.0,>=0.15
    - rich-rst <3.0.0,>=1.3.1
    - rich >=13.6.0
    - tomli >=2.0.0
    - typing_extensions >=4.8.0

tests:
  - python:
      imports:
        - cyclopts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/BrianPugh/cyclopts
  license: Apache-2.0
  license_file: LICENSE
  summary: Intuitive, easy CLIs based on type hints.
  description: |
    Intuitive, easy CLIs based on type hints.
  repository: https://github.com/BrianPugh/cyclopts

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
