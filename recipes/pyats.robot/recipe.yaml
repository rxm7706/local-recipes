# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.robot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pyats.robot/pyats_robot-26.7-py3-none-any.whl
  sha256: 0bd7613bfc0f8f872e3d5a380254fe4b15814cf106e75751dc39c8faef17ffbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - robotframework
    - pyats.aetest <26.8.0,>=26.7.0
    - pyats.connections <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats.robot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS Robot: Robot Module"
  description: |
    pyATS Robot: Robot Module

extra:
  recipe-maintainers:
    - rxm7706

