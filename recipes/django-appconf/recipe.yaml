# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: django-appconf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-appconf/django_appconf-${{ version }}.tar.gz
  sha256: 15a88d60dd942d6059f467412fe4581db632ef03018a3c183fb415d6fc9e5cec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - appconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://django-appconf.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A helper class for handling configuration defaults of packaged apps gracefully.
  description: |
    A helper class for handling configuration defaults of packaged apps gracefully.
  repository: https://github.com/django-compressor/django-appconf

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706

