# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: epoch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/epoch/epoch-${{ version }}.tar.gz
  sha256: c6109e6a11d68fec9bd3107cf41cce16967800c546108c82edb97c423559d709

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - epoch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/metagriffin/epoch
  license: GPLv3+
  license_file: LICENSE
  summary: A utility library to manage and manipulate UNIX epoch timestamps.
  description: |
    A utility library to manage and manipulate UNIX epoch timestamps.

extra:
  recipe-maintainers:
    - rxm7706

