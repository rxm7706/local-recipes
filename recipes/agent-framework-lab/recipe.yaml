# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0b260709"

package:
  name: agent-framework-lab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-lab/agent_framework_lab-${{ version }}.tar.gz
  sha256: 8b7a231e036033bec69fe7fd0ad61f639d1029bfb9e0e9188cbd2854c0533ce7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - agent-framework-core <2,>=1.11.0

tests:
  - python:
      imports:
        - gaia.agent_framework_lab_gaia
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://aka.ms/agent-framework
  license: MIT
  license_file: LICENSE
  summary: Experimental modules for Microsoft Agent Framework
  description: |
    Experimental modules for Microsoft Agent Framework
  repository: https://github.com/microsoft/agent-framework/tree/main/python

extra:
  recipe-maintainers:
    - rxm7706

