# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-configurations
  version: "2.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-configurations-${{ version }}.tar.gz
  sha256: 6e5083757e2bbdf9bb7850567536b96a93515f6b17503d74928ff628db2e0e94

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - django-cadmin = configurations.management:execute_from_command_line

requirements:
  host:
    - python ${{ python_min }}
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - django >=3.2

tests:
  - python:
      imports:
        - configurations
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - DJANGO_CONFIGURATION=core.settings DJANGO_SETTINGS_MODULE=django django-cadmin --help

about:
  summary: A helper for organizing Django settings.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://django-configurations.readthedocs.io/
  repository: https://github.com/jazzband/django-configurations

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - millsks
    - rxm7706
