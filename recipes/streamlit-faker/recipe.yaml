# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: streamlit-faker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-faker/streamlit_faker-${{ version }}.tar.gz
  sha256: dc94cbfafcf035b171cb989531a1f19f4241e5b3c2e61311ed91a02ed188fed0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - streamlit
    - altex >=0.2.0
    - faker
    - matplotlib-base

tests:
  - python:
      imports:
        - streamlit_faker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arnaudmiribel/streamlit-faker
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: streamlit-faker is a library to very easily fake Streamlit commands
  description: |
    streamlit-faker is a library to very easily fake Streamlit commands

extra:
  recipe-maintainers:
    - rxm7706

