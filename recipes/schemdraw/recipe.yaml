# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23"

package:
  name: schemdraw
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/schemdraw/schemdraw-${{ version }}.tar.gz
  sha256: e71afd5ec84edfd9b707331c5bcb49ed7133af85bd17dae461de3fc260b0132f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - schemdraw
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://schemdraw.readthedocs.io
  license: MIT
  license_file: LICENSE.txt
  summary: Electrical circuit schematic drawing
  description: |
    Electrical circuit schematic drawing
  repository: https://github.com/cdelker/schemdraw
  documentation: https://schemdraw.readthedocs.io

extra:
  recipe-maintainers:
    - dkozel

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: schemdraw
