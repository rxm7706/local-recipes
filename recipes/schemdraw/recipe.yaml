# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: schemdraw
  version: "0.19"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/schemdraw-${{ version }}.tar.gz
  sha256: f39183f3090e607c7dbc41ebd3dddf2ae0ef1c81dcbab6c6e2429599559bd7e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - python >=3.7
    - typing-extensions

tests:
  - python:
      imports:
        - schemdraw
      pip_check: true

about:
  summary: Electrical circuit schematic drawing
  license: MIT
  license_file: LICENSE.txt
  homepage: https://schemdraw.readthedocs.io/
  repository: https://bitbucket.org/cdelker/schemdraw

extra:
  recipe-maintainers:
    - dkozel
