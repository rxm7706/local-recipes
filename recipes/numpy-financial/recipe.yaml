# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: numpy-financial
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numpy-financial/numpy-financial-${{ version }}.tar.gz
  sha256: f84341bc62b2485d5604a73d5fac7e91975b4b9cd5f4a5a9cf608902ea00cb40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - numpy_financial
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://numpy.org/numpy-financial/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple financial functions
  description: |
    Simple financial functions
  repository: https://github.com/numpy/numpy-financial
  documentation: https://numpy.org/numpy-financial/

extra:
  recipe-maintainers:
    - BastianZim

#### CFE metadata AND comments
