# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: torch-stoi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-stoi/torch_stoi-${{ version }}.tar.gz
  sha256: 228207b8d63548336c5520b156f1e6b30d3ae3db1fb3c41999f01aee087c5f85

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch
    - pystoi
    - torchaudio

tests:
  - python:
      imports:
        - torch_stoi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mpariente/pytorch_stoi
  license: MIT
  license_file: LICENSE
  summary: Computes Short Term Objective Intelligibility in PyTorch
  description: |
    Computes Short Term Objective Intelligibility in PyTorch

extra:
  recipe-maintainers:
    - rxm7706

