# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: prompt-optimizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prompt-optimizer/prompt_optimizer-${{ version }}.tar.gz
  sha256: 26a86a9ba90420dc4d404495722de0ce49a9b59c13925aaaa934041b459426c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - transformers
    - pytorch
    - pulp
    - nltk
    - tiktoken
    - autocorrect
    - black
    - isort

tests:
  - python:
      imports:
        - prompt_optimizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/prompt-optimizer/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

