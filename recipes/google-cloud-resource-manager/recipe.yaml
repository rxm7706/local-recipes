# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18.0"

package:
  name: google-cloud-resource-manager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-resource-manager/google_cloud_resource_manager-${{ version }}.tar.gz
  sha256: db689f800a14c66d041196a7fbb8bb8aae8dc87f28c2929e101a5ec766b15512

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8
    - grpc-google-iam-v1 <1.0.0,>=0.14.0

tests:
  - python:
      imports:
        - google.cloud.resourcemanager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-resource-manager
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Resource Manager API client library
  description: |
    Google Cloud Resource Manager API client library

extra:
  recipe-maintainers:
    - xylar
    - parthea

