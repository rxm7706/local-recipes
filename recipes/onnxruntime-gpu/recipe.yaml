# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.28.0"

package:
  name: onnxruntime-gpu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/o/onnxruntime-gpu/onnxruntime_gpu-1.28.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
  sha256: 774d4c307317f7a0fefc33930820b7ac2a62be2c595e6a1e63e318555f7176b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flatbuffers
    - numpy >=1.21.6
    - packaging
    - protobuf >=4.25.8

tests:
  - python:
      imports:
        - onnxruntime_gpu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://onnxruntime.ai
  license: MIT
  license_file: LICENSE
  summary: ONNX Runtime is a runtime accelerator for Machine Learning models
  description: |
    ONNX Runtime is a runtime accelerator for Machine Learning models

extra:
  recipe-maintainers:
    - rxm7706

