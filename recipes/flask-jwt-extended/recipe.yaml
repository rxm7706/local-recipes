# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 4.7.4

package:
  name: flask-jwt-extended
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-jwt-extended/flask_jwt_extended-${{ version }}.tar.gz
  sha256: 78fd0f460317facf3a0084a6457ffaf2f1dda9eefbd576f94cea35b0eadd5531

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - flask >=2.0,<4.0
    - pyjwt >=2.11.0,<3.0
    - python >=${{ python_min }}
    - werkzeug >=0.14
tests:
  - python:
      imports:
        - flask_jwt_extended
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE
  summary: A Flask JWT extension
  description: |
    A Flask JWT extension that supports refresh tokens, blacklisting/revoking tokens,
    and token freshness (for accessing critical views)
  homepage: https://github.com/vimalloc/flask-jwt-extended

extra:
  recipe-maintainers:
    - lvoliveira
    - nicoddemus
    - synapticarbors
