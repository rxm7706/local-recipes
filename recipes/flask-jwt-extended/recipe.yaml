# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.7.4"

package:
  name: flask-jwt-extended
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-JWT-Extended/flask_jwt_extended-${{ version }}.tar.gz
  sha256: 78fd0f460317facf3a0084a6457ffaf2f1dda9eefbd576f94cea35b0eadd5531

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - werkzeug >=0.14
    - flask <4.0,>=2.0
    - pyjwt <3.0,>=2.11.0

tests:
  - python:
      imports:
        - flask_jwt_extended
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vimalloc/flask-jwt-extended
  license: MIT
  license_file: LICENSE
  summary: Extended JWT integration with Flask
  description: |
    Extended JWT integration with Flask

extra:
  recipe-maintainers:
    - lvoliveira
    - nicoddemus
    - synapticarbors

