# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: phasma
  version: ${{ version }}

source:
  url: https://github.com/mohammadraziei/phasma/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9f8c66589ed4c8f6b1a61f2766131840d1212bd234167fc6ad0be15ea006797a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - phasma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/phasma/
  license: MIT
  license_file: LICENSE
  summary: Playwright-like async API for PhantomJS — pip install only, no apt, no npm, no Chrome.
  description: |
    Playwright-like async API for PhantomJS — pip install only, no apt, no npm, no Chrome.
  repository: https://github.com/mohammadraziei/phasma
  documentation: https://mohammadraziei.github.io/phasma

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
