# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: qstylizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qstylizer/qstylizer-${{ version }}.tar.gz
  sha256: 4880991d912c9837454832e8e2b58d60b66848d8c4a7cf57ed544fd68b91a23a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tinycss2 <2,>=0.5
    - inflection <1,>0.3.0

tests:
  - python:
      imports:
        - qstylizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/blambright/qstylizer
  license: MIT
  license_file: LICENSE.txt
  summary: Stylesheet Generator for PyQt{4-5}/PySide{1-2}
  description: |
    Stylesheet Generator for PyQt{4-5}/PySide{1-2}

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - steff456

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: qstylizer
