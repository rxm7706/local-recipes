# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: mkdocs-minify-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mkdocs-minify-plugin/mkdocs-minify-plugin-${{ version }}.tar.gz
  sha256: bc11b78b8120d79e817308e2b11539d790d21445eb63df831e393f76e52e753d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mkdocs
    - htmlmin2
    - jsmin
    - csscompressor

tests:
  - python:
      imports:
        - mkdocs_minify_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/byrnereese/mkdocs-minify-plugin
  license: MIT
  license_file: LICENSE
  summary: An MkDocs plugin to minify HTML, JS or CSS files prior to being written to disk
  description: |
    An MkDocs plugin to minify HTML, JS or CSS files prior to being written to disk

extra:
  recipe-maintainers:
    - rxm7706

