# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.3"

package:
  name: invoke
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/invoke/invoke-${{ version }}.tar.gz
  sha256: 437b6a622223824380bfb4e64f612711a6b648c795f565efc8625af66fb57f0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - invoke
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/invoke/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Pythonic task execution
  description: |
    Pythonic task execution
  repository: https://github.com/pyinvoke/invoke
  documentation: https://docs.pyinvoke.org

extra:
  recipe-maintainers:
    - nicoddemus
    - setu4993

#### CFE metadata AND comments
