# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.3"

package:
  name: invoke
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/invoke/invoke-${{ version }}.tar.gz
  sha256: 437b6a622223824380bfb4e64f612711a6b648c795f565efc8625af66fb57f0c
  file_name: invoke-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - invoke = invoke.main:program.run
      - inv = invoke.main:program.run

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - invoke
        - invoke.parser
        - invoke.vendor
        - invoke.vendor.fluidity
        - invoke.vendor.lexicon
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - invoke --help
      - inv --help

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Pythonic task execution
  homepage: http://docs.pyinvoke.org
  repository: https://github.com/pyinvoke/invoke

extra:
  recipe-maintainers:
    - nicoddemus
    - setu4993
