# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: keras-mri
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keras-mri/keras-mri-${{ version }}.tar.gz
  sha256: 33c89c7ea3b627bd12453d2e1e7298cad9e26c10655326b116740bcd19e6fe12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - keras
    - flask

tests:
  - python:
      imports:
        - kmri
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/robianmcd/keras-mri
  license: MIT
  license_file: LICENSE
  summary: Neural network visualization tool for Keras
  description: |
    Neural network visualization tool for Keras

extra:
  recipe-maintainers:
    - rxm7706

