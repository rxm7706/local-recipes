{% set name = "opentelemetry-instrumentation-mcp" %}
{% set version = "0.62.3" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_mcp-{{ version }}.tar.gz
  sha256: 992505869eb14db6472f3750f1be22aa1df76296df9f77092b82a88455e7fd2e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - opentelemetry-exporter-otlp >=1.34.1,<2
    - mcp >=1.26.0,<2

test:
  imports:
    - opentelemetry.instrumentation.mcp
  commands:
    - pip check
  requires:
    - mcp >=1.6.0
    - pip
    - python {{ python_min }}

about:
  home: https://www.traceloop.com/openllmetry
  summary: OpenTelemetry mcp instrumentation
  dev_url: https://github.com/traceloop/openllmetry
  doc_url: https://www.traceloop.com/docs/openllmetry/introduction
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dillonroach
    - timkpaine
