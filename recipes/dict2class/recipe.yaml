package:
  name: dict2class
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dict2class/dict2class-${{ version }}.tar.gz
  sha256: 527a2164638d1bc151d8d2ecb0bcf362a245d266397d88bb9ee053b2c71742c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

