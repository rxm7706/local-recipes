# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.0.0.65"

package:
  name: teradatasql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/teradatasql/teradatasql-20.0.0.65-py3-none-any.whl
  sha256: 8bf6b7eeb9623cb1388d42c8d991add92aa763e687d955c3eae7e8e7b944e7e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pycryptodome

tests:
  - python:
      imports:
        - teradatasql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.teradata.com/
  license: MIT
  license_file: LICENSE
  summary: Teradata SQL Driver for Python
  description: |
    Teradata SQL Driver for Python

extra:
  recipe-maintainers:
    - rxm7706

