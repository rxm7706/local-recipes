# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: git-pkgs
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/git-pkgs/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d48505757969fb808e21de80f3dc8d8247e3cfd3f8f89c30bf43fe7a91d5f598

build:
  number: 0
  script:
    - if: win
      then: call "%RECIPE_DIR%/build.bat"
      else: bash "${RECIPE_DIR}/build.sh"

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - git-pkgs --version
      - git-pkgs --help
  - package_contents:
      bin:
        - if: unix
          then: git-pkgs
        - if: win
          then: git-pkgs.exe

about:
  homepage: https://github.com/git-pkgs/git-pkgs
  repository: https://github.com/git-pkgs/git-pkgs
  documentation: https://github.com/git-pkgs/git-pkgs
  summary: Git subcommand that analyses package and dependency use across repository history
  description: |
    git-pkgs is a Go CLI distributed as a git subcommand. It scans a
    repository's git history to surface how packages and dependencies were used
    over time, backed by pure-Go SQLite (modernc.org/sqlite) and go-git — no
    CGO. Packaged here for local PyForge consumption (Atlas/Warden intake
    tooling); not yet on conda-forge.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
