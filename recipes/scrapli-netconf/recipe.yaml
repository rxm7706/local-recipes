# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.1.12"

package:
  name: scrapli-netconf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scrapli-netconf/scrapli_netconf-${{ version }}.tar.gz
  sha256: 6e497d52c986ed8d05504767d84e56487f5887271f1ab59b569fb30e879f8f9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - lxml >=4.5.1
    - scrapli >=2022.07.30

tests:
  - python:
      imports:
        - scrapli_netconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapli/scrapli_netconf
  license: MIT
  license_file: LICENSE
  summary: Fast, flexible, sync/async, Python 3.7+ NETCONF client built on scrapli
  description: |
    Fast, flexible, sync/async, Python 3.7+ NETCONF client built on scrapli
  documentation: https://scrapli.github.io/scrapli_netconf/

extra:
  recipe-maintainers:
    - rxm7706

