# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-monitor-opentelemetry-exporter
  version: 1.0.0b58

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-monitor-opentelemetry-exporter/azure_monitor_opentelemetry_exporter-${{ version }}.tar.gz
  sha256: 5152d75bd9780fef02fcc9550e0323ba3f661a8fcba017ea04b027151ae0932e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - typing_extensions
    - azure-storage-blob
    - django
    - fastapi
    - flask
    - isodate
    - psycopg2
    - requests
    - uvicorn
    - python >=${{ python_min }}
    - azure-core <2.0.0,>=1.38.0
    - azure-identity >=1.17,<2.dev0
    - fixedint ==0.1.6
    - msrest >=0.6.10
    - opentelemetry-api >=1.45.0,<1.46.dev0
    - opentelemetry-sdk >=1.45.0,<1.46.dev0
    - psutil <8,>=5.9

tests:
  - python:
      imports:
        - azure.monitor.opentelemetry.exporter
        - azure.monitor.opentelemetry.exporter._generated
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Azure Monitor Opentelemetry Exporter Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/monitor/azure-monitor-opentelemetry-exporter

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-api

