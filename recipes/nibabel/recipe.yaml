# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.4.2"

package:
  name: nibabel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nibabel/nibabel-${{ version }}.tar.gz
  sha256: d5f4b9076a13178ae7f7acf18c8dbd503ee1c4d5c0c23b85df7be87efcbb49da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - importlib_resources >=5.12
    - numpy >=1.25
    - packaging >=20
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - nibabel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://nipy.org/nibabel
  license: MIT
  license_file: LICENSE
  summary: Access a multitude of neuroimaging data formats
  description: |
    Access a multitude of neuroimaging data formats

extra:
  recipe-maintainers:
    - arokem
    - grlee77
    - effigies

