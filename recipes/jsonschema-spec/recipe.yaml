# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: jsonschema-spec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema-spec/jsonschema_spec-${{ version }}.tar.gz
  sha256: 873e396ad1ba6edf9f52d6174c110d4fafb7b5f5894744246a53fe75e5251ec2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}
  run:
    - pathable >=0.4.1,<0.5.0
    - python >=${{ python_min }}
    - pyyaml >=5.1
    - referencing >=0.28.0,<0.31.0
    - requests >=2.31.0,<3.0.0

tests:
  - python:
      imports:
        - jsonschema_spec
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: JSONSchema Spec with object-oriented paths
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/p1c2u/jsonschema-spec

extra:
  recipe-maintainers:
    - bollwyvl
