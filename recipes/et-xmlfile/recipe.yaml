# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: et-xmlfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/et-xmlfile/et_xmlfile-${{ version }}.tar.gz
  sha256: dab3f4764309081ce75662649be815c4c9081e88f0837825f90fd28317d4da54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - et_xmlfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://foss.heptapod.net/openpyxl/et_xmlfile
  license: MIT
  license_file: LICENSE.txt
  summary: An implementation of lxml.xmlfile for the standard library
  description: |
    An implementation of lxml.xmlfile for the standard library
  repository: https://foss.heptapod.net/openpyxl/et_xmlfile
  documentation: https://openpyxl.pages.heptapod.net/et_xmlfile/

extra:
  recipe-maintainers:
    - npavlovikj
    - mgorny

#### CFE metadata AND comments
