# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.4.0.0"

package:
  name: pyu4v
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyu4v/pyu4v-${{ version }}.tar.gz
  sha256: d03b77e7e192995a8156360ab01f096b97eb6cda7a7820192b94a704c6f10918

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - six

tests:
  - python:
      imports:
        - PyU4V
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dell/PyU4V/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python library for use with Dell EMC's Unisphere for PowerMax REST API.
  description: |
    A Python library for use with Dell EMC's Unisphere for PowerMax REST API.

extra:
  recipe-maintainers:
    - rxm7706

