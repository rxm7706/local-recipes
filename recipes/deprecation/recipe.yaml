# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: deprecation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deprecation/deprecation-${{ version }}.tar.gz
  sha256: 72b3bde64e5d778694b0cf68178aed03d15e15477116add3fb773e581f9518ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging

tests:
  - python:
      imports:
        - deprecation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://deprecation.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: A library to handle automated deprecations
  description: |
    A library to handle automated deprecations
  repository: https://github.com/briancurtin/deprecation
  documentation: http://deprecation.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - kmuehlbauer

#### CFE metadata AND comments
