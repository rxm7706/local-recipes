# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: py-mon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-mon/py_mon-${{ version }}.tar.gz
  sha256: d76c6d0d2e05a0650afb756d4d350800726d0262e90862fe98dae65eadfe9427

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - colorama
    - watchdog

tests:
  - python:
      imports:
        - pymon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kevinjosethomas/py-mon
  license: MIT
  license_file: LICENSE
  summary: 🔁 Automatically restart application when file changes are detected; made for development
  description: |
    🔁 Automatically restart application when file changes are detected; made for development

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
