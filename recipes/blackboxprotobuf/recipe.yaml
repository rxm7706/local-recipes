# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: blackboxprotobuf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/blackboxprotobuf/blackboxprotobuf-${{ version }}.tar.gz
  sha256: 233b714e6c24ce9d1c20b871462a220af9177e4fec01c1b797ac5ab86a1e1cea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - blackboxprotobuf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ydkhatri/blackboxprotobuf
  license: MIT
  license_file: LICENSE
  summary: Library for reading protobuf buffers without .proto definitions
  description: |
    Library for reading protobuf buffers without .proto definitions

extra:
  recipe-maintainers:
    - rxm7706

