# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: tm1py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/TM1py/tm1py-${{ version }}.tar.gz
  sha256: 77acc03c179278dfbf68a2097263c38e7670029b84d8022430b665c02a942099

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - ijson
    - requests
    - pytz
    - mdxpy >=1.3.1

tests:
  - python:
      imports:
        - TM1py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cubewise-code/tm1py
  license: MIT
  license_file: LICENSE
  summary: A python module for TM1.
  description: |
    A python module for TM1.

extra:
  recipe-maintainers:
    - rxm7706

