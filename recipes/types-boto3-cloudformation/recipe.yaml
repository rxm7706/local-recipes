# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.62"

package:
  name: types-boto3-cloudformation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-boto3-cloudformation/types_boto3_cloudformation-${{ version }}.tar.gz
  sha256: 3f5770c3ac2e39636ab4ad4cb1b172a8683b649036df302bd86677c19f75aab3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    - botocore
    - typing_extensions

tests:
  - python:
      imports:
        - types_boto3_cloudformation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youtype/mypy_boto3_builder
  license: MIT
  license_file: LICENSE
  summary: Type annotations for boto3 CloudFormation 1.43.62 service generated with mypy-boto3-builder 8.12.0
  description: |
    Type annotations for boto3 CloudFormation 1.43.62 service generated with mypy-boto3-builder 8.12.0
  repository: https://github.com/youtype/mypy_boto3_builder
  documentation: https://youtype.github.io/types_boto3_docs/types_boto3_cloudformation/

extra:
  recipe-maintainers:
    - rxm7706

