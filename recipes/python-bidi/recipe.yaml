# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-bidi
  version: "0.6.11"
  sha256: 034090c597af250d699299d7e7f1e83eb016f9e47b3b707bd89ab2bdec77bce0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  skip: match(python, "<3.9") or match(python, ">3.12")
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - pybidi = bidi:main

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: maturin >=1,<2
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
  host:
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

tests:
  - python:
      imports:
        - bidi
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - pybidi --help

about:
  license: LGPL-3.0-only
  license_file: COPYING.LESSER
  summary: Pure python implementation of the BiDi layout algorithm
  description: Bi-directional (BiDi) layout implementation in pure python
  homepage: https://github.com/MeirKriheli/python-bidi
  repository: https://github.com/MeirKriheli/python-bidi
  documentation: http://python-bidi.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
    - kastman
