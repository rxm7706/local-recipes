# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: python-krb5ticket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-krb5ticket/python-krb5ticket-${{ version }}.tar.gz
  sha256: 65ca6e8b23ba70cfad2f336b5f2dbb7940ce5fe0183239d80585687b3d540663

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-gssapi
    - pandas

tests:
  - python:
      imports:
        - krb5ticket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/degagne/python-krb5ticket
  license: MIT
  license_file: LICENSE
  summary: Simple Python wrapper to create Kerberos ticket-granting tickets (TGT)
  description: |
    Simple Python wrapper to create Kerberos ticket-granting tickets (TGT)

extra:
  recipe-maintainers:
    - rxm7706

