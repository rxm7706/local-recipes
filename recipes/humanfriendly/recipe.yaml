    - pkg:conda/humanfriendly@${{ version }}?channel=conda-forge
    - pkg:pypi/humanfriendly@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://humanfriendly.readthedocs.io
  cfe-import-names: [humanfriendly]
  cfe-source-kind: pypi-sdist
