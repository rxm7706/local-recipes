# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.2.1"

package:
  name: multiprocessing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multiprocessing/multiprocessing-${{ version }}.tar.gz
  sha256: ef3b81ad85d7de252e5491b1daac028e17f9741cbe3625032e6eaa4ad4c79900

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - Lib.multiprocessing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/python-multiprocessing
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Backport of the multiprocessing package to Python 2.4 and 2.5
  description: |
    Backport of the multiprocessing package to Python 2.4 and 2.5

extra:
  recipe-maintainers:
    - rxm7706

