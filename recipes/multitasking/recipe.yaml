    - pkg:pypi/multitasking@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ranaroussi/multitasking
  cfe-import-names: [multitasking]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/multitasking-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.0.13

  cfe-forge-blocker-list:
    - missing-license-file

