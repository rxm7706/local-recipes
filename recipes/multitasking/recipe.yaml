# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.13"

package:
  name: multitasking
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multitasking/multitasking-${{ version }}.tar.gz
  sha256: d896b5df877c9ca5eeddbf0e5994124694d6cb535aba698fb23344c7025155a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - multitasking
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ranaroussi/multitasking
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Non-blocking Python methods using decorators
  description: |
    Non-blocking Python methods using decorators

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: multitasking
  cfe-upstream-registry: pypi
  cfe-upstream-name: multitasking
