# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.000"

package:
  name: font-ttf-inconsolata
  version: ${{ version|replace("-", "_") }}

source:
  url: https://github.com/googlefonts/Inconsolata/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f2d8d8ba6caa785a966ef17996822ab14ba91ec423431a29e1b6c4b14bc4cda5

build:
  number: 0
  noarch: generic

tests:
  - requirements:
      run:
        - bzip2
    script:
      - if: unix
        then: test -f ${PREFIX}/fonts/Inconsolata-Regular.ttf
      - if: unix
        then: test -f ${PREFIX}/fonts/Inconsolata-Bold.ttf

about:
  summary: Monospace font for pretty code listings
  license: OFL-1.1
  license_file: OFL.txt
  homepage: https://fonts.google.com/specimen/Inconsolata

extra:
  recipe-maintainers:
    - dbast

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: font-ttf-inconsolata
  cfe-upstream-registry: pypi
  cfe-upstream-name: font-ttf-inconsolata
  cfe-purls:
    - pkg:conda/font-ttf-inconsolata@${{ version }}?channel=conda-forge
    - pkg:pypi/font-ttf-inconsolata@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://fonts.google.com/specimen/Inconsolata
  cfe-import-names: []
  cfe-source-kind: github-tag
  cfe-noarch: generic
  cfe-pip-check: "false"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/font-ttf-inconsolata-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T08:33:26Z
