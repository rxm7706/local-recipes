# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.27.0"

package:
  name: nvidia-riva-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-riva-client/nvidia_riva_client-2.27.0-py3-none-any.whl
  sha256: a18b0fa274417455b4fe2db126a340b8e7bfd362de838e05cb64af37c23c7ef3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio <2,>=1.67.1
    - grpcio-tools <2,>=1.67.1
    - websockets <16,>=15.0.1
    - protobuf ==6.33.5

tests:
  - python:
      imports:
        - nvidia_riva_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nvidia-riva/python-clients
  license: MIT
  license_file: LICENSE
  summary: Python implementation of the Riva Client API
  description: |
    Python implementation of the Riva Client API

extra:
  recipe-maintainers:
    - rxm7706

