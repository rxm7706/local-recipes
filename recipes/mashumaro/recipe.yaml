# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.22"

package:
  name: mashumaro
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mashumaro/mashumaro-${{ version }}.tar.gz
  sha256: 64538cc365204402a060ebde683a86505b5a4344acf6870d79021e9fbfe57360

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - mashumaro
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mashumaro.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Fast and well tested serialization library
  description: |
    Fast and well tested serialization library
  repository: https://github.com/Fatal1ty/mashumaro

extra:
  recipe-maintainers:
    - thewchan
    - maresb

