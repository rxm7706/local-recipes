# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-dbapi
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_dbapi-${{ version }}.tar.gz
  sha256: da048bb683347ddad2f47344bacfe1e111bf7bfb2e5a39796b1083679ad4f0f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - wrapt <3.0.0,>=1.0.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Database API instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-dbapi

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
