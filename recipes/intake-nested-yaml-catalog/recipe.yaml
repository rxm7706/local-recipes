# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: intake-nested-yaml-catalog
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/intake-nested-yaml-catalog-${{ version }}.tar.gz
  sha256: 29eba085b7d0f8cd9a97afe46d4b6b34d51ed852855fd12ed126fb38e975edc8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - vcver
    - setuptools-parcels
    - pip
  run:
    - python >=3.8
    - vcver
    - intake
    - pandas
    - pyyaml
    - deepmerge

tests:
  - python:
      imports:
        - intake_nested_yaml_catalog
      pip_check: true

about:
  summary: Intake single YAML hierarchical catalog.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/zillow/intake-nested-yaml-catalog

extra:
  recipe-maintainers:
    - rxm7706
