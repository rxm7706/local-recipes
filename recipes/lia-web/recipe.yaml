# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: lia-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lia-web/lia_web-${{ version }}.tar.gz
  sha256: 7f551269eddd729f1437e9341ad21622a849eb0c0975d9232ccbbaadbdc74c06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cross-web >=0.3.0

tests:
  - python:
      imports:
        - lia
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/lia-web/
  license: MIT
  license_file: LICENSE
  summary: This package has been renamed to cross-web. Install cross-web instead.
  description: |
    This package has been renamed to cross-web. Install cross-web instead.

extra:
  recipe-maintainers:
    - bollwyvl

