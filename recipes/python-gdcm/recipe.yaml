# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.6"

package:
  name: python-gdcm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-gdcm/python_gdcm-${{ version }}.tar.gz
  sha256: 2f16eaea7a8c736279492f829d7f95002237a7fb2ea9c3ae85175498e1cd3dad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - wheel
    - ninja >=1.10.2.3
    - cmake >=3.22.1
    - scikit-build-core ~=0.9.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - _gdcm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tfmoraes/python-gdcm/
  license: Apache-2.0
  license_file: LICENSE
  summary: Grassroots DICOM runtime libraries
  description: |
    Grassroots DICOM runtime libraries

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
