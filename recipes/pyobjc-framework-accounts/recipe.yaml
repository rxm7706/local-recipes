# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.2.2"

package:
  name: pyobjc-framework-accounts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc-framework-Accounts/pyobjc_framework_accounts-${{ version }}.tar.gz
  sha256: 2e8d040fb975147034a3da7d7d5ed4c4c06436f26dba451f5bc5dc762f7c5741

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - pyobjc-core >=12.2.2
    - pyobjc-framework-cocoa >=12.2.2

tests:
  - python:
      imports:
        - PyObjCTest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ronaldoussoren/pyobjc
  license: MIT
  license_file: LICENSE
  summary: Wrappers for the framework Accounts on macOS
  description: |
    Wrappers for the framework Accounts on macOS
  repository: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pyobjc.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
