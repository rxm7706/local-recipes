# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: rulefit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rulefit/rulefit-${{ version }}.tar.gz
  sha256: 623ae22758c0dd6f77a50dd2fcbb1977c063df59431220a7d4b0f04582ad3c4f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scikit-learn

tests:
  - python:
      imports:
        - rulefit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rohan-gt/rulefit
  license: MIT
  license_file: LICENSE
  summary: RuleFit algorithm
  description: |
    RuleFit algorithm

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rulefit
  cfe-upstream-registry: pypi
  cfe-upstream-name: rulefit
