# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.1"

package:
  name: routes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/Routes/Routes-${{ version }}.tar.gz
  sha256: b6346459a15f0cbab01a45a90c3d25caf980d4733d628b4cc1952b865125d053

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - repoze.lru

tests:
  - python:
      imports:
        - routes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://routes.readthedocs.io/
  license: MIT
  license_file: LICENSE.txt
  summary: Routing Recognition and Generation Tools
  description: |
    Routing Recognition and Generation Tools

extra:
  recipe-maintainers:
    - anthchirp
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: routes
  cfe-upstream-registry: pypi
  cfe-upstream-name: routes
  cfe-purls:
    - pkg:conda/routes@${{ version }}?channel=conda-forge
    - pkg:pypi/routes@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://routes.readthedocs.io/
  cfe-import-names: [routes]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/routes-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.5.1

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T12:08:11Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T12:08:11Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T12:08:11Z
