# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: gower
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gower/gower-${{ version }}.tar.gz
  sha256: 34ddb5158f0e8bfba093dca06b9f887bda244998d10af2a3ad8c74a6efa1b5f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - numpy
    - scipy

tests:
  - python:
      imports:
        - gower
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wwwjk366/gower
  license: MIT
  license_file: LICENSE
  summary: Python implementation of Gowers distance, pairwise between records in two data sets
  description: |
    Python implementation of Gowers distance, pairwise between records in two data sets

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
