# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.18.1"

package:
  name: pyphen
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyphen/pyphen-${{ version }}.tar.gz
  sha256: dbae6fbbe4f01cb206108b43573d857c67107be9d0e38eb1b08d6fa2210634a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyphen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.courtbouillon.org/pyphen
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Pure Python module to hyphenate text
  description: |
    Pure Python module to hyphenate text
  repository: https://github.com/Kozea/Pyphen
  documentation: https://pyphen.org/

extra:
  recipe-maintainers:
    - liZe
    - rmax
    - thewchan

#### CFE metadata AND comments
