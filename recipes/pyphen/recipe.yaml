# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyphen
  version: "0.18.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: dbae6fbbe4f01cb206108b43573d857c67107be9d0e38eb1b08d6fa2210634a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core >=3.2,<5
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyphen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: GPL-2.0-or-later AND LGPL-2.1-or-later AND MPL-1.1
  license_file:
    - LICENSE
    - COPYING.GPL
    - COPYING.LGPL
    - COPYING.MPL
  summary: Pure Python module to hyphenate text
  description: |
    Pyphen is a pure Python module to hyphenate text using existing Hunspell
    hyphenation dictionaries.
  homepage: https://www.courtbouillon.org/pyphen/
  repository: https://github.com/Kozea/Pyphen
  documentation: https://doc.courtbouillon.org/pyphen/

extra:
  recipe-maintainers:
    - liZe
    - rmax
    - thewchan
