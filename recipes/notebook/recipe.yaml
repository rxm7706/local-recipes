# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.6.2"

package:
  name: notebook
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/notebook/notebook-${{ version }}.tar.gz
  sha256: cc02b5f0bb972160cccfe44ad8a1a202036206ba3439469c514f03aefa9ae807

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.11
    - hatch-jupyter-builder >=0.5
    - jupyter-builder >=1.0.2,<2
  run:
    - python >=${{ python_min }}
    - jupyter-builder <2,>=1.0.2
    - jupyter-server <3,>=2.19.0
    - jupyterlab-server <3,>=2.28.0
    - jupyterlab <4.7,>=4.6.3
    - notebook-shim <0.3,>=0.2
    - tornado >=6.2.0

tests:
  - python:
      imports:
        - notebook
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter/notebook
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Notebook - A web-based notebook environment for interactive computing
  description: |
    Jupyter Notebook - A web-based notebook environment for interactive computing
  repository: https://github.com/jupyter/notebook
  documentation: https://jupyter-notebook.readthedocs.io/

extra:
  recipe-maintainers:
    - krassowski
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - gnestor
    - takluyver
    - lresende
    - bollwyvl
    - blink1073
    - davidbrochart
    - jtpio

