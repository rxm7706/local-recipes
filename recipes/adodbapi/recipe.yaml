# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.2.0"

package:
  name: adodbapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adodbapi/adodbapi-2.6.2.0.zip
  sha256: 4bbfce499849937c3b09d3a7be8e61a9a07c1e161390419fbfe78a0eef7b4148

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - adodbapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://sourceforge.net/projects/adodbapi
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A pure Python package implementing PEP 249 DB-API using Microsoft ADO.
  description: |
    A pure Python package implementing PEP 249 DB-API using Microsoft ADO.

extra:
  recipe-maintainers:
    - rxm7706

