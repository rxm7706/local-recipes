# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.9.9"

package:
  name: py4j
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py4j/py4j-${{ version }}.tar.gz
  sha256: f694cad19efa5bd1dee4f3e5270eb406613c974394035e5bfc4ec1aba870b879

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - py4j
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.py4j.org/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Enables Python programs to dynamically access arbitrary Java objects
  description: |
    Enables Python programs to dynamically access arbitrary Java objects

extra:
  recipe-maintainers:
    - parente
    - h-vetinari

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: py4j
  cfe-upstream-registry: pypi
  cfe-upstream-name: py4j
  cfe-purls:
    - pkg:conda/py4j@${{ version }}?channel=conda-forge
    - pkg:pypi/py4j@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://www.py4j.org/
  cfe-import-names: [py4j]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/py4j-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.10.9.9

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T03:22:34Z
