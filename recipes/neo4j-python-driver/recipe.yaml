# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.0"

package:
  name: neo4j
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/neo4j/neo4j-${{ version }}.tar.gz
  sha256: e1e246b65b572bd8ea97f9e0e721b7d40a5ce53e53d0007c29aef63e4f9124d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytz

tests:
  - python:
      imports:
        - neo4j
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://neo4j.com/
  license: Apache-2.0 AND Python-2.0
  license_file: LICENSE.txt
  summary: Neo4j Bolt driver for Python
  description: |
    Neo4j Bolt driver for Python
  repository: https://github.com/neo4j/neo4j-python-driver

extra:
  recipe-maintainers:
    - pvanheus
    - thebestnom
    - xylar

#### CFE metadata AND comments
