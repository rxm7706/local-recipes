# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: eland
  version: "9.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9874ec6c5ed01920195e58c702ae2f4de59efc3a8b1a1d49baafcb0b3bb91e1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - elasticsearch >=9,<10
    - pandas >=1.5,<3
    - matplotlib-base >=3.6
    - numpy >=1.2,<3
    - packaging
    - python >=${{ python_min }},<3.13

tests:
  - python:
      imports:
        - eland
        - eland.ml
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - scikit-learn
        - xgboost
        - lightgbm
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python Client and Toolkit for DataFrames, Big Data, Machine Learning and ETL in Elasticsearch
  description: |
    Eland is a Elasticsearch client Python package to analyse, explore and manipulate data
    that resides in Elasticsearch. Where possible the package uses existing Python APIs and
    data structures to make it easy to switch between numpy, pandas, scikit-learn to their
    Elasticsearch powered equivalents. In general, the data resides in Elasticsearch and not
    in memory, which allows Eland to access large datasets stored in Elasticsearch.
  homepage: https://eland.readthedocs.io
  repository: https://github.com/elastic/eland
  documentation: https://eland.readthedocs.io

extra:
  recipe-maintainers:
    - ezimuel
    - joshmock
    - pquentin
    - miguelgrinberg
