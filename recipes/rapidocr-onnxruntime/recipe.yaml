# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.4"

package:
  name: rapidocr-onnxruntime
  version: ${{ version }}

source:
  url: https://github.com/RapidAI/RapidOCR/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 56d2f44d3f53eed1a0db200a50cce72e98ce0f65e58fda6eacff2e6c06f87375

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyclipper >=1.2.0
    - opencv >=4.5.1.48
    - numpy <3.0.0,>=1.19.5
    - six >=1.15.0
    - shapely !=2.0.4,>=1.7.1
    - pyyaml
    - pillow
    - onnxruntime >=1.7.0
    - tqdm

tests:
  - python:
      imports:
        - python.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RapidAI/RapidOCR
  license: Apache-2.0
  license_file: LICENSE
  summary: A cross platform OCR Library based on OnnxRuntime.
  description: |
    A cross platform OCR Library based on OnnxRuntime.
  documentation: https://rapidai.github.io/RapidOCRDocs

extra:
  recipe-maintainers:
    - rxm7706

