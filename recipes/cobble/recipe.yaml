# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cobble
  version: "0.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cobble-${{ version }}.tar.gz
  sha256: de38be1539992c8a06e569630717c485a5f91be2192c461ea2b220607dfa78aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.6.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cobble
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Create data objects
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: http://github.com/mwilliamson/python-cobble

extra:
  recipe-maintainers:
    - sarthakpati
