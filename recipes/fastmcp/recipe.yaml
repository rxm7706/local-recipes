# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastmcp
  version: "3.4.5"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastmcp-${{ version }}.tar.gz
    sha256: a95f2bc876bef42e8b50f7872f24f3f2fe3b1d37408c734e8b9d9e03014b72d3
    target_directory: fastmcp/
  - url: https://pypi.org/packages/source/${{ name[0] }}/fastmcp-slim/fastmcp_slim-${{ version }}.tar.gz
    sha256: 5badc3bceee61f61297eeb9494f499325f3ce1cafabf4611b31f6c3e9d7dff59
    target_directory: fastmcp-slim/

build:
  number: 0

outputs:
  - package:
      name: fastmcp-slim
      version: ${{ version }}

    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install ./fastmcp-slim -vv --no-deps --no-build-isolation
      python:
        entry_points:
          - fastmcp = fastmcp.cli:app

    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - uv-dynamic-versioning >=0.7.0
        - pip
      run:
        - python >=${{ python_min }},<4
        - email-validator >=2.0.0
        - platformdirs >=4.0.0
        - pydantic >=2.11.7
        - pydantic-settings >=2.0.0
        - python-dotenv >=1.1.0
        - rich >=13.9.4
        - typing_extensions >=4.0.0
      run_constraints:
        - anthropic >=0.48.0
        - authlib >=1.6.11
        - azure-identity >=1.16.0
        - cyclopts >=4.0.0
        - exceptiongroup >=1.2.2
        - google-genai >=1.18.0
        - griffelib >=2.0.0
        - httpx >=0.28.1,<1.0
        - joserfc >=1.1.0
        - jsonref >=1.1.0
        - jsonschema-path >=0.3.4
        - mcp >=1.24.0,<2.0
        - openai >=1.102.0
        - openapi-pydantic >=0.5.1
        - opentelemetry-api >=1.20.0
        - packaging >=24.0
        - prefab-ui >=0.18.0
        - pydantic-monty ==0.0.17
        - pydocket >=0.20.0
        - pyjwt >=2.12.0
        #- "py-key-value-aio[filetree,keyring,memory]>=0.4.4,<0.5.0",
        - py-key-value-aio >=0.4.4,<0.5.0
        - pyperclip >=1.9.0
        - python-multipart >=0.0.26
        - pyyaml >=6.0,<7.0
        - starlette >=1.0.1
        - uncalled-for >=0.2.0
        - uvicorn >=0.35
        - watchfiles >=1.0.0
        - websockets >=15.0.1

    tests:
      - python:
          imports:
            - fastmcp
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

    about:
      summary: The dependency-slim FastMCP package.
      license_file: fastmcp/LICENSE

  - package:
      name: fastmcp
      version: ${{ version }}

    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install ./fastmcp -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - uv-dynamic-versioning >=0.7.0
        - pip
      run:
        - python >=${{ python_min }},<4
        - fastmcp-slim =${{ version }}
        #- "fastmcp-slim[mcp]
        - authlib >=1.6.11
        - cyclopts >=4.0.0
        - exceptiongroup >=1.2.2
        - griffelib >=2.0.0
        - httpx >=0.28.1,<1.0
        - joserfc >=1.1.0
        - jsonref >=1.1.0
        - jsonschema-path >=0.3.4
        - mcp >=1.24.0,<2.0
        - openapi-pydantic >=0.5.1
        - opentelemetry-api >=1.20.0
        - packaging >=24.0
        - py-key-value-aio >=0.4.4,<0.5.0
        #- "py-key-value-aio[filetree,keyring,memory]>=0.4.4,<0.5.0",
        - aiofile >=3.5.0
        - anyio >=4.4.0
        - cachetools >=5.0.0
        - keyring >=25.6.0
        - pyperclip >=1.9.0
        - python-multipart >=0.0.26
        - pyyaml >=6.0,<7.0
        - starlette >=1.0.1
        - uncalled-for >=0.2.0
        - uvicorn >=0.35
        - watchfiles >=1.0.0
        - websockets >=15.0.1
      run_constraints:
        - anthropic >=0.48.0
        - azure-identity >=1.16.0
        - google-genai >=1.18.0
        - openai >=1.102.0
        - prefab-ui >=0.18.0
        - pydantic-monty ==0.0.17
        - pydocket >=0.20.0
        - pyjwt >=2.12.0

    tests:
      - python:
          imports:
            - fastmcp
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - requirements:
          run:
            - python ${{ python_min }}.*
            - pip
        script:
          - fastmcp --help

    about:
      license_file: fastmcp/LICENSE

about:
  summary: The fast, Pythonic way to build MCP servers and clients.
  homepage: https://gofastmcp.com
  documentation: https://gofastmcp.com
  repository: https://github.com/PrefectHQ/fastmcp
  license: Apache-2.0
  license_file: fastmcp/LICENSE

extra:
  recipe-maintainers:
    - dbast
    - moritzwilksch
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fastmcp
  cfe-upstream-registry: pypi
  cfe-upstream-name: fastmcp
  cfe-purls:
    - pkg:conda/fastmcp@${{ version }}?channel=conda-forge
    - pkg:pypi/fastmcp@${{ version }}
    - pkg:conda/fastmcp-slim@${{ version }}?channel=conda-forge
    - pkg:pypi/fastmcp-slim@${{ version }}
  cfe-upstream-repo: https://github.com/PrefectHQ/fastmcp
  cfe-upstream-homepage: https://gofastmcp.com
  cfe-import-names: [fastmcp]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: true
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/fastmcp-feedstock
  cfe-forge-recipe-updates-needed: "deployed feedstock recipe.yaml at 3.4.5 is missing joserfc>=1.1.0 and starlette>=1.0.1 in both fastmcp-slim and fastmcp run/run_constraints (flattened from fastmcp-slim's client+server extras), and has a stale pydantic-monty==0.0.16 pin (upstream now ==0.0.17) - verified against live PyPI requires_dist"
  cfe-forge-blocker-list: []
  cfe-last-checked: "2026-08-05T00:00:00Z"
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: "2026-08-05T00:00:00Z"
  cfe-local-build-status: success
  cfe-local-build-datetime: "2026-08-05T00:00:00Z"
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
####
# CFE comments
# Header:
#    # mcp>=2.0.0 upgrade is blocked upstream: fastmcp-slim 3.4.5's pyproject.toml
#    # hard-caps `mcp<2.0,>=1.24.0` on the client/server/mcp extras (baked into
#    # the wheel METADATA, so loosening only the conda pin would break pip_check
#    # per G26). The mcp>=2.0.0 migration is fastmcp v4.0.0 (currently pre-release,
#    # v4.0.0b1 at time of writing) which also adds a new hard dep on
#    # mcp-types>=2.0.0,<3.0.0 (already on conda-forge) and further restructures
#    # the package (fastmcp_remote + fastmcp-tasks split out as separate
#    # distributions). Re-check when fastmcp ships a v4.0.0 stable/GA release.
# run_constraints:
#    # prefab-ui (the "apps" extra's sole dep) is not on conda-forge under any
#    # of the checked name spellings (prefab-ui/prefab_ui/prefabui) - confirmed
#    # absent from channeldata.json. Advisory-only (run_constraints), does not
#    # block build/test. Matches the deployed feedstock's own (equally
#    # unresolvable) prefab-ui constraint - not a regression introduced here.
####
