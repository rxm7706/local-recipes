# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: filters
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/filters/filters-${{ version }}.tar.gz
  sha256: b74fad6a7885f1380dd12fde0f849e8c5e459919ce314f76c2352064c7a30796

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - class-registry
    - python-dateutil
    - pytz
    - regex
    - six
    - py2casefold
    - typing

tests:
  - python:
      imports:
        - filters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://filters.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Validation and data pipelines made easy!
  description: |
    Validation and data pipelines made easy!

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: filters
