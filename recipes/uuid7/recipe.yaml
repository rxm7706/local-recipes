# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: uuid7
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uuid7/uuid7-${{ version }}.tar.gz
  sha256: 8c57aa32ee7456d3cc68c95c4530bc571646defac01895cfc73545449894a63c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uuid_extensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stevesimmons/uuid7
  license: MIT
  license_file: LICENSE
  summary: UUID version 7, generating time-sorted UUIDs with 200ns time resolution and 48 bits of randomness
  description: |
    UUID version 7, generating time-sorted UUIDs with 200ns time resolution and 48 bits of randomness

extra:
  recipe-maintainers:
    - MertErtugrulQC

