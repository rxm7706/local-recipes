    - pkg:conda/termcolor@${{ version }}?channel=conda-forge
    - pkg:pypi/termcolor@${{ version }}
  cfe-upstream-repo: https://github.com/termcolor/termcolor
  cfe-upstream-homepage: https://github.com/termcolor/termcolor
  cfe-import-names: [termcolor]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/termcolor-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-3.3.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T06:26:50Z
