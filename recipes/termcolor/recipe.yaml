# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: termcolor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/termcolor/termcolor-${{ version }}.tar.gz
  sha256: 348871ca648ec6a9a983a13ab626c0acce02f515b9e1983332b17af7979521c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - termcolor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/termcolor/termcolor
  license: MIT
  license_file: LICENSE
  summary: ANSI color formatting for output in terminal
  description: |
    ANSI color formatting for output in terminal
  repository: https://github.com/termcolor/termcolor

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - k-dominik

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: termcolor
  cfe-upstream-registry: pypi
  cfe-upstream-name: termcolor
