# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: spacy-langdetect
  version: ${{ version }}

source:
  url: https://github.com/Abhijit-2592/spacy-langdetect/archive/refs/tags/${{ version }}.tar.gz
  sha256: dc04e22e35f12d7fb4a86cda888da8d2529ca9569437cbd6925544babf1ee62e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - spacy
    - pytest
    - langdetect

tests:
  - python:
      imports:
        - spacy_langdetect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Abhijit-2592/spacy-langdetect
  license: MIT
  license_file: LICENSE
  summary: Fully customizable language detection pipeline for spaCy
  description: |
    Fully customizable language detection pipeline for spaCy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
