# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.19"

package:
  name: fastapi-fullstack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-fullstack/fastapi_fullstack-${{ version }}.tar.gz
  sha256: 0d77f99db18193bc0eb35e56e24844d5b1fd7d5493e5eb61fe48677c06a29898

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.3.3
    - cookiecutter >=2.7.0
    - email-validator >=2.3.0
    - packaging >=24.0
    - pydantic >=2.13.0
    - pyyaml >=6.0
    - questionary >=2.1.0
    - rich >=15.0.0
    - ruff >=0.14.0

tests:
  - python:
      imports:
        - fastapi_gen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vstorm-co/full-stack-ai-agent-template
  license: MIT
  license_file: LICENSE
  summary: Full-stack FastAPI + Next.js template generator with PydanticAI/LangChain agents, WebSocket streaming, 20+ enterprise integrations, and Logfire/LangSmith observability. Ship AI apps fast. CLI tool to generate production-ready FastAPI + Next.js projects with AI agents, auth, and observability.
  description: |
    Full-stack FastAPI + Next.js template generator with PydanticAI/LangChain agents, WebSocket streaming, 20+ enterprise integrations, and Logfire/LangSmith observability. Ship AI apps fast. CLI tool to generate production-ready FastAPI + Next.js projects with AI agents, auth, and observability.
  repository: https://github.com/vstorm-co/full-stack-ai-agent-template
  documentation: https://github.com/vstorm-co/full-stack-ai-agent-template#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
