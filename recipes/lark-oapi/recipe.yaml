# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"

package:
  name: lark-oapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lark-oapi/lark_oapi-${{ version }}.tar.gz
  sha256: deee5ed90f6b54448e00af6749af90a1ac72f212050c24a6c619f5a12c542774

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.25
    - requests-toolbelt >=0.9
    - pycryptodome >=3.9
    - websockets <16,>=11
    - httpx <1.0,>=0.24

tests:
  - python:
      imports:
        - lark_oapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/larksuite/oapi-sdk-python
  license: MIT
  license_file: LICENSE
  summary: Lark OpenAPI SDK for Python
  description: |
    Lark OpenAPI SDK for Python
  repository: https://github.com/larksuite/oapi-sdk-python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lark-oapi
  cfe-upstream-registry: pypi
  cfe-upstream-name: lark-oapi
