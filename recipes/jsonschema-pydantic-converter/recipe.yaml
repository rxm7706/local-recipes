# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: jsonschema-pydantic-converter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema-pydantic-converter/jsonschema_pydantic_converter-${{ version }}.tar.gz
  sha256: abc137b036146ed336f49af9659a76b080a89febc0e836be20025bf3d5f2eaaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0.0

tests:
  - python:
      imports:
        - jsonschema_pydantic_converter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/akshaylive/jsonschema-pydantic-converter
  license: Apache-2.0
  license_file: LICENSE
  summary: Convert JSON Schema definitions to Pydantic models dynamically at runtime
  description: |
    Convert JSON Schema definitions to Pydantic models dynamically at runtime
  repository: https://github.com/akshaylive/jsonschema-pydantic-converter

extra:
  recipe-maintainers:
    - rxm7706

