# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: pymarkdownlint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymarkdownlint/pymarkdownlint-${{ version }}.tar.gz
  sha256: 2fc7937107dbad10d30b45bf0a1c3f6b85b80cf4aa3d1aaa75e05424c9454e3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymarkdownlint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jorisroovers/pymarkdownlint
  license: MIT
  license_file: LICENSE
  summary: Markdown linter written in python. Under active development.
  description: |
    Markdown linter written in python. Under active development.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pymarkdownlint
