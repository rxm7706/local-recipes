    - pkg:pypi/pymarkdownlint@${{ version }}
  cfe-upstream-repo: https://github.com/jorisroovers/pymarkdownlint
  cfe-upstream-homepage: https://github.com/jorisroovers/pymarkdownlint
  cfe-import-names: [pymarkdownlint]
