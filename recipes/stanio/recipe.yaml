# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: stanio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stanio/stanio-${{ version }}.tar.gz
  sha256: 348d52f947dec431e118f4b601c4c5296929b86401d4d4dd5aa9373b0d4ae4ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - stanio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stan-dev/stanio
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utilities for preparing Stan inputs and processing Stan outputs
  description: |
    Utilities for preparing Stan inputs and processing Stan outputs

extra:
  recipe-maintainers:
    - WardBrian

#### CFE metadata AND comments
