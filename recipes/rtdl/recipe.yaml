# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.13"

package:
  name: rtdl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rtdl/rtdl-${{ version }}.tar.gz
  sha256: f4ddbda92a955d9e5f0eaf5f6e0af705a41a8105e55a85b19877a3f7b177e4b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - numpy >=1.18,<2
    - pytorch >=1.7,<2

tests:
  - python:
      imports:
        - rtdl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rtdl/
  license: Apache-2.0
  license_file: LICENSE
  summary: Research on Tabular Deep Learning.
  description: |
    Research on Tabular Deep Learning.
  repository: https://github.com/Yura52/rtdl
  documentation: https://Yura52.github.io/rtdl

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rtdl
  cfe-upstream-registry: pypi
  cfe-upstream-name: rtdl
