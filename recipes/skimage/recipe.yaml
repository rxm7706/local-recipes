# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0"

package:
  name: skimage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skimage/skimage-${{ version }}.tar.gz
  sha256: 6c96a11d9deea68489c9b80b38fad1dcdab582c36d4fa093b99b24a3b30c38ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - skimage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scikit-image/scikit-image
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Dummy package that points to scikit-image
  description: |
    Dummy package that points to scikit-image

extra:
  recipe-maintainers:
    - rxm7706

