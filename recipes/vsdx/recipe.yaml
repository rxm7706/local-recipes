# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: vsdx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vsdx/vsdx-${{ version }}.tar.gz
  sha256: 71e4bcf101c6562088b6d2ead431474759a0c56f3706cc93b20b1962ecfcf274

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2
    - deprecation

tests:
  - python:
      imports:
        - vsdx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dave-howard/vsdx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: vsdx - A python library for processing .vsdx files
  description: |
    vsdx - A python library for processing .vsdx files
  documentation: https://vsdx.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: vsdx
  cfe-upstream-registry: pypi
  cfe-upstream-name: vsdx
