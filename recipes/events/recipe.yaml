# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: events
  version: ${{ version }}

source:
  url: https://github.com/pyeve/events/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 51fed10bad025e4bb81714b6114546b7f42773eda82df10e769d76a7859e9c3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - events
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/pyeve/events
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Bringing the elegance of C# EventHandler to Python
  description: |
    Bringing the elegance of C# EventHandler to Python

extra:
  recipe-maintainers:
    - holgern

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: events
  cfe-upstream-registry: pypi
  cfe-upstream-name: events
  cfe-purls:
    - pkg:conda/events@${{ version }}?channel=conda-forge
    - pkg:pypi/events@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/pyeve/events
  cfe-import-names: [events]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/events-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.5

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T09:08:49Z
