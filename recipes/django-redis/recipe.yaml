# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-redis
  version: "7.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: e48491c862f4350b0747ceb1016700686fb93c4f4e0fb9c490fe6c6658ffd933

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - typing_extensions >=4.12
    - python >=${{ python_min }}
    - django >=5.2,<7.0
    - redis-py >=4.0.2
    # - Django >=4.2
    # - typing_extensions >=4.12
    # - pyzstd >=0.15
    # - msgpack-python >=0.6.0
    # - lz4 >=0.15
    # - Django <7.0,>=5.2

tests:
  - python:
      imports:
        - django_redis
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Full featured redis cache backend for Django
  description: |
    django-redis is a BSD Licensed, full featured Redis cache/session backend for Django.
  homepage: https://github.com/niwinz/django-redis
  repository: https://github.com/niwinz/django-redis
  documentation: https://niwinz.github.io/django-redis/latest/

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - millsks
    - elanqo
    - zaigner
    - sannykr
