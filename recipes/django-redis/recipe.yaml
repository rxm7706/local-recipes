# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0.0"

package:
  name: django-redis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-redis/django_redis-${{ version }}.tar.gz
  sha256: e48491c862f4350b0747ceb1016700686fb93c4f4e0fb9c490fe6c6658ffd933

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - django <7.0,>=5.2
    - redis-py >=4.0.2
    - typing_extensions >=4.12

tests:
  - python:
      imports:
        - django_redis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jazzband/django-redis
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Full featured redis cache backend for Django.
  description: |
    Full featured redis cache backend for Django.
  repository: https://github.com/jazzband/django-redis

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - millsks
    - elanqo
    - zaigner
    - sannykr

