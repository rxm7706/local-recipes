{% set name = "django-redis" %}
{% set version = "7.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e48491c862f4350b0747ceb1016700686fb93c4f4e0fb9c490fe6c6658ffd933

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - typing_extensions >=4.12
    - python >={{ python_min }}
    - django >=5.2,<7.0
    - redis-py >=4.0.2
    # - Django >=4.2
    # - typing_extensions >=4.12
    # - pyzstd >=0.15
    # - msgpack-python >=0.6.0
    # - lz4 >=0.15
    # - Django <7.0,>=5.2

test:
  imports:
    - django_redis
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/niwinz/django-redis
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Full featured redis cache backend for Django
  description: |
    django-redis is a BSD Licensed, full featured Redis cache/session backend for Django.
  doc_url: https://niwinz.github.io/django-redis/latest/
  dev_url: https://github.com/niwinz/django-redis

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - millsks
    - elanqo
    - zaigner
    - sannykr
