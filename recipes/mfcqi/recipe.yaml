# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: mfcqi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mfcqi/mfcqi-${{ version }}.tar.gz
  sha256: f0f46b937baf81effbf67b6ebf42c63265c9d2d43f03a4db24cabebdfb60cd5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bandit >=1.8.6
    - click >=8.0.0
    - cognitive_complexity >=1.3.0
    - detect-secrets >=1.5.0
    - jinja2 >=3.1.2
    - keyring >=24.0.0
    - litellm >=1.77.3
    - pip-audit >=2.7.0
    - pydantic >=2.11.9
    - pylint >=3.3.8
    - pyyaml >=6.0.0
    - radon >=6.0.1
    - requests >=2.31.0
    - rich >=13.0.0
    - toml >=0.10.2

tests:
  - python:
      imports:
        - mfcqi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/integrallis/mfcqi-python
  license: MIT
  license_file: LICENSE
  summary: MFCQI - Benchmark Analysis Reporting Utility for comprehensive code quality analysis with LLM integration
  description: |
    MFCQI - Benchmark Analysis Reporting Utility for comprehensive code quality analysis with LLM integration
  repository: https://github.com/integrallis/mfcqi-python
  documentation: https://integrallis.github.io/mfcqi-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mfcqi
