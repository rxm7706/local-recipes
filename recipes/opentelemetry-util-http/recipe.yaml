# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-util-http
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-util-http/opentelemetry_util_http-${{ version }}.tar.gz
  sha256: 84f82d826978bba416ab453460ff6a7391cdc3534c93a786595e4068680016b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry

tests:
  - python:
      imports:
        - opentelemetry.util.http
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/util/opentelemetry-util-http
  license: Apache-2.0
  license_file: LICENSE
  summary: Web util for OpenTelemetry
  description: |
    Web util for OpenTelemetry
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api

