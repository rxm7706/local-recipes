# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.19.1"

package:
  name: datashader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datashader/datashader-${{ version }}.tar.gz
  sha256: f62d880a4a431813f9bb3959e565feda79c1634f889aaadcf948cb0d0c114cdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - colorcet
    - multipledispatch
    - numba
    - numpy
    - packaging
    - pandas
    - param
    - pyct
    - requests
    - scipy
    - toolz
    - xarray

tests:
  - python:
      imports:
        - datashader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/datashader/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Data visualization toolchain based on aggregating into a grid
  description: |
    Data visualization toolchain based on aggregating into a grid
  repository: https://github.com/holoviz/datashader
  documentation: https://datashader.org

extra:
  recipe-maintainers:
    - maximlt
    - jbednar
    - ocefpaf
    - philippjfr
    - hoxbro
    - amaloney

