{% set version = "0.19.1" %}
{% set python_min = "3.10" %}

package:
  name: datashader
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/datashader/datashader-{{ version }}.tar.gz
  sha256: f62d880a4a431813f9bb3959e565feda79c1634f889aaadcf948cb0d0c114cdd

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - colorcet
    - multipledispatch
    - numba
    - numpy
    - packaging
    - pandas
    - param
    - pyct
    - requests
    - scipy
    - toolz
    - xarray

test:
  requires:
    - fastparquet
    - flake8
    - nbsmoke >=0.5.0
    - pytest
    - pytest-benchmark
    - holoviews >=1.14.1
    - netcdf4
    - python {{ python_min }}
  imports:
    - datashader

about:
  home: https://datashader.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Data visualization toolchain based on aggregating into a grid
  description: |
    Datashader is a data rasterization pipeline for automating the process of
    creating meaningful representations of large amounts of data.
  doc_url: https://datashader.org
  dev_url: https://github.com/holoviz/datashader

extra:
  recipe-maintainers:
    - maximlt
    - jbednar
    - ocefpaf
    - philippjfr
    - hoxbro
    - amaloney
