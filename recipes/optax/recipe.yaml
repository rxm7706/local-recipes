# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.8"

package:
  name: optax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/optax/optax-${{ version }}.tar.gz
  sha256: 5b225b35066fc3eebaa4d798f1b4173b4d57d1a480610908981f8343b50af0b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - absl-py >=0.7.1
    - jax >=0.5.3
    - jaxlib >=0.5.3
    - numpy >=1.18.0

tests:
  - python:
      imports:
        - optax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google-deepmind/optax
  license: Apache-2.0
  license_file: LICENSE
  summary: A gradient processing and optimization library in JAX.
  description: |
    A gradient processing and optimization library in JAX.
  documentation: https://optax.readthedocs.io/

extra:
  recipe-maintainers:
    - flferretti
    - PhilipVinc
    - hbq1

#### CFE metadata AND comments
