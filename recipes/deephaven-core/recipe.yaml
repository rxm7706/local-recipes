# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "42.4"

package:
  name: deephaven-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/d/deephaven-core/deephaven_core-42.4-py3-none-any.whl
  sha256: 2673cb1b4f6d002a3e9a8c6632e1e213c0f97f81ab58b0c02a1c73a1eb21e6c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jpy >=2.1.0
    - deephaven-plugin >=0.6.0
    - numpy
    - pandas >=1.5.0
    - pyarrow

tests:
  - python:
      imports:
        - deephaven_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deephaven.io/
  license: MIT
  license_file: LICENSE
  summary: Deephaven Engine Python Package
  description: |
    Deephaven Engine Python Package

extra:
  recipe-maintainers:
    - rxm7706

