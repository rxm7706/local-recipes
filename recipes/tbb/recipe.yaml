# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Official patch version for the first release of 2021 is 1,
# but internal patch version is 0, handle it for interface version.
# Libraries on Windows are expected to be installed into LIBRARY_PREFIX.
# tbb4py files should be installed into PREFIX.
# See https://docs.conda.io/projects/conda-build/en/latest/user-guide/environment-variables.html.
# On non-Windows CMAKE_ARGS already contains CMAKE_INSTALL_PREFIX.
# CMAKE_PREFIX_PATH is needed to discover libhwloc with PkgConfig.
# Use specific test list agreed with TBB team to cover core functionality on high level.
# Execution of all tests is too heavy task for packaging CI.
# test_malloc_compliance is temporary excluded from the list since it causes failures that likely appear due to test implementation or env misconfiguration.
# oneTBB issue: https://github.com/oneapi-src/oneTBB/issues/700
# Agreed with oneTBB developers that it is suitable approach since the product is fully tested on oneTBB side.
schema_version: 1

context:
  version: "2023.0.0"
  vmajor: ${{ version.split('.')[0]|int }}
  vminor: ${{ version.split('.')[1]|int }}
  vpatch: ${{ version.split('.')[2]|int }}
  vbinary: vmajor - 2009
  vtag: ${{ "v" ~ version | replace(".rc", "-rc") }}
  vinterface: ${{ "%d" % (vbinary * 1000 + vminor * 10 + (vpatch if vmajor != 2021 or vminor != 1 else 0)) }}
  tests: test_parallel_for test_tbb_header conformance_version test_flow_graph test_arena_constraints
  ctest_regex: ${{ "^(%s)$" % (tests | replace(' ', '|')) }}
  win_extra: "'\"os.add_dll_directory(os.environ['LIBRARY_BIN']); \" if win else \"\"'"

recipe:
  name: tbb
  version: ${{ version }}

source:
  url: https://github.com/oneapi-src/oneTBB/archive/refs/tags/${{ vtag }}.tar.gz
  sha256: f8767b971ec6aea25dde58ae0f593e94e7aa75a739a86f67967012f69e2199b1

build:
  number: 2

requirements:
  build:
    - python *
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: win
      then: ninja
    - if: win
      then: winpthreads-devel
    - if: not win
      then: make
    - cmake
    - pkg-config
  host:
    - libhwloc

outputs:
  - package:
      name: tbb
    build:
      script:
        - if: win
          then: set CMAKE_GENERATOR=Ninja
        # unset option that ninja complains about
        - if: win
          then: set CMAKE_GENERATOR_TOOLSET=
        - if: win
          then: set CMAKE_GENERATOR_PLATFORM=
        - cmake ${{ cmake_args }} -DTBB_TEST=OFF -S . -B build
        - cmake --build build --parallel
        - cmake -DCOMPONENT=runtime -P build/cmake_install.cmake
    requirements:
      host:
        - libhwloc
    tests:
      - requirements:
          run:
            - python *
        script:
          - python -c "import ctypes, os; ${{ win_extra }} assert ${{ vinterface }} == ctypes.cdll[r'${{ libname }}']['TBB_runtime_interface_version']()"
    about:
      summary: TBB Libraries
      license_file:
        - LICENSE.txt
        - third-party-programs.txt
  - package:
      name: tbb-devel
    build:
      script:
        - if: win
          then: set CMAKE_GENERATOR=Ninja
        - if: win
          then: set CMAKE_GENERATOR_TOOLSET=
        - if: win
          then: set CMAKE_GENERATOR_PLATFORM=
        - cmake ${{ cmake_args }} -DTBB_TEST=OFF -S . -B build
        - cmake --build build --parallel
        - cmake -DCOMPONENT=devel -P build/cmake_install.cmake
    requirements:
      build:
        - python *
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - if: win
          then: ninja
        - if: win
          then: winpthreads-devel
        - if: not win
          then: make
        - cmake >=3.13
        - pkg-config
      host:
        - libhwloc
      run:
        - ${{ pin_subpackage('tbb', exact=True) }}
      run_exports:
        - tbb >=${{ version }}
      ignore_run_exports:
        by_name:
          - libhwloc
    tests:
      - files:
          source:
            - cmake
            - test
            - CMakeLists.txt
            - include
            - integration
            - src
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - ${{ stdlib("c") }}
            - if: win
              then: ninja
            - if: win
              then: winpthreads-devel
            - if: not win
              then: make
            - cmake
            - pkg-config
            - libhwloc
            - if: build_platform != target_platform
              then: coreutils
        script:
          - if: win
            then: set CMAKE_GENERATOR=Ninja
          - if: win
            then: set CMAKE_GENERATOR_TOOLSET=
          - if: win
            then: set CMAKE_GENERATOR_PLATFORM=
          - cmake ${{ cmake_args }} -DTBB_TEST=ON -DTBB_DIR=ON -DTBB_FIND_PACKAGE=ON -S . -B test_build
          - cmake --build test_build --target ${{ tests }} --parallel
          - cd test_build
          - ctest -R "${{ ctest_regex }}" --output-on-failure
    about:
      summary: TBB Development files
      license_file:
        - LICENSE.txt
        - third-party-programs.txt
  - package:
      name: tbb4py
    build:
      script:
        - if: win
          then: set CMAKE_GENERATOR=Ninja
        - if: win
          then: set CMAKE_GENERATOR_TOOLSET=
        - if: win
          then: set CMAKE_GENERATOR_PLATFORM=
        - cmake ${{ cmake_tbb4py_args }} -DTBB4PY_BUILD=ON -DTBB_TEST=OFF -S . -B ${{ tbb4py_build_dir }}
        - cmake --build ${{ tbb4py_build_dir }} --target python_build --parallel
        - cmake -DCOMPONENT=tbb4py -P ${{ tbb4py_build_dir }}/cmake_install.cmake
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - if: win
          then: ninja
        - if: not win
          then: make
        - cmake
        - swig
      host:
        - python
        - pip
        - setuptools
        - ${{ pin_subpackage('tbb-devel', exact=True) }}
      run:
        - tbb >=${{ version }}
        - python
    tests:
      - python:
          imports:
            - tbb
            - TBB
          pip_check: false
      - requirements:
          run:
            - python
            - ${{ pin_subpackage('tbb', exact=True) }}
        script:
          - python -m TBB -h
          - python -m tbb -h
          - python -m tbb test
    about:
      summary: TBB module for Python
      license_file:
        - LICENSE.txt
        - third-party-programs.txt

about:
  license: Apache-2.0
  license_file:
    - LICENSE.txt
    - third-party-programs.txt
  summary: High level abstract threading library
  homepage: https://github.com/oneapi-src/oneTBB
  repository: https://github.com/oneapi-src/oneTBB
  documentation: https://software.intel.com/en-us/oneapi-tbb-documentation

extra:
  recipe-maintainers:
    - anton-malakhov
    - jschueller
    - AlexVeprev
    - isaevil
    - ilya-lavrenov
