# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: playsound
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/playsound-${{ version }}.tar.gz
  sha256: cc6ed11d773034b0ef624e6bb4bf50f4b76b8414a59ce6d38afb89b423297ced

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - playsound
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pure Python, cross platform, single function module with no dependencies for playing sounds.
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/TaylorSMarks/playsound

extra:
  recipe-maintainers:
    - thewchan
