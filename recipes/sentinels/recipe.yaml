# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: sentinels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sentinels/sentinels-${{ version }}.tar.gz
  sha256: 3c2f64f754187c19e0a1a029b148b74cf58dd12ec27b4e19c0e5d6e22b5a9a86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.25.1
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sentinels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmalloc/sentinels
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Various objects to denote special meanings in python
  description: |
    Various objects to denote special meanings in python

extra:
  recipe-maintainers:
    - pmlandwehr
    - pb01ka
    - killua156
    - mgorny

