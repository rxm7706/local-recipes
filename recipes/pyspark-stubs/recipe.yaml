# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyspark-stubs
  version: 3.0.0.post3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bea8b6ed8a77fac06d8df99d80b9d017bf4de632583d7eef829b4e65653f9d03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pyspark >=3.0.0,<3.1.0
    - python >=3.6
  run:
    - pyspark >=3.0.0,<3.1.0
    - python >=3.6

tests:
  - script:
      - if: unix
        then: test -f $SP_DIR/pyspark/py.typed
      - if: win
        then: if not exist %SP_DIR%\\pyspark\\py.typed exit 1

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A collection of the Apache Spark stub files
  homepage: https://github.com/zero323/pyspark-stubs
  repository: https://github.com/zero323/pyspark-stubs
  documentation: https://github.com/zero323/pyspark-stubs/blob/branch-2.4/README.rst

extra:
  recipe-maintainers:
    - zero323
