# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: klembord
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/klembord/klembord-${{ version }}.tar.gz
  sha256: 6954c17a02813b199e31d0bb67fc1457fe59c2ba25fd27d200d7a9cd79d97825

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - python-xlib
        - stopit

tests:
  - python:
      imports:
        - klembord
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OzymandiasTheGreat/klembord
  license: MIT
  license_file: LICENSE
  summary: Full toolkit agnostic cross-platform clipboard access
  description: |
    Full toolkit agnostic cross-platform clipboard access
  repository: https://github.com/OzymandiasTheGreat/klembord

extra:
  recipe-maintainers:
    - rxm7706

