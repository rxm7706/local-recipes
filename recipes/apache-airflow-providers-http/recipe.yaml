# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.5"

package:
  name: apache-airflow-providers-http
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-http/apache_airflow_providers_http-${{ version }}.tar.gz
  sha256: 35d0a8e8ec7ab7aa81fec5b8255327a6792ec85928ae319dbab9e8eb011c8bf8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.17.0
    - requests <3,>=2.32.0
    - requests-toolbelt >=1.0.0
    - aiohttp >=3.14.0
    - asgiref >=2.3.0
    - pydantic >=2.11.0

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-http/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-http for Apache Airflow
  description: |
    Provider package apache-airflow-providers-http for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-http/6.0.5

extra:
  recipe-maintainers:
    - xylar

