# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"

package:
  name: mkdocs-localsearch
  version: ${{ version }}

source:
  url: https://github.com/wilhelmer/mkdocs-localsearch/archive/refs/tags/${{ version }}.tar.gz
  sha256: 65009799808c6a7d7d042897e0f043896614004719c2966bc6c3d3d7736ce868

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mkdocs

tests:
  - python:
      imports:
        - mkdocs_localsearch_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wilhelmer/mkdocs-localsearch
  license: MIT
  license_file: LICENSE
  summary: "A MkDocs plugin to replace the native 'search' plugin with a search plugin that also works locally (file:// protocol). Only works with the Material theme."
  description: |
    A MkDocs plugin to replace the native "search" plugin with a search plugin that also works locally (file:// protocol). Only works with the Material theme.

extra:
  recipe-maintainers:
    - rxm7706

