# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: send2trash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Send2Trash/send2trash-${{ version }}.tar.gz
  sha256: 1c72b39f09457db3c05ce1d19158c2cbef4c32b8bedd02c155e49282b7ea7459

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.3.1
  run:
    - python >=${{ python_min }}
    - if: win
      then:
        - pywin32
    - if: osx
      then:
        - pyobjc

tests:
  - python:
      imports:
        - send2trash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arsenetar/send2trash
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Send file to trash natively under Mac OS X, Windows and Linux
  description: |
    Send file to trash natively under Mac OS X, Windows and Linux
  repository: https://github.com/arsenetar/send2trash.git

extra:
  recipe-maintainers:
    - bollwyvl

