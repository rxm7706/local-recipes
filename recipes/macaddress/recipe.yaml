# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: macaddress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/macaddress/macaddress-${{ version }}.tar.gz
  sha256: 1400ccdc28d747102d57ae61e5b78d8985872930810ceb8860cd49abd1e1fa37

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - macaddress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mentalisttraceur/python-macaddress
  license: 0BSD
  license_file: LICENSE
  summary: Like ``ipaddress``, but for hardware identifiers such as MAC addresses.
  description: |
    Like ``ipaddress``, but for hardware identifiers such as MAC addresses.

extra:
  recipe-maintainers:
    - rxm7706

