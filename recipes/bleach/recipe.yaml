# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.4.0"

package:
  name: bleach
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bleach/bleach-${{ version }}.tar.gz
  sha256: 4202482733d85cedd04e59fcb2f89f4e4c7c385a78d3c3c23c30446843a37452

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - webencodings

tests:
  - python:
      imports:
        - bleach
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mozilla/bleach
  license: Apache-2.0
  license_file: LICENSE
  summary: An easy safelist-based HTML-sanitizing tool.
  description: |
    An easy safelist-based HTML-sanitizing tool.

extra:
  recipe-maintainers:
    - minrk
    - ocefpaf

#### CFE metadata AND comments
