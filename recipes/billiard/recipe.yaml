# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.1"

package:
  name: billiard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/billiard/billiard-${{ version }}.tar.gz
  sha256: c88559b306ee5dc93f8d5f843d07da15d795d67af26720d14ee9d09f09eb0b22

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - billiard
        - billiard.dummy
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Python multiprocessing fork with improvements and bugfixes
  homepage: https://github.com/celery/billiard
  repository: https://github.com/celery/billiard

extra:
  recipe-maintainers:
    - rxm7706
    - kwilcox

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: billiard
  cfe-upstream-registry: pypi
  cfe-upstream-name: billiard
