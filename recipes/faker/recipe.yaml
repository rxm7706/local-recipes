    - pkg:pypi/faker@${{ version }}
  cfe-upstream-repo: https://github.com/joke2k/faker
  cfe-upstream-homepage: https://github.com/joke2k/faker
  cfe-import-names: [faker]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/faker-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-40.36.0

  cfe-forge-blocker-list:
