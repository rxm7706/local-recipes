# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "40.36.0"

package:
  name: faker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Faker/faker-${{ version }}.tar.gz
  sha256: 754048c76c03afa7de83eee8f4bcee3cf668cbb7d995f54a4e9678db7f110308

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - faker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/joke2k/faker
  license: MIT
  license_file: LICENSE.txt
  summary: Faker is a Python package that generates fake data for you.
  description: |
    Faker is a Python package that generates fake data for you.
  repository: https://github.com/joke2k/faker
  documentation: http://faker.rtfd.org/

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: faker
