# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.13"

package:
  name: pypykatz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypykatz/pypykatz-${{ version }}.tar.gz
  sha256: f93d44fc393839c5daf2f061b29b81ffc576dd3391b175deb59a72956db94893

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - unicrypto <=0.1.0,>=0.0.10
    - minidump <=0.1.0,>=0.0.21
    - minikerberos <=0.5.0,>=0.4.1
    - aiowinreg <=0.1.0,>=0.0.11
    - msldap <=0.6.0,>=0.5.7
    - winacl <=0.2.0,>=0.1.9
    - aiosmb <=0.5.0,>=0.4.8
    - aesedb <=0.2.0,>=0.1.4
    - tqdm

tests:
  - python:
      imports:
        - pypykatz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/pypykatz
  license: MIT
  license_file: LICENSE
  summary: Python implementation of Mimikatz
  description: |
    Python implementation of Mimikatz

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pypykatz
