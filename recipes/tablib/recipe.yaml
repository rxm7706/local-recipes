# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.0"

package:
  name: tablib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tablib/tablib-${{ version }}.tar.gz
  sha256: 781cfa9a42de8f33c52aff857fd0a04e483de4fd1c53eaaa9a6aeac62bad11de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=58
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tablib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://tablib.readthedocs.io
  license: MIT
  license_file: LICENSE
  summary: Format agnostic tabular data library (XLS, JSON, YAML, CSV, etc.)
  description: |
    Format agnostic tabular data library (XLS, JSON, YAML, CSV, etc.)
  documentation: https://tablib.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf

