# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nbstripout
  version: "0.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 313bbb4217c8e38998567e5d790b6bd6c3a17a8c39073b205b84dadfc5d756dc
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - nbstripout = nbstripout:main

requirements:
  host:
    - pip
    - python 3.10.*
    - setuptools
    - pytest-runner
  run:
    - python >=${{ python_min }}
    - nbformat

tests:
  - python:
      imports:
        - nbstripout
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - nbformat
    script:
      - nbstripout --help

about:
  license: MIT
  license_file: LICENSE.txt
  summary: strip output from Jupyter and IPython notebooks
  description: |
    Opens a notebook, strips its output, and writes the outputless version to the
    original file.

    Useful mainly as a git filter or pre-commit hook for users who don't want to
    track output in VCS.

    This does mostly the same thing as the `Clear All Output` command in the
    notebook UI.
  homepage: https://github.com/kynan/nbstripout
  repository: https://github.com/kynan/nbstripout
  documentation: https://pypi.org/project/nbstripout/

extra:
  recipe-maintainers:
    - kynan
