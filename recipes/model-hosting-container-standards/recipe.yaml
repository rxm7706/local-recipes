# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.16"

package:
  name: model-hosting-container-standards
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/model-hosting-container-standards/model_hosting_container_standards-${{ version }}.tar.gz
  sha256: d34589633900e53c3ee5f7c78280a7cf7e4f6532c35e763341a262fc85cbe84a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - fastapi
    - httpx
    - jmespath
    - pydantic
    - setuptools
    - starlette >=0.49.1
    - supervisor >=4.2.0

tests:
  - python:
      imports:
        - model_hosting_container_standards
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/model-hosting-container-standards/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python toolkit for standardized model hosting container implementations with Amazon SageMaker integration
  description: |
    Python toolkit for standardized model hosting container implementations with Amazon SageMaker integration

extra:
  recipe-maintainers:
    - rxm7706

