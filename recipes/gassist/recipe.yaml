# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: gassist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/gassist/gassist-0.0.1-py3-none-any.whl
  sha256: bb0fac74b453153a6c74b2db40a14fdde7879cbc10ec692ed170e576c8e2b6aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm
    - flask
    - flask_cors
    - colorama

tests:
  - python:
      imports:
        - gassist
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gassist/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python interfaces into G-Assist module
  description: |
    Python interfaces into G-Assist module

extra:
  recipe-maintainers:
    - rxm7706

