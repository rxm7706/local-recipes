# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0.post1"

package:
  name: pyldap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pyldap/pyldap-3.0.0.post1-py3-none-any.whl
  sha256: 9ea6ae79b48f3178561a6bc105bcbc77231d5994e67ffb81b7699b8f19dd92c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-ldap

tests:
  - python:
      imports:
        - pyldap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyldap/pyldap/
  license: MIT
  license_file: LICENSE
  summary: DEPRECATED; use python-ldap instead
  description: |
    DEPRECATED; use python-ldap instead

extra:
  recipe-maintainers:
    - rxm7706

