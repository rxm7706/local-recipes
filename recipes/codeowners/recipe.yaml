# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: codeowners
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/codeowners/codeowners-${{ version }}.tar.gz
  sha256: afa952d236c3c998b10ffddb5f92564becb27bd83cd3ce98f4566e83aa958e3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - codeowners
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/codeowners/
  license: MIT
  license_file: LICENSE
  summary: Codeowners parser for Python
  description: |
    Codeowners parser for Python
  repository: https://github.com/sbdchd/codeowners

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: codeowners
