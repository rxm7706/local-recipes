# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: comtypes
  version: "1.4.16"
  sha256: 79bdb1e319a3e8cd26cf0aece54ff550aa0bb749625cf74c0cbe3cae2fe764d9

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/enthought/comtypes/archive/${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  skip: not win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - comtypes
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.txt
  summary: pure Python COM package
  description: |
    comtypes is a pure Python COM package based on the ctypes ffi foreign
    function library.The comtypes package makes it easy to access and implement
    both custom and dispatch based COM interfaces.While the pywin32 package
    contains superior client side support for dispatch based COM interfaces,it is
    not possible to access custom COM interfaces unless they are wrapped in
    C++-code.
  homepage: http://starship.python.net/crew/theller/comtypes/
  repository: https://github.com/enthought/comtypes/
  documentation: http://pythonhosted.org/comtypes/

extra:
  recipe-maintainers:
    - nehaljwani
