# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.6"

package:
  name: soda-core-scientific
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soda-core-scientific/soda_core_scientific-${{ version }}.tar.gz
  sha256: de975d4127f82a821250cafb4ccc07b8d59e247fe65731e2fd3446f07c719fe0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - soda-core ==3.5.6
    - pandas <2.0.0
    - wheel
    - pydantic <3.0.0,>=2.0.0
    - scipy >=1.8.0
    - numpy <2.0.0,>=1.23.3
    - inflection ==0.5.1
    - httpx <2.0.0,>=0.18.1
    - pyyaml <7.0.0,>=5.4.1
    - cython >=0.22
    - prophet <2.0.0,>=1.1.5

tests:
  - python:
      imports:
        - soda.scientific.anomaly_detection.models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/soda-core-scientific/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

