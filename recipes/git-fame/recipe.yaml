# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: git-fame
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/git-fame/git_fame-${{ version }}.tar.gz
  sha256: 752d30e80eb452c6a3ef32b00a97e8da019706e6ae7a99436f24a7200707423b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}
    - argopt >=0.3.5
    - shtab
    - tabulate
    - tqdm >=4.44.0

tests:
  - python:
      imports:
        - gitfame
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/git-fame/
  license: MPL-2.0
  license_file: LICENSE
  summary: Pretty-print `git` repository collaborators sorted by contributions
  description: |
    Pretty-print `git` repository collaborators sorted by contributions

extra:
  recipe-maintainers:
    - casperdcl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: git-fame
  cfe-upstream-registry: pypi
  cfe-upstream-name: git-fame
