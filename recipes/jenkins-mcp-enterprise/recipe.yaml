# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: jenkins-mcp-enterprise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jenkins-mcp-enterprise/jenkins_mcp_enterprise-${{ version }}.tar.gz
  sha256: f4992d56a19d8425e145bae5b5defb5159cc5a1bacbf9631ccde356362d5b9c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - python-jenkins >=1.8.2
    - requests >=2.31.0
    - tiktoken >=0.5.0
    - apscheduler <4,>=3.11.0
    - modelcontextprotocol >=0.1.0
    - fastapi >=0.100.0
    - uvicorn >=0.23.0
    - httpx <1,>=0.24.0
    - websockets >=11.0
    - sse-starlette >=1.6.0
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - jenkins_mcp_enterprise
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Jordan-Jarvis/jenkins-mcp-enterprise
  license: GPL-3.0-only
  license_file: LICENSE
  summary: MCP server for Jenkins integration with AI assistants, providing build management, log analysis, and failure diagnostics.
  description: |
    MCP server for Jenkins integration with AI assistants, providing build management, log analysis, and failure diagnostics.
  repository: https://github.com/Jordan-Jarvis/jenkins-mcp-enterprise
  documentation: https://github.com/Jordan-Jarvis/jenkins-mcp-enterprise/blob/main/README.md

extra:
  recipe-maintainers:
    - rxm7706

