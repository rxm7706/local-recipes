# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: types-confluent-kafka
  version: ${{ version }}

source:
  url: https://github.com/benbenbang/types-confluent-kafka/archive/refs/tags/${{ version }}.tar.gz
  sha256: 1e05a6da55b83b705764130270090c9e802f8a5e5c8f308ce214e4f1ab6e24ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-confluent-kafka

tests:
  - python:
      imports:
        - types_confluent_kafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/benbenbang/types-confluent-kafka
  license: Apache-2.0
  license_file: LICENSE
  summary: Types for Confluent Kafka
  description: |
    Types for Confluent Kafka
  repository: https://github.com/benbenbang/types-confluent-kafka.git
  documentation: https://benbenbang.github.io/types-confluent-kafka/

extra:
  recipe-maintainers:
    - rxm7706

