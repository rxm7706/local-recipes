# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: financepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/financepy/financepy-${{ version }}.tar.gz
  sha256: d7c32d1a21ad4ea695fbf6a3a5c16ecad1ab31f1e8ed88a194e33036a39a56e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - tomllib
    - numpy <2.4,>=2.3.5
    - scipy <1.17,>=1.16.3
    - pandas <=2.4,>=2.3.3
    - matplotlib-base <3.11,>=3.10.6
    - numba <0.63,>=0.62.1
    - llvmlite <0.46,>=0.45.0

tests:
  - python:
      imports:
        - financepy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/financepy/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Finance Securities Valuation Library
  description: |
    A Finance Securities Valuation Library
  repository: https://github.com/domokane/FinancePy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: financepy
