# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.27.5"

package:
  name: coqui-tts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coqui-tts/coqui_tts-${{ version }}.tar.gz
  sha256: 64304dd6a817c4b56019d53ba65b63e0e25ec1593f4b96f3d40b243daa73bf72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyascii >=0.3.0
    - coqpit-config <0.3.0,>=0.2.0
    - coqui-tts-trainer <0.4.0,>=0.3.0
    - einops >=0.6.0
    - fsspec >=2023.6.0
    - inflect >=5.6.0
    - ko-speech-tools >=0.1.0
    - librosa >=0.11.0
    - matplotlib-base >=3.8.4
    - monotonic-alignment-search >=0.1.0
    - num2words >=0.5.14
    - numba >=0.58.0
    - numpy >=1.26.0
    - packaging >=23.1
    - pysbd >=0.3.4
    - pyyaml >=6.0
    - scipy >=1.13.0
    - soundfile >=0.12.0
    - tqdm >=4.64.1
    - transformers >=4.57
    - typing_extensions >=4.10

tests:
  - python:
      imports:
        - TTS
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/idiap/coqui-ai-TTS
  license: MPL-2.0
  license_file: LICENSE
  summary: Deep learning for Text to Speech.
  description: |
    Deep learning for Text to Speech.
  repository: https://github.com/idiap/coqui-ai-TTS
  documentation: https://coqui-tts.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
