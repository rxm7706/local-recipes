# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: seqeval
  version: "1.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f28e97c3ab96d6fcd32b648f6438ff2e09cfba87f05939da9b3970713ec56e6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
    - setuptools_scm
  run:
    - numpy
    - python >=3.6
    - scikit-learn

tests:
  - python:
      imports:
        - seqeval
        - seqeval.metrics
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Testing framework for sequence labeling
  homepage: https://github.com/chakki-works/seqeval
  repository: https://github.com/chakki-works/seqeval
  documentation: https://pypi.org/project/seqeval/

extra:
  recipe-maintainers:
    - mxr-conda
    - oblute
    - benhuff
