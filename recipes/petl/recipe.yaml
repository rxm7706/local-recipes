# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.23"

package:
  name: petl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/petl/petl-${{ version }}.tar.gz
  sha256: b5c54f281b761f983ca6a4d8bc54fbd7b8285816a03ac0534552bee873c1e655

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - petl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/petl-developers/petl
  license: MIT
  license_file: LICENSE.txt
  summary: A Python package for extracting, transforming and loading tables of data.
  description: |
    A Python package for extracting, transforming and loading tables of data.

extra:
  recipe-maintainers:
    - alimanfoo
    - timbledum
    - juarezr
    - arturponinski

#### CFE metadata AND comments
