# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.42.1"
  min_sqlalchemy: "1.3"
  PYTHON: PYTHON | default("$PYTHON")

recipe:
  name: sqlalchemy-utils-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/S/SQLAlchemy-Utils/sqlalchemy_utils-${{ version }}.tar.gz
  sha256: 881f9cd9e5044dc8f827bccb0425ce2e55490ce44fc0bb848c55cc8ee44cc02e

build:
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

outputs:
  - package:
      name: sqlalchemy-utils-base
    build:
      noarch: python
      script:
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
      run:
        - python >=${{ python_min }}
        - sqlalchemy >=${{ min_sqlalchemy }}
        # technically, python_version<'3.8': not worth the loss of `noarch: python`
        - importlib-metadata
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with no extras)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-arrow
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - arrow >=0.3.4
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[arrow]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-babel
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - babel >=1.3
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[babel]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-color
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - colour >=0.0.4
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[color]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-encrypted
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - cryptography >=0.6
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[encrypted]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-intervals
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - intervals >=0.7.1
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[intervals]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-password
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - passlib >=1.6,<2.0
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[password]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-pendulum
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - pendulum >=2.0.5
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[pendulum]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-phone
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - phonenumbers >=5.9.2
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[phone]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-timezone
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - python-dateutil
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[timezone]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils-url
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - furl >=0.4.1
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with `[url]` extra)
      homepage: https://github.com/kvesteri/sqlalchemy-utils
  - package:
      name: sqlalchemy-utils
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("sqlalchemy-utils-base", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-arrow", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-babel", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-color", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-encrypted", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-intervals", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-password", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-pendulum", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-phone", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-timezone", upper_bound="x.x.x") }}
        - ${{ pin_subpackage("sqlalchemy-utils-url", upper_bound="x.x.x") }}
    tests:
      - python:
          imports:
            - sqlalchemy_utils
          pip_check: true
          python_version: ${{ python_min }}
    about:
      license_file: LICENSE
      license: BSD-3-Clause
      summary: Various utility functions for SQLAlchemy (with all extras)
      homepage: https://github.com/kvesteri/sqlalchemy-utils

about:
  license_file: LICENSE
  license: BSD-3-Clause
  summary: Various utility functions for SQLAlchemy
  homepage: https://github.com/kvesteri/sqlalchemy-utils
  repository: https://github.com/kvesteri/sqlalchemy-utils
  documentation: https://sqlalchemy-utils.readthedocs.io

extra:
  feedstock-name: sqlalchemy-utils
  recipe-maintainers:
    - lvoliveira
    - xmnlab
    - bollwyvl
