# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.42.1"

package:
  name: sqlalchemy-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SQLAlchemy-Utils/sqlalchemy_utils-${{ version }}.tar.gz
  sha256: 881f9cd9e5044dc8f827bccb0425ce2e55490ce44fc0bb848c55cc8ee44cc02e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4

tests:
  - python:
      imports:
        - sqlalchemy_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kvesteri/sqlalchemy-utils
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Various utility functions for SQLAlchemy.
  description: |
    Various utility functions for SQLAlchemy.

extra:
  recipe-maintainers:
    - lvoliveira
    - xmnlab
    - bollwyvl

