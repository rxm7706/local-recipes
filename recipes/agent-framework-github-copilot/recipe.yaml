# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: agent-framework-github-copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-github-copilot/agent_framework_github_copilot-${{ version }}.tar.gz
  sha256: e6237c0950cd52bea025e24688fcb4cb233b00c0d269428d52b312be2bb08987

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4.0
  run:
    - python >=${{ python_min }}
    - agent-framework-core <2,>=1.13.0
    - github-copilot-sdk ==1.0.2

tests:
  - python:
      imports:
        - agent_framework_github_copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://aka.ms/agent-framework
  license: MIT
  license_file: LICENSE
  summary: GitHub Copilot integration for Microsoft Agent Framework.
  description: |
    GitHub Copilot integration for Microsoft Agent Framework.
  repository: https://github.com/microsoft/agent-framework/tree/main/python

extra:
  recipe-maintainers:
    - rxm7706

