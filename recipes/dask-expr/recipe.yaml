# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: dask-expr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dask-expr/dask_expr-${{ version }}.tar.gz
  sha256: e6d5a7bdff927aa4a1754a76cad79c5925254c525f568038df7832fcd558fc11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.6
  run:
    - python >=${{ python_min }}
    - dask >=2025.1.0

tests:
  - python:
      imports:
        - dask_expr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dask-expr/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: High Level Expressions for Dask
  description: |
    High Level Expressions for Dask

extra:
  recipe-maintainers:
    - fjetter
    - phofl
    - jrbourbeau

#### CFE metadata AND comments
