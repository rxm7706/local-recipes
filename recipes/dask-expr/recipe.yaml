# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.10"
  name: dask-expr
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dask_expr-${{ version }}.tar.gz
  sha256: e6d5a7bdff927aa4a1754a76cad79c5925254c525f568038df7832fcd558fc11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools >=62.6
    - versioneer =0.28
    - tomli
  run:
    - python >=${{ python_min }}
    - dask-core >=2025.1.0

tests:
  - python:
      imports:
        - dask_expr
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: High Level Expressions for Dask
  description: |
    High Level Expressions for Dask
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/dask/dask-expr
  repository: https://github.com/dask/dask-expr
  documentation: https://github.com/dask/dask-expr/blob/main/README.md

extra:
  recipe-maintainers:
    - fjetter
    - phofl
    - jrbourbeau
