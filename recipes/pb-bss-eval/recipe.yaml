# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: pb-bss-eval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pb-bss-eval/pb_bss_eval-${{ version }}.tar.gz
  sha256: 395fbcabc9d3be66490131a67a122d08d4c2cdb88b2ddcd7a4120664c33c6d38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cached_property
    - einops
    - pystoi
    - mir_eval
    - pesq

tests:
  - python:
      imports:
        - pb_bss_eval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pb-bss-eval/
  license: MIT
  license_file: LICENSE
  summary: EM algorithms for integrated spatial and spectral models.
  description: |
    EM algorithms for integrated spatial and spectral models.

extra:
  recipe-maintainers:
    - rxm7706

