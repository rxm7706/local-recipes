# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: docx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docx/docx-${{ version }}.tar.gz
  sha256: 9d7595eac6e86cda0b7136a2995318d039c1f3eaa368a3300805abbbe5dc8877

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - docx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mikemaccana/python-docx
  license: MIT
  license_file: LICENSE
  summary: The docx module creates, reads and writes Microsoft Office Word 2007 docx files
  description: |
    The docx module creates, reads and writes Microsoft Office Word 2007 docx files

extra:
  recipe-maintainers:
    - rxm7706

