# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: mindsdb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/MindsDB/mindsdb-${{ version }}.tar.gz
  sha256: c432af75d989f3ae70dbaf93079f2decdf44532de9102d4ccb9d1260b6c3659c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - packaging
    - flask ==3.1.3
    - werkzeug ==3.1.6
    - flask-restx <2.0.0,>=1.3.0
    - pandas ==2.3.1
    - python-multipart ==0.0.26
    - cryptography >=46.0.5
    - psycopg
    - psutil ~=7.0
    - sqlalchemy <3.0.0,>=2.0.0
    - psycopg2
    - alembic >=1.3.3
    - redis-py ==6.4.0
    - walrus ==0.9.3
    - flask-compress >=1.0.0
    - appdirs >=1.0.0
    - mindsdb-sql-parser ~=0.13.8
    - pydantic ==2.12.5
    - requests ==2.33.0
    - dateparser ==1.2.0
    - dill ==0.3.6
    - numpy ~=2.0
    - pytz
    - botocore
    - boto3 >=1.34.131
    - python-dateutil
    - lark
    - prometheus_client ==0.20.0
    - sentry-sdk ==2.14.0
    - pyaml ==23.12.0
    - uvicorn <1.0.0,>=0.30.0
    - a2wsgi ~=1.10.10
    - starlette >=0.49.1
    - sse-starlette ==2.3.3
    - pydantic-core >=2.33.2
    - pyjwt ==2.12.0
    - pymupdf ==1.27.2
    - filetype
    - charset-normalizer
    - openpyxl
    - xlrd >=2.0.1
    - aipdf ==0.0.7.2
    - pyarrow <=19.0.0
    - orjson ==3.11.6
    - mind-castle ==0.5.0
    - pydantic-ai ==1.77.0
    - bs4
    - urllib3 >=2.6.3
    - aiobotocore ==3.4.0
    - google-genai ==1.70.0
    - if: win
      then:
        - python-duckdb

tests:
  - python:
      imports:
        - mindsdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mindsdb/mindsdb
  license: MIT
  license_file: LICENSE
  summary: MindsDB's AI SQL Server enables developers to build AI tools that need access to real-time data to perform their tasks
  description: |
    MindsDB's AI SQL Server enables developers to build AI tools that need access to real-time data to perform their tasks

extra:
  recipe-maintainers:
    - rxm7706

