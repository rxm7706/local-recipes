# CFE comments
# Header:
#    # Packaged in the 2026-07-26 agent-CLI wave alongside caveman / codegraph /
#    # headroom-ai. Same shape as the sibling bmad-code-org content bundles
#    # (bmad-utility-skills, bmad-labs-skills): a noarch:generic skills payload
#    # under share/<name>/ plus a Python installer entry point.
# context:
#    # Snapshot of main at 97ce6f1 (2026-07-24, "Merge PR #8 from
#    # drop-remotion"). CHANGELOG's 2.0.0 section is headed "Unreleased" and
#    # no v2.0.0 tag exists, so the version is marketplace.json's 2.0.0 plus a
#    # .dev0 marker and the source is a commit archive. 2.0.0 consolidates
#    # motion graphics on HyperFrames (Remotion retired), makes the final
#    # render incremental, and adds Windows/Linux/Intel-Mac support. Skills
#    # set is unchanged at 16 mc-*. Switch to the tag archive when v2.0.0
#    # is cut.
# build:
#    # Only skills/ + .claude-plugin/ + README.md + docs/user-guide.md are
#    # packaged. docs/assets/ is 11 MB of marketing media (banner JPEGs and an
#    # MP4) against 1.2 MB of actual skill content — ~10x package bloat for no
#    # functional gain, so it is deliberately excluded.
# about:
#    # Upstream ships its own LICENSE (MIT, Copyright (c) 2026 Brian Madison),
#    # so license_file resolves from the extracted archive — canonical
#    # License-File pattern (1), no vendored copy needed. This is the
#    # difference from bmad-utility-skills, which vendors LICENSE because
#    # upstream has none (and is therefore submission-held).
# requirements:
#    # python is required only by the bmad-manticore-install entry point.
#    # The pipeline's real runtime prerequisites (uv, ffmpeg, node, git) are
#    # NOT declared: the skills are markdown instructions executed by a coding
#    # agent, and the tool set is chosen per-project during mc-setup. Pinning
#    # them here would force an 11-dep install on a documentation payload.
####
