# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.0"

package:
  name: numpydoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numpydoc/numpydoc-${{ version }}.tar.gz
  sha256: 3f7970f6eee30912260a6b31ac72bba2432830cd6722569ec17ee8d3ef5ffa01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - sphinx >=6
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - numpydoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://numpydoc.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Sphinx extension to support docstrings in Numpy format
  description: |
    Sphinx extension to support docstrings in Numpy format
  repository: https://github.com/numpy/numpydoc/

extra:
  recipe-maintainers:
    - jschueller
    - scopatz
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: numpydoc
  cfe-upstream-registry: pypi
  cfe-upstream-name: numpydoc
  cfe-purls:
    - pkg:conda/numpydoc@${{ version }}?channel=conda-forge
    - pkg:pypi/numpydoc@${{ version }}
  cfe-upstream-repo: https://github.com/numpy/numpydoc/
  cfe-upstream-homepage: https://numpydoc.readthedocs.io
  cfe-import-names: [numpydoc]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/numpydoc-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
