# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.0"

package:
  name: dnspython3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dnspython3/dnspython3-1.15.0.zip
  sha256: 6eb9504abafb91cb67ed9dc3d3289a3ccc438533b460eccbf77e36c5323100f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dnspython3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.dnspython.org
  license: http://www.dnspython.org/LICENSE
  license_file: LICENSE
  summary: A DNS toolkit for Python 3.x
  description: |
    A DNS toolkit for Python 3.x

extra:
  recipe-maintainers:
    - rxm7706

