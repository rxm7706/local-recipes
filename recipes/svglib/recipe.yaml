# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: svglib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/svglib/svglib-${{ version }}.tar.gz
  sha256: bde5c5f9b0e091f1e210b8aafdda07a49bd8ebf21c0e90d67383a665c83597ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cssselect2 >=0.2.0
    - lxml >=6.0.0
    - pillow >=9.0.0
    - reportlab >=4.4.3
    - tinycss2 >=0.6.0

tests:
  - python:
      imports:
        - svglib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deeplook/svglib
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: A pure-Python library for reading and converting SVG
  description: |
    A pure-Python library for reading and converting SVG

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: svglib
  cfe-upstream-registry: pypi
  cfe-upstream-name: svglib
