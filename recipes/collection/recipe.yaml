# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: collection
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/collection/collection-${{ version }}.tar.gz
  sha256: c4f93726b9c6bed9bcf31286ab3e660401e856c896e58b56aad477b19aaa61f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - collection
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thenerdscribe/collection
  license: MIT
  license_file: LICENSE
  summary: Laravel-style collection class that provides an interface for pipeline programming
  description: |
    Laravel-style collection class that provides an interface for pipeline programming

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
