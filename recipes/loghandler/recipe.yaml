# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: loghandler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/loghandler/loghandler-${{ version }}.tar.gz
  sha256: ec4b79ab253e7275762ecc7fe7731275bbeaebcf0c6d1e23d72b795e823fa9cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - rich
    - requests
    - elasticsearch
    - sqlalchemy
    - pymysql
    - psycopg2
    - cryptography

tests:
  - python:
      imports:
        - loghandler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/math280h/loghandler
  license: MIT
  license_file: LICENSE
  summary: Python logging library with support for multiple destinations
  description: |
    Python logging library with support for multiple destinations

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: loghandler
  cfe-upstream-registry: pypi
  cfe-upstream-name: loghandler
