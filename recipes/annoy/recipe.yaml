# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.3"

package:
  name: annoy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/annoy/annoy-${{ version }}.tar.gz
  sha256: 9cbfebefe0a5f843eba29c6be4c84d601f4f41ad4ded0486f1b88c3b07739c15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - annoy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spotify/annoy
  license: Apache-2.0
  license_file: LICENSE
  summary: Approximate Nearest Neighbors in C++/Python optimized for memory usage and loading/saving to disk.
  description: |
    Approximate Nearest Neighbors in C++/Python optimized for memory usage and loading/saving to disk.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
