    - pkg:pypi/itypes@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/PavanTatikonda/itypes
  cfe-import-names: [itypes]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/itypes-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.2.0

  cfe-forge-blocker-list:
