# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: itypes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/itypes/itypes-${{ version }}.tar.gz
  sha256: af886f129dea4a2a1e3d36595a2d139589e4dd287f5cab0b40e799ee81570ff1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - itypes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/PavanTatikonda/itypes
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple immutable types for python.
  description: |
    Simple immutable types for python.

extra:
  recipe-maintainers:
    - scopatz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: itypes
  cfe-upstream-registry: pypi
  cfe-upstream-name: itypes
