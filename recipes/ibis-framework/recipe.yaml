# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.0.0"

package:
  name: ibis-framework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ibis-framework/ibis_framework-${{ version }}.tar.gz
  sha256: 238624f2c14fdab8382ca2f4f667c3cdb81e29844cd5f8db8a325d0743767c61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - atpublic >=2.3
    - parsy >=2
    - python-dateutil >=2.8.2
    - sqlglot !=26.32.0,>=23.4
    - toolz >=0.11
    - typing_extensions >=4.3.0
    - python-tzdata >=2022.7

tests:
  - python:
      imports:
        - ibis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ibis-project.org
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: The portable Python dataframe library
  description: |
    The portable Python dataframe library
  repository: https://github.com/ibis-project/ibis
  documentation: https://ibis-project.org

extra:
  recipe-maintainers:
    - jreback
    - xmnlab
    - datapythonista
    - cpcloud
    - gforsyth

#### CFE metadata AND comments
