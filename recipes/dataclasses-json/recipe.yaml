# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.7"

package:
  name: dataclasses-json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dataclasses-json/dataclasses_json-${{ version }}.tar.gz
  sha256: b6b3e528266ea45b9535223bc53ca645f5208833c29229e847b3f26a1cc55fc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.2.0
    - poetry-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - marshmallow <4.0.0,>=3.18.0
    - typing_inspect <1,>=0.4.0

tests:
  - python:
      imports:
        - dataclasses_json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lidatong/dataclasses-json
  license: MIT
  license_file: LICENSE
  summary: Easily serialize dataclasses to and from JSON.
  description: |
    Easily serialize dataclasses to and from JSON.
  repository: https://github.com/lidatong/dataclasses-json
  documentation: https://lidatong.github.io/dataclasses-json/

extra:
  recipe-maintainers:
    - oblute
    - rluria14
    - ndmaxar
    - mxr-conda
    - rxm7706

