{% set name = "pysqlite3" %}
{% set version = "0.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pysqlite3-{{ version }}.tar.gz
  sha256: dd7d2b7f3a29aebdbf569c359658b091d3345b5691d9ea765a5c3febe8872bf9

build:
  noarch: generic
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - sqlite
  host:
    - pip
    - python >=3.8
    - sqlite
    - setuptools
  run:
    - python >=3.8
    - sqlite

test:
  imports:
    - pysqlite3
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/coleifer/pysqlite3
  summary: DB-API 2.0 interface for Sqlite 3.x
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - psortos
    - rxm7706
    - mxr-conda
