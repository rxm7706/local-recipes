# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.0"

package:
  name: pyaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyaml/pyaml-${{ version }}.tar.gz
  sha256: 11cda3a796efc6dbce0d56836be56cfd26289dad07bcd78e9904086729929c93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - pyaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mk-fg/pretty-yaml
  license: WTFPL
  license_file: LICENSE
  summary: PyYAML-based module to produce a bit more pretty and readable YAML-serialized data
  description: |
    PyYAML-based module to produce a bit more pretty and readable YAML-serialized data

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyaml
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyaml
  cfe-purls:
    - pkg:conda/pyaml@${{ version }}?channel=conda-forge
    - pkg:pypi/pyaml@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/mk-fg/pretty-yaml
  cfe-import-names: [pyaml]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pyaml-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-26.7.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

