# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: calc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/calc/calc-1.0.zip
  sha256: a04b54a0b894792e27e1a2d82b629d0d3da3dcc36e064d49746063b99cc653d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - calc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: NONE
  license: UNKNOWN
  license_file: LICENSE
  summary: A simple module with the basic functions of a calculator and the calculator itself.
  description: |
    A simple module with the basic functions of a calculator and the calculator itself.

extra:
  recipe-maintainers:
    - rxm7706

