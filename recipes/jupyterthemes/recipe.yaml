# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: jupyterthemes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterthemes/jupyterthemes-${{ version }}.tar.gz
  sha256: 2a8ebc0c84b212ab99b9f1757fc0582a3f53930d3a75b2492d91a7c8b36ab41e

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - jupyter-theme = jupyterthemes:main
      - jt = jupyterthemes:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - jupyter_core
    - ipython >=5.4.1
    - matplotlib-base >=1.4.3
    - lesscpy >=0.11.2

tests:
  - python:
      imports:
        - jupyterthemes
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - jupyter-theme --help
      - jt --help

about:
  license_file: LICENSE.txt
  license: MIT
  summary: Select and install a Jupyter notebook theme
  homepage: https://github.com/dunovank/jupyter-themes
  repository: https://github.com/dunovank/jupyter-themes
  documentation: https://github.com/dunovank/jupyter-themes

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
