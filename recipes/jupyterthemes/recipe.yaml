# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: jupyterthemes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterthemes/jupyterthemes-${{ version }}.tar.gz
  sha256: 2a8ebc0c84b212ab99b9f1757fc0582a3f53930d3a75b2492d91a7c8b36ab41e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter-core
    - notebook
    - ipython
    - matplotlib-base
    - lesscpy

tests:
  - python:
      imports:
        - jupyterthemes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dunovank/jupyter-themes
  license: MIT
  license_file: LICENSE.txt
  summary: Select and install a Jupyter notebook theme
  description: |
    Select and install a Jupyter notebook theme

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
