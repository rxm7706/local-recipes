# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: pytest-astropy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-astropy/pytest_astropy-${{ version }}.tar.gz
  sha256: 0bdff1fa67a7856ec899c6f7810a86911253d76201a30822d7e4ef14b671bdc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - pytest-doctestplus >=1.0.0
    - pytest-remotedata >=0.4.1
    - pytest-astropy-header >=0.2.2
    - pytest-arraydiff >=0.5
    - pytest-filter-subpackage >=0.1.2
    - pytest-cov >=2.3.1
    - pytest-mock >=2.0
    - pytest-skip-slow ==1.1.0
    - hypothesis >=5.1

tests:
  - python:
      imports:
        - pytest_astropy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-astropy
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Meta-package containing dependencies for testing
  description: |
    Meta-package containing dependencies for testing

extra:
  recipe-maintainers:
    - astrofrog
    - drdavella
    - mwcraig

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytest-astropy
  cfe-upstream-registry: pypi
  cfe-upstream-name: pytest-astropy
  cfe-purls:
    - pkg:conda/pytest-astropy@${{ version }}?channel=conda-forge
    - pkg:pypi/pytest-astropy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/astropy/pytest-astropy
  cfe-import-names: [pytest_astropy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pytest-astropy-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.12.0

  cfe-forge-blocker-list:
