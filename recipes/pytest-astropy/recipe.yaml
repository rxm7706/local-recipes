# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-astropy
  version: "0.11.0"
  git_url: https://github.com/astropy/pytest-astropy
  sha256: 4eaeaa99ed91163ed8f9aac132c70a81f25bc4c12f3cd54dba329fc26c6739b5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - pytest-doctestplus >=1.0.0
    - pytest-remotedata >=0.4.1
    - pytest-astropy-header >=0.2.2
    - pytest-arraydiff >=0.5
    - pytest-filter-subpackage >=0.1.2
    - pytest-cov >=2.3.1
    - pytest-mock >=2.0
    - attrs >=19.2.0
    - hypothesis >=5.1

tests:
  - python:
      imports:
        - pytest_remotedata
        - pytest_doctestplus
        - pytest_arraydiff
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Meta-package containing dependencies for testing Astropy
  description: |
    This is a meta-package that pulls in the dependencies that are used by
    astropy and some affiliated packages for testing. It can also be used for
    testing packages that are not affiliated with the Astropy project.
  homepage: ${{ git_url }}
  repository: ${{ git_url }}
  documentation: ${{ git_url }}

extra:
  recipe-maintainers:
    - astrofrog
    - drdavella
    - mwcraig
