# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: genie.trafficgen
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/genie.trafficgen/genie_trafficgen-26.7-py3-none-any.whl
  sha256: e3c318aa4ac1d225dbb136d6158c207b986bcdaee9c53c06581e0c07722e2132

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - genie
    - unicon
    - prettytable
    - ixnetwork
    - ixnetwork-restpy
    - setuptools
    - wheel
    - stcrestclient

tests:
  - python:
      imports:
        - genie.trafficgen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats
  license: Apache-2.0
  license_file: LICENSE
  summary: Genie Library for traffic generator connection support
  description: |
    Genie Library for traffic generator connection support

extra:
  recipe-maintainers:
    - rxm7706

