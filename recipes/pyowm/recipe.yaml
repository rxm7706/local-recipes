# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.0"

package:
  name: pyowm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyowm/pyowm-${{ version }}.tar.gz
  sha256: 9a44d6d43941419a73fd9dbe16066ad8a25204ea906774fd5bf5b0ec52d2a1a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.20.0
    - geojson <4,>=2.3.0
    - pysocks <2,>=1.7.1

tests:
  - python:
      imports:
        - pyowm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/csparpa/pyowm
  license: MIT
  license_file: LICENSE
  summary: A Python wrapper around OpenWeatherMap web APIs
  description: |
    A Python wrapper around OpenWeatherMap web APIs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyowm
