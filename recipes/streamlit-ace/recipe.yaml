# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: streamlit-ace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-ace/streamlit_ace-${{ version }}.tar.gz
  sha256: 1852fa19707685fd4241be9256c1ab1a89da4a3b8c28ab286e3bff122d3a1686

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_ace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://share.streamlit.io/okld/streamlit-gallery/main?p=ace-editor
  license: MIT
  license_file: LICENSE
  summary: Ace editor component for Streamlit.
  description: |
    Ace editor component for Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
