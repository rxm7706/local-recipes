# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.0.1"

package:
  name: aniso8601
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aniso8601/aniso8601-${{ version }}.tar.gz
  sha256: 25488f8663dd1528ae1f54f94ac1ea51ae25b4d531539b8bc707fed184d16845

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aniso8601
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://codeberg.org/nielsenb-jf/aniso8601
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A library for parsing ISO 8601 strings.
  description: |
    A library for parsing ISO 8601 strings.
  repository: https://codeberg.org/nielsenb-jf/aniso8601
  documentation: https://aniso8601.readthedocs.io/

extra:
  recipe-maintainers:
    - vamega
    - killua156

