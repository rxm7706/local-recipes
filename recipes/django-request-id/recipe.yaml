# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: django-request-id
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-request-id/django-request-id-${{ version }}.tar.gz
  sha256: 0eb7ef17e21ff5efe5014e5b3cc6d22fc3396d4ea9d5b353bba2c43107998368

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - request_id
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nigma/django-request-id
  license: MIT
  license_file: LICENSE
  summary: Augment each request with unique id for logging purposes
  description: |
    Augment each request with unique id for logging purposes

extra:
  recipe-maintainers:
    - cshaley

