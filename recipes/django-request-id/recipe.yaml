# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-request-id
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/django-request-id-${{ version }}.tar.gz
  sha256: 0eb7ef17e21ff5efe5014e5b3cc6d22fc3396d4ea9d5b353bba2c43107998368

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - django
    - python >=3.6

tests:
  - python:
      imports:
        - request_id
      pip_check: true

about:
  summary: Augment each request with unique id for logging purposes
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/nigma/django-request-id

extra:
  recipe-maintainers:
    - cshaley
