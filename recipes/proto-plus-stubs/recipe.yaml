# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: proto-plus-stubs
  version: ${{ version }}

source:
  url: https://github.com/henribru/proto-plus-stubs/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9dbf52b6149803b7043521390786fc255a5b02278d72ce375eb0f0d9622134c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - proto-plus-stubs
    - proto-plus
    - types-protobuf

tests:
  - python:
      imports:
        - proto_plus_stubs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/henribru/proto-plus-stubs
  license: Apache-2.0
  license_file: LICENSE
  summary: Type stubs for proto-plus
  description: |
    Type stubs for proto-plus
  repository: https://github.com/henribru/proto-plus-stubs

extra:
  recipe-maintainers:
    - rxm7706

