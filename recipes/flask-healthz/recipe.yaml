# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: flask-healthz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-healthz/flask_healthz-${{ version }}.tar.gz
  sha256: 3b25bfd8606950a77632925cfbbf19cac20650be51fc0efbe78c387e559e2541

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_healthz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fedora-infra/flask-healthz
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A simple module to allow you to easily add health endpoints to your Flask application
  description: |
    A simple module to allow you to easily add health endpoints to your Flask application
  repository: https://github.com/fedora-infra/flask-healthz

extra:
  recipe-maintainers:
    - rxm7706

