# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: async-dns
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/async-dns/async_dns-${{ version }}.tar.gz
  sha256: 4067352e80000881a959f1ac9d3764cef16fdeb44beb356cdb4ec690f8c45f48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - async_dns
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/async-dns/
  license: MIT
  license_file: LICENSE
  summary: Asynchronous DNS client and server
  description: |
    Asynchronous DNS client and server
  repository: https://github.com/gera2ld/async_dns

extra:
  recipe-maintainers:
    - rxm7706

