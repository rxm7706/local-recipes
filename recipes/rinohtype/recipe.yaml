# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.6"

package:
  name: rinohtype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rinohtype/rinohtype-${{ version }}.tar.gz
  sha256: e9392bd4e9117f5bef1285b81d6420183df5393aed289b176f7a81b6c9646d15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.8
  run:
    - python >=${{ python_min }}
    - appdirs <2.0.0,>=1.4.3
    - docutils >=0.18
    - myst-parser >=0.18.1
    - packaging >=14.0
    - rinoh-typeface-dejavuserif <0.2.0,>=0.1.3
    - rinoh-typeface-texgyrecursor <0.2.0,>=0.1.1
    - rinoh-typeface-texgyreheros <0.2.0,>=0.1.1
    - rinoh-typeface-texgyrepagella <0.2.0,>=0.1.1

tests:
  - python:
      imports:
        - rinoh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/brechtm/rinohtype
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: The Python document processor
  description: |
    The Python document processor
  repository: https://github.com/brechtm/rinohtype
  documentation: http://www.mos6581.org/rinohtype/master

extra:
  recipe-maintainers:
    - mediocretech

