# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: streamlit-image-coordinates
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-image-coordinates/streamlit_image_coordinates-${{ version }}.tar.gz
  sha256: 206795398525adeb4288aec983620377d6d700e16789dda26f4ad5c3ce14dad9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.4,<0.9.0
  run:
    - python >=${{ python_min }}
    - streamlit >=1.34

tests:
  - python:
      imports:
        - streamlit_image_coordinates
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-image-coordinates/
  license: MIT
  license_file: LICENSE
  summary: Streamlit component that displays an image and returns the coordinates when you click on it
  description: |
    Streamlit component that displays an image and returns the coordinates when you click on it

extra:
  recipe-maintainers:
    - rxm7706

