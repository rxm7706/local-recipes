# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pysoundcard
  version: "0.4.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soundcard/soundcard-${{ version }}.tar.gz
  sha256: 9b46d64a26f97cd7d88bcfc385c97c069f97c5ec3404e4e7c23771598a8cf47b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - if: linux
      then: __linux
    - if: osx
      then: __osx
    - if: win
      then: __win
    - if: linux
      then: pulseaudio
    - numpy >=1.11
    - cffi

tests:
  - python:
      imports:
        - soundcard
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Play and record audio without resorting to CPython extensions
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/bastibe/SoundCard

extra:
  recipe-maintainers:
    - jan-janssen
