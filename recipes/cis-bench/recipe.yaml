# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"
  python_min: "3.12"

package:
  name: cis-bench
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cis-bench/cis_bench-${{ version }}.tar.gz
  sha256: ff8d5330fde150a1e62dcef17f18f7baa38e80b883099cba9a43f68f74488508

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0.0
    - python-semantic-release >=9.0.0
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - beautifulsoup4 >=4.12.2
    - urllib3 >=2.0.6
    - pydantic >=2.0.0
    - sqlmodel >=0.0.16
    - alembic >=1.13.0
    - click >=8.1.0
    - rich >=13.7.0
    - questionary >=2.0.0
    - browser-cookie3 >=0.19.0
    - truststore >=0.8.0
    - python-dotenv >=1.0.0
    - pyyaml >=6.0.0
    - xsdata >=24.0.0
    - lxml >=5.0.0

tests:
  - python:
      imports:
        - cis_bench
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mitre/cis-bench
  license: Apache-2.0
  license_file: LICENSE
  summary: CLI tool for fetching and managing CIS benchmarks from CIS WorkBench
  description: |
    CLI tool for fetching and managing CIS benchmarks from CIS WorkBench
  repository: https://github.com/mitre/cis-bench
  documentation: https://mitre.github.io/cis-bench

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cis-bench
  cfe-upstream-registry: pypi
  cfe-upstream-name: cis-bench
  cfe-purls:
    - pkg:conda/cis-bench@${{ version }}?channel=conda-forge
    - pkg:pypi/cis-bench@${{ version }}
  cfe-upstream-repo: https://github.com/mitre/cis-bench
  cfe-upstream-homepage: https://github.com/mitre/cis-bench
  cfe-import-names: [cis_bench]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
