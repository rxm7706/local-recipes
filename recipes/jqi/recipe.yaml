# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: jqi
  version: ${{ version }}

source:
  url: https://github.com/jan-g/jqi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9b0ca83fe39234c4f3875590d14ef0044d0be271f47f7eb69903ee7b0a80fde2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - argparse-helper >=0.9.1
    - config-dir >=0.0.5
    - parsy
    - prompt-toolkit >=3.0.5
    - pyyaml
    - sh

tests:
  - python:
      imports:
        - jqi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jan-g/jqi
  license: Apache-2.0
  license_file: LICENSE
  summary: An interactive wrapper for jq
  description: |
    An interactive wrapper for jq

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jqi
  cfe-upstream-registry: pypi
  cfe-upstream-name: jqi
  cfe-purls:
    - pkg:conda/jqi@${{ version }}?channel=conda-forge
    - pkg:pypi/jqi@${{ version }}
  cfe-upstream-repo: https://github.com/jan-g/jqi
  cfe-upstream-homepage: https://github.com/jan-g/jqi
  cfe-import-names: [jqi]
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
  cfe-noarch: python
  cfe-pip-check: "true"
