# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rpaframework-pdf
  version: "7.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/rpaframework_pdf-${{ version }}.tar.gz
  sha256: 2b25943eca0bc6b414986243de71ae2db2a94815c3351ee11834be4e651bbe3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.8.0,<4.0.0
    - rpaframework-core >=11.0.0,<12.0.0
    - robotframework >=4.0.0,!=4.0.1,!=6.1.0,<7.0.0
    - robotframework-pythonlibcore >=4.2.0,<5.0.0
    - pdfminer.six 20221105.*
    - pypdf >=3.15.0,<4.0.0
    - fpdf2 >=2.7.3,<3.0.0

tests:
  - python:
      imports:
        - RPA
        - RPA.PDF
      pip_check: true

about:
  summary: PDF library of RPA Framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://rpaframework.org/

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
