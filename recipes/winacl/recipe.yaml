# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.9"

package:
  name: winacl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winacl/winacl-${{ version }}.tar.gz
  sha256: af70c2ec30178bf9e3c8a1c48c25e8781235fe2c1b321adb46e2f2ae1f8d4aab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - cryptography >=38.0.1

tests:
  - python:
      imports:
        - winacl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/winacl
  license: MIT
  license_file: LICENSE
  summary: ACL/ACE/Security Descriptor manipulation library in pure Python
  description: |
    ACL/ACE/Security Descriptor manipulation library in pure Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
