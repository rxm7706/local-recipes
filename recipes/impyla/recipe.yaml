# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.0"

package:
  name: impyla
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/impyla/impyla-${{ version }}.tar.gz
  sha256: 7c0ee0579aab4cbf1a0c1278ed06acdc982369fad0df7d673a009f59d0e04b05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - bitarray
    - thrift >=0.23.0
    - thrift_sasl ==0.4.3
    - pure-sasl >=0.6.2

tests:
  - python:
      imports:
        - impala
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cloudera/impyla
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python client for the Impala distributed query engine
  description: |
    Python client for the Impala distributed query engine
  repository: https://github.com/cloudera/impyla

extra:
  recipe-maintainers:
    - mariusvniekerk
    - wesm
    - kszucs
    - cpcloud

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: impyla
