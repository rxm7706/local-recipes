# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: impyla
  version: "0.24.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/impyla-${{ version }}.tar.gz
  sha256: 7c0ee0579aab4cbf1a0c1278ed06acdc982369fad0df7d673a009f59d0e04b05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.12
    - six
    - bitarray
    - thrift >=0.23.0
    - thrift_sasl ==0.4.3
    # TODO: see https://github.com/cloudera/impyla/issues/471
    - pure-sasl >=0.6.2
    # - thrift-sasl ==0.4.3
    # - kerberos >=1.3.0
    # - python-kerberos >=1.3.0
    # - python-kerberos >=1.3.0
    # - python-kerberos >=1.3.0
    # - python-kerberos >=1.3.0
    # - python-kerberos >=1.3.0

tests:
  - python:
      imports:
        - impala
        - impala.tests
        - impala.thrift
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script: {}

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python client for the Impala distributed query engine
  homepage: https://github.com/cloudera/impyla

extra:
  recipe-maintainers:
    - mariusvniekerk
    - wesm
    - kszucs
    - cpcloud
