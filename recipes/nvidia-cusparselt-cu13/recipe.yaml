# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.1"

package:
  name: nvidia-cusparselt-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cusparselt-cu13/nvidia_cusparselt_cu13-0.9.1-py3-none-manylinux2014_aarch64.whl
  sha256: 49e54b7cecb049b039381d4cb8389afd2f18d83cdca285ba8231ee0ff4341dc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nvidia_cusparselt_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cusparselt
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: NVIDIA cuSPARSELt
  description: |
    NVIDIA cuSPARSELt

extra:
  recipe-maintainers:
    - rxm7706

