# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bigtree
  version: "1.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/kayjan/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6da40ee8f71cc3776d748a042e124352db130199efe5fa1dab3d18400ba4df20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bigtree
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Tree Implementation and Methods for Python, integrated with list, dictionary, pandas and polars DataFrame.
  homepage: https://github.com/kayjan/bigtree
  documentation: https://bigtree.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - kayjan
