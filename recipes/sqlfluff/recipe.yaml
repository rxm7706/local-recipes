# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: sqlfluff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlfluff/sqlfluff-${{ version }}.tar.gz
  sha256: aa647b3721112f1aca581efe8eaa815a332ae214610a0946592f98a19ef1e8cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - platformdirs
    - chardet
    - click <8.5.0
    - colorama >=0.3
    - diff-cover >=2.5.0
    - jinja2
    - pathspec
    - pyyaml >=5.1
    - regex
    - tblib
    - tomli
    - tqdm

tests:
  - python:
      imports:
        - sqlfluff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sqlfluff.com
  license: MIT
  license_file: LICENSE
  summary: The SQL Linter for Humans
  description: |
    The SQL Linter for Humans
  repository: https://github.com/sqlfluff/sqlfluff
  documentation: https://docs.sqlfluff.com

extra:
  recipe-maintainers:
    - svengiegerich
    - borchero
    - thewchan

#### CFE metadata AND comments
