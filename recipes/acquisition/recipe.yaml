# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2"

package:
  name: acquisition
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/Acquisition/acquisition-${{ version }}.tar.gz
  sha256: e06410ff0bb982a0d422cc7dab17d8b6631bfe672e55934f2c62e5da21e0d773

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - extensionclass >=4.2.0
    - zope.interface

tests:
  - python:
      imports:
        - Acquisition
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Acquisition/
  license: ZPL-2.1
  license_file: LICENSE
  summary: Acquisition is a mechanism that allows objects to obtain attributes from the containment hierarchy they're in.
  description: |
    Acquisition is a mechanism that allows objects to obtain attributes from the containment hierarchy they're in.
  repository: https://github.com/zopefoundation/Acquisition

extra:
  recipe-maintainers:
    - rxm7706

