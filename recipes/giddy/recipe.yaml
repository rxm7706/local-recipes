# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.9"
  python_min: "3.12"

package:
  name: giddy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/giddy/giddy-${{ version }}.tar.gz
  sha256: f31d83a3fb9275cc07b71b28512d44626186373485063bf4f28a1990b9f7a2cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - esda <3,>=2.7
    - libpysal >=4.12
    - mapclassify >=2.7
    - quantecon >=0.8
    - scipy >=1.14
    - seaborn-base
    - matplotlib-base

tests:
  - python:
      imports:
        - giddy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/giddy/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: PySAL-giddy for exploratory spatiotemporal data analysis
  description: |
    PySAL-giddy for exploratory spatiotemporal data analysis
  repository: https://github.com/pysal/giddy

extra:
  recipe-maintainers:
    - weikang9009
    - knaaptime
    - sjsrey
    - jGaboardi
    - martinfleis

