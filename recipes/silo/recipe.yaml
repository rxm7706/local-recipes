#    # CAP-2). pgsty/silo is a maintained fork of the MinIO server codebase --
#    # same S3/IAM API, same on-disk format, same MINIO_* env vars -- born
#    # because upstream MinIO gutted its own community edition (no free
#    # console, no prebuilt community binaries) in 2026. No conda-forge
#    # feedstock exists (lookup_feedstock confirmed live 2026-09-10). Default
#    # local-dev object-storage backend for Story 50.2; Garage is the
#    # pluggable alternative (already on conda-forge).
#    # cfe-on-conda-forge-status: pending-submission-to-conda-forge -- this
#    # story publishes to the SelfExplainML anaconda.org channel only; a
#    # genuine conda-forge/staged-recipes submission is a separate, later
#    # follow-up per this story's own spec, not part of this story's scope.
# source:
#    # version = the timestamp-based version embedded in the .deb/.rpm asset
#    # filenames (20260903131801.0.0), NOT the release_tag string itself
#    # (RELEASE.2026-09-03T13-18-01Z has no dots/digits shape conda accepts
#    # as a version). release_tag is carried separately in context: to build
#    # the real GitHub release download URL. sha256 values verified live via
#    # the release's own *_checksums.txt (cross-checked against a direct
#    # sha256sum of the fetched linux_amd64 archive -- byte-identical).
#    # win-arm64 asset exists upstream but is not templated here -- outside
#    # this story's platform scope (linux-64 is the only platform this story
#    # requires green-built-and-tested; the other 4 selectors are speculative
#    # coverage for Story 50.2's cross-platform local-dev tooling, unbuilt
#    # and unverified beyond sha256).
# build:
#    # No compiler() / stdlib() -- nothing is compiled from source; this is a
#    # pure binary repackage (see about.description for why: GoReleaser +
#    # embedded web-console assets, no conda-forge Go toolchain path).
#    # requirements: {} is deliberate -- the binary is fully static (`file`
#    # confirms "statically linked"), so there is no runtime dependency to
#    # declare.
# about:
#    # License verified live from the release archive's own LICENSE (AGPL-3.0,
#    # OSI-approved -- NOT the same non-OSI-license-blocker class as BUSL/SSPL)
#    # + NOTICE (MinIO copyright + Silo's own modification notice). Both
#    # shipped per the canonical License-File pattern (archive ships them,
#    # license_file points at the extracted paths).
