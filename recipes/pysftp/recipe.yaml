# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.9"

package:
  name: pysftp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysftp/pysftp-${{ version }}.tar.gz
  sha256: fbf55a802e74d663673400acd92d5373c1c7ee94d765b428d9f977567ac4854a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paramiko

tests:
  - python:
      imports:
        - pysftp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/dundeemt/pysftp
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A friendly face on SFTP
  description: |
    A friendly face on SFTP

extra:
  recipe-maintainers:
    - shaunwbell

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysftp
  cfe-upstream-registry: pypi
  cfe-upstream-name: pysftp
  cfe-purls:
    - pkg:conda/pysftp@${{ version }}?channel=conda-forge
    - pkg:pypi/pysftp@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://bitbucket.org/dundeemt/pysftp
  cfe-import-names: [pysftp]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pysftp-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.9

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T04:02:05Z
