# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pysher
  version: "1.0.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/Pysher-${{ version }}.tar.gz
  sha256: 7849c56032b208e49df67d7bd8d49029a69042ab0bb45b2ed59fa08f11ac5988

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - websocket-client !=0.49
    - requests >=2.26.0

tests:
  - python:
      imports:
        - pysher
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pusher websocket client for python, based on Erik Kulyk's PythonPusherClient
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/deepbrook/Pysher

extra:
  recipe-maintainers:
    - jan-janssen
