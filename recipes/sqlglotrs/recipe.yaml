# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sqlglotrs
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlglotrs-${{ version }}.tar.gz
  sha256: 28d1ecc8afc6323a537d74df8c5f4545641742cf9b965813de1fb72ddc1bfe5c

build:
  number: 0
  script:
    - if: build_platform != target_platform
      then: cargo patch
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.4,<2.0
        - cargo-patch
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.4,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - sqlglotrs
      pip_check: true

about:
  summary: SQLGlot tokenizer implementation in Rust
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE
  homepage: https://github.com/tobymao/sqlglot
  repository: https://github.com/tobymao/sqlglot/tree/main/sqlglotrs

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sqlglotrs
  cfe-upstream-registry: pypi
  cfe-upstream-name: sqlglotrs
  cfe-purls:
    - pkg:conda/sqlglotrs@${{ version }}?channel=conda-forge
    - pkg:pypi/sqlglotrs@${{ version }}
  cfe-upstream-repo: https://github.com/tobymao/sqlglot
  cfe-upstream-homepage: https://sqlglot.com/
  cfe-import-names: [sqlglotrs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sqlglotrs-feedstock
  cfe-forge-recipe-updates-needed: [reshape-to-noarch-python-stub, version-bump-to-0.13.0]
  cfe-forge-blocker-list: ["feedstock#48 red: recipe still Rust-shaped for what is now a pure-python deprecation stub — reshape diff verified locally"]
