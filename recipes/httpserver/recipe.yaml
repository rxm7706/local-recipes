# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: httpserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpserver/httpserver-${{ version }}.tar.gz
  sha256: 5bc3daf82512f2f0b311cca68d8ea7a3918c7520d266ce1b8660ed46c478c2e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - httpserver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thomwiggers/httpserver
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Asyncio implementation of an HTTP server
  description: |
    Asyncio implementation of an HTTP server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: httpserver
  cfe-upstream-registry: pypi
  cfe-upstream-name: httpserver
