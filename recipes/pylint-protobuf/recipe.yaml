# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.22.0"

package:
  name: pylint-protobuf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-protobuf/pylint-protobuf-${{ version }}.tar.gz
  sha256: fd569200698cf30cb85f13cc5cfff40c49285599bc972b455e932c1805216a11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astroid
    - pylint
    - protobuf

tests:
  - python:
      imports:
        - pylint_protobuf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nelfin/pylint-protobuf
  license: MIT
  license_file: LICENSE
  summary: A plugin for making Pylint aware of the fields of protobuf-generated classes
  description: |
    A plugin for making Pylint aware of the fields of protobuf-generated classes

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
