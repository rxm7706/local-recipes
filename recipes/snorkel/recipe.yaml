# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: snorkel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snorkel/snorkel-${{ version }}.tar.gz
  sha256: b1f36412430a810124cc0aac432fa29f41960cff2d9804d3816f9d9d0d6d44ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.2
    - wheel >=0.30.0
  run:
    - python >=${{ python_min }}
    - munkres
    - numpy
    - scipy
    - pandas
    - tqdm
    - scikit-learn
    - pytorch
    - tensorboard
    - protobuf
    - networkx

tests:
  - python:
      imports:
        - snorkel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://snorkel.org
  license: Apache-2.0
  license_file: LICENSE
  summary: A system for quickly generating training data with weak supervision
  description: |
    A system for quickly generating training data with weak supervision
  repository: https://github.com/snorkel-team/snorkel/

extra:
  recipe-maintainers:
    - mxr-conda
    - henryre
    - vincentschen
    - bhancock8
    - oblute
    - rluria14

