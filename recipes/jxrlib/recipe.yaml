# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: jxrlib
  version: ${{ version }}

source:
  url: http://http.debian.net/debian/pool/main/j/jxrlib/jxrlib_${{ version }}.orig.tar.gz
  sha256: c7287b86780befa0914f2eeb8be2ac83e672ebd4bd16dc5574a36a59d9708303
  patches:
    - if: unix
      then: usecmake.patch
    - define_byteswap.patch

build:
  number: 3

requirements:
  build:
    - ${{ compiler('c') }}
    - if: unix
      then: cmake
    - if: unix
      then: make
  run_exports:
    - ${{ pin_subpackage('jxrlib', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -f ${PREFIX}/lib/libjxrglue${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/lib/libjpegxr${SHLIB_EXT}
      - if: win
        then: if not exist %LIBRARY_LIB%\\libjxrglue.lib exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\\libjpegxr.lib exit 1

about:
  license: BSD-2-Clause
  summary: jxrlib - JPEG XR Library by Microsoft, built from Debian hosted sources.
  description: This package seems to be no longer maintained by the original developer (Microsoft).
  license_file: LICENSE
  homepage: https://packages.debian.org/source/sid/jxrlib

extra:
  recipe-maintainers:
    - csachs
    - hmaarrfk
