# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.4"

package:
  name: os-sys
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/os-sys/os_sys-${{ version }}.tar.gz
  sha256: cb2a44002a5b01cf2536c2177967ce613c6fd6daaad5c44f235d3f0a8837c207

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wmi
    - pygubu
    - pytz
    - sqlparse
    - progress
    - tqdm
    - progressbar
    - matplotlib-base
    - numpy
    - six
    - jupyter
    - pandas
    - beautifulsoup4
    - eel
    - extract-zip
    - text-editor
    - tuspy
    - requests-download
    - requests
    - send2trash
    - tornado
    - pyspeedtest
    - pytest
    - wifi
    - pyinstaller
    - auto-py-to-exe
    - django
    - mysql-connector
    - geocoder
    - selenium
    - psutil
    - pynput
    - pythongui
    - pypiwin32
    - pyvalid
    - netifaces
    - cefpython3
    - mathparse
    - nltk
    - pint
    - python-dateutil
    - pyyaml
    - spacy
    - sqlalchemy
    - os-sys-php

tests:
  - python:
      imports:
        - bars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Matthijs990/os-sys-github/
  license: MIT
  license_file: LICENSE
  summary: a big lib with many usefull tools and it are not only os and sys tools...
  description: |
    a big lib with many usefull tools and it are not only os and sys tools...

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
