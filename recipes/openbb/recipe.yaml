# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.7.2"

package:
  name: openbb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb/openbb-${{ version }}.tar.gz
  sha256: 24ca5e5c7a6c71423cf5947a0ed300c98c4033d4c8f1c30a5cd5e44b76b3476e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-benzinga <2.0.0,>=1.6.1
    - openbb-bls <2.0.0,>=1.3.1
    - openbb-cftc <2.0.0,>=1.4.1
    - openbb-commodity <2.0.0,>=1.5.2
    - openbb-congress-gov <2.0.0,>=1.2.3
    - openbb-core <2.0.0,>=1.6.10
    - openbb-crypto <2.0.0,>=1.6.2
    - openbb-currency <2.0.0,>=1.6.2
    - openbb-derivatives <2.0.0,>=1.6.2
    - openbb-econdb <2.0.0,>=1.5.1
    - openbb-economy <2.0.0,>=1.6.2
    - openbb-equity <2.0.0,>=1.6.2
    - openbb-etf <2.0.0,>=1.6.2
    - openbb-federal-reserve <2.0.0,>=1.6.2
    - openbb-fixedincome <2.0.0,>=1.6.2
    - openbb-fmp <2.0.0,>=1.6.1
    - openbb-fred <2.0.0,>=1.6.1
    - openbb-government-us <2.0.0,>=1.6.1
    - openbb-imf <3.0.0,>=2.1.3
    - openbb-index <2.0.0,>=1.6.2
    - openbb-intrinio <2.0.0,>=1.6.1
    - openbb-news <2.0.0,>=1.6.2
    - openbb-oecd <2.0.0,>=1.6.1
    - openbb-platform-api <2.0.0,>=1.3.6
    - openbb-regulators <2.0.0,>=1.6.2
    - openbb-sec <2.0.0,>=1.6.1
    - openbb-tiingo <2.0.0,>=1.6.1
    - openbb-tradingeconomics <2.0.0,>=1.6.1
    - openbb-us-eia <2.0.0,>=1.3.1
    - openbb-yfinance <2.0.0,>=1.6.3

tests:
  - python:
      imports:
        - core.openbb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Investment research for everyone, anywhere.
  description: |
    Investment research for everyone, anywhere.

extra:
  recipe-maintainers:
    - rxm7706

