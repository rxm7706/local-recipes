# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.12"

package:
  name: github-enterprise-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/github-enterprise-mcp/github_enterprise_mcp-${{ version }}.tar.gz
  sha256: b48bb07be5e7907db23f2483b4ef474f593ecc7a49f20dd93c5b0ae4bc9378d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.9.4
    - pygithub >=2.6.0
    - requests >=2.32.0

tests:
  - python:
      imports:
        - github_enterprise_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/github-enterprise-mcp/
  license: MIT
  license_file: LICENSE
  summary: An MCP server for GitHub Enterprise that handles repository access, branch creation, commits, and pushes
  description: |
    An MCP server for GitHub Enterprise that handles repository access, branch creation, commits, and pushes

extra:
  recipe-maintainers:
    - rxm7706

