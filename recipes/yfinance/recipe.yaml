# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: yfinance
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yfinance/yfinance-${{ version }}.tar.gz
  sha256: c32c45b42480d64981e89d65da3f480fd6910fe1972d7e78f1e2d91b45d9ee1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.11.1
    - curl-cffi >=0.15
    - lxml >=4.9.0
    - multitasking >=0.0.7
    - numpy >=1.16.5
    - pandas >=1.3.0
    - peewee >=3.16.2
    - platformdirs >=2.0.0
    - protobuf >=3.19.0
    - pytz >=2022.5
    - requests >=2.31
    - websockets >=13.0

tests:
  - python:
      imports:
        - yfinance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ranaroussi/yfinance
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Download market data from Yahoo! Finance API
  description: |
    Download market data from Yahoo! Finance API
  repository: https://github.com/ranaroussi/yfinance
  documentation: https://ranaroussi.github.io/yfinance

extra:
  recipe-maintainers:
    - jan-janssen
    - timkpaine

#### CFE metadata AND comments
# CFE metadata
