# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yfinance
  version: "1.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/yfinance-${{ version }}.tar.gz
  sha256: c32c45b42480d64981e89d65da3f480fd6910fe1972d7e78f1e2d91b45d9ee1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - protobuf >=3.19.0
    - websockets >=13.0
    - curl-cffi >=0.15
    - platformdirs >=2.0.0
    - python >=${{ python_min }}
    - pandas >=1.3.0
    - numpy >=1.16.5
    - requests >=2.31
    - multitasking >=0.0.7
    - lxml >=4.9.0
    - appdirs >=1.4.4
    - pytz >=2022.5
    - frozendict >=2.3.4
    - peewee >=3.16.2
    - beautifulsoup4 >=4.11.1
    - html5lib >=1.1

tests:
  - python:
      imports:
        - yfinance
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Download market data from Yahoo! Finance API
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/ranaroussi/yfinance

extra:
  recipe-maintainers:
    - jan-janssen
    - timkpaine
