# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "262.8665.186"

package:
  name: pydevd-pycharm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydevd-pycharm/pydevd_pycharm-${{ version }}.tar.gz
  sha256: 3ddd0a6250eb168e6cc93c5f4bb225eb8463cea2d28041ff35ff340b824b75e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - _pydev_imps
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JetBrains/intellij-community
  license: Apache-2.0
  license_file: LICENSE
  summary: PyCharm Debugger (used in PyCharm and PyDev)
  description: |
    PyCharm Debugger (used in PyCharm and PyDev)

extra:
  recipe-maintainers:
    - rxm7706

