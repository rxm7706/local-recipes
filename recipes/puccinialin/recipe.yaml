# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: puccinialin
  version: "0.1.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/puccinialin-${{ version }}.tar.gz
  sha256: c186d3ab26ceceae709f7edb7a620ea51e46fbeeb4f58d2de717c485e507914b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - puccinialize = puccinialin.__main__:main

requirements:
  host:
    - python ${{ python_min }}
    - flit-core
    - pip
  run:
    - python >=${{ python_min }}
    - filelock >=3.19.1,<4.0.0
    - httpx >=0.28.1,<0.29
    - platformdirs >=4.3.6,<5
    - tqdm >=4.67.1,<5

tests:
  - python:
      imports:
        - puccinialin
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - puccinialize --help

about:
  summary: Install rust into a temporary directory for boostrapping a rust-based build backend
  license: Apache-2.0 AND MIT
  license_file:
    - license-mit
    - license-apache
  homepage: https://pypi.org/project/puccinialin
  repository: https://github.com/konstin/puccinialin

extra:
  recipe-maintainers:
    - shermansiu
