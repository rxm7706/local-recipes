# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.83.0"

package:
  name: grpcio-status
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpcio-status/grpcio_status-${{ version }}.tar.gz
  sha256: 837219c6de9afdccb6f6f72b34bc71e151a2011ef04040e3faaca746a57e54ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.1
    - wheel
  run:
    - python >=${{ python_min }}
    - protobuf <8.0.0,>=6.33.5
    - grpcio >=1.83.0
    - googleapis-common-protos >=1.5.5

tests:
  - python:
      imports:
        - grpc_status
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Status proto mapping for gRPC
  description: |
    Status proto mapping for gRPC
  documentation: https://grpc.github.io/grpc/python/grpc_status.html

extra:
  recipe-maintainers:
    - sugatoray
    - xylar

