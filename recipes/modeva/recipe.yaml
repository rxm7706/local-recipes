# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"
  python_min: "3.12"

package:
  name: modeva
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp312/m/Modeva/modeva-2.1.0-cp312-cp312-macosx_11_0_universal2.whl
  sha256: cf82f8b7b208500c56935f296efc4a715fb010970a6a59aae3a75a9010f6bbf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools <81
    - mlflow ==2.15.1
    - ipywidgets >=7.7.0
    - ipython >=7.12.0
    - ipyvuetify >=1.8.10
    - notebook >=7.0.0
    - uvicorn
    - fastapi
    - webdriver-manager >=4.0.2
    - selenium >=4.19.0
    - matplotlib-base
    - networkx
    - requests
    - typer <0.10.0
    - packaging >=20.5
    - numpy <=1.26.4,>=1.21.4
    - scipy >=1.5.3
    - pandas >=1.3.5
    - catboost
    - xgboost >=1.6.0
    - lightgbm >=3.3.2
    - scikit-learn <1.7.0,>=1.3.0
    - scikit-learn-extra
    - pytorch !=2.3.*,>=1.11.0
    - momentchi2
    - umap-learn
    - pyswarms
    - lime >=0.2.0.1
    - shap >=0.42.0
    - pyjwt >=2.6.0
    - cryptography >=3.4
    - tqdm
    - dill
    - httpx
    - python-dateutil

tests:
  - python:
      imports:
        - modeva
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Modeva/
  license: proprietary
  license_file: LICENSE
  summary: Integrated tool for model development and validation.
  description: |
    Integrated tool for model development and validation.

extra:
  recipe-maintainers:
    - rxm7706

