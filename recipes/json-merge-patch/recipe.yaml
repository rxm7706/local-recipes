# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: json-merge-patch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-merge-patch/json_merge_patch-${{ version }}.tar.gz
  sha256: 4a022d78fc2f09cb49d96c646efc380d3b5ead2b5c7dabe22c3928c2c2e9c4e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json_merge_patch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-contracting/json-merge-patch
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: "JSON Merge Patch library (https://tools.ietf.org/html/rfc7386)"
  description: |
    JSON Merge Patch library (https://tools.ietf.org/html/rfc7386)

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar

#### CFE metadata AND comments
