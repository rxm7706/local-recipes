# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.12"

package:
  name: deptree
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deptree/deptree-${{ version }}.tar.gz
  sha256: 13afaf34dba2b9754451282432b90818c3c3353c134a13eb198f076368675d98

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - setuptools

tests:
  - python:
      imports:
        - deptree
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/deptree/
  license: Apache-2.0
  license_file: LICENSE
  summary: Display installed Python projects as a tree of dependencies
  description: |
    Display installed Python projects as a tree of dependencies
  repository: https://github.com/sinoroc/deptree

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: deptree
  cfe-upstream-registry: pypi
  cfe-upstream-name: deptree
  cfe-purls:
    - pkg:conda/deptree@${{ version }}?channel=conda-forge
    - pkg:pypi/deptree@${{ version }}
  cfe-upstream-repo: https://github.com/sinoroc/deptree
  cfe-upstream-homepage: https://pypi.org/project/deptree/
  cfe-import-names: [deptree]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
