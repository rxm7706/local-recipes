# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: scikit-learn-extra
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7912d43384470d77609e53819d0291967f21010e5c3a3847f9026fc02f9c7893

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler("cxx") }}
  host:
    - python
    - pip
    - cython >=0.28.5
    - numpy
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - scipy
    - joblib
    - scikit-learn >=0.23.0,<1.3.0

tests:
  - python:
      imports:
        - sklearn_extra
      pip_check: false
  - requirements:
      run:
        - pytest >=3.3.0,<8
    script:
      - if: win
        then: set OPENBLAS_NUM_THREADS=1
      - if: win
        then: set OMP_NUM_THREADS=1
      - if: not win
        then: export OPENBLAS_NUM_THREADS=1
      - if: not win
        then: export OMP_NUM_THREADS=1
      - pytest --verbose --pyargs sklearn_extra -k "not test_all_estimators"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: scikit-learn contrib estimators
  description: |
    scikit-learn-extra is a Python module for machine learning that extends
    scikit-learn. It includes algorithms that are useful but do not satisfy
    the scikit-learn inclusion criteria, for instance due to their novelty or
    lower citation number.
  homepage: https://github.com/scikit-learn-contrib/scikit-learn-extra
  repository: https://github.com/scikit-learn-contrib/scikit-learn-extra
  documentation: https://scikit-learn-extra.readthedocs.io/

extra:
  recipe-maintainers:
    - rth
