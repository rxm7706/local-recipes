# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.1"

package:
  name: mkdocs-awesome-pages-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mkdocs-awesome-pages-plugin/mkdocs_awesome_pages_plugin-${{ version }}.tar.gz
  sha256: cda2cb88c937ada81a4785225f20ef77ce532762f4500120b67a1433c1cdbb2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - mkdocs >=1
    - wcmatch >=7
    - natsort >=8.1.0

tests:
  - python:
      imports:
        - mkdocs_awesome_pages_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lukasgeiter/mkdocs-awesome-pages-plugin/
  license: MIT
  license_file: LICENSE
  summary: An MkDocs plugin that simplifies configuring page titles and their order
  description: |
    An MkDocs plugin that simplifies configuring page titles and their order
  repository: https://github.com/lukasgeiter/mkdocs-awesome-pages-plugin/

extra:
  recipe-maintainers:
    - rxm7706

