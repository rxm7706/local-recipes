schema_version: 1

context:
  version: "0.1.0"

package:
  name: cryptography-fernet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cryptography-fernet/cryptography_fernet-${{ version }}.tar.gz
  sha256: 1f9df8b4dc999456b8c753d00f76d71150019b9389fa0e3ba931643d6ca680e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cryptography_fernet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://303sec.com
  license: MIT
  license_file: LICENSE
  summary: This package is an example of a Dependency Hallucination. There is no code in this package, it is just a placeholder to prevent exploitation.
  description: |
    This package is an example of a Dependency Hallucination. There is no code in this package, it is just a placeholder to prevent exploitation.

extra:
  recipe-maintainers:
    - rxm7706

