# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8"

package:
  name: python-decouple
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-decouple/python-decouple-${{ version }}.tar.gz
  sha256: ba6e2657d4f376ecc46f77a3a615e058d93ba5e465c01bbe57289bfb7cce680f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-decouple

tests:
  - python:
      imports:
        - python_decouple
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/henriquebastos/python-decouple/
  license: MIT
  license_file: LICENSE
  summary: Strict separation of settings from code.
  description: |
    Strict separation of settings from code.

extra:
  recipe-maintainers:
    - xmnlab
    - thewchan

