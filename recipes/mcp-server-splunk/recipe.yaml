# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: mcp-server-splunk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server-splunk/mcp_server_splunk-${{ version }}.tar.gz
  sha256: f1237ab66b3fc48e45cdc5d9735d91a4f8a3ccffba26efe19b9490184ac4a510

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.0.0
    - splunk-sdk >=2.0.0

tests:
  - python:
      imports:
        - mcp_server_splunk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pahar0/mcp-server-splunk
  license: Apache-2.0
  license_file: LICENSE
  summary: A Model Context Protocol server for Splunk - search, manage, and analyze Splunk data via LLMs
  description: |
    A Model Context Protocol server for Splunk - search, manage, and analyze Splunk data via LLMs
  repository: https://github.com/pahar0/mcp-server-splunk

extra:
  recipe-maintainers:
    - rxm7706

