    - pkg:pypi/spaghetti@${{ version }}
  cfe-upstream-repo: https://github.com/pysal/spaghetti
  cfe-upstream-homepage: https://pysal.org/spaghetti/
  cfe-import-names: [spaghetti]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
