# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.6"

package:
  name: spaghetti
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaghetti/spaghetti-${{ version }}.tar.gz
  sha256: c9beddbb3bf285e88745d36aee886c78ac6e6a416f0f9b1a441265c8c08f923d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - esda >=2.1
    - geopandas >=0.12
    - libpysal >=4.6
    - numpy >=1.22
    - pandas !=1.5.0,>=1.4
    - rtree >=1.0
    - scipy >=1.8
    - shapely >=2.0.1

tests:
  - python:
      imports:
        - spaghetti
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/spaghetti/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Analysis of Network-constrained Spatial Data
  description: |
    Analysis of Network-constrained Spatial Data
  repository: https://github.com/pysal/spaghetti

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - martinfleis

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spaghetti
  cfe-upstream-registry: pypi
  cfe-upstream-name: spaghetti
