# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: lazy-loader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lazy-loader/lazy_loader-${{ version }}.tar.gz
  sha256: 717f9179a0dbed357012ddad50a5ad3d5e4d9a0b8712680d4e687f5e6e6ed9b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - packaging

tests:
  - python:
      imports:
        - lazy_loader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://scientific-python.org/specs/spec-0001/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Makes it easy to load subpackages and functions on demand.
  description: |
    Makes it easy to load subpackages and functions on demand.
  repository: https://github.com/scientific-python/lazy-loader

extra:
  recipe-maintainers:
    - bsipocz
    - sugatoray
    - bmcfee

#### CFE metadata AND comments
