# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: django-ai-assistant
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-ai-assistant/django_ai_assistant-${{ version }}.tar.gz
  sha256: 24e8349fb2b7a937a294f5cefe3cd9cd1f15411d1dfa66ee702cc21e627cf1bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.8.0
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - django-ninja <2.0.0,>=1.5.3
    - langchain <2.0.0,>=1.2.6
    - langgraph <2.0.0,>=1.0.6
    - pydantic <3.0.0,>=2.9.2

tests:
  - python:
      imports:
        - django_ai_assistant
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vintasoftware/django-ai-assistant
  license: MIT
  license_file: LICENSE.txt
  summary: Django app to integrate with OpenAI Assistants API
  description: |
    Django app to integrate with OpenAI Assistants API
  repository: https://github.com/vintasoftware/django-ai-assistant
  documentation: https://vintasoftware.github.io/django-ai-assistant

extra:
  recipe-maintainers:

#### CFE metadata AND comments
