# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: llama-index-retrievers-vertexai-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-retrievers-vertexai-search/llama_index_retrievers_vertexai_search-${{ version }}.tar.gz
  sha256: c0b55fd9c9046f15702243a8d142ff6bc89d6d689ad9a0c03f171b650bedc8fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - google-auth-httplib2 <0.3,>=0.2.0
    - google-auth-oauthlib <2,>=1.2.0
    - google-cloud-aiplatform <2,>=1.53.0
    - google-cloud-discoveryengine <0.12,>=0.11.13
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.retrievers.vertexai_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-retrievers-vertexai-search/
  license: MIT
  license_file: LICENSE
  summary: llama-index retrievers vertex ai search integration
  description: |
    llama-index retrievers vertex ai search integration

extra:
  recipe-maintainers:
    - rxm7706

