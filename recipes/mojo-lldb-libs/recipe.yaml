schema_version: 1

context:
  version: "1.0.0"

package:
  name: mojo-lldb-libs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mojo-lldb-libs/mojo_lldb_libs-1.0.0-py3-none-macosx_13_0_arm64.whl
  sha256: b8f417c3c2c64058c1c11467086c2e64464abcd91dba938c659b49d94cc75c5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mojo_lldb_libs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://modular.com
  license: LicenseRef-MAX-Platform-Software-License
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

