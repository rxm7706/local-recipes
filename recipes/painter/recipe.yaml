# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: painter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/painter/painter-${{ version }}.tar.gz
  sha256: 3373463d584ba9bbbb23d570c37893e7930b93704fe1149df88e9d2ef906fc88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - painter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fgimian/painter
  license: MIT
  license_file: LICENSE
  summary: Your own expressive painter who colors text in your terminal.
  description: |
    Your own expressive painter who colors text in your terminal.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
