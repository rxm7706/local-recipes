# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: roadtools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roadtools/roadtools-${{ version }}.tar.gz
  sha256: 47145b713f6e850058443aaad5ab180c8c2aae38b5e338bb77046e40b5c98b24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - roadtools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dirkjanm/ROADtools/
  license: MIT
  license_file: LICENSE
  summary: A collection of Azure AD/Entra tools for offensive and defensive security purposes
  description: |
    A collection of Azure AD/Entra tools for offensive and defensive security purposes

extra:
  recipe-maintainers:
    - rxm7706

