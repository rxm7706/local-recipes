# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zexceptions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zExceptions/zexceptions-${{ version }}.tar.gz
  sha256: 2785efab97362e57fa9e394a15c31a2e481b08fa953417d34f09eb1edc201242

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zExceptions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zExceptions
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: zExceptions contains common exceptions used in Zope.
  description: |
    zExceptions contains common exceptions used in Zope.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zexceptions
  cfe-upstream-registry: pypi
  cfe-upstream-name: zExceptions
