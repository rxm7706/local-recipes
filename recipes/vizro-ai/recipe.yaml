# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: vizro-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vizro-ai/vizro_ai-${{ version }}.tar.gz
  sha256: 2da6252aab5d2e9dd7cb190a13ca389fd950153a13164928fb130bd6e27216b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pandas
    - plotly
    - black
    - autoflake
    - pydantic-ai-slim >=1.56.0
tests:
  - python:
      imports:
        - vizro_ai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Vizro-AI provides pre-configured agents that help with data visualizations
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/vizro-ai/
  repository: https://github.com/mckinsey/vizro
  documentation: https://vizro.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - rxm7706
