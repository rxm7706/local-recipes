# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: typeshed-client
  version: "2.13.0"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/typeshed_client-${{ version }}.tar.gz
  sha256: 85ce73be98a5e3a51cafb2e2921653e3759ce7e9d1530adcca935dec201152f2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.9.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - importlib-resources >=1.4.0
    - typing-extensions >=4.5.0

tests:
  - python:
      imports:
        - typeshed_client
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A library for accessing stubs in typeshed.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/JelleZijlstra/typeshed_client

extra:
  recipe-maintainers:
    - JelleZijlstra
