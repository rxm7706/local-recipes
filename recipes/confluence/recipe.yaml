# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: confluence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/confluence/confluence-${{ version }}.tar.gz
  sha256: fcc4f0341b0d7d1d014d74b14dff81e8b3b80eb5f90b1ef6131c4aca3d32c9f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - confluence
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/phoebian/confluence
  license: Python
  license_file: LICENSE
  summary: A Python API to Confluence
  description: |
    A Python API to Confluence

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: confluence
  cfe-upstream-registry: pypi
  cfe-upstream-name: confluence
  cfe-purls:
