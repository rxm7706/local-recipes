    - pkg:pypi/confluence@${{ version }}
  cfe-upstream-repo: https://bitbucket.org/phoebian/confluence
  cfe-upstream-homepage: https://bitbucket.org/phoebian/confluence
  cfe-import-names: [confluence]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
