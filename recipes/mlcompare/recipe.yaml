# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: mlcompare
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mlcompare/mlcompare-${{ version }}.tar.gz
  sha256: 69c06d431a906a6e452b6360fafa0e7d3a844beb45d3da3722f0e9f7ad10960c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme >=22.5.0
  run:
    - python >=${{ python_min }}
    - huggingface-hub >=0.21.0
    - kaggle >=1.0.0
    - lightgbm >=4.0.0
    - numpy <2.0.0,>=1.23.5
    - openml >=0.13.0
    - pandas >=2.0.0
    - plotly >=4.0.0
    - pydantic >=2.0.0
    - scikit-learn >=1.4.0
    - pytorch >=2.0.0
    - xgboost >=2.1.0

tests:
  - python:
      imports:
        - mlcompare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mlcompare/
  license: MIT
  license_file: LICENSE
  summary: Quickly compare machine learning models across libraries and datasets.
  description: |
    Quickly compare machine learning models across libraries and datasets.
  repository: https://github.com/MitchMedeiros/MLCompare
  documentation: https://mlcompare.readthedocs.io/en/latest/api_reference

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mlcompare
  cfe-upstream-registry: pypi
  cfe-upstream-name: mlcompare
  cfe-purls:
    - pkg:conda/mlcompare@${{ version }}?channel=conda-forge
    - pkg:pypi/mlcompare@${{ version }}
  cfe-upstream-repo: https://github.com/MitchMedeiros/MLCompare
  cfe-upstream-homepage: https://pypi.org/project/mlcompare/
  cfe-import-names: [mlcompare]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
