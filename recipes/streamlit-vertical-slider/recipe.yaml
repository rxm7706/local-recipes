# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.5"

package:
  name: streamlit-vertical-slider
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-vertical-slider/streamlit_vertical_slider-${{ version }}.tar.gz
  sha256: d6854cf81a606f5c021df2037d2c49036df2d03ce5082a5227a2acca8322ca74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_vertical_slider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sqlinsights/streamlit-vertical-slider
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Creates a customizable vertical slider
  description: |
    Creates a customizable vertical slider

extra:
  recipe-maintainers:
    - rxm7706

