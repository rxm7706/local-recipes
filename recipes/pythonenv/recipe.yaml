# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.34"

package:
  name: pythonenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pythonenv/pythonenv-${{ version }}.tar.gz
  sha256: 6e00b3df70373f77deb0fac7795928ee113462b5f7c30e4d333913ac4cd32d38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pythonenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yahoo/python_shebang
  license: MIT
  license_file: LICENSE
  summary: find a compatible python interpreter for a script
  description: |
    find a compatible python interpreter for a script

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pythonenv
  cfe-upstream-registry: pypi
  cfe-upstream-name: pythonenv
  cfe-purls:
    - pkg:conda/pythonenv@${{ version }}?channel=conda-forge
    - pkg:pypi/pythonenv@${{ version }}
  cfe-upstream-repo: https://github.com/yahoo/python_shebang
  cfe-upstream-homepage: https://github.com/yahoo/python_shebang
  cfe-import-names: [pythonenv]
  cfe-source-kind: pypi-sdist
