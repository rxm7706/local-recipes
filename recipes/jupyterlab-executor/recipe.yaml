# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2023.1.1"

package:
  name: jupyterlab-executor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-executor/jupyterlab_executor-${{ version }}.tar.gz
  sha256: 92145b9aa2c4ac92a334432220ef8d874fca9a2a0a6935d1422c3a3bdf8726a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_executor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gavincyi/jupyterlab-executor
  license: BSD-3-Clause
  license_file: LICENSE
  summary: JupyterLab extension of executing the scripts
  description: |
    JupyterLab extension of executing the scripts
  repository: https://github.com/gavincyi/jupyterlab-executor.git

extra:
  recipe-maintainers:
    - rxm7706

