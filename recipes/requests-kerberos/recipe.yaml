# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: requests-kerberos
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-kerberos/requests_kerberos-${{ version }}.tar.gz
  sha256: 437512e424413d8113181d696e56694ffa4259eb9a5fc4e803926963864eaf4e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=1.1.0
    - cryptography >=1.3
    - pyspnego

tests:
  - python:
      imports:
        - requests_kerberos
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/requests/requests-kerberos
  license: ISC
  license_file: LICENSE
  summary: A Kerberos authentication handler for python-requests
  description: |
    A Kerberos authentication handler for python-requests

extra:
  recipe-maintainers:
    - duncanmmacleod

