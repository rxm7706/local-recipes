# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: spglm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spglm/spglm-${{ version }}.tar.gz
  sha256: 20519dc38be9d660a28109bb1b89d1068454e79f6413bab2e3987db5bf959327

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - libpysal >=4.5
    - numpy >=1.23
    - scipy >=1.8
    - spreg >=1.2

tests:
  - python:
      imports:
        - spglm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/spglm/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Sparse Generalized Linear Models
  description: |
    Sparse Generalized Linear Models
  repository: https://github.com/pysal/spglm

extra:
  recipe-maintainers:
    - knaaptime
    - martinfleis
    - jGaboardi
    - ocefpaf

#### CFE metadata AND comments
