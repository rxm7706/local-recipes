# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: unicon.plugins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/u/unicon.plugins/unicon_plugins-26.7-py3-none-any.whl
  sha256: 8cb8022be8bddec6f3a9637eb4ff664c82100c414ba194417aa0810437b4fb7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - unicon <26.8.0,>=26.7.0
    - pyyaml
    - prettytable
    - cryptography >=43.0

tests:
  - python:
      imports:
        - unicon.plugins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats
  license: Apache-2.0
  license_file: LICENSE
  summary: Unicon Connection Library Plugins
  description: |
    Unicon Connection Library Plugins

extra:
  recipe-maintainers:
    - rxm7706

