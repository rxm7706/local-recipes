# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: services
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/services/services-${{ version }}.tar.gz
  sha256: fb508e10a47f6c8efa232c3a5446542cf81fa4bcd8afa69c7ab824ff45ef0ea5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - services
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dshurick/services
  license: MIT
  license_file: LICENSE
  summary: A Python package for helpful tooling.
  description: |
    A Python package for helpful tooling.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
