# CFE comments
# Header:
#    # Fourteenth bmad-suite member (docs/dreams/bmad-eval-quality.md; Spec
#    # spec-bmad-eval-quality CAP-1, steward Story 45.1). Conda name carries the
#    # bmad- prefix after the upstream repo (bmad-labs-skills precedent); the
#    # bin stays eval-quality. npm 'eval-quality' latest is 0.1.0 = tag v0.1.0
#    # (compile/seal/preflight only, no score) — the 0.2.0 line with score /
#    # runScore / ingest is unreleased main, hence the commit pin (operator
#    # decision 2026-09-05). Nine breaking schema-version bumps sit between the
#    # two; there is no runtime version check, so an exact pin is load-bearing.
# build:
#    # dist/ is gitignored upstream; prepack runs tsc, so the build does
#    # npm ci (devDependencies) + npm run build, then a clean
#    # npm ci --omit=dev so the shipped node_modules holds only the one prod
#    # dep (zod, MIT — hence license 'Apache-2.0 AND MIT' + its LICENSE file).
#    # Wrappers in bin/ (bash) and Scripts/ (.bat), never npm install -g
#    # symlinks, per G6/G100 and the bmad-method feedstock pattern.
# tests:
#    # --version prints the bare package.json version ('0.2.0', not the conda
#    # 0.2.0.dev0). compile takes --in <path> (a positional is 'unknown flag').
#    # Exit codes (AD-21): 0 ok, 1 CONCERNS under --strict, 2 FAIL, 3 invalid.
