# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: zowe-core-for-zowe-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zowe-core-for-zowe-sdk/zowe_core_for_zowe_sdk-${{ version }}.tar.gz
  sha256: 50eeef6fe3a25a6e0cc1845b703eeb6d7cc8e48befc948d6f8cdba635b6deaa0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3
    - pyyaml

tests:
  - python:
      imports:
        - zowe.core_for_zowe_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zowe/zowe-client-python-sdk
  license: EPL-2.0
  license_file: LICENSE
  summary: Zowe Python SDK - Core package
  description: |
    Zowe Python SDK - Core package

extra:
  recipe-maintainers:
    - rxm7706

