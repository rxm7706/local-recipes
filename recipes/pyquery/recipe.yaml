# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyquery
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0194bb2706b12d037db12c51928fe9ebb36b72d9e719565daba5a6c595322faf
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml >=2.1
    - cssselect >=1.2.0

tests:
  - python:
      imports:
        - pyquery
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A jquery-like library for python
  description: |
    pyquery allows you to make jquery queries on xml documents. The API is as
    much as possible the similar to jquery. pyquery uses lxml for fast xml
    and html manipulation.
  homepage: https://github.com/gawel/pyquery
  repository: https://github.com/gawel/pyquery
  documentation: http://pyquery.rtfd.org

extra:
  recipe-maintainers:
    - nehaljwani
