# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.45"

package:
  name: streamlit-agraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-agraph/streamlit-agraph-${{ version }}.tar.gz
  sha256: b2b7cf1ad0a40dc906de50792b27f2878b0e186603cb3bc958ed78ca7e469cdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit
    - networkx
    - rdflib

tests:
  - python:
      imports:
        - streamlit_agraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ChrisChross/streamlit-agraph
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Interactive Graph Vis for Streamlit.
  description: |
    Interactive Graph Vis for Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
