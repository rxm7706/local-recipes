# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.14"

package:
  name: flatten-json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flatten-json/flatten_json-${{ version }}.tar.gz
  sha256: 4008b1bd81743e6fcdc29ddbb640f5c1589376116e0c8f36cb4a0003d41fe102

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - flatten_json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/amirziai/flatten
  license: MIT
  license_file: LICENSE
  summary: Flatten JSON objects
  description: |
    Flatten JSON objects

extra:
  recipe-maintainers:
    - andreyz4k
    - xhochy

