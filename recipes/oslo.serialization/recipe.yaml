# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: oslo.serialization
  version: "5.11.0"
  sha256: 8326e85a80856c1068007423fcf6fe29dd2fe57a32f5d87fff0120b555b4b67c
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/oslo_serialization-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools
    - pbr
  run:
    - pbr
    - python >=${{ python_min }}
    - msgpack-python
    - oslo.utils
    - pytz

tests:
  - python:
      imports:
        - oslo_serialization
        - oslo_serialization.base64
        - oslo_serialization.jsonutils
        - oslo_serialization.msgpackutils
        - oslo_serialization.serializer.base_serializer
        - oslo_serialization.serializer.json_serializer
        - oslo_serialization.serializer.msgpack_serializer
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Serialization library
  description: |
    The oslo serialization library provides support for representing objects
    in transmittable and storable formats, such as JSON and MessagePack.


  homepage: https://docs.openstack.org/oslo.serialization/

extra:
  recipe-maintainers:
    - brainstorm
    - tschoonj
