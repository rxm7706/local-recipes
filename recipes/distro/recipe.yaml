# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: distro
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/distro/distro-${{ version }}.tar.gz
  sha256: 2fa77c6fd8940f116ee1d6b94a2f90b13b5ea8d019b98bc8bafdcabcdd9bdbed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distro
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-distro/distro
  license: Apache-2.0
  license_file: LICENSE
  summary: Distro - an OS platform information API
  description: |
    Distro - an OS platform information API

extra:
  recipe-maintainers:
    - abloemert
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: distro
  cfe-upstream-registry: pypi
  cfe-upstream-name: distro
  cfe-purls:
    - pkg:conda/distro@${{ version }}?channel=conda-forge
    - pkg:pypi/distro@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/python-distro/distro
  cfe-import-names: [distro]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/distro-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.9.0

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T07:46:58Z
