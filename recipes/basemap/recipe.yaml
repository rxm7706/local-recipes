# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"
  build_number: 5
  data_version: "2.0.0"
  data_build_number: 0

recipe:
  name: basemap-split
  version: ${{ version }}

source:
  url: https://github.com/matplotlib/basemap/archive/v${{ version }}.tar.gz
  sha256: 192ee1c63291d7d1af98fab798c45239ea27e6ca31041afa8c42c8b697e44596
  patches:
    - patches/fix_install_hires_instructions.patch
    # v2.0.0 does not define python 3.14 + numpy entry
    - patches/add_python314_numpy_to_pyproject.patch
    # v2.0.0 hard codes a python <3.14 dep in setup
    - patches/relax_setup_python_check.patch

build:
  number: ${{ build_number }}

requirements:
  build:
    - if: win
      then: m2-patch
    - if: not win
      then: patch

outputs:
  # These scripts will delete `pyproject.toml`. Remove ASAP.
  - package:
      name: basemap
      version: ${{ version }}
    build:
      number: ${{ build_number }}
      skip: python_impl == 'pypy' or win32 or s390x
      script:
        file: ${{ 'build-basemap.sh' if not win else 'bld-basemap.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: cython
        - if: build_platform != target_platform
          then: numpy
        - ${{ stdlib("c") }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - python
        - pip
        - setuptools
        - wheel
        - cython
        - numpy
        - geos
        - pyproj
      run:
        - python
        - numpy <2.4
        - ${{ pin_subpackage('basemap-data', lower_bound='x.x', upper_bound='x.x') }}
        - ${{ pin_compatible('geos', lower_bound='x.x.x', upper_bound='x.x.x') }}
        - packaging >=20.5,<26.0
        - matplotlib-base >=3.4,<3.11
        - pyproj >=3.0,<3.8
        - pyshp >=2.0,<2.4
    tests:
      - python:
          imports:
            - mpl_toolkits.basemap
          pip_check: false
      - requirements:
          run:
            - pip
            - ${{ pin_subpackage('basemap-data', lower_bound='x.x', upper_bound='x.x') }}
            - matplotlib-base >=3.4
        script:
          - python -c "from mpl_toolkits.basemap import Basemap"
          - python ${{ RECIPE_DIR }}/run_test.py
    about:
      license: MIT
      license_file:
        - LICENSE
      summary: Plot data on map projections with matplotlib
      description: |
        Basemap toolkit is a library for plotting 2D data on maps in Python.
        It is similar in functionality to the matlab mapping toolbox,
        the IDL mapping facilities, GrADS, or the Generic Mapping Tools.
      homepage: https://matplotlib.org/basemap
      repository: https://github.com/matplotlib/basemap
      documentation: https://matplotlib.org/basemap/
  - package:
      name: basemap-data
      version: ${{ data_version }}
    build:
      number: ${{ data_build_number }}
      string: basemap_${{ data_build_number }}
      noarch: python
      script:
        file: ${{ 'build-basemap.sh' if not win else 'bld-basemap.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform or build_platform != target_platform
          then: python 3.9.*
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
      host:
        - python 3.9.*
        - pip
        - setuptools
        - wheel
      run:
        - python >=${{ python_min }}
    about:
      license: LGPL-3.0-or-later
      license_file: data/basemap_data/COPYING.LESSER
      summary: Data assets for matplotlib basemap
      homepage: https://matplotlib.org/basemap
      repository: https://github.com/matplotlib/basemap
  - package:
      name: basemap-data-hires
      version: ${{ data_version }}
    build:
      number: ${{ data_build_number }}
      string: basemap_${{ data_build_number }}
      noarch: python
      script:
        file: ${{ 'build-basemap.sh' if not win else 'bld-basemap.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform or build_platform != target_platform
          then: python 3.9.*
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
      host:
        - python 3.9.*
        - pip
        - setuptools
        - wheel
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('basemap-data', lower_bound='x.x', upper_bound='x.x') }}
    about:
      license: LGPL-3.0-or-later
      license_file: data/basemap_data_hires/COPYING.LESSER
      summary: High-resolution data assets for matplotlib basemap
      homepage: https://matplotlib.org/basemap
      repository: https://github.com/matplotlib/basemap

about:
  license: MIT
  summary: Split feedstock for basemap
  license_file:
    - LICENSE
  homepage: https://matplotlib.org/basemap

extra:
  recipe-maintainers:
    - molinav
    - ocefpaf
    - ReimarBauer
    - beckermr
