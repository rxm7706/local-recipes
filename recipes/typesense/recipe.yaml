    - pkg:pypi/typesense@${{ version }}
  cfe-upstream-repo: https://github.com/typesense/typesense-python
  cfe-upstream-homepage: https://pypi.org/project/typesense/
  cfe-import-names: [typesense]
  cfe-source-kind: pypi-sdist
