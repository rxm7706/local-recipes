# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: typesense
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typesense/typesense-${{ version }}.tar.gz
  sha256: 9a306e328bf0c0030679c154730ec142efbf07fd0c33845b3efae10291e983e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - typing_extensions

tests:
  - python:
      imports:
        - typesense
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/typesense/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python client for Typesense, an open source and typo tolerant search engine.
  description: |
    Python client for Typesense, an open source and typo tolerant search engine.
  repository: https://github.com/typesense/typesense-python
  documentation: https://typesense.org/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: typesense
  cfe-upstream-registry: pypi
  cfe-upstream-name: typesense
  cfe-purls:
