# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: cognee
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cognee/cognee-${{ version }}.tar.gz
  sha256: e599c170ba287ed800e8eecf361b9c7d526f13d50aa7e5bd14e5a16fd68477db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiofiles >=23.2.1
    - aiohttp <4.0.0,>=3.13.5
    - aiolimiter >=1.2.1
    - aiosqlite <1.0.0,>=0.20.0
    - alembic <2,>=1.13.3
    - cbor2 >=5.8.0
    - cryptography <50,>=43.0.0
    - datamodel-code-generator >=0.54.0
    - diskcache >=5.6.3
    - fakeredis >=2.32.0
    - fastapi-users >=15.0.2
    - fastapi <1.0.0,>=0.116.2
    - filelock <4.0.0,>=3.12.0
    - filetype <2.0.0,>=1.2.0
    - gunicorn <24,>=20.1.0
    - instructor <1.15.3,>=1.9.1
    - jinja2 <4,>=3.1.3
    - lancedb <1.0.0,>=0.24.3
    - langdetect >=1.0.9
    - limits <5,>=4.4.1
    - litellm >=1.83.7
    - nbformat <6.0.0,>=5.7.0
    - networkx <4,>=3.4.2
    - numpy <=4.0.0,>=1.26.4
    - openai >=1.80.1
    - pydantic-settings !=2.12.*,!=2.13.*,!=2.14.0,!=2.14.1,<3,>=2.2.1
    - pydantic >=2.10.5
    - pylance <=0.36.0,>=0.22.0
    - pympler <2.0.0,>=1.1
    - pypdf <7.0.0,>=6.6.2
    - python-dotenv <2.0.0,>=1.0.1
    - python-multipart <1.0.0,>=0.0.22
    - rdflib <7.2.0,>=7.1.4
    - sqlalchemy <3.0.0,>=2.0.39
    - starlette >=0.48
    - structlog <26,>=25.2.0
    - tenacity >=9.0.0
    - tiktoken <1.0.0,>=0.8.0
    - typing_extensions <5.0.0,>=4.12.2
    - urllib3 >=2.6.0
    - uvicorn <1.0.0,>=0.34.0
    - websockets <16.0.0,>=15.0.1
    - if: osx
      then:
        - ladybug

tests:
  - python:
      imports:
        - kuzu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.cognee.ai
  license: Apache-2.0
  license_file: LICENSE
  summary: Cognee - is a library for enriching LLM context with a semantic layer for better understanding and reasoning.
  description: |
    Cognee - is a library for enriching LLM context with a semantic layer for better understanding and reasoning.
  repository: https://github.com/topoteretes/cognee

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cognee
  cfe-upstream-registry: pypi
  cfe-upstream-name: cognee
  cfe-purls:
