    - pkg:pypi/cognee@${{ version }}
  cfe-upstream-repo: https://github.com/topoteretes/cognee
  cfe-upstream-homepage: https://www.cognee.ai
  cfe-import-names: [kuzu]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
