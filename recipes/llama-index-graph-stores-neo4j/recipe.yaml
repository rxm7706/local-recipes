# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: llama-index-graph-stores-neo4j
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-graph-stores-neo4j/llama_index_graph_stores_neo4j-${{ version }}.tar.gz
  sha256: abe4bb348c652005d1ef970dec8512dae6582c50d83bbaf59ce2d53031e66120

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - neo4j <6,>=5.16.0

tests:
  - python:
      imports:
        - llama_index.graph_stores.neo4j
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-graph-stores-neo4j/
  license: MIT
  license_file: LICENSE
  summary: llama-index graph stores neo4j integration
  description: |
    llama-index graph stores neo4j integration

extra:
  recipe-maintainers:
    - rxm7706

