# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.12"
  name: sphinx-autodoc-typehints
  version: "3.13.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sphinx_autodoc_typehints-${{ version }}.tar.gz
  sha256: ea20b9a217b86391b0ece262c4336e3c2f476fe1f76028635d550b4e74cd7498

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.12.*
    - hatch-vcs >=0.5
    - hatchling >=1.28
    - pip
  run:
    - python >=${{ python_min }}
    - sphinx >=9.1

tests:
  - python:
      imports:
        - sphinx_autodoc_typehints
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Type hints (PEP 484) support for the Sphinx autodoc extension
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/sphinx-autodoc-typehints/
  repository: https://github.com/tox-dev/sphinx-autodoc-typehints

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
