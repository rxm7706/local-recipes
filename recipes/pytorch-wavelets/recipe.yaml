# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: pytorch-wavelets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytorch-wavelets/pytorch_wavelets-${{ version }}.tar.gz
  sha256: 8b5c63f87c2bb36e6b342a7bb294926bda5cd974614fb4848deab6ec2792f56f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pywt
    - numpy
    - six
    - pytorch

tests:
  - python:
      imports:
        - pytorch_wavelets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fbcotter/pytorch_wavelets
  license: MIT
  license_file: LICENSE
  summary: A port of the DTCWT toolbox to run on pytorch
  description: |
    A port of the DTCWT toolbox to run on pytorch

extra:
  recipe-maintainers:
    - rxm7706

