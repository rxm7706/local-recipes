# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-bakery
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail-bakery-${{ version }}.tar.gz
  sha256: 6ed7bfca032ef69daa51267ea820d4a9780620783559122684f92569c1467ebc

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django-bakery >=0.13.1,<0.14.0
    - wagtail >=4.1

tests:
  - python:
      imports:
        - wagtailbakery
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: A set of helpers for baking your Django Wagtail site out as flat files
  description: |
    Wagtail-bakery is built on top of Django bakery. Wagtail-bakery is not limited to
    build Wagtail pages specifically, mixed content is possible!
  homepage: https://github.com/wagtail-nest/wagtail-bakery/
  repository: https://github.com/wagtail-nest/wagtail-bakery/
  documentation: hhttps://wagtail-bakery.readthedocs.io

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - sannykr
