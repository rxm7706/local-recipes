# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"
  python_min: "3.13"

package:
  name: glean-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glean-config/glean_config-${{ version }}.tar.gz
  sha256: f1117f79c053b581eff7d8f51a63ea485a2c3beb476d07994b61bfcc995b6e45

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.0,<0.10.0
  run:
    - python >=${{ python_min }}
    - tomli-w >=1.2.0
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - glean_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/glean-config/
  license: MIT
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

