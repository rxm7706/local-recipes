    - pkg:pypi/databases@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/encode/databases
  cfe-import-names: [databases]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/databases-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
