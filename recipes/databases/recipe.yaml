# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: databases
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/databases/databases-${{ version }}.tar.gz
  sha256: d2f259677609bf187737644c95fa41701072e995dfeb8d2882f335795c5b61b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy

tests:
  - python:
      imports:
        - databases
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/encode/databases
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Async database support for Python.
  description: |
    Async database support for Python.

extra:
  recipe-maintainers:
    - carlodri
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: databases
  cfe-upstream-registry: pypi
  cfe-upstream-name: databases
