# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/config/config-0.5.1.zip
  sha256: 2dd4a03aa383d30711d5a3325a1858de225328d61950a85be5b74c100f63016d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://docs.red-dove.com/cfg/python.html
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A hierarchical, easy-to-use, powerful configuration module for Python
  description: |
    A hierarchical, easy-to-use, powerful configuration module for Python

extra:
  recipe-maintainers:
    - zklaus

#### CFE metadata AND comments
