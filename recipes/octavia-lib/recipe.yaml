# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.11.0"

package:
  name: octavia-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/octavia-lib/octavia_lib-${{ version }}.tar.gz
  sha256: c347080d0be7b13b75918e364b7e480e08d39970a50e1b6b04a96ee7327a43c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - oslo.i18n >=3.15.3
    - oslo.serialization >=2.28.1
    - pbr !=2.1.0,>=2.0.0
    - tenacity >=5.0.2

tests:
  - python:
      imports:
        - octavia_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/octavia-lib/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: A library to support Octavia provider drivers.
  description: |
    A library to support Octavia provider drivers.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
