# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: mgwr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mgwr/mgwr-${{ version }}.tar.gz
  sha256: 8b00ba992fd85c9528327eae88e104e072939d0d5203b72c513ef29d5c400ff7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scipy >=0.11
    - numpy >=1.3
    - libpysal >=4.0.0
    - spglm >=1.0.6
    - spreg

tests:
  - python:
      imports:
        - mgwr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/mgwr
  license: BSD-3-Clause
  license_file: LICENSE
  summary: multiscale geographically weighted regression
  description: |
    multiscale geographically weighted regression

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - martinfleis
    - ocefpaf

#### CFE metadata AND comments
