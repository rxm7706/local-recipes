# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: mgwr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mgwr/mgwr-${{ version }}.tar.gz
  sha256: 8b00ba992fd85c9528327eae88e104e072939d0d5203b72c513ef29d5c400ff7

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - libpysal >=4.0.0
    - numpy >=1.3
    - scipy >=0.11
    - spglm >=1.0.6
    - spreg

tests:
  - python:
      imports:
        - mgwr
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  # https://github.com/pysal/mgwr/issues/25
  # license_file:
  summary: Multiscale geographically weighted regression
  homepage: https://github.com/pysal/mgwr
  repository: http://github.com/pysal/mgwr
  documentation: https://mgwr.readthedocs.io

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - martinfleis
    - ocefpaf
