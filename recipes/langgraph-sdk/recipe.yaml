# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: langgraph-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-sdk/langgraph_sdk-${{ version }}.tar.gz
  sha256: b88f0f5f6328ac0680d6790614a905b2bcfa257f2276dba4e38f0e86db0aa738

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.2
    - langchain-core <2,>=1.4.0
    - langchain-protocol >=0.0.15
    - orjson >=3.11.5
    - websockets <16,>=14

tests:
  - python:
      imports:
        - langgraph_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-sdk/
  license: MIT
  license_file: LICENSE
  summary: SDK for interacting with LangGraph API
  description: |
    SDK for interacting with LangGraph API
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/sdk-py

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
