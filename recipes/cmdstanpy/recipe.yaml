# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: cmdstanpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmdstanpy/cmdstanpy-${{ version }}.tar.gz
  sha256: 60b10d110993bd8345735994786b2b17782fdc5530a6adbc0cd8ec836d82c2b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - numpy >=1.21
    - tqdm
    - stanio <2.0.0,>=0.4.0

tests:
  - python:
      imports:
        - cmdstanpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stan-dev/cmdstanpy
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python interface to CmdStan
  description: |
    Python interface to CmdStan

extra:
  recipe-maintainers:
    - maresb
    - WardBrian

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cmdstanpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: cmdstanpy
