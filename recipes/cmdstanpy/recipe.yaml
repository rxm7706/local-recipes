    - pkg:pypi/cmdstanpy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/stan-dev/cmdstanpy
  cfe-import-names: [cmdstanpy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cmdstanpy-feedstock
