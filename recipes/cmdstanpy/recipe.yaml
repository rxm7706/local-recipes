# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cmdstanpy
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/stan-dev/cmdstanpy/archive/v${{ version }}.tar.gz
  sha256: 02cbeeae5fc4145c383177062ec3eaa8deb32ae04b33b63db2ef9e65b7731d65

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - install_cmdstan = cmdstanpy.install_cmdstan:main
      - install_cxx_toolchain = cmdstanpy.install_cxx_toolchain:main

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - pandas
    - numpy >=1.21
    - cmdstan
    - tqdm
    - stanio >=0.4.0,<2.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: |
    CmdStanPy is a lightweight interface to Stan for Python users which
    provides the necessary objects and functions to compile a Stan program
    and fit the model to data using CmdStan.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://mc-stan.org/users/interfaces/cmdstan.html
  repository: https://github.com/stan-dev/cmdstanpy
  documentation: https://cmdstanpy.readthedocs.io

extra:
  recipe-maintainers:
    - maresb
    - WardBrian
