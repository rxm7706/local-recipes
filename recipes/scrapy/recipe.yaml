# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.17.0"

package:
  name: scrapy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Scrapy/scrapy-${{ version }}.tar.gz
  sha256: b536d14166b05e2183b19ae105a7af849cd14d4c1f70d3009d9b1828c0ab3d92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - cryptography >=37.0.0
    - cssselect >=0.9.1
    - defusedxml >=0.7.1
    - itemadapter >=0.1.0
    - itemloaders >=1.0.1
    - lxml >=4.6.4
    - packaging
    - parsel >=1.5.0
    - protego >=0.1.15
    - pydispatcher >=2.0.5
    - pyopenssl >=22.0.0
    - pypydispatcher >=2.1.0
    - queuelib >=1.4.2
    - service-identity >=23.1.0
    - tldextract
    - twisted >=21.7.0
    - w3lib >=1.17.0
    - zope-interface >=5.1.0

tests:
  - python:
      imports:
        - scrapy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://scrapy.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A high-level Web Crawling and Web Scraping framework
  description: |
    A high-level Web Crawling and Web Scraping framework
  repository: https://github.com/scrapy/scrapy
  documentation: https://docs.scrapy.org/

extra:
  recipe-maintainers:
    - rmax
    - kmike
    - Gallaecio
    - wRAR
    - dangra

#### CFE metadata AND comments
# CFE metadata
