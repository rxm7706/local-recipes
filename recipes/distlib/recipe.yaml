# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: distlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/distlib/distlib-${{ version }}.tar.gz
  sha256: f152097224a0ae24be5a0f6bae1b9359af82133bce63f98a95f86cae1aede9ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/distlib
  license: PSF-2.0
  license_file: LICENSE.txt
  summary: Distribution utilities
  description: |
    Distribution utilities
  repository: https://github.com/pypa/distlib
  documentation: https://distlib.readthedocs.io/

extra:
  recipe-maintainers:
    - nicoddemus
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: distlib
  cfe-upstream-registry: pypi
  cfe-upstream-name: distlib
  cfe-purls:
    - pkg:conda/distlib@${{ version }}?channel=conda-forge
    - pkg:pypi/distlib@${{ version }}
  cfe-upstream-repo: https://github.com/pypa/distlib
  cfe-upstream-homepage: https://github.com/pypa/distlib
  cfe-import-names: [distlib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/distlib-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-17T07:46:00Z
