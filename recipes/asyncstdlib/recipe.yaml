# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.14.0"

package:
  name: asyncstdlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncstdlib/asyncstdlib-${{ version }}.tar.gz
  sha256: f99396992a3bba7495d8cf6c832bfe8c8727f61213233d3569a5a9cbd1c04385

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}
    - unittests

tests:
  - python:
      imports:
        - unittests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/asyncstdlib/
  license: MIT
  license_file: LICENSE
  summary: The missing async toolbox
  description: |
    The missing async toolbox
  repository: https://github.com/maxfischer2781/asyncstdlib
  documentation: https://asyncstdlib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - maxfischer2781

#### CFE metadata AND comments
# CFE metadata
