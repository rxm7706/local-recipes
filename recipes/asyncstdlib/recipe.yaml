# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: asyncstdlib
  version: "3.14.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asyncstdlib-${{ version }}.tar.gz
  sha256: f99396992a3bba7495d8cf6c832bfe8c8727f61213233d3569a5a9cbd1c04385

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncstdlib
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - unittests
    requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}
    script:
      - pytest unittests

about:
  summary: The missing async toolbox
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/maxfischer2781/asyncstdlib

extra:
  recipe-maintainers:
    - maxfischer2781
