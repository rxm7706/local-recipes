# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: pyrunner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrunner/pyrunner-${{ version }}.tar.gz
  sha256: 2f00ab841465bb394c5a2eed8e16b4d2075ea5aabfd6143aaafa6802690541c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyrunner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cdancette/pyrunner
  license: MIT
  license_file: LICENSE
  summary: Wrap your scripts around a cli.
  description: |
    Wrap your scripts around a cli.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyrunner
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyrunner
