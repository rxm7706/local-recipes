# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.5"

package:
  name: mineru
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mineru/mineru-3.4.5-py3-none-any.whl
  sha256: 4a73b865920bb9109c1b8b1bc46567e296bf0133a67106a04effd219536ae72d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8.1.7
    - loguru >=0.7.2
    - numpy >=1.21.6
    - tqdm >=4.67.1
    - requests
    - httpx
    - pillow >=11.0.0
    - pypdfium2 <6.0.0,>=4.30.0
    - pypdf >=5.6.0
    - reportlab
    - pdftext <0.8.0,>=0.6.3
    - modelscope >=1.26.0
    - huggingface-hub >=0.32.4
    - json-repair >=0.46.2
    - opencv >=4.11.0.86
    - fast-langdetect <0.3.0,>=0.2.3
    - openai <3,>=1.70.0
    - beautifulsoup4 <5,>=4.13.5
    - magika <1.1.0,>=0.6.2
    - mineru-vl-utils <2,>=1.0.5
    - python-docx <2,>=1.2.0
    - pypptx-with-oxml <2,>=1.0.3
    - mammoth <2,>=1.11.0
    - pylatexenc <3,>=2.10
    - lxml <7.0.0,>=4.0.0
    - openpyxl <4,>=3.1.5
    - fastapi
    - python-multipart
    - uvicorn
    - if: osx
      then:
        - mineru
    - if: linux
      then:
        - mineru
    - if: win
      then:
        - mineru

tests:
  - python:
      imports:
        - mineru
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mineru.net/
  license: LicenseRef-MinerU-Open-Source-License
  license_file: LICENSE
  summary: A practical document parsing tool for converting PDF, images, DOCX, PPTX, and XLSX into Markdown and JSON
  description: |
    A practical document parsing tool for converting PDF, images, DOCX, PPTX, and XLSX into Markdown and JSON
  documentation: https://opendatalab.github.io/MinerU/

extra:
  recipe-maintainers:
    - rxm7706

