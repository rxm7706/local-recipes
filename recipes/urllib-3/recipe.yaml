# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: urllib-3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urllib-3/urllib-3-${{ version }}.tar.gz
  sha256: 3341053ddfbfb15d98b33f8503881c0d03f9f5839e114e298de13f0f83b253cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - urllib_3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/urllib-3/
  license: MIT
  license_file: LICENSE
  summary: A harmless package to prevent exploitation
  description: |
    A harmless package to prevent exploitation

extra:
  recipe-maintainers:
    - rxm7706

