# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: pysingleton
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysingleton/pysingleton-${{ version }}.tar.gz
  sha256: 5776e7a4ba0bab26709da604f4e648c5814385fef34010723db3da0d41b0dbcc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - singleton
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/timofurrer/singleton
  license: MIT
  license_file: LICENSE
  summary: Use singletons with a decorator
  description: |
    Use singletons with a decorator

extra:
  recipe-maintainers:
    - rxm7706

