# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0.0.1"

package:
  name: rpa-framework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rpa-framework/rpa-framework-${{ version }}.tar.gz
  sha256: 20c4965af44f92aee9c7ad7957e98b88ee17ea3b669e0740436deb3087f2f456

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rpa_framework
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rpa-framework/
  license: MIT
  license_file: LICENSE
  summary: Deprecated project. Current project is rpaframework.
  description: |
    Deprecated project. Current project is rpaframework.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
