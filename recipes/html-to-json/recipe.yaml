# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: html-to-json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/html-to-json/html_to_json-${{ version }}.tar.gz
  sha256: 1f58229aff7ca10f510415280c466c637e4a895885dd8aac6838f389254e795a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 ==4.14.3

tests:
  - python:
      imports:
        - html_to_json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fhightower/html-to-json
  license: MIT
  license_file: LICENSE
  summary: Convert html to json.
  description: |
    Convert html to json.
  repository: https://github.com/fhightower/html-to-json
  documentation: https://github.com/fhightower/html-to-json

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
