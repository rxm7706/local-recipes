# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: pants
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pants/pants-${{ version }}.tar.gz
  sha256: a9108a2b514d9b59c361b31d96ad4580c7976a6ada19ae3972a40ed21c38d76d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pants
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.pantspowered.org/
  license: MIT
  license_file: LICENSE
  summary: An asynchronous networking library for Python.
  description: |
    An asynchronous networking library for Python.

extra:
  recipe-maintainers:
    - rxm7706

