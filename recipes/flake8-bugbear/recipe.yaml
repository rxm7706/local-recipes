# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.11.29"

package:
  name: flake8-bugbear
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flake8-bugbear/flake8_bugbear-${{ version }}.tar.gz
  sha256: b5d06710f3d26e595541ad303ad4d5cb52578bd4bccbb2c2c0b2c72e243dafc8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - flake8-bugbear
    - flake8 >=7.2.0
    - attrs >=22.2.0

tests:
  - python:
      imports:
        - flake8_bugbear
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PyCQA/flake8-bugbear
  license: MIT
  license_file: LICENSE
  summary: A plugin for flake8 finding likely bugs and design problems in your program. Contains warnings that don't belong in pyflakes and pycodestyle.
  description: |
    A plugin for flake8 finding likely bugs and design problems in your program. Contains warnings that don't belong in pyflakes and pycodestyle.

extra:
  recipe-maintainers:
    - dopplershift

