# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: pytest-cover
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-cover/pytest-cover-${{ version }}.tar.gz
  sha256: 5bdb6c1cc3dd75583bb7bc2c57f5e1034a1bfcb79d27c71aceb0b16af981dbf4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest-cov

tests:
  - python:
      imports:
        - pytest_cover
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ionelmc/pytest-cover
  license: MIT
  license_file: LICENSE
  summary: Pytest plugin for measuring coverage. Forked from `pytest-cov`.
  description: |
    Pytest plugin for measuring coverage. Forked from `pytest-cov`.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
