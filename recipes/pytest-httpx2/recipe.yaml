# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pytest-httpx2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-httpx2/pytest_httpx2-${{ version }}.tar.gz
  sha256: d897a14c1341d3f3014e9432c16fed366598aba06a2ba9c08460a51799cb7128

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.14,<0.12
  run:
    - python >=${{ python_min }}
    - respx
    - pytest

tests:
  - python:
      imports:
        - pytest_httpx2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-httpx2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A pytest plugin for mocking out httpx2 using respx.
  description: |
    A pytest plugin for mocking out httpx2 using respx.
  repository: https://github.com/lundberg/pytest-httpx2

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
