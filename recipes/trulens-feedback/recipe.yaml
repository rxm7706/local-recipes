# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.13.0"

package:
  name: trulens-feedback
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trulens-feedback/trulens_feedback-${{ version }}.tar.gz
  sha256: 429515ce475aef19b67826f76ed2bfe0243db62718a0f9e5919492a87c5c7dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - nltk <4.0.0,>=3.9.1
    - numpy >=1.23.0
    - pydantic <3.0.0,>=2.4.2
    - requests <3.0,>=2.31
    - scikit-learn <2.0.0,>=1.3.0
    - scipy <2.0.0,>=1.11.1
    - trulens-core <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - trulens.feedback
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://trulens.org/
  license: MIT
  license_file: LICENSE
  summary: A TruLens extension package implementing feedback functions for LLM App evaluation.
  description: |
    A TruLens extension package implementing feedback functions for LLM App evaluation.
  repository: https://github.com/truera/trulens
  documentation: https://trulens.org/getting_started/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
