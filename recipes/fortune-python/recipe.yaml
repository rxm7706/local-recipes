# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: fortune-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fortune-python/fortune_python-${{ version }}.tar.gz
  sha256: 8b72d5b56275d39cba7c06cc7f84f1eda9edeaf5a3cefe0b619c89ecb19cfa11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fortune
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fortune-python/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Fortune clone in Python
  description: |
    A Fortune clone in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
