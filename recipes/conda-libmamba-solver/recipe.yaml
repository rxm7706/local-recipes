# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.0"

package:
  name: conda-libmamba-solver
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-libmamba-solver/archive/${{ version }}.tar.gz
  sha256: 785d6035eedf511c6755d53a5ff34634a56427be49fd337bb6433c2270b4fdb6
  target_directory: src/

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install src/ -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - libmambapy >=2.0.0,!=2.6.2
    - boltons >=23.0.0
  run_constraints:
    # This is technically a `run` dependency (we do import it), but
    # conda already depends on conda-libmamba-solver, so it creates a
    # dependency cycle that complicates migrations
    - conda >=26.5

tests:
  - python:
      imports:
        - conda_libmamba_solver
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - conda
    script:
      - conda create -c conda-forge -n test --dry-run scipy --solver=libmamba
      - CONDA_SOLVER=libmamba conda create -c conda-forge -n test --dry-run scipy

about:
  license: BSD-3-Clause
  license_file: src/LICENSE
  summary: The fast mamba solver, now in conda!
  homepage: https://github.com/conda/conda-libmamba-solver
  repository: https://github.com/conda/conda-libmamba-solver
  documentation: https://conda.github.io/conda-libmamba-solver/

extra:
  recipe-maintainers:
    - jaimergp
    - jezdez
    - wolfv

