# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0.4"

package:
  name: acryl-datahub-airflow-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/acryl-datahub-airflow-plugin/acryl_datahub_airflow_plugin-${{ version }}.tar.gz
  sha256: 996fb5c0456d36951c4136edcd1f38d0f890f75e5a0de29dff57895e01a16d48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1
    - wheel
    - pip >=21.0.0
  run:
    - python >=${{ python_min }}
    - acryl-datahub ==1.7.0.4
    - airflow <4.0.0,>=3.0.0
    - pydantic >=2.4.0
    - apache-airflow-providers-openlineage >=2.1.0

tests:
  - python:
      imports:
        - datahub_airflow_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://datahub.com/
  license: Apache-2.0
  license_file: LICENSE
  summary: DataHub Airflow plugin — automatically capture pipeline lineage, run history, and task metadata from Apache Airflow
  description: |
    DataHub Airflow plugin — automatically capture pipeline lineage, run history, and task metadata from Apache Airflow
  repository: https://github.com/datahub-project/datahub
  documentation: https://docs.datahub.com/

extra:
  recipe-maintainers:
    - rxm7706

