# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: datacontract-specification
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datacontract-specification/datacontract_specification-${{ version }}.tar.gz
  sha256: 5fc612255667581321b480e3f646c76ece618632a4aca4cd6ea5f647d98cbb61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2.8.0
    - pyyaml >=6.0.0

tests:
  - python:
      imports:
        - datacontract_specification
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/datacontract/datacontract-specification-python
  license: MIT
  license_file: LICENSE
  summary: The Pydantic Model of the Data Contract Specification
  description: |
    The Pydantic Model of the Data Contract Specification

extra:
  recipe-maintainers:
    - rxm7706

