# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.3"

package:
  name: cfenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cfenv/cfenv-${{ version }}.tar.gz
  sha256: c7a91a4c82431acfc35db664c194d5e6cc7f4df3dcb692d0f836a6ceb0156167

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - furl

tests:
  - python:
      imports:
        - cfenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jmcarp/py-cfenv
  license: MIT
  license_file: LICENSE
  summary: Python wrapper for Cloud Foundry environments
  description: |
    Python wrapper for Cloud Foundry environments

extra:
  recipe-maintainers:
    - sumanth-manchala

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cfenv
  cfe-upstream-registry: pypi
  cfe-upstream-name: cfenv
  cfe-purls:
    - pkg:conda/cfenv@${{ version }}?channel=conda-forge
    - pkg:pypi/cfenv@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/jmcarp/py-cfenv
  cfe-import-names: [cfenv]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cfenv-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.5.3

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T08:26:31Z
