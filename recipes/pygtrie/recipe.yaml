# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.0"

package:
  name: pygtrie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtrie/pygtrie-${{ version }}.tar.gz
  sha256: 203514ad826eb403dab1d2e2ddd034e0d1534bbe4dbe0213bb0593f66beba4e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pygtrie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mina86/pygtrie
  license: Apache-2.0
  license_file: LICENSE
  summary: A pure Python trie data structure implementation.
  description: |
    A pure Python trie data structure implementation.

extra:
  recipe-maintainers:
    - Suor
    - shcheklein

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pygtrie
