    - pkg:pypi/pygtrie@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/mina86/pygtrie
  cfe-import-names: [pygtrie]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pygtrie-feedstock
  cfe-forge-recipe-updates-needed: 
