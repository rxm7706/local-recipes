# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"

package:
  name: zero
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zero/zero-${{ version }}.tar.gz
  sha256: c42d0363823f1ed68cf147e129c65c844e77092d238f345056bf11ebded38d77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - numpy >=1.15.2
    - scipy >=1.1.0
    - matplotlib-base >=3.0.3
    - requests >=2.19.1
    - progressbar2 >=3.38.0
    - tabulate >=0.8.2
    - setuptools-scm >=3.1.0
    - ply >=3.11
    - click ==7.0
    - quantiphy >=2.5.0
    - pyyaml >=3.13
    - python-graphviz >=0.9

tests:
  - python:
      imports:
        - zero
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://git.ligo.org/sean-leavey/zero
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Linear circuit simulator
  description: |
    Linear circuit simulator

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zero
