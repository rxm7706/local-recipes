# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.7"

package:
  name: github
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/github/github-${{ version }}.tar.gz
  sha256: 6206b890d6ed3fa5de2ca80372a7c9fb3e980c6c62d4557f3ee6f1cc109496be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - typing_extensions

tests:
  - python:
      imports:
        - github
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/VarMonke/Github-Api-Wrapper
  license: MIT
  license_file: LICENSE
  summary: An asynchronous python wrapper around the GitHub API
  description: |
    An asynchronous python wrapper around the GitHub API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: github
  cfe-upstream-registry: pypi
  cfe-upstream-name: github
  cfe-purls:
    - pkg:conda/github@${{ version }}?channel=conda-forge
    - pkg:pypi/github@${{ version }}
  cfe-upstream-repo: https://github.com/VarMonke/Github-Api-Wrapper
  cfe-upstream-homepage: https://github.com/VarMonke/Github-Api-Wrapper
  cfe-import-names: [github]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
