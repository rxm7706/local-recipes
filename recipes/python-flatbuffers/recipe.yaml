# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-flatbuffers
  pypi_name: flatbuffers
  version: "25.12.19"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/google/flatbuffers/archive/v${{ version }}.tar.gz
  sha256: f81c3162b1046fe8b84b9a0dbdd383e24fdbcf88583b9cb6028f90d04d90696a

build:
  number: 0
  noarch: python
  script: cd python && VERSION=v${{ version }} ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flatbuffers
        - flatbuffers.builder
        - flatbuffers.table
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python runtime library for use with the Flatbuffers serialization format.
  description: |
    FlatBuffers is an efficient cross platform serialization library for C++, C#, C, Go, Java, JavaScript, Lobster, Lua, TypeScript, PHP, Python, and Rust. It was originally created at Google for game development and other performance-critical applications. This package is the python runtime library. The flatc compiler is in the flatbuffers conda package.
  homepage: https://google.github.io/flatbuffers/
  repository: https://github.com/google/flatbuffers
  documentation: https://google.github.io/flatbuffers/

extra:
  recipe-maintainers:
    - kalefranz
    - njzjz
    - xhochy

