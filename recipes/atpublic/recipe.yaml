# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: atpublic
  version: "7.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 466ef10d0c8bbd14fd02a5fbd5a8b6af6a846373d91106d3a07c16d72d96b63e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - public
        - public.public
        - public.private
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Keep all y'all's __all__'s in sync
  homepage: http://public.readthedocs.io/
  repository: https://gitlab.com/warsaw/public.git
  documentation: https://public.readthedocs.io

extra:
  recipe-maintainers:
    - keller00
    - johanneskoester
