# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0.0"

package:
  name: atpublic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/atpublic/atpublic-${{ version }}.tar.gz
  sha256: 466ef10d0c8bbd14fd02a5fbd5a8b6af6a846373d91106d3a07c16d72d96b63e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - public
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/atpublic/
  license: Apache-2.0
  license_file: LICENSE
  summary: Keep all y'all's __all__'s in sync
  description: |
    Keep all y'all's __all__'s in sync
  repository: https://gitlab.com/warsaw/public.git
  documentation: https://public.readthedocs.io

extra:
  recipe-maintainers:
    - keller00
    - johanneskoester

