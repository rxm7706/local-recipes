# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: gym-notices
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gym-notices/gym_notices-${{ version }}.tar.gz
  sha256: 9f9477ef68a8c15e42625d4fa53631237e3e6ae947f325b5c149c081499adc1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gym_notices
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Farama-Foundation/gym-notices
  license: MIT
  license_file: LICENSE.txt
  summary: Notices for gym
  description: |
    Notices for gym

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
