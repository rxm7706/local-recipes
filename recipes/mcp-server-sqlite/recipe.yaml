# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.4.25"

package:
  name: mcp-server-sqlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server-sqlite/mcp_server_sqlite-${{ version }}.tar.gz
  sha256: 5c396211adb90595d06a505ac836657fc76ee4439e132acdf65caf21b4a8de42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.6.0

tests:
  - python:
      imports:
        - mcp_server_sqlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server-sqlite/
  license: MIT
  license_file: LICENSE
  summary: A simple SQLite MCP server
  description: |
    A simple SQLite MCP server

extra:
  recipe-maintainers:
    - rxm7706

