# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.16.2"

package:
  name: pyvisa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyVISA/pyvisa-${{ version }}.tar.gz
  sha256: 75beb93eeafe20a50be5726fa4e3a645948c93d86819f9c1f8c542efa4085a38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
    - wheel
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - pyvisa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyvisa/pyvisa
  license: MIT
  license_file: LICENSE
  summary: Python VISA bindings for GPIB, RS232, TCPIP and USB instruments
  description: |
    Python VISA bindings for GPIB, RS232, TCPIP and USB instruments
  documentation: https://pyvisa.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - jjerphan
    - melund
    - ddale
    - cjermain
    - MatthieuDartiailh

