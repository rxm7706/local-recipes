# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: dirhash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dirhash/dirhash-${{ version }}.tar.gz
  sha256: e60760f0ab2e935d8cb088923ea2c6492398dca42cec785df778985fd4cd5386

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - versioneer ==0.29
  run:
    - python >=${{ python_min }}
    - scantree >=0.0.4

tests:
  - python:
      imports:
        - dirhash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andhus/dirhash-python
  license: MIT
  license_file: LICENSE
  summary: Python module and CLI for hashing of file system directories.
  description: |
    Python module and CLI for hashing of file system directories.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
