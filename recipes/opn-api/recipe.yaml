# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.11"

package:
  name: opn-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opn-api/opn_api-${{ version }}.tar.gz
  sha256: 8eb36156ecbd52a2d026a71379c2a6ca9d05e89192d1c2557569ff8207504b79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opn-api
    - arrow
    - pydantic
    - requests

tests:
  - python:
      imports:
        - opn_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/devinbarry/opn-api
  license: MIT
  license_file: LICENSE
  summary: A Python client library for OPNsense API.
  description: |
    A Python client library for OPNsense API.
  documentation: https://github.com/devinbarry/opn-api

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
