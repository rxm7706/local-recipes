# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: plumber
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plumber/plumber-${{ version }}.tar.gz
  sha256: 33f193307b4e16330eb376af2a8173737f71d8716d6d8e97c2d0bf037645af87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - plumber
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/conestack/plumber
  license: PSF-2.0
  license_file: LICENSE
  summary: An alternative to mixin-based extension of classes.
  description: |
    An alternative to mixin-based extension of classes.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
