# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: vega-datasets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vega-datasets/vega_datasets-${{ version }}.tar.gz
  sha256: 9dbe9834208e8ec32ab44970df315de9102861e4cda13d8e143aab7a80d93fc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas

tests:
  - python:
      imports:
        - vega_datasets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/altair-viz/vega_datasets
  license: MIT
  license_file: LICENSE
  summary: A Python package for offline access to Vega datasets
  description: |
    A Python package for offline access to Vega datasets
  repository: https://github.com/altair-viz/vega_datasets

extra:
  recipe-maintainers:
    - jakevdp

