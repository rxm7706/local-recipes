# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.18.0"

package:
  name: tflite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tflite/tflite-${{ version }}.tar.gz
  sha256: 07e9478e0d0fb4d3082d0ce8e7e6eab4a90a7174412faec7702e24bfcbf4190d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flatbuffers
    - numpy

tests:
  - python:
      imports:
        - tflite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://zhenhuaw.me/tflite
  license: Apache-2.0
  license_file: LICENSE
  summary: Parsing TensorFlow Lite Models (*.tflite) Easily
  description: |
    Parsing TensorFlow Lite Models (*.tflite) Easily
  repository: https://github.com/zhenhuaw-me/tflite

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tflite
  cfe-upstream-registry: pypi
  cfe-upstream-name: tflite
