# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.14.2"

package:
  name: anyio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anyio/anyio-${{ version }}.tar.gz
  sha256: cfa139f3ed1a23ee8f88a145ddb5ac7605b8bbfd8592baacd7ce3d8bb4313c7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=6.4
  run:
    - python >=${{ python_min }}
    - exceptiongroup >=1.0.2
    - idna >=2.8
    - typing_extensions >=4.5

tests:
  - python:
      imports:
        - anyio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/anyio/
  license: MIT
  license_file: LICENSE
  summary: High-level concurrency and networking framework on top of asyncio or Trio
  description: |
    High-level concurrency and networking framework on top of asyncio or Trio
  documentation: https://anyio.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - bollwyvl
    - CJ-Wright
    - dhirschfeld

#### CFE metadata AND comments
