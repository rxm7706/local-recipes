# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: c-blosc2
  version: "3.3.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Blosc/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: a8fb27bae6403872bb6e5bb8672e79a5b7eb6b3d8fd7c3e6aa7b888436b68ee2

build:
  number: 0

requirements:
  build:
    - cmake
    - if: unix
      then: make
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  host:
    - lz4-c
    - zstd
    - zlib-ng
  run_exports:
    - ${{ pin_subpackage('c-blosc2', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -e $PREFIX/include/blosc2.h
      - if: unix
        then: test -e $PREFIX/include/blosc2/blosc2-export.h
      - if: unix
        then: test -e $PREFIX/lib/libblosc2${SHLIB_EXT}
      - if: unix
        then: test -e $PREFIX/lib/pkgconfig/blosc2.pc
      - if: win
        then: if not exist %LIBRARY_INC%\blosc2.h exit 1
      - if: win
        then: if not exist %LIBRARY_INC%\blosc2\blosc2-export.h exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\libblosc2.dll exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\pkgconfig\blosc2.pc exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\blosc2.lib exit 1.

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A simple, compressed, fast and persistent data store library for C
  description: |
    Next generation of C-Blosc library bringing in a new container (schunk) that can optionally be persisted (frame).  Also, more filters, codecs and other bells and whistles like pre-filter support have been added.  The API tries to be as compatible as possible with the original C-Blosc.


  homepage: https://github.com/Blosc/${{ name }}

extra:
  recipe-maintainers:
    - FrancescAlted
    - hmaarrfk
    - zklaus
