# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: prefect
  version: "3.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 614d4ec4d13020f0e5e5b6eac8766b0641d34d4a46c360b6e7f1fa89df3037ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - prefect = prefect.cli:app

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - aiosqlite >=0.17.0,<1.0.0
    - alembic >=1.7.5,<2.0.0
    - amplitude-analytics >=1.2.1,<2.0.0
    - anyio >=4.4.0,<5.0.0,!=4.14.2
    - apprise >=1.1.0,<2.0.0
    - asgi-lifespan >=1.0,<3.0
    - asyncpg >=0.23,<1.0.0
    - cachetools >=5.3,<8.0
    - click >=8.0,<9
    - cloudpickle >=2.0,<4.0
    - coolname >=1.0.4,<5.0.0,!=4.1.0
    - cryptography >=36.0.1
    - cyclopts >=3.0
    - dateparser >=1.1.1,<2.0.0
    - docker-py >=4.0,<8.0
    - exceptiongroup >=1.0.0
    - fastapi >=0.111.0,<1.0.0
    - fsspec >=2022.5.0
    - python-graphviz >=0.20.1
    - griffe >=0.49.0,<3.0.0
    - httpcore >=1.0.5,<2.0.0
    - httpx >=0.23,!=0.23.2
    - humanize >=4.9.0,<5.0.0
    - jinja2 >=3.1.6,<4.0.0
    - jinja2-humanize-extension >=0.4.0
    - jsonpatch >=1.32,<2.0
    - jsonschema >=4.18.0,<5.0.0
    - opentelemetry-api >=1.27.0,<2.0.0
    - orjson >=3.7,<4.0
    - packaging >=21.3,<25.1
    - pathspec >=0.10.1
    - pendulum >=3.0.0,<4
    - pluggy >=1.6.0
    - prometheus_client >=0.20.0
    - pydantic >=2.10.1,<3.0.0,!=2.11.0,!=2.11.1,!=2.11.2,!=2.11.3,!=2.11.4
    - pydantic-core >=2.12.0,<3.0.0
    - pydantic-extra-types >=2.8.2,<3.0.0
    - pydantic-settings >2.2.1,<3.0.0,!=2.9.0
    - pydocket >=0.17.7
    - python-dateutil >=2.8.2,<3.0.0
    - python-slugify >=5.0,<9.0
    - pytz >=2021.1,<2027
    - pyyaml >=5.4.1,<7.0.0
    - readchar >=4.0.0,<5.0.0
    - rfc3339-validator >=0.1.4,<0.2.0
    - rich >=11.0,<15.0
    - ruamel.yaml >=0.17.0
    - ruamel.yaml.clib >=0.2.8
    - semver >=3.0.4
    - sniffio >=1.3.0,<2.0.0
    - sqlalchemy >=2.0,<3.0.0
    - toml >=0.10.0
    - typing_extensions >=4.10.0,<5.0.0
    - uvicorn >=0.14.0,!=0.29.0
    - websockets >=15.0.1,<17.0
    - whenever >=0.7.3,<0.10.0

tests:
  - python:
      imports:
        - prefect
        - prefect.cli
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - prefect --help
      - prefect version
      - sh -c '[ "$(prefect --version)" = "${{ version }}" ]'

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: The Prefect Core automation engine
  description: |
    Prefect is a workflow management system, designed for modern infrastructure
    and powered by the open-source Prefect Core workflow engine.
    Users organize `Tasks` into `Flows`, and Prefect takes care of the rest.
  homepage: https://github.com/PrefectHQ/prefect
  documentation: https://docs.prefect.io/

extra:
  recipe-maintainers:
    - zzstoatzz
    - cicdw
    - desertaxle
