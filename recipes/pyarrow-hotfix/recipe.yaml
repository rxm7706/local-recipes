# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7"

package:
  name: pyarrow-hotfix
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyarrow-hotfix/pyarrow_hotfix-${{ version }}.tar.gz
  sha256: 59399cd58bdd978b2e42816a4183a55c6472d4e33d183351b6069f11ed42661d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyarrow_hotfix
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyarrow-hotfix/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://github.com/pitrou/pyarrow-hotfix
  documentation: https://github.com/pitrou/pyarrow-hotfix#readme

extra:
  recipe-maintainers:
    - xhochy
    - jorisvandenbossche

