# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyarrow-hotfix
  version: "0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyarrow_hotfix-${{ version }}.tar.gz
  sha256: 59399cd58bdd978b2e42816a4183a55c6472d4e33d183351b6069f11ed42661d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyarrow >=0.14

tests:
  - python:
      imports:
        - pyarrow_hotfix
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Hotfix older pyarrow releases to avoid the CVE fixed in 14.0.1
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/pitrou/pyarrow-hotfix
  repository: https://github.com/pitrou/pyarrow-hotfix

extra:
  recipe-maintainers:
    - xhochy
    - jorisvandenbossche
