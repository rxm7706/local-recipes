# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.02"

package:
  name: http
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/http/http-${{ version }}.tar.gz
  sha256: 071bc409f687535b6e31a94bced6a7773905abad8d2f236b406202b7283f682c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - http
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/franckcuny/http
  license: MIT
  license_file: LICENSE
  summary: HTTP library for Python
  description: |
    HTTP library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: http
  cfe-upstream-registry: pypi
  cfe-upstream-name: http
  cfe-purls:
    - pkg:conda/http@${{ version }}?channel=conda-forge
    - pkg:pypi/http@${{ version }}
  cfe-upstream-repo: https://github.com/franckcuny/http
  cfe-upstream-homepage: https://github.com/franckcuny/http
  cfe-import-names: [http]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
