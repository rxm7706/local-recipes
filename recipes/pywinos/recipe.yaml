# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: pywinos
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywinos/pywinos-${{ version }}.tar.gz
  sha256: cfd05d423ef03d52eef15a943b67de5674aaf4c0e0ef34e538eaee0ebfccb3a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - pywinrm >=0.4.1
    - plogger >=1.0.8
    - requests-credssp >=1.1.1
    - requests >=2.31.0
    - xmltodict

tests:
  - python:
      imports:
        - pywinos
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/c-pher/PyWinOS
  license: GPL-3.0-only
  license_file: LICENSE
  summary: The cross-platform tool to execute PowerShell and commandline commands remotely and locally.
  description: |
    The cross-platform tool to execute PowerShell and commandline commands remotely and locally.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
