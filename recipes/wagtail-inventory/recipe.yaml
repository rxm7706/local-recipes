# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3"
  python_min: '3.12'

package:
  name: wagtail-inventory
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail-inventory/wagtail_inventory-${{ version }}.tar.gz
  sha256: f079afbdb8a7d6f98fbe0d23887867807d980faff9e3b0cbd44c9beb378e1610

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=63
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }},<4
    - tqdm >=4.15.0,<5
    - wagtail >=6.2

tests:
  - python:
      imports:
        - wagtailinventory
      pip_check: true
      python_version:
        - ${{ python_min }}.*

about:
  summary: Wagtail report to filter pages by block content
  license: CC0-1.0
  license_file: LICENSE
  homepage: https://github.com/cfpb/wagtail-inventory
  repository: https://github.com/cfpb/wagtail-inventory

extra:
  recipe-maintainers:
    - rxm7706

