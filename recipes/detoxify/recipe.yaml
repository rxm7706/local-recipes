# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: detoxify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/detoxify/detoxify-${{ version }}.tar.gz
  sha256: c119d0b47545bb076190ff583faad9aa3bb0a90ac01c7c4144758606d21da5b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - transformers
    - pytorch >=1.7.0
    - sentencepiece >=0.1.94

tests:
  - python:
      imports:
        - detoxify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/unitaryai/detoxify
  license: Apache-2.0
  license_file: LICENSE
  summary: A python library for detecting toxic comments
  description: |
    A python library for detecting toxic comments

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: detoxify
