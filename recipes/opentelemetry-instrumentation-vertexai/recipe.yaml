# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.62.3"

package:
  name: opentelemetry-instrumentation-vertexai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-vertexai/opentelemetry_instrumentation_vertexai-${{ version }}.tar.gz
  sha256: 586586bf18407c6bcdd33a7bc471f08f4f276d9d27de3d858c47291b6cce9903

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api <2,>=1.38.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions-ai <0.6.0,>=0.5.1
    - opentelemetry-semantic-conventions >=0.63b1

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.vertexai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/opentelemetry-instrumentation-vertexai/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Vertex AI instrumentation
  description: |
    OpenTelemetry Vertex AI instrumentation
  repository: https://github.com/traceloop/openllmetry/tree/main/packages/opentelemetry-instrumentation-vertexai

extra:
  recipe-maintainers:
    - timkpaine

