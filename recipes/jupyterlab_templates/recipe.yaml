# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyterlab_templates
  version: "0.5.3"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c7c68e61f8eaa6f0d69a9117e9945a3bdbf01ab425c51386c0027f85a8f6eae4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - nodejs
    - yarn
    - hatchling >=1.3.1
    - hatch-jupyter-builder
    - jupyterlab >=4,<5
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4,<5

outputs:
  - package:
      name: jupyterlab_templates
  - package:
      name: jupyterlab-templates
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("jupyterlab_templates", exact=True) }}

tests:
  - python:
      imports:
        - jupyterlab_templates
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Jupyter notebook templates
  description: Jupyter notebook templates
  homepage: https://github.com/finos/jupyterlab_templates
  repository: https://github.com/finos/jupyterlab_templates

extra:
  recipe-maintainers:
    - timkpaine
