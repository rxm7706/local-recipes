# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: jsondiff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsondiff/jsondiff-${{ version }}.tar.gz
  sha256: 658d162c8a86ba86de26303cd86a7b37e1b2c1ec98b569a60e2ca6180545f7fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64.0.0
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - jsondiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xlwings/jsondiff
  license: MIT
  license_file: LICENSE
  summary: Diff JSON and JSON-like structures in Python
  description: |
    Diff JSON and JSON-like structures in Python

extra:
  recipe-maintainers:
    - mariusvniekerk

