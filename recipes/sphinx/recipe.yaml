# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.1.0"
  python_min: "3.12"

package:
  name: sphinx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Sphinx/sphinx-${{ version }}.tar.gz
  sha256: 7741722357dd75f8190766926071fed3bdc211c74dd2d7d4df5404da95930ddb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12
  run:
    - python >=${{ python_min }}
    - sphinxcontrib-applehelp >=1.0.7
    - sphinxcontrib-devhelp >=1.0.6
    - sphinxcontrib-htmlhelp >=2.0.6
    - sphinxcontrib-jsmath >=1.0.1
    - sphinxcontrib-qthelp >=1.0.6
    - sphinxcontrib-serializinghtml >=1.1.9
    - jinja2 >=3.1
    - pygments >=2.17
    - docutils <0.23,>=0.21
    - snowballstemmer >=2.2
    - babel >=2.13
    - alabaster >=0.7.14
    - imagesize >=1.3
    - requests >=2.30.0
    - roman-numerals >=1.0.0
    - packaging >=23.0
    - if: win
      then:
        - colorama

tests:
  - python:
      imports:
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sphinx-doc.org/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Python documentation generator
  description: |
    Python documentation generator
  repository: https://github.com/sphinx-doc/sphinx
  documentation: https://www.sphinx-doc.org/

extra:
  recipe-maintainers:
    - AA-Turner
    - blink1073
    - jakirkham
    - matthiasdiener
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sphinx
  cfe-upstream-registry: pypi
  cfe-upstream-name: sphinx
  cfe-purls:
    - pkg:conda/sphinx@${{ version }}?channel=conda-forge
    - pkg:pypi/sphinx@${{ version }}
  cfe-upstream-repo: https://github.com/sphinx-doc/sphinx
  cfe-upstream-homepage: https://www.sphinx-doc.org/
  cfe-import-names: [utils]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sphinx-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-9.1.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T05:43:49Z
