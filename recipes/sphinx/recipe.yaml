# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.12"
  version: "9.1.0"

package:
  name: sphinx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx/sphinx-${{ version }}.tar.gz
  sha256: 7741722357dd75f8190766926071fed3bdc211c74dd2d7d4df5404da95930ddb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sphinx-build = sphinx.cmd.build:main
      - sphinx-quickstart = sphinx.cmd.quickstart:main
      - sphinx-apidoc = sphinx.ext.apidoc:main
      - sphinx-autogen = sphinx.ext.autosummary.generate:main

requirements:
  host:
    - python 3.12.*
    - pip
    - babel
    - flit-core >=3.12
  run:
    - python >=${{ python_min }}
    - alabaster >=0.7.14
    - babel >=2.13
    - docutils >=0.21,<0.23
    - imagesize >=1.3
    - jinja2 >=3.1
    - packaging >=23.0
    - pygments >=2.17
    - requests >=2.30.0
    - roman-numerals >=1.0.0
    - snowballstemmer >=2.2
    - sphinxcontrib-applehelp >=1.0.7
    - sphinxcontrib-devhelp >=1.0.6
    - sphinxcontrib-htmlhelp >=2.0.6
    - sphinxcontrib-jsmath >=1.0.1
    - sphinxcontrib-qthelp >=1.0.6
    - sphinxcontrib-serializinghtml >=1.1.9
    # only _strictly_ a windows dependency, but appeases `pip check`
    - colorama >=0.4.6

tests:
  - python:
      imports:
        - sphinx
        - sphinx.builders
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - sphinx-build --help
      - sphinx-quickstart --version

about:
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: Sphinx makes it easy to create intelligent and beautiful documentation.
  description: |
    Sphinx makes it easy to create intelligent and beautiful documentation.

    Sphinx uses reStructuredText as its markup language, and many of its strengths
    come from the power and straightforwardness of reStructuredText and its parsing
    and translating suite, the Docutils.
  homepage: https://www.sphinx-doc.org/
  repository: https://github.com/sphinx-doc/sphinx
  documentation: https://www.sphinx-doc.org/en/master/

extra:
  recipe-maintainers:
    - AA-Turner
    - blink1073
    - jakirkham
    - matthiasdiener
    - ocefpaf
