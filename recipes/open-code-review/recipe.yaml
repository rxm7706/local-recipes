# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.7"

package:
  name: open-code-review
  version: ${{ version }}

source:
  url: https://github.com/alibaba/open-code-review/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e0947e3059b73cd022f62f4ba902f5c81a84825b0900a2fc2ad2286ae4db22b1

build:
  number: 0
  script:
    - go-licenses save ./cmd/opencodereview --save_path=license-files
    - go build -ldflags="-s -w" -o $PREFIX/bin/opencodereview ./cmd/opencodereview

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - opencodereview --help

about:
  summary: Hybrid-architecture code review tool from Alibaba - deterministic pipelines + LLM agent, precise line-level comments
  description: |
    open-code-review is an open-source code review tool battle-tested at
    Alibaba's scale: a hybrid architecture combining deterministic
    analysis pipelines with an LLM agent for precise line-level review
    comments, with a built-in fine-tuned ruleset (NPE, thread-safety,
    XSS, SQL injection). OpenAI- and Anthropic-compatible; runs locally,
    in CI (GitHub Action), or against staged changes.
  homepage: https://github.com/alibaba/open-code-review
  repository: https://github.com/alibaba/open-code-review
  documentation: https://github.com/alibaba/open-code-review#readme
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
