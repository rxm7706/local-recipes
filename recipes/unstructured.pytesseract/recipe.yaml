# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.15"

package:
  name: unstructured.pytesseract
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unstructured.pytesseract/unstructured.pytesseract-${{ version }}.tar.gz
  sha256: 4b81bc76cfff4e2ef37b04863f0e48bd66184c0b39c3b2b4e017483bca1a7394

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.0.4
    - wheel >=0.29.0
  run:
    - python >=${{ python_min }}
    - packaging >=21.3
    - pillow >=8.0.0

tests:
  - python:
      imports:
        - unstructured_pytesseract
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/madmaze/pytesseract
  license: Apache-2.0
  license_file: LICENSE
  summary: Python-tesseract is a python wrapper for Google's Tesseract-OCR
  description: |
    Python-tesseract is a python wrapper for Google's Tesseract-OCR

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
