# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: httpx-ntlm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpx-ntlm/httpx_ntlm-${{ version }}.tar.gz
  sha256: 41be8a2ba85143484e617dcb917d4b19e3ae12afdc688622a4901034993b53e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.24
    - pyspnego >=0.3

tests:
  - python:
      imports:
        - httpx_ntlm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ulodciv/httpx-ntlm
  license: ISC
  license_file: LICENSE
  summary: This package allows for HTTP NTLM authentication using the HTTPX library.
  description: |
    This package allows for HTTP NTLM authentication using the HTTPX library.

extra:
  recipe-maintainers:
    - dhirschfeld

