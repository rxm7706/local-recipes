# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.15.1"

package:
  name: azure-eventhub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-eventhub/azure_eventhub-${{ version }}.tar.gz
  sha256: 201de7b6e10b7517c594e529aa7d21c6887ac2a4757fc4850c991a3f640a02fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - azure-core >=1.27.0
    - typing_extensions >=4.0.1

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-eventhub/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Event Hubs Client Library for Python
  description: |
    Microsoft Azure Event Hubs Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
