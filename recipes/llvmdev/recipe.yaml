# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# as of LLVM 19, we expect an "-rcX" suffix for the release candidates
schema_version: 1

context:
  version: "18.1.8"
  major_ver: ${{ version.split(".")[0] }}
  tail_ver: ${{ version.split(".")[-1] }}
  maj_min: ${{ major_ver ~ "." ~ version.split(".")[1] }}

recipe:
  name: llvm-package
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version | replace(".rc", "-rc") }}.tar.gz
  sha256: 47c174a186941ae830f04ded76a3444600be67d5e5fb8282c3783fba671c4edb
  patches:
    - patches/0001-pass-through-QEMU_LD_PREFIX-SDKROOT.patch

build:
  number: 0
  merge_build_and_host_envs: false

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - python >=3
    - if: osx
      then: libcxx ${{ cxx_compiler_version }}
  host:
    - if: osx
      then: libcxx ${{ cxx_compiler_version }}
    # needs aarch/ppc/arm (re)build of conda-forge/backtrace-feedstock
    - if: unix and x86
      then: backtrace
    - libxml2-devel
    - zlib
    - zstd

outputs:
  # Contains everything
  - package:
      name: llvmdev
    build:
      activate_in_script: true
      script:
        file: ${{ 'install_llvm.bat' if win else 'install_llvm.sh' if unix else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - python >=3
        - if: win
          then: m2-sed
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
      host:
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - if: win
          then: ${{ pin_subpackage("libllvm-c" ~ major_ver, exact=True) }}
        - ${{ pin_subpackage("llvm-tools", exact=True) }}
        - zlib
        - zstd
      run:
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - if: win
          then: ${{ pin_subpackage("libllvm-c" ~ major_ver, exact=True) }}
        - ${{ pin_subpackage("llvm-tools", exact=True) }}
        # we need to do this manually because clang_bootstrap has no run-export
        - if: osx
          then: libcxx >=${{ cxx_compiler_version }}
      run_constraints:
        - llvm        22.1.8.*
        - llvm-tools  22.1.8.*
        - clang       22.1.8.*
        - clang-tools 22.1.8.*
    tests:
      - requirements:
          run:
            - if: win
              then: ripgrep
        script:
          - if: not win
            then: $PREFIX/bin/llvm-config --libs
          - if: not win
            then: test -f $PREFIX/include/llvm/Pass.h
          - if: not win
            then: test -f $PREFIX/lib/libLLVMCore.a
          - if: not win
            then: $PREFIX/libexec/llvm/not false
          - if: not win
            then: $PREFIX/bin/llvm-nm --help
          - if: win
            then: if not exist %LIBRARY_INC%\\llvm\\Pass.h exit 1
          - if: win
            then: if not exist "%LIBRARY_PREFIX%"\\libexec\llvm\not.exe exit 1
          - if: win
            then: if not exist "%LIBRARY_BIN%"\\llvm-nm.exe exit 1
          - if: win
            then: llvm-nm.exe --help
          - if: win
            then: rg -e "INTERFACE_LINK_LIBRARIES\s\"\$ENV\{VSINSTALLDIR\}[/\w\s]+/diaguids\.lib" %LIBRARY_LIB%\cmake\llvm\LLVMExports.cmake
  # Contains the shared libraries. To make different LLVM libraries co-installable
  # soversion is appended to the package name.
  - package:
      name: libllvm${{ major_ver }}
    build:
      activate_in_script: true
      script:
        file: ${{ 'install_llvm.sh' if not win else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - if: not win
          then: ninja
        - if: not win
          then: cmake
        - if: not win
          then: python >=3
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
      host:
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
        - if: unix
          then: libxml2-devel
        - zlib
        - zstd
      run:
        # we need to do this manually because clang_bootstrap has no run-export
        - if: osx
          then: libcxx >=${{ cxx_compiler_version }}
      run_exports:
        - if: not win
          then: ${{ pin_subpackage("libllvm" ~ major_ver, upper_bound="x.x") }}
    tests:
      - script:
          - if: linux
            then: test -f $PREFIX/lib/libLLVM-${{ major_ver }}${{ extra }}.so
          - if: osx
            then: test -f $PREFIX/lib/libLLVM-${{ major_ver }}${{ extra }}.dylib
          - if: linux
            then: test -f $PREFIX/lib/libLLVM.so.${{ maj_min }}${{ extra }}
          - if: osx
            then: test -f $PREFIX/lib/libLLVM.${{ maj_min }}${{ extra }}.dylib
  # This is a meta package so that people can use the latest libllvm and also
  # for run_exports
  - package:
      name: llvm
    build:
    requirements:
      build:
      host:
        - if: not win
          then: ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - libxml2-devel
        - zlib
        - zstd
      run:  # [not win]
        - if: not win
          then: ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
      run_exports:
        - if: not win
          then: ${{ pin_subpackage("libllvm" ~ major_ver, upper_bound="x.x") }}
      run_constraints:
        - llvmdev     22.1.8.*
        - llvm-tools  22.1.8.*
        - clang       22.1.8.*
        - clang-tools 22.1.8.*
    tests:
      - script:
          - echo "Hello World!"
  # Contains LLVM tools with a version suffix
  - package:
      name: llvm-tools-${{ major_ver }}
    build:
      # On Windows there are no symlinks and copying will create a new package
      # that is 300MB+
      skip: win
      activate_in_script: true
      script:
        file: ${{ 'install_llvm.bat' if win else 'install_llvm.sh' if unix else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - python >=3
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
      host:
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - zlib
        - zstd
      run:
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        # we need to do this manually because clang_bootstrap has no run-export
        - if: osx
          then: libcxx >=${{ cxx_compiler_version }}
    tests:
      - script:
          - if: not win
            then: $PREFIX/bin/llc-${{ major_ver }} -version
          - if: win
            then: if not exist "%LIBRARY_BIN%"\\llc-${{ major_ver }}.exe exit 1
          - if: win
            then: llc-${{ major_ver }} -version
          - if: not win
            then: test ! -f $PREFIX/bin/llvm-config-${{ major_ver }}
          - if: win
            then: if exist "%LIBRARY_BIN%"\\llvm-config-${{ major_ver }}.exe exit 1
  # Contains LLVM tools
  - package:
      name: llvm-tools
    build:
      activate_in_script: true
      script:
        file: ${{ 'install_llvm.bat' if win else 'install_llvm.sh' if unix else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - python >=3
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
      host:
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - if: not win
          then: ${{ pin_subpackage("llvm-tools-" ~ major_ver, exact=True) }}
        # on unix, there's only symlinks
        - if: win
          then: libxml2-devel
        - if: win
          then: zlib
        - if: win
          then: zstd
      run:
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - if: not win
          then: ${{ pin_subpackage("llvm-tools-" ~ major_ver, exact=True) }}
      run_constraints:
        - llvm        22.1.8.*
        - llvmdev     22.1.8.*
        - clang       22.1.8.*
        - clang-tools 22.1.8.*
    tests:
      - script:
          - if: not win
            then: $PREFIX/bin/llc -version
          - if: win
            then: if not exist "%LIBRARY_BIN%"\\llc.exe exit 1
          - if: win
            then: llc -version
          - if: not win
            then: test ! -f $PREFIX/bin/llvm-config
          - if: win
            then: if exist "%LIBRARY_BIN%"\\llvm-config.exe exit 1
  # Contains LLVM-C shared library
  - package:
      name: libllvm-c${{ major_ver }}
    build:
      # not supported on linux, see
      # https://github.com/llvm/llvm-project/blob/llvmorg-16.0.6/llvm/tools/llvm-shlib/CMakeLists.txt#L82-L85
      # osx currently fails as well, see https://github.com/llvm/llvm-project/issues/64657
      skip: not win
      activate_in_script: true
      script:
        file: ${{ 'install_llvm.bat' if win else 'install_llvm.sh' if unix else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
      host:
        - if: osx
          then: libcxx ${{ cxx_compiler_version }}
        - ${{ pin_subpackage("libllvm" ~ major_ver, exact=True) }}
        - zlib
        - zstd
      run_exports:
        - ${{ pin_subpackage("libllvm-c" ~ major_ver, upper_bound="x.x") }}
      run_constraints:
        - llvmdev 22.1.8.*
    tests:
      - script:
          - if: osx
            then: test -f $PREFIX/lib/libLLVM-C.${{ major_ver }}.dylib
          - if: win
            then: if not exist %LIBRARY_BIN%\LLVM-C.dll exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\LLVM-C.lib exit 1
  - package:
      name: lit
    build:
      skip: not linux64
      noarch: python
      script: python -m pip install llvm/utils/lit --no-deps -vv
      python:
        entry_points:
          - lit = lit.main:main
          - llvm-lit = lit.main:main
      activate_in_script: true
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - lit
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
        script:
          - lit -h
          - llvm-lit -h

about:
  license: Apache-2.0 WITH LLVM-exception
  license_file: llvm/LICENSE.TXT
  summary: Development headers and libraries for LLVM
  homepage: http://llvm.org/
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - JohanMabille
    - inducer
    - jakirkham
    - SylvainCorlay
    - isuruf
    - timsnyder
    - xhochy
    - h-vetinari
  feedstock-name: llvmdev

