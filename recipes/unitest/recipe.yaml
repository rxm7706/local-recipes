# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.34"

package:
  name: unitest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unitest/unitest-${{ version }}.tar.gz
  sha256: ad89a03b7f703126a89eba21741d31a33fece1e35335ef02298e0948d01fc513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - selenium
    - gevent
    - geventhttpclient
    - psycogreen
    - locust
    - requests
    - jsonpath-ng
    - greenlet
    - psycopg2
    - assertpy
    - pytest
    - allure-pytest
    - pytest-json-report
    - webdriver-manager
    - faker
    - exrex
    - decorator
    - influxdb-client
    - prometheus_client
    - curlify
    - pyjwt
    - pytest-xdist
    - pytest-rerunfailures
    - fast-map
    - pytest-order
    - gunicorn
    - fastapi-utils
    - uvicorn
    - lxml
    - beautifulsoup4
    - cryptography
    - pandas
    - python-dotenv
    - pybytebuffer
    - websocket-client
    - flake8
    - black
    - pylint
    - pytest-reportportal

tests:
  - python:
      imports:
        - unitest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/zetaengg/unitest_plutus/src/main/
  license: MIT
  license_file: LICENSE
  summary: Utilities required for performance and functional tests
  description: |
    Utilities required for performance and functional tests

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
