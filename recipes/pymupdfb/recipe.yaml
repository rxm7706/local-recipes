# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.24.10"

package:
  name: pymupdfb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyMuPDFb/PyMuPDFb-${{ version }}.tar.gz
  sha256: 007b91fa9b528c5c0eecea2e49c486ac02e878274f9e31522bdd948adc5f8327

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymupdfb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyMuPDFb/
  license: AGPL-3.0
  license_file: LICENSE
  summary: MuPDF shared libraries for PyMuPDF.
  description: |
    MuPDF shared libraries for PyMuPDF.
  repository: https://github.com/pymupdf/pymupdf
  documentation: https://pymupdf.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
