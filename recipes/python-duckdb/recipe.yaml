# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: duckdb
  version: "1.5.5"

recipe:
  name: python-${{ name|lower }}-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 72f33ee57ca7595b23957671a2cc7f7fe2be0ecc2d68f63abedcfcaa3a5c1238

build:
  number: 0

outputs:
  - package:
      name: python-${{ name|lower }}
    build:
      script:
        file: ${{ 'build-duckdb.bat' if win else 'build-duckdb.sh' if unix else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: pybind11 >=2.6
        - cmake >=3.29
        - ninja
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - pybind11 >=2.6
        - scikit-build-core >=0.11.4
        - python
        - pip
        - setuptools
        - setuptools_scm >=8
      run:
        - python
    tests:
      - python:
          imports:
            - duckdb
          pip_check: true
  - package:
      name: ${{ name|lower }}
    build:
      skip: not linux64
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('python-duckdb', upper_bound="x.x.x") }}
    tests:
      - python:
          imports:
            - duckdb
          pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: An Embeddable Analytical Database
  description: |
    DuckDB is an embedded database designed to execute analytical SQL queries
    fast while embedded in another process. It is designed to be easy to
    install and easy to use.
  homepage: https://www.duckdb.org/
  repository: https://github.com/duckdb/duckdb
  documentation: https://duckdb.org/docs/index.html

extra:
  recipe-maintainers:
    - jonashaag
    - sugatoray
    - dhirschfeld
    - xhochy
    - mariusvniekerk
    - gforsyth
