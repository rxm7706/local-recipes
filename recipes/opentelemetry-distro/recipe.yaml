# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-distro
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-distro/opentelemetry_distro-${{ version }}.tar.gz
  sha256: e2fef26fdf72978ab172530c13338aff367edae41ae8d90b7f6133efedde10ab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-sdk ~=1.13

tests:
  - python:
      imports:
        - opentelemetry.distro
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opentelemetry-distro
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Python Distro
  description: |
    OpenTelemetry Python Distro
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - goatmale

#### CFE metadata AND comments
