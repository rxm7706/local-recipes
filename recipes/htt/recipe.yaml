# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.35"

package:
  name: htt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/htt/htt-${{ version }}.tar.gz
  sha256: 711b8a9d8b2c08b66188a2840306f3cd5e0c4d4ba746035d66ddacf0d4dc1882

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - ruamel.yaml
    - protobuf >=5
    - grpcio >=1
    - inuits-python-logging-loki >=1

tests:
  - python:
      imports:
        - htt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/htt/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utility integrating config, logging, testing.
  description: |
    Utility integrating config, logging, testing.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: htt
  cfe-upstream-registry: pypi
  cfe-upstream-name: htt
