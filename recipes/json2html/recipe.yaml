# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: json2html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json2html/json2html-${{ version }}.tar.gz
  sha256: 8951a53662ae9cfd812685facdba693fc950ffc1c1fd1a8a2d3cf4c34600689c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json2html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/softvar/json2html
  license: MIT
  license_file: LICENSE.txt
  summary: JSON to HTML Table Representation
  description: |
    JSON to HTML Table Representation

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: json2html
  cfe-upstream-registry: pypi
  cfe-upstream-name: json2html
