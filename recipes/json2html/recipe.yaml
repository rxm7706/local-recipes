    - pkg:pypi/json2html@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/softvar/json2html
  cfe-import-names: [json2html]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/json2html-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T09:51:21Z
