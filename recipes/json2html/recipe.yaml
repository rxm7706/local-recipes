# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: json2html
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/json2html-${{ version }}.tar.gz
  sha256: 8951a53662ae9cfd812685facdba693fc950ffc1c1fd1a8a2d3cf4c34600689c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json2html
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: JSON to HTML Table Representation
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/softvar/json2html

extra:
  recipe-maintainers:
    - thewchan
