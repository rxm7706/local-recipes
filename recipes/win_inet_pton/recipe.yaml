# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: win_inet_pton
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/win_inet_pton/win_inet_pton-${{ version }}.tar.gz
  sha256: dd03d942c0d3e2b1cf8bab511844546dfa5f74cb61b241699fa379ad707dea4f

build:
  number: 8
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - __win

tests:
  - python:
      imports:
        - win_inet_pton
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: LicenseRef-Public-Domain
  license_file: LICENSE
  summary: Native inet_pton and inet_ntop implementation for Python on Windows (with ctypes).
  homepage: https://github.com/hickeroar/win_inet_pton
  repository: https://github.com/hickeroar/win_inet_pton

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
