# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: graphlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphlite/graphlite-${{ version }}.tar.gz
  sha256: aa7b23dc0857055685b03c2d54864e20e5c584e821e328fced3b675d8f3fc9f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - graphlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eugene-eeo/graphlite
  license: MIT
  license_file: LICENSE
  summary: embedded graph datastore
  description: |
    embedded graph datastore

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
