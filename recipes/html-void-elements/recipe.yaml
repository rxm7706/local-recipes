# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: html-void-elements
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/html-void-elements-${{ version }}.tar.gz
  sha256: 931b88f84cd606fee0b582c28fcd00e41d7149421fb673e1e1abd2f0c4f231f0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0

tests:
  - python:
      imports:
        - HtmlVoidElements
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: List of HTML void tag names.
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/Riverside-Healthcare/html-void-elements

extra:
  recipe-maintainers:
    - rxm7706

