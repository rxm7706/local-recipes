# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: json-strong-typing
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-strong-typing/json_strong_typing-${{ version }}.tar.gz
  sha256: 0b7c490670fdf36c73510b41d2942f6375a29fae7e5c880b3c85b82dae213c13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=51
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - jsonschema >=4.23
    - typing_extensions >=4.12

tests:
  - python:
      imports:
        - strong_typing
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Type-safe data interchange for Python data classes
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/hunyadi/strong_typing

extra:
  recipe-maintainers:
    - rxm7706

