# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: beautifulsoup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/BeautifulSoup/BeautifulSoup-${{ version }}.tar.gz
  sha256: a04169602bff6e3138b1259dbbf491f5a27f9499dea9a8fbafd48843f9d89970

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - beautifulsoup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.crummy.com/software/BeautifulSoup/
  license: MIT
  license_file: LICENSE
  summary: Screen-scraping library
  description: |
    Screen-scraping library

extra:
  recipe-maintainers:
    - rxm7706

