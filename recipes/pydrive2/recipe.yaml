# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.21.3"

package:
  name: pydrive2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyDrive2/pydrive2-${{ version }}.tar.gz
  sha256: 649b84d60c637bc7146485039535aa8f1254ad156423739f07e5d32507447c13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
  run:
    - python >=${{ python_min }}
    - google-api-python-client >=1.12.5
    - oauth2client >=4.0.0
    - pyyaml >=3.0
    - cryptography <44
    - pyopenssl <=24.2.1,>=19.1.0

tests:
  - python:
      imports:
        - pydrive2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/iterative/PyDrive2
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Drive API made easy. Maintained fork of PyDrive.
  description: |
    Google Drive API made easy. Maintained fork of PyDrive.
  documentation: https://docs.iterative.ai/PyDrive2

extra:
  recipe-maintainers:
    - shcheklein

