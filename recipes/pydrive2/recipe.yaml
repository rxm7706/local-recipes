# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: PyDrive2
  version: "1.21.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|lower }}-${{ version }}.tar.gz
  sha256: 649b84d60c637bc7146485039535aa8f1254ad156423739f07e5d32507447c13

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools_scm >=6.3.1
  run:
    - python >=${{ python_min }}
    - google-api-python-client >=1.12.5
    - six >=1.13.0
    - oauth2client >=4.0.0
    - pyyaml >=3.0
    # https://github.com/iterative/PyDrive2/issues/361
    - pyOpenSSL >=19.1.0, <=24.2.1
    - fsspec >=2021.7.0
    - tqdm >=4.0.0  # for fsspec
    - funcy <2  # for fsspec
    - appdirs >=1.4.3  # for fsspec

tests:
  - python:
      imports:
        - pydrive2
        - pydrive2.auth
        - pydrive2.drive
        - pydrive2.files
        - pydrive2.settings
        - pydrive2.fs
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: >
    Google Drive API Python wrapper library. Actively maintained fork of PyDrive.
  homepage: https://github.com/iterative/PyDrive2
  repository: https://github.com/iterative/PyDrive2
  documentation: https://gsuitedevs.github.io/PyDrive/docs/build/html/index.html

extra:
  recipe-maintainers:
    - shcheklein
