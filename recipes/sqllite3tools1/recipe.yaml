# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: sqllite3tools1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqllite3tools1/sqllite3tools1-${{ version }}.tar.gz
  sha256: 9ae76dea57e5d93e749f1aac713d7420ae134d22aded4bef8148b8f631701968

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqllite3tools1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqllite3tools1/
  license: MIT
  license_file: LICENSE
  summary: SQLITE tools
  description: |
    SQLITE tools

extra:
  recipe-maintainers:
    - rxm7706

