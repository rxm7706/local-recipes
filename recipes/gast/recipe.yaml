# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: gast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gast/gast-${{ version }}.tar.gz
  sha256: 0bb14cd1b806722e91ddbab6fb86bba148c22b40e7ff11e248974e04c8adfdae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gast
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serge-sans-paille/gast/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python AST that abstracts the underlying Python version
  description: |
    Python AST that abstracts the underlying Python version

extra:
  recipe-maintainers:
    - CurtLH
    - martinRenou
    - conda-forge/pythran

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gast
  cfe-upstream-registry: pypi
  cfe-upstream-name: gast
