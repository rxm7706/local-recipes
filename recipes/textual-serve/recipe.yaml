# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: textual-serve
  version: "1.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/textual_serve-${{ version }}.tar.gz
  sha256: f8f636ae2f5fd651b79d965473c3e9383d3521cdf896f9bc289709185da3f683

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<4
    - aiohttp >=3.9.5
    - aiohttp-jinja2 >=1.6
    - jinja2 >=3.1.4
    - rich
    - textual >=0.66.0

tests:
  - python:
      imports:
        - textual_serve
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Serve Textual apps locally
  homepage: https://github.com/Textualize/textual-serve
  repository: https://github.com/Textualize/textual-serve

extra:
  recipe-maintainers:
    - davidbrochart
