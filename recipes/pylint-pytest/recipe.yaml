# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.8"

package:
  name: pylint-pytest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-pytest/pylint_pytest-${{ version }}.tar.gz
  sha256: 5c862c88870aa8eb1b376df48ab9e820b5bdadfe37d965aa9ac567a6305955ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pylint >=2
    - pytest >=4.6

tests:
  - python:
      imports:
        - pylint_pytest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pylint-dev/pylint-pytest
  license: MIT
  license_file: LICENSE
  summary: A Pylint plugin to suppress pytest-related false positives.
  description: |
    A Pylint plugin to suppress pytest-related false positives.
  repository: https://github.com/pylint-dev/pylint-pytest
  documentation: https://github.com/pylint-dev/pylint-pytest#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pylint-pytest
