# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.16"
  python_min: "3.12"

package:
  name: psutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/psutils/psutils-${{ version }}.tar.gz
  sha256: d259da9bc95395fe9761b289333e83866ecbf2d43ee844e74a14a3f74ff2808b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - build-manpages
    - puremagic >=1.26
    - pypdf >=4.3.0

tests:
  - python:
      imports:
        - psutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rrthomas/psutils
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Manipulate PDF and PostScript documents
  description: |
    Manipulate PDF and PostScript documents

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: psutils
  cfe-upstream-registry: pypi
  cfe-upstream-name: psutils
  cfe-purls:
