# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0b260521"
  python_min: "3.10"

package:
  name: agent-framework-ollama
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-ollama/agent_framework_ollama-${{ version }}.tar.gz
  sha256: 80041cae1220ce6cc8774985e37f4810e12fd2d732da81304aa500da57c3bafa

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - agent-framework-core <2,>=1.6.0
    - ollama-python <0.5.4,>=0.5.3

tests:
  - python:
      imports:
        - agent_framework.ollama
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: |
    Ollama integration for Microsoft Agent Framework.
  homepage: https://pypi.org/project/agent-framework-ollama/
  repository: https://github.com/microsoft/agent-framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
    - mgorny
