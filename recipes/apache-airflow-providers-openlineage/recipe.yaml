# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.20.0"

package:
  name: apache-airflow-providers-openlineage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-openlineage/apache_airflow_providers_openlineage-${{ version }}.tar.gz
  sha256: e0430a8fb054978814d4b5185889f92c3103b9a8313d438f30dda0f58af93b77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-sql >=1.32.0
    - apache-airflow-providers-common-compat >=1.15.0
    - attrs >=22.2
    - openlineage-integration-common >=1.52.0
    - openlineage-python >=1.52.0

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-openlineage/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-openlineage for Apache Airflow
  description: |
    Provider package apache-airflow-providers-openlineage for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-openlineage/2.20.0

extra:
  recipe-maintainers:
    - xylar

