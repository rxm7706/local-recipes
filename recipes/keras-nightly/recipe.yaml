# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.16.0.dev2026081604"

package:
  name: keras-nightly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keras-nightly/keras_nightly-${{ version }}.tar.gz
  sha256: 4594569ca347545ea68ef8dfac81f7f6b74c7b8274b31847b5c493a14b5abecc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - absl-py
    - numpy
    - rich
    - namex
    - h5py
    - optree
    - ml-dtypes
    - packaging

tests:
  - python:
      imports:
        - keras.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://keras.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Multi-backend Keras
  description: |
    Multi-backend Keras
  repository: https://github.com/keras-team/keras

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
