# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: mvn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mvn/mvn-${{ version }}.tar.gz
  sha256: 144efcfc781f1227251730eb48fef88b4e0f4ce7014355f771efb8963a1a5172

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=67
  run:
    - python >=${{ python_min }}
    - versioneer
    - gitpython >=3.1.31
    - blessed >=1.20.0
    - srsly >=2.4.0
    - pandas >=1.4.0
    - pytz >=2022.1
    - tzlocal >=4.2
    - humanfriendly >=10.0
    - contexttimer >=0.3.3
    - ipython >=7.15.0

tests:
  - python:
      imports:
        - mvn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cogsys-io/mvn
  license: GPL-3.0-only
  license_file: LICENSE
  summary: "mvn: nvm"
  description: |
    mvn: nvm

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mvn
  cfe-upstream-registry: pypi
  cfe-upstream-name: mvn
