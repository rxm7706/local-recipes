# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.8"

package:
  name: pycover
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycover/pycover-${{ version }}.tar.gz
  sha256: 646ca481955629fe9f43ba85477a294bcc2844eb9b5228df7fc449d79819cd21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - psutil
    - screeninfo
    - aiohttp

tests:
  - python:
      imports:
        - pycover
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AyiinXd/pycover
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

