# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2"

package:
  name: csv-diff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/csv-diff/csv_diff-${{ version }}.tar.gz
  sha256: f6c251542fbcd9d6eef8b27c3870fc4dfc3592c880c34dac57ed94e382f2d53b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - dictdiffer

tests:
  - python:
      imports:
        - csv_diff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/simonw/csv-diff
  license: Apache-2.0
  license_file: LICENSE
  summary: Python CLI tool and library for diffing CSV and JSON files
  description: |
    Python CLI tool and library for diffing CSV and JSON files

extra:
  recipe-maintainers:
    - corneliusroemer
    - tsibley

#### CFE metadata AND comments
