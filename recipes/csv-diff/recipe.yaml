# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: csv-diff
  version: "1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f6c251542fbcd9d6eef8b27c3870fc4dfc3592c880c34dac57ed94e382f2d53b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - csv-diff = csv_diff.cli:cli

requirements:
  host:
    - python >=3.6
    - pytest-runner
    - pip
  run:
    - python >=3.6
    - click
    - dictdiffer

tests:
  - python:
      imports:
        - csv_diff
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - csv-diff --help

about:
  summary: Python CLI tool and library for diffing CSV and JSON files
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/csv-diff

extra:
  recipe-maintainers:
    - corneliusroemer
    - tsibley
