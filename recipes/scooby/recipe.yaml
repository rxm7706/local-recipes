# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.2"

package:
  name: scooby
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scooby/scooby-${{ version }}.tar.gz
  sha256: 0575c73636ec4c2587bea1f8a038798ddcb249e02067fae897dac3bf4f4e444d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - scooby
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/banesullivan/scooby
  license: MIT
  license_file: LICENSE
  summary: A Great Dane turned Python environment detective
  description: |
    A Great Dane turned Python environment detective
  repository: https://github.com/banesullivan/scooby

extra:
  recipe-maintainers:
    - banesullivan
    - prisae
    - akaszynski

#### CFE metadata AND comments
