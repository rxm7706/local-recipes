# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.21"

package:
  name: nvm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nvm/nvm-${{ version }}.tar.gz
  sha256: a4e820620f78aa699593816026dc42d577d10054b767860bb8525b9a6d05ff0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=67
  run:
    - python >=${{ python_min }}
    - versioneer
    - gitpython
    - blessed
    - srsly
    - pandas
    - pytz
    - tzlocal
    - humanfriendly
    - contexttimer

tests:
  - python:
      imports:
        - nvm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cogsys-io/nvm
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Plenty little helpers.
  description: |
    Plenty little helpers.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nvm
