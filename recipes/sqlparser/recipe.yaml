# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.9"

package:
  name: sqlparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/sqlparser/sqlparser-0.0.9-py3-none-any.whl
  sha256: 790e6df69bd66103a37bf27c703ad6748939496ef7cd59eb16b20ff77b150998

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlparser/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: This package helps automatically parse and execute sql queries
  description: |
    This package helps automatically parse and execute sql queries

extra:
  recipe-maintainers:
    - rxm7706

