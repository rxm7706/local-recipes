# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: libhwloc
  pname: hwloc
  version: "2.13.0"
  sha256: 1514a5253f0a5c23bc006d3bdd30a6f6125c9a8dc9b5fa4984913d1fff45315d

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.open-mpi.org/software/hwloc/v${{ '.'.join(version | split('.')[:2]) }}/downloads/${{ pname }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  # weigh down gpu implementation and give nocuda preference
  number: ${{ build }}
  string: ${{ 'default_h${{ PKG_HASH }}_${{ PKG_BUILDNUM }}' if cuda_compiler_version == "None" and ROCM_COMPILATION == "disabled" else 'rocm_h${{ PKG_HASH }}_${{ PKG_BUILDNUM }}' if ROCM_COMPILATION == "enabled" else "cuda${{ cuda_compiler_version | replace('.', '') }}_h${{ PKG_HASH }}_${{ PKG_BUILDNUM }}" if cuda_compiler_version != "None" else '' }}
  skip:
    - not linux64 and ROCM_COMPILATION == "enabled"
    - cuda_compiler_version != "None" and ROCM_COMPILATION == "enabled"
  track_features:
    - if: cuda_compiler_version != "None"
      then: libhwloc_cudatoolkit
    - if: ROCM_COMPILATION == "enabled"
      then: libhwloc_rocm

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: cuda_compiler_version != "None"
      then: ${{ compiler('cuda') }}
    - if: unix
      then: pkg-config
    - if: win
      then: autotools_clang_conda
    - if: unix
      then: make
    - if: unix
      then: automake
    - if: unix
      then: libtool
    - if: unix
      then: autoconf
  host:
    - libxml2-devel
    - if: win
      then: winpthreads-devel
    - if: linux and cuda_compiler_version == "None" and ROCM_COMPILATION == "enabled"
      then: rocm-smi
  run:
    - if: cuda_compiler_version != "None"
      then: __cuda
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - script:
      - if: cuda_compiler_version == "None"
        then: hwloc-ls
      - if: unix
        then: test -f ${PREFIX}/lib/libhwloc${SHLIB_EXT}
      - if: win
        then: if not exist %LIBRARY_LIB%\hwloc.lib exit 1

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Portable Hardware Locality (hwloc)
  description: |
    This feedstock builds the hwloc library in the `libhwloc` conda package. Different variants of the package are built:
    * `default` in the build string: Without CUDA or ROCM support, installed by default. Install specifically this version with `conda install libhwloc=*=*default*`.
    * `cuda` in the build string: With CUDA support. Install specifically this version with  `conda install libhwloc=*=*cuda*`
    * `rocm` in the build string: With ROCM support. Install specifically this version with  `conda install libhwloc=*=*rocm*`


  homepage: https://www.open-mpi.org/projects/hwloc/
  repository: https://github.com/open-mpi/hwloc

extra:
  recipe-maintainers:
    - jan-janssen
    - inducer
    - isuruf
