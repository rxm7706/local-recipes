# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.6"

package:
  name: spyder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spyder/spyder-${{ version }}.tar.gz
  sha256: 7986ed030ab80478974bcb81b5c8c882f50ca7366ca9d566ce019866ad6b0583

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - packaging
  run:
    - python >=${{ python_min }}
    - pyqt <5.16,>=5.15
    - pyqtwebengine <5.16,>=5.15
    - qtconsole-base <5.8.0,>=5.7.2
    - aiohttp >=3.11.2
    - asyncssh <3.0.0,>=2.14.0
    - bcrypt >=4.3.0
    - chardet <8.0.0,>=5.2.0
    - cloudpickle >=0.5.0
    - cookiecutter >=1.6.0
    - diff-match-patch >=20181111
    - importlib-metadata >=4.6.0
    - intervaltree >=3.0.2
    - ipython !=8.17.1,!=9.1.0,!=9.2.0,!=9.3.0,!=9.4.0,<10.0.0,>=8.15.0
    - ipython_pygments_lexers >=1.0
    - jedi <0.21.0,>=0.17.2
    - jellyfish >=0.7
    - jsonschema >=3.2.0
    - keyring >=17.0.0
    - markdown-it-py >=3.0.0
    - nbconvert >=4.0
    - numpydoc >=0.6.0
    - packaging >=20.0
    - parso <0.9.0,>=0.7.0
    - pexpect >=4.4.0
    - pickleshare >=0.4
    - psutil >=5.3
    - pygithub >=2.3.0
    - pygments >=2.0
    - pylint <5,>=3.1
    - pylint-venv >=3.0.2
    - pyls-spyder >=0.4.0
    - python-lsp-black <3.0.0,>=2.0.0
    - python-lsp-ruff <3.0.0,>=2.3.0
    - python-lsp-server <1.16.0,>=1.15.0
    - pyuca >=1.2
    - pyzmq >=24.0.0
    - qdarkstyle <3.3.0,>=3.2.0
    - qstylizer >=0.2.2
    - qtawesome <1.5.0,>=1.4.1
    - qtpy >=2.4.0
    - rtree >=0.9.7
    - sphinx >=7.2.0
    - spyder-kernels <3.2.0,>=3.1.5
    - superqt <1.0.0,>=0.6.2
    - textdistance >=4.2.0
    - three-merge >=0.1.1
    - watchdog >=0.10.3
    - yarl >=1.9.4

tests:
  - python:
      imports:
        - spyder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.spyder-ide.org/
  license: MIT
  license_file: LICENSE.txt
  summary: The Scientific Python Development Environment
  description: |
    The Scientific Python Development Environment

extra:
  recipe-maintainers:
    - CAM-Gerlach
    - ccordoba12
    - dalthviz
    - mrclary

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spyder
  cfe-upstream-registry: pypi
  cfe-upstream-name: spyder
  cfe-purls:
    - pkg:conda/spyder@${{ version }}?channel=conda-forge
    - pkg:pypi/spyder@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://www.spyder-ide.org/
  cfe-import-names: [spyder]
