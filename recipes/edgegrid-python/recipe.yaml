# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.7"

package:
  name: edgegrid-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/edgegrid-python/edgegrid_python-${{ version }}.tar.gz
  sha256: 80d261ff9673384d04f8a0681d4649c709de684a942234779aa94e7f2821a14d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.24.0
    - requests-toolbelt >=0.9.1

tests:
  - python:
      imports:
        - akamai.edgegrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/akamai/AkamaiOPEN-edgegrid-python
  license: Apache-2.0
  license_file: LICENSE
  summary: "{OPEN} client authentication protocol for python-requests"
  description: |
    {OPEN} client authentication protocol for python-requests

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
