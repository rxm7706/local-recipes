# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.92"

package:
  name: ezenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/ezenv/ezenv-${{ version }}.tar.gz
  sha256: a5a5d001a2352517b5992322c1795890dd3c9cf0ac6ad7912b0768fe84f33173

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ezenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mixmastamyk/env
  license: MIT
  license_file: LICENSE
  summary: A more convenient interface to environment variables.
  description: |
    A more convenient interface to environment variables.

extra:
  recipe-maintainers:
    - rxm7706

