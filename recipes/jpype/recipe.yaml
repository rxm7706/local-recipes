# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0"

package:
  name: jpype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jpype/jpype-${{ version }}.tar.gz
  sha256: db973cd5fc031b37bb8968139d4333836d9fb402ce660be9ce52d9f8d1c1cbdf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jpype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jpype/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: "Unsupported alias for JPype1 (https://pypi.org/project/JPype1/)"
  description: |
    Unsupported alias for JPype1 (https://pypi.org/project/JPype1/)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
