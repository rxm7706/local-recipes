# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.46.3"
  python_min: "3.11"

package:
  name: locust
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/locust/locust-${{ version }}.tar.gz
  sha256: b1d313db9df0a4036d4d905b1dc8585d020a7299239a1bb2e2885b71389253c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - configargparse >=1.7.1
    - flask_cors >=3.0.10
    - flask-login >=0.6.3
    - flask >=2.0.0
    - gevent >=24.10.1
    - geventhttpclient >=2.3.1
    - msgpack >=1.0.0
    - psutil >=5.9.1
    - pytest <10,>=8.3.3
    - python-engineio >=4.12.2
    - python-socketio >=5.13.0
    - pyzmq >=25.0.0
    - requests >=2.32.2
    - typing_extensions >=4.6.0
    - werkzeug >=2.0.0
    - if: win
      then:
        - pywin32

tests:
  - python:
      imports:
        - locust
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://locust.cloud/
  license: MIT
  license_file: LICENSE
  summary: Developer-friendly load testing framework
  description: |
    Developer-friendly load testing framework
  repository: https://github.com/locustio/locust
  documentation: https://docs.locust.io/

extra:
  recipe-maintainers:
    - carlodri
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: locust
  cfe-upstream-registry: pypi
  cfe-upstream-name: locust
