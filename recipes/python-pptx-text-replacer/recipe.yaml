# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: python-pptx-text-replacer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-pptx-text-replacer/python_pptx_text_replacer-${{ version }}.tar.gz
  sha256: a62392f6d93ccc2e8236033925f11ad77ab31247fb42beea32d66a5a0c3eff84

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - python-pptx

tests:
  - python:
      imports:
        - python_pptx_text_replacer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fschaeck/python-pptx-text-replacer
  license: GPL-3.0-only
  license_file: LICENSE
  summary: This package implements text replacement in Powerpoint files in pptx format.
  description: |
    This package implements text replacement in Powerpoint files in pptx format.

extra:
  recipe-maintainers:
    - rxm7706

