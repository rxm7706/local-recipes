# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-autocomplete
  version: "0.12.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/43/86/013e4adfb5503d8fb5374ac4a030a149cd28f774364e321941ee0b9987bd/wagtail_autocomplete-0.12.1.tar.gz
  sha256: 87ae8b42bc67016417e6c108befef84a451bdfe0eb8e9b5e86a9bbdb420bb55d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  run:
  - python >=${{ python_min }}
  - wagtail >=4.1

tests:
- python:
    imports:
    - wagtailautocomplete
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: An Autocomplete edit handler for Pages, Snippets, and more.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/wagtail/wagtail-autocomplete

extra:
  recipe-maintainers:
  - rxm7706
  cfe-local-build-status: success
  cfe-local-build-datetime: '2026-10-09T11:26:56Z'
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
