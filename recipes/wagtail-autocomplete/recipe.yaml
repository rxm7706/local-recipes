# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-autocomplete
  version: "0.12.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail-autocomplete/wagtail_autocomplete-${{ version }}.tar.gz
  sha256: 87ae8b42bc67016417e6c108befef84a451bdfe0eb8e9b5e86a9bbdb420bb55d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=4.1

tests:
- python:
    imports:
      - wagtailautocomplete
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: An Autocomplete edit handler for Pages, Snippets, and more.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/wagtail/wagtail-autocomplete

extra:
  recipe-maintainers:
    - rxm7706

