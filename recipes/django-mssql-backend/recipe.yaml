# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.1"

package:
  name: django-mssql-backend
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-mssql-backend/django-mssql-backend-${{ version }}.tar.gz
  sha256: a34145e537387c6251290bc1016199bf0a01ae91ce25e311091f94ba2a1399ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyodbc

tests:
  - python:
      imports:
        - testapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ESSolutions/django-mssql-backend
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django backend for Microsoft SQL Server
  description: |
    Django backend for Microsoft SQL Server

extra:
  recipe-maintainers:
    - rxm7706

