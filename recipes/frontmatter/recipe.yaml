# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.8"

package:
  name: frontmatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/frontmatter/frontmatter-${{ version }}.tar.gz
  sha256: d913619d20f607e03557d52a8bf9b249e0b3093c770c5213c0f1231d2c97fe73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml ==5.1

tests:
  - python:
      imports:
        - frontmatter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jonbeebe/frontmatter
  license: ISC
  license_file: LICENSE
  summary: Extract YAML frontmatter from files and strings.
  description: |
    Extract YAML frontmatter from files and strings.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: frontmatter
  cfe-upstream-registry: pypi
  cfe-upstream-name: frontmatter
  cfe-purls:
    - pkg:conda/frontmatter@${{ version }}?channel=conda-forge
    - pkg:pypi/frontmatter@${{ version }}
  cfe-upstream-repo: https://github.com/jonbeebe/frontmatter
  cfe-upstream-homepage: https://github.com/jonbeebe/frontmatter
  cfe-import-names: [frontmatter]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
