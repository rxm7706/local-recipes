# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.20.0"

package:
  name: jupyter-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server/jupyter_server-${{ version }}.tar.gz
  sha256: b5778ba337d8015a3dc2b80803ecdd5ac18d3797fddf61a50ea5fb472b4ebe14

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-nodejs-version
  run:
    - python >=${{ python_min }}
    - anyio >=3.1.0
    - argon2-cffi >=21.1
    - jinja2 >=3.0.3
    - jupyter-client >=7.4.4
    - jupyter-core !=5.0.*,>=4.12
    - jupyter-events >=0.11.0
    - jupyter-server-terminals >=0.4.4
    - nbconvert >=6.4.4
    - nbformat >=5.3.0
    - overrides >=5.0
    - packaging >=22.0
    - prometheus_client >=0.9
    - pywinpty !=3.0.4,>=2.0.1
    - pyzmq >=24
    - send2trash >=1.8.2
    - terminado >=0.8.3
    - tornado >=6.2.0
    - traitlets >=5.6.0
    - websocket-client >=1.7

tests:
  - python:
      imports:
        - jupyter_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter-server.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The backend—i.e. core services, APIs, and REST endpoints—to Jupyter web applications.
  description: |
    The backend—i.e. core services, APIs, and REST endpoints—to Jupyter web applications.
  repository: https://github.com/jupyter-server/jupyter_server
  documentation: https://jupyter-server.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - maartenbreddels
    - blink1073
    - minrk
    - jasongrout
    - bollwyvl
    - Zsailer
    - Carreau
    - Yann-P

