# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1.2"

package:
  name: pkginfo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pkginfo/pkginfo-${{ version }}.tar.gz
  sha256: 5cd957824ac36f140260964eba3c6be6442a8359b8c48f4adf90210f33a04b7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pkginfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://code.launchpad.net/~tseaver/pkginfo/trunk
  license: MIT
  license_file: LICENSE.txt
  summary: Query metadata from sdists / bdists / installed packages.
  description: |
    Query metadata from sdists / bdists / installed packages.

extra:
  recipe-maintainers:
    - jakirkham
    - jankatins
    - mingwandroid

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pkginfo
  cfe-upstream-registry: pypi
  cfe-upstream-name: pkginfo
  cfe-purls:
    - pkg:conda/pkginfo@${{ version }}?channel=conda-forge
    - pkg:pypi/pkginfo@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://code.launchpad.net/~tseaver/pkginfo/trunk
  cfe-import-names: [pkginfo]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pkginfo-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.12.1.2

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T03:00:41Z
