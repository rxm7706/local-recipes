# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: jupyterlab-execute-time
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-execute-time/jupyterlab_execute_time-${{ version }}.tar.gz
  sha256: 900fd1aebbfd3d943d3625eef973eed555bb2745d49840402783959c8a1dfc3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - jupyterlab ~=4.0.0
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - jupyterlab <5,>=4

tests:
  - python:
      imports:
        - jupyterlab_execute_time
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deshaw/jupyterlab-execute-time
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Display cell timings in Jupyter Lab
  description: |
    Display cell timings in Jupyter Lab

extra:
  recipe-maintainers:
    - rxm7706

