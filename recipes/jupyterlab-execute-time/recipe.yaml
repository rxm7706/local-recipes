# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyterlab_execute_time
  version: "3.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9b13b65c2c139bfabb3f6ff1706c4d33ed5a56203a89d0297608334e15bc9c0b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - jupyter-packaging
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4,<5

tests:
  - python:
      imports:
        - jupyterlab
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - nodejs >=12
        - pip
        - jupyter-packaging
        - python ${{ python_min }}
    script:
      - jupyter lab --version
      - jlpm --version
      - jupyter labextension list
      - jupyter labextension list 2>&1 | grep -ie "jupyterlab-execute-time.*OK"

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Execute Time Plugin for Jupyter Lab
  description: Display cell timings in Jupyter Lab
  homepage: https://github.com/deshaw/jupyterlab-execute-time

extra:
  recipe-maintainers:
    - krassowski
    - moble
    - mlucool
