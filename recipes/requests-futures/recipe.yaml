# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: requests-futures
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-futures/requests_futures-${{ version }}.tar.gz
  sha256: 6b7eb57940336e800faebc3dab506360edec9478f7b22dc570858ad3aa7458da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=1.2.0

tests:
  - python:
      imports:
        - requests_futures
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ross/requests-futures
  license: Apache-2.0
  license_file: LICENSE
  summary: Asynchronous Python HTTP for Humans.
  description: |
    Asynchronous Python HTTP for Humans.

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

