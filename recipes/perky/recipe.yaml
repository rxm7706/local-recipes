# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10"

package:
  name: perky
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/perky/perky-${{ version }}.tar.gz
  sha256: b25c9aa590848a8c5a0ec70846280e9939df9102c25ed82c8e8d62ac38dac091

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit
  run:
    - python >=${{ python_min }}
    - big >=0.14

tests:
  - python:
      imports:
        - perky
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/larryhastings/perky/
  license: MIT
  license_file: LICENSE
  summary: A simple, Pythonic file format.  Provides load, loads, dump, and
  description: |
    A simple, Pythonic file format.  Provides load, loads, dump, and

extra:
  recipe-maintainers:
    - rxm7706

