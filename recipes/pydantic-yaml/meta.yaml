{% set name = "pydantic-yaml" %}
{% set version = "1.7.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pydantic_yaml-{{ version }}.tar.gz
  sha256: b7c9420647537166c58ff9b150176a434fbdbae843d076e37011dd7e3e2e0044

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.29.0
    - hatch-vcs >=0.5.0
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >={{ python_min }}
    - pydantic >=1.10.0,<3
    - ruamel.yaml >=0.17.0,<0.20.0
    - importlib-metadata

test:
  imports:
    - pydantic_yaml
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Adds some YAML functionality to the excellent `pydantic` library.
  home: https://github.com/NowanIlfideme/pydantic-yaml
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
