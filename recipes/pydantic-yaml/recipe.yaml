# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: pydantic_yaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic_yaml/pydantic_yaml-${{ version }}.tar.gz
  sha256: b7c9420647537166c58ff9b150176a434fbdbae843d076e37011dd7e3e2e0044

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pydantic <3,>=1.10.0
    - ruamel.yaml >=0.17.0,<0.20.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - pydantic_yaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pydantic_yaml/
  license: MIT
  license_file: LICENSE
  summary: YAML reading/writing for Pydantic models
  description: |
    YAML reading/writing for Pydantic models

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
