# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydantic-yaml
  version: "1.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pydantic_yaml-${{ version }}.tar.gz
  sha256: b7c9420647537166c58ff9b150176a434fbdbae843d076e37011dd7e3e2e0044

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling >=1.29.0
    - hatch-vcs >=0.5.0
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >=${{ python_min }}
    - pydantic >=1.10.0,<3
    - ruamel.yaml >=0.17.0,<0.20.0
    - importlib-metadata

tests:
  - python:
      imports:
        - pydantic_yaml
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Adds some YAML functionality to the excellent `pydantic` library.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/NowanIlfideme/pydantic-yaml

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
