# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: gql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gql/gql-${{ version }}.tar.gz
  sha256: f22980844eb6a7c0266ffc70f111b9c7e7c7c13da38c3b439afc7eab3d7c9c8e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - graphql-core <3.3,>=3.2
    - yarl <2.0,>=1.6
    - backoff <3.0,>=1.11.1
    - anyio <5,>=3.0

tests:
  - python:
      imports:
        - gql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/graphql-python/gql
  license: MIT
  license_file: LICENSE
  summary: GraphQL client for Python
  description: |
    GraphQL client for Python

extra:
  recipe-maintainers:
    - leszekhanusz
    - ozagordi
    - KingDarBoja
    - bollwyvl

#### CFE metadata AND comments
