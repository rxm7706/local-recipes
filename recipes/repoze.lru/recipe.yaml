# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8"

package:
  name: repoze-lru
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/repoze-lru/repoze_lru-${{ version }}.tar.gz
  sha256: a252408cd93fe670c88d6665b96fe5d42e071dba2507a1f21a1e609ae4fa891a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - repoze.lru
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/repoze-lru/
  license: LicenseRef-Repoze-BSD-derived
  license_file: LICENSE.txt
  summary: A tiny LRU cache implementation and decorator
  description: |
    A tiny LRU cache implementation and decorator
  repository: https://github.com/repoze/repoze.lru
  documentation: https://repozelru.readthedocs.io/en/stable/index.html

extra:
  recipe-maintainers:
    - rxm7706
    - nicoddemus

#### CFE metadata AND comments
