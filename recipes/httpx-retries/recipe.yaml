# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: httpx-retries
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpx-retries/httpx_retries-${{ version }}.tar.gz
  sha256: 3e0b404969a564829d368417964fd21e6b400a10d17c92d29b8bc247ce8186e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - httpx >=0.20.0

tests:
  - python:
      imports:
        - httpx_retries
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/will-ockmore/httpx-retries
  license: MIT
  license_file: LICENSE
  summary: A retry layer for HTTPX.
  description: |
    A retry layer for HTTPX.
  repository: https://github.com/will-ockmore/httpx-retries
  documentation: https://will-ockmore.github.io/httpx-retries

extra:
  recipe-maintainers:
    - will-ockmore
    - matthewfeickert

