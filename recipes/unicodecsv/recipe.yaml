# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.1"

package:
  name: unicodecsv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unicodecsv/unicodecsv-${{ version }}.tar.gz
  sha256: 018c08037d48649a0412063ff4eda26eaa81eff1546dbffa51fa5293276ff7fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - unicodecsv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jdunck/python-unicodecsv
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python2's stdlib csv module is nice, but it doesn't support unicode. This module is a drop-in replacement which *does*.
  description: |
    Python2's stdlib csv module is nice, but it doesn't support unicode. This module is a drop-in replacement which *does*.

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
