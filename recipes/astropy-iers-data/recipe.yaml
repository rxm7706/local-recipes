# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2026.8.10.0.32.39"

package:
  name: astropy-iers-data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/astropy-iers-data/astropy_iers_data-${{ version }}.tar.gz
  sha256: 2e5b9904f69ca69c7013170b2622b8818d443e10fdd5d501e1c2d298dd1e06dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - astropy_iers_data
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/astropy-iers-data/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: IERS Earth Rotation and Leap Second tables for the astropy core package
  description: |
    IERS Earth Rotation and Leap Second tables for the astropy core package
  documentation: https://github.com/astropy/astropy-iers-data/blob/main/README.rst

extra:
  recipe-maintainers:
    - astrofrog
    - mwcraig

#### CFE metadata AND comments
