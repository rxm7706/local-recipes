# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: local-gemma
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/local-gemma/local_gemma-${{ version }}.tar.gz
  sha256: 04ff93fd2bd925a2b0e3d5f59cf4c7107a7bc1c6fa1745b93b64f92595601e9d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - pytorch >=2.1.1
    - accelerate >=0.33.0
    - transformers >=4.44.0

tests:
  - python:
      imports:
        - local_gemma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/local-gemma/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

