{% set name = "tabcmd" %}
{% set version = "2.0.21" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tabcmd-{{ version }}.tar.gz
  sha256: 80eebb14f92ca08ac9b7ffce7c3e5b698b3bec47ce898cfbec9f33287981ece1

build:
  entry_points:
    - tabcmd = tabcmd.tabcmd:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - python-build
    - setuptools >=62
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - setuptools
    - click
    - pytest-order
    - python >={{ python_min }},<3.12
    - appdirs
    - doit
    - ftfy
    - pyinstaller-versionfile
    - requests >=2.25,<3.0
    - setuptools-scm
    - types-appdirs
    - types-mock
    - types-requests
    - types-setuptools
    - tableauserverclient ==0.41
    - urllib3

test:
  requires:
    - python {{ python_min }}
  imports:
    - tabcmd
  commands:
    - tabcmd --help

about:
  summary: A command line client for working with Tableau Server.
  home: https://github.com/tableau/tabcmd
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
