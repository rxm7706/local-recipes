# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: objprint
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/objprint-${{ version }}.tar.gz
  sha256: b5d83f9d62db5b95353bb42959106e1cd43010dcaa3eed1ad8d7d0b2df9b2d5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.9.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - objprint
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A library that can print Python objects in human readable format
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/gaogaotiantian/objprint

extra:
  recipe-maintainers:
    - gaogaotiantian
    - gforsyth
