# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: kdewallet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kdewallet/kdewallet-${{ version }}.tar.gz
  sha256: 28f20ada2105038b2beca12d1f015f3effa4c32968898cf2d0deac2942060879

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kdewallet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/syntaxfiend/kdewallet
  license: GNU
  license_file: LICENSE
  summary: kdewallet interface
  description: |
    kdewallet interface

extra:
  recipe-maintainers:
    - rxm7706

