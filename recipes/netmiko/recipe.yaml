# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.7.0"

package:
  name: netmiko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netmiko/netmiko-${{ version }}.tar.gz
  sha256: 94cf7bfe5daed1d058444ce1637e10177df22f903683a53d1fbee47553488c65

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - ntc-templates >=3.1.0
    - paramiko <5.0,>=3.5.0
    - pyserial >=3.3
    - pyyaml >=6.0.2
    - rich >=13.8
    - ruamel.yaml >=0.17
    - scp >=0.13.6
    - textfsm >=1.1.3

tests:
  - python:
      imports:
        - netmiko
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ktbyers/netmiko
  license: MIT
  license_file: LICENSE
  summary: Multi-vendor library to simplify legacy CLI connections to network devices
  description: |
    Multi-vendor library to simplify legacy CLI connections to network devices
  repository: https://github.com/ktbyers/netmiko

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
