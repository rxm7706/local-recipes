# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.5"

package:
  name: aws
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aws/aws-${{ version }}.tar.gz
  sha256: 460cd737dee028bcebdb626f0c7acf87753f9e04e3317fda05929625419f2989

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aws
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eofs/aws
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utility to manage your Amazon Web Services and run Fabric against filtered set of EC2 instances.
  description: |
    Utility to manage your Amazon Web Services and run Fabric against filtered set of EC2 instances.

extra:
  recipe-maintainers:
    - rxm7706

