# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastai
  version: "2.8.7"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastai-${{ version }}.tar.gz
  sha256: 93be109daab077a73279bb2aba27fa72a206bbf055b0f1921475afde69b7705f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - configure_accelerate=fastai.distributed:configure_accelerate

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pip
    - packaging
    - fastdownload >=0.0.5,<2
    - fastcore >=1.8.0
    - fasttransform >=0.0.2
    - torchvision >=0.11
    - matplotlib-base
    - pandas
    - requests
    - pyyaml
    - fastprogress >=0.2.4
    - pillow >=9.0.0
    - scikit-learn
    - scipy
    - spacy <4
    - plum-dispatch
    - cloudpickle
    - pytorch >=1.10,<3

tests:
  - python:
      imports:
        - fastai
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}

about:
  summary: fastai simplifies training fast and accurate neural nets using modern best practices
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fastai/fastai

extra:
  recipe-maintainers:
    - tonyhoo
    - giswqs
