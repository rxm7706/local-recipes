# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.8"

package:
  name: fastai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastai/fastai-${{ version }}.tar.gz
  sha256: 47f499d2bf6f4fde1c7aca49108a60023851a516c37ef695aec033cde3ac65f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - fastdownload <2,>=0.0.5
    - fastcore >=1.14.6
    - fasttransform >=0.0.2
    - torchvision >=0.11
    - matplotlib-base
    - pandas
    - requests
    - pyyaml
    - fastprogress >=0.2.4
    - pillow >=9.0.0
    - scikit-learn
    - scipy
    - spacy <4
    - packaging
    - plum-dispatch
    - cloudpickle
    - pytorch <3,>=1.10

tests:
  - python:
      imports:
        - fastai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastai/
  license: Apache-2.0
  license_file: LICENSE
  summary: fastai simplifies training fast and accurate neural nets using modern best practices
  description: |
    fastai simplifies training fast and accurate neural nets using modern best practices
  repository: https://github.com/fastai/fastai
  documentation: https://docs.fast.ai/

extra:
  recipe-maintainers:
    - tonyhoo
    - giswqs

