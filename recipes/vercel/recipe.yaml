# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: vercel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vercel/vercel-${{ version }}.tar.gz
  sha256: 050ca9c7dcf3c43e7d2af7401aed2b7de620164363e6fb486b8c3518cd4d8ff9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0,<2
  run:
    - python >=${{ python_min }}
    - anyio <5,>=4.0.0
    - cbor2 <7,>=6.0
    - httpx <1,>=0.27.0
    - pydantic <3,>=2.7.0
    - python-dotenv <2,>=1.0.0
    - typing_extensions <5,>=4.0.0
    - vercel-cache >=0.7.2
    - vercel-headers >=0.7.1
    - vercel-internal-core <0.2.0,>=0.1.2
    - vercel-internal-telemetry >=0.7.2
    - vercel-oidc >=0.8.0
    - vercel-queue >=0.8.0
    - vercel-sandbox <0.5.0,>=0.4.0
    - websockets <17,>=12.0

tests:
  - python:
      imports:
        - blob
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/vercel/
  license: MIT
  license_file: LICENSE
  summary: Python SDK for Vercel
  description: |
    Python SDK for Vercel

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: vercel
  cfe-upstream-registry: pypi
  cfe-upstream-name: vercel
  cfe-purls:
    - pkg:conda/vercel@${{ version }}?channel=conda-forge
    - pkg:pypi/vercel@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/vercel/
  cfe-upstream-homepage: https://pypi.org/project/vercel/
  cfe-import-names: [blob]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
