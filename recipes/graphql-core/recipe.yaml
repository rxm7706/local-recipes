# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.11"

package:
  name: graphql-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphql-core/graphql_core-${{ version }}.tar.gz
  sha256: e7e156d10beb127cab5c89ff0da71416fc73d27c484a4757d3b2d35633774802

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1,<3
    - setuptools >=59,<83
  run:
    - python >=${{ python_min }}
    - typing_extensions <5,>=4.7

tests:
  - python:
      imports:
        - graphql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/graphql-python/graphql-core
  license: MIT
  license_file: LICENSE
  summary: GraphQL implementation for Python, a port of GraphQL.js, the JavaScript reference implementation for GraphQL.
  description: |
    GraphQL implementation for Python, a port of GraphQL.js, the JavaScript reference implementation for GraphQL.

extra:
  recipe-maintainers:
    - carlodri
    - bollwyvl
    - KingDarBoja

