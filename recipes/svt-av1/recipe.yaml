# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: svt-av1
  version: "4.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v${{ version }}/SVT-AV1-v${{ version }}.tar.gz
  sha256: c7b13c4a84bd3751aa35fcc72be13e6875467e7c2216879251a486e5b1e4e740

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make
    - yasm
  run_exports:
    - ${{ pin_subpackage('svt-av1', upper_bound='x.x.x') }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/include/svt-av1/EbSvtAv1.h
      - if: unix
        then: test -f $PREFIX/lib/libSvtAv1Enc${SHLIB_EXT}
      - if: unix and build_platform == target_platform
        then: SvtAv1EncApp --help

about:
  license: BSD-2-Clause
  license_file: LICENSE.md
  summary: The Scalable Video Technology for AV1 encoder/decoder library.
  description: |
    The Scalable Video Technology for AV1 (SVT-AV1 Encoder and Decoder) is an
    AV1-compliant encoder/decoder library core.


  homepage: https://gitlab.com/AOMediaCodec/SVT-AV1

extra:
  recipe-maintainers:
    - matthiasdiener
