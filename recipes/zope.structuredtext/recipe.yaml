# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.structuredtext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.structuredtext/zope_structuredtext-${{ version }}.tar.gz
  sha256: 3ec31e22459711dde25e0ee3dc744f2cb70ac77ab090776a11a901db4b7ab94f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.structuredtext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.structuredtext
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: StructuredText parser
  description: |
    StructuredText parser

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zope.structuredtext
  cfe-upstream-registry: pypi
  cfe-upstream-name: zope.structuredtext
