# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: xpanse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xpanse/xpanse-${{ version }}.tar.gz
  sha256: 18915f075dfab1d8d976dbadbfadb27b5c07c5ba56ee62418674a744ff44dd2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.25.1
    - deprecated >=1.2.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - xpanse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/xpanse/
  license: ISC
  license_file: LICENSE
  summary: Python library is an interface to the Cortex Xpanse API.
  description: |
    Python library is an interface to the Cortex Xpanse API.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
