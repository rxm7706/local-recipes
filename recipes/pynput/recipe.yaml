# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pynput
  version: "1.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/moses-palmer/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: acd65b9e979ae7efe2e2f3fad83a7eda736dd2de364efbc113a9af4c8222a6df

build:
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - six
    - setuptools-lint >=0.5
    - sphinx >=1.3.1
    - twine >=4.0
  run:
    - if: osx
      then: pyobjc-core
    - if: osx
      then: pyobjc-framework-cocoa
    - python
    - six
    - python-xlib
    - if: linux
      then: evdev
    - if: osx
      then: pyobjc-framework-applicationservices
    - if: osx
      then: pyobjc-framework-quartz

tests:
  - script:
      - bash -c "DISPLAY=:1 python -c 'import pynput'"

about:
  license: LGPL-3.0-only
  license_file: COPYING.LGPL
  summary: This library allows you to control and monitor input devices.
  homepage: https://github.com/moses-palmer/pynput
  repository: https://github.com/moses-palmer/pynput
  documentation: https://pynput.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mxr-conda
    - ndmaxar
    - rluria14
    - oblute
    - Tobias-Fischer
    - ehfd
