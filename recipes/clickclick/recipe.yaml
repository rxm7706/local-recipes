# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.10.2"

package:
  name: clickclick
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clickclick/clickclick-${{ version }}.tar.gz
  sha256: 4efb13e62353e34c5eef7ed6582c4920b418d7dedc86d819e22ee089ba01802c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - yaml
    - click

tests:
  - python:
      imports:
        - clickclick
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://codeberg.org/hjacobs/python-clickclick
  license: Apache-2.0
  license_file: LICENSE
  summary: Click utility functions
  description: |
    Click utility functions

extra:
  recipe-maintainers:
    - rxm7706
    - rvalieris

#### CFE metadata AND comments
