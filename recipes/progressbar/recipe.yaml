# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5"

package:
  name: progressbar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/progressbar/progressbar-${{ version }}.tar.gz
  sha256: 5d81cb529da2e223b53962afd6c8ca0f05c6670e40309a7219eacc36af9b6c63

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - progressbar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/python-progressbar
  license: LICENSE.txt
  license_file: LICENSE
  summary: Text progress bar library for Python.
  description: |
    Text progress bar library for Python.

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
