# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.18.1"

package:
  name: terminado
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/terminado/terminado-${{ version }}.tar.gz
  sha256: de09f2c4b85de4765f7714688fff57d3e75bad1f909b589fde880460c753fd2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - ptyprocess
    - pywinpty >=1.1.0
    - tornado >=6.1.0

tests:
  - python:
      imports:
        - terminado
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter/terminado
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Tornado websocket backend for the Xterm.js Javascript terminal emulator library.
  description: |
    Tornado websocket backend for the Xterm.js Javascript terminal emulator library.

extra:
  recipe-maintainers:
    - blink1073
    - bollwyvl
    - ocefpaf
    - pelson
    - takluyver

