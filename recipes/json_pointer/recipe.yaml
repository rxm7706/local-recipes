# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: json_pointer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json_pointer/json_pointer-${{ version }}.tar.gz
  sha256: bcc02765958406430cd0873160ff74178ab29cf9f5ebc012496ff23314df951f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json_pointer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Simple implementation of the json-pointer spec
  description: |
    Simple implementation of the json-pointer spec

extra:
  recipe-maintainers:
    - rxm7706

