# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.6"

package:
  name: krbticket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/krbticket/krbticket-${{ version }}.tar.gz
  sha256: f3eff7f3089ba5a7753be0644380e2d605b2124a53628789e41b2ee24b77c810

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - retrying
    - fasteners

tests:
  - python:
      imports:
        - krbticket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ksauzz/krbticket
  license: MIT
  license_file: LICENSE
  summary: Kerberos Ticket Manager
  description: |
    Kerberos Ticket Manager

extra:
  recipe-maintainers:
    - rxm7706

