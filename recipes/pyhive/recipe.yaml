# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: pyhive
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyHive/PyHive-${{ version }}.tar.gz
  sha256: 585beff9578a61b99aed47140fec97e26323e8c685a5b5d0c8550a8ebf8a24e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyhive
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dropbox/PyHive
  license: Apache-2.0
  license_file: LICENSE
  summary: Python interface to Hive
  description: |
    Python interface to Hive

extra:
  recipe-maintainers:
    - mariusvniekerk
    - bandersen23

#### CFE metadata AND comments
