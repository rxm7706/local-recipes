# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: PyHive
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 585beff9578a61b99aed47140fec97e26323e8c685a5b5d0c8550a8ebf8a24e0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    # https://github.com/apache/kyuubi/commit/996cdccc097e046fc2f61c7be5d0069b6c8eda9b
    - setuptools <72
  run:
    - future
    - python >=${{ python_min }}
    - python-dateutil
    - thrift >=0.10.0
    - thrift_sasl >0.2.1
    - requests >=1.0.0
    - sqlalchemy >=0.8.7

tests:
  - python:
      imports:
        - TCLIService
        - pyhive
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python interface to Hive
  license: Apache-2.0
  license_file: LICENSE
  description: |
    PyHive is a collection of Python DB-API and SQLAlchemy interfaces for Presto and Hive.
  homepage: https://pypi.org/project/PyHive/
  documentation: https://pypi.python.org/pypi/PyHive

extra:
  recipe-maintainers:
    - mariusvniekerk
    - bandersen23
