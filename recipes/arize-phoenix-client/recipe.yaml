# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: arize-phoenix-client
  version: "3.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/arize_phoenix_client-${{ version }}.tar.gz
  sha256: d4ffce060d9a97446cb4dc67de4b025478fc915152a0f7faf63c120215491989

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx
    - typing_extensions
    - tqdm
    - openinference-semantic-conventions
    - openinference-instrumentation
    - opentelemetry-sdk
    - opentelemetry-exporter-otlp

tests:
  - python:
      imports:
        - phoenix.client
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: LLM Observability
  license: Elastic-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/phoenix/

extra:
  recipe-maintainers:
    - RogerHYang
