# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: arize-phoenix-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arize-phoenix-client/arize_phoenix_client-${{ version }}.tar.gz
  sha256: d4ffce060d9a97446cb4dc67de4b025478fc915152a0f7faf63c120215491989

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx
    - openinference-instrumentation >=0.1.20
    - openinference-semantic-conventions
    - opentelemetry-exporter-otlp
    - opentelemetry-sdk
    - tqdm
    - typing_extensions

tests:
  - python:
      imports:
        - phoenix.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arize-phoenix-client/
  license: Apache-2.0
  license_file: LICENSE
  summary: LLM Observability
  description: |
    LLM Observability
  repository: https://github.com/Arize-ai/phoenix
  documentation: https://arize.com/docs/phoenix/

extra:
  recipe-maintainers:
    - RogerHYang

