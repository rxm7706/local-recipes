# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: arg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arg/arg-${{ version }}.tar.gz
  sha256: 8249547d3c27c5d2b095e450b82e0acb698448b41d85016d5b395a701580b7cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - arg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://projects.abranhe.com/arg
  license: MIT
  license_file: LICENSE
  summary: Parse command line arguments made easier...
  description: |
    Parse command line arguments made easier...
  repository: https://github.com/abranhe/argsTo

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: arg
  cfe-upstream-registry: pypi
  cfe-upstream-name: arg
  cfe-purls:
    - pkg:conda/arg@${{ version }}?channel=conda-forge
    - pkg:pypi/arg@${{ version }}
  cfe-upstream-repo: https://github.com/abranhe/argsTo
  cfe-upstream-homepage: https://projects.abranhe.com/arg
  cfe-import-names: [arg]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
