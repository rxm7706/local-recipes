# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-semantic-conventions-ai
  version: "0.5.2"
  upstream_version: "0.62.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/traceloop/openllmetry/archive/refs/tags/v${{ upstream_version }}.tar.gz
  sha256: dee2e822666df74e84b9e41080b0e9f6702b892a8723d6ae981a22bc4ef8b271

build:
  number: 0
  noarch: python
  script: cd packages/opentelemetry-semantic-conventions-ai && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-sdk >=1.42.0,<2
    - opentelemetry-semantic-conventions >=0.63b1

tests:
  - python:
      imports:
        - opentelemetry.semconv_ai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Semantic Conventions Extension for Large Language Models
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
