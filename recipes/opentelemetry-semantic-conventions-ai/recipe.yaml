# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: opentelemetry-semantic-conventions-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-semantic-conventions-ai/opentelemetry_semantic_conventions_ai-${{ version }}.tar.gz
  sha256: 153906200d8c1d2f8e09bd78dbef526916023de85ac3dab35912bfafb69ff04c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-sdk <2,>=1.38.0
    - opentelemetry-semantic-conventions >=0.59b0

tests:
  - python:
      imports:
        - opentelemetry.semconv_ai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/opentelemetry-semantic-conventions-ai/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Semantic Conventions Extension for Large Language Models
  description: |
    OpenTelemetry Semantic Conventions Extension for Large Language Models

extra:
  recipe-maintainers:
    - timkpaine

#### CFE metadata AND comments
