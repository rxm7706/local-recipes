# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.31.4"

package:
  name: pyhanko-certvalidator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhanko-certvalidator/pyhanko_certvalidator-${{ version }}.tar.gz
  sha256: 1d079f2a24d4086d85203ad6df2b8bdbb21a50e16ab361dbed50fc396dd01450

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.8.0
  run:
    - python >=${{ python_min }}
    - asn1crypto >=1.5.1
    - oscrypto >=1.1.0
    - cryptography >=48.0.0
    - uritools >=3.0.1
    - requests >=2.31.0

tests:
  - python:
      imports:
        - pyhanko_certvalidator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MatthiasValvekens/pyHanko/tree/master/pkgs/pyhanko-certvalidator
  license: MIT
  license_file: LICENSE
  summary: Validates X.509 certificates and paths; forked from wbond/certvalidator
  description: |
    Validates X.509 certificates and paths; forked from wbond/certvalidator

extra:
  recipe-maintainers:
    - mrakitin
    - killua156

