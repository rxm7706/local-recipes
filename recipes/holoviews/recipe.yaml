# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.23.1"

package:
  name: holoviews
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/holoviews/holoviews-${{ version }}.tar.gz
  sha256: 97877ee2fcf7bf38ce63f49b731dba75d9b2fcfaf093ca51bd229770a4273cc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - bokeh >=3.1
    - colorcet
    - narwhals >=2
    - numpy >=1.21
    - pandas >=1.3
    - panel >=1.0
    - param <3.0,>=2.0
    - python-dateutil >=2.8.2
    - pyviz_comms >=2.1

tests:
  - python:
      imports:
        - holoviews
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://holoviews.org
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A high-level plotting API for the PyData ecosystem built on HoloViews.
  description: |
    A high-level plotting API for the PyData ecosystem built on HoloViews.
  repository: https://github.com/holoviz/holoviews
  documentation: https://holoviews.org/

extra:
  recipe-maintainers:
    - jlstevens
    - philippjfr
    - basnijholt
    - maximlt
    - hoxbro

