# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.8"

package:
  name: langchain-azure-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-azure-ai/langchain_azure_ai-${{ version }}.tar.gz
  sha256: 3d1c9c4d9ebe7e06ba38a886930f6aa91e3635a54164cdf7a8810ac3be819bf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8,<0.12
  run:
    - python >=${{ python_min }}
    - aiohttp ~=3.14
    - azure-ai-contentunderstanding <2.0.0,>=1.2.0b2
    - azure-ai-projects <3.0,>=2.2.0
    - azure-ai-contentsafety <2.0.0,>=1.0.0
    - azure-core ~=1.41
    - azure-identity ~=1.15
    - azure-search-documents <13.0,>=11.4
    - langchain <2.0.0,>=1.2.12
    - langchain-openai <2.0.0,>=1.0.0
    - langgraph <3.0,>=1.1.1
    - numpy >=1.26.2
    - six <2.0.0,>=1.17.0

tests:
  - python:
      imports:
        - langchain_azure_ai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-azure-ai/
  license: MIT
  license_file: LICENSE
  summary: An integration package to support Microsoft Foundry (formerly Azure AI) capabilities in LangChain/LangGraph ecosystem.
  description: |
    An integration package to support Microsoft Foundry (formerly Azure AI) capabilities in LangChain/LangGraph ecosystem.
  repository: https://github.com/langchain-ai/langchain-azure/tree/main/libs/azure-ai

extra:
  recipe-maintainers:
    - rxm7706

