# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.25.3"

package:
  name: azure-identity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-identity/azure_identity-${{ version }}.tar.gz
  sha256: ab23c0d63015f50b630ef6c6cf395e7262f439ce06e5d07a64e874c724f8d9e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - azure-core >=1.31.0
    - cryptography >=2.5
    - msal >=1.35.1
    - msal-extensions >=1.2.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-identity/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Microsoft Azure Identity Library for Python
  description: |
    Microsoft Azure Identity Library for Python

extra:
  recipe-maintainers:
    - marcelotrevisani
    - dhirschfeld

#### CFE metadata AND comments
# CFE metadata
