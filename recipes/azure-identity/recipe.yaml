# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-identity
  version: "1.25.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_identity-${{ version }}.tar.gz
  sha256: ab23c0d63015f50b630ef6c6cf395e7262f439ce06e5d07a64e874c724f8d9e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.31.0
    - cryptography >=2.5
    - msal >=1.35.1
    - msal_extensions >=1.2.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - azure.identity
        - azure.identity._credentials
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Azure Identity Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/identity/azure-identity

extra:
  recipe-maintainers:
    - marcelotrevisani
    - dhirschfeld
