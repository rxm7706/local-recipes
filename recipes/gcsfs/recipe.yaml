# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gcsfs
  version: "2026.8.0"
  sha256: c2a7c0ffee2d0837243b4f838efaa185c152a4eb4cc529e41b3569bf00b9781e

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - google-auth >=1.2
    - google-auth-oauthlib
    - google-cloud-storage >=3.9.0
    - google-cloud-storage-control
    - requests
    - decorator >4.1.2
    - fsspec >=2026.7.0,<2026.7.1
    - aiohttp >=3.9.0

tests:
  - python:
      imports:
        - gcsfs
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Pythonic file-system interface for Google Cloud Storage
  homepage: https://github.com/dask/gcsfs
  documentation: http://gcsfs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - martindurant
    - jcrist
    - tomaugspurger
