# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.8.0"

package:
  name: gcsfs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcsfs/gcsfs-${{ version }}.tar.gz
  sha256: c2a7c0ffee2d0837243b4f838efaa185c152a4eb4cc529e41b3569bf00b9781e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - aiohttp !=4.0.0a0,!=4.0.0a1,>=3.9.0
    - decorator >4.1.2
    - fsspec >=2026.7.0
    - google-auth-oauthlib
    - google-auth >=1.2
    - google-cloud-storage-control
    - google-cloud-storage >=3.11.0
    - requests

tests:
  - python:
      imports:
        - gcsfs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fsspec/gcsfs
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Convenient Filesystem interface over GCS
  description: |
    Convenient Filesystem interface over GCS
  repository: https://github.com/fsspec/gcsfs
  documentation: https://gcsfs.readthedocs.io

extra:
  recipe-maintainers:
    - martindurant
    - jcrist
    - tomaugspurger

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gcsfs
