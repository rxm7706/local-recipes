# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: ansible-inventory-grapher
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-inventory-grapher/ansible_inventory_grapher-${{ version }}.tar.gz
  sha256: 7a782e3f50e11f6dec8f3663e063ac906eff292a628be7bd3cc473faec5a3d19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ansible-core >=2.12

tests:
  - python:
      imports:
        - ansibleinventorygrapher
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/willthames/ansible-inventory-grapher
  license: GPLv3
  license_file: LICENSE
  summary: Creates graphs representing ansible inventory
  description: |
    Creates graphs representing ansible inventory

extra:
  recipe-maintainers:
    - killua156
    - mgorny

