# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.4"

package:
  name: pptxgenjs-plus-jsx
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/pptxgenjs-plus-jsx/-/pptxgenjs-plus-jsx-${{ version }}.tgz
  sha256: 0343dc0629186c7109033190b8cbb867a32085a9ed76ce565cb79a3dd5b7f231

build:
  number: 0
  noarch: generic
  script:
    - if: unix
      then:
        - set -ex
        - pnpm install --ignore-scripts
        - npm pack --ignore-scripts
        - npm install --global ./pptxgenjs-plus-jsx-${{ version }}.tgz
        - pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
        - rm -rf "${PREFIX}/lib/node_modules/pptxgenjs-plus-jsx/node_modules/.bin"
      else:
        - call pnpm install --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm pack --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm install --global "%SRC_DIR%\pptxgenjs-plus-jsx-${{ version }}.tgz"
        - if %ERRORLEVEL% neq 0 exit 1
        - call pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
        - if %ERRORLEVEL% neq 0 exit 1
        - if exist "%PREFIX%\lib\node_modules\pptxgenjs-plus-jsx\node_modules\.bin" rmdir /s /q "%PREFIX%\lib\node_modules\pptxgenjs-plus-jsx\node_modules\.bin"
        - if exist "%PREFIX%\node_modules\pptxgenjs-plus-jsx\node_modules\.bin" rmdir /s /q "%PREFIX%\node_modules\pptxgenjs-plus-jsx\node_modules\.bin"

requirements:
  build:
    - nodejs >=24
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=24
  run:
    - nodejs >=24
    - pptxgenjs-plus ==4.3.4

tests:
  - script:
      - if: not win
        then:
          - test -f "${PREFIX}/lib/node_modules/pptxgenjs-plus-jsx/package.json"
          - test -f "${PREFIX}/share/licenses/pptxgenjs-plus-jsx/third-party-licenses.txt"
          - test ! -d "${PREFIX}/lib/node_modules/pptxgenjs-plus-jsx/node_modules/.bin"
          - |
            node <<'EOF'
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const pkgRoot = path.join(process.env.PREFIX, 'lib/node_modules/pptxgenjs-plus-jsx');
            const dist = path.join(pkgRoot, 'dist');
            const subpaths = ['index.js', 'render.js', 'jsx-runtime.js'];
            (async () => {
              for (const file of subpaths) {
                await import(pathToFileURL(path.join(dist, file)).href);
              }
              console.log('pptxgenjs-plus-jsx exports OK');
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
            EOF

about:
  summary: JSX authoring layer for pptxgenjs-plus deck generation
  description: |
    pptxgenjs-plus-jsx is the ESM JSX companion to pptxgenjs-plus. It ships
    prebuilt ``dist/`` entry points for the main module, ``render``, and the
    JSX runtimes. Install ``pptxgenjs-plus`` at the same version (exact pin).
    Upstream ``engines.node`` is ``>=24``; resolve subpath exports via
    absolute file URLs or ``require()`` on Node 24 — bare ESM ``import`` ignores
    ``NODE_PATH``.
  homepage: https://github.com/lofcz/pptxgenjs-plus
  repository: https://github.com/lofcz/pptxgenjs-plus
  documentation: https://lofcz.github.io/pptxgenjs-plus/
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt

extra:
  recipe-maintainers:
    - rxm7706

