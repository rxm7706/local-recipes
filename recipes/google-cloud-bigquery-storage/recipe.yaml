# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.40.0"

package:
  name: google-cloud-bigquery-storage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-bigquery-storage/google_cloud_bigquery_storage-${{ version }}.tar.gz
  sha256: d0f201787e83fe997122ffbcfe7ef0c6bd07e7d1716e5bc1d0a7c0edae9dbf67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.bigquery_storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigquery-storage
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Bigquery Storage API client library
  description: |
    Google Cloud Bigquery Storage API client library

extra:
  recipe-maintainers:
    - chalmerlowe
    - pshiko
    - tswast
    - xhochy

