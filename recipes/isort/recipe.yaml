# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.1"

package:
  name: isort
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/isort/isort-${{ version }}.tar.gz
  sha256: 171ac4ff559cdc060bcfff550bc8404a486fee0caab245679c2abe7cb253c78d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - isort
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pycqa.github.io/isort/index.html
  license: MIT
  license_file: LICENSE
  summary: A Python utility / library to sort Python imports.
  description: |
    A Python utility / library to sort Python imports.
  repository: https://github.com/PyCQA/isort
  documentation: https://pycqa.github.io/isort/index.html

extra:
  recipe-maintainers:
    - goanpeca
    - nicoddemus
    - nehaljwani
    - ocefpaf

