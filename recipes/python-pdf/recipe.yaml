# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.40"

package:
  name: python-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-pdf/python-pdf-${{ version }}.tar.gz
  sha256: aaceddc7ef13e1db69b88a231db77a41068a618e9220088e730ce8c99eee30a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pydf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tutorcruncher/pydf
  license: MIT
  license_file: LICENSE
  summary: PDF generation in python using wkhtmltopdf suitable for heroku
  description: |
    PDF generation in python using wkhtmltopdf suitable for heroku

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-pdf
