# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: pyffx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyffx/pyffx-${{ version }}.tar.gz
  sha256: 9ec77202e2f30810b7743969aa28af1c70711e0893d9b7a0661c6d57cf922b12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyffx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/emulbreh/pyffx/
  license: MIT
  license_file: LICENSE
  summary: pure Python format preserving encryption
  description: |
    pure Python format preserving encryption

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
