# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: google-cloud-bigquery-migration
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-bigquery-migration/google_cloud_bigquery_migration-${{ version }}.tar.gz
  sha256: 475914e4301c0512d51e398d9b21140276fd9d8fe01e412b23b85a58f7c7a4b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8

tests:
  - python:
      imports:
        - google.cloud.bigquery_migration
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigquery-migration
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Bigquery Migration API client library
  description: |
    Google Cloud Bigquery Migration API client library

extra:
  recipe-maintainers:
    - rxm7706

