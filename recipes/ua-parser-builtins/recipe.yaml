# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ua-parser-builtins
  version: 202606

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/u/ua_parser_builtins/ua_parser_builtins-${{ version }}-py3-none-any.whl
  sha256: 13b483eb12a5419c1094ce02b7df705fefc6b5d869764b3ffbf6c940c6d014cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-deps --ignore-installed ua_parser_builtins-${{ version }}-py3-none-any.whl

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    # circular dependency
    # - ua-parser

tests:
  - python:
      imports:
        - ua_parser_builtins
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip

about:
  summary: Precompiled ruleset for ua-parser
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ua-parser/uap-python/tree/master/ua-parser-builtins

extra:
  recipe-maintainers:
    - ocefpaf
