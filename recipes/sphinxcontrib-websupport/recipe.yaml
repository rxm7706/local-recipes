# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: sphinxcontrib-websupport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-websupport/sphinxcontrib_websupport-${{ version }}.tar.gz
  sha256: 0b7367d3bac6454b1f97e42aa8c4d4d4a1b756d525fc726ebbe5571e033e79cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}
    - jinja2
    - sphinx >=5
    - sphinxcontrib-serializinghtml

tests:
  - python:
      imports:
        - sphinxcontrib.websupport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sphinx-doc.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: sphinxcontrib-websupport provides a Python API to easily integrate Sphinx documentation into your Web application
  description: |
    sphinxcontrib-websupport provides a Python API to easily integrate Sphinx documentation into your Web application
  repository: https://github.com/sphinx-doc/sphinxcontrib-websupport/

extra:
  recipe-maintainers:
    - AA-Turner

#### CFE metadata AND comments
