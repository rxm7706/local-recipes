# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: crypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/crypto/crypto-${{ version }}.tar.gz
  sha256: 8f2ee9756a0265c18845ac097ae447c75cfbde158abe1361b7491619f866a9bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lib.crypto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chrissimpkins/crypto
  license: MIT
  license_file: LICENSE
  summary: Simple symmetric GPG file encryption and decryption
  description: |
    Simple symmetric GPG file encryption and decryption

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
