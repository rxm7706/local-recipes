# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: parameterized
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parameterized/parameterized-${{ version }}.tar.gz
  sha256: 7fc905272cefa4f364c1a3429cbbe9c0f98b793988efb5bf90aac80f08db09b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parameterized
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wolever/parameterized
  license: FreeBSD
  license_file: LICENSE
  summary: Parameterized testing with any Python test framework
  description: |
    Parameterized testing with any Python test framework

extra:
  recipe-maintainers:
    - chohner

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: parameterized
  cfe-upstream-registry: pypi
  cfe-upstream-name: parameterized
  cfe-purls:
    - pkg:conda/parameterized@${{ version }}?channel=conda-forge
    - pkg:pypi/parameterized@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/wolever/parameterized
  cfe-import-names: [parameterized]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/parameterized-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.9.0

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T11:01:23Z
