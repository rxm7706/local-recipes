# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.50.3"

package:
  name: nodriver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nodriver/nodriver-${{ version }}.tar.gz
  sha256: 24ca688d8646ef8ffad5c8ce65804e5e7671a779ad26a24d76f6465d5666c631

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - python-mss
    - websockets >=14
    - deprecated

tests:
  - python:
      imports:
        - nodriver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/UltrafunkAmsterdam/nodriver
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: "[Docs here](https://ultrafunkamsterdam.github.io/nodriver)"
  description: |
    [Docs here](https://ultrafunkamsterdam.github.io/nodriver)
  repository: https://github.com/UltrafunkAmsterdam/nodriver

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
