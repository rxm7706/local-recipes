# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: comex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/comex/comex-${{ version }}.tar.gz
  sha256: 504443de2ac1f784a7a61f84e99d23a06ef1194b81cb6cfa3b2d33aa2c03c8fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - networkx
    - tree-sitter
    - deepdiff
    - pydot
    - typer
    - loguru

tests:
  - python:
      imports:
        - comex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/IBM/tree-sitter-codeviews
  license: Apache-2.0
  license_file: LICENSE
  summary: Generate combined multi-code view graphs
  description: |
    Generate combined multi-code view graphs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: comex
  cfe-upstream-registry: pypi
  cfe-upstream-name: comex
  cfe-purls:
    - pkg:conda/comex@${{ version }}?channel=conda-forge
    - pkg:pypi/comex@${{ version }}
  cfe-upstream-repo: https://github.com/IBM/tree-sitter-codeviews
  cfe-upstream-homepage: https://github.com/IBM/tree-sitter-codeviews
  cfe-import-names: [comex]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
