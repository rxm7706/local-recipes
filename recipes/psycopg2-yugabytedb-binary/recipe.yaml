# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.3.5"

package:
  name: psycopg2-yugabytedb-binary
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/psycopg2-yugabytedb-binary/psycopg2_yugabytedb_binary-2.9.3.5-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
  sha256: 8ca4e48fd7661e61828ab1e9a45d2bd10a07eec06ace07f6fca7a199d74fe764

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - psycopg2_yugabytedb_binary
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://psycopg.org/
  license: MIT
  license_file: LICENSE
  summary: psycopg2 - Python-PostgreSQL Database Adapter
  description: |
    psycopg2 - Python-PostgreSQL Database Adapter
  repository: https://github.com/yugabyte/psycopg2
  documentation: https://www.psycopg.org/docs/

extra:
  recipe-maintainers:
    - rxm7706

