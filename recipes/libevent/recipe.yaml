# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.12"
  libs: '[
        "event", "event_core", "event_extra", "event_openssl"
    ] + (not win) * ["event_pthreads"]'

package:
  name: libevent
  version: ${{ version }}

source:
  url: https://github.com/libevent/libevent/archive/refs/tags/release-${{ version }}-stable.tar.gz
  sha256: 7180a979aaa7000e1264da484f712d403fcf7679b1e9212c4e3d09f5c93efc24
  patches:
    - patches/0001-Fix-destination-for-DLLs-lib-bin.patch
    - if: osx and arm64
      then: patches/0002-link-correct-libs.patch
    # libevent brings its own "Find myself" CMake setup; it only
    # looks in $PREFIX/lib, but on windows the DLLs are in /bin...
    - if: win
      then: patches/0003-search-for-libs-PREFIX-bin.patch

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
  host:
    - openssl
  run_exports:
    - ${{ pin_subpackage('libevent', upper_bound='x.x.x') }}

tests:
  - files:
      recipe:
        - cmake_test/
      source:
        - event_rpcgen.py
        - test/
    requirements:
      run:
        - python *
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - pkg-config
    script:
      - if: unix
        then: test -d "${PREFIX}/include/event2"
      - if: win
        then: if not exist %LIBRARY_INC%\event2 exit 1
      - if: osx
        then: test -f "${PREFIX}/lib/lib${{ each_lib }}.dylib"
      - if: linux
        then: test -f "${PREFIX}/lib/lib${{ each_lib }}.so"
      - if: win
        then: if not exist "%LIBRARY_LIB%/${{ each_lib }}.lib" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%/${{ each_lib }}.dll" exit 1
      - if: unix
        then: test ! -f "${PREFIX}/lib/lib${{ each_lib }}.a"
      - pkg-config --print-errors --exact-version "${{ version }}" lib${{ each_lib }}
      - python event_rpcgen.py test/regress.rpc test/regress.gen.h test/regress.gen.c
      - cd cmake_test
      - if: unix
        then: cmake -GNinja $CMAKE_ARGS .
      - if: win
        then: cmake -GNinja %CMAKE_ARGS% .

about:
  license: BSD-3-Clause
  license_file: LICENSE
  description: |
    The libevent API provides a mechanism to execute a callback function when
    a specific event occurs on a file descriptor or after a timeout has been
    reached. Furthermore, libevent also supports callbacks due to signals or
    regular timeouts.
  summary: An event notification library.
  homepage: http://libevent.org/
  repository: https://github.com/libevent/libevent
  documentation: http://www.wangafu.net/~nickm/libevent-1.4/doxygen/html/

extra:
  recipe-maintainers:
    - jakirkham
    - h-vetinari
    - xhochy
