    - pkg:pypi/zowe@${{ version }}
  cfe-upstream-repo: https://github.com/zowe/zowe-client-python-sdk
  cfe-upstream-homepage: https://github.com/zowe/zowe-client-python-sdk
  cfe-import-names: []
