# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: zowe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zowe/zowe-${{ version }}.tar.gz
  sha256: d1dc2136592554d0bbcfda1f9e1de92f1de618a9fdac0ce6aef7acbdd308a5cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zowe-zos-console-for-zowe-sdk
    - zowe-zos-files-for-zowe-sdk
    - zowe-zos-tso-for-zowe-sdk
    - zowe-zos-jobs-for-zowe-sdk
    - zowe-zosmf-for-zowe-sdk

tests:
  - python:
      imports:
        - zowe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zowe/zowe-client-python-sdk
  license: EPL-2.0
  license_file: LICENSE
  summary: Zowe Python SDK
  description: |
    Zowe Python SDK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zowe
  cfe-upstream-registry: pypi
  cfe-upstream-name: zowe
  cfe-purls:
