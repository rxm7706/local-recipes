{% set name = "rjsmin" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rjsmin-{{ version }}.tar.gz
  sha256: 7c2ef57d55e2d76db0c0d0f7399c6c5efde995c677b190ba30fb94019f94a07e

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - rjsmin
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ndparker/rjsmin
  summary: Javascript Minifier
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706
