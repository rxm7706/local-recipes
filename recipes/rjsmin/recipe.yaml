# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rjsmin
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rjsmin/rjsmin-${{ version }}.tar.gz
  sha256: 7c2ef57d55e2d76db0c0d0f7399c6c5efde995c677b190ba30fb94019f94a07e

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - rjsmin
      pip_check: true

about:
  summary: Javascript Minifier
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ndparker/rjsmin

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rjsmin
  cfe-upstream-registry: pypi
  cfe-upstream-name: rjsmin
  cfe-purls:
    - pkg:conda/rjsmin@${{ version }}?channel=conda-forge
    - pkg:pypi/rjsmin@${{ version }}
  cfe-upstream-repo: https://github.com/ndparker/rjsmin
  cfe-upstream-homepage: https://github.com/ndparker/rjsmin
  cfe-import-names: [rjsmin]
  cfe-source-kind: pypi-sdist
  cfe-noarch: compiled
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/rjsmin-feedstock
  cfe-forge-recipe-updates-needed: [meta-yaml-to-recipe-yaml]
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-11-02T02:46:06Z
