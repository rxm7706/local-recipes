# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: aioitertools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioitertools/aioitertools-${{ version }}.tar.gz
  sha256: 620bd241acc0bbb9ec819f1ab215866871b4bbd1f73836a55f799200ee86950c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - aioitertools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/aioitertools/
  license: MIT
  license_file: LICENSE
  summary: itertools and builtins for AsyncIO and mixed iterables
  description: |
    itertools and builtins for AsyncIO and mixed iterables
  documentation: https://aioitertools.omnilib.dev

extra:
  recipe-maintainers:
    - nehaljwani

