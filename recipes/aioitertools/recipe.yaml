# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aioitertools
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 620bd241acc0bbb9ec819f1ab215866871b4bbd1f73836a55f799200ee86950c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - flit-core >=3.8,<4
    - typing_extensions >=4.0
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - aioitertools
        - aioitertools.tests
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: asyncio version of the standard multiprocessing module
  description: |
    Implementation of itertools, builtins, and more for AsyncIO and mixed-type
    iterables.
  homepage: https://github.com/jreese/aioitertools
  repository: https://github.com/jreese/aioitertools
  documentation: https://github.com/jreese/aioitertools

extra:
  recipe-maintainers:
    - nehaljwani
