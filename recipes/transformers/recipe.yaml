# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.15.0"

package:
  name: transformers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/transformers/transformers-${{ version }}.tar.gz
  sha256: bbf98f57b2ddd7c4ecbccfa2c0069017aa6fd01cc204bd50cbc0eeadcf2a13b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - huggingface-hub <2.0,>=1.5.0
    - numpy >=1.17
    - packaging >=20.0
    - pyyaml >=5.1
    - regex >=2025.10.22
    - tokenizers <=0.23.0,>=0.22.0
    - typer
    - safetensors >=0.8.0
    - tqdm >=4.60

tests:
  - python:
      imports:
        - transformers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/transformers
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: "Transformers: the model-definition framework for state-of-the-art machine learning models in text, vision, audio, and multimodal models, for both inference and training."
  description: |
    Transformers: the model-definition framework for state-of-the-art machine learning models in text, vision, audio, and multimodal models, for both inference and training.

extra:
  recipe-maintainers:
    - mxr-conda
    - roccqqck
    - oblute
    - rluria14
    - ndmaxar
    - setu4993
    - zbowling
    - xhochy

#### CFE metadata AND comments
# CFE metadata
