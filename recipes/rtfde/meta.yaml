{% set name = "rtfde" %}
{% set version = "0.1.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2f0cd6ecd644071e39452e6fc4f4a1435453af0ec7c90ea86fb4fc96010c7f1b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - lark >=1.3.0,<1.4.dev0
    - oletools >=0.56

test:
  imports:
    - RTFDE
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/seamustuohy/RTFDE
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: A python3 library for extracting encapsulated HTML & plain text content from the RTF bodies of .msg files.
  description: |
    RTFDE: RTF De-Encapsulator - A python3 library for extracting 
    encapsulated `HTML` & `plain text` content from the `RTF` bodies of
    .msg files.
  doc_url: https://github.com/seamustuohy/RTFDE
  dev_url: https://github.com/seamustuohy/RTFDE

extra:
  recipe-maintainers:
    - jan-janssen
