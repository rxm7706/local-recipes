# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2.2"

package:
  name: rtfde
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/RTFDE/rtfde-${{ version }}.tar.gz
  sha256: 2f0cd6ecd644071e39452e6fc4f4a1435453af0ec7c90ea86fb4fc96010c7f1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lark ~=1.3.0
    - oletools >=0.56

tests:
  - python:
      imports:
        - RTFDE
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/seamustuohy/RTFDE
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: A library for extracting HTML content from RTF encapsulated HTML as commonly found in the exchange MSG email format.
  description: |
    A library for extracting HTML content from RTF encapsulated HTML as commonly found in the exchange MSG email format.

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
