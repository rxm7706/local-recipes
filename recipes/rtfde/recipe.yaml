# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rtfde
  version: "0.1.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2f0cd6ecd644071e39452e6fc4f4a1435453af0ec7c90ea86fb4fc96010c7f1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lark >=1.3.0,<1.4.dev0
    - oletools >=0.56

tests:
  - python:
      imports:
        - RTFDE
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A python3 library for extracting encapsulated HTML & plain text content from the RTF bodies of .msg files.
  description: |
    RTFDE: RTF De-Encapsulator - A python3 library for extracting
    encapsulated `HTML` & `plain text` content from the `RTF` bodies of
    .msg files.
  homepage: https://github.com/seamustuohy/RTFDE
  repository: https://github.com/seamustuohy/RTFDE
  documentation: https://github.com/seamustuohy/RTFDE

extra:
  recipe-maintainers:
    - jan-janssen
