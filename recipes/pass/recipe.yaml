# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: pass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Pass/Pass-${{ version }}.tar.gz
  sha256: e1bde279afed9b238390565ed3d2dd6bc52ededb966bef0d394340f8e0d63538

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - Pass
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rimvaliulin/pass
  license: MIT
  license_file: LICENSE
  summary: The pythonic awesome stylesheet language
  description: |
    The pythonic awesome stylesheet language

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pass
  cfe-upstream-registry: pypi
  cfe-upstream-name: Pass
  cfe-purls:
    - pkg:conda/pass@${{ version }}?channel=conda-forge
    - pkg:pypi/pass@${{ version }}
  cfe-upstream-repo: https://github.com/rimvaliulin/pass
  cfe-upstream-homepage: https://github.com/rimvaliulin/pass
  cfe-import-names: [Pass]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
