# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: odbcinst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/odbcinst/odbcinst-${{ version }}.tar.gz
  sha256: 9ef77a59ad8bb2da72535fae05e684829141d887ae2f36d57078624c6d230b30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - odbcinst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gordthompson/odbcinst
  license: MIT
  license_file: LICENSE
  summary: return output from unixODBC `odbcinst` command
  description: |
    return output from unixODBC `odbcinst` command

extra:
  recipe-maintainers:
    - rxm7706

