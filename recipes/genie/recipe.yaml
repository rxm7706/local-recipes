# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: genie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/g/genie/genie-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: 7ef6712457f61b48095013409ce3618a85c384e0803fcdbc614e95c00e2da1f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - prettytable
    - tqdm
    - dill
    - jsonpickle
    - netaddr >=0.10.1
    - genie.libs.conf <26.8.0,>=26.7.0
    - genie.libs.clean <26.8.0,>=26.7.0
    - genie.libs.health <26.8.0,>=26.7.0
    - genie.libs.filetransferutils <26.8.0,>=26.7.0
    - genie.libs.ops <26.8.0,>=26.7.0
    - genie.libs.parser <26.8.0,>=26.7.0
    - genie.libs.sdk <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - genie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "Genie: THE standard pyATS Library System"
  description: |
    Genie: THE standard pyATS Library System

extra:
  recipe-maintainers:
    - rxm7706

