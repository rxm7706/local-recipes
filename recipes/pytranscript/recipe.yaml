# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.12"

package:
  name: pytranscript
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytranscript/pytranscript-${{ version }}.tar.gz
  sha256: cb1042521411a2b528e03cc8fe51c29f2ceb2fd7dec774dbd30c5e13bd445f97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - deep-translator >=1.11.4
    - tqdm >=4.66.1
    - vosk >=0.3.45
    - ffmpeg-python >=0.2.0
    - typed-argument-parser >=1.9.0

tests:
  - python:
      imports:
        - pytranscript
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytranscript/
  license: MIT
  license_file: LICENSE
  summary: CLI to transcript and translate audio and video files
  description: |
    CLI to transcript and translate audio and video files
  repository: https://github.com/arnaud-ma/pytranscript
  documentation: https://github.com/arnaud-ma/pytranscript#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytranscript
  cfe-upstream-registry: pypi
  cfe-upstream-name: pytranscript
