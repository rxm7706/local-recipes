# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: datacompy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datacompy/datacompy-${{ version }}.tar.gz
  sha256: baf7f429f6bf45f1b5b704db7f06074115cb8baa60488eb08377271d25e60ba0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - jinja2 >=3
    - numpy <2.6,>=1.26.4
    - ordered-set <=4.1,>=4.0.2
    - pandas <3.1,>=2.2
    - polars <1.44,>=0.20.4

tests:
  - python:
      imports:
        - datacompy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/capitalone/datacompy
  license: Apache-2.0
  license_file: LICENSE
  summary: Dataframe comparisons in Python
  description: |
    Dataframe comparisons in Python
  repository: https://github.com/capitalone/datacompy.git
  documentation: https://capitalone.github.io/datacompy/

extra:
  recipe-maintainers:
    - rhaffar
    - jdawang
    - gladysteh99
    - fdosani
    - ak-gupta

