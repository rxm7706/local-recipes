# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pyproject-hooks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyproject-hooks/pyproject_hooks-${{ version }}.tar.gz
  sha256: 1e859bd5c40fae9448642dd871adf459e5e2084186e8d2c2a79a824c970da1f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyproject_hooks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyproject-hooks/
  license: MIT
  license_file: LICENSE
  summary: Wrappers to call pyproject.toml-based build backend hooks.
  description: |
    Wrappers to call pyproject.toml-based build backend hooks.
  repository: https://github.com/pypa/pyproject-hooks
  documentation: https://pyproject-hooks.readthedocs.io/

extra:
  recipe-maintainers:
    - theAeon

