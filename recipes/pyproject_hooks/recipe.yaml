# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyproject_hooks
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyproject_hooks-${{ version }}.tar.gz
  sha256: 1e859bd5c40fae9448642dd871adf459e5e2084186e8d2c2a79a824c970da1f8

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3.2, <4
  run:
    - python >=${{ python_min }}
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - pyproject_hooks
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Wrappers to call pyproject.toml-based build backend hooks.
  license: MIT
  license_file:
    - LICENSE
  homepage: https://pypi.org/project/pyproject_hooks/
  repository: https://github.com/pypa/pyproject-hooks

extra:
  recipe-maintainers:
    - theAeon
