# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: presidio-structured
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/presidio-structured/presidio_structured-${{ version }}.tar.gz
  sha256: 1769fb703fd17c025305c9fbf4afe1d456e5e72953686c1f0489d79b53534555

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click <9.0.0,>=8.1.0
    - pandas <4.0.0,>=1.5.2
    - presidio-analyzer <3.0.0,>=2.2.0
    - presidio-anonymizer <3.0.0,>=2.2.0

tests:
  - python:
      imports:
        - presidio_structured
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/data-privacy-stack/presidio
  license: MIT
  license_file: LICENSE
  summary: Presidio structured package - analyzes and anonymizes structured and semi-structured data.
  description: |
    Presidio structured package - analyzes and anonymizes structured and semi-structured data.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
