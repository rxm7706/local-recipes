# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: ttkbootstrap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/ttkbootstrap/ttkbootstrap-${{ version }}.tar.gz
  sha256: b7effaf84ffadf4ad73da78e3998615715f883bcf6aac8c7cbb232dd498ce8a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}
    - pillow <13,>=10

tests:
  - python:
      imports:
        - ttkcreator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/israel-dryer/ttkbootstrap
  license: MIT AND (Apache-2.0 OR BSD-2-Clause)
  license_file: LICENSE
  summary: Modern themes for Tkinter. Sleek, responsive styles inspired by Bootstrap. Includes ready-to-use widgets, 30+ themes, and tools for building beautiful, cross-platform desktop apps with ease.
  description: |
    Modern themes for Tkinter. Sleek, responsive styles inspired by Bootstrap. Includes ready-to-use widgets, 30+ themes, and tools for building beautiful, cross-platform desktop apps with ease.
  documentation: https://ttkbootstrap.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

