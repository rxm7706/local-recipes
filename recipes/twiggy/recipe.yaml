# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: twiggy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/Twiggy/Twiggy-${{ version }}.tar.gz
  sha256: 7938840275972f6ce89994a5bdfb0b84f0386301a043a960af6364952e78ffe4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - twiggy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wearpants/twiggy/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: a Pythonic logger
  description: |
    a Pythonic logger

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: twiggy
  cfe-upstream-registry: pypi
  cfe-upstream-name: Twiggy
  cfe-purls:
    - pkg:conda/twiggy@${{ version }}?channel=conda-forge
    - pkg:pypi/twiggy@${{ version }}
  cfe-upstream-repo: https://github.com/wearpants/twiggy/
  cfe-upstream-homepage: https://github.com/wearpants/twiggy/
  cfe-import-names: [twiggy]
