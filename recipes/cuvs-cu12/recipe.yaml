# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.1"

package:
  name: cuvs-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/c/cuvs-cu12/cuvs_cu12-26.8.1-cp311-abi3-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: 8898d70a91a219a31d831428fc2714ae16a7d32b472473003a9a68a295b293f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <13.0,>=12.9.2
    - libcuvs-cu12 ==26.8.*
    - numpy <3.0,>=2.0
    - pylibraft-cu12 ==26.8.*

tests:
  - python:
      imports:
        - cuvs_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cuvs
  license: Apache-2.0
  license_file: LICENSE
  summary: "cuVS: Vector Search on the GPU"
  description: |
    cuVS: Vector Search on the GPU
  documentation: https://docs.rapids.ai/api/cuvs/stable/

extra:
  recipe-maintainers:
    - rxm7706

