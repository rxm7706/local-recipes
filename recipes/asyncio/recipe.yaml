# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/asyncio/asyncio-4.0.0-py3-none-any.whl
  sha256: c1eddb0659231837046809e68103969b2bef8b0400d59cfa6363f6b5ed8cc88b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.python.org/3/library/asyncio.html
  license: Apache-2.0
  license_file: LICENSE
  summary: Deprecated backport of asyncio; use the stdlib package instead
  description: |
    Deprecated backport of asyncio; use the stdlib package instead
  repository: https://github.com/python/asyncio

extra:
  recipe-maintainers:
    - rxm7706

