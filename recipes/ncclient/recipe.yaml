# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: ncclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/ncclient/ncclient-${{ version }}.tar.gz
  sha256: 60dabb6ac1a2d84fbc3349cb104ef7d0c5d12cf8eee43fefc715410d70410ddc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-vcs >=0.4
  run:
    - python >=${{ python_min }}
    - lxml >=3.3.0
    - paramiko >=3.2.0

tests:
  - python:
      imports:
        - ncclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ncclient/ncclient
  license: Apache-2.0
  license_file: LICENSE
  summary: Python library for NETCONF clients
  description: |
    Python library for NETCONF clients
  repository: https://github.com/ncclient/ncclient
  documentation: https://ncclient.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ncclient
