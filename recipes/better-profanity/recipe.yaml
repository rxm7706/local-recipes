# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: better-profanity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/better-profanity/better_profanity-${{ version }}.tar.gz
  sha256: 8a6fdc8606d7471e7b5f6801917eca98ec211098262e82f62da4f5de3a73145b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - better_profanity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snguyenthanh/better_profanity
  license: MIT
  license_file: LICENSE
  summary: Blazingly fast cleaning swear words (and their leetspeak) in strings
  description: |
    Blazingly fast cleaning swear words (and their leetspeak) in strings

extra:
  recipe-maintainers:
    - rxm7706

