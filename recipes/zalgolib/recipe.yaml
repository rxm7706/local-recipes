# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: zalgolib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zalgolib/zalgolib-${{ version }}.tar.gz
  sha256: 9deda04f9381a0a90d64fef40e3519484f27d8736f7606ff3d22dd0eb17e7ecd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zalgolib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jivanyatra/zalgolib/
  license: MIT
  license_file: LICENSE
  summary: A Python library for a _FULL_ Zalgo experience
  description: |
    A Python library for a _FULL_ Zalgo experience

extra:
  recipe-maintainers:
    - rxm7706

