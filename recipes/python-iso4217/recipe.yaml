# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: python-iso4217
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-iso4217/python_iso4217-${{ version }}.tar.gz
  sha256: cdbb5cb5cc183182e97c9e110483e66b84abafbabbd0b91d8d1c64333f144a7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - ijson

tests:
  - python:
      imports:
        - iso4217
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GLEF1X/python-iso4217
  license: MIT
  license_file: LICENSE
  summary: Lightweight ISO 4217 currency package
  description: |
    Lightweight ISO 4217 currency package
  repository: https://github.com/GLEF1X/python-iso4217

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
