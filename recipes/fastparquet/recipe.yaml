# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastparquet
  version: "2026.5.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 12a813d1c91b9d316a8d43860074daf4566849f776f9cd549742aa71d907e4f6

build:
  number: 0
  skip: match(python, "<3.9")
  script:
    - if: win
      then: del fastparquet\*.c
    - if: unix
      then: rm fastparquet/*.c
    - ${{ PYTHON }} ${{ RECIPE_DIR }}/un_oldest.py
    - ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython >=0.29.23
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython >=0.29.23
    - pandas
    - pip
    - setuptools
    - setuptools-scm >1.5.4
    - numpy
    - pytest-runner
    - packaging
  run:
    - python
    - pandas >=1.5.0
    - numpy
    - cramjam >=2.3
    - fsspec
    - packaging

tests:
  - python:
      imports:
        - fastparquet
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python interface to the parquet format
  homepage: http://github.com/dask/fastparquet
  repository: https://github.com/dask/fastparquet

extra:
  recipe-maintainers:
    - martindurant
    - mrocklin
    - TomAugspurger
