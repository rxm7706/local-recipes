# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ctransformers
  version: "0.2.27"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 25653d4be8a5ed4e2d3756544c1e9881bf95404be5371c3ed506a256c28663d5

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.18
    - make
    - ninja
    - scikit-build >=0.13
    - setuptools >=42
  host:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.18
    - make
    - ninja
    - python
    - pip
    - scikit-build >=0.13
    - setuptools >=42
  run:
    - python
    - huggingface_hub
    - py-cpuinfo <10.0.0,>=9.0.0

tests:
  - python:
      imports:
        - ctransformers
      pip_check: false

about:
  summary: Python bindings for the Transformer models implemented in C/C++ using GGML library.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/marella/ctransformers

extra:
  recipe-maintainers:
    - raybellwaves
