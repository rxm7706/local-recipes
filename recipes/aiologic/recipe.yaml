# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.1"

package:
  name: aiologic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiologic/aiologic-${{ version }}.tar.gz
  sha256: 2e1b93b9e88ced318c2a63ad7b382688f40cbfe40e3d42258d49dc9c5aea179d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - sniffio >=1.3.0
    - typing_extensions >=4.10.0
    - wrapt >=1.16.0

tests:
  - python:
      imports:
        - aiologic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/x42005e1f/aiologic
  license: ISC
  license_file: LICENSE
  summary: GIL-powered* locking library for Python
  description: |
    GIL-powered* locking library for Python
  documentation: https://aiologic.readthedocs.io

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
