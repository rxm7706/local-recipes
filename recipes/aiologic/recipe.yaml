# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aiologic
  version: "0.17.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aiologic-${{ version }}.tar.gz
  sha256: 2e1b93b9e88ced318c2a63ad7b382688f40cbfe40e3d42258d49dc9c5aea179d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - sniffio >=1.3.0
    # for all python to stay noarch: python
    - typing_extensions >=4.10.0
    - wrapt >=1.16.0

tests:
  - python:
      imports:
        - aiologic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: GIL-powered* locking library for Python
  license: ISC
  license_file: ISC.txt
  homepage: https://github.com/x42005e1f/aiologic
  repository: https://github.com/x42005e1f/aiologic
  documentation: https://aiologic.readthedocs.io/latest/

extra:
  recipe-maintainers:
    - xylar
