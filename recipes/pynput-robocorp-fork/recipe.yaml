# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pynput-robocorp-fork
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/pynput-robocorp-fork-${{ version }}.tar.gz
  sha256: 9834c62ad5cb03b1bad6531412412681fcc4492e48e411d38285b5ed292b2b46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - six
    - setuptools-lint >=0.5
    - sphinx >=1.3.1
    - pip
  run:
    - python >=3.8
    - six
    - if: linux
      then: python-xlib >=0.17
    - if: osx
      then: pyobjc-framework-applicationservices <10.0,>=8.0
    - if: osx
      then: pyobjc-framework-quartz <10.0,>=8.0
    - if: osx
      then: pyobjc-core <10.0,>=8.0
    - if: linux
      then: __linux
    - if: osx
      then: __osx
    - if: win
      then: __win

tests:
  - python:
      imports:
        - if: not linux
          then: pynput_robocorp
      pip_check: false
  - requirements:
      run:
        - pip
    script:
      - if: not osx
        then: pip check

about:
  summary: Monitor and control user input devices
  license: LGPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING.LGPL
  homepage: https://github.com/robocorp/pynput

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
