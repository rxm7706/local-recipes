# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.1"
  python_min: "3.12"

package:
  name: pymc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymc/pymc-${{ version }}.tar.gz
  sha256: c909ea4c88bd2f2311ecceb6f078a1bfe9e652732991e438a11660cd367c5d19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - versioneer
    - arviz <2.0,>=1.1.0
    - cachetools <7,>=4.2.1
    - cloudpickle
    - numpy >=1.25.0
    - pandas >=0.24.0
    - pytensor <3.4,>=3.2.2
    - rich >=13.7.1
    - scipy >=1.4.1
    - threadpoolctl <4.0.0,>=3.1.0
    - typing_extensions >=3.7.4

tests:
  - python:
      imports:
        - pymc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/pymc-devs/pymc
  license: Apache-2.0
  license_file: LICENSE
  summary: "Probabilistic Programming in Python: Bayesian Modeling and Probabilistic Machine Learning with PyTensor"
  description: |
    Probabilistic Programming in Python: Bayesian Modeling and Probabilistic Machine Learning with PyTensor

extra:
  recipe-maintainers:
    - jessegrabowski
    - ericmjl
    - twiecki
    - fonnesbeck
    - ocefpaf
    - michaelosthege
    - maresb
    - ricardoV94

#### CFE metadata AND comments
