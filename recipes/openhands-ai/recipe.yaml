# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"
  python_min: "3.12"

package:
  name: openhands-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openhands-ai/openhands_ai-${{ version }}.tar.gz
  sha256: 95bf563bd3d34876ea6284e28321c034fa44491a46b21e32bf5cc54d118bbf78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp ==3.14.1
    - anthropic
    - anyio ==4.9.0
    - asyncpg >=0.30
    - authlib !=1.7.0,>=1.6.12
    - bashlex ==0.18
    - binaryornot ==0.6.0
    - boto3
    - browsergym-core ==0.13.3
    - deprecated ==1.3.1
    - deprecation ==2.1.0
    - dirhash ==0.5.0
    - docker-py ==7.1.0
    - fastapi
    - fastmcp <4,>=3.2
    - gitpython ==3.1.50
    - google-api-python-client >=2.164
    - google-auth-httplib2 ==0.3.1
    - google-auth-oauthlib ==1.3.1
    - google-cloud-aiplatform
    - google-genai
    - html2text ==2025.4.15
    - httpx-aiohttp ==0.1.12
    - ipywidgets ==8.1.8
    - jinja2 ==3.1.6
    - joblib ==1.5.3
    - joserfc >=1.0.0
    - json-repair
    - jupyter_kernel_gateway ==3.0.1
    - kubernetes >=33.1
    - libtmux >=0.46.2
    - litellm ==1.84.1
    - lmnr >=0.7.20
    - mcp >=1.25
    - memory-profiler ==0.61.0
    - numpy ==2.4.4
    - openai ==2.33.0
    - openhands-agent-server ==1.34.0
    - openhands-sdk ==1.34.0
    - openhands-tools ==1.34.0
    - opentelemetry-api ==1.39.1
    - opentelemetry-exporter-otlp-proto-grpc ==1.39.1
    - orjson ==3.11.8
    - pathspec >=0.12.1
    - pexpect ==4.9.0
    - pg8000 ==1.31.5
    - pillow ==12.2.0
    - playwright ==1.58.0
    - poetry ==2.3.4
    - prompt-toolkit ==3.0.52
    - protobuf ==5.29.6
    - psutil ==7.2.2
    - pybase62 ==1.0.0
    - pygithub >=2.5
    - pyjwt ==2.13.0
    - pylatexenc ==2.10
    - pypdf ==6.14.2
    - python-docx ==1.2.0
    - python-dotenv ==1.2.2
    - python-frontmatter ==1.1.0
    - python-json-logger >=3.2.1
    - python-multipart ==0.0.32
    - python-pptx ==1.0.2
    - python-socketio ==5.14.0
    - pyyaml ==6.0.3
    - qtconsole-base ==5.7.2
    - rapidfuzz >=3.9
    - redis-py ==6.4.0
    - requests ==2.33.1
    - setuptools
    - shellingham ==1.5.4
    - sqlalchemy >=2.0.40
    - sse-starlette ==3.3.4
    - starlette ==1.3.1
    - tenacity ==9.1.4
    - termcolor ==3.3.0
    - toml ==0.10.2
    - tornado ==6.5.7
    - tree-sitter-language-pack >=0.7.3
    - types-toml
    - urllib3 ==2.7.0
    - uvicorn
    - whatthepatch ==1.0.7
    - zope-interface ==7.2
    - if: win
      then:
        - pythonnet

tests:
  - python:
      imports:
        - openhands
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OpenHands/OpenHands
  license: MIT
  license_file: LICENSE
  summary: "OpenHands: Code Less, Make More"
  description: |
    OpenHands: Code Less, Make More
  repository: https://github.com/OpenHands/OpenHands

extra:
  recipe-maintainers:
    - rxm7706

