# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: vizro-dash-components
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vizro-dash-components/vizro_dash_components-${{ version }}.tar.gz
  sha256: 14c724e7d111150dc7ffa55407fa57dc3baa4e18b71002c24f39291c1bdf6703

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-nodejs-version >=0.3.2
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - dash >=4,<5
    - dash-mantine-components >=2.0.0

tests:
  - python:
      imports:
        - vizro_dash_components
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Vizro Dash Components are used by the Vizro framework but can be used in a pure Dash app
  license: Apache-2.0
  license_file: LICENSE.txt
  repository: https://github.com/mckinsey/vizro
  homepage: https://vizro.mckinsey.com/

extra:
  recipe-maintainers:
    - rxm7706

