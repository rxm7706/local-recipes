# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.21.0.1"

package:
  name: pymcurl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymcurl/pymcurl-${{ version }}.tar.gz
  sha256: fd9f884f734bdcadf68f02007254dcd237d2c523453dd13bd462dc62b9496162

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - cffi
    - jbb
    - setuptools
  run:
    - python >=${{ python_min }}
    - cffi

tests:
  - python:
      imports:
        - mcurl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/genotrance/mcurl
  license: MIT
  license_file: LICENSE
  summary: Manage outbound HTTP connections using Curl & CurlMulti
  description: |
    Manage outbound HTTP connections using Curl & CurlMulti
  repository: https://github.com/genotrance/mcurl

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pymcurl
  cfe-upstream-registry: pypi
  cfe-upstream-name: pymcurl
