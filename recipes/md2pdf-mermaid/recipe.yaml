# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.3"

package:
  name: md2pdf-mermaid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/md2pdf-mermaid/md2pdf_mermaid-${{ version }}.tar.gz
  sha256: 48ffc0d4a0f59eb1fb44ebb85fd6267527de059e9a5db18043bb68fbbdcc71e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - reportlab >=4.0.0
    - playwright >=1.40.0
    - pillow >=10.0.0
    - markdown >=3.0.0

tests:
  - python:
      imports:
        - md2pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rbutinar/md2pdf-mermaid
  license: MIT
  license_file: LICENSE
  summary: Convert Markdown to PDF with Mermaid diagram rendering and emoji support
  description: |
    Convert Markdown to PDF with Mermaid diagram rendering and emoji support
  repository: https://github.com/rbutinar/md2pdf-mermaid

extra:
  recipe-maintainers:
    - rxm7706

