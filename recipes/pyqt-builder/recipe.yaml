# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: PyQt-builder
  version: "1.18.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: 56dfea461484a87a8f0c8b0229190defc436d7ec5de71102e20b35e5639180bc
  patches:
    - patches/0001-Use-conda-sysroot-when-building-recipes.patch
    - patches/0002-disable-test-execution-cross.patch
    - patches/0003-find-sip-distinfo.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pyqt-bundle = pyqtbuild.bundle.bundle_main:main
      - pyqt-qt-wheel = pyqtbuild.bundle.qt_wheel_main:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sip
    - packaging
    - toml

tests:
  - python:
      imports:
        - pyqtbuild
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: The PEP 517 compliant PyQt build system
  description: |
    PyQt-builder is the PEP 517 compliant build system for PyQt and projects
    that extend PyQt. It extends the sip build system and uses Qt’s qmake to
    perform the actual compilation and installation of extension modules.


  homepage: https://www.riverbankcomputing.com/software/pyqt/

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - JarrettSJohnson
