# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydeck
  version: "0.9.3"
  python_min: python_min|default("3.8")

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pydeck-${{ version }}.tar.gz
  sha256: 695775cbfe51f5fdffbd9735ba469987fdc5efc96bc40a0ee4808170509c78b2

build:
  number: 0
  noarch: python
  script:
    - if: unix
      then: rm $SRC_DIR/pyproject.toml
    - if: win
      then: del %SRC_DIR%\pyproject.toml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - wheel
    - jinja2 >=2.10.1
    - jupyter >=1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - jinja2 >=2.10.1
    - numpy >=1.16.4
  run_constraints:
    - ipykernel >=5.1.2
    - ipywidgets >=7,<8
    - traitlets >=4.3.2

tests:
  - python:
      imports:
        - pydeck
        - pydeck.bindings
        - pydeck.data_utils
        - pydeck.io
        - pydeck.nbextension
        - pydeck.widget
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Widget for deck.gl maps
  homepage: https://github.com/visgl/deck.gl/tree/master/bindings/pydeck
  repository: https://github.com/visgl/deck.gl/tree/master/bindings/pydeck
  documentation: https://deckgl.readthedocs.io

extra:
  recipe-maintainers:
    - ajduberstein
    - Jesus89
    - rxm7706
