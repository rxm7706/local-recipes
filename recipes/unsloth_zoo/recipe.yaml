# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: unsloth_zoo
  version: "2026.8.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/unsloth_zoo-${{ version }}.tar.gz
  sha256: 7c033c5c16521c61acb1f4f53f96c93a16b620439b28caaea9c73bc568ec648f

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=2.4.0,<2.13
    - torchao >=0.13,!=0.14
    - triton
    - packaging >=24.1
    - tyro
    - transformers >=4.51.3,!=4.52.0,!=4.52.1,!=4.52.2,!=4.52.3z,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,<=4.56.2
    - datasets >=3.4.1,!=4.0.0,!=4.1.0,<4.4.0
    - sentencepiece >=0.2.0
    - tqdm
    - psutil
    - wheel >=0.42.0
    - numpy
    - accelerate >=0.34.1
    - trl >=0.7.9,!=0.9.0,!=0.9.1,!=0.9.2,!=0.9.3,!=0.15.0,!=0.19.0,<=0.23.0
    - peft >=0.7.1,!=0.11.0
    - protobuf
    - huggingface_hub >=0.34.0
    - hf-transfer
    - cut_cross_entropy
    - pillow
    - regex
    - msgspec
    - typing_extensions
    - filelock
    - mistral-common

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Utils for Unsloth
  license: LGPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/unslothai/unsloth_zoo

extra:
  recipe-maintainers:
    - isuruf
    - timkpaine
