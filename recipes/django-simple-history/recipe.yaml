# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.13.0"

package:
  name: django-simple-history
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-simple-history/django_simple_history-${{ version }}.tar.gz
  sha256: ca3c1e4ccd5f16f45fbbef6015ee2a246465fd9bd924100df8e9dfb368c4f26c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-fancy-pypi-readme
    - hatch-vcs
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=5.2

tests:
  - python:
      imports:
        - simple_history
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django-commons/django-simple-history
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Store model history and view/revert changes from admin site.
  description: |
    Store model history and view/revert changes from admin site.
  repository: https://github.com/django-commons/django-simple-history
  documentation: https://django-simple-history.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - sannykr

#### CFE metadata AND comments
