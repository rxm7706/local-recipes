# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: mdurl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mdurl/mdurl-${{ version }}.tar.gz
  sha256: bb413d29f5eea38f31dd4754dd7377d4465116fb207585f97bf925588687c1ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2.0,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mdurl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/executablebooks/mdurl
  license: MIT
  license_file: LICENSE
  summary: Markdown URL utilities
  description: |
    Markdown URL utilities

extra:
  recipe-maintainers:
    - thewchan
    - chrisjsewell
    - thewchan

#### CFE metadata AND comments
