# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.16"

package:
  name: aiohttp-swagger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiohttp-swagger/aiohttp-swagger-${{ version }}.tar.gz
  sha256: 48e5d9e9a9ece13afd67ab37209c01fbd2b691694559b08141e4a89f8a28b126

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - jinja2
    - aiohttp

tests:
  - python:
      imports:
        - aiohttp_swagger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cr0hn/aiohttp-swagger
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Swagger API Documentation builder for aiohttp server
  description: |
    Swagger API Documentation builder for aiohttp server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
