{% set name = "wagtailstreamforms" %}
{% set version = "5.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtailstreamforms-{{ version }}.tar.gz
  sha256: 4c07e419f3b73d4a41a8d1e0cd353d40430e6cf462f63d2898b703d04b68a271

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - django
    - django-recaptcha >=4.0.0
    - psycopg >=3.2.9
    - tox >=4.26.0
    - wagtail-modeladmin >=2.5.0
    - python >={{ python_min }}
    - wagtail >=7.0,<9.0
    - unidecode >=0.04.14,<2.0
    - wagtail-generic-chooser >=0.8

test:
  imports:
    - wagtailstreamforms
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/AccentDesign/wagtailstreamforms/
  summary: Wagtail forms in a streamfield
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
