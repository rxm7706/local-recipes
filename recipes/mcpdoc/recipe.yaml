# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.10"

package:
  name: mcpdoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcpdoc/mcpdoc-${{ version }}.tar.gz
  sha256: 7fe8e3ed1dbc0886378a6c7004d6cb1e6b79573ed1be15374f1e1a1fc05f30a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - markdownify >=1.1.0
    - mcp >=1.4.1
    - pyyaml >=6.0.1

tests:
  - python:
      imports:
        - mcpdoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcpdoc/
  license: MIT
  license_file: LICENSE
  summary: Server llms-txt documentation over MCP
  description: |
    Server llms-txt documentation over MCP

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mcpdoc
  cfe-upstream-registry: pypi
  cfe-upstream-name: mcpdoc
  cfe-purls:
    - pkg:conda/mcpdoc@${{ version }}?channel=conda-forge
    - pkg:pypi/mcpdoc@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/mcpdoc/
  cfe-upstream-homepage: https://pypi.org/project/mcpdoc/
  cfe-import-names: [mcpdoc]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
