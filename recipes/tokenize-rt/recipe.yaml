# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tokenize-rt
  version: "6.2.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tokenize_rt-${{ version }}.tar.gz
  sha256: 8439c042b330c553fdbe1758e4a05c0ed460dbbbb24a606f11f0dee75da4cad6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - tokenize-rt = tokenize_rt:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tokenize_rt
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - tokenize-rt --help

about:
  license: MIT
  license_file: LICENSE
  summary: A wrapper around the stdlib `tokenize` which roundtrips.
  homepage: https://github.com/asottile/tokenize-rt

extra:
  recipe-maintainers:
    - sterlingbaldwin
    - deadsnakes-issues-bot
    - nicoddemus
