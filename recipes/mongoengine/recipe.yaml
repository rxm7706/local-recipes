# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.29.3"

package:
  name: mongoengine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mongoengine/mongoengine-${{ version }}.tar.gz
  sha256: 4267702aea433012845cb12b6334bff86a0a3084b5d141c1e4553ea20374a9b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pymongo <5.0,>=3.4

tests:
  - python:
      imports:
        - mongoengine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MongoEngine/mongoengine
  license: MIT
  license_file: LICENSE
  summary: MongoEngine is a Python Object-Document Mapper for working with MongoDB.
  description: |
    MongoEngine is a Python Object-Document Mapper for working with MongoDB.

extra:
  recipe-maintainers:
    - JaRoSchm
    - dgasmith
    - lnaden

