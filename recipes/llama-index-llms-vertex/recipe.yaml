# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: llama-index-llms-vertex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-vertex/llama_index_llms_vertex-${{ version }}.tar.gz
  sha256: 9f2e89d8704ece56cd0aa993de875c0389830d5af93deb5d1d7c08ea9f0c70ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - google-cloud-aiplatform <2,>=1.39.0
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.llms.vertex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-vertex/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms vertex integration
  description: |
    llama-index llms vertex integration

extra:
  recipe-maintainers:
    - rxm7706

