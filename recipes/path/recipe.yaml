# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "17.1.1"

package:
  name: path
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/path/path-${{ version }}.tar.gz
  sha256: 2dfcbfec8b4d960f3469c52acf133113c2a8bf12ac7b98d629fa91af87248d42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - path
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/path/
  license: MIT
  license_file: LICENSE
  summary: A module wrapper for os.path
  description: |
    A module wrapper for os.path
  repository: https://github.com/jaraco/path

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: path
  cfe-upstream-registry: pypi
  cfe-upstream-name: path
  cfe-purls:
    - pkg:conda/path@${{ version }}?channel=conda-forge
    - pkg:pypi/path@${{ version }}
  cfe-upstream-repo: https://github.com/jaraco/path
  cfe-upstream-homepage: https://pypi.org/project/path/
  cfe-import-names: [path]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/path-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-17.1.1

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T02:48:12Z
