# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "17.1.1"

package:
  name: path
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/path/path-${{ version }}.tar.gz
  sha256: 2dfcbfec8b4d960f3469c52acf133113c2a8bf12ac7b98d629fa91af87248d42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61.2
    - setuptools_scm >=3.4.1
    - toml
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - path
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A module wrapper for os.path
  description: |
    path implements a path objects as first-class entities, allowing common
    operations on files to be invoked on those path objects directly.
  homepage: https://github.com/jaraco/path
  repository: https://github.com/jaraco/path
  documentation: https://path.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nehaljwani
