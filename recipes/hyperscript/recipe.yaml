# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: hyperscript
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hyperscript-${{ version }}.tar.gz
  sha256: 77e9372c09dbf0ec0e18515cd7e13a44cac7cbf800362a1eac26d9f8c4abe2a8

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hyperscript
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: HyperText with Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vchan/hyperscript

extra:
  recipe-maintainers:
    - rxm7706
