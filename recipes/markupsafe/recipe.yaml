# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: markupsafe
  version: "3.0.3"

package:
  name: markupsafe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698

build:
  number: 1
  noarch: ${{ 'python' if use_noarch else '' }}
  script:
    - if: use_noarch
      then: sed -i.bak 's/supports_speedups = /supports_speedups = False and /g' setup.py
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  track_features:
    - if: use_noarch
      then: markupsafe_no_compile

requirements:
  build:
    - if: build_platform != target_platform and not use_noarch
      then: python
    - if: build_platform != target_platform and not use_noarch
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - if: use_noarch
      then: python ${{ python_min }}
    - if: not use_noarch
      then: python
    - pip
    - setuptools >=77
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
    - if: not use_noarch
      then: python
  run_constraints:
    - jinja2 >=3.0.0

tests:
  - python:
      imports:
        - markupsafe
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Safely add untrusted strings to HTML/XML markup.
  description: |
    MarkupSafe implements a text object that escapes characters so it is
    safe to use in HTML and XML. Characters that have special meanings are
    replaced so that they display as the actual characters. This mitigates
    injection attacks, meaning untrusted user input can safely be displayed
    on a page.
  homepage: https://www.palletsprojects.com/p/markupsafe
  repository: https://github.com/pallets/markupsafe
  documentation: https://markupsafe.palletsprojects.com/

extra:
  recipe-maintainers:
    - xylar
    - pelson
    - scopatz
    - ocefpaf
