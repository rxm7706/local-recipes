# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: envyaml
  version: "1.10.211231"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/envyaml-${{ version }}.tar.gz
  sha256: 88f8a076159e3c317d3450a5f404132b6ac91aecee4934ea72eac65f911f1244

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - envyaml
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Simple YAML configuration file parser with easy access for structured data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/thesimj/envyaml

extra:
  recipe-maintainers:
    - PovilasMat
