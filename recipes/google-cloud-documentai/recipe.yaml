# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.15.0"

package:
  name: google-cloud-documentai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-documentai/google_cloud_documentai-${{ version }}.tar.gz
  sha256: d50b69a8a62aaf803b0d926f93b6579df440f5f779f45fec2c5972768a1cdbbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1

tests:
  - python:
      imports:
        - google.cloud.documentai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-documentai
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Documentai API client library
  description: |
    Google Cloud Documentai API client library

extra:
  recipe-maintainers:
    - MartinHoloubekQC

