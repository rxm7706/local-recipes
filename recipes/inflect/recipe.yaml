# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.5.0"

package:
  name: inflect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/inflect/inflect-${{ version }}.tar.gz
  sha256: faf19801c3742ed5a05a8ce388e0d8fe1a07f8d095c82201eb904f5d27ad571f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - more-itertools >=8.5.0
    - typeguard >=4.0.1
    - typing_extensions

tests:
  - python:
      imports:
        - inflect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/inflect/
  license: MIT
  license_file: LICENSE
  summary: Correctly generate plurals, singular nouns, ordinals, indefinite articles
  description: |
    Correctly generate plurals, singular nouns, ordinals, indefinite articles
  repository: https://github.com/jaraco/inflect

extra:
  recipe-maintainers:
    - pmlandwehr
    - dbast

