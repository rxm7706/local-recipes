# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: ocrmac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ocrmac/ocrmac-${{ version }}.tar.gz
  sha256: 507fe5e4cbd67b2d03f6729a52bbc11f9d0b58241134eb958a5daafd4b9d93d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=7.0
    - pyobjc-framework-vision
    - pillow

tests:
  - python:
      imports:
        - ocrmac
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/straussmaximilian/ocrmac
  license: MIT
  license_file: LICENSE
  summary: A python wrapper to extract text from images on a mac system. Uses the vision framework from Apple.
  description: |
    A python wrapper to extract text from images on a mac system. Uses the vision framework from Apple.

extra:
  recipe-maintainers:
    - rxm7706

