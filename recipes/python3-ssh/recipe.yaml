# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.14"

package:
  name: python3-ssh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-ssh/python3_ssh-${{ version }}.tar.gz
  sha256: 4fb85132821fa93597d403a923d7298a97bcc9e71528adf42f5ba3c3dd406ce4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - func-timeout
    - paramiko

tests:
  - python:
      imports:
        - ssh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitee.com/devops_dev/ssh
  license: MIT
  license_file: LICENSE
  summary: used to ssh to exe cmd or scp file
  description: |
    used to ssh to exe cmd or scp file
  documentation: https://gitee.com/devops_dev/ssh/README.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
