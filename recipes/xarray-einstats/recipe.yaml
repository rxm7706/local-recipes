# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated using grayskull; edited by @ericmjl.
schema_version: 1

context:
  python_min: "3.12"
  name: xarray-einstats
  version: "0.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 69f48a60f62151d40c49fd6d9a6dc0b970aecef2813a33209e4dcde897fca48b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip >=21.3
    - python 3.12.*
    - flit
  run:
    - numpy >=2.0
    - python >=${{ python_min }}
    - scipy >=1.14
    - xarray >=2024.07.0

tests:
  - python:
      imports:
        - xarray_einstats
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Stats, linear algebra and einops for xarray.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/arviz-devs/xarray-einstats
  documentation: https://xarray-einstats.readthedocs.io/

extra:
  recipe-maintainers:
    - ericmjl
    - OriolAbril
