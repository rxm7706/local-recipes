# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"
  python_min: "3.12"

package:
  name: xarray-einstats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xarray-einstats/xarray_einstats-${{ version }}.tar.gz
  sha256: 69f48a60f62151d40c49fd6d9a6dc0b970aecef2813a33209e4dcde897fca48b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4,<4
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.14
    - xarray >=2024.07.0

tests:
  - python:
      imports:
        - xarray_einstats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/xarray-einstats/
  license: Apache-2.0
  license_file: LICENSE
  summary: Stats, linear algebra and einops for xarray
  description: |
    Stats, linear algebra and einops for xarray
  repository: https://github.com/arviz-devs/xarray-einstats
  documentation: https://einstats.python.arviz.org

extra:
  recipe-maintainers:
    - ericmjl
    - OriolAbril

