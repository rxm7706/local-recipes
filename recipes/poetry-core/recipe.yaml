# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: poetry-core
  version: "2.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/poetry_core-${{ version }}.tar.gz
  sha256: 89dceb6c10e9c6d8650a16183400e3c9ff9ddee13b0a81023b5575334a2b3744
  patches:
    - 0001-vcs.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }},<4.0.0

tests:
  - python:
      imports:
        - poetry.core
        - poetry.core._vendor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: Poetry PEP 517 Build Backend
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/poetry-core/
  repository: https://github.com/python-poetry/poetry-core
  documentation: https://github.com/python-poetry/poetry-core/blob/main/README.md

extra:
  recipe-maintainers:
    - ocefpaf
    - xylar

#### CFE metadata AND comments
