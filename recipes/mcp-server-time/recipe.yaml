# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.10"

package:
  name: mcp-server-time
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server-time/mcp_server_time-${{ version }}.tar.gz
  sha256: 47fcd220e529d9a2e08c68af3d64633197b6f920489d391293bfe9ef0f387830

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.23.0
    - pydantic >=2.0.0
    - python-tzdata >=2024.2
    - tzlocal >=5.3.1

tests:
  - python:
      imports:
        - mcp_server_time
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server-time/
  license: MIT
  license_file: LICENSE
  summary: A Model Context Protocol server providing tools for time queries and timezone conversions for LLMs
  description: |
    A Model Context Protocol server providing tools for time queries and timezone conversions for LLMs
  repository: https://github.com/modelcontextprotocol/servers/tree/main/src/time

extra:
  recipe-maintainers:
    - rxm7706

