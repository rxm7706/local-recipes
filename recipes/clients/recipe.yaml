# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6"
  python_min: "3.11"

package:
  name: clients
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clients/clients-${{ version }}.tar.gz
  sha256: cd0302f5d52fe516dbfc45bd4fecb8c72e8e232cd17b32d5154ccbec5645cd43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx2

tests:
  - python:
      imports:
        - clients
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/coady/clients
  license: Apache-2.0
  license_file: LICENSE
  summary: High-level HTTP clients for Python.
  description: |
    High-level HTTP clients for Python.
  documentation: https://coady.github.io/clients

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clients
  cfe-upstream-registry: pypi
  cfe-upstream-name: clients
