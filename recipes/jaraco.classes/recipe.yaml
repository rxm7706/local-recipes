# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: jaraco.classes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jaraco.classes/jaraco.classes-${{ version }}.tar.gz
  sha256: 47a024b51d0239c0dd8c8540c6c7f484be3b8fcf0b2d85c13825780d3b3f3acd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=56
  run:
    - python >=${{ python_min }}
    - more-itertools

tests:
  - python:
      imports:
        - jaraco.classes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jaraco/jaraco.classes
  license: MIT
  license_file: LICENSE
  summary: Utility functions for Python class constructs
  description: |
    Utility functions for Python class constructs

extra:
  recipe-maintainers:
    - carlodri

