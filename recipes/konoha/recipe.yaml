# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: konoha
  version: "5.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2408ae0b6951ba4f03181c85fc72d270a11e1d22e4b1fabb2dcd7e08c64acd23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - requests <3.0.0
  run_constraints:
    - janome >=0.5.0,<0.6.0
    - natto-py >=1.0.0,<2.0.0
    - kytea >=0.1.8,<0.2.0
    - sentencepiece >=0.1.85,<0.2.0
    - sudachipy >=0.6.8,<0.7.0
    - boto3 >=1.34.0,<2.0.0
    - fastapi <1.0.0
    - uvicorn <0.26.0
    - sudachidict-core 20230927.*
    - nagisa >=0.2.10,<0.3.0

tests:
  - python:
      imports:
        - konoha
        - konoha.api
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A tiny sentence/word tokenizer for Japanese text written in Python
  description: |
    Konoha is a Python library for providing easy-to-use integrated interface of
    various Japanese tokenziers, which enables you to switch a tokenizer and
    boost your pre-processing.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/konoha/
  repository: https://github.com/himkt/konoha
  documentation: https://konoha.readthedocs.io/en/latest/?badge=latest

extra:
  recipe-maintainers:
    - BastianZim
    - himkt
