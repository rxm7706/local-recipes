# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.7.0"

package:
  name: konoha
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/konoha/konoha-${{ version }}.tar.gz
  sha256: 2408ae0b6951ba4f03181c85fc72d270a11e1d22e4b1fabb2dcd7e08c64acd23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - requests <3.0.0

tests:
  - python:
      imports:
        - konoha
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/konoha/
  license: MIT
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - BastianZim
    - himkt

