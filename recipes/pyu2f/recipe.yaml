# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: pyu2f
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyu2f/pyu2f-${{ version }}.tar.gz
  sha256: a3caa3a11842fc7d5746376f37195e6af5f17c0a15737538bb1cebf656fb306b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyu2f
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/pyu2f/
  license: Apache-2.0
  license_file: LICENSE
  summary: U2F host library for interacting with a U2F device over USB.
  description: |
    U2F host library for interacting with a U2F device over USB.

extra:
  recipe-maintainers:
    - xhochy

