# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: llama-index-vector-stores-lancedb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-vector-stores-lancedb/llama_index_vector_stores_lancedb-${{ version }}.tar.gz
  sha256: 74663f8503028b8dc96d177943a9973eeeef3afc7ddfb641880f4c77785eb4b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pandas
    - lancedb >=0.21.1
    - llama-index-core <0.15,>=0.13.0
    - pylance
    - tantivy

tests:
  - python:
      imports:
        - llama_index.vector_stores.lancedb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-vector-stores-lancedb/
  license: MIT
  license_file: LICENSE
  summary: llama-index vector_stores lancedb integration
  description: |
    llama-index vector_stores lancedb integration

extra:
  recipe-maintainers:
    - rxm7706

