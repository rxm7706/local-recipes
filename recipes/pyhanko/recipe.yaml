# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.36.2"

package:
  name: pyhanko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyHanko/pyhanko-${{ version }}.tar.gz
  sha256: 1387ad12de8ed488f9d0303ae2a206e21d870b42629af0d0e1d6e882cc878fde

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.8.0
  run:
    - python >=${{ python_min }}
    - pyhanko-testing-commons
    - asn1crypto >=1.5.1
    - tzlocal >=4.3
    - pyhanko-certvalidator <0.32,>=0.31.4
    - requests >=2.31.0
    - cryptography >=48.0.0
    - lxml >=5.4.0

tests:
  - python:
      imports:
        - pyhanko_testing_commons
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MatthiasValvekens/pyHanko
  license: MIT
  license_file: LICENSE
  summary: Tools for stamping and signing PDF files
  description: |
    Tools for stamping and signing PDF files
  repository: https://github.com/MatthiasValvekens/pyHanko
  documentation: https://docs.pyhanko.eu/

extra:
  recipe-maintainers:
    - mrakitin
    - killua156

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyhanko
