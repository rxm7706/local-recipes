# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyhanko
  version: "0.36.2"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1387ad12de8ed488f9d0303ae2a206e21d870b42629af0d0e1d6e882cc878fde

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools >=80.8.0
  run:
    - python >=${{ python_min }}
    - asn1crypto >=1.5.1
    - tzlocal >=4.3
    - pyhanko-certvalidator >=0.31.1,<0.32
    - requests >=2.31.0
    - pyyaml >=6.0
    - cryptography >=48.0.0
    - lxml >=5.4.0

tests:
  - python:
      imports:
        - pyhanko
        - pyhanko.pdf_utils
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Tools for stamping and signing PDF files
  license: MIT
  license_file:
    - LICENSE
    - src/pyhanko/pdf_utils/LICENSE.PyPDF2
  homepage: https://github.com/MatthiasValvekens/pyHanko

extra:
  recipe-maintainers:
    - mrakitin
    - killua156
