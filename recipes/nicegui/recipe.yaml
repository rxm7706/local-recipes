# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nicegui
  version: "3.16.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/zauberzeug/nicegui/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e2008373696872a2745ef25f3841092a7faa4a1851f8c7e3ce093a2c925c0598

build:
  number: 0
  noarch: python
  script:
    # The archive has no .git, so poetry-dynamic-versioning otherwise resolves
    # against whatever repository encloses the build directory.
    - if: unix
      then: export POETRY_DYNAMIC_VERSIONING_BYPASS=${{ version }}
    - ${{ PYTHON }} -m pip install . -vv --no-build-isolation

requirements:
  build:
    - python >=3.9
    - pip
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - typing-extensions >=4.0.0
    - markdown2 >=2.4.7,!=2.4.11
    - pygments >=2.20.0,<3.0.0
    - starlette >=0.49.1
    - uvicorn >=0.22.0
    - fastapi >=0.109.1,!=0.123.5
    - python-socketio >=5.14.0
    - watchfiles >=0.18.1
    - jinja2 >=3.1.6,<4
    - python-multipart >=0.0.26
    - orjson >=3.11.5
    - itsdangerous >=2.1.2,<3
    - aiofiles >=23.1.0
    - httpx >=0.24.0
    - ifaddr >=0.2.0
    - aiohttp >=3.13.4
    - docutils >=0.19
    - h11 >=0.16.0
    - python-engineio >=4.12.0
    - certifi >=2024.07.04
    - pydantic-core >=2.35.0
    - lxml >=6.1.0
    - lxml-html-clean >=0.4.4
    - python-dotenv >=1.2.2
    - tinycss2 >=1.4.0,<2

tests:
  - python:
      imports:
        - nicegui
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Create web-based interfaces with Python. The nice way.
  homepage: https://github.com/zauberzeug/nicegui
  repository: https://github.com/zauberzeug/nicegui
  documentation: https://nicegui.io/

extra:
  recipe-maintainers:
    - rodja
    - falkoschindler
