# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: jsonref
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonref/jsonref-${{ version }}.tar.gz
  sha256: 32fe8e1d85af0fdefbebce950af85590b22b60f9e95443176adbde4e1ecea552

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-pep517 >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonref
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jsonref/
  license: MIT
  license_file: LICENSE
  summary: jsonref is a library for automatic dereferencing of JSON Reference objects for Python.
  description: |
    jsonref is a library for automatic dereferencing of JSON Reference objects for Python.
  documentation: https://jsonref.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - chapmanb
    - marcelotrevisani

#### CFE metadata AND comments
