# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: apiclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apiclient/apiclient-${{ version }}.tar.gz
  sha256: 2569c998191cd1a042beffa3cf7c1119277237b4ba1fa021d20c81fa98fa95e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - apiclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shazow/apiclient
  license: MIT
  license_file: LICENSE
  summary: Framework for making good API client libraries using urllib3.
  description: |
    Framework for making good API client libraries using urllib3.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
