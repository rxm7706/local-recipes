# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.25"

package:
  name: lightphe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightphe/lightphe-${{ version }}.tar.gz
  sha256: f1354a1b65bfda65ab6d83873d45ea197a7950020838cafbf14019c421c6d1f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sympy >=1.12
    - tqdm
    - lightecc >=0.0.6

tests:
  - python:
      imports:
        - lightphe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serengil/LightPHE
  license: MIT
  license_file: LICENSE
  summary: A Lightweight Partially Homomorphic Encryption Library for Python
  description: |
    A Lightweight Partially Homomorphic Encryption Library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lightphe
