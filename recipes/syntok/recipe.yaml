# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.4"

package:
  name: syntok
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/syntok/syntok-1.4.4-py3-none-any.whl
  sha256: 263546bea559cb693bc23dc436307a44e17a242bb9f2a8c5e39eb86906aaf831

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - regex

tests:
  - python:
      imports:
        - syntok
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/syntok/
  license: MIT
  license_file: LICENSE
  summary: Text tokenization and sentence segmentation (segtok v2).
  description: |
    Text tokenization and sentence segmentation (segtok v2).

extra:
  recipe-maintainers:
    - BastianZim

