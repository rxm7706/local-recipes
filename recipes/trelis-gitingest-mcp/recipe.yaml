# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"
  python_min: "3.12"

package:
  name: trelis-gitingest-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trelis-gitingest-mcp/trelis_gitingest_mcp-${{ version }}.tar.gz
  sha256: 64ea06d272f4f979f23943e8e2ab064d88b300fcd210252bf5e487129e079b37

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - gitingest
    - mcp >=1.9.3
    - pathspec

tests:
  - python:
      imports:
        - gitingest_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/trelis-gitingest-mcp/
  license: MIT
  license_file: LICENSE
  summary: An MCP server for gitingest
  description: |
    An MCP server for gitingest

extra:
  recipe-maintainers:
    - rxm7706

