# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.9.0"

package:
  name: plotly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plotly/plotly-${{ version }}.tar.gz
  sha256: 967ad33e8c704fed051800d11d985eb206a9c795c14206b30a6f463ed9c67d0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - narwhals >=1.15.1
    - packaging

tests:
  - python:
      imports:
        - plotly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://plotly.com/python/
  license: MIT
  license_file: LICENSE.txt
  summary: An open-source interactive data visualization library for Python
  description: |
    An open-source interactive data visualization library for Python
  repository: https://github.com/plotly/plotly.py
  documentation: https://plotly.com/python/

extra:
  recipe-maintainers:
    - maresb
    - chohner
    - moorepants
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: plotly
