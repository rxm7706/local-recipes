# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: russ
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/russ/russ-${{ version }}.tar.gz
  sha256: 291b3b61fab82a75fd3253854b8d9afa63b00c9fbe97f283c823a678451c0a83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - transformers
    - pygtrie

tests:
  - python:
      imports:
        - russ
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/IlyaGusev/russ
  license: Apache-2.0
  license_file: LICENSE
  summary: Russian words stress detection
  description: |
    Russian words stress detection

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: russ
