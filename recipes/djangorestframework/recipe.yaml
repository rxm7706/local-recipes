    - pkg:pypi/djangorestframework@${{ version }}
  cfe-upstream-repo: https://github.com/encode/django-rest-framework
  cfe-upstream-homepage: https://www.django-rest-framework.org
  cfe-import-names: [rest_framework]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/djangorestframework-feedstock
  cfe-forge-recipe-updates-needed: 
