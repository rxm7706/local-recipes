# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.18.0"

package:
  name: djangorestframework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework/djangorestframework-${{ version }}.tar.gz
  sha256: 2323a5111837e0b784dcb8323abc78ecc54fa2a5af7aff2677cf50cdd849477f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - django >=5.2

tests:
  - python:
      imports:
        - rest_framework
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.django-rest-framework.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Web APIs for Django, made easy.
  description: |
    Web APIs for Django, made easy.
  repository: https://github.com/encode/django-rest-framework

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: djangorestframework
  cfe-upstream-registry: pypi
  cfe-upstream-name: djangorestframework
