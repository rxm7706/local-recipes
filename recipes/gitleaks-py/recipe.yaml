# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: gitleaks-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gitleaks-py/gitleaks_py-${{ version }}.tar.gz
  sha256: 5aa3de9d64a73096ff57531be12271761d64db16774018f77e7ece0b418b716a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - tomli
    - requests
    - tomli-w
    - click
    - pyyaml

tests:
  - python:
      imports:
        - gitleaks_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gitleaks-py/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

