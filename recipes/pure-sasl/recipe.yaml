# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: pure-sasl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pure-sasl/pure-sasl-${{ version }}.tar.gz
  sha256: 53c1355f5da95e2b85b2cc9a6af435518edc20c81193faa0eea65fdc835138f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - puresasl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/thobbs/pure-sasl
  license: MIT
  license_file: LICENSE
  summary: Pure Python client SASL implementation
  description: |
    Pure Python client SASL implementation

extra:
  recipe-maintainers:
    - mariusvniekerk

