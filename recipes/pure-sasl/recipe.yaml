# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pure-sasl
  version: "0.6.2"
  sha256: 53c1355f5da95e2b85b2cc9a6af435518edc20c81193faa0eea65fdc835138f4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: python -m pip install --no-dependencies --ignore-installed .

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - puresasl
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A pure python SASL client
  homepage: https://github.com/thobbs/pure-sasl
  repository: https://github.com/thobbs/pure-sasl
  documentation: https://github.com/thobbs/pure-sasl

extra:
  recipe-maintainers:
    - mariusvniekerk
