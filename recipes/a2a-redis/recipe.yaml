# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: a2a-redis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a-redis/a2a_redis-${{ version }}.tar.gz
  sha256: a240773f277e9d319f7ca34926776be77facd1ed7f92ed767aaa041e2c4a447f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - redis-py >=4.0.0
    - a2a-sdk >=0.2.16
    - uvicorn >=0.35.0

tests:
  - python:
      imports:
        - a2a_redis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/redis-developer/a2a-redis
  license: MIT
  license_file: LICENSE
  summary: Redis components for the Agent-to-Agent (A2A) Python SDK
  description: |
    Redis components for the Agent-to-Agent (A2A) Python SDK
  repository: https://github.com/redis-developer/a2a-redis

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
