# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.14"

package:
  name: pip-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-search/pip_search-${{ version }}.tar.gz
  sha256: 2d20b923162d01a0d151e172eaa42bc7465d11d2db8eb87c756753bc1a854436

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bs4
    - requests
    - rich

tests:
  - python:
      imports:
        - pip_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/victorgarric/pip_search
  license: MIT
  license_file: LICENSE
  summary: A package to search like pip used to, via PyPi
  description: |
    A package to search like pip used to, via PyPi

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pip-search
  cfe-upstream-registry: pypi
  cfe-upstream-name: pip-search
