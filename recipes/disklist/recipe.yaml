# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: disklist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/disklist/disklist-${{ version }}.tar.gz
  sha256: 198596abeccd9845c7f48f2771f62b2d81d0d922aee7ee0ae64e6fa0bddeae93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - disklist
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Belval/disklist
  license: MIT
  license_file: LICENSE
  summary: A list implementation that use a tempfile as its backend.
  description: |
    A list implementation that use a tempfile as its backend.

extra:
  recipe-maintainers:
    - rxm7706

