# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: jsonify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonify/jsonify-${{ version }}.tar.gz
  sha256: f340032753577575e9777835809b283fdc9b251867d5d5600389131647f8bfe1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jsonify/
  license: MIT
  license_file: LICENSE
  summary: A csv to json converter
  description: |
    A csv to json converter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jsonify
  cfe-upstream-registry: pypi
  cfe-upstream-name: jsonify
