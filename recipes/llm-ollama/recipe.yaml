# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.2"

package:
  name: llm-ollama
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llm-ollama/llm_ollama-${{ version }}.tar.gz
  sha256: 3aaae4ca1632db965ea4e923c864688f0fffb5040683424e239b51612dbf33ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - llm >=0.28
    - ollama-python >=0.6.0
    - pydantic >=2

tests:
  - python:
      imports:
        - llm_ollama
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/taketwo/llm-ollama
  license: Apache-2.0
  license_file: LICENSE
  summary: LLM plugin providing access to models running on an Ollama server
  description: |
    LLM plugin providing access to models running on an Ollama server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
