    - pkg:pypi/pyg@${{ version }}
  cfe-upstream-repo: http://pyg.readthedocs.org/
  cfe-upstream-homepage: http://pyg.readthedocs.org/
  cfe-import-names: [pyg]
  cfe-source-kind: pypi-sdist
