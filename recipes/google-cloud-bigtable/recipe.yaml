# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.41.0"

package:
  name: google-cloud-bigtable
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-bigtable/google_cloud_bigtable-${{ version }}.tar.gz
  sha256: d0c424bae6238eb16ffc0922be79da00d20d23e0750ea46742ffd4542c50fd26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.24.2
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5
    - google-cloud-core <3.0.0,>=2.0.0
    - grpc-google-iam-v1 <1.0.0,>=0.14.2
    - google-crc32c <2.0.0dev,>=1.6.0

tests:
  - python:
      imports:
        - google.cloud.bigtable
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigtable
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Bigtable API client library
  description: |
    Google Cloud Bigtable API client library

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar

