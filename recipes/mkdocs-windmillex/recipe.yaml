# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: mkdocs-windmillex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mkdocs-windmillex/mkdocs-windmillex-${{ version }}.tar.gz
  sha256: 1bda0a353ed1162c9f103f1f0c27c5e35795f056c25b1984b7e3dae3c82487c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mkdocs_windmillex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/guenbakku/mkdocs-windmillex
  license: MIT
  license_file: LICENSE
  summary: MkDocs theme focused on navigation and usability
  description: |
    MkDocs theme focused on navigation and usability

extra:
  recipe-maintainers:
    - rxm7706

