# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.22"

package:
  name: solace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solace/solace-${{ version }}.tar.gz
  sha256: d857dd25548a2030a9dd5f0661de18eb175377541b068578a81cabf8c4d8335a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - starlette
    - typer
    - loguru
    - jinja2
    - uvicorn
    - watchgod
    - cerberus
    - python-multipart
    - boltons
    - python-magic
    - libmagic
    - pyaml
    - python-box
    - databases

tests:
  - python:
      imports:
        - solace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/solace/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Modern Framework for Building Python Web Apps
  description: |
    A Modern Framework for Building Python Web Apps

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: solace
  cfe-upstream-registry: pypi
  cfe-upstream-name: solace
  cfe-purls:
    - pkg:conda/solace@${{ version }}?channel=conda-forge
    - pkg:pypi/solace@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/solace/
  cfe-upstream-homepage: https://pypi.org/project/solace/
  cfe-import-names: [solace]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
