# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.1"

package:
  name: pytzdata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytzdata/pytzdata-${{ version }}.tar.gz
  sha256: 3efa13b335a00a8de1d345ae41ec78dd11c9f8807f522d39850f2dd828681540

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytzdata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sdispater/pytzdata
  license: MIT
  license_file: LICENSE
  summary: The Olson timezone database for Python.
  description: |
    The Olson timezone database for Python.
  repository: https://github.com/sdispater/pytzdata

extra:
  recipe-maintainers:
    - mcs07
    - ocefpaf

#### CFE metadata AND comments
