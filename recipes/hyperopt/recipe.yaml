    - pkg:pypi/hyperopt@${{ version }}
  cfe-upstream-repo: https://github.com/hyperopt/hyperopt
  cfe-upstream-homepage: https://hyperopt.github.io/hyperopt
  cfe-import-names: [hyperopt]
  cfe-source-kind: pypi-sdist
