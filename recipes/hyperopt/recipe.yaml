# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: hyperopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hyperopt/hyperopt-${{ version }}.tar.gz
  sha256: d79a77522fefec13a258b97a0ccbdf40832b3270de4db08278bb07b9b934eb9a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - cloudpickle
    - importlib_resources >=1.3
    - networkx >=2.2
    - numpy >=1.17
    - scipy >=1.5.0
    - tqdm

tests:
  - python:
      imports:
        - hyperopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://hyperopt.github.io/hyperopt
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Distributed Asynchronous Hyperparameter Optimization
  description: |
    Distributed Asynchronous Hyperparameter Optimization
  repository: https://github.com/hyperopt/hyperopt

extra:
  recipe-maintainers:
    - PhilipMay
    - BastianZim

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: hyperopt
