# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.6"

package:
  name: fxrays
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/FXrays/FXrays-${{ version }}.tar.gz
  sha256: 7a93545a77b53ff4098d2c9768cc5422b54ac8c31797db96160ba48894db1c68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
    - cython
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/FXrays
  license: GPLv2+
  license_file: LICENSE
  summary: Computes extremal rays with filtering
  description: |
    Computes extremal rays with filtering

extra:
  recipe-maintainers:
    - rxm7706

