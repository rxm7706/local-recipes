# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.3"

package:
  name: lightparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightparse/lightparse-${{ version }}.tar.gz
  sha256: 170f3766225ece9da0d28c7bb2fbb2a47862a35f31f6c033ae436e1cfedb0207

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lightparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://keeflorin.fi/lightparse/
  license: MIT
  license_file: LICENSE
  summary: Light to use argument parser for cli tools
  description: |
    Light to use argument parser for cli tools

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lightparse
