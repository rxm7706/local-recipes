# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: phonemizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/phonemizer/phonemizer-${{ version }}.tar.gz
  sha256: e13231980c50bc671ec0466379ba027260ad9d61929952d8ae9665b3d0f251eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - attrs >=18.1
    - dlinfo
    - joblib
    - typing_extensions
    # The espeak backend needs the engine itself. Upstream cannot declare it
    # (it is not a Python distribution), which is exactly why a stock pip
    # install phonemizes only if a system espeak-ng happens to be present.
    - espeak-ng

tests:
  - python:
      imports:
        - phonemizer
        - phonemizer.backend
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # Prove the espeak backend actually reaches the engine, not just that
      # the package imports: a working phonemizer that cannot find
      # libespeak-ng is the failure mode this recipe's espeak-ng dep exists
      # to prevent.
      - python -c "from phonemizer.backend import EspeakBackend; print('espeak available:', EspeakBackend.is_available())"
      - python -c "from phonemizer.backend import EspeakBackend; assert EspeakBackend.is_available()"
      - python -c "from phonemizer.backend import EspeakBackend; out=EspeakBackend('en-us').phonemize(['hello world']); print('phonemized:', out); assert out and out[0].strip()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/bootphon/phonemizer
  repository: https://github.com/bootphon/phonemizer
  documentation: https://bootphon.github.io/phonemizer/
  summary: Simple text to phones converter for multiple languages
  description: |
    phonemizer transcribes text into phones, supporting the espeak-ng,
    espeak-ng-mbrola, festival and segments backends, with several output
    formats including IPA. It is the grapheme-to-phoneme front end used by a
    number of neural TTS systems.

    This build declares `espeak-ng` as a runtime dependency so the espeak
    backend works out of the box; upstream cannot express that, since
    espeak-ng is not a Python distribution.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: phonemizer
  cfe-upstream-registry: pypi
  cfe-upstream-name: phonemizer
  cfe-purls:
    - pkg:conda/phonemizer@${{ version }}?channel=conda-forge
    - pkg:pypi/phonemizer@${{ version }}
  cfe-upstream-repo: https://github.com/bootphon/phonemizer
  cfe-upstream-homepage: https://github.com/bootphon/phonemizer
  cfe-import-names: [phonemizer]
