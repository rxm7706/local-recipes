# CFE comments
# Header:
#    # `phonemizer` itself is ABSENT from conda-forge. What is there is
#    # `phonemizer-fork` 3.3.2, and it is NOT a drop-in substitute on three
#    # counts, each checked 2026-09-07 against live repodata:
#    #   1. different distribution NAME -- kokoro-onnx requires the
#    #      `phonemizer` distribution, and pip check resolves names, so the
#    #      fork cannot satisfy it however compatible the import is (G10).
#    #   2. too old -- 3.3.2 < the `phonemizer>=3.4.0` kokoro-onnx pins.
#    #   3. actively exclusive -- it declares `constrains: phonemizer <0.0a0`,
#    #      so the fork and a real phonemizer can never co-install.
#    # phonemizer-fork does not appear in this repo's pixi.lock, so adding a
#    # real phonemizer creates no conflict here.
# requirements:
#    # espeak-ng in run: is the load-bearing addition over a naive port of
#    # upstream's metadata. phonemizer's espeak backend dlopens libespeak-ng
#    # and reads espeak-ng-data; upstream declares neither because neither is
#    # a Python package, which is why `pip install phonemizer` silently
#    # yields a phonemizer that cannot phonemize on a machine without a
#    # system espeak-ng.
#    # `dlinfo` is how the backend locates that library at runtime -- it is a
#    # real runtime dep, not a build-time helper, and dropping it produces a
#    # backend that reports itself unavailable.
# tests:
#    # EspeakBackend.is_available() is asserted, then an actual phonemize()
#    # call is made. Import-only testing would pass on an installation whose
#    # espeak backend is dead, which is precisely the state this recipe adds
#    # espeak-ng to avoid.
# about:
#    # GPL-3.0-or-later per the PyPI classifier and the shipped LICENSE.
#    # OSI-approved, so no distribution bar -- but note it is copyleft, and
#    # kokoro-onnx (MIT) merely depends on it rather than linking it into a
#    # combined work.
####
