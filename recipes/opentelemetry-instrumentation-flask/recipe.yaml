# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-flask
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_flask-${{ version }}.tar.gz
  sha256: 887de3a97c09953da09ae713fbb777172900f33b2924d85dad314a033156ef66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-instrumentation-wsgi ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - opentelemetry-util-http ==0.65b0
    - packaging >=21.0
    - flask >=1.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
        - opentelemetry.instrumentation.flask
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Flask instrumentation for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-flask

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
