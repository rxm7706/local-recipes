# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-instrumentation-flask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-flask/opentelemetry_instrumentation_flask-${{ version }}.tar.gz
  sha256: 887de3a97c09953da09ae713fbb777172900f33b2924d85dad314a033156ef66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - flask
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-wsgi ==0.65b0
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - opentelemetry-util-http ==0.65b0
    - packaging >=21.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.flask
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-flask
  license: Apache-2.0
  license_file: LICENSE
  summary: Flask instrumentation for OpenTelemetry
  description: |
    Flask instrumentation for OpenTelemetry
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api

