# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.1"

package:
  name: ldap3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/ldap3/ldap3-${{ version }}.tar.gz
  sha256: f3e7fc4718e3f09dda568b57100095e0ce58633bcabbed8667ce3f8fbaa4229f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyasn1

tests:
  - python:
      imports:
        - ldap3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cannatag/ldap3
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  summary: A strictly RFC 4510 conforming LDAP V3 pure Python client library
  description: |
    A strictly RFC 4510 conforming LDAP V3 pure Python client library

extra:
  recipe-maintainers:
    - mcs07
    - adament

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ldap3
  cfe-upstream-registry: pypi
  cfe-upstream-name: ldap3
  cfe-purls:
    - pkg:conda/ldap3@${{ version }}?channel=conda-forge
    - pkg:pypi/ldap3@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/cannatag/ldap3
  cfe-import-names: [ldap3]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ldap3-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.9.1

  cfe-forge-blocker-list:
