# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.4"

package:
  name: faust
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/faust/faust-${{ version }}.tar.gz
  sha256: ffcd350ea29d528f6814fc9a42b5e50e130310da054a93e9d8216ef89a254611

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - aiohttp-cors
    - robinhood-aiokafka
    - click
    - colorclass
    - mode
    - opentracing
    - terminaltables
    - venusian
    - yarl
    - croniter
    - mypy_extensions

tests:
  - python:
      imports:
        - t
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://faust.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Stream processing.
  description: |
    Python Stream processing.
  repository: https://github.com/robinhood/faust
  documentation: https://faust.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: faust
  cfe-upstream-registry: pypi
  cfe-upstream-name: faust
  cfe-purls:
    - pkg:conda/faust@${{ version }}?channel=conda-forge
    - pkg:pypi/faust@${{ version }}
  cfe-upstream-repo: https://github.com/robinhood/faust
  cfe-upstream-homepage: http://faust.readthedocs.io/
  cfe-import-names: [t]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
