# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.18"

package:
  name: dagster-webserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dagster-webserver/dagster_webserver-${{ version }}.tar.gz
  sha256: 8054048b8ce5c1bc1a15935cc85d8f5d3a7fc91165c6813af0702032ed934790

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.19.0
  run:
    - python >=${{ python_min }}
    - click <9.0,>=7.0
    - dagster-graphql ==1.13.18
    - dagster ==1.13.18
    - starlette !=0.36.0
    - uvicorn

tests:
  - python:
      imports:
        - dagster_webserver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dagster-io/dagster
  license: Apache-2.0
  license_file: LICENSE
  summary: Web UI for dagster.
  description: |
    Web UI for dagster.

extra:
  recipe-maintainers:
    - xhochy
    - bollwyvl
    - mgasner

