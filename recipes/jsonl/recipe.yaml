# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6"

package:
  name: jsonl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonl/jsonl-${{ version }}.tar.gz
  sha256: c06c069cadfd437ed537afd957409bf03839309d9b15211424348e531219e081

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - simplejson

tests:
  - python:
      imports:
        - jsonl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/sys-git/jsonl
  license: GPL-3.0-only
  license_file: LICENSE
  summary: JSON decoding to mutable or immutable objects allowing attribute access
  description: |
    JSON decoding to mutable or immutable objects allowing attribute access

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
