# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: super_collections
  version: "0.6.2"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0c8d8abacd9fad2c7c1c715f036c29f5db213f8cac65f24d45ecba12b4da187a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - hjson-py

outputs:
  - package:
      name: super_collections
  - package:
      name: super-collections
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - ${{ pin_subpackage("super_collections", upper_bound="x.x.x") }}
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - super_collections
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}

tests:
  - python:
      imports:
        - super_collections
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Dictionaries as you dreamed them when you were a kid.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/fralau/super-collections

extra:
  recipe-maintainers:
    - hoechenberger
