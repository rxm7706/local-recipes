# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: rpmfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rpmfile/rpmfile-${{ version }}.tar.gz
  sha256: 8ffc44d15f8d2b6cad1ea885b09e1ca5f1744532c24710554f3fe4873506e9da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27
    - hatch-vcs >=0.4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rpmfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/srossross/rpmfile
  license: MIT
  license_file: LICENSE
  summary: Read rpm archive files
  description: |
    Read rpm archive files
  repository: https://github.com/srossross/rpmfile

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rpmfile
  cfe-upstream-registry: pypi
  cfe-upstream-name: rpmfile
  cfe-purls:
    - pkg:conda/rpmfile@${{ version }}?channel=conda-forge
    - pkg:pypi/rpmfile@${{ version }}
  cfe-upstream-repo: https://github.com/srossross/rpmfile
  cfe-upstream-homepage: https://github.com/srossross/rpmfile
  cfe-import-names: [rpmfile]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T18:36:17Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T18:36:17Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
