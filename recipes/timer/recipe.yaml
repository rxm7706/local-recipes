# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: timer
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/timer-${{ version }}.tar.gz
  sha256: 9b11b71a48648f878dc4c29aa84387806d193ed9f71a39e84edb10f38ed6941f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timer
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python Code Timer
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/LucienShui/timer

extra:
  recipe-maintainers:
    - rxm7706
