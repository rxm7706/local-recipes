# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.6"

package:
  name: httpie-edgegrid
  version: ${{ version }}

source:
  url: https://github.com/akamai/httpie-edgegrid/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 822ab83c9b77ef3a84500f37df74c8475282236abfcb698374facca904c0df9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpie >=3.0.0
    - edgegrid-python >=2.0.6

tests:
  - python:
      imports:
        - httpie_edgegrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/akamai/httpie-edgegrid
  license: Apache-2.0
  license_file: LICENSE
  summary: Edgegrid plugin for HTTPie.
  description: |
    Edgegrid plugin for HTTPie.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
