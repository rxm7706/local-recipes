# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: altair-split
  version: "6.2.2"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altair/altair-${{ version }}.tar.gz
  sha256: a1ff9d9cfe81c75414641826312b9471780e19d39293ba0b012933f6b6cba0fe

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: altair
    build:
      noarch: python
      script:
        file: build_base.sh
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - hatchling
        - versioningit
      run:
        - packaging
        - python >=${{ python_min }}
        - importlib-metadata
        - typing-extensions >=4.12.0
        - jinja2
        - jsonschema >=3.0
        - narwhals >=2.4.0
    tests:
      - python:
          imports:
            - altair
            - altair.expr
            - altair.utils
            - altair.vegalite
          pip_check: true
          python_version: ${{ python_min }}
      - files:
          source:
            - altair
        requirements:
          run:
            - pytest
            - sphinx
            - docutils
            - anywidget >=0.9.0
            - recommonmark
            - ipython
            - pip
            - python ${{ python_min }}
            - polars >=0.20.3
            - pandas >=1.1.3
        script:
          - python -m pytest --pyargs --doctest-modules altair
  - package:
      name: altair-all
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - vl-convert-python >=1.9.0
        - pandas >=1.1.3
        - pyarrow >=11
        - vegafusion >=2.0.3
        - anywidget >=0.9.0
        - ${{ pin_subpackage('altair', exact=True) }}
        - altair_tiles >=0.3.0
      test:
        requires:
          - python ${{ python_min }}
        imports:
          - altair
          - vegafusion
          - vl_convert
          - altair_tiles

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Altair: A declarative statistical visualization library for Python"
  homepage: http://altair-viz.github.io

extra:
  recipe-maintainers:
    - ellisonbg
    - jakevdp
    - joelostblom
    - jonmmease
    - binste
    - mattijn
