# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.2"

package:
  name: altair
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altair/altair-${{ version }}.tar.gz
  sha256: a1ff9d9cfe81c75414641826312b9471780e19d39293ba0b012933f6b6cba0fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - jinja2
    - jsonschema >=3.0
    - narwhals >=2.4.0
    - packaging
    - typing_extensions >=4.12.0

tests:
  - python:
      imports:
        - altair
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/altair/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Vega-Altair: A declarative statistical visualization library for Python."
  description: |
    Vega-Altair: A declarative statistical visualization library for Python.
  repository: https://github.com/vega/altair
  documentation: https://altair-viz.github.io

extra:
  recipe-maintainers:
    - ellisonbg
    - jakevdp
    - joelostblom
    - jonmmease
    - binste
    - mattijn

