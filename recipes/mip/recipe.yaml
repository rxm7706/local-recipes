# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.6"

package:
  name: mip
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mip/mip-${{ version }}.tar.gz
  sha256: 9da8074b80bd3ef788513d5a214ef832916d82aa66487da11a49c7da9f89d270

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - cffi >=1.15
    - cbcbox >=2.929

tests:
  - python:
      imports:
        - mip
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.python-mip.com
  license: EPL-2.0
  license_file: LICENSE
  summary: Python tools for Modeling and Solving Mixed-Integer Linear Programs (MIPs)
  description: |
    Python tools for Modeling and Solving Mixed-Integer Linear Programs (MIPs)
  repository: https://github.com/coin-or/python-mip

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mip
  cfe-upstream-registry: pypi
  cfe-upstream-name: mip
