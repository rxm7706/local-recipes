# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

package:
  name: bqplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bqplot/bqplot-${{ version }}.tar.gz
  sha256: dd1f55c9bf971b1c3edf571a23edecd707aab5a72c3f5dac3cb98ee233fc6216

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - jupyter-packaging ~=0.12.2
    - jupyterlab ==4.*
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - ipywidgets <9,>=7.5.0
    - traitlets >=4.3.0
    - traittypes >=0.0.6
    - numpy >=1.10.4
    - pandas >=1.0.0
    - bqscales <0.4,>=0.3.3

tests:
  - python:
      imports:
        - bqplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bqplot/bqplot
  license: Apache-2.0
  license_file: LICENSE
  summary: Interactive plotting for the Jupyter notebook, using d3.js and ipywidgets.
  description: |
    Interactive plotting for the Jupyter notebook, using d3.js and ipywidgets.

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jasongrout
    - rmenegaux
    - ChakriCherukuri
    - ibdafna
    - martinRenou
    - kaiayoung

