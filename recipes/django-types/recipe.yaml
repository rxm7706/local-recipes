# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.0"

package:
  name: django-types
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-types/django_types-${{ version }}.tar.gz
  sha256: af903de8b9ee963b7594459a7a20cb8eaaab176ae2b3244ecaa089e0c570b0d1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - types-psycopg2 >=2.9.21.13

tests:
  - python:
      imports:
        - django_types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/django-types/
  license: MIT
  license_file: LICENSE
  summary: Type stubs for Django
  description: |
    Type stubs for Django
  repository: https://github.com/sbdchd/django-types

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
