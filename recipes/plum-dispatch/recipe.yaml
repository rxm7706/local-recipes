# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.0"

package:
  name: plum-dispatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plum-dispatch/plum_dispatch-${{ version }}.tar.gz
  sha256: fb45c5b2dd4dadd57def51bcf321dfa3a258df5c725f43adea7e7f6db3b79b52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.8.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - beartype >=0.16.2
    - rich >=10.0
    - typing_extensions >=4.9.0

tests:
  - python:
      imports:
        - plum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/plum-dispatch/
  license: MIT
  license_file: LICENSE
  summary: Multiple dispatch in Python
  description: |
    Multiple dispatch in Python
  documentation: https://beartype.github.io/plum

extra:
  recipe-maintainers:
    - PhilipVinc
    - wesselb

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: plum-dispatch
