# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: sqlite-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlite-web/sqlite_web-${{ version }}.tar.gz
  sha256: 4809834c703bfaa9b50bdfe97e26044acdd384a0f1492cea1cf0be616cc9b823

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - flask
    - peewee >=4.0.0
    - pygments

tests:
  - python:
      imports:
        - sqlite_web
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlite-web/
  license: MIT
  license_file: LICENSE
  summary: web-based sqlite database browser
  description: |
    web-based sqlite database browser
  repository: https://github.com/coleifer/sqlite-web

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
