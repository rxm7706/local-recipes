# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: djangorestframework-filters
  version: 1.0.0.dev2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ef84527e3427434d54228825b53a35098c8633c1e77b71d06b79597b749ea3f2

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - django-filter >=2.0
    - djangorestframework
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rest_framework_filters
        - rest_framework_filters.templatetags
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Better filtering for Django REST Framework
  homepage: http://github.com/philipn/django-rest-framework-filters
  repository: http://github.com/philipn/django-rest-framework-filters

extra:
  recipe-maintainers:
    - mxr-conda
    - rxm7706
