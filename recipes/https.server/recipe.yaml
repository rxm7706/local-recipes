# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: https.server
  version: ${{ version }}

source:
  url: https://github.com/pathtofile/https.server/archive/refs/tags/${{ version }}.tar.gz
  sha256: fa3c5b68e7970ef8a7ca36429dfdeda87319d771cb0103bfb9754dcff56e7321

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyopenssl

tests:
  - python:
      imports:
        - https
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pathtofile/https.server
  license: MIT
  license_file: LICENSE
  summary: https.server - SimpleHTTPServer wrapped in TLS
  description: |
    https.server - SimpleHTTPServer wrapped in TLS

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: https.server
  cfe-upstream-registry: pypi
  cfe-upstream-name: https.server
  cfe-purls:
    - pkg:conda/https.server@${{ version }}?channel=conda-forge
    - pkg:pypi/https.server@${{ version }}
  cfe-upstream-repo: https://github.com/pathtofile/https.server
  cfe-upstream-homepage: https://github.com/pathtofile/https.server
  cfe-import-names: [https]
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:45:34Z
