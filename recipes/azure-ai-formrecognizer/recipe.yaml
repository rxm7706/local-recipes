# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.3"

package:
  name: azure-ai-formrecognizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-ai-formrecognizer/azure-ai-formrecognizer-${{ version }}.tar.gz
  sha256: 9fc09788bbb65866630fa870cca1933bfd7298b8055236530bcc0e40d81fcccf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.23.0
    - msrest >=0.6.21
    - azure-common >=1.1
    - typing_extensions >=4.0.1

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Form Recognizer Client Library for Python
  description: |
    Microsoft Azure Form Recognizer Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

