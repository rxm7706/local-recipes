# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: spacy-loggers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacy-loggers/spacy-loggers-${{ version }}.tar.gz
  sha256: d60b0bdbf915a60e516cc2e653baeff946f0cfc461b452d11a4d5458c6fe5f24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spacy_loggers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/explosion/spacy-loggers
  license: MIT
  license_file: LICENSE
  summary: Logging utilities for SpaCy
  description: |
    Logging utilities for SpaCy

extra:
  recipe-maintainers:
    - conda-forge/spacy

