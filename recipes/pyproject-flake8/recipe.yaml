# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyproject-flake8
  version: "7.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5b953592336bc04d86e8942fdca1014256044a3445c8b6ca9467d08636749158

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pflake8=pflake8.__main__:main

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python >=3.8.1
  run:
    - python >=3.8.1
    - tomli
    - flake8 ==${{ version }}

tests:
  - python:
      imports:
        - pflake8
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - pflake8 --help

about:
  summary: Monkey patching wrapper to connect flake8 with pyproject.toml configuration
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/csachs/pyproject-flake8

extra:
  recipe-maintainers:
    - thewchan
