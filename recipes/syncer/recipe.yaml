# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: syncer
  version: "2.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/syncer-${{ version }}.tar.gz
  sha256: 4340eb54b54368724a78c5c0763824470201804fe9180129daf3635cb500550f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - syncer
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Async to sync converter
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/miyakogi/syncer

extra:
  recipe-maintainers:
    - timkpaine
