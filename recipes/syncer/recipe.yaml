# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.3"

package:
  name: syncer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/syncer/syncer-${{ version }}.tar.gz
  sha256: 4340eb54b54368724a78c5c0763824470201804fe9180129daf3635cb500550f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - syncer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miyakogi/syncer
  license: MIT
  license_file: LICENSE
  summary: Async to sync converter
  description: |
    Async to sync converter

extra:
  recipe-maintainers:
    - timkpaine

