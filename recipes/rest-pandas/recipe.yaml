# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rest-pandas
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rest-pandas-${{ version }}.tar.gz
  sha256: 13796398565a08c668e0fd31861939df6d0f9cc859b1493308f7cc5c11ea247c

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - djangorestframework >=3.3.1
    - pandas >=0.19.0

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - python -c "import django; from django.conf import settings; settings.configure(); django.setup(); import rest_pandas"
      - pip check

about:
  summary: Serves up pandas dataframes via the Django REST Framework for client-side(i.e. d3.js) visualizations
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/wq/django-rest-pandas

extra:
  recipe-maintainers:
    - rxm7706

