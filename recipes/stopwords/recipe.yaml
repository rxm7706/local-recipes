# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: stopwords
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stopwords/stopwords-${{ version }}.tar.gz
  sha256: 91cc3ecaab197dbd36164ab7cbaa02530154e5d75d0e562d4e1c1fd458b5b8cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stopwords
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astuanax/stopwords
  license: ISC
  license_file: LICENSE
  summary: Stopwords filter for 42 languages
  description: |
    Stopwords filter for 42 languages

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: stopwords
  cfe-upstream-registry: pypi
  cfe-upstream-name: stopwords
  cfe-purls:
