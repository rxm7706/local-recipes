# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: fuzz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/f/fuzz/fuzz-0.1.1-py3-none-any.whl
  sha256: b8a301841cb62bb2498de13fd3b9e8a62608a7fd1d0c0b904c3e6c6945509d3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fuzz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://fuzz.samireland.com
  license: MIT
  license_file: LICENSE
  summary: Contains tools for modelling values with associated uncertainty.
  description: |
    Contains tools for modelling values with associated uncertainty.

extra:
  recipe-maintainers:
    - rxm7706

