# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: pytorch_revgrad
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytorch_revgrad/pytorch_revgrad-${{ version }}.tar.gz
  sha256: 9cf097a7d18cbadddeaec9fef74b258d70b6cb8d0c77f524baab18bffc7d7be9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch >=1.0.0

tests:
  - python:
      imports:
        - pytorch_revgrad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/janfreyberg/pytorch-revgrad
  license: MIT
  license_file: LICENSE
  summary: A pytorch module (and function) to reverse gradients.
  description: |
    A pytorch module (and function) to reverse gradients.

extra:
  recipe-maintainers:
    - BastianZim

