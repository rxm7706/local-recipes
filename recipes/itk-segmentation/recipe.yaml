# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.4.7"

package:
  name: itk-segmentation
  version: ${{ version }}

source:
  url: https://github.com/InsightSoftwareConsortium/ITK/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c953ad7957c481dbb17cfebf03fc61e5252b2be7ccf6757d1234b48ac99914f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - itk-filtering ==5.4.7

tests:
  - python:
      imports:
        - Wrapping
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.itk.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: ITK is an open-source toolkit for multidimensional image analysis
  description: |
    ITK is an open-source toolkit for multidimensional image analysis
  repository: https://github.com/InsightSoftwareConsortium/ITK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
