# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: lbson-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lbson-py/lbson_py-${{ version }}.tar.gz
  sha256: 43ab3c5e4f0370a54374362b3addc8f26768f8629a5d009a1e2f6ece5884e502

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lbson
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Soju06/lbson
  license: MIT
  license_file: LICENSE
  summary: High-performance BSON library for Python without MongoDB dependencies
  description: |
    High-performance BSON library for Python without MongoDB dependencies
  repository: https://github.com/Soju06/lbson.git
  documentation: https://github.com/Soju06/lbson#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
