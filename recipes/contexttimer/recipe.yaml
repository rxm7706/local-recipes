# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.3"

package:
  name: contexttimer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/contexttimer/contexttimer-${{ version }}.tar.gz
  sha256: 35a1efd389af3f1ca509f33ff23e17d98b66c8fde5ba2a4eb8a8b7fa456598a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - contexttimer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/brouberol/contexttimer
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A timer context manager measuring the clock wall time of the code block it contains.
  description: |
    A timer context manager measuring the clock wall time of the code block it contains.

extra:
  recipe-maintainers:
    - rxm7706

