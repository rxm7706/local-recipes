# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.7"

package:
  name: virtualenv-clone
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/virtualenv-clone/virtualenv-clone-${{ version }}.tar.gz
  sha256: 418ee935c36152f8f153c79824bb93eaf6f0f7984bae31d3f48f350b9183501a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - virtualenv-clone

tests:
  - python:
      imports:
        - virtualenv_clone
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/edwardgeorge/virtualenv-clone
  license: MIT
  license_file: LICENSE
  summary: script to clone virtualenvs.
  description: |
    script to clone virtualenvs.

extra:
  recipe-maintainers:
    - holgern

