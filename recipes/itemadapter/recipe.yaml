# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: itemadapter
  version: "0.13.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fa139c7be2aa80f8874b2f23d165d5d4aa47c4b85c54ab530b567fd5f684f1b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - itemadapter
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - itemadapter
        - tests
    requirements:
      run:
        - python ${{ python_min }}
        - pip
        - attrs
        - pydantic <2
        - pytest >=5.4
        - scrapy >=2.0
    script:
      - pytest tests

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Common interface for different data containers
  description: |
    The ItemAdapter class is a wrapper for data container objects, providing a
    common interface to handle objects of different types in an uniform manner,
    regardless of their underlying implementation.


  homepage: https://github.com/scrapy/itemadapter

extra:
  recipe-maintainers:
    - Gallaecio
    - wRAR
    - dangra
    - rmax
