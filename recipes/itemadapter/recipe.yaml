# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

package:
  name: itemadapter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/itemadapter/itemadapter-${{ version }}.tar.gz
  sha256: fa139c7be2aa80f8874b2f23d165d5d4aa47c4b85c54ab530b567fd5f684f1b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - itemadapter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/itemadapter
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Common interface for data container classes
  description: |
    Common interface for data container classes
  repository: https://github.com/scrapy/itemadapter

extra:
  recipe-maintainers:
    - Gallaecio
    - wRAR
    - dangra
    - rmax

