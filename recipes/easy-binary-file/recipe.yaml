# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: easy-binary-file
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/easy-binary-file/easy-binary-file-${{ version }}.tar.gz
  sha256: b3e3047c18cea101cf585644a55c223f1bad68ec01f8ce59dc03250f45944b70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - easy_binary_file
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Invarato/easy_binary_file_project
  license: MIT
  license_file: LICENSE
  summary: Easy way to use binary files with built in class and functions
  description: |
    Easy way to use binary files with built in class and functions

extra:
  recipe-maintainers:
    - rxm7706

