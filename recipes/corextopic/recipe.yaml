# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: corextopic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/corextopic/corextopic-${{ version }}.tar.gz
  sha256: f17dddaeadeda0ef6cea6648db4cc9230aa0666947736908d344c2d5ab55552b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - corextopic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gregversteeg/corex_topic
  license: Apache-2.0
  license_file: LICENSE
  summary: Hierarchical and semi-supervised topic modeling with minimal domain knowledge through Anchored Correlation Explanation
  description: |
    Hierarchical and semi-supervised topic modeling with minimal domain knowledge through Anchored Correlation Explanation

extra:
  recipe-maintainers:
    - rxm7706

