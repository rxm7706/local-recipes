# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: websockify
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/novnc/websockify/archive/v${{ version }}.tar.gz
  sha256: b6413e364efd04f3c92ec8c17747e3c4adc20157c2ef1c5d019a26d944a46df8

build:
  # Independent of Python version, but rebind.so depends on OS
  # Use build.sh for Linux
  number: 2
  script: ${{ PYTHON }} -m pip install . - if win else '' }}
  python:
    entry_points:
      - websockify = websockify.websocketproxy:websockify_init
  dynamic_linking:
    missing_dso_allowlist:
      - /lib64/libc.so.6
      - /lib64/libdl.so.2

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: linux
      then: ${{ compiler('c') }}
    - if: linux
      then: ${{ stdlib("c") }}
    - if: linux
      then: make
  host:
    - pip
    - python
    - setuptools
  run:
    - numpy
    - python
    - requests
    - jwcrypto
    - redis-py

tests:
  - python:
      imports:
        - websockify
      pip_check: false
  - script:
      - websockify --help
      - if: linux
        then: websockify 12345 -- ls

about:
  license: LGPL-3.0-only
  license_file: COPYING
  summary: Websockify is a WebSocket to TCP proxy/bridge.
  description: |
    Websockify is a WebSocket to TCP proxy/bridge.
    This allows a browser to connect to any application/server/service.
  homepage: https://github.com/novnc/websockify
  repository: https://github.com/novnc/websockify
  documentation: https://github.com/novnc/websockify

extra:
  recipe-maintainers:
    - manics
