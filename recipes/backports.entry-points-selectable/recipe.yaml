# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: backports.entry-points-selectable
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backports.entry-points-selectable/backports.entry_points_selectable-${{ version }}.tar.gz
  sha256: 17a8b44ae700fba548686dd274ddc91c060371565cd63806c20a1d33911746e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=56
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - backports
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jaraco/backports.entry_points_selectable
  license: MIT
  license_file: LICENSE
  summary: Compatibility shim providing selectable entry points for older implementations
  description: |
    Compatibility shim providing selectable entry points for older implementations

extra:
  recipe-maintainers:
    - sergiopasra

