# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: flask-mongoengine-3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-mongoengine-3/flask_mongoengine_3-${{ version }}.tar.gz
  sha256: 52798119cd990ed0513572e7060bba272b3664e55164ae1e767436b1ff412b97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=1.1.4
    - mongoengine >=0.21
    - importlib-metadata

tests:
  - python:
      imports:
        - example_app
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/idoshr/flask-mongoengine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Flask extension that provides integration with MongoEngine and WTF model forms.
  description: |
    Flask extension that provides integration with MongoEngine and WTF model forms.
  repository: https://github.com/idoshr/flask-mongoengine
  documentation: https://flask-mongoengine-3.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
