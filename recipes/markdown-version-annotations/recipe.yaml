# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: markdown-version-annotations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdown-version-annotations/markdown_version_annotations-${{ version }}.tar.gz
  sha256: 620aade507ef175ccfb2059db152a34c6a1d2add28c2be16ea4de38d742e6132

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - markdown <4.0.0,>=3.3.7

tests:
  - python:
      imports:
        - markdown_version_annotations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/glennmatthews/markdown-version-annotations
  license: MIT
  license_file: LICENSE
  summary: Markdown plugin to add custom admonitions for documenting version differences
  description: |
    Markdown plugin to add custom admonitions for documenting version differences
  repository: https://github.com/glennmatthews/markdown-version-annotations

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
