# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.11"
  python_min: "3.13"

package:
  name: filesystem_operations_mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/filesystem_operations_mcp/filesystem_operations_mcp-${{ version }}.tar.gz
  sha256: 82f9866c7e6d92ba00a9b349fb488c56c42a13152e36b5626c4013167c875ae9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - uv-dynamic-versioning >=0.7.0
  run:
    - python >=${{ python_min }}
    - rpygrep >=0.1.1
    - aiofiles >=24.1.0
    - aioshutil >=1.5
    - async-lru >=2.0.5
    - asyncclick >=8.1.8
    - asyncstdlib >=3.13.1
    - fastmcp >2.11.0
    - gitpython >=3.1.45
    - magika >=0.6.2
    - makefun >=1.16.0
    - mcp >=1.9.0
    - mistune >=3.1.3
    - pydantic >=2.10.6
    - pytest-benchmark >=5.1.0
    - pyyaml >=6.0.2
    - ripgrep >=14.1.0
    - sumy >=0.11.0
    - syrupy >=4.9.1
    - tree-sitter-language-pack >=0.7.3
    - tree-sitter >=0.24.0

tests:
  - python:
      imports:
        - filesystem_operations_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/filesystem_operations_mcp/
  license: MIT
  license_file: LICENSE
  summary: Filesystem Operations MCP project
  description: |
    Filesystem Operations MCP project

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
