# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.3"

package:
  name: ovirt-engine-sdk-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ovirt-engine-sdk-python/ovirt_engine_sdk_python-${{ version }}.tar.gz
  sha256: 9cf0242792b8910cb7b2decc3886db2ccfd779507e46ac1ce2a52573075fd3df

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pycurl >=7.19.0

tests:
  - python:
      imports:
        - lib.ovirtsdk4
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ovirt-engine-sdk-python/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python SDK for oVirt Engine API
  description: |
    Python SDK for oVirt Engine API

extra:
  recipe-maintainers:
    - rxm7706

