# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: ncps
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/ncps/ncps-${{ version }}.tar.gz
  sha256: fd791104318201de3b0e2e524577e3222435706d0e5368009b8ae2a9f3d1618f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - future
    - packaging

tests:
  - python:
      imports:
        - ncps
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mlech26l/ncps
  license: Apache-2.0
  license_file: LICENSE
  summary: Neural Circuit Policies for PyTorch, Tensorflow, and Keras V3
  description: |
    Neural Circuit Policies for PyTorch, Tensorflow, and Keras V3

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ncps
