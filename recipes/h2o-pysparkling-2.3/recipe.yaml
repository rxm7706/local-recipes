# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.46.0.6.post1"

package:
  name: h2o-pysparkling-2.3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h2o-pysparkling-2.3/h2o_pysparkling_2.3-${{ version }}.tar.gz
  sha256: 5f4d0bbdda975de51a2d52fbfed608c9628a730d0312db4638481604379fed26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59.6.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/h2oai/sparkling-water
  license: Apache-2.0
  license_file: LICENSE
  summary: Sparkling Water integrates H2O's Fast Scalable Machine Learning with Spark
  description: |
    Sparkling Water integrates H2O's Fast Scalable Machine Learning with Spark

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

