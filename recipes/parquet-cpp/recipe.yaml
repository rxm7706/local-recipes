# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: parquet-cpp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parquet-cpp/parquet-cpp-${{ version }}.tar.gz
  sha256: e76d3841952695b48e4065eae613550a13029bf546b4979e58f4456797fac6bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parquet_cpp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/parquet-cpp/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: parquet-cpp
  description: |
    parquet-cpp

extra:
  recipe-maintainers:
    - wesm
    - xhochy
    - leifwalsh
    - jreback
    - cpcloud
    - siddharthteotia
    - kou
    - kszucs
    - pitrou

