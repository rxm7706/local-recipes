# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Parquet-cpp has been migrated to arrow codebase, so this is a meta package
# which install's the appropiate version of arrow-cpp.
# https://github.com/apache/arrow/blob/master/cpp/src/parquet/.parquetcppversion
# Don't forget to update me!
schema_version: 1

context:
  parquet_version: "1.5.1"
  arrow_version: "0.12.0"

package:
  name: parquet-cpp
  version: ${{ parquet_version }}

build:
  number: 4
  noarch: generic

requirements:
  host:
    - arrow-cpp >=${{ arrow_version }}
  run:
    - arrow-cpp >=${{ arrow_version }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/include/parquet/api/reader.h
      - if: win
        then: if not exist %LIBRARY_INC%\\parquet\\api\\reader.h exit 1
      - if: unix
        then: test -f $PREFIX/lib/libparquet.a
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\parquet_static.lib exit 1
      - if: linux
        then: test -f $PREFIX/lib/libparquet.so
      - if: osx
        then: test -f $PREFIX/lib/libparquet.dylib
      - if: win
        then: if not exist %PREFIX%\\Library\\bin\\parquet.dll exit 1

about:
  license: Apache-2.0
  summary: C++ libraries for the Apache Parquet file format
  homepage: http://github.com/apache/arrow

extra:
  recipe-maintainers:
    - wesm
    - xhochy
    - leifwalsh
    - jreback
    - cpcloud
    - siddharthteotia
    - kou
    - kszucs
    - pitrou
