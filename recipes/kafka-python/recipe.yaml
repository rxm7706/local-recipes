# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.11"

package:
  name: kafka-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kafka-python/kafka_python-${{ version }}.tar.gz
  sha256: a003d927e79c801d6cfd1e59ceaaf78807351e75cdb5b8ee9ce4262586f9780f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dpkp/kafka-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Pure Python client for Apache Kafka
  description: |
    Pure Python client for Apache Kafka
  repository: https://github.com/dpkp/kafka-python
  documentation: https://kafka-python.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
