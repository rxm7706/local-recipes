# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: streamlit-float
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-float/streamlit_float-${{ version }}.tar.gz
  sha256: ef1114d3b3b6356ae9175aaa89626bcf62bee476ec40a6e94e3a209accbdb82c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.45

tests:
  - python:
      imports:
        - streamlit_float
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bouzidanas/streamlit-float
  license: MIT
  license_file: LICENSE
  summary: Fix Streamlit containers relative to viewport instead of page
  description: |
    Fix Streamlit containers relative to viewport instead of page

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
