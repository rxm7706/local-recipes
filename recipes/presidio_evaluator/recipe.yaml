# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: presidio_evaluator
  version: "0.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/microsoft/presidio-research/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5261d5ed3f6614271d1333629697e78c3d3101dc0354561b2b3e5f3311f46344

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<4
    - spacy >=3.8.0,<4
    - pandas >=2.1.4,<3
    - tqdm >=4.60.0,<5
    - faker >=21.0,<22
    - scikit-learn >=1.3.2.12,<2
    - xmltodict >=0.12.0,<0.13
    - presidio-analyzer >=2.2.351,<3
    - presidio-anonymizer >=2.2.351,<3
    - requests >=2.25,<3
    - python-dotenv >=1.0.0,<2
    - plotly >=5.24.0,<6
  run_constraints:
    - azure-ai-textanalytics
    - flair >=0.14.0,<0.15
    - spacy_stanza >=1.0.0,<2
    - spacy_huggingface_pipelines >=0.0.4,<0.0.5

tests:
  - python:
      imports:
        - presidio_evaluator
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - pip list

about:
  summary: Presidio Evaluator package
  description: |
    Presidio Evaluator package.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/presidio
  repository: https://github.com/microsoft/presidio
  documentation: https://microsoft.github.io/presidio

extra:
  recipe-maintainers:
    - geoheil
    - phemps
    - gulyasi
    - julcsii
    - heckert
