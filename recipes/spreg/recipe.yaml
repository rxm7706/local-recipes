# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.1"
  python_min: "3.12"

package:
  name: spreg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spreg/spreg-${{ version }}.tar.gz
  sha256: 0633a13383700b79a197664db300bfc1b14c4747d770aa961c4f40c7a7577179

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - libpysal >=4.12
    - numpy >=2.0.0
    - pandas >=2.3
    - scikit-learn >=1.5
    - scipy >=1.14

tests:
  - python:
      imports:
        - spreg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/spreg/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: PySAL Spatial Econometric Regression in Python
  description: |
    PySAL Spatial Econometric Regression in Python
  repository: https://github.com/pysal/spreg

extra:
  recipe-maintainers:
    - ocefpaf
    - pedrovma
    - jGaboardi
    - knaaptime
    - martinfleis

#### CFE metadata AND comments
