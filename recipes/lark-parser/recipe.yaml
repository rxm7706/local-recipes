# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: lark-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lark-parser/lark-parser-${{ version }}.tar.gz
  sha256: 15967db1f1214013dca65b1180745047b9be457d73da224fcda3d9dd4e96a138

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lark-parser/lark
  license: MIT
  license_file: LICENSE
  summary: a modern parsing library
  description: |
    a modern parsing library

extra:
  recipe-maintainers:
    - tarcisioe
    - mlin

