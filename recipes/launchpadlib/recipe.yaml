    - pkg:pypi/launchpadlib@${{ version }}
  cfe-upstream-repo: https://code.launchpad.net/launchpadlib
  cfe-upstream-homepage: https://help.launchpad.net/API/launchpadlib
  cfe-import-names: [launchpadlib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
