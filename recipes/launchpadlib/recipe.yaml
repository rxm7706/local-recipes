# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: launchpadlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/launchpadlib/launchpadlib-${{ version }}.tar.gz
  sha256: b4c25890bb75050d54c08123d2733156b78a59a2555f5461f69b0e44cd91242f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httplib2
    - lazr-restfulclient >=0.14.2
    - lazr-uri

tests:
  - python:
      imports:
        - launchpadlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://help.launchpad.net/API/launchpadlib
  license: LGPL-3.0-only
  license_file: COPYING.txt
  summary: Script Launchpad through its web services interfaces
  description: |
    Script Launchpad through its web services interfaces.  Officially supported.
  repository: https://code.launchpad.net/launchpadlib
  documentation: https://launchpadlib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: launchpadlib
  cfe-upstream-registry: pypi
  cfe-upstream-name: launchpadlib
  cfe-purls:
