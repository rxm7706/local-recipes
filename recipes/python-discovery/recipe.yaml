# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.2"

package:
  name: python-discovery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-discovery/python_discovery-${{ version }}.tar.gz
  sha256: 45fd4f20a4e3f9b7bf2e0817870bc8e3b320a19658da177af800768c82dbf354

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.5
    - hatchling >=1.27
    - 3.10
  run:
    - python >=${{ python_min }}
    - filelock >=3.15.4

tests:
  - python:
      imports:
        - python_discovery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tox-dev/python-discovery
  license: MIT
  license_file: LICENSE
  summary: Python interpreter discovery
  description: |
    Python interpreter discovery
  repository: https://github.com/tox-dev/python-discovery
  documentation: https://python-discovery.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
