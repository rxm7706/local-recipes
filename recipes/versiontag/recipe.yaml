# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: versiontag
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/versiontag-${{ version }}.tar.gz
  sha256: f0732276baaf0acf4368a3f9a902d65a847da25105a1ec3669ff2ad770b5d5e0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - versiontag
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Simple git tag based version numbers
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/thelabnyc/python-versiontag

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: versiontag
  cfe-upstream-registry: pypi
  cfe-upstream-name: versiontag
  cfe-purls:
    - pkg:conda/versiontag@${{ version }}?channel=conda-forge
    - pkg:pypi/versiontag@${{ version }}
  cfe-upstream-repo: https://github.com/thelabnyc/python-versiontag
  cfe-upstream-homepage: https://github.com/thelabnyc/python-versiontag
  cfe-import-names: [versiontag]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/versiontag-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-11-05T17:29:39Z
  cfe-generated-by-version: 8.103.0
  cfe-generated-at-datetime: 2026-11-05T17:29:39Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
