# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: starlette-session
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/starlette-session/starlette_session-${{ version }}.tar.gz
  sha256: 5b50a1c91a2ca1cf594574c0b386eea5dbed140dcb397ee73f0c43956bd2bfcc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - starlette
    - itsdangerous

tests:
  - python:
      imports:
        - starlette_session
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/auredentan/starlette-session
  license: MIT
  license_file: LICENSE
  summary: A library for backend side session with starlette
  description: |
    A library for backend side session with starlette
  repository: https://github.com/auredentan/starlette-session

extra:
  recipe-maintainers:
    - rxm7706

