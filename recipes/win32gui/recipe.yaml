# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "221.6"

package:
  name: win32gui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp35/w/win32gui/win32gui-221.6-cp35-cp35m-win32.whl
  sha256: f1ebf9c96f3726af207fd12882a7625974c22988ae08a29c34c693e23eb8a7c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - win32core

tests:
  - python:
      imports:
        - win32gui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://sourceforge.net/projects/pywin32/
  license: PSF
  license_file: LICENSE
  summary: Python for Window Extensions
  description: |
    Python for Window Extensions

extra:
  recipe-maintainers:
    - rxm7706

