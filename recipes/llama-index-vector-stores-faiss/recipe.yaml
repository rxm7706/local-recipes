# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: llama-index-vector-stores-faiss
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-vector-stores-faiss/llama_index_vector_stores_faiss-${{ version }}.tar.gz
  sha256: 00bfeb6cb7571e0e856566cb4f10c89b415b6108f151d9ad48ee9c31da563f5e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.vector_stores.faiss
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-vector-stores-faiss/
  license: MIT
  license_file: LICENSE
  summary: llama-index vector_stores faiss integration
  description: |
    llama-index vector_stores faiss integration

extra:
  recipe-maintainers:
    - rxm7706

