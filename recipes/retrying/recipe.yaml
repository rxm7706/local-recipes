# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: retrying
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/retrying/retrying-${{ version }}.tar.gz
  sha256: d102e75d53d8d30b88562d45361d6c6c934da06fab31bd81c0420acb97a8ba39

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - retrying
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/groodt/retrying
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Retrying
  description: |
    Retrying
  repository: https://github.com/groodt/retrying

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: retrying
  cfe-upstream-registry: pypi
  cfe-upstream-name: retrying
  cfe-purls:
    - pkg:conda/retrying@${{ version }}?channel=conda-forge
    - pkg:pypi/retrying@${{ version }}
  cfe-upstream-repo: https://github.com/groodt/retrying
  cfe-upstream-homepage: https://github.com/groodt/retrying
  cfe-import-names: [retrying]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/retrying-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T04:57:20Z
  cfe-generated-by-version: 8.81.0
