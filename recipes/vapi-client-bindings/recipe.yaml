# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0.0"

package:
  name: vapi-client-bindings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vapi-client-bindings/vapi-client-bindings-${{ version }}.tar.gz
  sha256: 1df6e3ed4b90fb86826d0609dc17222286597f75f3a22d908e001c3fb63e0e9a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vapi_client_bindings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/vsphere-automation-sdk-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: vAPI client bindings
  description: |
    vAPI client bindings

extra:
  recipe-maintainers:
    - rxm7706

