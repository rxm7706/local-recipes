# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.1"

package:
  name: stumpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stumpy/stumpy-${{ version }}.tar.gz
  sha256: 1cb13696724ddab4b512b16843d37ccf4047aee19e072d1ad83024e1fa6fde96

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - numba >=0.61.2

tests:
  - python:
      imports:
        - stumpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stumpy-dev/stumpy
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A powerful and scalable library that can be used for a variety of time series data mining tasks
  description: |
    A powerful and scalable library that can be used for a variety of time series data mining tasks
  repository: https://github.com/stumpy-dev/stumpy
  documentation: https://stumpy.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - seanlaw
    - NimaSarajpoor

#### CFE metadata AND comments
