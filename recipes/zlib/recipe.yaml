# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"
  build_num: 3

recipe:
  name: zlib-split
  version: ${{ version }}

source:
  url:
    - http://zlib.net/zlib-${{ version }}.tar.gz
    - https://gnupg.org/ftp/gcrypt/zlib/zlib-${{ version }}.tar.gz
  sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16

build:
  number: ${{ build_num }}

requirements:
  build:
    - if: win
      then: cmake
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: unix
      then: make
  run:

outputs:
  - package:
      name: libzlib
    files:
      - if: linux
        then: lib/libz.so.*
      - if: osx
        then: lib/libz.*.dylib
      - if: win
        then: Library/bin/zlib.dll
      - if: win
        then: zlib.dll
    build:
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
      run:
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
      run_constraints:
        - zlib 1.3.2 *_3.*
    tests:
      - script:
          - if: unix
            then: test ! -f ${PREFIX}/lib/libz.a
          - if: unix
            then: test ! -f ${PREFIX}/lib/libz${SHLIB_EXT}
          - if: unix
            then: test ! -f ${PREFIX}/include/zlib.h
          - if: win
            then: if not exist %LIBRARY_BIN%\zlib.dll exit 1
          - if: win
            then: if not exist %PREFIX%\zlib.dll exit 1
  - package:
      name: libzlib-wapi
    files:
      - if: win
        then: Library/bin/zlibwapi.dll
    build:
      skip: not win
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
      run:
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
      run_constraints:
        - zlib 1.3.2 *_3.*
        - zlib-wapi 1.3.2 *_3.*
    tests:
      - script:
          - if: win
            then: if not exist "%LIBRARY_BIN%\zlibwapi.dll" exit 1
  - package:
      name: zlib
    files:
      - if: linux
        then: lib/libz.so
      - if: osx
        then: lib/libz.dylib
      - if: unix
        then: include
      - if: unix
        then: lib/pkgconfig
      - if: unix
        then: lib/libz.a
      - if: win
        then: Library/include
      - if: win
        then: Library/share
      - if: win
        then: Library/lib/zlib.lib
      - if: win
        then: Library/lib/zdll.lib
      - if: win
        then: Library/lib/z.lib
      - if: win
        then: Library/lib/zlibstatic.lib
      - if: win
        then: Library/lib/pkgconfig
    build:
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
        - ${{ pin_subpackage('libzlib', exact=True) }}
      run:
        - ${{ pin_subpackage('libzlib', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
    tests:
      - files:
          recipe:
            - test_compile_flags.bat
            - test_compile_flags.c
        requirements:
          run:
            - ${{ compiler('c') }}
        script:
          - if: unix
            then: test -f ${PREFIX}/lib/libz.a
          - if: unix
            then: test -f ${PREFIX}/lib/libz${SHLIB_EXT}
          - if: unix
            then: test -f ${PREFIX}/include/zlib.h
          - if: win
            then: if not exist %LIBRARY_LIB%\zlibstatic.lib exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\zlib.lib exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\pkgconfig\zlib.pc exit 1
          - if: win
            then: if not exist %LIBRARY_INC%\zlib.h exit 1
          - if: win
            then: if exist %LIBRARY_LIB%\zlibwapi.lib exit 1
          - if: win
            then: call test_compile_flags.bat
  - package:
      name: zlib-wapi
    files:
      - if: win
        then: Library/lib/zlibwapi.lib
      - if: win
        then: Library/include/zlib.h
    build:
      skip: not win
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
        - ${{ pin_subpackage('libzlib-wapi', exact=True) }}
        - ${{ pin_subpackage('zlib', exact=True) }}
      run:
        - ${{ pin_subpackage('libzlib-wapi', exact=True) }}
        - ${{ pin_subpackage('zlib', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
    tests:
      - files:
          recipe:
            - test_compile_flags.bat
            - test_compile_flags.c
        requirements:
          run:
            - ${{ compiler('c') }}
        script:
          - if: win
            then: if not exist %LIBRARY_LIB%\zlibwapi.lib exit 1
          - if: win
            then: if not exist %LIBRARY_INC%\zlib.h exit 1
          - if: win
            then: call test_compile_flags.bat "wapi"

about:
  license: Zlib
  summary: Massively spiffy yet delicately unobtrusive compression library
  license_file: LICENSE
  description: |
    zlib is designed to be a free, general-purpose, lossless data-compression
    library for use on virtually any computer hardware and operating system.
  homepage: http://zlib.net/
  repository: https://github.com/madler/zlib
  documentation: http://zlib.net/manual.html

extra:
  recipe-maintainers:
    - groutr
    - msarahan
    - ocefpaf
    - isuruf
  feedstock-name: zlib
