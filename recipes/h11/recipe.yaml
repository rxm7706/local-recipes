# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: h11
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h11/h11-${{ version }}.tar.gz
  sha256: 4e35b956cf45792e4caa5885e69fba00bdbc6ffafbfa020300e549b208ee5ff1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - h11
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/h11
  license: MIT
  license_file: LICENSE.txt
  summary: A pure-Python, bring-your-own-I/O implementation of HTTP/1.1
  description: |
    A pure-Python, bring-your-own-I/O implementation of HTTP/1.1

extra:
  recipe-maintainers:
    - carlodri

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: h11
  cfe-upstream-registry: pypi
  cfe-upstream-name: h11
  cfe-purls:
    - pkg:conda/h11@${{ version }}?channel=conda-forge
    - pkg:pypi/h11@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/python-hyper/h11
  cfe-import-names: [h11]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/h11-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-17T10:55:14Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T10:55:14Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-17T10:55:14Z
