# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: chuk-mcp-client-oauth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-mcp-client-oauth/chuk_mcp_client_oauth-${{ version }}.tar.gz
  sha256: 5ab1d9384d2ed802d6c4e24e755c34914046aef696a7346730756342a83b1974

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cryptography >=41.0.0
    - httpx >=0.24.0
    - pydantic >=2.0.0
    - if: osx
      then:
        - keyring
    - if: win
      then:
        - keyring

tests:
  - python:
      imports:
        - chuk_mcp_client_oauth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chuk-mcp-client-oauth/
  license: Apache-2.0
  license_file: LICENSE
  summary: A reusable OAuth 2.0 client library for MCP (Model Context Protocol) servers
  description: |
    A reusable OAuth 2.0 client library for MCP (Model Context Protocol) servers

extra:
  recipe-maintainers:
    - rxm7706

