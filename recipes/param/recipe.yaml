# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: param
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/param/param-${{ version }}.tar.gz
  sha256: 364a33bd8a968b053d8a49d319af78dc31b3ccb9661ecb95c29a3ea509d7e443

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - param
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://param.holoviz.org/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Declarative parameters for robust Python classes and a rich API for reactive programming
  description: |
    Declarative parameters for robust Python classes and a rich API for reactive programming
  repository: https://github.com/holoviz/param

extra:
  recipe-maintainers:
    - hoxbro
    - basnijholt
    - jlstevens
    - philippjfr
    - maximlt

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: param
