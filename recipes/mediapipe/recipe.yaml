# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: mediapipe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mediapipe/mediapipe-1.0.1-py3-none-macosx_11_0_arm64.whl
  sha256: 0a9fb67957f7d28e84f485e9c6716a43367b3f6f07170f31c3f72cac1addd031

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py ~=2.3
    - certifi
    - numpy
    - python-sounddevice ~=0.5
    - flatbuffers ~=25.9
    - opencv-contrib-python
    - matplotlib-base

tests:
  - python:
      imports:
        - mediapipe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/mediapipe
  license: Apache-2.0
  license_file: LICENSE
  summary: "MediaPipe is the simplest way for researchers and developers to build world-class ML solutions and applications for mobile, edge, cloud and the web. See the privacy notice at https://goo.gle/mediapipe-privacy."
  description: |
    MediaPipe is the simplest way for researchers and developers to build world-class ML solutions and applications for mobile, edge, cloud and the web. See the privacy notice at https://goo.gle/mediapipe-privacy.

extra:
  recipe-maintainers:
    - rxm7706

