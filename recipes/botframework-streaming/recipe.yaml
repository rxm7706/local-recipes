# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.17.1"

package:
  name: botframework-streaming
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/b/botframework-streaming/botframework_streaming-4.17.1-py3-none-any.whl
  sha256: 66ad1cfe24c8c6b1fde8f95131e39e01197158e7e0bab797dfa709b4f905deb3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - botbuilder-schema ==4.17.1
    - botframework-connector ==4.17.1

tests:
  - python:
      imports:
        - botframework_streaming
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.github.com/Microsoft/botbuilder-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Bot Framework Bot Builder
  description: |
    Microsoft Bot Framework Bot Builder

extra:
  recipe-maintainers:
    - rxm7706

