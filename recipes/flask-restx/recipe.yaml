# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flask-restx
  version: "1.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0ae13d77e7d7e4dce513970cfa9db45364aef210e99022de26d2b73eb4dbced5

build:
  noarch: python
  number: 1
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aniso8601 >=0.82
    - jsonschema
    - referencing
    - flask >=0.8,!=2.0.0
    - werkzeug !=2.0.0
    - importlib-resources

tests:
  - python:
      imports:
        - flask_restx
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/python-restx/flask-restx/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Fully featured framework for fast, easy and documented API development with Flask
  description: |
    Flask-RESTX is an extension for Flask that adds support for quickly building REST APIs.
    Flask-RESTX encourages best practices with minimal setup. If you are familiar with Flask,
    Flask-RESTX should be easy to pick up. It provides a coherent collection of decorators and
    tools to describe your API and expose its documentation properly using Swagger.
  documentation: https://flask-restx.readthedocs.io/
  repository: https://github.com/python-restx/flask-restx/

extra:
  recipe-maintainers:
    - SVilgelm
    - fhoehle
