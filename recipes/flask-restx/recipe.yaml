# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: flask-restx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-restx/flask-restx-${{ version }}.tar.gz
  sha256: 0ae13d77e7d7e4dce513970cfa9db45364aef210e99022de26d2b73eb4dbced5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aniso8601 >=0.82
    - jsonschema
    - referencing
    - flask !=2.0.0,>=0.8
    - werkzeug !=2.0.0
    - importlib_resources

tests:
  - python:
      imports:
        - flask_restx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-restx/flask-restx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Fully featured framework for fast, easy and documented API development with Flask
  description: |
    Fully featured framework for fast, easy and documented API development with Flask

extra:
  recipe-maintainers:
    - SVilgelm
    - fhoehle

