# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8.1"

package:
  name: luigi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/luigi/luigi-${{ version }}.tar.gz
  sha256: 2fa5eb5d3474e495de09bd964f502936c08f8b1eb6e0f3ca3c8a69116c38d0c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil <3,>=2.7.5
    - tenacity >=9
    - tornado <7,>=5.0
    - typing_extensions >=4.12.2
    - if: win
      then:
        - python-daemon

tests:
  - python:
      imports:
        - luigi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spotify/luigi
  license: Apache-2.0
  license_file: LICENSE
  summary: Workflow mgmgt + task scheduling + dependency resolution.
  description: |
    Workflow mgmgt + task scheduling + dependency resolution.

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: luigi
  cfe-upstream-registry: pypi
  cfe-upstream-name: luigi
