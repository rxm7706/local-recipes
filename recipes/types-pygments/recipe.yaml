# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.20.0.20260728"

package:
  name: types-pygments
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/types-pygments/types_pygments-${{ version }}.tar.gz
    sha256: dd0a49d84fd9e3f08ab3a3191779e4732a91bb1fad2e80178cf4574e8f35684d
  - url: https://raw.githubusercontent.com/python/typeshed/main/LICENSE
    sha256: 295f8538c94ae5c3043301cf7cff1c852dab6a786a8ddee471e061b40d5ecabe

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-docutils
    - types-setuptools

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pip check
      - if: unix
        then: test -f $SP_DIR/pygments-stubs/__init__.pyi
      - if: win
        then: if not exist %SP_DIR%\\pygments-stubs\\__init__.pyi exit 1

about:
  summary: Typing stubs for Pygments
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - conda-forge/mypy
