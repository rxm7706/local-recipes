# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: splunk-hec-handler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splunk-hec-handler/splunk_hec_handler-${{ version }}.tar.gz
  sha256: 69d5284f245cf0ce48e55b2b19bfa8d5bde003d6e518403bb8fa986a796f61a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - splunk_hec_handler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vavarachen/splunk_hec_handler
  license: MIT
  license_file: LICENSE
  summary: A Python logging handler to sends logs to Splunk using HTTP event collector (HEC)
  description: |
    A Python logging handler to sends logs to Splunk using HTTP event collector (HEC)

extra:
  recipe-maintainers:
    - rxm7706

