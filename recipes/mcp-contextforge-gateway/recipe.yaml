# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated from python-maturin path; PyO3/maturin detected via sdist
# pyproject.toml [build-system].requires. Modelled on phonors PR pattern
# (modal 27-PR PyO3 sample, Mar 2020 – May 2026). Recipe shape follows the
# 2026 grayskull / conda-forge convention: literal ``package.name``, literal
# ``source.url`` (only ``${ version }`` templated), no ``name`` in context.
schema_version: 1

context:
  version: "1.0.7"
  python_min: "3.11"

package:
  name: mcp-contextforge-gateway
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-contextforge-gateway/mcp_contextforge_gateway-${{ version }}.tar.gz
  sha256: ee68d3fa609aa7b97da68ca22c9e89a8c5e61395cf9efbea1f0df8015fcc6b55

build:
  number: 0
  script:
    env:
      # Per conda-forge.org/docs/maintainer/example_recipes/rust/ — applies to
      # any Rust build (CLI binary OR maturin/PyO3 cdylib). maturin invokes
      # cargo build internally and inherits these env vars.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    # Cargo.toml declares pyo3 abi3 feature — wheel is
    # CPython-stable-ABI and works across Python versions.
    version_independent: true

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python
    - alembic >=1.18.5
    - argon2-cffi >=25.1.0
    - base58 >=2.1.1
    - brotli >=1.2.0
    - click >=8.4.2
    - cpex >=0.1.2
    - cryptography >=50.0.0
    - fastapi >=0.140.0
    - filelock <3.33.0,>=3.32.0
    - gunicorn >=26.0.0

tests:
  - python:
      imports:
        - mcpgateway
      pip_check: true

about:
  homepage: https://ibm.github.io/mcp-context-forge/
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: ContextForge AI Gateway — an AI gateway, registry, and proxy for MCP, A2A, and REST/gRPC APIs. Exposes a unified control plane with centralized governance, discovery, and observability. Optimizes agent and tool calling, and supports plugins.
  description: |
    ContextForge AI Gateway — an AI gateway, registry, and proxy for MCP, A2A, and REST/gRPC APIs. Exposes a unified control plane with centralized governance, discovery, and observability. Optimizes agent and tool calling, and supports plugins.
  repository: https://github.com/IBM/mcp-context-forge
  documentation: https://ibm.github.io/mcp-context-forge/

extra:
  recipe-maintainers:
    - rxm7706

