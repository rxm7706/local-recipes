# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: harfile
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/harfile-${{ version }}.tar.gz
  sha256: c1524b8f0a39dd9f19365760aefb3adbba951818310d17b2eaa293de1f4c170a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - harfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Writer for HTTP Archive (HAR) files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/schemathesis/harfile

extra:
  recipe-maintainers:
    - thewchan
