# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.9.1"

package:
  name: jupyter-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-client/jupyter_client-${{ version }}.tar.gz
  sha256: a58f730dd9e728ba16ba1d62ebccf7ffe1ebbdbce4e95cfae941b7321ae1f4fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter-core >=5.1
    - python-dateutil >=2.8.2
    - pyzmq >=25.0
    - tornado >=6.4.1
    - traitlets >=5.3
    - typing_extensions >=4.13.0
    - if: win
      then:
        - paramiko

tests:
  - python:
      imports:
        - jupyter_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter protocol implementation and client libraries
  description: |
    Jupyter protocol implementation and client libraries
  repository: https://github.com/jupyter/jupyter_client
  documentation: https://jupyter-client.readthedocs.io/

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - ocefpaf
    - carreau
    - SylvainCorlay
    - bollwyvl
    - davidbrochart
    - blink1073

