# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.7"

package:
  name: adal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adal/adal-${{ version }}.tar.gz
  sha256: d74f45b81317454d96e982fd1c50e6fb5c99ac2223728aea8764433a39f566f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyjwt
    - requests
    - python-dateutil
    - cryptography

tests:
  - python:
      imports:
        - adal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AzureAD/azure-activedirectory-library-for-python
  license: MIT
  license_file: LICENSE
  summary: "Note: This library is already replaced by MSAL Python, available here: https://pypi.org/project/msal/ .ADAL Python remains available here as a legacy. The ADAL for Python library makes it easy for python application to authenticate to Azure Active Directory (AAD) in order to access AAD protected web resources."
  description: |
    Note: This library is already replaced by MSAL Python, available here: https://pypi.org/project/msal/ .ADAL Python remains available here as a legacy. The ADAL for Python library makes it easy for python application to authenticate to Azure Active Directory (AAD) in order to access AAD protected web resources.

extra:
  recipe-maintainers:
    - marcelotrevisani

