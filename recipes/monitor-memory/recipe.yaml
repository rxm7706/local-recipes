# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: monitor-memory
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/monitor-memory/monitor_memory-${{ version }}.tar.gz
  sha256: fa26e7f155a3f42e302241ed8c0ecc0f66e541ac0c86d8171f99fe4161463ded

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - monitor_memory
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/stroxler/monitor_memory
  license: MIT
  license_file: LICENSE
  summary: Tools for working with container types, command data operations, and concise exception handling
  description: |
    Tools for working with container types, command data operations, and concise exception handling

extra:
  recipe-maintainers:
    - rxm7706

