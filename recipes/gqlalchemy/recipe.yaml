# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.0"

package:
  name: gqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/GQLAlchemy/gqlalchemy-${{ version }}.tar.gz
  sha256: 08a60cf452b828d8a5cf8ddd5a9325868aa608cb30b5be85245bb9a8b1c48407

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - adlfs <2025.0.0,>=2023.9.0
    - dacite <2.0.0,>=1.6.0
    - neo4j <6.0.0,>=4.4.3
    - networkx <4.0.0,>=2.5.1
    - numpy <2.0,>=1.26.4
    - pandas <=2.2.3
    - psutil <7.0,>=5.9
    - pydantic <3.0.0,>=2.3.0
    - pymgclient <2.0.0,>=1.6.0

tests:
  - python:
      imports:
        - gqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/GQLAlchemy/
  license: Apache-2.0
  license_file: LICENSE
  summary: GQLAlchemy is a library developed to assist with writing and running queries in Memgraph.
  description: |
    GQLAlchemy is a library developed to assist with writing and running queries in Memgraph.
  repository: https://github.com/memgraph/gqlalchemy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gqlalchemy
