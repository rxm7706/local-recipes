# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: a2a-json-rpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a-json-rpc/a2a_json_rpc-${{ version }}.tar.gz
  sha256: 9a803e1653e434c03483cadef1d1d7622500d9a3345fbfdd02bf9b7d0e92c0e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - anyio >=4.9.0
    - pydantic >=2.11.3

tests:
  - python:
      imports:
        - a2a_json_rpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/a2a-json-rpc/
  license: MIT
  license_file: LICENSE
  summary: JSON-RPC implementation for the A2A (Agent-to-Agent) Protocol
  description: |
    JSON-RPC implementation for the A2A (Agent-to-Agent) Protocol

extra:
  recipe-maintainers:
    - rxm7706

