# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.4"

package:
  name: receptor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/receptor/receptor-${{ version }}.tar.gz
  sha256: 0080a25ec4da152a7f92361e956922aff440f45125b31cb357aab9db4f87b592

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - prometheus_client
    - aiohttp
    - python-dateutil

tests:
  - python:
      imports:
        - receptor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/project-receptor/receptor
  license: Apache-2.0
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

