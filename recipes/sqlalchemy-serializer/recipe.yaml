# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.3"

package:
  name: sqlalchemy-serializer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-serializer/sqlalchemy_serializer-${{ version }}.tar.gz
  sha256: e9fef955fea945a9affe9eeba42cbf52a3c2b3f0050d3f6951661038257a6d10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.9.0
    - wheel
  run:
    - python >=${{ python_min }}
    - sqlalchemy <3.0.0,>=2.0.49
    - psycopg2 ==2.9.11
    - pytz >=2026.1.post1
    - setuptools >=82.0.1

tests:
  - python:
      imports:
        - sqlalchemy_serializer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlalchemy-serializer/
  license: MIT
  license_file: LICENSE
  summary: Mixin for SQLAlchemy models serialization without pain
  description: |
    Mixin for SQLAlchemy models serialization without pain

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
