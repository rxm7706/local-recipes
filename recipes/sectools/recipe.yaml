# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"
  python_min: "3.11"

package:
  name: sectools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sectools/sectools-${{ version }}.tar.gz
  sha256: 55ef1ca4cb5d257bd417511589dbcd30ca2c8d6a8f5b30e83e5406d62c9d9d70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sectools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/p0dalirius/sectools
  license: MIT
  license_file: LICENSE
  summary: A python library containing the base functions for security tools
  description: |
    A python library containing the base functions for security tools

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sectools
  cfe-upstream-registry: pypi
  cfe-upstream-name: sectools
