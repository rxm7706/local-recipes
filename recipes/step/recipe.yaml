# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: step
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/step/step-${{ version }}.tar.gz
  sha256: 4e469d7c37f57dd69acb86904c5d8a15c162eb93bfc2633615cf3dd9af5e0255

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - mdformat
    - typer

tests:
  - python:
      imports:
        - step
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/step/
  license: MIT
  license_file: LICENSE
  summary: The first step to automate things; from a Markdown into a CLI
  description: |
    The first step to automate things; from a Markdown into a CLI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: step
  cfe-upstream-registry: pypi
  cfe-upstream-name: step
  cfe-purls:
    - pkg:conda/step@${{ version }}?channel=conda-forge
    - pkg:pypi/step@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/step/
  cfe-upstream-homepage: https://pypi.org/project/step/
  cfe-import-names: [step]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:11:45Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T20:11:45Z
