# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# core package & vendored libs use different version scheme than CPP libs, see
# top of https://github.com/grpc/grpc/blob/v{{ version }}/CMakeLists.txt
# the difference of 27 is empirical, last changed in 1.80
schema_version: 1

context:
  version: "1.83.0"
  core_major: ${{ version.split(".")[1] | int - 27 }}
  core_version: core_major | string ~ ".0.0"
  core_libs:
    - gpr
    - grpc
  core_cpp_libs:
    - grpc++
  vendored_libs:
    - address_sorting
  binaries_plugin_langs:
    - cpp
    - csharp
    - node
    - objective_c
    - php
    - python
    - ruby

recipe:
  name: grpc-split
  version: ${{ version }}

source:
  - url: https://github.com/grpc/grpc/archive/v${{ version | replace(".pre", "-pre") }}.tar.gz
    sha256: 90d453393a9d41215df546103b10b33b9566df79cdf6f49dc67f6c4d044d090d
    patches:
      - patches/0001-windows-ssl-lib-names.patch
      - patches/0002-fix-win-setup-cmds.patch
      - patches/0003-Link-against-grpc-and-abseil.patch
      - patches/0004-force-protoc-executable.patch
      # mark target_link_libraries for grpc as PRIVATE where possible
      - patches/0005-mark-linkages-of-grpc-_unsecure-as-private.patch
      # fix symbol visibility regression on windows
      - patches/0006-for-main-targets-set-_DLL_EXPORTS-when-building-and-.patch
      # get gRPC_BUILD_TESTS=ON to build
      - patches/0007-add-missing-linkages-for-gRPC_BUILD_TESTS-ON.patch
      # see https://github.com/grpc/grpc/pull/38893
      - patches/0008-add-enable_testing-so-tests-get-run.patch
      # protobuf is now shipping upb, so we cannot ship it here; see
      # https://github.com/protocolbuffers/protobuf/issues/12927
      # https://github.com/conda-forge/libprotobuf-feedstock/pull/240
      # https://github.com/grpc/grpc/commit/7819891fabcd1d2ff55c26c2b0755ab52ccd8e20
      - patches/0009-unvendor-upb-and-utf8_range-use-protobuf-s-version.patch
      # full test suite takes too long to build; reduce set of tests
      - patches/0010-reduce-buildtests_cxx-target-to-end2end-tests.patch
      # don't rebuild protobuf/upb/abseil for grpcio-tools
      - patches/0011-build-grpcio-tools-from-source.patch
      - patches/0012-reduce-grpc-symbol-explosion-with-autogenerated-expo.patch
      - patches/0013-update-GRPC_DLL-instances-where-necessary.patch
      - patches/0014-use-protobuf-s-libutf8_range.patch
      - patches/0015-disable-grpc-_unsecure.patch
      # backport https://github.com/grpc/grpc/pull/41909
      - patches/0016-break-out-_initialize_absl-into-separate-cython-modu.patch
      # silence absl::MutexLock(Mutex*) deprecation warnings on newer abseil
      - patches/0017-silence-absl-MutexLock-pointer-deprecation-warnings.patch
      # silence absl::Mutex::Lock()/Unlock() deprecation warnings on newer abseil
      - patches/0018-silence-absl-Mutex-Lock-Unlock-deprecation-warnings.patch
  - git: https://github.com/google/benchmark.git
    rev: 12235e24652fc7f809373e7c11a5f73c5763fc4c
    target_directory: third_party/benchmark
  - git: https://github.com/google/cel-spec.git
    rev: 9f069b3ee58b02d6f6736c5ebd6587075c1a1b22
    target_directory: third_party/cel-spec
  - git: https://github.com/envoyproxy/data-plane-api.git
    rev: 6ef568cf4a67362849911d1d2a546fd9f35db2ff
    target_directory: third_party/envoy-api
  - git: https://github.com/googleapis/googleapis.git
    rev: 2193a2bfcecb92b92aad7a4d81baa428cafd7dfd
    target_directory: third_party/googleapis
  - git: https://github.com/google/googletest.git
    rev: 52eb8108c5bdec04579160ae17225d66034bd723
    target_directory: third_party/googletest
  - git: https://github.com/envoyproxy/protoc-gen-validate.git
    rev: 7b06248484ceeaa947e93ca2747eccf336a88ecc
    target_directory: third_party/protoc-gen-validate
  - git: https://github.com/cncf/xds.git
    rev: ee656c7534f5d7dc23d44dd611689568f72017a6
    target_directory: third_party/xds

build:
  number: 0

outputs:
  - package:
      name: libgrpc
    build:
      script:
        file: ${{ 'build-cpp.bat' if win else 'build-cpp.sh' if not win else '' }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - if: win
          then: python *
        # for analysing total number of symbols in grpc.dll
        - if: win
          then: py-lief
        # During cross-compilation, we need to build the grpc_cpp_plugin for the
        # architecture of the build agent (where it will be executed afterwards),
        # thus we need the respective host dependencies also in the build env.
        - if: build_platform != target_platform
          then: c-ares
        - if: build_platform != target_platform
          then: libabseil
        - if: build_platform != target_platform
          then: libprotobuf
        - if: build_platform != target_platform
          then: openssl
        - if: build_platform != target_platform
          then: re2
        - if: build_platform != target_platform
          then: zlib
      host:
        - libabseil
        - c-ares
        - libprotobuf
        - re2
        - openssl
        - zlib
      run:
        - if: win
          then: ucrt
      run_exports:
        - ${{ pin_subpackage('libgrpc', upper_bound='x.x') }}
      run_constraints:
        - grpc-cpp =${{ version }}
    tests:
      - files:
          recipe:
            - cmake_test/
            - hello.proto
            - test_grpc.sh
            - test_grpc.bat
          source:
            - examples/cpp/helloworld/
            - examples/cpp/cmake/
            - examples/protos/helloworld.proto
        requirements:
          run:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
            - pkg-config
            - zlib
        script:
          - if: linux
            then: test -f $PREFIX/lib/lib${{ each_lib }}.so
          - if: osx
            then: test -f $PREFIX/lib/lib${{ each_lib }}.dylib
          - if: win
            then: if not exist %LIBRARY_BIN%\${{ each_lib }}.dll exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\${{ each_lib }}.lib exit 1
          - if: unix
            then: test ! -f $PREFIX/lib/lib${{ each_lib }}.a
          - if: unix
            then: test -f $PREFIX/bin/grpc_${{ each_lang }}_plugin
          - if: win
            then: if not exist %LIBRARY_BIN%\grpc_${{ each_lang }}_plugin.exe exit 1
          - pkg-config --print-errors --exact-version "${{ core_version }}" ${{ each_lib }}
          - pkg-config --print-errors --exact-version "${{ version }}" ${{ each_lib }}
          - if: linux
            then: test ! -f $PREFIX/lib/libgrpc_unsecure.so
          - if: linux
            then: test ! -f $PREFIX/lib/libgrpc++_unsecure.so
          - if: osx
            then: test ! -f $PREFIX/lib/libgrpc_unsecure.dylib
          - if: osx
            then: test ! -f $PREFIX/lib/libgrpc++_unsecure.dylib
          - if: win
            then: if exist %LIBRARY_BIN%\grpc_unsecure.dll exit 1
          - if: win
            then: if exist %LIBRARY_BIN%\grpc++_unsecure.dll exit 1
          - if: win
            then: if exist %LIBRARY_LIB%\grpc_unsecure.lib exit 1
          - if: win
            then: if exist %LIBRARY_LIB%\grpc++_unsecure.lib exit 1
          - if: unix
            then: ./test_grpc.sh
          - if: win
            then: ./test_grpc.bat
          - cd cmake_test
          - if: unix
            then: cmake -GNinja -DCMAKE_CXX_STANDARD=17 $CMAKE_ARGS .
          - if: win
            then: cmake -GNinja -DCMAKE_CXX_STANDARD=17 %CMAKE_ARGS% .
          - cmake --build .
  - package:
      name: grpcio
    build:
      script:
        file: ${{ 'build-grpcio.bat' if win else 'build-grpcio.sh' if not win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: cython
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - python
        - pip
        - setuptools
        - cython
        - libabseil
        - ${{ pin_subpackage('libgrpc', exact=True) }}
        - if: linux
          then: pthread-stubs
        - zlib
      run:
        - python
        - ${{ pin_subpackage('libgrpc', exact=True) }}
        - typing-extensions >=4.12,<5
    tests:
      - python:
          imports:
            - grpc
            - grpc._cython
            - grpc._cython._cygrpc
            - grpc.beta
            - grpc.framework
            - grpc.framework.common
            - grpc.framework.foundation
            - grpc.framework.interfaces
            - grpc.framework.interfaces.base
            - grpc.framework.interfaces.face
          pip_check: true
      - files:
          recipe:
            - grpcio_distribtest.py
            - test_grpcio_helloworld.py
          source:
            - examples/python/helloworld/
            - examples/protos/helloworld.proto
        requirements:
          run:
            - pip
            - grpcio-tools
        script:
          - python grpcio_distribtest.py
          - cd examples/python/helloworld
          - python -m grpc_tools.protoc -I../../protos --python_out=. --pyi_out=. --grpc_python_out=. ../../protos/helloworld.proto
          - cp ../../../test_grpcio_helloworld.py .
          - python test_grpcio_helloworld.py
  - package:
      name: grpcio-tools
    build:
      script:
        - cd tools/distrib/python/grpcio_tools
        - if: unix
          then: export GRPC_PYTHON_BUILD_WITH_CYTHON=true
        - if: win
          then: set GRPC_PYTHON_BUILD_WITH_CYTHON=true
        - python -m pip install . --no-build-isolation -vv
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cython
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - grpcio ${{ version }} *_${{ PKG_BUILDNUM }}
        - python
        - cython
        - pip
        - setuptools
        - libabseil
        - libprotobuf
      run:
        - grpcio ${{ version }} *_${{ PKG_BUILDNUM }}
        - python
        - protobuf
        - setuptools
    tests:
      - python:
          imports:
            - grpc_tools
          pip_check: true
      - requirements:
          run:
            - pip
        script:
          - if: unix
            then: test "$(python -m grpc_tools.protoc --version)" == "$(protoc --version)"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: gRPC - A high-performance, open-source universal RPC framework
  description: |
    gRPC is a modern, open source, high-performance remote procedure call
    (RPC) framework that can run anywhere. gRPC enables client and server
    applications to communicate transparently, and simplifies the building
    of connected systems.

    This package contains the gRPC C++ libraries and header files, as well
    as the code generation plugins.
  homepage: https://grpc.io/
  repository: https://github.com/grpc/grpc
  documentation: https://grpc.io/docs/

extra:
  recipe-maintainers:
    - pitrou
    - xhochy
    - wesm
    - h-vetinari
    - mariusvniekerk
    - jjerphan
    - JohanMabille
  feedstock-name: grpc-cpp
