# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyportfolioopt
  version: "1.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyportfolioopt-${{ version }}.tar.gz
  sha256: de5ea1914d6ca6bc83c54a954be123bd9c770275c769d1d70fb8760092cd5e9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools >=78.1.1
  run:
    - python >=${{ python_min }}
    - cvxpy >=1.1.19
    - numpy >=1.26.0
    - pandas >=1.0.0
    - packaging
    - scikit-base <0.14.0
    - scikit-learn >=0.24.1
    - scipy >=1.3
  run_constraints:
    - matplotlib-base >=3.2

tests:
  - python:
      imports:
        - pypfopt
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: Financial portfolio optimization in python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/robertmartin8/PyPortfolioOpt

extra:
  recipe-maintainers:
    - timkpaine
    - atrawog
