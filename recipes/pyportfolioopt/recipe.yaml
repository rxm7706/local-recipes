# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: pyportfolioopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyportfolioopt/pyportfolioopt-${{ version }}.tar.gz
  sha256: de5ea1914d6ca6bc83c54a954be123bd9c770275c769d1d70fb8760092cd5e9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1
  run:
    - python >=${{ python_min }}
    - cvxpy >=1.1.19
    - numpy <3.0.0,>=1.26.0
    - pandas <4.0.0,>=1.0.0
    - scikit-base <0.14.0
    - scikit-learn >=0.24.1
    - scipy >=1.3.0

tests:
  - python:
      imports:
        - pypfopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyportfolioopt.readthedocs.io/en/latest/
  license: MIT
  license_file: LICENSE
  summary: Financial portfolio optimization in python
  description: |
    Financial portfolio optimization in python
  repository: https://github.com/pyportfolio/pyportfolioopt
  documentation: https://pyportfolioopt.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - atrawog

