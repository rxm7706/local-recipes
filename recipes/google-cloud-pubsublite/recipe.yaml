# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.0"

package:
  name: google-cloud-pubsublite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-pubsublite/google_cloud_pubsublite-${{ version }}.tar.gz
  sha256: cc56ca57755e7665a66f0c0025ca923f7bfeb39ba408859ffe87cb840c0e82b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-cloud-pubsub <3.0.0,>=2.10.0
    - grpcio <2.0.0,>=1.38.1
    - grpcio-status <2.0.0,>=1.38.1
    - overrides <8.0.0,>=6.0.1
    - google-api-core !=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,!=2.5.*,!=2.6.*,!=2.7.*,<3.0.0,>=1.33.2
    - proto-plus <2.0.0,>=1.22.3

tests:
  - python:
      imports:
        - google.cloud.pubsublite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/python-pubsublite
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Pubsublite API client library
  description: |
    Google Cloud Pubsublite API client library

extra:
  recipe-maintainers:
    - xylar

