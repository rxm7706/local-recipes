# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.1"

package:
  name: mcp2cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp2cli/mcp2cli-${{ version }}.tar.gz
  sha256: d64917ce080f4d9d264bd9bcf87a65b13363520d86a06c787b994aab13252493

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.5,<0.10.0
  run:
    - python >=${{ python_min }}
    - httpx
    - mcp >=1.0
    - pyyaml

tests:
  - python:
      imports:
        - mcp2cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/knowsuchagency/mcp2cli
  license: MIT
  license_file: LICENSE
  summary: Turn any MCP server or OpenAPI spec into a CLI
  description: |
    Turn any MCP server or OpenAPI spec into a CLI
  repository: https://github.com/knowsuchagency/mcp2cli

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
