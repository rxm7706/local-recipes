# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.2"

package:
  name: objgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/objgraph/objgraph-${{ version }}.tar.gz
  sha256: 00b9f2f40f7422e3c7f45a61c4dafdaf81f03ff0649d6eaec866f01030e51ad8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - objgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mg.pov.lt/objgraph/
  license: MIT
  license_file: LICENSE
  summary: Draws Python object reference graphs with graphviz
  description: |
    Draws Python object reference graphs with graphviz
  repository: https://github.com/mgedmin/objgraph

extra:
  recipe-maintainers:
    - marcelotrevisani

