# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: objgraph
  version: "3.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 4752ca5bcc0e0512e41b8cc4d2780ac2fd3b3eabd03b7e950a5594c06203dfc4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
  run:
    - python-graphviz
    - python

tests:
  - python:
      imports:
        - objgraph
      pip_check: true

about:
  summary: Draws Python object reference graphs with graphviz
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/objgraph
  repository: https://github.com/mgedmin/objgraph
  documentation: https://mg.pov.lt/objgraph

extra:
  recipe-maintainers:
    - marcelotrevisani
