# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.12"

package:
  name: gitdb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gitdb/gitdb-${{ version }}.tar.gz
  sha256: 5ef71f855d191a3326fcfbc0d5da835f26b13fbcba60c32c21091c349ffdb571

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - smmap <6,>=3.0.1

tests:
  - python:
      imports:
        - gitdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gitpython-developers/gitdb
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Git Object Database
  description: |
    Git Object Database

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gitdb
  cfe-upstream-registry: pypi
  cfe-upstream-name: gitdb
