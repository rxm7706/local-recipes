    - pkg:pypi/gitdb@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/gitpython-developers/gitdb
  cfe-import-names: [gitdb]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/gitdb-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-4.0.12

  cfe-forge-blocker-list: []
