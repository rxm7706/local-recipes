# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: qgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qgrid/qgrid-${{ version }}.tar.gz
  sha256: fe8af5b50833084dc0b6a265cd1ac7b837c03c0f8521150163560dce778d711c

build:
  number: 5
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - nbclassic >=0.4.4
    - notebook >=4.0.0
  run:
    - python >=${{ python_min }}
    - nbclassic >=0.4.4
    - notebook >=4.0.0
    - pandas >=0.17.0
    - ipywidgets >=7.0.0,<8

tests:
  - python:
      imports:
        - qgrid
        - qgrid.tests
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Pandas DataFrame viewer for Jupyter Notebook
  description: |
    Qgrid is a Jupyter notebook widget which uses SlickGrid to render pandas DataFrames.
    This allows you to explore your DataFrames with intuitive scrolling, sorting, and
    filtering controls, as well as edit your DataFrames by double clicking cells.
  homepage: https://github.com/quantopian/qgrid
  repository: https://github.com/quantopian/qgrid
  documentation: http://qgrid.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - TimShawver
    - alen12345
    - xhochy
