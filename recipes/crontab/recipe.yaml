# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: crontab
  version: "1.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/crontab-${{ version }}.tar.gz
  sha256: f80e01b4f07219763a9869f926dd17147278e7965a928089bca6d3dc80ae46d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - crontab
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: LGPL-2.1-only
  license_file: LICENSE
  summary: Parse and use crontab schedules in Python
  homepage: https://github.com/josiahcarlson/parse-crontab

extra:
  recipe-maintainers:
    - mcs07
    - sanurielf
