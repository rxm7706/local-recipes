# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.694.25301"

package:
  name: mo-parsing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mo-parsing/mo_parsing-${{ version }}.tar.gz
  sha256: 552d904d2524408ef74609fb2368392664230c8ffdd0ff4ece414d84c0653051

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mo-dots ==10.685.25166
    - mo-future ==7.685.25166

tests:
  - python:
      imports:
        - mo_parsing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/klahnakoski/mo-parsing
  license: MIT
  license_file: LICENSE
  summary: Another PEG Parsing Tool
  description: |
    Another PEG Parsing Tool

extra:
  recipe-maintainers:
    - rxm7706

