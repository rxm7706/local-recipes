# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pdfrw
  version: "0.4"
  sha256: 0dc0494a0e6561b268542b28ede2280387c2728114f117d3bb5d8e4787b93ef4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pdfrw
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: pdfrw is a Python library and utility that reads and writes PDF files
  description: |
    Operations include subsetting, merging, rotating, modifying metadata, etc.
    The fastest pure Python PDF parser available
    Has been used for years by a printer in pre-press production
    Can be used with rst2pdf to faithfully reproduce vector images
    Can be used either standalone, or in conjunction with reportlab to reuse existing PDFs in new ones
  homepage: https://github.com/pmaupin/pdfrw
  repository: https://github.com/pmaupin/pdfrw

extra:
  recipe-maintainers:
    - bryanwweber
