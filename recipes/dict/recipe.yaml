# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.12.3"

package:
  name: dict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dict/dict-${{ version }}.tar.gz
  sha256: 8a14ff62e2a9dff5ef751a2e5eee07715c79ddab6b9ca06c59e73622f80761b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andrewp-as-is/dict.py
  license: Unlicense
  license_file: LICENSE
  summary: dict replacement
  description: |
    dict replacement

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
