# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.13.0"

package:
  name: trulens-eval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trulens-eval/trulens_eval-${{ version }}.tar.gz
  sha256: 5e1b4731aac29a3948d2be2f0b0730d3fddb4cabf89cbc6f7030b6c882926459

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - trulens-core <3.0.0,>=2.0.0
    - trulens-dashboard <3.0.0,>=2.0.0
    - trulens-feedback <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - trulens_eval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://trulens.org/
  license: MIT
  license_file: LICENSE
  summary: Backwards-compatibility package for API of trulens_eval<1.0.0 using API of trulens-*>=1.0.0.
  description: |
    Backwards-compatibility package for API of trulens_eval<1.0.0 using API of trulens-*>=1.0.0.
  repository: https://github.com/truera/trulens
  documentation: https://trulens.org/getting_started/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
