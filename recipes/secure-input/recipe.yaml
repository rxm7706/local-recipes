# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.3"

package:
  name: secure-input
  version: ${{ version }}

source:
  url: https://github.com/SwezyDev/secure_input/archive/refs/tags/${{ version }}.tar.gz
  sha256: 896a9cf8872adeae030a43aaf6c5db9f6aac3db4f50c79051161c3e7a6264c5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - secure_input
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/SwezyDev/secure_input
  license: MIT
  license_file: LICENSE
  summary: Secure Password Input
  description: |
    Secure Password Input

extra:
  recipe-maintainers:
    - rxm7706

