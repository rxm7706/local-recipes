# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: jsonschema-path
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema-path/jsonschema_path-${{ version }}.tar.gz
  sha256: 493b156ba895c97602655b620a8456caa2ce08c1aa389f5a7addec065e6e855c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pyyaml >=5.1
    - attrs >=22.2.0
    - pathable <0.7.0,>=0.6.0
    - referencing <0.38.0

tests:
  - python:
      imports:
        - jsonschema_path
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jsonschema-path/
  license: Apache-2.0
  license_file: LICENSE
  summary: JSONSchema Spec with object-oriented paths
  description: |
    JSONSchema Spec with object-oriented paths
  repository: https://github.com/p1c2u/jsonschema-path

extra:
  recipe-maintainers:
    - bollwyvl

