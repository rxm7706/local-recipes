# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: mcp-server-datahub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server-datahub/mcp_server_datahub-${{ version }}.tar.gz
  sha256: 271960095adc65da2a65b2647f2fa571786c6f355c6c5c71bfa1a7d718f86ef7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - acryl-datahub >=1.3.1.7
    - asyncer >=0.0.8
    - cachetools >=5.0.0
    - fakeredis !=2.35.0
    - fastmcp <4,>=3.2.0
    - jmespath ~=1.0.1
    - loguru
    - pydantic <3,>=2.0
    - json-repair
    - google-re2

tests:
  - python:
      imports:
        - mcp_server_datahub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server-datahub/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Model Context Protocol (MCP) server for DataHub
  description: |
    A Model Context Protocol (MCP) server for DataHub
  repository: https://github.com/acryldata/mcp-server-datahub
  documentation: https://docs.datahub.com/docs/features/feature-guides/mcp

extra:
  recipe-maintainers:
    - rxm7706

