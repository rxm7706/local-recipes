# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: quart
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/Quart/quart-${{ version }}.tar.gz
  sha256: ec05a784151386cf87df51f764825d55f3ac402df4f04fd1dc81faca8897ceda

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - aiofiles
    - blinker >=1.6
    - click >=8.0
    - flask >=3.0
    - hypercorn >=0.11.2
    - itsdangerous
    - jinja2
    - markupsafe
    - werkzeug >=3.0

tests:
  - python:
      imports:
        - quart
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Quart/
  license: MIT
  license_file: LICENSE.txt
  summary: A Python ASGI web framework with the same API as Flask
  description: |
    A Python ASGI web framework with the same API as Flask
  repository: https://github.com/pallets/quart/
  documentation: https://quart.palletsprojects.com

extra:
  recipe-maintainers:
    - maxyme
    - dhirschfeld
    - soapy1

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: quart
  cfe-upstream-registry: pypi
  cfe-upstream-name: quart
