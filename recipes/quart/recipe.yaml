    - pkg:pypi/quart@${{ version }}
  cfe-upstream-repo: https://github.com/pallets/quart/
  cfe-upstream-homepage: https://pypi.org/project/Quart/
  cfe-import-names: [quart]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
