# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.3"

package:
  name: wasabi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wasabi/wasabi-${{ version }}.tar.gz
  sha256: 4bb3008f003809db0c3e28b4daf20906ea871a2bb43f9914197d540f4f2e0878

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions <5.0.0,>=3.7.4.1
    - if: win
      then:
        - colorama

tests:
  - python:
      imports:
        - wasabi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/explosion/wasabi
  license: MIT
  license_file: LICENSE
  summary: A lightweight console printing and formatting toolkit
  description: |
    A lightweight console printing and formatting toolkit

extra:
  recipe-maintainers:
    - conda-forge/spacy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wasabi
  cfe-upstream-registry: pypi
  cfe-upstream-name: wasabi
