# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.10.8"

package:
  name: pyforge-estate-catalog
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: generic
  script:
    - bash ${RECIPE_DIR}/build.sh

requirements:
  build:
    - python >=3.10
    - bmad-builder
    - bmad-creative-intelligence-suite
    - bmad-utility-skills
    - bmad-method-test-architecture-enterprise
  host:
    - python >=3.10
  run:
    - python >=3.10

tests:
  - script:
      - if: not win
        then:
          - pyforge-estate-catalog-install --help
          - test -f "${CONDA_PREFIX}/share/pyforge-estate-catalog/.claude-plugin/marketplace.json"
          - test -d "${CONDA_PREFIX}/share/pyforge-estate-catalog/plugins"
      - if: win
        then:
          - pyforge-estate-catalog-install.bat --help
          - if not exist "%CONDA_PREFIX%\\share\\pyforge-estate-catalog\\.claude-plugin\\marketplace.json" exit 1

about:
  homepage: https://github.com/rxm7706/local-recipes
  repository: https://github.com/rxm7706/local-recipes
  license: MIT
  summary: Vendored PyForge estate BMAD catalog snapshot for air-gapped installs (SelfExplainML channel)
  description: |
    pyforge-estate-catalog packages the vendored BMAD marketplace snapshot produced by
    ``steward catalog ship``: local plugin trees under ``plugins/`` and a
    ``.claude-plugin/marketplace.json`` that does not require github.com at install time.

    After installation, run ``pyforge-estate-catalog-install`` or point
    ``bmad-method install --custom-source`` at ``$CONDA_PREFIX/share/pyforge-estate-catalog``.

extra:
  recipe-maintainers:
    - rxm7706

