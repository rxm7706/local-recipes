# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: jupyterlab-github
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-github/jupyterlab_github-${{ version }}.tar.gz
  sha256: fab84e981684753f35bc5b55f8e84a30ffbe5b642d7b2d2721e4a048896afa54

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version
    - jupyterlab >=4.0.0,<5
    - pip
    - python ${{ python_min }}
  run:
    - jupyterlab >=4.0.0,<5
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_github
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - if: win
          then: m2-grep
        - python ${{ python_min }}
    script:
      - jupyter labextension list
      - jupyter labextension list 1>labextensions 2>&1
      - grep -iE "@jupyterlab/github.*OK.*jupyterlab_github" labextensions
      - jupyter server extension list
      - jupyter server extension list 1>server_extensions 2>&1
      - grep -iE "jupyterlab_github.*OK" server_extensions

about:
  summary: JupyterLab viewer for GitHub repositories
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jupyterlab/jupyterlab-github

extra:
  recipe-maintainers:
    - bollwyvl
