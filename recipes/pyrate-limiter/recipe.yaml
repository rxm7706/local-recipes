# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyrate-limiter
  version: "4.4.0"
  hash_val: 2c0c720c4fa16c5d8199e4821bf34507fb49c007a25b786cec6fb94ffd0844aa

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ hash_val }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cover = scripts:cover
      - lint = scripts:lint
      - test = scripts:test

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyrate_limiter
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}

about:
  summary: Python rate limiter using Leaky-Bucket Algorithm Family
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vutran1710/PyrateLimiter
  repository: https://github.com/vutran1710/PyrateLimiter
  documentation: https://github.com/vutran1710/PyrateLimiter

extra:
  recipe-maintainers:
    - jwcook
