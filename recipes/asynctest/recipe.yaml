# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: asynctest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asynctest/asynctest-${{ version }}.tar.gz
  sha256: c27862842d15d83e6a34eb0b2866c323880eb3a75e4485b079ea11748fd77fac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asynctest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Martiusweb/asynctest/
  license: Apache-2.0
  license_file: LICENSE
  summary: Enhance the standard unittest package with features for testing asyncio libraries
  description: |
    Enhance the standard unittest package with features for testing asyncio libraries

extra:
  recipe-maintainers:
    - hodgsonw
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: asynctest
  cfe-upstream-registry: pypi
  cfe-upstream-name: asynctest
  cfe-purls:
    - pkg:conda/asynctest@${{ version }}?channel=conda-forge
    - pkg:pypi/asynctest@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/Martiusweb/asynctest/
  cfe-import-names: [asynctest]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/asynctest-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.13.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

