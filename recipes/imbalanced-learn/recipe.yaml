# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.2"

package:
  name: imbalanced-learn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imbalanced-learn/imbalanced_learn-${{ version }}.tar.gz
  sha256: f80ce7eafbcece8686e32571bd12978546c729c3f277215bead61a906ce9afe4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=71
  run:
    - python >=${{ python_min }}
    - numpy <3,>=1.25.2
    - scipy <2,>=1.11.4
    - scikit-learn <2,>=1.4.2
    - sklearn-compat <0.2,>=0.1.6
    - joblib <2,>=1.2.0
    - threadpoolctl <4,>=2.0.0

tests:
  - python:
      imports:
        - imblearn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://imbalanced-learn.org/
  license: MIT
  license_file: LICENSE
  summary: Toolbox for imbalanced dataset in machine learning
  description: |
    Toolbox for imbalanced dataset in machine learning
  repository: https://github.com/scikit-learn-contrib/imbalanced-learn

extra:
  recipe-maintainers:
    - glemaitre

