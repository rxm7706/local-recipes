# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.1.0"

package:
  name: aiofiles
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiofiles/aiofiles-${{ version }}.tar.gz
  sha256: a8d728f0a29de45dc521f18f07297428d56992a742f0cd2701ba86e44d23d5b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiofiles
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/aiofiles/
  license: Apache-2.0
  license_file: LICENSE
  summary: File support for asyncio.
  description: |
    File support for asyncio.
  repository: https://github.com/Tinche/aiofiles

extra:
  recipe-maintainers:
    - xylar
    - kszucs
    - carlodri

#### CFE metadata AND comments
