# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: nixtlats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nixtlats/nixtlats-${{ version }}.tar.gz
  sha256: e6d1938bbb27c4792567f8fea39919e775e6a41c9ed68e6e343840064655d6b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx
    - pandas
    - pydantic
    - requests
    - tenacity
    - utilsforecast >=0.1.7

tests:
  - python:
      imports:
        - nixtlats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Nixtla/nixtla
  license: MIT
  license_file: LICENSE
  summary: Python SDK for Nixtla API (TimeGPT)
  description: |
    Python SDK for Nixtla API (TimeGPT)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
