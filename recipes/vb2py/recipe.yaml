# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: vb2py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vb2Py/vb2Py-${{ version }}.tar.gz
  sha256: 8eedc96d380d869ef09ac1e61a9110be6fb4731b39120a5411db12b865f22c77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mako
    - chardet
    - flask
    - flask_cors
    - simpleparse
    - docutils

tests:
  - python:
      imports:
        - vb2py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://vb2py.sourceforge.net
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Visual Basic to Python Converter
  description: |
    Visual Basic to Python Converter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
