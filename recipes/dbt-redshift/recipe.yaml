# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.1"

package:
  name: dbt-redshift
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-redshift/dbt_redshift-${{ version }}.tar.gz
  sha256: 9921457b139efa694e74c6c6c316daa56bb2034e65c1699faada8ae8297ab800

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
  run:
    - requests
    - python >=${{ python_min }}
    # via Grayskull
    - dbt-common >=1.10,<2.0
    - dbt-adapters >=1.24.1,<2.0
    - dbt-postgres >=1.10.0rc1,<2.0
    - redshift_connector >=2.1.8,<2.2
    - dbt-core >=1.8.0b3,<2.0
    - sqlparse >=0.5.0,<0.7.0
    - agate

tests:
  - python:
      imports:
        - dbt
        - dbt.adapters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The Redshift adapter plugin for dbt
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/dbt-labs/dbt-redshift

extra:
  recipe-maintainers:
    - rxm7706
    - maresb
    - thewchan

#### CFE metadata AND comments
