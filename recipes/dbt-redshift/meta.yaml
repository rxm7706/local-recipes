{% set name = "dbt-redshift" %}
{% set version = "1.11.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9921457b139efa694e74c6c6c316daa56bb2034e65c1699faada8ae8297ab800

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - requests
    - python >={{ python_min }}
    # via Grayskull
    - dbt-common >=1.10,<2.0
    - dbt-adapters >=1.24.1,<2.0
    - dbt-postgres >=1.10.0rc1,<2.0
    - redshift_connector >=2.1.8,<2.2
    - dbt-core >=1.8.0b3,<2.0
    - sqlparse >=0.5.0,<0.7.0
    - agate

test:
  imports:
    - dbt
    - dbt.adapters
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dbt-labs/dbt-redshift
  summary: The Redshift adapter plugin for dbt
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - rxm7706
    - maresb
    - thewchan
