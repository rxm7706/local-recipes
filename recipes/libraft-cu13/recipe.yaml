# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: libraft-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libraft-cu13/libraft_cu13-26.8.0-py3-none-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: a122d60168d2e0cfa672415f8efa87c486061de5c3301a5a3353f37da43c906c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-toolkit ==13.*
    - librmm-cu13 ==26.8.*
    - nvidia-nccl-cu13 >=2.19
    - nvidia-nvjitlink <14,>=13.3
    - rapids-logger ==0.2.*

tests:
  - python:
      imports:
        - libraft_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/raft
  license: Apache-2.0
  license_file: LICENSE
  summary: RAFT: Reusable Algorithms Functions and other Tools (C++)
  description: |
    RAFT: Reusable Algorithms Functions and other Tools (C++)
  documentation: https://docs.rapids.ai/api/raft/stable/

extra:
  recipe-maintainers:
    - rxm7706

