# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sparktorch
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sparktorch-${{ version }}.tar.gz
  sha256: e31026a95846e7869d08de6e60c3e170eaf4c2c052d709bd2200977c0ec5f317

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.11
    - pytorch >=1.3.0
    - flask
    - requests
    - dill
    - pyspark >=2.4.4

tests:
  - python:
      imports:
        - sparktorch
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Deep learning on Apache Spark with Pytorch
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/dmmiller612/sparktorch

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
