# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: liboqs-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/liboqs-python/liboqs_python-${{ version }}.tar.gz
  sha256: ee01445ccfbeab8dced956a642ce1eb5ba69438caba7ec291eea14083627d5c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - tomli >=2

tests:
  - python:
      imports:
        - oqs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-quantum-safe/liboqs-python
  license: MIT
  license_file: LICENSE
  summary: Python bindings for liboqs, providing post-quantum public key cryptography algorithms
  description: |
    Python bindings for liboqs, providing post-quantum public key cryptography algorithms

extra:
  recipe-maintainers:
    - rxm7706

