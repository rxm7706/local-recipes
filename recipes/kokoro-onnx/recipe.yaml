# CFE comments
# Header:
#    # Head of a four-package chain, none of which was on conda-forge:
#    #   espeak-ng (C engine) <- espeakng-loader <- phonemizer <- kokoro-onnx
#    # The ASR side of the same stack needs nothing: mlx 0.32.0,
#    # parakeet-mlx 0.5.2 and onnx-asr 0.12.0 are all already on conda-forge
#    # (verified 2026-09-07), and mlx ships linux-64/aarch64/osx-64/osx-arm64,
#    # not Apple Silicon only.
# context:
#    # NO upper python bound, deliberately, despite upstream's
#    # `requires-python = ">=3.10,<3.14"`. That cap is upstream conservatism,
#    # not an ecosystem limit, and it was tested rather than assumed:
#    # onnxruntime and numpy both ship py3.14 builds on conda-forge, and a
#    # real synthesis run on 3.14.7 produced output byte-identical to the
#    # same run on the upstream-supported 3.12.14 -- 24 kHz, 50,688 samples,
#    # 2.11 s, peak 0.837. Mirroring the cap would make this package
#    # uninstallable in 28 of the estate's 30 environments, all of which are
#    # python 3.14, for no measured reason.
#    # requires-python lives in wheel metadata and is NOT enforced by
#    # pip check, so no source patch is needed for this (contrast G26, where
#    # a loosened `==` pin does have to be patched into the source).
# requirements:
#    # espeakng-loader is a HARD dependency, not an optional accelerator:
#    # kokoro_onnx/tokenizer.py imports it at module scope, so it cannot be
#    # dropped even though this recipe's espeak-ng arrives via phonemizer.
#    # The conda espeakng-loader in this repo resolves to the prefix's
#    # espeak-ng rather than a bundled binary -- see that recipe for why the
#    # upstream wheel is unusable.
# tests:
#    # Constructing Tokenizer() and phonemizing is the real gate. A stock
#    # `pip install kokoro-onnx` imports perfectly and then dies at exactly
#    # this step with
#    #   Error processing file '/home/runner/.../phontab': No such file...
#    # because the PyPI espeakng-loader wheel's bundled library has its data
#    # path compiled in as upstream's CI build tree. An imports-only test
#    # would have shipped that silently.
#    # Synthesis is NOT tested: the weights are a 311 MB kokoro-v1.0.onnx
#    # plus a 27 MB voices-v1.0.bin, downloaded separately by the user. A
#    # `kokoro-onnx-models` package would be the way to make those
#    # conda-installable too, on the pattern used for the playwright
#    # browsers in this repo; not attempted here.
####
