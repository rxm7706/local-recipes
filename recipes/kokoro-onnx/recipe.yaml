# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: kokoro-onnx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kokoro-onnx/kokoro_onnx-${{ version }}.tar.gz
  sha256: 7bbdb66dd53775f71088a99999a9aefdad240740daf54cb09410d8bb1e294e35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - espeakng-loader >=0.2.4
    - numpy >=2.0.2
    - onnxruntime >=1.20.1
    - phonemizer >=3.4.0

tests:
  - python:
      imports:
        - kokoro_onnx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # The Tokenizer constructor is where espeak is wired up, and it is the
      # step that fails on a stock pip install. Constructing it proves the
      # whole chain (kokoro-onnx -> espeakng-loader -> espeak-ng) resolves.
      # Model weights are NOT shipped (311 MB, see the CFE comments), so
      # synthesis itself cannot be tested here.
      - python -c "from kokoro_onnx import Kokoro; print('Kokoro importable')"
      - python -c "from kokoro_onnx.tokenizer import Tokenizer; t=Tokenizer(); print('espeak wired OK')"
      - python -c "from kokoro_onnx.tokenizer import Tokenizer; p=Tokenizer().phonemize('hello world', lang='en-us'); print('phonemes:', p); assert p.strip()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/thewh1teagle/kokoro-onnx
  repository: https://github.com/thewh1teagle/kokoro-onnx
  documentation: https://github.com/thewh1teagle/kokoro-onnx#readme
  summary: TTS with Kokoro and the ONNX runtime
  description: |
    kokoro-onnx runs the Kokoro text-to-speech model through onnxruntime,
    producing 24 kHz audio with a choice of voices and languages, on CPU or
    GPU.

    The model weights are NOT part of this package -- they are hundreds of
    megabytes and the choice of variant is yours -- but they no longer need a
    manual download. Install one alongside:

        kokoro-onnx-models        f32    311 MB   most accurate, fastest on CPU
        kokoro-onnx-models-fp16   fp16   169 MB   ~half the size, same speed
        kokoro-onnx-models-int8   int8    88 MB   smallest, but slower on CPU

    Each pulls in `kokoro-onnx-voices`, which carries the shared voice
    embeddings and a resolver, so nothing has to be located by hand:

        from kokoro_onnx import Kokoro
        from kokoro_onnx_models import get_model_path, get_voices_path

        kokoro = Kokoro(get_model_path(), get_voices_path())
        samples, sample_rate = kokoro.create("Hello world", voice="af_sarah")

    `get_model_path()` returns the highest-precision variant installed;
    `get_model_path("int8")` selects one explicitly. The variants co-install.

    Passing your own paths still works, so weights fetched from the upstream
    release are unaffected:

        kokoro = Kokoro("kokoro-v1.0.onnx", "voices-v1.0.bin")

    Phonemisation goes through `phonemizer` and the `espeak-ng` engine, both
    of which install as dependencies, so no system eSpeak is required.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

