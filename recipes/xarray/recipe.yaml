# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.0"

package:
  name: xarray
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xarray/xarray-${{ version }}.tar.gz
  sha256: 361b495928fdbf5b58d0969bb6775339019da5e93ca74d61ddf4eb5edd6ce604

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - packaging >=24.2
    - pandas >=2.2

tests:
  - python:
      imports:
        - xarray
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://xarray.dev/
  license: Apache-2.0
  license_file: LICENSE
  summary: N-D labeled arrays and datasets in Python
  description: |
    N-D labeled arrays and datasets in Python
  documentation: https://docs.xarray.dev

extra:
  recipe-maintainers:
    - jhamman
    - ocefpaf
    - shoyer
    - dcherian
    - keewis
    - TomNicholas
    - kmuehlbauer

