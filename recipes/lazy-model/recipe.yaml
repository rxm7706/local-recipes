# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: lazy-model
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lazy-model/lazy-model-${{ version }}.tar.gz
  sha256: a851d85d0b518b0b9c8e626bbee0feb0494c0e0cb5636550637f032dbbf9c55f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pydantic >=1.9.0

tests:
  - python:
      imports:
        - lazy_model
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/lazy-model/
  license: Apache-2.0
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - awvwgk
    - marcelotrevisani

