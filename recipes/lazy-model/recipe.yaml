# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lazy-model
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lazy-model-${{ version }}.tar.gz
  sha256: a851d85d0b518b0b9c8e626bbee0feb0494c0e0cb5636550637f032dbbf9c55f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=1.9.0

tests:
  - python:
      imports:
        - lazy_model
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: This library provides a lazy interface for parsing objects from dictionaries. During the parsing, it saves the raw data inside the object and parses each field on demand.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/lazy-model/

extra:
  recipe-maintainers:
    - awvwgk
    - marcelotrevisani
