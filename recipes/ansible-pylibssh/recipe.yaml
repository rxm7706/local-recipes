# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: ansible-pylibssh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-pylibssh/ansible_pylibssh-${{ version }}.tar.gz
  sha256: a48b5e6db21062bc6258548e6a3e4363043d40128f0e6b796774a59b6a7dbe82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - expandvars
    - setuptools >=45
    - tomli
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylibsshext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/pylibssh
  license: LGPLv2+
  license_file: LICENSE
  summary: Python bindings for libssh client specific to Ansible use case
  description: |
    Python bindings for libssh client specific to Ansible use case
  repository: https://github.com/ansible/pylibssh

extra:
  recipe-maintainers:
    - rxm7706

