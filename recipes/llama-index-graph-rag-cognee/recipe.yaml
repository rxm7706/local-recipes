# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: llama-index-graph-rag-cognee
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-graph-rag-cognee/llama_index_graph_rag_cognee-${{ version }}.tar.gz
  sha256: 692fd9436483988aaf594bc93842fe9720e8578e6e39f4a1506531f543fb4f5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cognee
    - httpx ~=0.27.0
    - llama-index-core <0.14,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.graph_rag.cognee
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-graph-rag-cognee/
  license: MIT
  license_file: LICENSE
  summary: llama-index graph rag cognee integration
  description: |
    llama-index graph rag cognee integration

extra:
  recipe-maintainers:
    - rxm7706

