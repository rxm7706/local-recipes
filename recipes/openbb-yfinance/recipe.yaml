# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.3"

package:
  name: openbb-yfinance
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-yfinance/openbb_yfinance-${{ version }}.tar.gz
  sha256: b25bc0fe17552f2331c771f9f91ab66c138e7bb54b07af282381dec2c273bd5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-core <2.0.0,>=1.6.10
    - yfinance <2.0.0,>=1.4.0

tests:
  - python:
      imports:
        - openbb_yfinance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-yfinance/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: yfinance extension for OpenBB
  description: |
    yfinance extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

