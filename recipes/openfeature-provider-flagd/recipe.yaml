# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: openfeature-provider-flagd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openfeature-provider-flagd/openfeature_provider_flagd-${{ version }}.tar.gz
  sha256: f6a3f9b9873923f0ba8cae10248f3503e1f6929b5b60909f54677cdb8868f4b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-protobuf
    - grpcio-tools 1.82.1.*
    - mypy-protobuf >=3,<4
    - protobuf >=7.35.1,<8.0.0
  run:
    - python >=${{ python_min }}
    - cachebox >=5.1.0,<6.0.0
    - grpcio >=1.82.1
    - openfeature-flagd-core >=2.0.0,<3
    - openfeature-sdk >=0.8.2
    - protobuf >=7.35.1,<8.0.0
    - pyyaml >=6.0.1

tests:
  - python:
      imports:
        - openfeature.contrib.provider.flagd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-feature/python-sdk-contrib
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenFeature provider for the flagd flag evaluation engine
  description: |
    OpenFeature provider for the flagd flag evaluation engine

extra:
  recipe-maintainers:
    - rxm7706
    - jsmolic

#### CFE metadata AND comments
