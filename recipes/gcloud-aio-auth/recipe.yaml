# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.5.0"

package:
  name: gcloud-aio-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcloud-aio-auth/gcloud_aio_auth-${{ version }}.tar.gz
  sha256: 56c3fef31dec6f3841f5eb0c79faf9a1cd3e475fa2c7a194bf516226aa39fd18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - aiohttp <4.0.0,>=3.9.2
    - chardet <8.0,>=2.0
    - cryptography <52.0.0,>=2.0.0
    - pyjwt <3.0.0,>=1.5.3
    - tenacity <10.0.0,>=8.2.0

tests:
  - python:
      imports:
        - gcloud.aio.auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gcloud-aio-auth/
  license: MIT
  license_file: LICENSE
  summary: Python Client for Google Cloud Auth
  description: |
    Python Client for Google Cloud Auth
  repository: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar

