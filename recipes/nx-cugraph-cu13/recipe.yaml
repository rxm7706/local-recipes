# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: nx-cugraph-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nx-cugraph-cu13/nx_cugraph_cu13-26.8.0-py3-none-any.whl
  sha256: ab19a1671b1cfa540b7eca90d1bba1986d350b2cbefd6535ef6b6e058c3821e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cupy-cuda13x !=14.1.0,>=14.0.1
    - networkx >=3.2
    - numpy <3.0,>=2.0
    - pylibcugraph-cu13 ==26.8.*

tests:
  - python:
      imports:
        - nx_cugraph_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/nx-cugraph
  license: Apache-2.0
  license_file: LICENSE
  summary: cugraph backend for NetworkX
  description: |
    cugraph backend for NetworkX
  documentation: https://docs.rapids.ai/api/cugraph/stable/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
