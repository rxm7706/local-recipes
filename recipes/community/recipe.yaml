    - pkg:pypi/community@${{ version }}
  cfe-upstream-repo: https://github.com/ewdurbin/community
  cfe-upstream-homepage: https://github.com/ewdurbin/community
  cfe-import-names: [community]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
