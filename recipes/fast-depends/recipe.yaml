# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fast-depends
  version: "3.0.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fast_depends-${{ version }}.tar.gz
  sha256: 896b16f79a512b6ea1df721b0aa1708a192a06f964be6597e01fcf5412559101

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.2
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=1.7.4,!=1.8,!=1.8.1,<3.0.0
    - anyio >=4.0.0,<5.0.0
    - msgspec

tests:
  - python:
      imports:
        - fast_depends
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: FastDepends - extracted and cleared from HTTP domain logic FastAPI Dependency Injection System. Async and sync are both supported.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Lancetnik/FastDepends
  repository: https://github.com/Lancetnik/FastDepends
  documentation: https://lancetnik.github.io/FastDepends/

extra:
  recipe-maintainers:
    - carlodri
