# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"
  python_min: "3.12"

package:
  name: gepa-adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gepa-adk/gepa_adk-${{ version }}.tar.gz
  sha256: 5bdb6f9901342f111474070c4aae033f03aa10a25bb38f3a00f4d78ce327529c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.22,<0.11.0
  run:
    - python >=${{ python_min }}
    - google-adk >=1.20.0
    - litellm >=1.80.13
    - nest-asyncio >=1.6.0
    - structlog >=25.5.0

tests:
  - python:
      imports:
        - gepa_adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Alberto-Codes/gepa-adk
  license: Apache-2.0
  license_file: LICENSE
  summary: Evolutionary optimization for Google ADK agents
  description: |
    Evolutionary optimization for Google ADK agents
  repository: https://github.com/Alberto-Codes/gepa-adk
  documentation: https://alberto-codes.github.io/gepa-adk/

extra:
  recipe-maintainers:
    - rxm7706

