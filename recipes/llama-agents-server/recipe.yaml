# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: llama-agents-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-agents-server/llama_agents_server-${{ version }}.tar.gz
  sha256: 9135dce3db6d1ac7a83608a8c71584fd38d742a89e31f848686f87ecc86f0c7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.6,<0.10.0
  run:
    - python >=${{ python_min }}
    - llama-index-workflows <3.0.0,>=2.21.0
    - llama-agents-client >=0.2.0
    - starlette >=0.39.0
    - uvicorn >=0.32.0
    - httpx >=0.27.0

tests:
  - python:
      imports:
        - llama_agents.server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-agents-server/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: HTTP server for deploying and serving LlamaIndex workflows as web services
  description: |
    HTTP server for deploying and serving LlamaIndex workflows as web services

extra:
  recipe-maintainers:
    - rxm7706

