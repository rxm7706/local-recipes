schema_version: 1

context:
  version: "1.0.0"

package:
  name: addonfactory_splunk_conf_parser_lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/addonfactory_splunk_conf_parser_lib/addonfactory_splunk_conf_parser_lib-${{ version }}.tar.gz
  sha256: 8254b5ea6fc8233da7527dc80461aa5b0555dfa3af73b8b937af26129f32323d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.0.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - addonfactory_splunk_conf_parser_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/splunk/addonfactory-splunk-conf-parser-lib
  license: Apache-2.0
  license_file: LICENSE
  summary: Splunk .conf files parser
  description: |
    Splunk .conf files parser
  repository: https://github.com/splunk/addonfactory-splunk-conf-parser-lib

extra:
  recipe-maintainers:
    - rxm7706

