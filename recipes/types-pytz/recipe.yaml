schema_version: 1

context:
  version: "2026.3.1.20260727"

package:
  name: types-pytz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-pytz/types_pytz-2026.3.1.20260727-py3-none-any.whl
  sha256: 42ac44e83645bfceb46597342c8fb8ec028a1407e2feae9c5c539986eab6b57a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_pytz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for pytz
  description: |
    Typing stubs for pytz
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy

