# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.6.0"

package:
  name: requests-ntlm2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-ntlm2/requests_ntlm2-${{ version }}.tar.gz
  sha256: 85485a5c245e2e667bc0d01cb0baa46a96e1b55396a360bdda3b3219a95f6dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.0.0
    - ntlm-auth >=1.0.2
    - cryptography >=1.3

tests:
  - python:
      imports:
        - requests_ntlm2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dopstar/requests-ntlm2
  license: ISC
  license_file: LICENSE
  summary: The HTTP NTLM proxy and/or server authentication library.
  description: |
    The HTTP NTLM proxy and/or server authentication library.
  repository: https://github.com/dopstar/requests-ntlm2
  documentation: https://dopstar.github.io/requests-ntlm2

extra:
  recipe-maintainers:
    - rxm7706

