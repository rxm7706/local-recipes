# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.13"

package:
  name: selectolax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/selectolax/selectolax-${{ version }}.tar.gz
  sha256: 261116b1b13efbec5cc0252baeca3a85098e96ef5c088bf3ef8cfbe15d3a8ea3

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: python
  host:
    - cython
    - pip
    - python
    - setuptools
  run:
    - cython ==3.0.11
    - python

tests:
  - python:
      imports:
        - selectolax
      pip_check: true

about:
  summary: Fast HTML5 parser with CSS selectors.
  license: Apache-2.0 AND LGPL-2.1-only AND MIT
  license_file:
    - LICENSE
    - lexbor/LICENSE
    - lexbor/NOTICE
    - modest/LICENSE
  homepage: https://github.com/rushter/selectolax
  documentation: https://selectolax.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706
    - soapy1

#### CFE metadata AND comments
