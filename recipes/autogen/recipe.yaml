# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.1"

package:
  name: autogen
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autogen/autogen-${{ version }}.tar.gz
  sha256: befc6b0a148e3773c6b6a5ebe1c7d098f9eee5ca803c40bcf211b000e188cee2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio <5.0.0,>=4.0.0
    - fast-depends <4.0.0,>=3.0.8
    - httpx <1,>=0.28.1
    - packaging
    - pydantic <3,>=2.6.1
    - python-dotenv
    - pyyaml >=6.0.2
    - termcolor
    - tiktoken

tests:
  - python:
      imports:
        - autogen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ag2.ai/
  license: Apache-2.0
  license_file: LICENSE
  summary: A programming framework for agentic AI
  description: |
    A programming framework for agentic AI
  repository: https://github.com/ag2ai/ag2classic
  documentation: https://docs.ag2.ai

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: autogen
  cfe-upstream-registry: pypi
  cfe-upstream-name: autogen
  cfe-purls:
    - pkg:conda/autogen@${{ version }}?channel=conda-forge
    - pkg:pypi/autogen@${{ version }}
  cfe-upstream-repo: https://github.com/ag2ai/ag2classic
  cfe-upstream-homepage: https://ag2.ai/
  cfe-import-names: [autogen]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
