# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: azure-loganalytics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-loganalytics/azure-loganalytics-0.1.1.zip
  sha256: 68ffb9a2206e06b9672100a8e6351cc04f75bb81867f30d416c68b55d624d793

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - msrest
    - azure-common
    - azure-nspkg

tests:
  - python:
      imports:
        - azure_loganalytics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Log Analytics Client Library for Python
  description: |
    Microsoft Azure Log Analytics Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

