# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fpdf
  version: "1.7.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/fpdf-${{ version }}.tar.gz
  sha256: 125840783289e7d12552b1e86ab692c37322e7a65b96a99e0ea86cca041b6779

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3
  run:
    - python >=3

tests:
  - python:
      imports:
        - fpdf
      pip_check: true

about:
  summary: Simple PDF generation for Python
  license: LGPLLR
  license_file: LICENSE
  homepage: https://github.com/reingart/pyfpdf

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
