# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"

package:
  name: fpdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fpdf/fpdf-${{ version }}.tar.gz
  sha256: 125840783289e7d12552b1e86ab692c37322e7a65b96a99e0ea86cca041b6779

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fpdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/pyfpdf
  license: LGPLv3+
  license_file: LICENSE
  summary: Simple PDF generation for Python
  description: |
    Simple PDF generation for Python

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fpdf
  cfe-upstream-registry: pypi
  cfe-upstream-name: fpdf
