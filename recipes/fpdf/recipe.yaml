    - pkg:pypi/fpdf@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://code.google.com/p/pyfpdf
  cfe-import-names: [fpdf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/fpdf-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.2

  cfe-forge-blocker-list: []
