# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: launchdarkly-eventsource
  version: "1.7.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/launchdarkly_eventsource-${{ version }}.tar.gz
  sha256: 6e17aaf4a51838267e70e2b041f28e392157b09dc03e654b043e1add3c1944f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - urllib3 >=1.26.0,<3

tests:
  - python:
      imports:
        - ld_eventsource
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: LaunchDarkly SSE Client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://docs.launchdarkly.com/sdk/server-side/python
  repository: https://github.com/launchdarkly/python-eventsource

extra:
  recipe-maintainers:
    - xhochy
