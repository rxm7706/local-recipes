# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.75.0"

package:
  name: apache-beam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-beam/apache_beam-${{ version }}.tar.gz
  sha256: e8d5964b5a0dd706f0e50ed1af971219390ed7477cf644268aed058cd7d1e820

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel >=0.36.0
    - grpcio-tools ==1.62.1
    - 3.13
  run:
    - python >=${{ python_min }}
    - cryptography <48.0.0,>=39.0.0
    - envoy-data-plane <0.3.0
    - fastavro <2,>=0.23.6
    - fasteners <1.0,>=0.3
    - grpcio !=1.48.0,!=1.59.*,!=1.60.*,!=1.61.*,!=1.62.0,!=1.62.1,!=1.66.*,!=1.67.*,!=1.68.*,!=1.69.*,!=1.70.*,<2,>=1.33.1
    - httplib2 <0.32.0,>=0.8
    - jsonpickle <5.0.0,>=3.0.4
    - numpy <2.5.0,>=1.14.3
    - objsize <0.8.0,>=0.6.1
    - packaging >=22.0
    - pillow <13,>=12.1.1
    - pymongo <5.0.0,>=3.8.0
    - proto-plus <2,>=1.7.1
    - protobuf !=4.0.*,!=4.21.*,!=4.22.0,!=4.23.*,!=4.24.*,<7.0.0.dev0,>=3.20.3
    - python-dateutil <3,>=2.8.0
    - pytz >=2018.3
    - requests <3.0.0,>=2.32.4
    - sortedcontainers >=2.4.0
    - typing_extensions >=3.7.0
    - zstandard <1,>=0.18.0
    - pyyaml <7.0.0,>=3.12
    - beartype <0.23.0,>=0.21.0
    - pyarrow <24.0.0,>=6.0.1
    - pyarrow-hotfix <1

tests:
  - python:
      imports:
        - apache_beam
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://beam.apache.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Apache Beam SDK for Python
  description: |
    Apache Beam SDK for Python

extra:
  recipe-maintainers:
    - sodre
    - aaltay
    - xylar

#### CFE metadata AND comments
