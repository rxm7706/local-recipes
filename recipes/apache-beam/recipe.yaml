# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: apache-beam
  version: "2.75.0"
  noarch_build: linux and x86_64 and python == ${{ python_min }}

recipe:
  name: ${{ name }}-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_beam-${{ version }}.tar.gz
  sha256: e8d5964b5a0dd706f0e50ed1af971219390ed7477cf644268aed058cd7d1e820

build:
  skip: win or python >= "3.15"
  number: 0

outputs:
  - package:
      name: ${{ name }}
    build:
      script:
        # envoy-data-plane (and its betterproto2 dep) are not available on
        # conda-forge. It is only used by the optional EnvoyRateLimiter
        # (apache_beam.io.components.rate_limiter), whose import Beam already
        # guards with try/except, so removing it here only disables that one
        # feature and lets `pip check` pass.
        # Use -i.bak (portable across GNU/BSD sed; macOS's BSD sed rejects a
        # bare -i) and clean up the backup afterwards.
        - sed -i.bak '/envoy-data-plane/d' setup.py
        - rm -f setup.py.bak
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - cython >=3.2.5,<4
            - pyyaml >=3.12,<7.0.0
            - jinja2 >=2.7.1,<4.0.0
            - yapf ==0.43.0
            - numpy >=1.14.3,<2.5.0
            - if: python < "3.13"
              then: grpcio-tools ==1.62.1
        - if: build_platform != target_platform and python >= "3.13"
          then: grpcio-tools ==1.71.0
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        # osx-arm64 seems to need this for some reason
        - ${{ compiler('cxx') }}
      host:
        - python
        - setuptools
        - if: python < "3.13"
          then: grpcio-tools ==1.62.1
          else: grpcio-tools ==1.71.0
        - mypy-protobuf ==3.5.0
        - distlib ==0.4.2
        - cython >=3.2.5,<4
        - pyyaml >=3.12,<7.0.0
        - jinja2 >=2.7.1,<4.0.0
        - yapf ==0.43.0
        - numpy >=1.14.3,<2.5.0
        - pip
      run:
        - python
        - cryptography >=39.0.0,<48.0.0
        - fastavro >=0.23.6,<2
        - fasteners >=0.3,<1.0
        - grpcio >=1.33.1,<2,!=1.48.0,!=1.59.*,!=1.60.*,!=1.61.*,!=1.62.0,!=1.62.1,!=1.66.*,!=1.67.*,!=1.68.*,!=1.69.*,!=1.70.*
        - httplib2 >=0.8,<0.32.0
        - jsonpickle >=3.0.4,<5.0.0
        - numpy >=1.14.3,<2.5.0
        - objsize >=0.6.1,<0.8.0
        - packaging >=22.0
        - pillow >=12.1.1,<13
        - pymongo >=3.8.0,<5.0.0
        - proto-plus >=1.7.1,<2
        - protobuf >=3.20.3,<7.0.0.dev0,!=4.0.*,!=4.21.*,!=4.22.0,!=4.23.*,!=4.24.*
        - python-dateutil >=2.8.0,<3
        - pytz >=2018.3
        - requests >=2.24.0,<3.0.0
        - sortedcontainers >=2.4.0
        - typing-extensions >=3.7.0
        - zstandard >=0.18.0,<1
        - pyyaml >=3.12,<7.0.0
        - beartype >=0.21.0,<0.23.0
        - pyarrow >=6.0.1,<24.0.0
        - pyarrow-hotfix <1
    tests:
      - python:
          imports:
            - apache_beam
            - apache_beam.coders
            - apache_beam.examples.complete.game
            - apache_beam.examples.complete.juliaset
            - apache_beam.examples.complete.juliaset.juliaset
            - apache_beam.examples.cookbook
            - apache_beam.examples.flink
            - apache_beam.examples.snippets
            - apache_beam.internal
            - apache_beam.internal.gcp
            - apache_beam.io
            - apache_beam.io.flink
            - apache_beam.io.gcp
            - apache_beam.io.gcp.datastore
            - apache_beam.io.gcp.internal
            - apache_beam.io.gcp.tests
            - apache_beam.metrics
            - apache_beam.options
            - apache_beam.portability
            - apache_beam.portability.api
            - apache_beam.runners
            - apache_beam.runners.dataflow
            - apache_beam.runners.direct
            - apache_beam.runners.interactive
            - apache_beam.runners.interactive.display
            - apache_beam.runners.job
            - apache_beam.runners.portability
            - apache_beam.runners.test
            - apache_beam.runners.worker
            - apache_beam.testing
            - apache_beam.testing.benchmarks
            - apache_beam.testing.benchmarks.nexmark
            - apache_beam.testing.benchmarks.nexmark.models
            - apache_beam.testing.benchmarks.nexmark.queries
            - apache_beam.tools
            - apache_beam.transforms
            - apache_beam.typehints
            - apache_beam.utils
          pip_check: true
      - script:
          - pytest test.py
        requirements:
          run:
            - pytest
        files:
          recipe:
            - test.py

  - package:
      name: ${{ name }}-with-dill
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - dill >=0.3.1.1,<0.3.2
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-gcp
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        # Try to match what's in https://github.com/apache/beam/blob/v${{ version }}/sdks/python/setup.py#L268
        - cachetools >=3.1.0,<7
        - google-api-core >=2.0.0,<3
        - if: python < "3.13"
          then: google-apitools >=0.5.31,<0.5.32
          else: google-apitools >=0.5.35
        - google-auth >=2.0.0,<3
        - google-auth-httplib2 >=0.1.0,<0.3.0
        - google-cloud-datastore >=2.0.0,<3
        - google-cloud-pubsub >=2.1.0,<3
        # google-cloud-pubsublite was removed from the gcp extra upstream in 2.75.0
        - google-cloud-storage >=2.18.2,<4
        - google-cloud-resource-manager >=1.12.0,<2
        - google-cloud-dataflow-client >=0.13.0,<0.14.0
        - google-cloud-bigquery-core >=2.0.0,<4
        - google-cloud-bigquery-storage >=2.6.3,<3
        - google-cloud-core >=2.0.0,<3
        - google-cloud-bigtable >=2.19.0,<3
        - google-cloud-build >=3.35.0,<4
        - google-cloud-spanner >=3.0.0,<4
        - google-cloud-dlp >=3.0.0,<4
        - google-cloud-kms >=3.0.0,<4
        - google-cloud-language >=2.0,<3
        - google-cloud-secret-manager >=2.0,<3
        - google-cloud-videointelligence >=2.0,<3
        - google-cloud-vision >=2,<4
        - google-cloud-recommendations-ai >=0.1.0,<0.11.0
        - google-cloud-aiplatform >=1.26.0,<2.0
        - cloud-sql-python-connector >=1.18.2,<2.0.0
        - python-tds >=1.16.1
        - pg8000 >=1.31.5
        - pymysql >=1.1.0
        - keyrings.google-artifactregistry-auth
        - orjson >=3.9.7,<4
        - regex >=2020.6.8
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-aws
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - boto3 >=1.9,<2
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-azure
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - azure-storage-blob >=12.3.2,<13
        - azure-core >=1.7.0,<2
        - azure-identity >=1.12.0,<2
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-dataframe
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - pandas >=1.4.3,!=1.5.0,!=1.5.1,<2.4
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-dask
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - dask >=2024.4.2
        - distributed >=2024.4.2
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-yaml
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - docstring_parser >=0.15,<1.0
        - jinja2 >=3.0,<3.2
        - pyyaml >=3.12,<7.0.0
        - pandas >=1.4.3,!=1.5.0,!=1.5.1,<2.4
        - virtualenv-clone >=0.5,<1.0
        - jsonschema >=4.0.0,<5.0.0
        # upstream 2.75.0 swapped js2py for quickjs-ng, which is not available on
        # conda-forge, so the yaml JS UDF runtime is omitted here
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-torch
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - pytorch >=1.9.0,<2.8.0
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-tensorflow
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - tensorflow >=2.12rc1,<2.21
        - absl-py >=0.12.0
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-transformers
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - transformers >=4.28.0,<4.56.0
        - tensorflow >=2.12.0
        - pytorch >=1.9.0,<2.12.0
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

  - package:
      name: ${{ name }}-with-tensorflow-hub
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - tensorflow-hub >=0.14.0,<0.16.0
    tests:
      - python:
          imports:
            - apache_beam
          pip_check: true
          python_version: ${{ python_min }}.*

about:
  homepage: https://beam.apache.org
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: "Apache Beam: An advanced unified programming model"
  description: |
    Apache Beam is an open source, unified model for defining both batch
    and streaming data-parallel processing pipelines. Using one of the open
    source Beam SDKs, you build a program that defines the pipeline. The
    pipeline is then executed by one of Beam's supported distributed
    processing back-ends, which include Apache Apex, Apache Flink, Apache
    Spark, and Google Cloud Dataflow.
  documentation: https://beam.apache.org/documentation/
  repository: https://github.com/apache/beam

extra:
  recipe-maintainers:
    - sodre
    - aaltay
    - xylar
