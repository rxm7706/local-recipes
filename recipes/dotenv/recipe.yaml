# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.9"

package:
  name: dotenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/d/dotenv/dotenv-0.9.9-py2.py3-none-any.whl
  sha256: 29cf74a087b31dafdb5a446b6d7e11cbce8ed2741540e2339c69fbef92c94ce9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dotenv

tests:
  - python:
      imports:
        - dotenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pedroburon/dotenv
  license: MIT
  license_file: LICENSE
  summary: Deprecated package
  description: |
    Deprecated package

extra:
  recipe-maintainers:
    - rxm7706

