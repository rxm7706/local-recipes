# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.9"

package:
  name: pytest-html-reporter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-html-reporter/pytest-html-reporter-${{ version }}.tar.gz
  sha256: 0f1c526d1533c40961ebe3b7af6127e2f0c7719f22d49d93d94e635af7bc280b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pillow
    - pytest

tests:
  - python:
      imports:
        - pytest_html_reporter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/prashanth-sams/pytest-html-reporter
  license: MIT
  license_file: LICENSE
  summary: Generates a static html report based on pytest framework
  description: |
    Generates a static html report based on pytest framework

extra:
  recipe-maintainers:
    - rxm7706

