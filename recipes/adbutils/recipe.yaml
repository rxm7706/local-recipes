# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.12.0"

package:
  name: adbutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adbutils/adbutils-${{ version }}.tar.gz
  sha256: 3653a8f39735620bc45b15ee2e7a00e502c9f1a259452e1fb2bbba3ea59d0e68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - deprecation <3.0,>=2.0.6
    - retry2 <1.0,>=0.9
    - pillow

tests:
  - python:
      imports:
        - adbutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openatx/adbutils
  license: MIT
  license_file: LICENSE
  summary: Pure Python Adb Library
  description: |
    Pure Python Adb Library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
