# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.7"

package:
  name: pox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pox/pox-${{ version }}.tar.gz
  sha256: 0652f6f2103fe6d4ba638beb6fa8d3e8a68fd44bcb63315c614118515bcc3afb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/uqfoundation/pox
  license: BSD-3-Clause
  license_file: LICENSE
  summary: utilities for filesystem exploration and automated builds
  description: |
    utilities for filesystem exploration and automated builds
  repository: https://github.com/uqfoundation/pox
  documentation: http://pox.rtfd.io

extra:
  recipe-maintainers:
    - jschueller
    - synapticarbors

#### CFE metadata AND comments
