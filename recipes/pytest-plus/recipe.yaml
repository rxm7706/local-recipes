# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# minimum supported python version is 3.10
schema_version: 1

context:
  name: pytest-plus
  version: "0.8.1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 02dfb28f1a914e8df3b6e3525df7e94feabc0681ecea626912e8028e9355f02c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.10.*
    - setuptools
    - setuptools_scm >=1.15.0
    - setuptools_scm_git_archive >=1.0
  run:
    - pytest >=3.50
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytest_plus
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: "PyTest Plus Plugin :: extends pytest functionality"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pycontribs/pytest-plus

extra:
  recipe-maintainers:
    - tschoonj
