# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.1"
  python_min: "3.12"

package:
  name: docvet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docvet/docvet-${{ version }}.tar.gz
  sha256: 4e22d9f81d2b8e06d453c70d95a4d238f146ed3c31518b6811912aa30a4fce6b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7,<1
  run:
    - python >=${{ python_min }}
    - typer >=0.9

tests:
  - python:
      imports:
        - docvet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Alberto-Codes/docvet
  license: MIT
  license_file: LICENSE
  summary: Comprehensive docstring quality vetting for Python projects
  description: |
    Comprehensive docstring quality vetting for Python projects
  repository: https://github.com/Alberto-Codes/docvet
  documentation: https://alberto-codes.github.io/docvet/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: docvet
  cfe-upstream-registry: pypi
  cfe-upstream-name: docvet
  cfe-purls:
    - pkg:conda/docvet@${{ version }}?channel=conda-forge
    - pkg:pypi/docvet@${{ version }}
  cfe-upstream-repo: https://github.com/Alberto-Codes/docvet
  cfe-upstream-homepage: https://github.com/Alberto-Codes/docvet
  cfe-import-names: [docvet]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:04:01Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T23:04:01Z
  cfe-local-build-status: not-attempted
