# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: dotenv-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dotenv-python/dotenv-python-0.0.1.zip
  sha256: 362e170ca8fd69a70c1aca1fda2ddad0ac270e161e81e59f4039ec11decc14fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dotenv_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TsuiJie/dotenv-python.git
  license: MIT
  license_file: LICENSE
  summary: Read .env(-ish) configuration file for python web applications.
  description: |
    Read .env(-ish) configuration file for python web applications.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
