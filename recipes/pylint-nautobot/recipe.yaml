# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pylint-nautobot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-nautobot/pylint_nautobot-${{ version }}.tar.gz
  sha256: e59226e0583f438bf8dcaa7f43f68f778b9ca2db85d0f3057ceac3f824b70c5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - packaging
    - importlib_resources >=5.12.0
    - pylint <5.0,>=4.0.4
    - pyyaml >=6.0.1
    - toml >=0.10.2

tests:
  - python:
      imports:
        - pylint_nautobot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nautobot/pylint-nautobot
  license: Apache-2.0
  license_file: LICENSE
  summary: Custom Pylint Rules for Nautobot
  description: |
    Custom Pylint Rules for Nautobot
  repository: https://github.com/nautobot/pylint-nautobot

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
