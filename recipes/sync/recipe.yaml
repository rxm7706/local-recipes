# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: sync
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sync/sync-1.0.0.zip
  sha256: 9f8e9a5c89dec5e82efaa2ae64a8c6f63690a3c4f4d5f0f84660202306ea078e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Knio/sync
  license: MIT
  license_file: LICENSE
  summary: Python cile copy utility
  description: |
    Python cile copy utility

extra:
  recipe-maintainers:
    - rxm7706

