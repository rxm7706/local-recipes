# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.4.2"

package:
  name: click
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/click/click-${{ version }}.tar.gz
  sha256: 9a6cea6e60b17ebe0a44c5cc636d94f09bd66142c1cd7d8b4cd731c4917a15f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - click
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/click/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Composable command line interface toolkit
  description: |
    Composable command line interface toolkit
  repository: https://github.com/pallets/click/
  documentation: https://click.palletsprojects.com/

extra:
  recipe-maintainers:
    - ocefpaf
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: click
  cfe-upstream-registry: pypi
  cfe-upstream-name: click
  cfe-purls:
    - pkg:conda/click@${{ version }}?channel=conda-forge
    - pkg:pypi/click@${{ version }}
  cfe-upstream-repo: https://github.com/pallets/click/
  cfe-upstream-homepage: https://pypi.org/project/click/
  cfe-import-names: [click]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/click-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-17T06:59:33Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T06:59:33Z
