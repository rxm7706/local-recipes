# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: github-copilot-sdk
  version: "1.0.11"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/py3/${{ name[0] }}/${{ name }}/github_copilot_sdk-${{ version }}-py3-none-any.whl
  sha256: 6f664c7b843c34ab5a7455f7effb4d339eae75969d2b72f43c2e6214c9c637dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install github*whl -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - httpx
    - python-dateutil >=2.9.0.post0
    - pydantic >=2.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - copilot
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python SDK for GitHub Copilot CLI
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/github/copilot-sdk

extra:
  recipe-maintainers:
    - akrherz
