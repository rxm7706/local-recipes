# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0"

package:
  name: zope.contentprovider
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.contentprovider/zope_contentprovider-${{ version }}.tar.gz
  sha256: 4bc1be9eabb4c1d6267580094025c3f1d56d505af2709067deb40866a7f1a76b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.component
    - zope.event
    - zope.interface >=3.8
    - zope.location
    - zope.publisher
    - zope.schema
    - zope.tales

tests:
  - python:
      imports:
        - zope.contentprovider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.contentprovider
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Content Provider Framework for Zope Templates
  description: |
    Content Provider Framework for Zope Templates

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
