# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: cachesql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cachesql/cachesql-${{ version }}.tar.gz
  sha256: ec222cc21abf5fab0571d6dc78bebc218a422baa78b955bf7223479a80825aa1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - sqlalchemy
    - joblib
    - pandas
    - pyarrow
    - sqlparse

tests:
  - python:
      imports:
        - cachesql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/felipeam86/cachesql
  license: MIT
  license_file: LICENSE
  summary: Fast, resilient and reproducible data analysis with cached SQL queries
  description: |
    Fast, resilient and reproducible data analysis with cached SQL queries

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
