# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: backports.asyncio.runner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backports.asyncio.runner/backports_asyncio_runner-${{ version }}.tar.gz
  sha256: a5aa7b2b7d8f8bfcaa2b57313f70792df84e32a2a746f585213373f900b42162

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - backports.asyncio.runner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/samypr100/backports.asyncio.runner
  license: PSF-2.0
  license_file: LICENSE
  summary: Backport of asyncio.Runner, a context manager that controls event loop life cycle.
  description: |
    Backport of asyncio.Runner, a context manager that controls event loop life cycle.

extra:
  recipe-maintainers:
    - bollwyvl

