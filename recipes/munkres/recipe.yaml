    - pkg:pypi/munkres@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://software.clapper.org/munkres/
  cfe-import-names: [munkres]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/munkres-feedstock
  cfe-forge-recipe-updates-needed: 
