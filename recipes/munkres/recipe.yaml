# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.4"

package:
  name: munkres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/munkres/munkres-${{ version }}.tar.gz
  sha256: fc44bf3c3979dada4b6b633ddeeb8ffbe8388ee9409e4d4e8310c2da1792db03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - munkres
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://software.clapper.org/munkres/
  license: Apache-2.0
  license_file: LICENSE
  summary: Munkres (Hungarian) algorithm for the Assignment Problem
  description: |
    Munkres (Hungarian) algorithm for the Assignment Problem

extra:
  recipe-maintainers:
    - CJ-Wright

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: munkres
