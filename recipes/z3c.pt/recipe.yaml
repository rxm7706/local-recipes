# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1"

package:
  name: z3c.pt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/z3c.pt/z3c_pt-${{ version }}.tar.gz
  sha256: 1185c09178fd9719025ede5d4d32cb0de720f8a6532d615f2dde584101b9c5d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.component
    - zope.i18n >=3.5
    - zope.traversing
    - zope.contentprovider
    - chameleon >=2.4

tests:
  - python:
      imports:
        - z3c.pt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/z3c.pt
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Fast ZPT engine.
  description: |
    Fast ZPT engine.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: z3c.pt
  cfe-upstream-registry: pypi
