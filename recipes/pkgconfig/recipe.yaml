# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: pkgconfig
  version: ${{ version }}

source:
  url: https://github.com/matze/pkgconfig/archive/v${{ version }}.tar.gz
  sha256: 2a0d7626fcb7ee97713c134a30aeb4bc22d06599fa92a3ed95d55debd5a289ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pkg-config

tests:
  - python:
      imports:
        - pkgconfig
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A Python interface to the pkg-config command line tool
  homepage: https://github.com/matze/pkgconfig

extra:
  recipe-maintainers:
    - jakirkham
    - lbdreyer
    - ocefpaf
    - tdegeus
