# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.13"

package:
  name: pymqi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymqi/pymqi-${{ version }}.tar.gz
  sha256: a74a48d6f0c59180f678a926927b69d8d7e7df0b228f8903c08b95f54627051c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - code.pymqi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymqi/
  license: PSF-2.0
  license_file: LICENSE
  summary: The development of this product is currently on hold.
  description: |
    The development of this product is currently on hold.

extra:
  recipe-maintainers:
    - rxm7706

