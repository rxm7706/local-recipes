# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.2.6.9"

package:
  name: nvidia-cusolver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cusolver/nvidia_cusolver-12.2.6.9-py3-none-manylinux_2_27_aarch64.whl
  sha256: 658ce9e6ed8a321033419fe6e55faf0f245a15aa23669eda03d7f2dcce436d73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nvidia-cublas
    - nvidia-nvjitlink
    - nvidia-cusparse

tests:
  - python:
      imports:
        - nvidia_cusolver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CUDA solver native runtime libraries
  description: |
    CUDA solver native runtime libraries

extra:
  recipe-maintainers:
    - rxm7706

