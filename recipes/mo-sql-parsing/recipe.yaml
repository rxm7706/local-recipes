# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "11.697.25301"

package:
  name: mo-sql-parsing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mo-sql-parsing/mo_sql_parsing-${{ version }}.tar.gz
  sha256: 364b62673c623a6bd6e4ece933b0521de8be0357212019371cf658b943e8081d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mo-dots ==10.685.25166
    - mo-future ==7.685.25166
    - mo-imports ==7.685.25166
    - mo-parsing ==8.694.25301

tests:
  - python:
      imports:
        - mo_sql_parsing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/klahnakoski/mo-sql-parsing
  license: MPL-2.0
  license_file: LICENSE
  summary: More SQL Parsing! Parse SQL into JSON parse tree
  description: |
    More SQL Parsing! Parse SQL into JSON parse tree

extra:
  recipe-maintainers:
    - rxm7706

