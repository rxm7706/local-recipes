# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.6"

package:
  name: joblib-progress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/joblib-progress/joblib_progress-${{ version }}.tar.gz
  sha256: 9b4d97f0ab0fc439be29e8d6ed3114b0a3140f60d709e8a6a6ed3633767e48bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - joblib
    - rich

tests:
  - python:
      imports:
        - joblib_progress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jonghwanhyeon/joblib-progress
  license: MIT
  license_file: LICENSE
  summary: A contextmanager to track progress of joblib execution
  description: |
    A contextmanager to track progress of joblib execution

extra:
  recipe-maintainers:
    - rxm7706

