# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.2"

package:
  name: jaraco.context
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jaraco.context/jaraco_context-${{ version }}.tar.gz
  sha256: f1a6c9d391e661cc5b8d39861ff077a7dc24dc23833ccee564b234b81c82dfe3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - backports.tarfile

tests:
  - python:
      imports:
        - jaraco.context
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jaraco.context/
  license: MIT
  license_file: LICENSE
  summary: Useful decorators and context managers
  description: |
    Useful decorators and context managers
  repository: https://github.com/jaraco/jaraco.context

extra:
  recipe-maintainers:
    - carlodri

