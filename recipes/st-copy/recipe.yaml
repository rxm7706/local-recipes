# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: st-copy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/st-copy/st_copy-${{ version }}.tar.gz
  sha256: 3810e5f380a8649d966ad9b7755fdb559ecf9a093e12449c979c15e30e1d7de2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - streamlit >=1.56.0

tests:
  - python:
      imports:
        - st_copy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/st-copy/
  license: MIT
  license_file: LICENSE
  summary: Streamlit copy‑to‑clipboard button component
  description: |
    Streamlit copy‑to‑clipboard button component

extra:
  recipe-maintainers:
    - rxm7706

