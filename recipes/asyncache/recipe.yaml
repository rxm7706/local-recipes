# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: asyncache
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asyncache-${{ version }}.tar.gz
  sha256: 9a1e60a75668e794657489bdea6540ee7e3259c483517b934670db7600bf5035

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<4.0
    - cachetools >=5.2.0,<6.0.0

tests:
  - python:
      imports:
        - asyncache
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Helpers to use cachetools with async code.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/hephex/asyncache

extra:
  recipe-maintainers:
    - maresb
