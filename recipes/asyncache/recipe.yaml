# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: asyncache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncache/asyncache-${{ version }}.tar.gz
  sha256: 9a1e60a75668e794657489bdea6540ee7e3259c483517b934670db7600bf5035

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - cachetools

tests:
  - python:
      imports:
        - asyncache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/asyncache/
  license: MIT
  license_file: LICENSE
  summary: Helpers to use cachetools with async code.
  description: |
    Helpers to use cachetools with async code.

extra:
  recipe-maintainers:
    - maresb

