# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: vision-explanation-methods
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vision-explanation-methods/vision_explanation_methods-${{ version }}.tar.gz
  sha256: a3c5a12c6270706142c7ce0589dfe96b88edad94312094c1456cb70baf877021

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy <3
    - tqdm
    - matplotlib-base >=3.9
    - ml-wrappers >=0.6.0,<0.7

tests:
  - python:
      imports:
        - vision_explanation_methods
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Vision Explanation Methods SDK for Python
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/microsoft/vision-explanation-methods

extra:
  recipe-maintainers:
    - rxm7706

