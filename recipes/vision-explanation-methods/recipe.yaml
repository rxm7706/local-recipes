# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: vision-explanation-methods
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/vision_explanation_methods-${{ version }}.tar.gz
  sha256: 03fae114405c4fe3f4da3dba9f8dc3772a19f38125fed98c953fb1ab0f712168

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - tqdm
    - matplotlib-base <3.7.0
    - ml-wrappers

tests:
  - python:
      imports:
        - vision_explanation_methods
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Vision Explanation Methods SDK for Python
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/microsoft/vision-explanation-methods

extra:
  recipe-maintainers:
    - rxm7706
