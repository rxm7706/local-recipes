{% set name = "vision-explanation-methods" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/vision_explanation_methods-{{ version }}.tar.gz
  sha256: a3c5a12c6270706142c7ce0589dfe96b88edad94312094c1456cb70baf877021

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy <3
    - tqdm
    - matplotlib-base >=3.9
    - ml-wrappers >=0.6.0,<0.7

test:
  imports:
    - vision_explanation_methods
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/microsoft/vision-explanation-methods
  summary: Microsoft Vision Explanation Methods SDK for Python
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - rxm7706
