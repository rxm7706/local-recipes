# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.1"

package:
  name: radon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/radon/radon-${{ version }}.tar.gz
  sha256: d1ac0053943a893878940fedc8b19ace70386fc9c9bf0a09229a44125ebf45b5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - radon = radon:main

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - mando >=0.6,<0.8
    - colorama >=0.4.1

tests:
  - python:
      imports:
        - radon
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - radon

about:
  license: MIT
  license_file: LICENSE
  summary: Code Metrics in Python
  description: |
    Radon is a Python tool that computes various metrics from the source code. Radon can compute:

    - McCabe’s complexity, i.e. cyclomatic complexity
    - raw metrics (these include SLOC, comment lines, blank lines, &c.)
    - Halstead metrics (all of them)
    - Maintainability Index (the one used in Visual Studio)
  homepage: https://github.com/rubik/radon
  documentation: https://radon.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706
    - igortg
    - tonybaloney
