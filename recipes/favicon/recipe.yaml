# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: favicon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/favicon/favicon-${{ version }}.tar.gz
  sha256: 6d6b5a78de2a0d0084589f687f384b2ecd6a6527093fec564403b1a30605d7a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - beautifulsoup4

tests:
  - python:
      imports:
        - favicon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scottwernervt/favicon
  license: MIT
  license_file: LICENSE
  summary: Get a website's favicon.
  description: |
    Get a website's favicon.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
