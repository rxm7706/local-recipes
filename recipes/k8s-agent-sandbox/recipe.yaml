# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.5"
  python_min: "3.11"

package:
  name: k8s-agent-sandbox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/k8s-agent-sandbox/k8s_agent_sandbox-${{ version }}.tar.gz
  sha256: 39e2ff8e8fd9a37cdbd3a56b2a8d6b81bc2df13fc7e43249d77308da2a86d2f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - setuptools-scm >=8.0
  run:
    - python >=${{ python_min }}
    - kubernetes
    - requests
    - pydantic
    - prometheus_client

tests:
  - python:
      imports:
        - k8s_agent_sandbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kubernetes-sigs/agent-sandbox
  license: Apache-2.0
  license_file: LICENSE
  summary: A client library to interact with the Agentic Sandbox on Kubernetes.
  description: |
    A client library to interact with the Agentic Sandbox on Kubernetes.

extra:
  recipe-maintainers:
    - rxm7706

