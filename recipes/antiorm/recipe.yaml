# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: antiorm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antiorm/antiorm-${{ version }}.tar.gz
  sha256: 96eb1841ce5163db4cf1dc13f4499ec2d7cffc190cf724b78ffdd3e6b7c4ff93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - antiorm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://furius.ca/antiorm
  license: MIT
  license_file: LICENSE
  summary: A Pythonic Helper for DBAPI-2.0 SQL Access
  description: |
    A Pythonic Helper for DBAPI-2.0 SQL Access

extra:
  recipe-maintainers:
    - rxm7706

