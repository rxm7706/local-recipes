# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-exporter-jaeger-thrift
  version: "1.21.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_exporter_jaeger_thrift-${{ version }}.tar.gz
  sha256: 41119bc7e5602cec83dd7d7060f061ecbc91de231272e8f515b07ef9a4b6e41c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - thrift >=0.10.0
    - opentelemetry-api >=1.3,<2.0
    - opentelemetry-sdk >=1.11,<2.0

tests:
  - python:
      imports:
        - opentelemetry
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Jaeger Thrift Exporter for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-jaeger-thrift

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
