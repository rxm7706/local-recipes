# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: gradio-modal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gradio-modal/gradio_modal-${{ version }}.tar.gz
  sha256: 717ae699072a171648cfa1b84bc153be84e92d04e9ad58c1bc59af68ef332726

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-requirements-txt
    - hatch-fancy-pypi-readme >=22.5.0
  run:
    - python >=${{ python_min }}
    - gradio <6.0,>=4.0

tests:
  - python:
      imports:
        - demo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gradio-modal/
  license: Apache-2.0
  license_file: LICENSE
  summary: A popup modal component
  description: |
    A popup modal component

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gradio-modal
  cfe-upstream-registry: pypi
  cfe-upstream-name: gradio-modal
