# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.21"

package:
  name: rasa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rasa/rasa-${{ version }}.tar.gz
  sha256: 17daa37370e52b6386e238fb958fd0f16ec54b6fce75871ee01ceb9770695f03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.4
  run:
    - python >=${{ python_min }}
    - cachecontrol <0.13.0,>=0.12.9
    - pyjwt <3.0.0,>=2.0.0
    - sqlalchemy <1.5.0,>=1.4.0
    - absl-py <1.5,>=0.9
    - aio-pika <8.2.4,>=6.7.1
    - aiogram <2.26
    - aiohttp <3.10,>=3.9.0
    - apscheduler <3.10,>=3.6
    - attrs <22.2,>=19.3
    - boto3 <2.0.0,>=1.26.136
    - certifi >=2023.7.22
    - colorclass <2.3,>=2.2
    - coloredlogs <16,>=10
    - colorhash <1.3.0,>=1.0.2
    - confluent-kafka <3.0.0,>=1.9.2
    - cryptography >=41.0.7
    - dask ==2022.10.2
    - dnspython ==2.3.0
    - fbmessenger <6.1.0,>=6.0.0
    - google-auth <3
    - jsonpickle <3.1,>=1.3
    - jsonschema <4.18,>=3.2
    - matplotlib-base <3.6,>=3.1
    - mattermostwrapper <2.3,>=2.2
    - networkx <2.7,>=2.4
    - numpy <1.22.0,>=1.19.2
    - packaging <21.0,>=20.0
    - pluggy <2.0.0,>=1.0.0
    - portalocker <3.0.0,>=2.7.0
    - prompt-toolkit <3.0.29,>=3.0
    - protobuf <4.23.4,>=4.23.3
    - psycopg2 <2.10.0,>=2.8.2
    - pydantic <1.10.10
    - pydot <1.5,>=1.4
    - pykwalify <1.9,>=1.7
    - pymongo <4.4,>=3.8
    - python-dateutil <2.9,>=2.8
    - python-engineio !=5.0.0,<6,>=4
    - python-socketio <6,>=4.4
    - pytz <2023.0,>=2019.1
    - pyyaml >=6.0
    - questionary <1.11.0,>=1.5.1
    - randomname <0.2.0,>=0.1.5
    - rasa-sdk <3.7.0,>=3.6.2
    - redis-py <5.0,>=4.5.3
    - regex <2022.11,>=2020.6
    - requests <3.0,>=2.23
    - rocketchat-api <1.31.0,>=0.6.31
    - ruamel.yaml <0.17.22,>=0.16.5
    - safetensors <0.5.0,>=0.4.5
    - sanic <21.13,>=21.12
    - sanic-cors <2.1.0,>=2.0.0
    - sanic-jwt <2.0.0,>=1.6.0
    - sanic-routing <0.8.0,>=0.7.2
    - scikit-learn <1.1,>=0.22
    - scipy <1.7.3,>=1.4.1
    - sentry-sdk <1.15.0,>=0.17.0
    - setuptools <70.4.0,>=70.3.0
    - sklearn-crfsuite <0.4,>=0.3
    - skops ==0.9.0
    - slack-sdk <4.0.0,>=3.19.2
    - structlog <24.0.0,>=23.1.0
    - structlog-sentry <3.0.0,>=2.0.2
    - tarsafe <0.0.5,>=0.0.3
    - tensorflow-hub <0.14.0,>=0.13.0
    - terminaltables <3.2.0,>=3.1.0
    - tqdm <5.0,>=4.31
    - twilio <8.3,>=6.26
    - typing_extensions <5.0.0,>=4.1.1
    - typing_utils <0.2.0,>=0.1.0
    - ujson <6.0,>=1.35
    - webexteamssdk <1.7.0,>=1.1.1
    - websockets <11.0,>=10.0
    - wheel >=0.38.1
    - if: win
      then:
        - colorama
        - tensorflow-intel
        - tensorflow-io-gcs-filesystem
    - if: osx
      then:
        - spacy
        - tensorflow-io-gcs-filesystem
        - tensorflow-macos
        - tensorflow-metal
    - if: linux
      then:
        - tensorflow-cpu-aws
        - tensorflow-io-gcs-filesystem

tests:
  - python:
      imports:
        - rasa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://rasa.com
  license: Apache-2.0
  license_file: LICENSE
  summary: "Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants"
  description: |
    Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants
  repository: https://github.com/rasahq/rasa
  documentation: https://rasa.com/docs

extra:
  recipe-maintainers:
    - rxm7706

