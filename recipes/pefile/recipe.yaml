# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2024.8.26"

package:
  name: pefile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pefile/pefile-${{ version }}.tar.gz
  sha256: 3ff6c5d8b43e8c37bb6e6dd5085658d658a7a0bdcd20b6a07b1fcfc1c4e9d632

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ordlookup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/erocarrera/pefile
  license: MIT
  license_file: LICENSE
  summary: Python PE parsing module
  description: |
    Python PE parsing module

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pefile
  cfe-upstream-registry: pypi
  cfe-upstream-name: pefile
