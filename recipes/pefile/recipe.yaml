    - pkg:pypi/pefile@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/erocarrera/pefile
  cfe-import-names: [ordlookup]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pefile-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2024.8.26

  cfe-forge-blocker-list: []
