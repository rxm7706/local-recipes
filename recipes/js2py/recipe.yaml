# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.74"

package:
  name: js2py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/Js2Py/Js2Py-${{ version }}.tar.gz
  sha256: 39f3a6aa8469180efba3c8677271df27c31332fd1b471df1af2af58b87b8972f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tzlocal
    - six
    - pyjsparser

tests:
  - python:
      imports:
        - js2py
        - js2py.constructors
        - js2py.es6
        - js2py.host
        - js2py.internals
        - js2py.internals.constructors
        - js2py.internals.prototypes
        - js2py.prototypes
        - js2py.py_node_modules
        - js2py.translators
        - js2py.utils
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PiotrDabkowski/Js2Py
  license: MIT
  license_file: LICENSE
  summary: JavaScript to Python Translator & JavaScript interpreter written in 100% pure Python.
  description: |
    JavaScript to Python Translator & JavaScript interpreter written in 100% pure Python.
  repository: https://github.com/PiotrDabkowski/Js2Py
  documentation: http://piter.io/projects/js2py

extra:
  recipe-maintainers:
    - dschreij
    - smathot

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: js2py
