# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.4.3.29"

package:
  name: nvidia-curand
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-curand/nvidia_curand-10.4.3.29-py3-none-manylinux_2_27_aarch64.whl
  sha256: 63899de834d1b84b32ad60d34cb4d246bea998ddadbc85f8e1dd937dd3718d61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nvidia_curand
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CURAND native runtime libraries
  description: |
    CURAND native runtime libraries

extra:
  recipe-maintainers:
    - rxm7706

