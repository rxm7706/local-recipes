# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: netstandard-stubs
  version: ${{ version }}

source:
  url: https://github.com/Eswcvlad/netstandard-stubs/archive/refs/tags/${{ version }}.tar.gz
  sha256: 046119edd182941b7be1eacbbdd243204f24563145c518289d33a2cc6fb6e20d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - netstandard-stubs

tests:
  - python:
      imports:
        - netstandard_stubs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Eswcvlad/netstandard-stubs
  license: MIT
  license_file: LICENSE
  summary: Unofficial type stubs for .NET Standard
  description: |
    Unofficial type stubs for .NET Standard

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: netstandard-stubs
