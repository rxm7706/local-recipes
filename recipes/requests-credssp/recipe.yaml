# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: requests-credssp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-credssp/requests-credssp-${{ version }}.tar.gz
  sha256: 229afe2f6e1c9fabef64fc2bdf2a10e794ca6c4a0c00a687d53fbfaf7b8ee71d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography
    - pyspnego
    - requests

tests:
  - python:
      imports:
        - requests_credssp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jborean93/requests-credssp
  license: MIT
  license_file: LICENSE
  summary: HTTPS CredSSP authentication with the requests library.
  description: |
    HTTPS CredSSP authentication with the requests library.

extra:
  recipe-maintainers:
    - rxm7706

