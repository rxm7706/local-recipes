# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.9"

package:
  name: mkdocs-with-confluence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mkdocs-with-confluence/mkdocs_with_confluence-${{ version }}.tar.gz
  sha256: d1e7ab1c904cc474c6df68fbe1ccc1779fc6cbc09ba5e2524c998ed2d27abc50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mkdocs >=1.1
    - jinja2
    - mistune
    - md2cf
    - requests

tests:
  - python:
      imports:
        - mkdocs_with_confluence
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pawelsikora/mkdocs-with-confluence/
  license: MIT
  license_file: LICENSE
  summary: MkDocs plugin for uploading markdown documentation to Confluence via Confluence REST API
  description: |
    MkDocs plugin for uploading markdown documentation to Confluence via Confluence REST API

extra:
  recipe-maintainers:
    - rxm7706

