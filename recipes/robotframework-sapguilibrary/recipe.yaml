# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robotframework-sapguilibrary
  version: "1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robotframework-sapguilibrary-${{ version }}.tar.gz
  sha256: 4b07f209f5e8bb9588b8993ad601c4bd9150635e914a0edb0c2496ca3d66373a

build:
  number: 4
  skip: osx or linux or match(python, "<2.7")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - pywin32 >=222
    - robotframework >=2.9

tests:
  - python:
      imports:
        - SapGuiLibrary
      pip_check: true

about:
  summary: A Robot Framework Library for automating the SAP GUI desktop client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/frankvanderkuur/robotframework-sapguilibrary

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
