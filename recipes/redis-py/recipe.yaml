# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.0"

package:
  name: redis-py
  version: ${{ version }}

source:
  url: https://github.com/redis/redis-py/archive/v${{ version }}.tar.gz
  sha256: 1f71accd16bb24383bd89fc213f901c04718d31ade0229f754d7ba37111c0661

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - async-timeout >=4.0.3

tests:
  - python:
      imports:
        - redis
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Python client for Redis key-value store
  description: |
    The Python interface to the Redis key-value store. Requires a running
    Redis server.
  homepage: https://github.com/redis/redis-py/
  repository: https://github.com/redis/redis-py/
  documentation: https://pypi.python.org/pypi/redis

extra:
  recipe-maintainers:
    - rxm7706
    - kwilcox
    - daf
