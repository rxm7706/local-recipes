# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.48.post4"

package:
  name: llama-index-legacy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-legacy/llama_index_legacy-${{ version }}.tar.gz
  sha256: f8a9764e7e134a52bfef5e53d2d62561bfc01fc09874c51cc001df6f5302ae30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4.49
    - dataclasses-json
    - deprecated >=1.2.9.3
    - fsspec >=2023.5.0
    - httpx
    - nest-asyncio <2.0.0,>=1.5.8
    - nltk >=3.8.1
    - numpy
    - openai >=1.1.0
    - pandas
    - tenacity <9.0.0,>=8.2.0
    - tiktoken >=0.3.3
    - typing_extensions >=4.5.0
    - typing_inspect >=0.8.0
    - requests >=2.31.0
    - aiohttp <4.0.0,>=3.8.6
    - networkx >=3.0
    - dirtyjson <2.0.0,>=1.0.8

tests:
  - python:
      imports:
        - llama_index.legacy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://llamaindex.ai
  license: MIT
  license_file: LICENSE
  summary: Interface between LLMs and your data
  description: |
    Interface between LLMs and your data
  repository: https://github.com/run-llama/llama_index
  documentation: https://docs.llamaindex.ai/en/stable/

extra:
  recipe-maintainers:
    - pavelzw

#### CFE metadata AND comments
