# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: llama-index-legacy
  version: 0.9.48.post4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_legacy-${{ version }}.tar.gz
    sha256: f8a9764e7e134a52bfef5e53d2d62561bfc01fc09874c51cc001df6f5302ae30
  # https://github.com/run-llama/llama_index/issues/10806
  - url: https://raw.githubusercontent.com/run-llama/llama_index/main/LICENSE
    sha256: 24f40b5190fdacabc24ddbb5f76364d15e4f030925220ea300d8a2dd4993c8cb

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - llamaindex-legacy-cli = llama_index.legacy.command_line.command_line:main

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >=${{ python_min }},<4.0
    - sqlalchemy >=1.4.49
    - dataclasses-json
    - deprecated >=1.2.9.3
    - fsspec >=2023.5.0
    - httpx
    - nest-asyncio >=1.5.8,<2.0.0
    - nltk >=3.8.1
    - numpy
    - openai >=1.1.0
    - pandas
    - tenacity >=8.2.0,<9.0.0
    - tiktoken >=0.3.3
    - typing-extensions >=4.5.0
    - typing_inspect >=0.8.0
    - requests >=2.31.0
    - aiohttp >=3.8.6,<4.0.0
    - networkx >=3.0
    - dirtyjson >=1.0.8,<2.0.0
  run_constraints:
    - beautifulsoup4 >=4.12.2,<5.0.0
    - langchain >=0.0.303
    - gradientai >=1.4.0
    - asyncpg >=0.28.0,<0.29.0
    - pgvector >=0.1.0,<0.2.0
    - optimum >=1.13.2,<2.0.0
    - sentencepiece >=0.1.99,<0.2.0
    - transformers >=4.33.1,<5.0.0
    - guidance >=0.0.64,<0.0.65
    - lm-format-enforcer >=0.4.3,<0.5.0
    - jsonpath-ng >=1.6.0,<2.0.0
    - rank-bm25 >=0.2.2,<0.3.0
    - scikit-learn *
    - spacy >=3.7.1,<4.0.0
    - psycopg2-binary >=2.9.9,<3.0.0

tests:
  - python:
      imports:
        - llama_index.legacy
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - llamaindex-legacy-cli --help

about:
  summary: Interface between LLMs and your data
  license: MIT
  license_file: LICENSE
  homepage: https://llamaindex.ai
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-legacy

extra:
  recipe-maintainers:
    - pavelzw
