# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.66b2"

package:
  name: opentelemetry-instrumentation-celery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-celery/opentelemetry_instrumentation_celery-${{ version }}.tar.gz
  sha256: 843645ecd28e85d16851eb6c24c082ee00c3102ba091752f095fc7628fcfb7bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-semantic-conventions ==0.66b2

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-celery
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Celery Instrumentation
  description: |
    OpenTelemetry Celery Instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

