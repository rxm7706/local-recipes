# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-instrumentation-celery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-celery/opentelemetry_instrumentation_celery-${{ version }}.tar.gz
  sha256: ff4d192b6371cfe06969005862dc558cc8b79b03b0bbdfbf65b9a59e4dcd7fee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - celery
    - billiard
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.celery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-celery
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Celery Instrumentation
  description: |
    OpenTelemetry Celery Instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

