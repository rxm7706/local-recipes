# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.7"

package:
  name: splot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splot/splot-${{ version }}.tar.gz
  sha256: 6edcaee24cd417965c378c5bc87414d02806915950c138c1f6e40f1a1de5286b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - esda
    - geopandas >=0.9.0
    - giddy
    - libpysal
    - mapclassify
    - matplotlib-base >=3.3.3
    - numpy
    - packaging
    - seaborn-base >=0.11.0
    - spreg

tests:
  - python:
      imports:
        - splot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/splot
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Visual analytics for spatial analysis with PySAL.
  description: |
    Visual analytics for spatial analysis with PySAL.

extra:
  recipe-maintainers:
    - martinfleis
    - slumnitz
    - knaaptime
    - jGaboardi

#### CFE metadata AND comments
