# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.66b1"

package:
  name: opentelemetry-instrumentation-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-django/opentelemetry_instrumentation_django-${{ version }}.tar.gz
  sha256: 85b56193b6ce7b8db9c280c3ade4a4991601abc9ada4734c8911971423fd521f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-wsgi ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-util-http ==0.66b1

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-django
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Instrumentation for Django
  description: |
    OpenTelemetry Instrumentation for Django
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api

