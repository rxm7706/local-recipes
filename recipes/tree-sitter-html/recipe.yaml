# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.2"

package:
  name: tree-sitter-html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tree-sitter-html/tree_sitter_html-${{ version }}.tar.gz
  sha256: bc9922defe23144d9146bc1509fcd00d361bf6b3303f9effee6532c6a0296961

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bindings.python.tree_sitter_html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tree-sitter/tree-sitter-html
  license: MIT
  license_file: LICENSE
  summary: HTML grammar for tree-sitter
  description: |
    HTML grammar for tree-sitter

extra:
  recipe-maintainers:
    - rxm7706

