# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: requests-ntlm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-ntlm/requests_ntlm-${{ version }}.tar.gz
  sha256: b29cc2462623dffdf9b88c43e180ccb735b4007228a542220e882c58ae56c668

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42.0.0
  run:
    - python >=${{ python_min }}
    - cryptography >=1.3
    - pyspnego >=0.4.0
    - requests >=2.0.0

tests:
  - python:
      imports:
        - requests_ntlm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/requests/requests-ntlm
  license: ISC
  license_file: LICENSE
  summary: This package allows for HTTP NTLM authentication using the requests library.
  description: |
    This package allows for HTTP NTLM authentication using the requests library.

extra:
  recipe-maintainers:
    - synapticarbors

