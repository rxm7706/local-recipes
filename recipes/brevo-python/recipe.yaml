# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.1"

package:
  name: brevo-python
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/b/brevo-python/brevo_python-${{ version }}.tar.gz
    sha256: c8f5e3def406395d1c91788ce7df07021564fd89c87d4c9b73b15671df974aec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpx
    - pydantic
    - pydantic-core
    - typing_extensions

tests:
  - python:
      imports:
        - brevo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://brevo.com
  license: MIT
  license_file: LICENSE
  summary: Python client for the Brevo (ex Sendinblue) transactional email API
  description: |
    brevo-python is the official Python client for the Brevo
    (formerly Sendinblue) transactional email and marketing API.
    It provides programmatic access to transactional email sending,
    contact management, SMS, automation workflows, and analytics
    endpoints.
  repository: https://github.com/getbrevo/brevo-python
  documentation: https://developers.brevo.com

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
