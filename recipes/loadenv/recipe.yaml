# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: loadenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/loadenv/loadenv-${{ version }}.tar.gz
  sha256: 8dde4a80cf733323880c118659685d822f9d1311fa15b3d7e1e2aa28223aba29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - loadenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ucodery/loadenv
  license: MIT
  license_file: LICENSE
  summary: Automatically load environment variables into structured Python data
  description: |
    Automatically load environment variables into structured Python data

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: loadenv
  cfe-upstream-registry: pypi
  cfe-upstream-name: loadenv
