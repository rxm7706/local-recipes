# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: pyexifinfo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyexifinfo/pyexifinfo-${{ version }}.tar.gz
  sha256: 578b34b3c593fe77bbe6b62588f9f2ec679dca63f7d486148c9a6ff1fdd4bdc9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyexifinfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/guinslym/pyexifinfo
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Simple Metadata extraction using Exiftool
  description: |
    Simple Metadata extraction using Exiftool

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
