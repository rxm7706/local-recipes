# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: python-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-utils/python_utils-${{ version }}.tar.gz
  sha256: 51d84b297d9877205a76e65f970e3275d1aa9c1cf3d508af2c459247eb4fe701

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11,<0.12
  run:
    - python >=${{ python_min }}
    - typing_extensions >3.10.0.2

tests:
  - python:
      imports:
        - python_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/WoLpH/python-utils
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Utils is a module with some convenient utilities not included with the standard Python install
  description: |
    Python Utils is a module with some convenient utilities not included with the standard Python install
  repository: https://github.com/WoLpH/python-utils
  documentation: https://python-utils.readthedocs.io/

extra:
  recipe-maintainers:
    - maartenbreddels
    - WoLpH
    - stuertz

#### CFE metadata AND comments
