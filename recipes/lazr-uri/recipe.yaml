# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: lazr-uri
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lazr.uri/lazr_uri-${{ version }}.tar.gz
  sha256: d4a4e44b7c87269ab6c01dfd4c460b8f0492e2377c4215157c285929888efe5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lazr.uri
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://launchpad.net/lazr.uri
  license: LGPL-3.0-only
  license_file: COPYING.txt
  summary: Parse, manipulate, and generate URIs
  description: |
    A self-contained, easily reusable library for parsing, manipulating, and generating URIs.
  repository: https://code.launchpad.net/lazr.uri
  documentation: https://lazruri.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
