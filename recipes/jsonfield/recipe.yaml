# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: jsonfield
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonfield/jsonfield-${{ version }}.tar.gz
  sha256: ca53871bc3308ae4f4cddc3b4f99ed5c6fc6abb1832fbfb499bc6da566c70e4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - django >=4.2

tests:
  - python:
      imports:
        - jsonfield
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jsonfield/
  license: MIT
  license_file: LICENSE
  summary: A reusable Django field that allows you to store validated JSON in your model.
  description: |
    A reusable Django field that allows you to store validated JSON in your model.
  repository: https://github.com/rpkilby/jsonfield

extra:
  recipe-maintainers:
    - ocefpaf

