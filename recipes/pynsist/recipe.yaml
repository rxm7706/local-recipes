# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8"

package:
  name: pynsist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pynsist/pynsist-${{ version }}.tar.gz
  sha256: 465c4596cba5cc3698d4719ddc7afea31ce9dc8936a7b4d3feffec6e8adc0b5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - requests
    - requests-download
    - jinja2
    - yarg
    - distlib >=0.3

tests:
  - python:
      imports:
        - nsist
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pynsist/
  license: MIT
  license_file: LICENSE
  summary: Build NSIS installers for Python applications.
  description: |
    Build NSIS installers for Python applications.
  repository: https://github.com/takluyver/pynsist
  documentation: https://pynsist.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pynsist
  cfe-upstream-registry: pypi
  cfe-upstream-name: pynsist
