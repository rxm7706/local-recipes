# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: json-log-formatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/JSON-log-formatter/json_log_formatter-${{ version }}.tar.gz
  sha256: 1d4fd14495ad7e694aa576259ba81acaa69e6945d9d780f32ed25373d7d5ae93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json_log_formatter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/marselester/json-log-formatter
  license: MIT
  license_file: LICENSE
  summary: JSON log formatter
  description: |
    JSON log formatter

extra:
  recipe-maintainers:
    - rxm7706

