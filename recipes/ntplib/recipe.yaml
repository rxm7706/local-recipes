# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: ntplib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/ntplib/ntplib-${{ version }}.tar.gz
  sha256: 899d8fb5f8c2555213aea95efca02934c7343df6ace9d7628a5176b176906267

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ntplib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cf-natali/ntplib
  license: MIT
  license_file: LICENSE
  summary: Python NTP library
  description: |
    Python NTP library

extra:
  recipe-maintainers:
    - iparask

