# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: spiffworkflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SpiffWorkflow/spiffworkflow-${{ version }}.tar.gz
  sha256: 42bc2b52b9829e84ef5947615208973f3812c0a6d716fb2cd0f2a295425db107

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml

tests:
  - python:
      imports:
        - SpiffWorkflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sartography/SpiffWorkflow
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: A workflow framework and BPMN/DMN Processor
  description: |
    A workflow framework and BPMN/DMN Processor
  documentation: https://spiff.works/docs/spiffworkflow/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
