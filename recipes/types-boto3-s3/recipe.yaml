# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.66"

package:
  name: types-boto3-s3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-boto3-s3/types_boto3_s3-${{ version }}.tar.gz
  sha256: 23d94a71f0f43c2822187d0f58bf1d098d8947dd406df28c794a3838d29a91f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    - boto3
    - typing_extensions

tests:
  - python:
      imports:
        - types_boto3_s3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youtype/mypy_boto3_builder
  license: MIT
  license_file: LICENSE
  summary: Type annotations for boto3 S3 1.43.66 service generated with mypy-boto3-builder 8.12.0
  description: |
    Type annotations for boto3 S3 1.43.66 service generated with mypy-boto3-builder 8.12.0
  repository: https://github.com/youtype/mypy_boto3_builder
  documentation: https://youtype.github.io/types_boto3_docs/types_boto3_s3/

extra:
  recipe-maintainers:
    - rxm7706

