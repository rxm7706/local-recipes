# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: apswutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apswutils/apswutils-${{ version }}.tar.gz
  sha256: 7992828cc4f7261925685e9e40ab189728050bdee049648481ce6a52ddb5d5dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64.0
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - fastcore
    - apsw

tests:
  - python:
      imports:
        - apswutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AnswerDotAI/apswutils
  license: Apache-2.0
  license_file: LICENSE
  summary: A fork of sqlite-minutils for apsw
  description: |
    A fork of sqlite-minutils for apsw

extra:
  recipe-maintainers:
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: apswutils
