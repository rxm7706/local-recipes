schema_version: 1

context:
  version: "14.44.35112"

package:
  name: msvc-runtime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/m/msvc-runtime/msvc_runtime-14.44.35112-cp311-cp311-win32.whl
  sha256: 438a584930820238141162ef9b92bd8099ccca62a67fa0ddef63ed88b8eb4e0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - msvc_runtime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/msvc-runtime/
  license: LicenseRef-Proprietary
  license_file: LICENSE
  summary: Install the Microsoft™ Visual C++™ runtime DLLs to the sys.prefix and Scripts directories
  description: |
    Install the Microsoft™ Visual C++™ runtime DLLs to the sys.prefix and Scripts directories

extra:
  recipe-maintainers:
    - rxm7706

