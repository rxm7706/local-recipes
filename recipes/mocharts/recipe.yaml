# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: mocharts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/m/MoCharts/MoCharts-1.0.3-cp310-cp310-macosx_11_0_arm64.whl
  sha256: 948eb510aa98d61c41dcace3eed13efede7bba01d5dae2fba92fd1f20882be7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython >=7.12.0
    - uvicorn
    - fastapi
    - webdriver-manager >=4.0.2
    - selenium >=4.19.0
    - matplotlib-base
    - networkx
    - requests
    - numpy >=1.21.4
    - pandas >=1.3.5
    - scipy >=1.5.3
    - typer <0.10.0
    - packaging >=20.5

tests:
  - python:
      imports:
        - mocharts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/MoCharts/
  license: Apache-2.0
  license_file: LICENSE
  summary: An interactive data visualization package in Python.
  description: |
    An interactive data visualization package in Python.

extra:
  recipe-maintainers:
    - rxm7706

