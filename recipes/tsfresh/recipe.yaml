# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.2"

package:
  name: tsfresh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tsfresh/tsfresh-${{ version }}.tar.gz
  sha256: a960f474498da07f5ed9992f2054db1d7483e224fdf91d89c28535c3af5cb17d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <70
    - wheel
    - pyscaffold >=3.3a0,<4
  run:
    - python >=${{ python_min }}
    - requests >=2.9.1
    - numpy >=1.15.1
    - pandas >=0.25.0
    - statsmodels >=0.13
    - patsy >=0.4.1
    - pywavelets
    - scikit-learn >=0.22.0
    - tqdm >=4.10.0
    - stumpy >=1.11.1
    - cloudpickle
    - scipy >=1.2.0

tests:
  - python:
      imports:
        - tsfresh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/blue-yonder/tsfresh
  license: MIT
  license_file: LICENSE.txt
  summary: tsfresh extracts relevant characteristics from time series
  description: |
    tsfresh extracts relevant characteristics from time series

extra:
  recipe-maintainers:
    - kempa-liehr
    - MaxBenChrist
    - nils-braun
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tsfresh
  cfe-upstream-registry: pypi
  cfe-upstream-name: tsfresh
  cfe-purls:
    - pkg:conda/tsfresh@${{ version }}?channel=conda-forge
    - pkg:pypi/tsfresh@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/blue-yonder/tsfresh
  cfe-import-names: [tsfresh]
  cfe-source-kind: pypi-sdist
