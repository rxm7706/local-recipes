# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-elasticsearch
  version: 0.64b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_elasticsearch-${{ version }}.tar.gz
  sha256: 43de0a3de69aec043b84567318a8f691a178ec51df4ea81bdcf9dc02ad6f27d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.64b0
    - opentelemetry-semantic-conventions ==0.64b0
    - wrapt <3.0.0,>=1.0.0
    # - opentelemetry-test-utils ==0.37b0
