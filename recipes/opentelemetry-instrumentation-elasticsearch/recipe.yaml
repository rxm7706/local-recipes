# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.64b0"

package:
  name: opentelemetry-instrumentation-elasticsearch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-elasticsearch/opentelemetry_instrumentation_elasticsearch-${{ version }}.tar.gz
  sha256: 43de0a3de69aec043b84567318a8f691a178ec51df4ea81bdcf9dc02ad6f27d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.64b0
    - opentelemetry-semantic-conventions ==0.64b0
    - wrapt <3.0.0,>=1.0.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.elasticsearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-elasticsearch
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry elasticsearch instrumentation
  description: |
    OpenTelemetry elasticsearch instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

