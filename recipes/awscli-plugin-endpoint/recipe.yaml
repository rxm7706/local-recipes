# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: awscli-plugin-endpoint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/awscli-plugin-endpoint/awscli-plugin-endpoint-${{ version }}.tar.gz
  sha256: 9096f01f637f17e7b0c28788a64276acc40c0165f1655a6dc45fec39b96bafd0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - awscli

tests:
  - python:
      imports:
        - awscli_plugin_endpoint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wbingli/awscli-plugin-endpoint
  license: MIT
  license_file: LICENSE
  summary: Endpoint plugin for AWS CLI
  description: |
    Endpoint plugin for AWS CLI

extra:
  recipe-maintainers:
    - rxm7706

