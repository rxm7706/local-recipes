# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: boilerpy3
  version: "1.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/boilerpy3-${{ version }}.tar.gz
  sha256: a9fede212f80a36dbc7d4f93e35d8636911cb6b37085a3230557d16ad0f076c8

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - boilerpy3
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python port of Boilerpipe, for HTML boilerplate removal and text extraction
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/jmriebold/BoilerPy3

extra:
  recipe-maintainers:
    - masci
