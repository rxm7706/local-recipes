# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: repath
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/repath-${{ version }}.tar.gz
  sha256: 8292139bac6a0e43fd9d70605d4e8daeb25d46672e484ed31a24c7ce0aef0fb7

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.9.0

tests:
  - python:
      imports:
        - repath
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Generate regular expressions form ExpressJS path patterns
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/nickcoutsos/python-repath

extra:
  recipe-maintainers:
    - thewchan
