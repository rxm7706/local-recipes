# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17"

package:
  name: pypandoc-binary
  version: ${{ version }}

source:
  url: https://github.com/JessicaTegner/pypandoc/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6fcd5739c2eefec86723df9b6ae4eac2c3918d8bf22b7209adcb5cd1c23d20c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - tomli
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypandoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pypandoc-binary/
  license: MIT
  license_file: LICENSE
  summary: Thin wrapper for pandoc.
  description: |
    Thin wrapper for pandoc.
  repository: https://github.com/JessicaTegner/pypandoc

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
