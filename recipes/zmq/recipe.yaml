# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0"

package:
  name: zmq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zmq/zmq-${{ version }}.tar.gz
  sha256: 6b1a1de53338646e8c8405803cffb659e8eb7bb02fff4c9be62a7acfac8370c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zmq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zeromq/pyzmq
  license: MIT
  license_file: LICENSE
  summary: You are probably looking for pyzmq.
  description: |
    You are probably looking for pyzmq.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
