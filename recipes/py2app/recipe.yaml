# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: py2app
  version: "0.28.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fd38f4a0083d4d1e91ea336eaef678b99d9e1b95ac6302315cad22fa5e859cb1
  patches:
    - if: python_impl == 'pypy'
      then: distutils.patch

build:
  number: 0
  skip: not osx
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - py2applet = py2app.script_py2applet:main
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - altgraph >=0.17.5
    - macholib >=1.16.4
    - modulegraph >=0.19.7
    - pip
    - python
    - setuptools
  run:
    - altgraph >=0.17.5
    - macholib >=1.16.4
    - modulegraph >=0.19.7
    - python
    - setuptools

tests:
  - python:
      imports:
        - py2app
        - py2app.apptemplate
        - py2app.bootstrap
        - py2app.bundletemplate
        - py2app.converters
        - py2app.recipes
        - py2app.recipes.PIL
      pip_check: false
  - script:
      - py2applet

about:
  license: MIT
  license_file: LICENSE.txt
  summary: |
    py2app is a Python setuptools command which will allow you to make
    standalone Mac OS X application bundles and plugins from Python scripts.
    py2app is similar in purpose and design to py2exe for Windows.
    py2app must be used on OSX to build applications, it cannot create Mac
    applications on other platforms.
  homepage: https://github.com/ronaldoussoren/py2app
  repository: https://github.com/ronaldoussoren/py2app
  documentation: https://py2app.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - bkpoon
