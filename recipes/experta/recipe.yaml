# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.4"

package:
  name: experta
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/experta/experta-${{ version }}.tar.gz
  sha256: 7c6ea687043b138f4ac7d3a8aea92aa60c02035e350c105a6bc142203fedc109

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - frozendict
    - schema

tests:
  - python:
      imports:
        - experta
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nilp0inter/experta
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: Expert Systems for Python
  description: |
    Expert Systems for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: experta
  cfe-upstream-registry: pypi
  cfe-upstream-name: experta
