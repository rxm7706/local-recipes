# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: microsoft-sql-server-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-sql-server-mcp/microsoft_sql_server_mcp-${{ version }}.tar.gz
  sha256: 79e5c2a939cc2d45dd5328a7fc3ca79daad3ac02b0f0c736f91495027ef8b315

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.0.0
    - pymssql >=2.2.8

tests:
  - python:
      imports:
        - mssql_mcp_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/microsoft-sql-server-mcp/
  license: MIT
  license_file: LICENSE
  summary: A Model Context Protocol (MCP) server that enables secure interaction with Microsoft SQL Server databases.
  description: |
    A Model Context Protocol (MCP) server that enables secure interaction with Microsoft SQL Server databases.

extra:
  recipe-maintainers:
    - rxm7706

