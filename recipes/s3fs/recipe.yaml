    - pkg:pypi/s3fs@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/fsspec/s3fs/
  cfe-import-names: [s3fs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/s3fs-feedstock
  cfe-forge-recipe-updates-needed: 
