# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.0"

package:
  name: s3fs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/s3fs/s3fs-${{ version }}.tar.gz
  sha256: 76b062d1b2bc7bf4bcd9e7d8f1eb2b5dd9d5cee96ce888664c4ddb5f563146bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiobotocore <4.0.0,>=2.19.0
    - fsspec <2026.7.1,>=2026.7.0
    - aiohttp !=4.0.0a0,!=4.0.0a1,>=3.9.0

tests:
  - python:
      imports:
        - s3fs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/fsspec/s3fs/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Convenient Filesystem interface over S3
  description: |
    Convenient Filesystem interface over S3

extra:
  recipe-maintainers:
    - martindurant
    - mrocklin
    - tomaugspurger

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: s3fs
  cfe-upstream-registry: pypi
  cfe-upstream-name: s3fs
