# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: s3fs
  version: "2026.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/s3fs-${{ version }}.tar.gz
  sha256: b28de7082d0a4f72392884bdc497e34a4a1582f675d214c7da0acf6e950a0083

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - aiobotocore >=2.19.0,<4.0.0
    - aiohttp
    - fsspec >=2026.6.0,<2026.6.1
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - s3fs
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convenient Filesystem interface over S3
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: http://s3fs.readthedocs.io/en/latest/
  repository: https://github.com/dask/s3fs
  documentation: https://s3fs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - martindurant
    - mrocklin
    - tomaugspurger
