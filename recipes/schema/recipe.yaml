# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: schema
  version: "0.7.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e86cc08edd6fe6e2522648f4e47e3a31920a76e82cce8937535422e310862ab5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-deps . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - contextlib2 >=0.5.5

tests:
  - python:
      imports:
        - schema
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE-MIT
  summary: Schema validation just got Pythonic
  description: |
    schema is a Python library for validating data structures, such as those
    obtained from config-files, forms, external services or command-line
    parsing, converted from JSON/YAML (or something else) to Python data-types.
  homepage: https://github.com/keleshev/schema
  repository: https://github.com/keleshev/schema

extra:
  recipe-maintainers:
    - shcheklein
    - maxhora
