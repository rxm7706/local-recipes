# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pickle5
  version: "0.0.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 80143d4e4ea9d6cd70e841af8745dbc4d50adef5adf99e725d240bcb92e6f1e8

build:
  number: 0
  skip: match(python, "<3.5") or match(python, ">3.7") or python_impl == "pypy"
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - ${{ compiler("c") }}
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - pickle5
      pip_check: false
  - script:
      - python -m pickle5.test.test_pickle

about:
  license: PSF-2.0
  license_file: LICENSE
  summary: Experimental backport of the pickle 5 protocol (PEP 574)
  homepage: https://github.com/pitrou/pickle5-backport

extra:
  recipe-maintainers:
    - jakirkham
    - pitrou
