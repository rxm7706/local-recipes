# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: pysmbclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PySmbClient/PySmbClient-${{ version }}.tar.gz
  sha256: dc528959ffe3fae5cdd2053c0d68b6dfca706d8f4ea78b9b3e741daedc87aed4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysmbclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://bitbucket.org/nosklo/pysmbclient
  license: UNKNOWN
  license_file: LICENSE
  summary: A convenient smbclient wrapper
  description: |
    A convenient smbclient wrapper

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
