# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"
  python_min: python_min | default("3.9")

package:
  name: jupyter-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-cache/jupyter_cache-${{ version }}.tar.gz
  sha256: 16e808eb19e3fb67a223db906e131ea6e01f03aa27f49a7214ce6a5fec186fb9

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - jcache = jupyter_cache.cli.commands.cmd_main:jcache

requirements:
  host:
    - flit-core >=3.4,<4
    - pip
    - python ${{ python_min }}
  run:
    - attrs
    - click
    - importlib-metadata
    - nbclient >=0.2
    - nbformat
    - python >=${{ python_min }}
    - pyyaml
    - sqlalchemy >=1.3.12,<3
    - tabulate

tests:
  - python:
      imports:
        - jupyter_cache
        - jupyter_cache.cache
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
        - if: win
          then: m2-grep
    script:
      - jcache --version
      - jcache --help
      - jcache --version | grep -iE "${{ version | replace('.', '\.') }}$"

about:
  summary: A defined interface for working with a cache of jupyter notebooks.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/executablebooks/jupyter-cache
  documentation: https://jupyter-cache.readthedocs.io

extra:
  recipe-maintainers:
    - anirrudh
    - conda-forge/jupyter-book
