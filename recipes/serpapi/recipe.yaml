# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: serpapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/serpapi/serpapi-${{ version }}.tar.gz
  sha256: aeba7f824e21512deeb6eb8b993e99a153eb1f48bdbbd166ffe2d2e947bf622b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - serpapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serpapi/serpapi-python
  license: MIT
  license_file: LICENSE
  summary: The official Python client for SerpApi.com.
  description: |
    The official Python client for SerpApi.com.
  repository: https://github.com/serpapi/serpapi-python
  documentation: https://serpapi-python.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
