# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: qq-botpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qq-botpy/qq-botpy-${{ version }}.tar.gz
  sha256: 442172a0557a9b43d2777d1c5e072090a9d1a54d588d1c5da8d3efc014f4887f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp <4,>=3.7.4
    - pyyaml
    - apscheduler

tests:
  - python:
      imports:
        - botpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tencent-connect/botpy
  license: Tencent
  license_file: LICENSE
  summary: qq robot client with python3
  description: |
    qq robot client with python3

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
