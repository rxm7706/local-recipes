# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: portalocker
  version: "3.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1f3002956a54a8c3730586c5c77bf18fae4149e07eaf1c29fc3faf4d5a3f89ac
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - pytest-runner
  run:
    - python
    - if: win
      then: pywin32

tests:
  - python:
      imports:
        - portalocker
      pip_check: false
  - files:
      source:
        - portalocker_tests
    requirements:
      run:
        - pytest >=3.4.0
        - pytest-cache >=1.0
        - pytest-cov >=2.5.1
        - pytest-flakes >=2.0.0
        - pytest-pep8 >=1.0.6

about:
  license: PSF-2.0
  license_file: LICENSE
  summary: Portalocker is a library to provide an easy API to file locking.
  homepage: https://github.com/WoLpH/portalocker
  repository: https://github.com/WoLpH/portalocker
  documentation: http://portalocker.readthedocs.org

extra:
  recipe-maintainers:
    - tyrius02
    - sodre
