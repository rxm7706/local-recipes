# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: portalocker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/portalocker/portalocker-${{ version }}.tar.gz
  sha256: 1f3002956a54a8c3730586c5c77bf18fae4149e07eaf1c29fc3faf4d5a3f89ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - if: win
      then: pywin32 >=226

tests:
  - python:
      imports:
        - portalocker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/WoLpH/portalocker
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Portalocker is a library to provide an easy API to file locking.
  documentation: http://portalocker.readthedocs.org
  repository: https://github.com/WoLpH/portalocker

extra:
  recipe-maintainers:
    - tyrius02
    - sodre
    - rxm7706
