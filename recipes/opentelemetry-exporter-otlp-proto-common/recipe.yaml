# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-exporter-otlp-proto-common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-otlp-proto-common/opentelemetry_exporter_otlp_proto_common-${{ version }}.tar.gz
  sha256: dc87a5a5bc58f149a56d1547e4691588fa12994cdc3bc039a694ccb3375862ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-proto ==1.44.0

tests:
  - python:
      imports:
        - opentelemetry.exporter.otlp.proto.common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-common
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Protobuf encoding
  description: |
    OpenTelemetry Protobuf encoding
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - conda-forge/opentelemetry-proto
    - rxm7706
    - mariusvniekerk
    - pb01ka

