# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.0"

package:
  name: domaintools-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/domaintools-api/domaintools_api-${{ version }}.tar.gz
  sha256: 38e5be9dbc79592bbd6f50d8aa12cdc5c01da5d19f1e1bc1bc1f153e8ba4f4e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx ==0.28.1
    - pyyaml
    - rich
    - typer

tests:
  - python:
      imports:
        - domaintools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/domaintools/python_api
  license: MIT
  license_file: LICENSE
  summary: DomainTools Official Python API
  description: |
    DomainTools Official Python API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
