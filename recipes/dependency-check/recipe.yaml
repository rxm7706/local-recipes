# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: dependency-check
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dependency-check/dependency-check-0.6.0.zip
  sha256: 6fa00b63fbdba57210825675956467ea67693a47b6ef192046f9a51732f22c7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dependency_check
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jhermann/dependency-check-py
  license: Apache-2.0
  license_file: LICENSE
  summary: Shim to easily install OWASP dependency-check-cli into Python projects
  description: |
    Shim to easily install OWASP dependency-check-cli into Python projects

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dependency-check
  cfe-upstream-registry: pypi
  cfe-upstream-name: dependency-check
  cfe-purls:
    - pkg:conda/dependency-check@${{ version }}?channel=conda-forge
    - pkg:pypi/dependency-check@${{ version }}
  cfe-upstream-repo: https://github.com/jhermann/dependency-check-py
  cfe-upstream-homepage: https://github.com/jhermann/dependency-check-py
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
