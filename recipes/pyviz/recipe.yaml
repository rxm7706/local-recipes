# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.3"

package:
  name: pyviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyviz/pyviz-${{ version }}.tar.gz
  sha256: c4a8ca4ab6d3d7428eb430ccaaaab2d5051afa9b49c78700c33493d539cf3cd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bokeh
    - holoviews
    - hvplot
    - datashader
    - panel
    - param
    - pyct
    - ipython
    - numpy
    - rise
    - dask
    - notebook
    - matplotlib-base
    - pandas
    - xarray
    - streamz
    - netcdf4
    - fastparquet
    - selenium
    - ipywidgets

tests:
  - python:
      imports:
        - pyviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pyviz.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: How to solve visualization problems with Python tools.
  description: |
    How to solve visualization problems with Python tools.
  repository: https://github.com/pyviz/pyviz
  documentation: http://pyviz.org

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
