# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"
  python_min: "3.13"

package:
  name: azure-functions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-functions/azure_functions-${{ version }}.tar.gz
  sha256: c1b498cf48beefe2271ebc454f1a4fb6f587bd97c116e412773854b4c66ad1dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
    - python-build
  run:
    - python >=${{ python_min }}
    - werkzeug ~=3.1.3

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-functions/
  license: MIT
  license_file: LICENSE
  summary: Python library for Azure Functions.
  description: |
    Python library for Azure Functions.

extra:
  recipe-maintainers:
    - rxm7706

