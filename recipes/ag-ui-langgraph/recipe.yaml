# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.43"

package:
  name: ag-ui-langgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ag-ui-langgraph/ag_ui_langgraph-${{ version }}.tar.gz
  sha256: 6df1577c039c91d9dbd3b0f279bf4b545837ce7f65299e8c7947299c2d467d9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastapi
    - ag-ui-a2ui-toolkit >=0.0.4
    - ag-ui-protocol >=0.1.15
    - langchain-core >=0.3.0
    - langchain >=1.2.0
    - langgraph <2,>=0.6.0
    - pydantic >=2.0.0

tests:
  - python:
      imports:
        - ag_ui_langgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ag-ui-langgraph/
  license: MIT
  license_file: LICENSE
  summary: Implementation of the AG-UI protocol for LangGraph.
  description: |
    Implementation of the AG-UI protocol for LangGraph.

extra:
  recipe-maintainers:

#### CFE metadata AND comments
