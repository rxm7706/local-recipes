# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: django-commands2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-commands2/django_commands2-${{ version }}.tar.gz
  sha256: 48b457d24c853d479bd38a64ac4f2ea509a2e2c872ca183f02b3d2a401d9308e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - celery
    - django
    - djangorestframework
    - portion

tests:
  - python:
      imports:
        - django_commands
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/django-commands2/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://github.com/ramwin/django-commands
  documentation: https://github.com/ramwin/django-commands#readme

extra:
  recipe-maintainers:
    - rxm7706

