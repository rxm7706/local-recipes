# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.3"

package:
  name: nbclassic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nbclassic/nbclassic-${{ version }}.tar.gz
  sha256: 434228763f8cee754318cd6dfa42370db191af630dabab8e30bafc8c1aa3eee6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - babel
    - hatchling
    - jupyter-server >=1.17
  run:
    - python >=${{ python_min }}
    - ipykernel
    - ipython_genutils
    - nest-asyncio >=1.5
    - notebook-shim >=0.2.3

tests:
  - python:
      imports:
        - nbclassic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter/nbclassic
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Notebook as a Jupyter Server extension.
  description: |
    Jupyter Notebook as a Jupyter Server extension.

extra:
  recipe-maintainers:
    - jasongrout
    - afshin
    - jtpio
    - bollwyvl

