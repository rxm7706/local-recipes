# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: llama-index-llms-huggingface
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-huggingface/llama_index_llms_huggingface-${{ version }}.tar.gz
  sha256: a5057c0aa44122953d67e8157ad84f277417f8a935ccfe3f5dcdf1ac12e53f51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - pytorch <3,>=2.1.2
    - transformers <5,>=4.37.0

tests:
  - python:
      imports:
        - llama_index.llms.huggingface
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-huggingface/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms huggingface integration
  description: |
    llama-index llms huggingface integration

extra:
  recipe-maintainers:
    - rxm7706

