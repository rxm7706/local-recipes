# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: fast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fast/fast-${{ version }}.tar.gz
  sha256: 3bcace2a1a25e0671be7253aee5a16b1944eeaabd27a8dff197298be77ceac63

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fast
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/danijar/fast
  license: MIT
  license_file: LICENSE
  summary: Fast format for storing AI training data.
  description: |
    Fast format for storing AI training data.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fast
  cfe-upstream-registry: pypi
  cfe-upstream-name: fast
  cfe-purls:
    - pkg:conda/fast@${{ version }}?channel=conda-forge
    - pkg:pypi/fast@${{ version }}
  cfe-upstream-repo: http://github.com/danijar/fast
  cfe-upstream-homepage: http://github.com/danijar/fast
  cfe-import-names: [fast]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
