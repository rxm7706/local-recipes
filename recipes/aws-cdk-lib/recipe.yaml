# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.265.0"

package:
  name: aws-cdk-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aws-cdk-lib/aws_cdk_lib-${{ version }}.tar.gz
  sha256: 65d8372d3ce23d2517867f12f0b9a684eff933f0c98357153a359650ca0e8865

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ~=75.3.2
    - python-build ~=1.5.0
  run:
    - python >=${{ python_min }}
    - aws-cdk.asset-awscli-v1 ==2.2.292
    - aws-cdk.asset-node-proxy-agent-v6 <3.0.0,>=2.1.2
    - aws-cdk.cloud-assembly-schema <55.0.0,>=54.11.0
    - constructs <11.0.0,>=10.5.0
    - python-jsii <2.0.0,>=1.139.0
    - publication >=0.0.3

tests:
  - python:
      imports:
        - aws_cdk._jsii
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aws/aws-cdk
  license: Apache-2.0
  license_file: LICENSE
  summary: Version 2 of the AWS Cloud Development Kit library
  description: |
    Version 2 of the AWS Cloud Development Kit library
  repository: https://github.com/aws/aws-cdk.git

extra:
  recipe-maintainers:
    - rxm7706

