# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: django-ajax-tables
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-ajax-tables/django_ajax_tables-${{ version }}.tar.gz
  sha256: 5a7e7bc7940aa6332a564916cde22010a858a3d29fc1090ce8061010ec76337c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - django_ajax_tables
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/KiwiTrinsic/django-ajax-tables
  license: MIT
  license_file: LICENSE
  summary: Django tag for ajax-enabled tables
  description: |
    Django tag for ajax-enabled tables

extra:
  recipe-maintainers:
    - rxm7706

