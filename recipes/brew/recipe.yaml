# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: brew
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/brew/brew-0.1.4.zip
  sha256: 11f23fe972631685e2a146f91747f78bbcad9dd2e20e6ea84a3058459c605948

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - brew
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/viisar/brew
  license: MIT
  license_file: LICENSE
  summary: BREW: Python Multiple Classifier System API
  description: |
    BREW: Python Multiple Classifier System API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: brew
  cfe-upstream-registry: pypi
  cfe-upstream-name: brew
  cfe-purls:
    - pkg:conda/brew@${{ version }}?channel=conda-forge
    - pkg:pypi/brew@${{ version }}
  cfe-upstream-repo: https://github.com/viisar/brew
  cfe-upstream-homepage: https://github.com/viisar/brew
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:49:41Z
