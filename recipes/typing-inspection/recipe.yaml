# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.4"

package:
  name: typing-inspection
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typing-inspection/typing_inspection-${{ version }}.tar.gz
  sha256: 547274fa6b0a561ccf549cc9524b999a578e737d015d8709d021f9d0d13bea47

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.15.0

tests:
  - python:
      imports:
        - typing_inspection
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydantic/typing-inspection
  license: MIT
  license_file: LICENSE
  summary: Runtime typing introspection tools
  description: |
    Runtime typing introspection tools
  repository: https://github.com/pydantic/typing-inspection
  documentation: https://pydantic.github.io/typing-inspection/dev/

extra:
  recipe-maintainers:
    - jan-janssen

