# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.1"

package:
  name: tensorflow-hub
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/hub/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ce6abd3f1d39d42333b07c608ae022ac09a3f5984b297b21436c3389d7b77af5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.12.0
    - protobuf >=3.19.6
    - tf-keras >=2.14.1

tests:
  - python:
      imports:
        - tensorflow_hub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tensorflow/hub
  license: Apache-2.0
  license_file: LICENSE
  summary: TensorFlow Hub is a library to foster the publication, discovery, and consumption of reusable parts of machine learning models.
  description: |
    TensorFlow Hub is a library to foster the publication, discovery, and consumption of reusable parts of machine learning models.

extra:
  recipe-maintainers:
    - ocefpaf
    - ehfd

#### CFE metadata AND comments
