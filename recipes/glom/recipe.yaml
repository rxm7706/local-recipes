# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.12.0"

package:
  name: glom
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glom/glom-${{ version }}.tar.gz
  sha256: 1ae7da88be3693df40ad27bdf57a765a55c075c86c971bcddd67927403eb0069

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - boltons >=19.3.0
    - attrs
    - face >=20.1.1

tests:
  - python:
      imports:
        - glom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mahmoud/glom
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A declarative object transformer and formatter, for conglomerating nested data.
  description: |
    A declarative object transformer and formatter, for conglomerating nested data.
  documentation: https://glom.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - CJ-Wright
    - thewchan

#### CFE metadata AND comments
