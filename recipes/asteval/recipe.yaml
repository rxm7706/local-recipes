# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.9"

package:
  name: asteval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asteval/asteval-${{ version }}.tar.gz
  sha256: 4f7323d63d9fbf89d7e1d5f8bb59b6c093970c15bb5926e6e67d0195858aa230

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asteval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lmfit/asteval
  license: MIT
  license_file: LICENSE
  summary: Safe, minimalistic evaluator of python expression using ast module
  description: |
    Safe, minimalistic evaluator of python expression using ast module
  documentation: https://lmfit.github.io/asteval/

extra:
  recipe-maintainers:
    - souravsingh
    - newville

#### CFE metadata AND comments
