# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.38.1"

package:
  name: geocoder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geocoder/geocoder-${{ version }}.tar.gz
  sha256: c9925374c961577d0aee403b09e6f8ea1971d913f011f00ca70c76beaf7a77e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - ratelim
    - requests
    - six

tests:
  - python:
      imports:
        - geocoder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DenisCarriere/geocoder
  license: Apache-2.0
  license_file: LICENSE
  summary: Geocoder is a simple and consistent geocoding library.
  description: |
    Geocoder is a simple and consistent geocoding library.

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
