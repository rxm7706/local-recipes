# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.12"

package:
  name: proglog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/proglog/proglog-${{ version }}.tar.gz
  sha256: 361ee074721c277b89b75c061336cb8c5f287c92b043efa562ccf7866cda931c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm

tests:
  - python:
      imports:
        - proglog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Edinburgh-Genome-Foundry/proglog
  license: MIT
  license_file: LICENSE
  summary: Log and progress bar manager for console, notebooks, web...
  description: |
    Log and progress bar manager for console, notebooks, web...

extra:
  recipe-maintainers:
    - mdraw

