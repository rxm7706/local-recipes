# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-huggingface
  version: "1.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_huggingface-${{ version }}.tar.gz
  sha256: 1dd91ec415190d2704e93ec149618e3145075863ba37e74afc9080d685dc2743

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - huggingface_hub >=0.33.4,<2.0.0
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.2.31,<2.0.0
    - tokenizers >=0.19.1,<1.0.0
    - transformers >=4.39.0
    - sentence-transformers >=2.6.0

tests:
  - python:
      imports:
        - langchain_huggingface
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Hugging Face and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
