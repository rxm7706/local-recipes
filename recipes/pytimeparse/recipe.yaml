# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytimeparse
  version: "1.1.8"
  bundle: tar.gz
  hash: e86136477be924d7e670646a98561957e8ca7308d44841e21f5ddea757556a0a

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - pytimeparse
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.rst
  summary: A small Python library to parse various kinds of time expressions
  homepage: https://github.com/wroberts/pytimeparse
  repository: https://github.com/wroberts/pytimeparse
  documentation: https://github.com/wroberts/pytimeparse

extra:
  recipe-maintainers:
    - pmlandwehr
