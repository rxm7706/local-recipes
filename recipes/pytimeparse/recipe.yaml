# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.8"

package:
  name: pytimeparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytimeparse/pytimeparse-${{ version }}.tar.gz
  sha256: e86136477be924d7e670646a98561957e8ca7308d44841e21f5ddea757556a0a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytimeparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wroberts/pytimeparse
  license: MIT
  license_file: LICENSE
  summary: Time expression parser
  description: |
    Time expression parser

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytimeparse
  cfe-upstream-registry: pypi
  cfe-upstream-name: pytimeparse
