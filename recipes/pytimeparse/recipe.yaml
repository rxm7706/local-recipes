    - pkg:pypi/pytimeparse@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/wroberts/pytimeparse
  cfe-import-names: [pytimeparse]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pytimeparse-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.1.8

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

