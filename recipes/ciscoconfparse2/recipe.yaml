# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.18"

package:
  name: ciscoconfparse2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ciscoconfparse2/ciscoconfparse2-${{ version }}.tar.gz
  sha256: a28d4117907664b0231c2d3c5702ede9fdc3c7d78f9336fcb857b3d5bb983dc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - attrs <27.0.0,>25.4.0
    - dnspython ==2.8.0
    - hier-config ==2.3.1
    - hypothesis ==6.152.7
    - libpass ==1.9.3
    - loguru >=0.7.2
    - macaddress ==2.0.2
    - pyparsing ==3.3.2
    - pyyaml >=6.0.3
    - rich >=14.3.3
    - toml ==0.10.2
    - traitlets ==5.15.0
    - typeguard ==4.5.2

tests:
  - python:
      imports:
        - ciscoconfparse2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mpenning/ciscoconfparse2
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Parse, Audit, Query, Build, and Modify Cisco IOS-style and JunOS-style configs
  description: |
    Parse, Audit, Query, Build, and Modify Cisco IOS-style and JunOS-style configs
  documentation: http://www.pennington.net/py/ciscoconfparse2/

extra:
  recipe-maintainers:
    - rxm7706

