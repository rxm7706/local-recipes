{% set name = "opentelemetry-instrumentation-pyramid" %}
{% set version = "0.66b1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_pyramid-{{ version }}.tar.gz
  sha256: 769092e65dfc9254272ce62e0c2e1f45289bb976c386ae2b7ed9c3d029404e82

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-wsgi ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-util-http ==0.66b1
    - wrapt <3.0.0,>=1.0.0
    # - werkzeug ==0.16.1
    # - pyramid >=1.7
