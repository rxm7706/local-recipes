schema_version: 1

context:
  name: opentelemetry-instrumentation-pyramid
  version: 0.66b1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-pyramid/opentelemetry_instrumentation_pyramid-${{ version }}.tar.gz
  sha256: 769092e65dfc9254272ce62e0c2e1f45289bb976c386ae2b7ed9c3d029404e82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-wsgi ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-util-http ==0.66b1
    - wrapt <3.0.0,>=1.0.0
