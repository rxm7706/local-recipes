# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: scheduler-jupyter-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scheduler-jupyter-plugin/scheduler_jupyter_plugin-${{ version }}.tar.gz
  sha256: 2b9716b7e13c53e79488c73deec9b10a9cef24b6f7752fee9d3ce4bde6df9523

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - aiofiles <23,>=22.1.0
    - aiohttp ~=3.9.5
    - cron-descriptor >=1.4.5
    - gcs-jupyter-plugin
    - google-cloud-compute
    - google-cloud-iam
    - google-cloud-jupyter-config >=0.0.10
    - google-cloud-kms
    - google-cloud-logging
    - google-cloud-storage ~=2.18.2
    - jupyter-server <3,>=2.4.0
    - pendulum >=3.0.0
    - pydantic ~=1.10.0

tests:
  - python:
      imports:
        - scheduler_jupyter_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudPlatform/scheduler-jupyter-plugin
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A JupyterLab extension.
  description: |
    A JupyterLab extension.
  repository: https://github.com/GoogleCloudPlatform/scheduler-jupyter-plugin.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
