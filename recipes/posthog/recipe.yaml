# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.39.1"

package:
  name: posthog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/posthog/posthog-${{ version }}.tar.gz
  sha256: 0d184596e35057457fc1094883646fd23de2d6338db8b9c3ea770643fb55d8a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=83.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - requests <3.0,>=2.7
    - backoff >=1.10.0
    - distro >=1.5.0
    - typing_extensions >=4.2.0

tests:
  - python:
      imports:
        - posthog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/posthog/posthog-python
  license: MIT
  license_file: LICENSE
  summary: Integrate PostHog into any python application.
  description: |
    Integrate PostHog into any python application.
  repository: https://github.com/posthog/posthog-python

extra:
  recipe-maintainers:
    - Twixes
    - dmarticus
    - k11kirky
    - posthog-bot

