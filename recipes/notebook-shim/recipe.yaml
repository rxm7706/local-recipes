# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: notebook-shim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/notebook-shim/notebook_shim-${{ version }}.tar.gz
  sha256: b4b2cfa1b65d98307ca24361f5b30fe785b53c3fd07b7a47e89acb5e6ac638cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.0
  run:
    - python >=${{ python_min }}
    - jupyter-server <3,>=1.8

tests:
  - python:
      imports:
        - notebook_shim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/notebook-shim/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A shim layer for notebook traits and config
  description: |
    A shim layer for notebook traits and config

extra:
  recipe-maintainers:
    - bollwyvl
    - jtpio
    - Zsailer

