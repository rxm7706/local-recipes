# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.1"

package:
  name: z0lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/z0lib/z0lib-${{ version }}.tar.gz
  sha256: d9f012caab053dc450dddea692caeb176b49edb2686b46f21ca7a0a701307300

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - z0lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zeroincombenze/tools
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Bash zeroincombenze lib
  description: |
    Bash zeroincombenze lib
  repository: https://github.com/zeroincombenze/tools/tree/master/z0lib
  documentation: https://zeroincombenze-tools.readthedocs.io/en/latest/#z0lib

extra:
  recipe-maintainers:
    - rxm7706

