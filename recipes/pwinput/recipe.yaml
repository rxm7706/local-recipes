# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: pwinput
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pwinput/pwinput-${{ version }}.tar.gz
  sha256: ca1a8bd06e28872d751dbd4132d8637127c25b408ea3a349377314a5491426f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pwinput
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/asweigart/pwinput
  license: MIT
  license_file: LICENSE
  summary: A cross-platform Python module that displays **** for password input. Works on Windows, unlike getpass. Formerly called stdiomask.
  description: |
    A cross-platform Python module that displays **** for password input. Works on Windows, unlike getpass. Formerly called stdiomask.

extra:
  recipe-maintainers:
    - rxm7706

