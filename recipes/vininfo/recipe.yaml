# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: vininfo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vininfo/vininfo-${{ version }}.tar.gz
  sha256: 1b792e0c73a743f1bcb8d62c8498da75a936a6ac9b37c13b7741176fc7356225

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vininfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/idlesign/vininfo
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Extracts useful information from Vehicle Identification Number (VIN)
  description: |
    Extracts useful information from Vehicle Identification Number (VIN)

extra:
  recipe-maintainers:
    - rxm7706

