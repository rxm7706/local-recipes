# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: python-logging-loki
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-logging-loki/python-logging-loki-${{ version }}.tar.gz
  sha256: b83610c8a3adc99fbab072493b91dfb25ced69be4874fefe3ab457b391adbf60

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rfc3339
    - requests

tests:
  - python:
      imports:
        - logging_loki
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/greyzmeem/python-logging-loki
  license: MIT
  license_file: LICENSE
  summary: Python logging handler for Grafana Loki.
  description: |
    Python logging handler for Grafana Loki.

extra:
  recipe-maintainers:
    - rxm7706

