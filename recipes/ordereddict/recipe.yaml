# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ordereddict
  version: "1.1"
  checksum: 1c35b4ac206cef2d24816c89f89cf289dd3d38cf7c449bb3fab7bf6d43f01b1f

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ checksum }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  skip: match(python, ">=2.7")
  script: python setup.py install

requirements:
  build:
    - python
  run:
    - python

tests:
  - python:
      imports:
        - ordereddict
      pip_check: false

about:
  # Had no home page. So pointed it to PyPI.
  license: MIT
  license_file: LICENSE
  summary: A drop-in substitute for Py2.7's new collections.OrderedDict that works in Python 2.4-2.6.
  homepage: https://pypi.python.org/pypi/ordereddict

extra:
  recipe-maintainers:
    - jakirkham
