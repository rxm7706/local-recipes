# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: backports.strenum
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/backports_strenum-${{ version }}.tar.gz
  sha256: 77c52407342898497714f0596e86188bb7084f89063226f4ba66863482f42414

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8,<3.11
    - backports
    - poetry-core
    - pip
  run:
    - python >=3.8.6,<3.11
    - backports
    - python >=3.11

tests:
  - python:
      imports:
        - backports.strenum
      pip_check: true
  - script:
      - python -c "from enum import StrEnum"

about:
  summary: Base class for creating enumerated constants that are also subclasses of str
  license: PSF-2.0
  license_file: LICENSE
  homepage: https://github.com/clbarnes/backports.strenum

extra:
  recipe-maintainers:
    - tadeu
