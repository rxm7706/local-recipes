    - pkg:pypi/jwt@${{ version }}
  cfe-upstream-repo: https://github.com/GehirnInc/python-jwt.git
  cfe-upstream-homepage: https://pypi.org/project/jwt/
  cfe-import-names: [jwt]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
