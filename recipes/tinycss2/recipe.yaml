# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: tinycss2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tinycss2/tinycss2-${{ version }}.tar.gz
  sha256: d339d2b616ba90ccce58da8495a78f46e55d4d25f9fd71dfd526f07e7d53f957

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - webencodings >=0.4

tests:
  - python:
      imports:
        - tinycss2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.courtbouillon.org/tinycss2
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A tiny CSS parser
  description: |
    A tiny CSS parser
  repository: https://github.com/Kozea/tinycss2/
  documentation: https://doc.courtbouillon.org/tinycss2/

extra:
  recipe-maintainers:
    - johanneskoester
    - mrandrewandrade
    - thewchan

