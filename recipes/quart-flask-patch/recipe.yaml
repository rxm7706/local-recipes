# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: quart-flask-patch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quart-flask-patch/quart_flask_patch-${{ version }}.tar.gz
  sha256: 81dc073698d54ffe1d8c85a556881c13215923a920f9300a02b5005d5447268d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - quart

tests:
  - python:
      imports:
        - quart_flask_patch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pgjones/quart-flask-patch/
  license: MIT
  license_file: LICENSE
  summary: Quart-Flask-Patch is a Quart extension that patches Quart to work with Flask extensions.
  description: |
    Quart-Flask-Patch is a Quart extension that patches Quart to work with Flask extensions.
  repository: https://github.com/pgjones/quart-flask-patch/

extra:
  recipe-maintainers:
    - rxm7706

