# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8.0"

package:
  name: pytest-xdist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-xdist/pytest_xdist-${{ version }}.tar.gz
  sha256: 7e578125ec9bc6050861aa93f2d59f1d8d085595d6551c2c90b6f4fad8d3a9f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}
    - execnet >=2.1
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - xdist
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-xdist
  license: MIT
  license_file: LICENSE
  summary: pytest xdist plugin for distributed testing, most importantly across multiple CPUs
  description: |
    pytest xdist plugin for distributed testing, most importantly across multiple CPUs
  repository: https://github.com/pytest-dev/pytest-xdist
  documentation: https://pytest-xdist.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - goanpeca
    - nicoddemus

#### CFE metadata AND comments
