# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0"

package:
  name: paramiko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/paramiko/paramiko-${{ version }}.tar.gz
  sha256: 36763b5b95c2a0dcfdf1abc48e48156ee425b21efe2f0e787c2dd5a95c0e5e79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - bcrypt >=3.2
    - cryptography >=3.3
    - invoke >=2.0
    - pynacl >=1.5

tests:
  - python:
      imports:
        - paramiko
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/paramiko/
  license: LGPL-2.1
  license_file: LICENSE
  summary: SSH2 protocol library
  description: |
    SSH2 protocol library
  repository: https://github.com/paramiko/paramiko
  documentation: https://docs.paramiko.org

extra:
  recipe-maintainers:
    - vamega
    - jakirkham
    - tschoonj
    - jan-janssen

#### CFE metadata AND comments
