# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: googleapis-common-protos
  version: "1.75.1"

recipe:
  name: ${{ name|lower }}-feedstock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d3042c6c5a2d4e67113104d6b6818b59b6bd92a197f2a91508e801fe815cf071

build:
  number: 0

outputs:
  - package:
      name: ${{ name }}
    build:
      noarch: python
      script: |
        rm -rf test MANIFEST.in
        ${{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - protobuf >=6.33.5,<8.0.0
        - setuptools
      run:
        - python >=${{ python_min }}
        - protobuf >=6.33.5,<8.0.0
    tests:
      - python:
          imports:
            - google.api
            - google.api.annotations_pb2
            - google.api.auth_pb2
            - google.api.backend_pb2
            - google.api.billing_pb2
            - google.api.client_pb2
            - google.api.config_change_pb2
            - google.api.consumer_pb2
            - google.api.context_pb2
            - google.api.control_pb2
            - google.api.distribution_pb2
            - google.api.documentation_pb2
            - google.api.endpoint_pb2
            - google.api.field_behavior_pb2
            - google.api.http_pb2
            - google.api.httpbody_pb2
            - google.api.label_pb2
            - google.api.launch_stage_pb2
            - google.api.log_pb2
            - google.api.logging_pb2
            - google.api.metric_pb2
            - google.api.monitored_resource_pb2
            - google.api.monitoring_pb2
            - google.api.quota_pb2
            - google.api.resource_pb2
            - google.api.service_pb2
            - google.api.source_info_pb2
            - google.api.system_parameter_pb2
            - google.api.usage_pb2
            - google.longrunning
            - google.longrunning.operations_pb2
            - google.longrunning.operations_proto
            - google.longrunning.operations_proto_pb2
            - google.rpc
            - google.rpc.code_pb2
            - google.rpc.error_details_pb2
            - google.rpc.status_pb2
            - google.type
            - google.type.calendar_period_pb2
            - google.type.color_pb2
            - google.type.date_pb2
            - google.type.dayofweek_pb2
            - google.type.expr_pb2
            - google.type.fraction_pb2
            - google.type.latlng_pb2
            - google.type.money_pb2
            - google.type.postal_address_pb2
            - google.type.quaternion_pb2
            - google.type.timeofday_pb2
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: ${{ name }}-grpc
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, lower_bound='x.x', upper_bound='x.x') }}
        - grpcio >=1.59.0,<2.0.0
    tests:
      - python:
          imports:
            - google.api
            - google.api.annotations_pb2
            - google.api.auth_pb2
            - google.api.backend_pb2
            - google.api.billing_pb2
            - google.api.client_pb2
            - google.api.config_change_pb2
            - google.api.consumer_pb2
            - google.api.context_pb2
            - google.api.control_pb2
            - google.api.distribution_pb2
            - google.api.documentation_pb2
            - google.api.endpoint_pb2
            - google.api.field_behavior_pb2
            - google.api.http_pb2
            - google.api.httpbody_pb2
            - google.api.label_pb2
            - google.api.launch_stage_pb2
            - google.api.log_pb2
            - google.api.logging_pb2
            - google.api.metric_pb2
            - google.api.monitored_resource_pb2
            - google.api.monitoring_pb2
            - google.api.quota_pb2
            - google.api.resource_pb2
            - google.api.service_pb2
            - google.api.source_info_pb2
            - google.api.system_parameter_pb2
            - google.api.usage_pb2
            - google.longrunning
            - google.longrunning.operations_grpc
            - google.longrunning.operations_grpc_pb2
            - google.longrunning.operations_pb2
            - google.longrunning.operations_proto
            - google.longrunning.operations_proto_pb2
            - google.rpc
            - google.rpc.code_pb2
            - google.rpc.error_details_pb2
            - google.rpc.status_pb2
            - google.type
            - google.type.calendar_period_pb2
            - google.type.color_pb2
            - google.type.date_pb2
            - google.type.dayofweek_pb2
            - google.type.expr_pb2
            - google.type.fraction_pb2
            - google.type.latlng_pb2
            - google.type.money_pb2
            - google.type.postal_address_pb2
            - google.type.quaternion_pb2
            - google.type.timeofday_pb2
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/googleapis-common-protos
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: Common protobufs used in Google APIs
  description: |
    Google APIs common protos

    googleapis-common-protos contains the python classes generated from the
    common protos in the https://github.com/googleapis/api-common-protos
    repository.

  documentation: https://github.com/googleapis/google-cloud-python/blob/main/packages/googleapis-common-protos/README.rst
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/googleapis-common-protos

extra:
  recipe-maintainers:
    - BrentDorsey
    - parthea
    - tswast
    - xylar
