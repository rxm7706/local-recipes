# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.75.1"

package:
  name: googleapis-common-protos
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/googleapis-common-protos/googleapis_common_protos-${{ version }}.tar.gz
  sha256: d3042c6c5a2d4e67113104d6b6818b59b6bd92a197f2a91508e801fe815cf071

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - googleapis-common-protos
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - googleapis_common_protos
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/googleapis-common-protos/
  license: Apache-2.0
  license_file: LICENSE
  summary: Common protobufs used in Google APIs
  description: |
    Common protobufs used in Google APIs
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/googleapis-common-protos

extra:
  recipe-maintainers:
    - BrentDorsey
    - parthea
    - tswast
    - xylar

