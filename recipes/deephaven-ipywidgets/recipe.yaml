# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: deephaven-ipywidgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-ipywidgets/deephaven_ipywidgets-${{ version }}.tar.gz
  sha256: 78ad077a8fdef2daaba64804baa7154188e1ea21ebed3a3056635e4b20277590

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - jupyter-packaging ==0.7.9
    - jupyterlab ==4.*
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - ipywidgets <9,>=8.0.0

tests:
  - python:
      imports:
        - deephaven_ipywidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-ipywidgets
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Custom Jupyter Widget Library
  description: |
    A Custom Jupyter Widget Library

extra:
  recipe-maintainers:
    - rxm7706

