# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: jira-mcp-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jira-mcp-server/jira_mcp_server-${{ version }}.tar.gz
  sha256: d8ba89a6e74c805a1e11ae53309141196fe74a8d844f959cd2d38db726595ce6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio
    - fastmcp >=2.0.0
    - httpx >=0.25
    - jira >=3.0
    - pydantic-settings >=2.0
    - python-dotenv >=1.0

tests:
  - python:
      imports:
        - jira_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jira-mcp-server/
  license: MIT
  license_file: LICENSE
  summary: An MCP server for interacting with Jira using username/password authentication.
  description: |
    An MCP server for interacting with Jira using username/password authentication.

extra:
  recipe-maintainers:
    - rxm7706

