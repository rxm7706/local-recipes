# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: toon-format
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toon-format/toon_format-${{ version }}.tar.gz
  sha256: 77303c9b06956fe8b0066d2bca52dfdc63e2b3abba439c3c3545dbbd43a97d48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.7,<0.10.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - toon_format
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://toonformat.dev
  license: MIT
  license_file: LICENSE
  summary: Token-Oriented Object Notation – a token-efficient JSON alternative for LLM prompts
  description: |
    Token-Oriented Object Notation – a token-efficient JSON alternative for LLM prompts
  repository: https://github.com/toon-format/toon-python
  documentation: https://github.com/toon-format/toon

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: toon-format
  cfe-upstream-registry: pypi
  cfe-upstream-name: toon-format
