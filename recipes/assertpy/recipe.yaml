# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: assertpy
  version: "1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/assertpy-${{ version }}.tar.gz
  sha256: acc64329934ad71a3221de185517a43af33e373bb44dc05b5a9b174394ef4833

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8

tests:
  - python:
      imports:
        - assertpy
      pip_check: true

about:
  summary: Simple assertion library for unit testing in python with a fluent API
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/assertpy/assertpy

extra:
  recipe-maintainers:
    - Solganis
    - dwyatte
    - saturnboy
