# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.1"

package:
  name: azure-mgmt-managedservices
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-managedservices/azure_mgmt_managedservices-${{ version }}.tar.gz
  sha256: 2a702946254fbdc63ac2cb0aad6a34416d236048488413068dcec426933a0483

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-mgmt-core >=1.6.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-mgmt-managedservices/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Managedservices Management Client Library for Python
  description: |
    Microsoft Azure Managedservices Management Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

