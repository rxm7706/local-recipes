# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: peft
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/peft/peft-${{ version }}.tar.gz
  sha256: 4769c8093a4ca145fd6fb3fd4dd50449675f5fe46434ad1e98b285a132d4b1d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.17
    - packaging >=20.0
    - psutil
    - pyyaml
    - pytorch >=1.13.0
    - transformers
    - tqdm
    - accelerate >=0.21.0
    - safetensors
    - huggingface-hub >=0.25.0

tests:
  - python:
      imports:
        - peft
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/peft
  license: Apache-2.0
  license_file: LICENSE
  summary: Parameter-Efficient Fine-Tuning (PEFT)
  description: |
    Parameter-Efficient Fine-Tuning (PEFT)

extra:
  recipe-maintainers:
    - weiji14

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: peft
  cfe-upstream-registry: pypi
  cfe-upstream-name: peft
  cfe-purls:
    - pkg:conda/peft@${{ version }}?channel=conda-forge
    - pkg:pypi/peft@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/huggingface/peft
  cfe-import-names: [peft]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/peft-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T02:57:31Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T02:57:31Z
