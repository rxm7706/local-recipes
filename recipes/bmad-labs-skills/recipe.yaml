# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0.dev0"
  # Upstream repo (bmad-labs/skills) has no release tags; pinned to the latest
  # main commit. Bump `version` (from .claude-plugin/marketplace.json
  # metadata.version) and `commit` together.
  commit: 81fe19ede7ad5c40191267fe455248eed0a06f97

package:
  name: bmad-labs-skills
  version: ${{ version }}

source:
  url: https://github.com/bmad-labs/skills/archive/${{ commit }}.tar.gz
  sha256: 3dad733617ae154708409e33ca8e64fa4c884c008ae7648c40f8cc85c1e96982

build:
  number: 1
  noarch: generic

requirements:
  run:
    - python >=3.10

tests:
  - script:
      - if: not win
        then:
          - bmad-labs-skills-install --help
          - test -d "${CONDA_PREFIX}/share/bmad-labs-skills/skills"
          - test -d "${CONDA_PREFIX}/share/bmad-labs-skills/skills/software-research"
          - test -d "${CONDA_PREFIX}/share/bmad-labs-skills/skills/ultrathink-protocol"
          - test -d "${CONDA_PREFIX}/share/bmad-labs-skills/skills/mcp-builder"
          - test -f "${CONDA_PREFIX}/share/bmad-labs-skills/.claude-plugin/marketplace.json"
      - if: win
        then:
          - bmad-labs-skills-install.bat --help
          - if not exist "%CONDA_PREFIX%\share\bmad-labs-skills\skills" exit 1
          - if not exist "%CONDA_PREFIX%\share\bmad-labs-skills\.claude-plugin\marketplace.json" exit 1

about:
  homepage: https://github.com/bmad-labs/skills
  repository: https://github.com/bmad-labs/skills
  license: MIT
  license_file: LICENSE
  summary: Community BMAD skills marketplace for Claude Code (22 general-purpose skills)
  description: |
    bmad-labs-skills packages the bmad-labs/skills community marketplace — a
    collection of 22 general-purpose Claude Code skills covering TypeScript
    unit/e2e testing and clean code, MCP server development, slide and
    presentation generation, EPUB/book conversion, Atlassian REST, Gemini
    multimodal, release-please automation, RCA reports, software research,
    trade-off analysis, multi-repo git ops, and more.

    NOTE: this is a third-party community marketplace (owner thuantan2060);
    it has no stated affiliation with bmad-code-org or the official BMad
    Method skill set.

    After installation, run ``bmad-labs-skills-install`` in your project
    directory to copy the skills into ``.claude/skills/`` so Claude Code can
    discover them (or pass an explicit destination directory).

extra:
  recipe-maintainers:
    - rxm7706

