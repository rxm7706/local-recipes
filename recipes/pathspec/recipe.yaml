    - pkg:pypi/pathspec@${{ version }}
  cfe-upstream-repo: https://github.com/cpburnz/python-pathspec
  cfe-upstream-homepage: https://pypi.org/project/pathspec/
  cfe-import-names: [pathspec]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pathspec-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-1.1.1

  cfe-forge-blocker-list: []
