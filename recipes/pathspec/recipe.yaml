# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: pathspec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathspec/pathspec-${{ version }}.tar.gz
  sha256: 17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathspec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pathspec/
  license: MPL-2.0
  license_file: LICENSE
  summary: Utility library for gitignore style pattern matching of file paths.
  description: |
    Utility library for gitignore style pattern matching of file paths.
  repository: https://github.com/cpburnz/python-pathspec
  documentation: https://python-path-specification.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - bollwyvl
    - proinsias

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pathspec
  cfe-upstream-registry: pypi
  cfe-upstream-name: pathspec
