# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.29.1"

package:
  name: pami
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pami/pami-${{ version }}.tar.gz
  sha256: 62def7c31dd224b9b2fdf9fc6262f3b89afadb057f3dbabc4d5ac5d15aea2b61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - psutil
    - pandas
    - plotly
    - matplotlib-base
    - resource
    - validators
    - urllib3
    - pillow
    - numpy
    - sphinx
    - sphinx-rtd-theme
    - discord.py
    - networkx
    - deprecated
    - fastparquet

tests:
  - python:
      imports:
        - PAMI
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/udayLab/PAMI
  license: GPL-3.0-only
  license_file: LICENSE
  summary: This software is being developed at the University of Aizu, Aizu-Wakamatsu, Fukushima, Japan
  description: |
    This software is being developed at the University of Aizu, Aizu-Wakamatsu, Fukushima, Japan

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
