# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: scrapy-playwright
  version: "0.0.48"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/scrapy_playwright-${{ version }}.tar.gz
  sha256: 626779aa8bcacd61eebc3e21e362c62cbb5ae75f168a254885f1f7ca9b68d9d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scrapy >=2.0,!=2.4.0
    - playwright-python >=1.15

tests:
  - python:
      imports:
        - scrapy_playwright
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Playwright integration for Scrapy
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scrapy-plugins/scrapy-playwright

extra:
  recipe-maintainers:
    - luftuq
