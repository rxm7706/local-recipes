# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: ipython-sql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipython-sql/ipython-sql-${{ version }}.tar.gz
  sha256: 3db3ce7f9a95dfaf43876fa80b16bdbb9a04de0ba12042cab13e9f596fcffdbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - prettytable
    - ipython
    - sqlalchemy
    - sqlparse
    - six
    - ipython_genutils

tests:
  - python:
      imports:
        - sql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/catherinedevlin/ipython-sql
  license: MIT
  license_file: LICENSE
  summary: RDBMS access via IPython
  description: |
    RDBMS access via IPython
  repository: https://github.com/catherinedevlin/ipython-sql

extra:
  recipe-maintainers:
    - sodre

