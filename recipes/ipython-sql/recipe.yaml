# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ipython-sql
  version: "0.3.9"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7187f6371f38b89d8fb63c2c7c4233d9000fb53b460dae79e4a359df366cc3ed
  file_name: ipython-sql-${{ version }}.tar.gz

build:
  number: 1004
  noarch: python
  script:
    - python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - prettytable
    - ipython >=1.0
    - ipython_genutils >=0.1.0
    - sqlalchemy >=0.6.7
    - sqlparse
    - six

tests:
  - python:
      imports:
        - sql
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: RDBMS access via IPython
  description: 'ipython-sql introduces a %sql (or %%sql) magic to your notebook allowing you to
    connect to a database, using SQLAlchemy connect strings, then issue SQL commands within
    IPython or IPython Notebook.'
  homepage: https://pypi.python.org/pypi/ipython-sql
  repository: https://github.com/catherinedevlin/ipython-sql

extra:
  recipe-maintainers:
    - sodre
