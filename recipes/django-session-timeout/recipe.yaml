# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: django-session-timeout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-session-timeout/django-session-timeout-${{ version }}.tar.gz
  sha256: 648fe4ffa762f3bb62ce7a9ed1bbba8e37648158d555f18a880471982941084c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - six

tests:
  - python:
      imports:
        - django_session_timeout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LabD/django-session-timeout
  license: MIT
  license_file: LICENSE
  summary: Middleware to expire sessions after specific amount of time
  description: |
    Middleware to expire sessions after specific amount of time

extra:
  recipe-maintainers:
    - rxm7706

