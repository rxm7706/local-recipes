# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.4"

package:
  name: sphinx-ansible-theme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-ansible-theme/sphinx_ansible_theme-${{ version }}.tar.gz
  sha256: 724c29a00555794bd56fa6bd570c08c3762439be2fb2897018e37715158ddb98

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.3.0
  run:
    - python >=${{ python_min }}
    - ansible-pygments >=0.1.1
    - sphinx >=5.3.0
    - sphinx-rtd-theme >=1.1.1

tests:
  - python:
      imports:
        - sphinx_ansible_theme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible-community/sphinx_ansible_theme
  license: MIT
  license_file: LICENSE
  summary: Ansible Sphinx Theme
  description: |
    Ansible Sphinx Theme
  documentation: https://sphinx-ansible-theme.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
