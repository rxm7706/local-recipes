# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.5.8"

package:
  name: tornado
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tornado/tornado-${{ version }}.tar.gz
  sha256: 9452e1b208a8bd771e2cb1f2ff564985b9b214bdebbe622793e1799e0a6bd23f

build:
  number: 0
  skip: match(python, "<3.8")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - tornado
        - tornado.platform
        - tornado.test
        - tornado.gen
        - tornado.netutil
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python web framework and asynchronous networking library, originally developed at FriendFeed.
  description: |
    Tornado is a Python web framework and asynchronous networking library.
    By using non-blocking network I/O, Tornado can scale to tens of thousands
    of open connections, making it ideal for long polling, WebSockets, and
    other applications that require a long-lived connection to each user.
  homepage: https://www.tornadoweb.org/
  repository: https://github.com/tornadoweb/tornado
  documentation: https://www.tornadoweb.org/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - ocefpaf
