# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.0"

package:
  name: ara
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ara/ara-${{ version }}.tar.gz
  sha256: 3579c8a80b6ce1b08bdbb557418cf0e12971ba6b8734158f7502b5a2bcd850c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - cliff
    - requests >=2.14.2

tests:
  - python:
      imports:
        - ara.ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://codeberg.org/ansible-community/ara
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: ARA Records Ansible
  description: |
    ARA Records Ansible

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ara
  cfe-upstream-registry: pypi
  cfe-upstream-name: ara
