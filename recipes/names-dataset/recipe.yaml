# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.1"

package:
  name: names-dataset
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/names-dataset/names_dataset-${{ version }}.tar.gz
  sha256: 55f17d0fff976d69ac59d5181e3dd4c3601b18523ce876cbbd83f87f0ef7fd11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pycountry
    - numpy

tests:
  - python:
      imports:
        - names_dataset
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/names-dataset/
  license: MIT
  license_file: LICENSE
  summary: The python library to handle names
  description: |
    The python library to handle names

extra:
  recipe-maintainers:
    - rxm7706

