# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robocorp-workitems
  version: "1.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robocorp_workitems-${{ version }}.tar.gz
  sha256: 03ccc58e967aef4d538aa1ba4a196c035dcee1c3a4c10f7720a38fbe255fd889

build:
  number: 0
  noarch: python
  script:
    - if: win
      then: echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md
    - if: unix
      then: cp -R ${{ RECIPE_DIR }}/README.md ${{ SRC_DIR }}/README.md
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - marshmallow
    - python >=${{ python_min }},<4.0.0
    - robocorp-tasks >=1,<5
    - requests >=2.28.2
    - tenacity >=8.0.1
    - dataclasses-json >=0.6.7,<0.7.0
    - python-dateutil >=2.8.2,<3.0.0

tests:
  - python:
      imports:
        - robocorp.workitems
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Robocorp Work Items library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/robocorp/robocorp/

extra:
  recipe-maintainers:
    - rxm7706
    - zaigner
