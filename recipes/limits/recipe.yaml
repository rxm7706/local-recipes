# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.8.0"

package:
  name: limits
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/limits/limits-${{ version }}.tar.gz
  sha256: c9e0d74aed837e8f6f50d1fcebcf5fd8130957287206bc3799adaee5092655da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.14.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - deprecated >=1.2
    - packaging >=21
    - typing_extensions

tests:
  - python:
      imports:
        - limits
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://limits.readthedocs.org
  license: MIT
  license_file: LICENSE.txt
  summary: Rate limiting utilities
  description: |
    Rate limiting utilities
  repository: https://github.com/alisaifee/limits
  documentation: https://limits.readthedocs.org

extra:
  recipe-maintainers:
    - tiefling-cat
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: limits
  cfe-upstream-registry: pypi
  cfe-upstream-name: limits
  cfe-purls:
    - pkg:conda/limits@${{ version }}?channel=conda-forge
    - pkg:pypi/limits@${{ version }}
  cfe-upstream-repo: https://github.com/alisaifee/limits
  cfe-upstream-homepage: https://limits.readthedocs.org
  cfe-import-names: [limits]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/limits-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:17:44Z
