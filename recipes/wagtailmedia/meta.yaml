{% set name = "wagtailmedia" %}
{% set version = "0.19.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtailmedia-{{ version }}.tar.gz
  sha256: 692ba48f19d15ec10e2fed341e429d727a3db631d6ec228d77911238420f9491

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - django-taggit
    - djangorestframework
    - python >={{ python_min }}
    - wagtail >=7.0
    - django >=5.2

test:
  imports:
    - wagtailmedia
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/torchbox/wagtailmedia
  summary: A Wagtail module for audio and video files.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jsmolic
    - rxm7706
