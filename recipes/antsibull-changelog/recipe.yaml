# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.35.1"

package:
  name: antsibull-changelog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-changelog/antsibull_changelog-${{ version }}.tar.gz
  sha256: 79359ed45ef1d542ea3bf31b09a3ad8389678a2b584254e7c15d6f140a53b33b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - annotated-types
    - antsibull-docs-parser <2.0.0,>=1.2.2
    - antsibull-docutils <2.0.0,>=1.0.0
    - antsibull-fileutils <2.0.0,>=1.0.0
    - docutils
    - packaging
    - pydantic ~=2.0
    - rstcheck <7.0.0,>=3.0.0
    - semantic_version

tests:
  - python:
      imports:
        - antsibull_changelog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-changelog/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Changelog tool for Ansible-core and Ansible collections
  description: |
    Changelog tool for Ansible-core and Ansible collections
  documentation: https://docs.ansible.com/projects/antsibull-changelog/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
