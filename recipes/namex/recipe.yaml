# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: namex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/namex/namex-${{ version }}.tar.gz
  sha256: 117f03ccd302cc48e3f5c58a296838f6b89c83455ab8683a1e85f2a430aa4306

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - namex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/namex/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple utility to separate the implementation of your Python package and its public API surface.
  description: |
    A simple utility to separate the implementation of your Python package and its public API surface.

extra:
  recipe-maintainers:
    - Anselmoo

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: namex
  cfe-upstream-registry: pypi
  cfe-upstream-name: namex
  cfe-purls:
    - pkg:conda/namex@${{ version }}?channel=conda-forge
    - pkg:pypi/namex@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/namex/
  cfe-import-names: [namex]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/namex-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

