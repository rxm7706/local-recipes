# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: fnctl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fnctl/fnctl-${{ version }}.tar.gz
  sha256: 0a3291ff4ecbbdf14e26662cd8beb3a1699d7db3b481307959c95c207f47765b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fnctl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fnctl/
  license: MIT
  license_file: LICENSE
  summary: Self-hosted functions (Lambda-like) runtime and CLI
  description: |
    Self-hosted functions (Lambda-like) runtime and CLI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
