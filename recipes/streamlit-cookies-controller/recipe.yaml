# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: streamlit-cookies-controller
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-cookies-controller/streamlit-cookies-controller-${{ version }}.tar.gz
  sha256: f5df2543de858f1585dcb6e90f58f38aafbf313ee8e237c64663b2d9761583cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_cookies_controller
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NathanChen198/streamlit-cookies-controller
  license: MIT
  license_file: LICENSE
  summary: Streamlit cookies controller
  description: |
    Streamlit cookies controller

extra:
  recipe-maintainers:
    - pb01ka
    - mgorny

