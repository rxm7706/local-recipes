# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.4.2"

package:
  name: robotframework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robotframework/robotframework-${{ version }}.tar.gz
  sha256: 1c934e7f43600de407860cd2bd2fdc41adad4a4a785d8b46b1ed485fdc0f6c9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - robot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://robotframework.org
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Generic automation framework for acceptance testing and robotic process automation (RPA)
  description: |
    Generic automation framework for acceptance testing and robotic process automation (RPA)
  repository: https://github.com/robotframework/robotframework
  documentation: https://robotframework.org/robotframework

extra:
  recipe-maintainers:
    - abloemert
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: robotframework
  cfe-upstream-registry: pypi
  cfe-upstream-name: robotframework
  cfe-purls:
    - pkg:conda/robotframework@${{ version }}?channel=conda-forge
    - pkg:pypi/robotframework@${{ version }}
  cfe-upstream-repo: https://github.com/robotframework/robotframework
  cfe-upstream-homepage: https://robotframework.org
  cfe-import-names: [robot]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/robotframework-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T12:07:12Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T12:07:12Z
