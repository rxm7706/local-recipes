# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: pysat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysat/pysat-${{ version }}.tar.gz
  sha256: 671f33ce107c9a99b03034d72ac8d3d6e02945f8077daa3eec83df7410305688

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - pip >=10
  run:
    - python >=${{ python_min }}
    - dask
    - netcdf4
    - numpy >=1.19
    - pandas >=1.1.5
    - portalocker
    - pytest
    - scipy >=1.5.4
    - toolz
    - xarray >=0.16.2

tests:
  - python:
      imports:
        - pysat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pysat/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Supports science analysis across disparate data platforms
  description: |
    Supports science analysis across disparate data platforms
  repository: https://github.com/pysat/pysat
  documentation: https://pysat.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysat
