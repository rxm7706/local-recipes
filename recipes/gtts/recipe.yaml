# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gTTS
  version: "2.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pndurette/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 98e8f7039990771af0cabc1a6ed09f53d3d9d391903817cf6d3d3ca4cfb0b58b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - gtts-cli = gtts.cli:tts_cli

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - click >=7.1,<8.2
    - requests >=2.27,<3

tests:
  - python:
      imports:
        - gtts
        - gtts.tests
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - gtts/tests
    requirements:
      run:
        - pip
        - pytest >= 7.1.3,< 8.4.0
        - testfixtures
        - python ${{ python_min }}
    script:
      - gtts-cli --help
      - pytest -vvv --capture=tee-sys -k "not file_ascii and not file_utf8 and not test_all" gtts/tests

about:
  summary: Python library and CLI tool to interface with Google Translate text-to-speech API
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pndurette/gTTS
  documentation: http://gtts.readthedocs.org/

extra:
  recipe-maintainers:
    - thewchan
