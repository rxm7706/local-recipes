# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: pip-review
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-review/pip-review-${{ version }}.tar.gz
  sha256: 886fc48503a6ec99851036f30a6be07ce7e4610d1491786affecb7a364eddeda

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pip_review
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jgonggrijp/pip-review
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pip-review lets you smoothly manage all available PyPI updates.
  description: |
    pip-review lets you smoothly manage all available PyPI updates.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pip-review
  cfe-upstream-registry: pypi
  cfe-upstream-name: pip-review
  cfe-purls:
    - pkg:conda/pip-review@${{ version }}?channel=conda-forge
    - pkg:pypi/pip-review@${{ version }}
  cfe-upstream-repo: https://github.com/jgonggrijp/pip-review
  cfe-upstream-homepage: https://github.com/jgonggrijp/pip-review
  cfe-import-names: [pip_review]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T00:05:04Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T00:05:04Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
