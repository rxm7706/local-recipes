# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.8"

package:
  name: pyats-genie-command-parse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyats-genie-command-parse/pyats_genie_command_parse-${{ version }}.tar.gz
  sha256: 914a1647df418669c52648903c65d2353faf2b3ed4a6231e912367660c777061

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel >=0.40.0
  run:
    - python >=${{ python_min }}
    - genie ==26.5
    - pyats ==26.5

tests:
  - python:
      imports:
        - pyats_genie_command_parse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyats-genie-command-parse/
  license: MIT
  license_file: LICENSE
  summary: Run genie parsers directly.
  description: |
    Run genie parsers directly.
  repository: https://github.com/btr1975/pyats-genie-command-parse
  documentation: https://pyats-genie-command-parse.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

