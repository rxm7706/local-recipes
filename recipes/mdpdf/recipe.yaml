# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.18"

package:
  name: mdpdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mdpdf/mdpdf-${{ version }}.tar.gz
  sha256: 2465e47ef772554f09662ce359ac5924eddce1564cb4df685f7bf3ca8d0e6a7c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.9.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pymupdf
    - commonmark
    - click

tests:
  - python:
      imports:
        - mdpdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/normanlorrain/mdpdf
  license: MIT
  license_file: LICENSE
  summary: Python command line application to convert Markdown to PDF.
  description: |
    Python command line application to convert Markdown to PDF.

extra:
  recipe-maintainers:
    - rxm7706

