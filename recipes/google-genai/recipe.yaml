# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.18.1"

package:
  name: google-genai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-genai/google_genai-${{ version }}.tar.gz
  sha256: a1e2be75c16234adc6641afd1ad4dd44218c9eec005d938bdc428585a048918a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - twine >=6.1.0
    - packaging >=24.2
    - pkginfo >=1.12.0
  run:
    - python >=${{ python_min }}
    - anyio <5.0.0,>=4.8.0
    - google-auth <3.0.0,>=2.56.0
    - httpx <1.0.0,>=0.28.1
    - pydantic <3.0.0,>=2.12.5
    - requests <3.0.0,>=2.28.1
    - tenacity <9.2.0,>=8.2.3
    - websockets <17.0,>=13.0.0
    - typing_extensions <5.0.0,>=4.14.0
    - distro <2,>=1.7.0
    - sniffio

tests:
  - python:
      imports:
        - google.genai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/python-genai
  license: Apache-2.0
  license_file: LICENSE
  summary: GenAI Python SDK
  description: |
    GenAI Python SDK

extra:
  recipe-maintainers:
    - hadim

#### CFE metadata AND comments
