# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.30"

package:
  name: mimetypes-magic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mimetypes-magic/mimetypes-magic-${{ version }}.tar.gz
  sha256: ca78fc718a7ea5b886b5380e3a4189d479abf496c7f618b0c21e1cf2140ce3d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - magic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ElissonRodrigues/mimetypes-magic
  license: MIT
  license_file: LICENSE
  summary: File type identification using libmagic
  description: |
    File type identification using libmagic

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
