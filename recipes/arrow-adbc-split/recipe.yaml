# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.0"

package:
  name: adbc-driver-manager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adbc-driver-manager/adbc_driver_manager-${{ version }}.tar.gz
  sha256: 45991f0c2de369d330c6a211ca2edbcce6389c5dc81cde70461bdeb6f8f7b268

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - cython >=3.1.0
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - adbc-driver-manager
    - typing_extensions

tests:
  - python:
      imports:
        - adbc_driver_manager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://arrow.apache.org/adbc/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: A generic entrypoint for ADBC drivers.
  description: |
    A generic entrypoint for ADBC drivers.

extra:
  recipe-maintainers:
    - lidavidm

#### CFE metadata AND comments
