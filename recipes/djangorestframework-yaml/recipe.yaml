# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: djangorestframework-yaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework-yaml/djangorestframework-yaml-${{ version }}.tar.gz
  sha256: 1b2cfd7482425f3c6924a8eb803d6f73276e76b03293cd7144c755753e029f15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - rest_framework_yaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jpadilla/django-rest-framework-yaml
  license: BSD-3-Clause
  license_file: LICENSE
  summary: YAML support for Django REST Framework
  description: |
    YAML support for Django REST Framework

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
