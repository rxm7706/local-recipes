# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: flameprof
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flameprof/flameprof-${{ version }}.tar.gz
  sha256: dbc86d4190cbbba624f1e0a40f44d9db96138e27534d83c8ef42d420857875a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flameprof
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/baverman/flameprof/
  license: MIT
  license_file: LICENSE
  summary: cProfile flamegraph generator
  description: |
    cProfile flamegraph generator

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
