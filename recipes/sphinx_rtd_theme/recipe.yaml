# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: sphinx-rtd-theme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-rtd-theme/sphinx_rtd_theme-${{ version }}.tar.gz
  sha256: b44276f2c276e909239a4f6c955aa667aaafeb78597923b1c60babc76db78e4c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx <10,>=6
    - docutils <0.23,>0.18
    - sphinxcontrib-jquery <5,>=4

tests:
  - python:
      imports:
        - sphinx_rtd_theme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://sphinx-rtd-theme.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Read the Docs theme for Sphinx
  description: |
    Read the Docs theme for Sphinx
  repository: https://github.com/readthedocs/sphinx_rtd_theme

extra:
  recipe-maintainers:
    - SylvainCorlay
    - fhoehle

