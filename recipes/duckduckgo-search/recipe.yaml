# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.1"

package:
  name: duckduckgo-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/duckduckgo-search/duckduckgo_search-${{ version }}.tar.gz
  sha256: 9da91c9eb26a17e016ea1da26235d40404b46b0565ea86d75a9f78cc9441f935

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8.1.8
    - primp >=0.15.0
    - lxml >=5.3.0

tests:
  - python:
      imports:
        - duckduckgo_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deedy5/duckduckgo_search
  license: MIT
  license_file: LICENSE.md
  summary: "Search for words, documents, images, news, maps and text translation using the DuckDuckGo.com search engine."
  description: |
    Search for words, documents, images, news, maps and text translation using the DuckDuckGo.com search engine.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
