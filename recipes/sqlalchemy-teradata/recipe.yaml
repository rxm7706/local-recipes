# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0.dev0"

package:
  name: sqlalchemy-teradata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-teradata/sqlalchemy_teradata-${{ version }}.tar.gz
  sha256: 4675bbe31f3b1ea672ec83a2fff504b7b64742bcf5f5d7d08d5e7d0258c723bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlalchemy_teradata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlalchemy-teradata/
  license: MIT
  license_file: LICENSE
  summary: Teradata dialect for SQLAlchemy
  description: |
    Teradata dialect for SQLAlchemy

extra:
  recipe-maintainers:
    - rxm7706

