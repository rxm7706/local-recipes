# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.12"

package:
  name: unicrypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unicrypto/unicrypto-${{ version }}.tar.gz
  sha256: 7b7fc4f54d56422abbbc41f863f99b27a8674531f4a42003f3f953e4a722bde1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - pycryptodomex

tests:
  - python:
      imports:
        - unicrypto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/unicrypto
  license: MIT
  license_file: LICENSE
  summary: Unified interface for cryptographic libraries
  description: |
    Unified interface for cryptographic libraries

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
