# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: markdown-analyzer-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdown-analyzer-lib/markdown_analyzer_lib-${{ version }}.tar.gz
  sha256: ef5aeb9731d4689f4597755b749768d4beeaca01c9d68ba32200d8e74a778029

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - requests
    - beautifulsoup4
    - markdownify

tests:
  - python:
      imports:
        - markdown_analyzer_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rafiqul0396/markdown_extractor
  license: MIT
  license_file: LICENSE
  summary: A Python library for parsing, analyzing, and converting Markdown and MDX documents, and converting websites to Markdown.
  description: |
    A Python library for parsing, analyzing, and converting Markdown and MDX documents, and converting websites to Markdown.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
