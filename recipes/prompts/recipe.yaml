# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: prompts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/prompts/prompts-0.0.1-py3-none-any.whl
  sha256: 7cc240be453c512439c00b2145cd1f3aa3796a031661ed4a52f9ab5a060ffb19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - prompts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ydcjeff/prompts
  license: MIT
  license_file: LICENSE
  summary: Lightweight, beautiful, and intuitive interactive prompts and CLI Apps
  description: |
    Lightweight, beautiful, and intuitive interactive prompts and CLI Apps

extra:
  recipe-maintainers:
    - rxm7706

