# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: domdf-python-tools
  version: "3.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/domdf_python_tools-${{ version }}.tar.gz
  sha256: 2ae308d2f4f1e9145f5f4ba57f840fbfd1c2983ee26e4824347789649d3ae298

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - hatch-requirements-txt
    - pip
    - python ${{ python_min }}
  run:
    - importlib-metadata >=3.6.0
    - importlib-resources >=3.0.0
    - natsort >=7.0.1
    - python >=${{ python_min }}
    - typing-extensions >=3.7.4.1

tests:
  - python:
      imports:
        - domdf_python_tools
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Helpful functions for Python 🐍 🛠️
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/domdfcoding/domdf_python_tools
  documentation: https://domdf-python-tools.readthedocs.io/

extra:
  recipe-maintainers:
    - domdfcoding
