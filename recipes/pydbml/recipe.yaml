# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: pydbml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydbml/pydbml-${{ version }}.tar.gz
  sha256: 8c1232291948fd5857792aa732a33e71418c47f6a2badea869dc37377394566b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyparsing >=3.0.0

tests:
  - python:
      imports:
        - pydbml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Vanderhoof/PyDBML
  license: MIT
  license_file: LICENSE
  summary: Python parser and builder for DBML
  description: |
    Python parser and builder for DBML

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
