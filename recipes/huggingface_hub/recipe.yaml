# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.27.0"

package:
  name: huggingface-hub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/huggingface-hub/huggingface_hub-${{ version }}.tar.gz
  sha256: c1fed40ea82a6b41b477f5243546549b792ae0a93abcea608cff66089bf8f8df

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click <9.0.0,>=8.4.2
    - filelock >=3.10.0
    - fsspec >=2023.5.0
    - hf-xet <2.0.0,>=1.5.2
    - httpx <1,>=0.23.0
    - packaging >=20.9
    - pyyaml >=5.1
    - tqdm >=4.42.1
    - typing_extensions >=4.1.0

tests:
  - python:
      imports:
        - huggingface_hub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/huggingface_hub
  license: Apache-2.0
  license_file: LICENSE
  summary: Client library to download and publish models, datasets and other repos on the huggingface.co hub
  description: |
    Client library to download and publish models, datasets and other repos on the huggingface.co hub

extra:
  recipe-maintainers:
    - xhochy
    - hanouticelina
    - LysandreJik
    - osanseviero
    - Wauplin
    - BastianZim
    - sugatoray
    - setu4993

