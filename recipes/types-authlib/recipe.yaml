# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.11.20260518"

package:
  name: types-authlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-authlib/types_authlib-${{ version }}.tar.gz
  sha256: 15b9a257e849e740241baa2113dd868c1b295cdc32449e54b109e9fc0105b556

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
  - package_contents:
      site_packages:
        - authlib-stubs/__init__.pyi

about:
  summary: Typing stubs for Authlib
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - peterbygrave
