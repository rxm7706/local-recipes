# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: import-linter
  version: "2.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/import_linter-${{ version }}.tar.gz
  sha256: 13af4a1d6b06044c58ea784e8732fd7fe48eec821a75feb4d6a1a2de36dd5c27

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - lint-imports = importlinter.cli:lint_imports_command

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - nox
    - fastapi
    - uvicorn
    - rich >=14.2.0
    - python >=${{ python_min }}
    - click >=6
    - grimp >=3.14
    - tomli >=1.2.1
    - typing-extensions >=3.10.0.0
    - typing_extensions >=3.10.0.0

tests:
  - python:
      imports:
        - importlinter
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - lint-imports --help

about:
  summary: Enforces rules for the imports within and between Python packages.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/import-linter/

extra:
  recipe-maintainers:
    - millsks
    - rxm7706
    - cshaley

