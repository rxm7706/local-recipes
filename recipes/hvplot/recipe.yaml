# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.2"

package:
  name: hvplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hvplot/hvplot-${{ version }}.tar.gz
  sha256: 9e29bbe65f94937d4eeaeccf33566540df936c8f9aeadfa12ea9f306d5237938

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.25.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - bokeh >=3.1
    - colorcet >=2
    - holoviews >=1.19.0
    - numpy >=1.21
    - packaging
    - pandas >=1.3
    - panel >=1.0
    - param <3.0,>=1.12.0

tests:
  - python:
      imports:
        - hvplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://hvplot.holoviz.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A high-level plotting API for the PyData ecosystem built on HoloViews.
  description: |
    A high-level plotting API for the PyData ecosystem built on HoloViews.
  repository: http://github.com/holoviz/hvplot

extra:
  recipe-maintainers:
    - hoxbro
    - CurtLH
    - jbednar
    - ocefpaf
    - philippjfr
    - maximlt

