# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Global pin is 3.9 now, we're ahead so pin it here.
schema_version: 1

context:
  python_min: "3.10"
  version: "0.12.2"

package:
  name: hvplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hvplot/hvplot-${{ version }}.tar.gz
  sha256: 9e29bbe65f94937d4eeaeccf33566540df936c8f9aeadfa12ea9f306d5237938

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - hatchling >=1.25.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - bokeh >=3.1
    - colorcet >=2
    - holoviews >=1.19.0
    - numpy >=1.21
    - packaging
    - pandas >=1.3
    - panel >=1.0
    - param >=1.12.0,<3.0

tests:
  - python:
      imports:
        - hvplot
        - hvplot.pandas
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      recipe:
        - pytest.ini
      source:
        - hvplot
    requirements:
      run:
        - python ${{ python_min }}
        - pytest
        - pip
        - parameterized
        - xarray
        - pooch
        - netcdf4
        - matplotlib
        - plotly
        - scipy
        - ipywidgets
        - dask
        - if: match(python, ">=3.10")
          then: bokeh_sampledata
        - spatialpandas
        - duckdb
    script:
      - pytest hvplot

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A high-level plotting API for the PyData ecosystem built on HoloViews
  homepage: https://hvplot.holoviz.org

extra:
  recipe-maintainers:
    - hoxbro
    - CurtLH
    - jbednar
    - ocefpaf
    - philippjfr
    - maximlt
