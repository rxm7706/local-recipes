# CFE comments
# Header:
#    # Packaged 2026-07-12 (user request). Complements the CFE estate's
#    # AppThreat integration (v8.6.0) and the cyclonedx-universe-inventory
#    # tooling; NOT on conda-forge as of packaging.
# build:
#    # npm's --omit=optional is IGNORED by `npm install -g <tarball>` (npm 11.x):
#    # the per-platform @cdxgen/cdxgen-plugins-bin-* optionalDependencies
#    # (~237 MB unpacked; prebuilt trivy/osquery/sourcekitten/cdxui/rusi/...
#    # binaries) install anyway — verified on PR #34178 CI (all 3 legs) despite
#    # the flag. The explicit rm -rf (unix) / rmdir loop (win) enforces the
#    # intended exclusion; cdxgen's binary-analysis features degrade gracefully.
#    # dynamic_linking.binary_relocation: false — nothing in an npm global
#    # install links against the conda prefix, and macOS install_name_tool
#    # hard-fails on upstream's prebuilt headerpad-less Mach-Os (cdxui/rusi,
#    # Azure buildId 1551507); relocation of vendored binaries (safer-exec-rt,
#    # cparse.so/prism.so from other optional deps) is pure risk, so it is off.
#    # Converted noarch->per-arch 2026-07-12 (win-64 buildability sweep):
#    # npm lays down native shims for all 16 bin entries per platform
#    # (openspec/bmalph precedent) instead of generated bash wrappers.
####
