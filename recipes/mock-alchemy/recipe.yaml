# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.6"

package:
  name: mock-alchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mock-alchemy/mock_alchemy-${{ version }}.tar.gz
  sha256: 807cc2bd7f658fb98292900052eaa6eeb4a65b2d62364e639462480a275299ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - sqlalchemy

tests:
  - python:
      imports:
        - mock_alchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rajivsarvepalli/mock-alchemy
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy mock helpers.
  description: |
    SQLAlchemy mock helpers.
  repository: https://github.com/rajivsarvepalli/mock-alchemy
  documentation: https://mock-alchemy.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

