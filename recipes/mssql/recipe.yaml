# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: mssql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mssql/mssql-1.0.1-py3-none-any.whl
  sha256: bd9e42b63ef1582bd133825538529f31bfccb6b13e7874b222af92697c1adbde

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy
    - pyodbc

tests:
  - python:
      imports:
        - mssql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JoseRoberts87/mssql
  license: MIT
  license_file: LICENSE
  summary: python sqlalchemy MsSQL utility
  description: |
    python sqlalchemy MsSQL utility

extra:
  recipe-maintainers:
    - rxm7706

