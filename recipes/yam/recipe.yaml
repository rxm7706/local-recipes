# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.3"

package:
  name: yam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yam/yam-${{ version }}.tar.gz
  sha256: bec2c18ab79c974d288619696a94f1328ed64a298bb4268c105b73ebc4b340fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - h5py
    - matplotlib-base
    - numpy
    - obspy >=1.1
    - obspyh5 >=0.3
    - scipy >=0.18
    - setuptools
    - tqdm

tests:
  - python:
      imports:
        - yam
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/trichter/yam
  license: MIT
  license_file: LICENSE
  summary: Yet another monitoring tool using correlations of ambient noise (seismology)
  description: |
    Yet another monitoring tool using correlations of ambient noise (seismology)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
