# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.0"

package:
  name: dnspython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dnspython/dnspython-${{ version }}.tar.gz
  sha256: 181d3c6996452cb1189c4046c61599b84a5a86e099562ffde77d26984ff26d0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.21.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dns
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.dnspython.org
  license: ISC
  license_file: LICENSE
  summary: DNS toolkit
  description: |
    DNS toolkit
  documentation: https://dnspython.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - synapticarbors
    - jan-janssen
    - xylar

