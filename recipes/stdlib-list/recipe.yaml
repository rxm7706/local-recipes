# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: stdlib-list
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stdlib_list-${{ version }}.tar.gz
  sha256: 517824f27ee89e591d8ae7c1dd9ff34f672eae50ee886ea31bb8816d77535675

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stdlib_list
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A list of Python Standard Libraries (2.7 through 3.12).
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/jackmaney/python-stdlib-list
  repository: https://github.com/pypi/stdlib-list
  documentation: https://jackmaney.github.io/python-stdlib-list

extra:
  recipe-maintainers:
    - ericdill
    - parente
    - marshall245
    - jackmaney
    - xhochy
