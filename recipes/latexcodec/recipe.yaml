# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: latexcodec
  version: "2.0.1"
  sha256: eda36ddfc969f86c9a8fdd50c12b484fa42dbfa33b84422144643b60081ca022

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mcmtroffaes/${{ name }}/archive/${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - six
  run:
    - python
    - six

tests:
  - python:
      imports:
        - latexcodec
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Lexer and codec to work with LaTeX code in Python.
  homepage: https://github.com/mcmtroffaes/${{ name }}
  repository: https://github.com/mcmtroffaes/${{ name }}
  documentation: http://latexcodec.readthedocs.io/

extra:
  recipe-maintainers:
    - scopatz
