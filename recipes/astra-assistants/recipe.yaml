# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.5"

package:
  name: astra-assistants
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/astra-assistants/astra_assistants-${{ version }}.tar.gz
  sha256: 3eb6272aa6e022e30a28b3df34273db51fb33d507ba4e4dd83f81c02f6f0ac49

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpx <0.28.0,>=0.27.0
    - openai <2.0.0,>=1.21.0
    - litellm <2.0.0,>=1.36.0
    - boto3 <2.0.0,>=1.34.31
    - aiohttp <4.0.0,>=3.9.4
    - python-dotenv <2.0.0,>=1.0.1
    - tree-sitter-python <0.24.0,>=0.23.0
    - lsprotocol <2024.0.0,>=2023.0.1
    - python-lsp-jsonrpc <2.0.0,>=1.1.2
    - ruff <9.0.0,>=0.6.2
    - tree-sitter <0.24.0,>=0.23.0
    - mcp >=0.9.1

tests:
  - python:
      imports:
        - astra_assistants
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/astra-assistants/
  license: MIT
  license_file: LICENSE
  summary: Astra Assistants API - drop in replacement for OpenAI Assistants, powered by AstraDB
  description: |
    Astra Assistants API - drop in replacement for OpenAI Assistants, powered by AstraDB

extra:
  recipe-maintainers:
    - rxm7706

