# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.71"

package:
  name: cloudscraper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudscraper/cloudscraper-${{ version }}.tar.gz
  sha256: 429c6e8aa6916d5bad5c8a5eac50f3ea53c9ac22616f6cb21b18dcc71517d0d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyparsing
    - requests
    - requests-toolbelt

tests:
  - python:
      imports:
        - cloudscraper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/venomous/cloudscraper
  license: MIT
  license_file: LICENSE
  summary: A Python module to bypass Cloudflare's anti-bot page.
  description: |
    A Python module to bypass Cloudflare's anti-bot page.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
