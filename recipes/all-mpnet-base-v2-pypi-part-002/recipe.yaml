schema_version: 1

context:
  version: "0.0.1"

package:
  name: all-mpnet-base-v2-pypi-part-002
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/all-mpnet-base-v2-pypi-part-002/all-mpnet-base-v2-pypi-part_002-${{ version }}.tar.gz
  sha256: a7edc2a74bb95a9a5803ccdfb17f1aaec7d33754734ab066567273966fc6c844

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - all-mpnet-base-v2-pypi-part-001 ==0.0.1

tests:
  - python:
      imports:
        - all_mpnet_base_v2_pypi_part_002
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/all-mpnet-base-v2-pypi-part-002/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Package with binary files and subfolders
  description: |
    Package with binary files and subfolders

extra:
  recipe-maintainers:
    - rxm7706

