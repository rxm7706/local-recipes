# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# WHEN UPDATING LIBTOOL, UPDATE libltdl_version (see libltdl/configure)
schema_version: 1

context:
  version: "2.5.4"
  libltdl_version: 2.4.3a

recipe:
  name: libtool-split
  version: ${{ version }}

source:
  url: http://ftpmirror.gnu.org/libtool/libtool-${{ version }}.tar.gz
  sha256: da8ebb2ce4dcf46b90098daf962cffa68f4b4f62ea60f798d0ef12929ede6adf
  patches:
    # From: https://bugs.debian.org/cgi-bin/bugreport.cgi?att=1;bug=557388;filename=link-as-needed.patch;msg=5
    # See: https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=347650
    # and: https://sigquit.wordpress.com/2011/02/16/why-asneeded-doesnt-work-as-expected-for-your-libraries-on-your-autotools-project/
    - patches/0001-link-as-needed.patch
    - patches/0002-apple-silicon.patch

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - m4
    - help2man
    - autoconf
    - automake
    - make
    - patch
  ignore_run_exports:
    from_package:
      - ${{ compiler('cxx') }}

outputs:
  - package:
      name: libtool
    build:
      script:
        file: build_libtool.sh
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - m4
        - help2man
        - autoconf
        - automake
        - make
        - texinfo
        - patch
      host:
        - ${{ pin_subpackage('libltdl', exact=true) }}
      run:
        - ${{ pin_subpackage('libltdl', exact=true) }}
      ignore_run_exports:
        from_package:
          - ${{ compiler('cxx') }}
    tests:
      - requirements:
          run:
            - ${{ compiler('cxx') }}
        script: $RECIPE_DIR/parent/run_test_libtool.sh
    about:
      license: GPL-2.0-or-later
      license_file:
        - COPYING
  - package:
      name: libltdl
      version: ${{ libltdl_version }}
    build:
      script:
        file: build_libltdl.sh
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - m4
        - help2man
        - autoconf
        - automake
        - make
        - texinfo
        - patch
      run_exports:
        - ${{ pin_subpackage('libltdl', upper_bound='x.x') }}
      ignore_run_exports:
        from_package:
          - ${{ compiler('cxx') }}
    about:
      license: LGPL-2.0-or-later
      license_file: libltdl/COPYING.LIB

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: The GNU Portable Library Tool
  description: |
    GNU libtool is a generic library support script. Libtool hides the
    complexity of using shared libraries behind a consistent, portable
    interface.
  homepage: http://www.gnu.org/software/libtool/
  repository: http://git.savannah.gnu.org/cgit/libtool.git
  documentation: http://www.gnu.org/software/libtool/manual/

extra:
  feedstock-name: libtool
  recipe-maintainers:
    - ocefpaf
    - msarahan
    - jakirkham
    - mingwandroid
    - isuruf
    - saraedum
