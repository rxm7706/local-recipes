# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: cint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cint/cint-${{ version }}.tar.gz
  sha256: 66f026d28c46ef9ea9635be5cb342506c6a1af80d11cb1c881a8898ca429fc91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/disconnect3d/cint
  license: MIT
  license_file: LICENSE
  summary: cint - make ctypes great again
  description: |
    cint - make ctypes great again

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cint
  cfe-upstream-registry: pypi
  cfe-upstream-name: cint
  cfe-purls:
    - pkg:conda/cint@${{ version }}?channel=conda-forge
    - pkg:pypi/cint@${{ version }}
  cfe-upstream-repo: https://github.com/disconnect3d/cint
  cfe-upstream-homepage: https://github.com/disconnect3d/cint
  cfe-import-names: [cint]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:50:28Z
