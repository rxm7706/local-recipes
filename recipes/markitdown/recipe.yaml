# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: markitdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markitdown/markitdown-${{ version }}.tar.gz
  sha256: 4d1f3c69cd43b82288fdc3653686d759dcf355ee7c681aa6a855aed98a1e4f44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - charset-normalizer
    - defusedxml
    - magika ~=0.6.1
    - markdownify
    - requests

tests:
  - python:
      imports:
        - markitdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/markitdown/
  license: MIT
  license_file: LICENSE
  summary: Utility tool for converting various files to Markdown
  description: |
    Utility tool for converting various files to Markdown
  repository: https://github.com/microsoft/markitdown
  documentation: https://github.com/microsoft/markitdown#readme

extra:
  recipe-maintainers:
    - johnhany97
    - sarthakpati

#### CFE metadata AND comments
