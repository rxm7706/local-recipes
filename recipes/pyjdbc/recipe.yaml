# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: pyjdbc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyjdbc/pyjdbc-${{ version }}.tar.gz
  sha256: 46d7b7f329666e1274fb91aca5dee25fb567d5e05facb17d931ca60bfc279b0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
    - wheel
  run:
    - python >=${{ python_min }}
    - jpype1
    - sqlparams

tests:
  - python:
      imports:
        - pyjdbc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OpenBigDataPlatform/pyjdbc
  license: Apache-2.0
  license_file: LICENSE
  summary: Use JDBC drivers to provide DB API 2.0 python database interface
  description: |
    Use JDBC drivers to provide DB API 2.0 python database interface

extra:
  recipe-maintainers:
    - rxm7706

