# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: req
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/r/req/req-1.0.0-py2.py3-none-any.whl
  sha256: 9ee30b71347cef7dba1eb4a0132586b88828d8249cf2f7e606de5ac44810367e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - req
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/absperf/python-req
  license: MIT
  license_file: LICENSE
  summary: Simple format for serialization, similar to json.  Not useful for most general use.
  description: |
    Simple format for serialization, similar to json.  Not useful for most general use.

extra:
  recipe-maintainers:
    - rxm7706

