# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.4.0.20260728"

package:
  name: types-bleach
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-bleach/types_bleach-${{ version }}.tar.gz
  sha256: 526a4fec997514bf3fe989ef59b86ec694bbb2ed70db22c59b622eb5a9b80fae

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-html5lib

tests:
  - package_contents:
      site_packages:
        - bleach-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/python/typeshed
  summary: Typing stubs for bleach
  license: Apache-2.0 AND MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
