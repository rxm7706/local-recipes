# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.1"

package:
  name: pyaes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyaes/pyaes-${{ version }}.tar.gz
  sha256: 02c1b1405c38d3c370b085fb952dd8bea3fadcee6411ad99f312cc129c536d8f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyaes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ricmoo/pyaes
  license: MIT
  license_file: LICENSE.txt
  summary: Pure-Python Implementation of the AES block-cipher and common modes of operation
  description: |
    Pure-Python Implementation of the AES block-cipher and common modes of operation

extra:
  recipe-maintainers:
    - mwilson8
    - oblute
    - benhuff

#### CFE metadata AND comments
