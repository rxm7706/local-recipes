# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.0"

package:
  name: zipp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zipp/zipp-${{ version }}.tar.gz
  sha256: 4cb57381f544315db7688e976e922a2b18cdb513d21cc194eb42232ba2a3e602

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zipp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/zipp/
  license: MIT
  license_file: LICENSE
  summary: Backport of pathlib-compatible object wrapper for zip files
  description: |
    Backport of pathlib-compatible object wrapper for zip files
  repository: https://github.com/jaraco/zipp

extra:
  recipe-maintainers:
    - jan-janssen
    - nehaljwani

#### CFE metadata AND comments
