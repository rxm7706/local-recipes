    - pkg:pypi/looker-sdk@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.python.org/pypi/looker_sdk
  cfe-import-names: [looker_sdk]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
