# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.12.0"

package:
  name: looker-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/looker-sdk/looker_sdk-${{ version }}.tar.gz
  sha256: 4dd327927b541e322de8bee1820cf1ce212c1883dc51b8bc098efe12c314e3f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.22
    - typing_extensions >=4.1.1
    - attrs >=20.1.0
    - cattrs >=1.3

tests:
  - python:
      imports:
        - looker_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/looker_sdk
  license: MIT
  license_file: LICENSE.txt
  summary: Looker REST API
  description: |
    Looker REST API

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: looker-sdk
  cfe-upstream-registry: pypi
  cfe-upstream-name: looker-sdk
