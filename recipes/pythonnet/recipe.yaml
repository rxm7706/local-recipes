# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pythonnet
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7b34c382905d10a371509ffafd64cae0416305c28817738a9cd138336f4e9991

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - dotnet-sdk 10.0.*
    - openssl
  host:
    - packaging >=24
    - pip
    - pyproject-parser >=0.14
    - python ${{ python_min }}
    - setuptools >=80
  run:
    - clr_loader >=0.3.1,<0.4.0
    - python >=${{ python_min }},<3.15
  run_constraints:
    - dotnet-runtime >=3.1
    - if: not win
      then: mono >=6.12

tests:
  - python:
      imports:
        - clr
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      recipe:
        - test-runtime.py
    requirements:
      run:
        - dotnet-runtime
        - importlib_resources
        - pip
        - python ${{ python_min }}
        - if: not win
          then: mono
    script:
      - if: not win
        then: python test-runtime.py mono
      - if: win
        then: python test-runtime.py netfx
      - python test-runtime.py coreclr

about:
  license: MIT
  license_file: LICENSE
  summary: .Net and Mono integration for Python
  description: |
    Python for .NET is a package that gives Python programmers nearly seamless integration with the
    .NET Common Language Runtime (CLR) and provides a powerful application scripting tool for .NET
    developers.
  homepage: http://pythonnet.github.io
  repository: https://github.com/pythonnet/pythonnet

extra:
  recipe-maintainers:
    - m-rossi
    - bgruening
