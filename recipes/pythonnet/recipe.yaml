# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: pythonnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pythonnet/pythonnet-${{ version }}.tar.gz
  sha256: 7b34c382905d10a371509ffafd64cae0416305c28817738a9cd138336f4e9991

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - packaging >=24
    - pyproject-parser >=0.14
  run:
    - python >=${{ python_min }}
    - clr_loader <0.4.0,>=0.3.1

tests:
  - python:
      imports:
        - pythonnet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pythonnet.github.io/
  license: MIT
  license_file: LICENSE
  summary: .NET and Mono integration for Python
  description: |
    .NET and Mono integration for Python

extra:
  recipe-maintainers:
    - m-rossi
    - bgruening

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pythonnet
  cfe-upstream-registry: pypi
  cfe-upstream-name: pythonnet
