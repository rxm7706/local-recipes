# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.3"

package:
  name: qtpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/QtPy/qtpy-${{ version }}.tar.gz
  sha256: db744f7832e6d3da90568ba6ccbca3ee2b3b4a890c3d6fbbc63142f6e4cdf5bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}
    - packaging

tests:
  - python:
      imports:
        - qtpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spyder-ide/qtpy
  license: MIT
  license_file: LICENSE.txt
  summary: Provides an abstraction layer on top of the various Qt bindings (PyQt5/6 and PySide2/6).
  description: |
    Provides an abstraction layer on top of the various Qt bindings (PyQt5/6 and PySide2/6).

extra:
  recipe-maintainers:
    - CAM-Gerlach
    - ccordoba12
    - astrofrog
    - dalthviz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: qtpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: qtpy
