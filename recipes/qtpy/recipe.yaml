    - pkg:pypi/qtpy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/spyder-ide/qtpy
  cfe-import-names: [qtpy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
