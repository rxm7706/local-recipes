# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-engineio
  version: "4.13.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/${{ name }}/python_engineio-${{ version }}.tar.gz
  sha256: b5764d62243e3ffbc4c76dda3d7897c329dc52294c80c27105f9faa054e76897

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - simple-websocket >=0.10.0
  run_constraints:
    - requests >=2.21.0
    - websocket-client >=0.54.0
    - aiohttp >=3.11

tests:
  - python:
      imports:
        - engineio
        - engineio.middleware
        - engineio.packet
        - engineio.payload
        - engineio.server
        - engineio.socket
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"

about:
  license_file: LICENSE
  license: MIT
  summary: Engine.IO server
  homepage: https://github.com/miguelgrinberg/python-engineio/
  repository: https://github.com/miguelgrinberg/python-engineio/
  documentation: https://python-engineio.readthedocs.io

extra:
  recipe-maintainers:
    - ReimarBauer
    - synapticarbors
