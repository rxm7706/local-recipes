# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.13.5"

package:
  name: python-engineio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-engineio/python_engineio-${{ version }}.tar.gz
  sha256: b5764d62243e3ffbc4c76dda3d7897c329dc52294c80c27105f9faa054e76897

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - simple-websocket >=0.10.0

tests:
  - python:
      imports:
        - engineio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miguelgrinberg/python-engineio
  license: MIT
  license_file: LICENSE
  summary: Engine.IO server and client for Python
  description: |
    Engine.IO server and client for Python

extra:
  recipe-maintainers:
    - ReimarBauer
    - synapticarbors

