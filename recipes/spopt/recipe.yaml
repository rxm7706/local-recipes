# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"
  python_min: "3.11"

package:
  name: spopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spopt/spopt-${{ version }}.tar.gz
  sha256: ed599b8c0e219682e48e85852b615dbc6f122ef2907d73c11894ad3ffdb39d47

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=0.14.0
    - libpysal >=4.10.0
    - mapclassify >=2.7.0
    - networkx >=3.2
    - numpy >=1.26.0
    - pandas >=2.1.0
    - pointpats >=2.4.0
    - pulp >=2.8
    - scikit-learn >=1.4.0
    - scipy >=1.12.0
    - shapely >=2.1.0
    - spaghetti >=1.7.4
    - tqdm >=4.66.0

tests:
  - python:
      imports:
        - spopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/spopt/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Spatial Optimization in PySAL
  description: |
    Spatial Optimization in PySAL
  repository: https://github.com/pysal/spopt

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - xf37
    - gegen07
    - martinfleis

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spopt
