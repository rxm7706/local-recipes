# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.4"

package:
  name: pdfminer3k
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdfminer3k/pdfminer3k-${{ version }}.tar.gz
  sha256: ba3e43d4d800d434442687c88b3391b09d136acafd00304963a1386de294d4c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ply

tests:
  - python:
      imports:
        - pdfminer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/canserhat77/pdfminer3k
  license: MIT
  license_file: LICENSE
  summary: Forked from original pdfminer
  description: |
    Forked from original pdfminer

extra:
  recipe-maintainers:
    - nikicc

#### CFE metadata AND comments
