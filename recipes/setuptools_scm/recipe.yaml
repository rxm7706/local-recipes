# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.2.1"

package:
  name: setuptools-scm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-scm/setuptools_scm-${{ version }}.tar.gz
  sha256: 4fa7dd82cf8c800df59c9a288c90299b1657ff1ecfc3f5cc00287c5dbf5e27a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - vcs-versioning >=2.0.0.dev0,<3
    - tomli >=1
    - 3.11
  run:
    - python >=${{ python_min }}
    - vcs-versioning <3,>=2.0.0.dev0
    - packaging >=20
    - setuptools
    - tomli >=1
    - typing_extensions >=4.1

tests:
  - python:
      imports:
        - testing_scm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/setuptools-scm/
  license: MIT
  license_file: LICENSE
  summary: the blessed package to manage your versions by scm tags
  description: |
    the blessed package to manage your versions by scm tags
  documentation: https://setuptools-scm.readthedocs.io/

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox
    - astaric

#### CFE metadata AND comments
