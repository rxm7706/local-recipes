# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.3.0"

package:
  name: ipykernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipykernel/ipykernel-${{ version }}.tar.gz
  sha256: 9acaaaf97d16355166e4085afe9d225bfbdf2b7ef520f9df3be8f2b248275e09

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.22
    - jupyter-client >=6
  run:
    - python >=${{ python_min }}
    - comm >=0.1.1
    - debugpy >=1.6.5
    - ipython >=7.23.1
    - jupyter-client >=8.9.0
    - jupyter-core !=6.0.*,>=5.1
    - matplotlib-inline >=0.1
    - nest-asyncio2 >=1.7.0
    - packaging >=22
    - psutil >=5.7
    - pyzmq >=25
    - tornado >=6.4.1
    - traitlets >=5.4.0

tests:
  - python:
      imports:
        - ipykernel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ipython.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: IPython Kernel for Jupyter
  description: |
    IPython Kernel for Jupyter
  repository: https://github.com/ipython/ipykernel
  documentation: https://ipykernel.readthedocs.io

extra:
  recipe-maintainers:
    - blink1073
    - bollwyvl
    - Carreau
    - jakirkham
    - minrk
    - ocefpaf
    - pelson
    - davidbrochart
    - ianthomas23

