# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: jenkins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jenkins/jenkins-${{ version }}.tar.gz
  sha256: da48f7e9bfdf956caa2cc1b63807ce5ed81c00a220e856d159be671156f1a745

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jenkins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/lgastako/jenkins/
  license: MIT
  license_file: LICENSE
  summary: Python ctypes wrapper around Bob Jenkins' hash functions.
  description: |
    Python ctypes wrapper around Bob Jenkins' hash functions.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
