# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: clikit
  version: "0.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/clikit-${{ version }}.tar.gz
  sha256: 442ee5db9a14120635c5990bcdbfe7c03ada5898291f0c802f77be71569ded59
  patches:
    - 0000-no-extras.patch

build:
  number: 3
  noarch: python
  script:
    - ${{ PYTHON }} -c "__import__('pathlib').Path('pyproject.toml').unlink()"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pastel >=0.2.0,<0.3.0
    - pylev >=1.3,<2.0

tests:
  - python:
      imports:
        - clikit
        - clikit.adapter
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: CliKit is a group of utilities to build beautiful and testable command line interfaces.
  homepage: https://github.com/sdispater/clikit

extra:
  recipe-maintainers:
    - roccqqck
    - ocefpaf
