# Header:
#    # Authored 2026-07-26 as a NEW PREREQUISITE for xorq 0.3.36, which adds a
#    # hard `batchcorder==0.1.3` dependency that is absent from conda-forge.
#    # Same author as xorq-datafusion (mesejo); recipe intentionally mirrors
#    # that recipe's shape so the pair stays consistent.
# build:
#    # abi3-py310 == the conda-forge python_min default, so the Variant A skip
#    # (is_abi3 and not is_python_min) collapses the matrix to one artifact per
#    # platform. Verified from Cargo.toml, not assumed (G49).
#    # LTO deliberately left at Cargo.toml's default rather than forced to fat:
#    # unlike xorq-datafusion (~600 crates), this graph is small enough that
#    # fat LTO is not worth the build time, and it avoids the linux-aarch64 OOM
#    # / osx-64 ICE that forced xorq-datafusion's per-platform LTO expression.
# run:
#    # pyarrow >=18 mirrors upstream's only declared dependency.
