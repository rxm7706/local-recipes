# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.18"

package:
  name: asyncer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncer/asyncer-${{ version }}.tar.gz
  sha256: dc233a466f85f1bc17dafcdb861b06291b64777a8d9076f7884467cbb66f95ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - anyio <5.0,>=3.4.0
    - sniffio >=1.1
    - typing_extensions >=4.12.0

tests:
  - python:
      imports:
        - asyncer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fastapi/asyncer
  license: MIT
  license_file: LICENSE
  summary: Asyncer, async and await, focused on developer experience.
  description: |
    Asyncer, async and await, focused on developer experience.
  repository: https://github.com/fastapi/asyncer
  documentation: https://asyncer.tiangolo.com

extra:
  recipe-maintainers:
    - maresb
    - janjagusch

#### CFE metadata AND comments
