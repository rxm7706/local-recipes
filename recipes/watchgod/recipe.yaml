# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: watchgod
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: cb11ff66657befba94d828e3b622d5fb76f22fbda1376f355f3e6e51e97d9450

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - watchgod = watchgod.cli:cli

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - anyio >=3.0.0,<4

tests:
  - python:
      imports:
        - watchgod
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - watchgod -h

about:
  summary: Simple, modern file watching and code reload in python.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/samuelcolvin/watchgod

extra:
  recipe-maintainers:
    - synapticarbors
