# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: fp-growth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fp-growth/fp-growth-${{ version }}.tar.gz
  sha256: bc3e05e713454878ca2bfa1055495a95ee4a22f2daf2c2072c751eca4d0945f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fp_growth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/enaeseth/python-fp-growth/
  license: MIT
  license_file: LICENSE
  summary: A pure-python implementation of the FP-growth algorithm.
  description: |
    A pure-python implementation of the FP-growth algorithm.

extra:
  recipe-maintainers:
    - rxm7706

