# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: xlutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlutils/xlutils-${{ version }}.tar.gz
  sha256: 7e0e2c233bd185fecf5e2bd3f4e9469ca4a3bd87da64c82cfe5b2af27e7f9e54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - xlrd
    - xlwt

tests:
  - python:
      imports:
        - xlutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.python-excel.org
  license: MIT
  license_file: LICENSE
  summary: Utilities for working with Excel files that require both xlrd and xlwt
  description: |
    Utilities for working with Excel files that require both xlrd and xlwt

extra:
  recipe-maintainers:
    - looooo

#### CFE metadata AND comments
