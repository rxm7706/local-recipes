# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.2"

package:
  name: kmodes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kmodes/kmodes-${{ version }}.tar.gz
  sha256: d840ac9f4616a668ebacba24a12ec1def87da24a9fd0a0dc2f7499a9b9a6f45b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scikit-learn
    - scipy
    - joblib

tests:
  - python:
      imports:
        - kmodes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nicodv/kmodes
  license: MIT
  license_file: LICENSE
  summary: Python implementations of the k-modes and k-prototypes clustering algorithms for clustering categorical data.
  description: |
    Python implementations of the k-modes and k-prototypes clustering algorithms for clustering categorical data.

extra:
  recipe-maintainers:
    - mxr-conda

