# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kmodes
  version: "0.12.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/kmodes-${{ version }}.tar.gz
  sha256: d840ac9f4616a668ebacba24a12ec1def87da24a9fd0a0dc2f7499a9b9a6f45b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - joblib >=0.11
    - numpy >=1.10.4
    - python >=3.6
    - scikit-learn >=0.22.0
    - scipy >=0.13.3

tests:
  - python:
      imports:
        - kmodes
        - kmodes.util
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Python implementations of the k-modes and k-prototypes clustering algorithms for clustering categorical data.
  homepage: https://github.com/nicodv/kmodes
  repository: https://github.com/nicodv/kmodes
  documentation: https://pypi.org/project/kmodes/

extra:
  recipe-maintainers:
    - mxr-conda
