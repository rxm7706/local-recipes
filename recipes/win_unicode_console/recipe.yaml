# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: win_unicode_console
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/win_unicode_console/win_unicode_console-0.5.zip
  sha256: d4142d4d56d46f449d6f00536a73625a871cba040f0bc1a2e305a04578f07d1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - win_unicode_console
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Drekin/win-unicode-console
  license: MIT
  license_file: LICENSE
  summary: Enable Unicode input and display when running Python from Windows console.
  description: |
    Enable Unicode input and display when running Python from Windows console.

extra:
  recipe-maintainers:
    - minrk
    - ocefpaf

