# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.22"

package:
  name: ca-certificates
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certifi/certifi-${{ version }}.tar.gz
  sha256: 741e2c3b351ddf169a738da9f2c048608ff7f2c5cc02f1ebc6b118bb090d5d55

build:
  number: 0
  noarch: generic

requirements:
  run:
    - if: unix
      then: __unix
    - if: win
      then: __win

tests:
  - requirements:
      run:
        - curl
    script:
      - if: unix
        then: test -f "${PREFIX}/ssl/cacert.pem"
      - if: unix
        then: test -f "${PREFIX}/ssl/cert.pem"
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\ssl\\cacert.pem exit 1
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\ssl\\cert.pem exit 1
      - if: unix
        then: curl --cacert "${PREFIX}/ssl/cacert.pem" https://www.google.com
      - if: win
        then: curl --cacert %LIBRARY_PREFIX%\\ssl\\cacert.pem https://www.google.com

about:
  license: ISC
  license_file: LICENSE
  summary: Certificates for use with other packages.
  homepage: https://github.com/conda-forge/ca-certificates-feedstock

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - mwcraig
    - ocefpaf
    - patricksnape
    - pelson
    - scopatz

#### CFE metadata AND comments
