# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2502"

package:
  name: finance
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/finance/finance-${{ version }}.tar.gz
  sha256: 498e61ea8aa922b6aefd33b3960d0404be22e1bb47edcc910ac9723da4e715c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - finance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.bruunisejs.dk/PythonHacks/
  license: http://www.opensource.org/licenses/PythonSoftFoundation.php
  license_file: LICENSE
  summary: finance - Financial Risk Calculations. Optimized for ease of use through class construction and operator overload
  description: |
    finance - Financial Risk Calculations. Optimized for ease of use through class construction and operator overload

extra:
  recipe-maintainers:
    - rxm7706

