# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: interpret
  version: "0.7.8"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/interpretml/interpret/archive/v${{ version }}.tar.gz
  sha256: b92dffefc5adec3aa681e7efb981ad000f31f489855e0b5996e5080e4ff17bce

build:
  number: 0
  noarch: python
  script: cd ./python/interpret/ && ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - interpret-core ==${{ version }}
    # Equiv. to extras.
    - psutil >=5.6.2
    - ipython >=5.5.0
    - plotly >=3.8.1
    # - lime >=0.1.1.33  # no longer maintained
    - SALib >=1.3.3
    - shap >=0.28.5
    - ipywidgets >=7.4.2
    - scikit-learn >=1.6.0
    # - skope-rules >=1.0.1   fails on python 3.10
    # - treeinterpreter >=0.2.2  # no longer maintained
    - dash >=2.0.0
    - dash_cytoscape >=0.1.1
    - flask >=1.0.4
    - gevent >=1.3.6
    - requests >=2.19.0

tests:
  - python:
      imports:
        - interpret
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - python/interpret-core/tests/**
    requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - scipy >=0.18.1
        - pytest >=4.3.0
        - pytest-xdist >=1.29
        - nbconvert >=5.4.1
        - nbformat >=4.4.0
        - selenium >=3.141.0
        - pytest-cov >=2.6.1
    script:
      - python -m pytest -vv -n auto --junitxml=junit/test-results.xml --cov=interpret --cov-report=xml --cov-report=html python/interpret-core/tests --ignore=python/interpret-core/tests/glassbox/test_aplr.py

about:
  summary: Fit interpretable models. Explain blackbox machine learning.
  description: |
    In the beginning machines learned in darkness, and data scientists struggled in the void to explain them.

    Let there be light.

    https://github.com/interpretml/interpret
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/interpretml/interpret
  repository: https://interpret.ml/docs/installation-guide.html
  documentation: https://interpret.ml/docs

extra:
  recipe-maintainers:
    - paulbkoch
    - interpret-ml
    - mgorny
