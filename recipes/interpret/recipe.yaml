# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.8"

package:
  name: interpret
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/interpret/interpret-${{ version }}.tar.gz
  sha256: 3fe4bb2bc9cc783e63dcbc6bc4d2d48f3852b9dcfaf6cef41c40692c29a9d67a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - interpret-core ==0.7.8

tests:
  - python:
      imports:
        - interpret
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/interpretml/interpret
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Fit interpretable models. Explain blackbox machine learning.
  description: |
    Fit interpretable models. Explain blackbox machine learning.

extra:
  recipe-maintainers:
    - paulbkoch
    - interpret-ml
    - mgorny

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: interpret
  cfe-upstream-registry: pypi
  cfe-upstream-name: interpret
  cfe-purls:
    - pkg:conda/interpret@${{ version }}?channel=conda-forge
    - pkg:pypi/interpret@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/interpretml/interpret
  cfe-import-names: [interpret]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/interpret-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T23:56:17Z
