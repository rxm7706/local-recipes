# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0"

package:
  name: django-grappelli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-grappelli/django_grappelli-${{ version }}.tar.gz
  sha256: 404c8480024758b537bed723070c64eef695de557ad470b43161dbff0aa4c642

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69.3.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - grappelli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://django-grappelli.readthedocs.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A jazzy skin for the Django Admin-Interface.
  description: |
    A jazzy skin for the Django Admin-Interface.
  repository: https://github.com/sehmaschine/django-grappelli

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf

