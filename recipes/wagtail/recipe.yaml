    - pkg:pypi/wagtail@${{ version }}
  cfe-upstream-repo: https://github.com/wagtail/wagtail
  cfe-upstream-homepage: https://wagtail.org/
  cfe-import-names: [wagtail]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/wagtail-feedstock
  cfe-forge-recipe-updates-needed: none
