# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0"

package:
  name: wagtail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail/wagtail-${{ version }}.tar.gz
  sha256: 8fb2aa39bb8ff9e7709ba848a1bba2fea332ce32368c7ba4820008c0cfcc0019

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.0
  run:
    - python >=${{ python_min }},<4.0
    - django >=5.2
    - django-modelcluster >=6.5,<7.0
    - django-permissionedforms >=0.1,<1.0
    - django-taggit >=5.0,<7
    - django-treebeard >=4.8,<6.0
    - djangorestframework >=3.18.0,<4.0
    - django-filter >=23.3
    - draftjs_exporter >=7.1.0,<8.0
    - pillow >=9.1.0
    - beautifulsoup4 >=4.13.3,<5
    - willow >=1.11.0,<2
    - requests >=2.11.1,<3.0
    - openpyxl >=3.0.10,<4.0
    - anyascii >=0.1.5
    - telepath >=0.3.1,<1
    - laces >=0.1,<0.2
    - django-tasks >=0.9,<0.13
    - modelsearch >=1.3.2,<1.4
    - pydantic >=2,<3
    - django-ninja >=1.6.3,<2.0
    - swapper >=1.4,<2

tests:
  - python:
      imports:
        - wagtail
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://wagtail.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Django content management system.
  description: |
    A Django content management system.
  repository: https://github.com/wagtail/wagtail
  documentation: https://docs.wagtail.org

extra:
  recipe-maintainers:
    - darynwhite
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wagtail
  cfe-upstream-registry: pypi
  cfe-upstream-name: wagtail
  cfe-purls:
