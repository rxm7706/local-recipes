# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.1"

package:
  name: wagtail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail/wagtail-${{ version }}.tar.gz
  sha256: 819865a10bce86b16288cfaefa4195b90ffb5e7ac494fb18659e7be099ef386f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - wagtail = wagtail.bin.wagtail:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.0
  run:
    - python >=${{ python_min }},<4.0
    - django >=5.2
    - django-modelcluster >=6.5,<7.0
    - django-permissionedforms >=0.1,<1.0
    - django-taggit >=5.0,<7
    - django-treebeard >=4.8,<6.0
    - djangorestframework >=3.18.0,<4.0
    - django-filter >=23.3
    - draftjs_exporter >=7.1.0,<8.0
    - pillow >=9.1.0
    - beautifulsoup4 >=4.13.3,<5
    - willow >=1.11.0,<2
    - requests >=2.11.1,<3.0
    - openpyxl >=3.0.10,<4.0
    - anyascii >=0.1.5
    - telepath >=0.3.1,<1
    - laces >=0.1,<0.2
    - django-tasks >=0.9,<0.13
    - modelsearch >=1.3.2,<1.4
    - pydantic >=2,<3
    - django-ninja >=1.6.3,<2.0
    - swapper >=1.4,<2

tests:
  - python:
      imports:
        - wagtail
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - wagtail help

about:
  summary: A Django content management system focused on flexibility and user experience
  homepage: https://wagtail.org/
  description: |
    Wagtail is an open source content management system built on Django, with a strong community and commercial support.
    It's focused on user experience, and offers precise control for designers and developers.
  repository: https://github.com/wagtail/wagtail
  documentation: https://docs.wagtail.org/en/stable/
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - wagtail/models/copying.py

extra:
  recipe-maintainers:
    - darynwhite
    - rxm7706

