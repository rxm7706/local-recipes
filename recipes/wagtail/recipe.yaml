# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.4.2"

package:
  name: wagtail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtail/wagtail-${{ version }}.tar.gz
  sha256: 6e261b50693abfbe2b738717bedc5bd0915e2e08efb9400102f4098c0c03aaab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.0
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - django-modelcluster <7.0,>=6.5
    - django-permissionedforms <1.0,>=0.1
    - django-taggit <7,>=5.0
    - django-treebeard <6.0,>=4.8
    - djangorestframework <4.0,>=3.15.1
    - django-filter >=23.3
    - draftjs-exporter <6.0,>=2.1.5
    - pillow >=9.1.0
    - beautifulsoup4 <5,>=4.13.3
    - willow <2,>=1.11.0
    - requests <3.0,>=2.11.1
    - openpyxl <4.0,>=3.0.10
    - anyascii >=0.1.5
    - telepath <1,>=0.3.1
    - laces <0.2,>=0.1
    - django-tasks <0.13,>=0.9
    - modelsearch <1.4,>=1.3

tests:
  - python:
      imports:
        - wagtail
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://wagtail.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Django content management system.
  description: |
    A Django content management system.
  repository: https://github.com/wagtail/wagtail
  documentation: https://docs.wagtail.org

extra:
  recipe-maintainers:
    - darynwhite
    - rxm7706

#### CFE metadata AND comments
