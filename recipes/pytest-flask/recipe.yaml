# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: pytest-flask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-flask/pytest-flask-${{ version }}.tar.gz
  sha256: 58be1c97b21ba3c4d47e0a7691eb41007748506c36bf51004f78df10691fa95e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=5.2
    - flask
    - werkzeug

tests:
  - python:
      imports:
        - pytest_flask
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-flask
  license: MIT
  license_file: LICENSE
  summary: A set of py.test fixtures to test Flask applications.
  description: |
    A set of py.test fixtures to test Flask applications.
  repository: https://github.com/pytest-dev/pytest-flask

extra:
  recipe-maintainers:
    - sodre
    - nicoddemus

#### CFE metadata AND comments
