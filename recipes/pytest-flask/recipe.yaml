# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: pytest-flask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-flask/pytest-flask-${{ version }}.tar.gz
  sha256: 58be1c97b21ba3c4d47e0a7691eb41007748506c36bf51004f78df10691fa95e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - flask
    - werkzeug >=0.7

tests:
  - python:
      imports:
        - pytest_flask
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A set of py.test fixtures to test Flask applications
  homepage: https://github.com/pytest-dev/pytest-flask
  repository: https://github.com/pytest-dev/pytest-flask
  documentation: http://pytest-flask.readthedocs.io/

extra:
  recipe-maintainers:
    - sodre
    - nicoddemus
