# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: stats-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stats-utils/stats_utils-${{ version }}.tar.gz
  sha256: e6033f10c15870c7ad0967040c73a7c8cffdea1537c466408f2bcdb14042af22

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib

tests:
  - python:
      imports:
        - stats_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/stats-utils/
  license: MIT
  license_file: LICENSE
  summary: Probability and Statistics Utilities library. Currently only Distributions
  description: |
    Probability and Statistics Utilities library. Currently only Distributions

extra:
  recipe-maintainers:
    - rxm7706

