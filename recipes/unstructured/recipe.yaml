# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.2"

package:
  name: unstructured
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unstructured/unstructured-${{ version }}.tar.gz
  sha256: eed5e424bb6ef8165b1d120280472f658b486fb7d2fc4415d62d35899be0e006

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 <5.0.0,>=4.14.3
    - charset-normalizer <4.0.0,>=3.4.4
    - emoji <3.0.0,>=2.15.0
    - filelock <4.0.0,>=3.12.0
    - filetype <2.0.0,>=1.2.0
    - html5lib <2.0.0,>=1.1
    - python-installer <1.0.0,>=0.7.0
    - langdetect <2.0.0,>=1.0.9
    - lxml <7.0.0,>=5.0.0
    - nh3 <1.0.0,>=0.3.0
    - numba <1.0.0,>=0.60.0
    - numpy <3.0.0,>=1.26.0
    - psutil <8.0.0,>=7.2.2
    - python-iso639 <2027.0.0,>=2026.1.31
    - python-magic <1.0.0,>=0.4.27
    - python-oxmsg <1.0.0,>=0.0.2
    - rapidfuzz <4.0.0,>=3.14.3
    - regex <2027.0.0,>=2024.0.0
    - requests <3.0.0,>=2.32.5
    - spacy <4.0.0,>=3.7.0
    - tqdm <5.0.0,>=4.67.3
    - typing_extensions <5.0.0,>=4.15.0
    - unstructured-client <1.0.0,>=0.25.9
    - wrapt <3.0.0,>=2.1.1

tests:
  - python:
      imports:
        - unstructured
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Unstructured-IO/unstructured
  license: Apache-2.0
  license_file: LICENSE
  summary: A library that prepares raw documents for downstream ML tasks.
  description: |
    A library that prepares raw documents for downstream ML tasks.

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: unstructured
  cfe-upstream-registry: pypi
  cfe-upstream-name: unstructured
  cfe-purls:
    - pkg:conda/unstructured@${{ version }}?channel=conda-forge
    - pkg:pypi/unstructured@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/Unstructured-IO/unstructured
  cfe-import-names: [unstructured]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/unstructured-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-0.25.2

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T12:33:23Z
