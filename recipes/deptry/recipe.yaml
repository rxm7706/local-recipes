# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.1"

package:
  name: deptry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deptry/deptry-${{ version }}.tar.gz
  sha256: 45c8cd982c85cd4faae573ddff6920de7eec735336db6973f26a765ae7950f7d

build:
  number: 0
  skip: match(python, "<3.10")
  python:
    entry_points:
      - deptry = deptry.cli:deptry
  script:
    content:
      - if: win
        then: |
          set "CARGO_HOME=C:\cargo"
          ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
          cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        else: |
          ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
          cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.5,<2.0
  host:
    - python
    - maturin >=1.5,<2.0
    - pip
  run:
    - python
    - click >=8.0.0,<9
    - packaging >=23.2
    - requirements-parser >=0.11.0,<1
    - tomli >=2.0.1
    - if: win
      then:
        - colorama >=0.4.6

tests:
  - python:
      imports:
        - deptry
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - deptry --help

about:
  summary: A command line utility to check for unused, missing and transitive dependencies in a Python project.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://deptry.com/
  repository: https://github.com/fpgmaas/deptry
  documentation: https://deptry.com/

extra:
  recipe-maintainers:
    - Zeitsperre
    - maresb
    - fpgmaas

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: deptry
  cfe-upstream-registry: pypi
  cfe-upstream-name: deptry
  cfe-purls:
    - pkg:conda/deptry@${{ version }}?channel=conda-forge
    - pkg:pypi/deptry@${{ version }}
  cfe-upstream-repo: https://github.com/fpgmaas/deptry
  cfe-upstream-homepage: https://deptry.com/
  cfe-import-names: [deptry]
  cfe-source-kind: pypi-sdist
  cfe-noarch: compiled
