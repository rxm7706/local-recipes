# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.3"

package:
  name: dingtalk-stream
  version: ${{ version }}

source:
  url: https://github.com/open-dingtalk/dingtalk-stream-sdk-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f46bcfe2cc654159927b16ec6569459bddd8f49b1e1b701248b325a51a604a70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.10.0
    - requests >=2.27.1
    - websockets >=11.0.2

tests:
  - python:
      imports:
        - dingtalk_stream
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-dingtalk/dingtalk-stream-sdk-python
  license: MIT
  license_file: LICENSE
  summary: A Python library for sending messages to DingTalk chatbot
  description: |
    A Python library for sending messages to DingTalk chatbot

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
