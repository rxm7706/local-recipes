# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.73"

package:
  name: contractions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/c/contractions/contractions-0.1.73-py2.py3-none-any.whl
  sha256: 398cee3b69c37307a50dce4930d961a0f42b48fdae9562df73bed5683008d3bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - textsearch

tests:
  - python:
      imports:
        - contractions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kootenpv/contractions
  license: MIT
  license_file: LICENSE
  summary: Fixes contractions such as `you're` to you `are`
  description: |
    Fixes contractions such as `you're` to you `are`

extra:
  recipe-maintainers:
    - rxm7706

