# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.7.1"

package:
  name: deeplake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/d/deeplake/deeplake-4.7.1-cp310-cp310-macosx_11_0_arm64.whl
  sha256: fdd9c54d15f879cef959d864ce5bbf0d7952ff12be829718a3eb241878ada004

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - deepframe
    - requests

tests:
  - python:
      imports:
        - deeplake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/deeplake/
  license: Apache-2.0
  license_file: LICENSE
  summary: Data Lake for Multi-Modal AI Search
  description: |
    Data Lake for Multi-Modal AI Search
  repository: https://github.com/activeloopai/deeplake
  documentation: https://docs.deeplake.ai/

extra:
  recipe-maintainers:
    - rxm7706

