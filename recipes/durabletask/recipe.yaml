# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: durabletask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/durabletask/durabletask-${{ version }}.tar.gz
  sha256: 55460fbfda8941e721096c4639e72111b03638708df1556af466160ee649478d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - grpcio
    - protobuf
    - asyncio
    - packaging

tests:
  - python:
      imports:
        - durabletask
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/durabletask/
  license: MIT
  license_file: LICENSE
  summary: A Durable Task Client SDK for Python
  description: |
    A Durable Task Client SDK for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
