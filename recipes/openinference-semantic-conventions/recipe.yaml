# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.32"

package:
  name: openinference-semantic-conventions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-semantic-conventions/openinference_semantic_conventions-${{ version }}.tar.gz
  sha256: 2a3e6723ddce37abc5c43d38c6c7ac05b0f2efcfbe75cc0f135ab14ceb0730f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - openinference.semconv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/openinference-semantic-conventions
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference Semantic Conventions
  description: |
    OpenInference Semantic Conventions

extra:
  recipe-maintainers:
    - michaelschiff
    - mikeldking
    - RogerHYang
    - axiomofjoy
    - anticorrelator

