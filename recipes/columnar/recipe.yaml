# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: columnar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/columnar/Columnar-${{ version }}.tar.gz
  sha256: c3cb57273333b2ff9cfaafc86f09307419330c97faa88dcfe23df05e6fbb9c72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - toolz
    - wcwidth

tests:
  - python:
      imports:
        - columnar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/columnar/
  license: MIT
  license_file: LICENSE
  summary: A tool for printing data in a columnar format.
  description: |
    A tool for printing data in a columnar format.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: columnar
  cfe-upstream-registry: pypi
  cfe-upstream-name: columnar
  cfe-purls:
    - pkg:conda/columnar@${{ version }}?channel=conda-forge
    - pkg:pypi/columnar@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/columnar/
  cfe-upstream-homepage: https://pypi.org/project/columnar/
  cfe-import-names: [columnar]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
