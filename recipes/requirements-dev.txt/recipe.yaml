# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: requirements-dev.txt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requirements-dev.txt/requirements-dev.txt-${{ version }}.tar.gz
  sha256: 8d27bf5ca8e3c4c0284a0c96a68f4ca3f22a2ae96a15e583b4ad1fc266c49d0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - requirements_dev.txt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pylola/requirements.txt
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Safeguard against one particullar "pip install" typo
  description: |
    Safeguard against one particullar "pip install" typo

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: requirements-dev.txt
  cfe-upstream-registry: pypi
  cfe-upstream-name: requirements-dev.txt
