# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: msrest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msrest/msrest-0.7.1.zip
  sha256: 6e7661f46f3afd88b75667b7187a92829924446c7ea1d169be8c4bb7eeb788b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core
    - certifi
    - isodate
    - requests-oauthlib
    - requests

tests:
  - python:
      imports:
        - msrest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/msrest-for-python
  license: MIT
  license_file: LICENSE
  summary: AutoRest swagger generator Python client runtime.
  description: |
    AutoRest swagger generator Python client runtime.

extra:
  recipe-maintainers:
    - xylar
    - marcelotrevisani

#### CFE metadata AND comments
