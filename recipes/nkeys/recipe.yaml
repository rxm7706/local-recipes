# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: nkeys
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nkeys/nkeys-${{ version }}.tar.gz
  sha256: 3a201dcd203d8bb05ba2884d441b2c92918b2a537a10d324e73738887dde9da3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0
  run:
    - python >=${{ python_min }}
    - pynacl

tests:
  - python:
      imports:
        - nkeys
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nats-io/nkeys.py
  license: Apache-2.0
  license_file: LICENSE
  summary: A public-key signature system based on Ed25519 for the NATS ecosystem.
  description: |
    A public-key signature system based on Ed25519 for the NATS ecosystem.

extra:
  recipe-maintainers:
    - rxm7706

