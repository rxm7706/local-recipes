# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.topology
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats.topology/pyats_topology-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: 181fc20fb7ac9c1da04fd3949e690f9fb4a091a236070bb3a7c99f028f93e0c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - yamllint
    - pyats.datastructures <26.8.0,>=26.7.0
    - pyats.connections <26.8.0,>=26.7.0
    - pyats.utils <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats.topology
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS Topology: Topology Objects and Testbed YAMLs"
  description: |
    pyATS Topology: Topology Objects and Testbed YAMLs

extra:
  recipe-maintainers:
    - rxm7706

