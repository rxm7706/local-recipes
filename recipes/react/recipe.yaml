# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: react
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/react/react-${{ version }}.tar.gz
  sha256: d7455fa9d91bb9e8f9981d37308f8bf78fcdeaa5b4b99f94f3fda1bd68b7d19c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - react
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/markfinger/python-react
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Server-side rendering of React components with data from your Python system
  description: |
    Server-side rendering of React components with data from your Python system

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: react
  cfe-upstream-registry: pypi
  cfe-upstream-name: react
  cfe-purls:
    - pkg:conda/react@${{ version }}?channel=conda-forge
    - pkg:pypi/react@${{ version }}
  cfe-upstream-repo: https://github.com/markfinger/python-react
  cfe-upstream-homepage: https://github.com/markfinger/python-react
  cfe-import-names: [react]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T00:07:45Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T00:07:45Z
