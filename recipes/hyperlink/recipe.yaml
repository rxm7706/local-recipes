# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "21.0.0"

package:
  name: hyperlink
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hyperlink/hyperlink-${{ version }}.tar.gz
  sha256: 427af957daa58bc909471c6c40f74c5450fa123dd093fc53efd2e91d2705a56b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - idna

tests:
  - python:
      imports:
        - hyperlink
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/hyperlink
  license: MIT
  license_file: LICENSE
  summary: A featureful, immutable, and correct URL for Python.
  description: |
    A featureful, immutable, and correct URL for Python.

extra:
  recipe-maintainers:
    - isuruf
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: hyperlink
  cfe-upstream-registry: pypi
  cfe-upstream-name: hyperlink
  cfe-purls:
