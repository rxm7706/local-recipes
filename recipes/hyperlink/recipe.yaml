    - pkg:pypi/hyperlink@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/python-hyper/hyperlink
  cfe-import-names: [hyperlink]
  cfe-source-kind: pypi-sdist
