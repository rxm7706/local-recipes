# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tika-client
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tika-client/tika_client-${{ version }}.tar.gz
  sha256: 0a3957e188ede45149c1ae2895967e05f823e5ebabfaa2d9122623648cc6fc43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4
    - anyio >=4.8
    - httpx >=0.27
    - typing_extensions

tests:
  - python:
      imports:
        - tika_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A modern REST client for Apache Tika server
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://github.com/stumpylog/tika-client

extra:
  recipe-maintainers:
    - rxm7706
    - jsmolic

#### CFE metadata AND comments
