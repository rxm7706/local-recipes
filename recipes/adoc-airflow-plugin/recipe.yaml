# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.4.0"

package:
  name: adoc-airflow-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adoc-airflow-plugin/adoc_airflow_plugin-${{ version }}.tar.gz
  sha256: c965d666d1b329cfc0f924c223c30b6f891fb651637eab592b732c69c8d5ffa8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - acceldata-sdk >=26.4.0

tests:
  - python:
      imports:
        - acceldata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/adoc-airflow-plugin/
  license: Apache-2.0
  license_file: LICENSE
  summary: Acceldata Airflow Listener Plugin
  description: |
    Acceldata Airflow Listener Plugin

extra:
  recipe-maintainers:
    - rxm7706

