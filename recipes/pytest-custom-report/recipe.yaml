# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: pytest-custom-report
  version: ${{ version }}

source:
  url: https://github.com/wimglenn/pytest-custom-report/archive/refs/tags/v${{ version }}.tar.gz
  sha256: dcce4274bf7f3b07eafa67374e68685acd2774ef627083528865f92e94b8873c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest

tests:
  - python:
      imports:
        - pytest_custom_report
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wimglenn/pytest-custom-report
  license: MIT
  license_file: LICENSE
  summary: Configure the symbols displayed for test outcomes
  description: |
    Configure the symbols displayed for test outcomes

extra:
  recipe-maintainers:
    - rxm7706

