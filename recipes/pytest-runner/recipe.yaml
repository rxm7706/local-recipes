# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.1"

package:
  name: pytest-runner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-runner/pytest-runner-${{ version }}.tar.gz
  sha256: 70d4739585a7008f37bf4933c013fdb327b8878a5a69fcbb3316c88882f0f49b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=56
  run:
    - python >=${{ python_min }}
    - pkg-resources

tests:
  - python:
      imports:
        - ptr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-runner/
  license: MIT
  license_file: LICENSE
  summary: Invoke py.test as distutils command with dependency resolution
  description: |
    Invoke py.test as distutils command with dependency resolution

extra:
  recipe-maintainers:
    - dopplershift
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytest-runner
