# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.18"

package:
  name: asysocks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asysocks/asysocks-${{ version }}.tar.gz
  sha256: cc6196e82c8adc8b3ce2321dddf635500c760316da4b7cca321b532cbb3dfdf5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - asn1crypto
    - cryptography
    - h11 >=0.14.0

tests:
  - python:
      imports:
        - asysocks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/asysocks
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

