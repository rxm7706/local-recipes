# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.2"

package:
  name: dbutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/DBUtils/dbutils-${{ version }}.tar.gz
  sha256: 160b5788154f1adeddc61080daff1530b4df2ba0d45af1c3bfbac76db24186b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dbutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://webwareforpython.github.io/DBUtils/
  license: MIT
  license_file: LICENSE
  summary: Database connections for multi-threaded environments.
  description: |
    Database connections for multi-threaded environments.
  repository: https://github.com/WebwareForPython/DBUtils
  documentation: https://webwareforpython.github.io/DBUtils/main.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
