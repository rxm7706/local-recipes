# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.14"

package:
  name: llama-agents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-agents/llama_agents-${{ version }}.tar.gz
  sha256: 5491886cc1e3b0ca602067e08a9c29e86b427c33e685016a262a838cb4d16c78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - fastapi <0.110.0,>=0.109.1
    - llama-index-core <0.11.0,>=0.10.50
    - pytest-asyncio <0.24.0,>=0.23.7
    - textual <0.71.0,>=0.70.0
    - uvicorn <0.31.0,>=0.30.1
    - pytest-mock <4.0.0,>=3.14.0

tests:
  - python:
      imports:
        - llama_agents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-agents/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

