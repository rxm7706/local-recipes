# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-anymail
  version: "15.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_anymail-${{ version }}.tar.gz
  sha256: 299fb12a21ac4101e9706c2ade461d18deacbb6bc3750cfa6ca08aeea1fc9442

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - django >=2.0
    - requests >=2.4.3
    - urllib3 >=1.25.0

tests:
  - python:
      imports:
        - anymail
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django email backends and webhooks for Mailgun, Mailjet, Postmark, SendGrid, SparkPost and more
  description: |
    Anymail integrates several transactional email service providers (ESPs) into Django, with a consistent API that lets you use ESP-added features without locking your code to a particular ESP.
    It currently fully supports Mailgun, Mailjet, Postmark, SendGrid, and SparkPost, and has limited support for Mandrill.
  homepage: https://github.com/anymail/django-anymail
  repository: https://github.com/anymail/django-anymail
  documentation: https://anymail.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - cshaley
    - elanqo
    - zaigner
    - millsks
    - rxm7706

