# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-docx
  version: "1.2.0"
  hash_val: 7bc9d7b7d8a69c9c02ca09216118c86552704edc23bac179283f2e38f86220ce

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ hash_val }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - lxml >=3.1.0
    - typing_extensions >=4.9.0

tests:
  - python:
      imports:
        - docx
        - docx.dml
        - docx.enum
        - docx.image
        - docx.opc
        - docx.opc.parts
        - docx.oxml
        - docx.oxml.text
        - docx.parts
        - docx.styles
        - docx.text
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Create and update Microsoft Word .docx files.
  homepage: https://github.com/python-openxml/python-docx

extra:
  recipe-maintainers:
    - pmlandwehr
    - nicoddemus
