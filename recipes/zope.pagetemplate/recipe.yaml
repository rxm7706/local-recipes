# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1"

package:
  name: zope.pagetemplate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.pagetemplate/zope_pagetemplate-${{ version }}.tar.gz
  sha256: 1303bcfb6cd6c28fa17aaaad542541d748f645e5a831a304ee9d29acb137eeba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.component
    - zope.tales
    - zope.tal >=4.2.0
    - zope.i18n >=4.0.1
    - zope.i18nmessageid
    - zope.traversing

tests:
  - python:
      imports:
        - zope.pagetemplate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.pagetemplate
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Page Templates
  description: |
    Zope Page Templates

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
