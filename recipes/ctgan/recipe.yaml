# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.1"

package:
  name: ctgan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ctgan/ctgan-${{ version }}.tar.gz
  sha256: e545c2b1a752affba3de2933a5f8037228e837f7a73f5593399b52cfe9611bc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - pandas >=1.4.0
    - pytorch >=1.13.0
    - tqdm >=4.29
    - rdt >=1.14.0

tests:
  - python:
      imports:
        - ctgan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ctgan/
  license: BUSL-1.1
  license_file: LICENSE
  summary: Create tabular synthetic data using a conditional GAN
  description: |
    Create tabular synthetic data using a conditional GAN
  repository: https://github.com/sdv-dev/CTGAN/

extra:
  recipe-maintainers:
    - conda-forge/sdv

#### CFE metadata AND comments
