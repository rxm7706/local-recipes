# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: pkce
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pkce/pkce-${{ version }}.tar.gz
  sha256: 9775fd76d8a743d39b87df38af1cd04a58c9b5a5242d5a6350ef343d06814ab6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pkce
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RomeoDespres/pkce
  license: MIT
  license_file: LICENSE
  summary: PKCE Pyhton generator.
  description: |
    PKCE Pyhton generator.

extra:
  recipe-maintainers:
    - AlbertDeFusco
    - mattkram

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pkce
