# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pkce
  version: "1.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pkce-${{ version }}.tar.gz
  sha256: 9775fd76d8a743d39b87df38af1cd04a58c9b5a5242d5a6350ef343d06814ab6

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pkce
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: PKCE Python generator.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/RomeoDespres/pkce

extra:
  recipe-maintainers:
    - AlbertDeFusco
    - mattkram
