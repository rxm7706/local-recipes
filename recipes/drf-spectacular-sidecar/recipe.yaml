# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.10.1"

package:
  name: drf-spectacular-sidecar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/drf-spectacular-sidecar/drf_spectacular_sidecar-${{ version }}.tar.gz
  sha256: ec8d20b2594e8a10ebf22e5bab62ec313c7cf8793753a050290b209e16e81c9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=2.2

tests:
  - python:
      imports:
        - drf_spectacular_sidecar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tfranzel/drf-spectacular-sidecar
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Serve self-contained distribution builds of Swagger UI and Redoc with Django
  description: |
    Serve self-contained distribution builds of Swagger UI and Redoc with Django
  repository: https://github.com/tfranzel/drf-spectacular-sidecar
  documentation: https://drf-spectacular.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

