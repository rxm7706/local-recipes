# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.32"

package:
  name: tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tools/tools-${{ version }}.tar.gz
  sha256: 5c2b33ea64faa1cd822047c916041823e98a625bb0348122e0303ec10085eb1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jsyoo61/tools
  license: MIT
  license_file: LICENSE
  summary: python syntax tool
  description: |
    python syntax tool

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tools
  cfe-upstream-registry: pypi
  cfe-upstream-name: tools
