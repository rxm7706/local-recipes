# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aiomysql
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 72d15ef5cfc34c03468eb41e1b90adb9fd9347b0b589114bd23ead569a02ac1a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vvv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools_scm >=6.4,<7
    - pymysql >=1.0
  run:
    - python >=${{ python_min }}
    - pymysql >=1.0

tests:
  - python:
      imports:
        - aiomysql
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: aiomysql is a library for accessing a MySQL database from the asyncio
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/aio-libs/aiomysql

extra:
  recipe-maintainers:
    - kszucs
    - xhochy
