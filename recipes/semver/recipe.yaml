# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.4"

package:
  name: semver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/semver/semver-${{ version }}.tar.gz
  sha256: afc7d8c584a5ed0a11033af086e8af226a9c0b206f313e0301f8dd7b6b589602

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - semver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/semver/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: "Python helper for Semantic Versioning (https://semver.org)"
  description: |
    Python helper for Semantic Versioning (https://semver.org)
  documentation: https://python-semver.rtfd.io

extra:
  recipe-maintainers:
    - rmax
    - carlodri

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: semver
  cfe-upstream-registry: pypi
  cfe-upstream-name: semver
  cfe-purls:
    - pkg:conda/semver@${{ version }}?channel=conda-forge
    - pkg:pypi/semver@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/semver/
  cfe-import-names: [semver]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/semver-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T05:21:23Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T05:21:23Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T05:21:23Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
