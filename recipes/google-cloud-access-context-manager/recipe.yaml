# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: google-cloud-access-context-manager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-access-context-manager/google_cloud_access_context_manager-${{ version }}.tar.gz
  sha256: 4d998e4a81c424f51f6c5c6aacb27d7806116d30b556c708ac0a89c37fe51ad8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.identity.accesscontextmanager.v1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-access-context-manager
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Access Context Manager Protobufs
  description: |
    Google Cloud Access Context Manager Protobufs

extra:
  recipe-maintainers:
    - rxm7706

