# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.7"

package:
  name: models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/models/models-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://bitbucket.org/neithere/pymodels/
  license: MIT
  license_file: LICENSE
  summary: Python models for schema-less databases.
  description: |
    Python models for schema-less databases.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
