# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: libmamba
  version: "0.15.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mamba-org/mamba/archive/${{ version }}.tar.gz
  sha256: f2ad92625954cd029b84725bc33f658020a589cefda0b18adb1b7825ab7d4a1f

build:
  number: 1

requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
  host:
    - libsolv >=0.7.18
    - libcurl
    - openssl
    - libarchive
    - nlohmann_json
    - cpp-filesystem >=1.5.8
    - yaml-cpp
    - reproc-cpp >=14.2.1
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/libmamba${SHLIB_EXT}
      - if: unix
        then: test -f $PREFIX/include/mamba/core/context.hpp
      - if: unix
        then: test -f $PREFIX/include/mamba/core/channel.hpp
      - if: win
        then: if not exist %LIBRARY_INC%\mamba\core\channel.hpp (exit 1)
      - if: win
        then: if not exist %LIBRARY_INC%\mamba\core\context.hpp (exit 1)
      - if: win
        then: if not exist %LIBRARY_LIB%\libmamba.lib (exit 1)
      - if: win
        then: if not exist %LIBRARY_BIN%\libmamba.dll (exit 1)

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A library that exposes the internals of mamba, a fast drop-in alternative to conda
  description: A fast drop-in alternative to conda, using libsolv for dependency resolution
  homepage: https://github.com/mamba-org/mamba
  repository: https://github.com/mamba-org/mamba

extra:
  recipe-maintainers:
    - SylvainCorlay
    - JohanMabille
    - wolfv
    - adriendelsalle
