# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: prettyprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prettyprint/prettyprint-${{ version }}.tar.gz
  sha256: 7423210b62adfb3777677914cd25db4919f1c2b0afba0454365ffbfa3f7e3731

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - prettyprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/taichino/prettyprint
  license: MIT
  license_file: LICENSE
  summary: prettyprint print list/dict/tuple object prettily
  description: |
    prettyprint print list/dict/tuple object prettily

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: prettyprint
  cfe-upstream-registry: pypi
  cfe-upstream-name: prettyprint
