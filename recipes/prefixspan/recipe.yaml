# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: prefixspan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prefixspan/prefixspan-${{ version }}.tar.gz
  sha256: 8fbd2f94b3a7f4399d04f9bd6aa214b830fb7828799c472cd43dda10b03f671c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - extratools

tests:
  - python:
      imports:
        - prefixspan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chuanconggao/PrefixSpan-py
  license: MIT
  license_file: LICENSE
  summary: PrefixSpan, BIDE, and FEAT in Python 3
  description: |
    PrefixSpan, BIDE, and FEAT in Python 3

extra:
  recipe-maintainers:
    - rxm7706

