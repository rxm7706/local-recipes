# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.11.3"

package:
  name: platformdirs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/platformdirs/platformdirs-${{ version }}.tar.gz
  sha256: 66a73d38a849810252df809a3d8bcbda8e26f6c189920e7535ad608a48dbb5ab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.5
    - hatchling >=1.29
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - platformdirs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tox-dev/platformdirs
  license: MIT
  license_file: LICENSE
  summary: A small Python package for determining appropriate platform-specific dirs, e.g. a `user data dir`.
  description: |
    A small Python package for determining appropriate platform-specific dirs, e.g. a `user data dir`.
  repository: https://github.com/tox-dev/platformdirs
  documentation: https://platformdirs.readthedocs.io

extra:
  recipe-maintainers:
    - adament
    - gaborbernat
    - bollwyvl

