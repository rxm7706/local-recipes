# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.9.0"

package:
  name: aiobotocore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiobotocore/aiobotocore-${{ version }}.tar.gz
  sha256: 5d344e97c518b010bea167c7f7ba4f9e785f9d2b8ac7af4fd00846c62f2c0a10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-fancy-pypi-readme >=24.1.0
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.14.0,<4.0.0
    - aioitertools >=0.5.1,<1.0.0
    - botocore >=1.43.3,<1.43.57
    - jmespath >=0.7.1,<2.0.0
    - multidict >=6.0.0,<7.0.0
    - python-dateutil >=2.1,<3.0.0
    - typing_extensions >=4.14.0,<5.0.0
    - wrapt >=1.10.10,<3.0.0

tests:
  - python:
      imports:
        - aiobotocore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/aiobotocore/
  license: Apache-2.0
  license_file: LICENSE
  summary: Async client for aws services using botocore and aiohttp
  description: |
    Main purpose of this library to support amazon s3 api, but other services
    should work (may be with minor fixes). For now it has been tested only for
    upload/download api for s3. It has been reported that SQS and Dynamo
    services also work.
  repository: https://github.com/aio-libs/aiobotocore
  documentation: https://aiobotocore.aio-libs.org

extra:
  recipe-maintainers:
    - TRNWWZ
    - claytonparnell
    - nehaljwani
    - fhoehle

