# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: booster
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/booster/booster-${{ version }}.tar.gz
  sha256: 6f6675b596f13647922b9f082cc14a2a141e5163db78f33aea691f98c1ae2adb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - booster
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/booster/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Boost your project
  description: |
    Boost your project

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
