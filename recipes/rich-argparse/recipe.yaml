# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.0"

package:
  name: rich-argparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rich-argparse/rich_argparse-${{ version }}.tar.gz
  sha256: 679df3d832fa94ad6e4bdb07ded088cd7ea2dddc58ae9b2b46346a40b06cbc0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.11.0
  run:
    - python >=${{ python_min }}
    - rich >=11.0.0

tests:
  - python:
      imports:
        - rich_argparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hamdanal/rich-argparse
  license: MIT
  license_file: LICENSE
  summary: Rich help formatters for argparse and optparse
  description: |
    Rich help formatters for argparse and optparse
  documentation: https://github.com/hamdanal/rich-argparse#rich-argparse

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
