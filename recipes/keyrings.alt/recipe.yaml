# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.2"

package:
  name: keyrings.alt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keyrings.alt/keyrings_alt-${{ version }}.tar.gz
  sha256: 8f097ebe9dc8b185106502b8cdb066c926d2180e13b4689fd4771a3eab7d69fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - jaraco.classes
    - jaraco.context

tests:
  - python:
      imports:
        - keyrings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/keyrings.alt/
  license: MIT
  license_file: LICENSE
  summary: Alternate keyring implementations
  description: |
    Alternate keyring implementations
  repository: https://github.com/jaraco/keyrings.alt

extra:
  recipe-maintainers:
    - astaric
    - yarikoptic

