# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: my-weather-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/my-weather-mcp/my_weather_mcp-${{ version }}.tar.gz
  sha256: b8c3c8acffe4189c01494afd202d58bb23be5db25f38bff3eeae570166bac490

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.21,<0.10.0
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - mcp >=1.25.0

tests:
  - python:
      imports:
        - my_weather_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/my-weather-mcp/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

