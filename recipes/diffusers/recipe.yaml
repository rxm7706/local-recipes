# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.39.0"

package:
  name: diffusers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffusers/diffusers-${{ version }}.tar.gz
  sha256: 14bb1d98c85a0e463d734c99aaa73b480a7bc9bad22af30fbf730ef8f09c1d67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - filelock
    - httpx <1.0.0
    - huggingface-hub <2.0,>=0.34.0
    - numpy
    - regex !=2019.12.17
    - requests
    - safetensors >=0.8.0
    - pillow

tests:
  - python:
      imports:
        - diffusers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/diffusers
  license: Apache-2.0
  license_file: LICENSE
  summary: State-of-the-art diffusion in PyTorch and JAX.
  description: |
    State-of-the-art diffusion in PyTorch and JAX.

extra:
  recipe-maintainers:
    - mukhery
    - sugatoray
    - xhochy
    - anton-l
    - patrickvonplaten

#### CFE metadata AND comments
