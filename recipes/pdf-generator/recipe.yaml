# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pdf-generator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdf-generator/pdf-generator-${{ version }}.tar.gz
  sha256: 70dcb42b8019bda05202e27ca8b0d2c1efe5795ae58fe806ab992f96ff3984b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - reportlab

tests:
  - python:
      imports:
        - pdf_generator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pdf-generator/
  license: MIT
  license_file: LICENSE
  summary: PDF Generation utils
  description: |
    PDF Generation utils

extra:
  recipe-maintainers:
    - rxm7706

