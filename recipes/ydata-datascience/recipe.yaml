# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: ydata-datascience
  version: ${{ version }}

source:
  url: https://github.com/ydataai/python-core/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8655a78b478139dc7c8cf6e0ab29cd9bd1ab74e684502ab1422147d5002ae459

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - core.ydata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ydataai/python-core
  license: MIT
  license_file: LICENSE
  summary: Data science functionalities for all python packages at YData
  description: |
    Data science functionalities for all python packages at YData

extra:
  recipe-maintainers:
    - rxm7706

