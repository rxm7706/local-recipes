# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.7"

package:
  name: pyqlearning
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyqlearning/pyqlearning-${{ version }}.tar.gz
  sha256: 996a2444b9c121bccd4cf2681eb73fd2080a33355d7d85b1de039e3886bd0a13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyqlearning
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/accel-brain/accel-brain-code/tree/master/Reinforcement-Learning
  license: GPL-2.0-only
  license_file: LICENSE
  summary: "pyqlearning is Python library to implement Reinforcement Learning and Deep Reinforcement Learning."
  description: |
    pyqlearning is Python library to implement Reinforcement Learning and Deep Reinforcement Learning, especially for Q-Learning, Deep Q-Network, and Multi-agent Deep Q-Network which can be optimized by Annealing models such as Simulated Annealing, Adaptive Simulated Annealing, and Quantum Monte Carlo Method.

extra:
  recipe-maintainers:
    - rxm7706

