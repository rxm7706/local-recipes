# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: llama-index-embeddings-instructor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-embeddings-instructor/llama_index_embeddings_instructor-${{ version }}.tar.gz
  sha256: 65e177b603679f4dd86076023760970bfe4aead38fd376255ae5cecf6e27e1f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - instructorembedding <2,>=1.0.1
    - llama-index-core <0.15,>=0.13.0
    - sentence-transformers <3,>=2.2.2
    - pytorch <3,>=2.1.2

tests:
  - python:
      imports:
        - llama_index.embeddings.instructor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-embeddings-instructor/
  license: MIT
  license_file: LICENSE
  summary: llama-index embeddings instructor integration
  description: |
    llama-index embeddings instructor integration

extra:
  recipe-maintainers:
    - rxm7706

