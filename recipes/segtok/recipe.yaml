# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.11"

package:
  name: segtok
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/segtok/segtok-${{ version }}.tar.gz
  sha256: 8ab2dd44245bcbfec25b575dc4618473bbdf2af8c2649698cd5a370f42f3db23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - regex

tests:
  - python:
      imports:
        - segtok
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fnl/segtok
  license: MIT
  license_file: LICENSE.txt
  summary: sentence segmentation and word tokenization tools
  description: |
    sentence segmentation and word tokenization tools

extra:
  recipe-maintainers:
    - mxr-conda

#### CFE metadata AND comments
