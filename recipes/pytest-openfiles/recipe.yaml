# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: pytest-openfiles
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-openfiles/pytest_openfiles-${{ version }}.tar.gz
  sha256: ff5160c34eaada82b983a2c316fcccb30e0094630e97784471f015956870a993

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - packaging
    - pytest >=4.6
    - psutil

tests:
  - python:
      imports:
        - pytest_openfiles
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-openfiles
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pytest plugin for detecting inadvertent open file handles
  description: |
    Pytest plugin for detecting inadvertent open file handles

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytest-openfiles
