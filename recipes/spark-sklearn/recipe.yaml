# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: spark-sklearn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spark-sklearn/spark-sklearn-${{ version }}.tar.gz
  sha256: d78d4f08a3849b243232ef78b63b4babfdb04ec529f996f4699923f40cfce827

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spark_sklearn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/databricks/spark-sklearn
  license: Apache-2.0
  license_file: LICENSE
  summary: Integration tools for running scikit-learn on Spark
  description: |
    Integration tools for running scikit-learn on Spark

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
