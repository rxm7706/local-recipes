# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.6"

package:
  name: sema4ai-actions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sema4ai-actions/sema4ai_actions-${{ version }}.tar.gz
  sha256: 83d16618764eaf38955ccf746560491e91aefe951ebd0b6dc8d9002717cf3355

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - cryptography >=44.0.1
    - robocorp-log <4,>=2.4
    - robocorp-truststore >=0.8.0
    - psutil <8.0,>=5.0
    - docstring_parser_fork <0.0.6,>=0.0.5
    - pydantic <3.0.0,>=2.11.7
    - sema4ai-http-helper <3.0.0,>=2.0.1
    - pyyaml <7.0,>=6.0

tests:
  - python:
      imports:
        - sema4ai.actions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Sema4AI/actions/
  license: Apache-2.0
  license_file: LICENSE
  summary: Sema4AI Actions
  description: |
    Sema4AI Actions
  repository: https://github.com/Sema4AI/actions/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
