# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: superqt
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: faa3bd00ef1c9b209b1f31b154dd41c596fec3824f61a70c251fb5569acd7ba6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - hatch-vcs
    - pip
    - python ${{ python_min }}
  run:
    - pyconify >=0.1.4
    - pygments >=2.4.0
    - python >=${{ python_min }}
    - qtpy >=2.4.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - superqt
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - pyqt
        - python ${{ python_min }}
    script:
      - pip list

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Missing widgets and components for PyQt/PySide
  description: |
    Superqt aims to provide high-quality community-contributed Qt widgets
    and components for PyQt & PySide that are not provided in the native
    QtWidgets module, such as range sliders, float sliders, and other
    extended widgets.
  homepage: https://github.com/pyapp-kit/superqt
  repository: https://github.com/pyapp-kit/superqt

extra:
  recipe-maintainers:
    - goanpeca
    - jni
    - tlambert03
