# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.72"

package:
  name: botocore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/botocore/botocore-${{ version }}.tar.gz
  sha256: 1b878c69081e8e9d55aa4c0d85683e7b07f0e274a5554662f9507a46641be3d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jmespath <2.0.0,>=0.7.1
    - python-dateutil <3.0.0,>=2.1
    - urllib3 !=2.2.0,<3,>=1.25.4

tests:
  - python:
      imports:
        - botocore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/boto/botocore
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Low-level, data-driven core of boto 3.
  description: |
    Low-level, data-driven core of boto 3.

extra:
  recipe-maintainers:
    - hajapy
    - tkelman
    - ocefpaf

#### CFE metadata AND comments
