# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.35"

package:
  name: google-apitools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-apitools/google-apitools-${{ version }}.tar.gz
  sha256: 911bc3698686c74187414c610ae30bd6e3c0a7404178fc6479ead6c420d2dd94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httplib2 >=0.8
    - fasteners >=0.14
    - oauth2client >=1.4.12
    - six >=1.12.0

tests:
  - python:
      imports:
        - apitools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/google/apitools
  license: Apache-2.0
  license_file: LICENSE
  summary: client libraries for humans
  description: |
    client libraries for humans

extra:
  recipe-maintainers:
    - xhochy

