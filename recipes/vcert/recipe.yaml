# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: vcert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vcert/vcert-${{ version }}.tar.gz
  sha256: 57e7e6bc239b6035e9a9c3bad6f697fc8332c2328adac8014c9ca481e588ea26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.32.4
    - python-dateutil >=2.9.0.post0
    - six >=1.17.0
    - cryptography <50,>=48.0.1
    - ruamel.yaml <0.19,>=0.18.17
    - pynacl >=1.6.2

tests:
  - python:
      imports:
        - vcert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Venafi/vcert-python
  license: ASL
  license_file: LICENSE
  summary: Python client library for CyberArk Certificate Manager, Self-Hosted and CyberArk Certificate Manager, SaaS.
  description: |
    Python client library for CyberArk Certificate Manager, Self-Hosted and CyberArk Certificate Manager, SaaS.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
