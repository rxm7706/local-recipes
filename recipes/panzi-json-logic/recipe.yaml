# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"
  python_min: "3.10"

package:
  name: panzi-json-logic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panzi-json-logic/panzi-json-logic-${{ version }}.tar.gz
  sha256: df80ec3902ef6b03d89f28642cf5031d8aa4fd86c17010133ca23415e6652253

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json_logic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/panzi/panzi-json-logic
  license: MIT
  license_file: LICENSE
  summary: Pure Python 3 JsonLogic and CertLogic implementation.
  description: |
    Pure Python 3 JsonLogic and CertLogic implementation.

extra:
  recipe-maintainers:
    - rxm7706

