# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: pycrdt-store
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycrdt-store/pycrdt_store-${{ version }}.tar.gz
  sha256: 10cb0a71b86e167735235b3ab82816015ba746a2e660bcb133adb67a8d5c8818

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - anyio >=3.6.2,<5
    - sqlite-anyio >=0.2.3,<0.3.0
    - pycrdt >=0.14.0,<0.15.0

tests:
  - python:
      imports:
        - pycrdt.store
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Persistent storage for pycrdt
  homepage: https://github.com/y-crdt/pycrdt-store

extra:
  recipe-maintainers:
    - davidbrochart
