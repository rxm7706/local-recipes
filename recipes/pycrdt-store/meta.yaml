{% set version = "0.1.5" %}

package:
  name: pycrdt-store
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pycrdt-store/pycrdt_store-{{ version }}.tar.gz
  sha256: 10cb0a71b86e167735235b3ab82816015ba746a2e660bcb133adb67a8d5c8818

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - anyio >=3.6.2,<5
    - sqlite-anyio >=0.2.3,<0.3.0
    - pycrdt >=0.14.0,<0.15.0

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - pycrdt.store
  commands:
    - pip check

about:
  home: https://github.com/y-crdt/pycrdt-store
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Persistent storage for pycrdt

extra:
  recipe-maintainers:
    - davidbrochart
