# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.24"

package:
  name: flask-compress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Compress/flask_compress-${{ version }}.tar.gz
  sha256: 14097cefe59ecb3e466d52a6aeb62f34f125a9f7dadf1f33a53e430ce4a50f31

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - flask
    - brotli
    - brotlicffi
    - backports.zstd

tests:
  - python:
      imports:
        - flask_compress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/colour-science/flask-compress
  license: MIT
  license_file: LICENSE.txt
  summary: Compress responses in your Flask app with gzip, deflate, brotli or zstandard.
  description: |
    Compress responses in your Flask app with gzip, deflate, brotli or zstandard.

extra:
  recipe-maintainers:
    - synapticarbors
    - mariusvniekerk

#### CFE metadata AND comments
