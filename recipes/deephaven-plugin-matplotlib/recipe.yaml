# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: deephaven-plugin-matplotlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-plugin-matplotlib/deephaven_plugin_matplotlib-${{ version }}.tar.gz
  sha256: bf2633590562497d916ab501739e8929beb3cfc0e8d02ad6063b50f18771c5e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
    - deephaven-plugin-packaging
  run:
    - python >=${{ python_min }}
    - deephaven-core >=0.27.0
    - jpy >=0.14.0
    - deephaven-plugin >=0.5.0
    - matplotlib-base
    - deephaven-plugin-utilities

tests:
  - python:
      imports:
        - deephaven.plugin.matplotlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugins
  license: Apache-2.0
  license_file: LICENSE
  summary: Deephaven Plugin for matplotlib
  description: |
    Deephaven Plugin for matplotlib
  repository: https://github.com/deephaven/deephaven-plugins

extra:
  recipe-maintainers:
    - rxm7706

