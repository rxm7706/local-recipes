# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-silk
  version: "5.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-silk/django_silk-${{ version }}.tar.gz
  sha256: bb741fb8af45eba663e8ed832207d16ecd731496313311f6dfae5fe776bed38e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools-scm
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - sqlparse
    - autopep8
    - gprof2dot >=2017.09.19

tests:
  - python:
      imports:
        - silk
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Silky smooth profiling for the Django Framework
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jazzband/django-silk

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: django-silk
  cfe-upstream-registry: pypi
  cfe-upstream-name: django-silk
  cfe-purls:
