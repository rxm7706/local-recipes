# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pylablib
  version: "1.4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylablib-${{ version }}.tar.gz
  sha256: ea38b4a5a913d045b9228680c9f5fb5be2bfec1b1648441a22cf0a08d234efdb

build:
  number: 0
  skip: match(python, "<3.6")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: python
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cython 3.0.12.*
  run:
    - python
    - numba
    - numpy
    - pandas
    - pyqt >=5.9
    - pyqtgraph
    - pyserial
    - pyusb
    - pyvisa >=1.6
    - rpyc
    - scipy

tests:
  - python:
      imports:
        - pylablib
        - pylablib.core
      pip_check: false
  - requirements:
      run:
        - pip

about:
  summary: "Code for use in lab environment: experiment automation, data acquisition, device communication"
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/AlexShkarin/pyLabLib
  repository: https://github.com/AlexShkarin/pyLabLib/
  documentation: https://pylablib.readthedocs.io/

extra:
  recipe-maintainers:
    - AlexShkarin
