# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "4.44.4"

package:
  name: algoliasearch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/algoliasearch/algoliasearch-${{ version }}.tar.gz
  sha256: b5bcf1cbfb7172be19f8b71a0e1f2ef482a1da24f08522fb77788d5486c36512

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - urllib3 >=2.2.3
    - aiohttp >=3.10.11
    - requests >=2.32.3
    - python-dateutil >=2.8.2
    - async-timeout >=4.0.3
    - pydantic >=2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - algoliasearch
      pip_check: true

about:
  homepage: https://www.algolia.com
  summary: A fully-featured and blazing-fast Python API client to interact with Algolia.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - soapy1
