# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gotrue
  version: "2.12.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 35d2e58e066486321f4dff0033b30a53d057c7f436c15287122fa0cb833029b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - pyjwt >=2.10.1,<3.0.0
    - pytest-mock >=3.14.0,<4.0.0
    - python >=${{ python_min }}
    - httpx >=0.26,<0.29
    - pydantic >=1.10,<3

tests:
  - python:
      imports:
        - gotrue
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Python client implementation of Supabase's GoTrue
  description: |
    Python client implementation of Supabase's GoTrue


  homepage: https://github.com/supabase-community/gotrue-py

extra:
  recipe-maintainers:
    - timkpaine
    - J0
    - anand2312
