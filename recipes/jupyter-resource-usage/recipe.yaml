# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyter-resource-usage
  version: "1.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 41f89bb10a6f3338589fb9ae4379d0ce910a4f8557dd1e91eef83dd288721a3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
    - hatch-jupyter-builder
  run:
    - jupyter_server >=2.0.0,<3
    - psutil >=5.6.0
    - python >=${{ python_min }}
    - pyzmq >=19

tests:
  - python:
      imports:
        - jupyter_resource_usage
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Server Extension for monitoring Resource Usage
  description: |
    Jupyter Server Extension for monitoring Resource Usage
  homepage: https://github.com/jupyter-server/jupyter-resource-usage
  repository: https://github.com/jupyter-server/jupyter-resource-usage

extra:
  recipe-maintainers:
    - krassowski
    - jtpio
