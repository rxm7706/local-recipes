# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sspilib
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sspilib-${{ version }}.tar.gz
  sha256: b62f7f2602aa1add0505eee2417e2df24421224cb411e53bf3ae42a71b62fe98

build:
  number: 1
  skip: not win or match(python, "<3.8")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython >=3.2.1,<4.0.0
    - setuptools >=77.0.3
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - sspilib
      pip_check: true

about:
  summary: SSPI API bindings for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jborean93/sspilib

extra:
  recipe-maintainers:
    - dhirschfeld
