# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.54"

package:
  name: openinference-instrumentation-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation-openai/openinference_instrumentation_openai-${{ version }}.tar.gz
  sha256: 665ce91fc57e631ce124ac9ae242474dfee77bacdc477e8610a3505737399720

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation >=0.1.51
    - openinference-semantic-conventions >=0.1.31
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - typing_extensions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-openai
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference OpenAI Instrumentation
  description: |
    OpenInference OpenAI Instrumentation

extra:
  recipe-maintainers:
    - michaelschiff
    - mikeldking
    - RogerHYang
    - axiomofjoy
    - anticorrelator

