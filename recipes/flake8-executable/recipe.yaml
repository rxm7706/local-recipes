# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flake8-executable
  version: "2.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flake8-executable-${{ version }}.tar.gz
  sha256: 619fe023e00c3d8e5113521d7200e1ebb04587c12d157f9a2fb167feb8cae66b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flake8 >=3.0.0

tests:
  - python:
      imports:
        - flake8_executable
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Flake8 plugin for checking executable permissions and shebangs.
  license: LGPL-3.0-or-later AND GPL-3.0-or-later
  license_file:
    - COPYING.GPL
    - COPYING
  homepage: https://github.com/xuhdev/flake8-executable

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
