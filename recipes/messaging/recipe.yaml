# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2"

package:
  name: messaging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/messaging/messaging-${{ version }}.tar.gz
  sha256: 50349ad624ada75661d2c33fc789e4681dbabbc79a444ade711dd1fdc7534838

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - messaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cern-mig/python-messaging
  license: Apache-2.0
  license_file: LICENSE
  summary: Messaging related modules
  description: |
    Messaging related modules

extra:
  recipe-maintainers:
    - rxm7706

