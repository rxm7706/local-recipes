# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: az.cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/az.cli/az.cli-${{ version }}.tar.gz
  sha256: 6a391562373f7353607604d502b72ecad0e457fc15f1ae597d3cad8759d20508

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-cli

tests:
  - python:
      imports:
        - az
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MarkWarneke/Az.Cli
  license: MIT
  license_file: LICENSE
  summary: An interface to execute Azure CLI commands using Python
  description: |
    An interface to execute Azure CLI commands using Python

extra:
  recipe-maintainers:
    - rxm7706

