# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sanic
  version: "25.12.1"

package:
  name: sanic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7b51bf608e4030f06a6c002cd08fed2872e4936527e63c9a8a97d5cd06a2b47f

build:
  number: 0
  skip: match(python, "<3.9") or win
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  python:
    entry_points:
      - sanic = sanic.__main__:main

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools >=70.1
    - wheel
  run:
    - python
    - sanic-routing >=23.12.0
    - httptools >=0.0.10
    - if: not win
      then: uvloop >=0.15.0
    - if: not win
      then: ujson >=1.35
    - aiofiles >=0.6.0
    - websockets >=10.0
    - multidict >=5.0,<7.0
    - html5tagger >=1.2.1
    - tracerite >=1.0.0
    - typing_extensions >=4.4.0
    - setuptools >=70.1

tests:
  - python:
      imports:
        - sanic
        - sanic.mixins
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - sanic --help

about:
  summary: Async Python 3.9+ web server and web framework that's written to go fast.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/channelcat/sanic

extra:
  recipe-maintainers:
    - ahopkins
    - kszucs
    - nicoddemus
    - thewchan
