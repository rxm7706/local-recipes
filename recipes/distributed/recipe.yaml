# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.1"

package:
  name: distributed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/distributed/distributed-${{ version }}.tar.gz
  sha256: f7c48ab6961734874521574d75898466703bce93f22f0cff5872c7e4ac6425d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - setuptools-scm >=9
  run:
    - python >=${{ python_min }}
    - click >=8.0
    - cloudpickle >=3.0.0
    - dask <2026.7.2,>=2026.7.1
    - jinja2 >=2.10.3
    - locket >=1.0.0
    - msgpack >=1.0.2
    - packaging >=20.0
    - psutil >=5.8.0
    - pyyaml >=5.4.1
    - sortedcontainers >=2.0.5
    - tblib !=3.2.0,!=3.2.1,>=1.6.0
    - toolz >=0.12.0
    - tornado >=6.2.0
    - zict >=3.0.0

tests:
  - python:
      imports:
        - distributed
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://distributed.dask.org
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Distributed scheduler for Dask
  description: |
    Distributed scheduler for Dask
  repository: https://github.com/dask/distributed

extra:
  recipe-maintainers:
    - fjetter
    - mrocklin
    - jcrist
    - martindurant
    - jakirkham
    - marcelotrevisani
    - ogrisel
    - tomaugspurger
    - jrbourbeau
    - charlesbluca
    - jacobtomlinson

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: distributed
  cfe-upstream-registry: pypi
  cfe-upstream-name: distributed
  cfe-purls:
    - pkg:conda/distributed@${{ version }}?channel=conda-forge
    - pkg:pypi/distributed@${{ version }}
  cfe-upstream-repo: https://github.com/dask/distributed
  cfe-upstream-homepage: https://distributed.dask.org
  cfe-import-names: [distributed]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/distributed-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
