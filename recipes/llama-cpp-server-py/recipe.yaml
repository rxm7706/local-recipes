# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: llama-cpp-server-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-cpp-server-py/llama_cpp_server_py-${{ version }}.tar.gz
  sha256: f44a8707f8f561b7108bbe024561d1028afafb707f90e4aa1e1a56bb4fe50765

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-cpp-server-py-core

tests:
  - python:
      imports:
        - llama_cpp_server_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-cpp-server-py/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

