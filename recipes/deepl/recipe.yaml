# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.32.0"

package:
  name: deepl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepl/deepl-${{ version }}.tar.gz
  sha256: 3016bf86f1f53eb6e5fedb458746c6bf6579a840b57c54a2ed701b0344bc79e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - requests >=2.32.5

tests:
  - python:
      imports:
        - deepl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DeepLcom/deepl-python
  license: MIT
  license_file: LICENSE
  summary: Python library for the DeepL API.
  description: |
    Python library for the DeepL API.
  repository: https://github.com/DeepLcom/deepl-python
  documentation: https://www.deepl.com/docs-api/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: deepl
  cfe-upstream-registry: pypi
  cfe-upstream-name: deepl
