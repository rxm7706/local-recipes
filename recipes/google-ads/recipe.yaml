# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "31.3.0"

package:
  name: google-ads
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-ads/google_ads-${{ version }}.tar.gz
  sha256: 8f42581e9db633562e2664fd0e583af7c6064d6a2e991a6910c4b5c9cd30b28d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-auth-oauthlib <2.0.0,>=1.0.0
    - google-api-core <=3.0.0,>=2.13.0
    - googleapis-common-protos <2.0.0,>=1.56.3
    - grpcio <2.0.0,>=1.59.0
    - grpcio-status <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - pyyaml <7.0,>=5.1
    - protobuf <7.0.0,>=4.25.0

tests:
  - python:
      imports:
        - google.ads.googleads
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/google-ads/
  license: Apache-2.0
  license_file: LICENSE
  summary: Client library for the Google Ads API
  description: |
    Client library for the Google Ads API
  repository: https://github.com/googleads/google-ads-python

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
