# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: tarsafe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tarsafe/tarsafe-${{ version }}.tar.gz
  sha256: 1636ed0a0ae4995862dbc647cf6e4ba49724d045f125f9d952216089a4bd6c79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tarsafe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/beatsbears/tarsafe
  license: MIT
  license_file: LICENSE
  summary: A safe subclass of the TarFile class for interacting with tar files. Can be used as a direct drop-in replacement for safe usage of extractall()
  description: |
    A safe subclass of the TarFile class for interacting with tar files. Can be used as a direct drop-in replacement for safe usage of extractall()

extra:
  recipe-maintainers:
    - rxm7706

