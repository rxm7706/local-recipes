    - pkg:conda/ffmpy@${{ version }}?channel=conda-forge
    - pkg:pypi/ffmpy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/ffmpy/
  cfe-import-names: [ffmpy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ffmpy-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.0.0

  cfe-forge-blocker-list:
