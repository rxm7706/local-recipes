# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: ffmpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/ffmpy/ffmpy-${{ version }}.tar.gz
  sha256: b12932e95435c8820f1cd041024402765f821971e4bae753b327fc02a6e12f8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7.9,<0.10.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ffmpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ffmpy/
  license: MIT
  license_file: LICENSE
  summary: A simple Python wrapper for FFmpeg
  description: |
    A simple Python wrapper for FFmpeg

extra:
  recipe-maintainers:
    - MattTriano

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ffmpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: ffmpy
