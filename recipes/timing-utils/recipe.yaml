# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: timing-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/timing-utils/timing_utils-${{ version }}.tar.gz
  sha256: 5fead9db5f939dff9846b23575e5e8a86e9198d60c9a1aa933196a79986633ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - loguru >=0.7.0

tests:
  - python:
      imports:
        - timing_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tyrbok/timing-utils
  license: MIT
  license_file: LICENSE
  summary: Simple utilities to time synchronous and asynchronous Python functions.
  description: |
    Simple utilities to time synchronous and asynchronous Python functions.
  repository: https://github.com/tyrbok/timing-utils

extra:
  recipe-maintainers:
    - rxm7706

