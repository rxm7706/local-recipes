# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: caugetch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/caugetch/caugetch-${{ version }}.tar.gz
  sha256: 6f6ddb3b928fa272071b02aabb3342941cd99992f27413ba8c189eb4dc3e33b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - caugetch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.youtube.com/channel/UCAbwAklWIeuoKKjVBMQVCew
  license: MIT
  license_file: LICENSE
  summary: this is a better getpass. Made by Caua_SCP.
  description: |
    this is a better getpass. Made by Caua_SCP.

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

