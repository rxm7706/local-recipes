# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.12.1"

package:
  name: asgiref
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asgiref/asgiref-${{ version }}.tar.gz
  sha256: 59dcb51c272ad209d59bed5708a64a333083e86017d7fcdd67498eeab7784340

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4

tests:
  - python:
      imports:
        - asgiref
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django/asgiref/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: ASGI specs, helper code, and adapters
  description: |
    ASGI specs, helper code, and adapters
  documentation: https://asgi.readthedocs.io/

extra:
  recipe-maintainers:
    - dhirschfeld
    - carlodri

#### CFE metadata AND comments
