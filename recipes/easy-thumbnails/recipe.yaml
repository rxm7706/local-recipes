# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: easy-thumbnails
  version: "2.10.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a50aa5f99387546c35ab5ba1ea9b3cbbc5658e65601cd34949f62137c32c222e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - pillow
    # - svglib
    # - reportlab

tests:
  - python:
      imports:
        - easy_thumbnails
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Easy thumbnails for Django
  description: A powerful, yet easy to implement thumbnailing application for Django 1.8+
  homepage: https://github.com/SmileyChris/easy-thumbnails
  repository: https://github.com/SmileyChris/easy-thumbnails
  documentation: http://easy-thumbnails.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706
