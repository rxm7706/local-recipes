# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydocket
  version: "0.24.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 477d77be1fcfd10ee0c2d0b8aa8c6e97851b9c7f39bb6f2b4e6d42e9b4d6e95a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - docket = docket.__main__:app

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - burner-redis >=0.1.6
    - cloudpickle >=3.1.1
    - cronsim >=2.6
    - if: match(python, "<3.11")
      then: exceptiongroup >=1.2.0
    - if: match(python, "<3.11")
      then: taskgroup >=0.2.2
    - opentelemetry-api >=1.33.0
    - opentelemetry-exporter-prometheus >=0.60b0
    - opentelemetry-instrumentation >=0.60b0
    - prometheus_client >=0.21.1
    - py-key-value-aio >=0.3.0
    - python-json-logger >=2.0.7
    - if: win
      then: python-tzdata >=2025.2
    - redis-py >=5
    - rich >=13.9.4
    - typer >=0.15.1
    - typing-extensions >=4.12.0
    - uncalled-for >=0.2.0

tests:
  - python:
      imports:
        - docket
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: A distributed background task system for Python functions
  description: |
    Docket is a distributed background task system for Python functions with a
    focus on scheduling future work. It requires a Redis server with Streams
    support (Redis 5.0.0+).
  homepage: https://github.com/chrisguidry/docket
  repository: https://github.com/chrisguidry/docket
  documentation: https://github.com/chrisguidry/docket

extra:
  recipe-maintainers:
    - chrisguidry
    - zzstoatzz
