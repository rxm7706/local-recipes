# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.15"

package:
  name: pdfreader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdfreader/pdfreader-${{ version }}.tar.gz
  sha256: 2ee1252cc5f21a2f8cadb458decd85c1313271abb5bac1e4363a3e0e17e2dd87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bitarray >=1.1.0
    - pillow >=7.1.0
    - pycryptodome >=3.9.9
    - python-dateutil >=2.8.1

tests:
  - python:
      imports:
        - pdfreader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/maxpmaxp/pdfreader
  license: MIT
  license_file: LICENSE
  summary: Pythonic API for parsing PDF files
  description: |
    Pythonic API for parsing PDF files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pdfreader
  cfe-upstream-registry: pypi
  cfe-upstream-name: pdfreader
  cfe-purls:
    - pkg:conda/pdfreader@${{ version }}?channel=conda-forge
    - pkg:pypi/pdfreader@${{ version }}
  cfe-upstream-repo: http://github.com/maxpmaxp/pdfreader
  cfe-upstream-homepage: http://github.com/maxpmaxp/pdfreader
  cfe-import-names: [pdfreader]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
