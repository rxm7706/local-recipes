# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: flask-injector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Injector/Flask-Injector-${{ version }}.tar.gz
  sha256: 567c69da7657b96565db990bb7c87cc0acf04e383714341954902f1ef85c5875

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - injector
    - typing

tests:
  - python:
      imports:
        - flask_injector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alecthomas/flask_injector
  license: MIT
  license_file: LICENSE
  summary: Adds Injector, a Dependency Injection framework, support to Flask.
  description: |
    Adds Injector, a Dependency Injection framework, support to Flask.

extra:
  recipe-maintainers:
    - fuglede

#### CFE metadata AND comments
