# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: types-tqdm
  python_min: "3.10"
  version: "4.70.0.20260805"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 569efd0fd8b2a460e6e6548634ec253c1362ed8907f8b0daacf0a07eab204a26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-requests

tests:
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - pip check
      - if: unix
        then: test -f $SP_DIR/tqdm-stubs/__init__.pyi
      - if: win
        then: if not exist %SP_DIR%\\tqdm-stubs\\__init__.pyi exit 1

about:
  summary: Typing stubs for tqdm
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed/tree/main/stubs/tqdm
  documentation: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - sobolevn
    - Ubadub
