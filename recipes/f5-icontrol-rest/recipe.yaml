# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.13"

package:
  name: f5-icontrol-rest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/f5-icontrol-rest/f5-icontrol-rest-${{ version }}.tar.gz
  sha256: 49fffd999fb4971d6754beb0e066051175db9d9baeb8a76fca6c801dacc89359

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - icontrol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/F5Networks/f5-icontrol-rest-python
  license: Apache-2.0
  license_file: LICENSE
  summary: F5 BIG-IP iControl REST API client
  description: |
    F5 BIG-IP iControl REST API client

extra:
  recipe-maintainers:
    - rxm7706

