# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: anisble
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anisble/anisble-${{ version }}.tar.gz
  sha256: adda31154ea9206a6d864a14cf4374a94f0448b5a685d02a429cc740704a7de2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - anisble
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/j00bar/anisble
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: You meant to type ansible. You ended up here. I don't want anybody being able to use this to hack you. So I made this.
  description: |
    You meant to type ansible. You ended up here. I don't want anybody being able to use this to hack you. So I made this.

extra:
  recipe-maintainers:
    - rxm7706

