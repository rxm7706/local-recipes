# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.15.0"

recipe:
  name: beautifulsoup4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/beautifulsoup4/beautifulsoup4-${{ version }}.tar.gz
  sha256: 288e3ca7d54b06f2ac191970bc275c1939cb46d450b255bf6718b04aa37ab4f7

build:
  number: 0

outputs:
  - package:
      name: beautifulsoup4
    build:
      noarch: python
      script:
        file: ${{ 'build_base.sh' if not win else 'build_base.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
      host:
        - python ${{ python_min }}
        - hatchling
        - pip
      run:
        - python >=${{ python_min }}
        - soupsieve >=1.2
        - typing-extensions
    tests:
      - python:
          imports:
            - bs4
            - bs4.builder
          pip_check: true
  - package:
      name: bs4
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('beautifulsoup4', upper_bound="x.x.x") }}
    tests:
      - python:
          imports:
            - bs4
          pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Python library designed for screen-scraping
  description: |
    Beautiful Soup is a library for pulling data out of HTML and XML files.
    It provides ways of navigating, searching, and modifying parse trees.
  homepage: http://www.crummy.com/software/BeautifulSoup/
  repository: https://code.launchpad.net/beautifulsoup
  documentation: http://beautiful-soup-4.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - jschueller
    - nehaljwani
