# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.3"

package:
  name: autoflake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autoflake/autoflake-${{ version }}.tar.gz
  sha256: c24809541e23999f7a7b0d2faadf15deb0bc04cdde49728a2fd943a0c8055504

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pyflakes >=3.0.0
    - tomli >=2.0.1

tests:
  - python:
      imports:
        - autoflake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.github.com/PyCQA/autoflake
  license: MIT
  license_file: LICENSE
  summary: Removes unused imports and unused variables
  description: |
    Removes unused imports and unused variables

extra:
  recipe-maintainers:
    - pmgrafe
    - asford

#### CFE metadata AND comments
