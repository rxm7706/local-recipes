# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: autoflake
  version: "2.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c24809541e23999f7a7b0d2faadf15deb0bc04cdde49728a2fd943a0c8055504

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - autoflake = autoflake:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling
  run:
    - pyflakes >=3.0.0
    - python >=${{ python_min }}
    - tomli >=2.0.1  # remove when python <=3.10 is no longer supported

tests:
  - python:
      imports:
        - autoflake
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - autoflake --help

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Removes unused imports and unused variables
  homepage: https://github.com/myint/autoflake

extra:
  recipe-maintainers:
    - pmgrafe
    - asford
