# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robotframework-requests
  version: "0.8.0"
  sha256: 9c49eac2bb5bcf20224d099863dbd6fbc217f8c2519e3ffd4dd06f4d4813302b

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=2.7
  run:
    - python >=2.7
    - requests
    - requests_ntlm
    - robotframework

tests:
  - python:
      imports:
        - RequestsLibrary
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.md
  summary: RequestsLibrary is a Robot Framework test library that uses the Requests HTTP client.
  homepage: https://github.com/MarketSquare/robotframework-requests

extra:
  recipe-maintainers:
    - daniel88ferreira
