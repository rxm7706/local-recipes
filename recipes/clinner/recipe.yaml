# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.3"

package:
  name: clinner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clinner/clinner-${{ version }}.tar.gz
  sha256: c31c17ccf4997f10cc871d48f27bedd903b4e826198ebb232ccd7a9a6a49facc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorlog

tests:
  - python:
      imports:
        - clinner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PeRDy/clinner
  license: GPL-3.0+
  license_file: LICENSE
  summary: Command Line Interface builder that helps creating an entry point for your application.
  description: |
    Command Line Interface builder that helps creating an entry point for your application.

extra:
  recipe-maintainers:
    - rxm7706

