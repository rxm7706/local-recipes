# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: pytest-aioresponses
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-aioresponses/pytest_aioresponses-${{ version }}.tar.gz
  sha256: 5677b32dfa1a36908b347524b5867aab35ac1c5ce1d4970244d6f66009bca7b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - pytest >=3.5.0
    - aioresponses <0.8.0,>=0.7.1

tests:
  - python:
      imports:
        - pytest_aioresponses
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pheanex/pytest-aioresponses
  license: MIT
  license_file: LICENSE
  summary: py.test integration for aioresponses
  description: |
    py.test integration for aioresponses
  repository: https://github.com/pheanex/pytest-aioresponses

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
