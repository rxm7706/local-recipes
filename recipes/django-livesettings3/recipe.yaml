# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-livesettings3
  version: "1.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 24ab9b23852559639aeb51efe0721c7e8454d039a87576b989bf8438fcc7c4c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=3.2,<6
    - django-keyedcache3

tests:
  - python:
      imports:
        - livesettings
        - livesettings.migrations
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python 3 port of django-livesettings
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/kunaldeo/django-livesettings3/

extra:
  recipe-maintainers:
    - mxr-conda
    - rxm7706
