# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: llama-index-workflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-workflow/llama_index_workflow-${{ version }}.tar.gz
  sha256: 1b5022c55bf77cd8d6d45a07598b5b89a17004a9ab95bfe805e1c68325fe646e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - deprecated >=1.2.18
    - pydantic >=2.10.6
    - wrapt >=1.17.2

tests:
  - python:
      imports:
        - llama_index.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-workflow/
  license: MIT
  license_file: LICENSE
  summary: Lightweight fork of LlamaIndex's workflow module, offering powerful event-driven orchestration without the full llama-index-core dependencies.
  description: |
    Lightweight fork of LlamaIndex's workflow module, offering powerful event-driven orchestration without the full llama-index-core dependencies.
  repository: https://github.com/maltehedderich/llama-index-workflow

extra:
  recipe-maintainers:
    - rxm7706

