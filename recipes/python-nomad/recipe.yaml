# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: python-nomad
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-nomad/python_nomad-${{ version }}.tar.gz
  sha256: 53e6d9ec6f66b672ae9d6d03591a24be2d8b5450dd7fdbe1003831cb9b77f847

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - nomad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jrxfive/python-nomad
  license: MIT
  license_file: LICENSE
  summary: Client library for Hashicorp Nomad
  description: |
    Client library for Hashicorp Nomad

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
