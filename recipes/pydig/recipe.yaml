# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: pydig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydig/pydig-${{ version }}.tar.gz
  sha256: 57c127ab2d2e6afb58d7bab9c9592c074cb5ccc0d2e5c0817e344ac6e140333a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pydig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/leonsmith/pydig
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Python wrapper library for the 'dig' command line tool
  description: |
    Python wrapper library for the 'dig' command line tool
  repository: https://github.com/leonsmith/pydig

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydig
  cfe-upstream-registry: pypi
  cfe-upstream-name: pydig
  cfe-purls:
    - pkg:conda/pydig@${{ version }}?channel=conda-forge
    - pkg:pypi/pydig@${{ version }}
  cfe-upstream-repo: https://github.com/leonsmith/pydig
  cfe-upstream-homepage: https://github.com/leonsmith/pydig
  cfe-import-names: [pydig]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
