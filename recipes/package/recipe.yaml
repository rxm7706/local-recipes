# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: package
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/package/package-${{ version }}.tar.gz
  sha256: 01eee19a56a936bd63222f0a3c531fcdba37b5ad1bd833b960d62fb960b4955e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - layout.package
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.pypi.org/pypi/package/
  license: MIT
  license_file: LICENSE
  summary: package is a package to package your package
  description: |
    package is a package to package your package

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: package
  cfe-upstream-registry: pypi
  cfe-upstream-name: package
  cfe-purls:
    - pkg:conda/package@${{ version }}?channel=conda-forge
    - pkg:pypi/package@${{ version }}
  cfe-upstream-repo: http://www.pypi.org/pypi/package/
  cfe-upstream-homepage: http://www.pypi.org/pypi/package/
  cfe-import-names: [layout.package]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T19:30:04Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T19:30:04Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
