# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.4"

package:
  name: subprocess32
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/subprocess32/subprocess32-${{ version }}.tar.gz
  sha256: eb2937c80497978d181efa1b839ec2d9622cf9600a039a79d0e108d1f9aec79d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python3-redirect

tests:
  - python:
      imports:
        - python3_redirect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/python-subprocess32
  license: PSF-2.0
  license_file: LICENSE
  summary: A backport of the subprocess module from Python 3 for use on 2.x.
  description: |
    A backport of the subprocess module from Python 3 for use on 2.x.

extra:
  recipe-maintainers:
    - tacaswell
    - mdboom
    - chrisburr

#### CFE metadata AND comments
