# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

package:
  name: impacket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/impacket/impacket-${{ version }}.tar.gz
  sha256: ed91c802b6beff6546afd2262942bc1a188b4671fb91ec751d46a1d66d28c2cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyasn1 >=0.2.3
    - pyasn1-modules
    - pycryptodomex
    - pyopenssl
    - six
    - ldap3 !=2.5.0,!=2.5.2,!=2.6,>=2.5
    - ldapdomaindump >=0.9.0
    - flask >=1.0
    - charset-normalizer
    - if: win
      then:
        - pyreadline3

tests:
  - python:
      imports:
        - impacket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.coresecurity.com
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Network protocols Constructors and Dissectors
  description: |
    Network protocols Constructors and Dissectors

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
