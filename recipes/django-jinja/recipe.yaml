# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-jinja
  version: "2.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-jinja-${{ version }}.tar.gz
  sha256: 47c06d3271e6b2f27d3596278af517bfe2e19c1eb36ae1c0b1cc302d7f0259af

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2 >=3
    - django >=3.2

tests:
  - python:
      imports:
        - django_jinja
        - django_jinja.builtins
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Jinja2 templating language integrated in Django.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/niwinz/django-jinja

extra:
  recipe-maintainers:
    - mxr-conda
    - Admax18
    - rxm7706
