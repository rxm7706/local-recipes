# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.1"

package:
  name: python-tds
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-tds/python_tds-${{ version }}.tar.gz
  sha256: c97483a9adf1dcab8bee66e83429acc502753f389d134553edd818348b94ced0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/denisenkom/pytds
  license: MIT
  license_file: LICENSE.txt
  summary: Python DBAPI driver for MSSQL using pure Python TDS (Tabular Data Stream) protocol implementation
  description: |
    Python DBAPI driver for MSSQL using pure Python TDS (Tabular Data Stream) protocol implementation

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-tds
  cfe-upstream-registry: pypi
  cfe-upstream-name: python-tds
  cfe-purls:
    - pkg:conda/python-tds@${{ version }}?channel=conda-forge
    - pkg:pypi/python-tds@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/denisenkom/pytds
  cfe-import-names: [pytds]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/python-tds-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T11:55:01Z
