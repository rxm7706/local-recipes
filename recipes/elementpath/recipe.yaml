# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: elementpath
  version: "5.1.4"
  sha256: 3c912a9c41311ac5244c038867670d7c0b0fec0e444813608e5b846dbb3428ac

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - elementpath
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: XPath 1.0/2.0 parsers and selectors for ElementTree
  description: |
    The proposal of this package is to provide XPath 1.0, 2.0 and 3.0
    selectors for ElementTree XML data structures, both for the standard
    ElementTree library and for the lxml.etree library.

    For lxml.etree this package can be useful for providing XPath 2.0/3.0
    selectors, because lxml.etree already has it's own implementation of
    XPath 1.0.

  homepage: https://github.com/sissaschool/elementpath
  repository: https://github.com/sissaschool/elementpath

extra:
  recipe-maintainers:
    - ccwang002
