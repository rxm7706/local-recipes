# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.0"

package:
  name: geopy
  version: ${{ version }}

source:
  url: https://github.com/geopy/geopy/archive/${{ version }}.tar.gz
  sha256: b4c5adc5189e792ec8d286f370d1328c7ec5532ba1b01f68999ed00db0138dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - geographiclib >=1.52

tests:
  - python:
      imports:
        - geopy
        - geopy.geocoders
        - geopy.extra
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Python Geocoding Toolbox.
  homepage: https://github.com/geopy/geopy

extra:
  recipe-maintainers:
    - ocefpaf
    - pmlandwehr
