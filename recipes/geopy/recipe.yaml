# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.0"

package:
  name: geopy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geopy/geopy-${{ version }}.tar.gz
  sha256: 7b6c849f18108dcce4faa3d614e2801107b465f7b05fd3c1db9db12e225ae950

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - geographiclib <3,>=1.52

tests:
  - python:
      imports:
        - geopy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/geopy/geopy
  license: MIT
  license_file: LICENSE
  summary: Python Geocoding Toolbox
  description: |
    Python Geocoding Toolbox
  repository: https://github.com/geopy/geopy
  documentation: https://geopy.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
    - pmlandwehr

#### CFE metadata AND comments
