# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: mkdocs-awesome-nav
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mkdocs-awesome-nav/mkdocs_awesome_nav-${{ version }}.tar.gz
  sha256: 330edf4129995a7be8a9751edd8739d312fddf591c6cbd95ec80f12f4bfe8578

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - mkdocs >=1.6.0
    - natsort >=8.1.0
    - pydantic >=2.0.2
    - wcmatch >=8.4

tests:
  - python:
      imports:
        - mkdocs_awesome_nav
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mkdocs-awesome-nav/
  license: MIT
  license_file: LICENSE
  summary: A plugin for customizing the navigation structure of your MkDocs site.
  description: |
    A plugin for customizing the navigation structure of your MkDocs site.
  repository: https://github.com/lukasgeiter/mkdocs-awesome-nav/

extra:
  recipe-maintainers:
    - rxm7706

