# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mouseinfo
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/MouseInfo-${{ version }}.tar.gz
  sha256: 2c62fb8885062b8e520a3cce0a297c657adcc08c60952eb05bc8256ef6f7f6e7

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - rubicon-objc
    - python-xlib
    - pyperclip
    - pillow >=4.0.0

tests:
  - python:
      imports:
        - if: not linux
          then: mouseinfo
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - if: linux
        then: xvfb-run --auto-servernum python -c "import mouseinfo"  &

about:
  summary: An application to display XY position and RGB color information for the pixel currently under the mouse.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE.txt
  homepage: https://github.com/asweigart/mouseinfo

extra:
  recipe-maintainers:
    - thewchan
