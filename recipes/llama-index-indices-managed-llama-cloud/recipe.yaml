# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.1"

package:
  name: llama-index-indices-managed-llama-cloud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-indices-managed-llama-cloud/llama_index_indices_managed_llama_cloud-${{ version }}.tar.gz
  sha256: 2cd1621617c14acbc1a4805fd5e606a1178de251f7e93d05411c68163953b86e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-cloud <2,>=1.6.0
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.indices.managed.llama_cloud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-indices-managed-llama-cloud/
  license: MIT
  license_file: LICENSE
  summary: llama-index indices llama-cloud integration
  description: |
    llama-index indices llama-cloud integration

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen

