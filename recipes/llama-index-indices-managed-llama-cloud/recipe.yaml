# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: llama-index-indices-managed-llama-cloud
  version: "0.11.1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_indices_managed_llama_cloud-${{ version }}.tar.gz
  sha256: 2cd1621617c14acbc1a4805fd5e606a1178de251f7e93d05411c68163953b86e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - pip
  run:
    - deprecated ==1.2.18
    - llama-cloud >=1.6.0,<2
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.13.0,<0.15
    - llamaindex-py-client >=0.1.19,<0.2.0

tests:
  - python:
      imports:
        - llama_index.indices.managed.llama_cloud
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: llama-index indices llama-cloud integration
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/indices/llama-index-indices-managed-llama-cloud

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
