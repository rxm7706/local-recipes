# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.7"

package:
  name: decorators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/decorators/decorators-${{ version }}.tar.gz
  sha256: 9cf26202d6170a5cdca8a9cf6cd4b467c10601d4a9076470bceb9d282a5fa28a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - decorators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jaymon/decorators
  license: MIT
  license_file: LICENSE
  summary: Quickly create flexible Python decorators
  description: |
    Quickly create flexible Python decorators

extra:
  recipe-maintainers:
    - rxm7706

