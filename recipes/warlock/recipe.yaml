# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: warlock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/warlock/warlock-${{ version }}.tar.gz
  sha256: 82319ba017341e7fcdc81efc2be9dd2f8237a0da07c71476b5425651b317b1c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ~=3.2
  run:
    - python >=${{ python_min }}
    - jsonschema ~=4.0
    - jsonpatch ~=1.0

tests:
  - python:
      imports:
        - warlock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/bcwaldon/warlock
  license: Apache-2.0
  license_file: LICENSE
  summary: Python object model built on JSON schema and JSON patch.
  description: |
    Python object model built on JSON schema and JSON patch.
  repository: http://github.com/bcwaldon/warlock

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj

#### CFE metadata AND comments
