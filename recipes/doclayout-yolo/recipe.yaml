# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: doclayout-yolo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/doclayout-yolo/doclayout_yolo-${{ version }}.tar.gz
  sha256: 80311d10bed03cf884c5bfcc624bfe0fdcff6e784ba76799347b0290d79dcb4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.3.0
    - opencv >=4.6.0
    - pillow >=7.1.2
    - pyyaml >=5.3.1
    - requests >=2.23.0
    - scipy >=1.4.1
    - pytorch >=2.0.1
    - torchvision >=0.15.2
    - tqdm >=4.64.0
    - psutil
    - py-cpuinfo
    - thop >=0.1.1
    - pandas >=1.1.4
    - seaborn-base >=0.11.0
    - albumentations >=1.4.11

tests:
  - python:
      imports:
        - doclayout_yolo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/doclayout-yolo/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: "DocLayout-YOLO: an effecient and robust document layout analysis method."
  description: |
    DocLayout-YOLO: an effecient and robust document layout analysis method.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
