# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.11"

package:
  name: calmap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/calmap/calmap-${{ version }}.tar.gz
  sha256: 270ddedd9b470d3aef4328887ed60e1e3d3ac4fc8d3335874663d8d178d5b9bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - numpy
    - pandas

tests:
  - python:
      imports:
        - calmap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MarvinT/calmap
  license: MIT
  license_file: LICENSE
  summary: Calendar heatmaps from Pandas time series data
  description: |
    Calendar heatmaps from Pandas time series data

extra:
  recipe-maintainers:
    - rxm7706

