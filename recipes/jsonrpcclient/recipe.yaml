# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jsonrpcclient
  version: "4.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/explodinglabs/jsonrpcclient/archive/refs/tags/${{ version }}.tar.gz
  sha256: f2343c0f4cacb6c7fd0a824593c08dd58e9adf197d9d932fa20fdfeae68bc54e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - jsonrpc=jsonrpcclient.__main__:main

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonrpcclient
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Send JSON-RPC requests in Python.
  homepage: https://github.com/bcb/jsonrpcclient
  repository: https://github.com/bcb/jsonrpcclient
  documentation: https://jsonrpcclient.readthedocs.io/

extra:
  recipe-maintainers:
    - bcb
    - beenje
