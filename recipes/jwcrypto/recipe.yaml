# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.8"

package:
  name: jwcrypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jwcrypto/jwcrypto-${{ version }}.tar.gz
  sha256: c3d7114b6f6e65b52f6b7da817eb8cb8423e1da31e1ef13508447c81ecbdcc34

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cryptography >=39.0.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - jwcrypto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/latchset/jwcrypto
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Implementation of JOSE Web standards
  description: |
    Implementation of JOSE Web standards

extra:
  recipe-maintainers:
    - aymondebroglie
    - scopatz
    - jan-janssen

#### CFE metadata AND comments
