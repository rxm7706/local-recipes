# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: lightdsa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightdsa/lightdsa-${{ version }}.tar.gz
  sha256: d4544278fba1e220ad250dbe06c6cb0b4f2bf4430127ccc3080b4ebf353e2b6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lightecc
    - sympy
    - tqdm

tests:
  - python:
      imports:
        - lightdsa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/serengil/LightDSA
  license: MIT
  license_file: LICENSE
  summary: A Lightweight Digital Signature Algorithm Library for Python
  description: |
    A Lightweight Digital Signature Algorithm Library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lightdsa
  cfe-upstream-registry: pypi
  cfe-upstream-name: lightdsa
  cfe-purls:
