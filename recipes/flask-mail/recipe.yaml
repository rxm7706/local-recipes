# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flask-mail
  version: "0.10.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flask_mail-${{ version }}.tar.gz
  sha256: 44083e7b02bbcce792209c06252f8569dd5a325a7aaa76afe7330422bd97881d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask
    - blinker

tests:
  - python:
      imports:
        - flask_mail
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Flask extension for sending email
  homepage: https://pythonhosted.org/Flask-Mail/
  repository: https://github.com/mattupstate/flask-mail
  documentation: https://pythonhosted.org/Flask-Mail/

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors
