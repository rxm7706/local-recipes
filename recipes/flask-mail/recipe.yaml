# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: flask-mail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Mail/flask_mail-${{ version }}.tar.gz
  sha256: 44083e7b02bbcce792209c06252f8569dd5a325a7aaa76afe7330422bd97881d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask
    - blinker

tests:
  - python:
      imports:
        - flask_mail
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-Mail/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Flask extension for sending email
  description: |
    Flask extension for sending email
  repository: https://github.com/pallets-eco/flask-mail/
  documentation: https://flask-mail.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
