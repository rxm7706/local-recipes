# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: structlog-gcp
  version: "0.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/structlog_gcp-${{ version }}.tar.gz
  sha256: 44a9b13f237a2de52df7b2fd4bd20cf0e71cf84888cbab6d07ffed9fcc22c157

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - structlog

tests:
  - python:
      imports:
        - structlog_gcp
      python_version: ${{ python_min }}.*
      pip_check: true
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: A structlog set of processors to output as Google Cloud Logging format
  license: MIT
  license_file: LICENSE
  repository: https://github.com/multani/structlog-gcp
  homepage: https://github.com/multani/structlog-gcp
  documentation: https://github.com/multani/structlog-gcp/blob/main/README.md

extra:
  recipe-maintainers:
    - rxm7706

