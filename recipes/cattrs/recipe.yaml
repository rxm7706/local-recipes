# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: cattrs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cattrs/cattrs-${{ version }}.tar.gz
  sha256: fa239e0f0ec0715ba34852ce813986dfed1e12117e209b816ab87401271cdd40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - bench
    - attrs >=25.4.0
    - exceptiongroup >=1.1.1
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - bench
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://catt.rs
  license: MIT
  license_file: LICENSE
  summary: Composable complex class support for attrs and dataclasses.
  description: |
    Composable complex class support for attrs and dataclasses.
  repository: https://github.com/python-attrs/cattrs
  documentation: https://catt.rs/en/stable/

extra:
  recipe-maintainers:
    - aldanor
    - Tinche
    - xylar
    - sugatoray

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cattrs
  cfe-upstream-registry: pypi
  cfe-upstream-name: cattrs
  cfe-purls:
