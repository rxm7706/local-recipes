    - pkg:pypi/cattrs@${{ version }}
  cfe-upstream-repo: https://github.com/python-attrs/cattrs
  cfe-upstream-homepage: https://catt.rs
  cfe-import-names: [bench]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
