# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kagglehub
  version: "1.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kagglehub-${{ version }}.tar.gz
  sha256: 08abae0c1e249904003ce6f23c189166e3032220478426a552c77c2edb08b93a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - tqdm
    - packaging
    - pyyaml
    - kagglesdk >=0.1.14,<1.0

tests:
  - python:
      imports:
        - kagglehub
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Access Kaggle resources anywhere
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Kaggle/kagglehub

extra:
  recipe-maintainers:
    - ngam
    - synapticarbors
