# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: kagglehub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kagglehub/kagglehub-${{ version }}.tar.gz
  sha256: 08abae0c1e249904003ce6f23c189166e3032220478426a552c77c2edb08b93a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - kagglesdk <1.0,>=0.1.22
    - packaging
    - pyyaml
    - requests
    - tqdm

tests:
  - python:
      imports:
        - kagglehub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kaggle/kagglehub
  license: Apache-2.0
  license_file: LICENSE
  summary: Access Kaggle resources anywhere
  description: |
    Access Kaggle resources anywhere

extra:
  recipe-maintainers:
    - ngam
    - synapticarbors

