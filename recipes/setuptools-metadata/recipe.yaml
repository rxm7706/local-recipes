# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: setuptools-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-metadata/setuptools-metadata-${{ version }}.tar.gz
  sha256: acc0e33ba6d38ef782e4aaf229cc2f4a793959c6eb11284ec3481697f335a437

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - setuptools_metadata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/j0057/setuptools-metadata
  license: MIT
  license_file: LICENSE
  summary: Adds a command to setup.py for displaying metadata about the package.
  description: |
    Adds a command to setup.py for displaying metadata about the package.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
