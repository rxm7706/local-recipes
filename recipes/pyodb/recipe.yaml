# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: pyodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyodb/pyodb-${{ version }}.tar.gz
  sha256: 724c69a1cf18bf9e9fd31a36816221185f8eb05a17cb47abbf0666b641b0edf7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyodb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NeoSecundus/PyODB
  license: MIT
  license_file: LICENSE
  summary: Python Object DataBase (PyODB) is an ORM library aiming to be as simple to use as possible.
  description: |
    Python Object DataBase (PyODB) is an ORM library aiming to be as simple to use as possible.

extra:
  recipe-maintainers:
    - rxm7706

