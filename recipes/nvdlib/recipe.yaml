# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.3"

package:
  name: nvdlib
  version: ${{ version }}

source:
  url: https://github.com/Vehemont/nvdlib/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c42bdf89c328d6a5fd1eed343b066c88d88db16248d89d53085b6197fdb7f8a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - nvdlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Vehemont/nvdlib/
  license: MIT
  license_file: LICENSE
  summary: National Vulnerability Database CPE/CVE API Library for Python
  description: |
    National Vulnerability Database CPE/CVE API Library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nvdlib
  cfe-upstream-registry: pypi
  cfe-upstream-name: nvdlib
  cfe-purls:
    - pkg:conda/nvdlib@${{ version }}?channel=conda-forge
    - pkg:pypi/nvdlib@${{ version }}
  cfe-upstream-repo: https://github.com/Vehemont/nvdlib/
  cfe-upstream-homepage: https://github.com/Vehemont/nvdlib/
  cfe-import-names: [nvdlib]
