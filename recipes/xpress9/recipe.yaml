# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.8"

package:
  name: xpress9
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xpress9/xpress9-${{ version }}.tar.gz
  sha256: 16eeb65ff0d0d26f13922f5782fea804d2f4cf1cb116494f3e20787dc4d16706

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
    - cython >=0.29.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xpress9
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Hugoberry/xpress9-python
  license: MIT
  license_file: LICENSE
  summary: Python bindings for the Xpress9 compression library
  description: |
    Python bindings for the Xpress9 compression library
  repository: https://github.com/Hugoberry/xpress9-python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: xpress9
  cfe-upstream-registry: pypi
  cfe-upstream-name: xpress9
