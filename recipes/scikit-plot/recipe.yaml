# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.7"

package:
  name: scikit-plot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scikit-plot/scikit-plot-${{ version }}.tar.gz
  sha256: 2c7948817fd2dc06879cfe3c1fdde56a8e71fa5ac626ffbe79f043650baa6242

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - scikit-learn
    - scipy
    - joblib

tests:
  - python:
      imports:
        - scikitplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/reiinakano/scikit-plot
  license: MIT
  license_file: LICENSE
  summary: An intuitive library to add plotting functionality to scikit-learn objects.
  description: |
    An intuitive library to add plotting functionality to scikit-learn objects.

extra:
  recipe-maintainers:
    - ericmjl
    - reiinakano

