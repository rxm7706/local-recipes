# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.62"

package:
  name: python-memcached
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-memcached/python-memcached-${{ version }}.tar.gz
  sha256: 0285470599b7f593fbf3bec084daa1f483221e68c1db2cf1d846a9f7c2655103

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_memcached
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/linsomniac/python-memcached
  license: PSF-2.0
  license_file: LICENSE
  summary: Pure python memcached client
  description: |
    Pure python memcached client

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-memcached
