  cfe-import-names: [python_memcached]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/python-memcached-feedstock
  cfe-forge-recipe-updates-needed: 
