# Header:
#    # Why this package exists (2026-09-26): conda-forge has no PostgreSQL JDBC
#    # driver. conda-forge's `liquibase-postgresql` 5.0.4 is Liquibase's dialect
#    # EXTENSION (liquibase-postgresql-5.0.4.jar, 14 KiB, FSL-1.1-ALv2), not a
#    # driver, and liquibase 5 bundles only h2. The SelfExplainML package named
#    # `liquibase-postgresql` 42.7.13 (recipes/liquibase-postgresql) IS this
#    # driver under a colliding name; pgjdbc is its conda-forge replacement.
#    # Name: upstream project name (github.com/pgjdbc/pgjdbc, "PgJDBC").
# source:
#    # Built from the distro source release on Maven Central
#    # (postgresql-<v>-jdbc-src.tar.gz, Maven pom.xml + LICENSE) -- the same
#    # source Fedora's postgresql-jdbc builds from; the GitHub tag needs pgjdbc's
#    # Gradle build. Maven fetches plugins/deps at build time (build-time
#    # network is allowed on conda-forge; the offline phase is the test), the same
#    # as conda-forge's liquibase and liquibase-postgresql feedstocks.
#    # The jdbc-src pom declares com.ongres.scram:scram-client as a plain
#    # dependency and has no shade step, so a bare build would NOT carry the SCRAM
#    # client (PostgreSQL's default auth since 14). The patch adds maven-shade
#    # relocating com.ongres -> org.postgresql.shaded.com.ongres, matching the
#    # published postgresql-<v>.jar (scram-client/scram-common 3.2,
#    # saslprep/stringprep 2.2).
# build:
#    # Installs to share/liquibase/lib/postgresql.jar (operator decision
#    # 2026-09-26): a drop-in for Liquibase's auto-load directory, the same layout
#    # the SelfExplainML build uses, so the platform env can switch with no code
#    # change. build.bat mirrors build.sh because staged-recipes builds noarch
#    # recipes on the win-64 leg too (G102).
# about:
#    # license: pgjdbc and all four shaded OnGres libraries are BSD-2-Clause;
#    # their LICENSE texts are unpacked from the dependency jars into
#    # third-party-licenses/<artifactId>/META-INF/LICENSE.
# tests:
#    # `java -jar` runs org.postgresql.util.PGJDBCMain (prints the version);
#    # `jar tf` proves the SCRAM client is shaded in; `liquibase --version` lists
#    # the jars it loaded from its lib directory, proving the drop-in works.
#    # Verified 2026-09-26 against upstream's published postgresql-42.7.13.jar:
#    # same 55 shaded org/postgresql/shaded/com/ongres classes, same
#    # java.sql.Driver service. Upstream-only: org.postgresql.osgi.* (OSGi
#    # bundle activator) and org.postgresql.sspi.* (Windows SSPI SSO), which the
#    # jdbc-src release omits (optional osgi/waffle-jna deps); its manifest
#    # carries no Bundle-Activator, so nothing dangles.
