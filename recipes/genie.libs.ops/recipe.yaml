schema_version: 1

context:
  version: "26.7"

package:
  name: genie.libs.ops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/genie.libs.ops/genie_libs_ops-26.7-py3-none-any.whl
  sha256: d5a27c14e7aedadd39c1e1dd1a478c337079989d6750d6bcc9c85f88d0ec7b54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - genie.libs.ops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats
  license: Apache-2.0
  license_file: LICENSE
  summary: "Genie libs Ops: Libraries to retrieve operational state of the topology"
  description: |
    Genie libs Ops: Libraries to retrieve operational state of the topology

extra:
  recipe-maintainers:
    - rxm7706

