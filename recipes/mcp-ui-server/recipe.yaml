# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mcp-ui-server
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mcp_ui_server-${{ version }}.tar.gz
  sha256: 5ab8f17b93bf794966af7c35e9a575e4f21a9ba2bab3d316cfc107a15f88a3c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - mcp >=1.0.0
    - pydantic >=2.0.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - mcp_ui_server
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Python SDK for creating MCP UI resources on the server side
  description: |
    MCP UI Server is a Python SDK for creating MCP UI resources on the server side,
    enabling rich interactive experiences in MCP applications. It provides tools
    for delivering dynamic UI components directly from your MCP server to be
    rendered by clients.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://mcpui.dev
  repository: https://github.com/MCP-UI-Org/mcp-ui
  documentation: https://mcpui.dev/guide/introduction

extra:
  recipe-maintainers:
    - rxm7706

