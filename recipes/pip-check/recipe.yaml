# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.1"

package:
  name: pip-check
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-check/pip_check-${{ version }}.tar.gz
  sha256: 623c0c0cfd793ef8593adf3d5364c7b9287f82e2937e57e790e4596c038e57b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - packaging
    - terminaltables

tests:
  - python:
      imports:
        - pip_check
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bartTC/pip-check/
  license: MIT
  license_file: LICENSE
  summary: Display installed pip packages and their update status.
  description: |
    Display installed pip packages and their update status.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pip-check
  cfe-upstream-registry: pypi
  cfe-upstream-name: pip-check
  cfe-purls:
    - pkg:conda/pip-check@${{ version }}?channel=conda-forge
    - pkg:pypi/pip-check@${{ version }}
  cfe-upstream-repo: https://github.com/bartTC/pip-check/
  cfe-upstream-homepage: https://github.com/bartTC/pip-check/
  cfe-import-names: [pip_check]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T19:51:55Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T19:51:55Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
