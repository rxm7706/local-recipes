# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.57"

package:
  name: openinference-instrumentation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation/openinference_instrumentation-${{ version }}.tar.gz
  sha256: 2bd00a1f95ebb8a47d11615c1039128101e4abc0e9722cc4331849afdeb248fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-semantic-conventions >=0.1.31
    - opentelemetry-api
    - opentelemetry-sdk
    - wrapt <3,>=1.14.0

tests:
  - python:
      imports:
        - openinference.instrumentation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/openinference-instrumentation
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference instrumentation utilities
  description: |
    OpenInference instrumentation utilities

extra:
  recipe-maintainers:
    - mikeldking
    - anticorrelator
    - RogerHYang
    - michaelschiff
    - axiomofjoy

