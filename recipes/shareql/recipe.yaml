# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: shareql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/shareql/shareql-1.0.0-py3-none-any.whl
  sha256: 565819e3bfa0de9a680526d3c73bf6d371ea61176521cc6bb418fd4b229ab186

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lark

tests:
  - python:
      imports:
        - shareql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/shareql/
  license: MIT
  license_file: LICENSE
  summary: A Python library and CLI for Share Query Language.
  description: |
    A Python library and CLI for Share Query Language.

extra:
  recipe-maintainers:
    - rxm7706

