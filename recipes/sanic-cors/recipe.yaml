# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: sanic-cors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Sanic-Cors/Sanic-Cors-${{ version }}.tar.gz
  sha256: f8d7515da4c8b837871d422c66314c4b5704396a78894b59c50e26aa72a95873

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sanic
    - packaging

tests:
  - python:
      imports:
        - sanic_cors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ashleysommer/sanic-cors
  license: MIT
  license_file: LICENSE
  summary: A Sanic extension adding a decorator for CORS support. Based on flask-cors by Cory Dolphin.
  description: |
    A Sanic extension adding a decorator for CORS support. Based on flask-cors by Cory Dolphin.

extra:
  recipe-maintainers:
    - patricksnape
    - bollwyvl

