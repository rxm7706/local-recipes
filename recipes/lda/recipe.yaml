# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lda
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d8d7c0bc42208902a9e34261b76793a84f59e6c69cfd7ca12ce982cdaf7c3020

build:
  number: 1
  skip: match(python, ">=3.7")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    - pip
    - python
    - numpy
    - pbr
    - setuptools
    - cython
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - pbr

tests:
  - python:
      imports:
        - lda
        - lda.datasets
        - lda.utils
      pip_check: false
  - requirements:
      run:
        - pbr
        - numpy

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: lda implements latent Dirichlet allocation (LDA) using collapsed Gibbs sampling. lda is fast and is tested on Linux, OS X, and Windows.
  homepage: https://lda.readthedocs.io/en/latest/
  repository: https://github.com/ariddell/lda/tree/master
  documentation: https://lda.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mxr-conda
    - mwilson8
    - rluria14
    - benhuff
