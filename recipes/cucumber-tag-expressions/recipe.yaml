# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "11.0.1"

package:
  name: cucumber-tag-expressions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cucumber-tag-expressions/cucumber_tag_expressions-${{ version }}.tar.gz
  sha256: f8304dd16e546517816e62ace6c486575023812f42e8a60526fcec1694016146

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.0,<0.13.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cucumber_tag_expressions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cucumber/tag-expressions
  license: MIT
  license_file: LICENSE
  summary: Provides a tag-expression parser and evaluation logic for cucumber/behave
  description: |
    Provides a tag-expression parser and evaluation logic for cucumber/behave
  repository: https://github.com/cucumber/tag-expressions

extra:
  recipe-maintainers:
    - thewchan

