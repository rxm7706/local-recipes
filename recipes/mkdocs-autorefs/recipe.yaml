# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mkdocs-autorefs
  version: "1.4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d54a284f27a7346b9c38f1f852177940c222da508e66edc816a0fa55fc6da197

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pdm-backend
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - mkdocs >=1.1
    - markdown >=3.3
    - markupsafe >=2.0.1
    - pymdown-extensions
    # - Markdown >=3.3
    # - Markdown >=3.3
    # - Markdown >=3.3
    # - Markdown >=3.3

tests:
  - python:
      imports:
        - mkdocs_autorefs
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests

about:
  summary: Automatically link across pages in MkDocs.
  license: ISC
  license_file: LICENSE
  homepage: https://github.com/mkdocstrings/autorefs

extra:
  recipe-maintainers:
    - bandersen23
