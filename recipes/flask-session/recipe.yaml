# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: flask-session
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Session/flask_session-${{ version }}.tar.gz
  sha256: 20e045eb01103694e70be4a49f3a80dbb1b57296a22dc6f44bbf3f83ef0742ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask >=2.2
    - msgspec >=0.18.6
    - cachelib

tests:
  - python:
      imports:
        - flask_session
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-Session/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Server-side session support for Flask
  description: |
    Server-side session support for Flask
  repository: https://github.com/pallets-eco/flask-session/
  documentation: https://flask-session.readthedocs.io

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-session
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-session
  cfe-purls:
    - pkg:conda/flask-session@${{ version }}?channel=conda-forge
    - pkg:pypi/flask-session@${{ version }}
  cfe-upstream-repo: https://github.com/pallets-eco/flask-session/
  cfe-upstream-homepage: https://pypi.org/project/Flask-Session/
  cfe-import-names: [flask_session]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-session-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.8.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

