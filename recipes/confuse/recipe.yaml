# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: confuse
  version: "2.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8e7600c3261852122eb5f17b24b06ab8e5437b21d6224853c1420c38ac469d3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=2,<4
    - poetry-core >=2.1
    - poethepoet >=0.32
  run:
    - python >=${{ python_min }}
    - pyyaml
    - typing_extensions

tests:
  - python:
      imports:
        - confuse
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: painless YAML configuration
  description: |
    Confuse is a configuration library for Python that uses YAML.
    It takes care of defaults, overrides, type checking, command-line
    integration, human-readable errors, and standard OS-specific locations.
  homepage: https://github.com/beetbox/confuse
  repository: https://github.com/beetbox/confuse
  documentation: http://confuse.readthedocs.org/

extra:
  recipe-maintainers:
    - philip-khor
