# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: concurrent-log-handler
  version: "0.9.29"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: bc37a76d3f384cbf4a98f693ebd770543edc0f4cd5c6ab6bc70e9e1d7d582265

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling
  run:
    # Add minimum run constraint since in py2 there is an upper bound on portalocker
    - python >=${{ python_min }}
    - portalocker >=2.6.0

tests:
  - python:
      imports:
        - concurrent_log_handler
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: RotatingFileHandler replacement with concurrency, gzip and Windows support
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Preston-Landers/concurrent-log-handler

extra:
  recipe-maintainers:
    - mariusvniekerk
