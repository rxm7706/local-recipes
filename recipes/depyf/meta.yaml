{% set name = "depyf" %}
{% set version = "0.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/depyf-{{ version }}.tar.gz
  sha256: fb7683bd72c44f67b56029df2c47721e9a02ffa4d7b19095f1c54c4ebf797a98

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - astor
    - dill

test:
  imports:
    - depyf
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/thuml/depyf
  summary: Decompile python functions, from bytecode to source code!
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - maresb
