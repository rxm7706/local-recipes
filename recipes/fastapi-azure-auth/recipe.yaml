# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastapi-azure-auth
  version: "5.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 096934a99110509f47f55d59c2b8bfa3d9ee496bb341abc27eaae801afa9570f

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - cryptography >=48.0.1
    - fastapi >=0.111.1
    - hatchling
    - httpx2 >=2.0.0
    - pip
    - pyjwt >=2.8.0
    - python
  run:
    - cryptography >=48.0.1
    - fastapi >=0.111.1
    - httpx2 >=2.0.0
    - pyjwt >=2.8.0
    - python

tests:
  - python:
      imports:
        - fastapi_azure_auth
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Easy and secure implementation of Azure AD for your FastAPI APIs
  homepage: https://github.com/intility/fastapi-azure-auth
  repository: https://github.com/intility/fastapi-azure-auth
  documentation: https://github.com/intility/fastapi-azure-auth

extra:
  recipe-maintainers:
    - rars
