# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tree
  version: "2.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: http://oldmanprogrammer.net/tar/tree/${{ name }}-${{ version }}.tgz
  sha256: 6b941dd6cbecfb4d3250700e4d08d8e0c251488981dd4868b90d744234300e21

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make

tests:
  - script:
      - test -f ${PREFIX}/bin/tree
      - tree --version

about:
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Tree is a recursive directory listing command
  description: |
    "Tree is a recursive directory listing command that produces a depth
    indented listing of files, which is colorized ala dircolors if the
    LS_COLORS environment variable is set and output is to tty. Tree has been
    ported and reported to work under the following operating systems: Linux,
    FreeBSD, OS X, Solaris, HP/UX, Cygwin, HP Nonstop and OS/2."
  homepage: http://oldmanprogrammer.net/source.php?dir=projects/tree
  repository: https://gitlab.com/OldManProgrammer/unix-tree
  documentation: http://oldmanprogrammer.net/source.php?dir=projects/tree

extra:
  recipe-maintainers:
    - moorepants
