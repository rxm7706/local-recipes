# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0.6"

package:
  name: cpp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cpp/cpp-${{ version }}.tar.gz
  sha256: b37e8391f0e0e5b0d81ad16e510bceb8b1516d50c25dd29f3cc4440d12dd2fb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cpp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cpp/
  license: MIT
  license_file: LICENSE
  summary: Primera version de cpp!
  description: |
    Primera version de cpp!

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cpp
  cfe-upstream-registry: pypi
  cfe-upstream-name: cpp
  cfe-purls:
