# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.0"

package:
  name: qdrant-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qdrant-client/qdrant_client-${{ version }}.tar.gz
  sha256: 365395a04b0a26c309b25b7d8b1c99ef2071ec9a2b74bc8a5fd3b7a3642fe963

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - grpcio >=1.41.0
    - httpx >=0.20.0
    - numpy >=1.21
    - portalocker <4.0,>=2.7.0
    - protobuf >=3.20.0
    - pydantic !=2.0.*,!=2.1.*,!=2.2.0,>=1.10.8
    - urllib3 <3,>=1.26.14

tests:
  - python:
      imports:
        - qdrant_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/qdrant/qdrant-client
  license: Apache-2.0
  license_file: LICENSE
  summary: Client library for the Qdrant vector search engine
  description: |
    Client library for the Qdrant vector search engine
  repository: https://github.com/qdrant/qdrant-client

extra:
  recipe-maintainers:
    - moritzwilksch

#### CFE metadata AND comments
