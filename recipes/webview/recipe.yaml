# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: webview
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/webview/webview-${{ version }}.tar.gz
  sha256: fb62502d687074035f888a14c76ca13bcba0dbf1f1d366679954b7586c90f8d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - webview
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zserge/webview
  license: MIT
  license_file: LICENSE
  summary: Python WebView bindings
  description: |
    Python WebView bindings

extra:
  recipe-maintainers:
    - rxm7706

