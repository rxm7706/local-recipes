# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: mondrian
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mondrian/mondrian-${{ version }}.tar.gz
  sha256: 1e976d9c17d3410ad7d887bc2de47aa55b7c4ef43f9a5a83e9bd29a4a33fee62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorama

tests:
  - python:
      imports:
        - mondrian
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://python-mondrian.github.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Mondrian helps you to configure and use python's logging module once and for ever.
  description: |
    Mondrian helps you to configure and use python's logging module once and for ever.

extra:
  recipe-maintainers:
    - rxm7706

