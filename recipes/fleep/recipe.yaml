# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: fleep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fleep/fleep-${{ version }}.tar.gz
  sha256: c8f62b258ee5364d7f6c1ed1f3f278e99020fc3f0a60a24ad1e10846e31d104c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fleep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/floyernick/fleep
  license: MIT
  license_file: LICENSE
  summary: File format determination library
  description: |
    File format determination library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fleep
  cfe-upstream-registry: pypi
  cfe-upstream-name: fleep
  cfe-purls:
