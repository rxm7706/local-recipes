# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: zodbpickle
  version: "4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 79f33cc49a09b28a8b3b40369c14216e8057177eb8c7e898d76afd6b3194cb78

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - setuptools

tests:
  - python:
      imports:
        - zodbpickle
        - zodbpickle.tests
      pip_check: true

about:
  license: PSF-2.0 and ZPL-2.0
  license_file: LICENSE.txt
  summary: Fork of Python 3 pickle module.
  homepage: http://pypi.python.org/pypi/zodbpickle
  repository: https://github.com/zopefoundation/zodbpickle

extra:
  recipe-maintainers:
    - jan-janssen
