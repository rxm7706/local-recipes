# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: domain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/domain/domain-${{ version }}.tar.gz
  sha256: 221ac353139bb915c23d0788d1a46327b782d377ee49beefa28cb7f6c186739a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - domain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/domain/
  license: MIT
  license_file: LICENSE
  summary: Python client for the Domain property API
  description: |
    Python client for the Domain property API

extra:
  recipe-maintainers:
    - rxm7706

