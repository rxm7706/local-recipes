# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: aiobreaker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiobreaker/aiobreaker-${{ version }}.tar.gz
  sha256: 217a9cfa12e520bb2dd1934bace281d1d7deb8d7630dd183a6295fd22e323ce7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiobreaker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arlyon/aiobreaker
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python implementation of the Circuit Breaker pattern.
  description: |
    Python implementation of the Circuit Breaker pattern.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
