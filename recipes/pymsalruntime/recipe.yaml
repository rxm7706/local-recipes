schema_version: 1

context:
  version: "0.20.6"

package:
  name: pymsalruntime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pymsalruntime/pymsalruntime-0.20.6-cp310-cp310-macosx_15_0_arm64.whl
  sha256: c5b61c4117b8f0f3738527a631434f4a5f0aef0d1a4a362af1c2e90a153323f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymsalruntime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymsalruntime/
  license: MIT
  license_file: LICENSE
  summary: The MSALRuntime Python Interop Package
  description: |
    The MSALRuntime Python Interop Package

extra:
  recipe-maintainers:
    - rxm7706

