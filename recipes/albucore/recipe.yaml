# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.13"

package:
  name: albucore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/albucore/albucore-${{ version }}.tar.gz
  sha256: 0afb83ea8ad73d799370cb45c8c26e739becccbe1cdf3e3fe11594907c2eb622

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numkong >=7.8.0
    - numpy >=1.24.4
    - stringzilla >=5.1.2

tests:
  - python:
      imports:
        - albucore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/albucore/
  license: MIT
  license_file: LICENSE
  summary: High-performance image processing functions for deep learning and computer vision.
  description: |
    High-performance image processing functions for deep learning and computer vision.

extra:
  recipe-maintainers:
    - mukhery
    - mdraw
    - ternaus

