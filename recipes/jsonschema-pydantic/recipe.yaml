# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6"

package:
  name: jsonschema-pydantic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema-pydantic/jsonschema_pydantic-${{ version }}.tar.gz
  sha256: 6069a8929a333a7c7ea8510e9de50f062e747e655e6ba106da5af1981f995270

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pydantic >=1.10.0

tests:
  - python:
      imports:
        - jsonschema_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kreneskyp/jsonschema-pydantic/
  license: MIT
  license_file: LICENSE
  summary: Convert JSON Schemas to Pydantic models
  description: |
    Convert JSON Schemas to Pydantic models

extra:
  recipe-maintainers:
    - rxm7706

