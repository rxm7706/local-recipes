# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.7"
  python_min: "3.12"

package:
  name: aiopath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiopath/aiopath-${{ version }}.tar.gz
  sha256: ad4b9d09ae08ddf6d39dd06e7b0a353939e89528da571c0cd4f3fe071aefad4f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiofile <4,>=3.8.8
    - anyio <5,>=4.0.0
    - typing_extensions >=3.10.0.0

tests:
  - python:
      imports:
        - aiopath
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AlexDeLorenzo
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: 📁 Async pathlib for Python
  description: |
    📁 Async pathlib for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aiopath
  cfe-upstream-registry: pypi
  cfe-upstream-name: aiopath
