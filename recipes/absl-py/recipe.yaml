# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.0"

package:
  name: absl-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/absl-py/absl_py-${{ version }}.tar.gz
  sha256: 0c996f25c0490700fadabe6351630f6111534fa0ae252cc6d2014ea3b141135f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - absl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/absl-py/
  license: Apache-2.0
  license_file: LICENSE
  summary: "Abseil Python Common Libraries, see https://github.com/abseil/abseil-py."
  description: |
    Abseil Python Common Libraries, see https://github.com/abseil/abseil-py.
  repository: https://github.com/abseil/abseil-py
  documentation: https://abseil.io/docs/python/

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
