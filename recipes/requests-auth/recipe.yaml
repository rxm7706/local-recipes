# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.0"

package:
  name: requests-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-auth/requests_auth-${{ version }}.tar.gz
  sha256: ca2f2126d8a41e1d1615faa8cf8d5d62ea01d705f9ee99f470b9a44abd5dee82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - requests ==2.*

tests:
  - python:
      imports:
        - requests_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/requests-auth/
  license: MIT
  license_file: LICENSE
  summary: Authentication for Requests
  description: |
    Authentication for Requests
  documentation: https://colin-b.github.io/requests_auth/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: requests-auth
