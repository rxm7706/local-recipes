# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.5"

package:
  name: pyoracle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyOracle/PyOracle-${{ version }}.tar.gz
  sha256: 2a7d4b0afa906a887fecf8123da49d076470cce02db3a99bfad968c1f465729b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - Resources
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.gregsurges.com/
  license: MIT
  license_file: LICENSE
  summary: PyOracle - Audio Oracle and Factor Oracle Analysis in Python
  description: |
    PyOracle - Audio Oracle and Factor Oracle Analysis in Python

extra:
  recipe-maintainers:
    - rxm7706

