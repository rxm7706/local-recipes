# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: jedi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jedi/jedi-${{ version }}.tar.gz
  sha256: c3f4ccbd276696f4b19c54618d4fb18f9fc24b0aef02acf704b23f487daa1011

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - parso <0.9.0,>=0.8.6

tests:
  - python:
      imports:
        - jedi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidhalter/jedi
  license: MIT
  license_file: LICENSE.txt
  summary: An autocompletion tool for Python that can be used for text editors.
  description: |
    An autocompletion tool for Python that can be used for text editors.
  documentation: https://jedi.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - goanpeca
    - asmeurer
    - nehaljwani
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jedi
  cfe-upstream-registry: pypi
  cfe-upstream-name: jedi
