# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.1"

package:
  name: browser-cookie3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/browser-cookie3/browser_cookie3-${{ version }}.tar.gz
  sha256: 6d8d0744bf42a5327c951bdbcf77741db3455b8b4e840e18bab266d598368a12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lz4
    - pycryptodomex
    - if: linux
      then:
        - dbus-python
        - jeepney

tests:
  - python:
      imports:
        - browser_cookie3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/borisbabic/browser_cookie3
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Loads cookies from your browser into a cookiejar object so can download with urllib and other libraries the same content you see in the web browser.
  description: |
    Loads cookies from your browser into a cookiejar object so can download with urllib and other libraries the same content you see in the web browser.

extra:
  recipe-maintainers:
    - rxm7706

