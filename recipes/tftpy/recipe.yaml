# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.7"

package:
  name: tftpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tftpy/tftpy-${{ version }}.tar.gz
  sha256: e8a5aa092dab2e1cbb9b94392036827b808dc37eb6cf1b1ab33c81957b3f5fe2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tftpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/msoulier/tftpy
  license: MIT
  license_file: LICENSE
  summary: A TFTP protocol library for Python
  description: |
    A TFTP protocol library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tftpy
