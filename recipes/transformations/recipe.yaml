# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: transformations
  version: "2022.9.26"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/transformations-${{ version }}.tar.gz
  sha256: 9141233392e768eb224b73059b60f19df748bb69493dfd16db7cac9f6e93a4ba

build:
  number: 3
  skip: match(python, "<3.8")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - numpy
    - pip
    - python
    - setuptools >=18.0
  run:
    - ${{ pin_compatible('numpy') }}
    - python

tests:
  - python:
      imports:
        - transformations
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - pip list

about:
  summary: Homogeneous Transformation Matrices and Quaternions
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://www.cgohlke.com/
  repository: https://github.com/cgohlke/transformations

extra:
  recipe-maintainers:
    - goanpeca
