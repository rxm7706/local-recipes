# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: rest.connector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/r/rest.connector/rest_connector-26.7-py3-none-any.whl
  sha256: 5f0c2c5d9d1bc998fff40109cb5adbc93b3d24a24d2acb48de825aeea07326dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=1.15.1
    - dict2xml
    - f5-icontrol-rest
    - ciscoisesdk <=2.4.2

tests:
  - python:
      imports:
        - rest.connector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/docs/rest-connector/
  license: Apache-2.0
  license_file: LICENSE
  summary: pyATS REST connection package
  description: |
    pyATS REST connection package

extra:
  recipe-maintainers:
    - rxm7706

