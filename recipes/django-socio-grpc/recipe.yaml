# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.0"

package:
  name: django-socio-grpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-socio-grpc/django_socio_grpc-${{ version }}.tar.gz
  sha256: f89264dd11dbcf98f667fc258b8730e9047dafa96f4a79be47e346374204aa76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - djangorestframework
    - grpcio-tools <2.0.0,>=1.50.0
    - lark <2.0.0,>=1.0.0
    - grpcio-health-checking

tests:
  - python:
      imports:
        - django_socio_grpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/django-socio-grpc/
  license: MIT
  license_file: LICENSE
  summary: Fork of django-grpc-framework with more feature maintained by the socio team. Make GRPC with django easy.
  description: |
    Fork of django-grpc-framework with more feature maintained by the socio team. Make GRPC with django easy.

extra:
  recipe-maintainers:
    - rxm7706

