# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.7"

package:
  name: maskpass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/maskpass/maskpass-${{ version }}.tar.gz
  sha256: 73448856147a611cb7c9d98ff417f1e55884419e0864504584e0db9c6a57b60c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pynput

tests:
  - python:
      imports:
        - maskpass
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/FuturisticGoo/maskpass
  license: MIT
  license_file: LICENSE
  summary: getpass alternative with masking, Spyder support and additional features
  description: |
    getpass alternative with masking, Spyder support and additional features

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
