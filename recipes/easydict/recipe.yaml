# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13"

package:
  name: easydict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/easydict/easydict-${{ version }}.tar.gz
  sha256: b1135dedbc41c8010e2bc1f77ec9744c7faa42bce1a1c87416791449d6c87780

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - easydict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/makinacorpus/easydict
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: Access dict values as attributes (works recursively).
  description: |
    Access dict values as attributes (works recursively).

extra:
  recipe-maintainers:
    - zhaofeng-shu33
    - jeongseok-meta

#### CFE metadata AND comments
