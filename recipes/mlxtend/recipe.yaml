# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.0"
  python_min: "3.11"

package:
  name: mlxtend
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mlxtend/mlxtend-${{ version }}.tar.gz
  sha256: 7fd52f1c55ea80036945490ea54c497aa2251ac03cf8e728cde12275d2169bcc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59.0.0
  run:
    - python >=${{ python_min }}
    - scipy >=1.16.3
    - numpy >=2.3.5
    - pandas >=2.3.3
    - scikit-learn >=1.8.0
    - matplotlib-base >=3.10.8
    - joblib >=1.5.2

tests:
  - python:
      imports:
        - mlxtend
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rasbt/mlxtend
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Machine Learning Library Extensions
  description: |
    Machine Learning Library Extensions
  repository: https://github.com/rasbt/mlxtend
  documentation: https://rasbt.github.io/mlxtend

extra:
  recipe-maintainers:
    - rasbt

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mlxtend
  cfe-upstream-registry: pypi
  cfe-upstream-name: mlxtend
  cfe-purls:
    - pkg:conda/mlxtend@${{ version }}?channel=conda-forge
    - pkg:pypi/mlxtend@${{ version }}
  cfe-upstream-repo: https://github.com/rasbt/mlxtend
  cfe-upstream-homepage: https://github.com/rasbt/mlxtend
  cfe-import-names: [mlxtend]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/mlxtend-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.25.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:41:51Z
