# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.1"

package:
  name: async-timeout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/async-timeout/async_timeout-${{ version }}.tar.gz
  sha256: d9321a7a3d5a6a5e187e824d2fa0793ce379a202935782d555d6e9d2735677d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - async_timeout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aio-libs/async-timeout
  license: Apache-2.0
  license_file: LICENSE
  summary: Timeout context manager for asyncio programs
  description: |
    Timeout context manager for asyncio programs

extra:
  recipe-maintainers:
    - sodre
    - carlodri
    - ocefpaf

