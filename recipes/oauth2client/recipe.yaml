# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.3"

package:
  name: oauth2client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oauth2client/oauth2client-${{ version }}.tar.gz
  sha256: d486741e451287f69568a4d26d70d9acd73a2bbfa275746c535b4209891cccc6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httplib2
    - pyasn1
    - pyasn1-modules
    - rsa
    - six

tests:
  - python:
      imports:
        - oauth2client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/google/oauth2client/
  license: Apache-2.0
  license_file: LICENSE
  summary: OAuth 2.0 client library
  description: |
    OAuth 2.0 client library

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
