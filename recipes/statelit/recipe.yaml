# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: statelit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/statelit/statelit-${{ version }}.tar.gz
  sha256: 655c2a8c642b7a19ea78b4876167013c49cbb0f82b76b74498fca52b7e78b7e9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3,<4
  run:
    - python >=${{ python_min }}
    - streamlit
    - pydantic <2

tests:
  - python:
      imports:
        - statelit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dwreeves/statelit
  license: MIT
  license_file: LICENSE
  summary: Easy state management in Streamlit with Pydantic.
  description: |
    Easy state management in Streamlit with Pydantic.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
