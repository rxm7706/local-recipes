# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-pygwalker
  version: "0.0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_pygwalker-${{ version }}.tar.gz
  sha256: f816ec074aeb0a95252cd819221f91374ba8823780255885afd51c8e9cc61274

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - python-build
    - setuptools >=67.7.2
    - setuptools-scm >=7.1
    - wheel >=0.40.0
    - pip
  run:
    - python >=${{ python_min }}
    - django
    - django-handyhelpers >=0.3.10
    - pandas
    - pygwalker

tests:
  - python:
      imports:
        - djangoaddicts.pygwalker
      pip_check: false
      python_version: ${{ python_min }}

about:
  summary: PyGWalker views for Django projects
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/djangoaddicts/django-pygwalker

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
