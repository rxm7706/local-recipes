# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: pynliner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pynliner/pynliner-${{ version }}.tar.gz
  sha256: 83e7dd4d48001bebbe0a648d7089e94e21ffb74c5af2f582c47d8793ffe8628e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pynliner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Python CSS-to-inline-styles conversion tool for HTML using BeautifulSoup and cssutils
  description: |
    Python CSS-to-inline-styles conversion tool for HTML using BeautifulSoup and cssutils

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pynliner
  cfe-upstream-registry: pypi
  cfe-upstream-name: pynliner
