    - pkg:pypi/uipath@${{ version }}
  cfe-upstream-repo: https://github.com/UiPath/uipath-python
  cfe-upstream-homepage: https://uipath.com
  cfe-import-names: [uipath._cli]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
