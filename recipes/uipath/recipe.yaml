# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.14.5"
  python_min: "3.11"

package:
  name: uipath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uipath/uipath-${{ version }}.tar.gz
  sha256: e5f545b693cadaaa9e60d66ce7ce004596f9f271fad05b8cbcd2643b87cc28a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - applicationinsights >=0.11.10
    - click >=8.3.1
    - coverage >=7.8.2
    - graphtty ==0.1.8
    - httpx >=0.28.1
    - mermaid-builder ==0.0.3
    - mockito >=1.5.4
    - pathlib >=1.0.1
    - pydantic-function-models >=0.1.11
    - pyjwt >=2.10.1
    - pysignalr ==1.3.0
    - python-dotenv >=1.0.1
    - python-socketio <6.0.0,>=5.15.0
    - pyyaml <7.0,>=6.0
    - rich >=14.2.0
    - tenacity >=9.0.0
    - truststore >=0.10.1
    - uipath-core <0.6.0,>=0.5.30
    - uipath-platform <0.3.0,>=0.2.14
    - uipath-runtime <0.14.0,>=0.13.1

tests:
  - python:
      imports:
        - uipath._cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uipath.com
  license: MIT
  license_file: LICENSE
  summary: Python SDK and CLI for UiPath Platform, enabling programmatic interaction with automation services, process management, and deployment tools.
  description: |
    Python SDK and CLI for UiPath Platform, enabling programmatic interaction with automation services, process management, and deployment tools.
  repository: https://github.com/UiPath/uipath-python
  documentation: https://uipath.github.io/uipath-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: uipath
  cfe-upstream-registry: pypi
  cfe-upstream-name: uipath
  cfe-purls:
