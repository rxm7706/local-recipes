# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: lint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lint/lint-${{ version }}.tar.gz
  sha256: b3675d89a849da38a32e6cdae07146e551215cf5623a84ac5ef6895052b2b7c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astraw38/lint
  license: MIT
  license_file: LICENSE
  summary: UNKNOWN
  description: |
    UNKNOWN

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lint
  cfe-upstream-registry: pypi
  cfe-upstream-name: lint
  cfe-purls:
    - pkg:conda/lint@${{ version }}?channel=conda-forge
    - pkg:pypi/lint@${{ version }}
  cfe-upstream-repo: https://github.com/astraw38/lint
  cfe-upstream-homepage: https://github.com/astraw38/lint
  cfe-import-names: [lint]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:43:21Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T20:43:21Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
