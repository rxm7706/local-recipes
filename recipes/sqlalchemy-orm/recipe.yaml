# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.10"

package:
  name: sqlalchemy-orm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-orm/sqlalchemy-orm-${{ version }}.tar.gz
  sha256: 7ab46d2a54a429d4fd384df9a37ad639dc87ff93be5205ed649c5ca4dad164bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing-inspect
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_orm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/parob/sqlalchemy-orm
  license: MIT
  license_file: LICENSE
  summary: Data Relation Mapping framework for Python.
  description: |
    Data Relation Mapping framework for Python.

extra:
  recipe-maintainers:
    - rxm7706

