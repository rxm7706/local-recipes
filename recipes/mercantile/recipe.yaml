# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: mercantile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mercantile/mercantile-${{ version }}.tar.gz
  sha256: fa3c6db15daffd58454ac198b31887519a19caccee3f9d63d17ae7ff61b3b56b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mercantile=mercantile.scripts:cli

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - setuptools
    - click >=3.0

tests:
  - python:
      imports:
        - mercantile
        - mercantile.scripts
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - mercantile --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Spherical mercator and XYZ tile utilities
  homepage: https://github.com/sgillies/mercantile

extra:
  recipe-maintainers:
    - ocefpaf
