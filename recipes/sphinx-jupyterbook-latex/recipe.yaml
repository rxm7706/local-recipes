# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: sphinx-jupyterbook-latex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx_jupyterbook_latex/sphinx_jupyterbook_latex-${{ version }}.tar.gz
  sha256: f54c6674c13f1616f9a93443e98b9b5353f9fdda8e39b6ec552ccf0b3e5ffb62

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - flit-core >=3.2,<4
  run:
    - packaging
    - python >=${{ python_min }}
    - sphinx >=5
  run_constraints:
    - myst-nb >=1.0.0

tests:
  - python:
      imports:
        - sphinx_jupyterbook_latex
        - sphinx_jupyterbook_latex.theme
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Latex specific features for jupyter book
  homepage: https://github.com/executablebooks/sphinx-jupyterbook-latex

extra:
  recipe-maintainers:
    - AakashGfude
    - conda-forge/jupyter-book
    - chrisjsewell
    - mmcky
