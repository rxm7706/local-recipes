schema_version: 1

context:
  version: "3.5.0.20260408"

package:
  name: types-python-jose
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-python-jose/types_python_jose-3.5.0.20260408-py3-none-any.whl
  sha256: 968d8a8eac1ff9da249d6335a2bb9f82288d59ba23afe91fcc2662eb9f485e2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-pyasn1

tests:
  - python:
      imports:
        - types_python_jose
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for python-jose
  description: |
    Typing stubs for python-jose
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - rxm7706

