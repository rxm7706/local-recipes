    - pkg:conda/chaostoolkit@${{ version }}?channel=conda-forge
    - pkg:pypi/chaostoolkit@${{ version }}
  cfe-upstream-repo: https://github.com/chaostoolkit/chaostoolkit
  cfe-upstream-homepage: https://chaostoolkit.org/
  cfe-import-names: [chaostoolkit]
