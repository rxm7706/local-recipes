schema_version: 1

context:
  version: "7.34.1.20260816"

package:
  name: types-protobuf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-protobuf/types_protobuf-7.34.1.20260816-py3-none-any.whl
  sha256: 2e3a225b3c21f0022daa34cec155f03858bb9aff9792947b8e71f0e9f1791fdb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_protobuf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for protobuf
  description: |
    Typing stubs for protobuf
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy

