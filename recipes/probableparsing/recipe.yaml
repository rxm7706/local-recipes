# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: probableparsing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/probableparsing/probableparsing-${{ version }}.tar.gz
  sha256: 8114bbf889e1f9456fe35946454c96e42a6ee2673a90d4f1f9c46a406f543767

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - probableparsing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/datamade/probableparsing
  license: MIT
  license_file: LICENSE
  summary: Common methods for propbable parsers
  description: |
    Common methods for propbable parsers

extra:
  recipe-maintainers:
    - wyseguy7

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: probableparsing
  cfe-upstream-registry: pypi
  cfe-upstream-name: probableparsing
