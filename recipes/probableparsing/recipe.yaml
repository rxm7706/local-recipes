    - pkg:pypi/probableparsing@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/datamade/probableparsing
  cfe-import-names: [probableparsing]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/probableparsing-feedstock
  cfe-forge-recipe-updates-needed: 
