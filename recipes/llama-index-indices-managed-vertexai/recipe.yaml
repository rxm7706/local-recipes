# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: llama-index-indices-managed-vertexai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-indices-managed-vertexai/llama_index_indices_managed_vertexai-${{ version }}.tar.gz
  sha256: c72ffab8798fd0fa7158af27d456333252a98f3dea7111166bd20e72f4d9ad35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - google-cloud-aiplatform >=1.53.0
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.indices.managed.vertexai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-indices-managed-vertexai/
  license: MIT
  license_file: LICENSE
  summary: llama-index managed Vertex AI integration
  description: |
    llama-index managed Vertex AI integration

extra:
  recipe-maintainers:
    - rxm7706

