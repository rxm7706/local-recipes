# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.9.1"

package:
  name: rsa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rsa/rsa-${{ version }}.tar.gz
  sha256: e7bdbfdb5497da4c07dfd35530e1a902659db6ff241e39d9953cad06ebd0ae75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pyasn1 >=0.1.3

tests:
  - python:
      imports:
        - rsa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://stuvel.eu/rsa
  license: Apache-2.0
  license_file: LICENSE
  summary: Pure-Python RSA implementation
  description: |
    Pure-Python RSA implementation
  repository: https://github.com/sybrenstuvel/python-rsa

extra:
  recipe-maintainers:
    - pmlandwehr
    - dbast

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rsa
