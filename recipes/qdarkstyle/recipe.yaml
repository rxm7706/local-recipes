    - pkg:pypi/qdarkstyle@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ColinDuquesnoy/QDarkStyleSheet
  cfe-import-names: [qdarkstyle]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/qdarkstyle-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-3.2.3

  cfe-forge-blocker-list:
