# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: qdarkstyle
  version: "3.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/QDarkStyle-${{ version }}.tar.gz
  sha256: 0c0b7f74a6e92121008992b369bab60468157db1c02cd30d64a5e9a3b402f1ae

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - qtpy >=2.0

tests:
  - python:
      imports:
        - qdarkstyle
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.rst
  summary: A dark stylesheet for Qt applications (Qt4, Qt5, PySide, PyQt4, PyQt5, QtPy, PyQtGraph).
  description: |
    Package that provides dark stylesheet for Qt applications
    (Qt4, Qt5, PySide, PyQt4, PyQt5, QtPy, PyQtGraph).
  homepage: https://github.com/ColinDuquesnoy/QDarkStyleSheet
  repository: https://github.com/ColinDuquesnoy/QDarkStyleSheet/

extra:
  recipe-maintainers:
    - ccordoba12
    - dalthviz
    - goanpeca
