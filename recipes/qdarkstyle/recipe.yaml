# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.3"

package:
  name: qdarkstyle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/QDarkStyle/QDarkStyle-${{ version }}.tar.gz
  sha256: 0c0b7f74a6e92121008992b369bab60468157db1c02cd30d64a5e9a3b402f1ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - qtpy >=2

tests:
  - python:
      imports:
        - qdarkstyle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ColinDuquesnoy/QDarkStyleSheet
  license: MIT
  license_file: LICENSE
  summary: The most complete dark/light style sheet for C++/Python and Qt applications
  description: |
    The most complete dark/light style sheet for C++/Python and Qt applications
  documentation: https://qdarkstylesheet.readthedocs.io/en/stable

extra:
  recipe-maintainers:
    - ccordoba12
    - dalthviz
    - goanpeca

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: qdarkstyle
  cfe-upstream-registry: pypi
  cfe-upstream-name: qdarkstyle
