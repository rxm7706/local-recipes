# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: load-dotenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/load-dotenv/load-dotenv-${{ version }}.tar.gz
  sha256: bbe5f40072d4a61eadca66de6c222df5a2d935d6d41b703be1ff75396f635145

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dotenv

tests:
  - python:
      imports:
        - load_dotenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fly/load-dotenv
  license: Apache-2.0
  license_file: LICENSE
  summary: Automatically and implicitly load environment variables from .env file
  description: |
    Automatically and implicitly load environment variables from .env file
  repository: https://github.com/fly/load-dotenv

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
