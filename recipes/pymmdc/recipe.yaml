# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.12"

package:
  name: pymmdc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymmdc/pymmdc-${{ version }}.tar.gz
  sha256: a2fb6565f8bb349c581d061335c079629846773270c418338fd4279b734c03d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - wheel
    - argparse

tests:
  - python:
      imports:
        - mmdc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymmdc/
  license: MIT
  license_file: LICENSE
  summary: Pure Python Mermaid Diagram Converter with robust error handling
  description: |
    Pure Python Mermaid Diagram Converter with robust error handling

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
