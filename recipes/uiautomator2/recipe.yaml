# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.0"

package:
  name: uiautomator2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uiautomator2/uiautomator2-${{ version }}.tar.gz
  sha256: d9640a1cdd4a689d56bf8a83f62c5b7b2fca6dc4905ffda88f96c0365d96650f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - pillow
    - adbutils <3,>=2.11.0
    - click
    - importlib_resources
    - lxml
    - requests
    - retry2 <0.10.0,>=0.9.5

tests:
  - python:
      imports:
        - uiautomator2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openatx/uiautomator2
  license: MIT
  license_file: LICENSE
  summary: uiautomator for android device
  description: |
    uiautomator for android device

extra:
  recipe-maintainers:
    - rxm7706

