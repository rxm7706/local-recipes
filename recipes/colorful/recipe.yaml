# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.8"

package:
  name: colorful
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colorful/colorful-${{ version }}.tar.gz
  sha256: bb16502b198be2f1c42ba3c52c703d5f651d826076817185f0294c1a549a7445

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colorful
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/timofurrer/colorful
  license: MIT
  license_file: LICENSE
  summary: Terminal string styling done right, in Python.
  description: |
    Terminal string styling done right, in Python.

extra:
  recipe-maintainers:
    - vnlitvinov
    - timofurrer

#### CFE metadata AND comments
