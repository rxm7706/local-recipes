# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: pytest-remotedata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-remotedata/pytest_remotedata-${{ version }}.tar.gz
  sha256: ad3eaa2691feecc2071890764d30e06211547577f965e2e4424435c5d887278d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.1
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - pytest >=5.0
    - packaging

tests:
  - python:
      imports:
        - pytest_remotedata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-remotedata
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pytest plugin for controlling remote data access.
  description: |
    Pytest plugin for controlling remote data access.

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytest-remotedata
