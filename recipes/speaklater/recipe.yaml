# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3"

package:
  name: speaklater
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/speaklater/speaklater-${{ version }}.tar.gz
  sha256: 59fea336d0eed38c1f0bf3181ee1222d0ef45f3a9dd34ebe65e6bfffdd6a65a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - speaklater
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mitsuhiko/speaklater
  license: UNKNOWN
  license_file: LICENSE
  summary: implements a lazy string for python useful for use with gettext
  description: |
    implements a lazy string for python useful for use with gettext

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: speaklater
  cfe-upstream-registry: pypi
  cfe-upstream-name: speaklater
  cfe-purls:
    - pkg:conda/speaklater@${{ version }}?channel=conda-forge
    - pkg:pypi/speaklater@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/mitsuhiko/speaklater
  cfe-import-names: [speaklater]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/speaklater-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3

  cfe-forge-blocker-list:
