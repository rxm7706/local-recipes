# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: korean-lunar-calendar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/korean-lunar-calendar/korean_lunar_calendar-${{ version }}.tar.gz
  sha256: be56f27bc0594fdbbdf7bbe00f504a9f929a31e311bd7d9bb93561b645afade7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - korean_lunar_calendar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/usingsky/korean_lunar_calendar_py
  license: MIT
  license_file: LICENSE
  summary: Convert the Korean lunar calendar to/from the Gregorian solar calendar (KARI standard).
  description: |
    Convert the Korean lunar calendar to/from the Gregorian solar calendar (KARI standard).
  repository: https://github.com/usingsky/korean_lunar_calendar_py

extra:
  recipe-maintainers:
    - synapticarbors

