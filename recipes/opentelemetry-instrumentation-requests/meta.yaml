{% set name = "opentelemetry-instrumentation-requests" %}
{% set version = "0.66b1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_requests-{{ version }}.tar.gz
  sha256: 28578f72e68e3a5be3226c618ac9570ed360ef1dd22d5d6e0721c6905a4ccc67

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-util-http ==0.66b1
    # - requests ~=2.0
    # - opentelemetry-test-utils ==0.37b0
