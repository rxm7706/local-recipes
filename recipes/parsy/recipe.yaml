# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2"

package:
  name: parsy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parsy/parsy-${{ version }}.tar.gz
  sha256: e943147644a8cf0d82d1bcb5c5867dd517495254cea3e3eb058b1e421cb7561f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parsy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-parsy/parsy
  license: MIT
  license_file: LICENSE
  summary: Easy-to-use parser combinators, for parsing in pure Python
  description: |
    Easy-to-use parser combinators, for parsing in pure Python

extra:
  recipe-maintainers:
    - cpcloud
    - gforsyth

#### CFE metadata AND comments
