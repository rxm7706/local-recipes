# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "42.4"

package:
  name: pydeephaven
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pydeephaven/pydeephaven-42.4-py3-none-any.whl
  sha256: 37822b4b81af68b1292eecb77102c070c419216062770bde560b39019583b74c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyarrow
    - bitstring
    - grpcio
    - protobuf
    - numpy
    - pandas

tests:
  - python:
      imports:
        - pydeephaven
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deephaven.io/
  license: MIT
  license_file: LICENSE
  summary: The Deephaven Python Client
  description: |
    The Deephaven Python Client

extra:
  recipe-maintainers:
    - rxm7706

