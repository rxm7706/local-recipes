# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: d3graph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/d3graph/d3graph-${{ version }}.tar.gz
  sha256: 300ab4f74069e322c4f8d31b5dad29e0e755fa89d7c533083b1ff3119d8262d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - pandas
    - numpy
    - colourmap
    - networkx >2
    - ismember
    - jinja2
    - packaging
    - markupsafe
    - python-louvain
    - datazets
    - distfit
    - tqdm

tests:
  - python:
      imports:
        - d3graph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://erdogant.github.io/d3graph
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python package to create interactive network based on d3js.
  description: |
    Python package to create interactive network based on d3js.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
