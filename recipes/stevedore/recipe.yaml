# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.9.0"
  python_min: "3.11"

package:
  name: stevedore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stevedore/stevedore-${{ version }}.tar.gz
  sha256: abbd0af7a38a8bbb1d6adea2e35b17609cf004eaac323e88a8d8963640dd2b3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stevedore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/stevedore
  license: Apache-2.0
  license_file: LICENSE
  summary: Manage dynamic plugins for Python applications
  description: |
    Manage dynamic plugins for Python applications
  repository: https://opendev.org/openstack/stevedore

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj

#### CFE metadata AND comments
