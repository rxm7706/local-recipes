# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: stevedore
  version: "5.9.0"
  bundle: tar.gz
  hash: abbd0af7a38a8bbb1d6adea2e35b17609cf004eaac323e88a8d8963640dd2b3c
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools
    - pbr !=2.1.0,>=2.0.0
  run:
    - python >=${{ python_min }}
    - pbr !=2.1.0,>=2.0.0

tests:
  - python:
      imports:
        - stevedore
        - stevedore.named
        - stevedore.driver
        - stevedore.hook
        - stevedore.extension
        - stevedore.enabled
        - stevedore.dispatch
        - stevedore.tests
        - stevedore._cache
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE
  license: Apache-2.0
  summary: Manage dynamic plugins for Python applications
  homepage: http://docs.openstack.org/developer/stevedore/
  repository: https://git.openstack.org/cgit/openstack/stevedore
  documentation: http://docs.openstack.org/developer/stevedore/

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj
