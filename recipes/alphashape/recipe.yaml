# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: alphashape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alphashape/alphashape-${{ version }}.tar.gz
  sha256: 7a27340afc5f8ed301577acec46bb0cf2bada5410045f7289142e735ef6977ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - click-log
    - shapely
    - numpy
    - trimesh
    - networkx
    - rtree
    - scipy

tests:
  - python:
      imports:
        - alphashape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bellockk/alphashape
  license: MIT
  license_file: LICENSE
  summary: Toolbox for generating alpha shapes.
  description: |
    Toolbox for generating alpha shapes.

extra:
  recipe-maintainers:
    - ngodber
    - bellockk

