# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: alphashape
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7a27340afc5f8ed301577acec46bb0cf2bada5410045f7289142e735ef6977ec

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - alphashape=alphashape.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - click >=6.0
    - click-log >=0.3.2
    - python >=${{ python_min }}
    - scipy >=1.0.0
    - shapely >=1.4.0
    - geopandas >=0.6.2
    - numpy >=1.6
    - trimesh >=3.9.8
    - rtree >=0.9.7
    - networkx >=2.5

tests:
  - python:
      imports:
        - alphashape
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - alphashape --help

about:
  license: MIT
  license_file: LICENSE
  summary: Toolbox for generating alpha shapes.
  homepage: https://github.com/bellockk/alphashape
  repository: https://github.com/bellockk
  documentation: https://alphashape.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - ngodber
    - bellockk
