# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.10"

package:
  name: lab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lab/lab-${{ version }}.tar.gz
  sha256: fa97296c4047f966dae4d21bbae6e5ffdbe27597ccf0932921ba1e80dd85d671

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - simplejson
    - txt2tags >=3.6

tests:
  - python:
      imports:
        - lab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aibasel/lab
  license: GPL3+
  license_file: LICENSE
  summary: Benchmark your code
  description: |
    Benchmark your code

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lab
  cfe-upstream-registry: pypi
  cfe-upstream-name: lab
