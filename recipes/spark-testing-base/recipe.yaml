# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: spark-testing-base
  version: "0.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: dba7fa70aef8eae364b563d5eea626e9e97af37cdaf11c9b465aaa291e9611b7

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - findspark
    - pytest
    - pip
  run:
    - python >=${{ python_min }}
    - findspark
    - pytest

tests:
  - python:
      imports:
        - sparktestingbase
        - sparktestingbase.test
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pyspark
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Spark testing for python
  description: Base classes to use when writing tests with Spark
  homepage: https://github.com/holdenk/spark-testing-base
  repository: https://github.com/holdenk/spark-testing-base

extra:
  recipe-maintainers:
    - dbast
