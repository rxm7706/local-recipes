# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8.0"

package:
  name: os-traits
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/os-traits/os_traits-${{ version }}.tar.gz
  sha256: 971e5fe7e580970d1f19ac731d1caecded5b75a700e8b4d87440de251c8c7bdb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=5.7.0
    - setuptools >=64.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pbr >=3.0.0

tests:
  - python:
      imports:
        - os_traits
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/os-traits/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: A library containing standardized trait strings
  description: |
    A library containing standardized trait strings

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: os-traits
  cfe-upstream-registry: pypi
  cfe-upstream-name: os-traits
