    - pkg:pypi/flask-security@${{ version }}
  cfe-upstream-repo: https://github.com/pallets-eco/flask-security
  cfe-upstream-homepage: https://github.com/pallets-eco/flask-security
  cfe-import-names: [flask_security]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-security-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-5.8.2

  cfe-forge-blocker-list: []
