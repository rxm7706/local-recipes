# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.10"
  name: Flask-Security
  version: "5.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: 827199c0a7b8a887cca7c96611d586fa61f4b1957fc2f1fb040746549ef3d918
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core >=3.8,<4
    - pip
    - python 3.10.*
  run:
    - python >=${{ python_min }}
    - flask >=3.1.0
    - flask-login >=0.6.3
    - flask-principal >=0.4.0
    - flask-wtf >=1.1.2
    - email-validator >=2.0.0
    - markupsafe >=2.1.0
    - libpass >=1.9.3
    - wtforms >=3.0.0
    - importlib_resources >=5.10.0

tests:
  - python:
      imports:
        - flask_security
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - setuptools

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Quickly add security features to your Flask application
  homepage: https://github.com/pallets-eco/flask-security
  repository: https://github.com/pallets-eco/flask-security
  documentation: https://flask-security.readthedocs.io

extra:
  recipe-maintainers:
    - nicoddemus
    - williamjamir
