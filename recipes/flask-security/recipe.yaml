# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.8.2"

package:
  name: flask-security
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Security/flask_security-${{ version }}.tar.gz
  sha256: 827199c0a7b8a887cca7c96611d586fa61f4b1957fc2f1fb040746549ef3d918

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<5
  run:
    - python >=${{ python_min }}
    - flask >=3.1.1
    - flask-login >=0.6.3
    - flask-principal >=0.4.0
    - flask-wtf >=1.1.2
    - email-validator >=2.3.0
    - markupsafe >=2.1.0
    - libpass >=1.9.3
    - wtforms >=3.0.0

tests:
  - python:
      imports:
        - flask_security
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pallets-eco/flask-security
  license: MIT
  license_file: LICENSE.txt
  summary: Quickly add security features to your Flask application.
  description: |
    Quickly add security features to your Flask application.
  repository: https://github.com/pallets-eco/flask-security
  documentation: https://flask-security.readthedocs.io

extra:
  recipe-maintainers:
    - nicoddemus
    - williamjamir

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-security
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-security
