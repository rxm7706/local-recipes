# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.15"

package:
  name: pygnmi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygnmi/pygnmi-${{ version }}.tar.gz
  sha256: 9b43d6334ac7ea73c0b8da395306b7618f4630adab96aaa2f28a79b3b52fdf58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio
    - protobuf
    - cryptography
    - dictdiffer

tests:
  - python:
      imports:
        - pygnmi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/akarneliuk/pygnmi
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pure Python gNMI client to manage network functions and collect telemetry.
  description: |
    Pure Python gNMI client to manage network functions and collect telemetry.

extra:
  recipe-maintainers:
    - rxm7706

