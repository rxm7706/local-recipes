# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: deepecho
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepecho/deepecho-${{ version }}.tar.gz
  sha256: 7589d9b1be1a482a879caca7f674acf1195441de0c8ae020dd1c17a726472f86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - pandas >=1.4.0
    - pytorch >=1.9.0
    - tqdm >=4.29

tests:
  - python:
      imports:
        - deepecho
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/deepecho/
  license: BUSL-1.1
  license_file: LICENSE
  summary: Create sequential synthetic data of mixed types using a GAN.
  description: |
    Create sequential synthetic data of mixed types using a GAN.
  repository: https://github.com/sdv-dev/Deepecho/

extra:
  recipe-maintainers:
    - conda-forge/sdv

