# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"
  release: model-files-v1.0

package:
  name: kokoro-onnx-voices
  version: ${{ version }}

source:
  - url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/${{ release }}/voices-v1.0.bin
    sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    file_name: voices-v1.0.bin

build:
  number: 0
  noarch: python
  dynamic_linking:
    # voices-v1.0.bin is a packed numpy archive of speaker embeddings -- data
    # at fixed offsets, not a linkable object. Relocation would corrupt it
    # silently rather than crash.
    binary_relocation: false
  script:
    - if: unix
      then: |
        set -ex
        DEST="${PREFIX}/share/kokoro-onnx"
        mkdir -p "${DEST}"
        cp -a voices-v1.0.bin "${DEST}/"
        cp -a "${RECIPE_DIR}/pyproject.toml" "${RECIPE_DIR}/README.md" "${RECIPE_DIR}/kokoro_onnx_models" .
        ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
  run_constraints:
    - kokoro-onnx >=0.6.0

tests:
  - python:
      imports:
        - kokoro_onnx_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      files:
        - share/kokoro-onnx/voices-v1.0.bin
  - script:
      # Resolution, payload integrity, and the no-model-installed error paths.
      # See test_resolver.py for why this is a file and not inline -c lines.
      - python test_resolver.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - numpy
    files:
      recipe:
        - test_resolver.py

about:
  homepage: https://github.com/thewh1teagle/kokoro-onnx
  repository: https://huggingface.co/hexgrad/Kokoro-82M
  documentation: https://github.com/thewh1teagle/kokoro-onnx#readme
  summary: Kokoro v1.0 TTS voice embeddings, plus the model resolver for kokoro-onnx
  description: |
    The packed Kokoro v1.0 voice embeddings (`voices-v1.0.bin`) that
    `kokoro-onnx` needs at runtime, installed into
    `$CONDA_PREFIX/share/kokoro-onnx/` so an environment is complete from the
    lock alone.

    Voices are shared by every model variant, so they ship once here and the
    weights ship separately:

        kokoro-onnx-models        f32    311 MB
        kokoro-onnx-models-fp16   fp16   169 MB
        kokoro-onnx-models-int8   int8    88 MB

    All three co-install. `kokoro-onnx` takes both paths as constructor
    arguments and reads no environment variable for them, so this package also
    ships the resolver:

        from kokoro_onnx import Kokoro
        from kokoro_onnx_models import get_model_path, get_voices_path

        kokoro = Kokoro(get_model_path(), get_voices_path())
        samples, sample_rate = kokoro.create("Hello world", voice="af_sarah")

    `get_model_path()` picks the highest-precision installed variant;
    `get_model_path("int8")` selects one explicitly.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

