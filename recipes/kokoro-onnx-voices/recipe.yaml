# CFE comments
# Header:
#    # Split out of kokoro-onnx-models when the fp16 and int8 variants were
#    # packaged. Every variant needs the SAME voices-v1.0.bin, so shipping it
#    # from each model package would be a file clobber -- conda refuses to
#    # install two packages owning one path -- and folding the variants into
#    # one package would force a 311 MB f32 download on someone who wanted
#    # int8's 88 MB. One shared voices package, three model packages that
#    # co-install because their filenames differ, is the shape that satisfies
#    # both.
# build:
#    # noarch: python because the resolver is pure Python and the embeddings
#    # are architecture-independent data.
#    # The payload goes to share/kokoro-onnx/, NOT site-packages: the model
#    # packages drop their .onnx files into the same directory, which is what
#    # lets one resolver find all of them.
# requirements:
#    # No dependency on a model package, deliberately. This package is
#    # installable on its own (the resolver plus voices), and get_model_path()
#    # raises a message naming the three model packages if none is present --
#    # tested below. Depending on one would silently pick a variant for the
#    # user, which is the decision this split exists to leave open.
# tests:
#    # The negative tests are the point. Two failure modes are easy to ship by
#    # accident: get_model_path() returning a path to a file that is not there,
#    # and an unknown variant name being reported as "not installed" rather
#    # than as a typo. Both are asserted, along with numpy actually loading the
#    # embeddings -- a contents check alone would pass on a truncated file.
####
