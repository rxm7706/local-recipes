# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.8"

package:
  name: coboljsonifier
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coboljsonifier/coboljsonifier-${{ version }}.tar.gz
  sha256: ebb715af4fad8d093589fc53433a53f59c6e3356a4b85503d56fb0e699aa7f23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - coboljsonifier
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jrperin/cobol-copybook.jsonifier
  license: MIT
  license_file: LICENSE
  summary: Convert cobol copybook to Json and parse data files based on it
  description: |
    Convert cobol copybook to Json and parse data files based on it

extra:
  recipe-maintainers:
    - rxm7706

