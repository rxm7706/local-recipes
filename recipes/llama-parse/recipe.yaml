# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: llama-parse
  version: "0.6.94"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llama_parse-${{ version }}.tar.gz
  sha256: d9e4347ec6caa1e9d5266cc5d4d8b29a29aa0d0948d921a26c73d3e4aaf5ba72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - llama-cloud-services >=0.6.94
    - pydantic !=2.10
    - click >=8.1.7,<9.0.0
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.11.0

tests:
  - python:
      imports:
        - llama_parse
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Parse files into RAG-Optimized formats.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_parse

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
