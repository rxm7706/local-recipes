# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.0"

package:
  name: httpx2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpx2/httpx2-${{ version }}.tar.gz
  sha256: 8741d7329fe2c7885fc9ceb61c8217acfb87a85f75723714b89ebf7ad7196338

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
    - uv-dynamic-versioning >=0.14.0
  run:
    - python >=${{ python_min }}
    - idna >=3.18
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - httpx2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydantic/httpx2
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The next generation HTTP client.
  description: |
    The next generation HTTP client.
  repository: https://github.com/pydantic/httpx2

extra:
  recipe-maintainers:
    - bollwyvl
    - Kludex

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: httpx2
