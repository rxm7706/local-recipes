# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: logging-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logging-config/logging-config-${{ version }}.tar.gz
  sha256: 840a2c807e5580b9da35dbbc2513b2206c9a37c2f4f7ca605b035a3ae88f55c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logging_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gmr/logging-config
  license: MIT
  license_file: LICENSE
  summary: A wrapper class for the Python standard logging module
  description: |
    A wrapper class for the Python standard logging module

extra:
  recipe-maintainers:
    - rxm7706

