# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17"

package:
  name: pypandoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypandoc/pypandoc-${{ version }}.tar.gz
  sha256: 51179abfd6e582a25ed03477541b48836b5bba5a4c3b282a547630793934d799

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - tomli
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypandoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pypandoc/
  license: MIT
  license_file: LICENSE
  summary: Thin wrapper for pandoc.
  description: |
    Thin wrapper for pandoc.
  repository: https://github.com/JessicaTegner/pypandoc

extra:
  recipe-maintainers:
    - jankatins
    - ocefpaf
    - jessicategner

#### CFE metadata AND comments
