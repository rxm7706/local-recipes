# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.4.2"

package:
  name: elastic-transport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/elastic-transport/elastic_transport-${{ version }}.tar.gz
  sha256: 366f4614f4544c5fb5d780c82f57af8f30492b44a68ed20750390aa81e20c2ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 <3,>=2
    - certifi
    - sniffio

tests:
  - python:
      imports:
        - elastic_transport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/elastic/elastic-transport-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Transport classes and utilities shared among Python Elastic client libraries
  description: |
    Transport classes and utilities shared among Python Elastic client libraries
  repository: https://github.com/elastic/elastic-transport-python
  documentation: https://elastic-transport-python.readthedocs.io

extra:
  recipe-maintainers:
    - ezimuel
    - joshmock
    - pquentin
    - miguelgrinberg

