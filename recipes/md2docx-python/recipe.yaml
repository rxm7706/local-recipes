# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: md2docx-python
  version: ${{ version }}

source:
  url: https://github.com/shloktech/md2docx-python/archive/refs/tags/${{ version }}.tar.gz
  sha256: b585ba6b139e2915d33281a37a4c2d0a6ad9b9020fa2852a9eb82aacc13d8b20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - markdown >=3.7
    - python-docx >=1.1.2
    - beautifulsoup4 >=4.13.3

tests:
  - python:
      imports:
        - md2docx_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shloktech/md2docx-python
  license: MIT
  license_file: LICENSE
  summary: Markdown to Word Converter.
  description: |
    Markdown to Word Converter.

extra:
  recipe-maintainers:
    - rxm7706

