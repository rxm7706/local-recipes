# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: markdownify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdownify/markdownify-${{ version }}.tar.gz
  sha256: 1a176f05522c8a2cb1dd3ab9d307dcdadbed5c26ae717855bfc42b3b6d38d937

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 <5,>=4.9
    - six <2,>=1.15

tests:
  - python:
      imports:
        - markdownify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/matthewwithanm/python-markdownify
  license: MIT
  license_file: LICENSE
  summary: Convert HTML to markdown.
  description: |
    Convert HTML to markdown.

extra:
  recipe-maintainers:
    - davidbrochart
    - gscoppino
    - moritzwilksch

#### CFE metadata AND comments
