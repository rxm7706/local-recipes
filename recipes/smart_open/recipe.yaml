# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.1"

package:
  name: smart-open
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/smart-open/smart_open-${{ version }}.tar.gz
  sha256: 18b1c4496003c6902be17c15f032b5c319f307c89c6ae9e6b028b508bed8b2cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - wrapt

tests:
  - python:
      imports:
        - smart_open
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/smart-open/
  license: MIT
  license_file: LICENSE
  summary: Utils for streaming large files (S3, HDFS, GCS, SFTP, Azure Blob Storage, gzip, bz2, zst...)
  description: |
    Utils for streaming large files (S3, HDFS, GCS, SFTP, Azure Blob Storage, gzip, bz2, zst...)
  repository: https://github.com/piskvorky/smart_open

extra:
  recipe-maintainers:
    - timkpaine
    - souravsingh
    - mpenkov
    - bollwyvl

