# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3.0"

package:
  name: prismacloud-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prismacloud-api/prismacloud_api-${{ version }}.tar.gz
  sha256: 68b765d9891759a0c64919a39b0c2aa0600bcc1284f1fed90290fe955aa26988

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - update-checker
    - requests

tests:
  - python:
      imports:
        - prismacloud.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PaloAltoNetworks/prismacloud-api-python
  license: MIT
  license_file: LICENSE
  summary: Prisma Cloud API SDK for Python
  description: |
    Prisma Cloud API SDK for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
