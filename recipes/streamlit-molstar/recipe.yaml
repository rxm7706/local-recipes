# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.21"

package:
  name: streamlit-molstar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-molstar/streamlit-molstar-${{ version }}.tar.gz
  sha256: 65ebbc554e163455685dd96e39ca503e7c2af76bab7a61ccce25e43fae0f1b40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - streamlit_molstar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pragmatic-streamlit/streamlit-molstar
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

