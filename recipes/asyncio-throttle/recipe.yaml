# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: asyncio-throttle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncio-throttle/asyncio-throttle-${{ version }}.tar.gz
  sha256: 2675282e99d9129ecc446f917e174bc205c65e36c602aa18603b4948567fcbd4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncio_throttle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hallazzang/asyncio-throttle
  license: MIT
  license_file: LICENSE
  summary: Simple, easy-to-use throttler for asyncio
  description: |
    Simple, easy-to-use throttler for asyncio

extra:
  recipe-maintainers:
    - pavelzw

