# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robotframework-databaselibrary
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/40/0c/e34201ecb14da3d2d7da172a1da6c0419868c102d4c45e395feaa2b456f0/robotframework_databaselibrary-2.5.0.tar.gz
  sha256: e77c083d2df0861c0358acdcb7d9a2f911921cfcbab0466754247f0bbbfb7d5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=61.0
  - robotframework >=5.0.1
  - robotframework-assertion-engine
  - sqlparse
  - pip
  run:
  - python >=${{ python_min }},<4.0
  - robotframework >=5.0.1
  - robotframework-assertion-engine
  - sqlparse

tests:
- python:
    imports:
    - DatabaseLibrary
    pip_check: true
    python_version: ${{ python_min }}.*

about:
  summary: Database Library for Robot Framework
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://pythonhosted.org/robotframework-databaselibrary/
  homepage: https://github.com/franz-see/Robotframework-Database-Library

extra:
  recipe-maintainers:
  - rxm7706

#### CFE metadata AND comments
