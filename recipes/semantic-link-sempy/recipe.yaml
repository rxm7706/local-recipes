# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.2"

package:
  name: semantic-link-sempy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/semantic-link-sempy/semantic_link_sempy-0.14.2-py3-none-any.whl
  sha256: 03600bb83786da11b873e01f3a5ffd17311a5abba5ab589edc794cab696a1612

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - clr_loader >=0.2.5
    - fabric-analytics-sdk <1.0.0,>=0.0.3
    - fabric-analytics-notebook-plugin <1.0.0,>=0.0.3
    - python-graphviz >=0.20.1
    - azure-storage-blob >=12.18.3
    - azure-core >=1.29.4
    - azure-keyvault-secrets >=4.7.0
    - azure-storage-file-datalake >=12.12.0
    - ipywidgets >=8.0.7
    - pyarrow >=12.0.1
    - pythonnet >=3.0.1
    - scikit-learn <1.8.0,>=1.2.2
    - setuptools >=68.2.2
    - tqdm >=4.65.0
    - rich >=13.3.5
    - regex >=2023.8.8
    - pandas <3.0.0,>=1.5.3
    - pyjwt >=2.4.0
    - pyspark >=3.4.1
    - requests >=2.31.0
    - aiohttp >=3.8.6
    - ipython >=8.14.0
    - tenacity >=8.2.3

tests:
  - python:
      imports:
        - semantic_link_sempy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://learn.microsoft.com/en-us/fabric/data-science/semantic-link-overview
  license: MIT
  license_file: LICENSE
  summary: Semantic link for Microsoft Fabric
  description: |
    Semantic link for Microsoft Fabric

extra:
  recipe-maintainers:
    - rxm7706

