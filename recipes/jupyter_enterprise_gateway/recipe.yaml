# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyter_enterprise_gateway
  version: "3.3.0"
  sha256: 58d61fef0f30d8010553bf3755c7d205c072383849c416916b37d3ef940725b7

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script:
    - python -m pip install --no-deps --ignore-installed .
  python:
    entry_points:
      - jupyter-enterprisegateway = enterprise_gateway:launch_instance

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - docker-py >=3.5.0
    - future
    - jinja2 >=3.1
    - jupyter_client >=6.1.12,<7.0  # Remove cap once EG supports kernel provisioners
    - jupyter_core >=4.7.0
    - jupyter_server >=1.7,<2.0  # Remove cap (increase floor) once EG supports kernel provisioners
    - paramiko >=2.11
    - pexpect >=4.8.0
    - pycryptodomex >=3.9.7
    - python-kubernetes >=18.20.0
    - pyzmq >=20.0,<25.0  # Pyzmq 25 removes deprecated code that jupyter_client 6 uses, remove if v6 gets updated
    - requests >=2.14.2
    - tornado >=6.1,<7.0
    - traitlets >=5.3.0
    - watchdog >=2.1.3
    - yarn-api-client >=1.0

tests:
  - python:
      imports:
        - enterprise_gateway
        - enterprise_gateway.services
        - enterprise_gateway.services.kernels
        - enterprise_gateway.services.processproxies
        - enterprise_gateway.services.sessions
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - jupyter-enterprisegateway --help
      - jupyter enterprisegateway --help

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: A web server for spawning and communicating with remote Jupyter kernels
  description: |
    Jupyter Enterprise Gateway A lightweight, multi-tenant, scalable and secure gateway
    that enables Jupyter Notebooks to share resources across distributed clusters such
    as Apache Spark, Kubernetes and others.
  homepage: https://github.com/jupyter/enterprise_gateway
  repository: https://github.com/jupyter/enterprise_gateway
  documentation: http://jupyter-enterprise-gateway.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - lresende
    - kevin-bates
