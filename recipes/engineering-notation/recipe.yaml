# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.3"
  python_min: "3.11"

package:
  name: engineering-notation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/engineering-notation/engineering_notation-${{ version }}.tar.gz
  sha256: a8cb3dacc0ffc3f756f0ca47f7e20d7b27d87acd5e871a08676967e1286b058d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - engineering_notation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/engineering-notation/
  license: MIT
  license_file: LICENSE
  summary: Easy engineering notation
  description: |
    Easy engineering notation

extra:
  recipe-maintainers:
    - rxm7706

