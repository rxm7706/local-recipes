# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: streamlit-antd-components
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/s/streamlit-antd-components/streamlit_antd_components-0.3.2-py3-none-any.whl
  sha256: 5ae28496127202ed266ea167649436a15f3d548a4805ee5d992c6fc0fe103fd6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_antd_components
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nicedouble/StreamlitAntdComponents
  license: MIT
  license_file: LICENSE
  summary: streamlit customer components of Antd Design and Mantine
  description: |
    streamlit customer components of Antd Design and Mantine

extra:
  recipe-maintainers:
    - rxm7706

