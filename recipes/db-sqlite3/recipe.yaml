# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: db-sqlite3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/db-sqlite3/db-sqlite3-${{ version }}.tar.gz
  sha256: 4dd410aa28a2c5b66de477f9dc62f523133217dd31c7ed7eb085214bea148db9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - db_sqlite3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lgastako/db-sqlite3
  license: MIT
  license_file: LICENSE
  summary: sqlite3 driver for db
  description: |
    sqlite3 driver for db

extra:
  recipe-maintainers:
    - rxm7706

