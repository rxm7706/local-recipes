# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.5"

package:
  name: ggplot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/ggplot/ggplot-${{ version }}.tar.gz
  sha256: 48bbc9ea5987f815ad25856d76573506dbfe153ff696f026ce324582af56469f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ggplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yhat/ggplot/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: ggplot for python
  description: |
    ggplot for python

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ggplot
  cfe-upstream-registry: pypi
  cfe-upstream-name: ggplot
  cfe-purls:
    - pkg:conda/ggplot@${{ version }}?channel=conda-forge
    - pkg:pypi/ggplot@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/yhat/ggplot/
  cfe-import-names: [ggplot]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ggplot-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.11.5

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

