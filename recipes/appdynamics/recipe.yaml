# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.1.9060"

package:
  name: appdynamics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/a/appdynamics/appdynamics-26.7.1.9060-py2.py3-none-any.whl
  sha256: 5c3fbb32fa621ed85568f7ef0474060d2b000ba830b395c936411ed92b5f8d50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - appdynamics-bindeps-linux-x64
        - appdynamics-proxysupport-linux-x64

tests:
  - python:
      imports:
        - appdynamics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.appdynamics.com/python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python Agent for AppDynamics
  description: |
    Python Agent for AppDynamics

extra:
  recipe-maintainers:
    - rxm7706

