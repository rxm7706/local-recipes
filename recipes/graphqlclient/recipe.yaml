# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: graphqlclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphqlclient/graphqlclient-${{ version }}.tar.gz
  sha256: b3305f3df88c04839195754d409a49a2dc3adbcba4ebf9133b5663749e1dd92c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - graphqlclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/prismagraphql/python-graphql-client
  license: MIT
  license_file: LICENSE
  summary: Simple GraphQL client for Python 2.7+
  description: |
    Simple GraphQL client for Python 2.7+

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
