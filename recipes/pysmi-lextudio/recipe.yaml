# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.3"

package:
  name: pysmi-lextudio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysmi-lextudio/pysmi_lextudio-${{ version }}.tar.gz
  sha256: 7d255fb38669410835acf6c2e8ab41975a6d8e64593b119552e36ecba004054f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - ply <4.0,>=3.11
    - jinja2 <4.0.0,>=3.1.3
    - requests <3.0.0,>=2.26.0

tests:
  - python:
      imports:
        - pysmi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lextudio/pysmi
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A pure-Python implementation of SNMP/SMI MIB parsing and conversion library.
  description: |
    A pure-Python implementation of SNMP/SMI MIB parsing and conversion library.
  repository: https://github.com/lextudio/pysmi

extra:
  recipe-maintainers:
    - rxm7706

