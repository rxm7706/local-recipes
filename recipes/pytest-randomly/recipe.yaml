# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.0"

package:
  name: pytest-randomly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-randomly/pytest_randomly-${{ version }}.tar.gz
  sha256: 47f1d9746c3bc3efabd53ae1ebfb8bb385cf3d4df4b505b6d58d9c97a3dfe70f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pytest

tests:
  - python:
      imports:
        - pytest_randomly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-randomly/
  license: MIT
  license_file: LICENSE
  summary: Pytest plugin to randomly order tests and control random.seed.
  description: |
    Pytest plugin to randomly order tests and control random.seed.
  repository: https://github.com/pytest-dev/pytest-randomly

extra:
  recipe-maintainers:
    - cpcloud
    - soapy1

