# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6"

package:
  name: parsedatetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parsedatetime/parsedatetime-${{ version }}.tar.gz
  sha256: 4cb368fbb18a0b7231f4d76119165451c8d2e35951455dfee97c62a87b04d455

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parsedatetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bear/parsedatetime
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Parse human-readable date/time text.
  description: |
    Parse human-readable date/time text.

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: parsedatetime
  cfe-upstream-registry: pypi
  cfe-upstream-name: parsedatetime
  cfe-purls:
    - pkg:conda/parsedatetime@${{ version }}?channel=conda-forge
    - pkg:pypi/parsedatetime@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/bear/parsedatetime
  cfe-import-names: [parsedatetime]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/parsedatetime-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.6

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T02:45:11Z
