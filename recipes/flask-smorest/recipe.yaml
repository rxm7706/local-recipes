# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.47.0"

package:
  name: flask-smorest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-smorest/flask_smorest-${{ version }}.tar.gz
  sha256: a415ce7db3d7e63dd854eb16d59047686dbf5d31c4913e245fa5657f88e7788d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - werkzeug <4,>=3.0.1
    - flask <4,>=3.0.2
    - marshmallow <5,>=3.24.1
    - webargs <9,>=8.0.0
    - apispec <7,>=6.0.0

tests:
  - python:
      imports:
        - flask_smorest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/flask-smorest/
  license: MIT
  license_file: LICENSE
  summary: Flask/Marshmallow-based REST API framework
  description: |
    Flask/Marshmallow-based REST API framework
  repository: https://github.com/marshmallow-code/flask-smorest

extra:
  recipe-maintainers:
    - mcs07
    - jan-janssen

#### CFE metadata AND comments
