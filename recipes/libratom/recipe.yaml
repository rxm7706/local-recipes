# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: libratom
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/libratom/libratom-${{ version }}.tar.gz
  sha256: 06109a764fc6e9655c495322571902eaf0f5ba1f44cfea3881775cb3ad912fae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs
    - beautifulsoup4
    - blessed
    - cython-blis
    - catalogue
    - certifi
    - charset-normalizer
    - click
    - click-log
    - confection
    - cymem
    - enlighten
    - future
    - greenlet
    - humanfriendly
    - idna
    - jinja2
    - jsonschema
    - langcodes
    - libpff-python-ratom
    - markupsafe
    - murmurhash
    - numpy
    - packaging
    - pathy
    - pbr
    - prefixed
    - preshed
    - psutil
    - pydantic
    - pyparsing
    - pyrsistent
    - requests
    - six
    - smart-open
    - soupsieve
    - spacy
    - spacy-legacy
    - spacy-loggers
    - sqlalchemy
    - srsly
    - striprtf
    - tabulate
    - thinc
    - tqdm
    - treelib
    - typer
    - typing_extensions
    - urllib3
    - wasabi
    - wcwidth

tests:
  - python:
      imports:
        - libratom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/libratom/libratom
  license: MIT
  license_file: LICENSE
  summary: Python library and supporting utilities to parse and process PST and mbox email sources
  description: |
    Python library and supporting utilities to parse and process PST and mbox email sources

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: libratom
