# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-storage-queue
  version: "12.17.0"
  sha256: 6eb108a88554be371feb2eba9715fa0e3f7baca7b3f00c19ec417fc7ce5b3834

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.zip

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - typing_extensions >=4.6.0
    - python >=${{ python_min }}
    - azure-core >=1.37.0
    - azure-common >=1.1.5
    - azure-storage-common >=1.3.0
    - cryptography >=2.1.4
    - isodate >=0.6.1
    - msrest
    - typing-extensions >=4.6.0

tests:
  - python:
      imports:
        - azure.storage
        - azure.storage.queue
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: ${{ RECIPE_DIR }}/LICENSE.txt
  summary: Microsoft Azure Storage Queue Client Library for Python
  homepage: https://github.com/Azure/azure-storage-python

extra:
  recipe-maintainers:
    - xhochy
    - awvwgk
    - tvogels
