# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: paragraphs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/paragraphs/paragraphs-${{ version }}.tar.gz
  sha256: ad393f2e99432740f36c115280aa454c53c8048e6a2cda0b81df4effc8043a60

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - paragraphs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/paragraphs/
  license: MIT
  license_file: LICENSE
  summary: Incorporate long strings painlessly, beautifully into Python code.
  description: |
    Incorporate long strings painlessly, beautifully into Python code.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
