# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: deephaven-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-plugin/deephaven_plugin-${{ version }}.tar.gz
  sha256: 1716646c4e534fcda3128043665d2d0fa6000d02fbf89bc31787cf6d6a60394e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=3.6

tests:
  - python:
      imports:
        - deephaven.plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugin
  license: Apache-2.0
  license_file: LICENSE
  summary: Deephaven Plugin interface
  description: |
    Deephaven Plugin interface
  repository: https://github.com/deephaven/deephaven-plugin

extra:
  recipe-maintainers:
    - rxm7706

