# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.0"

package:
  name: pecan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pecan/pecan-${{ version }}.tar.gz
  sha256: 2f9fbcea86e8dbf1a2d28954225547634a289db7201e7764516a5dce86c116de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - webob >=1.8
    - mako >=0.4.0
    - setuptools

tests:
  - python:
      imports:
        - pecan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/pecan/pecan
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A WSGI object-dispatching web framework, designed to be lean and fast, with few dependencies.
  description: |
    A WSGI object-dispatching web framework, designed to be lean and fast, with few dependencies.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
