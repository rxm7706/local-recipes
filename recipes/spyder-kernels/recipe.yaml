# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: spyder-kernels
  python_min: "3.9"
  version: "3.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5996ed30474e7f71815e87d398dbd44abeaa7456ea6756f8191124c10453738e

build:
  number: 0
  string: ${{ 'win_pyh${{ PKG_HASH }}_${{ PKG_BUILDNUM }}' if win else 'unix_pyh${{ PKG_HASH }}_${{ PKG_BUILDNUM }}' if unix else '' }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.9.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cloudpickle
    - ipykernel >=6.29.3,<7.0.0
    - ipython >=8.15.0,<10.0.0,!=8.17.1,!=9.1.0,!=9.2.0,!=9.3.0,!=9.4.0
    - jupyter_client >=7.4.9,<9.0.0
    - if: unix
      then: pyxdg >=0.26
    - pyzmq >=24.0.0
    - traitlets >=5.14.3
    - if: unix
      then: wurlitzer >=1.0.3
    - if: unix
      then: __unix
    - if: win
      then: __win

tests:
  - python:
      imports:
        - spyder_kernels
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Jupyter kernels for Spyder's console
  description: |
    Provides Jupyter kernels for use with the consoles of Spyder, the
    Scientific Python Development Environment. These can launched either
    through Spyder itself or in an independent Python session, and allow for
    interactive or file-based execution of Python code in different
    environments, all inside the IDE.
    For more on Spyder, visit https://www.spyder-ide.org/

    To learn about creating, connecting and using Spyder's consoles, read:
    https://docs.spyder-ide.org/ipythonconsole.html

    For advice on managing packages and environments with Spyder, see:
    https://github.com/spyder-ide/spyder/wiki/Working-with-packages-and-environments-in-Spyder
  homepage: https://www.spyder-ide.org/
  repository: https://github.com/spyder-ide/spyder-kernels
  documentation: https://docs.spyder-ide.org/

extra:
  recipe-maintainers:
    - ccordoba12
    - dalthviz
