# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.5"

package:
  name: spyder-kernels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spyder-kernels/spyder_kernels-${{ version }}.tar.gz
  sha256: 5996ed30474e7f71815e87d398dbd44abeaa7456ea6756f8191124c10453738e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cloudpickle
    - ipykernel <7,>=6.29.3
    - ipython !=8.17.1,!=9.1.0,!=9.2.0,!=9.3.0,!=9.4.0,<10,>=8.15.0
    - jupyter-client <9,>=7.4.9
    - packaging
    - pyzmq >=24.0.0
    - traitlets >=5.14.3

tests:
  - python:
      imports:
        - spyder_kernels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spyder-ide/spyder-kernels
  license: MIT
  license_file: LICENSE.txt
  summary: Jupyter kernels for Spyder's console
  description: |
    Jupyter kernels for Spyder's console

extra:
  recipe-maintainers:
    - ccordoba12
    - dalthviz

#### CFE metadata AND comments
