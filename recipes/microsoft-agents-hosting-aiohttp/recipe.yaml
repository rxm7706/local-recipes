# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: microsoft-agents-hosting-aiohttp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-agents-hosting-aiohttp/microsoft_agents_hosting_aiohttp-${{ version }}.tar.gz
  sha256: 1a3fdec858d882cdff9945d46d40602a9a3c742c06460ad310b0b6977e66d436

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - microsoft-agents-hosting-core ==1.3.0
    - aiohttp >=3.11.11

tests:
  - python:
      imports:
        - microsoft_agents.hosting.aiohttp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Agents
  license: MIT
  license_file: LICENSE
  summary: Integration library for Microsoft Agents with aiohttp
  description: |
    Integration library for Microsoft Agents with aiohttp

extra:
  recipe-maintainers:
    - rxm7706

