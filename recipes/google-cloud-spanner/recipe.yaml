# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.69.1"

package:
  name: google-cloud-spanner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-spanner/google_cloud_spanner-${{ version }}.tar.gz
  sha256: 472679a58854ed1fc1f1c296ef834541c3b9a0ced4053e74bbc2e5d33f3914a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - google-cloud-core <3.0.0,>=2.0.0
    - grpcio <2.0.0,>=1.59.0
    - grpc-google-iam-v1 <1.0.0,>=0.14.2
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5
    - grpc-interceptor >=0.15.4
    - sqlparse >=0.4.4
    - opentelemetry-api >=1.22.0
    - opentelemetry-sdk >=1.22.0
    - opentelemetry-semantic-conventions >=0.43b0
    - opentelemetry-resourcedetector-gcp >=1.8.0a0
    - google-cloud-monitoring >=2.28.0
    - mmh3 >=4.1.0

tests:
  - python:
      imports:
        - google.cloud.spanner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Spanner API client library
  description: |
    Google Cloud Spanner API client library

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar

