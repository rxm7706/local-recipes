# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: oauth-cli-kit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oauth-cli-kit/oauth_cli_kit-${{ version }}.tar.gz
  sha256: 7252f57e1a2f9dba7a94894c11b979f83884b3c88af3b4fe0206370a2b120499

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - httpx >=0.26.0
    - platformdirs >=4.0.0

tests:
  - python:
      imports:
        - oauth_cli_kit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/oauth-cli-kit/
  license: MIT
  license_file: LICENSE
  summary: Reusable OAuth 2.0 + PKCE helpers for CLI applications
  description: |
    Reusable OAuth 2.0 + PKCE helpers for CLI applications

extra:
  recipe-maintainers:
    - rxm7706

