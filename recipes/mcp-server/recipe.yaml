# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: mcp-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server/mcp_server-${{ version }}.tar.gz
  sha256: 8440ff4427e31006aec8782f8490bd57ccaf3f63e806e180a9042a70602f141e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.6.0

tests:
  - python:
      imports:
        - mcp_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A custom MCP server that provides useful tools and resources for AI assistants
  description: |
    A custom MCP server that provides useful tools and resources for AI assistants

extra:
  recipe-maintainers:
    - rxm7706

