# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.7"

package:
  name: xmlrunner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xmlrunner/xmlrunner-${{ version }}.tar.gz
  sha256: 5a6113d049eca7646111ee657266966e5bbfb0b5ceb2e83ee0772e16d7110f39

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xmlrunner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pycontribs/xmlrunner
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: PyUnit-based test runner with JUnit like XML reporting.
  description: |
    PyUnit-based test runner with JUnit like XML reporting.

extra:
  recipe-maintainers:
    - stolpeo

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: xmlrunner
  cfe-upstream-registry: pypi
  cfe-upstream-name: xmlrunner
  cfe-purls:
    - pkg:conda/xmlrunner@${{ version }}?channel=conda-forge
    - pkg:pypi/xmlrunner@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/pycontribs/xmlrunner
  cfe-import-names: [xmlrunner]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/xmlrunner-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.7

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T12:40:20Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T12:40:20Z
