# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: partd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/partd/partd-${{ version }}.tar.gz
  sha256: d022c33afbdc8405c226621b015e8067888173d85f7f5ecebb3cafed9a20f02c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - locket
    - toolz

tests:
  - python:
      imports:
        - partd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/dask/partd/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Appendable key-value storage
  description: |
    Appendable key-value storage

extra:
  recipe-maintainers:
    - jcrist
    - mrocklin
    - TomAugspurger
    - jrbourbeau

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: partd
  cfe-upstream-registry: pypi
  cfe-upstream-name: partd
  cfe-purls:
    - pkg:conda/partd@${{ version }}?channel=conda-forge
    - pkg:pypi/partd@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/dask/partd/
  cfe-import-names: [partd]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/partd-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.4.2

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T02:47:05Z
