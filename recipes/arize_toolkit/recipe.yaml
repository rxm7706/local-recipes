# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.20"

package:
  name: arize_toolkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arize_toolkit/arize_toolkit-${{ version }}.tar.gz
  sha256: 15ebe545d9bd8f7f70cbd8852278b23bcecd893c313456f2cd311711f3206ea2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - gql <4.0,>=3.0.0
    - pandas <3.0,>=0.25.3
    - pydantic ~=2.0
    - requests-toolbelt >=1.0.0
    - requests <3.0,>=2.28.1

tests:
  - python:
      imports:
        - arize_toolkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arize_toolkit/
  license: MIT
  license_file: LICENSE
  summary: A library to interact with Arize AI APIs
  description: |
    A library to interact with Arize AI APIs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
