# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: pyqt6-frameless-window
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyQt6-Frameless-Window/pyqt6_frameless_window-${{ version }}.tar.gz
  sha256: 2b253a05b6baf3ef72a475f5c58269d76b051dd8012552feb46fd6a19042ebd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - PyQt6

tests:
  - python:
      imports:
        - qframelesswindow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zhiyiYo/PyQt-Frameless-Window/tree/PyQt6
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A cross-platform frameless window based on pyqt6, support Win32, Linux and macOS.
  description: |
    A cross-platform frameless window based on pyqt6, support Win32, Linux and macOS.

extra:
  recipe-maintainers:
    - rxm7706

