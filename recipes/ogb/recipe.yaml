    - pkg:pypi/ogb@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/snap-stanford/ogb
  cfe-import-names: [ogb]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ogb-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3.6

  cfe-forge-blocker-list:
    - missing-license-file
