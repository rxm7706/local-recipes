# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.6"

package:
  name: ogb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ogb/ogb-${{ version }}.tar.gz
  sha256: ce90418a0e3206483187aa7b7ecac1a2c5d85b3b99aceedb807138ee43115914

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - numpy
    - tqdm
    - scikit-learn
    - pandas
    - six
    - urllib3
    - outdated

tests:
  - python:
      imports:
        - ogb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snap-stanford/ogb
  license: MIT
  license_file: LICENSE
  summary: Open Graph Benchmark
  description: |
    Open Graph Benchmark

extra:
  recipe-maintainers:
    - hadim

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ogb
  cfe-upstream-registry: pypi
  cfe-upstream-name: ogb
