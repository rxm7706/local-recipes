# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ogb
  version: "1.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ogb-${{ version }}.tar.gz
  sha256: ce90418a0e3206483187aa7b7ecac1a2c5d85b3b99aceedb807138ee43115914

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - outdated
    - pip
    - python ${{ python_min }}
  run:
    - numpy >=1.16.0
    - outdated >=0.2.0
    - pandas >=0.24.0
    - python >=${{ python_min }}
    - scikit-learn >=0.20.0
    - six >=1.12.0
    - pytorch >=1.6.0
    - tqdm >=4.29.0
    - urllib3 >=1.24.0

tests:
  - python:
      imports:
        - ogb
        - ogb.graphproppred
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: Open Graph Benchmark
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/snap-stanford/ogb

extra:
  recipe-maintainers:
    - hadim
