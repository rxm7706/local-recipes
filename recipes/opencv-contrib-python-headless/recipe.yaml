# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0.93"

package:
  name: opencv-contrib-python-headless
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opencv-contrib-python-headless/opencv_contrib_python_headless-${{ version }}.tar.gz
  sha256: 6a8c34de905f59b038f6ab0475e73fb0a0f345c3582ec3aeaeb1c0912e80cddb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - numpy <2.0
  run:
    - python >=${{ python_min }}
    - numpy <2.0

tests:
  - python:
      imports:
        - cv2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/opencv/opencv-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Wrapper package for OpenCV python bindings.
  description: |
    Wrapper package for OpenCV python bindings.

extra:
  recipe-maintainers:
    - rxm7706

