# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kaitaistruct
  version: "0.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kaitaistruct-${{ version }}.tar.gz
  sha256: 053ee764288e78b8e53acf748e9733268acbd579b8d82a427b1805453625d74b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kaitaistruct
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: "Kaitai Struct declarative parser generator for binary data: runtime library for Python"
  license: MIT
  license_file:
    - LICENSE
  homepage: https://kaitai.io

extra:
  recipe-maintainers:
    - jonashaag
    - AdrianFreundQC
    - freundTech
