# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.2"

package:
  name: open-data-contract-standard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/open-data-contract-standard/open_data_contract_standard-${{ version }}.tar.gz
  sha256: 9da18e1e961388bca6110e5a394c85bdf69de3e9966b2acf3f81f0092694d714

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2.8.0
    - pyyaml >=6.0.0

tests:
  - python:
      imports:
        - open_data_contract_standard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/datacontract/open-data-contract-standard-python
  license: MIT
  license_file: LICENSE
  summary: The Pydantic Model of the Open Data Contract Standard
  description: |
    The Pydantic Model of the Open Data Contract Standard

extra:
  recipe-maintainers:
    - rxm7706

