# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.2.0"

package:
  name: cmeel-fmt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cmeel-fmt/cmeel_fmt-${{ version }}.tar.gz
  sha256: d1db3a58ba814a27344728780c26e1d1bceeb48d8c0da6c79caa00a8c77db0ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cmeel

tests:
  - python:
      imports:
        - fmt.support.python.mkdocstrings_handlers.cxx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cmake-wheel/cmeel-fmt
  license: MIT
  license_file: LICENSE
  summary: cmeel distribution for fmt, a modern formatting library
  description: |
    cmeel distribution for fmt, a modern formatting library
  repository: https://github.com/cmake-wheel/cmeel-fmt.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
