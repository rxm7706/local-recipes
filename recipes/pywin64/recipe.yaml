# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: pywin64
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywin64/pywin64-${{ version }}.tar.gz
  sha256: 0a98dded3b925960ec135667a80b461bb5c057d04d77d7c2a7e84513987b599f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pywin64
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/KingsFrown/pywin64
  license: Apache-2.0
  license_file: LICENSE
  summary: dl ekz
  description: |
    dl ekz

extra:
  recipe-maintainers:
    - rxm7706

