# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.dev15"

package:
  name: python-sat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-sat/python_sat-${{ version }}.tar.gz
  sha256: 5a2a58022248ce2cf9395b560685185e4773c452a29eb0ae8662d67611336cd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - pysat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysathq/pysat
  license: MIT
  license_file: LICENSE
  summary: A Python library for prototyping with SAT oracles
  description: |
    A Python library for prototyping with SAT oracles

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-sat
