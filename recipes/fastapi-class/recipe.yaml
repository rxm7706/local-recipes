# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.0"

package:
  name: fastapi-class
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-class/fastapi_class-${{ version }}.tar.gz
  sha256: 0f36cab68c30661008ae8c210e8ba27f78d1df127591fc65c2623c16c28cb3e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastapi >=0.111.0

tests:
  - python:
      imports:
        - fastapi_class
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yezz123/fastapi-class
  license: MIT
  license_file: LICENSE
  summary: Simplifies class-based views for more organized and maintainable code in FastAPI.
  description: |
    Simplifies class-based views for more organized and maintainable code in FastAPI.

extra:
  recipe-maintainers:
    - rxm7706

