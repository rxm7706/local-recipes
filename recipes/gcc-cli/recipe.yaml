# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: gcc-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcc-cli/gcc_cli-${{ version }}.tar.gz
  sha256: 3c470fdb501de1a38b9081d2455a143dba0883c0cff3c526f15dbeaa8b7b6675

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.21.1
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0
    - rich >=13.0.0
    - typer >=0.9.0

tests:
  - python:
      imports:
        - gcc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gcc-cli/
  license: MIT
  license_file: LICENSE
  summary: Git-style version control for AI agent context
  description: |
    Git-style version control for AI agent context

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gcc-cli
  cfe-upstream-registry: pypi
  cfe-upstream-name: gcc-cli
  cfe-purls:
    - pkg:conda/gcc-cli@${{ version }}?channel=conda-forge
    - pkg:pypi/gcc-cli@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/gcc-cli/
  cfe-upstream-homepage: https://pypi.org/project/gcc-cli/
  cfe-import-names: [gcc]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
