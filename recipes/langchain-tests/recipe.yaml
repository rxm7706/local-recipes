# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.9"

package:
  name: langchain-tests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-tests/langchain_tests-${{ version }}.tar.gz
  sha256: a977a0c8f9a42ba2021a5ae59d468e4023f98a83818a3cb30e12c1dfab830203

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx <1.0.0,>=0.28.1
    - langchain-core <2.0.0,>=1.4.0
    - numpy >=1.26.2
    - pytest-asyncio <2.0.0,>=1.3.0
    - pytest-benchmark
    - pytest-codspeed
    - pytest-recording
    - pytest-socket <1.0.0,>=0.7.0
    - pytest <10.0.0,>=9.0.3
    - syrupy <6.0.0,>=5.0.0
    - vcrpy <9.0.0,>=8.0.0

tests:
  - python:
      imports:
        - langchain_tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Standard tests for LangChain implementations
  description: |
    Standard tests for LangChain implementations
  repository: https://github.com/langchain-ai/langchain
  documentation: https://docs.langchain.com/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
