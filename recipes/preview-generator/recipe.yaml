# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.29"

package:
  name: preview-generator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/preview-generator/preview_generator-${{ version }}.tar.gz
  sha256: 343978dace795b4b9da862d96f2e4a9c088e58a255c32a97ecd8729d4947377a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - preview_generator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/algoo/preview-generator
  license: MIT
  license_file: LICENSE
  summary: A library for generating preview (thumbnails, text or json overview) for file-based content
  description: |
    A library for generating preview (thumbnails, text or json overview) for file-based content

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
