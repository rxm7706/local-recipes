# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: langgraph-studio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-studio/langgraph_studio-${{ version }}.tar.gz
  sha256: 2a911eedb5504981693a756ccf7ad36b7bbfe562c35f1ffe20778edaecbf2e5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - sse-starlette <2.0.0,>=1.6.5
    - tomli-w <2.0.0,>=1.0.0
    - uvicorn <0.24.0,>=0.23.2
    - fastapi <0.104.0,>=0.103.2
    - langserve ==0.0.32
    - orjson <4.0.0,>=3.9.10
    - python-multipart <0.0.7,>=0.0.6
    - tiktoken <0.6.0,>=0.5.1
    - langchain >=0.0.338
    - langgraph <0.0.30,>=0.0.29
    - pydantic <2.0
    - python-magic <0.5.0,>=0.4.27
    - langchain-openai <0.0.9,>=0.0.8
    - beautifulsoup4 <5.0.0,>=4.12.3
    - boto3 <2.0.0,>=1.34.28
    - duckduckgo-search <5.0,>=4.2
    - arxiv <3.0.0,>=2.1.0
    - kay <0.2.0,>=0.1.2
    - xmltodict <0.14.0,>=0.13.0
    - wikipedia <2.0.0,>=1.4.0
    - langchain-google-vertexai <0.0.4,>=0.0.3
    - setuptools <70.0.0,>=69.0.3
    - pdfminer-six <20231229,>=20231228
    - langchain-robocorp <0.0.5,>=0.0.4
    - fireworks-ai <0.12.0,>=0.11.2
    - anthropic <0.14.0,>=0.13.0
    - httpx ==0.25.2
    - unstructured <0.13.0,>=0.12.5
    - pgvector <0.3.0,>=0.2.5
    - psycopg2 <3.0.0,>=2.9.9
    - asyncpg <0.30.0,>=0.29.0
    - langchain-core <0.2.0,>=0.1.33

tests:
  - python:
      imports:
        - app
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-studio/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
