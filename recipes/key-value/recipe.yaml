schema_version: 1

context:
  version: "0.1.2"

package:
  name: key-value
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/k/key-value/key_value-0.1.2-py3-none-any.whl
  sha256: 2ce65dad71fae5d47fe56beafd174435b09ac495854af0ff98d946b7b99a05f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - key_value
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/your_username/your_project
  license: MIT
  license_file: LICENSE
  summary: Your project description
  description: |
    Your project description

extra:
  recipe-maintainers:
    - rxm7706

