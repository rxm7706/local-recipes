    - pkg:pypi/browserstack-local@${{ version }}
  cfe-upstream-repo: https://github.com/browserstack/browserstack-local-python
  cfe-upstream-homepage: https://github.com/browserstack/browserstack-local-python
  cfe-import-names: [browserstack]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
