# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: koalas
  version: "1.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: cd072f1a9ae97e87e85e53a1c8a3097777c76f45504e79782d0acff5282fe586

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python >=3.5,<3.10
  run:
    - numpy >=1.14
    - pandas >=0.23.2
    - pyarrow >=0.10
    - python >=3.5,<3.10

tests:
  - python:
      imports:
        - databricks
        - databricks.koalas
        - databricks.koalas.missing
      pip_check: false
  - requirements:
      run:
        - pyspark >=2.4

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: pandas API on Apache Spark
  homepage: https://github.com/databricks/koalas
  repository: https://github.com/databricks/koalas
  documentation: https://koalas.readthedocs.io/

extra:
  recipe-maintainers:
    - xinrong-meng
    - rxin
    - thunterdb
    - gatorsmile
    - HyukjinKwon
    - ueshin
    - itholic
