# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.2"

package:
  name: koalas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/koalas/koalas-${{ version }}.tar.gz
  sha256: cd072f1a9ae97e87e85e53a1c8a3097777c76f45504e79782d0acff5282fe586

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - pyarrow
    - numpy

tests:
  - python:
      imports:
        - databricks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/databricks/koalas
  license: http://www.apache.org/licenses/LICENSE-2.0
  license_file: LICENSE
  summary: "Koalas: pandas API on Apache Spark"
  description: |
    Koalas: pandas API on Apache Spark
  repository: https://github.com/databricks/koalas
  documentation: https://koalas.readthedocs.io/

extra:
  recipe-maintainers:
    - xinrong-meng
    - rxin
    - thunterdb
    - gatorsmile
    - HyukjinKwon
    - ueshin
    - itholic

