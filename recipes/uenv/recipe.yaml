# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: uenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uenv/uenv-${{ version }}.tar.gz
  sha256: 39bedd06ac9b228bfdeae76f419ed60c3af33c25dc1eacf932c6aa90d3147ebe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hvnsweeting/uenv
  license: MIT
  license_file: LICENSE
  summary: A simple .env reader
  description: |
    A simple .env reader

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: uenv
  cfe-upstream-registry: pypi
  cfe-upstream-name: uenv
