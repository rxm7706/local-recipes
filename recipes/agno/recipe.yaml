# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.2"

package:
  name: agno
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agno/agno-${{ version }}.tar.gz
  sha256: 9dab9cdacaec8083a3dea392d58703011b8eaa0ef086a40919d5a3dcc4b1a793

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agno = agnoctl.main:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - agnoctl >=0.1.1
    - docstring_parser
    - h11 >=0.16.0
    - httpx
    - packaging
    - pydantic-settings
    - pydantic
    - pyyaml
    - rich
    - typing_extensions

tests:
  - python:
      imports:
        - agno
        - agno.agent
        - agno.models
        - agno.tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - agno --help

about:
  homepage: https://agno.com
  repository: https://github.com/agno-agi/agno
  documentation: https://docs.agno.com
  summary: The programming language for agentic software.
  description: |
    Agno is a lightweight framework for building multi-modal Agents.
    It supports any model provider, native multi-modal I/O, multi-agent
    teams, memory management, knowledge stores, structured outputs, and
    real-time monitoring.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - killua156
    - mgorny

