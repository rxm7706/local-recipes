# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: fastapi-simple-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-simple-cache/fastapi-simple-cache-${{ version }}.tar.gz
  sha256: 2b46a1cdf73192d42dd1646e9045ac226e3f13764e17b2417782b27194cb8dfc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - fastapi

tests:
  - python:
      imports:
        - fastapi_simple_cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastapi-simple-cache/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: FastAPI Simple Cache
  description: |
    FastAPI Simple Cache
  repository: https://github.com/sebustam/fastapi-simple-cache

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
