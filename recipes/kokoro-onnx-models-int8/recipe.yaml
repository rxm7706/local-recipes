# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"
  release: model-files-v1.0

package:
  name: kokoro-onnx-models-int8
  version: ${{ version }}

source:
  # A bare release asset, not an archive, so file_name is required -- there is
  # no extension-driven unpacking to rely on.
  - url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/${{ release }}/kokoro-v1.0.int8.onnx
    sha256: 6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb
    file_name: kokoro-v1.0.int8.onnx

build:
  number: 0
  noarch: generic
  dynamic_linking:
    # The .onnx is a protobuf container holding tensor data at fixed offsets.
    # It is data, not a linkable object, and relocation would silently corrupt
    # weights rather than fail loudly -- the quiet cousin of the failure that
    # corrupted a Bun binary in this repo's ccusage recipe.
    binary_relocation: false
  script:
    - if: unix
      then: |
        set -ex
        DEST="${PREFIX}/share/kokoro-onnx"
        mkdir -p "${DEST}"
        cp -a kokoro-v1.0.int8.onnx "${DEST}/"

requirements:
  run:
    # Voices are shared by every variant and ship separately so the three can
    # co-install; the resolver lives there too. Pinned exactly because both
    # come from the same upstream release tag.
    - kokoro-onnx-voices ==${{ version }}
  run_constraints:
    - kokoro-onnx >=0.6.0

tests:
  - package_contents:
      files:
        - share/kokoro-onnx/kokoro-v1.0.int8.onnx
  - script:
      # Resolution goes through the shared resolver, so this also proves the
      # voices dependency actually arrived.
      - python -c "import kokoro_onnx_models as m; print('model:', m.get_model_path('int8'))"
      - python -c "import kokoro_onnx_models as m, sys; assert m.get_model_path('int8').startswith(sys.prefix)"
      - python -c "import kokoro_onnx_models as m; assert m.list_variants() == ['int8'], m.list_variants(); print('variants:', m.list_variants())"
      # With this the only variant installed, the no-argument call must find it.
      - python -c "import kokoro_onnx_models as m; assert m.get_model_path() == m.get_model_path('int8'); print('default resolution OK')"
      # Exact size catches truncation; the ONNX parse plus the node count
      # catches a mangled or swapped payload, which a contents check would not.
      - python -c "import kokoro_onnx_models as m, os; s=os.path.getsize(m.get_model_path('int8')); assert s == 92361271, s; print('bytes OK:', s)"
      - python -c "import onnx, kokoro_onnx_models as m; g=onnx.load(m.get_model_path('int8')).graph; assert len(g.node) == 3614, len(g.node); print('onnx graph OK, nodes:', len(g.node))"
    requirements:
      run:
        - python
        - onnx

about:
  homepage: https://github.com/thewh1teagle/kokoro-onnx
  repository: https://huggingface.co/hexgrad/Kokoro-82M
  documentation: https://github.com/thewh1teagle/kokoro-onnx#readme
  summary: Kokoro v1.0 TTS model weights (int8) for kokoro-onnx
  description: |
    The Kokoro v1.0 ONNX model, int8 variant (88 MB) -- dynamically quantized weights, smallest on disk but slowest on CPU --
    installed into `$CONDA_PREFIX/share/kokoro-onnx/` so an environment is
    complete from the lock alone rather than requiring a manual download.

    Measured composition: 54.7 MB uint8 + 23.3 MB int8 + 12.9 MB
    float32, with 139 DynamicQuantizeLinear, 148 MatMulInteger and
    87 ConvInteger nodes. Quantization is applied at run time,
    which is why the node count (3614) is HIGHER than f32's 2464
    despite the file being a quarter of the size.

    THIS VARIANT IS SLOWER, NOT FASTER. Quantizing on every
    inference costs more than the narrower arithmetic saves on a
    CPU without int8 acceleration. Measured 2026-09-07, AMD Ryzen
    7 7840HS / 16 threads, onnxruntime 1.28.0 CPU provider,
    median of 3 runs after a warm-up, one 2.7 s utterance:

        variant   load    synth   real-time factor
        f32       0.66 s  0.59 s  0.22
        fp16      0.62 s  0.68 s  0.25
        int8      0.39 s  3.22 s  1.22   <- slower than real time

    Choose int8 to fit the model in ~88 MB of disk or memory.
    Do NOT choose it for throughput. Re-run the numbers on your
    own hardware before relying on them; a CPU with VNNI/AMX, or
    a GPU execution provider, can invert this result.

    Voice embeddings are shared across variants and come from
    `kokoro-onnx-voices`, pulled in automatically, which also provides the
    resolver:

        from kokoro_onnx import Kokoro
        from kokoro_onnx_models import get_model_path, get_voices_path

        kokoro = Kokoro(get_model_path("int8"), get_voices_path())
        samples, sample_rate = kokoro.create("Hello world", voice="af_sarah")

    All three variants co-install; `get_model_path()` with no argument returns
    the highest-precision one present.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

