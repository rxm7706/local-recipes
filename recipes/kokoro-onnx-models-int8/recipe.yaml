# CFE comments
# Header:
#    # One of three model variants that co-install. The split exists because
#    # every variant needs the SAME voices-v1.0.bin: shipping it from each
#    # would be a file clobber (conda refuses two packages owning one path),
#    # and folding the variants into one package would force a 311 MB f32
#    # download on someone who wanted int8's 88 MB.
#    # Genuinely quantized, unlike the "fp16" variant: 139
#    # DynamicQuantizeLinear + 148 MatMulInteger + 87 ConvInteger, quantizing
#    # at run time. That is why the node count (3614) EXCEEDS f32's 2464 even
#    # though the file is a quarter of the size -- worth knowing before reading
#    # the asserted count below as a transcription error.
#    # The `about` text carries a measured speed table because the obvious
#    # assumption about this variant is BACKWARDS: it is 5.5x slower than f32
#    # on a CPU without int8 acceleration (RTF 1.22 -- slower than real time),
#    # since per-inference dynamic quantization costs more than the narrower
#    # arithmetic saves. Measured, not assumed, on the co-install env built
#    # during packaging; the numbers are dated and name their hardware so a
#    # future reader can tell whether they still apply.
#    # Output quality was checked at the same time: duration-normalised
#    # envelope correlation against f32 is 0.90 for int8 and 0.95 for fp16, on
#    # one utterance. Note the metric -- raw waveform correlation reads ~0.006
#    # for perceptually fine audio here, because the variants emit different
#    # lengths and a sub-frame shift decorrelates speech completely. That is a
#    # measurement artefact, not a defect, and it is recorded so nobody
#    # "discovers" it later and files a bug against this recipe.
# build:
#    # noarch: generic, not noarch: python -- this package ships no importable
#    # code at all. The resolver module lives in kokoro-onnx-voices, which
#    # means these weights are equally usable from a non-Python ONNX runtime.
#    # The payload goes to share/kokoro-onnx/, the same directory every other
#    # package in the set writes into, which is what lets one resolver find
#    # all of them.
# requirements:
#    # kokoro-onnx is a run_constraint, not a dependency: these weights are
#    # independently useful (any ONNX runtime can load them), but pairing them
#    # with an incompatible kokoro-onnx should not happen silently.
# tests:
#    # Three layers, deliberately. package_contents proves the file shipped;
#    # the exact byte count proves it is not truncated; onnx.load() with an
#    # asserted node count proves the protobuf is intact AND that this is the
#    # right variant -- the only check that would catch two assets swapped
#    # between recipes, which is a real risk when three recipes differ by one
#    # filename. Node counts were measured, not assumed: 3614 here.
####
