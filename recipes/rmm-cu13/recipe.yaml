# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: rmm-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/r/rmm-cu13/rmm_cu13-26.8.0-cp311-abi3-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: d2f833a9c5a132941927d883da674f46da23074ea1bfde2aea7c00d005929042

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <14.0,>=13.0.1
    - librmm-cu13 ==26.8.*
    - numpy <3.0,>=2.0

tests:
  - python:
      imports:
        - rmm_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/rmm
  license: Apache-2.0
  license_file: LICENSE
  summary: rmm - RAPIDS Memory Manager
  description: |
    rmm - RAPIDS Memory Manager

extra:
  recipe-maintainers:
    - rxm7706

