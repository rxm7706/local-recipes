# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"
  python_min: "3.11"

package:
  name: sonar-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sonar-mcp/sonar_mcp-${{ version }}.tar.gz
  sha256: 035d55509c126e01e8c549f5471b68e50a55ed310172a4b7f37611458e839926

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.0
    - wheel
  run:
    - python >=${{ python_min }}
    - mcp <2,>=1.25.0
    - httpx >=0.27.0
    - pydantic >=2.12.5
    - pyyaml >=6.0.2
    - structlog >=25.5.0
    - tenacity >=9.1.2
    - python-dotenv >=1.1.0

tests:
  - python:
      imports:
        - sonar_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wadew/sonar-mcp
  license: MIT
  license_file: LICENSE
  summary: MCP server for SonarQube code quality platform
  description: |
    MCP server for SonarQube code quality platform
  repository: https://github.com/wadew/sonar-mcp.git
  documentation: https://github.com/wadew/sonar-mcp#documentation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
