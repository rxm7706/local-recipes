# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.10"
  python_min: "3.12"

package:
  name: hex-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hex-mcp/hex_mcp-${{ version }}.tar.gz
  sha256: a45649fa4745dd509ee3f3018bca20e6d46452e70566991dbebcab85a4f6d1eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - backoff >=2.2.1
    - httpx >=0.27.0
    - mcp >=1.3.0
    - python-dotenv >=1.0.1
    - pyyaml >=6.0.2
    - typer >=0.15.2

tests:
  - python:
      imports:
        - hex_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/hex-mcp/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A MCP server for Hex
  description: |
    A MCP server for Hex

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: hex-mcp
