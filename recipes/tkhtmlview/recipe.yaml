# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: tkhtmlview
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkhtmlview/tkhtmlview-${{ version }}.tar.gz
  sha256: e9f34def321585407a19b40a69c63cffa4e4acadff1ccf8b81a4e27afc9bace0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.22,<0.9.0
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.32.4
    - pillow <13,>=11

tests:
  - python:
      imports:
        - tkhtmlview
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tkhtmlview/
  license: MIT
  license_file: LICENSE
  summary: Display HTML with Tkinter
  description: |
    Display HTML with Tkinter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
