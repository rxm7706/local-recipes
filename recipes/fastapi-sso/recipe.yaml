# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.1"

package:
  name: fastapi-sso
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-sso/fastapi_sso-${{ version }}.tar.gz
  sha256: c6f730b075caf537efa7c0f531095cf2d963a6fa27d059b3300e5eb19b282adb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - fastapi >=0.80
    - httpx >=0.23.0
    - oauthlib >=3.1.0
    - pydantic >=1.8.0
    - pyjwt <3.0.0,>=2.10.1
    - typing_extensions <5.0.0,>=4.12.2

tests:
  - python:
      imports:
        - fastapi_sso
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://tomasvotava.github.io/fastapi-sso/
  license: MIT
  license_file: LICENSE
  summary: FastAPI plugin to enable SSO to most common providers (such as Facebook login, Google login and login via Microsoft Office 365 Account)
  description: |
    FastAPI plugin to enable SSO to most common providers (such as Facebook login, Google login and login via Microsoft Office 365 Account)
  repository: https://github.com/tomasvotava/fastapi-sso
  documentation: https://tomasvotava.github.io/fastapi-sso/

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
