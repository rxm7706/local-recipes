# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: unittest2
  version: "1.1.0"
  sha256: 22882a0e418c284e1f718a822b3b022944d53d2d908e1690b319a9d3eb2c0579

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - no-argparse-req.patch

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .
  python:
    entry_points:
      - unit2 = unittest2.__main__:main_

requirements:
  host:
    - python <3
    - pip
    - six >=1.4
    - traceback2
  run:
    - python <3
    - six >=1.4
    - traceback2

tests:
  - python:
      imports:
        - unittest2
      pip_check: false
  - script:
      - unit2 --help

about:
  license: PSF 2, BSD
  license_file: ${{ RECIPE_DIR }}/LICENSE.txt
  summary: Recent features of the unittest package backported to Python <= 3.4.
  homepage: https://pypi.org/project/unittest2/

extra:
  recipe-maintainers:
    - pkgw

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: unittest2
  cfe-upstream-registry: pypi
  cfe-upstream-name: unittest2
  cfe-purls:
    - pkg:conda/unittest2@${{ version }}?channel=conda-forge
    - pkg:pypi/unittest2@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/unittest2/
  cfe-import-names: [unittest2]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "false"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/unittest2-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.1.0

  cfe-forge-blocker-list: []
