# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: djongo
  version: "1.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/djongo-${{ version }}.tar.gz
  sha256: 2250d484d4b4025661c139162bafd359eabaffd0deeba18debc59df78a325dc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - django >=2.1,<=3.0.5
    - pymongo >=3.2.0
    - python >=3.6
    - sqlparse 0.2.4.*

tests:
  - python:
      imports:
        - djongo
        - djongo.dynamic_formsets
      pip_check: true

about:
  summary: Driver for allowing Django to use MongoDB as the database backend.
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://nesdis.github.io/djongo/

extra:
  recipe-maintainers:
    - marcelotrevisani
