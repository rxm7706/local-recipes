# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.7"

package:
  name: djongo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djongo/djongo-${{ version }}.tar.gz
  sha256: 347f5a310c8111a3e4a540294533c7a975e5a9e1766ef63b62bf044c9d64bab6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlparse ==0.2.4
    - pymongo <=3.11.4,>=3.7.0
    - django <=3.1.12,>=2.1
    - pytz >=2018.5

tests:
  - python:
      imports:
        - djongo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.djongomapper.com/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "Djongo: The Django MongoDB connector"
  description: |
    Djongo: The Django MongoDB connector
  repository: https://github.com/doableware/djongo.git
  documentation: https://www.djongomapper.com/docs/

extra:
  recipe-maintainers:
    - marcelotrevisani

