# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: future
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/future/future-${{ version }}.tar.gz
  sha256: bd2968309307861edae1458a4f8a4f3598c03be43b97521076aebf5d94c07b05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://python-future.org
  license: MIT
  license_file: LICENSE.txt
  summary: Clean single-source support for Python 3 and 2
  description: |
    Clean single-source support for Python 3 and 2
  repository: https://github.com/PythonCharmers/python-future

extra:
  recipe-maintainers:
    - jakirkham
    - mmysinger
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: future
  cfe-upstream-registry: pypi
  cfe-upstream-name: future
  cfe-purls:
    - pkg:conda/future@${{ version }}?channel=conda-forge
    - pkg:pypi/future@${{ version }}
  cfe-upstream-repo: https://github.com/PythonCharmers/python-future
  cfe-upstream-homepage: https://python-future.org
  cfe-import-names: [html]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/future-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.0.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-17T08:38:12Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T08:38:12Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-17T08:38:12Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
