# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: mongomock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mongomock/mongomock-${{ version }}.tar.gz
  sha256: 32667b79066fabc12d4f17f16a8fd7361b5f4435208b3ba32c226e52212a8c30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - packaging
    - pytz
    - sentinels

tests:
  - python:
      imports:
        - mongomock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mongomock/mongomock
  license: ISC
  license_file: LICENSE
  summary: Fake pymongo stub for testing simple MongoDB-dependent code
  description: |
    Fake pymongo stub for testing simple MongoDB-dependent code

extra:
  recipe-maintainers:
    - jonashaag
    - hajapy
    - birnbaum
    - mathiaseitz
    - trendelkampschroer
    - JunAishima

