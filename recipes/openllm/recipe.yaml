# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openllm
  version: "0.4.44"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openllm/openllm-${{ version }}.tar.gz
  sha256: b1063f19a41479464102222b31ef240bf1a6c9557c8e0cfa24959b2c4c10bb34

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -c "import pathlib; p = pathlib.Path('pyproject.toml'); p.write_text(p.read_text().replace('bentoml==1.4.8', 'bentoml>=1.4.8'))"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - openllm = openllm.__main__:app

requirements:
  host:
    - python
    - hatchling ==1.27.0
    - hatch-vcs ==0.4.0
    - pip
  run:
    - python >=${{ python_min }}
    - attrs
    - bentoml >=1.4.8
    - dulwich
    - hf-xet
    - huggingface_hub
    - nvidia-ml-py
    - openai ==1.73.0
    - pip-requirements-parser
    - psutil
    - pyaml
    - questionary
    - tabulate
    - typer
    - typing_extensions >=4.12.2
    - python-uv

tests:
  - python:
      imports:
        - openllm
      pip_check: true
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - openllm --help

about:
  summary: "OpenLLM: Operating LLMs in production"
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/bentoml/OpenLLM

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/openllm-client
    - conda-forge/openllm-core

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: openllm
  cfe-upstream-registry: pypi
  cfe-upstream-name: openllm
