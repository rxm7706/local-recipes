{% set name = "openllm" %}
{% set version = "0.6.30" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/openllm-{{ version }}.tar.gz
  sha256: 50f521ba49e50ea5c8d4092abcb651e52305128f0e3f3c012cf0dbb97429f1da

build:
  entry_points:
    - openllm = openllm.__main__:app
  script: |
    {{ PYTHON }} -c "import pathlib; p = pathlib.Path('pyproject.toml'); p.write_text(p.read_text().replace('bentoml==1.4.8', 'bentoml>=1.4.8'))"
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python

requirements:
  host:
    - python
    - hatchling ==1.27.0
    - hatch-vcs ==0.4.0
    - pip
  run:
    - python >={{ python_min }}
    - attrs
    - bentoml >=1.4.8
    - dulwich
    - hf-xet
    - huggingface_hub
    - nvidia-ml-py
    - openai ==1.73.0
    - pip-requirements-parser
    - psutil
    - pyaml
    - questionary
    - tabulate
    - typer
    - typing_extensions >=4.12.2
    - python-uv

test:
  imports:
    - openllm
  commands:
    - pip check
    - openllm --help
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: 'OpenLLM: Operating LLMs in production'
  home: https://github.com/bentoml/OpenLLM
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/openllm-client
    - conda-forge/openllm-core
    - pb01ka
