# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: google-cloud-audit-log
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-audit-log/google_cloud_audit_log-${{ version }}.tar.gz
  sha256: 4aba72b45dc15344da1b2d8981320050fe39cfe80432f38e7318aa2e477c5bf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - protobuf <8.0.0,>=6.33.5
    - googleapis-common-protos <2.0.0,>=1.69.2

tests:
  - python:
      imports:
        - google.cloud.audit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-audit-log
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Audit Protos
  description: |
    Google Cloud Audit Protos

extra:
  recipe-maintainers:
    - xylar

