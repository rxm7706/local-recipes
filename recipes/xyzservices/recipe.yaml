# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: xyzservices
  version: "2026.3.0"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d226866a5d8e9fef337034d8da37a8298f0a1d9d1489b4018e69579eb321fea4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.9.*
    - setuptools >=77
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xyzservices.providers
        - xyzservices
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Source of XYZ tiles providers
  description: |
    xyzservices is a lightweight library providing a repository of available XYZ
    services offering raster basemap tiles. The repository is provided via
    Python API and as a compressed JSON file.
  homepage: https://github.com/geopandas/xyzservices
  repository: https://github.com/geopandas/xyzservices
  documentation: https://xyzservices.readthedocs.io/

extra:
  recipe-maintainers:
    - martinfleis
