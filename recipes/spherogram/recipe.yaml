# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: spherogram
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spherogram/spherogram-${{ version }}.tar.gz
  sha256: 9351a77308fee452421b914ae55f3cdaff805692b834777aa6a034a9a85bf970

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - cython
  run:
    - python >=${{ python_min }}
    - decorator
    - networkx
    - packaging
    - snappy-manifolds >=1.4
    - knot-floer-homology >=1.2.2

tests:
  - python:
      imports:
        - dev
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/Spherogram
  license: GPLv2+
  license_file: LICENSE
  summary: Spherical diagrams for 3-manifold topology
  description: |
    Spherical diagrams for 3-manifold topology

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spherogram
