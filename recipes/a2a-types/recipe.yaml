# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: a2a-types
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a-types/a2a_types-${{ version }}.tar.gz
  sha256: f94097ed4425d9aacd55c508d77897937e14f56a89c974024abf9f31b280a355

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >2.0.0

tests:
  - python:
      imports:
        - a2a_types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/a2a-types/
  license: MIT
  license_file: LICENSE
  summary: Google A2A-compatible message types exposed as Pydantic models.
  description: |
    Google A2A-compatible message types exposed as Pydantic models.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
