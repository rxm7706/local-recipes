# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: cors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cors/cors-${{ version }}.tar.gz
  sha256: 6a337e54978ea0d1527d2d918d5bdb5771a0f4904ecc6706541717bf15184236

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorama
    - requests
    - argparse
    - gevent
    - tldextract
    - future
    - pysocks

tests:
  - python:
      imports:
        - CORScanner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/chenjj/CORScanner
  license: MIT
  license_file: LICENSE
  summary: Fast CORS misconfiguration vulnerabilities scanner
  description: |
    Fast CORS misconfiguration vulnerabilities scanner
  repository: https://github.com/chenjj/CORScanner/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cors
  cfe-upstream-registry: pypi
  cfe-upstream-name: cors
  cfe-purls:
    - pkg:conda/cors@${{ version }}?channel=conda-forge
    - pkg:pypi/cors@${{ version }}
  cfe-upstream-repo: https://github.com/chenjj/CORScanner/
  cfe-upstream-homepage: http://github.com/chenjj/CORScanner
  cfe-import-names: [CORScanner]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
