# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: install-playwright
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/install-playwright/install_playwright-${{ version }}.tar.gz
  sha256: d1bb31a6eee97416acb73ccba7bdc031fff45008ac4bf1ec75298d19b202add0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - playwright <2,>=1.49.1

tests:
  - python:
      imports:
        - install_playwright
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/install-playwright/
  license: MIT
  license_file: LICENSE
  summary: Execute `playwright install` from Python
  description: |
    Execute `playwright install` from Python
  repository: https://github.com/eggplants/install-playwright-python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
