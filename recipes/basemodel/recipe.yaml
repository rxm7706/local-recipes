# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20190604.1625"

package:
  name: basemodel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/BaseModel/BaseModel-${{ version }}.tar.gz
  sha256: dae9848f86a55249681d69c9a635a534f4daa0b9d5eab95b6a97a91e1cc116f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - BaseModel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/billsteve
  license: MIT
  license_file: LICENSE
  summary: SqlAlchemy's spuer class
  description: |
    SqlAlchemy's spuer class

extra:
  recipe-maintainers:
    - rxm7706

