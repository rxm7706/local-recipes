# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: cucim-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/c/cucim-cu13/cucim_cu13-26.8.0-cp311-cp311-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: e2986b5dedc0670f36abe6331d0168042c076ffa4fd392eb0f9e729983c8b1f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - cupy-cuda13x !=14.1.0,>=14.0.1
    - lazy-loader >=0.4
    - numpy <3.0,>=2.0
    - nvidia-nvimgcodec-cu13 <0.10.0,>=0.9.0
    - scikit-image <0.27.0,>=0.23.2
    - scipy >=1.11.2

tests:
  - python:
      imports:
        - cucim_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/multidimensional-image-processing
  license: Apache-2.0
  license_file: LICENSE
  summary: cuCIM - an extensible toolkit designed to provide GPU accelerated I/O, computer vision & image processing primitives for N-Dimensional images with a focus on biomedical imaging.
  description: |
    cuCIM - an extensible toolkit designed to provide GPU accelerated I/O, computer vision & image processing primitives for N-Dimensional images with a focus on biomedical imaging.
  repository: https://github.com/rapidsai/cucim
  documentation: https://docs.rapids.ai/api/cucim/stable/

extra:
  recipe-maintainers:
    - rxm7706

