# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.4"

package:
  name: instructor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/instructor/instructor-${{ version }}.tar.gz
  sha256: ea2280c3678d0f6891c4d826104f95624b680e69877113a6345b1d7c9027ba0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp <4.0.0,>=3.9.1
    - docstring_parser <1.0,>=0.16
    - jinja2 <4.0.0,>=3.1.4
    - jiter <0.15,>=0.6.1
    - openai <3.0.0,>=2.0.0
    - pydantic-core <3.0.0,>=2.18.0
    - pydantic <3.0.0,>=2.8.0
    - requests <3.0.0,>=2.32.3
    - rich <15.0.0,>=13.7.0
    - tenacity <10.0.0,>=8.2.3
    - typer <1.0.0,>=0.9.0

tests:
  - python:
      imports:
        - instructor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/instructor/
  license: MIT
  license_file: LICENSE
  summary: structured outputs for llm
  description: |
    structured outputs for llm

extra:
  recipe-maintainers:
    - moritzwilksch
    - philippjfr

#### CFE metadata AND comments
