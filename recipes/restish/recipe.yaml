# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.1"

package:
  name: restish
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/restish/restish-${{ version }}.tar.gz
  sha256: ec7a8ada662041d23840a1fba0c6d4f73b8bf554b202b47d91c2681d09404947

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - restish
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://ish.io/projects/show/restish
  license: BSD-3-Clause
  license_file: LICENSE
  summary: WSGI framework/library for building resource- and rest- oriented web sites
  description: |
    WSGI framework/library for building resource- and rest- oriented web sites

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
