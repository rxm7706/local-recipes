# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.6.1"

package:
  name: flask-socketio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-SocketIO/flask_socketio-${{ version }}.tar.gz
  sha256: fe5bd995c3ed4da9a98f335d0d830fa1a19d84a64789f6265642a671fdacaeac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - blinker
    - click
    - flask >=2.1.0
    - jinja2
    - python-socketio >=5.12.0
    - werkzeug

tests:
  - python:
      imports:
        - flask_socketio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miguelgrinberg/flask-socketio
  license: MIT
  license_file: LICENSE
  summary: Socket.IO integration for Flask applications
  description: |
    Socket.IO integration for Flask applications

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors
    - jan-janssen

