# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.3"

package:
  name: kuzu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kuzu/kuzu-${{ version }}.tar.gz
  sha256: e7bea3ca30c4bb462792eedcaa7f2125c800b243bb4a872e1eedc16917c1967a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kuzu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://kuzudb.com/
  license: MIT
  license_file: LICENSE
  summary: Highly scalable, extremely fast, easy-to-use embeddable graph database
  description: |
    Highly scalable, extremely fast, easy-to-use embeddable graph database
  repository: https://github.com/kuzudb/kuzu
  documentation: https://docs.kuzudb.com/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
