# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.1"

package:
  name: certvalidator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certvalidator/certvalidator-${{ version }}.tar.gz
  sha256: 922d141c94393ab285ca34338e18dd4093e3ae330b1f278e96c837cb62cffaad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - asn1crypto
    - oscrypto

tests:
  - python:
      imports:
        - certvalidator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wbond/certvalidator
  license: MIT
  license_file: LICENSE
  summary: Validates X.509 certificates and paths
  description: |
    Validates X.509 certificates and paths

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: certvalidator
  cfe-upstream-registry: pypi
  cfe-upstream-name: certvalidator
  cfe-purls:
    - pkg:conda/certvalidator@${{ version }}?channel=conda-forge
    - pkg:pypi/certvalidator@${{ version }}
  cfe-upstream-repo: https://github.com/wbond/certvalidator
  cfe-upstream-homepage: https://github.com/wbond/certvalidator
  cfe-import-names: [certvalidator]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:50:10Z
