# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.3"

package:
  name: zeep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zeep/zeep-${{ version }}.tar.gz
  sha256: 99d5059f92f721020998695fd9c85289ccb03ec5a2398ad49c6dbe43f19cfb94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
    - wheel
  run:
    - python >=${{ python_min }}
    - attrs >=17.2.0
    - isodate >=0.5.4
    - lxml >=4.6.0
    - platformdirs >=1.4.0
    - requests >=2.7.0
    - requests-toolbelt >=0.7.1
    - requests-file >=1.5.1

tests:
  - python:
      imports:
        - zeep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/zeep/
  license: MIT
  license_file: LICENSE
  summary: A Python SOAP client
  description: |
    A Python SOAP client
  repository: https://github.com/mvantellingen/python-zeep
  documentation: https://docs.python-zeep.org

extra:
  recipe-maintainers:
    - adament
    - Cadair

#### CFE metadata AND comments
