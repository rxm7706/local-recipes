# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: configparser-crypt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/configparser-crypt/configparser_crypt-${{ version }}.tar.gz
  sha256: ab5534783ae9c439a96054949f8193a9fb0c3aa0d055641fb77feb9ede62ec25

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptidy

tests:
  - python:
      imports:
        - configparser_crypt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/netinvent/configparser_crypt
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Drop-in replacement for ConfigParser with encryption support
  description: |
    Drop-in replacement for ConfigParser with encryption support

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
