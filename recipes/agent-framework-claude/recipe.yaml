# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0b260813"

package:
  name: agent-framework-claude
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-claude/agent_framework_claude-${{ version }}.tar.gz
  sha256: 2fe87be823fb37426982fd5771e1a93a0cb299c69828d16244c87f0ea1cbaa8b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4.0
  run:
    - python >=${{ python_min }}
    - agent-framework-core >=1.13.0,<2
    - claude-agent-sdk >=0.1.46,<0.3

tests:
  - python:
      imports:
        - agent_framework_claude
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://aka.ms/agent-framework
  license: MIT
  license_file: LICENSE
  summary: Claude Agent SDK integration for Microsoft Agent Framework.
  description: |
    Claude Agent SDK integration for Microsoft Agent Framework.
  repository: https://github.com/microsoft/agent-framework/tree/main/python

extra:
  recipe-maintainers:
    - killua156
    - mgorny

