# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20220304"

package:
  name: libpff-python-ratom
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/libpff-python-ratom/libpff-python-ratom-${{ version }}.tar.gz
  sha256: 76aecf5caba03be36aada7f9ae6c75a2f1f3cee066703f8561f0d7303e8fc7b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - libpff_python_ratom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/libyal/libpff/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python bindings module for libpff
  description: |
    Python bindings module for libpff

extra:
  recipe-maintainers:
    - rxm7706

