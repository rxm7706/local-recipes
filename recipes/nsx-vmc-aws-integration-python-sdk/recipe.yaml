# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: nsx-vmc-aws-integration-python-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nsx-vmc-aws-integration-python-sdk/nsx-vmc-aws-integration-python-sdk-${{ version }}.tar.gz
  sha256: eaf4f36f6aa352331b184cc5d63ef488ef27cb27330ed9f2039efaa77a890522

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nsx_vmc_aws_integration_python_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/vsphere-automation-sdk-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: nsx-vmc-aws-integration-python-sdk
  description: |
    nsx-vmc-aws-integration-python-sdk

extra:
  recipe-maintainers:
    - rxm7706

