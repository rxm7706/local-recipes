# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: python-bsonjs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-bsonjs/python_bsonjs-${{ version }}.tar.gz
  sha256: ff8f3f0b48177b07b7dc082314352745db04b4a77c2f27e2b368838ed75c9099

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65
  run:
    - python >=${{ python_min }}
    - python-bsonjs

tests:
  - python:
      imports:
        - python_bsonjs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mongodb-labs/python-bsonjs
  license: Apache-2.0
  license_file: LICENSE
  summary: A library for converting between BSON and JSON.
  description: |
    A library for converting between BSON and JSON.

extra:
  recipe-maintainers:
    - rxm7706

