# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cleanco
  version: "2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/cleanco-${{ version }}.tar.gz
  sha256: f16717234c1936866233283efc1387702dada7103fee8a6e712ca7caee2d182d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python >=3.7
  run:
    - python >=3.7

tests:
  - python:
      imports:
        - cleanco
      pip_check: true

about:
  summary: Python library to process company names
  license: MIT
  # License file manually packaged. See https://github.com/psolin/cleanco/pull/74
  license_file: LICENSE.txt
  homepage: https://github.com/psolin/cleanco

extra:
  recipe-maintainers:
    - izahn
