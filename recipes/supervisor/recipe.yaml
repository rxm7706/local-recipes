# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: supervisor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/supervisor/supervisor-${{ version }}.tar.gz
  sha256: 4a2bf149adf42997e1bb44b70c43b613275ec9852c3edacca86a9166b27e945e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - supervisor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://supervisord.org/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A system for controlling process state under UNIX
  description: |
    A system for controlling process state under UNIX
  documentation: http://supervisord.org

extra:
  recipe-maintainers:
    - kalefranz
    - sodre
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: supervisor
  cfe-upstream-registry: pypi
  cfe-upstream-name: supervisor
  cfe-purls:
    - pkg:conda/supervisor@${{ version }}?channel=conda-forge
    - pkg:pypi/supervisor@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://supervisord.org/
  cfe-import-names: [supervisor]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/supervisor-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T12:24:06Z
