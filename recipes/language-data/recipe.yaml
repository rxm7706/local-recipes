    - pkg:pypi/language-data@${{ version }}
  cfe-upstream-repo: https://github.com/georgkrause/language_data
  cfe-upstream-homepage: https://github.com/georgkrause/language_data
  cfe-import-names: [language_data]
  cfe-source-kind: pypi-sdist
