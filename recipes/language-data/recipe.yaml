# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: language-data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/language-data/language_data-${{ version }}.tar.gz
  sha256: 800e6457e7beda781c156e02d7707e38db2ded026472e07e2c055dc8446ee574

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
    - setuptools-scm >=8.0
  run:
    - python >=${{ python_min }}
    - marisa-trie >=1.1.0

tests:
  - python:
      imports:
        - language_data
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/georgkrause/language_data
  license: MIT
  license_file: LICENSE
  summary: Supplementary data about languages used by the langcodes module
  description: |
    Supplementary data about languages used by the langcodes module
  repository: https://github.com/georgkrause/language_data

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: language-data
  cfe-upstream-registry: pypi
  cfe-upstream-name: language-data
