# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2.1"

package:
  name: urwid-mitmproxy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urwid-mitmproxy/urwid-mitmproxy-${{ version }}.tar.gz
  sha256: be6238e587acb92bdd43b241af0a10dc23798e8cf3eddef834164eb637686cda

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - urwid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mitmproxy/urwid-mitmproxy
  license: MIT
  license_file: LICENSE
  summary: A full-featured console (xterm et al.) user interface library
  description: |
    A full-featured console (xterm et al.) user interface library

extra:
  recipe-maintainers:
    - rxm7706

