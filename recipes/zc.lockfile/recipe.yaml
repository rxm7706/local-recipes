# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: zc.lockfile
  version: "4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/zc_lockfile-${{ version }}.tar.gz
  sha256: d3ab0f53974296a806db3219b9191ba0e6d5cbbd1daa2e0d17208cb9b29d2102

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  preserve_egg_dir: true

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zc
        - zc.lockfile
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Basic inter-process locks
  homepage: https://github.com/zopefoundation/zc.lockfile
  repository: https://github.com/zopefoundation/zc.lockfile

extra:
  recipe-maintainers:
    - carlodri
