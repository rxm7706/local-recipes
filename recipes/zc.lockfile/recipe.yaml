# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0"

package:
  name: zc.lockfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zc.lockfile/zc_lockfile-${{ version }}.tar.gz
  sha256: d3ab0f53974296a806db3219b9191ba0e6d5cbbd1daa2e0d17208cb9b29d2102

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zc.lockfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zc.lockfile
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Basic inter-process locks
  description: |
    Basic inter-process locks

extra:
  recipe-maintainers:
    - carlodri

#### CFE metadata AND comments
