# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.10"

package:
  name: behave-html-formatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/behave-html-formatter/behave-html-formatter-${{ version }}.tar.gz
  sha256: c5a9ad3edcac7be5766b14aacce46794885c749c4741fc93f8fc3a4bf2a891aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - behave

tests:
  - python:
      imports:
        - behave_html_formatter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/behave-contrib/behave-html-formatter
  license: GPL-3.0-only
  license_file: LICENSE
  summary: HTML formatter for Behave
  description: |
    HTML formatter for Behave

extra:
  recipe-maintainers:
    - rxm7706

