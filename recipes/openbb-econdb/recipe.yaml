# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: openbb-econdb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-econdb/openbb_econdb-${{ version }}.tar.gz
  sha256: a380f05c507e8437a5699a3dccfeaa0b44efd4ddaee7154b48766b107077ba2b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp-client-cache <0.12.0,>=0.11.0
    - aiosqlite <0.21.0,>=0.20.0
    - openbb-core <2.0.0,>=1.6.10

tests:
  - python:
      imports:
        - openbb_econdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-econdb/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: EconDB extension for OpenBB
  description: |
    EconDB extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
