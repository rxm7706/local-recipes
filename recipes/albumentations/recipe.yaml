# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.8"

package:
  name: albumentations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/albumentations/albumentations-${{ version }}.tar.gz
  sha256: 4da95e658e490de3c34af8fcdffed09e36aa8a4edd06ca9f9e7e3ea0b0b16856

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - numpy >=1.24.4
    - scipy >=1.10.0
    - pyyaml
    - typing_extensions >=4.9.0
    - pydantic >=2.9.2
    - albucore ==0.0.24
    - eval_type_backport
    - opencv >=4.9.0.80

tests:
  - python:
      imports:
        - albumentations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://albumentations.ai
  license: MIT
  license_file: LICENSE
  summary: Fast, flexible, and advanced augmentation library for deep learning, computer vision, and medical imaging. Albumentations offers a wide range of transformations for both 2D (images, masks, bboxes, keypoints) and 3D (volumes, volumetric masks, keypoints) data, with optimized performance and seamless integration into ML workflows.
  description: |
    Fast, flexible, and advanced augmentation library for deep learning, computer vision, and medical imaging. Albumentations offers a wide range of transformations for both 2D (images, masks, bboxes, keypoints) and 3D (volumes, volumetric masks, keypoints) data, with optimized performance and seamless integration into ML workflows.

extra:
  recipe-maintainers:
    - mukhery
    - mdraw
    - albu
    - creafz
    - ternaus
    - BloodAxe

