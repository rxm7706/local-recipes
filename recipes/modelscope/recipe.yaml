# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: modelscope
  version: "1.37.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # The one on PyPI doesn't include setup.py.
  url: https://github.com/${{ name }}/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1abcf3ca791fb6b10b3d0b5cd89ab2cbe408e6687b7425c4293c1d16d84572ae

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - modelscope = modelscope.cli.cli:run_cmd

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - filelock
    - requests >=2.25
    - tqdm >=4.64.0
  run:
    # We just include hub by default
    - python >=${{ python_min }}
    - filelock  # Prevent import error
    - requests >=2.25
    - tqdm >=4.64.0
    - urllib3 >=1.26

tests:
  - python:
      imports:
        - modelscope
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - modelscope --help

about:
  summary: "ModelScope: bring the notion of Model-as-a-Service to life."
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/modelscope/modelscope

extra:
  recipe-maintainers:
    - shermansiu
