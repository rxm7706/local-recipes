# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mdutils
  version: "1.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mdutils-${{ version }}.tar.gz
  sha256: cdce6bde79822a7fea3c8fd6426cea0acfadd0f94ee3d3ebfa09aa38b561af35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mdutils
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Useful package for creating Markdown files while executing python code.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/didix21/mdutils
  repository: https://github.com/didix21/mdutils

extra:
  recipe-maintainers:
    - ocefpaf
