# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: mdutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mdutils/mdutils-${{ version }}.tar.gz
  sha256: cdce6bde79822a7fea3c8fd6426cea0acfadd0f94ee3d3ebfa09aa38b561af35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mdutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/didix21/mdutils
  license: MIT
  license_file: LICENSE.txt
  summary: Useful package for creating Markdown files while executing python code.
  description: |
    Useful package for creating Markdown files while executing python code.
  repository: https://github.com/didix21/mdutils
  documentation: http://mdutils.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
