# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.1"

package:
  name: hypothesis-jsonschema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hypothesis-jsonschema/hypothesis-jsonschema-${{ version }}.tar.gz
  sha256: f4ac032024342a4149a10253984f5a5736b82b3fe2afb0888f3834a31153f215

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - hypothesis >=6.84.3
    - jsonschema >=4.18.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hypothesis_jsonschema
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Tools to generate test data from JSON schemata with Hypothesis
  homepage: https://pypi.org/project/hypothesis-jsonschema/
  repository: https://github.com/python-jsonschema/hypothesis-jsonschema

extra:
  recipe-maintainers:
    - bollwyvl
