# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: see
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/see/see-${{ version }}.tar.gz
  sha256: 14f8f8a88a909a7d7dea81f0016e3fdfabd3b5d335992e102a382e1a71672bd1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - see
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ljcooke.github.io/see/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: dir for humans
  description: |
    dir for humans

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
