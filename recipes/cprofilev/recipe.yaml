# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: cprofilev
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/CProfileV/CProfileV-${{ version }}.tar.gz
  sha256: 8791748b1f3d3468c2c927c3fd5f905080b84d8f2d217ca764b7d9d7a1fb9a77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cprofilev
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ymichael/cprofilev
  license: MIT
  license_file: LICENSE
  summary: An easier way to use cProfile
  description: |
    An easier way to use cProfile

extra:
  recipe-maintainers:
    - rxm7706

