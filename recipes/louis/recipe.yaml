# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3"

package:
  name: louis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/louis/louis-1.3.zip
  sha256: 65def99849946d741a40624d34b528310cca9888e3a94aea0ede17d7ecf1cf62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - louis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://louis.com
  license: MIT
  license_file: LICENSE
  summary: A simple louis .py file
  description: |
    A simple louis .py file

extra:
  recipe-maintainers:
    - rxm7706

