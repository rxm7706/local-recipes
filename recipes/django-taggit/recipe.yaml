# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.0"

package:
  name: django-taggit
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/d/django-taggit/django_taggit-${{ version }}.tar.gz
  sha256: c4d1199e6df34125dd36db5eb0efe545b254dec3980ce5dd80e6bab3e78757c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.5
    - pip
  run:
    - python >=3.5
    - django >=1.11

tests:
  - python:
      imports:
        - taggit
        - taggit.migrations
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: django-taggit is a reusable Django application for simple tagging.
  homepage: http://github.com/alex/django-taggit/tree/master

extra:
  recipe-maintainers:
    - kwilcox
    - marcelotrevisani
