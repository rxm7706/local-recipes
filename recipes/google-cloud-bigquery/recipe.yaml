# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.43.0"

package:
  name: google-cloud-bigquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-bigquery/google_cloud_bigquery-${{ version }}.tar.gz
  sha256: e3dc25ab9ac8b2b089408493177d4d4508b098c80c3931786fbc20b075298fe6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.28.0
    - google-auth <3.0.0,>=2.14.1
    - google-cloud-core <3.0.0,>=2.4.1
    - google-resumable-media <3.0.0,>=2.0.0
    - packaging >=24.2.0
    - python-dateutil <3.0.0,>=2.8.2
    - requests <3.0.0,>=2.21.0

tests:
  - python:
      imports:
        - google.cloud.bigquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/google-cloud-bigquery/
  license: Apache-2.0
  license_file: LICENSE
  summary: Google BigQuery API client library
  description: |
    Google BigQuery API client library
  repository: https://github.com/googleapis/python-bigquery

extra:
  recipe-maintainers:
    - chalmerlowe
    - xylar
    - parthea
    - tswast

