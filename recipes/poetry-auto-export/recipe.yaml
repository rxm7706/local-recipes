# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: poetry-auto-export
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/poetry-auto-export/poetry_auto_export-${{ version }}.tar.gz
  sha256: 3a5f80aae512b02939143504a5620297d6babfdf94130c162af3811f17fc186c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - poetry <3.0.0,>=1.6.0
    - poetry-plugin-export <2.0.0,>=1.6.0

tests:
  - python:
      imports:
        - poetry_auto_export
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/poetry-auto-export/
  license: MIT
  license_file: LICENSE
  summary: Automatically create requirements.txt on every poetry lock
  description: |
    Automatically create requirements.txt on every poetry lock
  repository: https://github.com/Ddedalus/poetry-auto-export

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: poetry-auto-export
