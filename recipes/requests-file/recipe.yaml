# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: requests-file
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-file/requests_file-${{ version }}.tar.gz
  sha256: f14243d7796c588f3521bd423c5dea2ee4cc730e54a3cac9574d78aca1272576

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - requests >=1.0.0

tests:
  - python:
      imports:
        - requests_file
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://codeberg.org/dashea/requests-file
  license: Apache-2.0
  license_file: LICENSE
  summary: File transport adapter for Requests
  description: |
    File transport adapter for Requests

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
