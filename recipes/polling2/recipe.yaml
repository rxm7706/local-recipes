# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: polling2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/polling2/polling2-${{ version }}.tar.gz
  sha256: 90b7da82cf7adbb48029724d3546af93f21ab6e592ec37c8c4619aedd010e342

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - pytest-runner
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - polling2
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Updated polling utility with many configurable options
  license: MIT
  license_file: LICENSE.md
  homepage: http://github.com/ddmee/polling2

extra:
  recipe-maintainers:
    - bollwyvl
