# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.0.0"

package:
  name: typing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typing/typing-${{ version }}.tar.gz
  sha256: 13b4ad211f54ddbf93e5901a9967b1e07720c1d1b78d596ac6a439641aa1b130

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - typing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.python.org/3/library/typing.html
  license: PSF
  license_file: LICENSE
  summary: Type Hints for Python
  description: |
    Type Hints for Python
  repository: https://github.com/python/typing

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf

#### CFE metadata AND comments
