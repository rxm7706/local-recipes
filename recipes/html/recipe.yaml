# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.16"

package:
  name: html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/html/html-${{ version }}.tar.gz
  sha256: ebc768f23b54a71350d731a75f2ef3a4a4dbdad9ae68d58b527664b66088e456

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/html
  license: MIT
  license_file: LICENSE
  summary: simple, elegant HTML, XHTML and XML generation
  description: |
    simple, elegant HTML, XHTML and XML generation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: html
  cfe-upstream-registry: pypi
  cfe-upstream-name: html
  cfe-purls:
    - pkg:conda/html@${{ version }}?channel=conda-forge
    - pkg:pypi/html@${{ version }}
  cfe-upstream-repo: http://pypi.python.org/pypi/html
  cfe-upstream-homepage: http://pypi.python.org/pypi/html
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
