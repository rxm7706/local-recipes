# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.23.0"

package:
  name: google-cloud-bigquery-datatransfer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-bigquery-datatransfer/google_cloud_bigquery_datatransfer-${{ version }}.tar.gz
  sha256: 2d0100a93f6e89a115d668d4fc2abc0f0c223ea099f5b7c736bce0102ba623f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8

tests:
  - python:
      imports:
        - google.cloud.bigquery_datatransfer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-bigquery-datatransfer
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Bigquery Datatransfer API client library
  description: |
    Google Cloud Bigquery Datatransfer API client library

extra:
  recipe-maintainers:
    - parthea
    - xylar

