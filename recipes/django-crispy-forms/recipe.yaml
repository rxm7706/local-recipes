# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7"

package:
  name: django-crispy-forms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-crispy-forms/django_crispy_forms-${{ version }}.tar.gz
  sha256: 4c59bed60417375cba26cebb2c67ab350b655934670270b1c89dbcd7e60f1b4c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - django >=5.2

tests:
  - python:
      imports:
        - crispy_forms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django-crispy-forms/django-crispy-forms
  license: MIT
  license_file: LICENSE.txt
  summary: Best way to have Django DRY forms
  description: |
    Best way to have Django DRY forms

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - smithdc1

#### CFE metadata AND comments
