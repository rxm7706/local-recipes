# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: wheel-stub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/w/wheel-stub/wheel_stub-0.5.0-py3-none-any.whl
  sha256: debb507277eb5793dcfa8e92f1f41ba4b93f7db05035725b5780cb6bcb444f3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wheel_stub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/wheel-stub/
  license: Apache-2.0
  license_file: LICENSE
  summary: wheel stub package build backend
  description: |
    wheel stub package build backend

extra:
  recipe-maintainers:
    - rxm7706

