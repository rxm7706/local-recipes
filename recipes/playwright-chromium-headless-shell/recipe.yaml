# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "153.0.8010.12"
  revision: "1243"

package:
  name: playwright-chromium-headless-shell
  version: ${{ version }}

source:
  url: https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-headless-shell-linux64.zip
  sha256: a9da028861a0cf789ff25c2fed45f5f1aaf969ed9247835b6a7821a4f7af9d1d
  # Extract under src/ so the build copies ONLY upstream content -- rattler-build
  # also drops conda_build.sh / build_env.sh in the work dir, and `cp -a ./*`
  # would sweep them into the package.
  target_directory: src

build:
  number: 0
  # linux-64 only: the archive is a linux x86-64 build, and this is the only
  # platform the estate drives. Other subdirs need their own source URL.
  skip:
    - not (linux and x86_64)
  dynamic_linking:
    # MUST stay false. These are large prebuilt binaries carrying embedded
    # resources (PAK bundles, V8 snapshots, ICU data) at fixed offsets;
    # rewriting ELF sections to patch RPATH shifts those offsets and the
    # binary segfaults at launch. Nothing here needs relocating -- the
    # binaries resolve against host system libraries, exactly as they do
    # under `playwright install`.
    binary_relocation: false
  script:
    - if: unix
      then: |
        set -ex
        DEST="${PREFIX}/share/ms-playwright/chromium_headless_shell-1243"
        # rattler-build STRIPS a single top-level directory when it extracts an
        # archive, so src/ holds that root's CONTENTS for chromium / headless
        # shell / firefox, and holds the entries themselves for the multi-root
        # webkit and ffmpeg archives. Re-creating the inner directory here makes
        # both shapes land where Playwright looks, without depending on whether
        # the strip happened.
        mkdir -p "${DEST}/chrome-headless-shell-linux64"
        cp -a src/. "${DEST}/chrome-headless-shell-linux64/"
        # Playwright treats a browser directory WITHOUT this marker as not
        # installed and re-downloads over it. Creating it is what makes the
        # conda-provided browser count as a real install.
        touch "${DEST}/INSTALLATION_COMPLETE"

requirements:
  run:
    - playwright-browsers-base
    # Built against Ubuntu's glibc; the binaries link the host's system
    # libraries rather than conda's, so declare the floor rather than pull a
    # parallel library stack in beside the system one.
    - __glibc >=2.35
  run_constraints:
    # The revision is dictated by browsers.json INSIDE the playwright driver.
    # Pair a mismatched driver with this package and Playwright reports
    # "Executable doesn't exist ... run playwright install". Verified against
    # playwright 1.63.0 (node) and playwright-python 1.62.0, which both pin
    # chromium-headless-shell r1243.
    - playwright >=1.62,<1.64
    - playwright-python >=1.62,<1.64

tests:
  - package_contents:
      files:
        - share/ms-playwright/chromium_headless_shell-1243/INSTALLATION_COMPLETE
        - share/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
  - script:
      # Executing the binary is the point: a contents-only test would pass
      # on a relocation-corrupted binary that segfaults at launch.
      - test -x "${PREFIX}/share/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell"
      - '"${PREFIX}/share/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell" --version'
      - '"${PREFIX}/share/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell" --version | grep -F "Google Chrome for Testing 153.0.8010.12"'

about:
  homepage: https://playwright.dev/docs/browsers
  repository: https://github.com/microsoft/playwright
  documentation: https://playwright.dev/docs/browsers#managing-browser-binaries
  summary: Chrome Headless Shell 153.0.8010.12, laid out for Playwright (chromium r1243)
  description: |
    The headless-only Chrome for Testing shell, which Playwright uses for
    `chromium.launch(headless=True)`. This is the browser every headless
    workflow in this estate actually drives -- screenshot capture, the
    dashboard e2e/ARIA suite, and the wasm smoke test.

    Installed under `$CONDA_PREFIX/share/ms-playwright/chromium_headless_shell-1243/` with the
    `INSTALLATION_COMPLETE` marker Playwright looks for, so an environment
    carrying `playwright-browsers-base` resolves it with no network access
    and no `playwright install` step.
  license: LicenseRef-Google-Chrome-ToS
  license_file:
    - src/ABOUT
    - src/LICENSE.headless_shell

extra:
  recipe-maintainers:
    - rxm7706

