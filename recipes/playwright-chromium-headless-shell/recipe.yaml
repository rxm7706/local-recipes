# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "156.0.8078.4"
  revision: "1248"
  inner: ${{ "chrome-headless-shell-linux64" if linux else ("chrome-headless-shell-mac-arm64" if osx else "chrome-headless-shell-win64") }}

package:
  name: playwright-chromium-headless-shell
  version: ${{ version }}

# One archive per platform, at the revision browsers.json pins in the
# playwright driver line the estate runs (1.64.x; steward Story 130.1).
# Extract under src/ so the build copies ONLY upstream content -- rattler-build
# also drops conda_build.sh / build_env.sh in the work dir.
source:
  - if: linux and x86_64
    then:
      url: https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux64/chrome-headless-shell-linux64.zip
      sha256: c3e50596aef52c58f8fda3c6b3411c33d34c88b177b3ed1c2243359fd3b8ba20
      target_directory: src
  - if: osx and arm64
    then:
      url: https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/mac-arm64/chrome-headless-shell-mac-arm64.zip
      sha256: 94e4337b70cbc5638f0935fbc46b9f242bc7416f657e3fbe924baf348404b53d
      target_directory: src
  - if: win and x86_64
    then:
      url: https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/win64/chrome-headless-shell-win64.zip
      sha256: 5af4c82cf4b351ec4bad4c71dcf938af14fccea8a0eb0d5c2a7b49ccc922698c
      target_directory: src

build:
  number: 0
  # linux-64, osx-arm64 and win-64: the three platforms the estate drives.
  # Each needs its own archive, above; any other subdir has none.
  skip:
    - not ((linux and x86_64) or (osx and arm64) or (win and x86_64))
  dynamic_linking:
    # MUST stay false. These are large prebuilt binaries carrying embedded
    # resources at fixed offsets (and, on macOS, code signatures); rewriting
    # them to patch RPATH or install names corrupts them. Nothing here needs
    # relocating -- the binaries resolve against host system libraries,
    # exactly as they do under `playwright install`.
    binary_relocation: false
  prefix_detection:
    # Nothing in a browser build embeds the build prefix; scanning ~200 MB of
    # binaries for it only risks a false hit rewriting a signed file.
    ignore: true
  script:
    # The script runs on the BUILD host, so pick the shell by build_platform:
    # a win-64 package built from macOS still copies with the unix branch.
    - if: build_platform not in ["win-64", "win-arm64"]
      then: |
        set -ex
        DEST="${PREFIX}/share/ms-playwright/chromium_headless_shell-1248"
        # rattler-build STRIPS a single top-level directory when it extracts an
        # archive, so src/ holds that root's CONTENTS for chromium / headless
        # shell / firefox, and the entries themselves for the multi-root webkit
        # and ffmpeg archives. Re-creating the inner directory here makes both
        # shapes land where Playwright looks.
        mkdir -p "${DEST}/${{ inner }}"
        cp -a src/. "${DEST}/${{ inner }}"/
        # Playwright treats a browser directory WITHOUT this marker as not
        # installed and re-downloads over it.
        touch "${DEST}/INSTALLATION_COMPLETE"
      else: |
        set "DEST=%PREFIX%\share\ms-playwright\chromium_headless_shell-1248"
        mkdir "%DEST%\${{ inner }}"
        xcopy /E /I /Q /Y /H "src" "%DEST%\${{ inner }}"
        if errorlevel 1 exit /b 1
        type nul > "%DEST%\INSTALLATION_COMPLETE"

requirements:
  run:
    - playwright-browsers-base
    # The binaries link the host's system libraries rather than conda's, so
    # declare the host floor rather than pull a parallel library stack in.
    # glibc floor = the highest GLIBC_2.x symbol version the linux build references (measured 2026-11-21).
    - if: linux
      then: __glibc >=2.25
    - if: osx
      then: __osx >=14
  run_constraints:
    # The revision is dictated by browsers.json INSIDE the playwright (Node)
    # driver; playwright-python drives that same driver. A mismatched driver
    # reports "Executable doesn't exist ... run playwright install". Verified
    # against playwright 1.64.0 and 1.64.1, which both pin chromium_headless_shell r1248.
    - playwright >=1.64,<1.65

tests:
  - if: linux
    then:
      package_contents:
        files:
          - share/ms-playwright/chromium_headless_shell-1248/INSTALLATION_COMPLETE
          - "share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-linux64/chrome-headless-shell"
  - if: osx
    then:
      package_contents:
        files:
          - share/ms-playwright/chromium_headless_shell-1248/INSTALLATION_COMPLETE
          - "share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell"
  - if: win
    then:
      package_contents:
        files:
          - share/ms-playwright/chromium_headless_shell-1248/INSTALLATION_COMPLETE
          - "share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-win64/chrome-headless-shell.exe"
  - if: linux
    then:
      script:
        - test -x "${PREFIX}/share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-linux64/chrome-headless-shell"
        - '"${PREFIX}/share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-linux64/chrome-headless-shell" --version | grep -F "156.0.8078.4"'
  - if: osx
    then:
      script:
        - test -x "${PREFIX}/share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell"
        - '"${PREFIX}/share/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell" --version | grep -F "156.0.8078.4"'

about:
  homepage: https://playwright.dev/docs/browsers
  repository: https://github.com/microsoft/playwright
  documentation: https://playwright.dev/docs/browsers#managing-browser-binaries
  summary: Chrome Headless Shell 156.0.8078.4, laid out for Playwright (chromium r1248)
  description: |
    The headless-only Chrome for Testing shell, which Playwright uses for
    `chromium.launch(headless=True)`. This is the browser every headless
    workflow in this estate actually drives -- screenshot capture, the
    dashboard e2e/ARIA suite, and the wasm smoke test.

    Installed under `$CONDA_PREFIX/share/ms-playwright/chromium_headless_shell-1248/` with the
    `INSTALLATION_COMPLETE` marker Playwright looks for, so an environment
    carrying `playwright-browsers-base` resolves it with no network access
    and no `playwright install` step.
  license: LicenseRef-Google-Chrome-ToS
  license_file:
    - src/ABOUT
    - src/LICENSE.headless_shell

extra:
  recipe-maintainers:
    - rxm7706

