# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: ipytree
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipytree/ipytree-${{ version }}.tar.gz
  sha256: d53d739bbaaa45415733cd06e0dc420a2af3d173438617db472a517bc7a61e56

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - jupyter-packaging ~=0.7.0
    - jupyterlab ==3.*
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - ipywidgets

tests:
  - python:
      imports:
        - ipytree
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/martinRenou/ipytree
  license: MIT
  license_file: LICENSE
  summary: A Tree Widget using jsTree
  description: |
    A Tree Widget using jsTree

extra:
  recipe-maintainers:
    - martinRenou

#### CFE metadata AND comments
