# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ipytree
  version: "0.2.2"
  sha256: d53d739bbaaa45415733cd06e0dc420a2af3d173438617db472a517bc7a61e56

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - jupyter-packaging
    - pip
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6.0,<9

tests:
  - python:
      imports:
        - ipytree
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - if: unix
        then: test -f ${PREFIX}/share/jupyter/nbextensions/${{ name }}/extension.js
      - if: unix
        then: test -f ${PREFIX}/share/jupyter/nbextensions/${{ name }}/index.js
      - if: unix
        then: test -f ${PREFIX}/share/jupyter/labextensions/${{ name }}/package.json
      - if: win
        then: if not exist %PREFIX%\\share\\jupyter\\nbextensions\\${{ name }}\\extension.js (exit 1)
      - if: win
        then: if not exist %PREFIX%\\share\\jupyter\\nbextensions\\${{ name }}\\index.js (exit 1)
      - if: win
        then: if not exist %PREFIX%\\share\\jupyter\\labextensions\\${{ name }}\\package.json (exit 1)

about:
  license: MIT
  license_file: LICENSE
  summary: A Jupyter Notebook Tree Widget using jsTree
  homepage: http://github.com/QuantStack/ipytree
  repository: https://github.com/QuantStack/ipytree

extra:
  recipe-maintainers:
    - martinRenou
