# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.18.0"

package:
  name: rasa-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rasa-sdk/rasa_sdk-${{ version }}.tar.gz
  sha256: c978117d775b01242ceabb13287dbac385969ab86c3ed99eaaa01027f9e6a96a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.4
  run:
    - python >=${{ python_min }}
    - sanic-cors <3.0.0,>=2.0.0
    - coloredlogs <16,>=10
    - grpcio <1.81.0,>=1.80.0
    - grpcio-health-checking <1.67.0,>=1.66.2
    - grpcio-tools <1.67.0,>=1.66.2
    - opentelemetry-api <1.34.0,>=1.33.0
    - opentelemetry-exporter-otlp <1.34.0,>=1.33.0
    - opentelemetry-sdk <1.34.0,>=1.33.0
    - pluggy <2.0.0,>=1.0.0
    - protobuf <5.30.0,>=5.29.5
    - pydantic <2.14.0,>=2.13.4
    - ruamel.yaml <0.20.0,>=0.19.1
    - sanic <23.0,>=22.12
    - typing_extensions <4.16.0,>=4.15.0
    - websockets <16,>=10.0

tests:
  - python:
      imports:
        - rasa_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://rasa.com
  license: Apache-2.0
  license_file: LICENSE
  summary: "Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants"
  description: |
    Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants
  repository: https://github.com/rasahq/rasa-sdk
  documentation: https://rasa.com/docs

extra:
  recipe-maintainers:
    - rxm7706

