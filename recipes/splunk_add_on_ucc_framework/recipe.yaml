# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.5.3"

package:
  name: splunk_add_on_ucc_framework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splunk_add_on_ucc_framework/splunk_add_on_ucc_framework-${{ version }}.tar.gz
  sha256: 8e101e050d41d53ab7fe3cb9273ff3fb47ed4dd117bee175dcafc9ccd603053d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.0.2
  run:
    - python >=${{ python_min }}
    - jinja2 <4,>=3.1.6
    - addonfactory-splunk-conf-parser-lib <2.0.0,>=1.0.0
    - dunamai <2.0.0,>=1.22.0
    - jsonschema <5.0.0,>=4.25.0
    - pyyaml <7.0,>=6.0
    - defusedxml <0.8.0,>=0.7.1
    - colorama <0.5.0,>=0.4.6
    - packaging >=25.0
    - certifi <2027.0.0,>=2026.0.0

tests:
  - python:
      imports:
        - splunk_add_on_ucc_framework
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/splunk/addonfactory-ucc-generator
  license: Apache-2.0
  license_file: LICENSE
  summary: Splunk Add-on SDK formerly UCC is a build and code generation framework
  description: |
    Splunk Add-on SDK formerly UCC is a build and code generation framework
  repository: https://github.com/splunk/addonfactory-ucc-generator
  documentation: https://splunk.github.io/addonfactory-ucc-generator

extra:
  recipe-maintainers:
    - rxm7706

