# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: django-webserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-webserver/django-webserver-${{ version }}.tar.gz
  sha256: c976979d15b5ff9a212f7904d3b779e22219aebb4857860fcaf20e4e40f1da40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - django_webserver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lincolnloop/django-webserver
  license: MIT
  license_file: LICENSE
  summary: Django management commands for production webservers
  description: |
    Django management commands for production webservers

extra:
  recipe-maintainers:
    - rxm7706

