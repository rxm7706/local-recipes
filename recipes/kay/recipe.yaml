# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: kay
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/k/kay/kay-0.1.2-py3-none-any.whl
  sha256: 911cf8e7734b54f8e5aadd29b24c971e3ccd8f4ae433d932dc5b306af6981c03

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2

tests:
  - python:
      imports:
        - kay
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/kay/
  license: MIT
  license_file: LICENSE
  summary: Data API for Context Retrieval
  description: |
    Data API for Context Retrieval

extra:
  recipe-maintainers:
    - rxm7706

