# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0"

package:
  name: pyprolog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyprolog/pyprolog-${{ version }}.tar.gz
  sha256: 289835a67ae7d780228df7cdfc011c4ac2ac75b323316880cb865e3388620833

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyprolog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyprolog/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

