# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.3"

package:
  name: coreapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coreapi/coreapi-${{ version }}.tar.gz
  sha256: 46145fcc1f7017c076a2ef684969b641d18a2991051fddec9458ad3f78ffc1cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - coreapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/core-api/python-client
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python client library for Core API.
  description: |
    Python client library for Core API.

extra:
  recipe-maintainers:
    - hadim

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: coreapi
  cfe-upstream-registry: pypi
  cfe-upstream-name: coreapi
  cfe-purls:
    - pkg:conda/coreapi@${{ version }}?channel=conda-forge
    - pkg:pypi/coreapi@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/core-api/python-client
  cfe-import-names: [coreapi]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/coreapi-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-17T07:18:13Z
