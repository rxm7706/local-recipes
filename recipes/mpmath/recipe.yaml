# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: mpmath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mpmath/mpmath-${{ version }}.tar.gz
  sha256: efd6d1b75f09d69524a67609949812668b28e81ecbfe0ab449ced8c13e92642e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mpmath
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mpmath.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python library for arbitrary-precision floating-point arithmetic
  description: |
    Python library for arbitrary-precision floating-point arithmetic
  repository: https://github.com/mpmath/mpmath
  documentation: http://mpmath.org/doc/current/

extra:
  recipe-maintainers:
    - asmeurer
    - msarahan
    - ocefpaf
    - scopatz

