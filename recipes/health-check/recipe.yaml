# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.1"

package:
  name: health-check
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/health-check/health-check-${{ version }}.tar.gz
  sha256: c2debda90e6ef0087c3c40a773ccfe6a917586d82a3340e84cd45362f2a9e822

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - gitpython
    - pyyaml
    - clinner

tests:
  - python:
      imports:
        - health_check
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PeRDy/health-check
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Health Check is an application that provides an API to check the health health_check of some parts and some utilities like ping requests. This application can works as standalone or included in a Django project.
  description: |
    Health Check is an application that provides an API to check the health health_check of some parts and some utilities like ping requests. This application can works as standalone or included in a Django project.

extra:
  recipe-maintainers:
    - rxm7706

