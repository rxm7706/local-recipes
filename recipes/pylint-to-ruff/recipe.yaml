# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: pylint-to-ruff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-to-ruff/pylint_to_ruff-${{ version }}.tar.gz
  sha256: d84f5fcc2eb55b6ba06c139584ca546d79ef1317def8780838bf6c1dc669f45d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylint_to_ruff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pylint-to-ruff/
  license: MIT
  license_file: LICENSE
  summary: Introspect a Pylint configuration and convert it to Ruff
  description: |
    Introspect a Pylint configuration and convert it to Ruff
  repository: https://github.com/akx/pylint-to-ruff
  documentation: https://github.com/akx/pylint-to-ruff#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
