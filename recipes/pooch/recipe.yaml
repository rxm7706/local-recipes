# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: pooch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pooch/pooch-${{ version }}.tar.gz
  sha256: de46729579b9857ffd3e741987a2f6d5e0e03219892c167c6578c0091fb511ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - platformdirs >=2.5.0
    - packaging >=20.0
    - requests >=2.19.0

tests:
  - python:
      imports:
        - pooch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pooch/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A friend to fetch your data files
  description: |
    A friend to fetch your data files
  repository: https://github.com/fatiando/pooch
  documentation: https://www.fatiando.org/pooch

extra:
  recipe-maintainers:
    - leouieda
    - dopplershift

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pooch
