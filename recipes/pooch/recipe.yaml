    - pkg:pypi/pooch@${{ version }}
  cfe-upstream-repo: https://github.com/fatiando/pooch
  cfe-upstream-homepage: https://pypi.org/project/pooch/
  cfe-import-names: [pooch]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pooch-feedstock
  cfe-forge-recipe-updates-needed: 
