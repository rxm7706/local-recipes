# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: msg-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msg-parser/msg_parser-${{ version }}.tar.gz
  sha256: 0de858d4fcebb6c8f6f028da83a17a20fe01cdce67c490779cf43b3b0162aa66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - olefile

tests:
  - python:
      imports:
        - msg_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vikramarsid/msg_parser
  license: BSD-3-Clause
  license_file: LICENSE
  summary: This module enables reading, parsing and converting Microsoft Outlook MSG E-Mail files.
  description: |
    This module enables reading, parsing and converting Microsoft Outlook MSG E-Mail files.

extra:
  recipe-maintainers:
    - rxm7706

