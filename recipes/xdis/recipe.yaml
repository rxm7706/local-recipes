# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.0"

package:
  name: xdis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xdis/xdis-${{ version }}.tar.gz
  sha256: e78e3e7a0e2d31ac64c084afc782a0a233da06ac05002c42a0e17000ac51dcaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xdis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rocky/python-xdis/
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python cross-version byte-code disassembler and marshal routines
  description: |
    Python cross-version byte-code disassembler and marshal routines

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
