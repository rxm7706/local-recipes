# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash-core-components
  filename: dash_core_components
  version: "2.0.0"
  sha256: c6733874af975e552f95a1398a16c2ee7df14ce43fa60bb3718a3c6e0b63ffee

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ filename }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ filename }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.6
    - setuptools
    - pip
  run:
    - python >=3.6
    - dash  >=2.0.0  # not listed in the setup.py, but imported in __init__.py

tests:
  - python:
      imports:
        - dash_core_components
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Dash UI core component suite
  homepage: https://plot.ly/dash
  repository: https://github.com/plotly/dash-core-components

extra:
  recipe-maintainers:
    - moorepants
