# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: english-words
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/english-words/english-words-${{ version }}.tar.gz
  sha256: e51d05607fe92ebf65047a2359e977c78a46aa16d1d92a3cba0bac3e34957d8e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - english_words
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwiens91/english-words-py
  license: MIT
  license_file: LICENSE
  summary: Generate sets of english words by combining different word lists
  description: |
    Generate sets of english words by combining different word lists

extra:
  recipe-maintainers:
    - rxm7706

