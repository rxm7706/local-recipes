# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0b1"

package:
  name: azure-mgmt-resource-templatespecs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-resource-templatespecs/azure_mgmt_resource_templatespecs-${{ version }}.tar.gz
  sha256: 0f9e739ab43db2ad870eae5df1b5c4bfa0500bbea1c6e58aa5e2e9c385facbc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - typing_extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core >=1.5.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Resource Templatespecs Management Client Library for Python
  description: |
    Microsoft Azure Resource Templatespecs Management Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

