# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: pytest-sugar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-sugar/pytest-sugar-${{ version }}.tar.gz
  sha256: 73b8b65163ebf10f9f671efab9eed3d56f20d2ca68bda83fa64740a92c08f65d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=6.2.0
    - termcolor >=2.1.0

tests:
  - python:
      imports:
        - pytest_sugar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Teemu/pytest-sugar
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pytest-sugar is a plugin for pytest that changes the default look and feel of pytest (e.g. progressbar, show tests that fail instantly).
  description: |
    pytest-sugar is a plugin for pytest that changes the default look and feel of pytest (e.g. progressbar, show tests that fail instantly).

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - ocefpaf

