# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: tblib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tblib/tblib-${{ version }}.tar.gz
  sha256: e9a652692d91bf4f743d4a15bc174c0b76afc750fe8c7b6d195cc1c1d6d2ccec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tblib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tblib/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Traceback serialization library.
  description: |
    Traceback serialization library.
  documentation: https://python-tblib.readthedocs.io/

extra:
  recipe-maintainers:
    - jrbourbeau
    - xhochy

