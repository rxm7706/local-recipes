# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7"

package:
  name: sirius-bio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/s/sirius-bio/sirius_bio-1.7-cp310-cp310-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
  sha256: 5bbfc3df01081d256e0d7b795dc0e4414abe037d76899ba5813671ce3fc68cf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sirius_bio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sirius-bio/
  license: MIT
  license_file: LICENSE
  summary: "SIRIUS: maximally divergent synonymous gene design with ILP/CP-SAT core "
  description: |
    SIRIUS: maximally divergent synonymous gene design with ILP/CP-SAT core 

extra:
  recipe-maintainers:
    - rxm7706

