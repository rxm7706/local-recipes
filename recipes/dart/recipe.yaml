# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: dart
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dart/dart-${{ version }}.tar.gz
  sha256: fdceb359ee781e7853186cfc39d061902fb2d2d8573f90430323a9ff784c2c06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dart
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/landakram/dart
  license: MIT
  license_file: LICENSE
  summary: Turn URL variables into models.
  description: |
    Turn URL variables into models.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dart
  cfe-upstream-registry: pypi
  cfe-upstream-name: dart
