# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.6"

package:
  name: netx-vis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netx-vis/netx_vis-${{ version }}.tar.gz
  sha256: ec4c0ed13a18b2499fda4912db58f1d1d8df458b406ee7a537768ddedc63692a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - networkx >=2.5
    - setuptools >=40.0

tests:
  - python:
      imports:
        - netx_vis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/olsihoxha/netx-vis
  license: MIT
  license_file: LICENSE
  summary: Convert NetworkX graphs to interactive HTML visualizations
  description: |
    Convert NetworkX graphs to interactive HTML visualizations
  repository: https://github.com/olsihoxha/netx-vis
  documentation: https://github.com/olsihoxha/netx-vis#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: netx-vis
