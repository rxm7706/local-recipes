# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: sqlformat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlformat/sqlformat-${{ version }}.tar.gz
  sha256: 36f21f56192fb5f660bd581d448313a4336fb77304bf2c69f984fd7527158398

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlformat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidNHK/sql-format
  license: MIT
  license_file: LICENSE
  summary: Tools for make SQL statement can accept argument and group together on run times
  description: |
    Tools for make SQL statement can accept argument and group together on run times

extra:
  recipe-maintainers:
    - rxm7706

