# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.1"

package:
  name: django-rest-framework-mongoengine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-rest-framework-mongoengine/django-rest-framework-mongoengine-${{ version }}.tar.gz
  sha256: cabb60f2b8ecf6ceaa13550b47dde0b8f2fe9b6f7b69be681e059cf31b51d729

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rest_framework_mongoengine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/umutbozkurt/django-rest-framework-mongoengine
  license: MIT
  license_file: LICENSE
  summary: MongoEngine support for Django Rest Framework.
  description: |
    MongoEngine support for Django Rest Framework.

extra:
  recipe-maintainers:
    - rxm7706

