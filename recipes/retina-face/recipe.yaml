# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: retina-face
  version: "0.0.18"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c93204fbee031dc5b0b19a5c9c1f9807497eb55c4d4b0adf8c704a02c1568dd1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - gdown >=3.10.1
    - numpy >=1.14.0
    - opencv >=3.4.4
    - pillow >=5.2.0
    - python >=${{ python_min }}
    - tensorflow >=1.9.0

tests:
  - python:
      imports:
        - retinaface
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: "RetinaFace: Deep Face Detection Framework in TensorFlow for Python"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/serengil/retinaface

extra:
  recipe-maintainers:
    - serengil
    - BastianZim
