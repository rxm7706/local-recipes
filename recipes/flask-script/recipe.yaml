# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.6"

package:
  name: flask-script
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Script/Flask-Script-${{ version }}.tar.gz
  sha256: 6425963d91054cfcc185807141c7314a9c5ad46325911bd24dcb489bd0161c65

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_script
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/smurfix/flask-script
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Scripting support for Flask
  description: |
    Scripting support for Flask

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
