# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: datashape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/DataShape/datashape-${{ version }}.tar.gz
  sha256: 2356ea690c3cf003c1468a243a9063144235de45b080b3652de4f3d44e57d783

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dateutil
    - multipledispatch
    - numpy

tests:
  - python:
      imports:
        - datashape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://datashape.readthedocs.org/en/latest/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A data description language.
  description: |
    A data description language.

extra:
  recipe-maintainers:
    - nehaljwani
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: datashape
