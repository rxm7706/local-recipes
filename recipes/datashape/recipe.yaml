    - pkg:pypi/datashape@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://datashape.readthedocs.org/en/latest/
  cfe-import-names: [datashape]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/datashape-feedstock
  cfe-forge-recipe-updates-needed: 
