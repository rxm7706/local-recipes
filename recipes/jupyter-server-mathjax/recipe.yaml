# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyter_server_mathjax
  version: "0.2.6"

package:
  name: ${{ name|lower|replace("_", "-") }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bb1e6b6dc0686c1fe386a22b5886163db548893a99c2810c36399e9c4ca23943

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - jupyter-packaging >=0.7.9
    - nodejs
    - pip
  run:
    - python >=${{ python_min }}
    - jupyter_server >=1.1,<3

tests:
  - python:
      imports:
        - jupyter_server_mathjax
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - jupyter server extension list 2>&1 | grep -ie "jupyter_server_mathjax.*OK"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: MathJax resources as a Jupyter Server Extension.
  homepage: https://github.com/jupyter-server/jupyter_server_mathjax/

extra:
  recipe-maintainers:
    - blink1073
    - fcollonval
