# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.6"

package:
  name: jupyter-server-mathjax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server-mathjax/jupyter_server_mathjax-${{ version }}.tar.gz
  sha256: bb1e6b6dc0686c1fe386a22b5886163db548893a99c2810c36399e9c4ca23943

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - jupyter-packaging >=0.10,<2
  run:
    - python >=${{ python_min }}
    - jupyter-server

tests:
  - python:
      imports:
        - jupyter_server_mathjax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: MathJax resources as a Jupyter Server Extension.
  description: |
    MathJax resources as a Jupyter Server Extension.

extra:
  recipe-maintainers:
    - blink1073
    - fcollonval

