# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: collectfast
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/Collectfast-${{ version }}.tar.gz
  sha256: 2f6abc8cab7ec5114a7a9a3660ab629ec142556957220aa82857dc9b4381490d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=2.2
    - django-storages >=1.6
    - typing-extensions

tests:
  - python:
      imports:
        - collectfast
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Faster Collectstatic
  license: MIT
  license_file: LICENSE
  description: |
    The fast collectstatic for Django projects with S3 as storage backend.
  homepage: https://github.com/antonagestam/collectfast/
  repository: https://github.com/jazzband/collectfast
  documentation: https://github.com/jazzband/collectfast

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706
