# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "21.6.0"

package:
  name: contextlib2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/contextlib2/contextlib2-${{ version }}.tar.gz
  sha256: ab1e2bfe1d01d968e1b7e8d9023bc51ef3509bba217bb730cee3827e1ee82869

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - contextlib2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://contextlib2.readthedocs.org
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Backports and enhancements for the contextlib module
  description: |
    Backports and enhancements for the contextlib module

extra:
  recipe-maintainers:
    - dopplershift
    - jakirkham

#### CFE metadata AND comments
