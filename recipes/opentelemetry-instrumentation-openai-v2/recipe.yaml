# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4b0"

package:
  name: opentelemetry-instrumentation-openai-v2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-openai-v2/opentelemetry_instrumentation_openai_v2-${{ version }}.tar.gz
  sha256: 571a2febd05b15808d7c777455d5a74c9abe08c694cb9827a98c5b4258f2adf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.39
    - opentelemetry-instrumentation ~=0.60b0
    - opentelemetry-semantic-conventions ~=0.60b0
    - opentelemetry-util-genai >=0.4b0.dev

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.openai_v2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation-genai/opentelemetry-instrumentation-openai-v2
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Official OpenAI instrumentation
  description: |
    OpenTelemetry Official OpenAI instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706

