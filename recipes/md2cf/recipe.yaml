# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: md2cf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/md2cf/md2cf-${{ version }}.tar.gz
  sha256: fec4acb72c111ddc3ad97a710bdf163fa559b5075ce7616ee947080527342305

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rich-argparse ==1.0.0
    - rich ==13.0.1
    - mistune ==0.8.4
    - chardet ==5.1.0
    - requests ==2.31.0
    - pyyaml ==6.0.1
    - gitignorefile ==1.1.2

tests:
  - python:
      imports:
        - md2cf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/iamjackg/md2cf
  license: MIT
  license_file: LICENSE
  summary: Convert Markdown documents to Confluence
  description: |
    Convert Markdown documents to Confluence

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: md2cf
  cfe-upstream-registry: pypi
  cfe-upstream-name: md2cf
  cfe-purls:
    - pkg:conda/md2cf@${{ version }}?channel=conda-forge
    - pkg:pypi/md2cf@${{ version }}
  cfe-upstream-repo: https://github.com/iamjackg/md2cf
  cfe-upstream-homepage: https://github.com/iamjackg/md2cf
  cfe-import-names: [md2cf]
