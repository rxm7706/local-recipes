# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6"

package:
  name: trml2pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trml2pdf/trml2pdf-${{ version }}.tar.gz
  sha256: f3b1e138ec07132729fff5cb3862e29a4f55818ea8c111a403e13d83a8d3ff0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - reportlab
    - six

tests:
  - python:
      imports:
        - trml2pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/romanlv/trml2pdf/
  license: MIT
  license_file: LICENSE
  summary: Tiny RML2PDF is open source implementation of RML (Report Markup Language) from ReportLab
  description: |
    Tiny RML2PDF is open source implementation of RML (Report Markup Language) from ReportLab

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
