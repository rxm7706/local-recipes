# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.10"

package:
  name: http-exceptions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/http-exceptions/http-exceptions-${{ version }}.tar.gz
  sha256: 77484475de13ead5dac72816387dd3c5d3898fd2588af02c1cd5454fb7412c06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - http_exceptions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/DeveloperRSquared/http-exceptions
  license: MIT
  license_file: LICENSE
  summary: Raisable HTTP Exceptions
  description: |
    Raisable HTTP Exceptions
  repository: https://github.com/DeveloperRSquared/http-exceptions

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
