# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: flask-inputs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Inputs/flask_inputs-${{ version }}.tar.gz
  sha256: bb883ce1528946c147de5e49aa00c5b426e7cfdb581310b5f7fc45009f1385ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - pypandoc
  run:
    - python >=${{ python_min }}
    - flask >=3
    - wtforms >=3
    - future >=1

tests:
  - python:
      imports:
        - flask_inputs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pythonhosted.org/Flask-Inputs
  license: MIT
  license_file: LICENSE
  summary: Flask request data validation
  description: |
    Flask request data validation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-inputs
  cfe-upstream-registry: pypi
  cfe-upstream-name: Flask-Inputs
