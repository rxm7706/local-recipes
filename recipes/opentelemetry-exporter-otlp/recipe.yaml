# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.45.1"

package:
  name: opentelemetry-exporter-otlp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-otlp/opentelemetry_exporter_otlp-${{ version }}.tar.gz
  sha256: d0ac35592e77663a9fabf2740b4818c57196b1b764e0c8449d0d7bb2c7b2bc67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-exporter-otlp-proto-grpc ${{ version }}.*
    - opentelemetry-exporter-otlp-proto-http ${{ version }}.*

tests:
  - python:
      imports:
        - opentelemetry.exporter.otlp.version
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Collector Exporters
  description: |
    OpenTelemetry Collector Exporters
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - pb01ka
    - mariusvniekerk
    - rxm7706
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-proto
    - conda-forge/opentelemetry-sdk
    - conda-forge/opentelemetry-exporter-otlp-proto-common
    - conda-forge/opentelemetry-exporter-otlp-proto-grpc
    - conda-forge/opentelemetry-exporter-otlp-proto-http
    - xhochy

