# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.4"

package:
  name: quantecon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quantecon/quantecon-${{ version }}.tar.gz
  sha256: e6837088c3dedaf713a7998f1892db4043069cd53664cf2a48602e66cc1f3087

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.5,<4
  run:
    - python >=${{ python_min }}
    - numba >=0.49.0
    - numpy >=1.17.0
    - requests
    - scipy >=1.5.0
    - sympy

tests:
  - python:
      imports:
        - quantecon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://quantecon.org/quantecon-py/
  license: MIT
  license_file: LICENSE
  summary: Import the main names to top level.
  description: |
    Import the main names to top level.
  repository: https://github.com/quantecon/QuantEcon.py
  documentation: http://quanteconpy.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - knaaptime
    - mmcky
    - jstac

