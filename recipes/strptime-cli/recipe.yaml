# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: strptime-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strptime-cli/strptime_cli-${{ version }}.tar.gz
  sha256: f03b053ed94debf3d99337231b4dd72cf737c4afd2dcc51f9693f5234aed2410

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26.1
  run:
    - python >=${{ python_min }}
    - darkdetect
    - platformdirs
    - pyperclip
    - textual

tests:
  - python:
      imports:
        - strptime_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/strptime-cli/
  license: MIT
  license_file: LICENSE
  summary: Guess the strptime format string that matches a given date string
  description: |
    Guess the strptime format string that matches a given date string
  repository: https://github.com/treyhunner/strptime-cli
  documentation: https://github.com/treyhunner/strptime-cli#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
