# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: testcontainers
  version: "4.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/testcontainers-${{ version }}.tar.gz
  sha256: 316f1bb178d829c003acd650233e3ff3c59a833a08d8661c074f58a4fbd42a64

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - docker-py
    - urllib3
    - wrapt
    - typing-extensions
    - python-dotenv

tests:
  - python:
      imports:
        - testcontainers
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python library for throwaway instances of anything that can run in a Docker container
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/testcontainers/testcontainers-python

extra:
  recipe-maintainers:
    - YYYasin19
