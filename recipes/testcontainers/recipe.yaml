# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.15.0"

package:
  name: testcontainers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/testcontainers/testcontainers-${{ version }}.tar.gz
  sha256: 085cde086337632e19002719460b7b80bbab2bdd51bb3ea04f77d0de96504706

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - docker-py
    - python-dotenv
    - typing_extensions
    - urllib3
    - wrapt

tests:
  - python:
      imports:
        - testcontainers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/testcontainers/testcontainers-python
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python library for throwaway instances of anything that can run in a Docker container
  description: |
    Python library for throwaway instances of anything that can run in a Docker container
  repository: https://github.com/testcontainers/testcontainers-python

extra:
  recipe-maintainers:
    - YYYasin19

#### CFE metadata AND comments
