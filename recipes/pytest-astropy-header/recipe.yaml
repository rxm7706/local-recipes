# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: pytest-astropy-header
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-astropy-header/pytest-astropy-header-${{ version }}.tar.gz
  sha256: 77891101c94b75a8ca305453b879b318ab6001b370df02be2c0b6d1bb322db10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest

tests:
  - python:
      imports:
        - pytest_astropy_header
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-astropy-header
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pytest plugin to add diagnostic information to the header of the test output
  description: |
    pytest plugin to add diagnostic information to the header of the test output

extra:
  recipe-maintainers:
    - mwcraig
    - astrofrog
    - bsipocz

#### CFE metadata AND comments
