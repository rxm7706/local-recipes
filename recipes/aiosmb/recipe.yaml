# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.14"

package:
  name: aiosmb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiosmb/aiosmb-${{ version }}.tar.gz
  sha256: 4a8eaefac5fb10e1088eb61e8df58aff3fe61fd6f11ce72efd8a6317555f02c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - unicrypto >=0.0.12
    - asyauth >=0.0.23
    - asysocks >=0.2.18
    - prompt-toolkit >=3.0.2
    - winacl >=0.1.9
    - six
    - tqdm
    - colorama
    - asn1crypto
    - wcwidth
    - cryptography

tests:
  - python:
      imports:
        - aiosmb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/aiosmb
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Asynchronous SMB protocol implementation
  description: |
    Asynchronous SMB protocol implementation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aiosmb
  cfe-upstream-registry: pypi
  cfe-upstream-name: aiosmb
  cfe-purls:
