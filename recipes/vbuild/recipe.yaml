# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: vbuild
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/vbuild-${{ version }}.tar.gz
  sha256: 270cd9078349d907dfae6c0e6364a5a5e74cb86183bb5093613f12a18b435fa9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pscript >=0.7.0,<0.8.0

tests:
  - python:
      imports:
        - vbuild
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A simple module to extract html/script/style from a vuejs '.vue' file (can minimize/es2015 compliant js) ... just py2 or py3, NO nodejs !
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/manatlan/vbuild

extra:
  recipe-maintainers:
    - rodja
