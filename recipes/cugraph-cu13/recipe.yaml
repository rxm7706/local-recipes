# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: cugraph-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/c/cugraph-cu13/cugraph_cu13-26.8.0-cp311-abi3-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: 9212a53a306c4b82b9667c1c3dde76c77fb90a70e41f8696acfd7c284037ce0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <14.0,>=13.0.1
    - cudf-cu13 ==26.8.*
    - cupy-cuda13x !=14.1.0,>=14.0.1
    - dask-cuda ==26.8.*
    - dask-cudf-cu13 ==26.8.*
    - fsspec >=0.6.0
    - libcugraph-cu13 ==26.8.*
    - numba <0.65.0,>=0.60.0
    - numpy <3.0,>=2.0
    - pylibcudf-cu13 ==26.8.*
    - pylibcugraph-cu13 ==26.8.*
    - pylibraft-cu13 ==26.8.*
    - raft-dask-cu13 ==26.8.*
    - rapids-dask-dependency ==26.8.*
    - rmm-cu13 ==26.8.*
    - ucxx-cu13 ==0.51.*

tests:
  - python:
      imports:
        - cugraph_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cugraph
  license: Apache-2.0
  license_file: LICENSE
  summary: cuGraph - RAPIDS GPU Graph Analytics
  description: |
    cuGraph - RAPIDS GPU Graph Analytics
  documentation: https://docs.rapids.ai/api/cugraph/stable/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
