# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: python-docx-ng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-docx-ng/python_docx_ng-${{ version }}.tar.gz
  sha256: 23ab75d74d28f0666143f84870c4e1856c0f64948d6c2616f2492dd2d336cf7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - lxml >=6.1.0
    - typing_extensions >=4.9.0

tests:
  - python:
      imports:
        - docx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/toxicphreAK/python-docx-ng
  license: MIT
  license_file: LICENSE
  summary: Create, read and update Microsoft Word (.docx) files.
  description: |
    Create, read and update Microsoft Word (.docx) files.
  repository: https://github.com/toxicphreAK/python-docx-ng
  documentation: https://toxicphreak.github.io/python-docx-ng/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
