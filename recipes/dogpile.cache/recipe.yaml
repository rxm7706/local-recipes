# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: dogpile.cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dogpile.cache/dogpile_cache-${{ version }}.tar.gz
  sha256: 849c5573c9a38f155cd4173103c702b637ede0361c12e864876877d0cd125eec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
  run:
    - decorator >=4.0.0
    - python >=${{ python_min }}
    - stevedore >=3.0.0
    - typing_extensions >=4.0.1

tests:
  - python:
      imports:
        - dogpile
        - dogpile.cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pytest -m "not time_intensive"
    requirements:
      run:
        - python  # test using the latest python
        - pytest
        - mako
    files:
      source:
        - pyproject.toml  # pytest config
        - tests/

about:
  summary: A caching front-end based on the Dogpile lock.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sqlalchemy/dogpile.cache
  documentation: https://dogpilecache.sqlalchemy.org

extra:
  recipe-maintainers:
    - asford
    - brainstorm
    - mgorny
