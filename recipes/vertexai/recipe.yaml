# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.71.1"

package:
  name: vertexai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vertexai/vertexai-${{ version }}.tar.gz
  sha256: cd74fe42ea05bb155aff0a4c150fd3d8af74df399297560a09027fa85e1fdbd7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - google-cloud-aiplatform ==1.71.1

tests:
  - python:
      imports:
        - vertexai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/python-aiplatform
  license: Apache-2.0
  license_file: LICENSE
  summary: Please run pip install vertexai to use the Vertex SDK.
  description: |
    Please run pip install vertexai to use the Vertex SDK.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
