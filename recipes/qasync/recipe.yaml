# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: qasync
  version: "0.28.0"
  sha256: 6f7f1f18971f59cb259b107218269ba56e3ad475ec456e54714b426a6e30b71d

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - uv-build >=0.8.3,<0.9.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - qasync
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pyqt
        - python ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Implementation of the PEP 3156 Event-Loop with Qt.
  description: |
    qasync allows coroutines to be used in PyQt/PySide applications by
    providing an implementation of the PEP 3156 event-loop.
  homepage: https://github.com/CabbageDevelopment/qasync
  repository: https://github.com/CabbageDevelopment/qasync

extra:
  recipe-maintainers:
    - ales-erjavec
