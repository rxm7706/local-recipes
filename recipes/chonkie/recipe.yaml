    - pkg:pypi/chonkie@${{ version }}
  cfe-upstream-repo: https://github.com/chonkie-inc/chonkie
  cfe-upstream-homepage: https://github.com/chonkie-inc/chonkie
  cfe-import-names: [chonkie]
  cfe-source-kind: pypi-sdist
