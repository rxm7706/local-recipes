# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: guardrails-api-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/guardrails-api-client/guardrails_api_client-${{ version }}.tar.gz
  sha256: 05f636bdc332fd3304007f564bca92b43ce9beb531ea3606d2cbdcbe97ab2c6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 <3.0.0,>=2.1.0
    - python-dateutil >=2.8.2
    - pydantic >=2
    - typing_extensions >=4.7.1
    - lazy-imports <2,>=1

tests:
  - python:
      imports:
        - guardrails_api_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/guardrails-api-client/
  license: MIT
  license_file: LICENSE
  summary: Guardrails API Client.
  description: |
    Guardrails API Client.

extra:
  recipe-maintainers:
    - rxm7706

