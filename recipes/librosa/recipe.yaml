# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"
  python_min: "3.12"

package:
  name: librosa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/librosa/librosa-${{ version }}.tar.gz
  sha256: 73ed480d4022e436e85dfa6f6b06ff38a259b9210039ac99939cd64854b61a57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=48
    - wheel >=0.29.0
  run:
    - python >=${{ python_min }}
    - numba >=0.61.0
    - numpy >=2.1.0
    - scipy >=1.15.0
    - scikit-learn >=1.6.0
    - joblib >=1.2
    - decorator >=5.2.1
    - soundfile >=0.12.1
    - pooch >=1.7
    - soxr-python >=1.0.0
    - lazy-loader >=0.3
    - msgpack >=1.0.5

tests:
  - python:
      imports:
        - librosa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://librosa.org
  license: ISC
  license_file: LICENSE
  summary: Python module for audio and music processing
  description: |
    Python module for audio and music processing
  repository: https://github.com/librosa/librosa
  documentation: https://librosa.org/doc

extra:
  recipe-maintainers:
    - bmcfee

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: librosa
  cfe-upstream-registry: pypi
  cfe-upstream-name: librosa
  cfe-purls:
    - pkg:conda/librosa@${{ version }}?channel=conda-forge
    - pkg:pypi/librosa@${{ version }}
  cfe-upstream-repo: https://github.com/librosa/librosa
  cfe-upstream-homepage: https://librosa.org
  cfe-import-names: [librosa]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/librosa-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.0.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:16:40Z
