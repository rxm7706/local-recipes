# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.11.1"

package:
  name: nbformat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nbformat/nbformat-${{ version }}.tar.gz
  sha256: 32d4521c68c6e7d5b29c76defaeed9f42ea733142b9b19f88277ce10390b9c4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
    - hatch-nodejs-version
  run:
    - python >=${{ python_min }}
    - python-fastjsonschema >=2.15
    - jsonschema >=2.6
    - jupyter-core !=5.0.*,>=4.12
    - traitlets >=5.1

tests:
  - python:
      imports:
        - nbformat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The Jupyter Notebook format
  description: |
    The Jupyter Notebook format
  repository: https://github.com/jupyter/nbformat.git
  documentation: https://nbformat.readthedocs.io/

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - mpacer
    - bollwyvl

