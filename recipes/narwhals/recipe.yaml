# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.24.0"

package:
  name: narwhals
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/narwhals/narwhals-${{ version }}.tar.gz
  sha256: b5c0f684ccd9d7475b564111e319a4964abcf2baf79d3cf6b1003d06ac9b828d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - cudf-cu12

tests:
  - python:
      imports:
        - narwhals
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/narwhals-dev/narwhals
  license: MIT
  license_file: LICENSE
  summary: Extremely lightweight compatibility layer between dataframe libraries
  description: |
    Extremely lightweight compatibility layer between dataframe libraries
  repository: https://github.com/narwhals-dev/narwhals
  documentation: https://narwhals-dev.github.io/narwhals/

extra:
  recipe-maintainers:
    - MarcoGorelli
    - thewchan

#### CFE metadata AND comments
