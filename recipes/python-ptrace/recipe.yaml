# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.9"

package:
  name: python-ptrace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-ptrace/python-ptrace-${{ version }}.tar.gz
  sha256: 56bbfef44eaf3a77be48138cca5767cdf471e8278fe1499f9b72f151907f25cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ptrace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://python-ptrace.readthedocs.io/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: python binding of ptrace
  description: |
    python binding of ptrace

extra:
  recipe-maintainers:
    - rxm7706

