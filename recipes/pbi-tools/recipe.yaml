# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: pbi-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pbi-tools/pbi-tools-${{ version }}.tar.gz
  sha256: f6891b9ef255f143d2416eaa1a71c080d65d1f539a9e67bc98668ba6bd2153ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - gitpython
    - requests

tests:
  - python:
      imports:
        - pbi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thomas-daughters/pbi-tools
  license: MIT
  license_file: LICENSE
  summary: Power BI REST API wrapper and other tools
  description: |
    Power BI REST API wrapper and other tools

extra:
  recipe-maintainers:
    - rxm7706

