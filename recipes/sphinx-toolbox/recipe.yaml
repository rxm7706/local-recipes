# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sphinx-toolbox
  version: "4.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sphinx_toolbox-${{ version }}.tar.gz
  sha256: 07ec26176744ee3abe3c1eb4407419e81468f4536f332dcafc4e3240b0d6fae2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - whey >=0.0.20
  run:
    - python >=${{ python_min }}
    - apeye >=0.4.0
    - autodocsumm >=0.2.0
    - beautifulsoup4 >=4.9.1
    - cachecontrol >=0.13.0
    - dict2css >=0.2.3
    - docutils >=0.16
    - domdf-python-tools >=2.9.0
    - filelock >=3.8.0
    - html5lib >=1.1
    - roman >4.0
    - ruamel.yaml >=0.16.12
    - sphinx >=3.2.0
    - sphinx-autodoc-typehints <3.6.0,>=1.11.1
    - sphinx-jinja2-compat >=0.1.0
    - sphinx-prompt >=1.1.0
    - sphinx-tabs <3.6.0,>=3.4.7
    - tabulate >=0.8.7
    - typing-extensions !=3.10.0.1,>=3.7.4.3
    - typing_inspect >=0.6.0

tests:
  - python:
      imports:
        - sphinx_toolbox
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: Box of handy tools for Sphinx 🧰 📔
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sphinx-toolbox/sphinx-toolbox
  documentation: https://sphinx-toolbox.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - domdfcoding
    - martinRenou
