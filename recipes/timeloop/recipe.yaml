# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: timeloop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/timeloop/timeloop-${{ version }}.tar.gz
  sha256: 4e716c67fe6bcadcee7ddb91e2520792426818a70f27e630cfbbbd9becc48a13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timeloop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sankalpjonn/timeloop
  license: MIT
  license_file: LICENSE
  summary: An elegant way to run period tasks.
  description: |
    An elegant way to run period tasks.

extra:
  recipe-maintainers:
    - rxm7706

