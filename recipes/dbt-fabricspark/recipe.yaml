# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.0"

package:
  name: dbt-fabricspark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-fabricspark/dbt_fabricspark-${{ version }}.tar.gz
  sha256: 52ce5ea8dffa659c2d6d62807459dac637197541b58ea9cfbf15ddea01f3ff7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - azure-core >=1.33.0
    - azure-identity >=1.21.0
    - dbt-adapters <2.0,>=1.7
    - dbt-common <2.0,>=1.10
    - dbt-core >=1.8.0
    - requests >=2.32.0

tests:
  - python:
      imports:
        - dbt.include.fabricspark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/dbt-fabricspark
  license: MIT
  license_file: LICENSE
  summary: A Microsoft Fabric Spark adapter plugin for dbt
  description: |
    A Microsoft Fabric Spark adapter plugin for dbt

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dbt-fabricspark
