# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: pypowerflex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyPowerFlex/pypowerflex-${{ version }}.tar.gz
  sha256: 9bbfa1d4245422e28d98c50a0277d16629d94351af8b03abfed931ff12c41dec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging >=20.4
    - requests >=2.23.0

tests:
  - python:
      imports:
        - PyPowerFlex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyPowerFlex/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python library for Dell PowerFlex
  description: |
    Python library for Dell PowerFlex

extra:
  recipe-maintainers:
    - rxm7706

