# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: pocketflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pocketflow/pocketflow-${{ version }}.tar.gz
  sha256: afadc1c44658bf811668a789dee7053ed654d021c861c58696a2cb6bc4775133

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pocketflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/The-Pocket/PocketFlow
  license: MIT
  license_file: LICENSE
  summary: "Pocket Flow: 100-line LLM framework. Let Agents build Agents!"
  description: |
    Pocket Flow: 100-line LLM framework. Let Agents build Agents!

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
