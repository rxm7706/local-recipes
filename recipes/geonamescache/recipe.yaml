# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.2"

package:
  name: geonamescache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geonamescache/geonamescache-${{ version }}.tar.gz
  sha256: 1cc7007a7a14637f665c7bd7934dc5a04a973daf4d962d789651047aa1a00cb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - geonamescache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/geonamescache/
  license: MIT
  license_file: LICENSE
  summary: Geonames data for continents, cities and US states.
  description: |
    Geonames data for continents, cities and US states.
  repository: https://github.com/yaph/geonamescache
  documentation: https://github.com/yaph/geonamescache#readme

extra:
  recipe-maintainers:
    - rxm7706

