# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: marquez-python
  version: "0.50.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/marquez-python-${{ version }}.tar.gz
  sha256: c450a56d0513f94e1769d0d3801ee96b064c0a17f0510ab0c77d034bcbc81c85

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - six
    - pyrfc3339
    - deprecation

tests:
  - python:
      imports:
        - examples
        - marquez_client
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Marquez Python Client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/MarquezProject/marquez
  repository: https://github.com/MarquezProject/marquez/tree/main/clients/python
  documentation: https://marquezproject.github.io/marquez/openapi.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
