# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: click-config-file
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name | replace("-", "_") }}/${{ name | replace("-", "_") }}-${{ version }}.tar.gz
  sha256: ded6ec1a73c41280727ec9c06031e929cdd8a5946bf0f99c0c3db3a71793d515

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - pytest-runner
  run:
    - python >=${{ python_min }}
    - click >=7.1
    - configobj >=5.0.6

tests:
  - python:
      imports:
        - click_config_file
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pytest
        - twine
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Configuration file support for click applications.
  homepage: http://github.com/phha/click_config_file
  repository: http://github.com/phha/click_config_file

extra:
  recipe-maintainers:
    - ltalirz
    - phha
