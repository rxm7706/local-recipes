# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: micropip
  version: "0.11.1"
  python_min: "3.13"

package:
  name: micropip
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/micropip/micropip-${{ version }}.tar.gz
  sha256: 85ca3e96a7ffc63934b50d7dcc4a1875875d52b76e7ed3fe5e2bbe283e6562dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.13.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<4.0

tests:
  - python:
      imports:
        - micropip
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A lightweight Python package installer for the web
  license: Apache-2.0 AND BSD-2-Clause AND MPL-2.0
  license_file:
    - LICENSE
    - micropip/_vendored/packaging/LICENSE
    - micropip/_vendored/packaging/LICENSE.BSD
    - micropip/_vendored/packaging/LICENSE.APACHE
  homepage: https://pypi.org/project/micropip
  repository: https://github.com/pyodide/micropip
  documentation: https://micropip.pyodide.org

extra:
  recipe-maintainers:
    - jtpio
    - rxm7706
    - yuvipanda
