# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4"

package:
  name: snappy-manifolds
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snappy-manifolds/snappy_manifolds-${{ version }}.tar.gz
  sha256: 3a5b354e6cb545bed6d13a5f0b99a399d03a352c51111662150632c0c7d316dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snappy_manifolds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/snappy_manifolds
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Database of snappy manifolds
  description: |
    Database of snappy manifolds

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
