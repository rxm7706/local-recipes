# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.18.1"

package:
  name: exa-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/exa-py/exa_py-${{ version }}.tar.gz
  sha256: f571f001ca8122b4432ef795b1c5c0afe97b5d20e84d4a1b769b9a888141e9c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpcore >=1.0.9
    - httpx >=0.28.1
    - openai >=1.48
    - pydantic >=2.10.6
    - python-dotenv >=1.0.1
    - requests >=2.32.3
    - typing_extensions >=4.12.2

tests:
  - python:
      imports:
        - exa_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/exa-py/
  license: MIT
  license_file: LICENSE
  summary: Python SDK for Exa API.
  description: |
    Python SDK for Exa API.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: exa-py
  cfe-upstream-registry: pypi
  cfe-upstream-name: exa-py
  cfe-purls:
    - pkg:conda/exa-py@${{ version }}?channel=conda-forge
    - pkg:pypi/exa-py@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/exa-py/
  cfe-upstream-homepage: https://pypi.org/project/exa-py/
  cfe-import-names: [exa_py]
