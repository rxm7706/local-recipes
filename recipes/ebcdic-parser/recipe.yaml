# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ebcdic-parser
  version: "3.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ebcdic_parser-${{ version }}.tar.gz
  sha256: 568eb633b5000e3ad986b37d3954a4474734dcff8786372cb7606487ac7b63d0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ebcdic_parser
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convert mainframe EBCDIC data into Unicode ASCII delimited text files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/larandvit/ebcdic-parser

extra:
  recipe-maintainers:
    - larandvit
    - rxm7706
