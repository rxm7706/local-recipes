# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: agg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agg/agg-${{ version }}.tar.gz
  sha256: 26968c11c67595da007ec717f7fb10d49462bf251ad7943d7be606d5f4f3370a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - userprovided

tests:
  - python:
      imports:
        - agg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RuedigerVoigt/agg
  license: Apache-2.0
  license_file: LICENSE
  summary: Aggregate CSV files
  description: |
    Aggregate CSV files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
