# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.3"
  python_min: "3.11"

package:
  name: unstructured-ingest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unstructured-ingest/unstructured_ingest-${{ version }}.tar.gz
  sha256: e45ee6d4851f50a168e3b78d809365b974221542d13f281a40dcd3ebc63dbf68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27,<1.32
  run:
    - python >=${{ python_min }}
    - certifi >=2026.1.4
    - click
    - ijson >=3.2.0
    - opentelemetry-sdk
    - pydantic >=2.7
    - python-dateutil
    - tqdm

tests:
  - python:
      imports:
        - unstructured_ingest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/unstructured-ingest/
  license: Apache-2.0
  license_file: LICENSE
  summary: Local ETL data pipeline to get data RAG ready
  description: |
    Local ETL data pipeline to get data RAG ready

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
