# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.5"

package:
  name: paramiko-expect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/paramiko-expect/paramiko-expect-${{ version }}.tar.gz
  sha256: 45e107bc16ed68bd2f8878c3838be748d2e7969313dcb1bba9123eb2f603ad01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paramiko

tests:
  - python:
      imports:
        - paramiko_expect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fgimian/paramiko-expect
  license: MIT
  license_file: LICENSE
  summary: An expect-like extension for the Paramiko SSH library
  description: |
    An expect-like extension for the Paramiko SSH library

extra:
  recipe-maintainers:
    - rxm7706

