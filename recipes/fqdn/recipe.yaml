# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: fqdn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fqdn/fqdn-${{ version }}.tar.gz
  sha256: 105ed3677e767fb5ca086a0c1f4bb66ebc3c100be518f0e0d755d9eae164d89f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cached_property

tests:
  - python:
      imports:
        - fqdn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ypcrts/fqdn
  license: MPL-2.0
  license_file: LICENSE
  summary: Validates fully-qualified domain names against RFC 1123, so that they are acceptable to modern bowsers
  description: |
    Validates fully-qualified domain names against RFC 1123, so that they are acceptable to modern bowsers

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
