# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.1"

package:
  name: darglint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/darglint/darglint-${{ version }}.tar.gz
  sha256: 080d5106df149b199822e7ee7deb9c012b49891538f14a11be681044f0bb20da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - darglint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/darglint/
  license: MIT
  license_file: LICENSE.txt
  summary: A utility for ensuring Google-style docstrings stay up to date with the source code.
  description: |
    A utility for ensuring Google-style docstrings stay up to date with the source code.

extra:
  recipe-maintainers:
    - asford
    - jcollado

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: darglint
