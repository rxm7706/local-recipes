# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.0"

package:
  name: aspose-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/aspose-pdf/aspose_pdf-26.7.0-py3-none-manylinux1_x86_64.whl
  sha256: c819dfcf61b3007b7bef3cafca82978340cd4ceae40b2fa0e0357d2709819ba6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aspose_pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://products.aspose.com/pdf/python-net/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Aspose.PDF for Python via .NET is a wrapper for Python to perform document management can easily be used to generate, modify, convert, render, secure and print documents without using Adobe Acrobat.
  description: |
    Aspose.PDF for Python via .NET is a wrapper for Python to perform document management can easily be used to generate, modify, convert, render, secure and print documents without using Adobe Acrobat.
  documentation: https://docs.aspose.com/pdf/python-net/

extra:
  recipe-maintainers:
    - rxm7706

