# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.56.3"

package:
  name: google-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-auth/google_auth-${{ version }}.tar.gz
  sha256: 40e229fc901f0a305b553050e5fce562d509bee0435be053abfa91582b51b90c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyasn1-modules >=0.2.1
    - cryptography >=38.0.3

tests:
  - python:
      imports:
        - google.auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Authentication Library
  description: |
    Google Authentication Library

extra:
  recipe-maintainers:
    - xylar
    - jan-janssen
    - jreback
    - parthea
    - theacodes
    - tswast

