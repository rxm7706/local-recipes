# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: sphinx-thebe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-thebe/sphinx_thebe-${{ version }}.tar.gz
  sha256: 576047f45560e82f64aa5f15200b1eb094dcfe1c5b8f531a8a65bd208e25a493

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - sphinx >=4

tests:
  - python:
      imports:
        - sphinx_thebe
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Integrate interactive code blocks into your documentation with Thebe and Binder.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/executablebooks/sphinx-thebe
  documentation: https://sphinx-thebe.readthedocs.io

extra:
  recipe-maintainers:
    - anirrudh
    - chrisjsewell
    - conda-forge/jupyter-book
