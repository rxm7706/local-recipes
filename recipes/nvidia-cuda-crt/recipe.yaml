# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.3.73"

package:
  name: nvidia-cuda-crt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cuda-crt/nvidia_cuda_crt-13.3.73-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
  sha256: 60aacc0b5e1e8b40c62abe4d1ab16440add91b99bd2f17f62dd091586b73d166

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nvidia_cuda_crt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CUDA C Runtime
  description: |
    CUDA C Runtime

extra:
  recipe-maintainers:
    - rxm7706

