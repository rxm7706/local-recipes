# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: mockllm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mockllm/mockllm-${{ version }}.tar.gz
  sha256: 1c389da1e0a88cfd40db0e0fd3147de86875e3e47bdd96bebfeae7291e49cc28

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.1.0
    - fastapi >=0.68.0
    - httpx >=0.28.1
    - pydantic >=2.0.0
    - python-json-logger >=2.0.0
    - pyyaml >=5.4.1
    - tiktoken >=0.9.0
    - uvicorn >=0.15.0
    - watchdog >=2.1.0

tests:
  - python:
      imports:
        - mockllm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lukehinds/mockllm
  license: Apache-2.0
  license_file: LICENSE
  summary: A mock server that mimics OpenAI and Anthropic API formats for testing
  description: |
    A mock server that mimics OpenAI and Anthropic API formats for testing
  repository: https://github.com/lukehinds/mockllm

extra:
  recipe-maintainers:
    - rxm7706

