# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.364"

package:
  name: presidio-analyzer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/presidio-analyzer/presidio_analyzer-${{ version }}.tar.gz
  sha256: 51f27bacf199fb9777ade9552c0f0111e00a1d73cfe2d4797fc05c998de1e0b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click <9.0.0,>=8.1.0
    - numpy <2.5.0,>=1.19.0
    - phonenumbers <10.0.0,>=9.0.28
    - pydantic <3.0.0,>=2.12.5
    - pyyaml <7.0.0,>=6.0.3
    - regex >=2023.0.0
    - spacy !=3.7.0,!=3.8.14,<4.0.0,>=3.4.4
    - tldextract <6.0.0,>=5.3.1

tests:
  - python:
      imports:
        - presidio_analyzer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/data-privacy-stack/presidio
  license: MIT
  license_file: LICENSE
  summary: Presidio Analyzer package
  description: |
    Presidio Analyzer package

extra:
  recipe-maintainers:
    - phemps
    - gulyasi
    - julcsii
    - geoHeil
    - heckert

#### CFE metadata AND comments
