# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.11"

package:
  name: claude
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/claude/claude-${{ version }}.tar.gz
  sha256: a76ecc7e28869866c4353a39d176397a3b6964b543ef176363db5ea32726868d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - claude
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/claude/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Reserved
  description: |
    Reserved

extra:
  recipe-maintainers:
    - rxm7706

