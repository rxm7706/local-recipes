# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: pytest-is-running
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-is-running/pytest-is-running-${{ version }}.tar.gz
  sha256: 885cc87e5e3874d80f1f4610967c20430c2c169b2b2e6227da43a7b80dbe8a73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytest_is_running
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-is-running/
  license: MIT
  license_file: LICENSE
  summary: pytest plugin providing a function to check if pytest is running.
  description: |
    pytest plugin providing a function to check if pytest is running.
  repository: https://github.com/adamchainz/pytest-is-running

extra:
  recipe-maintainers:
    - rxm7706

