# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: langgraph-prebuilt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-prebuilt/langgraph_prebuilt-${{ version }}.tar.gz
  sha256: 3c579cf6eed2d17f9c157c2d0fcaddcd8688524e7022d3b22b37a3bf4589d528

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.3.1
    - langgraph-checkpoint <5.0.0,>=2.1.0

tests:
  - python:
      imports:
        - langgraph.prebuilt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-prebuilt/
  license: MIT
  license_file: LICENSE
  summary: Library with high-level APIs for creating and executing LangGraph agents and tools.
  description: |
    Library with high-level APIs for creating and executing LangGraph agents and tools.
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/prebuilt

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
