# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: ansible-dev-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-dev-tools/ansible_dev_tools-${{ version }}.tar.gz
  sha256: 83921e305565101b563c52bee73970f1cab79f2004c14edfbf5b49914c20656f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ansible-builder >=3.1.1
    - ansible-compat >=26.3.0
    - ansible-creator >=26.6.1
    - ansible-dev-environment >=26.4.0
    - ansible-lint >=26.4.0
    - ansible-navigator >=26.1.3
    - ansible-sign >=0.1.5
    - molecule >=26.3.0
    - pytest-ansible >=26.4.0
    - setuptools >=65.5.1
    - tox-ansible >=26.7.1

tests:
  - python:
      imports:
        - ansible_dev_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/ansible-dev-tools
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Ansible Developtment Tools kit bundles all tools needed for content creation and testing.
  description: |
    Ansible Developtment Tools kit bundles all tools needed for content creation and testing.
  documentation: https://docs.ansible.com/projects/dev-tools/

extra:
  recipe-maintainers:
    - rxm7706

