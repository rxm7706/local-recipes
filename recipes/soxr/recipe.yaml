# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: soxr
  version: "0.1.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://downloads.sourceforge.net/project/${{ name }}/${{ name }}-${{ version }}-Source.tar.xz
  sha256: b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889
  patches:
    - pkgconfig_win.patch
    - 5.patch

build:
  number: 3

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - make
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - script:
      - if: unix
        then: test -f ${PREFIX}/include/soxr.h
      - if: linux
        then: test -f ${PREFIX}/lib/libsoxr.so
      - if: osx
        then: test -f ${PREFIX}/lib/libsoxr.dylib
      - if: win
        then: if not exist %PREFIX%\\Library\\include\\soxr.h exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\soxr.lib exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\bin\\soxr.dll exit 1

about:
  license: LGPL-2.1-or-later
  license_file: LICENCE
  summary: The SoX Resampler library
  description: |
    High quality, one-dimensional sample-rate conversion library

  homepage: https://sourceforge.net/projects/soxr/
  repository: https://sourceforge.net/projects/soxr/
  documentation: https://sourceforge.net/p/soxr/wiki/Home/

extra:
  recipe-maintainers:
    - HosameldinMohamed
    - traversaro
