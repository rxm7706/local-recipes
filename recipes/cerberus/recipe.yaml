# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.8"

package:
  name: cerberus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Cerberus/cerberus-${{ version }}.tar.gz
  sha256: 579554887ffd189226774b87570f4a76db75cf0efcbaffcacd5e98b8ee877f61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - cerberus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Cerberus/
  license: ISC
  license_file: LICENSE
  summary: Lightweight, extensible schema and data validation tool for Pythondictionaries.
  description: |
    Lightweight, extensible schema and data validation tool for Pythondictionaries.
  repository: https://github.com/pyeve/cerberus
  documentation: http://docs.python-cerberus.org

extra:
  recipe-maintainers:
    - fdosani
    - kyleniemeyer

#### CFE metadata AND comments
