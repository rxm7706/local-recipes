# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cerberus
  version: "1.3.8"
  sha256: 579554887ffd189226774b87570f4a76db75cf0efcbaffcacd5e98b8ee877f61

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - cerberus
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: ISC
  license_file: LICENSE
  summary: Lightweight, extensible schema and data validation tool for Python dictionaries.
  homepage: https://github.com/nicolaiarocci/cerberus

extra:
  recipe-maintainers:
    - fdosani
    - kyleniemeyer
