{% set name = "cerberus" %}
{% set version = "1.3.8" %}
{% set sha256 = "579554887ffd189226774b87570f4a76db75cf0efcbaffcacd5e98b8ee877f61" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - setuptools

test:
  requires:
    - python {{ python_min }}
  imports:
    - cerberus

about:
  home: https://github.com/nicolaiarocci/cerberus
  license: ISC
  license_file: LICENSE
  summary: Lightweight, extensible schema and data validation tool for Python dictionaries.

extra:
  recipe-maintainers:
    - fdosani
    - kyleniemeyer
