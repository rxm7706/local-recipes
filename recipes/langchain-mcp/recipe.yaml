# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: langchain-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-mcp/langchain_mcp-${{ version }}.tar.gz
  sha256: cb5bf34e609746cf40544b2e509ec927acbdcd4fc1031a1689f4ada52459e113

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core ~=0.3.37
    - mcp ~=1.0
    - pydantic ~=2.10
    - typing_extensions ~=4.12

tests:
  - python:
      imports:
        - langchain_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-mcp/
  license: MIT
  license_file: LICENSE
  summary: Model Context Protocol tool calling support for LangChain
  description: |
    Model Context Protocol tool calling support for LangChain
  repository: https://github.com/rectalogic/langchain-mcp

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
