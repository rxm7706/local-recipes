# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: colorlover
  version: "0.3.0"
  sha256: b8fb7246ab46e1f5e6715649453c1762e245a515de5ff2d2b4aab7a6e67fa4e2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - colorlover
      pip_check: false

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Color scales in Python for humans
  description: Color scales for humans
  homepage: https://github.com/jackparmer/colorlover
  repository: https://github.com/jackparmer/colorlover
  documentation: https://github.com/jackparmer/colorlover

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
