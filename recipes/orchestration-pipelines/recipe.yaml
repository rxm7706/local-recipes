# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: orchestration-pipelines
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orchestration-pipelines/orchestration_pipelines-${{ version }}.tar.gz
  sha256: ec97ef9a4d32940b80b112a6e16e2c39aca7968bcdd8a3b65b59078867b93bdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytz
    - pyyaml
    - airflow >=2.9.0
    - google-cloud-storage
    - dbt-core >=1.0.0
    - protobuf >=4.25.0
    - apache-airflow-client
    - google-auth
    - google-cloud-dataproc >=5.25.0
    - google-cloud-dataform >=0.9.0
    - apache-airflow-providers-google >=19.0.0
    - tenacity

tests:
  - python:
      imports:
        - orchestration_pipelines_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/orchestration-pipelines/
  license: Apache-2.0
  license_file: LICENSE
  summary: Orchestration Pipelines
  description: |
    Orchestration Pipelines

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
