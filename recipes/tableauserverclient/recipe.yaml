# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.41"

package:
  name: tableauserverclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tableauserverclient/tableauserverclient-${{ version }}.tar.gz
  sha256: e491975b9f0e19467fb6423b814511a9f549c22bce78c868079a25fbe81a0e95

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}
    - versioneer
    - defusedxml >=0.7.1
    - packaging >=23.1
    - requests >=2.32
    - urllib3 <3,>=2.6.0
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - tableauserverclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tableauserverclient/
  license: MIT
  license_file: LICENSE
  summary: A Python module for working with the Tableau Server REST API.
  description: |
    A Python module for working with the Tableau Server REST API.

extra:
  recipe-maintainers:
    - patlougheed

#### CFE metadata AND comments
