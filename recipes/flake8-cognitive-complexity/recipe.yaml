# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flake8-cognitive-complexity
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flake8_cognitive_complexity-${{ version }}.tar.gz
  sha256: f202df054e4f6ff182b659c261922b9c684628a47beb19cb0973c50d6a7831c1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - cognitive_complexity
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - flake8_cognitive_complexity
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An extension for flake8 that validates cognitive functions complexity
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Melevir/flake8-cognitive-complexity

extra:
  recipe-maintainers:
    - thewchan
