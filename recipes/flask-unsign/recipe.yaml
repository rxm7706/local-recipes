# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: flask-unsign
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-unsign/flask_unsign-${{ version }}.tar.gz
  sha256: 2b70955b6599effff3773b6de5bd44828c43d92a3fb64ab4db96b754363afd25

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - requests
    - itsdangerous
    - markupsafe
    - werkzeug

tests:
  - python:
      imports:
        - flask_unsign
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Paradoxis/Flask-Unsign
  license: MIT
  license_file: LICENSE
  summary: Flask Unsign is a penetration testing utility that attempts to uncover a Flask server's secret key by taking a signed session verifying it against a wordlist of commonly used and publicly known secret keys (sourced from books, GitHub, StackOverflow and various other sources).
  description: |
    Flask Unsign is a penetration testing utility that attempts to uncover a Flask server's secret key by taking a signed session verifying it against a wordlist of commonly used and publicly known secret keys (sourced from books, GitHub, StackOverflow and various other sources).

extra:
  recipe-maintainers:
    - rxm7706

