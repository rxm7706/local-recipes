# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: torchtune
  version: ${{ version }}

source:
  url: https://github.com/pytorch/torchtune/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 80a06ba0760741aa91f5f7bfb49ef6bb779c8044409dd7ef116f5420f122214b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tune = torchtune._cli.tune:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - torchao
    - torchdata ==0.11.0
    - datasets
    - huggingface_hub
    - hf-transfer
    - safetensors
    - kagglehub
    - sentencepiece
    - tiktoken
    - blobfile >=2
    - tokenizers
    - numpy
    - tqdm
    - omegaconf
    - psutil
    - pillow >=9.4.0

tests:
  - python:
      imports:
        - torchtune
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytorch/torchtune
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Native PyTorch library for LLM fine-tuning
  description: |
    Native PyTorch library for LLM fine-tuning
  repository: https://github.com/pytorch/torchtune
  documentation: https://pytorch.org/torchtune/main/index.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: torchtune
  cfe-upstream-registry: pypi
  cfe-upstream-name: torchtune
  cfe-purls:
    - pkg:conda/torchtune@${{ version }}?channel=conda-forge
    - pkg:pypi/torchtune@${{ version }}
  cfe-upstream-repo: https://github.com/pytorch/torchtune
  cfe-upstream-homepage: https://github.com/pytorch/torchtune
  cfe-import-names: [torchtune]
