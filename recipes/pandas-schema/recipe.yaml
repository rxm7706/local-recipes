# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.6"

package:
  name: pandas-schema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-schema/pandas_schema-${{ version }}.tar.gz
  sha256: c6bfc52c4bae9cdd7420fbe8c4b0622b769457827c3fc819928405638caf605f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - packaging

tests:
  - python:
      imports:
        - pandas_schema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TMiguelT/PandasSchema
  license: MIT
  license_file: LICENSE
  summary: A validation library for Pandas data frames using user-friendly schemas
  description: |
    A validation library for Pandas data frames using user-friendly schemas

extra:
  recipe-maintainers:
    - rxm7706

