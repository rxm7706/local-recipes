# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1.0"

package:
  name: gcloud-aio-bigquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcloud-aio-bigquery/gcloud_aio_bigquery-${{ version }}.tar.gz
  sha256: 4a3c775c2677c0588e9caeb2df40d81a54b31c174e562a527cb08e023c4408a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - gcloud-aio-auth

tests:
  - python:
      imports:
        - gcloud.aio.bigquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/talkiq/gcloud-aio
  license: MIT
  license_file: LICENSE
  summary: Python Client for Google Cloud BigQuery
  description: |
    Python Client for Google Cloud BigQuery
  repository: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar

