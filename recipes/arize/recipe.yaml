# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.46.0"

package:
  name: arize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arize/arize-${{ version }}.tar.gz
  sha256: 5f880cfd7eda3383a5ab98b45d8a6e202e7b01af1b05515b7c27123d65a62777

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy >=2.0.0
    - openinference-semantic-conventions <1,>=0.1.25
    - opentelemetry-exporter-otlp-proto-common >=1.38.0
    - opentelemetry-exporter-otlp-proto-grpc >=1.38.0
    - opentelemetry-sdk >=1.38.0
    - opentelemetry-semantic-conventions <1,>=0.43b0
    - pandas <3,>=2.0.0
    - protobuf <7,>=4.21.0
    - pyarrow >=0.15.0
    - pydantic <3,>=2
    - python-dateutil <3,>=2.8.2
    - requests-futures <2,>=1.0.0
    - requests <3,>=2.0.0
    - tqdm <5,>4
    - typing_extensions <5,>=4.7.1
    - urllib3 <3,>=2.1.0
    - wrapt <2.0.0,>=1.0.0

tests:
  - python:
      imports:
        - arize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://arize.com
  license: Apache-2.0
  license_file: LICENSE
  summary: A helper library to interact with Arize AI APIs
  description: |
    A helper library to interact with Arize AI APIs
  repository: https://github.com/Arize-ai/client_python
  documentation: https://docs.arize.com/arize

extra:
  recipe-maintainers:
    - zephyap
    - Shubh18s

#### CFE metadata AND comments
