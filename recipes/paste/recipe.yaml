# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.1"

package:
  name: paste
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Paste/paste-${{ version }}.tar.gz
  sha256: 1c3d12065a5e8a7a18c0c7be1653a97cf38cc3e9a5a0c8334a9dd992d3a05e4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - paste
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pythonpaste.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Tools for using a Web Server Gateway Interface stack
  description: |
    Tools for using a Web Server Gateway Interface stack
  repository: https://github.com/pasteorg/paste
  documentation: https://pythonpaste.readthedocs.io

extra:
  recipe-maintainers:
    - kwilcox
    - daf

#### CFE metadata AND comments
