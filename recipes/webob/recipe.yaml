# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.11"

package:
  name: webob
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WebOb/webob-${{ version }}.tar.gz
  sha256: aa8c27231070b135c025e567a9cd7eda03f4df71352ffaac740cb6a75f0f81a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - legacy-cgi >=2.6

tests:
  - python:
      imports:
        - webob
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://webob.org/
  license: MIT
  license_file: LICENSE
  summary: WSGI request and response object
  description: |
    WSGI request and response object

extra:
  recipe-maintainers:
    - stuertz
    - ChrisBarker-NOAA

#### CFE metadata AND comments
