# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: webob
  version: "1.8.11"
  sha256: aa8c27231070b135c025e567a9cd7eda03f4df71352ffaac740cb6a75f0f81a5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
    - legacy-cgi >=2.6
  run:
    - python >=${{ python_min }}
    - legacy-cgi >=2.6

tests:
  - python:
      imports:
        - webob
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: docs/license.txt
  summary: WSGI request and response object
  description: |
    WebOb provides objects for HTTP requests and responses. Specifically it
    does this by wrapping the WSGI request environment and response
    status/headers/app_iter(body). The request and response objects provide
    many conveniences for parsing HTTP request and forming HTTP responses. Both
    objects are read/write: as a result, WebOb is also a nice way to create HTTP
    requests and parse HTTP responses.
  homepage: http://webob.org/
  repository: https://github.com/Pylons/webob/
  documentation: http://webob.readthedocs.org/

extra:
  recipe-maintainers:
    - stuertz
    - ChrisBarker-NOAA
