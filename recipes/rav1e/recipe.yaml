# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: rav1e
  version: ${{ version }}

source:
  url: https://github.com/xiph/rav1e/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 06d1523955fb6ed9cf9992eace772121067cca7e8926988a1ee16492febbe01e
  patches:
    # I'm not sure why it is failing on building git_version on ppc64le only
    # It seems that an mtune flag is being passed through
    # but in reality, we aren't using the git source, so this "feature"
    # is mostly returning the git describe --always
    # of this feedstock which likely isn't what the library authors intended
    # removing this dependency has the side effect of allowing the builds to pass
    # on ppc64le
    - no_git_version.patch

build:
  number: 0
  has_prefix_files:
    - if: win
      then: Library/lib/pkgconfig/rav1e.pc

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-c
    - nasm
    - if: unix
      then: pkg-config
  run_exports:
    - ${{ pin_subpackage('rav1e', upper_bound='x.x') }}

tests:
  - files:
      recipe:
        - CMakeLists.txt
    requirements:
      run:
        - cmake
        - ninja
        - pkg-config
    script:
      - if: unix
        then: test ! -f ${PREFIX}/bin/rav1e
      - if: win
        then: if exist %LIBRARY_PREFIX%\\bin\\rav1e.exe exit 1
      - if: unix
        then: test -f ${PREFIX}/lib/librav1e${SHLIB_EXT}
      - if: linux
        then: test -f ${PREFIX}/lib/librav1e.so.0.8
      - if: osx
        then: test -f ${PREFIX}/lib/librav1e.0.8.dylib
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\bin\\rav1e.dll exit 1
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\lib\\rav1e.dll.lib exit 1
      - cmake . -GNinja

about:
  summary: The fastest and safest AV1 encoder.
  description: |
    rav1e is an AV1 video encoder. It is designed to eventually cover all use
    cases, though in its current form it is most suitable for cases where
    libaom (the reference encoder) is too slow.
  license: BSD-2-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/xiph/rav1e

extra:
  recipe-maintainers:
    - hmaarrfk
