# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: a
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a/a-${{ version }}.tar.gz
  sha256: ac14dc3a69f5746f06fd72fd2f2dace84bc07247182b3b117eaaa14dfd5fb0cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - a
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.python.org/sigs/distutils-sig/
  license: UNKNOWN
  license_file: LICENSE
  summary: Python Distribution Utilities
  description: |
    Python Distribution Utilities

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: a
  cfe-upstream-registry: pypi
  cfe-upstream-name: a
  cfe-purls:
    - pkg:conda/a@${{ version }}?channel=conda-forge
    - pkg:pypi/a@${{ version }}
  cfe-upstream-repo: http://www.python.org/sigs/distutils-sig/
  cfe-upstream-homepage: http://www.python.org/sigs/distutils-sig/
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
