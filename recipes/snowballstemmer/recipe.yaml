# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: snowballstemmer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snowballstemmer/snowballstemmer-${{ version }}.tar.gz
  sha256: e07bbc54a0d798fe6010a12398422e62a8bfbba95c394fd0956ef58cb4d3e260

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snowballstemmer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snowballstem/snowball
  license: BSD-3-Clause
  license_file: LICENSE
  summary: This package provides 36 stemmers for 34 languages generated from Snowball algorithms.
  description: |
    This package provides 36 stemmers for 34 languages generated from Snowball algorithms.

extra:
  recipe-maintainers:
    - chohner

#### CFE metadata AND comments
