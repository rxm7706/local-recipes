# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"
  sha256: e07bbc54a0d798fe6010a12398422e62a8bfbba95c394fd0956ef58cb4d3e260
  pkg_name: snowballstemmer

package:
  name: ${{ pkg_name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pkg_name[0] }}/${{ pkg_name }}/${{ pkg_name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ pkg_name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snowballstemmer
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Snowball stemming library collection for Python
  description: |
    Snowball is a small string processing language designed for creating
    stemming algorithms for use in Information Retrieval. The Snowball
    compiler translates a Snowball script into another language - currently
    ISO C, Java and Python are supported.
  homepage: https://snowballstem.org/
  repository: https://github.com/snowballstem/snowball

extra:
  recipe-maintainers:
    - chohner
