# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: ojai-python-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ojai-python-api/ojai_python_api-${{ version }}.tar.gz
  sha256: fac777f8fe69d5856cdf7e5d92ea82ded095fa5be1f49e578e991ebd614899dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ojai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ojai/ojai/tree/master/python
  license: MIT
  license_file: LICENSE
  summary: OJAI Python APIs
  description: |
    OJAI Python APIs

extra:
  recipe-maintainers:
    - rxm7706

