# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: wh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wh/wh-${{ version }}.tar.gz
  sha256: a78d3f794a7a77ad5df6be61cc12e034e7a10f9e27c2985157a6394e76768b44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/anqurvanillapy/wh
  license: MIT
  license_file: LICENSE
  summary: Record elapsed time and number of calls of a function
  description: |
    Record elapsed time and number of calls of a function

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
