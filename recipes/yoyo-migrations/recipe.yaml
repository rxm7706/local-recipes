# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yoyo-migrations
  version: "7.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/yoyo-migrations-${{ version }}.tar.gz
  sha256: 44840828e1a0169f541e702d5aedca8185ada68087e7bad4850a6fc5d71e77a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - yoyo = yoyo.scripts.main:main
      - yoyo-migrate = yoyo.scripts.main:main

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - sqlparse
    - tabulate

tests:
  - python:
      imports:
        - yoyo
        - yoyo.internalmigrations
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - yoyo --help
      - yoyo-migrate --help

about:
  summary: Database migrations with SQL
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://ollycope.com/software/yoyo/latest/

extra:
  recipe-maintainers:
    - ok-gitr
