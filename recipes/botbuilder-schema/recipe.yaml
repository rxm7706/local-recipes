    - pkg:conda/botbuilder-schema@${{ version }}?channel=conda-forge
    - pkg:pypi/botbuilder-schema@${{ version }}
  cfe-upstream-repo: https://github.com/Microsoft/botbuilder-python
  cfe-upstream-homepage: https://github.com/Microsoft/botbuilder-python
  cfe-import-names: [libraries.botbuilder-ai.tests]
