# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: textstat
  version: "0.7.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/textstat-${{ version }}.tar.gz
  sha256: a88d1da76287cd27ca4ce7bcba1ebaf2890544a5f0bb6a5758fa84cef3bceccb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - nltk
    - python >=${{ python_min }}
    - cmudict
    - pyphen
    - setuptools

tests:
  - python:
      imports:
        - textstat
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Calculate statistical features from text
  homepage: https://github.com/textstat/textstat
  repository: https://github.com/textstat/textstat
  documentation: https://pypi.org/project/textstat/

extra:
  recipe-maintainers:
    - mxr-conda
    - mwilson8
    - oblute
    - benhuff
    - rxm7706
