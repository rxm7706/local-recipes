# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.28.0"

package:
  name: jupyterlab-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-server/jupyterlab_server-${{ version }}.tar.gz
  sha256: 35baa81898b15f93573e2deca50d11ac0ae407ebb688299d3a5213265033712c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.7
  run:
    - python >=${{ python_min }}
    - babel >=2.10
    - importlib-metadata >=4.8.3
    - jinja2 >=3.0.3
    - json5 >=0.9.0
    - jsonschema >=4.18.0
    - jupyter-server <3,>=1.21
    - packaging >=21.3
    - requests >=2.31

tests:
  - python:
      imports:
        - jupyterlab_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyterlab-server.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A set of server components for JupyterLab and JupyterLab like applications.
  description: |
    A set of server components for JupyterLab and JupyterLab like applications.
  repository: https://github.com/jupyterlab/jupyterlab_server
  documentation: https://jupyterlab-server.readthedocs.io

extra:
  recipe-maintainers:
    - jasongrout
    - blink1073
    - afshin
    - SylvainCorlay
    - bollwyvl
    - jtpio

