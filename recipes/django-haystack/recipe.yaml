# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-haystack
  version: "3.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 1226a7c9ce13e1e7ead8ac83f6e87bfef4996f146ed24971fde7896115b1c530

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=61.2
    - setuptools-scm >=3.4
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - packaging

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Modular search for Django
  description: |
    Haystack provides modular search for Django. It features a unified,
    familiar API that allows you to plug in different search backends
    (such as Solr, Elasticsearch, Whoosh, Xapian, etc.) without having
    to modify your code.
  homepage: http://haystacksearch.org/
  repository: https://github.com/django-haystack/django-haystack
  documentation: http://haystacksearch.org/

extra:
  recipe-maintainers:
    - rxm7706
    - scopatz
