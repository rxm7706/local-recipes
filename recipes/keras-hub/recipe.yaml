# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.31.0"

package:
  name: keras-hub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keras-hub/keras_hub-${{ version }}.tar.gz
  sha256: 789c87357a16f1195f1a7c6ab87ba1c0ec5dc96bfed44db2dbb66a49712e283a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - keras >=3.15
    - absl-py
    - numpy
    - packaging
    - regex
    - rich
    - kagglehub !=1.0.1
    - kagglesdk ==0.1.28
    - sentencepiece <0.2.2
    - tokenizers

tests:
  - python:
      imports:
        - keras_hub.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://keras.io/keras_hub/
  license: Apache-2.0
  license_file: LICENSE
  summary: Pretrained models for Keras.
  description: |
    Pretrained models for Keras.
  repository: https://github.com/keras-team/keras/keras_hub

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: keras-hub
