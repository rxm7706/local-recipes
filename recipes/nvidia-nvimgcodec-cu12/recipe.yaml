# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0.20"

package:
  name: nvidia-nvimgcodec-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-nvimgcodec-cu12/nvidia_nvimgcodec_cu12-0.9.0.20-py3-none-manylinux_2_28_aarch64.whl
  sha256: e2872c2a99e8a532cebaea852d4a96306e2e886706c1f384d8627371a013aca0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nvidia_nvimgcodec_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NVIDIA/nvImageCodec
  license: Apache-2.0
  license_file: LICENSE
  summary: NVIDIA nvimgcodec  for CUDA 12.
  description: |
    NVIDIA nvimgcodec  for CUDA 12.

extra:
  recipe-maintainers:
    - rxm7706

