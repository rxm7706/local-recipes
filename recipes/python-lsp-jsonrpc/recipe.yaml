# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: python-lsp-jsonrpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-lsp-jsonrpc/python-lsp-jsonrpc-${{ version }}.tar.gz
  sha256: 4688e453eef55cd952bff762c705cedefa12055c0aec17a06f595bcc002cc912

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2.0
  run:
    - python >=${{ python_min }}
    - ujson >=3.0.0

tests:
  - python:
      imports:
        - pylsp_jsonrpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-lsp/python-lsp-jsonrpc
  license: MIT
  license_file: LICENSE
  summary: JSON RPC 2.0 server library
  description: |
    JSON RPC 2.0 server library

extra:
  recipe-maintainers:
    - ccordoba12
    - dalthviz
    - andfoy
    - steff456

