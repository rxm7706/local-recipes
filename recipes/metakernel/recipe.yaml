# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: metakernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metakernel/metakernel-${{ version }}.tar.gz
  sha256: 499a0e399e353e0fb4a74e105ea2ad2aed89a15053a299f5fa93c027d721743a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0
  run:
    - python >=${{ python_min }}
    - comm >=0.1.3
    - ipykernel >=6.22.0
    - jedi >=0.19.0
    - jupyter-core >=5.3.1
    - pexpect >=4.9.0

tests:
  - python:
      imports:
        - metakernel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Calysto/metakernel
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A Jupyter/IPython Kernel base class in Python
  description: |
    A Jupyter/IPython Kernel base class in Python

extra:
  recipe-maintainers:
    - ocefpaf
    - ericdill
    - mariusvniekerk
    - blink1073
    - dsblank

#### CFE metadata AND comments
