# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.7"

package:
  name: amphi-scheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/amphi-scheduler/amphi_scheduler-${{ version }}.tar.gz
  sha256: 2aaea3988bd305b4ba04006eabac4c31568aeebc577ef3a1168e34ee5b52937c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.20
    - hatch-jupyter-builder >=0.9
  run:
    - python >=${{ python_min }}
    - apscheduler
    - jupyterlab <5,>=4
    - sqlalchemy

tests:
  - python:
      imports:
        - packages.pipeline-scheduler.pipeline_scheduler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://amphi.ai
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Amphi Scheduler (JupyterLab extension + Python backend)
  description: |
    Amphi Scheduler (JupyterLab extension + Python backend)
  repository: https://github.com/amphi-ai/jupyterlab-amphi.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
