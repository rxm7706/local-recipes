# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: django-timezone-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-timezone-utils/django-timezone-utils-${{ version }}.tar.gz
  sha256: ce1ab713e80710d53a8f3860411b0e5c15f227667e56d118a4d7118f30a7e617

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytz
    - django

tests:
  - python:
      imports:
        - timezone_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/michaeljohnbarr/django-timezone-utils/
  license: MIT
  license_file: LICENSE
  summary: Time Zone Utilities for Django Models
  description: |
    Time Zone Utilities for Django Models

extra:
  recipe-maintainers:
    - rxm7706

