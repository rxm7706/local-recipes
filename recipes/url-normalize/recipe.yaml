# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: url-normalize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/url-normalize/url_normalize-${{ version }}.tar.gz
  sha256: 0552cbf2831a32a28994a13d29bca58a60e10ff6c0380e343ec6d1c2a0d232d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - idna >=3.3

tests:
  - python:
      imports:
        - url_normalize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/niksite/url-normalize
  license: MIT
  license_file: LICENSE
  summary: URL normalization for Python
  description: |
    URL normalization for Python
  repository: https://github.com/niksite/url-normalize

extra:
  recipe-maintainers:
    - jwcook

#### CFE metadata AND comments
