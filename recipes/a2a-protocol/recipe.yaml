# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: a2a-protocol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a-protocol/a2a_protocol-${{ version }}.tar.gz
  sha256: 8edbccd60c5a8c77063df5cec3568b0495d15e5e7de86190e0de19ab14c434e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - dataclasses
    - pydantic >=2.0.0

tests:
  - python:
      imports:
        - a2a_protocol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TheRaLabs/legion-a2a
  license: MIT
  license_file: LICENSE
  summary: Agent to Agent Protocol Specification Python models
  description: |
    Agent to Agent Protocol Specification Python models

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: a2a-protocol
