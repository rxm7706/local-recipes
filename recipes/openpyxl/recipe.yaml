# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.5"

package:
  name: openpyxl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openpyxl/openpyxl-${{ version }}.tar.gz
  sha256: cf0e3cf56142039133628b5acffe8ef0c12bc902d2aadd3e0fe5878dc08d1050

build:
  number: 3
  skip: match(python, "<3.6")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
  host:
    - python
    - pip >=18.0
    - cython
    - ${{ compiler('c') }}
    - setuptools
  run:
    - python
    - et_xmlfile

tests:
  - python:
      imports:
        - openpyxl
        - openpyxl.cell
        - openpyxl.chart
        - openpyxl.chartsheet
        - openpyxl.comments
        - openpyxl.compat
        - openpyxl.descriptors
        - openpyxl.drawing
        - openpyxl.formatting
        - openpyxl.formula
        - openpyxl.packaging
        - openpyxl.pivot
        - openpyxl.reader
        - openpyxl.styles
        - openpyxl.utils
        - openpyxl.workbook
        - openpyxl.workbook.external_link
        - openpyxl.worksheet
        - openpyxl.writer
        - openpyxl.xml
      pip_check: false

about:
  license: MIT
  license_file: LICENCE.rst
  summary: A Python library to read/write Excel 2010 xlsx/xlsm files
  description: |
    openpyxl is a Python library to read/write Excel 2010
    xlsx/xlsm/xltx/xltm files.
  homepage: https://openpyxl.readthedocs.io
  repository: https://foss.heptapod.net/openpyxl/openpyxl/
  documentation: https://openpyxl.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - thewchan
    - curtisalexander
    - ocefpaf
