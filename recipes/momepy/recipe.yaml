# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"
  python_min: "3.12"

package:
  name: momepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/momepy/momepy-${{ version }}.tar.gz
  sha256: 7bc2289a4b2d97f2c1267a9ee318cf1c94998e7098d1c6ad6c662a01bc3d9fe6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=1.1
    - libpysal >=4.12.1
    - networkx >=3.4
    - numpy >=2.0
    - packaging
    - pandas >=2.3
    - shapely >=2.1
    - tqdm >=4.67

tests:
  - python:
      imports:
        - momepy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://momepy.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Urban Morphology Measuring Toolkit
  description: |
    Urban Morphology Measuring Toolkit
  repository: https://github.com/pysal/momepy

extra:
  recipe-maintainers:
    - knaaptime
    - martinfleis
    - jGaboardi

