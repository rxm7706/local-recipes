# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.0"

package:
  name: chameleon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Chameleon/Chameleon-${{ version }}.tar.gz
  sha256: 910cd729f6f7f38adad132ee51faa4f3ccc8344a6721aac31aa51a31f5781c1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chameleon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://chameleon.readthedocs.io
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Fast HTML/XML Template Compiler.
  description: |
    Fast HTML/XML Template Compiler.
  documentation: https://chameleon.readthedocs.io

extra:
  recipe-maintainers:
    - ReimarBauer

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: chameleon
  cfe-upstream-registry: pypi
  cfe-upstream-name: chameleon
  cfe-purls:
    - pkg:conda/chameleon@${{ version }}?channel=conda-forge
    - pkg:pypi/chameleon@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://chameleon.readthedocs.io
  cfe-import-names: [chameleon]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/chameleon-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-4.6.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T06:57:04Z
