# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.5"

package:
  name: sqlalchemy-dremio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-dremio/sqlalchemy_dremio-${{ version }}.tar.gz
  sha256: d45bb7a2d226a113981ddbf312e69a9c278534d73162d6a68731b5ce3e50839b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy ~=2.0.41
    - pyarrow ~=20.0.0

tests:
  - python:
      imports:
        - sqlalchemy_dremio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/narendrans/sqlalchemy_dremio
  license: Apache-2.0
  license_file: LICENSE
  summary: A SQLAlchemy dialect for Dremio via the Flight interface.
  description: |
    A SQLAlchemy dialect for Dremio via the Flight interface.

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

