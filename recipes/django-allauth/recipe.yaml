# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "65.19.1"

package:
  name: django-allauth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-allauth/django_allauth-${{ version }}.tar.gz
  sha256: 999d01d5c422a82734cf5804df9f5a0d1d4ddd6acbb2f807db976ed7d49f9cb3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.3.0
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - django >=4.2.16
    - asgiref >=3.8.1

tests:
  - python:
      imports:
        - allauth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://allauth.org
  license: MIT
  license_file: LICENSE
  summary: Integrated set of Django applications addressing authentication, registration, account management as well as 3rd party (social) account authentication.
  description: |
    Integrated set of Django applications addressing authentication, registration, account management as well as 3rd party (social) account authentication.
  repository: https://codeberg.org/allauth/django-allauth
  documentation: https://docs.allauth.org/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
    - jacksund
    - cshaley
    - sannykr

