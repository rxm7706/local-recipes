# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: missingno
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/missingno/missingno-${{ version }}.tar.gz
  sha256: 4a4baa9ca9f9e4e0d9402455df26b656632e94b99e87fa64c0cdbbbc722837ac

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - seaborn

tests:
  - python:
      imports:
        - missingno
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Missing data visualization module for Python.
  homepage: https://github.com/ResidentMario/missingno

extra:
  recipe-maintainers:
    - vasudevanv
    - ericmjl
