    - pkg:pypi/missingno@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ResidentMario/missingno
  cfe-import-names: [missingno]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/missingno-feedstock
  cfe-forge-recipe-updates-needed: 
