# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: missingno
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/missingno/missingno-${{ version }}.tar.gz
  sha256: 4a4baa9ca9f9e4e0d9402455df26b656632e94b99e87fa64c0cdbbbc722837ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - scipy
    - seaborn-base

tests:
  - python:
      imports:
        - missingno
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ResidentMario/missingno
  license: MIT
  license_file: LICENSE
  summary: Missing data visualization module for Python.
  description: |
    Missing data visualization module for Python.

extra:
  recipe-maintainers:
    - vasudevanv
    - ericmjl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: missingno
  cfe-upstream-registry: pypi
  cfe-upstream-name: missingno
