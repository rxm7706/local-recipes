# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: pyusb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyusb/pyusb-${{ version }}.tar.gz
  sha256: 3af070b607467c1c164f49d5b0caabe8ac78dbed9298d703a8dbf9df4052d17e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - wheel
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - usb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyusb.github.io/pyusb
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Easy USB access for Python
  description: |
    Easy USB access for Python
  repository: https://github.com/pyusb/pyusb

extra:
  recipe-maintainers:
    - hmaarrfk

#### CFE metadata AND comments
