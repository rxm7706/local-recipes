# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.16.1"

package:
  name: ipython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipython/ipython-${{ version }}.tar.gz
  sha256: 5a3d1f9a47ff216d6cf9cf863124f6a2c1a198d1354c546a4d24a370a283b64c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.0
  run:
    - python >=${{ python_min }}
    - ipython_pygments_lexers >=1.0.0
    - jedi >=0.18.2
    - matplotlib-inline >=0.1.6
    - prompt-toolkit <3.1.0,>=3.0.41
    - pygments >=2.14.0
    - stack_data >=0.6.0
    - traitlets >=5.13.0
    - typing_extensions >=4.6
    - if: win
      then:
        - colorama

tests:
  - python:
      imports:
        - IPython
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ipython.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "IPython: Productive Interactive Computing"
  description: |
    IPython: Productive Interactive Computing
  repository: https://github.com/ipython/ipython
  documentation: https://ipython.readthedocs.io/

extra:
  recipe-maintainers:
    - Carreau
    - jakirkham
    - fperez
    - ellisonbg
    - minrk
    - ocefpaf
    - pelson
    - takluyver
    - bollwyvl
    - blink1073
    - krassowski
    - trallard

