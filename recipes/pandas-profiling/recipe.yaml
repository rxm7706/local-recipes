# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.6"

package:
  name: pandas-profiling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-profiling/pandas-profiling-${{ version }}.tar.gz
  sha256: 1ef14a9cfa647ff95e13fd0b589f74897c0b078ef8ebcd44760b4031dcbf52a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ydata-profiling

tests:
  - python:
      imports:
        - pandas_profiling
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ydataai/pandas-profiling
  license: MIT
  license_file: LICENSE
  summary: Deprecated 'pandas-profiling' package, use 'ydata-profiling' instead
  description: |
    Deprecated 'pandas-profiling' package, use 'ydata-profiling' instead

extra:
  recipe-maintainers:
    - sbrugman
    - proinsias
    - philip-khor

