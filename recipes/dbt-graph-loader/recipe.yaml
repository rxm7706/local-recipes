# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0a3"

package:
  name: dbt-graph-loader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-graph-loader/dbt_graph_loader-${{ version }}.tar.gz
  sha256: b0a7a56822aecdb9d8214ebe83ffa40dfe5662666ecd5299e3da8fa093b8cb0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - click >=8.0.0
    - falkordb >=1.0.0
    - neo4j >=5.0.0

tests:
  - python:
      imports:
        - dbt_graph_loader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dbt-graph-loader/
  license: MIT
  license_file: LICENSE
  summary: Load DBT metadata into graph databases (Neo4j and FalkorDB)
  description: |
    Load DBT metadata into graph databases (Neo4j and FalkorDB)
  repository: https://github.com/ponderedw/dbt-kg

extra:
  recipe-maintainers:
    - rxm7706

