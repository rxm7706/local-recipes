# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3.2"

package:
  name: tldextract
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tldextract/tldextract-${{ version }}.tar.gz
  sha256: c017431bc0800f2d3d1b57cce36e06668f0930f60a6d8c4615d4e2b8da298fa9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - idna
    - requests >=2.1.0
    - requests-file >=1.4
    - filelock >=3.0.8

tests:
  - python:
      imports:
        - tldextract
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/john-kurkowski/tldextract
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Accurately separates a URL's subdomain, domain, and public suffix, using the Public Suffix List (PSL). By default, this includes the public ICANN TLDs and their exceptions. You can optionally support the Public Suffix List's private domains as well.
  description: |
    Accurately separates a URL's subdomain, domain, and public suffix, using the Public Suffix List (PSL). By default, this includes the public ICANN TLDs and their exceptions. You can optionally support the Public Suffix List's private domains as well.

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

