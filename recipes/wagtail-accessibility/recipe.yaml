# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-accessibility
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail-accessibility-${{ version }}.tar.gz
  sha256: b425feb5feb51df3530670759f9312cc0ac01c6db3824eb07cb099bf3999f8a3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=4.1

tests:
  - python:
      imports:
        - wagtailaccessibility
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Accessibility content checks for Wagtail websites
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/wagtail-nest/wagtail-accessibility

extra:
  recipe-maintainers:
    - rxm7706
