{% set name = "django-autocomplete-light" %}
{% set version = "5.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 115ee3541ee4a7ddd1b92396ea75d0f38d0b91899b0dc17259310975c728b32e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=65.5.1
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - django >=5.2
    #- six
    # - django-taggit 
    # - django-querysetsequence >=0.11
    # - django-nested-admin >=3.0.21
    # - django-taggit 
    # - django-querysetsequence >=0.11
    # - django-nested-admin >=3.0.21

test:
  imports:
    - dal
    - dal_alight
    - dal_alight_queryset_sequence
    - dal_contenttypes
    - dal_queryset_sequence
    - dal_select2
    - dal_select2_queryset_sequence
    - dal_select2_taggit
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://django-autocomplete-light.rtfd.org
  summary: Fresh autocompletes for Django
  dev_url: https://github.com/yourlabs/django-autocomplete-light
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - maksdan
