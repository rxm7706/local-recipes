# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-autocomplete-light
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 115ee3541ee4a7ddd1b92396ea75d0f38d0b91899b0dc17259310975c728b32e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - setuptools >=65.5.1
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - django >=5.2
    #- six
    # - django-taggit
    # - django-querysetsequence >=0.11
    # - django-nested-admin >=3.0.21
    # - django-taggit
    # - django-querysetsequence >=0.11
    # - django-nested-admin >=3.0.21

tests:
  - python:
      imports:
        - dal
        - dal_alight
        - dal_alight_queryset_sequence
        - dal_contenttypes
        - dal_queryset_sequence
        - dal_select2
        - dal_select2_queryset_sequence
        - dal_select2_taggit
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Fresh autocompletes for Django
  license: MIT
  license_file: LICENSE
  homepage: http://django-autocomplete-light.rtfd.org
  repository: https://github.com/yourlabs/django-autocomplete-light

extra:
  recipe-maintainers:
    - rxm7706
    - maksdan
