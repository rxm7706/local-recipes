# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.2b"

package:
  name: chatbot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chatbot/chatbot-${{ version }}.tar.gz
  sha256: 805f94ae03fe0e262c993e801cc47757d01b1470072a902225069b8adebbb3d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chatbot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://packages.python.org/chatbot/
  license: MIT
  license_file: LICENSE
  summary: Allows users on wikia wikis to create a chatbot for Special:Chat
  description: |
    Allows users on wikia wikis to create a chatbot for Special:Chat

extra:
  recipe-maintainers:
    - rxm7706

