# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20220715.0"

package:
  name: pypng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypng/pypng-${{ version }}.tar.gz
  sha256: 739c433ba96f078315de54c0db975aee537cbc3e1d0ae4ed9aab0ca1e427e2c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=35.0.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypng
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/drj11/pypng
  license: MIT
  license_file: LICENSE
  summary: Pure Python library for saving and loading PNG images
  description: |
    Pure Python library for saving and loading PNG images

extra:
  recipe-maintainers:
    - hmaarrfk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pypng
