    - pkg:pypi/pypng@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://gitlab.com/drj11/pypng
  cfe-import-names: [pypng]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pypng-feedstock
  cfe-forge-recipe-updates-needed: 
