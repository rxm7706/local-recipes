# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: solace-pubsubplus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py36/s/solace-pubsubplus/solace_pubsubplus-1.11.0-py36-none-macosx_11_0_universal2.whl
  sha256: f9b58a3bc2c2780744399c63db7d5c062e23effa52665c4c6dc56b838311a254

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - solace_pubsubplus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.solace.com/API/Messaging-APIs/Python-API/python-home.htm
  license: Apache-2.0
  license_file: LICENSE
  summary: Solace Messaging API for Python.
  description: |
    Solace Messaging API for Python.

extra:
  recipe-maintainers:
    - rxm7706

