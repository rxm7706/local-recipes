# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: cutlery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cutlery/cutlery-${{ version }}.tar.gz
  sha256: 8931662d3cd32ccf0242e8aa001f8f82461b8933fe06f3e9abf4ef3a2bd8b2d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - cython >=0.25
  run:
    - python >=${{ python_min }}
    - regex

tests:
  - python:
      imports:
        - cutlery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/explosion/cutlery
  license: MIT
  license_file: LICENSE
  summary: Lightweight piece tokenization library
  description: |
    Lightweight piece tokenization library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cutlery
  cfe-upstream-registry: pypi
