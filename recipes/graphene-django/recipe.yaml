# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: graphene-django
  version: "3.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/graphene-django-${{ version }}.tar.gz
  sha256: d831bfe8e9a6e77e477b7854faef4addb318f386119a69ee4c57b74560f3e07d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pytest-runner
    - pip
    - setuptools
  run:
    - django-filter
    - djangorestframework
    - python >=${{ python_min }}
    - graphene >=3.0,<4
    - graphql-core >=3.1.0,<4
    - graphql-relay >=3.1.1,<4
    - django >=3.2
    - promise >=2.1
    - text-unidecode

tests:
  - python:
      imports:
        - graphene_django
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Graphene Django integration
  description: Graphene-Django is built on top of Graphene. Graphene-Django provides some additional abstractions that make it easy to add GraphQL functionality to your Django project.
  homepage: https://github.com/graphql-python/graphene-django
  repository: https://github.com/graphql-python/graphene-django
  documentation: https://docs.graphene-python.org/projects/django/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
    - KingDarBoja
