# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.8"

package:
  name: plogger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plogger/plogger-${{ version }}.tar.gz
  sha256: 4be9521a47d16a44361dfb0231f10d548c5b80c6a682152c614e5c642eeac2f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - plogger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/c-pher/plogger.git
  license: MIT
  license_file: LICENSE
  summary: A simple high level logger wrapper to log into console/file with different level.
  description: |
    A simple high level logger wrapper to log into console/file with different level.

extra:
  recipe-maintainers:
    - rxm7706

