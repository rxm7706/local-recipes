# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: semantic-code-search
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/semantic-code-search-${{ version }}.tar.gz
  sha256: edfcbe631a09f0f981cab0fd9863e8d0a2ec78d5f6b9f4c168b087cd9836c218

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - sem=semantic_code_search.cli:main

requirements:
  host:
    - pip
    - python >=3.8
  run:
    - python >=3.8
    - numpy ==1.22.4
    - prompt-toolkit ==3.0.32
    - pygments ==2.12.0
    - sentence-transformers ==2.2.2
    - setuptools ==62.6.0
    - pytorch ==1.12.1
    - tokenizers >=0.11.1,!=0.11.3,<0.13
    - tree_sitter ==0.20.1
    - tree_sitter_languages ==1.5.0

tests:
  - python:
      imports:
        - semantic_code_search
      pip_check: false
  - requirements:
      run:
        - git
    script:
      - git init
      - sem --help

about:
  summary: Search your codebase with natural language.
  license: AGPL-3.0-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/sturdy-dev/semantic-code-search

extra:
  recipe-maintainers:
    - thewchan
