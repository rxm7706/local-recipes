# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: cuda-pathfinder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/c/cuda-pathfinder/cuda_pathfinder-1.6.0-py3-none-any.whl
  sha256: 1503af579d8379c24bdd65528379bc57039b0455be9f5f9686cf8e473a1fce51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cuda_pathfinder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cuda-pathfinder/
  license: Apache-2.0
  license_file: LICENSE
  summary: Pathfinder for CUDA components
  description: |
    Pathfinder for CUDA components
  repository: https://github.com/NVIDIA/cuda-python
  documentation: https://nvidia.github.io/cuda-python/

extra:
  recipe-maintainers:
    - conda-forge/cuda-python
    - rwgk
    - leofang
    - kkraus14
    - oleksandr-pavlyk
    - bdice

