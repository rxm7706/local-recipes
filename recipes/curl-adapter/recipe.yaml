# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: curl-adapter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/curl-adapter/curl_adapter-${{ version }}.tar.gz
  sha256: 027501fb81b691ba81bbf51f34056ddee91e7f8abf5b699d2522bbf38b9c1ec9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - curl-cffi >=0.14.0
    - pycurl >=7.45.5
    - brotli

tests:
  - python:
      imports:
        - curl_adapter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/el1s7/curl-adapter
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A curl HTTP adapter switch for requests library — make browser-like requests with custom TLS fingerprints.
  description: |
    A curl HTTP adapter switch for requests library — make browser-like requests with custom TLS fingerprints.

extra:
  recipe-maintainers:
    - rxm7706

