# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2023.12.21"

package:
  name: oldest-supported-numpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oldest-supported-numpy/oldest-supported-numpy-${{ version }}.tar.gz
  sha256: 71d89c31bb567814e47e2e268eb2e92b6f99f5ce76f4c3db30833624e9ef29e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - oldest-supported-numpy
    - numpy ==1.22.2

tests:
  - python:
      imports:
        - oldest_supported_numpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scipy/oldest-supported-numpy
  license: MIT
  license_file: LICENSE
  summary: Meta-package that provides the oldest NumPy that supports a given Python version and platform. If wheels for the platform became available on PyPI only for a more recent NumPy version, then that NumPy version is specified.
  description: |
    Meta-package that provides the oldest NumPy that supports a given Python version and platform. If wheels for the platform became available on PyPI only for a more recent NumPy version, then that NumPy version is specified.

extra:
  recipe-maintainers:
    - rxm7706

