# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: oslo.cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.cache/oslo_cache-${{ version }}.tar.gz
  sha256: c747ada25e20925746da36a208eec50f0d4c310fcaac10b436b69393ee8140fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - dogpile.cache >=1.3.3
    - oslo.config >=8.1.0
    - oslo.i18n >=5.0.0
    - oslo.log >=4.2.1
    - oslo.utils >=4.2.0

tests:
  - python:
      imports:
        - oslo_cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.cache
  license: Apache-2.0
  license_file: LICENSE
  summary: Cache storage for OpenStack projects.
  description: |
    Cache storage for OpenStack projects.
  repository: https://opendev.org/openstack/oslo.cache

extra:
  recipe-maintainers:
    - rxm7706

