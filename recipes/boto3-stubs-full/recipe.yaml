# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.72"

package:
  name: boto3-stubs-full
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boto3-stubs-full/boto3_stubs_full-${{ version }}.tar.gz
  sha256: 7129f9b21a748cadb803097db125ff44c088fdf38870fb93a2a9349398478e77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - mypy_boto3_ce
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youtype/mypy_boto3_builder
  license: MIT
  license_file: LICENSE
  summary: All-in-one type annotations for boto3 1.43.72 generated with mypy-boto3-builder 8.12.0
  description: |
    All-in-one type annotations for boto3 1.43.72 generated with mypy-boto3-builder 8.12.0
  repository: https://github.com/youtype/mypy_boto3_builder
  documentation: https://youtype.github.io/boto3_stubs_docs/

extra:
  recipe-maintainers:
    - rxm7706

