# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: raft-dask-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/r/raft-dask-cu12/raft_dask_cu12-26.8.0-cp311-abi3-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: 87ad2566a727553755f5c670c87004d56fa50e13305e27e3c25afc345e20ad4b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dask-cuda ==26.8.*
    - distributed-ucxx-cu12 ==0.51.*
    - libraft-cu12 ==26.8.*
    - nvidia-nccl-cu12 >=2.19
    - pylibraft-cu12 ==26.8.*
    - rapids-dask-dependency ==26.8.*

tests:
  - python:
      imports:
        - raft_dask_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/raft
  license: Apache-2.0
  license_file: LICENSE
  summary: Reusable Accelerated Functions & Tools Dask Infrastructure
  description: |
    Reusable Accelerated Functions & Tools Dask Infrastructure
  documentation: https://docs.rapids.ai/api/raft/stable/

extra:
  recipe-maintainers:
    - rxm7706

