# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: IMAPClient
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: b0413a516ffcc4b4d69f2c611c0e95da57968edf5a5c78ac82d1bf882305facc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - imapclient
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Easy-to-use, Pythonic and complete IMAP client library
  homepage: http://imapclient.freshfoo.com/
  repository: https://github.com/mjs/imapclient
  documentation: http://imapclient.readthedocs.io/

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
