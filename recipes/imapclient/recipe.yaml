# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: imapclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/IMAPClient/imapclient-${{ version }}.tar.gz
  sha256: b0413a516ffcc4b4d69f2c611c0e95da57968edf5a5c78ac82d1bf882305facc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imapclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mjs/imapclient/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Easy-to-use, Pythonic and complete IMAP client library
  description: |
    Easy-to-use, Pythonic and complete IMAP client library

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: imapclient
