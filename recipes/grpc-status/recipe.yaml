# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: grpc-status
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpc-status/grpc-status-${{ version }}.tar.gz
  sha256: 8e44109cbb36ff069fce04bd2a6846cfe25c481859b6bd8ad6919ceb33e0c9b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - grpc_status
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: "Please install the official package with: pip install grpcio-status"
  description: |
    Please install the official package with: pip install grpcio-status

extra:
  recipe-maintainers:
    - rxm7706

