# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: sphinxcontrib-confluencebuilder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-confluencebuilder/sphinxcontrib_confluencebuilder-${{ version }}.tar.gz
  sha256: 802d069f09dc27730fad6addcf3e77ee28616c9379b8797fa292e752670cf911

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - requests >=2.30.0
    - sphinx >=8.0

tests:
  - python:
      imports:
        - sphinxcontrib.confluencebuilder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sphinxcontrib-confluencebuilder/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Sphinx extension to build Atlassian Confluence Storage Markup
  description: |
    Sphinx extension to build Atlassian Confluence Storage Markup
  repository: https://github.com/sphinx-contrib/confluencebuilder
  documentation: https://sphinxcontrib-confluencebuilder.readthedocs.io

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - maresb

