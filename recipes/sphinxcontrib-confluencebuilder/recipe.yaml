# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: python_min|default("3.9")
  name: sphinxcontrib-confluencebuilder
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sphinxcontrib_confluencebuilder-${{ version }}.tar.gz
  sha256: e5e06bd7e42a4432b05d90c28501b959fe69efdceabc21b2094a772a0360d721

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sphinx-build-confluence = sphinxcontrib.confluencebuilder.__main__:main

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.7
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.30.0
    - sphinx >=8.0

tests:
  - python:
      imports:
        - sphinxcontrib
        - sphinxcontrib.confluencebuilder
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - sphinx-build-confluence --help

about:
  summary: Sphinx extension to build Atlassian Confluence Storage Markup
  license: BSD-2-Clause
  license_file:
    - LICENSE-3RD-PARTY
    - LICENSE
  homepage: https://github.com/sphinx-contrib/confluencebuilder
  repository: https://github.com/sphinx-contrib/confluencebuilder

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - maresb
