# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.0.0.9"

package:
  name: teradatasqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/teradatasqlalchemy/teradatasqlalchemy-20.0.0.9-py3-none-any.whl
  sha256: c2f5e248561ae59ecfc78b626f97a6d417ca032c0cec0d04356091a3adff04db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4.0
    - teradatasql >=17.0.0.2

tests:
  - python:
      imports:
        - teradatasqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.teradata.com/
  license: MIT
  license_file: LICENSE
  summary: Teradata SQL Driver Dialect for SQLAlchemy
  description: |
    Teradata SQL Driver Dialect for SQLAlchemy

extra:
  recipe-maintainers:
    - rxm7706

