# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.6"

package:
  name: fastprogress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastprogress/fastprogress-${{ version }}.tar.gz
  sha256: 7de3a5b136fdf0a9763c19180d0bdfc1bb8c6172b09123c0e4ba272d0c092d0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - fastcore >=1.10.0
    - python-fasthtml >=0.12.34

tests:
  - python:
      imports:
        - fastprogress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastprogress/
  license: Apache-2.0
  license_file: LICENSE
  summary: A nested progress with plotting options for fastai
  description: |
    A nested progress with plotting options for fastai
  repository: https://github.com/answerdotai/fastprogress
  documentation: https://fastprogress.fast.ai/

extra:
  recipe-maintainers:
    - andersy005

