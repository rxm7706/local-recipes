# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastprogress
  version: "1.1.6"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7de3a5b136fdf0a9763c19180d0bdfc1bb8c6172b09123c0e4ba272d0c092d0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=64.0
    - pip
  run:
    - python >=${{ python_min }}
    - fastcore >=1.10.0
    - python-fasthtml >=0.12.34
    - ipython

tests:
  - python:
      imports:
        - fastprogress
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A fast and simple progress bar for Jupyter Notebook and console.
  homepage: https://github.com/fastai/fastprogress
  repository: https://github.com/fastai/fastprogress
  documentation: https://github.com/fastai/fastprogress

extra:
  recipe-maintainers:
    - andersy005
