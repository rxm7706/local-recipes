# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: acl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/acl/acl-${{ version }}.tar.gz
  sha256: 30c7257ace2f3b607ba64f1bdf5114af57f3ea191481d77bc985386c8bdef048

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - acl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jathanism/acl
  license: Apache-2.0
  license_file: LICENSE
  summary: Network access control list parsing library.
  description: |
    Network access control list parsing library.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
