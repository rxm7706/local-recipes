# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-wildewidgets
  version: "1.7.3"
  python_min: "3.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 9f63f90a684434227a02ac2fdcaa33c67f7cb0262170010908fe35cb92b1c7dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.14.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=5.1
    - django-crispy-forms >=2.4
    - crispy-bootstrap5 >=2025.6

tests:
  - python:
      imports:
        - wildewidgets
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: django-wildewidgets is a Django design library providing several tools for building full-featured, widget-based web applications with a standard, consistent design, based on Bootstrap.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/caltechads/django-wildewidgets

extra:
  recipe-maintainers:
    - rxm7706

