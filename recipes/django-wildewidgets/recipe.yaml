# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"
  python_min: "3.14"

package:
  name: django-wildewidgets
  version: ${{ version }}

source:
  url: 
    https://pypi.org/packages/source/d/django-wildewidgets/django_wildewidgets-${{
    version }}.tar.gz
  sha256: c9cca8b87c913f06a649474da962b012296ae9cafac4d88eafb882497c148ae9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=5.1
    - django-crispy-forms >=2.4
    - crispy-bootstrap5 >=2025.6

tests:
  - python:
      imports:
        - wildewidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/caltechads/django-wildewidgets
  license: MIT
  license_file: LICENSE.txt
  summary: django-wildewidgets is a Django design library providing several 
    tools for building full-featured, widget-based web applications with a 
    standard, consistent design, based on Bootstrap.
  description: |
    django-wildewidgets is a Django design library providing several tools for building full-featured, widget-based web applications with a standard, consistent design, based on Bootstrap.
extra:
  recipe-maintainers:
    - rxm7706

