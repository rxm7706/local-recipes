# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.0"

package:
  name: spacytextblob
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacytextblob/spacytextblob-${{ version }}.tar.gz
  sha256: c551aa3bacf16f8a70295987fc76f2878b131f8b105d7fdb0becfb21155b5b2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.5,<0.10.0
  run:
    - python >=${{ python_min }}
    - spacy >=3.8.7
    - textblob >=0.18.0.post0

tests:
  - python:
      imports:
        - spacytextblob
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://spacytextblob.netlify.app/
  license: MIT
  license_file: LICENSE
  summary: A TextBlob sentiment analysis pipeline component for spaCy.
  description: |
    A TextBlob sentiment analysis pipeline component for spaCy.
  repository: https://github.com/SamEdwardes/spacytextblob
  documentation: https://spacytextblob.netlify.app/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
