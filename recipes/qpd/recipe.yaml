# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: qpd
  version: "0.4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/qpd-${{ version }}.tar.gz
  sha256: e0ed05b88e321ea9935874377bda11339c90f1469f34344e9b41d16b8088e136

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - adagio
    - antlr4-python3-runtime >=4.11.1,<4.12
    - pandas >=1.2.0
    - python >=${{ python_min }}
    - triad >=0.9.0

tests:
  - python:
      imports:
        - qpd
        - qpd_dask
        - qpd_pandas
        - qpd_ray
        - qpd_test
        - qpd_version
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Query Pandas Using SQL
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/qpd/

extra:
  recipe-maintainers:
    - charlesbluca
    - kvnkho
    - goodwanghan
    - thewchan
