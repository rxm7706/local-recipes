# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.4.8"

package:
  name: django-select2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-select2/django_select2-${{ version }}.tar.gz
  sha256: 592e52effff2b5850cb7c98b265715b6704fb784699c4aedddfdd8ae1ffa1e81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2
    - flit-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - django-appconf >=0.6.0

tests:
  - python:
      imports:
        - django_select2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/codingjoe/django-select2
  license: MIT
  license_file: LICENSE
  summary: This is a Django_ integration of Select2_.
  description: |
    This is a Django_ integration of Select2_.
  repository: https://github.com/codingjoe/django-select2
  documentation: https://django-select2.rtfd.io/

extra:
  recipe-maintainers:
    - swainn
    - gagelarsen

