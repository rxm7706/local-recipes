# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: db-dtypes
  version: 1.7.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 75adf3bdf3174a6474ea4162d9a345ea0b3102ec4fd603e69ec26b6e8a99145a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging >=24.2.0
    - pandas >=1.5.3,<4.0.0
    - pyarrow >=13.0.0
    # use more restrictive bounds for py 3.10 to stay noarch: python
    - numpy >=1.24.0,<=2.2.6
tests:
  - python:
      imports:
        - db_dtypes
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pandas Data Types for SQL systems (BigQuery, Spanner)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/db-dtypes
  documentation: https://googleapis.dev/python/db-dtypes/latest/index.html

extra:
  recipe-maintainers:
    - xylar
    - tswast
