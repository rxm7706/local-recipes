# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: db-dtypes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/db-dtypes/db_dtypes-${{ version }}.tar.gz
  sha256: 75adf3bdf3174a6474ea4162d9a345ea0b3102ec4fd603e69ec26b6e8a99145a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy <=2.2.6,>=1.24.0
    - packaging >=24.2.0
    - pandas <4.0.0,>=1.5.3
    - pyarrow >=13.0.0

tests:
  - python:
      imports:
        - db_dtypes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/db-dtypes
  license: Apache-2.0
  license_file: LICENSE
  summary: Pandas Data Types for SQL systems (BigQuery, Spanner)
  description: |
    Pandas Data Types for SQL systems (BigQuery, Spanner)

extra:
  recipe-maintainers:
    - xylar
    - tswast

