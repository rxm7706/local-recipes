# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: keybert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keybert/keybert-${{ version }}.tar.gz
  sha256: eec8ebd37d3d9fa238d7075e727adb993de4f3ed67c94112840e4cc0e55d7657

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.18.5
    - rich >=10.4.0
    - scikit-learn >=0.22.2
    - sentence-transformers >=0.3.8

tests:
  - python:
      imports:
        - keybert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MaartenGr/KeyBERT
  license: MIT
  license_file: LICENSE
  summary: KeyBERT performs keyword extraction with state-of-the-art transformer models.
  description: |
    KeyBERT performs keyword extraction with state-of-the-art transformer models.
  repository: https://github.com/MaartenGr/KeyBERT.git
  documentation: https://maartengr.github.io/KeyBERT/

extra:
  recipe-maintainers:
    - thomasmarwitz

#### CFE metadata AND comments
