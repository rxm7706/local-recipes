# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.9"

package:
  name: ansible-tower-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible-tower-cli/ansible-tower-cli-${{ version }}.tar.gz
  sha256: 2f848fa84dd2f178927fbee825959ab58b6b6afcc4c70c4607d09c5fd961a2b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tower_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/tower-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: A CLI tool for Ansible Tower and AWX.
  description: |
    A CLI tool for Ansible Tower and AWX.

extra:
  recipe-maintainers:
    - rxm7706

