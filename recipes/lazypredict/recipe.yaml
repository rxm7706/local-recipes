# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lazypredict
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lazypredict-${{ version }}.tar.gz
  sha256: 41466cb337d59563296ca56b262c8037add022283c79c4ebb6ce7a449b979880

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - lazypredict=lazypredict.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64,<75
    - wheel
  run:
    - python >=${{ python_min }}
    - click
    - scikit-learn >=1.0
    - pandas >=1.3
    - tqdm >=4.0
    - joblib >=1.0
    - numpy >=1.21

tests:
  - python:
      imports:
        - lazypredict
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - lazypredict --help

about:
  summary: Rapid low code ML testing with multiple basic models
  license: MIT
  license_file: LICENSE
  description: |
    Lazy Predict help build a lot of basic models without much code and helps
    understand which models works better without any parameter tuning


  homepage: https://github.com/shankarpandala/lazypredict

extra:
  recipe-maintainers:
    - thewchan
