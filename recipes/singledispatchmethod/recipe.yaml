schema_version: 1

context:
  version: "1.0"

package:
  name: singledispatchmethod
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/singledispatchmethod/singledispatchmethod-${{ version }}.tar.gz
  sha256: 183a7fbeab53b9c9d182f8b8f9c2d7e109a7d40afaa30261d81dd8de68cd73bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - singledispatchmethod
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ikalnytskyi/singledispatchmethod
  license: MIT
  license_file: LICENSE
  summary: Backport of @functools.singledispatchmethod to Python 2.7-3.7.
  description: |
    Backport of @functools.singledispatchmethod to Python 2.7-3.7.
  repository: https://github.com/ikalnytskyi/singledispatchmethod
  documentation: https://docs.python.org/3.8/library/functools.html#functools.singledispatchmethod

extra:
  recipe-maintainers:
    - AntoineD

