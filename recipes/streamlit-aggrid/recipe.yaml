# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: streamlit-aggrid
  version: 1.2.1.post2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ad186998894af9356d7fa1d6de9f324a376714583cccc31d87c8c003334089fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry
    - python 3.10.*
  run:
    - pandas >=1.4
    - python >=${{ python_min }},<4.0
    - python-decouple
    - streamlit >=1.2

tests:
  - python:
      imports:
        - st_aggrid
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Streamlit component implementation of ag-grid
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/PablocFonseca/streamlit-aggrid

extra:
  recipe-maintainers:
    - maxibor
    - timkpaine
