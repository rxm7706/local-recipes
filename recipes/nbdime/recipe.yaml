# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.4"

package:
  name: nbdime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nbdime/nbdime-${{ version }}.tar.gz
  sha256: 8cd25ecfeeb5105d563237d7f64eb4748058fba9bba9ab3892a1ff61e177ce16

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
  run:
    - python >=${{ python_min }}
    - colorama
    - gitpython !=2.1.4,!=2.1.5,!=2.1.6
    - jinja2 >=2.9
    - jupyter-server
    - nbformat
    - pygments
    - requests
    - tornado

tests:
  - python:
      imports:
        - nbdime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://nbdime.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Diff and merge of Jupyter Notebooks
  description: |
    Diff and merge of Jupyter Notebooks
  repository: https://github.com/jupyter/nbdime

extra:
  recipe-maintainers:
    - kain88-de
    - minrk
    - ocefpaf
    - bollwyvl

