# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.0"

package:
  name: threadpoolctl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/threadpoolctl/threadpoolctl-${{ version }}.tar.gz
  sha256: 8ab8b4aa3491d812b623328249fab5302a68d2d71745c8a4c719a2fcaba9f44e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - threadpoolctl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/joblib/threadpoolctl
  license: BSD-3-Clause
  license_file: LICENSE
  summary: threadpoolctl
  description: |
    threadpoolctl

extra:
  recipe-maintainers:
    - ogrisel
    - tomMoral
    - jeremiedbb

