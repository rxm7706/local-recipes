# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1"

package:
  name: multimethod
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multimethod/multimethod-${{ version }}.tar.gz
  sha256: c59e75fbe51516ed632d3df4b56df0876747be001c068d3ee1e83e9f65c2846f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - multimethod
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/coady/multimethod
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Multiple argument dispatching.
  description: |
    Multiple argument dispatching.
  documentation: https://coady.github.io/multimethod

extra:
  recipe-maintainers:
    - timkpaine
    - albop

#### CFE metadata AND comments
