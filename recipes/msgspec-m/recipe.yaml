# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.19.3"

package:
  name: msgspec-m
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msgspec-m/msgspec_m-${{ version }}.tar.gz
  sha256: 074d56f17de25e6c0f4184ecff9c163de0f612a9956260df4342f3f51d959c41

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - versioneer

tests:
  - python:
      imports:
        - msgspec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/marimo-team/msgspec
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A fast serialization and validation library, with builtin support for JSON, MessagePack, YAML, and TOML.
  description: |
    A fast serialization and validation library, with builtin support for JSON, MessagePack, YAML, and TOML.
  repository: https://github.com/marimo-team/msgspec
  documentation: https://jcristharif.com/msgspec/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
