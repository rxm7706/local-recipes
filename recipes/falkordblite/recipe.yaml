# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"
  python_min: "3.12"

package:
  name: falkordblite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/falkordblite/falkordblite-${{ version }}.tar.gz
  sha256: 65a72abafd30711f699c15571df6959edb8901605053ce940ccdd837832e709b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82.0.1
    - wheel
  run:
    - python >=${{ python_min }}
    - redis-py >=4.5
    - falkordb >=1.2.0
    - psutil
    - setuptools >38.0

tests:
  - python:
      imports:
        - redislite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.falkordb.com/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: FalkorDB embedded in a Python package
  description: |
    FalkorDB embedded in a Python package
  repository: https://github.com/FalkorDB/falkordblite
  documentation: https://docs.falkordb.com/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
