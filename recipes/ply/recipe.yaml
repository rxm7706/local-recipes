# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.11"

package:
  name: ply
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ply/ply-${{ version }}.tar.gz
  sha256: 00c7c1aaa88358b9c765b6d3000c6eec0ba42abca5351b095321aef446081da3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ply
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.dabeaz.com/ply/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python Lex & Yacc
  description: |
    Python Lex & Yacc

extra:
  recipe-maintainers:
    - scopatz
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ply
  cfe-upstream-registry: pypi
  cfe-upstream-name: ply
  cfe-purls:
    - pkg:conda/ply@${{ version }}?channel=conda-forge
    - pkg:pypi/ply@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://www.dabeaz.com/ply/
  cfe-import-names: [ply]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ply-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-3.11

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T03:07:50Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T03:07:50Z
  cfe-local-build-status: failed
  cfe-local-build-datetime: 2026-08-18T03:07:50Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
