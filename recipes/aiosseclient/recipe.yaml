# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.8"

package:
  name: aiosseclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiosseclient/aiosseclient-${{ version }}.tar.gz
  sha256: 7180d4c6e5d514f3e036bd7c658ef1b9acd6b296f97d2d1c237e9ed6795c36e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - aiohttp

tests:
  - python:
      imports:
        - aiosseclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ebraminio/aiosseclient
  license: MIT
  license_file: LICENSE
  summary: Asynchronous Server Sent Event streams client.
  description: |
    Asynchronous Server Sent Event streams client.

extra:
  recipe-maintainers:
    - rxm7706

