# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.1"

package:
  name: llama-index-llms-ollama
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-ollama/llama_index_llms_ollama-${{ version }}.tar.gz
  sha256: 470ed836dee43bc0171dc05c68c2daa3618a7c38166b8044d7f8360cd8cd8fa6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.14.5
    - ollama-python >=0.5.3

tests:
  - python:
      imports:
        - llama_index.llms.ollama
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-ollama/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms ollama integration
  description: |
    llama-index llms ollama integration

extra:
  recipe-maintainers:
    - rxm7706

