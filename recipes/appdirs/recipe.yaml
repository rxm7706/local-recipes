    - pkg:pypi/appdirs@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/ActiveState/appdirs
  cfe-import-names: [appdirs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/appdirs-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.4.4

  cfe-forge-blocker-list:
