# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: asteroid-filterbanks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asteroid-filterbanks/asteroid-filterbanks-${{ version }}.tar.gz
  sha256: 415f89d1dcf2b13b35f03f7a9370968ac4e6fa6800633c522dac992b283409b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch
    - typing_extensions

tests:
  - python:
      imports:
        - asteroid_filterbanks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/asteroid-team/asteroid-filterbanks
  license: MIT
  license_file: LICENSE
  summary: Asteroid's filterbanks
  description: |
    Asteroid's filterbanks

extra:
  recipe-maintainers:
    - rxm7706

