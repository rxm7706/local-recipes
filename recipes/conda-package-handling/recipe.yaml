# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.0"

package:
  name: conda-package-handling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-package-handling/conda_package_handling-${{ version }}.tar.gz
  sha256: 5c611fd2ffedea2ef1f7f43bef8f1c624f8722712b1d8b8a6c2ab5e70d4c2b94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - conda-package-streaming >=0.12.0
    - requests
    - zstandard >=0.15

tests:
  - python:
      imports:
        - conda_package_handling
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/conda/conda-package-handling
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Create and extract conda packages of various formats.
  description: |
    Create and extract conda packages of various formats.
  documentation: https://conda.github.io/conda-package-handling/

extra:
  recipe-maintainers:
    - beckermr
    - dbast
    - dholth
    - jezdez
    - msarahan

