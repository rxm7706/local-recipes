{% set name = "opentelemetry-instrumentation-mysql" %}
{% set version = "0.66b1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_mysql-{{ version }}.tar.gz
  sha256: 5b7b20af1433269ca48b25a4e977e07a57f2db71c319a918cf68ba541ca65bfe

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-dbapi ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
    # - opentelemetry-test-utils ==0.37b0
