# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.77.0"

package:
  name: streamlit-webrtc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-webrtc/streamlit_webrtc-${{ version }}.tar.gz
  sha256: 2cb90e8c4ab9c4190c21e7e7cd3ac510f9fc541b2fca4c783e134fc85ccc5ccd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - aioice >=0.10.1
    - aiortc >=1.14.0
    - av >=15.1.0
    - packaging >=20.0
    - streamlit >=1.51.0

tests:
  - python:
      imports:
        - streamlit_webrtc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-webrtc/
  license: MIT
  license_file: LICENSE
  summary: Real-time video and audio processing on Streamlit
  description: |
    Real-time video and audio processing on Streamlit
  repository: https://github.com/whitphx/streamlit-webrtc

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
