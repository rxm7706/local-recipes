# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.7"

package:
  name: parso
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parso/parso-${{ version }}.tar.gz
  sha256: eaaac4c9fdd5e9e8852dc778d2d7405897ec510f2a298071453e5e3a07914bb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parso
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidhalter/parso
  license: MIT
  license_file: LICENSE.txt
  summary: A Python Parser
  description: |
    A Python Parser

extra:
  recipe-maintainers:
    - iron0012
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: parso
  cfe-upstream-registry: pypi
  cfe-upstream-name: parso
  cfe-purls:
    - pkg:conda/parso@${{ version }}?channel=conda-forge
    - pkg:pypi/parso@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/davidhalter/parso
  cfe-import-names: [parso]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/parso-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T02:46:11Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T02:46:11Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T02:46:11Z
