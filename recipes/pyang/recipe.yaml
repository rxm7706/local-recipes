# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.1"

package:
  name: pyang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyang/pyang-${{ version }}.tar.gz
  sha256: ccffeebc6796a462ed6f63e802b9d61b0f21bf6cee0af88362cbda553483fe32

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml

tests:
  - python:
      imports:
        - pyang
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mbj4668/pyang
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A YANG (RFC 6020/7950) validator and converter
  description: |
    A YANG (RFC 6020/7950) validator and converter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyang
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyang
  cfe-purls:
