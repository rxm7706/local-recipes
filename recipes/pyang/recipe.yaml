    - pkg:pypi/pyang@${{ version }}
  cfe-upstream-repo: https://github.com/mbj4668/pyang
  cfe-upstream-homepage: https://github.com/mbj4668/pyang
  cfe-import-names: [pyang]
  cfe-source-kind: pypi-sdist
