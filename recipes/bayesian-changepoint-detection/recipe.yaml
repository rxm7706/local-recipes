# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.dev1"

package:
  name: bayesian-changepoint-detection
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bayesian-changepoint-detection/bayesian_changepoint_detection-${{ version }}.tar.gz
  sha256: 97ca291d47f0cdd03e7f76739d8edc538cd7305a78df93e12a002ef51100f644

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bayesian_changepoint_detection
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/hildensia/bayesian_changepoint_detection
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Some Bayesian changepoint detection algorithms
  description: |
    Some Bayesian changepoint detection algorithms

extra:
  recipe-maintainers:
    - rxm7706

