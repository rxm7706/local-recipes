# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: parsel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parsel/parsel-${{ version }}.tar.gz
  sha256: 5925fe087eb16fc404a7ed91e31e2c1e2a9b230da4b64f34d81358c0d0e27e88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - cssselect >=1.2.0
    - jmespath >=1.0.0
    - lxml >=5.1.0
    - packaging >=23.0
    - w3lib >=1.19.0

tests:
  - python:
      imports:
        - parsel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/parsel
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Parsel is a library to extract data from HTML and XML using XPath and CSS selectors
  description: |
    Parsel is a library to extract data from HTML and XML using XPath and CSS selectors
  repository: https://github.com/scrapy/parsel
  documentation: https://parsel.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - synapticarbors
    - Gallaecio
    - kmike
    - wRAR
    - dangra
    - rmax

#### CFE metadata AND comments
