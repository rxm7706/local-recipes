# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: mindsdb-sql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mindsdb-sql/mindsdb_sql-${{ version }}.tar.gz
  sha256: 747a0db1dc7208f9b2842b22dd7efb02ee93b26db0b723f92ec3656b67283cd0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - sly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mindsdb/mindsdb_sql
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Pure python SQL parser
  description: |
    Pure python SQL parser

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mindsdb-sql
