    - pkg:pypi/hatchling@${{ version }}
  cfe-upstream-repo: https://github.com/pypa/hatch/tree/master/backend
  cfe-upstream-homepage: https://hatch.pypa.io/latest/
  cfe-import-names: [hatchling]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/hatchling-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
