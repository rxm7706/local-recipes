# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.32.0"

package:
  name: hatchling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hatchling/hatchling-${{ version }}.tar.gz
  sha256: 0bdbde4a52b06c37e3eca395f85a762bf0ef06fe374fd8ae429dc6be10230f5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - hatchling
    - packaging >=24.2
    - pathspec >=0.10.1
    - pluggy >=1.0.0
    - tomli >=1.2.2
    - tomlkit >=0.11.1
    - trove-classifiers

tests:
  - python:
      imports:
        - hatchling
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://hatch.pypa.io/latest/
  license: MIT
  license_file: LICENSE.txt
  summary: Modern, extensible Python build backend
  description: |
    Modern, extensible Python build backend
  repository: https://github.com/pypa/hatch/tree/master/backend

extra:
  recipe-maintainers:
    - ofek
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: hatchling
  cfe-upstream-registry: pypi
  cfe-upstream-name: hatchling
  cfe-purls:
