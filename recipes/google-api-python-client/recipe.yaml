# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.198.0"

package:
  name: google-api-python-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-api-python-client/google_api_python_client-${{ version }}.tar.gz
  sha256: dfe3e16fb241af6e9c460a33f65085b3450e05cea09364f6b5d8997fb7e43e2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httplib2 <1.0.0,>=0.19.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=1.32.0
    - google-auth-httplib2 <1.0.0,>=0.2.0
    - google-api-core !=2.0.*,!=2.1.*,!=2.2.*,!=2.3.0,<3.0.0,>=1.31.5
    - uritemplate <5,>=3.0.1

tests:
  - python:
      imports:
        - apiclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-api-python-client/
  license: Apache-2.0
  license_file: LICENSE
  summary: Google API Client Library for Python
  description: |
    Google API Client Library for Python

extra:
  recipe-maintainers:
    - xylar
    - akrherz
    - ocefpaf

