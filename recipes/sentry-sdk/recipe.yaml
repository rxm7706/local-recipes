# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.68.0"

package:
  name: sentry-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sentry-sdk/sentry_sdk-${{ version }}.tar.gz
  sha256: 648c58e9887311a03470a41539e24bdbbf64a30ca4f5336f7e3dcc87276400b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 >=1.26.11
    - certifi

tests:
  - python:
      imports:
        - sentry_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/getsentry/sentry-python
  license: MIT
  license_file: LICENSE
  summary: "Python client for Sentry (https://sentry.io)"
  description: |
    Python client for Sentry (https://sentry.io)
  documentation: https://docs.sentry.io/platforms/python/

extra:
  recipe-maintainers:
    - rxm7706
    - alippai
    - dgasmith
    - djsutherland

