# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.25"

package:
  name: hub-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hub-sdk/hub_sdk-${{ version }}.tar.gz
  sha256: 7c686d395a39b0cf826a9380be8349cbea109b4664cedaea58e92de422e42a58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=70.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - hub_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ultralytics.com
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Ultralytics HUB Client SDK.
  description: |
    Ultralytics HUB Client SDK.
  repository: https://github.com/ultralytics/hub-sdk
  documentation: https://docs.ultralytics.com

extra:
  recipe-maintainers:
    - rxm7706

