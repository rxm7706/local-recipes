# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.3"

package:
  name: pyside6-fluent-widgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PySide6-Fluent-Widgets/pyside6_fluent_widgets-${{ version }}.tar.gz
  sha256: bfb86a12e0d88edf1a1b4327b79e84767771ba0d2a294c4cb1fe170e026ebc16

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyside6
    - pysidesix-frameless-window >=0.8.0
    - darkdetect

tests:
  - python:
      imports:
        - qfluentwidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://qfluentwidgets.com
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A fluent design widgets library based on PySide6
  description: |
    A fluent design widgets library based on PySide6
  repository: https://github.com/zhiyiYo/PyQt-Fluent-Widgets/tree/PySide6
  documentation: https://qfluentwidgets.com/

extra:
  recipe-maintainers:
    - rxm7706

