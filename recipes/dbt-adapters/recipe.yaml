# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.24.5"

package:
  name: dbt-adapters
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-adapters/dbt_adapters-${{ version }}.tar.gz
  sha256: 87de096a0d5b219905f1079b002f13e3447ffb63558f4f3c5b7278670d198acb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - agate <2.0,>=1.0
    - dbt-common <2.0,>=1.36
    - dbt-protos <2.0,>=1.0.291
    - mashumaro <3.18,>=3.9
    - protobuf <7.0,>=6.0
    - pytz >=2015.7
    - typing_extensions <5.0,>=4.0

tests:
  - python:
      imports:
        - dbt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dbt-labs/dbt-adapters/tree/main/dbt-adapters
  license: Apache-2.0
  license_file: LICENSE
  summary: The set of adapter protocols and base functionality that supports integration with dbt-core
  description: |
    The set of adapter protocols and base functionality that supports integration with dbt-core
  repository: https://github.com/dbt-labs/dbt-adapters.git#subdirectory=dbt-adapters
  documentation: https://docs.getdbt.com

extra:
  recipe-maintainers:
    - conda-forge/dbt
    - thewchan
    - rxm7706

