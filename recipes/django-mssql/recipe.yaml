# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8"

package:
  name: django-mssql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-mssql/django-mssql-${{ version }}.tar.gz
  sha256: d1b041c14da4eba9239936f97460ffad7b245654a9a92c4d337e2fa9e8928a2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - sqlserver_ado
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/Manfre/django-mssql
  license: MIT
  license_file: LICENSE
  summary: Django backend database support for MS SQL Server.
  description: |
    Django backend database support for MS SQL Server.

extra:
  recipe-maintainers:
    - rxm7706

