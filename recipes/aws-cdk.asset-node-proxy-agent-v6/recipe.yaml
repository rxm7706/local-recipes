# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2"

package:
  name: aws-cdk.asset-node-proxy-agent-v6
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aws-cdk.asset-node-proxy-agent-v6/aws_cdk_asset_node_proxy_agent_v6-${{ version }}.tar.gz
  sha256: 1340588dd351dcae37e07188f39075364f73ccde6ed9468c1184b06ada4af665

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ~=75.3.2
    - python-build ~=1.3.0
  run:
    - python >=${{ python_min }}
    - python-jsii <2.0.0,>=1.129.0
    - publication >=0.0.3
    - typeguard ==2.13.3

tests:
  - python:
      imports:
        - aws_cdk.asset_node_proxy_agent_v6._jsii
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cdklabs/awscdk-asset-node-proxy-agent#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: "@aws-cdk/asset-node-proxy-agent-v6"
  description: |
    @aws-cdk/asset-node-proxy-agent-v6
  repository: https://github.com/cdklabs/awscdk-asset-node-proxy-agent.git

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

