# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: rfc3987-syntax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rfc3987-syntax/rfc3987_syntax-${{ version }}.tar.gz
  sha256: 717a62cbf33cffdd16dfa3a497d81ce48a660ea691b1ddd7be710c22f00b4a0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - lark >=1.2.2

tests:
  - python:
      imports:
        - rfc3987_syntax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/willynilly/rfc3987-syntax
  license: MIT
  license_file: LICENSE
  summary: Helper functions to syntactically validate strings according to RFC 3987.
  description: |
    Helper functions to syntactically validate strings according to RFC 3987.
  repository: https://github.com/willynilly/rfc3987-syntax
  documentation: https://github.com/willynilly/rfc3987-syntax#readme

extra:
  recipe-maintainers:
    - bollwyvl

