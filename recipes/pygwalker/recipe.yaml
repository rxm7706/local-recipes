# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0.1"

package:
  name: pygwalker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygwalker/pygwalker-${{ version }}.tar.gz
  sha256: f37f83104e26b0824531675396fe9108b0e2d2a1936b2d85d24ae2d9314c9977

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anywidget
    - appdirs
    - arrow
    - astor
    - cachetools
    - python-duckdb <2.0.0,>=0.10.4
    - gw-dsl-parser ==0.1.49.1
    - ipylab <=1.0.0
    - ipython
    - ipywidgets
    - jinja2
    - kanaries-track ==0.0.5
    - numpy
    - packaging
    - pandas
    - psutil
    - pyarrow
    - pydantic
    - pytz
    - requests
    - segment-analytics-python ==2.2.3
    - sqlalchemy
    - sqlglot >=23.15.8
    - traitlets
    - typing_extensions

tests:
  - python:
      imports:
        - pygwalker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://kanaries.net/pygwalker
  license: Apache-2.0
  license_file: LICENSE
  summary: "pygwalker: turn your data into an interactive UI for data exploration and visualization"
  description: |
    pygwalker: turn your data into an interactive UI for data exploration and visualization

extra:
  recipe-maintainers:
    - gabrielcnr
    - Asm-Def
    - longxiaofei
    - rxm7706

#### CFE metadata AND comments
