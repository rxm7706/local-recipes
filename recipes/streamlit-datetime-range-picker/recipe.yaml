# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: streamlit-datetime-range-picker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-datetime-range-picker/streamlit-datetime-range-picker-${{ version }}.tar.gz
  sha256: 2aad1512d8db8979f968bcc3ce8650369403ecc415412d491ae0e9119d9f1b6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.27.0

tests:
  - python:
      imports:
        - streamlit_datetime_range_picker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/imdreamer2018/streamlit-datetime-range-picker
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: this is datetime range picker for streamlit
  description: |
    this is datetime range picker for streamlit

extra:
  recipe-maintainers:
    - rxm7706

