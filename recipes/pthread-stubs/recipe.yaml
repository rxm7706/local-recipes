# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# NOTE: no Visual Studio dependent features, since this package does not build
# or install any binary code on Windows. It needs m2w64-toolchain for the
# configure script to run, but msys2 provides sufficient pthreads bits for
# downstream packages.
schema_version: 1

context:
  xorg_name: libpthread-stubs
  xorg_category: xcb
  name: pthread-stubs
  version: "0.4"
  sha256: e4d05911a3165d3b18321cc067fdd2f023f06436e391c6a28dff618a78d2e733
  am_version: "1.15"  # keep synchronized with build.sh

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.bz2
  sha256: ${{ sha256 }}
  file_name: ${{ xorg_name }}-${{ version }}.tar.bz2

build:
  number: 1003
  prefix_detection:
    ignore_binary_files: false

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - pkg-config
    - if: unix
      then: gnuconfig
    - if: win
      then: m2-base
    - if: unix
      then: make
    - if: win
      then: m2-make
    - if: unix
      then: ${{ compiler('c') }}
    - if: unix
      then: ${{ stdlib("c") }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: win
      then: ${{ stdlib("m2w64_c") }}
  host:
    - xorg-util-macros

tests:
    script:

about:
  license: MIT
  license_file: COPYING
  summary: Stubs missing from libc for standard pthread functions
  homepage: https://xcb.freedesktop.org/

extra:
  recipe-maintainers:
    - ccordoba12
    - mingwandroid
    - pkgw
