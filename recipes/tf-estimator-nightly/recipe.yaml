schema_version: 1

context:
  version: "2.16.0.dev2024012409"

package:
  name: tf-estimator-nightly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/t/tf-estimator-nightly/tf_estimator_nightly-2.16.0.dev2024012409-py2.py3-none-any.whl
  sha256: 002db7fdf4bf185a269b5146fa78e93451cdccd7b6f8a52b9ec10bdf31608e05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tf_estimator_nightly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.tensorflow.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: TensorFlow Estimator.
  description: |
    TensorFlow Estimator.

extra:
  recipe-maintainers:
    - rxm7706

