# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-timeout
  version: "2.4.0"
  hash: 7e68e90b01f9eff71332b25001f85c75495fc4e3a836701876183c4bcfd0540a
  ext: tar.gz

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ ext }}

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --ignore-installed

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - pytest_timeout
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pytest
        - python ${{ python_min }}
    script:
      - py.test --help

about:
  license: MIT
  license_file: LICENSE
  summary: This is a plugin which will terminate tests after a certain timeout.
  description: |
    pytest-timeout is a plugin which will terminate tests after a certain timeout.
    When doing so it will show a stack dump of all threads running at the time.
  homepage: https://github.com/pytest-dev/pytest-timeout
  repository: https://github.com/pytest-dev/pytest-timeout

extra:
  recipe-maintainers:
    - flub
    - nicoddemus
