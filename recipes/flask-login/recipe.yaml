# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.3"

package:
  name: flask-login
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Login/Flask-Login-${{ version }}.tar.gz
  sha256: 5e23d14a607ef12806c699590b89d0f0e0d67baeec599d75947bf9c147330333

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=1.0.4
    - werkzeug >=1.0.1

tests:
  - python:
      imports:
        - flask_login
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/maxcountryman/flask-login
  license: MIT
  license_file: LICENSE
  summary: User authentication and session management for Flask.
  description: |
    User authentication and session management for Flask.
  repository: https://github.com/maxcountryman/flask-login
  documentation: https://flask-login.readthedocs.io/

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors
    - xylar

