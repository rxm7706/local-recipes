# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: conda-package-streaming
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-package-streaming/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a58868bedb6231485008c6fef0326900cd6fab51b6ed9942457100836c5c8588

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-build-isolation . -vv

requirements:
  host:
    - flit-core
    - python ${{ python_min }}
    - pip
  run:
    - backports.zstd
    - python >=${{ python_min }}
    # 'requests' is optional, only needed for 'url' submodule

tests:
  - python:
      imports:
        - conda_package_streaming.url
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Download metadata from conda packages without transferring entire file.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/conda/conda-package-streaming
  repository: https://github.com/conda/conda-package-streaming
  documentation: https://conda.github.io/conda-package-streaming/

extra:
  recipe-maintainers:
    - dholth
