# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: conda-package-streaming
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-package-streaming/conda_package_streaming-${{ version }}.tar.gz
  sha256: b2599426dee4a81bfe6aa40d5fb0a22ae5ff842a0a7f9df59f013bfbcd369f72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - requests
    - backports.zstd

tests:
  - python:
      imports:
        - conda_package_streaming
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/conda/conda-package-streaming
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An efficient library to read from new and old format .conda and .tar.bz2 conda packages.
  description: |
    An efficient library to read from new and old format .conda and .tar.bz2 conda packages.
  documentation: https://conda.github.io/conda-package-streaming/

extra:
  recipe-maintainers:
    - dholth

