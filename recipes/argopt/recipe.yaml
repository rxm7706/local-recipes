# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.1"

package:
  name: argopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/argopt/argopt-${{ version }}.tar.gz
  sha256: 29780679f4ff620ffbc897c74415bf99a80fb61c26afdb10fe7aac887efb770e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - argopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/argopt/
  license: MPL-2.0
  license_file: LICENCE
  summary: doc to argparse driven by docopt
  description: |
    doc to argparse driven by docopt
extra:
  recipe-maintainers:
    - casperdcl
    - jiangweiyao

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: argopt
