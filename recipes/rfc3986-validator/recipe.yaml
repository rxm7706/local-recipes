# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rfc3986-validator
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/rfc3986_validator/rfc3986_validator-${{ version }}.tar.gz
  sha256: 3d44bde7921b3b9ec3ae4e3adca370438eccebc676456449b145d533b240d055

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - setuptools
    - pip
    - pytest-runner
  run:
    - python

tests:
  - python:
      imports:
        - rfc3986_validator
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Pure python rfc3986 validator
  description: >
    Pure python rfc3986 validator


  homepage: https://github.com/naimetti/rfc3986-validator
  repository: https://github.com/naimetti/rfc3986-validator
  documentation: https://github.com/naimetti/rfc3986-validator

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
