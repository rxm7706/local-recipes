# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.4"

package:
  name: joserfc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/joserfc/joserfc-${{ version }}.tar.gz
  sha256: b3bc561672ae541b17a9237053b48a03dacddd92d68047b3ecdfb4b5714a88ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography >=45.0.1

tests:
  - python:
      imports:
        - joserfc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/joserfc/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The ultimate Python library for JOSE RFCs, including JWS, JWE, JWK, JWA, JWT
  description: |
    The ultimate Python library for JOSE RFCs, including JWS, JWE, JWK, JWA, JWT
  repository: https://github.com/authlib/joserfc
  documentation: https://jose.authlib.org/

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
