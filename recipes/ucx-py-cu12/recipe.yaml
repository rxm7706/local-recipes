# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.45.0"

package:
  name: ucx-py-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/ucx-py-cu12/ucx-py-cu12-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - libucx-cu12 <1.19,>=1.15.0
    - numpy <3.0a0,>=1.23
    - pynvml <13.0.0a0,>=12.0.0

tests:
  - python:
      imports:
        - ucx_py_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/ucx-py
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Bindings for the Unified Communication X library (UCX)
  description: |
    Python Bindings for the Unified Communication X library (UCX)
  repository: https://github.com/rapidsai/ucx-py
  documentation: https://ucx-py.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - rxm7706

