# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.5"

package:
  name: ping3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ping3/ping3-${{ version }}.tar.gz
  sha256: 6c99bc844e0b7dbc5c9765e8b530140daf1ccd2112c99db01ab79831bd8081cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ping3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kyan001/ping3
  license: MIT
  license_file: LICENSE
  summary: A pure python3 version of ICMP ping implementation using raw socket.
  description: |
    A pure python3 version of ICMP ping implementation using raw socket.
  repository: https://github.com/kyan001/ping3

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
