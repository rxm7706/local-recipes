# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kazoo
  version: "2.11.0"
  sha256: 57e7e6f69295c8f922511488eeb79680729e14bb8eb382d5cad83aa11345c36c

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kazoo
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Kazoo is a high-level Python library that makes it easier to use Apache Zookeeper
  description: Kazoo is a high-level Python library that makes it easier to use Apache Zookeeper
  homepage: http://github.com/python-zk/kazoo
  repository: https://github.com/python-zk/kazoo
  documentation: https://kazoo.readthedocs.io/

extra:
  recipe-maintainers:
    - mrocklin
    - mrakitin
    - StephenSorriaux
