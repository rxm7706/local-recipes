# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.5"

package:
  name: openshift-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openshift-client/openshift_client-${{ version }}.tar.gz
  sha256: 7fc386e68ff673a7a94a26d70972200bb5e37370d7f2f651d02ac1aa65144415

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packages
    - python-build
    - six
    - pyyaml

tests:
  - python:
      imports:
        - packages.openshift_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openshift/openshift-client-python
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenShift python client
  description: |
    OpenShift python client

extra:
  recipe-maintainers:
    - rxm7706

