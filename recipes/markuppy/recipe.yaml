# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18"

package:
  name: markuppy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/MarkupPy/markuppy-${{ version }}.tar.gz
  sha256: 540f31b835076260339368890ac4f44eb3971d75fdbd97b49fa1f8b6685513d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - MarkupPy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tylerbakke/MarkupPy
  license: MIT
  license_file: LICENSE
  summary: An HTML/XML generator
  description: |
    An HTML/XML generator
  documentation: https://tylerbakke.github.io/MarkupPy/

extra:
  recipe-maintainers:
    - duncanmmacleod

#### CFE metadata AND comments
