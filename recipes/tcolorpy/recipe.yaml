# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tcolorpy
  version: "0.1.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8cea0bf5f8cf03f77528a9acfbf312df935573892ba5ea3b2516e61fa54de9a5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - releasecmd
    - setuptools >=64
    - setuptools_scm >=7
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tcolorpy
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pip show __RECIPE_MANAGER_SUBSTITUTION_MARKER__ | grep -Fx 'Version: ${{ name }}'

about:
  summary: tcolopy is a Python library to apply true color for terminal text.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/thombashi/tcolorpy
  repository: https://github.com/thombashi/tcolorpy

extra:
  recipe-maintainers:
    - basnijholt
