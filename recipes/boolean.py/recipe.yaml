# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0"
  sha256: 60cbc4bad079753721d32649545505362c754e121570ada4658b852a3a318d95

package:
  name: boolean.py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boolean.py/boolean_py-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - boolean
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: >
    Define boolean algebras, create and parse boolean expressions and create custom boolean DSL.
  homepage: https://github.com/bastikr/boolean.py
  repository: https://github.com/bastikr/boolean.py
  documentation: https://booleanpy.readthedocs.io/

extra:
  recipe-maintainers:
    - mbargull
    - pkgw
