# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.1"

package:
  name: openbb-fmp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-fmp/openbb_fmp-${{ version }}.tar.gz
  sha256: 5f6f27af6283075912df42f373c45ed37bc6970097342ed73110fb6101be5517

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-core <2.0.0,>=1.6.10

tests:
  - python:
      imports:
        - openbb_fmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-fmp/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: FMP extension for OpenBB
  description: |
    FMP extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
