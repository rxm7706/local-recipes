# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8.1"

package:
  name: shellescape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shellescape/shellescape-${{ version }}.tar.gz
  sha256: 40b310b30479be771bf3ab28bd8d40753778488bd46ea0969ba0b35038c3ec26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lib.shellescape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chrissimpkins/shellescape
  license: MIT
  license_file: LICENSE
  summary: Shell escape a string to safely use it as a token in a shell command (backport of cPython shlex.quote for Python versions 2.x & < 3.3)
  description: |
    Shell escape a string to safely use it as a token in a shell command (backport of cPython shlex.quote for Python versions 2.x & < 3.3)

extra:
  recipe-maintainers:
    - croth1
    - mgorny

