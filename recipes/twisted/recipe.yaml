# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.4.0"

package:
  name: twisted
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/T/Twisted/twisted-${{ version }}.tar.gz
  sha256: dbfd0fe1ee409d0243fdd7a6a6ff14f4948cec1fd78e0376291f805e1501fae9

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - ckeygen = twisted.conch.scripts.ckeygen:run
      - cftp = twisted.conch.scripts.cftp:run
      - conch = twisted.conch.scripts.conch:run
      - mailmail = twisted.mail.scripts.mailmail:run
      - pyhtmlizer = twisted.scripts.htmlizer:run
      - tkconch = twisted.conch.scripts.tkconch:run
      - trial = twisted.scripts.trial:run
      - twist = twisted.application.twist._twist:Twist.main
      - twistd = twisted.scripts.twistd:run

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - cython
    - hatchling
    - hatch-fancy-pypi-readme
    - incremental >=21.3.0
  run:
    - python >=${{ python_min }}.*
    - attrs >=22.2.0
    - automat >=24.8.0
    - constantly >=15.1
    - hyperlink >=17.1.1
    - incremental >=24.7.0
    - if: win
      then: twisted-iocpsupport >=1.0.2
    - typing-extensions >=4.2.0
    - zope.interface >=5
    - if: win
      then: pywin32
    # conch deps
    - bcrypt >=3.1.3
    - cryptography >=3.3
    - appdirs >=1.4.0
    # tls deps
    - idna >=2.4
    - pyopenssl >=21.0.0
    - service_identity >=18.1.0
    - if: linux
      then: __linux
    - if: win
      then: __win
    - if: osx
      then: __osx
  run_constraints:
    - pyserial >=3.0
    - if: osx
      then: pyobjc-core
    - if: osx
      then: pyobjc-framework-cocoa
    - h2 >=3.0,<5.0
    - priority >=1.1.0,<2.0

tests:
  - python:
      imports:
        - twisted
        - twisted._threads
        - twisted.application
        - twisted.application.runner
        - twisted.application.twist
        - twisted.conch
        - twisted.conch.client
        - twisted.conch.insults
        - twisted.conch.openssh_compat
        - twisted.conch.scripts
        - twisted.conch.ssh
        - twisted.conch.ui
        - twisted.cred
        - twisted.enterprise
        - twisted.internet
        - if: win
          then: twisted.internet.iocpreactor
        - twisted.logger
        - twisted.mail
        - twisted.mail.scripts
        - twisted.names
        - if: match(python, ">=2,<3")
          then: twisted.news
        - twisted.pair
        - twisted.persisted
        - twisted.plugins
        - twisted.positioning
        - twisted.protocols
        - twisted.protocols.haproxy
        - twisted.python
        - twisted.runner
        - twisted.scripts
        - twisted.spread
        - twisted.tap
        - twisted.trial
        - twisted.trial._dist
        - twisted.web
        - twisted.web._auth
        - twisted.words
        - twisted.words.im
        - twisted.words.protocols
        - twisted.words.protocols.jabber
        - twisted.words.xish
      pip_check: false
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pyhamcrest >=1.9.0
        - pip
        - python ${{ python_min }}.*
    script:
      - ckeygen --help
      - if: not win
        then: cftp --help
      - if: not win
        then: conch --help
      - pyhtmlizer --help
      - if: win
        then: tkconch --help
      - trial --help
      - twist --help
      - twistd --help

about:
  license: MIT
  license_file: LICENSE
  summary: An asynchronous networking framework written in Python
  description: |
    Twisted is an event-driven networking engine written in Python.
    It runs on Python 2 and an ever growing subset also works with Python 3.
  homepage: http://twistedmatrix.com/
  repository: https://github.com/twisted/twisted
  documentation: http://twistedmatrix.com/documents/current/

extra:
  recipe-maintainers:
    - akrherz
    - nehaljwani
    - ocefpaf
