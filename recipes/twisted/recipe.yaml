# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.4.0"

package:
  name: twisted
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/Twisted/twisted-${{ version }}.tar.gz
  sha256: dbfd0fe1ee409d0243fdd7a6a6ff14f4948cec1fd78e0376291f805e1501fae9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.10.0
    - hatch-fancy-pypi-readme >=22.5.0
    - incremental >=24.7.0
  run:
    - python >=${{ python_min }}
    - attrs >=22.2.0
    - automat >=24.8.0
    - constantly >=15.1
    - hyperlink >=17.1.1
    - incremental >=24.7.0
    - typing_extensions >=4.2.0
    - zope-interface >=5

tests:
  - python:
      imports:
        - twisted
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://twisted.org/
  license: MIT
  license_file: LICENSE
  summary: An asynchronous networking framework written in Python
  description: |
    An asynchronous networking framework written in Python
  repository: https://github.com/twisted/twisted
  documentation: https://docs.twisted.org/

extra:
  recipe-maintainers:
    - akrherz
    - nehaljwani
    - ocefpaf

#### CFE metadata AND comments
