# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sqlalchemy2-stubs
  version: 0.0.2a38

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlalchemy2-stubs-${{ version }}.tar.gz
  sha256: 861d722abeb12f13eacd775a9f09379b11a5a9076f469ccd4099961b95800f9e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=3.7.4

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pip check

about:
  summary: Typing Stubs for SQLAlchemy 1.4
  license: MIT
  license_file: LICENSE
  homepage: http://www.sqlalchemy.org
  repository: https://github.com/sqlalchemy/sqlalchemy2-stubs

extra:
  recipe-maintainers:
    - thewchan
