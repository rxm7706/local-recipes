# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: streamlit-modal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-modal/streamlit_modal-${{ version }}.tar.gz
  sha256: 3c169aed6e659fd834e3526ffac285efd77867c2e5847131c2fa9d441468a522

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit
    - deprecation

tests:
  - python:
      imports:
        - streamlit_modal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/teamtv/streamlit_modal
  license: MIT
  license_file: LICENSE
  summary: Modal for streamlit
  description: |
    Modal for streamlit

extra:
  recipe-maintainers:
    - rxm7706

