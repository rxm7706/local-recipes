# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "21.7.4"

package:
  name: virtualenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/virtualenv/virtualenv-${{ version }}.tar.gz
  sha256: c9d960c95fa458171e58222a5ccab7465298e4b6559977865e627c4719f1e825

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.4
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}
    - distlib <1,>=0.3.7
    - filelock <=3.19.1,>=3.16.1
    - platformdirs <5,>=3.9.1
    - python-discovery >=1.4.2
    - typing_extensions >=4.13.2

tests:
  - python:
      imports:
        - virtualenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/virtualenv
  license: MIT
  license_file: LICENSE
  summary: Virtual Python Environment builder
  description: |
    Virtual Python Environment builder
  repository: https://github.com/pypa/virtualenv
  documentation: https://virtualenv.pypa.io

extra:
  recipe-maintainers:
    - mingwandroid
    - kalefranz
    - xylar

#### CFE metadata AND comments
