# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.1"

package:
  name: aws-c-mqtt
  version: ${{ version }}

source:
  url: https://github.com/awslabs/aws-c-mqtt/archive/v${{ version }}.tar.gz
  sha256: 48fd84e6ff51fdce5cdc4250593d7b0f10db91f8592737c0fe69e0177ee48144

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-common
    - aws-c-io
    - aws-c-http
  run_exports:
    - ${{ pin_subpackage("aws-c-mqtt", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-mqtt${SHLIB_EXT}
          - test -f $PREFIX/include/aws/mqtt/mqtt.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\mqtt\\mqtt.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-mqtt.dll exit 1
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: C99 implementation of the MQTT 3.1.1 specification.
  homepage: https://github.com/awslabs/aws-c-mqtt
  repository: https://github.com/awslabs/aws-c-mqtt

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
