# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.25.1"

package:
  name: pysmbc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysmbc/pysmbc-${{ version }}.tar.gz
  sha256: 22f1715df82589fd9cc4253feab390b4ef0babf14f64513cd8d07b3789963226

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - smbc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hamano/pysmbc
  license: GPLv2+
  license_file: LICENSE
  summary: Python bindings for libsmbclient
  description: |
    Python bindings for libsmbclient

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
