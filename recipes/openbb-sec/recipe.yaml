# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.7"

package:
  name: openbb-sec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-sec/openbb_sec-${{ version }}.tar.gz
  sha256: d21fec9b53347fa9dfa8bda40d24dbfc6ef57a75826972a6a242aa07ef611afd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp-client-cache <0.12.0,>=0.11.0
    - aiosqlite <0.21.0,>=0.20.0
    - beautifulsoup4 <5.0,>=4.12
    - defusedxml >=0.7.1
    - lxml >=5.2.1
    - openbb-core <2.0.0,>=1.6.10
    - xmltodict <0.14.0,>=0.13.0

tests:
  - python:
      imports:
        - openbb_sec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-sec/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: SEC extension for OpenBB
  description: |
    SEC extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
