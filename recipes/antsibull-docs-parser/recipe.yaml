# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: antsibull-docs-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-docs-parser/antsibull_docs_parser-${{ version }}.tar.gz
  sha256: 52d647b1683466f9a27e93ae997b9eda955617c7fa7670b1268a6922d24b7340

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - antsibull_docs_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-docs-parser/
  license: GPL-3.0-or-later AND BSD-2-Clause
  license_file: LICENSE
  summary: Python library for processing Ansible documentation markup
  description: |
    Python library for processing Ansible documentation markup

extra:
  recipe-maintainers:
    - rxm7706

