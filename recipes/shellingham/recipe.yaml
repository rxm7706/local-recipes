# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.4"

package:
  name: shellingham
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shellingham/shellingham-${{ version }}.tar.gz
  sha256: 8dbca0739d487e5bd35ab3ca4b36e11c4078f3a234bfce294b0a0291363404de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - shellingham
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sarugaku/shellingham
  license: ISC
  license_file: LICENSE
  summary: Tool to Detect Surrounding Shell
  description: |
    Tool to Detect Surrounding Shell

extra:
  recipe-maintainers:
    - ocefpaf

