# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"
  python_min: "3.12"

package:
  name: gh-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gh-search/gh_search-${{ version }}.tar.gz
  sha256: 3081894e386b7875c739fce154ce4e662f002714b8491ed065d189e674c455dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click-config-file ~=0.6.0
    - click ~=8.1.7
    - pygithub ~=2.3.0
    - ruamel.yaml ~=0.18.6

tests:
  - python:
      imports:
        - ghsearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/janeklb/gh-search
  license: MIT
  license_file: LICENSE
  summary: Github search from the cli
  description: |
    Github search from the cli

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gh-search
  cfe-upstream-registry: pypi
  cfe-upstream-name: gh-search
