# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: console-menu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/console-menu/console-menu-${{ version }}.tar.gz
  sha256: f3c737e55242f71b2fa6aacaf12aed64b98bd6bd19c0c0ed8cfb294c472c2e5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - ansiwrap

tests:
  - python:
      imports:
        - consolemenu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/aegirhall/console-menu
  license: MIT
  license_file: LICENSE
  summary: A simple console menu system
  description: |
    A simple console menu system

extra:
  recipe-maintainers:
    - rxm7706

