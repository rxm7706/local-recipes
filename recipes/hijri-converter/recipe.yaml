# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.2.post1"

package:
  name: hijri-converter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hijri-converter/hijri_converter-${{ version }}.tar.gz
  sha256: 986657ccd83a5beaf233ce5a219645747e885c45d4833bd2a8fa1b927fa39570

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=51
  run:
    - python >=${{ python_min }}
    - hijridate ==2.3.0

tests:
  - python:
      imports:
        - hijri_converter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/hijri-converter/
  license: MIT
  license_file: LICENSE
  summary: "[DEPRECATED] Use 'hijridate' package instead"
  description: |
    [DEPRECATED] Use 'hijridate' package instead

extra:
  recipe-maintainers:
    - dralshehri
    - synapticarbors

