# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# PyPI sdist URL would be:
# https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
# It does not include the tests, so we use the GitHub source archive instead.
schema_version: 1

context:
  name: reretry
  version: "0.11.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/leshchenko1979/reretry/archive/${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: c04be774e1c09ff4acbfc4de686e9a0f18e3ae1c6daabc852a65456f36d4272f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - reretry
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest
        - pytest-asyncio
        - python ${{ python_min }}
    script:
      - pytest --pyargs tests

about:
  summary: An easy to use, but functional decorator for retrying on exceptions.
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/leshchenko1979/reretry

extra:
  recipe-maintainers:
    - musicinmybrain
