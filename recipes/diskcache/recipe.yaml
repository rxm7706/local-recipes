# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.6.3"

package:
  name: diskcache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diskcache/diskcache-${{ version  }}.tar.gz
  sha256: 2c3a3fa2743d8535d832ec61c2054a1641f41775aa7c556758a109941e33e4fc

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - diskcache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.grantjenks.com/docs/diskcache/
  license: Apache-2.0
  license_file: LICENSE
  summary: Disk Cache -- Disk and file backed persistent cache.
  description: |
    Disk Cache -- Disk and file backed persistent cache.
  repository: https://github.com/grantjenks/python-diskcache
  documentation: http://www.grantjenks.com/docs/diskcache/

extra:
  recipe-maintainers:
    - pmlandwehr
    - xhochy

#### CFE metadata AND comments
