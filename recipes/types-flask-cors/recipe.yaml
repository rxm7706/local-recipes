schema_version: 1

context:
  version: "6.0.3.20260712"

package:
  name: types-flask-cors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-Flask-Cors/types_flask_cors-6.0.3.20260712-py3-none-any.whl
  sha256: 308ecfa65c17abc59edbed74258d24099c82f5e94cb1bc4f3016313df4e5e4f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=2.0.0

tests:
  - python:
      imports:
        - types_flask_cors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for Flask-Cors
  description: |
    Typing stubs for Flask-Cors
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - xhochy

