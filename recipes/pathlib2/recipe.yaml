# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 2.3.7.post1

package:
  name: pathlib2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathlib2/pathlib2-${{ version }}.tar.gz
  sha256: 9fe0edad898b83c0c3e199c842b27ed216645d2e177757b2dd67384d4113c641

build:
  number: 5
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - if: match(python, "<3.5")
      then: scandir
    - six >=1.13.0
    - if: match(python, "<3.5")
      then: typing

tests:
  - python:
      imports:
        - pathlib2
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Fork of pathlib aiming to support the full stdlib Python API
  homepage: https://github.com/mcmtroffaes/pathlib2

extra:
  recipe-maintainers:
    - pelson
    - takluyver
