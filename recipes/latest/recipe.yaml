# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: latest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/latest/latest-${{ version }}.tar.gz
  sha256: fc684877e7fb12816267cd6bf75769220ccd183a69c331ac7f87c649e0d1ac16

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyparsing

tests:
  - python:
      imports:
        - latest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bluephlavio/latest
  license: MIT
  license_file: LICENSE
  summary: A LaTeX-oriented template engine.
  description: |
    A LaTeX-oriented template engine.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: latest
  cfe-upstream-registry: pypi
  cfe-upstream-name: latest
  cfe-purls:
    - pkg:conda/latest@${{ version }}?channel=conda-forge
    - pkg:pypi/latest@${{ version }}
  cfe-upstream-repo: https://github.com/bluephlavio/latest
  cfe-upstream-homepage: https://github.com/bluephlavio/latest
  cfe-import-names: [latest]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:42:35Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T20:42:35Z
