# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: timescape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/timescape/timescape-${{ version }}.tar.gz
  sha256: 897f809814bbad20d63acc77d84b055819b0675496bbe42544aefdb8ad80c849

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend >=2.4.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timescape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/timescape/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Placeholder for the timescape name
  description: |
    Placeholder for the timescape name

extra:
  recipe-maintainers:
    - rxm7706

