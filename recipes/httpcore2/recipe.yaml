# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.0"

package:
  name: httpcore2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpcore2/httpcore2-${{ version }}.tar.gz
  sha256: 13c0cc3d1919d4f28457f60cd2c2abe04113a8af184ccf1142811beba936f9dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
    - uv-dynamic-versioning >=0.14.0
  run:
    - python >=${{ python_min }}
    - h11 >=0.16
    - truststore >=0.10

tests:
  - python:
      imports:
        - httpcore2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydantic/httpx2
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A minimal low-level HTTP client.
  description: |
    A minimal low-level HTTP client.
  repository: https://github.com/pydantic/httpx2/blob/main/src/httpcore2

extra:
  recipe-maintainers:
    - bollwyvl
    - Kludex

#### CFE metadata AND comments
# CFE metadata
