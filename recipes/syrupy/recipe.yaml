# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: syrupy
  version: "5.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/syrupy-${{ version }}.tar.gz
  sha256: fa21e4ae77c89ec5abfca513338d8a7eb916da6618ca0f8db301476e0768e57a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }},<4.0
    - pytest >=8.0.0

tests:
  - python:
      imports:
        - syrupy
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pytest Snapshot Test Utility
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/syrupy-project/syrupy

extra:
  recipe-maintainers:
    - noahnu
    - ludaavics
