# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.7.1"

package:
  name: webargs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/webargs/webargs-${{ version }}.tar.gz
  sha256: 799bf9039c76c23fd8dc1951107a75a9e561203c15d6ae8f89c1e46e234636c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - marshmallow <5.0.0,>=3.13.0
    - packaging >=17.0
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - webargs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/webargs/
  license: MIT
  license_file: LICENSE
  summary: Declarative parsing and validation of HTTP request objects, with built-in support for popular web frameworks, including Flask, Django, Bottle, Tornado, Pyramid, Falcon, and aiohttp.
  description: |
    Declarative parsing and validation of HTTP request objects, with built-in support for popular web frameworks, including Flask, Django, Bottle, Tornado, Pyramid, Falcon, and aiohttp.
  repository: https://github.com/marshmallow-code/webargs

extra:
  recipe-maintainers:
    - frol
    - synapticarbors

