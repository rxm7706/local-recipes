# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.12.5"

package:
  name: sendgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sendgrid/sendgrid-${{ version }}.tar.gz
  sha256: ea9aae30cd55c332e266bccd11185159482edfc07c149b6cd15cf08869fabdb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python_http_client >=3.2.1
    - cryptography >=45.0.6
    - werkzeug <1.0.0,>=0.11.15

tests:
  - python:
      imports:
        - sendgrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sendgrid/sendgrid-python/
  license: MIT
  license_file: LICENSE
  summary: Twilio SendGrid library for Python
  description: |
    Twilio SendGrid library for Python

extra:
  recipe-maintainers:
    - RohitK89
    - mariusvniekerk
    - xylar

#### CFE metadata AND comments
