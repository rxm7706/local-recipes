# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: wadllib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wadllib/wadllib-${{ version }}.tar.gz
  sha256: 69c60a188c9c629a0e947dfafd89acdc8b7d8d404a6b5eb0ad258fef29362501

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lazr-uri

tests:
  - python:
      imports:
        - wadllib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://launchpad.net/wadllib
  license: LGPL-3.0-only
  license_file: COPYING.txt
  summary: Navigate HTTP resources using WADL files as guides.
  description: |
    Navigate HTTP resources using WADL files as guides.
  repository: https://code.launchpad.net/wadllib
  documentation: https://wadllib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wadllib
  cfe-upstream-registry: pypi
  cfe-upstream-name: wadllib
  cfe-purls:
    - pkg:conda/wadllib@${{ version }}?channel=conda-forge
    - pkg:pypi/wadllib@${{ version }}
  cfe-upstream-repo: https://code.launchpad.net/wadllib
  cfe-upstream-homepage: https://launchpad.net/wadllib
  cfe-import-names: [wadllib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
