# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: pynautobot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pynautobot/pynautobot-${{ version }}.tar.gz
  sha256: 8e3f167bd7a07659d0fb1a9cbfb3eb6e7a5375420872d3c08754e4dec5cb0bc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - packaging >=23.2
    - requests <3.0.0,>=2.30.0
    - urllib3 <3,>=1.21.1

tests:
  - python:
      imports:
        - pynautobot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://nautobot.com
  license: Apache-2.0
  license_file: LICENSE
  summary: Nautobot API client library
  description: |
    Nautobot API client library
  repository: https://github.com/nautobot/pynautobot
  documentation: https://docs.nautobot.com/projects/pynautobot/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pynautobot
  cfe-upstream-registry: pypi
  cfe-upstream-name: pynautobot
