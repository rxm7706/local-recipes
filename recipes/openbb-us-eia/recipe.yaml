# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: openbb-us-eia
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-us-eia/openbb_us_eia-${{ version }}.tar.gz
  sha256: e22944c10fd846ba97524f9f8a5b6c0cbee080d98fcefdadcb14244ec5fc96cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - async-lru <3.0.0,>=2.0.4
    - openbb-core <2.0.0,>=1.6.10
    - openpyxl <4.0.0,>=3.1.5
    - xlrd <3.0.0,>=2.0.1

tests:
  - python:
      imports:
        - openbb_us_eia
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-us-eia/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: "The U.S. Energy Information Administration is committed to its free and open data by making it available through an Application Programming Interface (API) and its open data tools. See https://www.eia.gov/opendata/ for more information."
  description: |
    The U.S. Energy Information Administration is committed to its free and open data by making it available through an Application Programming Interface (API) and its open data tools. See https://www.eia.gov/opendata/ for more information.

extra:
  recipe-maintainers:
    - rxm7706

