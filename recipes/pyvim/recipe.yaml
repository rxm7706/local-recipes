    - pkg:pypi/pyvim@${{ version }}
  cfe-upstream-repo: https://github.com/jonathanslenders/pyvim
  cfe-upstream-homepage: https://github.com/jonathanslenders/pyvim
  cfe-import-names: [pyvim]
