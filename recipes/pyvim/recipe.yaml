# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.3"

package:
  name: pyvim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyvim/pyvim-${{ version }}.tar.gz
  sha256: 2a3506690f73a79dd02cdc45f872d3edf20a214d4c3666d12459e2ce5b644baa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - prompt-toolkit
    - six
    - pyflakes
    - pygments
    - docopt

tests:
  - python:
      imports:
        - pyvim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jonathanslenders/pyvim
  license: MIT
  license_file: LICENSE
  summary: Pure Python Vi Implementation
  description: |
    Pure Python Vi Implementation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyvim
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyvim
  cfe-purls:
