{% set version = "1.9.6" %}

package:
  name: wordcloud
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/w/wordcloud/wordcloud-{{ version }}.tar.gz
  sha256: df17c468ff903bd0aba4f87c6540745d13a4931220dd4937cb363ad85a4771b9

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - wordcloud_cli = wordcloud.__main__:main

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - setuptools
    - setuptools-scm
    - toml
    - pip
    - cython >=0.29.33
  run:
    - python
    - numpy >=1.19.3
    - pillow
    - matplotlib-base

test:
  imports:
    - wordcloud
  commands:
    - pip check
    - wordcloud_cli -h
  requires:
    - pip

about:
  home: https://github.com/amueller/word_cloud
  license: MIT
  license_file: LICENSE
  summary: A little word cloud generator in Python

extra:
  recipe-maintainers:
    - amueller
    - ericdill
    - ocefpaf
