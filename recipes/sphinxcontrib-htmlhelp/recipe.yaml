# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: sphinxcontrib-htmlhelp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-htmlhelp/sphinxcontrib_htmlhelp-${{ version }}.tar.gz
  sha256: c9e2916ace8aad64cc13a0d233ee22317f2b9025b9cf3295249fa985cc7082e9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}
    - sphinx >=5

tests:
  - python:
      imports:
        - sphinxcontrib
        - sphinxcontrib.htmlhelp
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENCE.rst
  summary: sphinxcontrib-htmlhelp is a sphinx extension which ...
  homepage: https://www.sphinx-doc.org/
  repository: https://github.com/sphinx-doc/sphinxcontrib-htmlhelp
  documentation: https://www.sphinx-doc.org/en/master/

extra:
  recipe-maintainers:
    - AA-Turner
    - conda-forge/sphinx
    - ocefpaf
