    - pkg:pypi/splitfile@${{ version }}
  cfe-upstream-repo: https://github.com/alemigo/splitfile
  cfe-upstream-homepage: https://github.com/alemigo/splitfile
  cfe-import-names: [splitfile]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
