# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.11"

package:
  name: drain3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/drain3/drain3-${{ version }}.tar.gz
  sha256: 9ab4b1407fad74f56554ae371ef019c3c7985861631f4bab46a0e92585125f75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - drain3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/IBM/Drain3
  license: MIT
  license_file: LICENSE
  summary: Persistent & streaming log template miner
  description: |
    Persistent & streaming log template miner

extra:
  recipe-maintainers:
    - rxm7706

