# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.1"

package:
  name: singledispatch
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/s/singledispatch/singledispatch-${{ version }}.tar.gz
  sha256: 58b46ce1cc4d43af0aac3ac9a047bdb0f44e05f0b2fa2eec755863331700c865

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - six

tests:
  - python:
      imports:
        - singledispatch
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: This library brings functools.singledispatch from Python 3.4 to Python 2.6-3.3.
  homepage: http://docs.python.org/3/library/functools.html#functools.singledispatch

extra:
  recipe-maintainers:
    - jakirkham
