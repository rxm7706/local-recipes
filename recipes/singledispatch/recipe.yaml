# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.2"

package:
  name: singledispatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/singledispatch/singledispatch-${{ version }}.tar.gz
  sha256: 0ad18e5a55c54a836a695a4e7c12faa05adfe88c7eeb64dcd331a4b13934c3b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - singledispatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/singledispatch/
  license: MIT
  license_file: LICENSE
  summary: Backport functools.singledispatch to older Pythons.
  description: |
    Backport functools.singledispatch to older Pythons.
  repository: https://github.com/jaraco/singledispatch

extra:
  recipe-maintainers:
    - jakirkham

