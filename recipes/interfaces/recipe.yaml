# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: interfaces
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/interfaces/interfaces-${{ version }}.tar.gz
  sha256: ecabf3aeb148f5742a82676f431f48ae09cfb05c6eef39475c656f431b24789b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - interfaces
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/ustudio/interfaces/
  license: http://www.apache.org/licenses/LICENSE-2.0
  license_file: LICENSE
  summary: Simple decorator implementation of an interface.
  description: |
    Simple decorator implementation of an interface.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
