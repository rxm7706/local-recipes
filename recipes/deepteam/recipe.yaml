# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.9"

package:
  name: deepteam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepteam/deepteam-${{ version }}.tar.gz
  sha256: d44fb6bc34f02e4ac17cce459bcb9d1590c5589337597b609c4442578336e641

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.11.18
    - deepeval >=3.6.2
    - grpcio >=1.67.1
    - openai >=1.76.2
    - pyyaml >=6.0.2
    - requests >=2.31.0
    - tabulate >=0.9.0
    - tqdm >=4.66.1

tests:
  - python:
      imports:
        - deepteam
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/deepteam/
  license: Apache-2.0
  license_file: LICENSE
  summary: The LLM Red Teaming Framework
  description: |
    The LLM Red Teaming Framework
  repository: https://github.com/confident-ai/deepteam
  documentation: https://trydeepteam.com

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: deepteam
