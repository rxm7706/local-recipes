# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated from python-maturin path; PyO3/maturin detected via sdist
# pyproject.toml [build-system].requires. Modelled on phonors PR pattern
# (modal 27-PR PyO3 sample, Mar 2020 – May 2026). Recipe shape follows the
# 2026 grayskull / conda-forge convention: literal ``package.name``, literal
# ``source.url`` (only ``${ version }`` templated), no ``name`` in context.
schema_version: 1

context:
  version: "1.11.0"

package:
  name: corgea-cli
  version: ${{ version }}

source:
  url: https://github.com/Corgea/cli/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c3583d04d09a8d1a8e50a7660167847c3b661e5b0506ed2b97efb388797db257

build:
  number: 0
  script:
    env:
      # Per conda-forge.org/docs/maintainer/example_recipes/rust/ — applies to
      # any Rust build (CLI binary OR maturin/PyO3 cdylib). maturin invokes
      # cargo build internally and inherits these env vars.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - corgea_cli
      pip_check: true

about:
  homepage: https://corgea.com
  license: LGPL-2.1
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: The Corgea CLI. Scan for vulnerabilties, create fixes.
  description: |
    The Corgea CLI. Scan for vulnerabilties, create fixes.
  repository: https://github.com/Corgea/cli
  documentation: https://docs.corgea.app

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: corgea-cli
  cfe-upstream-registry: pypi
  cfe-upstream-name: corgea-cli
  cfe-purls:
    - pkg:conda/corgea-cli@${{ version }}?channel=conda-forge
    - pkg:pypi/corgea-cli@${{ version }}
  cfe-upstream-repo: https://github.com/Corgea/cli
  cfe-upstream-homepage: https://corgea.com
  cfe-import-names: []
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
  cfe-noarch: compiled
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:04:09Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T23:04:09Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
