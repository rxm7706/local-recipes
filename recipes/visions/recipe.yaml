# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: visions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/visions/visions-${{ version }}.tar.gz
  sha256: 03c5f3f70b137a0072d885779a52b49dab0f4bc623f9a8f2fe19d6aca7ef4a43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.2
    - pandas >=2.0.0
    - attrs >=19.3.0
    - networkx >=2.4
    - multimethod >=1.4
    - puremagic

tests:
  - python:
      imports:
        - visions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/visions/
  license: BSD-4-Clause
  license_file: LICENSE
  summary: Visions
  description: |
    Visions
  repository: https://github.com/dylan-profiler/visions
  documentation: https://dylan-profiler.github.io/visions

extra:
  recipe-maintainers:
    - philip-khor
    - rxm7706

#### CFE metadata AND comments
