# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.1"

package:
  name: pyarmor.cli.core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp312/p/pyarmor.cli.core/pyarmor_cli_core-8.1.1-2-cp312-cp312-win32.whl
  sha256: 790f0957124d44d1527edf7a677ffc006cddc827998e4c7981f3b20fd3db14a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyarmor.cli.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dashingsoft/pyarmor
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Provide extension module pytransform3 for Pyarmor
  description: |
    Provide extension module pytransform3 for Pyarmor

extra:
  recipe-maintainers:
    - rxm7706

