# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.13.2"

package:
  name: asyncstdlib-fw
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncstdlib-fw/asyncstdlib_fw-${{ version }}.tar.gz
  sha256: 51ad094c204c5936c3040f38c32fd6d549b391c980f21f1fa095b65fb6806a1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asyncstdlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/asyncstdlib-fw/
  license: MIT
  license_file: LICENSE
  summary: Fork of asyncstdlib that work with fireworks-ai
  description: |
    Fork of asyncstdlib that work with fireworks-ai
  repository: https://github.com/maxfischer2781/asyncstdlib
  documentation: https://asyncstdlib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
