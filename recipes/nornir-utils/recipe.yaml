# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: nornir-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nornir-utils/nornir_utils-${{ version }}.tar.gz
  sha256: 2519efec3b794ad0d21e6dda65890a9e3304090046c445a65447b72ed4637d50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - nornir <4,>=3.0.0a0
    - colorama <0.5,>=0.4.3

tests:
  - python:
      imports:
        - nornir_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nornir-utils/
  license: Apache-2.0
  license_file: LICENSE
  summary: Collection of plugins and functions for nornir that don't require external dependencies
  description: |
    Collection of plugins and functions for nornir that don't require external dependencies
  repository: https://github.com/nornir-automation/nornir-utils

extra:
  recipe-maintainers:
    - rxm7706

