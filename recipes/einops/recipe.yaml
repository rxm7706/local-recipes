# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: einops
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 609da665570e5e265e27283aab09e7f279ade90c4f01bcfca111f3d3e13f2827

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling >=1.10.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - einops
        - einops.layers
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A new flavour of deep learning operations.
  description: |
    Flexible and powerful tensor operations for readable and reliable code.
    Supports numpy, pytorch, tensorflow, and others.
  homepage: https://github.com/arogozhnikov/einops
  repository: https://github.com/arogozhnikov/einops
  documentation: https://github.com/arogozhnikov/einops

extra:
  recipe-maintainers:
    - maresb
    - asford
