# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: einops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/einops/einops-${{ version }}.tar.gz
  sha256: 609da665570e5e265e27283aab09e7f279ade90c4f01bcfca111f3d3e13f2827

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.10.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - einops
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arogozhnikov/einops
  license: MIT
  license_file: LICENSE
  summary: A new flavour of deep learning operations
  description: |
    A new flavour of deep learning operations

extra:
  recipe-maintainers:
    - maresb
    - asford

