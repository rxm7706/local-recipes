# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.12"

package:
  name: milvus-model
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/milvus-model/milvus_model-${{ version }}.tar.gz
  sha256: 1d6fd5c416545062a2db4dc910141e323ed9694df78564938b1f62222087eb15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=67
    - wheel
    - gitpython
  run:
    - python >=${{ python_min }}
    - setuptools-scm
    - transformers >=4.36.0
    - onnxruntime
    - scipy >=1.10.0
    - protobuf
    - numpy

tests:
  - python:
      imports:
        - milvus_model
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/milvus-model/
  license: Apache-2.0
  license_file: LICENSE
  summary: Model components for PyMilvus, the Python SDK for Milvus
  description: |
    Model components for PyMilvus, the Python SDK for Milvus

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
