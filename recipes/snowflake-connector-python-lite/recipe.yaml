# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: snowflake-connector-python-lite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snowflake-connector-python-lite/snowflake-connector-python-lite-${{ version }}.tar.gz
  sha256: b182670f441c8c74026aa7e4b83cdb7affd445667fecac19b883eeb2d517aeed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - snowflake.connector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/snowflake-connector-python-lite/
  license: Apache-2.0
  license_file: LICENSE
  summary: Snowflake Connector for python LITE!
  description: |
    Snowflake Connector for python LITE!

extra:
  recipe-maintainers:
    - rxm7706

