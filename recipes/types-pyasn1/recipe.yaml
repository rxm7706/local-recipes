schema_version: 1

context:
  version: "0.6.0.20260724"

package:
  name: types-pyasn1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-pyasn1/types_pyasn1-0.6.0.20260724-py3-none-any.whl
  sha256: 487987e4492ce2e1ba6f0048f025165383c49d5d16a345ae5dfe7d44045b7910

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_pyasn1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for pyasn1
  description: |
    Typing stubs for pyasn1
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - rxm7706

