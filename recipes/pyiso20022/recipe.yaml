# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.2"

package:
  name: pyiso20022
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyiso20022/pyiso20022-${{ version }}.tar.gz
  sha256: a43801f0f30912faa192f630078a6bea67201fe949ac7d9aeb6deebe576b4db4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyiso20022
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/phoughton/pyiso20022
  license: MIT
  license_file: LICENSE
  summary: pyiso20022 is a library for generating ISO20022 messages in Python.
  description: |
    pyiso20022 is a library for generating ISO20022 messages in Python.

extra:
  recipe-maintainers:
    - rxm7706

