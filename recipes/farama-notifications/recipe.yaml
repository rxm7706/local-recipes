# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: farama-notifications
  version: "0.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/Farama-Notifications-${{ version }}.tar.gz
  sha256: 13fceff2d14314cf80703c8266462ebf3733c7d165336eee998fc58e545efd18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - farama_notifications
      pip_check: true

about:
  summary: Notifications for all Farama Foundation maintained libraries.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Farama-Foundation/Farama-Notifications

extra:
  recipe-maintainers:
    - ChristofKaufmann
