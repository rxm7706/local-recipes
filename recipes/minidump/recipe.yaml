# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.24"

package:
  name: minidump
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/minidump/minidump-${{ version }}.tar.gz
  sha256: f7ae09b944f3b17ccf5cecc66f9ff5a7a45b053474a13aeb012f4c9204470437

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - minidump
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/minidump
  license: MIT
  license_file: LICENSE
  summary: Python library to parse Windows minidump file format
  description: |
    Python library to parse Windows minidump file format

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
