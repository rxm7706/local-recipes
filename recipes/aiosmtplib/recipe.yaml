# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.2"

package:
  name: aiosmtplib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiosmtplib/aiosmtplib-${{ version }}.tar.gz
  sha256: 04a0ea3c678f5b719f998f290dce010ca512e1385836d3944206299df03b060f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiosmtplib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/aiosmtplib/
  license: MIT
  license_file: LICENSE.txt
  summary: asyncio SMTP client
  description: |
    asyncio SMTP client
  repository: https://github.com/cole/aiosmtplib
  documentation: https://aiosmtplib.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - thewchan

