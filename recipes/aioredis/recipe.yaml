# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: aioredis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioredis/aioredis-${{ version }}.tar.gz
  sha256: eaa51aaf993f2d71f54b70527c440437ba65340588afeb786cd87c55c89cd98e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - distutils
    - async-timeout
    - typing_extensions

tests:
  - python:
      imports:
        - aioredis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aio-libs/aioredis-py
  license: MIT
  license_file: LICENSE
  summary: asyncio (PEP 3156) Redis support
  description: |
    asyncio (PEP 3156) Redis support

extra:
  recipe-maintainers:
    - epruesse
    - synapticarbors

