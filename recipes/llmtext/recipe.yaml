# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.7"

package:
  name: llmtext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llmtext/llmtext-${{ version }}.tar.gz
  sha256: 5ca023f96d33c33822f497298b39bcc3cc2662af98238e03d4b302336d110eef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - python-dotenv <2.0.0,>=1.0.0
    - instructor <2.0.0,>=1.3.0
    - pydantic ==2.7.*
    - asyncer <0.0.8,>=0.0.7

tests:
  - python:
      imports:
        - llmtext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llmtext/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple llm library.
  description: |
    A simple llm library.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: llmtext
