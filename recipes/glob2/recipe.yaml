# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7"

package:
  name: glob2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glob2/glob2-${{ version }}.tar.gz
  sha256: 85c3dbd07c8aa26d63d7aacee34fa86e9a91a3873bc30bf62ec46e531f92ab8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - glob2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/miracle2k/python-glob2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Version of the glob module that can capture patterns and supports recursive wildcards
  description: |
    Version of the glob module that can capture patterns and supports recursive wildcards

extra:
  recipe-maintainers:
    - dfroger

#### CFE metadata AND comments
