# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: panadas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panadas/panadas-${{ version }}.tar.gz
  sha256: 1aadda5c605388f07cf03ffd439e328ae51524850cb758cdfe7a7c09bda58406

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - panadas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/panadas/
  license: MIT
  license_file: LICENSE
  summary: A simple Python package
  description: |
    A simple Python package

extra:
  recipe-maintainers:
    - rxm7706

