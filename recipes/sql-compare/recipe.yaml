# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: sql-compare
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sql-compare/sql_compare-${{ version }}.tar.gz
  sha256: 73f934f003e564eab2c450d5abae169f9fc568769c74d1d9e5fb68cf4a55385a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - sqlparse >=0.5.0

tests:
  - python:
      imports:
        - sql_compare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sql-compare/
  license: Apache-2.0
  license_file: LICENSE
  summary: Compare SQL schemas
  description: |
    Compare SQL schemas
  repository: https://github.com/Mergifyio/sql-compare

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sql-compare
  cfe-upstream-registry: pypi
  cfe-upstream-name: sql-compare
  cfe-purls:
