# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: flask-tinymce
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-TinyMCE/Flask-TinyMCE-${{ version }}.tar.gz
  sha256: f6c3f57b14eb89cb2f5dc711f8d7060cac7de4beb8ddcb3028411c0d1a790edc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_tinymce
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kanhebei/flask-tinymce
  license: MIT
  license_file: LICENSE
  summary: Flask-TinyMCE
  description: |
    Flask-TinyMCE

extra:
  recipe-maintainers:
    - rxm7706

