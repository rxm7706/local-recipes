{% set name = "sphinx-prompt" %}
{% set version = "1.10.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # https://files.pythonhosted.org/packages/6c/1b/ceb8d295275982121eefc8a4f0b71edf7f26c16f5bc53f4204527f173783/sphinx_prompt-1.10.1.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace("-", "_") }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 2b8a18433ee3d9f2a7c4e51a768fb14c5177cce4bf0e2298ecc068a0ca9918bf

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - pygments
    - sphinx

about:
  home: https://github.com/sbrunner/sphinx-prompt
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Sphinx directive to add unselectable prompt
  doc_url: https://github.com/sbrunner/sphinx-prompt/blob/master/README.rst
  dev_url: https://github.com/sbrunner/sphinx-prompt

extra:
  recipe-maintainers:
    - jonathansick
