# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  distro_version: "10.1"
  glibc_version: "2.39"
  kernel_headers_version: "6.12.0"
  build_number: 6
  rpm_url: '"https://dl.rockylinux.org/pub/rocky/" ~ distro_version ~ "/BaseOS/" ~ centos_machine ~ "/os/Packages"'
  appstream_rpm_url: '"https://dl.rockylinux.org/pub/rocky/" ~ distro_version ~ "/AppStream/" ~ centos_machine ~ "/os/Packages"'
  crb_rpm_url: '"https://dl.rockylinux.org/pub/rocky/" ~ distro_version ~ "/CRB/" ~ centos_machine ~ "/os/Packages"'

recipe:
  name: linux-sysroot
  version: ${{ glibc_version }}

source:
  # for calculating the hashes below, you can run `python update.py`
  # in the recipe folder (only `distro_version` needs to be set therein)
  # START source
  - url: ${{ rpm_url }}/g/glibc-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ '625665c8a3f87b44e1cf52ee22b84934f61ccb0052675b3413e379f622474dbe' if cross_target_platform == "linux-s390x" else 'f515f512c2d02febb4f2e0590fe47e71e54e7d6ac81346f45b14020c4cf4e306' if cross_target_platform == "linux-riscv64" else '045ee6390d3f3b26a704a0b2b8f4696aeb2c0a2af31fac77b9e69e7bfffd7376' if cross_target_platform == "linux-ppc64le" else 'f60b97cf2a89804d6b9fe0bfd74e19aa8c8cbf52baf0c35fe1c6f8b76a3798c9' if cross_target_platform == "linux-aarch64" else 'e217e8d37cb3e11618ad1a96ddbc9316362d6f532228336ae0adfdd169dc3bac' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc
  - url: ${{ rpm_url }}/g/glibc-all-langpacks-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ 'f8eda85ba4e928ea060dda485a7f6a287c0a8ab50bcd0d39fbdb2ca99d24c97a' if cross_target_platform == "linux-s390x" else 'c446b176e257a0b9ff217ea93052b5e664e051fb6fcde24deafa191b850a3a8b' if cross_target_platform == "linux-riscv64" else '73e1b4b182fc79e3b6a370f3c85e8f347fd442d58a6c265774cd6eea1fa70563' if cross_target_platform == "linux-ppc64le" else '7cd0a36b22fb54759cf33384c2904a8f119f0137f4a18849a31533bf11771314' if cross_target_platform == "linux-aarch64" else '2bd905d813ee7513cee106bbe06f4166eb52021a36980db5d9a639ad48c1d989' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc-all-langpacks
  - url: ${{ rpm_url }}/g/glibc-common-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ 'e4f0c72f60d880b564845fa1a0b36ba9f705d143427b9b167f4c7d5161d8dc82' if cross_target_platform == "linux-s390x" else '90f42e270953849ac06824ec318a0ac08a69d37ff7e77fb27190aed189a68c9d' if cross_target_platform == "linux-riscv64" else 'e402cdae00304a660b3cb0e0d1e9e846d29a74bd42df86a6c5aad3ae1ffd6276' if cross_target_platform == "linux-ppc64le" else '498bd12db163bb865bac3a040299701286ae6afd736a506397c7ba4d43f7a217' if cross_target_platform == "linux-aarch64" else '28079411fea51526ef5bb53b71e2205e4d4ffe06d5851e7728140d333b4643ad' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc-common
  - url: ${{ appstream_rpm_url }}/g/glibc-devel-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ 'e93739fb78af97dee1556b3b4dadec98d5f39072b0029cc7f7d9e35474c908eb' if cross_target_platform == "linux-s390x" else '92af5315ca9940e7ea37841d85b6cc29355a1fa49096ead241e25efa71b7ae32' if cross_target_platform == "linux-riscv64" else '5799a891044ae7608ab45ae45c1505fef8c92a6b02023c330f62c4b2545c2667' if cross_target_platform == "linux-ppc64le" else '5eddb48c95743b136a1b25618bb26ab704aaf0886d9e87e685939ade712eacd2' if cross_target_platform == "linux-aarch64" else '3db7dcc7611f881f895d8d99cef11455878e7cb4babb5a814dfa52d0c4134ff8' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc-devel
  - url: ${{ rpm_url }}/g/glibc-gconv-extra-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ 'e911cdf6f2f658ed5aecf08caec5a9405a6c62a73d1286e2b7a975d58fca459d' if cross_target_platform == "linux-s390x" else '5a218ec7690e9a5cdbf84b12d52eef3565514955c08f7552f9c5d1bfe1df71cf' if cross_target_platform == "linux-riscv64" else 'de6ef337780c3b43316e00c6575221ecb64a1b166e4734dd4812959ca492bc8b' if cross_target_platform == "linux-ppc64le" else '1fd35586a6d71acae305495479d58629a37bcff4b8ba930dc6333664c62dd8fc' if cross_target_platform == "linux-aarch64" else 'a760bf99f7b9ac736acf831cd07a1d6b0c772d6dc21df2f3f601715c1c001856' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc-gconv-extra
  - url: ${{ crb_rpm_url }}/g/glibc-static-2.39-58.el10_1.2.${{ centos_machine }}.rpm
    sha256: ${{ '493eb53f8775e78259357dce8c94a1ff353bc850c575d9c2931aed62ec071079' if cross_target_platform == "linux-s390x" else '76d0780b87c9151dfe7eea5b2bec20bac5b9f81dc461fa3c6cf0f508b806ef19' if cross_target_platform == "linux-riscv64" else '0eb9292c0bc51be7b332d10bcf939e0b8ef12a8cc14e8935faf16acdfa6e17f3' if cross_target_platform == "linux-ppc64le" else '0b3b473423e46325a64f7c1f7d14865961ad52446f2acb868b176537d3e33d3a' if cross_target_platform == "linux-aarch64" else 'f454e365d87c1ade5002c56ade984265fb301bc4ffd25d3a8a5eb39a7b993388' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-glibc-static
  - url: ${{ appstream_rpm_url }}/k/kernel-headers-6.12.0-124.8.1.el10_1.${{ centos_machine }}.rpm
    sha256: ${{ 'f85f84222d2a84795e60ffca66d0592eede8d7ba0037e58e469790ef7109ff42' if cross_target_platform == "linux-s390x" else '1a63bef972091842a90bb20727511788289a28d1d7717a8148deb89c1d70367e' if cross_target_platform == "linux-riscv64" else '2c2779863c4c7929fa2fb772b5409149907f76922665f9a1fa499a6d1426090e' if cross_target_platform == "linux-ppc64le" else '2d72d903385a4ccb8882491da229d3442d6c370c0b446161e858fe3ed0acbcf5' if cross_target_platform == "linux-aarch64" else '95b1540b4ca96193cbcbb2524d4e2aa944a207f802387b415157ec733f85f85f' if cross_target_platform == "linux-64" else '' }}
    target_directory: binary-kernel-headers
  # END source

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: kernel-headers_${{ cross_target_platform }}
      version: ${{ kernel_headers_version }}
    build:
      noarch: generic
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
      script:
        file: build-kernel-headers.sh
    requirements:
      run_constraints:
        - sysroot_${{ cross_target_platform }} ==${{ glibc_version }}
    tests:
      - script:
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/asm-generic/errno.h
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/asm/types.h
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/drm/drm.h
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/linux/fuse.h
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/sound/asound.h
          - test -f $PREFIX/${{ target_machine }}-${{ ctng_vendor }}-linux-gnu/sysroot/usr/include/linux/version.h
  - package:
      name: sysroot_${{ cross_target_platform }}
    build:
      noarch: generic
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
        missing_dso_allowlist:
          - "*"
      track_features:
        - if: with_features
          then: sysroot_${{ cross_target_platform }}_${{ glibc_version }}
        - if: with_features
          then: sysroot_${{ cross_target_platform }}_${{ glibc_version }}_feature_2
        - if: with_features
          then: sysroot_${{ cross_target_platform }}_${{ glibc_version }}_feature_3
      script:
        file: build-sysroot.sh
    requirements:
      host:
        - tzdata
      run:
        - if: not with_features
          then: __glibc >=${{ glibc_version }}
        - ${{ pin_subpackage('kernel-headers_' ~ cross_target_platform, exact=True) }}
        - tzdata
      run_exports:
        - strong:
            - __glibc >=${{ glibc_version }},<3.0.a0
    tests:
      - script:
          - test -d $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/lib64
          - test ! -L $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/lib64
          - if: cross_target_platform == "linux-riscv64"
            then: test -L $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/lib64/lp64d
          - if: cross_target_platform == "linux-riscv64"
            then: test -L $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/lib64/lp64d
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/crt1.o
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/libc.a
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/libc.so.6
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/libdl.a
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/libm.a
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/libm.so.6
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/Scrt1.o
          - test -f $PREFIX/${{ target_machine }}-${{ ctng_vendor }}-linux-gnu/sysroot/${{ path_fragment }}/libc.so.6
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/bin/ld.so
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/bin/ldd
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/sbin/ldconfig
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/${{ path_fragment }}/sbin/iconvconfig
          - test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/limits.h
          - if: cross_target_platform == "linux-64"
            then: test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/gnu/stubs-64.h
          - if: cross_target_platform != "linux-64"
            then: test -f $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/include/gnu/stubs.h
          - test -d $PREFIX/${{ target_machine }}-conda-linux-gnu/sysroot/usr/share/locale
          - find "${PREFIX}" \( -name 'libnsl*' -o -path '*/rpcsvc/yp*' \) | { ! grep . ; }
          - find "${PREFIX}" \( -name 'libcrypt*' -o -name 'crypt.*' \) | { ! grep . ; }

about:
  license: LGPL-2.0-or-later AND LGPL-2.0-or-later WITH exceptions AND GPL-2.0-or-later
  license_file: LICENSE
  # license files are packaged with source
  summary: (CDT) The GNU libc libraries and header files for the Linux kernel for use by glibc
  description: |
    The glibc package contains standard libraries which are used by multiple
    programs on the system. In order to save disk space and memory, as well as to
    make upgrading easier, common system code is kept in one place and shared
    between programs. This particular package contains the most important sets of
    shared libraries: the standard C library and the standard math library.
    Without these two libraries, a Linux system will not function.

    Kernel-headers includes the C header files that specify the interface between
    the Linux kernel and userspace libraries and programs.  The header files
    define structures and constants that are needed for building most standard
    programs and are also needed for rebuilding the glibc package.


  homepage: https://dl.rockylinux.org/pub/rocky/${{ distro_version }}

extra:
  recipe-maintainers:
    - isuruf
    - scopatz
    - beckermr
