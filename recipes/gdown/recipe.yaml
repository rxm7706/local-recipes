# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.0"

package:
  name: gdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gdown/gdown-${{ version }}.tar.gz
  sha256: 361c6e04c6ca335df50b9d71f40bcfe9ab70fb26a1b0e890a427267781389553

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.20.0
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - filelock
    - requests
    - tqdm
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - gdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wkentaro/gdown
  license: MIT
  license_file: LICENSE
  summary: Google Drive Public File/Folder Downloader
  description: |
    Google Drive Public File/Folder Downloader

extra:
  recipe-maintainers:
    - hmaarrfk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gdown
  cfe-upstream-registry: pypi
