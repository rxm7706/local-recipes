# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.8.17"

package:
  name: nox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nox/nox-${{ version }}.tar.gz
  sha256: 8d9c69c9b996a59db1eb2c6968deaebc2edbc55317d205981bbc4a37351d3f2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - argcomplete <4,>=1.9.4
    - attrs >=24.1
    - colorlog <7,>=6.6
    - dependency-groups >=1.1
    - humanize >=4
    - packaging >=22
    - platformdirs >=2
    - python-discovery >=1
    - tomli >=1.1
    - virtualenv >=20.15

tests:
  - python:
      imports:
        - nox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wntrblm/nox
  license: Apache-2.0
  license_file: LICENSE
  summary: Flexible test automation.
  description: |
    Flexible test automation.
  documentation: https://nox.thea.codes

extra:
  recipe-maintainers:
    - kynan
    - MarckK
    - tswast
    - henryiii

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nox
