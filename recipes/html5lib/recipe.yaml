# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: html5lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/html5lib/html5lib-${{ version }}.tar.gz
  sha256: b2e5b40261e20f354d198eae92afc10d750afb487ed5e50f9c4eaf07c184146f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - six
    - webencodings

tests:
  - python:
      imports:
        - html5lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/html5lib/html5lib-python
  license: MIT
  license_file: LICENSE
  summary: HTML parser based on the WHATWG HTML specification
  description: |
    HTML parser based on the WHATWG HTML specification

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: html5lib
  cfe-upstream-registry: pypi
  cfe-upstream-name: html5lib
  cfe-purls:
    - pkg:conda/html5lib@${{ version }}?channel=conda-forge
    - pkg:pypi/html5lib@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/html5lib/html5lib-python
  cfe-import-names: [html5lib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/html5lib-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.1

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T11:00:40Z
