# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: tangled-up-in-unicode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tangled-up-in-unicode/tangled_up_in_unicode-${{ version }}.tar.gz
  sha256: de56dbaf32de1b8c65621f97b06b7de21cba18c8e61f3988a426ffe3c40fed36

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tangled_up_in_unicode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dylan-profiler/tangled-up-in-unicode
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Access to the Unicode Character Database (UCD)
  description: |
    Access to the Unicode Character Database (UCD)

extra:
  recipe-maintainers:
    - philip-khor
    - sbrugman

