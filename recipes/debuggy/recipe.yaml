# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: debuggy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/debuggy/debuggy-${{ version }}.tar.gz
  sha256: 45e482e3757d73b445eb06c5e695acefb885b4378a6f6590cb36a3fe90ed0f3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bs4
    - argparse
    - pyfiglet
    - psutil
    - pyperclip
    - colorama
    - requests
    - distro
    - fake-useragent

tests:
  - python:
      imports:
        - debuggy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/derhnyel/deBuggy
  license: MIT
  license_file: LICENSE
  summary: Stalk StackOverflow.
  description: |
    Stalk StackOverflow.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
