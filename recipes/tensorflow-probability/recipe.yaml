# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tensorflow-probability
  version: "0.25.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/probability/archive/v${{ version }}.tar.gz
  sha256: 73cf3e52d3b5ee48fc919631e7fa3621849b8ce8d453017016a5148815856bc2
  patches:
    - 001-fix_jax_pytype_mapping.patch

build:
  number: 0
  noarch: python
  script:
    - bazel build --copt=-O3 --copt=-march=native :pip_pkg
    - mkdir -p tmp-pkg
    - ./bazel-bin/pip_pkg tmp-pkg
    - ${{ PYTHON }} -m pip install --upgrade --no-deps -vv tmp-pkg/*.whl

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - absl-py
    - bazel <7
    - setuptools
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - absl-py
    - six >=1.10.0
    - numpy >=1.13.3
    - decorator
    - cloudpickle >=1.3
    - gast >=0.3.2
    - dm-tree
  run_constraints:
    - tensorflow-base >=2.18.0
    - tf-keras >=2.18.0
    - tensorflow-datasets >=2.2.0
    - jax >=0.4.35

tests:
  - python:
      imports:
        - tensorflow_probability
        - tensorflow_probability.substrates.jax
        - tensorflow_probability.substrates.numpy
      pip_check: true
      python_version: "=3.11"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: TensorFlow Probability is a library for probabilistic reasoning and statistical analysis in TensorFlow
  description: |
    TensorFlow Probability is a library for probabilistic reasoning
    and statistical analysis in TensorFlow. As part of the TensorFlow
    ecosystem, TensorFlow Probability provides integration of
    probabilistic methods with deep networks, gradient-based inference
    via automatic differentiation, and scalability to large datasets
    and models via hardware acceleration (e.g., GPUs) and distributed
    computation.
  homepage: https://pypi.org/project/tensorflow-probability/
  repository: https://github.com/tensorflow/probability
  documentation: https://www.tensorflow.org/probability/overview

extra:
  recipe-maintainers:
    - mxr-conda
    - sodre
    - adbedada
    - oblute
    - rluria14
    - jonas-eschle
    - ehfd
    - flferretti

