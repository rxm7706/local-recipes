# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: pypdf2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyPDF2/PyPDF2-${{ version }}.tar.gz
  sha256: a74408f69ba6271f71b9352ef4ed03dc53a31aa404d29b5d31f53bfecfee1440

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - typing_extensions >=3.10.0.0
    - dataclasses

tests:
  - python:
      imports:
        - PyPDF2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyPDF2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  description: |
    A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  repository: https://github.com/py-pdf/PyPDF2
  documentation: https://pypdf2.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - julian-belina
    - pmlandwehr
    - carlodri

#### CFE metadata AND comments
