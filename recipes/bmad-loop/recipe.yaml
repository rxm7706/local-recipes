# CFE comments
# Header:
#    # Not published on PyPI (upstream distributes via GitHub releases only),
#    # so the source is the GitHub tag archive, not a pypi.org sdist URL.
# context:
#    # python_min 3.11 overrides the conda-forge 3.10 floor — upstream
#    # pyproject declares requires-python >=3.11.
# run:
#    # psutil is a win32-only marker dep upstream (linux stays dep-free);
#    # noarch:python has one artifact for all platforms, so it is flattened
#    # to an unconditional run dep (harmless on linux/macos, required for
#    # TUI liveness on win32).
#    # textual/tomlkit/pyte are upstream's optional [tui] extra, included in
#    # run because this repo consumes bmad-loop[tui] (the TUI dashboard is a
#    # first-class feature); drop to a minimal core if ever submitted and a
#    # reviewer objects.
####
