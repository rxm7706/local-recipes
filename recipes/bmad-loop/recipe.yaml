#    # No multiplexer on win: psmux (the Windows backend, >=3.3.8, needs pwsh 7)
#    # is not packaged on conda-forge; `bmad-loop validate` reports its absence
#    # at runtime, which is upstream's design.
#    # psutil is a win32 marker dep upstream; flattened unconditionally (noarch).
#    # textual/tomlkit/pyte/rich are the [tui] extra, httpx the [opencode] extra,
#    # flattened into run as the feedstock already did.
