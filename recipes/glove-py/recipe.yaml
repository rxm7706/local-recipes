# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: glove-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glove-py/glove_py-${{ version }}.tar.gz
  sha256: 35c55cc595eb76a93b21b084f8fb18e41ee8a37e93477bb54cf8bb1ce67bccba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python.glove
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/f20500909/glove_py
  license: MIT
  license_file: LICENSE
  summary: glove Python bindings
  description: |
    glove Python bindings

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: glove-py
