# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0rc4"

package:
  name: clea
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clea/clea-${{ version }}.tar.gz
  sha256: e9d128bab506ab88bae384aa546ff26060e8a64075bffd7ff9e600007e76880d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - clea
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/clea/
  license: MIT
  license_file: LICENSE
  summary: Framework for writing CLI application quickly
  description: |
    Framework for writing CLI application quickly

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clea
  cfe-upstream-registry: pypi
  cfe-upstream-name: clea
