# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.2.1"

package:
  name: pip
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip/pip-${{ version }}.tar.gz
  sha256: f6ad667e89a1fe78046c8f13232b247200f5258d7828f3f7883d660878e0813f

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pip = pip._internal.cli.main:main
      - pip3 = pip._internal.cli.main:main

requirements:
  host:
    - if: not with_setuptools_wheel
      then: python >=3.13.0a0
    - if: with_setuptools_wheel
      then: python >=${{ python_min }},<3.13.0a0
    - flit-core
    - setuptools
    - wheel
  run:
    - if: not with_setuptools_wheel
      then: python >=3.13.0a0
    - if: with_setuptools_wheel
      then: python >=${{ python_min }},<3.13.0a0
    - if: with_setuptools_wheel
      then: setuptools
    - if: with_setuptools_wheel
      then: wheel

tests:
  - python:
      imports:
        - pip
      pip_check: false
  - requirements:
      run:
        - if: with_setuptools_wheel
          then: python ${{ python_min }}
        - if: not with_setuptools_wheel
          then: python 3.13.0
    script:
      - pip -h
      - pip list

about:
  license: MIT
  license_file: LICENSE.txt
  summary: PyPA recommended tool for installing Python packages
  homepage: https://pip.pypa.io/en/stable/
  repository: https://github.com/pypa/pip
  documentation: https://pip.pypa.io/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - ocefpaf
    - mingwandroid
