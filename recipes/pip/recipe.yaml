    - pkg:pypi/pip@${{ version }}
  cfe-upstream-repo: https://github.com/pypa/pip
  cfe-upstream-homepage: https://pip.pypa.io/
  cfe-import-names: [pip]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
