# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: cudf-polars-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/c/cudf-polars-cu12/cudf_polars_cu12-26.8.0-py3-none-any.whl
  sha256: 1a9a677398c814f87f2fbf3de206c488bdf83b78b7a0ba55e1d4453e2317b70d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <13.0,>=12.9.2
    - cudf-streaming-cu12 ==26.8.*
    - nvidia-ml-py >=12
    - packaging
    - polars <1.43,>=1.35
    - pylibcudf-cu12 ==26.8.*
    - rapidsmpf-cu12 ==26.8.*
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - cudf_polars_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cudf
  license: Apache-2.0
  license_file: LICENSE
  summary: Executor for polars using cudf
  description: |
    Executor for polars using cudf

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
