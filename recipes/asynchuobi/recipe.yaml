# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: asynchuobi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asynchuobi/asynchuobi-${{ version }}.tar.gz
  sha256: 196aff4058ac83e27ac5afa03f0191df737950416b3606b99c9ffa26800cde4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - pydantic

tests:
  - python:
      imports:
        - asynchuobi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sometastycake/asynchuobi
  license: MIT
  license_file: LICENSE
  summary: Unofficial asynchronous python client for Huobi cryptoexchange
  description: |
    Unofficial asynchronous python client for Huobi cryptoexchange

extra:
  recipe-maintainers:
    - rxm7706

