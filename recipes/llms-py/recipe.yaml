# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.49"

package:
  name: llms-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llms-py/llms_py-${{ version }}.tar.gz
  sha256: 6171a2d5112a28fe8c6fb9707ffce7d9d1d7c065e4f91df93a2756451ecd816f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp

tests:
  - python:
      imports:
        - llms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ServiceStack/llms
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A lightweight CLI tool and OpenAI-compatible server for querying multiple Large Language Model (LLM) providers
  description: |
    A lightweight CLI tool and OpenAI-compatible server for querying multiple Large Language Model (LLM) providers
  repository: https://github.com/ServiceStack/llms
  documentation: https://github.com/ServiceStack/llms#readme

extra:
  recipe-maintainers:
    - rxm7706

