# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: strsimpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strsimpy/strsimpy-${{ version }}.tar.gz
  sha256: 0842eb57f7af86c882a59a1bc8721ec2580a267e563fd0503ced2972040372c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strsimpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/luozhouyang/python-string-similarity
  license: MIT
  license_file: LICENSE
  summary: A library implementing different string similarity and distance measures
  description: |
    A library implementing different string similarity and distance measures

extra:
  recipe-maintainers:
    - aschonfeld

