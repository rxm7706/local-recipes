# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.15"

package:
  name: openinference-instrumentation-autogen
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation-autogen/openinference_instrumentation_autogen-${{ version }}.tar.gz
  sha256: 11e23e0812a8ebfc3fcf61118912c6771e7ca976d26ecfe6d7f8bbeed037f8b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation-ag2 >=0.1.0
    - opentelemetry-instrumentation

tests:
  - python:
      imports:
        - openinference.instrumentation.autogen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-autogen
  license: Apache-2.0
  license_file: LICENSE
  summary: Deprecated compatibility package for OpenInference AG2 instrumentation
  description: |
    Deprecated compatibility package for OpenInference AG2 instrumentation

extra:
  recipe-maintainers:
    - rxm7706

