    - pkg:conda/pysmartdl@${{ version }}?channel=conda-forge
    - pkg:pypi/pysmartdl@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://pypi.python.org/pypi/pySmartDL/
  cfe-import-names: [pySmartDL]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pysmartdl-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3.4

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

