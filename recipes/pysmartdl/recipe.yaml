# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.4"

package:
  name: pysmartdl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pySmartDL/pySmartDL-${{ version }}.tar.gz
  sha256: 35275d1694f3474d33bdca93b27d3608265ffd42f5aeb28e56f38b906c0c35f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pySmartDL
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/pySmartDL/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Smart Download Manager for Python
  description: |
    A Smart Download Manager for Python

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysmartdl
  cfe-upstream-registry: pypi
  cfe-upstream-name: pysmartdl
