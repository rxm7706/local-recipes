# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pysmartdl
  version: "1.3.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pySmartDL-${{ version }}.tar.gz
  sha256: 35275d1694f3474d33bdca93b27d3608265ffd42f5aeb28e56f38b906c0c35f4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pySmartDL
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Smart Download Manager for Python
  license: Unlicense
  license_file: LICENSE.txt
  homepage: http://pypi.python.org/pypi/pySmartDL/

extra:
  recipe-maintainers:
    - jan-janssen
