# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.11.0"
  python_min: "3.12"

package:
  name: mapclassify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mapclassify/mapclassify-${{ version }}.tar.gz
  sha256: 85dbfe747e5b5aed1f1fd41ef5de0c0ab8322227ee308191a44fff12c59c197d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - networkx >=3.4
    - numpy >=2.0
    - pandas >=2.3
    - scikit-learn >=1.5
    - scipy >=1.14

tests:
  - python:
      imports:
        - mapclassify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/mapclassify/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Classification Schemes for Choropleth Maps.
  description: |
    Classification Schemes for Choropleth Maps.
  repository: https://github.com/pysal/mapclassify

extra:
  recipe-maintainers:
    - jGaboardi
    - sjsrey
    - ljwolf
    - jorisvandenbossche
    - ocefpaf
    - martinfleis
    - knaaptime

