# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.56.0"

package:
  name: uharfbuzz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uharfbuzz/uharfbuzz-${{ version }}.tar.gz
  sha256: 77f4ad1c9f32f44cc6f0c0c4f98fab54587719c96c810a043d01669f704d3e0c

build:
  number: 0
  script:
    - if: unix
      then: rm -rf harfbuzz
    - if: unix
      then: export USE_SYSTEM_LIBS=1
    - if: win
      then: del harfbuzz /s /q
    - if: win
      then: set USE_SYSTEM_LIBS=1
    # Make sure we can find the harfbuzz-subset package
    # This command makes debugging the setup script much easier
    - pkg-config --exists harfbuzz-subset --debug
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: pkgconfig
    - pkg-config
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - pip
    - python
    - setuptools-scm
    - cython
    - pkgconfig
    - setuptools
    - harfbuzz
    # The following dependencies are needed for harfbuzz->freetype detection on windows
    - zlib
    - glib
  run:
    - python
  ignore_run_exports:
    from_package:
      - zlib
      - glib

tests:
  - python:
      imports:
        - uharfbuzz
      pip_check: true

about:
  summary: Streamlined Cython bindings for the harfbuzz shaping engine
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/trufont/uharfbuzz

extra:
  recipe-maintainers:
    - thewchan
    - jan-janssen
