# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: arxiv
  version: "4.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/arxiv-${{ version }}.tar.gz
  sha256: 304e91a9f869fa4cc362a0a6f38ecb956eec11b83619465172ab24b9453e3d51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - lxml >=6.1.0,<7.0
    - requests >=2.32,<2.35
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - arxiv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Python wrapper for the arXiv API: http://arxiv.org/help/api/"
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/lukasschwab/arxiv.py
  documentation: http://lukasschwab.me/arxiv.py/index.html

extra:
  recipe-maintainers:
    - thewchan
