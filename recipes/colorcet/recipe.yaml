# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.1"

package:
  name: colorcet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colorcet/colorcet-${{ version }}.tar.gz
  sha256: 48d9a67e6e59dc5c0a965aa1b46fe5d59cdc95cc36a95949f29313f950ac59f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - setuptools-scm >=6
  run:
    - python >=${{ python_min }}
    - colorcet

tests:
  - python:
      imports:
        - colorcet.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://colorcet.holoviz.org
  license: CC-BY-4.0
  license_file: LICENSE
  summary: Collection of perceptually uniform colormaps
  description: |
    Collection of perceptually uniform colormaps
  repository: https://github.com/holoviz/colorcet
  documentation: https://colorcet.holoviz.org

extra:
  recipe-maintainers:
    - hoxbro
    - maximlt
    - droumis
    - jbednar
    - jsignell

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: colorcet
  cfe-upstream-registry: pypi
  cfe-upstream-name: colorcet
