    - pkg:pypi/colorcet@${{ version }}
  cfe-upstream-repo: https://github.com/holoviz/colorcet
  cfe-upstream-homepage: https://colorcet.holoviz.org
  cfe-import-names: [colorcet.tests]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/colorcet-feedstock
  cfe-forge-recipe-updates-needed: 
