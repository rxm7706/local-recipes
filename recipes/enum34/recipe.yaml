# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.10"

package:
  name: enum34
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/e/enum34/enum34-${{ version }}.tar.gz
  sha256: cce6a7477ed816bd2542d03d53db9f0db935dd013b70f336a95c73979289f248
  target_directory: hidden

build:
  number: 2
  script: ${{ PYTHON }} -m pip install .\\hidden --no-deps --ignore-installed --no-cache-dir -v if win and (not match(python, ">=3.4")) else PYTHON }} -m pip install ./hidden --no-deps --ignore-installed --no-cache-dir -v if (not win) and (not match(python, ">=3.4")) else PYTHON }} --versi if match(python, ">=3.4") else '' }}

requirements:
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - enum
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: hidden/enum/LICENSE
  summary: Python 3.4 Enum backported to 3.3, 3.2, 3.1, 2.7, 2.6, 2.5, and 2.4
  homepage: https://bitbucket.org/stoneleaf/enum34

extra:
  recipe-maintainers:
    - ocefpaf
    - jakirkham
