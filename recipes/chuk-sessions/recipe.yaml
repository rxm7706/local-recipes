# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.3"

package:
  name: chuk-sessions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-sessions/chuk_sessions-${{ version }}.tar.gz
  sha256: 7a3cff7ec37ca6a0e2b5ffd150edec3771f0d44af207a8164ea79edcfe4fe386

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0
    - wheel
  run:
    - python >=${{ python_min }}
    - csrf >=0.1b1
    - pydantic >=2.12.5
    - pyyaml >=6.0.2

tests:
  - python:
      imports:
        - chuk_sessions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chuk-sessions/
  license: Apache-2.0
  license_file: LICENSE
  summary: CHUK Sessions provides a comprehensive, async-first session management system with automatic expiration, and support for both in-memory and Redis storage backends. Perfect for web applications, MCP servers, API gateways, and microservices that need reliable, scalable session handling.
  description: |
    CHUK Sessions provides a comprehensive, async-first session management system with automatic expiration, and support for both in-memory and Redis storage backends. Perfect for web applications, MCP servers, API gateways, and microservices that need reliable, scalable session handling.

extra:
  recipe-maintainers:
    - rxm7706

