# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pytorch-transformers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytorch-transformers/pytorch_transformers-${{ version }}.tar.gz
  sha256: 293e4a864ae9d9401f9fba13f16b8696e4a1cb38bcd0b56562d03af5489daeb9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - numpy
    - boto3
    - requests
    - tqdm
    - regex
    - sentencepiece
    - sacremoses

tests:
  - python:
      imports:
        - pytorch_transformers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/pytorch-transformers
  license: Apache-2.0
  license_file: LICENSE
  summary: "Repository of pre-trained NLP Transformer models: BERT & RoBERTa, GPT & GPT-2, Transformer-XL, XLNet and XLM"
  description: |
    Repository of pre-trained NLP Transformer models: BERT & RoBERTa, GPT & GPT-2, Transformer-XL, XLNet and XLM

extra:
  recipe-maintainers:
    - rxm7706

