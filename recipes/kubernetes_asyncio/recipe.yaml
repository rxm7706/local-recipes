# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "36.1.0"

package:
  name: kubernetes-asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kubernetes-asyncio/kubernetes_asyncio-${{ version }}.tar.gz
  sha256: 6d979d82e5ebe490bea298e7843732a2336173236bae28e200434889443d4443

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp <4.0.0,>=3.9.0
    - certifi >=14.05.14
    - python-dateutil >=2.5.3
    - pyyaml >=3.12
    - six >=1.9.0
    - urllib3 >=1.24.2

tests:
  - python:
      imports:
        - kubernetes_asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/kubernetes-asyncio/
  license: Apache-2.0
  license_file: LICENSE
  summary: Kubernetes Asynchronous Python Client
  description: |
    Kubernetes Asynchronous Python Client

extra:
  recipe-maintainers:
    - ocefpaf

