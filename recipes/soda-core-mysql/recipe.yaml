# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.6"

package:
  name: soda-core-mysql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soda-core-mysql/soda_core_mysql-${{ version }}.tar.gz
  sha256: a6ab8eaaecb15a9c9b44a36445977ba8b319d87755773ebe547086031c9d08f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - soda-core ==3.5.6
    - mysql-connector-python ==8.0.30

tests:
  - python:
      imports:
        - soda_core_mysql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/soda-core-mysql/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

