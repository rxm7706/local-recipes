# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.1"

package:
  name: google-resumable-media
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-resumable-media/google_resumable_media-${{ version }}.tar.gz
  sha256: 224975032ddb73f7ed9e2f0f4cc08ed1b06874c52d48cc8533e3eb72980b21a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-crc32c <2.0.0,>=1.0.0

tests:
  - python:
      imports:
        - google.resumable_media
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-resumable-media
  license: Apache-2.0
  license_file: LICENSE
  summary: Utilities for Google Media Downloads and Resumable Uploads
  description: |
    Utilities for Google Media Downloads and Resumable Uploads

extra:
  recipe-maintainers:
    - xylar
    - johanneskoester
    - parthea
    - tswast

