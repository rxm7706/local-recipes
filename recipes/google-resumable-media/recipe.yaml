# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-resumable-media
  version: "2.10.1"

package:
  name: google-resumable-media
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 224975032ddb73f7ed9e2f0f4cc08ed1b06874c52d48cc8533e3eb72980b21a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-crc32c >=1.0.0,<2.0.0
  run_constraints:
    - requests >=2.18.0,<3.0.0
    - aiohttp >=3.6.2,<4.0.0
    - google-auth >=2.14.1,<2.0.0

tests:
  - python:
      imports:
        - google
        - google.resumable_media
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Utilities for Google Media Downloads and Resumable Uploads
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-resumable-media
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-resumable-media
  documentation: https://googleapis.github.io/google-resumable-media-python/latest/

extra:
  recipe-maintainers:
    - xylar
    - johanneskoester
    - parthea
    - tswast
