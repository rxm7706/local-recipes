# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.16.1"

package:
  name: traitlets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/traitlets/traitlets-${{ version }}.tar.gz
  sha256: ed900c2b631aa3a112811139fa97b8d2c3bad5e989656bba4b7e52c7852c18c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - traitlets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ipython/traitlets
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Traitlets Python configuration system
  description: |
    Traitlets Python configuration system
  repository: https://github.com/ipython/traitlets
  documentation: https://traitlets.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - minrk
    - SylvainCorlay
    - ocefpaf
    - Carreau
    - takluyver
    - rmorshea
    - blink1073
    - zsailer
    - bollwyvl
    - davidbrochart

