# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.1"
  python_min: "3.11"

package:
  name: chuk-llm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-llm/chuk_llm-${{ version }}.tar.gz
  sha256: effe6733d0ea9af0182516e5d8716d57a08ffc3c70f3f9270c931f064f129175

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.13.4
    - anthropic >=0.62.0
    - asyncio >=4.0.0
    - chuk-ai-session-manager >=0.8.2
    - google-genai >=1.70.0
    - groq >=0.25.0
    - httpx >=0.28.1
    - ibm-watsonx-ai >=1.3.30
    - jinja2 >=3.1.6
    - mistralai >=2.2.0
    - ollama-python >=0.5.3
    - openai >=1.79.0
    - python-dotenv >=1.1.0
    - pyyaml >=6.0.2
    - tiktoken >=0.11.0
    - transformers >=5.4.0
    - ujson >=5.12.0

tests:
  - python:
      imports:
        - chuk_llm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chrishayuk/chuk-llm
  license: Apache-2.0
  license_file: LICENSE
  summary: A unified Python library for Large Language Model (LLM) providers with real-time streaming, function calling, middleware support, automatic session tracking, dynamic model discovery, and intelligent system prompt generation.
  description: |
    A unified Python library for Large Language Model (LLM) providers with real-time streaming, function calling, middleware support, automatic session tracking, dynamic model discovery, and intelligent system prompt generation.
  repository: https://github.com/chrishayuk/chuk-llm.git
  documentation: https://github.com/chrishayuk/chuk-llm#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
