# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.0"

package:
  name: tk-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tk-tools/tk_tools-${{ version }}.tar.gz
  sha256: acef54d40c211ebdf368b6ebd367b4835bd6231bee4d76611f1eec223f0dee1a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >75.0.0
  run:
    - python >=${{ python_min }}
    - engineering-notation >=0.10.0
    - stringify >=0.1.1

tests:
  - python:
      imports:
        - tk_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tk-tools/
  license: MIT
  license_file: LICENSE
  summary: Tkinter widgets and helpers
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

