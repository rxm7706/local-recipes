# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: lazr-restfulclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lazr.restfulclient/lazr_restfulclient-${{ version }}.tar.gz
  sha256: 79577938dabce496675454105c37c5aa06deed7928818a98411adfb22f9e294b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - distro
    - httplib2 >=0.7.7
    - oauthlib
    - wadllib >=1.1.4

tests:
  - python:
      imports:
        - lazr.restfulclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://launchpad.net/lazr.restfulclient
  license: LGPL-3.0-only
  license_file: COPYING.txt
  summary: Programmable client for lazr.restful web services
  description: |
    A programmable client library that takes advantage of the commonalities among lazr.restful web services.
  repository: https://code.launchpad.net/lazr.restfulclient
  documentation: https://lazrrestfulclient.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

