# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: click-params
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/click_params-${{ version }}.tar.gz
  sha256: 5fe97b9459781a3b43b84fe4ec0065193e1b0d5cf6dc77897fe20c31f478d7ff

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - click >=7.0,<9.0
    - validators >=0.22.0,<0.23.0
    - deprecated >=1.2.14,<2.0.0

tests:
  - python:
      imports:
        - click_params
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A bunch of useful click parameter types
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://click-params.readthedocs.io/en/stable
  repository: https://github.com/click-contrib/click_params
  documentation: https://click-params.readthedocs.io/en/stable

extra:
  recipe-maintainers:
    - xylar
    - sodre
    - sugatoray
