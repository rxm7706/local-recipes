    - pkg:pypi/mathparse@${{ version }}
  cfe-upstream-repo: https://github.com/gunthercox/mathparse
  cfe-upstream-homepage: https://pypi.org/project/mathparse/
  cfe-import-names: [mathparse]
  cfe-source-kind: pypi-sdist
