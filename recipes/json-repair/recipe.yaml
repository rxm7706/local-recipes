# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.63.2"

package:
  name: json-repair
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-repair/json_repair-${{ version }}.tar.gz
  sha256: 8385ca04afbf411eebd9f0ba064155d1afe37442aaad52f693825c65cc314586

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json_repair
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mangiucugna/json_repair/
  license: MIT
  license_file: LICENSE
  summary: A package to repair broken json strings
  description: |
    A package to repair broken json strings

extra:
  recipe-maintainers:
    - jan-janssen

