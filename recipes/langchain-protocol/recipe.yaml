# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.18"

package:
  name: langchain-protocol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-protocol/langchain_protocol-${{ version }}.tar.gz
  sha256: ec3e11782f1ed0c9db38e5a9ed01b0e7a0d3fba406faa8aef6594b73c56a63e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - typing_extensions <5.0.0,>=4.13.0

tests:
  - python:
      imports:
        - langchain_protocol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/langchain-ai/agent-protocol/tree/main/streaming
  license: MIT
  license_file: LICENSE
  summary: Python bindings for the LangChain agent streaming protocol
  description: |
    Python bindings for the LangChain agent streaming protocol
  repository: https://github.com/langchain-ai/agent-protocol

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
