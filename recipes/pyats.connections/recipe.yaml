# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.connections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats.connections/pyats_connections-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: ffca5c00670848261371fd173b3173d3141ec71c5405f7f42956df4840c91046

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyats.datastructures <26.8.0,>=26.7.0
    - pyats.async <26.8.0,>=26.7.0
    - unicon <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats.connections
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS Connection: Device Connection Handling & Base Classes"
  description: |
    pyATS Connection: Device Connection Handling & Base Classes

extra:
  recipe-maintainers:
    - rxm7706

