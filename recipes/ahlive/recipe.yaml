    - pkg:pypi/ahlive@${{ version }}
  cfe-upstream-repo: https://github.com/ahuang11/ahlive
  cfe-upstream-homepage: https://github.com/ahuang11/ahlive
  cfe-import-names: [ahlive]
  cfe-source-kind: pypi-sdist
