# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"
  python_min: "3.12"

package:
  name: gemma
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gemma/gemma-${{ version }}.tar.gz
  sha256: 00899dd6e608af25fed64455369b8ce64aec64e15614dec16eda1ce5f3520d2c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}
    - absl-py
    - dialog >=1.1
    - etils
    - einops
    - jax
    - jaxtyping
    - kauldron
    - flax
    - numpy
    - orbax-checkpoint
    - sentencepiece
    - treescope
    - fastmcp
    - mcp

tests:
  - python:
      imports:
        - gemma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gemma-llm.readthedocs.io/en/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: Gemma open-weight LLM library from Google DeepMind.
  description: |
    Gemma open-weight LLM library from Google DeepMind.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gemma
  cfe-upstream-registry: pypi
  cfe-upstream-name: gemma
  cfe-purls:
