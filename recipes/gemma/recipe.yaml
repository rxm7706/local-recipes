    - pkg:pypi/gemma@${{ version }}
  cfe-upstream-repo: https://gemma-llm.readthedocs.io/en/latest/
  cfe-upstream-homepage: https://gemma-llm.readthedocs.io/en/latest/
  cfe-import-names: [gemma]
