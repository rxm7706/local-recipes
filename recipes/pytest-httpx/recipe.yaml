# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.36.2"

package:
  name: pytest-httpx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-httpx/pytest_httpx-${{ version }}.tar.gz
  sha256: 05a56527484f7f4e8c856419ea379b8dc359c36801c4992fdb330f294c690356

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - httpx ==0.28.*
    - pytest ==9.*

tests:
  - python:
      imports:
        - pytest_httpx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-httpx/
  license: MIT
  license_file: LICENSE
  summary: Send responses to httpx.
  description: |
    Send responses to httpx.
  documentation: https://colin-b.github.io/pytest_httpx/

extra:
  recipe-maintainers:
    - owenlamont
    - dgasmith

