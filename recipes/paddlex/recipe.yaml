# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.2"

package:
  name: paddlex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/paddlex/paddlex-${{ version }}.tar.gz
  sha256: 6a60b4595e2d51460f7f51326672adca86b89ff9ecfd02ac348fb69739e0093c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69
  run:
    - python >=${{ python_min }}
    - aistudio-sdk >=0.3.5
    - chardet
    - colorlog
    - filelock
    - huggingface-hub
    - modelscope <1.29.2,>=1.28.0
    - numpy <2.4,>=1.24
    - packaging
    - pandas >=1.3
    - pillow
    - prettytable
    - py-cpuinfo
    - pydantic >=2
    - pyyaml ==6.0.2
    - requests
    - ruamel.yaml
    - typing_extensions
    - ujson

tests:
  - python:
      imports:
        - paddlex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/paddlex/
  license: Apache-2.0
  license_file: LICENSE
  summary: Low-code development tool based on PaddlePaddle.
  description: |
    Low-code development tool based on PaddlePaddle.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: paddlex
  cfe-upstream-registry: pypi
  cfe-upstream-name: paddlex
  cfe-purls:
    - pkg:conda/paddlex@${{ version }}?channel=conda-forge
    - pkg:pypi/paddlex@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/paddlex/
  cfe-upstream-homepage: https://pypi.org/project/paddlex/
  cfe-import-names: [paddlex]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
