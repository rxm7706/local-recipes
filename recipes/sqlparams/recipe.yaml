# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sqlparams
  version: "6.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlparams-${{ version }}.tar.gz
  sha256: 3744a2ad16f71293db6505b21fd5229b4757489a9b09f3553656a1ae97ba7ca5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlparams
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convert between various DB API 2.0 parameter styles.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/sqlparams/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
