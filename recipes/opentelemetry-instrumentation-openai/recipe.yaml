# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.62.3"

package:
  name: opentelemetry-instrumentation-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-openai/opentelemetry_instrumentation_openai-${{ version }}.tar.gz
  sha256: b9e1b9a1e6c48cdd436cfaa6fb9af1b393e806debbafd408f4b5232f9ec4df12

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api <2,>=1.38.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions-ai <0.6.0,>=0.5.1
    - opentelemetry-semantic-conventions >=0.63b1

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/opentelemetry-instrumentation-openai/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry OpenAI instrumentation
  description: |
    OpenTelemetry OpenAI instrumentation
  repository: https://github.com/traceloop/openllmetry/tree/main/packages/opentelemetry-instrumentation-openai

extra:
  recipe-maintainers:
    - timkpaine

#### CFE metadata AND comments
