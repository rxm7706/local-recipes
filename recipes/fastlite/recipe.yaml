# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: fastlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastlite/fastlite-${{ version }}.tar.gz
  sha256: f1ac4329fe18c7bf027a09d05e856215ae9c2fc8e1c0044e110f9a8a36ea1995

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64.0
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - fastcore >=1.7.1
    - apswutils >=0.1.2

tests:
  - python:
      imports:
        - fastlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AnswerDotAI/fastlite
  license: Apache-2.0
  license_file: LICENSE
  summary: A bit of extra usability for sqlite
  description: |
    A bit of extra usability for sqlite

extra:
  recipe-maintainers:
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fastlite
  cfe-upstream-registry: pypi
  cfe-upstream-name: fastlite
  cfe-purls:
    - pkg:conda/fastlite@${{ version }}?channel=conda-forge
    - pkg:pypi/fastlite@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/AnswerDotAI/fastlite
  cfe-import-names: [fastlite]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/fastlite-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-0.2.4

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T08:10:42Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T08:10:42Z
  cfe-local-build-status: failed
  cfe-local-build-datetime: 2026-08-17T08:10:42Z
