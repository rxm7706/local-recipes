# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: pylibcudf-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/p/pylibcudf-cu13/pylibcudf_cu13-26.8.0-cp311-abi3-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: 70b0c441b45cdfbdad6e810821a867e2d1bdcb72487ab426ee2d90b2c344ef20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <14.0,>=13.0.1
    - libcudf-cu13 ==26.8.*
    - nvtx >=0.2.1
    - rmm-cu13 ==26.8.*

tests:
  - python:
      imports:
        - pylibcudf_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cudf
  license: Apache-2.0
  license_file: LICENSE
  summary: pylibcudf - Python bindings for libcudf
  description: |
    pylibcudf - Python bindings for libcudf
  documentation: https://docs.rapids.ai/api/cudf/stable/

extra:
  recipe-maintainers:
    - rxm7706

