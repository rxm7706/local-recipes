# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: optimum-onnx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/optimum-onnx/optimum_onnx-${{ version }}.tar.gz
  sha256: 182c54b25eddaded1618af7b58516da34749393a987ec7111f74677f249676f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}
    - optimum ~=2.1.0
    - transformers <4.58.0,>=4.36
    - onnx

tests:
  - python:
      imports:
        - optimum.onnx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/optimum-onnx
  license: Apache-2.0
  license_file: LICENSE
  summary: Optimum ONNX is an interface between the Hugging Face libraries and ONNX / ONNX Runtime
  description: |
    Optimum ONNX is an interface between the Hugging Face libraries and ONNX / ONNX Runtime

extra:
  recipe-maintainers:
    - rxm7706

