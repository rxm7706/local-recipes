# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: pytest-ansible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-ansible/pytest_ansible-${{ version }}.tar.gz
  sha256: 8621fb9edfbd72a74e3c5079d665ed9ef38e30e19a373458f19ff0624dc9a4c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ansible-compat >=25.8.2
    - ansible-core !=2.17.*,>=2.16.19
    - cffi >=1.15.1
    - packaging >=23.2
    - pytest >=6
    - pytest-xdist >=3.8.0
    - typing_extensions >=4.15.0

tests:
  - python:
      imports:
        - pytest_ansible
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/pytest-ansible
  license: MIT
  license_file: LICENSE
  summary: Plugin for pytest to simplify calling ansible modules from tests or fixtures
  description: |
    Plugin for pytest to simplify calling ansible modules from tests or fixtures
  documentation: https://github.com/ansible/pytest-ansible

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
