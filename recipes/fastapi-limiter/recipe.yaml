# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: fastapi-limiter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-limiter/fastapi_limiter-${{ version }}.tar.gz
  sha256: b042259f6280056b5b2b3f506edd76c8e0648d7a5ce86c3485216a4a0fd0ec14

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.26,<0.10.0
  run:
    - python >=${{ python_min }}
    - fastapi
    - pyrate-limiter >=3.9.0

tests:
  - python:
      imports:
        - fastapi_limiter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/long2ice/fastapi-limiter
  license: Apache-2.0
  license_file: LICENSE
  summary: A request rate limiter for fastapi
  description: |
    A request rate limiter for fastapi
  repository: https://github.com/long2ice/fastapi-limiter.git
  documentation: https://github.com/long2ice/fastapi-limiter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
