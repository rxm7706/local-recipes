# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.1"

package:
  name: apache-airflow
  version: ${{ version }}

source:
  url: https://github.com/apache/airflow/archive/refs/tags/${{ version }}.tar.gz
  sha256: 1e440857c887e53c727199afeb0d88a011a563608db90c2e97b2491f354b81e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.30.1
    - packaging ==26.2
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    - tomli ==2.4.1
  run:
    - python >=${{ python_min }}
    - apache-airflow-core ==3.3.1
    - apache-airflow-task-sdk ==1.3.1

tests:
  - python:
      imports:
        - apache_airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://airflow.apache.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Programmatically author, schedule and monitor data pipelines
  description: |
    Programmatically author, schedule and monitor data pipelines
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/

extra:
  recipe-maintainers:
    - sodre
    - halldc
    - xylar

#### CFE metadata AND comments
