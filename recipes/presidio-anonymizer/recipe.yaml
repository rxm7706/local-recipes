# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.364"

package:
  name: presidio-anonymizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/presidio-anonymizer/presidio_anonymizer-${{ version }}.tar.gz
  sha256: eced015f1195f79a91ad11b34a531ceca2e5c673ed57e97649efea3d3293155d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - cryptography <49.0.0,>=48.0.1

tests:
  - python:
      imports:
        - presidio_anonymizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/data-privacy-stack/presidio
  license: MIT
  license_file: LICENSE
  summary: Presidio Anonymizer package - replaces analyzed text with desired values.
  description: |
    Presidio Anonymizer package - replaces analyzed text with desired values.

extra:
  recipe-maintainers:
    - phemps
    - gulyasi
    - julcsii
    - geoHeil
    - heckert

