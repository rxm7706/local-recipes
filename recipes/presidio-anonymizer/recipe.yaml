# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: presidio-anonymizer
  version: "2.2.360"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/microsoft/presidio/archive/refs/tags/${{ version }}.tar.gz
  sha256: 47542f1bf1ff6a6fb0cc4786d4e6001573b35da7bf92d872d863dc912d7428d2

build:
  number: 0
  noarch: python
  script: cd ${{ name }} && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<4
    - cryptography <44.1
  run_constraints:
    - flask >=1.1
    - gunicorn

tests:
  - python:
      imports:
        - presidio_anonymizer
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - pip list

about:
  summary: Presidio Anonymizer package - replaces analyzed text with desired values.
  description: |
    Presidio Anonymizer package - replaces analyzed text with desired values.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/presidio
  repository: https://github.com/microsoft/presidio
  documentation: https://microsoft.github.io/presidio

extra:
  recipe-maintainers:
    - phemps
    - gulyasi
    - julcsii
    - geoHeil
    - heckert
