schema_version: 1

context:
  version: "1.43.72"

package:
  name: types-boto3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-boto3/types_boto3-1.43.72-py3-none-any.whl
  sha256: b903ca08add00c8ee2711e9b79368d189413bf92938985e03179b0f257862c10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - botocore-stubs
    - types-s3transfer
    - typing_extensions >=4.1.0

tests:
  - python:
      imports:
        - types_boto3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youtype/mypy_boto3_builder
  license: MIT
  license_file: LICENSE
  summary: Type annotations for boto3 1.43.72 generated with mypy-boto3-builder 8.12.0
  description: |
    Type annotations for boto3 1.43.72 generated with mypy-boto3-builder 8.12.0
  repository: https://github.com/youtype/mypy_boto3_builder
  documentation: https://youtype.github.io/types_boto3_docs/

extra:
  recipe-maintainers:
    - rxm7706

