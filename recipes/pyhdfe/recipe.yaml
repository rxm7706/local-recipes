# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyhdfe
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8cddc5f5a09148d3281fca3c787146a85ecc5a7517be3ae5762bfe507907b7fb

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.17
    - scipy >=1.0

tests:
  - python:
      imports:
        - pyhdfe
        - pyhdfe.algorithms
        - pyhdfe.interface
        - pyhdfe.utilities
        - pyhdfe.version
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Algorithms for absorbing high dimensional fixed effects.
  homepage: https://github.com/jeffgortmaker/pyhdfe
  repository: https://github.com/jeffgortmaker/pyhdfe
  documentation: https://pyhdfe.readthedocs.io/

extra:
  recipe-maintainers:
    - bashtage
