# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.4"

package:
  name: dash-bootstrap-components
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-bootstrap-components/dash_bootstrap_components-${{ version }}.tar.gz
  sha256: c3206c0923774bbc6a6ddaa7822b8d9aa5326b0d3c1e7cd795cc975025fe2484

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - dash >=3.0.4

tests:
  - python:
      imports:
        - dash_bootstrap_components
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.dash-bootstrap-components.com/
  license: Apache-2.0
  license_file: LICENSE
  summary: Bootstrap themed components for use in Plotly Dash
  description: |
    Bootstrap themed components for use in Plotly Dash
  repository: https://github.com/dbc-team/dash-bootstrap-components/

extra:
  recipe-maintainers:
    - holtgrewe
    - tcbegley

