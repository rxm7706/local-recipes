# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.12.0"

package:
  name: whitenoise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/whitenoise/whitenoise-${{ version }}.tar.gz
  sha256: f723ebb76a112e98816ff80fcea0a6c9b8ecde835f8ddda25df7a30a3c2db6ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - whitenoise
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/whitenoise/
  license: MIT
  license_file: LICENSE
  summary: Radically simplified static file serving for WSGI applications
  description: |
    Radically simplified static file serving for WSGI applications
  repository: https://github.com/evansd/whitenoise
  documentation: https://whitenoise.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - sannykr

