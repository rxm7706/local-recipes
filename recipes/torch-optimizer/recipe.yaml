# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: torch-optimizer
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b2180629df9d6cd7a2aeabe71fa4a872bba938e8e275965092568cd9931b924c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch-ranger
    - pytorch >=1.7

tests:
  - python:
      imports:
        - torch_optimizer
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A collection of optimizers for PyTorch compatible with optim module.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/jettify/pytorch-optimizer

extra:
  recipe-maintainers:
    - sarthakpati
