# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: zookeeper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zookeeper/zookeeper-${{ version }}.tar.gz
  sha256: 180897b82fa83d3268e834ee0a70b418daa2ef216c55b4312e0d01c95818832b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=7.0
    - tensorflow-datasets <v4.9.0,>=1.3.0
    - typeguard >=3.0
    - protobuf <3.21

tests:
  - python:
      imports:
        - zookeeper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/larq/zookeeper
  license: Apache-2.0
  license_file: LICENSE
  summary: A small library for managing deep learning models, hyper-parameters and datasets
  description: |
    A small library for managing deep learning models, hyper-parameters and datasets

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
