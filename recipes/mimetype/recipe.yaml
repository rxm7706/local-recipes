# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: mimetype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mimetype/mimetype-${{ version }}.tar.gz
  sha256: 0ccae479eb36d3ff0553480e9df7738f2789529e5388560ad364ca06eecaa297

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - enumb

tests:
  - python:
      imports:
        - mimetype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mimetype/
  license: MIT
  license_file: LICENSE
  summary: Mime Type parsing and creation
  description: |
    Mime Type parsing and creation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mimetype
  cfe-upstream-registry: pypi
  cfe-upstream-name: mimetype
