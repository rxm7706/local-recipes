# CFE comments
# Header:
#    LOCAL-ONLY v2 recipe. The conda-forge reactpy-feedstock stays at stable
#    1.1.0 -- see cfe-forge-blocker-list for why. Built to satisfy the
#    reactpy-django 6.0.0b1 chain, which pins reactpy>=2.0.0b13,<3.
#    This recipe was rewritten from scratch at the operator's direction ("local
#    recipe might be very old, you can pretty much ignore it"); the prior local
#    recipe was at 2.0.0b2 and built from a GitHub archive with `npm install -g
#    bun` + a git dep. That whole apparatus is unnecessary -- see build: below.
# context:
#  python_min:
#    Declared at 3.11 because upstream requires-python is ">=3.11", strictly
#    above the conda-forge default floor of 3.10 -- this is exactly the case
#    where python_min SHOULD be declared (it is omitted at the default floor).
#    reactpy v1 was >=3.9, so v2 raises the floor; the whole downstream chain
#    (reactpy-router 3.x, asgi-tools) independently agrees on 3.11.
# source:
#    PyPI sdist, NOT a GitHub archive. Verified 2026-07-14: the sdist already
#    ships the fully built JS client -- 72 files under src/reactpy/static/
#    (index.js, preact, morphdom, ...) -- plus the embedded PyScript wheel at
#    src/reactpy/static/wheels/. So this is the INVERSE of G51/G73: here the
#    published sdist is the complete artifact and the GitHub tag is the one that
#    would need a JS toolchain. Sourcing the sdist is what removes the need for
#    node/bun entirely.
#  patches:
#    0001-keep-prebuilt-pyscript-wheel.patch sets clean_artifacts = false on the
#    build-scripts hook. This is REQUIRED and non-obvious: the skip env var alone
#    is NOT sufficient. hatch-build-scripts 1.0.0 defaults clean_artifacts=True
#    (verified by reading OneScriptConfig in its plugin.py), and its initialize()
#    UNLINKS every file matching the hook's `artifacts` globs BEFORE running the
#    commands. So the plugin deleted the sdist's prebuilt
#    static/wheels/reactpy-<ver>-py3-none-any.whl, our skipped script then
#    regenerated nothing, and the 1.6 MB embedded PyScript wheel silently
#    vanished from the package -- 71 of upstream's 72 static files shipped.
#    Caught by the package_contents test below, NOT by import/pip_check (both
#    were green). Upstream's own published wheel does ship that file, which is
#    the reference we match. With clean_artifacts=false the prebuilt wheel
#    survives, the script no-ops, and the wheel-target's
#    artifacts=["/src/reactpy/static/"] carries it into the wheel.
#    A source patch rather than an in-build sed per G59 (noarch builds run on
#    osx/win too, where bare `sed -i` breaks); no ${{ version }} interpolation is
#    needed here, so the static patch form applies cleanly.
# build:
#  script:
#    env:
#      REACTPY_SKIP_PY_WHEEL_BUILD=1 is the load-bearing line. pyproject declares
#      a hatch-build-scripts hook running src/build_scripts/build_py_wheel.py,
#      which would call `hatch run javascript:build` (JS toolchain) and then
#      recursively `hatch build -t wheel`. That script's main() checks this env
#      var FIRST and returns 0 immediately, so the hook becomes a no-op and the
#      sdist's prebuilt static assets are packaged as-is. A static value, so
#      script.env is safe here (it does not shell-expand -- G1).
#      Consequence: `hatch` itself is in [build-system].requires but is never
#      reached, so it is deliberately NOT in host: (only hatchling, the backend,
#      and hatch-build-scripts, the hook plugin, which hatchling must import).
# requirements:
#  run:
#    Exactly the 4 PEP 621 [project].dependencies. v2 DROPPED several v1 deps the
#    old feedstock recipe still carries (exceptiongroup, mypy_extensions,
#    jsonpatch, colorlog, asgiref, typing_extensions) -- do not carry them over.
#    fastjsonschema -> python-fastjsonschema is a G10 conda rename.
#    The [asgi] extra (asgiref + asgi-tools + servestatic + orjson) is NOT listed
#    here: conda builds one package without extras (G25). Consumers that request
#    reactpy[asgi] -- i.e. reactpy-router 3.0.0b1 -- must flatten it themselves,
#    and that is the sole reason asgi-tools/http-router were packaged.
# tests:
#    The package_contents block is a deliberate regression guard, not ceremony.
#    reactpy's entire value is its JS client, but `import reactpy` and pip_check
#    both PASS on an asset-less build (the G73 failure mode: green tests, shipped
#    -broken UI). Asserting index.js + the embedded wheel makes an assets-dropping
#    regression fail loudly at packaging time. It is also env-free, so it still
#    runs even if a test-env solve is blocked.
####
