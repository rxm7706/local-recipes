# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: to
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/to/to-${{ version }}.tar.gz
  sha256: b51c951a04f0f7fa45cd99a871e0897e6a461e510b21860f145b95465544e51b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - to
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chamrc/to
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A trainer for PyTorch
  description: |
    A trainer for PyTorch

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: to
  cfe-upstream-registry: pypi
  cfe-upstream-name: to
  cfe-purls:
    - pkg:conda/to@${{ version }}?channel=conda-forge
    - pkg:pypi/to@${{ version }}
  cfe-upstream-repo: https://github.com/chamrc/to
  cfe-upstream-homepage: https://github.com/chamrc/to
  cfe-import-names: [to]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
