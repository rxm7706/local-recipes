# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cons
  version: "0.4.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cons-${{ version }}.tar.gz
  sha256: 0a96cd2abd6a9f494816c1272cf5583a960041750c2d7a48eeeccd47ce369dfd

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=77.0.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - logical-unification >=0.4.0

tests:
  - python:
      imports:
        - cons
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - python -c "from importlib.metadata import version; print(version('${{ name }}'))"
      - python -c "from importlib.metadata import version; print(version('${{ name }}'))" | grep ${{ version }}

about:
  summary: An implementation of Lisp/Scheme-like cons in Python.
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/pythological/python-cons
  repository: https://github.com/pythological/python-cons

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard
