# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.7"

package:
  name: cons
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cons/cons-${{ version }}.tar.gz
  sha256: 0a96cd2abd6a9f494816c1272cf5583a960041750c2d7a48eeeccd47ce369dfd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - logical-unification >=0.4.0

tests:
  - python:
      imports:
        - cons
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pythological/python-cons
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: An implementation of Lisp/Scheme-like cons in Python.
  description: |
    An implementation of Lisp/Scheme-like cons in Python.

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cons
  cfe-upstream-registry: pypi
  cfe-upstream-name: cons
  cfe-purls:
    - pkg:conda/cons@${{ version }}?channel=conda-forge
    - pkg:pypi/cons@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/pythological/python-cons
  cfe-import-names: [cons]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cons-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.4.7

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T07:15:43Z
