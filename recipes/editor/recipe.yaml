# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: editor
  version: "1.6.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/editor-${{ version }}.tar.gz
  sha256: bb6989e872638cd119db9a4fce284cd8e13c553886a1c044c6b8d8a160c871f8

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - runs
    - xmod

tests:
  - python:
      imports:
        - editor
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: 🖋 Open the default text editor 🖋
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rec/editor

extra:
  recipe-maintainers:
    - nicornk
