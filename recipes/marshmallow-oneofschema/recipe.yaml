# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: marshmallow-oneofschema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/marshmallow-oneofschema/marshmallow_oneofschema-${{ version }}.tar.gz
  sha256: c06c8d9f14d51ffff152d66d85bd5f27d55cff10752a3b1f8c1f948bf5f597a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - marshmallow <5.0.0,>=3.0.0

tests:
  - python:
      imports:
        - marshmallow_oneofschema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/marshmallow-oneofschema/
  license: MIT
  license_file: LICENSE
  summary: marshmallow multiplexing schema
  description: |
    marshmallow multiplexing schema
  repository: https://github.com/marshmallow-code/marshmallow-oneofschema

extra:
  recipe-maintainers:
    - dhirschfeld
    - rzillman

