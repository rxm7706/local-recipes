# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: marshmallow-oneofschema
  version: "3.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 68b4a57d0281a04ac25d4eb7a4c5865a57090a0a8fd30fd6362c8e833ac6a6d9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - flit-core <4
    - pip
  run:
    - python >=${{ python_min }}
    - marshmallow >=3.0.0,<4.0.0

tests:
  - python:
      imports:
        - marshmallow_oneofschema
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Marshmallow library extension that allows schema (de)multiplexing
  homepage: https://github.com/marshmallow-code/marshmallow-oneofschema

extra:
  recipe-maintainers:
    - dhirschfeld
    - rzillman
