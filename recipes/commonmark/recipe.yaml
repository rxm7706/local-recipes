# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"

package:
  name: commonmark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/commonmark/commonmark-${{ version }}.tar.gz
  sha256: 194d693e0c1ac49e83c26455bdeeb2483235e6280313c58b11d0b71c19f58ed1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cmark = commonmark.cmark:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - commonmark
        - commonmark.render
        - commonmark.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - hypothesis
    script:
      - cmark --help
      - python ${SP_DIR}/commonmark/tests/run_spec_tests.py
      - python -m unittest -v commonmark.tests.rst_tests
      - python -m unittest -vb commonmark.tests.unit_tests
    files:
      source:
        - spec.txt

about:
  summary: Python parser for the CommonMark Markdown spec
  license: BSD-3-Clause
  license_file: LICENSE
  description: |
    CommonMark-py is a pure Python port of jgm's commonmark.js, a Markdown
    parser and renderer for the CommonMark specification, using only native
    modules.
  homepage: http://commonmark.org/
  repository: https://github.com/rtfd/CommonMark-py
  documentation: https://commonmark-py.readthedocs.io

extra:
  recipe-maintainers:
    - ericmjl
    - dpryan79
    - mgorny
