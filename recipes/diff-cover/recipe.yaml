# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.5.1"

package:
  name: diff-cover
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diff-cover/diff_cover-${{ version }}.tar.gz
  sha256: f1c9417c62111e40a81c482c692c5cdd131ff93317baa993044cb291912ebba3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.7
  run:
    - python >=${{ python_min }}
    - jinja2 >=2.7.1
    - pygments <3.0.0,>=2.19.1
    - chardet >=3.0.0
    - pluggy <2,>=0.13.1

tests:
  - python:
      imports:
        - diff_cover
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Bachmann1234/diff-cover
  license: Apache-2.0
  license_file: LICENSE
  summary: Run coverage and linting reports on diffs
  description: |
    Run coverage and linting reports on diffs
  repository: https://github.com/Bachmann1234/diff-cover

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
