# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pybase64
  version: "1.5.0"
  sha256: 545ab2a433769e3b8e1ce2b4f7b07218bbde202f4954fbfe52948b2522120727

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  # set CIBUILDWHEEL to throw errors if the C extension fails to build
  number: 0
  script:
    env:
      CIBUILDWHEEL: 1
    content: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - pybase64=pybase64.__main__:main

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cmake
    - if: unix
      then: make
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - pybase64
      pip_check: false

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Fast Base64 encoding/decoding in Python
  homepage: https://github.com/mayeut/pybase64/
  repository: https://github.com/mayeut/pybase64/
  documentation: https://github.com/mayeut/pybase64/

extra:
  recipe-maintainers:
    - njzjz
