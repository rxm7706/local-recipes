# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.13.0"

package:
  name: binance-connector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/binance-connector/binance_connector-${{ version }}.tar.gz
  sha256: 841a589b81c5eda874b54143a0d436d02ecdf81dcff1a6e23b6380662099c004

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - websocket-client >=1.6.3
    - pycryptodome >=3.15.0

tests:
  - python:
      imports:
        - binance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/binance/binance-connector-python
  license: MIT
  license_file: LICENSE
  summary: This is a deprecated lightweight library that works as a connector to Binance public API.
  description: |
    This is a deprecated lightweight library that works as a connector to Binance public API.

extra:
  recipe-maintainers:
    - rxm7706

