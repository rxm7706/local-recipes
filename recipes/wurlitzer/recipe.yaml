# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: wurlitzer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wurlitzer/wurlitzer-${{ version }}.tar.gz
  sha256: bfb9144ab9f02487d802b9ff89dbd3fa382d08f73e12db8adc4c2fb00cd39bd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wurlitzer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/minrk/wurlitzer
  license: MIT
  license_file: LICENSE
  summary: Capture C-level output in context managers
  description: |
    Capture C-level output in context managers

extra:
  recipe-maintainers:
    - minrk
    - bjodah
    - asmeurer
    - ccordoba12

#### CFE metadata AND comments
