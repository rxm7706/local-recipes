# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.4"

package:
  name: ipyevents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipyevents/ipyevents-${{ version }}.tar.gz
  sha256: bd8c66a9ff26f481494cda1ec1d979722ca9eba19f8ef52538c7cc2db2a1a139

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - jupyterlab ==4.*
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6.0

tests:
  - python:
      imports:
        - ipyevents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwcraig/ipyevents
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A custom widget for returning mouse and keyboard events to Python
  description: |
    A custom widget for returning mouse and keyboard events to Python

extra:
  recipe-maintainers:
    - mwcraig
    - astrofrog

#### CFE metadata AND comments
