# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ipyevents
  version: "2.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bd8c66a9ff26f481494cda1ec1d979722ca9eba19f8ef52538c7cc2db2a1a139
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - jupyterlab ==4
    - hatchling
    - hatch-jupyter-builder >=0.8.3
    - nodejs
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6

tests:
  - python:
      imports:
        - ipyevents
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - jupyter
        - notebook
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: A custom widget for returning mouse and keyboard events to Python
  description: A custom widget for returning mouse and keyboard events to Python
  homepage: https://github.com/mwcraig/ipyevents
  repository: https://github/com/mwcraig/ipyevents

extra:
  recipe-maintainers:
    - mwcraig
    - astrofrog
