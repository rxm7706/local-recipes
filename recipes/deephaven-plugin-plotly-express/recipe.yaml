# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: deephaven-plugin-plotly-express
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-plugin-plotly-express/deephaven_plugin_plotly_express-${{ version }}.tar.gz
  sha256: f7881e60d0c58fb820139231bc686481c779ad7449586edf4e2c97e5b1c05752

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
    - deephaven-plugin-packaging
  run:
    - python >=${{ python_min }}
    - deephaven-core >=42.2
    - deephaven-plugin >=0.6.0
    - plotly <7.0.0,>=6.0.0
    - deephaven-plugin-utilities >=0.0.2
    - typing_extensions
    - jpy

tests:
  - python:
      imports:
        - deephaven.plot.express
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugins
  license: Apache-2.0
  license_file: LICENSE
  summary: Deephaven Chart Plugin
  description: |
    Deephaven Chart Plugin
  repository: https://github.com/deephaven/deephaven-plugins

extra:
  recipe-maintainers:
    - rxm7706

