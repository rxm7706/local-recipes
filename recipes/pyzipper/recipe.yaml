# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: pyzipper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyzipper/pyzipper-${{ version }}.tar.gz
  sha256: a4b96afcac04c5589d5abdc6158dd362166374e3cc6810aa441e65f8a17cb9e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - pycryptodomex

tests:
  - python:
      imports:
        - pyzipper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/danifus/pyzipper
  license: MIT
  license_file: LICENSE
  summary: AES encryption for zipfile.
  description: |
    AES encryption for zipfile.

extra:
  recipe-maintainers:
    - cml37

#### CFE metadata AND comments
