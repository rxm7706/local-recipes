# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: arrow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arrow/arrow-${{ version }}.tar.gz
  sha256: ed0cc050e98001b8779e84d461b0098c4ac597e88704a655582b21d116e526d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.7.0
    - backports.zoneinfo ==0.2.1
    - python-tzdata

tests:
  - python:
      imports:
        - arrow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arrow/
  license: Apache-2.0
  license_file: LICENSE
  summary: Better dates & times for Python
  description: |
    Better dates & times for Python
  repository: https://github.com/arrow-py/arrow
  documentation: https://arrow.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
    - ocefpaf

#### CFE metadata AND comments
