# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: python3-rpm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-rpm/python3_rpm-${{ version }}.tar.gz
  sha256: 08f8dce7580f4aa241a258c1340947fe9a3c321b127f5516b0c48c694ab9eb3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fire
    - python3-log
    - python3-ssh >=0.1.2
    - python3-chatgpt

tests:
  - python:
      imports:
        - rpm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitee.com/devops_dev/rpm
  license: MIT
  license_file: LICENSE
  summary: used to analyse rpm info
  description: |
    used to analyse rpm info
  documentation: https://gitee.com/devops_dev/rpm/README.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python3-rpm
  cfe-upstream-registry: pypi
  cfe-upstream-name: python3-rpm
  cfe-purls:
