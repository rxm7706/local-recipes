    - pkg:pypi/python3-rpm@${{ version }}
  cfe-upstream-repo: https://gitee.com/devops_dev/rpm
  cfe-upstream-homepage: https://gitee.com/devops_dev/rpm
  cfe-import-names: [rpm]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
