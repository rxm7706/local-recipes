# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4.post6"

package:
  name: cygrpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cygrpc/cygrpc-${{ version }}.tar.gz
  sha256: e6f151e2a433337a8a571b0ec165a8dc4e1de3d1c0587a5ee565d26b60d058c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paste
    - bottle
    - bottle-cors
    - grpcio-tools
    - grpcio
    - twine
    - wheel

tests:
  - python:
      imports:
        - cygrpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cuemby/python-cygrpc
  license: MIT
  license_file: LICENSE
  summary: gRPC Micro framework
  description: |
    gRPC Micro framework

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
