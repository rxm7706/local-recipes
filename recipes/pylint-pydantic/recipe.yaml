# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: pylint-pydantic
  version: ${{ version }}

source:
  url: https://github.com/fcfangcc/pylint-pydantic/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fed38d594e5ad09c0683fd2403aff3ebe9a80ae558f246242c9a0113f30dc686

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pylint <5.0,>2.0
    - pydantic <3.0
    - pylint-plugin-utils

tests:
  - python:
      imports:
        - pylint_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fcfangcc/pylint-pydantic
  license: GPLv3
  license_file: LICENSE
  summary: A Pylint plugin to help Pylint understand the Pydantic
  description: |
    A Pylint plugin to help Pylint understand the Pydantic

extra:
  recipe-maintainers:
    - pb01ka

