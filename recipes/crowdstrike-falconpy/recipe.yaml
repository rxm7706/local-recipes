# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.4"

package:
  name: crowdstrike-falconpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/crowdstrike-falconpy/crowdstrike_falconpy-${{ version }}.tar.gz
  sha256: 1f347842ab59355dc103f1f4d67374083ffd44b8d6623d6e523a8fa591c21739

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3

tests:
  - python:
      imports:
        - falconpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CrowdStrike/falconpy
  license: Unlicense
  license_file: LICENSE
  summary: The CrowdStrike Falcon SDK for Python
  description: |
    The CrowdStrike Falcon SDK for Python
  repository: https://github.com/CrowdStrike/falconpy/tree/main/src/falconpy
  documentation: https://www.falconpy.io

extra:
  recipe-maintainers:
    - rxm7706

