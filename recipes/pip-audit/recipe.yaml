# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.1"

package:
  name: pip-audit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-audit/pip_audit-${{ version }}.tar.gz
  sha256: 1eb4565d19ebe5d48996f4b770b4d2b32887e12cb12cfa637f1a064011b55ffc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - cachecontrol >=0.13.0
    - cyclonedx-python-lib <12,>=5
    - packaging >=23.0.0
    - pip-api >=0.0.28
    - pip-requirements-parser >=32.0.0
    - requests >=2.31.0
    - rich >=12.4
    - tomli >=2.2.1
    - tomli-w >=1.2.0
    - platformdirs >=4.2.0

tests:
  - python:
      imports:
        - pip_audit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pip-audit/
  license: Apache-2.0
  license_file: LICENSE
  summary: A tool for scanning Python environments for known vulnerabilities
  description: |
    A tool for scanning Python environments for known vulnerabilities
  repository: https://github.com/pypa/pip-audit

extra:
  recipe-maintainers:
    - rxm7706
    - sugatoray

