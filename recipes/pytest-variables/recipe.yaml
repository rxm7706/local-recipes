# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-variables
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4719b07f0f6e5d07829b19284a99d9159543a2e0336311f7bc4ee3b1617f595d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatch-vcs >=0.3
    - hatchling >=1.13
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - pytest_variables
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: pytest plugin for providing variables to tests/fixtures
  homepage: https://github.com/pytest-dev/pytest-variables

extra:
  recipe-maintainers:
    - birdsarah
    - davehunt
    - nicoddemus
