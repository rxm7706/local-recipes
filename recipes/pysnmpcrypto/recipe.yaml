# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pysnmpcrypto
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pysnmpcrypto-${{ version }}.tar.gz
  sha256: ee6819247ceee09aa2de54b998c51ccf595d75a9ccc2e303383b39a5ac63816c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - cryptography >=43.0.1

tests:
  - python:
      imports:
        - pysnmpcrypto
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Strong cryptography support for PySNMP (SNMP library for Python)
  license: BSD-2-Clause
  license_file: LICENSE.rst
  homepage: https://github.com/etingof/pysnmpcrypto

extra:
  recipe-maintainers:
    - nehaljwani
