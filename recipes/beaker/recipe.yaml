# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.1"

package:
  name: beaker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/Beaker/beaker-${{ version }}.tar.gz
  sha256: 886f52a51810703fdbc0a3e54fca40886288ff530b2070582edce72bf1945447

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - beaker
        - beaker.crypto
        - beaker.ext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://beaker.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Session and Caching library with WSGI Middleware
  description: |
    Beaker is a web session and general caching library that includes WSGI
    middleware for use in web applications.

    As a general caching library, Beaker can handle storing for various times
    any Python object that can be pickled with optional back-ends on a
    fine-grained basis.

    Beaker includes Cache and Session WSGI middleware to ease integration with
    WSGI capable frameworks, and is automatically used by Pylons and
    TurboGears.

  documentation: https://beaker.readthedocs.io/
  repository: https://github.com/bbangert/beaker
extra:
  recipe-maintainers:
    - stuertz

