# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.9.0"

package:
  name: oslo.reports
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.reports/oslo_reports-${{ version }}.tar.gz
  sha256: 66e0563d5cb5afc0facba08f48906493d44a9a0487d14a3b02b12fb60ed95513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - pbr >=2.0.0
    - jinja2 >=2.10
    - oslo.serialization >=2.18.0
    - psutil >=3.2.2
    - oslo.i18n >=3.15.3
    - oslo.utils >=3.33.0
    - oslo.config >=5.1.0

tests:
  - python:
      imports:
        - oslo_reports
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.reports
  license: Apache-2.0
  license_file: LICENSE
  summary: oslo.reports library
  description: |
    oslo.reports library
  repository: https://opendev.org/openstack/oslo.reports

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
