# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.04.13-gpl-pyqt"

package:
  name: camelot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Camelot/Camelot-${{ version }}.tar.gz
  sha256: c4e7f5117febd94351833889fc06c5b44c6d1035c824ec82580347f71b346c4b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - camelot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.python-camelot.com
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A python GUI framework on top of Sqlalchemy and Qt, inspired by the Django admin interface. Start building desktop applications at warp speed, simply by adding some additional information to you model definition.
  description: |
    A python GUI framework on top of Sqlalchemy and Qt, inspired by the Django admin interface. Start building desktop applications at warp speed, simply by adding some additional information to you model definition.

extra:
  recipe-maintainers:
    - rxm7706

