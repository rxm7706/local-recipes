# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pypistats
  version: "1.14.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pypistats-${{ version }}.tar.gz
  sha256: d0ca68a2497e37c7b7416289f262a3b94111e637f83b1cda1d4931c7ab4b426c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pypistats = pypistats.cli:main

requirements:
  host:
    - python ${{ python_min }}
    - hatch-vcs
    - hatchling
    - pip
  run:
    - urllib3 >=2
    - python >=${{ python_min }}
    - httpx >=0.19
    - platformdirs
    - prettytable >=3.12
    - pytablewriter >=0.63
    - python-dateutil
    - python-slugify
    - termcolor >=3.2
    # pytablewriter[html]
    - dominate >=2.1.5,<3
    - pytablewriter >=0.63

tests:
  - python:
      imports:
        - pypistats
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}

about:
  summary: Python interface to PyPI Stats API https://pypistats.org/api
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/hugovk/pypistats
  repository: https://github.com/hugovk/pypistats

extra:
  recipe-maintainers:
    - ocefpaf
