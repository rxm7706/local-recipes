# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-novaclient
  version: "18.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 812272fa36fae042c5c195aaeeaf0e5df2ca77edcb9c9e1fd66943f39d32bc4b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - nova = novaclient.shell:main

requirements:
  host:
    - pbr
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - pbr
    - keystoneauth1 >=3.5.0
    - iso8601 >=0.1.11
    - oslo.i18n >=3.15.3
    - oslo.serialization >2.19.1
    - oslo.utils >=3.33.0
    - prettytable >=0.7.2
    - python >=${{ python_min }}
    - stevedore >=2.0.1

tests:
  - python:
      imports:
        - novaclient
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Client library for OpenStack Compute API
  homepage: https://docs.openstack.org/python-novaclient/latest
  repository: https://opendev.org/openstack/python-novaclient
  documentation: https://docs.openstack.org/python-novaclient/latest

extra:
  recipe-maintainers:
    - tschoonj
