# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: fsutil
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fsutil/fsutil-${{ version }}.tar.gz
  sha256: f62043857b7e4d23a73a280a346a64c34acccdf8f6c4393d6b6d58cd709c41b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fsutil
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fsutil/
  license: MIT
  license_file: LICENSE
  summary: This is a file system utilities package.
  description: |
    This is a file system utilities package.

extra:
  recipe-maintainers:
    - rxm7706

