# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1"

package:
  name: zope.publisher
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.publisher/zope_publisher-${{ version }}.tar.gz
  sha256: 87a354a029afa3f8fcde802e6323ed9e53b6b96b6e17e94323e945a19194d192

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - multipart >=1.1.0
    - zope.browser
    - zope.component
    - zope.configuration
    - zope.contenttype >=4.0.0
    - zope.event
    - zope.exceptions
    - zope.i18n >=4.0.0
    - zope.interface >=4.0.1
    - zope.location
    - zope.proxy
    - zope.security >=4.0.0

tests:
  - python:
      imports:
        - zope.publisher
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/zope.publisher/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: The Zope publisher publishes Python objects on the web.
  description: |
    The Zope publisher publishes Python objects on the web.
  repository: https://github.com/zopefoundation/zope.publisher
  documentation: https://zopepublisher.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
