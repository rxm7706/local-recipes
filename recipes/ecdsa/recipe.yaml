# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.19.2"

package:
  name: ecdsa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/ecdsa/ecdsa-${{ version }}.tar.gz
  sha256: 62635b0ac1ca2e027f82122b5b81cb706edc38cd91c63dda28e4f3455a2bf930

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.9.0

tests:
  - python:
      imports:
        - ecdsa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/tlsfuzzer/python-ecdsa
  license: MIT
  license_file: LICENSE
  summary: ECDSA cryptographic signature library (pure python)
  description: |
    ECDSA cryptographic signature library (pure python)

extra:
  recipe-maintainers:
    - mariusvniekerk
    - m-rossi

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ecdsa
