schema_version: 1

context:
  version: "20241021"

package:
  name: diff-match-patch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diff-match-patch/diff_match_patch-${{ version }}.tar.gz
  sha256: beae57a99fa48084532935ee2968b8661db861862ec82c6f21f4acdd6d835073

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - diff_match_patch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/diff-match-patch/
  license: Apache-2.0
  license_file: LICENSE
  summary: Repackaging of Google's Diff Match and Patch libraries.
  description: |
    Repackaging of Google's Diff Match and Patch libraries.

extra:
  recipe-maintainers:
    - ocefpaf
    - ccordoba12

