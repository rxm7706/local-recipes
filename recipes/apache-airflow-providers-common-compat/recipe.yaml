# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18.0"

package:
  name: apache-airflow-providers-common-compat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-common-compat/apache_airflow_providers_common_compat-${{ version }}.tar.gz
  sha256: 30dbdd9a2bd931469b32c180792630f5e6b84e0e908dfc18da51b4beb7dd521f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - asgiref >=2.3.0

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-common-compat/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-common-compat for Apache Airflow
  description: |
    Provider package apache-airflow-providers-common-compat for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-common-compat/1.18.0

extra:
  recipe-maintainers:
    - xylar

