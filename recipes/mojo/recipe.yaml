# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: mojo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mojo/mojo-1.0.0-py3-none-macosx_13_0_arm64.whl
  sha256: 69413fee96dfd43c4955ace56e4bb0f89401098daf61538a563c82571bc9d984

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mojo-compiler ==1.0.0
    - mblack ==26.5.0
    - mojo-lldb-libs ==1.0.0

tests:
  - python:
      imports:
        - mojo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://modular.com
  license: LicenseRef-MAX-Platform-Software-License
  license_file: LICENSE
  summary: The Mojo programming language
  description: |
    The Mojo programming language
  repository: https://github.com/modular/modular/tree/main/mojo
  documentation: https://mojolang.org/docs/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
