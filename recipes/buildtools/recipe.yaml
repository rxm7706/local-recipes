# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.6"

package:
  name: buildtools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/buildtools/buildtools-${{ version }}.tar.gz
  sha256: d310340ba1fc51d63e54db8b03d48fe16aaa39dd958c8424bd4a2e562049e60e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lib.python.util
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: UNKNOWN
  license_file: LICENSE
  summary: Mozilla RelEng Toolkit
  description: |
    Mozilla RelEng Toolkit

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
