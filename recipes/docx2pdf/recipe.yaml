# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: docx2pdf
  version: "0.1.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/docx2pdf-${{ version }}.tar.gz
  sha256: 6d2c20f9ad36eec75f4da017dc7a97622946954a6124ca0b11772875fa86fbed

build:
  number: 3
  skip: py>=40 or linux
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - docx2pdf = docx2pdf:cli

requirements:
  host:
    - pip
    - python
    - poetry
  run:
    - if: osx
      then: appscript >=1.1.0,<2.0.0
    - if: match(python, "<3.8")
      then: importlib_metadata >=1.3.0,<2.0.0
    - python
    - if: win
      then: pywin32 >=227,<228
    - tqdm >=4.41.0,<5.0.0

tests:
  - python:
      imports:
        - docx2pdf
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - docx2pdf --help

about:
  summary: Convert docx to pdf on Windows or macOS directly using Microsoft Word (must be installed).
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/AlJohri/docx2pdf

extra:
  recipe-maintainers:
    - jaimeambrus
