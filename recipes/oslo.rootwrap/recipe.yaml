# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.10.0"

package:
  name: oslo.rootwrap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.rootwrap/oslo_rootwrap-${{ version }}.tar.gz
  sha256: 99c24f763c3f1f0be96652e416a099b486115d9709dcfa73310f48168cf89a44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - debtcollector >=3.0.0
    - pbr >=6.1.1

tests:
  - python:
      imports:
        - oslo_rootwrap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.rootwrap
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Rootwrap
  description: |
    Oslo Rootwrap
  repository: https://opendev.org/openstack/oslo.rootwrap

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
