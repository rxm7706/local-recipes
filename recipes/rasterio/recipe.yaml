# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: rasterio
  version: ${{ version }}

source:
  url: https://github.com/rasterio/rasterio/archive/${{ version }}.tar.gz
  sha256: eb8e7062fc0bcdef635e43fd1632b15aa983b71476bec1e1f75d618326fb9e4a

build:
  number: 1
  skip: match(python, "<3.12")
  python:
    entry_points:
      - rio = rasterio.rio.main:main_group

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy >=1.24
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - cython
    - numpy >=1.24
    - libgdal-core
    - proj
    - setuptools
  run:
    - python
    - setuptools >=0.9.8
    - libgdal-core
    - affine
    - attrs
    - certifi
    - click >=4,!=8.2.*  # https://github.com/pallets/click/issues/2939
    - cligj >=0.5
    - snuggs >=1.4.1
    - click-plugins
    - proj

tests:
  - python:
      imports:
        - rasterio
      pip_check: true
  - files:
      recipe:
        - test_data/test.tif
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest >=2.8.2,<8
        - pytest-cov >=2.2.0
        - ipython >=2.0
        - aiohttp
        - boto3 >=1.2.4
        - fsspec >=2025.9.0
        - s3fs >=2025.9.0
        - hypothesis
        - libgdal-netcdf
        - matplotlib-base
        - packaging
        - requests
        - shapely
    script:
      - rio --help
      - if: not win
        then: rio info ${{ RECIPE_DIR }}/test_data/test.tif
      - if: win
        then: rio info ${{ RECIPE_DIR }}\\test_data\\test.tif
      - if: linux and build_platform == target_platform
        then: $PYTHON -m pytest -v -m "not wheel" -rxXs -k "not (${{ tests_to_skip }})" tests
      - if: osx
        then: $PYTHON -m pytest -v -m "not wheel" -rxXs -k "not (${{ tests_to_skip }})" tests
      - if: win
        then: python -m pytest -v -m "not wheel" -rxXs -k "not (test_search_gdal_data_debian or test_decimated_no_use_overview or test_copyfiles_same_dataset_another_name or ${{ tests_to_skip }})" tests

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Rasterio reads and writes geospatial raster datasets
  homepage: https://github.com/rasterio/rasterio

extra:
  recipe-maintainers:
    - weiji14
    - ocefpaf
    - ceholden
    - snowman2
    - akrherz
