# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.15"

package:
  name: langchain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain/langchain-${{ version }}.tar.gz
  sha256: ab4b775b9703f7e37babe0b325dbbaef25573bda60ecf79f7850bc875f252795

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core <2.0.0,>=1.5.4
    - langgraph <1.3.0,>=1.2.11
    - pydantic <3.0.0,>=2.7.4

tests:
  - python:
      imports:
        - langchain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Building applications with LLMs through composability
  description: |
    Building applications with LLMs through composability
  repository: https://github.com/langchain-ai/langchain
  documentation: https://reference.langchain.com/python/langchain/langchain/

extra:
  recipe-maintainers:
    - dlqqq
    - baskaryan
    - hinthornw
    - ccurme
    - sydney-runkle
    - YYYasin19
    - pavelzw
    - jan-janssen

