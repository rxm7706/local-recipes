# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.9"

package:
  name: copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/copilot/copilot-${{ version }}.tar.gz
  sha256: 42a33fced2b74e7e48b23bd55185933c4d7807f3c9444eded3b3e656ae14ecd6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aphistic/copilot
  license: MIT
  license_file: LICENSE
  summary: Application to manage files on external USB drives
  description: |
    Application to manage files on external USB drives

extra:
  recipe-maintainers:
    - rxm7706

