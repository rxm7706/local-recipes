# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.11.0"

package:
  name: isoduration
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/isoduration/isoduration-${{ version }}.tar.gz
  sha256: ac2f9015137935279eac671f94f89eb00584f940f5dc49462a0c4ee692ba1bd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - arrow

tests:
  - python:
      imports:
        - isoduration
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bolsote/isoduration
  license: ISC
  license_file: LICENSE
  summary: Operations with ISO 8601 durations
  description: |
    Operations with ISO 8601 durations
  repository: https://github.com/bolsote/isoduration

extra:
  recipe-maintainers:
    - bollwyvl

