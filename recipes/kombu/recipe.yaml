# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.6.2"

package:
  name: kombu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kombu/kombu-${{ version }}.tar.gz
  sha256: 8060497058066c6f5aed7c26d7cd0d3b574990b09de842a8c5aaed0b92cc5a55

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - amqp <6.0.0,>=5.1.1
    - vine ==5.1.0
    - python-tzdata >=2025.2
    - packaging

tests:
  - python:
      imports:
        - t
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://kombu.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Messaging library for Python.
  description: |
    Messaging library for Python.
  repository: https://github.com/celery/kombu

extra:
  recipe-maintainers:
    - chrisburr
    - anguslees
    - kwilcox
    - jamesmyatt

#### CFE metadata AND comments
