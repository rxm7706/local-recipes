# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: nvidia-cusparselt-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cusparselt-cu12/nvidia_cusparselt_cu12-0.8.1-py3-none-manylinux2014_aarch64.whl
  sha256: 5c72f727722f74762380e5f8755557c788b26d8fdcc49df1641c1b08e16d256c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nvidia_cusparselt_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cusparselt
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: NVIDIA cuSPARSELt
  description: |
    NVIDIA cuSPARSELt

extra:
  recipe-maintainers:
    - rxm7706

