# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: pytest-aiohttp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-aiohttp/pytest_aiohttp-${{ version }}.tar.gz
  sha256: 3aa9c9fe26e543eaccc7eb0add381c685ba3ed3e2fed0af74540f63bcd31458d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82.0.1
    - wheel >=0.47.0
    - setuptools-scm >=10.0.5
  run:
    - python >=${{ python_min }}
    - pytest >=6.1.0
    - aiohttp >=3.11.0
    - pytest-asyncio >=0.17.2

tests:
  - python:
      imports:
        - pytest_aiohttp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aio-libs/pytest-aiohttp
  license: Apache-2.0
  license_file: LICENSE
  summary: Pytest plugin for aiohttp support
  description: |
    Pytest plugin for aiohttp support
  repository: https://github.com/aio-libs/pytest-aiohttp

extra:
  recipe-maintainers:
    - klauer
    - asmeurer

