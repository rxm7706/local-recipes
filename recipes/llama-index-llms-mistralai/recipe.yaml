# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.2"

package:
  name: llama-index-llms-mistralai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-mistralai/llama_index_llms_mistralai-${{ version }}.tar.gz
  sha256: 6bcf466aab18d6aa04d7def38d670f8517d4aa0ff393aff27e65fe578007945a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.14.5
    - mistralai >=2.0.0

tests:
  - python:
      imports:
        - llama_index.llms.mistralai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-mistralai/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms mistral ai integration
  description: |
    llama-index llms mistral ai integration

extra:
  recipe-maintainers:
    - rxm7706

