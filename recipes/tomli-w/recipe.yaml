# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: tomli-w
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tomli-w/tomli_w-${{ version }}.tar.gz
  sha256: 2dd14fac5a47c27be9cd4c976af5a12d87fb1f0b4512f81d69cce3b35ae25021

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2.0,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tomli_w
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hukkin/tomli-w
  license: MIT
  license_file: LICENSE
  summary: A lil' TOML writer
  description: |
    A lil' TOML writer

extra:
  recipe-maintainers:
    - ocefpaf

