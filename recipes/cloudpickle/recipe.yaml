# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.2"

package:
  name: cloudpickle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudpickle/cloudpickle-${{ version }}.tar.gz
  sha256: 7fda9eb655c9c230dab534f1983763de5835249750e85fbcef43aaa30a9a2414

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cloudpickle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cloudpipe/cloudpickle
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pickler class to extend the standard pickle.Pickler functionality
  description: |
    Pickler class to extend the standard pickle.Pickler functionality

extra:
  recipe-maintainers:
    - jakirkham
    - ogrisel
    - rgbkrk
    - mrocklin
    - nehaljwani

#### CFE metadata AND comments
