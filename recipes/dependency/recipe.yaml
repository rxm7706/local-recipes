# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: dependency
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dependency/dependency-${{ version }}.tar.gz
  sha256: 41c26885d28a71a07e4605cdfa564b73a49fe9b29a4479207e14c7fda0e39d64

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dependency
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/encode/dependency
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A dependency injection framework for Python.
  description: |
    A dependency injection framework for Python.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dependency
  cfe-upstream-registry: pypi
  cfe-upstream-name: dependency
  cfe-purls:
    - pkg:conda/dependency@${{ version }}?channel=conda-forge
    - pkg:pypi/dependency@${{ version }}
  cfe-upstream-repo: https://github.com/encode/dependency
  cfe-upstream-homepage: https://github.com/encode/dependency
  cfe-import-names: [dependency]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:52:52Z
