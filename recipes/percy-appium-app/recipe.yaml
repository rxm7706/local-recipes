# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.8"

package:
  name: percy-appium-app
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/percy-appium-app/percy_appium_app-${{ version }}.tar.gz
  sha256: 8cac542df49929f1e2022ff123879c1f87cba98985fdd3b9f743a2d7c963ec36

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - appium-python-client
    - requests

tests:
  - python:
      imports:
        - percy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/percy/percy-appium-python
  license: MIT
  license_file: LICENSE
  summary: Python client for visual testing with Percy for mobile apps
  description: |
    Python client for visual testing with Percy for mobile apps

extra:
  recipe-maintainers:
    - rxm7706

