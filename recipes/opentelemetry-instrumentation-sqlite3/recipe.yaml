# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-sqlite3
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_sqlite3-${{ version }}.tar.gz
  sha256: f11fb91d159724037cadf970d5b612da720b38bd67d1c25d48c5ae09116eacc6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-dbapi ==0.65b0
    - opentelemetry-instrumentation ==0.65b0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry SQLite3 instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-sqlite3

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
