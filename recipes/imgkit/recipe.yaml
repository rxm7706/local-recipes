# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: imgkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imgkit/imgkit-${{ version }}.tar.gz
  sha256: c9ade93d0281277c898b983c959f11f0cc1cb4a5fed144560dfa4d273fb50cd8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - six
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - imgkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jarrekk/imgkit
  license: MIT
  license_file: LICENSE
  summary: Wkhtmltopdf python wrapper to convert html to image using the webkit rendering engine and qt
  description: |
    Wkhtmltopdf python wrapper to convert html to image using the webkit rendering engine and qt

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: imgkit
  cfe-upstream-registry: pypi
  cfe-upstream-name: imgkit
  cfe-purls:
