    - pkg:pypi/imgkit@${{ version }}
  cfe-upstream-repo: https://github.com/jarrekk/imgkit
  cfe-upstream-homepage: https://github.com/jarrekk/imgkit
  cfe-import-names: [imgkit]
  cfe-source-kind: pypi-sdist
