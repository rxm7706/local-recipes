# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.28.2"

package:
  name: pymupdf-layout
  version: ${{ version }}

source:
  url: https://github.com/ArtifexSoftware/pymupdf_layout/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7426553cb48d63f1d5086a2aa694fd2ef0b2386bb2d719666aca006aa80c01dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pipcl
  run:
    - python >=${{ python_min }}
    - pymupdf ==1.28.2
    - pyyaml
    - numpy
    - onnxruntime
    - networkx

tests:
  - python:
      imports:
        - source.layout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymupdf-layout/
  license: AGPL-3.0
  license_file: LICENSE
  summary: PyMuPDF Layout turns PDFs into structured data 10× faster than vision-based tools using AI trained on PDF internals, not images. CPU-only. No GPU required.
  description: |
    PyMuPDF Layout turns PDFs into structured data 10× faster than vision-based tools using AI trained on PDF internals, not images. CPU-only. No GPU required.
  repository: https://github.com/ArtifexSoftware/pymupdf_layout
  documentation: https://pymupdf.readthedocs.io/en/latest/pymupdf-layout/

extra:
  recipe-maintainers:
    - rxm7706

