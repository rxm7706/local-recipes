# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"
  python_min: "3.11"

package:
  name: stagehand
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stagehand/stagehand-${{ version }}.tar.gz
  sha256: 5b50306fd3b198c27826ad158ff3d4e8b59df8b19ddb8cf65900580a6aded92a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.29,<0.12.0
  run:
    - python >=${{ python_min }}
    - browserbase <2,>=1.15
    - opentelemetry-api <2,>=1.35
    - pydantic <3,>=2.12
    - websockets >=16.1.1

tests:
  - python:
      imports:
        - stagehand
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://stagehand.dev
  license: MIT
  license_file: LICENSE
  summary: Browserbase's SDK for building browser agents
  description: |
    Browserbase's SDK for building browser agents
  repository: https://github.com/browserbase/stagehand
  documentation: https://docs.stagehand.dev

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: stagehand
  cfe-upstream-registry: pypi
  cfe-upstream-name: stagehand
  cfe-purls:
    - pkg:conda/stagehand@${{ version }}?channel=conda-forge
    - pkg:pypi/stagehand@${{ version }}
  cfe-upstream-repo: https://github.com/browserbase/stagehand
  cfe-upstream-homepage: https://stagehand.dev
  cfe-import-names: [stagehand]
  cfe-source-kind: pypi-sdist
