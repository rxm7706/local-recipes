# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fbprophet
  version: "0.7.1"
  bundle: tar.gz
  hash: 3ac63a05caf5117d9c6ed83fa6f9d4ffc207b60a56854c905f2789d8a89c2b6f
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: ${{ build }}
  skip: match(python, ">=2,<3")
  script: ${{ PYTHON }} -m pip install . -vv
  binary_has_prefix_files:
    - if: win
      then: Lib/site-packages/fbprophet/stan_model/prophet_model.pkl
    - if: unix
      then: lib/python*/site-packages/fbprophet/stan_model/prophet_model.pkl

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - cython >=0.22
    - pandas >=1.0.4
    - pystan >=2.14
    - LunarCalendar >=0.0.9
    - convertdate >=2.1.2
    - holidays >=0.10.2
    - python-dateutil >=2.8.0
    - tqdm >=4.36.1
    - numpy >=1.15.4
  run:
    - if: win
      then: m2w64-toolchain
    - if: not win
      then: ${{ compiler('c') }}
    - if: not win
      then: ${{ compiler('cxx') }}
    - python
    - matplotlib-base >=2.0.0
    - pandas >=1.0.4
    - pystan >=2.14
    - LunarCalendar >=0.0.9
    - convertdate >=2.1.2
    - holidays >=0.10.2
    - python-dateutil >=2.8.0
    - tqdm >=4.36.1
    - numpy >=1.15.4
    # setuptools is required for pkg_resources
    - setuptools

tests:
  - requirements:
      run:
        - pytest
    script:
      - py.test -v --pyargs fbprophet

about:
  license: MIT
  license_file: LICENSE
  summary: Automatic Forecasting Procedure
  description: |
    Implements a procedure for forecasting time series data based on an
    additive model where non-linear trends are fit with yearly, weekly, and
    daily seasonality, plus holiday effects. It works best with time series
    that have strong seasonal effects and several seasons of historical data.
    Prophet is robust to missing data and shifts in the trend, and typically
    handles outliers well.
  homepage: https://facebook.github.io/prophet/
  repository: https://github.com/facebook/prophet
  documentation: https://facebook.github.io/prophet/docs/quick_start.html

extra:
  recipe-maintainers:
    - pmlandwehr
    - rmax
    - bletham
