# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2"

package:
  name: testresources
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/testresources/testresources-${{ version }}.tar.gz
  sha256: a2b1266fd6cb89295dbb79e3442e5ff1c27db35a0b62b84c7846002676d12ae2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - testresources
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/testing-cabal/testresources
  license: Apache-2.0
  license_file: LICENSE
  summary: Testresources, a pyunit extension for managing expensive test resources
  description: |
    Testresources, a pyunit extension for managing expensive test resources
  repository: https://github.com/testing-cabal/testresources

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
