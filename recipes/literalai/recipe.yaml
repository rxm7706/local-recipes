# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.300"

package:
  name: literalai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/literalai/literalai-${{ version }}.tar.gz
  sha256: f408ebfd0f3251effe55fb84b3bf480c4790a7010d6f30a181b56cd1c3942cfb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - traceloop

tests:
  - python:
      imports:
        - literalai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/literalai/
  license: Apache-2.0
  license_file: LICENSE
  summary: An SDK for observability in Python applications
  description: |
    An SDK for observability in Python applications

extra:
  recipe-maintainers:
    - timkpaine

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: literalai
  cfe-upstream-registry: pypi
  cfe-upstream-name: literalai
  cfe-purls:
    - pkg:conda/literalai@${{ version }}?channel=conda-forge
    - pkg:pypi/literalai@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/literalai/
  cfe-import-names: [literalai]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/literalai-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.300

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T10:05:26Z
