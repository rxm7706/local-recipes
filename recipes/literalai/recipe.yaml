# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: literalai
  version: "0.1.300"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/literalai-${{ version }}.tar.gz
  sha256: f408ebfd0f3251effe55fb84b3bf480c4790a7010d6f30a181b56cd1c3942cfb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging >=23.0
    - httpx >=0.23.0
    - pydantic >=1,<3
    - chevron >=0.14.0
    - traceloop-sdk >=0.33.12

tests:
  - python:
      imports:
        - literalai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An SDK for observability in Python applications
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.literalai.com
  repository: https://github.com/Chainlit/literalai-python
  documentation: https://docs.getliteral.ai

extra:
  recipe-maintainers:
    - timkpaine
