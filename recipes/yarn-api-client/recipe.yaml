# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yarn-api-client
  version: "1.0.2"
  sha256: e04a3670fdae5c20d53fc10e125db8b000f4cb085844444eecd82b00f5e18c7a

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - requests >=2.7,<3.0
    - requests-kerberos

tests:
  - python:
      imports:
        - yarn_api_client
      pip_check: false
  - script:
      - python -m yarn_api_client --help
      - python -c "from yarn_api_client import ApplicationMaster, HistoryServer, NodeManager, ResourceManager"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python client for Hadoop® YARN API
  homepage: https://python-client-for-hadoop-yarn-api.readthedocs.io/en/latest/
  repository: https://github.com/CODAIT/hadoop-yarn-api-python-client.git
  documentation: https://python-client-for-hadoop-yarn-api.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - dimon222
    - kevin-bates
    - lresende
    - toidi
