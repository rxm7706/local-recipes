# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pqdm
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pqdm-${{ version }}.tar.gz
  sha256: d99d01fe498d327b440ebfe08c14c84e0dc9ecce6172ef9a31f96bb1aaf4e9e3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python ${{ python_min }}
  run:
    - bounded-pool-executor
    - python >=${{ python_min }}
    - tqdm
    - typing-extensions

tests:
  - python:
      imports:
        - pqdm
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: PQDM is a TQDM and concurrent futures wrapper to allow enjoyable paralellization of progress bars.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/niedakh/pqdm

extra:
  recipe-maintainers:
    - rsignell-usgs
    - xhochy
