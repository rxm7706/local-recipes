# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.26.2"

package:
  name: responses
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/responses/responses-${{ version }}.tar.gz
  sha256: 9c9259b46a8349197edebf43cfa68a87e1a2802ef503ff8b2fecbabc0b45afd8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
    - wheel
  run:
    - python >=${{ python_min }}
    - requests <3.0,>=2.30.0
    - urllib3 <3.0,>=1.25.10
    - pyyaml

tests:
  - python:
      imports:
        - responses
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/getsentry/responses
  license: Apache-2.0
  license_file: LICENSE
  summary: A utility library for mocking out the `requests` Python library.
  description: |
    A utility library for mocking out the `requests` Python library.
  repository: https://github.com/getsentry/responses
  documentation: https://github.com/getsentry/responses/blob/master/README.rst

extra:
  recipe-maintainers:
    - thewchan
    - mariusvniekerk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: responses
