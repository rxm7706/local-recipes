# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: drf-optionalfields
  version: "0.9.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/drf-optionalfields-${{ version }}.tar.gz
  sha256: f6a6ccb1120e8527f3f7d1b7ffc71100749a29719bc7c41addfb1b49fc6e4b0a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.11

tests:
  - python:
      imports:
        - drf_optionalfields
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Fine tuning for serialized fields
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sideris/drf-optionalfields

extra:
  recipe-maintainers:
    - rxm7706
