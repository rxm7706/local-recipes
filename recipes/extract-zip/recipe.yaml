# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: extract-zip
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extract-zip/extract_zip-${{ version }}.tar.gz
  sha256: 713c1beae996ffd9ad8c89ca1f51d4ef6da6e2d10b077be0f797effa5aebfdff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - extract_zip
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ayush571995/Extract_zip
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: With this you can extract all zip , tar ,tar.gz files which can further contain zip files just by instantiating the class and passing the argument of the path in the python module
  description: |
    With this you can extract all zip , tar ,tar.gz files which can further contain zip files just by instantiating the class and passing the argument of the path in the python module

extra:
  recipe-maintainers:
    - rxm7706

