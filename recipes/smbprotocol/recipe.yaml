# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.0"

package:
  name: smbprotocol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/smbprotocol/smbprotocol-${{ version }}.tar.gz
  sha256: bcc27edfff7d727a7eb30424138766e1ee216ae2ffc1af03dab0448f29c4731c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - cryptography >=2.0
    - pyspnego

tests:
  - python:
      imports:
        - smbclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jborean93/smbprotocol
  license: MIT
  license_file: LICENSE
  summary: Interact with a server using the SMB 2/3 Protocol
  description: |
    Interact with a server using the SMB 2/3 Protocol

extra:
  recipe-maintainers:
    - krisevans
    - dhirschfeld

#### CFE metadata AND comments
