# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: email-to
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/email-to/email_to-${{ version }}.tar.gz
  sha256: 611b47c23e9be1ed51b124a4e350d565607410f763daa6c727d1914083321c2b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - markdown
    - premailer

tests:
  - python:
      imports:
        - email_to
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/abkfenris/email_to
  license: MIT
  license_file: LICENSE
  summary: Simplyify sending HTML emails
  description: |
    Simplyify sending HTML emails

extra:
  recipe-maintainers:
    - rxm7706

