# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: nb-nebi-kernels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nb-nebi-kernels/nb_nebi_kernels-${{ version }}.tar.gz
  sha256: 10da3801ce6dea72a094b412361ecfa4211fd2ff5865c25035d08446c1437f2d

build:
  number: 0
  noarch: python
  script:
    env:
      HATCH_VCS_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - ipykernel >=6.0.0
    - jupyter_client >=8.0.0
    - jupyter_core >=5.0.0
    - jupyter_server >=2.0.0

tests:
  - python:
      imports:
        - nb_nebi_kernels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - nb_nebi_kernels/manager.py
      files:
        - etc/jupyter/jupyter_server_config.d/nb_nebi_kernels.json

about:
  homepage: https://github.com/nebari-dev/nb-nebi-kernels
  repository: https://github.com/nebari-dev/nb-nebi-kernels
  documentation: https://github.com/nebari-dev/nb-nebi-kernels#readme
  summary: Jupyter KernelSpecManager that discovers kernels from nebi-tracked pixi workspaces
  description: |
    nb-nebi-kernels is a Jupyter `KernelSpecManager` that discovers Python
    kernels from pixi workspaces tracked by nebi, so a Jupyter server exposes
    every nebi-managed environment as a selectable kernel without a per-
    workspace `ipykernel install` step.

    Installing the package drops a Jupyter server config fragment at
    `etc/jupyter/jupyter_server_config.d/nb_nebi_kernels.json`, which points
    `ServerApp.kernel_spec_manager_class` at
    `nb_nebi_kernels.NebiKernelSpecManager`; the manager is active as soon as
    the server restarts.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

