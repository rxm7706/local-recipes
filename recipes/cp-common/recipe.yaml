# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.9.1"

package:
  name: cp-common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cp-common/cp-common-${{ version }}.tar.gz
  sha256: 940d1d9d5bea52ab377a82f48dd7efa2714f1c946e9ca1a6060209c0d44c75a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - requests
    - loguru
    - rich

tests:
  - python:
      imports:
        - cp_common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cp-common/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

