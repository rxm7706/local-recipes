# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.17.1"

package:
  name: nbconvert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nbconvert/nbconvert-${{ version }}.tar.gz
  sha256: 34d0d0a7e73ce3cbab6c5aae8f4f468797280b01fd8bd2ca746da8569eddd7d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - bleach !=5.0.0
    - defusedxml
    - importlib-metadata >=3.6
    - jinja2 >=3.0
    - jupyter-core >=4.7
    - jupyterlab_pygments
    - markupsafe >=2.0
    - mistune <4,>=2.0.3
    - nbclient >=0.5.0
    - nbformat >=5.7
    - packaging
    - pandocfilters >=1.4.1
    - pygments >=2.4.1
    - traitlets >=5.1

tests:
  - python:
      imports:
        - nbconvert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Convert Jupyter Notebooks (.ipynb files) to other formats.
  description: |
    Convert Jupyter Notebooks (.ipynb files) to other formats.

extra:
  recipe-maintainers:
    - jakirkham
    - mpacer
    - minrk
    - pelson
    - takluyver
    - mseal
    - blink1073
    - ocefpaf
    - jasongrout
    - bollwyvl
    - martinRenou

