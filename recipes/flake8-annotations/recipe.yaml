# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: flake8-annotations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flake8-annotations/flake8_annotations-${{ version }}.tar.gz
  sha256: 71b52ec85a4ec82a10edfad497fe2b390609c95b2ad7d61cc94704bc88a498a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - flake8 >=5.0

tests:
  - python:
      imports:
        - flake8_annotations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sco1/
  license: MIT
  license_file: LICENSE
  summary: Flake8 Type Annotation Checks
  description: |
    Flake8 Type Annotation Checks
  repository: https://github.com/sco1/flake8-annotations
  documentation: https://github.com/sco1/flake8-annotations/blob/main/README.md

extra:
  recipe-maintainers:
    - apmorton
    - muyajil

