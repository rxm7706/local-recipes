# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: flask-wtf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-WTF/flask_wtf-${{ version }}.tar.gz
  sha256: 61d5dabc50c3df885c297dcbd80810443a5d632106c8a69cab8ce740f0cdd7cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - flask
    - itsdangerous
    - wtforms

tests:
  - python:
      imports:
        - flask_wtf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-WTF/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Form rendering, validation, and CSRF protection for Flask with WTForms.
  description: |
    Form rendering, validation, and CSRF protection for Flask with WTForms.
  repository: https://github.com/pallets-eco/flask-wtf/
  documentation: https://flask-wtf.readthedocs.io/

extra:
  recipe-maintainers:
    - pmlandwehr
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-wtf
  cfe-upstream-registry: pypi
