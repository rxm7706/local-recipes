    - pkg:pypi/flask-wtf@${{ version }}
  cfe-upstream-repo: https://github.com/pallets-eco/flask-wtf/
  cfe-upstream-homepage: https://pypi.org/project/Flask-WTF/
  cfe-import-names: [flask_wtf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-wtf-feedstock
