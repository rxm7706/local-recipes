# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: Flask-WTF
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flask_wtf-${{ version }}.tar.gz
  sha256: 61d5dabc50c3df885c297dcbd80810443a5d632106c8a69cab8ce740f0cdd7cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - flask
    - wtforms
    - itsdangerous

tests:
  - python:
      imports:
        - flask_wtf
        - flask_wtf.recaptcha
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Simple integration of Flask and WTForms
  homepage: https://github.com/wtforms/flask-wtf
  repository: https://github.com/wtforms/flask-wtf
  documentation: https://pythonhosted.org/Flask-WTF/

extra:
  recipe-maintainers:
    - pmlandwehr
    - xylar
