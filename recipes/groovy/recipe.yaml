# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: groovy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/groovy/groovy-${{ version }}.tar.gz
  sha256: 25c1dc09b3f9d7e292458aa762c6beb96ea037071bf5e917fc81fb78d2231083

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - groovy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gradio-app/groovy
  license: MIT
  license_file: LICENSE
  summary: A small Python library created to help developers protect their applications from Server Side Request Forgery (SSRF) attacks.
  description: |
    A small Python library created to help developers protect their applications from Server Side Request Forgery (SSRF) attacks.

extra:
  recipe-maintainers:
    - danielnachun

