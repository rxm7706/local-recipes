# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.70"

package:
  name: construct
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/construct/construct-${{ version }}.tar.gz
  sha256: 4d2472f9684731e58cc9c56c463be63baa1447d674e0d66aeb5627b22f512c29

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - construct
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://construct.readthedocs.org
  license: MIT
  license_file: LICENSE
  summary: A powerful declarative symmetric parser/builder for binary data
  description: |
    A powerful declarative symmetric parser/builder for binary data
  repository: https://github.com/construct/construct
  documentation: https://construct.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - DominicAntonacci
    - kevinheavey

#### CFE metadata AND comments
