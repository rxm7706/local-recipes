# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.16"

package:
  name: fastapi-pagination
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-pagination/fastapi_pagination-${{ version }}.tar.gz
  sha256: 739a4e904729dc01e03ce95e260ed9be050d48a3659be8463e5c4fcdd0cf25b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastapi >=0.93.0
    - pydantic >=1.9.1
    - typing_extensions >=4.8.0

tests:
  - python:
      imports:
        - fastapi_pagination
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastapi-pagination/
  license: MIT
  license_file: LICENSE
  summary: FastAPI pagination
  description: |
    FastAPI pagination
  repository: https://github.com/uriyyo/fastapi-pagination

extra:
  recipe-maintainers:
    - sumanth-manchala

