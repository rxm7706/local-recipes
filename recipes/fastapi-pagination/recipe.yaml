# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastapi-pagination
  version: "0.15.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastapi_pagination-${{ version }}.tar.gz
  sha256: 739a4e904729dc01e03ce95e260ed9be050d48a3659be8463e5c4fcdd0cf25b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pydantic >=1.9.1
    - fastapi >=0.93.0
  run_constraints:
    - SQLAlchemy >=1.3.20
    - databases >=0.6.0
    - orm >=0.3.1
    - tortoise-orm >=0.22.0
    - asyncpg >=0.24.0
    - odmantic >=1.0.2
    - django <6.0.0
    - piccolo >=0.89
    - motor >=3.6.0
    - mongoengine >=0.23.1
    - sqlmodel >=0.0.22
    - pony >=0.7.16
    - beanie >=1.25.0
    - sqlakeyset >=2.0.1680321678
    - scylla-driver >=3.25.6
    - bunnet >=1.1.0
    - elasticsearch-dsl >=8.13.0
    - google-cloud-firestore >=2.19.0

tests:
  - python:
      imports:
        - fastapi_pagination
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: FastAPI pagination
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/uriyyo/fastapi-pagination

extra:
  recipe-maintainers:
    - sumanth-manchala
