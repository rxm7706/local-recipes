# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bytecode
  version: "0.18.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d9564f1565fe1ae6a1173e544ef43a85f093e83997ef45af65d0d250eb48d7a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
    - wheel
    - setuptools_scm >=3.4.3
    # From setuptools_scm[toml]
    - tomli >=1
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - bytecode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: COPYING
  summary: A Python module to generate and modify Python bytecode.
  homepage: https://github.com/vstinner/bytecode
  repository: https://github.com/vstinner/bytecode
  documentation: https://bytecode.readthedocs.io/

extra:
  recipe-maintainers:
    - MatthieuDartiailh
    - gabrielcnr
    - marcelotrevisani
    - thewchan
