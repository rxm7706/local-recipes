# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: pybreaker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pybreaker/pybreaker-${{ version }}.tar.gz
  sha256: 8df2d245c73ba40c8242c56ffb4f12138fbadc23e296224740c2028ea9dc1178

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.9
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pybreaker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pybreaker/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python implementation of the Circuit Breaker pattern
  description: |
    Python implementation of the Circuit Breaker pattern
  repository: http://github.com/danielfm/pybreaker

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
