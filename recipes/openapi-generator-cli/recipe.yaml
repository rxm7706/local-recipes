# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.24.0"

package:
  name: openapi-generator-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openapi-generator-cli/openapi_generator_cli-${{ version }}.tar.gz
  sha256: 89493ecf8d8f736b9d137991a8c8d81282fb2fd84cceff1d0975ee477db24bb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - openapi_generator_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://openapi-generator.tech
  license: Apache-2.0
  license_file: LICENSE
  summary: CLI for openapi generator
  description: |
    CLI for openapi generator
  repository: https://github.com/OpenAPITools/openapi-generator
  documentation: https://github.com/OpenAPITools/openapi-generator#3---usage

extra:
  recipe-maintainers:
    - rxm7706

