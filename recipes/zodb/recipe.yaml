# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3"

package:
  name: zodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/ZODB/zodb-${{ version }}.tar.gz
  sha256: 2da749cf21c709058b2957bb1bc3d3a5d6e86b456246cb48acb5197173367c9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
    - wheel
  run:
    - python >=${{ python_min }}
    - persistent >=4.4.0
    - btrees >=4.2.0
    - zconfig
    - transaction >=2.4
    - zc.lockfile
    - zope.interface
    - zodbpickle >=1.0.1

tests:
  - python:
      imports:
        - ZODB
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ZODB/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: ZODB, a Python object-oriented database
  description: |
    ZODB, a Python object-oriented database
  repository: https://github.com/zopefoundation/ZODB
  documentation: http://zodb-docs.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zodb
  cfe-upstream-registry: pypi
  cfe-upstream-name: zodb
  cfe-purls:
    - pkg:conda/zodb@${{ version }}?channel=conda-forge
    - pkg:pypi/zodb@${{ version }}
  cfe-upstream-repo: https://github.com/zopefoundation/ZODB
  cfe-upstream-homepage: https://pypi.org/project/ZODB/
  cfe-import-names: [ZODB]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/zodb-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T07:31:32Z
