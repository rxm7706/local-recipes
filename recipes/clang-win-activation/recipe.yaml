# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# separate builds number for headers & winsdk; reset when version increases (resp. all relevant versions)
schema_version: 1

context:
  CLANG_VERSION: "21.1"
  CL_VERSION: "19.29"
  VCVER:
  clang_major: ${{ CLANG_VERSION.split(".")[0] | int }}
  cl_minor: ${{ CL_VERSION.split(".")[1] }}
  vc_major: ${{ VCVER.split(".")[0] }}
  build_number: 24
  headers_build_number: 5
  winsdk_build_number: 0

recipe:
  name: clang-win-activation
  version: ${{ CLANG_VERSION }}

source:
  # not the main source, but a very useful download utility to determine
  # necessary download urls of windows artefacts, see install-pkg.sh
  - url: https://raw.githubusercontent.com/mstorsjo/msvc-wine/635a3aa148a42f701b3e46dd13791a01a3cf87f6/vsdownload.py
    sha256: d33edb859d7b17ec1350f2b8c5dca8b7aa39375a4d206e2e8eef3fb95848c0b2
    patches:
      - patches/0001-show-payload-url.patch

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: winsdk
      version: ${{ WINSDK_VERSION if unix else "" }}
    build:
      skip: win
      script:
        file: install-pkg.sh
    requirements:
      build:
        - sed
      host:
      run:
        - curl *
        - msitools
        - p7zip
    tests:
      - script:
          - echo "no content except activation scripts"
    about:
      license: LicenseRef-MICROSOFT_SDK
      license_file: LICENSE_SDK.txt
      summary: Scripts to download Windows SDK headers
    number: ${{ winsdk_build_number }}
  - package:
      name: msvc-headers-libs
      version: ${{ MSVC_HEADERS_VERSION if unix else "" }}
    build:
      skip: win
      script:
        file: install-pkg.sh
    requirements:
      build:
        - python *
        - six
        - grep
        - ripgrep
        - sed
      host:
      run:
        - unzip
        - curl *
      ignore_run_exports:
        by_name:
          - python_abi
    tests:
      - script:
          - echo "no content except activation scripts"
    about:
      license: LicenseRef-MSVC_HEADERS
      license_file: LICENSE_MSVC_HEADERS.txt
      summary: Scripts to download MSVC headers and libraries
    number: ${{ headers_build_number }}
  - package:
      name: clang_win-64
    build:
      script:
        file: ${{ 'install-pkg.sh' if not win else 'install-pkg.bat' if win else '' }}
    requirements:
      build:
        - if: win
          then: m2-sed
        - if: unix
          then: sed
      host:
        # Needed to create the symlinks
        - clang       21.1.*
        - llvm-tools  21.1.*
      run:
        - if: not win
          then: ${{ pin_subpackage("msvc-headers-libs", upper_bound="x.x.x") }}
        - if: not win
          then: ${{ pin_subpackage("winsdk", upper_bound="x.x.x") }}
        - if: win
          then: vs${{ VSYEAR if win else "" }}_win-64 ==${{ CL_VERSION }}
        - if: win
          then: vswhere
        - clang               21.1.*
        - llvm-tools          21.1.*
        - lld                 21.1.*
        - compiler-rt         21.1.*
        - compiler-rt_win-64  21.1.*
        - if: osx
          then: clang_impl_${{ target_platform }}
        - if: linux
          then: gcc_impl_${{ target_platform }}
      run_exports:
        - strong:
            - vc >=${{ VCVER }}
            - vc${{ vc_major }}_runtime >=${{ RUNTIME_VERSION }}
            - ucrt >=10.0.20348.0
    tests:
      - files:
          recipe:
            - cmake_test_c/
            - test.c
            - if: not win
              then: run_test_clang.sh
            - if: win
              then: run_test_clang.bat
        requirements:
          run:
            - cmake
            - ninja
        script:
          - if: win
            then: run_test_clang.bat
          - if: not win
            then: bash run_test_clang.sh
  - package:
      name: clangxx_win-64
    build:
      script:
        file: ${{ 'install-pkg.sh' if not win else 'install-pkg.bat' if win else '' }}
    requirements:
      build:
        - if: win
          then: m2-sed
        - if: unix
          then: sed
      host:
        # Needed to create the symlinks
        - clangxx     21.1.*
        - llvm-tools  21.1.*
      run:
        - ${{ pin_subpackage("clang_win-64", exact=True) }}
        - clangxx     21.1.*
        - if: osx
          then: clangxx_impl_${{ target_platform }}
        - if: linux
          then: gxx_impl_${{ target_platform }}
      run_exports:
        - strong:
            - vc >=${{ VCVER }}
            - vc${{ vc_major }}_runtime >=${{ RUNTIME_VERSION }}
            - ucrt >=10.0.20348.0
    tests:
      - files:
          recipe:
            - cmake_test_cxx/
            - test.cpp
            - if: not win
              then: run_test_clangxx.sh
            - if: win
              then: run_test_clangxx.bat
        requirements:
          run:
            - cmake
            - ninja
        script:
          - if: win
            then: run_test_clangxx.bat
          - if: not win
            then: bash run_test_clangxx.sh
  # msvc compatibility mode; only makes sense on windows;
  # no distinction between C/C++ because "clangxx-cl" exists nowhere
  - package:
      name: clang-cl_win-64
    build:
      skip: not win
      script:
        file: ${{ 'install-pkg.bat' if win else '' }}
    requirements:
      build:
        - m2-sed
      host:
        # Needed to create the symlinks
        - clang       21.1.*
        - llvm-tools  21.1.*
      run:
        - vs${{ VSYEAR if win else "" }}_win-64 ==${{ CL_VERSION }}
        - vswhere
        - clang               21.1.*
        - llvm-tools          21.1.*
        - lld                 21.1.*
        - compiler-rt         21.1.*
        - compiler-rt_win-64  21.1.*
      run_exports:
        - strong:
            - vc >=${{ VCVER }}
            - vc${{ vc_major }}_runtime >=${{ RUNTIME_VERSION }}
            - ucrt >=10.0.20348.0
      run_constraints:
        - clang_win-64 <0.0a0
    tests:
      - files:
          recipe:
            - cmake_test_c/
            - cmake_test_cxx/
            - test.c
            - test.cpp
            - run_test_clang.bat
            - run_test_clangxx.bat
            - if: clang_major >= 20
              then: sanitycheckf.f
        requirements:
          run:
            - cmake
            - ninja
            - if: clang_major >= 20
              then: flang_win-64
        script:
          - if: clang_major >= 20
            then: flang-new sanitycheckf.f -o sanitycheckf.exe %FFLAGS% %LDFLAGS%"
          - if: clang_major >= 20
            then: sanitycheckf.exe
          - run_test_clang.bat
          - run_test_clangxx.bat

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: clang (cross) compiler for windows with MSVC ABI compatbility
  description: |
    To use this package in a normal conda environment, do the following

    export CONDA_BUILD_WINSDK=/opt

    To use this package in a conda-build environment, add the following

    CONDA_BUILD_WINSDK:
    - "/opt"

    in $HOME/conda_build_config.yaml and use `clang_win-64` as the compiler.

    By setting this variable, you are agreeing to the terms and conditions
    of the Windows SDK and the MSVC headers. If the Windows SDK and MSVC
    headers are not inside CONDA_BUILD_WINSDK, they would be automatically
    downloaded.


  homepage: https://github.com/conda-forge/clang-win-activation-feedstock

extra:
  recipe-maintainers:
    - isuruf
    - xhochy
    - h-vetinari
