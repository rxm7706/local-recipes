# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: case-converter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/case-converter/case_converter-${{ version }}.tar.gz
  sha256: 4e0281ae60d4335e57300bafd61cfb3fa65734587fe9efd32f6cec1a506685c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - caseconverter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chrisdoherty4/python-case-converter
  license: MIT
  license_file: LICENSE
  summary: A string case conversion package.
  description: |
    A string case conversion package.

extra:
  recipe-maintainers:
    - rxm7706

