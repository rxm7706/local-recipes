# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.1"

package:
  name: pytest-factoryboy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-factoryboy/pytest_factoryboy-${{ version }}.tar.gz
  sha256: 2221d48b31b8b8ccaa739c6a162fb50a43a4de6dff6043f249d2807a3462548d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - factory_boy >=2.10.0
    - inflection
    - packaging
    - pytest >=7.0
    - typing_extensions

tests:
  - python:
      imports:
        - pytest_factoryboy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pytest-factoryboy.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Factory Boy support for pytest.
  description: |
    Factory Boy support for pytest.
  repository: https://github.com/pytest-dev/pytest-factoryboy
  documentation: https://pytest-factoryboy.readthedocs.io/

extra:
  recipe-maintainers:
    - cshaley
    - bollwyvl

#### CFE metadata AND comments
