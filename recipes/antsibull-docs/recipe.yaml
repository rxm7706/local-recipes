# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.26.0"

package:
  name: antsibull-docs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-docs/antsibull_docs-${{ version }}.tar.gz
  sha256: 8bb9274f1e69b10c64eaa9f7d893add824a5a6db6aeca472d0e769dc07f8df8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.0.0
    - ansible-pygments
    - antsibull-changelog >=0.24.0
    - antsibull-core <4.0.0,>=3.5.0
    - antsibull-docs-parser <2.0.0,>=1.1.0
    - antsibull-docutils <2.0.0,>=1.3.0
    - antsibull-fileutils <2.0.0,>=1.3.0
    - asyncio-pool
    - docutils
    - jinja2 >=3.0
    - packaging >=20.0
    - pydantic <3.0.0,>=2.12.0
    - pyyaml
    - rstcheck <7.0.0,>=3.0.0
    - semantic_version
    - sphinx

tests:
  - python:
      imports:
        - antsibull_docs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-docs/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Tools for building Ansible documentation
  description: |
    Tools for building Ansible documentation
  documentation: https://docs.ansible.com/projects/antsibull-docs/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
