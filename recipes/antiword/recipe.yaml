# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: antiword
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antiword/antiword-${{ version }}.tar.gz
  sha256: 689606f6f47910f64e7f80ecf30c1377cd95a5fa153af130b3e1684e57880900

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - antiword
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/2e0byo/antiword
  license: MIT
  license_file: LICENSE
  summary: Spew anything out as text to stdout
  description: |
    Spew anything out as text to stdout
  repository: https://github.com/2e0byo/antiword

extra:
  recipe-maintainers:
    - rxm7706

