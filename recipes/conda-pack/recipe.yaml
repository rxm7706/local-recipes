# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2"

package:
  name: conda-pack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-pack/conda_pack-${{ version }}.tar.gz
  sha256: eff02f01879702e8d167810fac5feadeeec2fc7896071238426be79b6f54a33c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - conda_pack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://conda.github.io/conda-pack/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Package conda environments for redistribution
  description: |
    Package conda environments for redistribution
  repository: https://github.com/conda/conda-pack
  documentation: https://conda.github.io/conda-pack/

extra:
  recipe-maintainers:
    - jcrist
    - mcg1969
    - dbast
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: conda-pack
  cfe-upstream-registry: pypi
  cfe-upstream-name: conda-pack
  cfe-purls:
    - pkg:conda/conda-pack@${{ version }}?channel=conda-forge
    - pkg:pypi/conda-pack@${{ version }}
  cfe-upstream-repo: https://github.com/conda/conda-pack
  cfe-upstream-homepage: https://conda.github.io/conda-pack/
  cfe-import-names: [conda_pack]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/conda-pack-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
