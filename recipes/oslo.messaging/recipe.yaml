# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "18.2.0"
  python_min: "3.11"

package:
  name: oslo.messaging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.messaging/oslo_messaging-${{ version }}.tar.gz
  sha256: 645b2dc85512a8a781800fc1de4ec7ebd523c95df20181901a18e39c99308b7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - pbr >=2.0.0
    - futurist >=1.2.0
    - oslo.config >=5.2.0
    - oslo.context >=5.3.0
    - oslo.log >=3.36.0
    - oslo.utils >=3.37.0
    - oslo.serialization >=2.18.0
    - oslo.service >=1.24.0
    - stevedore >=1.20.0
    - debtcollector >=1.2.0
    - cachetools >=2.0.0
    - webob >=1.7.1
    - pyyaml >=3.13
    - amqp >=2.5.2
    - kombu >=5.2.0
    - oslo.middleware >=3.31.0
    - oslo.metrics >=0.2.1

tests:
  - python:
      imports:
        - oslo_messaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.messaging
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Messaging API
  description: |
    Oslo Messaging API
  repository: https://opendev.org/openstack/oslo.messaging

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: oslo.messaging
