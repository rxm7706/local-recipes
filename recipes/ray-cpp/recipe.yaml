# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.57.0"

package:
  name: ray-cpp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/r/ray-cpp/ray_cpp-2.57.0-py3-none-macosx_12_0_arm64.whl
  sha256: 447323dff9d3becc645b1bab981c5947995b7c31cf29522b7c1130046743083e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ray_cpp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ray-project/ray
  license: Apache-2.0
  license_file: LICENSE
  summary: A subpackage of Ray which provides the Ray C++ API.
  description: |
    A subpackage of Ray which provides the Ray C++ API.

extra:
  recipe-maintainers:
    - rxm7706

