# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8"

package:
  name: stream
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stream/stream-${{ version }}.tar.gz
  sha256: d83f09732c2d28645bd885206854b3c42559f10bb778e691061502dd649da552

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stream
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/aht/stream.py
  license: MIT
  license_file: LICENSE
  summary: Lazily-evaluated, parallelizable pipeline.
  description: |
    Lazily-evaluated, parallelizable pipeline.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
