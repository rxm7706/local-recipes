# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.2"

package:
  name: moto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/moto/moto-${{ version }}.tar.gz
  sha256: aac8023a429e125e91c91f8f4730a67b54f518cda587352f7e67252fe3168f75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
  run:
    - python >=${{ python_min }}
    - boto3 >=1.9.201
    - botocore !=1.35.45,!=1.35.46,>=1.20.88
    - cryptography >=35.0.0
    - requests >=2.5
    - xmltodict
    - werkzeug !=2.2.0,!=2.2.1,>=0.5
    - responses !=0.25.5,>=0.15.0

tests:
  - python:
      imports:
        - moto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/getmoto/moto
  license: Apache-2.0
  license_file: LICENSE
  summary: A library that allows you to easily mock out tests based on AWS infrastructure
  description: |
    A library that allows you to easily mock out tests based on AWS infrastructure
  documentation: http://docs.getmoto.org/en/latest/

extra:
  recipe-maintainers:
    - jan-janssen
    - johanneskoester
    - mariusvniekerk
    - hajapy

#### CFE metadata AND comments
