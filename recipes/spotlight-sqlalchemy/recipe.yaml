# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: spotlight-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spotlight-sqlalchemy/spotlight-sqlalchemy-${{ version }}.tar.gz
  sha256: d2ec73502f67909201a095ffc0aba09dc4853ef5d4f1ea33460b285afb684bad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - spotlight

tests:
  - python:
      imports:
        - spotlight_sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdoesburg/spotlight-sqlalchemy
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy plugin for Spotlight.
  description: |
    SQLAlchemy plugin for Spotlight.
  repository: https://github.com/mdoesburg/spotlight-sqlalchemy
  documentation: https://github.com/mdoesburg/spotlight-sqlalchemy

extra:
  recipe-maintainers:
    - rxm7706

