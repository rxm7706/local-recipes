# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.2"

package:
  name: python-hcl2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-hcl2/python_hcl2-${{ version }}.tar.gz
  sha256: ae809c7e6e39e8c3c3555e7b7f389082207929591fcba062c9f76afb1abe972d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2.0
    - wheel
  run:
    - python >=${{ python_min }}
    - lark <2.0,>=1.1.5
    - regex >=2024.4.16

tests:
  - python:
      imports:
        - cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/amplify-education/python-hcl2
  license: MIT
  license_file: LICENSE
  summary: A parser for HCL2
  description: |
    A parser for HCL2

extra:
  recipe-maintainers:
    - RohitK89
    - mariusvniekerk

