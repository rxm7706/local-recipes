# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# an additional runtime dependency of dataclasses is necessary for Python 3.6,
# conda-forge stopped building 3.6 so we impose a 3.7 requirement to prevent
# upgrades of older systems
schema_version: 1

context:
  name: google-cloud-compute
  version: "1.48.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 670efbc2c5718cb86d3e8cb618afae9fb0c1ea8769c792fb960aabe075ba9e79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.17.1,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # use Python 3.13 version constraint to keep package noarch
    - proto-plus >=1.25.0,<2.0.0dev
    - protobuf >=4.25.8,<8.0.0

tests:
  - python:
      imports:
        - google
        - google.api_core
        - google.cloud
        - google.cloud.compute
        - grpc
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python Client for Google Cloud Compute Engine
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-compute
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-compute
  documentation: https://googleapis.dev/python/compute/latest/index.html

extra:
  recipe-maintainers:
    - tpdownes
    - tswast
    - mgorny
