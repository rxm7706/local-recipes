# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.50.0"

package:
  name: google-cloud-compute
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-compute/google_cloud_compute-${{ version }}.tar.gz
  sha256: 42479d9580a7760efe5239be33fb6c71d20873ee6885bcbba57c1635db8bd622

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.24.2
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.compute
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-compute
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Compute API client library
  description: |
    Google Cloud Compute API client library

extra:
  recipe-maintainers:
    - tpdownes
    - tswast
    - mgorny

