# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3.1"

package:
  name: decorator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/decorator/decorator-${{ version }}.tar.gz
  sha256: 4cbcdd55a6efadb9dbea26b858f4fb3264567b52d69ca0d25b721b553f60ea82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - decorator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/decorator/
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Decorators for Humans
  description: |
    Decorators for Humans

extra:
  recipe-maintainers:
    - msarahan
    - pelson
    - ocefpaf
    - scopatz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: decorator
  cfe-upstream-registry: pypi
  cfe-upstream-name: decorator
  cfe-purls:
    - pkg:conda/decorator@${{ version }}?channel=conda-forge
    - pkg:pypi/decorator@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/decorator/
  cfe-import-names: [decorator]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/decorator-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-5.3.1

  cfe-forge-blocker-list:
    - missing-license-file

