# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: pastedeploy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PasteDeploy/PasteDeploy-${{ version }}.tar.gz
  sha256: 9ddbaf152f8095438a9fe81f82c78a6714b92ae8e066bed418b6a7ff6a095a95

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=41
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - paste
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.pylonsproject.org/projects/pastedeploy/en/latest/
  license: MIT
  license_file: LICENSE
  summary: Load, configure, and compose WSGI applications and servers
  description: |
    Load, configure, and compose WSGI applications and servers
  documentation: https://docs.pylonsproject.org/projects/pastedeploy/en/latest/

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pastedeploy
