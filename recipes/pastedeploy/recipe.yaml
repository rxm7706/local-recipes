    - pkg:pypi/pastedeploy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://docs.pylonsproject.org/projects/pastedeploy/en/latest/
  cfe-import-names: [paste]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
