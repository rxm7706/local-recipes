# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.237"
  python_min: "3.11"

package:
  name: xync-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xync-client/xync_client-${{ version }}.tar.gz
  sha256: bdc6bed8ccc7c8b5ef67d022fefbb8f10b87fcba74fbe653510fba9488305dbf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <81
  run:
    - python >=${{ python_min }}
    - asynchuobi
    - blackboxprotobuf
    - bs4
    - bybit-p2p
    - google-api-python-client
    - google-auth-httplib2
    - google-auth-oauthlib
    - requests-toolbelt
    - msgspec
    - python-binance
    - pybit
    - pyotp
    - pypng
    - kurigram
    - payeer-api
    - playwright
    - python-dotenv
    - python-okx
    - pyrogram-client
    - tgcrypto
    - undetected-chromedriver
    - xn-client
    - xync-schema
    - zeep

tests:
  - python:
      imports:
        - xync_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/XyncNet/client
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://gitlab.com/XyncNet/client

extra:
  recipe-maintainers:
    - rxm7706

