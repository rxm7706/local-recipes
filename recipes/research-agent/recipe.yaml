# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: research-agent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/r/research-agent/research_agent-0.0.2-py3-none-any.whl
  sha256: f67ab36efc423a03db09ee8f294a23ef2f12a2619b55231634c65e40a586751b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.17.0

tests:
  - python:
      imports:
        - research_agent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.deepnlp.org/store/ai-agent
  license: MIT
  license_file: LICENSE
  summary: Research Agent AI Agent Directory to Host All Research Agent related AI Agents Services, Community, Reviews and More.
  description: |
    Research Agent AI Agent Directory to Host All Research Agent related AI Agents Services, Community, Reviews and More.

extra:
  recipe-maintainers:
    - rxm7706

