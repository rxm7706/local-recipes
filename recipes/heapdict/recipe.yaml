# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: HeapDict
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/HeapDict-${{ version }}.tar.gz
  sha256: 8495f57b3e03d8e46d5f1b2cc62ca881aca392fd5cc048dc0aa2e1a6d23ecdb6

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - heapdict
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  summary: A Heap MutableMapping
  license_file: LICENSE
  summary: A heap with decrease-key and increase-key operations
  description: |
    heapdict implements the MutableMapping ABC, meaning it works pretty much
    like a regular Python dict. It's designed to be used as a priority queue.
  homepage: http://stutzbachenterprises.com/
  repository: https://github.com/DanielStutzbach/heapdict
  documentation: https://pypi.python.org/pypi/HeapDict

extra:
  recipe-maintainers:
    - mrocklin
    - ocefpaf
