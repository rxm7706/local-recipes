# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.6"

package:
  name: flask-oauthlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-OAuthlib/Flask-OAuthlib-${{ version }}.tar.gz
  sha256: 5bb79c8a8e670c2eb4cb553dfc3283b6c8d1202f674934676dc173cee94fe39c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - oauthlib
    - requests-oauthlib
    - cachelib

tests:
  - python:
      imports:
        - flask_oauthlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lepture/flask-oauthlib
  license: BSD-3-Clause
  license_file: LICENSE
  summary: OAuthlib for Flask
  description: |
    OAuthlib for Flask

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

