# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kthread
  version: "0.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/kthread-${{ version }}.tar.gz
  sha256: 90e194e6a7ff903040c4133d3ea9037c908c4296bf5f582c7fdcf6325a04f9b4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - nose
    - setuptools
    - pip
  run:
    - python >=3.8

tests:
  - python:
      imports:
        - kthread
      pip_check: true

about:
  summary: Killable threads in Python!
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/munshigroup/kthread

extra:
  recipe-maintainers:
    - rxm7706

