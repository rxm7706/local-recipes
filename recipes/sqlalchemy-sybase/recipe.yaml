# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: sqlalchemy-sybase
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-sybase/sqlalchemy-sybase-${{ version }}.tar.gz
  sha256: fb328b9542d24f2b9b8a68da3d3637eb43450c8ab37a4acf397124c93095409e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - odbcinst
    - pyodbc
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_sybase
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gordthompson/sqlalchemy-sybase
  license: MIT
  license_file: LICENSE
  summary: SAP ASE (Sybase) for SQLAlchemy
  description: |
    SAP ASE (Sybase) for SQLAlchemy
  repository: https://github.com/gordthompson/sqlalchemy-sybase
  documentation: https://github.com/gordthompson/sqlalchemy-sybase/wiki

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
