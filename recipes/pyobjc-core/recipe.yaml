# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyobjc-core
  version: "12.2.2"
  sha256: 3906452339cd06a3bb07df103c2511d4cb0f7a22d8771c0b802eba15d9a642b6

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz
  patches:
    - fix_for_conda_build.diff

build:
  number: 0
  skip: not osx or match(python, ">=2,<3") or python_impl == 'pypy' or (arm64 and match(python, "<3.9"))
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    # force ignoring invalid compiler flag (-Wl,-export-dynamic)
    - if: match(python, "==3.7") or match(python, "==3.8")
      then: export CFLAGS="${CFLAGS} -Wno-unused-command-line-argument"
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - libffi
  run:
    - python
    - setuptools
    - libffi

tests:
  - python:
      imports:
        - PyObjCTools
        - objc
      pip_check: false

about:
  license: MIT
  summary: Python<->ObjC Interoperability Module
  license_file: License.txt
  homepage: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pyobjc.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - kastman
    - larsoner
