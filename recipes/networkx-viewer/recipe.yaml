# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: networkx-viewer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/networkx-viewer/networkx_viewer-${{ version }}.tar.gz
  sha256: 8abf908bd39dd76627a03ceb1dca3f7c3e02d078dc10ac8521143b8865ef5ad5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - networkx >=2.2

tests:
  - python:
      imports:
        - networkx_viewer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/jsexauer/networkx_viewer
  license: LICENSE.txt
  license_file: LICENSE
  summary: Interactive viewer for networkx graphs.
  description: |
    Interactive viewer for networkx graphs.

extra:
  recipe-maintainers:
    - rxm7706

