# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: alpaca
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alpaca/alpaca-${{ version }}.tar.gz
  sha256: a02b0b317c8cb098a0c78fd62909f88d971530fbbccbdb4abca2c18413833ba0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - alpacalib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/activesys/alpaca-llama
  license: MIT
  license_file: LICENSE
  summary: UNKNOWN
  description: |
    UNKNOWN

extra:
  recipe-maintainers:
    - rxm7706

