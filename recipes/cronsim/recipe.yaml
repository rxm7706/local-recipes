# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7"

package:
  name: cronsim
  version: ${{ version }}

source:
  url: https://github.com/cuu508/cronsim/archive/refs/tags/${{ version }}.tar.gz
  sha256: 9ae51c8567bfd9375b313d08c9307f7417ab7e7ff935914546a189f4c416c683

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cronsim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cronsim/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Cron expression parser and evaluator
  description: |
    Cron expression parser and evaluator
  repository: https://github.com/cuu508/cronsim.git

extra:
  recipe-maintainers:
    - apmorton

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cronsim
