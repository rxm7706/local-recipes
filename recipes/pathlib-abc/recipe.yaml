# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pathlib-abc
  version: "0.5.2"
  pypi_name: ${{ name | replace("-", "_") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pypi_name[0] }}/${{ pypi_name }}/${{ pypi_name }}-${{ version }}.tar.gz
  sha256: fcd56f147234645e2c59c7ae22808b34c364bb231f685ddd9f96885aed78a94c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathlib_abc
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: PSF-2.0
  license_file: LICENSE
  summary: Base classes for pathlib.Path-ish objects
  homepage: https://github.com/barneygale/pathlib-abc
  repository: https://github.com/barneygale/pathlib-abc

extra:
  recipe-maintainers:
    - kfot
