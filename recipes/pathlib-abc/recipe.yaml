# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: pathlib-abc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathlib-abc/pathlib_abc-${{ version }}.tar.gz
  sha256: fcd56f147234645e2c59c7ae22808b34c364bb231f685ddd9f96885aed78a94c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathlib_abc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/barneygale/pathlib-abc
  license: PSF-2.0
  license_file: LICENSE.txt
  summary: Backport of pathlib ABCs
  description: |
    Backport of pathlib ABCs

extra:
  recipe-maintainers:
    - kfot

#### CFE metadata AND comments
