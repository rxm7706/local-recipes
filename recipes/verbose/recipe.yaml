# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: verbose
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/v/verbose/verbose-1.0.0-py3-none-any.whl
  sha256: 0bd030a04e1a05202502eb3bab6eb58aac58dfabc27447c8117fec3ab382a190

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - verbose
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/verbose/
  license: MPL-2.0
  license_file: LICENSE
  summary: Scalable python logger
  description: |
    Scalable python logger

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
