# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.1.0.0"

package:
  name: vmware-vapi-runtime
  version: ${{ version }}

source:
  url: https://github.com/vmware/vcf-sdk-python/archive/refs/tags/${{ version }}.tar.gz
  sha256: df26c514d1dc85da1d28b4aaa2c5a591b39003e47bde2059d9eb779075be2ead

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyopenssl
    - cryptography
    - setuptools
    - requests <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - vmware_vapi_runtime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/vcf-sdk-python
  license: Apache-2.0
  license_file: LICENSE
  summary: VMware vAPI Runtime
  description: |
    VMware vAPI Runtime

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
