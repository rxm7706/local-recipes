# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: nornir_jinja2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nornir_jinja2/nornir_jinja2-${{ version }}.tar.gz
  sha256: 845fba3764a838735881c0c53dd78fbccb8c1f672214899ceccf53ab98ff08d1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - nornir <4,>=3.0.0a0
    - jinja2 <4,>=2.11.2

tests:
  - python:
      imports:
        - nornir_jinja2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nornir_jinja2/
  license: Apache-2.0
  license_file: LICENSE
  summary: Jinja2 plugins for nornir
  description: |
    Jinja2 plugins for nornir
  repository: https://github.com/nornir-automation/nornir_jinja2

extra:
  recipe-maintainers:
    - rxm7706

