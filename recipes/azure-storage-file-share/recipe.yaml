# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-storage-file-share
  version: "12.27.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-storage-file-share/azure_storage_file_share-${{ version }}.tar.gz
  sha256: 81a433e27a535f62c8542c24783cd100b3780b00724475cfa9df5fa0fb96647a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.30.0
    - cryptography >=2.1.4
    - typing_extensions >=4.6.0
    - isodate >=0.6.1

tests:
  - python:
      imports:
        - azure.storage.fileshare
        - azure.storage.fileshare._generated
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Azure Azure File Share Storage Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/storage/azure-storage-file-share

extra:
  recipe-maintainers:
    - davidbrochart
    - rxm7706

