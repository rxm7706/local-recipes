# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "5.0.2"

package:
  name: kernprof
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/line_profiler/line_profiler-${{ version }}.tar.gz
  sha256: 8d8a990c84c64bcde45af22af502d17bc0ae107be405ce41bba92af5c39c0000

build:
  script:
    content: |
      python -m pip install . -vv
    env:
      LINE_PROFILER_BUILD_METHOD: cython
  python:
    entry_points:
      - kernprof = kernprof:main
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - cmake
    - ninja
    - setuptools >=68.2.2
    - cython
  run:
    - python
    - tomli
    - typing-extensions

tests:
  - python:
      imports:
        - line_profiler
      pip_check: true
  - script:
      - kernprof --help

about:
  homepage: https://github.com/pyutils/line_profiler
  summary: line_profiler is a module for doing line-by-line profiling of functions. kernprof is a convenient script for running either line_profiler or the Python standard library’s cProfile or profile modules, depending on what is available.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  documentation: https://kernprof.readthedocs.io/en/latest/
  repository: https://github.com/pyutils/line_profiler

extra:
  recipe-maintainers:
    - kratsg
