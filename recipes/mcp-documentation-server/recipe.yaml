# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: mcp-documentation-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-documentation-server/mcp_documentation_server-${{ version }}.tar.gz
  sha256: 7cf0152b11cbfb09a18af2e55583ecd0236bf0a7a576ba929dd3202c5600c222

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - fastmcp >=0.1.0
    - sentence-transformers >=2.2.0
    - scikit-learn >=1.3.0
    - numpy >=1.21.0

tests:
  - python:
      imports:
        - mcp_documentation_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/your-username/mcp-documentation-server
  license: MIT
  license_file: LICENSE
  summary: A FastMCP server for semantic search over technical documentation (.txt, .md files)
  description: |
    A FastMCP server for semantic search over technical documentation (.txt, .md files)
  repository: https://github.com/your-username/mcp-documentation-server
  documentation: https://github.com/your-username/mcp-documentation-server#readme

extra:
  recipe-maintainers:
    - rxm7706

