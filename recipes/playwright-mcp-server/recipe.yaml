# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: playwright-mcp-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/playwright-mcp-server/playwright_mcp_server-${{ version }}.tar.gz
  sha256: a59ab703c843f7a2be22059f157b2f66c8048027d73fccd004f88a36b08f4029

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - playwright
    - mcp
    - asyncio
    - uv

tests:
  - python:
      imports:
        - playwright_mcp_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yourusername/playwright-mcp-server
  license: MIT
  license_file: LICENSE
  summary: MCP server exposing Playwright browser automation capabilities
  description: |
    MCP server exposing Playwright browser automation capabilities

extra:
  recipe-maintainers:
    - rxm7706

