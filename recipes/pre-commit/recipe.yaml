# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.2"

package:
  name: pre-commit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pre-commit/pre_commit-${{ version }}.tar.gz
  sha256: 8f5d7bfb021ecdbcd9d49d89847082dd24172ccde534390081a679ad046e2441

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cfgv >=2.0.0
    - identify >=1.0.0
    - nodeenv >=0.11.1
    - pyyaml >=5.1
    - virtualenv >=20.10.0

tests:
  - python:
      imports:
        - pre_commit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pre-commit/pre-commit
  license: MIT
  license_file: LICENSE
  summary: A framework for managing and maintaining multi-language pre-commit hooks.
  description: |
    A framework for managing and maintaining multi-language pre-commit hooks.

extra:
  recipe-maintainers:
    - deadsnakes-issues-bot
    - nicoddemus
    - xmnlab

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pre-commit
  cfe-upstream-registry: pypi
