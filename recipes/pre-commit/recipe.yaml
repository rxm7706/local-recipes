# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.2"
  python_min: "3.10"

recipe:
  name: pre-commit
  version: ${{ version }}

source:
  url: https://github.com/pre-commit/pre-commit/archive/v${{ version }}.tar.gz
  sha256: 1882465a71ded8024e9b306c871c04244ce17cf9c680c099698e8c02c78805d6

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pre-commit = pre_commit.main:main

outputs:
  - package:
      name: pre-commit
    build:
      script:
        file: ${{ 'build_base.sh' if not win else 'build_base.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
      run:
        - cfgv >=2.0.0
        - identify >=1.0.0
        - nodeenv >=0.11.1
        - python >=${{ python_min }}
        - pyyaml >=5.1
        - virtualenv >=20.10.0
    tests:
      - python:
          imports:
            - pre_commit
            - pre_commit.commands
            - pre_commit.languages
          pip_check: true
          python_version: ${{ python_min }}
      - requirements:
          run:
            - pip
            - python ${{ python_min }}
        script:
          - pre-commit --help
          - pre-commit-validate-config --help
          - pre-commit-validate-manifest --help
  - package:
      name: pre_commit
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('pre-commit', upper_bound="x.x.x") }}
    tests:
      - python:
          imports:
            - pre_commit
          pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: A framework for managing and maintaining multi-language pre-commit hooks.
  homepage: http://pre-commit.com/
  repository: https://github.com/pre-commit/pre-commit
  documentation: https://github.com/pre-commit/pre-commit

extra:
  recipe-maintainers:
    - deadsnakes-issues-bot
    - nicoddemus
    - xmnlab
