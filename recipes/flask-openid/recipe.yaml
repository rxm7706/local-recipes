# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: flask-openid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-OpenID/flask_openid-${{ version }}.tar.gz
  sha256: 27628bc0a37e6530948823193e068d79035ad9496d87b74040443ec484c7657a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=0.10.1
    - python3-openid >=2.0

tests:
  - python:
      imports:
        - flask_openid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mitsuhiko/flask-openid/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: OpenID support for Flask
  description: |
    OpenID support for Flask

extra:
  recipe-maintainers:
    - pmlandwehr
    - halldc

