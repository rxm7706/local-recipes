# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.1"

package:
  name: flask-apscheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-APScheduler/Flask-APScheduler-${{ version }}.tar.gz
  sha256: b929846f026fb339b76360b0e4fc75da78b75c6d08625715bd0d37949bd607da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dateutil
    - flask
    - werkzeug
    - apscheduler

tests:
  - python:
      imports:
        - flask_apscheduler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/viniciuschiele/flask-apscheduler
  license: Apache-2.0
  license_file: LICENSE
  summary: Adds APScheduler support to Flask
  description: |
    Adds APScheduler support to Flask

extra:
  recipe-maintainers:
    - igortg
    - lvoliveira
    - edetec

#### CFE metadata AND comments
