    - pkg:pypi/pyinstaller-versionfile@${{ version }}
  cfe-upstream-repo: https://github.com/DudeNr33/pyinstaller-versionfile
  cfe-upstream-homepage: https://github.com/DudeNr33/pyinstaller-versionfile
