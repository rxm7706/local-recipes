# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.37"

package:
  name: kagglesdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kagglesdk/kagglesdk-${{ version }}.tar.gz
  sha256: bc362761754966919f63cb7a702bc34118f9e8fcce038ee00fb30d5d11afbe08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - protobuf
    - requests

tests:
  - python:
      imports:
        - kagglesdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kaggle/kagglesdk
  license: Apache-2.0
  license_file: LICENSE
  summary: Bindings to access kaggle's external-facing APIs
  description: |
    Bindings to access kaggle's external-facing APIs

extra:
  recipe-maintainers:
    - synapticarbors

