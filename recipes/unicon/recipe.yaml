# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: unicon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/u/unicon/unicon-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: 715f9559bd752fd93a5c91d8a6f1bb5553212d7b6bafc438b9194a9d743ebe20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - dill
    - unicon.plugins <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - unicon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: Unicon Connection Library
  description: |
    Unicon Connection Library

extra:
  recipe-maintainers:
    - rxm7706

