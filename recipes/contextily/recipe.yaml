# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: contextily
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/contextily/contextily-${{ version }}.tar.gz
  sha256: e00372357a93a9028f75ea7343d867893bd8d4b89833de17b18438725929c885

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - geopy
    - joblib
    - matplotlib-base
    - mercantile
    - pillow
    - rasterio
    - requests
    - xyzservices

tests:
  - python:
      imports:
        - contextily
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Context geo-tiles in Python
  homepage: https://github.com/geopandas/contextily

extra:
  recipe-maintainers:
    - darribas
    - ocefpaf
    - jorisvandenbossche
    - ljwolf
    - martinfleis
