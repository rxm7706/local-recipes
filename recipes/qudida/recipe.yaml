# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: qudida
  version: "0.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/arsenyinfo/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: 3f6a7838c3578deec662e63a8cae4ef8d836f6b0d970714be347f868cdcbf232

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.5
  run:
    - numpy >=0.18.0
    - opencv >=4.0.1
    - python >=3.5
    - scikit-learn >=0.19.1
    - typing-extensions

tests:
  - script:
      - python -c "import importlib.util; assert importlib.util.find_spec('qudida')"

about:
  summary: QUick and DIrty Domain Adaptation
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/arsenyinfo/qudida

extra:
  recipe-maintainers:
    - mxr-conda
    - admax18
