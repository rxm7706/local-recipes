# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-csp
  version: "4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_csp-${{ version }}.tar.gz
  sha256: b27010bb702eb20a3dad329178df2b61a2b82d338b70fbdc13c3a3bd28712833

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - django >=4.2
    - packaging

tests:
  - python:
      imports:
        - csp
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: http://github.com/mozilla/django-csp
  summary: Django Content Security Policy support.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

