# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7"

package:
  name: flashtext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flashtext/flashtext-${{ version }}.tar.gz
  sha256: a1be2b93e09d4f0deee4aad72b91a7127b61fb8b8034ca9a9c78ea745d8b05cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flashtext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/vi3k6i5/flashtext
  license: MIT
  license_file: LICENSE
  summary: Extract/Replaces keywords in sentences.
  description: |
    Extract/Replaces keywords in sentences.

extra:
  recipe-maintainers:
    - ftm13

#### CFE metadata AND comments
