# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.13"

package:
  name: pybars4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pybars4/pybars4-${{ version }}.tar.gz
  sha256: 425817da20d4ad320bc9b8e77a60cab1bb9d3c677df3dce224925c3310fcd635

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pymeta

tests:
  - python:
      imports:
        - pybars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/up9inc/pybars4
  license: MIT
  license_file: LICENSE
  summary: Handlebars.js templating for Python 3
  description: |
    Handlebars.js templating for Python 3

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pybars4
  cfe-upstream-registry: pypi
  cfe-upstream-name: pybars4
  cfe-purls:
