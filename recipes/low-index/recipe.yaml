# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3"

package:
  name: low-index
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/low-index/low_index-${{ version }}.tar.gz
  sha256: 437f1f809e6301f758a77fa522946306155f13f2fd246fc75dc45231a5782992

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/low_index
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Enumerates low index subgroups of a finitely presented group
  description: |
    Enumerates low index subgroups of a finitely presented group

extra:
  recipe-maintainers:
    - rxm7706

