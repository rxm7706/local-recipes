# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adk/adk-${{ version }}.tar.gz
  sha256: 2ebee524e50d6130e292bca063ac7965436085945cba70ac6f42b976352d4eba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/qsrc/ADK
  license: MIT
  license_file: LICENSE
  summary: A ADK-dev Kit
  description: |
    A ADK-dev Kit

extra:
  recipe-maintainers:
    - rxm7706

