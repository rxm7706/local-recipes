# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.1"

package:
  name: trafaret
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trafaret/trafaret-${{ version }}.tar.gz
  sha256: d9d00800318fbd343fdfb3353e947b2ebb5557159c844696c5ac24846f76d41c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - trafaret
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Deepwalker/trafaret/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Validation and parsing library
  description: |
    Validation and parsing library

extra:
  recipe-maintainers:
    - elatt
    - dsakagi
    - peterhurford
    - madmott
    - nott
    - Deepwalker

#### CFE metadata AND comments
