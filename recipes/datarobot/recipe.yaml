# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.18.0"

package:
  name: datarobot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datarobot/datarobot-${{ version }}.tar.gz
  sha256: 47f289b65211416fba37b384b57a0ec82efdb76546aabda95c1ff7076b41e72c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas >=0.15
    - numpy
    - pyyaml >=3.11
    - requests >=2.28.1
    - requests-toolbelt >=0.6
    - trafaret !=1.1.0,<2.2,>=0.7
    - urllib3 >=1.23
    - typing_extensions <5,>=4.3.0
    - strenum >=0.4.15
    - pytz >=2020.1
    - python-dateutil >=2.8.2

tests:
  - python:
      imports:
        - datarobot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://datarobot.com
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: This client library is designed to support the DataRobot API.
  description: |
    This client library is designed to support the DataRobot API.
  documentation: https://docs.datarobot.com/en/docs/api/reference/sdk/index.html

extra:
  recipe-maintainers:
    - dsakagi
    - asuslov
    - ajalon1
    - alevan10
    - c-h-russell-walker

#### CFE metadata AND comments
