# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.1"

package:
  name: dbt-sqlserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-sqlserver/dbt_sqlserver-${{ version }}.tar.gz
  sha256: 6423cf4273e0167eeda6b23c56bd9a64b53d0f308854d89214a8a524d3b1807b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - dbt-core <2.0,>=1.11.0
    - dbt-common <2.0,>=1.22.0
    - dbt-adapters <2.0,>=1.24.1
    - pyodbc >=5.2.0

tests:
  - python:
      imports:
        - dbt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dbt-sqlserver/
  license: MIT
  license_file: LICENSE
  summary: A Microsoft SQL Server adapter plugin for dbt
  description: |
    A Microsoft SQL Server adapter plugin for dbt
  repository: https://github.com/dbt-msft/dbt-sqlserver

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
