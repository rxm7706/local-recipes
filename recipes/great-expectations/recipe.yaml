# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.20.0"

package:
  name: great-expectations
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/great-expectations/great_expectations-${{ version }}.tar.gz
  sha256: d6d6ed6a6437b81a452b6dbc201bd4403c3f96562788a1fcaf10848e96629864

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - versioneer
    - typing_extensions >=4.1.0
  run:
    - python >=${{ python_min }}
    - altair <7.0.0,>=5.0.0
    - cryptography >=3.2
    - jinja2 >=3
    - jsonschema >=2.5.1
    - marshmallow <4.0.0,>=3.7.1
    - mistune >=0.8.4
    - numpy >=1.22.4
    - packaging
    - pandas >=1.3.0
    - pydantic >=1.10.7
    - pyparsing !=3.2.4,>=2.4
    - python-dateutil >=2.8.1
    - requests >=2.20
    - ruamel.yaml >=0.16
    - scipy >=1.6.0
    - tqdm >=4.59.0
    - typing_extensions >=4.1.0
    - tzlocal >=1.2

tests:
  - python:
      imports:
        - great_expectations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://greatexpectations.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Always know what to expect from your data.
  description: |
    Always know what to expect from your data.

extra:
  recipe-maintainers:
    - sodre
    - jcampbell
    - xhochy
    - alexsherstinsky
    - anthonyburdi
    - talagluck
    - Shinnnyshinshin
    - janjagusch
    - cdkini

