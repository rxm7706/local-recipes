# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-httpserver
  version: "1.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: dc3d82e1fe00e491829d8939c549bf4bd9b39a260f87113c619b9d517c2f8ff1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - werkzeug >=2.0.0

tests:
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest >=7.1.3
        - requests >=2.28.1
        - toml
        - types-toml >=0.10.8
        - python ${{ python_min }}
    script:
      - python -m pip check
      - python -m pytest -v -ra tests -k 'not ipv6'

about:
  license: MIT
  license_file: LICENSE
  summary: pytest-httpserver is a httpserver for pytest
  description: |
    This library is designed to help to test http clients without contacting
    the real http server.  In other words, it is a fake http server which is
    accessible via localhost can be started with the pre-defined expected
    http requests and their responses.


  homepage: https://github.com/csernazs/pytest-httpserver
  repository: https://github.com/csernazs/pytest-httpserver
  documentation: https://pytest-httpserver.readthedocs.io/

extra:
  recipe-maintainers:
    - duncanmmacleod
