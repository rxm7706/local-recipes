# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.3"

package:
  name: eml-parser
  version: ${{ version }}

source:
  url: https://github.com/GOVCERT-LU/eml_parser/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 19771164b5f080f8359d034f9038cea7f849afff99a2e5d3edfc4f11ff2a642b

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - charset-normalizer
    - publicsuffixlist
    - python-dateutil

tests:
  - python:
      imports:
        - eml_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GOVCERT-LU/eml_parser
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: Python EML parser library
  description: |
    Python EML parser library
  repository: https://github.com/GOVCERT-LU/eml_parser
  documentation: https://eml-parser.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: eml-parser
  cfe-upstream-registry: pypi
  cfe-upstream-name: eml-parser
