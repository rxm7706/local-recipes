# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.1"

package:
  name: h2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h2/h2-${{ version }}.tar.gz
  sha256: 4e866ffb1a869ae14dd9b5e6beb5c24a13da0495ad72b65925ded182521c1516

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82
    - wheel >=0.46.3
  run:
    - python >=${{ python_min }}
    - hyperframe <7,>=6.1
    - hpack <5,>=4.2

tests:
  - python:
      imports:
        - h2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/h2/
  license: MIT
  license_file: LICENSE
  summary: Pure-Python HTTP/2 protocol implementation
  description: |
    Pure-Python HTTP/2 protocol implementation
  repository: https://github.com/python-hyper/h2/
  documentation: https://python-hyper.org/

extra:
  recipe-maintainers:
    - primozgodec
    - wiphoo
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
