# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: response
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/response/response-${{ version }}.tar.gz
  sha256: 3f1c1bd0728468be692c6e1c38c55015746778d35ea6e061e990b95e119932d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - matplotlib-base

tests:
  - python:
      imports:
        - response
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fhchl/Response
  license: MIT
  license_file: LICENSE
  summary: Your handy frequency and impulse response processing object
  description: |
    Your handy frequency and impulse response processing object

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
