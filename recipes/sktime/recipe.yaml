# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: sktime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sktime/sktime-${{ version }}.tar.gz
  sha256: f5cf8b5d01a03af50e0d0fd915bd880e6528e6cd44027de1c5c4a4dac70cb07d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1
  run:
    - python >=${{ python_min }}
    - joblib <1.6,>=1.2.0
    - numpy <2.5,>=1.21
    - packaging
    - pandas <3.0.0,>=1.1
    - scikit-base <1.1.0,>=1.0.0
    - scikit-learn <1.8.0,>=0.24
    - scipy <2.0.0,>=1.2

tests:
  - python:
      imports:
        - sktime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sktime.net
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A unified framework for machine learning with time series
  description: |
    A unified framework for machine learning with time series
  repository: https://github.com/sktime/sktime
  documentation: https://www.sktime.net

extra:
  recipe-maintainers:
    - yarnabrina
    - fkiraly
    - dhirschfeld
    - freddyaboulton

