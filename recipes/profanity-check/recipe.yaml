# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: profanity-check
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/profanity-check/profanity-check-${{ version }}.tar.gz
  sha256: b32dd3444a1fccc8527aa29330970e447b9f67659454127a15e85078ce77eb21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scikit-learn

tests:
  - python:
      imports:
        - profanity_check
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vzhou842/profanity-check
  license: MIT
  license_file: LICENSE
  summary: A fast, robust library to check for offensive language in strings.
  description: |
    A fast, robust library to check for offensive language in strings.

extra:
  recipe-maintainers:
    - rxm7706

