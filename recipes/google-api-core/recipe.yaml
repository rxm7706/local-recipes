# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.34.0"

package:
  name: google-api-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-api-core/google_api_core-${{ version }}.tar.gz
  sha256: 98a779fe72de956eb1c9c2f47ff4c4432a668ece1a002ec38bed07ec2698ae59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - googleapis-common-protos <2.0.0,>=1.69.2
    - protobuf <8.0.0,>=6.33.5
    - proto-plus <2.0.0,>=1.26.1
    - google-auth <3.0.0,>=2.14.1
    - requests <3.0.0,>=2.33.0

tests:
  - python:
      imports:
        - google.api_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-api-core
  license: Apache-2.0
  license_file: LICENSE
  summary: Google API client core library
  description: |
    Google API client core library
  repository: https://github.com/googleapis/google-cloud-python
  documentation: https://googleapis.dev/python/google-api-core/latest/

extra:
  recipe-maintainers:
    - xylar
    - BrentDorsey
    - parthea
    - tpdownes
    - tswast

