# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.2.0"

package:
  name: configparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/configparser/configparser-${{ version }}.tar.gz
  sha256: b629cc8ae916e3afbd36d1b3d093f34193d851e11998920fdcfc4552218b7b70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - backports.configparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/configparser/
  license: MIT
  license_file: LICENSE
  summary: Updated configparser from stdlib for earlier Pythons.
  description: |
    Updated configparser from stdlib for earlier Pythons.
  repository: https://github.com/jaraco/configparser

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - bgruening

#### CFE metadata AND comments
