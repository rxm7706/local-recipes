# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: detect-secrets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/detect-secrets/detect_secrets-${{ version }}.tar.gz
  sha256: 6bb46dcc553c10df51475641bb30fd69d25645cc12339e46c824c1e0c388898a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - requests

tests:
  - python:
      imports:
        - detect_secrets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Yelp/detect-secrets
  license: Apache-2.0
  license_file: LICENSE
  summary: Tool for detecting secrets in the codebase
  description: |
    Tool for detecting secrets in the codebase

extra:
  recipe-maintainers:
    - rxm7706

