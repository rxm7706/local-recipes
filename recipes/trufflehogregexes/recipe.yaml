# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: trufflehogregexes
  version: "0.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/truffleHogRegexes-${{ version }}.tar.gz
  sha256: b81dfc60c86c1e353f436a0e201fd88edb72d5a574615a7858485c59edf32405

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.11

tests:
  - python:
      imports:
        - truffleHogRegexes
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: These regexes power truffleHog.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/dxa4481/truffleHogRegexes

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
