# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: wsproto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wsproto/wsproto-${{ version }}.tar.gz
  sha256: b86885dcf294e15204919950f666e06ffc6c7c114ca900b060d6e16293528294

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - h11 <1,>=0.16.0

tests:
  - python:
      imports:
        - wsproto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/wsproto/
  license: MIT
  license_file: LICENSE
  summary: Pure-Python WebSocket protocol implementation
  description: |
    Pure-Python WebSocket protocol implementation
  repository: https://github.com/python-hyper/wsproto/
  documentation: https://python-hyper.org/

extra:
  recipe-maintainers:
    - maxyme
    - dhirschfeld
    - ocefpaf

#### CFE metadata AND comments
