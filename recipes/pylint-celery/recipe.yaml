# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: pylint-celery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-celery/pylint-celery-${{ version }}.tar.gz
  sha256: 41e32094e7408d15c044178ea828dd524beedbdbe6f83f712c5e35bde1de4beb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylint_celery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/landscapeio/pylint-celery
  license: GPLv2
  license_file: LICENSE
  summary: pylint-celery is a Pylint plugin to aid Pylint in recognising and understandingerrors caused when using the Celery library
  description: |
    pylint-celery is a Pylint plugin to aid Pylint in recognising and understandingerrors caused when using the Celery library

extra:
  recipe-maintainers:
    - jakirkham

