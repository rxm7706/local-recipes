# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: azure-mgmt-automation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-automation/azure_mgmt_automation-${{ version }}.tar.gz
  sha256: 9d1548c2e979f1b8fc3ed51773fc84a3406455203353e7f7bf5f40e581109916

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-mgmt-core >=1.6.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-mgmt-automation/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Automation Management Client Library for Python
  description: |
    Microsoft Azure Automation Management Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

