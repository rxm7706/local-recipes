# CFE comments
# Header:
#    # Completes the kokoro-onnx chain: espeak-ng <- espeakng-loader <-
#    # phonemizer <- kokoro-onnx <- (this). Without it an environment can
#    # phonemise but cannot synthesise, because the weights are a separate
#    # 337 MB download the lock file knows nothing about -- the same
#    # "machine-global thing the lock cannot describe" shape as the
#    # playwright browsers in this repo.
# source:
#    # Two bare release assets rather than an archive, so file_name is
#    # required (there is no extension-driven unpacking to rely on) and each
#    # carries its own sha256. Checksums verified by re-fetching, not reused
#    # from an earlier download.
# build:
#    # The weights go to share/kokoro-onnx/, NOT into site-packages: a
#    # 337 MB payload has no business inside an importable package, and
#    # keeping it out means the resolver module stays a few KB.
#    # noarch: python -- the weights are architecture-independent data and
#    # the resolver is pure Python. The f32 model runs anywhere onnxruntime
#    # does.
#    # binary_relocation: false is a real precaution, not boilerplate. The
#    # .onnx is a protobuf holding tensor data at fixed offsets; relocation
#    # rewriting it would not crash loudly, it would silently corrupt
#    # weights. Same class of hazard as the ccusage Bun binary in this repo,
#    # with a quieter failure mode.
# requirements:
#    # kokoro-onnx is a run_constraint, not a dependency: this package is a
#    # weights store and is independently useful (another ONNX runtime could
#    # load it), but pairing it with an incompatible kokoro-onnx should not
#    # happen silently.
# tests:
#    # Three layers deliberately. package_contents proves the files shipped;
#    # exact byte sizes prove they are not truncated; onnx.load() parsing the
#    # graph proves the protobuf is intact. Only the last would catch a
#    # relocation-mangled model, which is exactly the failure the build
#    # guards against -- and it is why `onnx` is pulled into the test
#    # environment even though the package itself does not need it.
# about:
#    # Apache-2.0 from hexgrad/Kokoro-82M, the upstream model card. Only the
#    # f32 build is packaged; fp16 / fp16-gpu / int8 variants exist upstream
#    # and would each need their own package or a variant axis.
