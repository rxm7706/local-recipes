# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"
  release: model-files-v1.0

package:
  name: kokoro-onnx-models
  version: ${{ version }}

source:
  # A bare release asset, not an archive, so file_name is required -- there is
  # no extension-driven unpacking to rely on.
  - url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/${{ release }}/kokoro-v1.0.onnx
    sha256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
    file_name: kokoro-v1.0.onnx

build:
  number: 0
  noarch: generic
  dynamic_linking:
    # The .onnx is a protobuf container holding tensor data at fixed offsets.
    # It is data, not a linkable object, and relocation would silently corrupt
    # weights rather than fail loudly -- the quiet cousin of the failure that
    # corrupted a Bun binary in this repo's ccusage recipe.
    binary_relocation: false
  script:
    - if: unix
      then: |
        set -ex
        DEST="${PREFIX}/share/kokoro-onnx"
        mkdir -p "${DEST}"
        cp -a kokoro-v1.0.onnx "${DEST}/"

requirements:
  run:
    # Voices are shared by every variant and ship separately so the three can
    # co-install; the resolver lives there too. Pinned exactly because both
    # come from the same upstream release tag.
    - kokoro-onnx-voices ==${{ version }}
  run_constraints:
    - kokoro-onnx >=0.6.0

tests:
  - package_contents:
      files:
        - share/kokoro-onnx/kokoro-v1.0.onnx
  - script:
      # Resolution goes through the shared resolver, so this also proves the
      # voices dependency actually arrived.
      - python -c "import kokoro_onnx_models as m; print('model:', m.get_model_path('f32'))"
      - python -c "import kokoro_onnx_models as m, sys; assert m.get_model_path('f32').startswith(sys.prefix)"
      - python -c "import kokoro_onnx_models as m; assert m.list_variants() == ['f32'], m.list_variants(); print('variants:', m.list_variants())"
      # With this the only variant installed, the no-argument call must find it.
      - python -c "import kokoro_onnx_models as m; assert m.get_model_path() == m.get_model_path('f32'); print('default resolution OK')"
      # Exact size catches truncation; the ONNX parse plus the node count
      # catches a mangled or swapped payload, which a contents check would not.
      - python -c "import kokoro_onnx_models as m, os; s=os.path.getsize(m.get_model_path('f32')); assert s == 325532387, s; print('bytes OK:', s)"
      - python -c "import onnx, kokoro_onnx_models as m; g=onnx.load(m.get_model_path('f32')).graph; assert len(g.node) == 2464, len(g.node); print('onnx graph OK, nodes:', len(g.node))"
    requirements:
      run:
        - python
        - onnx

about:
  homepage: https://github.com/thewh1teagle/kokoro-onnx
  repository: https://huggingface.co/hexgrad/Kokoro-82M
  documentation: https://github.com/thewh1teagle/kokoro-onnx#readme
  summary: Kokoro v1.0 TTS model weights (f32) for kokoro-onnx
  description: |
    The Kokoro v1.0 ONNX model, f32 variant (311 MB) -- full-precision float32 reference weights --
    installed into `$CONDA_PREFIX/share/kokoro-onnx/` so an environment is
    complete from the lock alone rather than requiring a manual download.

    Unquantized: all 324.6 MB of initializers are float32, and the
    graph carries no quantize/dequantize operators.

    This is also the FASTEST variant on CPU, not just the most
    accurate -- see the table in the description of
    `kokoro-onnx-models-int8`. Pick it unless disk or memory is
    the binding constraint.

    Voice embeddings are shared across variants and come from
    `kokoro-onnx-voices`, pulled in automatically, which also provides the
    resolver:

        from kokoro_onnx import Kokoro
        from kokoro_onnx_models import get_model_path, get_voices_path

        kokoro = Kokoro(get_model_path("f32"), get_voices_path())
        samples, sample_rate = kokoro.create("Hello world", voice="af_sarah")

    All three variants co-install; `get_model_path()` with no argument returns
    the highest-precision one present.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

