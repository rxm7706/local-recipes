# CFE comments
# Header:
#    # One of three model variants that co-install. The split exists because
#    # every variant needs the SAME voices-v1.0.bin: shipping it from each
#    # would be a file clobber (conda refuses two packages owning one path),
#    # and folding the variants into one package would force a 311 MB f32
#    # download on someone who wanted int8's 88 MB.
#    # Build 0 despite an earlier 1.0 artifact having existed briefly. That
#    # one bundled voices-v1.0.bin and an older resolver, so it CLOBBERED two
#    # paths that kokoro-onnx-voices now owns; it was withdrawn from the
#    # channel rather than left to be superseded by a build 1. G113's
#    # bump-the-build-number rule exists to disambiguate two artifacts a
#    # consumer might resolve between -- with the earlier one deleted there is
#    # nothing to disambiguate, and starting at 0 keeps the numbering honest
#    # about what is actually published.
#    # Note the withdrawn artifact had a different build STRING
#    # (pyhec92b6f_0, from noarch: python) than this one (noarch: generic), so
#    # no download cache can confuse the two.
# build:
#    # noarch: generic, not noarch: python -- this package ships no importable
#    # code at all. The resolver module lives in kokoro-onnx-voices, which
#    # means these weights are equally usable from a non-Python ONNX runtime.
#    # The payload goes to share/kokoro-onnx/, the same directory every other
#    # package in the set writes into, which is what lets one resolver find
#    # all of them.
# requirements:
#    # kokoro-onnx is a run_constraint, not a dependency: these weights are
#    # independently useful (any ONNX runtime can load them), but pairing them
#    # with an incompatible kokoro-onnx should not happen silently.
# tests:
#    # Three layers, deliberately. package_contents proves the file shipped;
#    # the exact byte count proves it is not truncated; onnx.load() with an
#    # asserted node count proves the protobuf is intact AND that this is the
#    # right variant -- the only check that would catch two assets swapped
#    # between recipes, which is a real risk when three recipes differ by one
#    # filename. Node counts were measured, not assumed: 2464 here.
####
