# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: dbnavigator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/DBNavigator/DBNavigator-${{ version }}.tar.gz
  sha256: 3bd9aee8a9a2a433781f27c1aecc78abb2e751ccdbe0657da3c036936ae64083

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2
    - flask

tests:
  - python:
      imports:
        - db_navigator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/SuperZombi/DBNavigator
  license: MIT
  license_file: LICENSE
  summary: DataBase Navigator for Flask
  description: |
    DataBase Navigator for Flask

extra:
  recipe-maintainers:
    - rxm7706

