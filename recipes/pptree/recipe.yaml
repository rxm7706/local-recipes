# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pptree
  version: "3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pptree-${{ version }}.tar.gz
  sha256: 4dd0ba2f58000cbd29d68a5b64bac29bcb5a663642f79404877c0059668a69f6

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ppbtree
        - pptree
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pretty print trees
  license: MIT
  license_file: LICENSE.txt
  # https://github.com/clemtoy/pptree/pull/13
  homepage: https://github.com/clemtoy/pptree

extra:
  recipe-maintainers:
    - BastianZim
