# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.2"

package:
  name: functions-framework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/functions-framework/functions_framework-${{ version }}.tar.gz
  sha256: a92f72fc35ead71753090787181ab96a869e609baab0ac3f1ef3a0fddfd20d48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - flask <4.0,>=2.0
    - click <9.0,>=7.0
    - watchdog >=1.0.0
    - cloudevents <=1.12.0,>=1.11.0
    - werkzeug <4.0.0,>=0.14
    - starlette <1.0.0,>=0.37.0
    - uvicorn <1.0.0,>=0.18.0
    - uvicorn-worker <1.0.0,>=0.2.0

tests:
  - python:
      imports:
        - google
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googlecloudplatform/functions-framework-python
  license: Apache-2.0
  license_file: LICENSE
  summary: An open source FaaS (Function as a service) framework for writing portable Python functions -- brought to you by the Google Cloud Functions team.
  description: |
    An open source FaaS (Function as a service) framework for writing portable Python functions -- brought to you by the Google Cloud Functions team.

extra:
  recipe-maintainers:
    - sarthakpati

#### CFE metadata AND comments
