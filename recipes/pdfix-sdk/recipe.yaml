# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.2.0"

package:
  name: pdfix-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdfix-sdk/pdfix_sdk-${{ version }}.tar.gz
  sha256: b0dbffdc7a63f26ca60ca3222a92107de6a4327aa2549951420b477cdf908967

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - pdfixsdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pdfix.net
  license: MIT
  license_file: LICENSE
  summary: PDFix SDK - Automated PDF Remediation, Data Extraction, HTML Conversion
  description: |
    PDFix SDK - Automated PDF Remediation, Data Extraction, HTML Conversion
  repository: https://github.com/pdfix/pdfix-sdk-pypi-package
  documentation: https://github.com/pdfix/pdfix-sdk-pypi-package

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pdfix-sdk
  cfe-upstream-registry: pypi
  cfe-upstream-name: pdfix-sdk
