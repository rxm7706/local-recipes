# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.1"

package:
  name: js.jquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/js.jquery/js.jquery-${{ version }}.tar.gz
  sha256: b327270d7633342a49160567c153a578472ea61e25cd686a9658279d795aa1a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fanstatic
    - setuptools

tests:
  - python:
      imports:
        - js.jquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/fanstatic/js.jquery
  license: BSD-3-Clause
  license_file: LICENSE
  summary: jQuery packaged for Fanstatic.
  description: |
    jQuery packaged for Fanstatic.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
