# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.4"

package:
  name: amqpstorm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/AMQPStorm/amqpstorm-${{ version }}.tar.gz
  sha256: 8c4c81430b3e3f06c88474a8ed883b48a62068f14490e339d6e0fc3329f030d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - pamqp <5.0,>=4.0.0

tests:
  - python:
      imports:
        - amqpstorm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://amqpstorm.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Thread-safe Python3 RabbitMQ Client & Management library.
  description: |
    Thread-safe Python3 RabbitMQ Client & Management library.
  repository: https://github.com/eandersson/amqpstorm
  documentation: https://amqpstorm.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

