# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: arabic-reshaper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arabic-reshaper/arabic_reshaper-${{ version }}.tar.gz
  sha256: a0d9b2a9fa29b5f2c1d705f407adf6ca4242405b9cac0e5cc09e6c4f3f8fb68c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - arabic_reshaper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mpcabd/python-arabic-reshaper/
  license: MIT
  license_file: LICENSE
  summary: Reconstruct Arabic sentences to be used in applications that do not support Arabic
  description: |
    Reconstruct Arabic sentences to be used in applications that do not support Arabic
  repository: https://github.com/mpcabd/python-arabic-reshaper/

extra:
  recipe-maintainers:
    - bollwyvl

