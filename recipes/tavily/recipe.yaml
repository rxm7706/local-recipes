# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: tavily
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tavily/tavily-${{ version }}.tar.gz
  sha256: 7730bf10c925dc0d0d84f27a8979de842ecf88c2882183409addd855e27d8fab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - aiohttp

tests:
  - python:
      imports:
        - tavily
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tavily/
  license: MIT
  license_file: LICENSE
  summary: Simple API TAVILY
  description: |
    Simple API TAVILY

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tavily
  cfe-upstream-registry: pypi
  cfe-upstream-name: tavily
  cfe-purls:
