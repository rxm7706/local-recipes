# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: shutilwhich
  version: "1.1.0"
  compress_type: tar.gz
  hash_val: db1f39c6461e42f630fa617bb8c79090f7711c9ca493e615e43d0610ecb64dc6

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ compress_type }}
  sha256: ${{ hash_val }}

build:
  number: 1
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - shutilwhich
      pip_check: false

about:
  license: PSF-2.0
  license_file: ${{ RECIPE_DIR }}/LICENSE
  summary: shutil.which for those not using Python 3.3 yet.
  homepage: http://github.com/mbr/shutilwhich
  repository: http://github.com/mbr/shutilwhich

extra:
  recipe-maintainers:
    - pmlandwehr
