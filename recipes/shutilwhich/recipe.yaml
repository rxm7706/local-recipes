# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: shutilwhich
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shutilwhich/shutilwhich-${{ version }}.tar.gz
  sha256: db1f39c6461e42f630fa617bb8c79090f7711c9ca493e615e43d0610ecb64dc6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - shutilwhich
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mbr/shutilwhich
  license: PSF
  license_file: LICENSE
  summary: shutil.which for those not using Python 3.3 yet.
  description: |
    shutil.which for those not using Python 3.3 yet.

extra:
  recipe-maintainers:
    - pmlandwehr

