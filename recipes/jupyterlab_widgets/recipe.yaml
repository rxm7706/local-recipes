# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.16"

package:
  name: jupyterlab-widgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-widgets/jupyterlab_widgets-${{ version }}.tar.gz
  sha256: 423da05071d55cf27a9e602216d35a3a65a3e41cdf9c5d3b643b814ce38c19e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab ~=4.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_widgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter-widgets/ipywidgets
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter interactive widgets for JupyterLab
  description: |
    Jupyter interactive widgets for JupyterLab

extra:
  recipe-maintainers:
    - jasongrout
    - SylvainCorlay
    - martinRenou
    - jtpio
    - bollwyvl

