# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.21.0"

package:
  name: libucx-cu13
  version: ${{ version }}

source:
  url: https://github.com/openucx/ucx/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 55afc43ae6006b226e570bcc9a80a028785aa5d77bc9c4b68d4f9ae60eada1a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - libucx_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openucx/ucx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The Unified Communication X library (UCX)
  description: |
    The Unified Communication X library (UCX)

extra:
  recipe-maintainers:
    - rxm7706

