# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.31.0"

package:
  name: keras-nlp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keras-nlp/keras_nlp-${{ version }}.tar.gz
  sha256: 053cd7507877f639e83b932bce83ee703d429e17ff4f7dab5dfc244aceff6a73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - keras-hub ==0.31.0

tests:
  - python:
      imports:
        - keras_nlp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://keras.io/keras_hub/
  license: Apache-2.0
  license_file: LICENSE
  summary: Pretrained models for Keras.
  description: |
    Pretrained models for Keras.
  repository: https://github.com/keras-team/keras/keras_hub

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: keras-nlp
