# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: support
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/support/support-${{ version }}.tar.gz
  sha256: 966d5682b83595951ed8d7bb644560dd9bd3c72a52e5b11f473547102aed67bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - support
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/paypal/support
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An evented server framework designed for building scalable and introspectable services. Built at PayPal, based on gevent.
  description: |
    An evented server framework designed for building scalable and introspectable services. Built at PayPal, based on gevent.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
