# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.3.0.29"

package:
  name: nvidia-cufft
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cufft/nvidia_cufft-12.3.0.29-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
  sha256: 3c268ec73fdbfd22e42913dcef6e49e0c305ab09cd9848268a841cbe9f33f748

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nvidia-nvjitlink

tests:
  - python:
      imports:
        - nvidia_cufft
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CUFFT native runtime libraries
  description: |
    CUFFT native runtime libraries

extra:
  recipe-maintainers:
    - rxm7706

