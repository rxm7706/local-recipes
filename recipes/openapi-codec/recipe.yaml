# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: openapi-codec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openapi-codec/openapi-codec-${{ version }}.tar.gz
  sha256: 1bce63289edf53c601ea3683120641407ff6b708803b8954c8a876fe778d2145

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - openapi_codec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/core-api/python-openapi-codec/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An OpenAPI codec for Core API.
  description: |
    An OpenAPI codec for Core API.

extra:
  recipe-maintainers:
    - lsetiawan
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: openapi-codec
  cfe-upstream-registry: pypi
  cfe-upstream-name: openapi-codec
