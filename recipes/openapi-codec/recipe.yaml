    - pkg:pypi/openapi-codec@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/core-api/python-openapi-codec/
  cfe-import-names: [openapi_codec]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/openapi-codec-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.3.2

  cfe-forge-blocker-list:
