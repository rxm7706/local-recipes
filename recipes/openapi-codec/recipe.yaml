# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: openapi-codec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openapi-codec/openapi-codec-${{ version }}.tar.gz
  sha256: 1bce63289edf53c601ea3683120641407ff6b708803b8954c8a876fe778d2145

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - python-coreapi >=2.2.0
    - setuptools

tests:
  - python:
      imports:
        - openapi_codec
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: An OpenAPI codec for Core API
  homepage: http://github.com/core-api/python-openapi-codec/

extra:
  recipe-maintainers:
    - lsetiawan
    - ocefpaf
