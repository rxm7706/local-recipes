# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: puttykeys
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/puttykeys/puttykeys-${{ version }}.tar.gz
  sha256: c168f70e2ceb7245df9a1e8003854b44e6c6c93282b04bbbf3cd51933d45722d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography

tests:
  - python:
      imports:
        - puttykeys
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scriptjunkie/puttykeys.git
  license: MIT
  license_file: LICENSE
  summary: Library to convert Putty private keys to OpenSSH format
  description: |
    Library to convert Putty private keys to OpenSSH format

extra:
  recipe-maintainers:
    - rxm7706

