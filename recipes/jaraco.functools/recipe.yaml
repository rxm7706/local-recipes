# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.0"

package:
  name: jaraco.functools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jaraco.functools/jaraco_functools-${{ version }}.tar.gz
  sha256: 880c577ec9720b3a052d5bc611fb9f2269b3d87902ef42440df443b88e443280

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - more-itertools

tests:
  - python:
      imports:
        - jaraco.functools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jaraco.functools/
  license: MIT
  license_file: LICENSE
  summary: Functools like those found in stdlib
  description: |
    Functools like those found in stdlib
  repository: https://github.com/jaraco/jaraco.functools

extra:
  recipe-maintainers:
    - carlodri

