  cfe-upstream-homepage: https://pypi.org/project/phx-class-registry/
  cfe-import-names: [class_registry]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/phx-class-registry-feedstock
  cfe-forge-recipe-updates-needed: 
