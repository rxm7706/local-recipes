# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.2"
  python_min: "3.12"

package:
  name: phx-class-registry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/phx-class-registry/phx_class_registry-${{ version }}.tar.gz
  sha256: c8f792b8856a6c0af990f648be108de10ed0560771555d81a0452c4627f8f489

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - class_registry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/phx-class-registry/
  license: MIT
  license_file: LICENSE
  summary: Factory+Registry pattern for Python classes
  description: |
    Factory+Registry pattern for Python classes
  repository: https://github.com/todofixthis/class-registry
  documentation: https://class-registry.readthedocs.io/

extra:
  recipe-maintainers:
    - freundTech

#### CFE metadata AND comments
