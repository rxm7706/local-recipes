# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1"

package:
  name: cowsay
  version: ${{ version }}

source:
  url: https://github.com/VaasuDevanS/cowsay-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: bf7009e6d62c8da0f33b2b2dfd4538ebf712e4d9ce0dde1be5ac8986c09aabe2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cowsay
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/VaasuDevanS/cowsay-python
  license: GNU-GPL
  license_file: LICENSE
  summary: The famous cowsay for GNU/Linux is now available for python
  description: |
    The famous cowsay for GNU/Linux is now available for python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cowsay
  cfe-upstream-registry: pypi
  cfe-upstream-name: cowsay
