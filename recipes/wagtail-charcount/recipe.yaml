# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-charcount
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail-charcount-${{ version }}.tar.gz
  sha256: 3bfdc258e4f6a3962a5c69cd0231c848a22180012477d38ba48ec47b52488829

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=4.1

tests:
  - python:
      imports:
        - wagtailcharcount
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A wagtail character and word counting plugin for RichTextFields.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/takeflight/wagtail-charcount

extra:
  recipe-maintainers:
    - rxm7706
