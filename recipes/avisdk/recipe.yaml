# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "32.1.2"

package:
  name: avisdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/avisdk/avisdk-${{ version }}.tar.gz
  sha256: 638db097619ba2d4ee25168c180236821c9ea69c77b7b3e7889df86c09a5fc6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - avi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/alb-sdk
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Avi python API SDK for Avi Controller REST API with samples and, utilities
  description: |
    Avi python API SDK for Avi Controller REST API with samples and, utilities

extra:
  recipe-maintainers:
    - rxm7706

