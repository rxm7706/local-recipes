# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.10.2"

package:
  name: claude-mem
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/claude-mem/-/claude-mem-${{ version }}.tgz
    sha256: 1dbb3e6ed01df88d83a2eb486100b689df17bcb6c37b58e99cf52ac5f9fff5f9
  # The npm tarball ships no LICENSE; take Apache-2.0 from the repo tag.
  - url: https://raw.githubusercontent.com/thedotmack/claude-mem/v${{ version }}/LICENSE
    sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
    file_name: LICENSE

build:
  number: 1
  # Per-arch (NOT noarch), following the openspec/bmalph pattern: each
  # platform's npm global install lays down its native bin shims (symlinks
  # on unix, .cmd on win), which a single noarch artifact cannot provide.
  script:
    - if: unix
      then:
        - export npm_config_prefix="${PREFIX}"
        - pnpm install --ignore-scripts --prod
        - npm pack --ignore-scripts
        - npm install -g ./claude-mem-${{ version }}.tgz
        - pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
      else:
        - call npm config set prefix "%PREFIX%"
        - if %ERRORLEVEL% neq 0 exit 1
        - call pnpm install --ignore-scripts --prod
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm pack --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm install --userconfig nonexistentrc -g claude-mem-${{ version }}.tgz
        - if %ERRORLEVEL% neq 0 exit 1
        - call pnpm-licenses generate-disclaimer --prod --output-file=third-party-licenses.txt
        - if %ERRORLEVEL% neq 0 exit 1

requirements:
  build:
    - pnpm
    - pnpm-licenses
  host:
    - nodejs >=20.12.0
  run:
    - nodejs >=20.12.0

tests:
  - script:
      - claude-mem --version
      - claude-mem --help
  - if: unix
    then:
      script:
        - test -f "${PREFIX}/lib/node_modules/claude-mem/package.json"

about:
  summary: Persistent context across sessions for coding agents - captures, compresses, and re-injects session memory
  description: |
    claude-mem gives coding agents persistent memory: it captures
    everything the agent does during a session, compresses it with AI, and
    injects the relevant context back into future sessions. Works with
    Claude Code, OpenClaw, Codex, Gemini, Hermes, Copilot, OpenCode, and
    more.
  homepage: https://github.com/thedotmack/claude-mem
  repository: https://github.com/thedotmack/claude-mem
  documentation: https://github.com/thedotmack/claude-mem#readme
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt

extra:
  recipe-maintainers:
    - rxm7706

