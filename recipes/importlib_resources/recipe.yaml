# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1.0"

package:
  name: importlib-resources
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/importlib-resources/importlib_resources-${{ version }}.tar.gz
  sha256: 0722d4c6212489c530f2a145a34c0a7a3b4721bc96a15fada5930e2a0b760708

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - zipp >=3.1.0

tests:
  - python:
      imports:
        - importlib_resources
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/importlib-resources/
  license: Apache-2.0
  license_file: LICENSE
  summary: Read resources from Python packages
  description: |
    Read resources from Python packages
  repository: https://github.com/python/importlib_resources

extra:
  recipe-maintainers:
    - ocefpaf

