# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"
  python_min: "3.12"

package:
  name: dbt-fabric
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-fabric/dbt_fabric-${{ version }}.tar.gz
  sha256: d719bfb1e09917ad2a1ca48eb73246107afa99808b1ae54b5cb78c86de0435b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - azure-core >=1.26.0
    - azure-identity >=1.14.0
    - dbt-adapters <2.0,>=1.15.5
    - dbt-common <2.0,>=1.0.4
    - dbt-core >=1.11.0
    - mssql-python >=1.4.0
    - requests >=2.33.0

tests:
  - python:
      imports:
        - dbt.include.fabric
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dbt-fabric/
  license: MIT
  license_file: LICENSE
  summary: A Microsoft Fabric Synapse Data Warehouse adapter plugin for dbt
  description: |
    A Microsoft Fabric Synapse Data Warehouse adapter plugin for dbt
  repository: https://github.com/microsoft/dbt-fabric

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
