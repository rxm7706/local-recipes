# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-psycopg2
  version: 0.64b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_psycopg2-${{ version }}.tar.gz
  sha256: 57df449718297b93e7bb57c76d3439c475eb5a5451600fcd6a9024d74822d972

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-instrumentation-dbapi ==${{ version }}

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
        - opentelemetry.instrumentation.psycopg2
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry psycopg2 instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-psycopg2

extra:
  recipe-maintainers:
    - conda-forge/opentelemetry-api
    - mariusvniekerk
    - rxm7706
