{% set name = "opentelemetry-instrumentation-psycopg2" %}
{% set version = "0.66b2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_psycopg2-{{ version }}.tar.gz
  sha256: 3f27a6e7c5688a691d2c6d3be3f93c39c0877b9819d035403019cd61767a1bd1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.66b2
    - opentelemetry-instrumentation-dbapi ==0.66b2
    # - psycopg2 >=2.7.3.1
    # - psycopg2 >=2.7.3.1
    # - psycopg2 >=2.7.3.1

test:
  imports:
    - opentelemetry
    - opentelemetry.instrumentation
    - opentelemetry.instrumentation.psycopg2
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip
    - psycopg2-binary >=2.7.3.1

about:
  summary: OpenTelemetry psycopg2 instrumentation
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-psycopg2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - conda-forge/opentelemetry-api
    - mariusvniekerk
    - rxm7706
