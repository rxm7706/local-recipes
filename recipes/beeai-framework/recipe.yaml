    - pkg:conda/beeai-framework@${{ version }}?channel=conda-forge
    - pkg:pypi/beeai-framework@${{ version }}
  cfe-upstream-repo: https://github.com/i-am-bee/beeai-framework
  cfe-upstream-homepage: https://framework.beeai.dev/
  cfe-import-names: [beeai_framework]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
