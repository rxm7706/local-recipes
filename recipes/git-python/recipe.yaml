# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: git-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/git-python/git-python-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - git_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pynickle/git-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: combination and simplification of some useful git commands
  description: |
    combination and simplification of some useful git commands

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
