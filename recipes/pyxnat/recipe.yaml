    - pkg:pypi/pyxnat@${{ version }}
  cfe-upstream-repo: https://github.com/pyxnat/pyxnat
  cfe-upstream-homepage: https://github.com/pyxnat/pyxnat
  cfe-import-names: [pyxnat]
