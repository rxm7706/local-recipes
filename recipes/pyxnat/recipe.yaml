# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.4"

package:
  name: pyxnat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyxnat/pyxnat-${{ version }}.tar.gz
  sha256: 68f918e80f5ee8b8039fa5a972afb5b16ecda8851d7da9bfce60f152c9a5a859

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml >=4.3
    - requests >=2.20
    - pathlib >=1.0

tests:
  - python:
      imports:
        - pyxnat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyxnat/pyxnat
  license: BSD-3-Clause
  license_file: LICENSE
  summary: XNAT in Python
  description: |
    XNAT in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyxnat
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyxnat
  cfe-purls:
