# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.3.0.203"

package:
  name: solidfire-sdk-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solidfire-sdk-python/solidfire-sdk-python-${{ version }}.tar.gz
  sha256: 21b33ed4d506399216936243a29f85e93874be41877c3fbe072ae385bb26b733

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - enum34
    - future
    - requests
    - setuptools

tests:
  - python:
      imports:
        - solidfire.util
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/solidfire-sdk-python/
  license: Apache-2.0
  license_file: LICENSE
  summary: SolidFire Python SDK
  description: |
    SolidFire Python SDK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
