# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"
  python_min: "3.12"

package:
  name: pydremio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydremio/pydremio-${{ version }}.tar.gz
  sha256: 882089460d222b79fb6bc6bdea07d06a9f7e4371e69452acad1f48bb89c6b60d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - certifi ==2025.1.31
    - pandas ==2.2.3
    - polars ==1.23.0
    - prettytable ==3.14.0
    - pyarrow ==19.0.1
    - python-dotenv ==1.0.1
    - requests ==2.32.3
    - typing_extensions ==4.12.2

tests:
  - python:
      imports:
        - dremio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/continental/pydremio
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Dremio SDK for interacting with one or more Dremio instances
  description: |
    A Dremio SDK for interacting with one or more Dremio instances

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
