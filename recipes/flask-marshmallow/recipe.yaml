# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: flask-marshmallow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-marshmallow/flask_marshmallow-${{ version }}.tar.gz
  sha256: 7c06b56e41647eccdb3cd57c25b109f19191b4c62509362bd64920cdf601a066

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask >=2.2
    - marshmallow >=4.0.0

tests:
  - python:
      imports:
        - flask_marshmallow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/flask-marshmallow/
  license: MIT
  license_file: LICENSE
  summary: Flask + marshmallow for beautiful APIs
  description: |
    Flask + marshmallow for beautiful APIs

extra:
  recipe-maintainers:
    - frol
    - mediocretech

