# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.5"

package:
  name: cysystemd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cysystemd/cysystemd-${{ version }}.tar.gz
  sha256: faac7506b6a709e96c0b0028bc5b3b62c3f5457b31e13e7d82b7a5f1c1889d96

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cysystemd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mosquito/cysystemd
  license: Apache-2.0
  license_file: LICENSE
  summary: systemd wrapper in Cython
  description: |
    systemd wrapper in Cython
  repository: https://github.com/mosquito/cysystemd

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cysystemd
