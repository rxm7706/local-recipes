# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: rouge-score
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rouge-score/rouge_score-${{ version }}.tar.gz
  sha256: c7d4da2683e68c9abf0135ef915d63a46643666f848e558a1b9f7ead17ff0f04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rouge_score
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google-research/google-research/tree/master/rouge
  license: Apache-2.0
  license_file: LICENSE
  summary: Pure python implementation of ROUGE-1.5.5.
  description: |
    Pure python implementation of ROUGE-1.5.5.

extra:
  recipe-maintainers:
    - sugatoray

#### CFE metadata AND comments
