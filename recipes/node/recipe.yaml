# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: node
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/node/node-${{ version }}.tar.gz
  sha256: 5602d466749e37c4a56a661c1aac06891819b60ac013732568360b215fb9b128

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - odict >=1.9.0
    - plumber >=1.5
    - zope.component
    - zope.deferredimport
    - zope.deprecation
    - zope-lifecycleevent

tests:
  - python:
      imports:
        - node.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/conestack/node
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Building data structures as node trees
  description: |
    Building data structures as node trees

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: node
  cfe-upstream-registry: pypi
  cfe-upstream-name: node
  cfe-purls:
