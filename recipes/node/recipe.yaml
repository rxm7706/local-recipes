    - pkg:pypi/node@${{ version }}
  cfe-upstream-repo: http://github.com/conestack/node
  cfe-upstream-homepage: http://github.com/conestack/node
  cfe-import-names: [node.tests]
  cfe-source-kind: pypi-sdist
