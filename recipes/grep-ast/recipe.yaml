# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: grep-ast
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/grep_ast-${{ version }}.tar.gz
  sha256: 620a242a4493e6721338d1c9a6c234ae651f8774f4924a6dcf90f6865d4b2ee3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - grep-ast=grep_ast.main:main
      - gast=grep_ast.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - tree-sitter-language-pack
    - python >=${{ python_min }}
    - tree_sitter_languages >=1.8.0
    - pathspec

tests:
  - python:
      imports:
        - grep_ast
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - grep-ast --help
      - gast --help

about:
  summary: A tool to grep through the AST of a source file
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/paul-gauthier/grep-ast

extra:
  recipe-maintainers:
    - MementoRC
    - jan-janssen
