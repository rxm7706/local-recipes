# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: streamlit-cognito-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-cognito-auth/streamlit_cognito_auth-${{ version }}.tar.gz
  sha256: 3412adbf187bbfd3b3ceff3f4f388edd6bb307eb8bedfa11c80c13b868bf1b43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - boto3 >=1.26.52
    - extra-streamlit-components >=0.1.71
    - pycognito >=2022.12.0
    - pydantic >=2.0.0
    - requests >=2.31.0
    - streamlit >=1.27.0

tests:
  - python:
      imports:
        - streamlit_cognito_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pop-srw/streamlit-cognito-auth
  license: MIT
  license_file: LICENSE
  summary: A Streamlit component for authenticating users with AWS Cognito
  description: |
    A Streamlit component for authenticating users with AWS Cognito

extra:
  recipe-maintainers:
    - rxm7706

