# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.2"

package:
  name: lesscpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lesscpy/lesscpy-${{ version }}.tar.gz
  sha256: 4f6b7f34c22c5ce137e7ee280dcb1984ade0d500b6dab591d4a4d84252d18de9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - ply

tests:
  - python:
      imports:
        - lesscpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lesscpy/lesscpy
  license: MIT
  license_file: LICENSE
  summary: Python LESS compiler
  description: |
    Python LESS compiler

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

#### CFE metadata AND comments
