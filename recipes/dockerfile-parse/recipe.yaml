# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dockerfile-parse
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dockerfile-parse-${{ version }}.tar.gz
  sha256: 3184ccdc513221983e503ac00e1aa504a2aa8f84e5de673c46b0b6eee99ec7bc

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dockerfile_parse
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python library for Dockerfile manipulation
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/containerbuildsystem/dockerfile-parse

extra:
  recipe-maintainers:
    - borchero
    - nick-harmening
