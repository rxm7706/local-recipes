# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.2"

package:
  name: imagehash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ImageHash/ImageHash-${{ version }}.tar.gz
  sha256: e54a79805afb82a34acde4746a16540503a9636fd1ffb31d8e099b29bbbf8156

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pywavelets
    - numpy
    - pillow
    - scipy

tests:
  - python:
      imports:
        - imagehash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JohannesBuchner/imagehash
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Image Hashing library
  description: |
    Image Hashing library

extra:
  recipe-maintainers:
    - JohannesBuchner
    - bjlittle
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: imagehash
  cfe-upstream-registry: pypi
  cfe-upstream-name: imagehash
  cfe-purls:
    - pkg:conda/imagehash@${{ version }}?channel=conda-forge
    - pkg:pypi/imagehash@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/JohannesBuchner/imagehash
  cfe-import-names: [imagehash]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/imagehash-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-4.3.2

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

