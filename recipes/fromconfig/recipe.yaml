# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.2"

package:
  name: fromconfig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fromconfig/fromconfig-${{ version }}.tar.gz
  sha256: 7661c82d6a9aefedc1df0e52f794b144764cd32e2ccf884bca7070249a1200f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - pyyaml

tests:
  - python:
      imports:
        - fromconfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/criteo/fromconfig
  license: Apache-2.0
  license_file: LICENSE
  summary: A library to instantiate any Python object from configuration files
  description: |
    A library to instantiate any Python object from configuration files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fromconfig
