# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: itsdangerous
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/itsdangerous/itsdangerous-${{ version }}.tar.gz
  sha256: e0050c0b7da1eea53ffaf149c0cfbb5c6e2e2b69c4bef22c81fa6eb73e5f6173

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - itsdangerous
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/itsdangerous/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Safely pass data to untrusted environments and back.
  description: |
    Safely pass data to untrusted environments and back.
  repository: https://github.com/pallets/itsdangerous/
  documentation: https://itsdangerous.palletsprojects.com/

extra:
  recipe-maintainers:
    - goanpeca
    - nicoddemus
    - williamjamir

#### CFE metadata AND comments
