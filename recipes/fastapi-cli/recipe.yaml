# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.32"

package:
  name: fastapi-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-cli/fastapi_cli-${{ version }}.tar.gz
  sha256: 38024d2345275e1b37ce8848727a580d84901b570e96b3256d9d36a9a5039424

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - typer >=0.16.0
    - uvicorn >=0.15.0
    - rich-toolkit >=0.14.8
    - tomli >=2.0.0

tests:
  - python:
      imports:
        - fastapi_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fastapi/fastapi-cli
  license: MIT
  license_file: LICENSE
  summary: Run and manage FastAPI apps from the command line with FastAPI CLI. 🚀
  description: |
    Run and manage FastAPI apps from the command line with FastAPI CLI. 🚀
  repository: https://github.com/fastapi/fastapi-cli
  documentation: https://fastapi.tiangolo.com/fastapi-cli/

extra:
  recipe-maintainers:
    - synapticarbors

