# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: pdf2json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdf2json/pdf2json-${{ version }}.tar.gz
  sha256: aa860ef34383b1bdf7b91f060721f3e47aef25193530c60ee2a73e0956f6ac5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pdf2json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/the-krafty-koder/pdf2json
  license: MIT
  license_file: LICENSE
  summary: A python package that converts pdfdocs into json format
  description: |
    A python package that converts pdfdocs into json format

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pdf2json
