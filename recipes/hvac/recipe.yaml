# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.0"

package:
  name: hvac
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hvac/hvac-${{ version }}.tar.gz
  sha256: e0056ad9064e7923e874e6769015b032580b639e29246f5ab1044f7959c1c7e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - requests <3.0.0,>=2.27.1

tests:
  - python:
      imports:
        - hvac
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hvac/hvac
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: HashiCorp Vault API client
  description: |
    HashiCorp Vault API client
  repository: https://github.com/hvac/hvac
  documentation: https://hvac.readthedocs.io/en/stable/overview.html

extra:
  recipe-maintainers:
    - mbiette
    - mariusvniekerk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: hvac
