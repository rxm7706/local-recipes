# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.4.0"

package:
  name: kedro-viz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kedro-viz/kedro_viz-${{ version }}.tar.gz
  sha256: c4ccc28b14395aff68fdf55d3c4edf8a2811eed9cd2667fe96c06a8cbcdd824f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-requirements-txt
    - pip
  run:
    - python >=${{ python_min }}
    - aiofiles >=22.1.0
    - click-default-group
    - fastapi >=0.100.0,<0.200.0
    - fsspec >=2021.4
    - ipython >=7.0.0,<9.0
    - kedro >=1.0.0
    - kedro-telemetry >=0.6.0
    - networkx >=2.5
    - orjson >=3.9,<4.0
    - packaging >=23.0
    - pandas >=1.3
    - pathspec >=0.12.1
    - plotly >=4.0
    - pydantic >=2.0.0
    - secure >=0.3.0
    - uvicorn-standard >=0.30.0,<1.0
    - watchfiles >=0.24.0
    - werkzeug >=3.0.0

tests:
  - python:
      imports:
        - kedro_viz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://kedro.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Kedro-Viz helps visualise Kedro data and analytics pipelines
  description: |
    Kedro-Viz helps visualise Kedro data and analytics pipelines
  repository: https://github.com/kedro-org/kedro-viz
  documentation: https://docs.kedro.org/projects/kedro-viz

extra:
  recipe-maintainers:
    - rxm7706

