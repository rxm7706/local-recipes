# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: embedded-topic-model
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/embedded-topic-model/embedded_topic_model-${{ version }}.tar.gz
  sha256: af44e6902acabe0563d1036b4d5a28d7bc54b3c7ced75774c159da185658c56e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - gensim >=4.3
    - nltk >=3.8
    - numpy >=1.25
    - scikit-learn >=1.3
    - scipy >=1.11
    - pytorch >=2.0

tests:
  - python:
      imports:
        - embedded_topic_model
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lffloyd/embedded-topic-model
  license: MIT
  license_file: LICENSE
  summary: A package to run embedded topic modelling
  description: |
    A package to run embedded topic modelling

extra:
  recipe-maintainers:
    - rxm7706

