# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.36"

package:
  name: fschat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fschat/fschat-${{ version }}.tar.gz
  sha256: ac724458bb105cb5b3b9ec852150345dfa7f61fd7c275d6635d66fa1ed904d90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - aiohttp
    - fastapi
    - httpx
    - markdown2
    - nh3
    - numpy
    - prompt-toolkit >=3.0.0
    - pydantic
    - requests
    - rich >=10.0.0
    - shortuuid
    - tiktoken
    - uvicorn

tests:
  - python:
      imports:
        - fastchat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lm-sys/fastchat
  license: Apache-2.0
  license_file: LICENSE
  summary: An open platform for training, serving, and evaluating large language model based chatbots.
  description: |
    An open platform for training, serving, and evaluating large language model based chatbots.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
