# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: folium
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/folium/folium-${{ version }}.tar.gz
  sha256: a0d78b9d5a36ba7589ca9aedbd433e84e9fcab79cd6ac213adbcff922e454cb9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=41.2
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - branca >=0.6.0
    - jinja2 >=2.9
    - numpy
    - requests
    - xyzservices

tests:
  - python:
      imports:
        - folium
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-visualization/folium
  license: MIT
  license_file: LICENSE.txt
  summary: Make beautiful maps with Leaflet.js & Python
  description: |
    Make beautiful maps with Leaflet.js & Python

extra:
  recipe-maintainers:
    - ocefpaf
    - BibMartin

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: folium
