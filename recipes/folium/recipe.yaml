# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: folium
  version: "0.20.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/folium-${{ version }}.tar.gz
  sha256: a0d78b9d5a36ba7589ca9aedbd433e84e9fcab79cd6ac213adbcff922e454cb9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=41.2
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - branca >=0.6.0
    - jinja2 >=2.9
    - numpy
    - requests
    - xyzservices

tests:
  - python:
      imports:
        - folium
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Make beautiful maps with Leaflet.js and Python
  homepage: https://github.com/python-visualization/folium

extra:
  recipe-maintainers:
    - ocefpaf
    - BibMartin
