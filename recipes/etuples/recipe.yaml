# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: etuples
  version: "0.3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/etuples-${{ version }}.tar.gz
  sha256: 26fde81d7e822837146231bfce4d6ba67eab5d7ed55bc58ba7437c2568051167

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=80.0.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - cons
    - multipledispatch

tests:
  - python:
      imports:
        - etuples
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - python -c "from importlib.metadata import version; print(version('${{ name }}'))"
      - python -c "from importlib.metadata import version; print(version('${{ name }}'))" | grep ${{ version }}

about:
  summary: Python S-expression emulation using tuple-like objects.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/pythological/etuples
  repository: https://github.com/pythological/etuples

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard
