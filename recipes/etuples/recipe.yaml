# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.10"

package:
  name: etuples
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/etuples/etuples-${{ version }}.tar.gz
  sha256: 26fde81d7e822837146231bfce4d6ba67eab5d7ed55bc58ba7437c2568051167

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.0.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - cons
    - multipledispatch

tests:
  - python:
      imports:
        - etuples
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/pythological/etuples
  license: Apache-2.0
  license_file: LICENSE
  summary: Python S-expression emulation using tuple-like objects.
  description: |
    Python S-expression emulation using tuple-like objects.
  repository: http://github.com/pythological/etuples

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard

#### CFE metadata AND comments
