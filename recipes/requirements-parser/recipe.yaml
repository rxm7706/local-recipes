# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

package:
  name: requirements-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requirements-parser/requirements_parser-${{ version }}.tar.gz
  sha256: 78811383b2089b6c5197a1431bc2c12ff950245edca39a23eea3460782038dd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - packaging >=23.2

tests:
  - python:
      imports:
        - requirements
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/madpah/requirements-parser/#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: This is a small Python module for parsing Pip requirement files.
  description: |
    This is a small Python module for parsing Pip requirement files.
  repository: https://github.com/madpah/requirements-parser
  documentation: https://requirements-parser.readthedocs.io/

extra:
  recipe-maintainers:
    - wolfv
    - sultaniman

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: requirements-parser
