{% set name = "django-vite-plugin" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/django_vite_plugin-{{ version }}.tar.gz
  sha256: ec29900b34f23d4db65f72e71773cb6c2232bc41b197f99650794cccb3477294

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - django_vite_plugin
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Vite build tools integration for django
  home: https://github.com/protibimbok/django-vite-plugin
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
