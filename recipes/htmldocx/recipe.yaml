# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: htmldocx
  version: "0.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/htmldocx-${{ version }}.tar.gz
  sha256: b4bcec895f86d7a50ffc7133ca24d85c24f3614db2b37d33a30d9d04654a5486

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - python-docx >=0.8.10
    - beautifulsoup4 >=4.7.0

tests:
  - python:
      imports:
        - htmldocx
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convert html to docx
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pqzx/html2docx

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
