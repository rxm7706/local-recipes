# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.4"

package:
  name: langchain-google-genai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-google-genai/langchain_google_genai-${{ version }}.tar.gz
  sha256: 265655baad05f799fa7b83a030eaca7cee0e32c9ab7de846b80ea7f59c26134e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - filetype <2.0.0,>=1.2.0
    - google-genai <3.0.0,>=1.65.0
    - langchain-core <2.0.0,>=1.5.4
    - pydantic <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - langchain_google_genai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/oss/python/integrations/providers/google
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting Google's genai package and LangChain
  description: |
    An integration package connecting Google's genai package and LangChain
  repository: https://github.com/langchain-ai/langchain-google/tree/master/libs/genai
  documentation: https://reference.langchain.com/python/integrations/langchain_google_genai/

extra:
  recipe-maintainers:
    - jan-janssen

