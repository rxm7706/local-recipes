# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-google-genai
  version: "4.3.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_google_genai-${{ version }}.tar.gz
  sha256: 265655baad05f799fa7b83a030eaca7cee0e32c9ab7de846b80ea7f59c26134e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.5.4,<2.0.0
    - google-genai >=1.65.0,<3.0.0
    - pydantic >=2.0.0,<3.0.0
    - filetype >=1.2.0,<2.0.0

tests:
  - python:
      imports:
        - langchain_google_genai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Google's genai package and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain-google

extra:
  recipe-maintainers:
    - jan-janssen
