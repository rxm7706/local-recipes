# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: pege
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pege/pege-${{ version }}.tar.gz
  sha256: d22b6f5f2d662250b53ae7d41d90a560aab67dfd294cde464ff8d763ff2a5ea2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pandas
    - pdbmender
    - pytorch

tests:
  - python:
      imports:
        - pege
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bayer-science-for-a-better-life/pege
  license: MIT
  license_file: LICENSE
  summary: Protein embeddings to describe local electrostic enviroments
  description: |
    Protein embeddings to describe local electrostic enviroments
  repository: https://github.com/bayer-science-for-a-better-life/pege

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pege
  cfe-upstream-registry: pypi
  cfe-upstream-name: pege
