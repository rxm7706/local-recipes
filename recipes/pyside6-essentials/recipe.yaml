# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.11.1"

package:
  name: pyside6-essentials
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/PySide6-Essentials/pyside6_essentials-6.11.1-cp310-abi3-macosx_13_0_universal2.whl
  sha256: 228de53c2bc26b07e5021fbe3614fc44ca08e4dab9999af08c2b389d2c239957

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - shiboken6 ==6.11.1

tests:
  - python:
      imports:
        - pyside6_essentials
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyside.org
  license: MIT
  license_file: LICENSE
  summary: Python bindings for the Qt cross-platform application and UI framework (Essentials)
  description: |
    Python bindings for the Qt cross-platform application and UI framework (Essentials)
  repository: https://code.qt.io/cgit/pyside/pyside-setup.git/
  documentation: https://doc.qt.io/qtforpython

extra:
  recipe-maintainers:
    - rxm7706

