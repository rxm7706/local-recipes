# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: jose
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jose/jose-${{ version }}.tar.gz
  sha256: 8436c3617cd94e1ba97828fbb1ce27c129f66c78fb855b4bb47e122b5f345fba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jose
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Demonware/jose
  license: MIT
  license_file: LICENSE
  summary: An implementation of the JOSE draft
  description: |
    An implementation of the JOSE draft

extra:
  recipe-maintainers:
    - rxm7706

