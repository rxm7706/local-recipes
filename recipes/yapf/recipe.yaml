    - pkg:pypi/yapf@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/google/yapf
  cfe-import-names: [yapf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
