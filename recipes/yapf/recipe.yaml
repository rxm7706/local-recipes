# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yapf
  version: "0.43.0"
  sha256: 1d8ca9d7e1fc429c496e0a046e509e437d5ae766487b0394c45fc1fdf253b5d4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/google/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - yapf = yapf:run_main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - importlib-metadata >=6.6.0
    - platformdirs >=3.5.1
    - python >=${{ python_min }}
    - tomli >=2.0.1

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - yapf --help
      - yapf --version
      - pip check

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A formatter for Python files
  homepage: https://github.com/google/yapf

extra:
  recipe-maintainers:
    - vamega
