# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.43.0"

package:
  name: yapf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yapf/yapf-${{ version }}.tar.gz
  sha256: 00d3aa24bfedff9420b2e0d5d9f5ab6d9d4268e72afbf59bb3fa542781d5218e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=58.5.0
  run:
    - python >=${{ python_min }}
    - platformdirs >=3.5.1
    - tomli >=2.0.1

tests:
  - python:
      imports:
        - yapf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/yapf
  license: Apache-2.0
  license_file: LICENSE
  summary: A formatter for Python code
  description: |
    A formatter for Python code
  documentation: https://github.com/google/yapf/blob/main/README.md#yapf

extra:
  recipe-maintainers:
    - vamega

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: yapf
  cfe-upstream-registry: pypi
  cfe-upstream-name: yapf
