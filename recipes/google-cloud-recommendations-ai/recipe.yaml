# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-cloud-recommendations-ai
  version: "0.13.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_recommendations_ai-${{ version }}.tar.gz
  sha256: 9a62df4c3f9d42bf56fee8bea1fde978eab77cef8fd3862fedd99cb56ef8ad1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.17.1,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    # more restrictive constraint for python >=3.13
    - proto-plus >=1.25.0,<2.0.0
    - protobuf >=4.25.8,<8.0.0

tests:
  - python:
      imports:
        - google
        - google.cloud
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Recommendations Ai API client library
  license: Apache-2.0
  license_file: LICENSE
  description: |
    Cloud Recommendations AI API: Deliver highly personalized product
    recommendations at scale.
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-recommendations-ai
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-recommendations-ai
  documentation: https://googleapis.dev/python/recommendationengine/latest/index.html

extra:
  recipe-maintainers:
    - xylar
