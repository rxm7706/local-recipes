# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.24.1"

package:
  name: chromedriver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/c/chromedriver/chromedriver-2.24.1-py2.py3-none-any.whl
  sha256: b70dee664075ea9209911527af310b09b99bbc0555d897a0dd8c316af9d23daf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chromedriver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chromedriver/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Tool for downloading chromedriver
  description: |
    Tool for downloading chromedriver

extra:
  recipe-maintainers:
    - rxm7706

