# CFE comments
# Header:
#    Packaged as a prerequisite of the reactpy v2 chain:
#    http-router -> asgi-tools -> reactpy-router 3.0.0b1 -> reactpy-django 6.0.0b1.
#    reactpy-router 3.0.0b1 requires reactpy[asgi]; conda has no extras (G25), so
#    that extra is flattened into reactpy-router's run deps, which drags in
#    asgi-tools, which needs this package.
# build:
#    NOT noarch. The generator emitted `noarch: python` alongside `compiler('c')`
#    -- contradictory. Verified compiled per G46/G48: the sdist ships
#    http_router/{router,routes}.pyx + .pxd, setup.py cythonizes them, and PyPI
#    publishes only per-Python cp3XX wheels (35 wheels, zero py3-none-any).
#    setup.py honors HTTP_ROUTER_NO_EXTENSIONS to force a pure-Python build; not
#    used here -- we match upstream's accelerated build.
# requirements:
#  build:
#    stdlib('c') is mandatory alongside compiler('c') and was missing from the
#    generated recipe (STD-001).
#  host:
#    setuptools + wheel + cython all appear in the sdist's
#    [build-system].requires, so all three are kept (not the G8 belt-and-
#    suspenders case). setup.py also carries a legacy setup_requires=["wheel"],
#    which `wheel` in host satisfies without a build-time fetch (G55 addendum).
# tests:
#    No CFEP-25 cross-version python_version triad: this is a per-Python
#    compiled artifact, so a .so built for one Python cannot be imported by
#    another (G49). Simple imports + pip_check only.
# about:
#    license_file is the vendored LICENSE (canonical placement pattern 2) --
#    upstream ships none anywhere. Copyright line reconstructed from the PyPI
#    author (Kirill Klenov <horneds@gmail.com>) and the first release year
#    (0.0.3, 2020-11-10); it matches verbatim the LICENSE that the SAME author
#    ships in asgi-tools ("Copyright (c) 2020 Kirill Klenov"). See the blocker.
#    The generator emitted homepage=pypi.org/project/... and a truncated RST
#    header fragment as the description; both rewritten.
####
