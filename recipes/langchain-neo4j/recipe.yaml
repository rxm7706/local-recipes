# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: langchain-neo4j
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-neo4j/langchain_neo4j-${{ version }}.tar.gz
  sha256: 95329b94c8d316ea483c1e531c4e777ad010cbe9508f499a36ab10d9c5e77b91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-classic <2.0.0,>=1.0.0
    - langchain-core <2.0.0,>=1.0.0
    - langgraph <2.0.0,>=1.0.2
    - neo4j-graphrag <2.0.0,>=1.12.0
    - neo4j <7.0.0,>=5.25.0

tests:
  - python:
      imports:
        - langchain_neo4j
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-neo4j/
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting Neo4j and LangChain
  description: |
    An integration package connecting Neo4j and LangChain
  repository: https://github.com/langchain-ai/langchain-neo4j

extra:
  recipe-maintainers:
    - rxm7706

