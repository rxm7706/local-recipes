# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.85"
  python_min: "3.11"

package:
  name: uipath-dev
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uipath-dev/uipath_dev-${{ version }}.tar.gz
  sha256: 7e2cdb1abf177e8cb6554be310ea1922350e26739071a0f8c5a6bf38079f40b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiosqlite >=0.20.0
    - fastapi >=0.128.8
    - mcp >=1.0.0
    - pyperclip <2.0.0,>=1.11.0
    - textual <8.0.0,>=7.5.0
    - uipath-runtime <0.14.0,>=0.13.0
    - uipath <2.15.0,>=2.14.1
    - uvicorn >=0.40.0
    - if: win
      then:
        - pywinpty

tests:
  - python:
      imports:
        - uipath.dev
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uipath.com
  license: MIT
  license_file: LICENSE
  summary: UiPath Developer Console
  description: |
    UiPath Developer Console
  repository: https://github.com/UiPath/uipath-dev-python
  documentation: https://uipath.github.io/uipath-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: uipath-dev
