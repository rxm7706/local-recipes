# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.5.0"

package:
  name: mblack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mblack/mblack-26.5.0-py3-none-any.whl
  sha256: 072b304646c277979e6a1d19b086ef226bb7381810902e975cf1c3886d1d7883

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click >=8.0.0
    - mypy_extensions >=0.4.3
    - pathspec >=0.9.0
    - platformdirs >=2
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - mblack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://modular.com
  license: LicenseRef-MAX-Platform-Software-License
  license_file: LICENSE
  summary: The Mojo programming language formatter, forked from black
  description: |
    The Mojo programming language formatter, forked from black

extra:
  recipe-maintainers:
    - rxm7706

