# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.0"

package:
  name: pdf2image
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdf2image/pdf2image-${{ version }}.tar.gz
  sha256: eaa959bc116b420dd7ec415fcae49b98100dda3dd18cd2fdfa86d09f112f6d57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pillow

tests:
  - python:
      imports:
        - pdf2image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Belval/pdf2image
  license: MIT
  license_file: LICENSE
  summary: A wrapper around the pdftoppm and pdftocairo command line tools to convert PDF to a PIL Image list.
  description: |
    A wrapper around the pdftoppm and pdftocairo command line tools to convert PDF to a PIL Image list.

extra:
  recipe-maintainers:
    - mxr-conda
    - benhuff
    - oblute
    - rluria14
    - m-rossi

