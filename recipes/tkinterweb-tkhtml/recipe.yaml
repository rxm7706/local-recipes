# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.1"

package:
  name: tkinterweb-tkhtml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkinterweb-tkhtml/tkinterweb_tkhtml-${{ version }}.tar.gz
  sha256: 62b0db0fdb442d46e551c357e2d14de38c47b954ce93b670b6beb31fd75a548b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tkinterweb_tkhtml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Andereoo/TkinterWeb-Tkhtml
  license: MIT
  license_file: LICENSE
  summary: HTML/CSS viewer for Tkinter
  description: |
    HTML/CSS viewer for Tkinter

extra:
  recipe-maintainers:
    - rxm7706

