# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: imageio-ffmpeg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imageio-ffmpeg/imageio_ffmpeg-${{ version }}.tar.gz
  sha256: e2556bed8e005564a9f925bb7afa4002d82770d6b08825078b7697ab88ba1755

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imageio_ffmpeg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/imageio/imageio-ffmpeg
  license: BSD-2-Clause
  license_file: LICENSE
  summary: FFMPEG wrapper for Python
  description: |
    FFMPEG wrapper for Python

extra:
  recipe-maintainers:
    - anjos
    - almarklein

