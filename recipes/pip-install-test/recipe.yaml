# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: pip-install-test
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-install-test/pip-install-test-${{ version }}.tar.gz
  sha256: c33c46ced9865b59963e86e54901947520bdb73bf91849cddbb000742598bb67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pip_install_test
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pip-install-test/
  license: MIT
  license_file: LICENSE
  summary: A minimal stub package to test success of pip install
  description: |
    A minimal stub package to test success of pip install

extra:
  recipe-maintainers:
    - rxm7706

