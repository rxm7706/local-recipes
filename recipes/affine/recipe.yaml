# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: affine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/affine/affine-${{ version }}.tar.gz
  sha256: 573514d5c37e98401a0ec34139c2b725d9f9ae4d074662f4b62a47d6a2ba9f06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - attrs

tests:
  - python:
      imports:
        - affine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/affine/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Matrices describing affine transformation of the plane
  description: |
    Matrices describing affine transformation of the plane
  repository: https://github.com/rasterio/affine

extra:
  recipe-maintainers:
    - mwtoews
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: affine
