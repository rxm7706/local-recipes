    - pkg:pypi/affine@${{ version }}
  cfe-upstream-repo: https://github.com/rasterio/affine
  cfe-upstream-homepage: https://pypi.org/project/affine/
  cfe-import-names: [affine]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
