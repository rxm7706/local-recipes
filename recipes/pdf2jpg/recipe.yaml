# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: pdf2jpg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdf2jpg/pdf2jpg-${{ version }}.tar.gz
  sha256: b1574d07bd1bb97c9127fd6678af5ed3dca34ecddcbe666721d1a52268e3d4f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - img2pdf
    - pikepdf

tests:
  - python:
      imports:
        - pdf2jpg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pankajr141/pdf2jpg
  license: MIT
  license_file: LICENSE
  summary: Wrapper to convert PDF files into jpg
  description: |
    Wrapper to convert PDF files into jpg

extra:
  recipe-maintainers:
    - rxm7706

