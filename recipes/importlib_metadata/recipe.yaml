# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.0.0"

package:
  name: importlib-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/importlib-metadata/importlib_metadata-${{ version }}.tar.gz
  sha256: a4f57ab599e6a2e3016d7595cfd72eb4661a5106e787a95bcc90c7105b831efc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - zipp >=3.20

tests:
  - python:
      imports:
        - importlib_metadata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/importlib-metadata/
  license: Apache-2.0
  license_file: LICENSE
  summary: Read metadata from Python packages
  description: |
    Read metadata from Python packages
  repository: https://github.com/python/importlib_metadata

extra:
  recipe-maintainers:
    - nehaljwani
    - nicoddemus
    - marcelotrevisani

