# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: chuk-ai-planner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-ai-planner/chuk_ai_planner-${{ version }}.tar.gz
  sha256: c4c0ddf3b44275618b6ecebfd36d0bd98c510f1a734b1a302647672a3c754a52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - asyncio >=3.4.3
    - bs4 >=0.0.2
    - chuk-session-manager >=0.1.0
    - chuk-tool-processor >=0.11.3
    - geopy >=2.4.1
    - lxml-html-clean >=0.4.2
    - openai >=1.76.2
    - pydantic >=2.11.4
    - python-dotenv >=1.1.0
    - readability-lxml >=0.8.1
    - requests >=2.32.3
    - uuid >=1.30

tests:
  - python:
      imports:
        - chuk_ai_planner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chuk-ai-planner/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

