# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.24"

package:
  name: gradio-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/gradio-pdf/gradio_pdf-0.0.24-py3-none-any.whl
  sha256: b9b18eaf0e75e1394c33694e638dce6e2b8d82d0838674948148db832152ac5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - gradio <7.0,>=6.0

tests:
  - python:
      imports:
        - gradio_pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gradio-pdf/
  license: Apache-2.0
  license_file: LICENSE
  summary: Easily display PDFs in Gradio
  description: |
    Easily display PDFs in Gradio

extra:
  recipe-maintainers:
    - rxm7706

