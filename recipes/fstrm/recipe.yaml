# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: fstrm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fstrm/fstrm-${{ version }}.tar.gz
  sha256: d1d456e9e1f1b9435b2bb2fa1115fafdb829daab61332cc14bf200a70796211e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fstrm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dmachard/python-framestream
  license: MIT
  license_file: LICENSE
  summary: Frame Streams implementation in Python
  description: |
    Frame Streams implementation in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fstrm
  cfe-upstream-registry: pypi
