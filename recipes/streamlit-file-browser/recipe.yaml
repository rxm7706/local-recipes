# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.22"

package:
  name: streamlit-file-browser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-file-browser/streamlit-file-browser-${{ version }}.tar.gz
  sha256: 487d91ab5d6a081892540cba402f8a694c5fb449f7ef413dd9bd180c5f3959f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - filetype
    - binaryornot
    - wcmatch
    - streamlit-ace
    - streamlit-molstar >=0.4.6
    - streamlit-antd
    - streamlit-embeded
    - streamlit >=0.63
    - pymatgen

tests:
  - python:
      imports:
        - streamlit_file_browser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-file-browser/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

