# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: doc2pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/doc2pdf/doc2pdf-${{ version }}.tar.gz
  sha256: ad82836fc6a7a45a619adeff6b6019f3355b0e05c25e2d832e4c03d87a0b0b2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - doc2pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/silasvasconcelos/doc2pdf
  license: MIT
  license_file: LICENSE
  summary: A package to convert Doc files to PDF.
  description: |
    A package to convert Doc files to PDF.
  repository: https://github.com/silasvasconcelos/doc2pdf

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: doc2pdf
  cfe-upstream-registry: pypi
  cfe-upstream-name: doc2pdf
