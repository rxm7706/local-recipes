# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: htbuilder
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/htbuilder-${{ version }}.tar.gz
  sha256: 58c0bc5502c1a46b42ae9e074c43ec0f6fdc24ed334936cb17e1ed5a8938aee2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - more-itertools
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - htbuilder
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A purely-functional HTML builder for Python. Think JSX rather than templates.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/tvst/htbuilder

extra:
  recipe-maintainers:
    - xhochy
