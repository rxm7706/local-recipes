# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: robotframework-jsonlibrary
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robotframework-jsonlibrary/robotframework-jsonlibrary-${{ version }}.tar.gz
  sha256: 000ac2e53c7f96e3b749c6b5595fcec87d5291b4afc03fb252470356a7d5da1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - JSONLibrary
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nottyo/robotframework-jsonlibrary.git
  license: MIT
  license_file: LICENSE
  summary: robotframework-jsonlibrary is a Robot Framework test library for manipulating JSON Object. You can manipulate your JSON object using JSONPath
  description: |
    robotframework-jsonlibrary is a Robot Framework test library for manipulating JSON Object. You can manipulate your JSON object using JSONPath

extra:
  recipe-maintainers:
    - rxm7706

