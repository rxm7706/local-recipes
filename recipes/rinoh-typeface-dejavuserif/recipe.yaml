# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: rinoh-typeface-dejavuserif
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rinoh-typeface-dejavuserif/rinoh-typeface-dejavuserif-${{ version }}.tar.gz
  sha256: 8be129230ac98ab2ebfbf5b570575052ba7069e4087ce36a2d4c1d85182833ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rinohtype

tests:
  - python:
      imports:
        - rinoh_typeface_dejavuserif
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/brechtm/rinoh-typeface-dejavuserif
  license: MIT
  license_file: LICENSE
  summary: DejaVu Serif typeface
  description: |
    DejaVu Serif typeface

extra:
  recipe-maintainers:
    - rxm7706

