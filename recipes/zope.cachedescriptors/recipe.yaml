# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.cachedescriptors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.cachedescriptors/zope_cachedescriptors-${{ version }}.tar.gz
  sha256: 9bb2a04fd0037a861a8e368e51aa60a3b9d2f4ccbf7b793070df5cc79dde1f74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.cachedescriptors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.cachedescriptors
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Method and property caching decorators
  description: |
    Method and property caching decorators

extra:
  recipe-maintainers:
    - rxm7706

