# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cron-descriptor
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cron_descriptor-${{ version }}.tar.gz
  sha256: ecddb8b2f6c5286398949aaefe185364666af74f33b01877c61378e1fd4e38e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - typing_extensions
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cron_descriptor
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Python library that converts cron expressions into human readable strings.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Salamek/cron-descriptor

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
