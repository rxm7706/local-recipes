# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: cron-descriptor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cron-descriptor/cron_descriptor-${{ version }}.tar.gz
  sha256: ecddb8b2f6c5286398949aaefe185364666af74f33b01877c61378e1fd4e38e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - cron_descriptor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Salamek/cron-descriptor
  license: MIT
  license_file: LICENSE
  summary: A Python library that converts cron expressions into human readable strings.
  description: |
    A Python library that converts cron expressions into human readable strings.

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

