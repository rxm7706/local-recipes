# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: opal-fetcher-postgres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opal-fetcher-postgres/opal-fetcher-postgres-${{ version }}.tar.gz
  sha256: 55a953dac28e04b1c92f34222f770a12f3bec604226fbeed9a5e44fdf081599a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - opal-common
    - asyncpg
    - pydantic
    - tenacity
    - click

tests:
  - python:
      imports:
        - opal_fetcher_postgres
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/opal-fetcher-postgres/
  license: Apache-2.0
  license_file: LICENSE
  summary: An OPAL fetch provider to bring authorization state from Postgres DB.
  description: |
    An OPAL fetch provider to bring authorization state from Postgres DB.
  repository: https://github.com/permitio/opal-fetcher-postgres

extra:
  recipe-maintainers:
    - rxm7706

