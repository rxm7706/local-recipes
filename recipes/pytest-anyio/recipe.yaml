# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0"

package:
  name: pytest-anyio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-anyio/pytest-anyio-${{ version }}.tar.gz
  sha256: b41234e9e9ad7ea1dbfefcc1d6891b23d5ef7c9f07ccf804c13a9cc338571fd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}
    - anyio
    - pytest

tests:
  - python:
      imports:
        - pytest_anyio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/graingert/pytest-anyio
  license: MIT
  license_file: LICENSE
  summary: The pytest anyio plugin is built into anyio. You don't need this package.
  description: |
    The pytest anyio plugin is built into anyio. You don't need this package.

extra:
  recipe-maintainers:
    - rxm7706

