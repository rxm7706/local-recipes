# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: djantic
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/djantic-${{ version }}.tar.gz
  sha256: 1b074b595879145582a726d9e6491b9c72e53e98efdfd445420c6b12ddfe5a85

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=1.8.2,<2.0.0
    - django >3.0,<4.0

tests:
  - python:
      imports:
        - djantic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pydantic model support for Django ORM
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jordaneremieff/djantic/

extra:
  recipe-maintainers:
    - rxm7706
