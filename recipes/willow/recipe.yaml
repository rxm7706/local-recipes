# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: willow
  version: "1.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/willow-${{ version }}.tar.gz
  sha256: db29c8d2f19b9d91f4ce22881521055aa2f6070131d64b4098cb86a98e851a70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - filetype >=1.0.10,!=1.1.0
    - defusedxml >=0.7,<1.0
  run_constraints:
    - Pillow >=11.3.0
    - Wand >=0.6,<1.0
    - pillow-heif >=1.0.0

tests:
  - python:
      imports:
        - willow
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: A unified interface to Python image libraries
  description: Willow is a simple image library that combines the APIs of Pillow, Wand and OpenCV. It converts the image between the libraries when necessary.
  homepage: https://github.com/wagtail/Willow
  repository: https://github.com/wagtail/Willow
  documentation: http://willow.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - darynwhite
