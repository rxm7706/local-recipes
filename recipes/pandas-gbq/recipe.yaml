# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.35.1"

package:
  name: pandas-gbq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-gbq/pandas_gbq-${{ version }}.tar.gz
  sha256: 83045209ec006c1bd98f6f56e88982beddfd29bdfbf58fef1de39309bde5be99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - db-dtypes <2.0.0,>=1.1.1
    - numpy >=1.26.4
    - pandas >=1.5.3
    - pyarrow >=12.0.0
    - pydata-google-auth >=1.5.0
    - psutil >=5.9.8
    - google-api-core <3.0.0,>=2.25.0
    - google-auth >=2.14.1
    - google-auth-oauthlib >=0.7.0
    - google-cloud-bigquery <4.0.0,>=3.20.0
    - packaging >=22.0.0

tests:
  - python:
      imports:
        - pandas_gbq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/pandas-gbq
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Google BigQuery connector for pandas
  description: |
    Google BigQuery connector for pandas

extra:
  recipe-maintainers:
    - chalmerlowe
    - jreback
    - leahecole
    - parthea
    - tswast

#### CFE metadata AND comments
