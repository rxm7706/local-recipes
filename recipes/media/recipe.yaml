# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: media
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/media/media-${{ version }}.tar.gz
  sha256: 92453789ade4943c74819ea2ec617f00e71164708884a7129096dc0ec691c061

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-cognitiveservices-speech

tests:
  - python:
      imports:
        - media
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ahamega.com/support
  license: MIT
  license_file: LICENSE
  summary: A Media Toolkit. Text-to-speech is currently available.
  description: |
    A Media Toolkit. Text-to-speech is currently available.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
