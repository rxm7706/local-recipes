# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.1"

package:
  name: google-cloud-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-core/google_cloud_core-${{ version }}.tar.gz
  sha256: 1e044b131f2ae097b92312fa195164b0aeb6dc6a88e00231e1210516314c420c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.28.0,<3.0.0
    - google-auth !=2.24.0,!=2.25.0,>=2.14.1,<3.0.0
    # from the grpc extra
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    # more restrictive constraint for python >=3.14
    - grpcio-status >=1.75.1,<2.0.0

tests:
  - python:
      imports:
        - google.cloud._http
        - google.api_core.client_info
        - google.cloud.client
        - google.cloud.environment_vars
        - google.cloud.exceptions
        - google.cloud.operation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-core
  license: Apache-2.0
  license_file: LICENSE
  summary: 'API Client library for Google Cloud: Core Helpers'
  description: |
    Google Cloud API client core library. This library is not meant to stand-alone. Instead it defines common helpers (e.g. base Client and Connection classes) used by all of the  google-cloud-*.
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-core
  documentation: https://googleapis.dev/python/google-cloud-core/latest/

extra:
  recipe-maintainers:
    - xylar
    - parthea
    - tswast

