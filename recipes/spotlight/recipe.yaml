# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: spotlight
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spotlight/spotlight-${{ version }}.tar.gz
  sha256: 7e7d6f58319615434dd57d80eb571f75d165d87d6fb7d7e170700c0350b7d00d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spotlight
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdoesburg/spotlight
  license: MIT
  license_file: LICENSE
  summary: Data validation for Python, inspired by the Laravel framework.
  description: |
    Data validation for Python, inspired by the Laravel framework.
  repository: https://github.com/mdoesburg/spotlight
  documentation: https://github.com/mdoesburg/spotlight

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spotlight
  cfe-upstream-registry: pypi
  cfe-upstream-name: spotlight
  cfe-purls:
    - pkg:conda/spotlight@${{ version }}?channel=conda-forge
    - pkg:pypi/spotlight@${{ version }}
  cfe-upstream-repo: https://github.com/mdoesburg/spotlight
  cfe-upstream-homepage: https://github.com/mdoesburg/spotlight
  cfe-import-names: [spotlight]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:06:53Z
