# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.4"

package:
  name: js.jqgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/js.jqgrid/js.jqgrid-${{ version }}.tar.gz
  sha256: 23717c321ae12b0e6e7cca5301d84377c06d9e5dcb604187e6f45fc091d9a8b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - js.jqgrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/js.jqgrid/
  license: MIT
  license_file: LICENSE
  summary: Fanstatic packaging of jqgrid
  description: |
    Fanstatic packaging of jqgrid

extra:
  recipe-maintainers:
    - rxm7706

