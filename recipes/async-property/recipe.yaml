# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: async-property
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/async-property/async_property-${{ version }}.tar.gz
  sha256: 17d9bd6ca67e27915a75d92549df64b5c7174e9dc806b30a3934dc4ff0506380

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - async_property
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ryananguiano/async_property
  license: MIT
  license_file: LICENSE
  summary: Python decorator for async properties.
  description: |
    Python decorator for async properties.

extra:
  recipe-maintainers:
    - jan-janssen

