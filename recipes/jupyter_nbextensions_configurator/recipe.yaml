# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.4"

package:
  name: jupyter-nbextensions-configurator
  version: ${{ version }}

source:
  url: https://github.com/jupyter-contrib/jupyter_nbextensions_configurator/archive/refs/tags/${{ version }}.tar.gz
  sha256: f27c3904302adec913a3396b67401e4fd4ae6342e33505af9acc8e3fcf82dc30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter_contrib_core >=0.3.3
    - jupyter-core
    - jupyter-server
    - notebook >=6.0
    - pyyaml
    - tornado
    - traitlets

tests:
  - python:
      imports:
        - jupyter_nbextensions_configurator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter-contrib/jupyter_nbextensions_configurator
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: jupyter serverextension providing configuration interfaces for nbextensions.
  description: |
    jupyter serverextension providing configuration interfaces for nbextensions.

extra:
  recipe-maintainers:
    - jcb91
    - xhochy

#### CFE metadata AND comments
