# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2"

package:
  name: mattermostwrapper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mattermostwrapper/mattermostwrapper-${{ version }}.tar.gz
  sha256: df17c4224b15c54d959addb12e83e3f1ada34bdb1fbed1048b7b9900d9cff53e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mattermostwrapper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/btotharye/mattermostwrapper.git
  license: MIT
  license_file: LICENSE
  summary: A mattermost api v4 wrapper to interact with api
  description: |
    A mattermost api v4 wrapper to interact with api

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
