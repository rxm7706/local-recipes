# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: self-balancing-binary-search-tree
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/self-balancing-binary-search-tree/self_balancing_binary_search_tree-${{ version }}.tar.gz
  sha256: 3b0f45bbfc26b36c710abd43c2ff888d4c6896a049145aeb13ce0313401afa38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - self_balancing_binary_search_tree
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Ualabi/self_balancing_binary_search_tree
  license: MIT
  license_file: LICENSE
  summary: A Python implementation of a self balancing binary search tree (AVL Tree). Useful to practice, study and see how a SBBST works.
  description: |
    A Python implementation of a self balancing binary search tree (AVL Tree). Useful to practice, study and see how a SBBST works.

extra:
  recipe-maintainers:
    - rxm7706

