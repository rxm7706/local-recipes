# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "1.12.0"

package:
  name: meson
  version: ${{ version }}

source:
  url: https://github.com/mesonbuild/meson/releases/download/${{ version }}/meson-${{ version }}.tar.gz
  sha256: 88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c
  patches:
    # See conda-forge/glib-feedstock#40 for documentation regarding the RPATH patch
    - patches/0001-Only-fix-RPATH-if-install_rpath-is-not-empty.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  noarch: python
  python:
    entry_points:
      - meson = mesonbuild.mesonmain:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - ninja >=1.8.2

tests:
  - script:
      - meson -h
      - meson -v
      - meson --internal delsuffix . nomatchqqq  # test reexecution (GitHub issue #11)
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://mesonbuild.com
  license: Apache-2.0
  license_file: LICENSE
  summary: The Meson Build System
  documentation: https://mesonbuild.com
  repository: https://github.com/mesonbuild/meson

extra:
  recipe-maintainers:
    - dirmeier
    - pkgw
    - SoapZA
    - wolfv
    - tschoonj
    - rgommers
    - h-vetinari
