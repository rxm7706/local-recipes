# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mmhash3
  version: "3.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mmhash3-${{ version }}.tar.gz
  sha256: a00d68f4a1cc434b9501513c8a29e18ed1ddad383677d72b41d71d0d862348af

build:
  number: 4
  noarch: generic
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python >3.7
    - pip
    - setuptools
  run:
    - python >3.7

tests:
  - python:
      imports:
        - mmh3
      pip_check: true

about:
  summary: Python wrapper for MurmurHash (MurmurHash3), a set of fast and robust hash functions.
  license: CC0-1.0
  license_file: LICENSE
  homepage: https://github.com/Fokko/mmhash3

extra:
  recipe-maintainers:
    - rxm7706
