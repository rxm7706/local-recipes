# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: azure-ai-contentsafety
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-ai-contentsafety/azure-ai-contentsafety-${{ version }}.tar.gz
  sha256: 052731bd1419a720fa00910f46bf3428c4e5bd05280da7393d0c8106d46cc6d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - isodate <1.0.0,>=0.6.1
    - azure-core <2.0.0,>=1.28.0
    - typing_extensions >=4.3.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure AI Content Safety Client Library for Python
  description: |
    Microsoft Azure AI Content Safety Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

