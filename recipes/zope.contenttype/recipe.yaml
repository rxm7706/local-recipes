# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.contenttype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.contenttype/zope_contenttype-${{ version }}.tar.gz
  sha256: fce58a333d9b94a128dda8ceda475c976d13a1af8a3b123b6c768eafe1e92f63

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.contenttype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.contenttype
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope contenttype
  description: |
    Zope contenttype

extra:
  recipe-maintainers:
    - rxm7706

