# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.3"

package:
  name: jupyterlab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab/jupyterlab-${{ version }}.tar.gz
  sha256: 2e3db6e3a12495ebd188276e985bf5ac502fbde3d1e8628819920210008de498

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - async-lru >=1.0.0
    - httpx <1,>=0.25.0
    - ipykernel !=6.30.0,>=6.5.0
    - jinja2 >=3.0.3
    - jupyter-builder >=1.0.2
    - jupyter-core
    - jupyter-lsp >=2.0.0
    - jupyter-server <3,>=2.19.0
    - jupyterlab-server <3,>=2.28.0
    - notebook-shim >=0.2
    - packaging >=23.2
    - tomli >=1.2.2
    - tornado >=6.2.0
    - traitlets
    - typing_extensions >=4.4.0

tests:
  - python:
      imports:
        - jupyterlab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: JupyterLab computational environment
  description: |
    JupyterLab computational environment
  repository: https://github.com/jupyterlab/jupyterlab
  documentation: https://jupyterlab.readthedocs.io

extra:
  recipe-maintainers:
    - krassowski
    - afshin
    - blink1073
    - bollwyvl
    - ellisonbg
    - fcollonval
    - ian-r-rose
    - jasongrout
    - jochym
    - jtpio

