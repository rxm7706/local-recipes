# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: visidata
  version: "3.3"
  sha256: a94f4e398477e038541849cf4df1d1f2efc399da544d77db189bdb7f2fc014c4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - requests
    - lxml
    - openpyxl
    - xlrd
    - setuptools

tests:
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - vd --version

about:
  license: GPL-3.0-only
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: A terminal interface for exploring and arranging tabular data.
  description: |
    VisiData is a multipurpose terminal utility for exploring, cleaning,
    restructuring and analysing tabular data. Current supported sources are
    TSV, CSV, fixed-width text, JSON, SQLite, HTTP, HTML, .xls, and .xlsx
    (Microsoft Excel).
  homepage: https://github.com/saulpw/visidata
  repository: https://github.com/saulpw/visidata
  documentation: https://visidata.org/docs

extra:
  recipe-maintainers:
    - anjakefala
