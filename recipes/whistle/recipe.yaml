# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.4"

package:
  name: whistle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/whistle/whistle-${{ version }}.tar.gz
  sha256: 15fb4c9d46d32e658472da475697cb2573768a19579f1d139606fe1de5285fee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - whistle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/whistle/
  license: MIT
  license_file: LICENSE
  summary: Event dispatcher (see python-whistle.readthedocs.io).
  description: |
    Event dispatcher (see python-whistle.readthedocs.io).

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
