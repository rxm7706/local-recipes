# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: streamlit-tree-select
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-tree-select/streamlit-tree-select-${{ version }}.tar.gz
  sha256: 985f5d4c357c403723fd69d4c4fca38193e0f9105974ec36259c43d9e6b78044

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_tree_select
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Schluca/streamlit_tree_select
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple and elegant checkbox tree for Streamlit.
  description: |
    A simple and elegant checkbox tree for Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

