# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: huggingface
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/huggingface/huggingface-${{ version }}.tar.gz
  sha256: 0a2f228fd956801d68b7c6a8bef478dfa60c4b7d7eba572ea7de39ecf87e505a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - huggingface
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/huggingface
  license: Apache-2.0
  license_file: LICENSE
  summary: HuggingFace is a single library comprising the main HuggingFace libraries.
  description: |
    HuggingFace is a single library comprising the main HuggingFace libraries.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
