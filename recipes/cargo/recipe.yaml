# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: cargo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cargo/cargo-${{ version }}.tar.gz
  sha256: 38534a877b2df38f3ab6c2767e673351888dfeb062ce6f2a715b3dce6ca1f8fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cargo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/larose/cargo
  license: MIT
  license_file: LICENSE
  summary: Dependency injection library for Python.
  description: |
    Dependency injection library for Python.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cargo
  cfe-upstream-registry: pypi
  cfe-upstream-name: cargo
  cfe-purls:
    - pkg:conda/cargo@${{ version }}?channel=conda-forge
    - pkg:pypi/cargo@${{ version }}
  cfe-upstream-repo: https://github.com/larose/cargo
  cfe-upstream-homepage: https://github.com/larose/cargo
  cfe-import-names: [cargo]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T22:49:40Z
