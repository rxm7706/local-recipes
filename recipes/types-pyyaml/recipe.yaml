schema_version: 1

context:
  version: "6.0.12.20260815"

package:
  name: types-pyyaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/types-PyYAML/types_pyyaml-6.0.12.20260815-py3-none-any.whl
  sha256: 6f332212b7e191f3afd5016a713c510b6340593b7ebec573c7d5d20aa5386d3b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_pyyaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for PyYAML
  description: |
    Typing stubs for PyYAML
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy

