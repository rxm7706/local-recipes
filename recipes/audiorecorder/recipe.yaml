# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: audiorecorder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/AudioRecorder/AudioRecorder-${{ version }}.tar.gz
  sha256: 428a4015bfe388a85f9c63faa6cad2aba258baf5d14c535769571eb86beae873

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyaudio

tests:
  - python:
      imports:
        - AudioRecorder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/AudioRecorder/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple example package
  description: |
    A simple example package

extra:
  recipe-maintainers:
    - rxm7706

