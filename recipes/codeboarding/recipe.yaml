# CFE comments
# Header:
#    # Packaged 2026-07-12 (user request). Two prereqs come from local
#    # recipes: trustcall (pre-existing, PR #33938) + langchain-cerebras
#    # (new). langchain-cerebras caps python <3.13, so with this package's
#    # >=3.12,<3.14 window the effective env is Python 3.12.
# build:
#    # Upstream's flat setuptools layout installs top-level modules
#    # (main, install, constants) + packages (diagram_analysis, agents,
#    # core, ...) — the entry points target main:main / install:main
#    # verbatim from upstream pyproject; the import test uses
#    # diagram_analysis (a real package) rather than a top-level module.
# run:
#    # PyPI "docker" -> conda docker-py; PyPI "dotenv" (shim distribution
#    # requiring python-dotenv) -> conda python-dotenv directly; pip check
#    # would flag the absent dotenv dist-info, hence pip_check off.
