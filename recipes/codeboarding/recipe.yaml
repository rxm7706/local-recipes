# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.5"
  python_min: "3.12"

package:
  name: codeboarding
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/codeboarding/codeboarding-${{ version }}.tar.gz
  sha256: 644b4dce9c54fcee55641063ebbea6e633667af31def6b51c06feef07ef83ea7

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - codeboarding = main:main
      - codeboarding-setup = install:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.14
    - docker-py >=7.1
    - python-dotenv >=0.9
    - dulwich >=0.22
    - fastapi >=0.115
    - filelock >=3.12
    - gitpython >=3.1
    - google-api-core >=2.10
    - jsonpatch >=1.33
    - jsonschema >=4.25
    - langchain >=1.2
    - langchain-anthropic >=1.3
    - langchain-aws >=1.1
    - langchain-cerebras >=0.8
    - langchain-community >=0.4
    - langchain-google-genai >=3.1
    - langchain-ollama >=1.0
    - langchain-openai >=1.1
    - leidenalg >=0.10
    - markdown >=3.8
    - markdown-it-py >=3.0
    - markitdown >=0.1
    - networkx >=3.4
    - nodeenv >=1.10.0
    - pathspec >=0.12
    - posthog >=3.7
    - pydantic >=2.0
    - pyyaml >=6.0
    - regex >=2024.11
    - rich >=12.6
    # conda-forge names the python binding tree_sitter (underscore), unlike
    # the tree-sitter-<lang> grammar packages.
    - tree_sitter >=0.23
    - tree-sitter-c-sharp >=0.23
    - tree-sitter-go >=0.23
    - tree-sitter-java >=0.23
    - tree-sitter-javascript >=0.23
    - tree-sitter-php >=0.23
    - tree-sitter-python >=0.23
    - tree-sitter-rust >=0.23
    - tree-sitter-typescript >=0.23
    - trustcall >=0.0.39
    - uvicorn >=0.23

tests:
  - python:
      imports:
        - diagram_analysis
      # pip_check stays off: PyPI "dotenv" (a shim dist) has no conda
      # equivalent dist-info — python-dotenv provides the code; see
      # cfe-pip-check reason code.
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - codeboarding --help

about:
  summary: Interactive architecture diagrams for codebases, generated by LLM agents
  description: |
    CodeBoarding generates interactive, hierarchical architecture diagrams
    for codebases: static analysis (tree-sitter, eight languages) plus
    LLM agents produce onboarding-friendly component diagrams with
    drill-down, exported as Markdown/Mermaid, HTML, or served via a local
    API. Bring your own model (Anthropic, OpenAI, Google, AWS Bedrock,
    Cerebras, Ollama).
  homepage: https://github.com/CodeBoarding/CodeBoarding
  repository: https://github.com/CodeBoarding/CodeBoarding
  documentation: https://github.com/CodeBoarding/CodeBoarding#readme
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: codeboarding
  cfe-upstream-registry: pypi
  cfe-upstream-name: codeboarding
  cfe-purls:
    - pkg:conda/codeboarding@${{ version }}?channel=conda-forge
    - pkg:pypi/codeboarding@${{ version }}
  cfe-upstream-repo: https://github.com/CodeBoarding/CodeBoarding
  cfe-upstream-homepage: https://github.com/CodeBoarding/CodeBoarding
  cfe-import-names: [diagram_analysis]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "false:dotenv-shim-satisfied-by-python-dotenv"
  cfe-on-conda-forge-status: blocked-pending-prerequisites
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - trustcall not on conda-forge yet (local recipe; staged-recipes PR #33938 open)
    - langchain-cerebras not on conda-forge (local recipes/langchain-cerebras/ provides it)
  cfe-last-checked: "2026-07-12T17:10:00Z"
  cfe-generated-by-version: 8.76.0
  cfe-generated-at-datetime: "2026-07-12T17:10:00Z"
  cfe-local-build-status: success
  cfe-local-build-datetime: "2026-07-12T15:50:09Z"
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
