# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0"

package:
  name: strawberry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strawberry/strawberry-${{ version }}.tar.gz
  sha256: c0694c18ff174d0729b70b72e6fdc70868e43f4955c86fba7a362d2f62d58abd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strawberry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://devedge.bour.cc/wiki/Strawberry
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: links bookmarking service
  description: |
    links bookmarking service

extra:
  recipe-maintainers:
    - rxm7706

