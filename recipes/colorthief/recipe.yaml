# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: colorthief
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colorthief/colorthief-${{ version }}.tar.gz
  sha256: 079cb0c95bdd669c4643e2f7494de13b0b6029d5cdbe2d74d5d3c3386bd57221

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pillow

tests:
  - python:
      imports:
        - colorthief
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fengsp/color-thief-py
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A module for grabbing the color palette from an image.
  description: |
    A module for grabbing the color palette from an image.

extra:
  recipe-maintainers:
    - rxm7706

