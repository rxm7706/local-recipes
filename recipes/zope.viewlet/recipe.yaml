# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.viewlet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.viewlet/zope_viewlet-${{ version }}.tar.gz
  sha256: 957c2cedc86bc0bfd64db9bfe0893560b627e96cc056c74fc09379609c83995a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.browserpage
    - zope.component
    - zope.configuration
    - zope.contentprovider
    - zope.event
    - zope.i18nmessageid
    - zope.interface
    - zope.location
    - zope.publisher
    - zope.schema
    - zope.security
    - zope.traversing

tests:
  - python:
      imports:
        - zope.viewlet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.viewlet
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Viewlets
  description: |
    Zope Viewlets

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
