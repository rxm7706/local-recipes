# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.6"

package:
  name: kneed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kneed/kneed-${{ version }}.tar.gz
  sha256: 65b22727c623661701f15edf057f2e6c73e2b1ad4e68cd9ca4291675c318b5ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy >=1.14.2
    - scipy >=1.0.0

tests:
  - python:
      imports:
        - kneed
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arvkevi/kneed
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Knee-point detection in Python
  description: |
    Knee-point detection in Python
  documentation: https://kneed.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - arvkevi

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: kneed
  cfe-upstream-registry: pypi
  cfe-upstream-name: kneed
  cfe-purls:
    - pkg:conda/kneed@${{ version }}?channel=conda-forge
    - pkg:pypi/kneed@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/arvkevi/kneed
  cfe-import-names: [kneed]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/kneed-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.8.6

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T09:58:34Z
