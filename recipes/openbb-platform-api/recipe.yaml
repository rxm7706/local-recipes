# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.6"

package:
  name: openbb-platform-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-platform-api/openbb_platform_api-${{ version }}.tar.gz
  sha256: 4a23a6ca542a1bbe309a1b9c1246d9e905ec03ab28c3da8e9a8f9a0db6ff8659

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - deepdiff >=8.6.2
    - openbb-core <2.0.0,>=1.6.10

tests:
  - python:
      imports:
        - openbb_platform_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://openbb.co
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: "OpenBB Platform API: Launch script and widgets builder for the Open Data Platform REST API and Workspace Backend Connector."
  description: |
    OpenBB Platform API: Launch script and widgets builder for the Open Data Platform REST API and Workspace Backend Connector.
  repository: https://github.com/openbb-finance/openbb
  documentation: https://docs.openbb.co/odp/python/extensions/interface/openbb-api

extra:
  recipe-maintainers:
    - rxm7706

