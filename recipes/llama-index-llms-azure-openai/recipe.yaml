# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.5"

package:
  name: llama-index-llms-azure-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-azure-openai/llama_index_llms_azure_openai-${{ version }}.tar.gz
  sha256: a1024ed34c480d49f690677254bd0eb298c0042a9056ea1a8a8cb849afd9a56e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - azure-identity <2,>=1.15.0
    - httpx
    - llama-index-core <0.15,>=0.14.3
    - llama-index-llms-openai <0.8,>=0.7.0

tests:
  - python:
      imports:
        - llama_index.llms.azure_openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-azure-openai/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms azure openai integration
  description: |
    llama-index llms azure openai integration

extra:
  recipe-maintainers:
    - moritzwilksch

