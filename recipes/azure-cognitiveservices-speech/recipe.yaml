# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.51.1"

package:
  name: azure-cognitiveservices-speech
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/azure-cognitiveservices-speech/azure_cognitiveservices_speech-1.51.1-py3-none-macosx_10_14_x86_64.whl
  sha256: 045aeaf9ec1008ac7e40c1b447e9ac18c52aa64505d5bd5ef5718cd2959ea7ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.33.0

tests:
  - python:
      imports:
        - azure_cognitiveservices_speech
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-cognitiveservices-speech/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Cognitive Services Speech SDK for Python
  description: |
    Microsoft Cognitive Services Speech SDK for Python

extra:
  recipe-maintainers:
    - rxm7706

