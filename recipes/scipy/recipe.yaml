# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Update the numpy value here to the most recent released version
# when updating to a new scipy feature release; override default pins
# ensure is_freethreading gets detected as a used variable
# [is_freethreading]
# the top-level build.{sh,bat} builds scipy, and then
# build-output.{sh,bat} installs the files
schema_version: 1

context:
  version: "1.18.0"
  numpy: "2.4"
  numpy_minor: ${{ numpy.split(".")[1] | int }}
  test_folders:
    - _lib/tests
    - cluster/tests
    - constants/tests
    - datasets/tests
    - fftpack/tests
    - fft/tests
    - integrate/tests
    - interpolate/tests
    - io/tests
    - linalg/tests
    - misc/tests
    - ndimage/tests
    - odr/tests
    - optimize/tests
    - signal/tests
    - sparse/tests
    - spatial/tests
    - special/tests
    - stats/tests
  test_libraries:
    - _lib/_test_ccallback
    - integrate/_test_multivariate
    - io/_test_fortran
    - ndimage/_ctest
    - ndimage/_cytest
    - special/_test_internal
  ARCH: '"x86_64" if x86 else ("aarch64" if aarch64 else "powerpc64le")'
  label: "'\"'fast'\" if (build_platform != target_platform) else \"'full'\"'"
  param: '"verbose=1, label=" + label + ", tests=None"'
  extra: "'\"extra_argv=['-k', 'not (\" + tests_to_skip + \")', '-nauto', '--timeout=1200', '--durations=50']\"'"

recipe:
  name: scipy-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scipy/scipy-${{ version }}.tar.gz
  sha256: 67b2ad2ad54c72ca6d04975a9b2df8c3638c34ddd5b28738e94fc2b57929d378

build:
  number: 0
  skip: match(python, "<3.12")

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform or build_platform != target_platform or build_platform != target_platform or build_platform != target_platform
      then: numpy 2.4.*
    - if: build_platform != target_platform
      then: pybind11
    - if: build_platform != target_platform
      then: meson-python
    - if: build_platform != target_platform
      then: cmake
    - if: build_platform != target_platform
      then: ninja
    - if: build_platform != target_platform
      then: pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    # pythran code needs clang-cl on windows
    - if: win
      then: clang
  host:
    - libblas
    - libcblas
    - liblapack
    - python
    - cython
    - meson-python
    - ninja
    - pkg-config
    - python-build
    - pybind11
    - pythran
    - numpy 2.4.*
    - pip

outputs:
  - package:
      name: scipy
    build:
      script:
        file: ${{ 'build-output.sh' if not win else 'build-output.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        # only need these for the strong run exports
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
      host:
        - libblas
        - libcblas
        - liblapack
        - python
        - cython
        - meson-python
        - ninja
        - pkg-config
        - python-build
        - pybind11
        - pythran
        - numpy 2.4.*
        - pip
      run:
        - python
        # numpy's run-export only requires <3 because not every package
        # is exposed as deeply to its ABI. scipy however only supports
        # the two next minor versions after the numpy we build against, see
        # https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
        - numpy <2.${{ numpy_minor + 3 }}
        # double-check lower bound from
        # https://github.com/scipy/scipy/blob/v{{ version }}/pyproject.toml#L55
        - numpy >=2.0.0
      ignore_run_exports:
        by_name:
          - if: win
            then: libflang
    tests:
      - python:
          imports:
            - scipy
            - scipy.cluster
            - scipy.cluster.hierarchy
            - scipy.cluster.vq
            - scipy.constants
            - scipy.datasets
            - scipy.fft
            - scipy.fftpack
            - scipy.integrate
            - scipy.interpolate
            - scipy.io
            - scipy.io.arff
            - scipy.io.matlab
            - scipy.io.wavfile
            - scipy.linalg
            - scipy.linalg.blas
            - scipy.linalg.cython_blas
            - scipy.linalg.cython_lapack
            - scipy.linalg.interpolative
            - scipy.linalg.lapack
            - scipy.misc
            - scipy.ndimage
            - scipy.odr
            - scipy.optimize
            - scipy.signal
            - scipy.signal.windows
            - scipy.sparse
            - scipy.sparse.csgraph
            - scipy.sparse.linalg
            - scipy.spatial
            - scipy.spatial.distance
            - scipy.spatial.transform
            - scipy.special
            - scipy.stats
            - scipy.stats.contingency
            - scipy.stats.distributions
            - scipy.stats.mstats
            - scipy.stats.qmc
            - scipy.stats.sampling
          pip_check: false
      - requirements:
          run:
            - pytest
            - hypothesis
        script:
          - if: unix
            then: test ! -d $SP_DIR/scipy/${{ each_folder }}
          - if: win
            then: if exist %SP_DIR%\scipy\${{ "\\".join(each_folder | split("/")) }} exit 1
          - if: linux
            then: test ! -f $SP_DIR/scipy/${{ each_lib }}.${{ PY_ABI }}-${{ ARCH }}-linux-gnu.so
          - if: osx
            then: test ! -f $SP_DIR/scipy/${{ each_lib }}.${{ PY_ABI }}-darwin.so
          - if: win
            then: if exist %SP_DIR%\scipy\${{ "\\".join(each_lib | split("/")) }}.${{ PY_ABI }}-win_amd64.pyd exit 1
          - python -c "import scipy; throw_away_the_return_value = scipy.test()" > testlog
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
          - if: unix
            then: (pytest --pyargs scipy || echo "failure was expected") > testlog
          - if: win
            then: (pytest --pyargs scipy || if !ERRORLEVEL! neq 0 exit 0) > testlog
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
          - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('======== 1 failed' in x for x in lines) else 1)"
  - package:
      name: scipy-tests
    build:
      script:
        file: ${{ 'build-output.sh' if not win else 'build-output.bat' if win else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: cython
        - if: build_platform != target_platform
          then: numpy
        - if: build_platform != target_platform
          then: pybind11
        - if: build_platform != target_platform
          then: meson-python
        - if: build_platform != target_platform
          then: cmake
        - if: build_platform != target_platform
          then: ninja
        - if: build_platform != target_platform
          then: pkg-config
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - if: win
          then: clang
        - if: unix
          then: sed
        - if: win
          then: m2-sed
      host:
        - ${{ pin_subpackage('scipy', exact=True) }}
        - libblas
        - libcblas
        - liblapack
        - python
        - pip
        - cython
        - meson-python
        - ninja
        - pkg-config
        - python-build
        - pybind11
        - pythran
        - numpy
      run:
        - ${{ pin_subpackage('scipy', exact=True) }}
        - python
        - pytest
        - hypothesis
        # needed for scipy.datasets
        - pooch
      ignore_run_exports:
        by_name:
          - if: win
            then: libflang
    tests:
      - requirements:
          run:
            - pytest-timeout
            - pytest-xdist
            - mpmath
        script:
          - python -c "import numpy; numpy.show_config()"
          - python -c "import scipy, sys; sys.exit(not scipy.test(${{ param }}, ${{ extra }}))"

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Scientific Library for Python
  description: |
    SciPy is a Python-based ecosystem of open-source software for mathematics,
    science, and engineering.
  homepage: http://www.scipy.org/
  repository: https://github.com/scipy/scipy
  documentation: http://www.scipy.org/docs.html

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - rgommers
    - ocefpaf
    - h-vetinari
  feedstock-name: scipy
