# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tyro
  version: "1.0.15"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tyro-${{ version }}.tar.gz
  sha256: 3f1d60887723eecb9c489f195d11f079c4a1f33df74b723552ad31ec57c667bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-deps . -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - docstring_parser >=0.15
    - typing-extensions >=4.13.0
    - pyyaml >=6.0
    - colorama >=0.4.0
    - rich >=11.1.0
    - shtab >=1.5.6
    - eval_type_backport >=0.1.3
    - typeguard >=4.0.0

tests:
  - python:
      imports:
        - tyro
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Strongly typed, zero-effort CLI interfaces
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/brentyi/tyro

extra:
  recipe-maintainers:
    - traversaro
