# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-mptt
  version: "0.21.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-mptt/django_mptt-${{ version }}.tar.gz
  sha256: 0796064448aa874f74a8b35e6f516e489199d37892191f917cc0012850b39363

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - django-js-asset

tests:
  - python:
      imports:
        - mptt
        - mptt.templatetags
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Utilities for implementing Modified Preorder Tree Traversal with your Django Models and working with trees of Model instances.
  license: MIT
  license_file: LICENSE
  description: Utilities for implementing Modified Preorder Tree Traversal with your Django Models and working with trees of Model instances.
  homepage: https://github.com/django-mptt/django-mptt
  repository: https://github.com/django-mptt/django-mptt
  documentation: https://django-mptt.readthedocs.io/

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706
    - MichelML

#### CFE metadata AND comments
