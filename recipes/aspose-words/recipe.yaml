# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.0"

package:
  name: aspose-words
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/aspose-words/aspose_words-26.7.0-py3-none-macosx_10_14_x86_64.whl
  sha256: 6176ba8e086a46e0094d2345b967e826cc9e762f6bc0d090e5661b08f17d96c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aspose_words
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://products.aspose.com/words/python-net/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Aspose.Words for Python is a Document Processing library that allows developers to work with documents in many popular formats without needing Office Automation.
  description: |
    Aspose.Words for Python is a Document Processing library that allows developers to work with documents in many popular formats without needing Office Automation.
  documentation: https://docs.aspose.com/words/python-net/

extra:
  recipe-maintainers:
    - rxm7706

