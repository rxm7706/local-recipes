# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: pandas-read-xml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pandas-read-xml/pandas_read_xml-0.3.1-py3-none-any.whl
  sha256: 76b0047e9c81c6ba47bc2e788b866280d862f0eea52f0aac0f1d65ba9ff72e3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyarrow
    - pandas
    - xmltodict
    - requests
    - zipfile36
    - distlib
    - urllib3

tests:
  - python:
      imports:
        - pandas_read_xml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/minchulkim87/pandas_read_xml
  license: MIT
  license_file: LICENSE
  summary: A tool to read XML files as pandas dataframes.
  description: |
    A tool to read XML files as pandas dataframes.

extra:
  recipe-maintainers:
    - ocefpaf

