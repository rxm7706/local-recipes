# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# There is no tag or source distribution but the wheel for 0.3.1 was build from this commit.
schema_version: 1

context:
  name: pandas_read_xml
  version: "0.3.1"
  commit: 64fabdb69b99b92c1e715755636295230c7c7900

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/minchulkim87/pandas_read_xml/archive/${{ commit }}.tar.gz
  sha256: 671267f6f83129d2a998cb7cac5bcb61ae13eb672373be4336da2e96940ed8b6

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # - distlib
    - pandas
    # - pyarrow
    - requests
    # - urllib3 >=1.26.3
    - xmltodict
    # - zipfile36

tests:
  - python:
      imports:
        - pandas_read_xml
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: A tool to read XML files as pandas dataframes.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/minchulkim87/pandas_read_xml

extra:
  recipe-maintainers:
    - ocefpaf
