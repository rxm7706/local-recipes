# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.0"

package:
  name: hyperframe
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hyperframe/hyperframe-${{ version }}.tar.gz
  sha256: f630908a00854a7adeabd6382b43923a4c4cd4b821fcb527e6ab9e15382a3b08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.6.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hyperframe
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-hyper/hyperframe/
  license: MIT
  license_file: LICENSE
  summary: Pure-Python HTTP/2 framing
  description: |
    Pure-Python HTTP/2 framing
  repository: https://github.com/python-hyper/hyperframe/
  documentation: https://python-hyper.org/

extra:
  recipe-maintainers:
    - primozgodec
    - astaric

#### CFE metadata AND comments
