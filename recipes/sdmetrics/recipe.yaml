# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sdmetrics
  version: "0.28.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sdmetrics-${{ version }}.tar.gz
  sha256: 79cec150478721a890406fec1e8752b3afadba78d37b637d77976b0c9b116e9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner >=2.11.1
    - python ${{ python_min }}
    - setuptools
  run:
    - copulas >=0.12.1
    - numpy >=1.22.2
    - pandas >=1.4.0,<3
    - plotly >=5.19.0,<6
    - python >=${{ python_min }},<3.15
    - scikit-learn >=1.0.2,<2
    - scipy >=1.7.3,<2
    - tqdm >=4.29

tests:
  - python:
      imports:
        - sdmetrics
        - sdmetrics.column_pairs
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}

about:
  summary: Metrics for Synthetic Data Generation Projects
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sdv-dev/SDMetrics

extra:
  recipe-maintainers:
    - conda-forge/sdv
