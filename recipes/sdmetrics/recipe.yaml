# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.28.2"

package:
  name: sdmetrics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sdmetrics/sdmetrics-${{ version }}.tar.gz
  sha256: 79cec150478721a890406fec1e8752b3afadba78d37b637d77976b0c9b116e9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.22.2
    - pandas <3.0.0,>=1.4.0
    - scikit-learn >=1.0.2
    - scipy >=1.7.3
    - copulas >=0.12.1
    - tqdm >=4.29
    - plotly >=5.19.0

tests:
  - python:
      imports:
        - sdmetrics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sdmetrics/
  license: MIT
  license_file: LICENSE
  summary: Metrics for Synthetic Data Generation Projects
  description: |
    Metrics for Synthetic Data Generation Projects
  repository: https://github.com/sdv-dev/SDMetrics

extra:
  recipe-maintainers:
    - conda-forge/sdv

#### CFE metadata AND comments
