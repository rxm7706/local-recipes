# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.13.0"

package:
  name: trulens-dashboard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trulens-dashboard/trulens_dashboard-${{ version }}.tar.gz
  sha256: 0727bd274407b984357b2e0b28d7eb95629a6f049c4b0afccb68afd2785a73d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.1.2
    - jupyter <2,>=1
    - packaging >=23.0
    - pandas >=1.0.0
    - plotly <7.0.0,>=6.0.0
    - psutil <6.0,>=5.9
    - rich <14.0,>=13.6
    - streamlit <2.0,>=1.35
    - traitlets <6.0.0,>=5.0.5
    - trulens-core <3.0.0,>=2.0.0

tests:
  - python:
      imports:
        - trulens.dashboard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://trulens.org/
  license: MIT
  license_file: LICENSE
  summary: Library to systematically track and evaluate LLM based applications.
  description: |
    Library to systematically track and evaluate LLM based applications.
  repository: https://github.com/truera/trulens
  documentation: https://trulens.org/getting_started/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
