# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: django-celery-results
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-celery-results/django_celery_results-${{ version }}.tar.gz
  sha256: 9abcd836ae6b61063779244d8887a88fe80bbfaba143df36d3cb07034671277c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - celery <6.0,>=5.2.7
    - django >=3.2.25

tests:
  - python:
      imports:
        - t
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/celery/django-celery-results
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Celery result backends for Django.
  description: |
    Celery result backends for Django.
  repository: https://github.com/celery/django-celery-results
  documentation: https://django-celery-results.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - MichelML
    - hadim
    - mgorny

#### CFE metadata AND comments
