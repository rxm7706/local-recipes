# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.19.2"

package:
  name: s3transfer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/s3transfer/s3transfer-${{ version }}.tar.gz
  sha256: ba0309fd86be3c27dbf78cdd813c13c5e1df16e5874b99d2535ebbdfb9892993

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - botocore <2.0a.0,>=1.37.4

tests:
  - python:
      imports:
        - s3transfer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/boto/s3transfer
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: An Amazon S3 Transfer Manager
  description: |
    An Amazon S3 Transfer Manager

extra:
  recipe-maintainers:
    - tkelman
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: s3transfer
  cfe-upstream-registry: pypi
  cfe-upstream-name: s3transfer
  cfe-purls:
    - pkg:conda/s3transfer@${{ version }}?channel=conda-forge
    - pkg:pypi/s3transfer@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/boto/s3transfer
  cfe-import-names: [s3transfer]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/s3transfer-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.19.2

  cfe-forge-blocker-list:
