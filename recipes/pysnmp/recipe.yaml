# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1.22"

package:
  name: pysnmp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysnmp/pysnmp-${{ version }}.tar.gz
  sha256: 37ac595c7f0c1c00514505939b4dcf5b4fd5a9ffe51b0349f60bb640c11b0f77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.9.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pyasn1 >=0.4.8,!=0.5.0
    - pysmi >=1.3.0,<2.0.0

tests:
  - python:
      imports:
        - pysnmp
        - pysnmp.carrier
        - pysnmp.carrier.asyncio
        - pysnmp.carrier.asyncio.dgram
        - pysnmp.entity
        - pysnmp.entity.rfc3413
        - pysnmp.hlapi.asyncio
        - pysnmp.proto
        - pysnmp.proto.acmod
        - pysnmp.proto.api
        - pysnmp.proto.mpmod
        - pysnmp.proto.proxy
        - pysnmp.proto.secmod
        - pysnmp.proto.secmod.eso
        - pysnmp.proto.secmod.eso.priv
        - pysnmp.proto.secmod.rfc3414
        - pysnmp.proto.secmod.rfc3414.auth
        - pysnmp.proto.secmod.rfc3414.priv
        - pysnmp.proto.secmod.rfc3826
        - pysnmp.proto.secmod.rfc3826.priv
        - pysnmp.proto.secmod.rfc7860
        - pysnmp.proto.secmod.rfc7860.auth
        - pysnmp.smi
        - pysnmp.smi.mibs
        - pysnmp.smi.mibs.instances
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: SNMP library for Python
  description: |
    PySNMP is a cross-platform, pure-Python SNMP engine implementation. It
    features fully-functional SNMP engine capable to act in Agent/Manager/Proxy
    roles, talking SNMP v1/v2c/v3 protocol versions over IPv4/IPv6 and other
    network transports.
  homepage: https://www.pysnmp.com
  repository: https://github.com/lextudio/pysnmp
  documentation: https://docs.lextudio.com/pysnmp

extra:
  recipe-maintainers:
    - nehaljwani
