# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1.28"

package:
  name: pysnmp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysnmp/pysnmp-${{ version }}.tar.gz
  sha256: 6b837f1e90a9abb01ea21a1bbf222e6ba67199e6d1bdc4f7083a333a053ed1fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.9.0
  run:
    - python >=${{ python_min }}
    - pyasn1 >=0.6.3

tests:
  - python:
      imports:
        - pysnmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysnmp.com
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A Python library for SNMP
  description: |
    A Python library for SNMP
  repository: https://github.com/lextudio/pysnmp

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysnmp
  cfe-upstream-registry: pypi
  cfe-upstream-name: pysnmp
