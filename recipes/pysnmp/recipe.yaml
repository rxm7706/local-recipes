    - pkg:pypi/pysnmp@${{ version }}
  cfe-upstream-repo: https://github.com/lextudio/pysnmp
  cfe-upstream-homepage: https://pysnmp.com
  cfe-import-names: [pysnmp]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pysnmp-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-7.1.28

  cfe-forge-blocker-list:
