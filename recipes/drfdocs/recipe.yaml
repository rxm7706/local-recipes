# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.11"

package:
  name: drfdocs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/drfdocs/drfdocs-${{ version }}.tar.gz
  sha256: a94d63d714aa2796d85b695a665b17092260ab2447b9aed7453bf914a0056e1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - site
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.drfdocs.com
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Documentation for Web APIs made with Django Rest Framework.
  description: |
    Documentation for Web APIs made with Django Rest Framework.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: drfdocs
  cfe-upstream-registry: pypi
  cfe-upstream-name: drfdocs
  cfe-purls:
    - pkg:conda/drfdocs@${{ version }}?channel=conda-forge
    - pkg:pypi/drfdocs@${{ version }}
  cfe-upstream-repo: http://www.drfdocs.com
  cfe-upstream-homepage: http://www.drfdocs.com
  cfe-import-names: [site]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
