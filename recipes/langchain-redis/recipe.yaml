# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.5"

package:
  name: langchain-redis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-redis/langchain_redis-${{ version }}.tar.gz
  sha256: f73cde65a1d2ada301ce51d3d5f403ff845e51f8100ee6d1039fa55786eee37e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - anyio <5.0.0,>=4.9.0
    - certifi <2026.0.0,>=2025.4.26
    - hf-xet <1.2.1
    - httpcore <2.0.0,>=1.0.9
    - jinja2 <4.0.0,>=3.1.6
    - langchain-core >=1.0.7
    - python-ulid >=3.0.0
    - redisvl <1.0.0,>=0.12.0
    - typing_extensions <5.0.0,>=4.13.2
    - urllib3 <3.0.0,>=2.4.0

tests:
  - python:
      imports:
        - langchain_redis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/langchain-ai/langchain-redis
  license: MIT
  license_file: LICENSE
  summary: An integration package connecting Redis and LangChain for AI working memory
  description: |
    An integration package connecting Redis and LangChain for AI working memory
  repository: https://github.com/langchain-ai/langchain-redis

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
