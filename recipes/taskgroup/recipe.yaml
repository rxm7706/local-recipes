# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: taskgroup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taskgroup/taskgroup-${{ version }}.tar.gz
  sha256: 078483ac3e78f2e3f973e2edbf6941374fbea81b9c5d0a96f51d297717f4752d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python ${{ python_min }}
  run:
    - exceptiongroup
    - python >=${{ python_min }}
    - typing_extensions >=4.12.2,<5

tests:
  - python:
      imports:
        - taskgroup
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: backport of asyncio.TaskGroup, asyncio.Runner and asyncio.timeout
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/graingert/taskgroup

extra:
  recipe-maintainers:
    - bollwyvl
