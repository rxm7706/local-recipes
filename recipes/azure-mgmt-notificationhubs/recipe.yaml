# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.0"

package:
  name: azure-mgmt-notificationhubs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-notificationhubs/azure-mgmt-notificationhubs-8.0.0.zip
  sha256: 4dd924f4704993e3ebf1d42e2be1cbe0b0d908e695857fa08c4369ae11d0eb36

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - msrest
    - azure-common
    - azure-mgmt-core

tests:
  - python:
      imports:
        - azure_mgmt_notificationhubs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Notification Hubs Management Client Library for Python
  description: |
    Microsoft Azure Notification Hubs Management Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

