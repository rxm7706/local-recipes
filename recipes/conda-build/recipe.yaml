# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.5"

package:
  name: conda-build
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-build/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8bee3ee7d7053f32c4e465aeb55f66f58440e5a2c7178a4393f4238cec141e5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - conda
    - filelock
    - requests

tests:
  - python:
      imports:
        - conda_build
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/conda/conda-build
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: tools for building conda packages
  description: |
    tools for building conda packages

extra:
  recipe-maintainers:
    - chenghlee
    - isuruf
    - jakirkham
    - mingwandroid
    - msarahan
    - mwcraig
    - ocefpaf
    - patricksnape
    - pelson
    - scopatz
    - stuertz
    - CJ-Wright
    - xhochy
    - cjmartian
    - dbast
    - jezdez
    - kenodegard
    - beeankha
    - beckermr

