# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.0"

package:
  name: anaconda-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anaconda-client/anaconda_client-${{ version }}.tar.gz
  sha256: 937724b019c9bb88d8c1dfc6c63886cecadc77833763a64fd5039feab00b05a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs >=0.3
    - setuptools-scm >=7.1
    - hatch-requirements-txt
  run:
    - python >=${{ python_min }}
    - anaconda-auth >=0.11.0
    - anaconda-cli-base >=0.5.3
    - conda-package-handling >=1.7.3
    - defusedxml >=0.7.1
    - nbformat >=4.4.0
    - platformdirs <5.0,>=3.10.0
    - python-dateutil >=2.6.1
    - pytz >=2021.3
    - pyyaml >=3.12
    - requests-toolbelt >=0.9.1
    - requests >=2.20.0
    - setuptools >=58.0.4
    - tqdm >=4.56.0
    - urllib3 >=1.26.4

tests:
  - python:
      imports:
        - binstar_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/anaconda-client/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Client library and CLI plugin for anaconda.org
  description: |
    Client library and CLI plugin for anaconda.org
  repository: https://github.com/anaconda/anaconda-client

extra:
  recipe-maintainers:
    - jakirkham
    - goanpeca
    - mbargull
    - mattkram

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: anaconda-client
  cfe-upstream-registry: pypi
  cfe-upstream-name: anaconda-client
