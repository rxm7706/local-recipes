    - pkg:pypi/anaconda-client@${{ version }}
  cfe-upstream-repo: https://github.com/anaconda/anaconda-client
  cfe-upstream-homepage: https://pypi.org/project/anaconda-client/
  cfe-import-names: [binstar_client]
  cfe-source-kind: pypi-sdist
