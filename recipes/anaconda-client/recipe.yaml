  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/anaconda-client-feedstock
  cfe-forge-recipe-updates-needed: 
