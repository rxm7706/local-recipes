# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: pandas_access
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas_access/pandas_access-${{ version }}.tar.gz
  sha256: 7849140375a8f32037735051dbec55dec0570e1975a405f90b5b75fd582e21ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pandas_access
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jbn/pandas_access
  license: MIT
  license_file: LICENSE
  summary: A tiny, subprocess-based tool for reading a MS Access database(.rdb) as a Pandas DataFrame.
  description: |
    A tiny, subprocess-based tool for reading a MS Access database(.rdb) as a Pandas DataFrame.

extra:
  recipe-maintainers:
    - rxm7706

