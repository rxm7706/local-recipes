# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.1"

package:
  name: sv-ttk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sv-ttk/sv_ttk-${{ version }}.tar.gz
  sha256: 47589d5e20398cf404e8362f24f3ed48f3830cd0ace056d83354fa25d8e4fe48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sv_ttk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rdbende/Sun-Valley-ttk-theme
  license: MIT
  license_file: LICENSE
  summary: A gorgeous theme for Tkinter, based on Windows 11's UI
  description: |
    A gorgeous theme for Tkinter, based on Windows 11's UI
  repository: https://github.com/rdbende/Sun-Valley-ttk-theme
  documentation: https://github.com/rdbende/Sun-Valley-ttk-theme/wiki

extra:
  recipe-maintainers:
    - rxm7706

