    - pkg:pypi/pipreqsnb@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ivanlen/pipreqsnb
  cfe-import-names: [pipreqsnb]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pipreqsnb-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.4

  cfe-forge-blocker-list:
