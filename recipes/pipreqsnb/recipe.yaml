# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: pipreqsnb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pipreqsnb/pipreqsnb-${{ version }}.tar.gz
  sha256: ca4306d526ea3ec3cc4fdcf753cae3eaa359b626a4f88ef267badce4bf2efc10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pipreqsnb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ivanlen/pipreqsnb
  license: MIT
  license_file: LICENSE
  summary: Pipreqs with jupyter notebook support
  description: |
    Pipreqs with jupyter notebook support

extra:
  recipe-maintainers:
    - sugatoray

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pipreqsnb
  cfe-upstream-registry: pypi
  cfe-upstream-name: pipreqsnb
