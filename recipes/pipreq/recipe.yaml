# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.4"

package:
  name: pipreq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pipreq/pipreq-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pipreq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jessamynsmith/pipreq
  license: MIT
  license_file: LICENSE
  summary: Manages pip requirements files for multiple environments, e.g. production and development
  description: |
    Manages pip requirements files for multiple environments, e.g. production and development

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
