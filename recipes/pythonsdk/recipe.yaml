    - pkg:pypi/pythonsdk@${{ version }}
  cfe-upstream-repo: https://github.com/lijok/python-sdk
  cfe-upstream-homepage: https://github.com/lijok/python-sdk
  cfe-import-names: [python_sdk]
  cfe-source-kind: pypi-sdist
