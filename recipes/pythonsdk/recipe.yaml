# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: pythonsdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pythonsdk/pythonsdk-${{ version }}.tar.gz
  sha256: edd34f92a2e7222c98b3bb8e4f92b1b132f57d923c90c5b0339df0f28b35d653

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.5.1
    - wheel >=0.38.4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lijok/python-sdk
  license: MIT
  license_file: LICENSE
  summary: Python Software Dev Kit
  description: |
    Python Software Dev Kit
  repository: https://github.com/lijok/python-sdk
  documentation: https://github.com/lijok/python-sdk/docs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pythonsdk
  cfe-upstream-registry: pypi
  cfe-upstream-name: pythonsdk
