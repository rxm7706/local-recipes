# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: sequence-mining
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sequence-mining/sequence_mining-${{ version }}.tar.gz
  sha256: aef3bed4dc44dfdac064671d56b1241e741e64271368ec4563ad33b635cd48ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bitarray ==2.6.0
    - bitmap ==0.0.7
    - future ==0.18.2

tests:
  - python:
      imports:
        - sequence_mining
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/adyachok/sequence-mining
  license: MIT
  license_file: LICENSE
  summary: Sequence mining SPAM algorithm implementation
  description: |
    Sequence mining SPAM algorithm implementation

extra:
  recipe-maintainers:
    - rxm7706

