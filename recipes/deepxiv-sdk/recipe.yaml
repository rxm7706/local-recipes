# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: deepxiv-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepxiv-sdk/deepxiv_sdk-${{ version }}.tar.gz
  sha256: 42021ad250d167a083cf8441e6634ecd6376198a961acbd3c39420859846e8a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45,<70
    - wheel
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - click >=8.0.0
    - python-dotenv >=0.19.0

tests:
  - python:
      imports:
        - deepxiv_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deepxiv.com
  license: MIT
  license_file: LICENSE
  summary: Agentic search over arXiv and the web, returning answers with real citations
  description: |
    Agentic search over arXiv and the web, returning answers with real citations
  repository: https://github.com/qhjqhj00/deepxiv-sdk
  documentation: https://github.com/qhjqhj00/deepxiv-sdk#readme

extra:
  recipe-maintainers:

#### CFE metadata AND comments
