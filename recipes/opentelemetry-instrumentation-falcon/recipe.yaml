# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-falcon
  version: 0.66b1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-falcon/opentelemetry_instrumentation_falcon-${{ version }}.tar.gz
  sha256: 08a1304c2e7a50888e2161ea31f87df2455a763b1166b651540caff1d722cddc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation-wsgi ==0.65b0
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - opentelemetry-util-http ==0.65b0
    - packaging >=20.0
    - falcon <5.0.0,>=1.4.1

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation
        - opentelemetry.instrumentation.falcon
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Falcon instrumentation for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-falcon

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api

#### CFE metadata AND comments
