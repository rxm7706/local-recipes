# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.12.8"

package:
  name: pyaudiowpatch
  version: ${{ version }}

source:
  url: https://github.com/s0d3s/PyAudioWPatch/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 35e7a7e90f164079173232fc374d8a955f2a450c2ff8ed56505fc9d18fae7ce5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyaudiowpatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/s0d3s/PyAudioWPatch/
  license: Apache-2.0
  license_file: LICENSE
  summary: PortAudio fork with WASAPI loopback support
  description: |
    PortAudio fork with WASAPI loopback support

extra:
  recipe-maintainers:
    - rxm7706

