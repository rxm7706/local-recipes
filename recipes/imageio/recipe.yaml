# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.37.4"

package:
  name: imageio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ImageIO/imageio-${{ version }}.tar.gz
  sha256: e45cbc5e83502047fb138f7f585f7f105a136a57eea5f4b3cfc6ce1b52720bd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - pillow >=8.3.2

tests:
  - python:
      imports:
        - imageio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/imageio/imageio
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Read and write images and video across all major formats. Supports scientific and volumetric data.
  description: |
    Read and write images and video across all major formats. Supports scientific and volumetric data.
  repository: https://github.com/imageio/imageio
  documentation: https://imageio.readthedocs.io

extra:
  recipe-maintainers:
    - anjos
    - almarklein
    - blink1073
    - jni

