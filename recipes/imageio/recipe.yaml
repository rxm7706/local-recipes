# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.37.0"

package:
  name: imageio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imageio/imageio-${{ version }}.tar.gz
  sha256: 71b57b3669666272c818497aebba2b4c5f20d5b37c81720e5e1a56d59c492996

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv
  python:
    entry_points:
      - imageio_download_bin = imageio.__main__:download_bin_main
      - imageio_remove_bin = imageio.__main__:remove_bin_main

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - numpy
    - pillow >=8.3.2

tests:
  - python:
      imports:
        - imageio
      pip_check: false
      python_version: ${{ python_min }}
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}
        - git
        - pytest
        - psutil
        - tifffile
        - gdal
        - astropy-base
        - freeimage
        - fsspec
        - requests
        - av
        - imageio-ffmpeg
    script:
      - imageio_download_bin -h
      - imageio_remove_bin -h
      - pytest -sv tests/ -k "not  (${{ tests_to_skip }})"

about:
  summary: A Python library for reading and writing image data
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://imageio.github.io
  repository: https://github.com/imageio/imageio
  documentation: https://imageio.readthedocs.io

extra:
  recipe-maintainers:
    - anjos
    - almarklein
    - blink1073
    - jni
