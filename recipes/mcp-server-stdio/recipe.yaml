# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.10"
  python_min: "3.13"

package:
  name: mcp-server-stdio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-server-stdio/mcp_server_stdio-${{ version }}.tar.gz
  sha256: d73c893469f51e751c528c40bae5d6373d10878221f53d45cb3cf21b707d434f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastmcp >=2.13.0
    - httpx >=0.28.1
    - python-dotenv >=1.2.1
    - starlette >=0.50.0

tests:
  - python:
      imports:
        - mcp_server_stdio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server-stdio/
  license: MIT
  license_file: LICENSE
  summary: MCP Server for Claude / Stdio transport
  description: |
    MCP Server for Claude / Stdio transport

extra:
  recipe-maintainers:
    - rxm7706

