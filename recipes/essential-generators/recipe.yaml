# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: essential-generators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/essential-generators/essential_generators-${{ version }}.tar.gz
  sha256: a4e015b01ea45cf32b9afe7fdfd239e9ad13654d1bfe2e4d9008204e62a1743d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - essential_generators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shane-mason/essential-document-generator
  license: MIT
  license_file: LICENSE
  summary: Generate fake data for application testing based on simple but flexible templates.
  description: |
    Generate fake data for application testing based on simple but flexible templates.

extra:
  recipe-maintainers:
    - rxm7706

