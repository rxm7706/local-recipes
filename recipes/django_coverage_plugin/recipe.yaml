# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: django_coverage_plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django_coverage_plugin/django_coverage_plugin-${{ version }}.tar.gz
  sha256: fcc507ee02f3a8f7c1d79b6eba1bafebb4a95b5055801987b715f4f88270c441

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - coverage

tests:
  - python:
      imports:
        - django_coverage_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python run_test.py

about:
  homepage: https://github.com/nedbat/django_coverage_plugin
  repository: https://github.com/nedbat/django_coverage_plugin
  documentation: http://coverage.readthedocs.io/en/latest/plugins.html
  license: Apache-2.0
  license_file:
    - LICENSE.txt
    - NOTICE.txt
  summary: A plugin for coverage.py to measure Django template execution
  description: A coverage.py plugin to measure the coverage of Django templates. Supported Python versions are 2.7, 3.4, 3.5 and 3.6. Supported Django versions are 1.8 through 1.11. Supported coverage.py versions are 4.0 and higher.

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

