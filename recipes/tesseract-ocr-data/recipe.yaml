# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6"

package:
  name: tesseract-ocr-data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tesseract-ocr-data/tesseract-ocr-data-${{ version }}.tar.gz
  sha256: a564b01b841ab9a5cd91693e9a6e817ab376114e56d36696a142115978010f7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tesseract_pack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tesseract-ocr-data/
  license: MIT
  license_file: license
  summary: Tesseract OCR traineddata files as a Python package
  description: |
    tesseract-ocr data for projects using it without having to install it.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
