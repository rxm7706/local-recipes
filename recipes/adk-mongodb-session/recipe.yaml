# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.9"

package:
  name: adk-mongodb-session
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/adk-mongodb-session/adk_mongodb_session-${{ version }}.tar.gz
  sha256: 305a3686b26a38f4f0ed1d593059c39984f8435d5362e768b615a48ade6af215

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - pymongo <5.0,>=4.7
    - google-adk >=1.15.1

tests:
  - python:
      imports:
        - adk_mongodb_session
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/adk-mongodb-session/
  license: MIT
  license_file: LICENSE
  summary: A project to integrate together Agent Development Kit (ADK) with MongoDB session management as backend storage.
  description: |
    A project to integrate together Agent Development Kit (ADK) with MongoDB session management as backend storage.

extra:
  recipe-maintainers:
    - rxm7706

