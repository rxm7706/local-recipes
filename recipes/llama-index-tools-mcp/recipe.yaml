# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: llama-index-tools-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-tools-mcp/llama_index_tools_mcp-${{ version }}.tar.gz
  sha256: 184b939f9c2dff966304c658a5865fd7a8bb03652b483c57c57ae61a97a646bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - mcp <3,>=2.0.0
    - pydantic <3,>=2.0.0

tests:
  - python:
      imports:
        - llama_index.tools.mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-tools-mcp/
  license: MIT
  license_file: LICENSE
  summary: llama-index tools mcp integration
  description: |
    llama-index tools mcp integration

extra:
  recipe-maintainers:
    - rxm7706

