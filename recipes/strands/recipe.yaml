# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: strands
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Strands/Strands-${{ version }}.tar.gz
  sha256: f43378968a607a273ea52e4001450bc0cd35f4464c7d2b0e633b182a6bc775a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - wheel
    - setuptools
  run:
    - python >=${{ python_min }}
    - cmake-build-extension
    - numpy

tests:
  - python:
      imports:
        - python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/twist-numerical/strands
  license: MIT
  license_file: LICENSE
  summary: "Strands - Standing waves approximations for the n-dimensional Schrödinger problem (with n = 2)."
  description: |
    "Strands - Standing waves approximations for the n-dimensional Schrödinger problem (with n = 2)."
  repository: https://github.com/twist-numerical/strands

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
