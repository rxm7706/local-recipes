# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: card-validator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Card-Validator/Card Validator-1.0.0.zip
  sha256: da869a62c51b7879d0477ca68d2a78348b52cdadb3d6ef89923240b8742bf5de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - card_validator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chetan92/CardValidator.git
  license: MIT
  license_file: LICENSE
  summary: Module to validate, generate and determine the format of card numbers.
  description: |
    Module to validate, generate and determine the format of card numbers.

extra:
  recipe-maintainers:
    - rxm7706

