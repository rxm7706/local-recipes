# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "22.0.0"

package:
  name: networking-sfc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/networking-sfc/networking_sfc-${{ version }}.tar.gz
  sha256: 9ee3e174043af8472f3d68a006dc4281c7d5ecd4bd723a2cfd28fcf167f8f981

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.0.0
    - setuptools >=64.0.0
  run:
    - python >=${{ python_min }}
    - pbr >=4.0.0
    - netaddr >=0.7.18
    - python-neutronclient >=10.0.0
    - sqlalchemy >=2.0.0
    - alembic >=0.9.6
    - stevedore >=1.20.0
    - oslo.config >=8.0.0
    - oslo.i18n >=3.20.0
    - oslo.log >=4.3.0
    - oslo.messaging >=12.4.0
    - oslo.serialization >=2.25.0
    - oslo.utils >=4.5.0
    - neutron-lib >=2.19.0
    - neutron >=27.0.0.0b1

tests:
  - python:
      imports:
        - networking_sfc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/networking-sfc/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: APIs and implementations to support Service Function Chaining in Neutron.
  description: |
    APIs and implementations to support Service Function Chaining in Neutron.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
