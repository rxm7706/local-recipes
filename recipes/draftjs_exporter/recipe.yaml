# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: draftjs_exporter
  version: "7.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/draftjs_exporter-${{ version }}.tar.gz
  sha256: ad27634d514f8bcfb828b19cfc84a8fee7cb1f0fd706d249f70633436272d687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.26,<0.12.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - draftjs_exporter
        - draftjs_exporter.engines
        - draftjs_exporter.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library to convert rich text from Draft.js raw ContentState to HTML
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/wagtail/draftjs_exporter
  repository: https://github.com/wagtail/draftjs_exporter
  documentation: https://wagtail.github.io/draftjs_exporter/

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - sannykr
