# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.21.0.post1"

package:
  name: ydf-tf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/y/ydf-tf/ydf_tf-2.21.0.post1-cp310-cp310-macosx_26_0_arm64.whl
  sha256: c317817166723aae5038362523a5f3c497970f09a9a998677b8f5e8f7e7ca6a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tensorflow ==2.21.0
    - ydf

tests:
  - python:
      imports:
        - ydf_tf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/yggdrasil-decision-forests
  license: Apache-2.0
  license_file: LICENSE
  summary: The custom op to export and serve YDF models in TensorFlow.
  description: |
    The custom op to export and serve YDF models in TensorFlow.

extra:
  recipe-maintainers:
    - rxm7706

