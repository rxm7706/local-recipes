# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: sphinx-rtd-dark-mode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-rtd-dark-mode/sphinx_rtd_dark_mode-${{ version }}.tar.gz
  sha256: 0272bf3d9ef620921adc67e5634a66969419e744da84ea18830adacfdb160ea8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx-rtd-theme

tests:
  - python:
      imports:
        - sphinx_rtd_dark_mode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MrDogeBro/sphinx_rtd_dark_mode
  license: MIT
  license_file: LICENSE
  summary: Dark mode for the Sphinx Read the Docs theme.
  description: |
    Dark mode for the Sphinx Read the Docs theme.

extra:
  recipe-maintainers:
    - rxm7706

