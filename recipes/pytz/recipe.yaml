# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.3.post1"

package:
  name: pytz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytz/pytz-${{ version }}.tar.gz
  sha256: 2211d3fcf9a797d3405cac96ac7f61d80e6a644f72a3309607282fe8a2010c5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pythonhosted.org/pytz
  license: MIT
  license_file: LICENSE.txt
  summary: World timezone definitions, modern and historical
  description: |
    World timezone definitions, modern and historical
  repository: https://github.com/stub42/pytz.git

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pytz
  cfe-upstream-registry: pypi
  cfe-upstream-name: pytz
  cfe-purls:
    - pkg:conda/pytz@${{ version }}?channel=conda-forge
    - pkg:pypi/pytz@${{ version }}
  cfe-upstream-repo: https://github.com/stub42/pytz.git
  cfe-upstream-homepage: http://pythonhosted.org/pytz
  cfe-import-names: [pytz]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pytz-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T04:35:31Z
