# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: ai-common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ai-common/ai-common-${{ version }}.tar.gz
  sha256: 4e402b832d93c8f01e80c91746d8451565b84f658eb2e543bba7ad5e0c7775ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ai_common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/TIKI-Institut/ai-common-python
  license: http://www.apache.org/licenses/LICENSE-2.0
  license_file: LICENSE
  summary: AI platform helper library
  description: |
    AI platform helper library

extra:
  recipe-maintainers:
    - rxm7706

