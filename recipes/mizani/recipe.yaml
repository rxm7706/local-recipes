# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.4"

package:
  name: mizani
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mizani/mizani-${{ version }}.tar.gz
  sha256: 28934d91516d922d7cb0382c82a6c513692abc0174c42a50294ae571520633f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.5
    - scipy >=1.8.0
    - pandas >=2.2.0

tests:
  - python:
      imports:
        - mizani
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mizani.readthedocs.io/en/stable
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Scales for Python
  description: |
    Scales for Python

extra:
  recipe-maintainers:
    - pmlandwehr
    - has2k1

#### CFE metadata AND comments
