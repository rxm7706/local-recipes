# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ragas
  version: "0.4.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ragas-${{ version }}.tar.gz
  sha256: 1eb1f61dbc8613ad014fdb8d630cbe9a1caec1ea01664a106993cb756128c001

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - pip
  run:
    - networkx
    - scikit-network
    - gitpython
    - instructor
    - pillow >=10.4.0
    - rich
    - tqdm
    - typer
    - diskcache >=5.6.3
    - pydantic >=2.0.0
    - python >=${{ python_min }}
    - numpy >=1.21.0,<3.0.0
    - datasets >=4.0.0
    - tiktoken
    - langchain
    - langchain-core
    - langchain-community
    - langchain-openai
    - openai >=1.0.0
    - pysbd >=0.3.4
    - nest-asyncio
    - appdirs
    - nltk
    - llama-index
    - git

tests:
  - python:
      imports:
        - ragas
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Evaluation framework for your Retrieval Augmented Generation (RAG) pipelines
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/explodinggradients/ragas/

extra:
  recipe-maintainers:
    - jan-janssen
