# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: ragas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ragas/ragas-${{ version }}.tar.gz
  sha256: 1eb1f61dbc8613ad014fdb8d630cbe9a1caec1ea01664a106993cb756128c001

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - numpy <3.0.0,>=1.21.0
    - datasets >=4.0.0
    - tiktoken
    - pydantic >=2.0.0
    - nest-asyncio
    - appdirs
    - diskcache >=5.6.3
    - typer
    - rich
    - openai >=1.0.0
    - tqdm
    - instructor
    - pillow >=10.4.0
    - networkx
    - scikit-network
    - langchain
    - langchain-core
    - langchain-community
    - langchain-openai

tests:
  - python:
      imports:
        - ragas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vibrantlabsai/ragas
  license: Apache-2.0
  license_file: LICENSE
  summary: Evaluation framework for RAG and LLM applications
  description: |
    Evaluation framework for RAG and LLM applications
  repository: https://github.com/vibrantlabsai/ragas
  documentation: https://docs.ragas.io

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ragas
  cfe-upstream-registry: pypi
  cfe-upstream-name: ragas
  cfe-purls:
    - pkg:conda/ragas@${{ version }}?channel=conda-forge
    - pkg:pypi/ragas@${{ version }}
  cfe-upstream-repo: https://github.com/vibrantlabsai/ragas
  cfe-upstream-homepage: https://github.com/vibrantlabsai/ragas
  cfe-import-names: [ragas]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ragas-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.4.3

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T02:03:23Z
