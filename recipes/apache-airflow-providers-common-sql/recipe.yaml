# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: apache-airflow-providers-common-sql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-common-sql/apache_airflow_providers_common_sql-${{ version }}.tar.gz
  sha256: 2c6053a2753596df2fce834da39d6095063dfae28f417291997b203b60692b9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.14.1
    - sqlparse >=0.5.1
    - more-itertools >=9.0.0
    - methodtools >=0.4.7

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-common-sql/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-common-sql for Apache Airflow
  description: |
    Provider package apache-airflow-providers-common-sql for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-common-sql/2.1.0

extra:
  recipe-maintainers:
    - xylar

