# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: forestci
  version: "0.8"
  sha256: be40301b2181d0f4381d2f7b55bde7ba869db540587e9ef770f7f677e0bcda77

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
    - numpy
    - scipy
  run:
    - python >=${{ python_min }}
    - scikit-learn
    - numpy
    - scipy

tests:
  - python:
      imports:
        - forestci
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  # The LICENSE.txt file is not in the MANIFEST.in, so this will fail when trying to build from the pypi tarball since it won't be there.
  # Comment out license_file line and add it once theMANIFEST.in has been patched upstream.
  #license_file: LICENSE.txt
  summary: calculate confidence intervals for scikit-learn random forest regression or classification objects
  description: |
    a Python module for calculating variance and adding confidence intervals to scikit-learn
    random forest regression or classification objects. The core functions calculate an in-bag and
    error bars for random forest objects
  homepage: https://github.com/scikit-learn-contrib/forest-confidence-interval
  repository: https://github.com/scikit-learn-contrib/forest-confidence-interval
  documentation: http://contrib.scikit-learn.org/forest-confidence-interval/

extra:
  recipe-maintainers:
    - pavelzw
    - arokem
    - kpolimis
