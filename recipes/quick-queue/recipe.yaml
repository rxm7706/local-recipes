# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: quick-queue
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quick-queue/quick-queue-${{ version }}.tar.gz
  sha256: e8a796b63ad99e90fb9815627815cbe0d7b15f407b71e2f417259316f8840b0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - quick_queue
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Invarato/sort_in_disk_project
  license: MIT
  license_file: LICENSE
  summary: Quick Multiprocessing Queue for Python (Wrap of multiprocessing.queue to increase data transfer velocity between processes)
  description: |
    Quick Multiprocessing Queue for Python (Wrap of multiprocessing.queue to increase data transfer velocity between processes)

extra:
  recipe-maintainers:
    - rxm7706

