# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: knot-floer-homology
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/k/knot-floer-homology/knot_floer_homology-1.2.2-cp310-cp310-macosx_10_9_universal2.whl
  sha256: b5405ca8041653037549bea0db5c215b7e84a244aaf61081f7011dfa943f8e71

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - knot_floer_homology
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/knot_floer_homology
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python wrapper for Zoltán Szabó's HFK Calculator
  description: |
    Python wrapper for Zoltán Szabó's HFK Calculator

extra:
  recipe-maintainers:
    - rxm7706

