# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: camelcase
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/camelcase/camelcase-${{ version }}.tar.gz
  sha256: cb416a1f5ee10473120ac49303a5b927b879c74de9624ebe2764b8cd26791ee2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - camelcase
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.craigaddyman.com
  license: MIT
  license_file: LICENSE
  summary: Converts a string to Camel Case
  description: |
    Converts a string to Camel Case

extra:
  recipe-maintainers:
    - rxm7706

