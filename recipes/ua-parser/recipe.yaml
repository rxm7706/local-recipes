# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ua-parser
  version: "1.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ua_parser-${{ version }}.tar.gz
  sha256: bab404ad42fb37f943107da2f6003ffc79724d11cc95076a7a539513371779da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
    - pyyaml
  run:
    - python >=${{ python_min }}
    - ua-parser-builtins

tests:
  - python:
      imports:
        - ua_parser
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python port of Browserscope's user agent parser
  homepage: https://github.com/ua-parser/uap-python
  repository: https://github.com/ua-parser/uap-python

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
