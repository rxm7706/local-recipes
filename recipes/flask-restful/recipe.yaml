# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.10"

package:
  name: flask-restful
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-RESTful/Flask-RESTful-${{ version }}.tar.gz
  sha256: fe4af2ef0027df8f9b4f797aba20c5566801b6ade995ac63b588abf1a59cec37

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aniso8601
    - flask
    - six
    - pytz

tests:
  - python:
      imports:
        - flask_restful
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.github.com/flask-restful/flask-restful/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple framework for creating REST APIs
  description: |
    Simple framework for creating REST APIs
  repository: https://github.com/flask-restful/flask-restful

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

#### CFE metadata AND comments
