# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: Flask-RESTful
  version: "0.3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fe4af2ef0027df8f9b4f797aba20c5566801b6ade995ac63b588abf1a59cec37

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - aniso8601 >=0.82
    - flask >=0.8
    - six >=1.3.0
    - pytz

tests:
  - python:
      imports:
        - flask_restful
        - flask_restful.representations
        - flask_restful.utils
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple framework for creating REST APIs
  homepage: https://www.github.com/flask-restful/flask-restful/
  repository: https://www.github.com/flask-restful/flask-restful/
  documentation: https://flask-restful.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
