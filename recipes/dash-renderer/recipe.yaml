# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.1"

package:
  name: dash-renderer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-renderer/dash_renderer-${{ version }}.tar.gz
  sha256: 73a69e3d145880e68e42723ad10182251d92b44f3efe92b8763145cfd2158e7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dash_renderer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dash-renderer/
  license: MIT
  license_file: LICENSE
  summary: Front-end component renderer for Dash
  description: |
    Front-end component renderer for Dash

extra:
  recipe-maintainers:
    - moorepants

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dash-renderer
