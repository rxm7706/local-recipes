# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.10.0"

package:
  name: oslo.vmware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.vmware/oslo_vmware-${{ version }}.tar.gz
  sha256: 429a2264204151ae5075dbc0466cf65450e41a89acae4d067408212a22f58a2d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - pbr !=2.1.0,>=2.0.0
    - oslo.i18n >=3.15.3
    - oslo.utils >=3.33.0
    - lxml >=4.5.0
    - suds-community >=0.6
    - requests >=2.14.2
    - urllib3 >=2.0.0
    - oslo.concurrency >=3.26.0
    - oslo.context >=2.19.2
    - oslo.service >=4.3.0

tests:
  - python:
      imports:
        - oslo_vmware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.vmware
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo VMware library
  description: |
    Oslo VMware library
  repository: https://opendev.org/openstack/oslo.vmware

extra:
  recipe-maintainers:
    - rxm7706

