# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.23.0"

package:
  name: weaviate-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/weaviate-client/weaviate_client-${{ version }}.tar.gz
  sha256: 19cc336b4c9e58f06cf01cb9aff8f6d8c0fe747f2e80192a9871c63823e8b18d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65
  run:
    - python >=${{ python_min }}
    - httpx <0.29.0,>=0.26.0
    - validators <1.0.0,>=0.34.0
    - authlib <2.0.0,>=1.6.7
    - pydantic <3.0.0,>=2.12.0
    - grpcio <1.80.0,>=1.59.5
    - protobuf <7.0.0,>=4.21.6
    - packaging >=21.0

tests:
  - python:
      imports:
        - weaviate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/weaviate/weaviate-python-client
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A python native Weaviate client
  description: |
    A python native Weaviate client
  repository: https://github.com/weaviate/weaviate-python-client
  documentation: https://weaviate-python-client.readthedocs.io

extra:
  recipe-maintainers:
    - xylar

