# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: drf-oidc-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/drf-oidc-auth/drf-oidc-auth-${{ version }}.tar.gz
  sha256: 9b3ee051e86709f2bb8bb9a7e9bb975b7d9a1cf2c55cadcdd5b6889454f99075

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - authlib
    - cryptography
    - django
    - djangorestframework
    - requests

tests:
  - python:
      imports:
        - oidc_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ByteInternet/drf-oidc-auth
  license: MIT
  license_file: LICENSE
  summary: OpenID Connect authentication for Django Rest Framework
  description: |
    OpenID Connect authentication for Django Rest Framework

extra:
  recipe-maintainers:
    - rxm7706

