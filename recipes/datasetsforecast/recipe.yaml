# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: datasetsforecast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datasetsforecast/datasetsforecast-${{ version }}.tar.gz
  sha256: 193d0f61fd45bbe20c744735c6d3db609bc34010e167f48b991467c1c52450a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7.19,<1.0.0
  run:
    - python >=${{ python_min }}
    - aiohttp
    - numpy
    - scikit-learn
    - pandas <3.0.0
    - requests
    - tqdm
    - utilsforecast >=0.0.8
    - xlrd >=1.0.0

tests:
  - python:
      imports:
        - datasetsforecast
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Nixtla/datasetsforecast
  license: MIT
  license_file: LICENSE
  summary: Datasets for Time series forecasting
  description: |
    Datasets for Time series forecasting
  repository: https://github.com/Nixtla/datasetsforecast
  documentation: https://nixtlaverse.nixtla.io/datasetsforecast/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
