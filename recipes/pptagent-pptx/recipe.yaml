# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: pptagent-pptx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pptagent-pptx/pptagent_pptx-${{ version }}.tar.gz
  sha256: 1b23c4eb1fac2a5ef5aaedd5b4273d814d159168663609a3601accd40bf715dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - pillow >=3.3.2
    - xlsxwriter >=0.5.7
    - lxml >=3.1.0
    - typing_extensions >=4.9.0

tests:
  - python:
      imports:
        - pptagent_pptx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Force1ess/python-pptx
  license: MIT
  license_file: LICENSE
  summary: Create, read, and update PowerPoint 2007+ (.pptx) files.
  description: |
    Create, read, and update PowerPoint 2007+ (.pptx) files.
  repository: https://github.com/Force1ess/python-pptx
  documentation: https://python-pptx.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
