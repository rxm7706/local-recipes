# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: mypy-extensions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mypy-extensions/mypy_extensions-${{ version }}.tar.gz
  sha256: 52e68efc3284861e772bbcd66823fde5ae21fd2fdb51c62a211403730b916558

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mypy_extensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/mypy_extensions
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Type system extensions for programs checked with the mypy type checker.
  description: |
    Type system extensions for programs checked with the mypy type checker.

extra:
  recipe-maintainers:
    - nehaljwani
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mypy_extensions
  cfe-upstream-registry: pypi
