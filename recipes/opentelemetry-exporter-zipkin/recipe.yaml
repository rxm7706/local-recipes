# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.45.1"

package:
  name: opentelemetry-exporter-zipkin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-zipkin/opentelemetry_exporter_zipkin-${{ version }}.tar.gz
  sha256: 4e28ad817929b70ac71c717005600b9913ae6ad7c18a5527d918fe3c9314f11b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-exporter-zipkin-json ==1.45.1
    - opentelemetry-exporter-zipkin-proto-http ==1.45.1

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.exporter.zipkin
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Zipkin Span Exporters for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-zipkin

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

