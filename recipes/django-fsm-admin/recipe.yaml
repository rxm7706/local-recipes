# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-fsm-admin
  version: "1.2.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-fsm-admin-${{ version }}.tar.gz
  sha256: 74fa2038fdab8072077e18234593fd809d3940216a3e90e3f1ea432ee2992938

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.11
    - django >=1.6
    - django-fsm >=2.1.0

tests:
  - python:
      imports:
        - fsm_admin
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Integrate django-fsm state transitions into the django admin
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/gadventures/django-fsm-admin

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
