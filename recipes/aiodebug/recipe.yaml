# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: aiodebug
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/aiodebug/aiodebug-2.3.0-py3-none-any.whl
  sha256: ed408cd90869b395f5bc642acffcbaed3b2668e89b40e684a95e0fb60a3257cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - aiodebug
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/quantlane/libs/aiodebug
  license: Apache-2.0
  license_file: LICENSE
  summary: A tiny library for monitoring and testing asyncio programs
  description: |
    A tiny library for monitoring and testing asyncio programs

extra:
  recipe-maintainers:
    - rxm7706

