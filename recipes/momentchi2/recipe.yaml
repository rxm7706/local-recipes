# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.8"

package:
  name: momentchi2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/momentchi2/momentchi2-${{ version }}.tar.gz
  sha256: 95d4becfd181d447c0281292c5827d74a09b04c38bd312da48a8a08932e8de1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - scipy
    - numpy

tests:
  - python:
      imports:
        - momentchi2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/momentchi2
  license: MIT
  license_file: LICENSE
  summary: A collection of methods for computing the cdf of a weighted sum of chi-squared random variables.
  description: |
    A collection of methods for computing the cdf of a weighted sum of chi-squared random variables.

extra:
  recipe-maintainers:
    - martinRenou

