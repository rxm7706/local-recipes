# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: momentchi2
  version: "0.1.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/momentchi2-${{ version }}.tar.gz
  sha256: 95d4becfd181d447c0281292c5827d74a09b04c38bd312da48a8a08932e8de1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - scipy >=1
    - numpy >=1

tests:
  - python:
      imports:
        - momentchi2
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A collection of methods for computing the cdf of a weighted sum of chi-squared random variables.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/deanbodenham/momentchi2py

extra:
  recipe-maintainers:
    - martinRenou
