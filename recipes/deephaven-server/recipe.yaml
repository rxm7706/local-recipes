# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "42.4"

package:
  name: deephaven-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/d/deephaven-server/deephaven_server-42.4-py3-none-any.whl
  sha256: 00c76da0af0076ef952dda93a0f10de4ae239acc5939e782076bee369b16639f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jpy >=2.1.0
    - java-utilities
    - deephaven-core ==42.4
    - click >=8.1.7

tests:
  - python:
      imports:
        - deephaven_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deephaven.io/
  license: MIT
  license_file: LICENSE
  summary: Deephaven Embedded Server Python Package
  description: |
    Deephaven Embedded Server Python Package

extra:
  recipe-maintainers:
    - rxm7706

