# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: usaddress-scourgify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/usaddress-scourgify/usaddress_scourgify-${{ version }}.tar.gz
  sha256: cb5aec6c1bfe4458dd90f87eaad602c334c0d17233d3f386537e3a492fc6421e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - usaddress >=0.5.9
    - yaml-config >=0.1.2

tests:
  - python:
      imports:
        - scourgify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GreenBuildingRegistry/usaddress-scourgify
  license: MIT
  license_file: LICENSE
  summary: Clean US addresses following USPS pub 28 and RESO guidelines
  description: |
    Clean US addresses following USPS pub 28 and RESO guidelines

extra:
  recipe-maintainers:
    - rxm7706

