# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: python-ipware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-ipware/python_ipware-${{ version }}.tar.gz
  sha256: 9117b1c4dddcb5d5ca49e6a9617de2fc66aec2ef35394563ac4eecabdf58c062

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_ipware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-ipware/
  license: MIT
  license_file: LICENSE
  summary: A Python package to retrieve user's IP address
  description: |
    A Python package to retrieve user's IP address
  repository: https://github.com/un33k/python-ipware
  documentation: https://github.com/un33k/python-ipware#readme

extra:
  recipe-maintainers:
    - swainn

