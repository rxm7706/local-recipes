# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: gorilla
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gorilla/gorilla-${{ version }}.tar.gz
  sha256: 005ab8853b037162a7c77bb824604c6e081878ee03c09ad01ef41744856019d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gorilla
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/christophercrouzet/gorilla
  license: MIT
  license_file: LICENSE
  summary: Convenient approach to monkey patching
  description: |
    Convenient approach to monkey patching

extra:
  recipe-maintainers:
    - xhochy

