# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.4"

package:
  name: truststore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/truststore/truststore-${{ version }}.tar.gz
  sha256: 9d91bd436463ad5e4ee4aba766628dd6cd7010cf3e2461756b3303710eebc301

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - truststore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/truststore/
  license: MIT
  license_file: LICENSE
  summary: Verify certificates using native system trust stores
  description: |
    Verify certificates using native system trust stores
  repository: https://github.com/sethmlarson/truststore
  documentation: https://truststore.readthedocs.io

extra:
  recipe-maintainers:
    - wolfv

