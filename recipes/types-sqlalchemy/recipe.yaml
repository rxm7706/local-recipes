# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.53.38"

package:
  name: types-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-SQLAlchemy/types-SQLAlchemy-${{ version }}.tar.gz
  sha256: 5bb7463537e04e1aa5a3557eb725930df99226dcfd3c9bf93008025bfe5c169e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for SQLAlchemy
  description: |
    Typing stubs for SQLAlchemy
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - rxm7706

