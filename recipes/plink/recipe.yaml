# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.9"

package:
  name: plink
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plink/plink-${{ version }}.tar.gz
  sha256: faa9988597499a758da00e96d77ba971d27e13415bf79b49e4baa2d5fa7a79dd
  patches:
    - patches/0001-skip-sphinx-docs-on-wheel.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - plink
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/PLink
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: A full featured Tk-based knot and link editor
  description: |
    A full featured Tk-based knot and link editor

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: plink
  cfe-upstream-registry: pypi
  cfe-upstream-name: plink
  cfe-purls:
    - pkg:conda/plink@${{ version }}?channel=conda-forge
    - pkg:pypi/plink@${{ version }}
  cfe-upstream-repo: https://github.com/3-manifolds/PLink
  cfe-upstream-homepage: https://github.com/3-manifolds/PLink
  cfe-import-names: [plink]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T17:12:42Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T17:12:42Z
  cfe-local-build-status: not-attempted
