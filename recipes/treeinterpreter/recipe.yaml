# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: treeinterpreter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/treeinterpreter/treeinterpreter-${{ version }}.tar.gz
  sha256: da5c24f802f7d072bc457b6e4b289d5ee41961ce33437e8dc439a2cfd9c6d994

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - treeinterpreter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andosa/treeinterpreter
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Package for interpreting scikit-learn's decision tree and random forest predictions.
  description: |
    Package for interpreting scikit-learn's decision tree and random forest predictions.

extra:
  recipe-maintainers:
    - philip-khor

