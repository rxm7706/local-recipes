# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: mongo-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mongo-mcp/mongo_mcp-${{ version }}.tar.gz
  sha256: 591c4db178c293a6e1106e1e33e0fd6005e96d3948902cc5b2eeda8e4e1291ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - fastmcp >=0.3.4
    - pymongo >=4.5.0

tests:
  - python:
      imports:
        - mongo_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/441126098/mongo-mcp
  license: MIT
  license_file: LICENSE
  summary: MCP service for MongoDB operations
  description: |
    MCP service for MongoDB operations
  repository: https://github.com/441126098/mongo-mcp

extra:
  recipe-maintainers:
    - rxm7706

