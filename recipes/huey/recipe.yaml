# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.4"

package:
  name: huey
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/huey/huey-${{ version }}.tar.gz
  sha256: 6de196c6ece2e38b5173f7510600091ab035c0e86b0958d0e5b38a82b9984666

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - huey
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/huey/
  license: MIT
  license_file: LICENSE
  summary: a little task queue
  description: |
    a little task queue
  repository: https://github.com/coleifer/huey
  documentation: https://huey.readthedocs.io/

extra:
  recipe-maintainers:
    - kwilcox
    - synapticarbors

#### CFE metadata AND comments
