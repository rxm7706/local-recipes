# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: bcdoc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bcdoc/bcdoc-${{ version }}.tar.gz
  sha256: f568c182e06883becf7196f227052435cffd45604700c82362ca77d3427b6202

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.8.0,<2.0.0
    - docutils >=0.10

tests:
  - python:
      imports:
        - bcdoc
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: ReST document generation tools for botocore.
  homepage: https://github.com/boto/bcdoc

extra:
  recipe-maintainers:
    - pmlandwehr
    - mgorny
