# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.2"

package:
  name: openbb-federal-reserve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-federal-reserve/openbb_federal_reserve-${{ version }}.tar.gz
  sha256: d6bd86e4aa6af5944036bd54802f4c17cfd5de215352e46ceec007bbf69cdaae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 <5.0.0,>=4.13.4
    - openbb-core <2.0.0,>=1.6.10
    - openbb-economy <2.0.0,>=1.6.1
    - openbb-fixedincome <2.0.0,>=1.6.1
    - openbb-platform-api <2.0.0,>=1.3.5
    - openpyxl <4.0.0,>=3.1.5

tests:
  - python:
      imports:
        - openbb_federal_reserve
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-federal-reserve/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: US Federal Reserve Data Extension for OpenBB
  description: |
    US Federal Reserve Data Extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

