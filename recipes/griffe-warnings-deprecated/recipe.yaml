# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: griffe-warnings-deprecated
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/griffe-warnings-deprecated/griffe_warnings_deprecated-${{ version }}.tar.gz
  sha256: 9261369bf2acb8b5d24a0dc7895cce788208513d4349031d4ea315b979b2e99f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - griffelib >=2.0

tests:
  - python:
      imports:
        - griffe_warnings_deprecated
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mkdocstrings.github.io/griffe-warnings-deprecated
  license: ISC
  license_file: LICENSE
  summary: Griffe extension for `@warnings.deprecated` (PEP 702).
  description: |
    Griffe extension for `@warnings.deprecated` (PEP 702).
  repository: https://github.com/mkdocstrings/griffe-warnings-deprecated
  documentation: https://mkdocstrings.github.io/griffe-warnings-deprecated

extra:
  recipe-maintainers:
    - rxm7706

