# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jproperties
  version: "2.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jproperties-${{ version }}.tar.gz
  sha256: 036fcd52c10a8a1c21e6fa2a1c292c93892e759b76490acc4809213a36ddc329

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - propconv = jproperties:main

requirements:
  host:
    - pip
    - setuptools_scm ~= 3.3
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - six ~=1.13

tests:
  - python:
      imports:
        - jproperties
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Java Property file parser and writer for Python
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/Tblue/python-jproperties

extra:
  recipe-maintainers:
    - kellend-git
