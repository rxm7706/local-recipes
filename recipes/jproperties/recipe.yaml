# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2"

package:
  name: jproperties
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jproperties/jproperties-${{ version }}.tar.gz
  sha256: 036fcd52c10a8a1c21e6fa2a1c292c93892e759b76490acc4809213a36ddc329

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six ~=1.13

tests:
  - python:
      imports:
        - jproperties
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Tblue/python-jproperties
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Java Property file parser and writer for Python
  description: |
    Java Property file parser and writer for Python

extra:
  recipe-maintainers:
    - kellend-git

#### CFE metadata AND comments
