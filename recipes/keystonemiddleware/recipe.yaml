# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.0.0"

package:
  name: keystonemiddleware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keystonemiddleware/keystonemiddleware-${{ version }}.tar.gz
  sha256: 2b52b2f840bee72568666e69f9cf82b9ce1558d6124ce25f0f262083494b4b19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - keystoneauth1 >=3.12.0
    - oslo.cache >=3.11.0
    - oslo.config >=5.2.0
    - oslo.context >=2.19.2
    - oslo.i18n >=3.15.3
    - oslo.log >=3.36.0
    - oslo.serialization >=2.18.0
    - oslo.utils >=3.33.0
    - pbr >=2.0.0
    - pycadf >=1.1.0
    - pyjwt >=2.4.0
    - python-keystoneclient >=3.20.0
    - requests >=2.14.2
    - webob >=1.7.1

tests:
  - python:
      imports:
        - keystonemiddleware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/keystonemiddleware/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: Middleware for OpenStack Identity
  description: |
    Middleware for OpenStack Identity

extra:
  recipe-maintainers:
    - rxm7706

