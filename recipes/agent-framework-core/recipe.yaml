# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1"

package:
  name: agent-framework-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-framework-core/agent_framework_core-${{ version }}.tar.gz
  sha256: 98131b69870253083c007d5d06a329ea85095db0865f07fc55c10466aa736cf5

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4.0,>=3.11
  run:
    - python >=${{ python_min }}
    - typing_extensions <5,>=4.15.0
    - pydantic <3,>=2
    - python-dotenv <2,>=1
    - opentelemetry-api <2,>=1.39.0

tests:
  - python:
      imports:
        - agent_framework
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: |
    Microsoft Agent Framework for building AI Agents with Python. This is the core package that has all the core abstractions and implementations.
  homepage: https://pypi.org/project/agent-framework-core/
  repository: https://github.com/microsoft/agent-framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
    - mgorny
