# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.1"

package:
  name: datasets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datasets/datasets-${{ version }}.tar.gz
  sha256: ce22bb851efd7494f08aad33b940803784434f6e77763d00679a0dc45fcf686a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - filelock
    - numpy >=1.17
    - pyarrow >=21.0.0
    - dill <0.4.2,>=0.3.0
    - pandas
    - requests >=2.32.2
    - httpx <1.0.0
    - tqdm >=4.66.3
    - python-xxhash
    - multiprocess <0.70.20
    - fsspec <=2026.6.0,>=2023.1.0
    - huggingface-hub <2.0,>=0.25.0
    - packaging
    - pyyaml >=5.1

tests:
  - python:
      imports:
        - datasets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/datasets
  license: Apache-2.0
  license_file: LICENSE
  summary: HuggingFace community-driven open-source library of datasets
  description: |
    HuggingFace community-driven open-source library of datasets

extra:
  recipe-maintainers:
    - oblute
    - Tata17
    - thewchan
    - mxr-conda

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: datasets
