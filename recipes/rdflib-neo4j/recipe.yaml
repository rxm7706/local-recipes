# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: rdflib-neo4j
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rdflib-neo4j/rdflib_neo4j-${{ version }}.tar.gz
  sha256: 423435ee44c9375da713c522e6ce4d69d80e8e7177660ac6939514a73bd14ac1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rdflib >=7.0.0
    - neo4j >=5.0.0

tests:
  - python:
      imports:
        - rdflib_neo4j
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/neo4j-labs/rdflib-neo4j
  license: MIT
  license_file: LICENSE
  summary: RDFLib Store backed by neo4j
  description: |
    RDFLib Store backed by neo4j

extra:
  recipe-maintainers:
    - rxm7706

