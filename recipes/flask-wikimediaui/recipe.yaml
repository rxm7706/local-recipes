# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: flask-wikimediaui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-wikimediaui/flask-wikimediaui-${{ version }}.tar.gz
  sha256: 5f15e5f271146cb55f55a81dd8862d5db2aa4282e094a497149802b442dc8e9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_wikimediaui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/flask-wikimediaui
  license: MIT
  license_file: LICENSE
  summary: This library provides python Flask utilities and static assets for rendering Wikimedia UI elements
  description: |
    This library provides python Flask utilities and static assets for rendering Wikimedia UI elements

extra:
  recipe-maintainers:
    - rxm7706

