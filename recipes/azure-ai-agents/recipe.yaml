# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: azure-ai-agents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-ai-agents/azure_ai_agents-${{ version }}.tar.gz
  sha256: eb9d7226282d03206c3fab3f3ee0a2fc71e0ad38e52d2f4f19a92c56ed951aea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-core >=1.30.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk
  license: MIT
  license_file: LICENSE
  summary: Microsoft Corporation Azure AI Agents Client Library for Python
  description: |
    Microsoft Corporation Azure AI Agents Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
