# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.5"

package:
  name: dynaconf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dynaconf/dynaconf-${{ version }}.tar.gz
  sha256: a08f6ab44025034ef3c9f86b32548ab01efd4039094a74bd9f028a43c63d016f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dynaconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dynaconf/dynaconf
  license: MIT
  license_file: LICENSE
  summary: The dynamic configurator for your Python Project
  description: |
    The dynamic configurator for your Python Project

extra:
  recipe-maintainers:
    - carlodri

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dynaconf
  cfe-upstream-registry: pypi
  cfe-upstream-name: dynaconf
  cfe-purls:
    - pkg:conda/dynaconf@${{ version }}?channel=conda-forge
    - pkg:pypi/dynaconf@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/dynaconf/dynaconf
  cfe-import-names: [dynaconf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/dynaconf-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
