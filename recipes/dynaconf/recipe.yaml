# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dynaconf
  version: "3.3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a08f6ab44025034ef3c9f86b32548ab01efd4039094a74bd9f028a43c63d016f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dynaconf=dynaconf.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dynaconf
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - dynaconf --help

about:
  license: MIT
  license_file: LICENSE
  summary: The dynamic configurator for your Python Project
  homepage: https://www.dynaconf.com/
  repository: https://github.com/dynaconf/dynaconf/
  documentation: https://www.dynaconf.com/

extra:
  recipe-maintainers:
    - carlodri
