# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: ulid-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/ulid-py/ulid-py-${{ version }}.tar.gz
  sha256: dc6884be91558df077c3011b9fb0c87d1097cb8fc6534b11f310161afd5738f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ulid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ahawker/ulid
  license: Apache-2.0
  license_file: LICENSE
  summary: Universally Unique Lexicographically Sortable Identifier
  description: |
    Universally Unique Lexicographically Sortable Identifier

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
