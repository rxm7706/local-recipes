# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.3"

package:
  name: apache-airflow-providers-smtp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-smtp/apache_airflow_providers_smtp-${{ version }}.tar.gz
  sha256: 3f72dfbe41d5e0a04da2bc9d94c92a52d3625c58108345dbb9d281e55cd27d9d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.10.1
    - aiosmtplib >=0.1.6

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-smtp/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-smtp for Apache Airflow
  description: |
    Provider package apache-airflow-providers-smtp for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-smtp/3.0.3

extra:
  recipe-maintainers:
    - xylar

