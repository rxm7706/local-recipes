# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1.7"

package:
  name: cachetools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cachetools/cachetools-${{ version }}.tar.gz
  sha256: a3e2a00b14d8f8a6b70c1dae7b4685e7ad3bc965c5b42124a2d6ce895da6cf50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - setuptools-scm >=8.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cachetools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tkem/cachetools/
  license: MIT
  license_file: LICENSE
  summary: Extensible memoizing collections and decorators
  description: |
    Extensible memoizing collections and decorators
  repository: https://github.com/tkem/cachetools/
  documentation: https://cachetools.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - rxm7706
    - maartenbreddels
    - marcelotrevisani

