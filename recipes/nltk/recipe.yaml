# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.3"

package:
  name: nltk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nltk/nltk-${{ version }}.tar.gz
  sha256: bb9327a461c3811c2fa4900e03840401f2126adfb30c0072827c433bd2444ea4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - defusedxml
    - click
    - joblib
    - regex >=2021.8.3
    - tqdm

tests:
  - python:
      imports:
        - nltk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.nltk.org/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Natural Language Toolkit
  description: |
    Natural Language Toolkit
  repository: https://github.com/nltk/nltk
  documentation: https://www.nltk.org/

extra:
  recipe-maintainers:
    - jan-janssen
    - quartox
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nltk
  cfe-upstream-registry: pypi
