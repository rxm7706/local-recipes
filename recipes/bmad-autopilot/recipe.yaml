# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: bmad-autopilot
  version: ${{ version }}

source:
  url: https://github.com/martin-janci/autopilot/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 61ea36bb3428d638a1a207eab81cdcb8080d36b27e5e9ff27f3b2c895499e50f

build:
  number: 0
  noarch: generic
  script: bash ${{ RECIPE_DIR }}/build.sh
  # The tool is a bash orchestrator (upstream install.sh + scripts/*.sh);
  # unix-only by nature — skip the win CI leg rather than produce an
  # empty build.
  skip:
    - win

requirements:
  run:
    # The orchestrator is a bash loop (scripts/bmad-autopilot.sh + install.sh)
    # shelling out to these tools; the `claude` CLI is also required at runtime
    # but is not packaged on conda-forge.
    - git
    - gh
    - jq
    - ripgrep
    - zip
    - if: unix
      then:
        - __unix

tests:
  - if: unix
    then:
      script:
        - test -x "${PREFIX}/share/bmad-autopilot/install.sh"
        - test -x "${PREFIX}/bin/bmad-autopilot-install"
        - test -d "${PREFIX}/share/bmad-autopilot/skills/bmad-autopilot"
        - test -d "${PREFIX}/share/bmad-autopilot/skills/gh-pr-handling"
        - test -f "${PREFIX}/share/bmad-autopilot/commands/bmad-autopilot.md"
        - test -f "${PREFIX}/share/bmad-autopilot/scripts/bmad-autopilot.sh"
        - test -f "${PREFIX}/share/bmad-autopilot/VERSION"

about:
  homepage: https://github.com/martin-janci/autopilot
  repository: https://github.com/martin-janci/autopilot
  license: MIT
  license_file: LICENSE
  summary: Community BMAD autopilot — epic-granular bash orchestrator with PR-lifecycle automation
  description: |
    bmad-autopilot (upstream repo martin-janci/autopilot) is an independent
    community orchestrator for BMAD implementation phases: a bash loop that
    drives Claude Code through epic-granular story implementation and then
    automates the PR lifecycle — create PR, watch CI, respond to review
    comments, auto-merge (skills + commands + a GitHub auto-approve
    workflow).

    NOTE: no affiliation with bmad-code-org; it predates and is
    architecturally superseded by the official bmad-loop / bmad-dev-auto
    stack for story execution, but its PR-lifecycle coverage (create ->
    CI-watch -> auto-merge) is a capability bmad-loop deliberately stops
    short of.

    After installation, run ``bmad-autopilot-install <target-project-dir>``
    to deploy the skill bundle into a project (wraps the upstream
    install.sh; requires the ``claude`` CLI at runtime).

extra:
  recipe-maintainers:
    - rxm7706

