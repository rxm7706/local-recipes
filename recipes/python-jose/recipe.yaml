# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.0"

package:
  name: python-jose
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-jose/python_jose-${{ version }}.tar.gz
  sha256: fb4eaa44dbeb1c26dcc69e4bd7ec54a1cb8dd64d3b4d81ef08d90ff453f2b01b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=39.2.0
    - wheel >=0.29.0
  run:
    - python >=${{ python_min }}
    - ecdsa !=0.15
    - rsa !=4.1.1,!=4.4,<5.0,>=4.0
    - pyasn1 >=0.5.0

tests:
  - python:
      imports:
        - jose
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mpdavis/python-jose
  license: MIT
  license_file: LICENSE
  summary: JOSE implementation in Python
  description: |
    JOSE implementation in Python
  repository: https://github.com/mpdavis/python-jose/
  documentation: https://python-jose.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mariusvniekerk
    - dgasmith
    - swainn

#### CFE metadata AND comments
