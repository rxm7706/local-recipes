# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-instrumentation-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-sqlalchemy/opentelemetry_instrumentation_sqlalchemy-${{ version }}.tar.gz
  sha256: 8ec2e79f1e00808c5dc639ab5b2cfcdf9dcdef55efd6442c6019707fe2894028

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - sqlalchemy
    - opentelemetry-api ~=1.12
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - packaging >=21.0
    - wrapt >=1.11.2

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-sqlalchemy
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry SQLAlchemy instrumentation
  description: |
    OpenTelemetry SQLAlchemy instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

