# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: tkinter-gl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkinter-gl/tkinter_gl-${{ version }}.tar.gz
  sha256: 28226f8dbb9af893094ddaeb47f552455512b270b372cf2dedc5cad9638f9f84

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.0
    - setuptools-scm >=8.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tkinter_gl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/3-manifolds/tkinter_gl
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: A base class for GL rendering surfaces in tkinter.
  description: |
    A base class for GL rendering surfaces in tkinter.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
