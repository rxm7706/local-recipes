# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0"

package:
  name: zope.filerepresentation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.filerepresentation/zope_filerepresentation-${{ version }}.tar.gz
  sha256: 58604043795f98e37908912d53c7f582b42fc248314c31fab7df010cd3e889f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.schema

tests:
  - python:
      imports:
        - zope.filerepresentation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://zopefilerepresentation.readthedocs.io
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: File-system Representation Interfaces
  description: |
    File-system Representation Interfaces

extra:
  recipe-maintainers:
    - rxm7706

