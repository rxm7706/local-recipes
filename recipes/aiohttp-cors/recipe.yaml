# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: aiohttp-cors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiohttp-cors/aiohttp_cors-${{ version }}.tar.gz
  sha256: ccacf9cb84b64939ea15f859a146af1f662a6b1d68175754a07315e305fb1403

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.9

tests:
  - python:
      imports:
        - aiohttp_cors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aio-libs/aiohttp-cors
  license: Apache-2.0
  license_file: LICENSE
  summary: CORS support for aiohttp
  description: |
    CORS support for aiohttp

extra:
  recipe-maintainers:
    - carlodri

