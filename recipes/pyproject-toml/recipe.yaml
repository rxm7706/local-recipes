# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pyproject-toml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyproject-toml/pyproject_toml-${{ version }}.tar.gz
  sha256: 7772d26113fb8a5932880cf1c998987995bb10e834f0b7be5f46f6ea89f06450

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pyproject-toml >=0.0.12
    - pydantic >=2.9.2
    - tomli >=2.1.0
  run:
    - python >=${{ python_min }}
    - setuptools
    - wheel >=0.45.0
    - pydantic >=2.9.2
    - packaging >=24.2
    - tomli >=2.1.0

tests:
  - python:
      imports:
        - pyproject_toml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyproject-toml/pyproject-toml
  license: MIT
  license_file: LICENSE
  summary: Project intend to implement PEP 517, 518, 621, 631 and so on.
  description: |
    Project intend to implement PEP 517, 518, 621, 631 and so on.

extra:
  recipe-maintainers:
    - rxm7706

