# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: sphinxcontrib-devhelp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-devhelp/sphinxcontrib_devhelp-${{ version }}.tar.gz
  sha256: 411f5d96d445d1d73bb5d52133377b4248ec79db5c793ce7dbe59e074b4dd1ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sphinxcontrib.devhelp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sphinx-doc.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: sphinxcontrib-devhelp is a sphinx extension which outputs Devhelp documents
  description: |
    sphinxcontrib-devhelp is a sphinx extension which outputs Devhelp documents
  repository: https://github.com/sphinx-doc/sphinxcontrib-devhelp/

extra:
  recipe-maintainers:
    - AA-Turner
    - conda-forge/sphinx
    - ocefpaf

#### CFE metadata AND comments
