# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "14.0.0"
  python_min: "3.12"

package:
  name: pyee
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyee/pyee-${{ version }}.tar.gz
  sha256: 76dd0f4314ecd27f02dc73589dea7fd3853f9b6176d8ef9b122860657e3602de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - pyee
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyee/
  license: MIT
  license_file: LICENSE
  summary: A rough port of Node.js's EventEmitter to Python with a few tricks of its own
  description: |
    A rough port of Node.js's EventEmitter to Python with a few tricks of its own
  repository: https://github.com/jfhbrook/pyee
  documentation: https://pyee.readthedocs.io

extra:
  recipe-maintainers:
    - mxschmitt
    - kiwi0fruit

#### CFE metadata AND comments
