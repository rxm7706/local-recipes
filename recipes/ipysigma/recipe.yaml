# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.6"

package:
  name: ipysigma
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipysigma/ipysigma-${{ version }}.tar.gz
  sha256: 0de58c0c9f9d2f56e1639fb458d5c56df7d23d67bd8bd6780fe33050dd16abca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - jupyter-packaging ==0.12
    - jupyterlab ==3.*
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - ipywidgets <9,>=7

tests:
  - python:
      imports:
        - ipysigma
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/medialab/ipysigma
  license: MIT
  license_file: LICENSE
  summary: A Jupyter widget using sigma.js to render interactive networks.
  description: |
    A Jupyter widget using sigma.js to render interactive networks.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
