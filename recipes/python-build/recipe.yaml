# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.13"

package:
  name: python-build
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-build/python-build-${{ version }}.tar.gz
  sha256: f22ed87d097adf9a9e498b11f354e4b4bc5d285fc254a5c2050fa26b4e415506

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_build
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Tool to download and build python based upon pyenv.
  description: |
    Tool to download and build python based upon pyenv.

extra:
  recipe-maintainers:
    - ocefpaf
    - henryiii

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-build
