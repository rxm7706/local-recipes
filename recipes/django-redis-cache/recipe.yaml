# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: django-redis-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-redis-cache/django-redis-cache-${{ version }}.tar.gz
  sha256: a7fbef101a053d2e430bd3befe6a87e6e730f98e335b516f25f30b17d9fe66e3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - django
    - redis-py <4.0

tests:
  - python:
      imports:
        - redis_cache
        - redis_cache.backends
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Redis Cache Backend for Django
  homepage: http://github.com/sebleier/django-redis-cache/

extra:
  recipe-maintainers:
    - kwilcox
