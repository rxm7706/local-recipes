# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.11"

package:
  name: twitter.common.collections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/twitter.common.collections/twitter.common.collections-${{ version }}.tar.gz
  sha256: ede4caff74928156f7ff38dac9b0811893de41966c39cd5b2fdea53418349ca8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - twitter.common.lang

tests:
  - python:
      imports:
        - twitter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/twitter/commons
  license: Apache-2.0
  license_file: LICENSE
  summary: twitter.common collections library.
  description: |
    twitter.common collections library.

extra:
  recipe-maintainers:
    - rxm7706

