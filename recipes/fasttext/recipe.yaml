# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fasttext
  version: "0.9.2"
  sha256: 7ea4edcdb64bfc6faaaec193ef181bdc108ee62bb6a04e48b2e80b639a99e27e

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/facebookresearch/fastText/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz
  patches:
    - patches/cstdint.patch

build:
  number: 9
  skip: win

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - if: build_platform != target_platform
      then: pybind11
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
  host:
    - make
    - numpy
    - pip
    - pybind11
    - python
    - setuptools
  run:
    - numpy
    - pybind11
    - python
    - setuptools

tests:
  - python:
      imports:
        - fasttext
      pip_check: false
  - script:
      - fasttext supervised -h || [[ $? == 1 ]]

about:
  license: MIT
  license_file: LICENSE
  summary: fastText - Library for efficient text classification and representation learning
  homepage: https://fasttext.cc/
  repository: https://github.com/facebookresearch/fastText
  documentation: https://fasttext.cc/docs/en/support.html

extra:
  recipe-maintainers:
    - JungeAlexander
    - kylebgorman
