# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.1.1"

package:
  name: hstspreload
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hstspreload/hstspreload-${{ version }}.tar.gz
  sha256: 346552a807b3a1762376de8ecce097544e7fcd64fb64231b4652da52f86fa6f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hstspreload
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sethmlarson/hstspreload
  license: BSD-3
  license_file: LICENSE
  summary: Chromium HSTS Preload list as a Python package
  description: |
    Chromium HSTS Preload list as a Python package

extra:
  recipe-maintainers:
    - primozgodec

