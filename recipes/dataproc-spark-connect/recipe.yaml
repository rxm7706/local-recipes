# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: dataproc-spark-connect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dataproc-spark-connect/dataproc_spark_connect-${{ version }}.tar.gz
  sha256: c4d7337a422e80fe6c5cab7ca4e642de5948c6f5dcbe2e6d6ae4aafd32aad55e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - IPython
    - google-api-core >=2.19
    - google-cloud-dataproc >=5.18
    - packaging >=20.0
    - pyspark ~=4.0.0
    - tqdm >=4.67
    - websockets >=14.0

tests:
  - python:
      imports:
        - google.cloud.dataproc_magics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudDataproc/dataproc-spark-connect-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Dataproc client library for Spark Connect
  description: |
    Dataproc client library for Spark Connect

extra:
  recipe-maintainers:
    - rxm7706

