# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: robotframework-retryfailed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robotframework-retryfailed/robotframework-retryfailed-${{ version }}.tar.gz
  sha256: c134a924f480e2666916bcb019a7e255d7229bc51a3747e849bd1e7931ed6eb3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - robotframework

tests:
  - python:
      imports:
        - RetryFailed
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MarketSquare/robotframework-retryfailed
  license: Apache-2.0
  license_file: LICENSE
  summary: A listener to automatically retry tests or tasks based on flags.
  description: |
    A listener to automatically retry tests or tasks based on flags.

extra:
  recipe-maintainers:
    - rxm7706

