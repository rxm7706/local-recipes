# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.4"

package:
  name: panel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panel/panel-${{ version }}.tar.gz
  sha256: 373bdb124c1b33c3dd4c112f348f4cfb2a7f1634b36a51e6ab01a4b5b6ec833c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - param >=2.1.0
    - bokeh >=3.8.0,<3.10.0
    - pyviz_comms >=0.7.4
    - requests
    - packaging
  run:
    - python >=${{ python_min }}
    - bokeh <3.10.0,>=3.7.0
    - linkify-it-py
    - markdown
    - markdown-it-py
    - mdit-py-plugins
    - narwhals >=2
    - nh3
    - packaging
    - pandas >=1.2
    - panel-material-ui >=0.10.0
    - param <3.0,>=2.1.0
    - pyviz_comms >=2.0.0
    - requests
    - tqdm
    - typing_extensions

tests:
  - python:
      imports:
        - panel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://panel.holoviz.org
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: The powerful data exploration & web app framework for Python.
  description: |
    The powerful data exploration & web app framework for Python.
  repository: https://github.com/holoviz/panel

extra:
  recipe-maintainers:
    - hoxbro
    - philippjfr
    - ocefpaf
    - maximlt

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: panel
  cfe-upstream-registry: pypi
  cfe-upstream-name: panel
  cfe-purls:
