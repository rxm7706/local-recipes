    - pkg:pypi/panel@${{ version }}
  cfe-upstream-repo: https://github.com/holoviz/panel
  cfe-upstream-homepage: https://panel.holoviz.org
  cfe-import-names: [panel]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/panel-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.9.4

  cfe-forge-blocker-list:
