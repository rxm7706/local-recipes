# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.3"
  python_min: "3.10"

recipe:
  name: panel-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panel/panel-${{ version }}.tar.gz
  sha256: 4d7de30561e31674451ade5f029cddbec6156fd30f3e4cfd7da82f6ecfcbb98f

build:
  number: 0

outputs:
  - package:
      name: panel-core
    build:
      number: 0
      noarch: python
      script: python -m pip install . -vv
      python:
        entry_points:
          - panel = panel.command:main
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - nodejs >=18
        # These are also needed at build time.
        - hatchling
        - hatch-vcs
        - param >=2.1.0
        - bokeh >=3.8.0,<3.10.0
        - pyviz_comms >=0.7.4
        - requests
        - packaging
      run:
        - python >=${{ python_min }}
        - bokeh >=3.7.0,<3.10.0
        - param >=2.1.0,<3.0
        - pyviz_comms >=2.0.0
        - markdown
        - markdown-it-py
        - linkify-it-py
        - mdit-py-plugins
        - narwhals >=2
        - requests
        - nh3
        - typing_extensions
        - pandas >=1.2
        - packaging
        - tqdm
      run_constraints:
        - holoviews >=1.18.0
    tests:
      - python:
          imports:
            - panel
            - panel.io
          pip_check: false
          python_version: ${{ python_min }}
      - requirements:
          run:
            - python ${{ python_min }}
            - pip
        script:
          - panel --help
  - package:
      name: panel
    build:
      number: 0
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('panel-core', exact=True) }}
        - panel-material-ui >=0.10.0
    tests:
      - python:
          imports:
            - panel
          pip_check: true
          python_version: ${{ python_min }}
    about:
      summary: The powerful data exploration & web app framework for Python.
      description: |
        Panel provides tools for easily composing widgets, plots, tables, and other
        viewable objects and controls into control panels, apps, and dashboards.
      license: BSD-3-Clause
      license_file: LICENSE.txt
      homepage: https://panel.holoviz.org

about:
  summary: The powerful data exploration & web app framework for Python.
  description: |
    Panel provides tools for easily composing widgets, plots, tables, and other
    viewable objects and controls into control panels, apps, and dashboards.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://panel.holoviz.org

extra:
  recipe-maintainers:
    - hoxbro
    - philippjfr
    - ocefpaf
    - maximlt
