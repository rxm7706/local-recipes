# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "1.3.0"

package:
  name: netaddr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/netaddr/netaddr-${{ version }}.tar.gz
  sha256: 5c3c3d9895b551b763779ba7db7a03487dc1f8e3b385af819af341ae9ef6e48a

build:
  number: 2
  noarch: python
  python:
    entry_points:
      - netaddr = netaddr.cli:main
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - netaddr
        - netaddr.eui
        - netaddr.ip
        - netaddr.strategy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - netaddr --help

about:
  homepage: https://github.com/netaddr/netaddr
  summary: Pythonic manipulation of IPv4, IPv6, CIDR, EUI and MAC network addresses
  license: BSD-3-Clause
  license_file: LICENSE.rst
  repository: https://github.com/netaddr/netaddr
  documentation: https://netaddr.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - tschoonj
    - anguslees
    - mariusvniekerk
    - drkjam
    - ytausch
