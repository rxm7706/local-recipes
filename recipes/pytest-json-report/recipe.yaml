# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: pytest-json-report
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-json-report/pytest-json-report-${{ version }}.tar.gz
  sha256: 2dde3c647851a19b5f3700729e8310a6e66efb2077d674f27ddea3d34dc615de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest
    - pytest-metadata

tests:
  - python:
      imports:
        - pytest_jsonreport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/numirias/pytest-json-report
  license: MIT
  license_file: LICENSE
  summary: A pytest plugin to report test results as JSON files
  description: |
    A pytest plugin to report test results as JSON files

extra:
  recipe-maintainers:
    - marcelotrevisani
    - megies

