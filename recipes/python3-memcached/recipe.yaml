# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.51"

package:
  name: python3-memcached
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-memcached/python3-memcached-${{ version }}.tar.gz
  sha256: 7cbe5951d68eef69d948b7a7ed7decfbd101e15e7f5be007dcd1219ccc584859

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python3_memcached
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eguven/python3-memcached
  license: MIT
  license_file: LICENSE
  summary: Pure python memcached client
  description: |
    Pure python memcached client

extra:
  recipe-maintainers:
    - rxm7706

