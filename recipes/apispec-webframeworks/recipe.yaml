# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: apispec-webframeworks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apispec-webframeworks/apispec_webframeworks-${{ version }}.tar.gz
  sha256: 5689288c266a2713c2f516eacc14ea2fec9b21f193edc8f659c770342b97fd81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - apispec >=6.0.0

tests:
  - python:
      imports:
        - apispec_webframeworks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apispec-webframeworks/
  license: MIT
  license_file: LICENSE
  summary: Web framework plugins for apispec.
  description: |
    Web framework plugins for apispec.
  repository: https://github.com/marshmallow-code/apispec-webframeworks

extra:
  recipe-maintainers:
    - ndmaxar
    - oblute
    - rluria14

