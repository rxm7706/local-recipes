# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: querystring_parser
  version: "1.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 644fce1cffe0530453b43a83a38094dbe422ccba8c9b2f2a1c00280e14ca8a62

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - six

tests:
  - python:
      imports:
        - querystring_parser
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: QueryString parser for Python/Django that correctly handles nested dictionaries
  homepage: https://github.com/bernii/querystring-parser
  repository: https://github.com/bernii/querystring-parser

extra:
  recipe-maintainers:
    - jaroslawk
    - paulmelnikow
    - xhochy
