# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.4"

package:
  name: querystring-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/querystring-parser/querystring_parser-${{ version }}.tar.gz
  sha256: 644fce1cffe0530453b43a83a38094dbe422ccba8c9b2f2a1c00280e14ca8a62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - querystring_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bernii/querystring-parser
  license: MIT
  license_file: LICENSE
  summary: QueryString parser for Python/Django that correctly handles nested dictionaries
  description: |
    QueryString parser for Python/Django that correctly handles nested dictionaries

extra:
  recipe-maintainers:
    - jaroslawk
    - paulmelnikow
    - xhochy

#### CFE metadata AND comments
