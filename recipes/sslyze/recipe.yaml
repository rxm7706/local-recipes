# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.1"

package:
  name: sslyze
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sslyze/sslyze-${{ version }}.tar.gz
  sha256: 2cd4062f82a3fa605dbd34e3b71f99961e4e7cf438879da1c52f619855ffbc1d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nassl <6,>=5.4
    - cryptography <47,>=43
    - tls-parser <3,>=2
    - pydantic <3,>=2.3

tests:
  - python:
      imports:
        - sslyze
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nabla-c0d3/sslyze
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Fast and powerful SSL/TLS scanning library.
  description: |
    Fast and powerful SSL/TLS scanning library.
  repository: https://github.com/nabla-c0d3/sslyze
  documentation: https://nabla-c0d3.github.io/sslyze/documentation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sslyze
