    - pkg:pypi/clyent@${{ version }}
  cfe-upstream-repo: https://github.com/Anaconda-Platform/clyent
  cfe-upstream-homepage: https://github.com/Anaconda-Platform/clyent
  cfe-import-names: [clyent]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "false"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/clyent-feedstock
