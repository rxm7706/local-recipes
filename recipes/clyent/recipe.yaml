# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: clyent
  version: "1.2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Anaconda-Platform/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 72b977e7c115224f474f9c70c549c0977b8daf5ac00452301cff065ff14129e5
  file_name: ${{ name }}-${{ version }}.tar.gz
  patches:
    - 0001-Remove-unused-module-imp-for-python-3.12-compatibili.patch
    - no_versioneer.py

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - pip
    # the python bound is probably lower than 3.6
    # but with conda-forge tooling of Nov 2023, I don't want
    # to let really old pythons install this
    - python >=3.8
    - setuptools
  run:
    - python >=3.8
    - setuptools

tests:
  - python:
      imports:
        - clyent
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Command line client library for windows and posix
  description: |
    Clyent is a python command line utility library for binstar,
    binstar-build, and chalmers.
  homepage: https://github.com/Anaconda-Platform/clyent
  repository: https://github.com/Anaconda-Platform/clyent
  documentation: https://pypi.python.org/pypi/clyent

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clyent
