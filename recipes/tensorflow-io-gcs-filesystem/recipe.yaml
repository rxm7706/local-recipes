# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.37.1"

package:
  name: tensorflow-io-gcs-filesystem
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/io/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3a92e0b6289908320bb290021dc7d5b80de8f399bf447db6fd9ebf0e2d4e4889

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tensorflow_io
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tensorflow/io
  license: Apache-2.0
  license_file: LICENSE
  summary: TensorFlow IO
  description: |
    TensorFlow IO
  repository: https://github.com/tensorflow/io
  documentation: https://tensorflow.org/io

extra:
  recipe-maintainers:
    - rxm7706

