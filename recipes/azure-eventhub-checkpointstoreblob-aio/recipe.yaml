# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: azure-eventhub-checkpointstoreblob-aio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-eventhub-checkpointstoreblob-aio/azure_eventhub_checkpointstoreblob_aio-${{ version }}.tar.gz
  sha256: d61d5e425c1a59bbe042ce287de072386e73a3b19ea21f8a7ac04d2a54c7c12b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.30.0
    - cryptography >=2.1.4
    - typing_extensions >=4.6.0
    - isodate >=0.6.1
    - azure-eventhub >=5.0.0
    - aiohttp >=3.8.3

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/eventhub/azure-eventhub-checkpointstoreblob-aio
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Event Hubs checkpointer implementation with Blob Storage Client Library for Python
  description: |
    Microsoft Azure Event Hubs checkpointer implementation with Blob Storage Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

