# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: streamlit-chat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-chat/streamlit-chat-${{ version }}.tar.gz
  sha256: e5911c8e3d5bbdd444782a0eb46a5f0cf24247124eb165bcc2e759540767ac3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_chat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AI-Yash/st-chat
  license: MIT
  license_file: LICENSE
  summary: A streamlit component, to make chatbots
  description: |
    A streamlit component, to make chatbots

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
