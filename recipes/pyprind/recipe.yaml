# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.11.3"

package:
  name: pyprind
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyPrind/PyPrind-${{ version }}.tar.gz
  sha256: e37dcab6e1a9c8e0a7f0fce65fde7a79e2deda1c75aa015910a49e2137b54cbf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyprind
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rasbt/pyprind
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Progress Bar and Percent Indicator Utility
  description: |
    Python Progress Bar and Percent Indicator Utility

extra:
  recipe-maintainers:
    - cmutel

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyprind
