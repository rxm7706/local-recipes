# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: geckodriver-autoinstaller
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geckodriver-autoinstaller/geckodriver-autoinstaller-${{ version }}.tar.gz
  sha256: 08953404903750a7e0905913d86eab13849c75ed61eb281c45697d9f5b5e2eb2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - geckodriver_autoinstaller
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yeongbin-jo/python-geckodriver-autoinstaller
  license: MIT
  license_file: LICENSE
  summary: Automatically install geckodriver that supports the currently installed version of chrome.
  description: |
    Automatically install geckodriver that supports the currently installed version of chrome.

extra:
  recipe-maintainers:
    - rxm7706

