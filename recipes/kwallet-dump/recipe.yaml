# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: kwallet-dump
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kwallet-dump/kwallet-dump-${{ version }}.tar.gz
  sha256: 39ecf3b2d3f36469b54ebadbf81581ffb53bfa57519599cdd63e860b2689cfb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kwallet_dump
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gaganpreet/kwallet-dump
  license: UNKNOWN
  license_file: LICENSE
  summary: Access KWallet files without KDE desktop
  description: |
    Access KWallet files without KDE desktop

extra:
  recipe-maintainers:
    - rxm7706

