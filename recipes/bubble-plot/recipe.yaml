# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.4"

package:
  name: bubble-plot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/b/bubble-plot/bubble_plot-0.3.4-py3-none-any.whl
  sha256: b45aa6fd67984ad2f698e323ab878c6328abfed6b4b96599430eebc3922fa5e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bubble_plot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shirmeir/bubble_plot
  license: MIT
  license_file: LICENSE
  summary: Bubble plot - data visualization package
  description: |
    Bubble plot - data visualization package

extra:
  recipe-maintainers:
    - rxm7706

