# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sqlalchemy-searchable
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlalchemy_searchable-${{ version }}.tar.gz
  sha256: 6bed911f2cb6c9b90383a082446c7245d4b9df0dbb9f8b25c2325f717b85505b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - sqlalchemy-utils >=0.40.0
    - sqlalchemy >=2.0

tests:
  - python:
      imports:
        - sqlalchemy_searchable
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Provides fulltext search capabilities for declarative SQLAlchemy models.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/falcony-io/sqlalchemy-searchable
  repository: https://github.com/falcony-io/sqlalchemy-searchable
  documentation: https://sqlalchemy-searchable.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
