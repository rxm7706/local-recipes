# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: msal_extensions
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/AzureAD/microsoft-authentication-extensions-for-python/archive/${{ version }}.tar.gz
  sha256: 4fd784f391e19a56d1f86c2288f878fb00b2f9e8658b6396dea5eea6baace58b

build:
  number: 1
  skip: match(python, "<3.9")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - if: not win
      then: libsecret
    - msal >=1.29,<2
    - portalocker >=1.6,<4
    - if: not win
      then: pygobject >=3,<4

tests:
  - python:
      imports:
        - msal_extensions
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Microsoft Authentication extensions for MSAL.Python
  description: |
    Microsoft Authentication extensions for MSAL.Python
  homepage: https://github.com/AzureAD/microsoft-authentication-extensions-for-python
  repository: https://github.com/AzureAD/microsoft-authentication-extensions-for-python
  documentation: https://github.com/AzureAD/microsoft-authentication-extensions-for-python

extra:
  recipe-maintainers:
    - dhirschfeld
    - roederja
