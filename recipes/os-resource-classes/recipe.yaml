# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: os-resource-classes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/os-resource-classes/os-resource-classes-${{ version }}.tar.gz
  sha256: e0bcbb8961a9fe33b7213734c51c001812890e2be62101c9279c88b72f75f9eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pbr

tests:
  - python:
      imports:
        - os_resource_classes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/os-resource-classes/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: Resource Classes for OpenStack
  description: |
    Resource Classes for OpenStack

extra:
  recipe-maintainers:
    - rxm7706

