# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: drf-api-logger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/drf-api-logger/drf_api_logger-${{ version }}.tar.gz
  sha256: 923231feafa5bf31265d661462b1f1e95786ef155fa880877cc8114a2bf8d473

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - djangorestframework >=3.16
    - bleach >=3.1.5

tests:
  - python:
      imports:
        - drf_api_logger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vishalanandl177/DRF-API-Logger
  license: Apache-2.0
  license_file: LICENSE
  summary: "The production standard for DRF API observability: request/response logging, profiling, masking, and admin analytics."
  description: |
    The production standard for DRF API observability: request/response logging, profiling, masking, and admin analytics.
  repository: https://github.com/vishalanandl177/DRF-API-Logger
  documentation: https://github.com/vishalanandl177/DRF-API-Logger#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
