# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.11.0"
  sip_version: "6.15.3"
  pyqt6_sip_version: "13.10.0"
  webengine_version: "6.8.0"
  charts_version: "6.8.0"
  pyqt_builder_version: "1.18.2"

recipe:
  name: pyqt6-split
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/P/PyQt${{ version[0] }}/pyqt${{ version[0] }}-${{ version }}.tar.gz
    sha256: 45dd60aa69976de1918b5ced6b4e7b6a25abd2a919ecef5fd5826ecc76718889
    target_directory: pyqt
  - url: https://pypi.org/packages/source/P/PyQt6-sip/pyqt6_sip-${{ pyqt6_sip_version }}.tar.gz
    sha256: d6daa95a0bd315d9ec523b549e0ce97455f61ded65d5eafecd83ed2aa4ae5350
    target_directory: pyqt_sip
  - url: https://pypi.org/packages/source/P/PyQt6-WebEngine/PyQt6_WebEngine-${{ webengine_version }}.tar.gz
    sha256: 64045ea622b6a41882c2b18f55ae9714b8660acff06a54e910eb72822c2f3ff2
    target_directory: pyqt_webengine
  - url: https://pypi.org/packages/source/P/PyQt6-Charts/PyQt6_Charts-${{ charts_version }}.tar.gz
    sha256: f86705b8740e3041667ce211aeaa205b750eb6baf4c908f4e3f6dc8c720d10f1
    target_directory: pyqt_charts

build:
  number: 2
  skip:
    - ${{ true if linux and ppc64le }}

outputs:
  - package:
      name: pyqt6-sip
      version: ${{ pyqt6_sip_version }}
    build:
      script:
        file: ${{ 'bld-pyqt-sip.bat' if win else 'build-pyqt-sip.sh' if not win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
      host:
        - python
        - setuptools
        - wheel
        - pip
        - setuptools
      run:
        - python
        - sip
        - packaging
        - toml
    tests:
      - python:
          imports:
            - PyQt6.sip
          pip_check: false
  - package:
      name: pyqt6
      version: ${{ version }}
    build:
      script:
        file: ${{ 'bld-pyqt.bat' if win else 'build-pyqt.sh' if not win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform or build_platform != target_platform
          then: pyqt-builder 1.18.2.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: sip 6.15.3.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-main 6.11.0.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-multimedia 6.11.0.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-serialport 6.11.0.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-positioning 6.11.0.*
        - make
        - if: linux
          then: patchelf
        - if: linux
          then: libsystemd
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform or build_platform == target_platform
          then: sip 6.15.3.*
        - toml
        - if: build_platform == target_platform or build_platform == target_platform
          then: pyqt-builder 1.18.2.*
        - packaging
        - qt6-main 6.11.0.*
        - qt6-multimedia 6.11.0.*
        - qt6-serialport 6.11.0.*
        - qt6-positioning 6.11.0.*
        - if: linux
          then: libsystemd
        - if: linux
          then: libgl-devel
        - if: linux
          then: libegl-devel
        - if: linux
          then: libopengl-devel
        - if: linux
          then: xorg-xorgproto
        - if: linux
          then: xcb-util
        - if: linux
          then: xcb-util-wm
        - if: linux
          then: xcb-util-keysyms
        - if: linux
          then: xcb-util-image
        - if: linux
          then: xcb-util-renderutil
        - if: linux
          then: xorg-libx11
        - if: linux
          then: xorg-libxext
        - if: linux
          then: xorg-libxdamage
        - if: linux
          then: xorg-libsm
        - if: linux
          then: xorg-libice
        - if: linux
          then: xorg-libxcomposite
        - if: linux
          then: xorg-libxxf86vm
        - if: linux
          then: xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6-sip', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6
            - PyQt6.sip
            - PyQt6.QtCore
            - PyQt6.QtGui
            - PyQt6.QtHelp
            - PyQt6.QtNetwork
            - PyQt6.QtOpenGL
            - PyQt6.QtPrintSupport
            - PyQt6.QtQml
            - PyQt6.QtQuick
            - PyQt6.QtQuickWidgets
            - PyQt6.QtSvg
            - PyQt6.QtSvgWidgets
            - PyQt6.QtTest
            - PyQt6.QtWebChannel
            - PyQt6.QtWebSockets
            - PyQt6.QtWidgets
            - PyQt6.QtXml
            - PyQt6.QtMultimedia
            - PyQt6.QtSerialPort
            - PyQt6.QtPositioning
          pip_check: false
      - files:
          recipe:
            - pyqt_test.py
            - test_plugin_load.py
        script:
          - if: linux and build_platform == target_platform
            then: QT_QPA_PLATFORM=offscreen python pyqt_test.py
          - if: not win
            then: pyuic6 --version
          - if: unix
            then: test -f "${PREFIX}/lib/qt6/plugins/designer/libpyqt6${SHLIB_EXT}"
          - if: win
            then: if not exist "%PREFIX%\\Library\\plugins\\designer\\libpyqt6.dll" exit 1
          - python test_plugin_load.py
  - package:
      name: pyqt6webengine
      version: ${{ version }}
    build:
      skip: true  # https://github.com/conda-forge/pyqt-feedstock/issues/156
      script:
        file: ${{ 'bld-pyqtwebengine.bat' if win else 'build-pyqtwebengine.sh' if not win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform or build_platform != target_platform
          then: pyqt-builder 1.18.2.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: sip 6.15.3.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-main 6.11.0.*
        - make
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform or build_platform == target_platform
          then: sip 6.15.3.*
        - toml
        - if: build_platform == target_platform or build_platform == target_platform
          then: pyqt-builder 1.18.2.*
        - packaging
        - pyqt6
        - qt6-main 6.11.0.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-webengine 6.11.0.*
        - if: linux
          then: libgl-devel
        - if: linux
          then: libegl-devel
        - if: linux
          then: libopengl-devel
        - if: linux
          then: xorg-xorgproto
        - if: linux
          then: xcb-util
        - if: linux
          then: xcb-util-wm
        - if: linux
          then: xcb-util-keysyms
        - if: linux
          then: xcb-util-image
        - if: linux
          then: xcb-util-renderutil
        - if: linux
          then: xorg-libx11
        - if: linux
          then: xorg-libxext
        - if: linux
          then: xorg-libxdamage
        - if: linux
          then: xorg-libsm
        - if: linux
          then: xorg-libice
        - if: linux
          then: xorg-libxcomposite
        - if: linux
          then: xorg-libxxf86vm
        - if: linux
          then: xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
      run_exports:
        - ${{ pin_subpackage('pyqt6webengine', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6.QtWebEngine
            - PyQt6.QtWebEngineCore
            - PyQt6.QtWebEngineWidgets
          pip_check: false
  - package:
      name: pyqt6-charts
      version: ${{ version }}
    build:
      script:
        file: ${{ 'bld-pyqtcharts.bat' if win else 'build-pyqtcharts.sh' if not win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then: jom
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform or build_platform != target_platform
          then: pyqt-builder 1.18.2.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: sip 6.15.3.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-main 6.11.0.*
        - if: build_platform != target_platform or build_platform != target_platform
          then: qt6-charts 6.11.0.*
        - make
      host:
        - python
        - pip
        - setuptools
        - if: build_platform == target_platform or build_platform == target_platform
          then: sip 6.15.3.*
        - toml
        - if: build_platform == target_platform or build_platform == target_platform
          then: pyqt-builder 1.18.2.*
        - packaging
        - qt6-main 6.11.0.*
        - qt6-charts 6.11.0.*
        - pyqt6
        - if: linux
          then: libgl-devel
        - if: linux
          then: libegl-devel
        - if: linux
          then: libopengl-devel
        - if: linux
          then: xorg-xorgproto
        - if: linux
          then: xcb-util
        - if: linux
          then: xcb-util-wm
        - if: linux
          then: xcb-util-keysyms
        - if: linux
          then: xcb-util-image
        - if: linux
          then: xcb-util-renderutil
        - if: linux
          then: xorg-libx11
        - if: linux
          then: xorg-libxext
        - if: linux
          then: xorg-libxdamage
        - if: linux
          then: xorg-libsm
        - if: linux
          then: xorg-libice
        - if: linux
          then: xorg-libxcomposite
        - if: linux
          then: xorg-libxxf86vm
        - if: linux
          then: xorg-xf86vidmodeproto
      run:
        - python
        - ${{ pin_subpackage('pyqt6', upper_bound='x.x') }}
      run_exports:
        - ${{ pin_subpackage('pyqt6-charts', upper_bound='x.x') }}
    tests:
      - python:
          imports:
            - PyQt6.QtCharts
          pip_check: false

about:
  license: GPL-3.0-only
  license_file: pyqt/LICENSE
  summary: Python bindings for the Qt cross platform application toolkit
  # The remaining entries in this section are optional, but recommended.
  description: |
    PyQt6 is a comprehensive set of Python bindings for Qt v6.
    It is implemented as more than 35 extension modules and enables Python
    to be used as an alternative application development language to C++ on
    all supported platforms including iOS and Android.
  homepage: https://www.riverbankcomputing.com/software/pyqt/
  repository: https://www.riverbankcomputing.com/mailman/listinfo/pyqt/
  documentation: https://www.riverbankcomputing.com/static/Docs/PyQt6/

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - mingwandroid
    - gillins
    - msarahan
    - ocefpaf
    - jschueller
  feedstock-name: pyqt
