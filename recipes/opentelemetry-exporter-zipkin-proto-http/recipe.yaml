# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-exporter-zipkin-proto-http
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-zipkin-proto-http/opentelemetry_exporter_zipkin_proto_http-${{ version }}.tar.gz
  sha256: b3d8a55576bbfa0146905c30441f3ae0d11bf5958d97461fd84c939f0283da04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.3
    - opentelemetry-exporter-zipkin-json ==1.45.1
    - opentelemetry-sdk ~=1.11
    - protobuf ~=3.12
    - requests ~=2.7

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.exporter
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Zipkin Span Protobuf Exporter for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-zipkin-proto-http

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

