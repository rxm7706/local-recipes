# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: langfair
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langfair/langfair-${{ version }}.tar.gz
  sha256: 91f0f5e0cdf047d93007d3c4ab9b2741e9cd04e7271a32086ede3f95988b8a8a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - numpy <2.0.0,>=1.26.4
    - scipy <1.15.0,>=1.13.0
    - vadersentiment <4.0.0,>=3.3.2
    - evaluate <0.5.0,>=0.4.1
    - nltk >=3.8.2
    - sacremoses <0.2.0,>=0.1.1
    - rouge-score <0.2.0,>=0.1.2
    - detoxify <0.6.0,>=0.5.2
    - langchain >=0.3.7
    - asyncio <4.0.0,>=3.4.3
    - sentence-transformers >=3.10
    - typing <4.0.0,>=3.7.4
    - tiktoken <0.12,>=0.7
    - transformers >=4.52.1
    - pytorch >=2.6.0
    - rich ==13.8.0
    - ipywidgets <9.0.0,>=8.1.7

tests:
  - python:
      imports:
        - langfair
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cvs-health/langfair
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: LangFair is a Python library for conducting use-case level LLM bias and fairness assessments
  description: |
    LangFair is a Python library for conducting use-case level LLM bias and fairness assessments
  repository: https://github.com/cvs-health/langfair
  documentation: https://cvs-health.github.io/langfair/latest/index.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langfair
