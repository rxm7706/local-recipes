# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.7"

package:
  name: fb-idb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fb-idb/fb-idb-${{ version }}.tar.gz
  sha256: 1830240266b11a24fd7695220d3a8a3550bce351c4d019fae529adbb508d78ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiofiles
    - grpclib
    - protobuf
    - treelib

tests:
  - python:
      imports:
        - idb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/facebook/idb
  license: MIT
  license_file: LICENSE
  summary: iOS debug bridge
  description: |
    iOS debug bridge

extra:
  recipe-maintainers:
    - rxm7706

