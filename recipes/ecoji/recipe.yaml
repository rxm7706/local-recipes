# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: ecoji
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/ecoji/ecoji-${{ version }}.tar.gz
  sha256: 9665b2545d73ea0b4e0c9897cc6575df8ae7dc3946a82ac9d62db2f147139a9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ecoji
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mecforlove/ecoji-py
  license: Apache-2.0
  license_file: LICENSE
  summary: Encode and decode data as emojis.
  description: |
    Encode and decode data as emojis.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
