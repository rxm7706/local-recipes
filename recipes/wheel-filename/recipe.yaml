# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: wheel-filename
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wheel-filename/wheel_filename-${{ version }}.tar.gz
  sha256: 4c12c51ee92d5fb77ed0932e4f83ff82d8b129b845422f0a1ab2ab9d2d2e2aa4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wheel_filename
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/wheel-filename/
  license: MIT
  license_file: LICENSE
  summary: Parse wheel filenames
  description: |
    Parse wheel filenames
  repository: https://github.com/wheelodex/wheel-filename

extra:
  recipe-maintainers:
    - beenje

