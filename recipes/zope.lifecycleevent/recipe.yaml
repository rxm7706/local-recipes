# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.lifecycleevent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.lifecycleevent/zope_lifecycleevent-${{ version }}.tar.gz
  sha256: cddf7e0c4ab9f6b7c2411ddafa54212270eabc40af315de5ae8b421f4a95298d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.event

tests:
  - python:
      imports:
        - zope.lifecycleevent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.lifecycleevent
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Object life-cycle events
  description: |
    Object life-cycle events

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
