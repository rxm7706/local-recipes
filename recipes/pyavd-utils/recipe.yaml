# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: pyavd-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyavd-utils/pyavd_utils-0.0.7-cp310-abi3-macosx_10_12_x86_64.whl
  sha256: 4234efd9060066a17d7658d81baeb89c74b184e59c3bfdc6e7f92b759e5c91ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyavd_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://avd.arista.com
  license: Apache-2.0
  license_file: LICENSE
  summary: Rust based utilities used by PyAVD. Should not be used directly and may not follow semantic versioning.
  description: |
    Rust based utilities used by PyAVD. Should not be used directly and may not follow semantic versioning.

extra:
  recipe-maintainers:
    - rxm7706

