# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: comm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/comm/comm-${{ version }}.tar.gz
  sha256: 2dc8048c10962d55d7ad693be1e7045d891b7ce8d999c97963a5e3e99c055971

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.10
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - comm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ipython/comm
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Python Comm implementation, for usage in ipykernel, xeus-python etc.
  description: |
    Jupyter Python Comm implementation, for usage in ipykernel, xeus-python etc.

extra:
  recipe-maintainers:
    - apmorton
    - martinRenou
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: comm
  cfe-upstream-registry: pypi
  cfe-upstream-name: comm
