# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pip-system-certs
  version: "5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pip_system_certs-${{ version }}.tar.gz
  sha256: 19c8bf9957bcce7d69c4dbc2d0b2ef13de1984d53f50a59012e6dbbad0af67c6
  patches:
    - static-version.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - wheel
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - pip >=24.2
    - truststore >=0.10.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: Live patches pip and requests to use system certs by default
  description: |
    pip-system-certs patches pip and requests at runtime to use certificates
    from the default system store (rather than the bundled certs ca).

    This will allow pip to verify tls/ssl connections to servers whose cert is
    trusted by your system install.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://gitlab.com/alelec/pip-system-certs
  repository: https://gitlab.com/alelec/pip-system-certs

extra:
  recipe-maintainers:
    - adament

