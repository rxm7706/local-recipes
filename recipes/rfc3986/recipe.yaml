# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: rfc3986
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rfc3986/rfc3986-${{ version }}.tar.gz
  sha256: 97aacf9dbd4bfd829baad6e6309fa6573aaf1be3f6fa735c8ab05e46cecb261c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rfc3986
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://rfc3986.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Validating URI References per RFC 3986
  description: |
    Validating URI References per RFC 3986

extra:
  recipe-maintainers:
    - pmlandwehr
    - anguslees
    - sigmavirus24
    - bollwyvl

