# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"
  python_min: "3.12"

package:
  name: fuzzylogic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fuzzylogic/fuzzylogic-${{ version }}.tar.gz
  sha256: 2fdf20f18e9d650c58c9454f97719ef21a2c5fd666879241afefaae4ecd8faa2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fuzzylogic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/amogorkon/fuzzylogic
  license: MIT
  license_file: LICENSE
  summary: Fuzzy Logic for Python 3
  description: |
    Fuzzy Logic for Python 3

extra:
  recipe-maintainers:
    - rxm7706

