# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: python-toon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-toon/python_toon-${{ version }}.tar.gz
  sha256: ca348b214c4f1cdad3579fd83dd60032d9eb87eb349c2d430ad9eb6371f174bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - toon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xaviviro/python-toon
  license: MIT
  license_file: LICENSE
  summary: TOON (Token-Oriented Object Notation) encoder/decoder for Python - Bidirectional JSON-to-TOON converter optimized for LLMs
  description: |
    TOON (Token-Oriented Object Notation) encoder/decoder for Python - Bidirectional JSON-to-TOON converter optimized for LLMs
  repository: https://github.com/xaviviro/python-toon
  documentation: https://github.com/toon-format/spec

extra:
  recipe-maintainers:
    - moritzwilksch

