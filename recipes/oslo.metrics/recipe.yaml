# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: oslo.metrics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.metrics/oslo_metrics-${{ version }}.tar.gz
  sha256: 7eeefd97906f89b450cf6085b19aea0350acdbbf6dd9ffdbfdeec960bdec06c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - pbr >=3.1.1
    - oslo.utils >=3.41.0
    - oslo.log >=3.44.0
    - oslo.config >=6.9.0
    - prometheus_client >=0.6.0

tests:
  - python:
      imports:
        - oslo_metrics
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.metrics
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Metrics library
  description: |
    Oslo Metrics library
  repository: https://opendev.org/openstack/oslo.metrics

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
