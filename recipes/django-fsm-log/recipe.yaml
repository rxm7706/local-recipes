# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-fsm-log
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-fsm-log-${{ version }}.tar.gz
  sha256: 9ef766f5e6d7c573d1953cf91df73538a611373cc1ef97488eff19a3f71d6ed6

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.11
    - django >=1.8
    - django-fsm >=2
    - django-appconf

tests:
  - python:
      imports:
        - django_fsm_log
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Logging for django-fsm
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/gizmag/django-fsm-log

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

