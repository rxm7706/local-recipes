# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.2"

package:
  name: django-fsm-log
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-fsm-log/django_fsm_log-${{ 
    version }}.tar.gz
  sha256: 5276a587bff3112c123c73456f37decf9c1bdc631e005c760e248adc25c8ec97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django-appconf
    - django-fsm-2
    - django >=4.2

tests:
  - python:
      imports:
        - django_fsm_log
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jazzband/django-fsm-log
  license: MIT
  license_file: LICENSE
  summary: Transition's persistence for django-fsm
  description: |
    Transition's persistence for django-fsm
  documentation: https://django-fsm-log.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

