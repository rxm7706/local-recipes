# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: locket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/locket/locket-${{ version }}.tar.gz
  sha256: 5c0d4c052a8bbbf750e056a8e65ccd309086f4f0f18a2eac306a8dfa4112a632

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - locket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mwilliamson/locket.py
  license: BSD-2-Clause
  license_file: LICENSE
  summary: File-based locks for Python on Linux and Windows
  description: |
    File-based locks for Python on Linux and Windows

extra:
  recipe-maintainers:
    - madkinsz
    - jcrist

#### CFE metadata AND comments
