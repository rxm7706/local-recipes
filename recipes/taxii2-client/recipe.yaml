# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: taxii2-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/taxii2-client/taxii2-client-${{ version }}.tar.gz
  sha256: fb3bf895e2eaff3cd08bb7aad75c9d30682ffc00b9f3add77de3a67dc6b895a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - six
    - pytz

tests:
  - python:
      imports:
        - taxii2client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://oasis-open.github.io/cti-documentation/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: TAXII 2 Client Library
  description: |
    TAXII 2 Client Library
  repository: https://github.com/oasis-open/cti-taxii-client/
  documentation: https://taxii2client.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

