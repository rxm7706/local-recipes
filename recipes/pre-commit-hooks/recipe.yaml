# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: pre-commit-hooks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pre-commit-hooks/pre_commit_hooks-${{ version }}.tar.gz
  sha256: 76d8370c006f5026cdd638a397a678d26dda735a3c88137e05885a020f824034

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.15
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - pre_commit_hooks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pre-commit/pre-commit-hooks
  license: MIT
  license_file: LICENSE
  summary: Some out-of-the-box hooks for pre-commit.
  description: |
    Some out-of-the-box hooks for pre-commit.

extra:
  recipe-maintainers:
    - dangercrow
    - jtilly

