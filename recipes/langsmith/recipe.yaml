# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: langsmith
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langsmith/langsmith-${{ version }}.tar.gz
  sha256: 7339f90e6fd9a1a009445b5084a7a0e56a8b6f17305ee5d7e8c5e7582217854f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bench
    - anyio >=3.5.0
    - distro >=1.7.0
    - httpx <1,>=0.23.0
    - orjson >=3.9.14
    - packaging >=23.2
    - pydantic <3,>=2
    - requests-toolbelt >=1.0.0
    - requests >=2.0.0
    - sniffio >=1.1
    - typing_extensions >=4.0.0
    - uuid-utils <1.0,>=0.12.0
    - websockets >=15.0
    - python-xxhash >=3.0.0
    - zstandard >=0.23.0

tests:
  - python:
      imports:
        - bench
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://smith.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Client library to connect to the LangSmith Observability and Evaluation Platform.
  description: |
    Client library to connect to the LangSmith Observability and Evaluation Platform.
  repository: https://github.com/langchain-ai/langsmith-sdk
  documentation: https://docs.smith.langchain.com/

extra:
  recipe-maintainers:
    - pavelzw
    - hinthornw
    - vowelparrot
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langsmith
