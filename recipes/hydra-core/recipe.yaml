# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: hydra-core
  version: "1.3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/facebookresearch/hydra/archive/v${{ version }}.tar.gz
  sha256: 38f9ae3729a6ea7b5a2f6c6e33d42ccc8bb10637587897503815eae60e2bdd95

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} setup.py antlr
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - antlr ==4.9
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - omegaconf >=2.2,<2.4
    - antlr-python-runtime ==4.9
    - packaging

tests:
  - python:
      imports:
        - hydra
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A framework for elegantly configuring complex applications
  homepage: https://hydra.cc/
  repository: https://github.com/facebookresearch/hydra
  documentation: https://hydra.cc/docs/intro/

extra:
  recipe-maintainers:
    - omry
    - mdraw
    - benjaminrwilson
