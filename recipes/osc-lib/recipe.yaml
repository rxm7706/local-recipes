# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: osc-lib
  version: "4.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5b896de12ed69fb1111d2971467d403b838d414fc27df2024fc50e8652a53f2b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pbr
    - pip
    - python 3.11.*
    - setuptools
  run:
    - cliff >=3.2.0
    - keystoneauth1 >=3.14.0
    - openstacksdk >=0.15.0
    - oslo.i18n >=3.15.3
    - oslo.utils >=3.33.0
    - pbr
    - python >=${{ python_min }}
    - setuptools
    - stevedore >=1.20.0

tests:
  - python:
      imports:
        - osc_lib
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenStackClient Library
  homepage: https://opendev.org/openstack/osc-lib
  repository: https://opendev.org/openstack/osc-lib
  documentation: https://docs.openstack.org/osc-lib/latest/

extra:
  recipe-maintainers:
    - tschoonj
