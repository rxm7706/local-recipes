# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: openapi-pydantic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openapi-pydantic/openapi_pydantic-${{ version }}.tar.gz
  sha256: ff6835af6bde7a459fb93eb93bb92b8749b754fc6e51b2f1590a19dc3005ee0d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pydantic >=1.8

tests:
  - python:
      imports:
        - openapi_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mike-oakley/openapi-pydantic
  license: MIT
  license_file: LICENSE
  summary: Pydantic OpenAPI schema implementation
  description: |
    Pydantic OpenAPI schema implementation
  repository: https://github.com/mike-oakley/openapi-pydantic

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
