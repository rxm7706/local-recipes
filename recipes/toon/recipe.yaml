# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.9"

package:
  name: toon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toon/toon-0.15.9.zip
  sha256: b53daedb3896a9f5d01a8c97c1c5361ad627cb717f63456e04c330e11b949001

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - Cython
    - numpy
    - psutil

tests:
  - python:
      imports:
        - toon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aforren1/toon
  license: MIT
  license_file: LICENSE
  summary: Tools for neuroscience experiments
  description: |
    Tools for neuroscience experiments

extra:
  recipe-maintainers:
    - rxm7706

