# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: service-identity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/service-identity/service_identity-${{ version }}.tar.gz
  sha256: 6358c52882c96e66ac4a55eb3a72c7dd4a70763f8cc6fa4e70abde2656f4bf3b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - attrs >=19.1.0
    - cryptography >=47

tests:
  - python:
      imports:
        - service_identity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/service-identity/
  license: MIT
  license_file: LICENSE
  summary: Service identity verification for pyOpenSSL & cryptography.
  description: |
    Service identity verification for pyOpenSSL & cryptography.
  repository: https://github.com/pyca/service-identity
  documentation: https://service-identity.readthedocs.io/

extra:
  recipe-maintainers:
    - isuruf
    - bollwyvl

#### CFE metadata AND comments
