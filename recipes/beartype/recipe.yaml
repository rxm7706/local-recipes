# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.22.9"

package:
  name: beartype
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/beartype/beartype-${{ version }}.tar.gz
  sha256: 8f82b54aa723a2848a56008d18875f91c1db02c32ef6a62319a002e3e25a975f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.14.0
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - equinox
        - jax
        - jaxtyping
        - nuitka
        - pytorch
        - equinox
        - jax
        - jaxtyping
        - nuitka
        - pytorch
        - equinox
        - jax
        - jaxtyping
        - nuitka
        - pytorch

tests:
  - python:
      imports:
        - beartype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/beartype/
  license: MIT
  license_file: LICENSE
  summary: Unbearably fast near-real-time pure-Python runtime-static type-checker.
  description: |
    Unbearably fast near-real-time pure-Python runtime-static type-checker.
  repository: https://github.com/beartype/beartype
  documentation: https://beartype.readthedocs.io

extra:
  recipe-maintainers:
    - leycec

