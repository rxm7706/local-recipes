# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0.20260724"

package:
  name: types-paramiko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-paramiko/types_paramiko-${{ version }}.tar.gz
  sha256: 37e7f3f2196cf187c89649ad836621c675bc318369d80fa78051507a4ae770c9

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - cryptography >=37.0.0
    - python >=${{ python_min }}

tests:
  - package_contents:
      site_packages:
        - paramiko-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/python/typeshed
  summary: Typing stubs for paramiko
  license: Apache-2.0 AND MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
