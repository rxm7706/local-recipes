# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.10"

package:
  name: flashrank
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/FlashRank/FlashRank-${{ version }}.tar.gz
  sha256: f8f82a25c32fdfc668a09dc4089421d6aab8e7f71308424b541f40bb3f01d9db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tokenizers
    - onnxruntime
    - numpy
    - requests
    - tqdm

tests:
  - python:
      imports:
        - flashrank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PrithivirajDamodaran/FlashRank
  license: Apache-2.0
  license_file: LICENSE
  summary: Ultra lite & Super fast SoTA cross-encoder based re-ranking for your search & retrieval pipelines.
  description: |
    Ultra lite & Super fast SoTA cross-encoder based re-ranking for your search & retrieval pipelines.

extra:
  recipe-maintainers:
    - rxm7706

