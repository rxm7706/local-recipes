# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.324.0"

package:
  name: strawberry-graphql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strawberry-graphql/strawberry_graphql-${{ version }}.tar.gz
  sha256: 4eb6decf0c33524374f24e07ff6d1915da26655a49fa6f656544c293404e2d35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11,<0.12
  run:
    - python >=${{ python_min }}
    - graphql-core <3.4.0,>=3.2.0
    - typing_extensions >=4.14.0
    - python-dateutil >=2.7
    - packaging >=23
    - cross-web >=0.6.0

tests:
  - python:
      imports:
        - strawberry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://strawberry.rocks/
  license: MIT
  license_file: LICENSE
  summary: A library for creating GraphQL APIs
  description: |
    A library for creating GraphQL APIs
  documentation: https://strawberry.rocks/

extra:
  recipe-maintainers:
    - cshaley
    - thewchan
    - bollwyvl

