# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: logging-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/logging-utils/logging_utils-1.0.2-py3-none-any.whl
  sha256: 6593d904acddae2897adbf2e3ebf26977934a4bd6759bfae5b4e0b3e19902193

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logging_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/faeriol/LoggingUtils
  license: MIT
  license_file: LICENSE
  summary: Additional utilities for Python logging.
  description: |
    Additional utilities for Python logging.

extra:
  recipe-maintainers:
    - rxm7706

