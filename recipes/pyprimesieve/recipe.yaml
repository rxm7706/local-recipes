# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: pyprimesieve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyprimesieve/pyprimesieve-${{ version }}.tar.gz
  sha256: a35ff1fe6453ba3c6e833dd1ac4719a23644e6130294159366eeaea96f1894a5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyprimesieve

tests:
  - python:
      imports:
        - pyprimesieve
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jaredks/pyprimesieve
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Many primes, very fast. Uses primesieve.
  description: |
    Many primes, very fast. Uses primesieve.

extra:
  recipe-maintainers:
    - rxm7706

