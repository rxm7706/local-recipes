# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: expiring-dict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/expiring-dict/expiring_dict-${{ version }}.tar.gz
  sha256: ca8cb802304eae5b33a23ec4c19019b610adfda50cbc4c9bfa3ad5c2cd387631

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sortedcontainers

tests:
  - python:
      imports:
        - expiring_dict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dparker2/py-expiring-dict
  license: MIT
  license_file: LICENSE
  summary: Python dict with TTL support for auto-expiring caches
  description: |
    Python dict with TTL support for auto-expiring caches

extra:
  recipe-maintainers:
    - rxm7706

