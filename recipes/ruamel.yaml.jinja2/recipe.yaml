# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ruamel.yaml.jinja2
  version: "0.2.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ruamel.yaml.jinja2-${{ version }}.tar.gz
  sha256: 8449be29d9a157fa92d1648adc161d718e469f0d38a6b21e0eabb76fd5b3e663

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - ${{ PYTHON }} ${{ RECIPE_DIR }}/rm_broken_file.py

requirements:
  host:
    - python ${{ python_min }}
    - wheel
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.16.1

tests:
  - python:
      imports:
        - ruamel.yaml.jinja2
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -c "from ruamel.yaml import YAML; YAML(typ='jinja2')"

about:
  license: MIT
  license_file: LICENSE
  summary: jinja2 pre and post-processor to update YAML
  description: |
    jinja2 templates for YAML files can normally not be loaded as YAML before
    rendering. This plugin allows pre and post-processing based on the
    round-trip processor.


  homepage: https://sourceforge.net/projects/ruamel-yaml-jinja2/

extra:
  recipe-maintainers:
    - rxm7706
    - marcelotrevisani
