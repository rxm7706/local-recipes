# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: snowplow-tracker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snowplow-tracker/snowplow_tracker-${{ version }}.tar.gz
  sha256: 95d8fdc8bd542fd12a0b9a076852239cbaf0599eda8721deaf5f93f7138fe755

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests <3.0,>=2.25.1
    - typing_extensions >=3.7.4

tests:
  - python:
      imports:
        - snowplow_tracker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://snowplow.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Snowplow event tracker for Python. Add analytics to your Python and Django apps, webapps and games
  description: |
    Snowplow event tracker for Python. Add analytics to your Python and Django apps, webapps and games

extra:
  recipe-maintainers:
    - thewchan

