# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: agents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agents/agents-${{ version }}.tar.gz
  sha256: 22b58de0aee838b19c547436734648c35571dd6d80d560d23c958571ae79c54d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - agents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/tensorflow/agents
  license: Apache-2.0
  license_file: LICENSE
  summary: Efficient TensorFlow implementation of reinforcement learning algorithms.
  description: |
    Efficient TensorFlow implementation of reinforcement learning algorithms.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
