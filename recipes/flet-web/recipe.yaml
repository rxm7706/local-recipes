# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.86.5"

package:
  name: flet-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flet-web/flet_web-${{ version }}.tar.gz
  sha256: 7fd538ece2d8d415347dc338d5a734beae11ec871fded0dab6094c1f54616480

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flet ==0.86.5
    - fastapi >=0.115.12
    - uvicorn >=0.35.0

tests:
  - python:
      imports:
        - flet_web
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://flet.dev
  license: Apache-2.0
  license_file: LICENSE
  summary: Flet web client in Flutter.
  description: |
    Flet web client in Flutter.
  repository: https://github.com/flet-dev/flet
  documentation: https://flet.dev/docs

extra:
  recipe-maintainers:
    - rxm7706

