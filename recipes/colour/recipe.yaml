# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: colour
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colour/colour-${{ version }}.tar.gz
  sha256: af20120fefd2afede8b001fbef2ea9da70ad7d49fafdb6489025dae8745c3aee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colour
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/vaab/colour
  license: BSD-3-Clause
  license_file: LICENSE
  summary: converts and manipulates various color representation (HSL, RVB, web, X11, ...)
  description: |
    converts and manipulates various color representation (HSL, RVB, web, X11, ...)

extra:
  recipe-maintainers:
    - fhoehle
    - pmlandwehr

