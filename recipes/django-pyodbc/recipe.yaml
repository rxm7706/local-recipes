# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.3"

package:
  name: django-pyodbc
  version: ${{ version }}

source:
  url: https://github.com/lionheart/django-pyodbc/archive/refs/tags/${{ version }}.tar.gz
  sha256: 28f307b267b551ddbff98de8bbe0a99b2d59b9452ed2ebe26d75c883768ead58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyodbc

tests:
  - python:
      imports:
        - django_pyodbc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lionheart/django-pyodbc
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django 1.5-1.10 SQL Server backend using pyodbc.
  description: |
    Django 1.5-1.10 SQL Server backend using pyodbc.

extra:
  recipe-maintainers:
    - rxm7706

