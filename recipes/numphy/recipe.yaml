# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: numphy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numphy/numphy-${{ version }}.tar.gz
  sha256: a2513e79a2a874e3ec229e229b2be053b5fe395a2c333cfcb06d1ca4ebabbd33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - numphy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/riga/numphy
  license: MIT
  license_file: LICENSE
  summary: Physics objects backed by NumPy and/or TensorFlow.
  description: |
    Physics objects backed by NumPy and/or TensorFlow.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
