# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: strands-agents
  version: "1.52.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/strands_agents-${{ version }}.tar.gz
  sha256: e79f08527cf3b03ace3ead081f71ee43ee33de7285a4faa9ecafaef4618afeb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - boto3 >=1.26.0,<2.0.0
    - botocore >=1.29.0,<2.0.0
    - docstring_parser >=0.15,<1.0
    - mcp >=1.23.0,<2.0.0
    - pydantic >=2.4.0,<3.0.0
    - typing_extensions >=4.13.2,<5.0.0
    - watchdog >=6.0.0,<7.0.0
    - opentelemetry-api >=1.30.0,<2.0.0
    - opentelemetry-sdk >=1.30.0,<2.0.0
    - opentelemetry-instrumentation-threading >=0.51b0,<1.00b0

tests:
  - python:
      imports:
        - strands
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -c "from strands import Agent"

about:
  summary: A model-driven approach to building AI agents in just a few lines of code
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/strands-agents
  repository: https://github.com/strands-agents
  documentation: https://github.com/strands-agents

extra:
  recipe-maintainers:
    - yonib05
    - Unshure
    - athkulk
    - giswqs
