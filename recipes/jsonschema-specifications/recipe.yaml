# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.9.1"

package:
  name: jsonschema-specifications
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema-specifications/jsonschema_specifications-${{ version }}.tar.gz
  sha256: b540987f239e745613c7a9176f3edb72b832a4ac465cf02712288397832b5e8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - referencing >=0.31.0

tests:
  - python:
      imports:
        - jsonschema_specifications
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-jsonschema/jsonschema-specifications
  license: MIT
  license_file: LICENSE
  summary: The JSON Schema meta-schemas and vocabularies, exposed as a Registry
  description: |
    The JSON Schema meta-schemas and vocabularies, exposed as a Registry
  repository: https://github.com/python-jsonschema/jsonschema-specifications
  documentation: https://jsonschema-specifications.readthedocs.io/

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
