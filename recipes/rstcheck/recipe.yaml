# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rstcheck
  version: "6.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 583072b43939627b1b0f4492e8af2587092efc1fb5e9f0228fa2df9ea3b44873

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - rstcheck = rstcheck._cli:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - pip
    - rstcheck-core >=1.3.1
    - typer >=0.12

tests:
  - python:
      imports:
        - rstcheck
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - rstcheck --help

about:
  license: MIT
  license_file: LICENSE
  summary: Checks syntax of reStructuredText and code blocks nested within it
  homepage: https://pypi.org/project/rstcheck
  repository: https://github.com/rstcheck/rstcheck
  documentation: https://pypi.org/project/rstcheck

extra:
  recipe-maintainers:
    - kynan
