# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.0"

package:
  name: sqlalchemy-spanner
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-spanner/sqlalchemy_spanner-${{ version }}.tar.gz
  sha256: 834cec66fb418e5085a44c68cee570c594c66dd8535b67dd5e8be3571d172136

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.1.13
    - google-cloud-spanner >=3.55.0
    - alembic

tests:
  - python:
      imports:
        - google.cloud.sqlalchemy_spanner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cloudspannerecosystem/python-spanner-sqlalchemy
  license: Apache-2.0
  license_file: LICENSE
  summary: SQLAlchemy dialect integrated into Cloud Spanner database
  description: |
    SQLAlchemy dialect integrated into Cloud Spanner database

extra:
  recipe-maintainers:
    - xylar

