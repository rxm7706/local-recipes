# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: odict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/odict/odict-${{ version }}.tar.gz
  sha256: 26fa21a9cc07d1b7231aab2fbcf63dd8f0ae14172d39bc355f070cd0e801072a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - odict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/conestack/odict
  license: PSF-2.0
  license_file: LICENSE
  summary: Ordered Dictionary.
  description: |
    Ordered Dictionary.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
