# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: pytest-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-metadata/pytest_metadata-${{ version }}.tar.gz
  sha256: d2a29b0355fbc03f168aa96d41ff88b1a3b44a3b02acbe491801c98a048017c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.3
    - hatchling >=1.13
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - pytest_metadata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-metadata
  license: MPL-2.0
  license_file: LICENSE
  summary: pytest plugin for test session metadata
  description: |
    pytest plugin for test session metadata
  repository: https://github.com/pytest-dev/pytest-metadata

extra:
  recipe-maintainers:
    - birdsarah
    - davehunt
    - nicoddemus

#### CFE metadata AND comments
