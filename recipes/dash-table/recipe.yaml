# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash-table
  filename: dash_table
  version: "5.0.0"
  sha256: 18624d693d4c8ef2ddec99a6f167593437a7ea0bf153aa20f318c170c5bc7308

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ filename }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ filename }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - dash >=2.0.0

tests:
  - python:
      imports:
        - dash_table
      pip_check: false

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: A First-Class Interactive DataTable for Dash
  homepage: https://dash.plot.ly/datatable
  repository: https://github.com/plotly/dash-table

extra:
  recipe-maintainers:
    - dkucharc
    - moorepants
