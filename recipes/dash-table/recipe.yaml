# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0"

package:
  name: dash-table
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-table/dash_table-${{ version }}.tar.gz
  sha256: 18624d693d4c8ef2ddec99a6f167593437a7ea0bf153aa20f318c170c5bc7308

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash

tests:
  - python:
      imports:
        - dash_table
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dash-table/
  license: MIT
  license_file: LICENSE
  summary: Dash table
  description: |
    Dash table

extra:
  recipe-maintainers:
    - dkucharc
    - moorepants

#### CFE metadata AND comments
