# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: toolbox-adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toolbox-adk/toolbox_adk-${{ version }}.tar.gz
  sha256: 08be0d4655b8b99dc049230c7f3d981d672deaa840a49716dd48f7dec9ea6c4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - toolbox-core ==1.3.0
    - google-auth <3.0.0,>=2.47.0
    - google-auth-oauthlib <2.0.0,>=1.2.0
    - google-adk <3.0.0,>=1.27.4
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - toolbox_adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/mcp-toolbox-sdk-python/blob/main/packages/toolbox-adk
  license: Apache-2.0
  license_file: LICENSE
  summary: Agent Development Kit Integration for MCP Toolbox
  description: |
    Agent Development Kit Integration for MCP Toolbox
  repository: https://github.com/googleapis/mcp-toolbox-sdk-python.git

extra:
  recipe-maintainers:
    - rxm7706

