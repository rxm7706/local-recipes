# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2"

package:
  name: setuptools-git
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-git/setuptools-git-${{ version }}.tar.gz
  sha256: ff64136da01aabba76ae88b050e7197918d8b2139ccbf6144e14d472b9c40445

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - setuptools_git
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/msabramo/setuptools-git
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Setuptools revision control system plugin for Git
  description: |
    Setuptools revision control system plugin for Git

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
