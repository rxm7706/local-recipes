# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pymermaid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymermaid/pymermaid-${{ version }}.tar.gz
  sha256: 954c6981c68f77e970f8c06aa09f428cbee6ac8ae354c5e3003f01d48eb9f9c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - matplotlib-inline
    - selenium

tests:
  - python:
      imports:
        - pymermaid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitee.com/longgenxing/jupyter_mermaid
  license: MIT
  license_file: LICENSE
  summary: (firefox recommended)a package in getting images output from mermaid markdown tags. Especially this package could be used in jupyter lab or notebook, cause it is lack of flowchart\gatt\seqeunses
  description: |
    (firefox recommended)a package in getting images output from mermaid markdown tags. Especially this package could be used in jupyter lab or notebook, cause it is lack of flowchart\gatt\seqeunses
  repository: https://gitee.com/longgenxing/jupyter_mermaid
  documentation: https://gitee.com/longgenxing/jupyter_mermaid

extra:
  recipe-maintainers:
    - rxm7706

