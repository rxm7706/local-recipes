# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: streamlit-notify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-notify/streamlit_notify-${{ version }}.tar.gz
  sha256: 89e2f0655059571df84952a2875ce27e6e43cfea871e69da95dfcf3a23caa445

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - streamlit
    - packaging

tests:
  - python:
      imports:
        - streamlit_notify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pgarrett-scripps/Streamlit_Notify
  license: MIT
  license_file: LICENSE
  summary: A Streamlit component that provides toast notifications that persist across reruns
  description: |
    A Streamlit component that provides toast notifications that persist across reruns
  documentation: https://streamlit-notify.readthedocs.io/en/latest/usage.html

extra:
  recipe-maintainers:
    - rxm7706

