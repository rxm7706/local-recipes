# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: torchinfo
  version: "1.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 72e94b0e9a3e64dc583a8e5b7940b8938a1ac0f033f795457f27e6f4e7afa2e9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch >=1.6

tests:
  - python:
      imports:
        - torchinfo
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Model summary in PyTorch, based off of the original torchsummary.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tyleryep/torchinfo
  documentation: https://github.com/TylerYep/torchinfo#documentation

extra:
  recipe-maintainers:
    - TylerYep
    - sarthakpati
