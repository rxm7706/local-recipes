# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: pywin32-ctypes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywin32-ctypes/pywin32-ctypes-${{ version }}.tar.gz
  sha256: d162dc04946d704503b2edc4d55f3dba5c1d539ead017afa00142c38b9885755

build:
  number: 3
  skip: match(python, "<3.7")
  skip: true  # [py<37]
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - win32ctypes
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A limited subset of pywin32 re-implemented using ctypes (or cffi)
  description: |
    A reimplementation of pywin32 that is pure python. The default behaviour
    will try to use cffi (>= 1.3.0), if available, and fall back to using ctypes.
  homepage: https://github.com/enthought/pywin32-ctypes
  repository: https://github.com/enthought/pywin32-ctypes
  documentation: http://pywin32-ctypes.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - ccordoba12
