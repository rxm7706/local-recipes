# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.1"

package:
  name: contextualized-topic-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/contextualized-topic-models/contextualized_topic_models-${{ version }}.tar.gz
  sha256: e9b5014eb4057acac6092345fa5eabe6145dc54f4ccc6e05d7d4b8ec90f7a916

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24.0
    - torchvision >=0.15.0
    - pytorch >=2.0.0
    - gensim >=4.3.3
    - sentence-transformers >=2.2.0
    - wordcloud >=1.9.0
    - matplotlib-base >=3.6.0
    - nltk >=3.8.0
    - tqdm >=4.64.0
    - scipy >=1.10.0
    - ipywidgets >=8.0.0
    - ipython_genutils >=0.2.0

tests:
  - python:
      imports:
        - contextualized_topic_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MilaNLProc/contextualized-topic-models
  license: MIT
  license_file: LICENSE
  summary: Contextualized Topic Models
  description: |
    Contextualized Topic Models

extra:
  recipe-maintainers:
    - rxm7706

