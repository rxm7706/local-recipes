# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: catwalk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Catwalk/Catwalk-${{ version }}.tar.gz
  sha256: dfbb93e69fe74a4d1474f5f10a13323358ba7791131f3d79d3a3783d6be14ca4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - catwalk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/tgtools/wiki/Catwalk
  license: MIT
  license_file: LICENSE
  summary: A way to view your models using TurboGears
  description: |
    A way to view your models using TurboGears

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
