# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kedro-dagster
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kedro-dagster/kedro_dagster-${{ version }}.tar.gz
  sha256: 552679cc4da54371aa09ea76382b08df279c8db89204660ce9b9e17f9b71261e

build:
  number: 0
  noarch: python
  script:
    env:
      WARNINGS: "ignore::kedro.KedroPythonVersionWarning"
      PYTHONWARNINGS: "ignore::UserWarning"
    content:
      - "${{ PYTHON }} -m pip install -vv --use-pep517 --no-deps --no-build-isolation ."

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - kedro >=1.0.0
    - kedro-datasets >=1.0.0
    - dagster >=1.10,<2.0
    - dagster-webserver
    - dagster-dg-cli
    - pydantic >=2.0.0
    - cachetools >=4.1

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      env:
        WARNINGS: "ignore::kedro.KedroPythonVersionWarning"
        PYTHONWARNINGS: "ignore::UserWarning"
      interpreter: python
      content: |
        import kedro_dagster

about:
  summary: Kedro-Dagster makes it easy to deploy Kedro projects to Dagster
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/kedro-dagster
  documentation: https://kedro-dagster.readthedocs.io
  repository: https://github.com/stateful-y/kedro-dagster

extra:
  recipe-maintainers:
    - gtauzin
    - rxm7706

#### CFE metadata AND comments
