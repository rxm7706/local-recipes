# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: click-didyoumean
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/click-didyoumean/click_didyoumean-${{ version }}.tar.gz
  sha256: 4f82fdff0dbe64ef8ab2279bd6aa3f6a99c3b28c05aa09cbfc07c9d7fbb5a463

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - click >=7

tests:
  - python:
      imports:
        - click_didyoumean
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/click-contrib/click-didyoumean
  license: MIT
  license_file: LICENSE
  summary: Enables git-like *did-you-mean* feature in click
  description: |
    Enables git-like *did-you-mean* feature in click
  repository: https://github.com/click-contrib/click-didyoumean

extra:
  recipe-maintainers:
    - duncanmmacleod

