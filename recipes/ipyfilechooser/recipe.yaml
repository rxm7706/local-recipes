# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: ipyfilechooser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipyfilechooser/ipyfilechooser-${{ version }}.tar.gz
  sha256: 41df9e4395a924f8e1b78e2804dbe5066dc3fdc233fb07fecfcdc2a0c9a7d8d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipywidgets

tests:
  - python:
      imports:
        - ipyfilechooser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/crahan/ipyfilechooser
  license: MIT
  license_file: LICENSE
  summary: Python file chooser widget for use in Jupyter/IPython in conjunction with ipywidgets
  description: |
    Python file chooser widget for use in Jupyter/IPython in conjunction with ipywidgets

extra:
  recipe-maintainers:
    - crahan

