# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: py-key-value
  version: "0.4.5"

recipe:
  name: py-key-value
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/py_key_value_aio/py_key_value_aio-${{ version }}.tar.gz
    sha256: c6563a2c6abe5da5e20f4f9e875c2a9b425a2244a54fadbf46cf140a9eea45d7
    target_directory: py-key-value-aio

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: py-key-value-aio
    build:
      noarch: python
      script:
        - cd ${{ SRC_DIR }}/py-key-value-aio && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - python ${{ python_min }}.*
        - uv-build >=0.8.2,<0.9.0
        - pip
      run:
        - python >=${{ python_min }},<4
        # [project.dependencies]
        # https://github.com/strawgate/py-key-value/blob/0.2.8/key-value/key-value-aio/pyproject.toml#L17-L19
        - beartype >=0.20.0
        - typing-extensions >=4.15.0
      run_constraints:
        # [project.optional-dependencies.standard]
        # https://github.com/strawgate/py-key-value/blob/0.2.8/key-value/key-value-aio/pyproject.toml#L34-L49
        # py-key-value-aio[memory]
        - cachetools >=5.0.0
        # py-key-value-aio[disk]
        - diskcache >=5.0.0
        - pathvalidate >=3.3.1
        # py-key-value-aio[redis]
        - redis-py >=4.3.0
        # py-key-value-aio[mongodb]
        - pymongo >=4.0.0
        # py-key-value-aio[valkey]
        - valkey-glide >=2.1.0
        # py-key-value-aio[vault]
        - hvac >=2.3.0
        - types-hvac >=2.3.0
        # py-key-value-aio[memcached]
        - aiomcache >=0.8.0
        # py-key-value-aio[elasticsearch]
        - elasticsearch >=8.0.0
        - aiohttp>=3.12
        # py-key-value-aio[dynamodb]
        - aioboto3 >=13.3.0
        - types-aiobotocore-dynamodb >=2.16.0
        # py-key-value-aio[keyring]
        - keyring >=25.6.0
        # py-key-value-aio[keyring-linux]
        - keyring >=25.6.0
        - dbus-python >=1.4.0
        # py-key-value-aio[registry]
        # Uses built-in winreg module on Windows
        # py-key-value-aio[pydantic]
        - pydantic >=2.11.9
        # py-key-value-aio[rocksdb]
        - rocksdict >=0.3.2
        # py-key-value-aio[wrappers-encryption]
        - cryptography >=45.0.0
    tests:
      - python:
          imports:
            - key_value
            - key_value.shared
            - key_value.aio
            - key_value.aio.stores.base
          pip_check: true
          python_version:
            - ${{ python_min }}.*
      - requirements:
          run:
            - python ${{ python_min }}.*
            - pip
        script:
          - python -c "from importlib.metadata import version; v = version('py-key-value-aio'); print(v); assert v == '${{ version }}'"
          - pip check
    about:
      license: Apache-2.0
      license_file: LICENSE
      summary: Shared Key-Value, A pluggable interface for KV Stores
      homepage: https://pypi.org/project/py-key-value-aio/
      repository: https://github.com/strawgate/py-key-value/tree/main/key-value/key-value-aio
      documentation: https://github.com/strawgate/py-key-value/blob/main/README.md

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Shared Key-Value, A pluggable interface for KV Stores
  homepage: https://github.com/strawgate/py-key-value
  documentation: https://github.com/strawgate/py-key-value/blob/main/README.md

extra:
  feedstock-name: py-key-value
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: py-key-value-aio
  cfe-upstream-registry: pypi
  cfe-upstream-name: py-key-value-aio
  cfe-purls:
    - pkg:conda/py-key-value-aio@${{ version }}?channel=conda-forge
    - pkg:pypi/py-key-value-aio@${{ version }}
  cfe-upstream-repo: https://github.com/strawgate/py-key-value
  cfe-upstream-homepage: https://pypi.org/project/py-key-value-aio/
  cfe-import-names: [key_value, key_value.shared, key_value.aio, key_value.aio.stores.base]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: true
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/py-key-value-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-06-20T00:00:00Z
