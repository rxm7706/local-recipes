# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.30"

package:
  name: langmem
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langmem/langmem-${{ version }}.tar.gz
  sha256: 4e27920979f8253a96d279f4f97b1aebbfb49e95a46d5269433488ed044756e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-anthropic >=0.3.3
    - langchain-core >=0.3.46
    - langchain-openai >=0.3.1
    - langchain >=0.3.15
    - langgraph-checkpoint >=2.0.12
    - langgraph <2,>=0.6.0
    - langsmith >=0.3.8
    - trustcall >=0.0.39

tests:
  - python:
      imports:
        - langmem
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langmem/
  license: MIT
  license_file: LICENSE
  summary: Prebuilt utilities for memory management and retrieval.
  description: |
    Prebuilt utilities for memory management and retrieval.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langmem
