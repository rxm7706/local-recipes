# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fonttools
  version: "4.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fonttools-${{ version }}.tar.gz
  sha256: caeb583deeb5168e694b65cda8b4ee62abedfa66cf88488734466f2366b9c4e0

build:
  number: 0
  noarch: ${{ 'python' if use_noarch else '' }}
  script:
    - if: use_noarch
      then: export FONTTOOLS_WITH_CYTHON=0
    - ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - fonttools = fontTools.__main__:main
      - ttx = fontTools.ttx:main
      - pyftsubset = fontTools.subset:main
      - pyftmerge = fontTools.merge:main
  track_features:
    - if: use_noarch
      then: fonttools_no_compile

requirements:
  build:
    - if: build_platform != target_platform and not use_noarch
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - cython
    - pip
    - setuptools
    - if: use_noarch
      then: python ${{ python_min }}
    - if: not use_noarch
      then: python
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
    - if: not use_noarch
      then: python
    - brotli
    - munkres
    - if: use_noarch or match(python, "<=3.12")
      then: unicodedata2 >=15.1.0

tests:
  - python:
      imports:
        - fontTools
        - fontTools.ttLib
        - fontTools.cffLib
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - fonttools --help
      - fonttools subset --help
      - ttx -h
      - pyftsubset --help

about:
  license: MIT
  license_file: LICENSE
  summary: fontTools is a library for manipulating fonts, written in Python.
  description: |
    fontTools is a library for manipulating fonts, written in Python. The
    project includes the TTX tool, that can convert TrueType and OpenType
    fonts to and from an XML text format, which is also called TTX. It
    supports TrueType, OpenType, AFM and to an extent Type 1 and some
    Mac-specific formats. The project has a BSD-style open-source licence.

  homepage: https://github.com/fonttools/fonttools
  repository: https://github.com/fonttools/fonttools
  documentation: https://groups.google.com/forum/#!forum/fonttools

extra:
  recipe-maintainers:
    - CJ-Wright
    - dopplershift
    - tacaswell
