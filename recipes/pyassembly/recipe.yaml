# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3"

package:
  name: pyassembly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyassembly/pyassembly-${{ version }}.tar.gz
  sha256: 7a1a0d93d575d50d8274884cbaed09c5dbe4950b6b4767f5e7d3cdd76f163846

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pip
    - setuptools

tests:
  - python:
      imports:
        - pyassembly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alekseyig/pyassembly
  license: MIT
  license_file: LICENSE
  summary: Creates an egg or a zip distribution with all its transitive dependencies
  description: |
    Creates an egg or a zip distribution with all its transitive dependencies

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyassembly
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyassembly
  cfe-purls:
    - pkg:conda/pyassembly@${{ version }}?channel=conda-forge
    - pkg:pypi/pyassembly@${{ version }}
  cfe-upstream-repo: https://github.com/alekseyig/pyassembly
  cfe-upstream-homepage: https://github.com/alekseyig/pyassembly
  cfe-import-names: [pyassembly]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
