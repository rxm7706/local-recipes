# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: str2bool
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/str2bool/str2bool-1.1.zip
  sha256: dbc3c917dca831904bce8568f6fb1f91435fcffc2ec4a46d62c9aa08d7cf77c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - str2bool
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/symonsoft/str2bool
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Convert string to boolean
  description: |
    Convert string to boolean

extra:
  recipe-maintainers:
    - rxm7706

