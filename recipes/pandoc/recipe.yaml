# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.2"

package:
  name: pandoc
  version: ${{ version }}

source:
  url: ${{ 'https://github.com/jgm/pandoc/releases/download/${{ version }}/pandoc-${{ version }}-windows-x86_64.zip' if win else 'https://github.com/jgm/pandoc/releases/download/${{ version }}/pandoc-${{ version }}-arm64-macOS.zip' if osx and arm64 else 'https://github.com/jgm/pandoc/releases/download/${{ version }}/pandoc-${{ version }}-x86_64-macOS.zip' if osx and not arm64 else 'https://github.com/jgm/pandoc/releases/download/${{ version }}/pandoc-${{ version }}-linux-arm64.tar.gz' if linux and aarch64 else 'https://github.com/jgm/pandoc/releases/download/${{ version }}/pandoc-${{ version }}-linux-amd64.tar.gz' if linux and not aarch64 else '' }}
  sha256: ${{ '52487faaa63f8cef5363d5a771097da001228d61c6f44f32ed41b27a98c0278c' if win else 'a30bd546062f0b29c25f45a71f951b7a1cf4f998d5b43974ea2c2416133f2e99' if osx and arm64 else '437d378af72e9648f6fb42c170031218a3c2f31cf5089234cf2d0413f91481d0' if osx and not arm64 else '1c4d69f2a092bd47cb180e58a4aab7b9637101ced928252458c7d41a7f7fa71d' if linux and aarch64 else 'c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a' if linux and not aarch64 else '' }}

build:
  number: 0
  dynamic_linking:
    binary_relocation: ${{ true if osx }}
    missing_dso_allowlist:
      - if: osx
        then: /usr/lib/libiconv.2.dylib
      - if: osx
        then: /usr/lib/libz.1.dylib
      - if: osx
        then: /usr/lib/libcharset.1.dylib

tests:
  - script:
      - if: osx
        then: type pandoc
      - pandoc --version
      - pandoc --help

about:
  license: GPL-2.0-or-later
  license_file: COPYRIGHT
  summary: The universal markup converter
  description: |
    Pandoc is a Haskell library for converting from one markup format to
    another, and a command-line tool that uses this library.
  homepage: http://pandoc.org/
  repository: https://github.com/jgm/pandoc
  documentation: http://pandoc.org/MANUAL.html

extra:
  recipe-maintainers:
    - m-rossi
    - jankatins
    - ocefpaf
    - kiwi0fruit
