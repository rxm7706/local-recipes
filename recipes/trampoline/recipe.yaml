# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: trampoline
  version: "0.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://gitlab.com/ferreum/trampoline/-/archive/1d98f39c3015594e2ac8ed48dccc2f393b4dd82b/trampoline-1d98f39c3015594e2ac8ed48dccc2f393b4dd82b.tar.gz
  sha256: 4e026488a57a7a49b3c4a809a93ace8fcccae5b66a7ef9b1b9581755c38ae15f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - trampoline
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Simple and tiny yield-based trampoline implementation
  description: |
    Simple and tiny yield-based trampoline implementation.
  homepage: https://gitlab.com/ferreum/trampoline
  repository: https://gitlab.com/ferreum/trampoline
  documentation: https://gitlab.com/ferreum/trampoline

extra:
  recipe-maintainers:
    - krisevans
    - dhirschfeld
