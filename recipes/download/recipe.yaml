# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: download
  version: "0.3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/download-${{ version }}.tar.gz
  sha256: 884a885475b3cdbec0aa277e41643995c3394a1e064a0816f53fffae4a382130

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - requests
    - six
    - tqdm

tests:
  - python:
      imports:
        - download
      pip_check: true

about:
  summary: A quick module to help downloading files using python.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/choldgraf/download

extra:
  recipe-maintainers:
    - mfansler
