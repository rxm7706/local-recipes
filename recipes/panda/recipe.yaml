# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: panda
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panda/panda-${{ version }}.tar.gz
  sha256: f213b848f09268b3e9fce0e103155ab003217c0e27f6048b6194e7f90bb2b716

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - panda
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.pandastream.com
  license: MIT
  license_file: LICENSE
  summary: A Python implementation of the Panda REST interface
  description: |
    A Python implementation of the Panda REST interface

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: panda
  cfe-upstream-registry: pypi
  cfe-upstream-name: panda
