# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-instrumentation-botocore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-botocore/opentelemetry_instrumentation_botocore-${{ version }}.tar.gz
  sha256: 64987326ac98a47a85821606a981f5058864de0e98b43c8de892eb0fe625b04e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - botocore
    - opentelemetry-api ~=1.37
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-propagator-aws-xray ~=1.0
    - opentelemetry-semantic-conventions ==0.65b0
    - wrapt <3.0.0,>=1.0.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.botocore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-botocore
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Botocore instrumentation
  description: |
    OpenTelemetry Botocore instrumentation
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

