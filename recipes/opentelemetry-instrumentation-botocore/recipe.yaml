# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-instrumentation-botocore
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_botocore-${{ version }}.tar.gz
  sha256: 64987326ac98a47a85821606a981f5058864de0e98b43c8de892eb0fe625b04e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.37
    - opentelemetry-instrumentation ==0.65b0
    - opentelemetry-semantic-conventions ==0.65b0
    - opentelemetry-propagator-aws-xray ~=1.0
