{% set name = "opentelemetry-instrumentation-botocore" %}
{% set version = "0.66b1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_botocore-{{ version }}.tar.gz
  sha256: c601923e40aa008f4c0466b714c112fe47da07adb72ae6c69e2ac95992bcd66e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - opentelemetry-api ~=1.37
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-propagator-aws-xray ~=1.0
