# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.60.2"

package:
  name: oletools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oletools/oletools-0.60.2.zip
  sha256: ad452099f4695ffd8855113f453348200d195ee9fa341a09e197d66ee7e0b2c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyparsing <4,>=2.1.0
    - olefile >=0.46
    - easygui
    - colorclass
    - pcodedmp >=1.2.5

tests:
  - python:
      imports:
        - oletools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/decalage2/oletools
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python tools to analyze security characteristics of MS Office and OLE files (also called Structured Storage, Compound File Binary Format or Compound Document File Format), for Malware Analysis and Incident Response #DFIR
  description: |
    Python tools to analyze security characteristics of MS Office and OLE files (also called Structured Storage, Compound File Binary Format or Compound Document File Format), for Malware Analysis and Incident Response #DFIR

extra:
  recipe-maintainers:
    - jan-janssen
    - cshaley
    - sannykr

