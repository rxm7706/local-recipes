# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cmd2
  version: "4.2.0"
  bundle: tar.gz
  hash: 0546543c1ba3c6090ecec33f1373c59627e417b14419629a48176115946fd329
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools_scm
    - setuptools
    - python-build
  run:
    - python >=${{ python_min }}
    - prompt-toolkit >=3.0.52
    - pyperclip >=1.8.2
    - rich >=15.0.0
    - rich-argparse >=1.7.2

tests:
  - python:
      imports:
        - cmd2
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license_file: LICENSE
  license: MIT
  summary: Extra features for standard library's cmd module
  homepage: https://github.com/python-cmd2/cmd2
  repository: https://github.com/python-cmd2/cmd2
  documentation: https://cmd2.readthedocs.io/

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj
