# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.6"

package:
  name: django-storages
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-storages/django_storages-${{ version }}.tar.gz
  sha256: 7a25ce8f4214f69ac9c7ce87e2603887f7ae99326c316bc8d2d75375e09341c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - django >=3.2

tests:
  - python:
      imports:
        - storages
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jschneier/django-storages
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Support for many storage backends in Django
  description: |
    Support for many storage backends in Django

extra:
  recipe-maintainers:
    - rxm7706
    - BastianZim
    - cshaley
    - sannykr

