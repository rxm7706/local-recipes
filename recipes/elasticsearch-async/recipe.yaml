# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: elasticsearch-async
  version: "6.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2534f3ec80da275723cabd6d354c83eb4b4f6241ad1432b48c2c05fb12175ab1
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1002
  skip: match(python, "<3.4")
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - aiohttp
    - async-timeout
    - elasticsearch >=6.0.0

tests:
  - python:
      imports:
        - elasticsearch_async
      pip_check: false

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Async backend for elasticsearch-py
  description: |
    This is an adapter for elasticsearch-py providing a transport layer based
    on Python’s asyncio module. All API calls now return a future wrapping
    the response.
  homepage: https://github.com/elastic/elasticsearch-py-async
  repository: https://github.com/elastic/elasticsearch-py-async
  documentation: https://pypi.python.org/pypi/elasticsearch-async

extra:
  recipe-maintainers:
    - nehaljwani
    - sethmlarson
