# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: tree-sitter-xml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tree-sitter-xml/tree_sitter_xml-${{ version }}.tar.gz
  sha256: ab0ff396f20230ad8483d968151ce0c35abe193eb023b20fbd8b8ce4cf9e9f61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bindings.python.tree_sitter_xml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tree-sitter/tree-sitter-xml
  license: MIT
  license_file: LICENSE
  summary: XML & DTD grammars for tree-sitter
  description: |
    XML & DTD grammars for tree-sitter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
