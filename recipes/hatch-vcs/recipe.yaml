# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: hatch-vcs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hatch-vcs/hatch_vcs-${{ version }}.tar.gz
  sha256: 0395fa126940340215090c344a2bf4e2a77bcbe7daab16f41b37b98c95809ff9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.1.0
  run:
    - python >=${{ python_min }}
    - hatchling >=1.1.0
    - setuptools-scm >=8.2.0

tests:
  - python:
      imports:
        - hatch_vcs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/hatch-vcs/
  license: MIT
  license_file: LICENSE.txt
  summary: Hatch plugin for versioning with your preferred VCS
  description: |
    Hatch plugin for versioning with your preferred VCS
  repository: https://github.com/ofek/hatch-vcs

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
