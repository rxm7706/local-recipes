# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: agnoctl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agnoctl/agnoctl-${{ version }}.tar.gz
  sha256: 6fce1d2482b1f2e0a3d14b0a7c12fbd49d8df4f0bf0a4fd9fd91753cbff5efdc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agno = agnoctl.main:app
      - agnoctl = agnoctl.main:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx
    - rich
    - typer
    - tomli

tests:
  - python:
      imports:
        - agnoctl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - agno --help
      - agnoctl --help

about:
  homepage: https://agno.com
  license: Apache-2.0
  license_file: LICENSE
  summary: "The Agno CLI: connect and operate AgentOS from the terminal, built for humans and coding agents"
  description: |
    The Agno CLI: connect and operate AgentOS from the terminal, built for humans and coding agents
  documentation: https://docs.agno.com

extra:
  recipe-maintainers:
    - rxm7706

