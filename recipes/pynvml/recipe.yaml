# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.0.1"

package:
  name: pynvml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pynvml/pynvml-${{ version }}.tar.gz
  sha256: 1245991d9db786b4d2f277ce66869bd58f38ac654e38c9397d18f243c8f6e48f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nvidia-ml-py >=12.0.0

tests:
  - python:
      imports:
        - pynvml_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gpuopenanalytics/pynvml
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Python utilities for the NVIDIA Management Library
  description: |
    Python utilities for the NVIDIA Management Library
  repository: https://github.com/gpuopenanalytics/pynvml

extra:
  recipe-maintainers:
    - rjzamora

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pynvml
  cfe-upstream-registry: pypi
  cfe-upstream-name: pynvml
  cfe-purls:
    - pkg:conda/pynvml@${{ version }}?channel=conda-forge
    - pkg:pypi/pynvml@${{ version }}
  cfe-upstream-repo: https://github.com/gpuopenanalytics/pynvml
  cfe-upstream-homepage: https://github.com/gpuopenanalytics/pynvml
  cfe-import-names: [pynvml_utils]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pynvml-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-13.0.1

  cfe-forge-blocker-list:
