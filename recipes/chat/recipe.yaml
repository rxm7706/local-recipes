# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7.dev136"

package:
  name: chat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chat/chat-${{ version }}.tar.gz
  sha256: a10767b6642ebe15a219a1d36883e4642f1d8a2eca5013c0d7a733f2c730c117

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pypi.python.org/pypi/chat
  license: MIT
  license_file: LICENSE
  summary: Chat robot based on natural language understanding and machine learning.
  description: |
    Chat robot based on natural language understanding and machine learning.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
