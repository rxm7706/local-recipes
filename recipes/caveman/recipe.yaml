# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.0"

package:
  name: caveman
  version: ${{ version }}

source:
  url: https://github.com/juliusbrussee/caveman/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3e487f5b3b0916cc5594f2bf4973b47cf5711995be68eae4ae92f4698444756f

build:
  number: 1
  # Per-arch (NOT noarch), following the openspec/bmalph pattern: each
  # platform's npm global install lays down its native bin shims (symlinks
  # on unix, .cmd on win), which a single noarch artifact cannot provide.
  script:
    - if: unix
      then:
        - export npm_config_prefix="${PREFIX}"
        - npm pack --ignore-scripts
        - npm install -g ./caveman-installer-*.tgz
      else:
        - call npm config set prefix "%PREFIX%"
        - if %ERRORLEVEL% neq 0 exit 1
        - call npm pack --ignore-scripts
        - if %ERRORLEVEL% neq 0 exit 1
        - for %%f in (caveman-installer-*.tgz) do call npm install --userconfig nonexistentrc -g %%f
        - if %ERRORLEVEL% neq 0 exit 1

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18

tests:
  - script:
      - caveman-install --help
  - if: unix
    then:
      script:
        - test -f "${PREFIX}/lib/node_modules/caveman-installer/package.json"
        - test -f "${PREFIX}/lib/node_modules/caveman-installer/dist/caveman.skill"
        - test -d "${PREFIX}/lib/node_modules/caveman-installer/skills"
        - test -d "${PREFIX}/lib/node_modules/caveman-installer/plugins"

about:
  homepage: https://github.com/juliusbrussee/caveman
  repository: https://github.com/juliusbrussee/caveman
  license: MIT
  license_file: LICENSE
  summary: Claude Code skill that cuts ~65% of output tokens by talking like caveman
  description: |
    "Why use many token when few token do trick." caveman is an
    ultra-compressed communication mode for Claude Code: a skill/plugin
    that measurably cuts about 65% of output tokens while keeping full
    technical accuracy.

    This package ships the upstream installer CLI. After conda install,
    run ``caveman-install`` in a project (or ``caveman-install --help``
    for scopes and options) to deploy the skill into Claude Code's
    skills/plugin directories. Upstream also maintains Codex and Gemini
    variants of the mode.

    Since v2.0.0 upstream also ships a separate "Caveman Proxy" product
    (npm package ``@caveman-ai/cli``, providing the ``caveman``/``cave``
    commands) that shrinks agent *input* tokens via a local proxy with
    BSL-1.1-licensed compression internals. This recipe packages only
    the original MIT-licensed skill installer, not the proxy.

extra:
  recipe-maintainers:
    - rxm7706

