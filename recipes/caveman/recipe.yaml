# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.1"

package:
  name: caveman
  version: ${{ version }}

source:
  url: https://github.com/juliusbrussee/caveman/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 94017e661f434f4a71e6c0210f261a0f327546b3d96f7be8bdd40c16951e74c3

build:
  number: 0
  noarch: generic
  script: bash ${{ RECIPE_DIR }}/build.sh

requirements:
  build:
    - nodejs
  host:
    - nodejs
  run:
    - nodejs >=18
    # The bin/caveman wrapper is a bash script (replaces npm's symlink, which
    # noarch packages cannot ship). The selector is gated on `unix` because
    # conda-forge's v1 linter forbids unconditional run selectors on noarch
    # packages unless conda-forge.yml's noarch_platforms has >1 entries
    # (which ours does: linux_64, osx_64, osx_arm64).
    - if: unix
      then:
        - __unix

tests:
  - if: unix
    then:
      script:
        - caveman --help
        - test -f "${PREFIX}/lib/node_modules/caveman-installer/package.json"
        - test -f "${PREFIX}/lib/node_modules/caveman-installer/dist/caveman.skill"
        - test -d "${PREFIX}/lib/node_modules/caveman-installer/skills"
        - test -d "${PREFIX}/lib/node_modules/caveman-installer/plugins"

about:
  homepage: https://github.com/juliusbrussee/caveman
  repository: https://github.com/juliusbrussee/caveman
  license: MIT
  license_file: LICENSE
  summary: Claude Code skill that cuts ~65% of output tokens by talking like caveman
  description: |
    "Why use many token when few token do trick." caveman is an
    ultra-compressed communication mode for Claude Code: a skill/plugin
    that measurably cuts about 65% of output tokens while keeping full
    technical accuracy.

    This package ships the upstream installer CLI (a zero-dependency
    Node.js tool). After conda install, run ``caveman`` in a project (or
    ``caveman --help`` for scopes and options) to deploy the skill into
    Claude Code's skills/plugin directories. Upstream also maintains
    Codex and Gemini variants of the mode.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
