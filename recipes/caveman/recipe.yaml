# Header:
#    # Packaged 2026-07-12 (user request: token-usage reduction tooling).
#    # NOT the npm "caveman" package (andrewchilds' unrelated templating
#    # library) — upstream is unpublished on npm (package.json name
#    # caveman-installer is not registered there), so the source is the
#    # GitHub release tag. Conda name follows the repo/CLI name.
# context:
#    # Recipe version tracks the upstream RELEASE TAGS (v1.9.1 = the skill
#    # version); package.json versions the installer independently (0.1.0)
#    # — build.sh globs caveman-installer-*.tgz so bumps don't break it.
# build:
#    # Zero runtime npm deps (package.json dependencies is empty), so the
#    # canonical pnpm-licenses third-party-disclaimer step is omitted —
#    # nothing is bundled.
#    # npm install --global creates bin/caveman as a symlink, which
#    # rattler-build rejects for noarch (unsupported on Windows); build.sh
#    # replaces it with a bash wrapper, hence the __unix gate (upstream's
#    # native Windows path is `npx`/install.ps1, not this package).
