    - pkg:github/juliusbrussee/caveman@v${{ version }}
  cfe-upstream-repo: https://github.com/juliusbrussee/caveman
  cfe-upstream-homepage: https://github.com/juliusbrussee/caveman
  cfe-import-names: []
