# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.2"

package:
  name: openbb-crypto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-crypto/openbb_crypto-${{ version }}.tar.gz
  sha256: 5bf427fb9178389496a4041d4ae5da8eef250ddb34edb48415de75d9c0974ea0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-core <2.0.0,>=1.6.10

tests:
  - python:
      imports:
        - openbb_crypto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-crypto/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Crypto extension for OpenBB
  description: |
    Crypto extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
