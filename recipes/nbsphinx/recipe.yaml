# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nbsphinx
  version: "0.9.8"
  sha256: d0765908399a8ee2b57be7ae881cf2ea58d66db3af7bbf33e6eb48f83bea5495

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.6
    - setuptools
    - pip
  run:
    - python >=3.6
    - docutils
    - jinja2
    - nbconvert
    - nbformat
    - sphinx
    - traitlets

tests:
  - python:
      imports:
        - nbsphinx
      pip_check: false

about:
  license: MIT
  summary: Jupyter Notebook Tools for Sphinx
  license_file: LICENSE
  homepage: http://nbsphinx.rtfd.org/

extra:
  recipe-maintainers:
    - ericmjl
    - kmuehlbauer
    - SylvainCorlay
