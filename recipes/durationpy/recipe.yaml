# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10"

package:
  name: durationpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/durationpy/durationpy-${{ version }}.tar.gz
  sha256: 1fa6893409a6e739c9c72334fc65cca1f355dbdd93405d30f726deb5bde42fba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - durationpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/icholy/durationpy
  license: MIT
  license_file: LICENSE
  summary: Module for converting between datetime.timedelta and Go's Duration strings.
  description: |
    Module for converting between datetime.timedelta and Go's Duration strings.

extra:
  recipe-maintainers:
    - ocefpaf

