# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.4"

package:
  name: mrjob
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mrjob/mrjob-${{ version }}.tar.gz
  sha256: 2c8d8dc8aa4b354a97de18d0260f551f018693af74af104b3d41daf165eebdd4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - mrjob
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/Yelp/mrjob
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Python MapReduce framework
  description: |
    Python MapReduce framework

extra:
  recipe-maintainers:
    - pmlandwehr
    - mariusvniekerk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mrjob
  cfe-upstream-registry: pypi
  cfe-upstream-name: mrjob
  cfe-purls:
    - pkg:conda/mrjob@${{ version }}?channel=conda-forge
    - pkg:pypi/mrjob@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/Yelp/mrjob
  cfe-import-names: [mrjob]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/mrjob-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.7.4

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:48:03Z
