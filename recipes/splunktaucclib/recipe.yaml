# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.2.0"

package:
  name: splunktaucclib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splunktaucclib/splunktaucclib-${{ version }}.tar.gz
  sha256: 6a4a2fa2aad3f4fcc35822259c066510233a27afa758c6561ebf15aa0d010155

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.0.0
  run:
    - python >=${{ python_min }}
    - defusedxml >=0.7
    - urllib3 <2
    - pysocks <2.0.0,>=1.7.1
    - splunk-sdk >=2.0.2
    - solnlib >=5

tests:
  - python:
      imports:
        - splunktaucclib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/splunktaucclib/
  license: Apache-2.0
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

