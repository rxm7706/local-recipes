schema_version: 1

context:
  version: "0.0.1"

package:
  name: mcp-server-memory
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mcp-server-memory/mcp_server_memory-0.0.1-py3-none-any.whl
  sha256: 2b2c934cfb9877f0800517eea263861470c679f642506983ef8d2409df898d1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mcp_server_memory
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-server-memory/
  license: MIT
  license_file: LICENSE
  summary: This package is reserved.
  description: |
    This package is reserved.

extra:
  recipe-maintainers:
    - rxm7706

