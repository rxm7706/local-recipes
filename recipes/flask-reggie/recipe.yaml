# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: flask-reggie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Reggie/Flask-Reggie-${{ version }}.tar.gz
  sha256: 79fd1d19f37f00e16e261a82e5b8da87743eb21f5c96ccd11a02a246a2555eed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_reggie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/rhyselsmore/flask-reggie
  license: Apache-2.0
  license_file: LICENSE
  summary: Flask Regex Routes.
  description: |
    Flask Regex Routes.

extra:
  recipe-maintainers:
    - rxm7706

