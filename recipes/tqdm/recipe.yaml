# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.70.0"

package:
  name: tqdm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tqdm/tqdm-${{ version }}.tar.gz
  sha256: 55b0b0dbd97462d06ebee91e4dac24ed4d4702be82b24f07e6c1d27e08cea220

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tqdm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://tqdm.github.io
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Fast, Extensible Progress Meter
  description: |
    Fast, Extensible Progress Meter

extra:
  recipe-maintainers:
    - casperdcl
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tqdm
  cfe-upstream-registry: pypi
  cfe-upstream-name: tqdm
  cfe-purls:
    - pkg:conda/tqdm@${{ version }}?channel=conda-forge
    - pkg:pypi/tqdm@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://tqdm.github.io
  cfe-import-names: [tqdm]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/tqdm-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T06:44:43Z
