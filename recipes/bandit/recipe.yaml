# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.4"

package:
  name: bandit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bandit/bandit-${{ version }}.tar.gz
  sha256: b589e5de2afe70bd4d53fa0c1da6199f4085af666fde00e8a034f152a52cd628

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml >=5.3.1
    - stevedore >=1.20.0
    - rich

tests:
  - python:
      imports:
        - bandit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bandit.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Security oriented static analyser for python code.
  description: |
    Security oriented static analyser for python code.
  repository: https://github.com/PyCQA/bandit
  documentation: https://bandit.readthedocs.io/

extra:
  recipe-maintainers:
    - jkornblum
    - dbast
    - rxm7706

#### CFE metadata AND comments
