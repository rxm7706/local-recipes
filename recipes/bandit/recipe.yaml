# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bandit
  version: "1.9.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b589e5de2afe70bd4d53fa0c1da6199f4085af666fde00e8a034f152a52cd628

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bandit=bandit.cli.main:main
      - bandit-config-generator=bandit.cli.config_generator:main
      - bandit-baseline=bandit.cli.baseline:main

requirements:
  host:
    - python ${{ python_min }}
    - pbr >=2.0.0
    - pip
    - setuptools
  run:
    - pyyaml >=5.3.1
    - python >=${{ python_min }}
    - colorama >=0.3.9
    - GitPython >=3.1.30
    - PyYAML >=5.3.1
    - rich
    - stevedore >=1.20.0

tests:
  - python:
      imports:
        - bandit
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - bandit --help

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: |
    Bandit is a tool designed to find common security issues in Python code.
    To do this Bandit processes each file, builds an AST from it, and runs
    appropriate plugins against the AST nodes. Once Bandit has finished
    scanning all the files it generates a report.
  homepage: https://bandit.readthedocs.io/en/latest/
  repository: https://github.com/PyCQA/bandit
  documentation: https://bandit.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - jkornblum
    - dbast
    - rxm7706
