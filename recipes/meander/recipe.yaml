# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: meander
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/meander/meander-${{ version }}.tar.gz
  sha256: 98b806d107d51481ab3ac219b06e146237f8be8be1be3b961f7a42d9ec695751

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - meander
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/austinschneider/meander
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: Tools for computing contours on 2d surfaces.
  description: |
    Tools for computing contours on 2d surfaces.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: meander
