# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: pyvenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyvenv/pyvenv-${{ version }}.tar.gz
  sha256: 113cd3a5c44384b436eb2aa68bb98b99e7a463e21e673f3da973276f8db2305b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - clipboard
    - termcolor

tests:
  - python:
      imports:
        - pyvenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Ashrit-Yarava/pyvenv
  license: MIT
  license_file: LICENSE
  summary: A minimalist python environment manager.
  description: |
    A minimalist python environment manager.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyvenv
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyvenv
