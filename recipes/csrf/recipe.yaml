# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1b1"

package:
  name: csrf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/csrf/csrf-${{ version }}.tar.gz
  sha256: b44eca40f74a46d9f5846c78a3f2488123d051346e09e3133af0029bcaf33a66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - csrf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/golightlyb/csrf.py
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: simply generate & validate BREACH-resistant CSRF tokens
  description: |
    simply generate & validate BREACH-resistant CSRF tokens

extra:
  recipe-maintainers:
    - rxm7706

