# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: tcmlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/t/tcmlib/tcmlib-1.5.0-py2.py3-none-manylinux_2_28_x86_64.whl
  sha256: 9d7c01cff35aae9bf5390b620680ebdf10a7d211c22d6488a27a029502e7d0aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tcmlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://oneapi-src.github.io/oneTBB/GSG/next_steps.html
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Thread Composability Manager
  description: |
    Thread Composability Manager

extra:
  recipe-maintainers:
    - rxm7706

