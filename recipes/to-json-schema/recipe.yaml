# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: to-json-schema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/to-json-schema/to_json_schema-${{ version }}.tar.gz
  sha256: ec747bd5129256dd571105f66a7bc9a4546228cd5e5fbf5e06dc9776e255400e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=46.1.0
  run:
    - python >=${{ python_min }}
    - importlib-metadata

tests:
  - python:
      imports:
        - to_json_schema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zilehuda/to-json-schema/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://github.com/zilehuda/to-json-schema/

extra:
  recipe-maintainers:
    - rxm7706

