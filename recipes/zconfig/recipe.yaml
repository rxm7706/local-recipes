# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3"

package:
  name: zconfig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/ZConfig/zconfig-${{ version }}.tar.gz
  sha256: 472233e515fa29be6c873e78b8a2b450c2cd25d0133cb45960837f33f1ab4fe3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ZConfig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/ZConfig/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Structured Configuration Library
  description: |
    Structured Configuration Library

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zconfig
  cfe-upstream-registry: pypi
  cfe-upstream-name: zconfig
