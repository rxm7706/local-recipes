    - pkg:pypi/zconfig@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/zopefoundation/ZConfig/
  cfe-import-names: [ZConfig]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/zconfig-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T07:30:21Z
