# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: mdxpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mdxpy/mdxpy-${{ version }}.tar.gz
  sha256: 672bc7f7989a81180640fa56c4113bfb866e949248bd608cb79bfdf7c38f40ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mdxpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cubewise-code/mdxpy
  license: MIT-LICENSE
  license_file: LICENSE
  summary: A simple, yet elegant MDX library for TM1
  description: |
    A simple, yet elegant MDX library for TM1

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mdxpy
