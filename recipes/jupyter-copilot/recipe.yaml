# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: jupyter-copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-copilot/jupyter_copilot-${{ version }}.tar.gz
  sha256: b6c462be303b1b22d8698c2cd070c719c51cf3ea2960d515d5d108c3a82a521f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - jupyter-server <3,>=2.0.1

tests:
  - python:
      imports:
        - jupyter_copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/baolong281/jupyter-copilot
  license: MIT
  license_file: LICENSE
  summary: GitHub Copilot for Jupyter
  description: |
    GitHub Copilot for Jupyter
  repository: https://github.com/baolong281/jupyter-copilot.git

extra:
  recipe-maintainers:
    - rxm7706

