# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.45.1"

package:
  name: opentelemetry-exporter-otlp-proto-grpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-otlp-proto-grpc/opentelemetry_exporter_otlp_proto_grpc-${{ version }}.tar.gz
  sha256: 3b3dcfbfdcb4e35149fcf309972282054b45228f5c10547d0095d6578510a9a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - googleapis-common-protos >=1.57,<2.dev0
    - grpcio >=1.63.2,<2.0.0
    - opentelemetry-api >=1.15,<2.dev0
    - opentelemetry-proto ${{ version }}.*
    - opentelemetry-sdk ${{ version }}.*
    - opentelemetry-exporter-otlp-proto-common ${{ version }}.*
    - opentelemetry-exporter-otlp-common ==0.66b1
    - opentelemetry-exporter-otlp-proto-common ==1.45.1
    - typing_extensions >=4.6.0
    - opentelemetry-proto ==1.45.1
    - opentelemetry-sdk >=1.45.1,<1.46.dev0

tests:
  - python:
      imports:
        - opentelemetry.exporter.otlp.proto.grpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-grpc
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Collector Protobuf over gRPC Exporter
  description: |
    OpenTelemetry Collector Protobuf over gRPC Exporter
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-proto
    - conda-forge/opentelemetry-sdk
    - conda-forge/opentelemetry-exporter-otlp-proto-common
    - xhochy

