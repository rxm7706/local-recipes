# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: hpnapy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hpnapy/hpnapy-1.0.7.zip
  sha256: 34fc75e6ec06eeb60f2d3afdafe4bb79d8ebe5108351a94174922a7569355f0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hpnapy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spenceation/hpnapy
  license: MIT
  license_file: LICENSE
  summary: HP Network automation framework
  description: |
    HP Network automation framework

extra:
  recipe-maintainers:
    - rxm7706

