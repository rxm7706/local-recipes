# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.8"

package:
  name: openxjv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openXJV/openxjv-${{ version }}.tar.gz
  sha256: ce124d3b0df504d61526e75c11aed355e8cee215b241bc84f1b27249e5530783

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - docx2txt
    - pillow
    - fpdf2
    - numpy
    - pypdfium2 >=4.28.0
    - orjson
    - platformdirs >=3.0
    - darkdetect
    - lxml
    - pikepdf
    - pyside6
    - pyside6-addons
    - pdfjs-viewer-pyside6 >=1.1.2
    - llama-cpp-python >=0.2.90
    - onnxruntime
    - rapidocr >=3.7.0
    - opencv >=4.8.0
    - defusedxml
    - omegaconf

tests:
  - python:
      imports:
        - openXJV
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://openxjv.de
  license: GPL-3.0-only
  license_file: LICENSE
  summary: openXJV - open XJustiz Viewer
  description: |
    openXJV - open XJustiz Viewer
  repository: https://github.com/digidigital/openXJV

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: openxjv
  cfe-upstream-registry: pypi
  cfe-upstream-name: openXJV
