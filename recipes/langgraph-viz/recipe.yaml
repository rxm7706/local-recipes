# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: langgraph-viz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-viz/langgraph_viz-${{ version }}.tar.gz
  sha256: 13da7ad4add21c26fdf0a80755bc1547eaf056dc6d90fedba8356223dbd76e5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - deepdiff >=6.7.0
    - fastapi >=0.104.0
    - langchain-anthropic >=0.3.22
    - langchain-openai >=0.3.35
    - langchain >=0.3.27
    - langgraph >=0.0.1
    - pydantic >=2.12.5
    - python-dotenv >=1.2.1
    - uvicorn >=0.24.0
    - websockets >=12.0

tests:
  - python:
      imports:
        - langgraph_viz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mk-tdev/langgraph-viz
  license: MIT
  license_file: LICENSE
  summary: Real-time browser-based visualization for LangGraph workflows
  description: |
    Real-time browser-based visualization for LangGraph workflows
  repository: https://github.com/mk-tdev/langgraph-viz
  documentation: https://github.com/mk-tdev/langgraph-viz#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langgraph-viz
