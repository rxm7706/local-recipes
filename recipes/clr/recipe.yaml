# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: clr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clr/clr-${{ version }}.tar.gz
  sha256: 26505b51f73518d531a52b1f7855488f8c764de94f248ebb7cbe0549acc9d333

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - clr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lmittmann/clr
  license: MIT
  license_file: LICENSE
  summary: 🌈 Terminal string styling
  description: |
    🌈 Terminal string styling

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clr
  cfe-upstream-registry: pypi
  cfe-upstream-name: clr
