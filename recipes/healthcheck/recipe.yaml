# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.3"

package:
  name: healthcheck
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/healthcheck/healthcheck-${{ version }}.tar.gz
  sha256: 3b6e56dcaf9c5a52296e32d713e8f3bbb1b86ff88d4d06906b7a5105923a711c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - healthcheck
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Runscope/healthcheck
  license: MIT
  license_file: LICENSE
  summary: Adds healthcheck endpoints to Flask apps
  description: |
    Adds healthcheck endpoints to Flask apps

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: healthcheck
  cfe-upstream-registry: pypi
  cfe-upstream-name: healthcheck
