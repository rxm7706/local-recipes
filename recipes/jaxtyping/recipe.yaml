# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jaxtyping
  version: "0.3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jaxtyping-${{ version }}.tar.gz
  sha256: b09c14acf6686feb9e0df5b0d8c6e7c5b6f8d36bf059ee54cd522a186c2ef050

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - wadler-lindig >=0.1.3

tests:
  - python:
      imports:
        - jaxtyping
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Type annotations and runtime checking for shape and dtype of JAX arrays, and PyTrees.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/google/jaxtyping

extra:
  recipe-maintainers:
    - asford
    - ngam
    - iamthebot
