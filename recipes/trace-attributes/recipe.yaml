# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.2.1"

package:
  name: trace-attributes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trace-attributes/trace_attributes-${{ version }}.tar.gz
  sha256: eb8291fe68193a1599afb88cdd7ee9e81d419198446498ae27a4cbf3cb18f098

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pydantic >=1.8

tests:
  - python:
      imports:
        - python.langtrace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Scale3-Labs/langtrace-trace-attributes
  license: MIT
  license_file: LICENSE
  summary: LangTrace - Trace Attributes
  description: |
    LangTrace - Trace Attributes

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
