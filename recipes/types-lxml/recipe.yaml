# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: types-lxml
  version: "2026.2.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
    sha256: b3a1340cc06db98d541c785732f6f68bea438daff4e2b7809ef748d545d01406
  - url: https://raw.githubusercontent.com/python/typeshed/main/LICENSE
    sha256: 295f8538c94ae5c3043301cf7cff1c852dab6a786a8ddee471e061b40d5ecabe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - pdm
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - typing-extensions >=4.10,<5.0
    - cssselect >=1.2,<2.0
    - beautifulsoup4 >=4.13,<5.0
    - types-html5lib >=1.1.11.20241018,<1.1.12.0

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pip check
      - if: unix
        then: test -f $SP_DIR/lxml-stubs/__init__.pyi
      - if: win
        then: if not exist %SP_DIR%\\lxml-stubs\\__init__.pyi exit 1

about:
  summary: Typing stubs for lxml
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - zwelz3
    - rxm7706
