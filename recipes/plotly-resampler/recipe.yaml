# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: plotly-resampler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plotly-resampler/plotly_resampler-${{ version }}.tar.gz
  sha256: e3f9ceeb5749de9a85d39755f50711a7d6a28eb1b284da250251c8896ccc1cfd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pytz
    - plotly <7.0.0,>=5.5.0
    - dash >=2.11.0
    - pandas >=1
    - numpy >=1.14
    - orjson <4.0.0,>=3.10.0
    - tsdownsample >=0.1.3

tests:
  - python:
      imports:
        - plotly_resampler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/predict-idlab/plotly-resampler
  license: MIT
  license_file: LICENSE
  summary: Visualizing large time series with plotly
  description: |
    Visualizing large time series with plotly
  repository: https://github.com/predict-idlab/plotly-resampler
  documentation: https://predict-idlab.github.io/plotly-resampler/latest

extra:
  recipe-maintainers:
    - darynwhite
    - jvdd
    - thewchan

