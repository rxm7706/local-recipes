# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: effdet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/effdet/effdet-${{ version }}.tar.gz
  sha256: ac5589fd304a5650c201986b2ef5f8e10c111093a71b1c49fa6b8817710812b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - torchvision
    - timm
    - pycocotools
    - omegaconf

tests:
  - python:
      imports:
        - effdet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rwightman/efficientdet-pytorch
  license: Apache-2.0
  license_file: LICENSE
  summary: EfficientDet for PyTorch
  description: |
    EfficientDet for PyTorch

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: effdet
  cfe-upstream-registry: pypi
  cfe-upstream-name: effdet
  cfe-purls:
