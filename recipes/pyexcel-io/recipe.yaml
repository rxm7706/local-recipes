# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: python_min|default("3.8")
  name: pyexcel-io
  version: "0.6.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 2c33d8df505e21a13bed585ac6ab7d30ec826a9f156b758394af5d22359bddb9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lml >=0.0.4

tests:
  - python:
      imports:
        - pyexcel_io
        - pyexcel_io.database
        - pyexcel_io.database.exporters
        - pyexcel_io.database.importers
        - pyexcel_io.readers
        - pyexcel_io.writers
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: One interface to read and write the data in various excel formats, import the data into and export the data from databases
  description: |
    'A python library to read and write structured data in csv, zipped csv ' +
    'format and to/from databases' +
    ''
  homepage: https://github.com/pyexcel/pyexcel-io
  repository: https://github.com/pyexcel/pyexcel-io
  documentation: https://readthedocs.org/projects/pyexcel-io/

extra:
  recipe-maintainers:
    - williamjamir
    - nicoddemus
