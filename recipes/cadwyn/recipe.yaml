# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.2.0"

package:
  name: cadwyn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cadwyn/cadwyn-${{ version }}.tar.gz
  sha256: 3b4711c2b738bee636681d06531393398f7daeb919cc3d7be6f06fcbc07390e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - backports.strenum <2,>=1.3.1
    - fastapi >=0.137.1
    - jinja2 >=3.1.2
    - pydantic >=2.11.0
    - starlette >=0.30.0
    - typing_extensions >=4.8.0
    - typing-inspection >=0.4.0

tests:
  - python:
      imports:
        - cadwyn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cadwyn/
  license: MIT
  license_file: LICENSE
  summary: Production-ready community-driven modern Stripe-like API versioning in FastAPI
  description: |
    Production-ready community-driven modern Stripe-like API versioning in FastAPI
  documentation: https://docs.cadwyn.dev

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
