# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: credentials
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/c/credentials/credentials-1.1-py2.py3-none-any.whl
  sha256: 6c2d4ffaac5ca264b5c7a4daf64306a571e5f01193ddbc9d5d2b79bd6650133e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - credentials
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OniOni/credentials
  license: LGPLv3
  license_file: LICENSE
  summary: Credential Manager
  description: |
    Credential Manager

extra:
  recipe-maintainers:
    - rxm7706

