# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: django-template-lsp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-template-lsp/django_template_lsp-${{ version }}.tar.gz
  sha256: 0261ede9748801edaa686e5085506c0023f358806aca79c828bdfce621c79914

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - djlsp = djlsp.cli:main
      - django-template-lsp = djlsp.cli:main

requirements:
  host:
    - pip
    - python =${{ python_min }}
    - setuptools
  run:
    - jedi
    - pygls <2
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - djlsp
      pip_check: true
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - djlsp --help
      - django-template-lsp --help

about:
  summary: Django template LSP
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/fourdigits/django-template-lsp

extra:
  recipe-maintainers:
    - danielnachun
