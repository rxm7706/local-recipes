# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.1"

package:
  name: alembic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alembic/alembic-${{ version }}.tar.gz
  sha256: e0fca0518118c78acc493e31bcb5402f190057aaf6df8b5b95ce94c4789cf648

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4.23
    - mako
    - typing_extensions >=4.12
    - tomli

tests:
  - python:
      imports:
        - alembic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://alembic.sqlalchemy.org
  license: MIT
  license_file: LICENSE
  summary: A database migration tool for SQLAlchemy.
  description: |
    A database migration tool for SQLAlchemy.
  repository: https://github.com/sqlalchemy/alembic/
  documentation: https://alembic.sqlalchemy.org/en/latest/

extra:
  recipe-maintainers:
    - anguslees
    - xylar

#### CFE metadata AND comments
