# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5.0"

package:
  name: pydevd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydevd/pydevd-${{ version }}.tar.gz
  sha256: 2f0ef00281d6082a501cc3591fbb2e3ad32939007ebbe978f7c0cbfd95b71399

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - _pydev_bundle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fabioz/PyDev.Debugger/
  license: EPL
  license_file: LICENSE
  summary: PyDev.Debugger (used in PyDev, PyCharm and VSCode Python)
  description: |
    PyDev.Debugger (used in PyDev, PyCharm and VSCode Python)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydevd
  cfe-upstream-registry: pypi
  cfe-upstream-name: pydevd
  cfe-purls:
