    - pkg:pypi/pydevd@${{ version }}
  cfe-upstream-repo: https://github.com/fabioz/PyDev.Debugger/
  cfe-upstream-homepage: https://github.com/fabioz/PyDev.Debugger/
  cfe-import-names: [_pydev_bundle]
