# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.21"

package:
  name: mindsdb-evaluator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mindsdb-evaluator/mindsdb_evaluator-${{ version }}.tar.gz
  sha256: c13a3279da97d7778aa2e6e94b400c33cec5154ce540a9d325f527f172862ef5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - type-infer ==0.0.26
    - numpy <3,>=2
    - pandas <3,>=2
    - scikit-learn ==1.5.2
    - dataprep-ml ==0.0.26

tests:
  - python:
      imports:
        - mindsdb_evaluator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mindsdb-evaluator/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Model evaluation for Machine Learning pipelines.
  description: |
    Model evaluation for Machine Learning pipelines.

extra:
  recipe-maintainers:
    - rxm7706

