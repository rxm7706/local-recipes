    - pkg:pypi/sphinxcontrib-jquery@${{ version }}
  cfe-upstream-repo: https://github.com/sphinx-contrib/jquery/
  cfe-upstream-homepage: https://pypi.org/project/sphinxcontrib-jquery/
  cfe-import-names: [sphinxcontrib.jquery]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
