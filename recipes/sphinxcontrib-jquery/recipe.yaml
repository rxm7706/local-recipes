# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1"

package:
  name: sphinxcontrib-jquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-jquery/sphinxcontrib-jquery-${{ version }}.tar.gz
  sha256: 1620739f04e36a2c779f1a131a2dfd49b2fd07351bf1968ced074365933abc7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}
    - sphinx >=1.8

tests:
  - python:
      imports:
        - sphinxcontrib.jquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sphinxcontrib-jquery/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Extension to include jQuery on newer Sphinx releases
  description: |
    Extension to include jQuery on newer Sphinx releases
  repository: https://github.com/sphinx-contrib/jquery/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - AA-Turner
    - BSGalvan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sphinxcontrib-jquery
