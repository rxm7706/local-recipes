# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.3"

package:
  name: keras-ocr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/k/keras-ocr/keras_ocr-0.9.3-py3-none-any.whl
  sha256: 8fdbb9044a814910e86d3853f5e7f13085c98ac210f27204fe75f4f8c4ac6262

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - editdistance
    - efficientnet
    - essential-generators
    - fonttools
    - imgaug
    - pyclipper
    - shapely
    - tqdm
    - validators

tests:
  - python:
      imports:
        - keras_ocr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/faustomorales/keras-ocr
  license: MIT
  license_file: LICENSE
  summary: A packaged and flexible version of the CRAFT text detector and Keras CRNN recognition model.
  description: |
    A packaged and flexible version of the CRAFT text detector and Keras CRNN recognition model.
  repository: https://github.com/faustomorales/keras-ocr

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
