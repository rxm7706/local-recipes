# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: protego
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/Protego/protego-${{ version }}.tar.gz
  sha256: 88ff004544ce44e61269cc6f8735f7837d12e09bb77619fc94fbb26b72e5d137

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - protego
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/protego
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pure-Python robots.txt parser with support for modern conventions
  description: |
    Pure-Python robots.txt parser with support for modern conventions
  repository: https://github.com/scrapy/protego

extra:
  recipe-maintainers:
    - AdrianAtZyte
    - Gallaecio

#### CFE metadata AND comments
