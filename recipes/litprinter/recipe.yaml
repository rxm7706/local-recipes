# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.3"

package:
  name: litprinter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/litprinter/litprinter-${{ version }}.tar.gz
  sha256: ccb3238ab5cc1f132b6f9c05382f326d66f4fe9567ca02ae5180750d3ed246c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - pygments
    - colorama
    - executing
    - asttokens

tests:
  - python:
      imports:
        - litprinter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OEvortex/litprinter
  license: MIT
  license_file: LICENSE
  summary: The most sophisticated debug printing library for Python - IceCream + Rich fusion with syntax highlighting and beautiful tracebacks
  description: |
    The most sophisticated debug printing library for Python - IceCream + Rich fusion with syntax highlighting and beautiful tracebacks
  documentation: https://github.com/OEvortex/litprinter#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: litprinter
  cfe-upstream-registry: pypi
  cfe-upstream-name: litprinter
