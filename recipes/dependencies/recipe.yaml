# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dependencies
  version: "7.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6fc79935f61ae33bf33ca0aa0cc612e9cad9a2bc05a34928becb4d9856725d1a
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps

requirements:
  host:
    - pip
    - poetry-core
    - python 3.9.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dependencies
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Dependency Injection for Humans
  description: With help of DI you can use different parts of you system independently and combine their behavior really easy.
  homepage: https://github.com/dry-python/dependencies
  repository: https://github.com/dry-python/dependencies
  documentation: http://dependencies.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nicoddemus
