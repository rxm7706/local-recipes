# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.72"

package:
  name: boto3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boto3/boto3-${{ version }}.tar.gz
  sha256: 6280ce03cc85e9110fd9fb7e2fbf11eae0b1177cb041a0d69aa88edc9d178cf9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - botocore <1.44.0,>=1.43.72
    - jmespath <2.0.0,>=0.7.1
    - s3transfer <0.20.0,>=0.19.0

tests:
  - python:
      imports:
        - boto3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/boto/boto3
  license: Apache-2.0
  license_file: LICENSE
  summary: The AWS SDK for Python
  description: |
    The AWS SDK for Python
  repository: https://github.com/boto/boto3
  documentation: https://docs.aws.amazon.com/boto3/latest/

extra:
  recipe-maintainers:
    - tkelman
    - ocefpaf

