# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# version numbering is explained at https://stackoverflow.com/questions/42730478/version-numbers-for-visual-studio-2017-boost-and-cmake
# VS2017 is fundamentally compatible with VS2015.  We name our package
# vs2015_runtime so that it can't be mixed up with the runtime from
# VS2015 - you do actually need VS2017 runtime for things compiled
# with VS2017, and the runtime we have here is backwards-compatible
# with things compiled with VS2015.
schema_version: 1

context:
  runtime_year: 2015
  vsyear: "2026"
  vsver: "18"
  vcver: "14.5"
  runtime_version: "14.51.36247"
  update_version: "1"
  cl_version: "19.51.36247"
  uuid: ebdab8e5-1d7b-4d9f-a11b-cbb1720c3b12
  sha256: 843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C
  vc_major: "14"
  vcvars_ver_maj: 14
  vcvars_ver_min: 51
  vcvars_ver: "14.51"
  clang_test_version: "21.1.8"
  build_num: 41
  cross_target_platform: win-64

recipe:
  name: vs${{ vsyear }}
  version: ${{ runtime_version }}

source:
  - if: cross_target_platform == "win-64"
    then:
      url: https://download.visualstudio.microsoft.com/download/pr/${{ uuid }}/${{ sha256 }}/vc_redist.x64.exe
      sha256: ${{ sha256 | lower }}
  - if: cross_target_platform == "win-arm64"
    then:
      url: https://download.visualstudio.microsoft.com/download/pr/${{ uuid }}/${{ sha256 }}/vc_redist.arm64.exe
      sha256: ${{ sha256 | lower }}
  - if: cross_target_platform == "win-32"
    then:
      url: https://download.visualstudio.microsoft.com/download/pr/${{ uuid }}/${{ sha256 }}/vc_redist.x86.exe
      sha256: ${{ sha256 | lower }}

build:
  number: ${{ build_num }}
  skip: not win

outputs:
  - staging:
      name: vc-extract
    build:
      script: python ${{ RECIPE_DIR }}/vc_repack.py --extract --runtime-version ${{ runtime_version }} --target-platform ${{ cross_target_platform }}
    requirements:
      build:
        - if: build_platform is startingwith("win")
          then: m2-p7zip <10
        - if: build_platform is not startingwith("win")
          then: p7zip
        - python *
  - package:
      name: vcomp${{ vc_major }}
      version: ${{ runtime_version }}
    inherit:
      from: vc-extract
      run_exports: false
    build:
      skip: cross_target_platform != target_platform
      always_copy_files:
        - Library/bin/*.dll
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
        missing_dso_allowlist:
          - "*.dll"
          - "*.DLL"
      script: python ${{ RECIPE_DIR }}/vc_repack.py --install-vcomp
    requirements:
      build:
      host:
      run:
        # Need ucrt for windows<10 and when the VC runtime does not bundle it
        - if: (vsver >=17 or (vsver == 16 and update_version >= 10)) and (cross_target_platform == "win-64" or cross_target_platform == "win-32")
          then: ucrt >=10.0.20348.0
      run_exports:
        strong:
          - ${{ pin_subpackage("vcomp" ~ vc_major, upper_bound=None) }}
      run_constraints:
        - if: cross_target_platform == "win-64" or cross_target_platform == "win-32"
          then: vs${{ runtime_year }}_runtime ${{ runtime_version }}.* *_${{ build_num }}
    tests:
      - script:
          - if not exist %LIBRARY_BIN%\vcomp140.dll exit 1
          - if not exist %PREFIX%\vcomp140.dll exit 1
    about:
      summary: MSVC OpenMP runtime associated with cl.exe version ${{ cl_version }} (VS ${{ vsyear }} update ${{ update_version }})
      license: LicenseRef-MicrosoftVisualCpp2015-2022Runtime
      license_file:
        - LICENSE.TXT
        - LICENSE.RTF
        - LICENSE.DOCX
      homepage: https://visualstudio.microsoft.com/downloads/
  - package:
      name: vc${{ vc_major }}_runtime
      version: ${{ runtime_version }}
    inherit:
      from: vc-extract
      run_exports: false
    build:
      skip: cross_target_platform != target_platform
      always_copy_files:
        - Library/bin/*.dll
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
        missing_dso_allowlist:
          - "*.dll"
          - "*.DLL"
      script: python ${{ RECIPE_DIR }}/vc_repack.py --install-runtime
    requirements:
      build:
      host:
        - ${{ pin_subpackage("vcomp" ~ vc_major, exact=True) }}
      run:
        - ${{ pin_subpackage("vcomp" ~ vc_major, exact=True) }}
        # Need ucrt for windows<10 and when the VC runtime does not bundle it
        - if: (vsver >=17 or (vsver == 16 and update_version >= 10)) and (cross_target_platform == "win-64" or cross_target_platform == "win-32")
          then: ucrt >=10.0.20348.0
      run_constraints:
        - if: cross_target_platform == "win-64" or cross_target_platform == "win-32"
          then: vs${{ runtime_year }}_runtime ${{ runtime_version }}.* *_${{ build_num }}
    tests:
      - script:
          - dir %PREFIX%\\Library\\bin\\*.dll
          - |
              for %%D in (
                  api-ms-win-core-console-l1-1-0.dll
                  api-ms-win-core-datetime-l1-1-0.dll
                  api-ms-win-core-debug-l1-1-0.dll
                  api-ms-win-core-errorhandling-l1-1-0.dll
                  api-ms-win-core-file-l1-1-0.dll
                  api-ms-win-core-file-l1-2-0.dll
                  api-ms-win-core-file-l2-1-0.dll
                  api-ms-win-core-handle-l1-1-0.dll
                  api-ms-win-core-heap-l1-1-0.dll
                  api-ms-win-core-interlocked-l1-1-0.dll
                  api-ms-win-core-libraryloader-l1-1-0.dll
                  api-ms-win-core-localization-l1-2-0.dll
                  api-ms-win-core-memory-l1-1-0.dll
                  api-ms-win-core-namedpipe-l1-1-0.dll
                  api-ms-win-core-processenvironment-l1-1-0.dll
                  api-ms-win-core-processthreads-l1-1-0.dll
                  api-ms-win-core-processthreads-l1-1-1.dll
                  api-ms-win-core-profile-l1-1-0.dll
                  api-ms-win-core-rtlsupport-l1-1-0.dll
                  api-ms-win-core-string-l1-1-0.dll
                  api-ms-win-core-synch-l1-1-0.dll
                  api-ms-win-core-synch-l1-2-0.dll
                  api-ms-win-core-sysinfo-l1-1-0.dll
                  api-ms-win-core-timezone-l1-1-0.dll
                  api-ms-win-core-util-l1-1-0.dll
                  api-ms-win-crt-conio-l1-1-0.dll
                  api-ms-win-crt-convert-l1-1-0.dll
                  api-ms-win-crt-environment-l1-1-0.dll
                  api-ms-win-crt-filesystem-l1-1-0.dll
                  api-ms-win-crt-heap-l1-1-0.dll
                  api-ms-win-crt-locale-l1-1-0.dll
                  api-ms-win-crt-math-l1-1-0.dll
                  api-ms-win-crt-multibyte-l1-1-0.dll
                  api-ms-win-crt-private-l1-1-0.dll
                  api-ms-win-crt-process-l1-1-0.dll
                  api-ms-win-crt-runtime-l1-1-0.dll
                  api-ms-win-crt-stdio-l1-1-0.dll
                  api-ms-win-crt-string-l1-1-0.dll
                  api-ms-win-crt-time-l1-1-0.dll
                  api-ms-win-crt-utility-l1-1-0.dll
                  concrt140.dll
                  msvcp140_1.dll
                  msvcp140_2.dll
                  msvcp140.dll
                  ucrtbase.dll
                  vcamp140.dll
                  vccorlib140.dll
                  vcomp140.dll
                  vcruntime140.dll
              ) do (
                if not exist %LIBRARY_BIN%\%%D exit 1
                if not exist %PREFIX%\%%D exit 1
              )
          - if: vsyear | int >= 2019
            then: |
                for %%D in (
                    msvcp140_atomic_wait.dll
                    msvcp140_codecvt_ids.dll
                    vcruntime140_1.dll
                ) do (
                  if not exist %LIBRARY_BIN%\%%D exit 1
                  if not exist %PREFIX%\%%D exit 1
                )
          - if: vsyear | int >= 2022
            then: |
                for %%D in (
                    vcruntime140_threads.dll
                ) do (
                  if not exist %LIBRARY_BIN%\%%D exit 1
                  if not exist %PREFIX%\%%D exit 1
                )
    about:
      summary: MSVC runtimes associated with cl.exe version ${{ cl_version }} (VS ${{ vsyear }} update ${{ update_version }})
      license: LicenseRef-MicrosoftVisualCpp2015-2022Runtime
      license_file:
        - LICENSE.TXT
        - LICENSE.RTF
        - LICENSE.DOCX
      homepage: https://visualstudio.microsoft.com/downloads/
  - package:
      name: vs${{ runtime_year }}_runtime
      version: ${{ runtime_version }}
    build:
      skip: cross_target_platform != target_platform or (win and arm64)
    requirements:
      run:
        - vc${{ vc_major }}_runtime >=${{ runtime_version }}
    tests:
      - script: echo "this is an empty wrapper package"
    about:
      license: BSD-3-Clause
      license_file: []
      summary: A backwards compatible meta-package. See vc${{ vc_major }}_runtime for the new package.
      homepage: https://github.com/conda-forge/vc-feedstock
  - package:
      name: vc
      version: ${{ vcver }}
    build:
      variant:
        down_prioritize_variant: 1
      skip: cross_target_platform != target_platform
    requirements:
      run:
        # Set lower bound for runtime (no upper bound).  Upper bound
        # is still present, but it's part of the run_exports for the
        # compiler: assume that when vcver's major version changes,
        # MSFT has broken our binary compatibility.
        - vc${{ vc_major }}_runtime >=${{ runtime_version }}
    tests:
      - script: echo "this is an empty wrapper package"
    about:
      license: BSD-3-Clause
      license_file: []
      summary: >-
        A meta-package to impose mutual exclusivity among software
        built with different VS versions
      description: >-
        This metapackage is used to enforce consistency of runtime
        dependencies within an environment
      homepage: https://github.com/conda/conda/wiki/VC-features
      repository: https://github.com/conda/conda/wiki/VC-features
      documentation: https://github.com/conda/conda/wiki/VC-features
  - package:
      name: vs${{ vsyear }}_${{ cross_target_platform }}
      version: ${{ cl_version }}
    inherit:
      from: vc-extract
      run_exports: false
    build:
      variant:
        down_prioritize_variant: 1
      script: python ${{ RECIPE_DIR }}/vc_repack.py --activate --host-platform ${{ target_platform }} --target-platform ${{ cross_target_platform }} --runtime-version ${{ runtime_version }} --vsyear ${{ vsyear }} --vsver ${{ vsver }} --vcver ${{ vcver }} --vcvars-ver ${{ vcvars_ver }} --update-version ${{ update_version }}
    requirements:
      run:
        # Used to set up the path in the activate script
        - vswhere
      run_exports:
        strong:
          - vc >=${{ vcver }},<${{ vc_major | int + 1 }}
          - vc${{ vc_major }}_runtime >=${{ runtime_version }}
          - if: (vsver >=17 or (vsver == 16 and update_version >= 10)) and (cross_target_platform == "win-64" or cross_target_platform == "win-32")
            then: ucrt >=10.0.20348.0
      run_constraints:
        - vs_${{ cross_target_platform }} ${{ vsyear }}.${{ update_version }}.*
    tests:
      - script:
          - echo "%CMAKE_GENERATOR%"
          - echo "%CMAKE_GENERATOR_PLATFORM%"
          - echo "%CMAKE_GENERATOR_TOOLSET%"
    about:
      summary: Activation and version verification of MSVC ${{ vcver }} (VS ${{ vsyear }} compiler, update ${{ update_version }})
      license: BSD-3-Clause
      license_file: []
  - package:
      name: vs_${{ cross_target_platform }}
      version: ${{ vsyear }}.${{ update_version }}
    build:
      variant:
        down_prioritize_variant: 1
    requirements:
      run:
        - vs${{ vsyear }}_${{ cross_target_platform }} ${{ cl_version }}.*
      run_exports:
        strong:
          - vc >=${{ vcver }},<${{ vc_major | int + 1 }}
          - vc${{ vc_major }}_runtime >=${{ runtime_version }}
          - if: (vsver >=17 or (vsver == 16 and update_version >= 10)) and (cross_target_platform == "win-64" or cross_target_platform == "win-32")
            then: ucrt >=10.0.20348.0
    tests:
      - requirements:
          run:
            - if: win and vsyear | int >= 2022
              then: clang ${{ clang_test_version }}.*
        script:
          - echo "%CMAKE_GENERATOR%"
          - echo "%CMAKE_GENERATOR_PLATFORM%"
          - echo "%CMAKE_GENERATOR_TOOLSET%"
          - echo "CC=%CC%"
          - echo "CC_FOR_BUILD=%CC_FOR_BUILD%"
          - if: win and vsyear | int >= 2022
            then: for /f "tokens=3" %%i in ('clang --version^| findstr /R "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"') do set "FOUND_CLANG_VERSION=%%i"
          - if: win and vsyear | int >= 2022
            then: echo found clang %FOUND_CLANG_VERSION%
          - if: win and vsyear | int >= 2022
            then: if not "%FOUND_CLANG_VERSION%"=="${{ clang_test_version }}" exit /b 1
    about:
      summary: Activation and version verification of MSVC ${{ vcver }} (VS ${{ vsyear }} compiler, update ${{ update_version }})
      license: BSD-3-Clause
      license_file: []

about:
  summary: Activation and version verification of MSVC ${{ vcver }} (VS ${{ vsyear }} compiler, update ${{ update_version }})
  license: LicenseRef-ProprietaryMicrosoft
  license_file: LICENSE.TXT
  homepage: https://docs.microsoft.com/en-us/visualstudio/windows/?view=vs-${{ vsyear }}

extra:
  feedstock-name: vc
  recipe-maintainers:
    - jakirkham
    - 183amir
    - pelson
    - patricksnape
    - msarahan
    - isuruf
    - h-vetinari

#### CFE metadata AND comments
# CFE comments
# Header:
#    # mason Story 22.1 (2026-10-09): crm's 2026-08-16 v0->v1 conversion left a SentinelType key on the
#    # vs_<target> test, holding meta.yaml's vsyear-at-least-2022 clang checks (G121). Rendered on
#    # win-64 only; not built (Windows-only). The feedstock is still v0; meta.yaml stays beside this file.
# context:
#    # vsyear, vsver, vcver, runtime_version, update_version, cl_version, uuid, sha256 and
#    # cross_target_platform come from the feedstock's conda_build_config.yaml, first zip (VS 2026, win-64).
#    # The local mirror has no CBC, and meta.yaml's own defaults (vsyear "") do not render.
# outputs:
#    # The top-level build (vc_repack --extract, with m2-p7zip/p7zip and python) is the `vc-extract` staging
#    # output; vcomp, vc_runtime and vs<year>_<target> inherit it with `run_exports: false`. A top-level v1
#    # build.script would be merged into every output, the metapackages included. Each output's
#    # `script_interpreter: python -m vc_repack --<mode>` (not a v1 field) is now
#    # a `python <RECIPE_DIR>/vc_repack.py --<mode>` script. `build_platform.startswith("win")` is
#    # `build_platform is startingwith("win")` (minijinja has no str.startswith). `track_features: [vc14]`
#    # is rejected by rattler-build 0.76.1: `variant.down_prioritize_variant: 1`. `run_exports: - strong:`
#    # is the v1 mapping `run_exports: strong:`. The vs_<target> run_constraint gained `.*` (conda-build read
#    # the bare `2026.1` as a prefix).
# about:
#    # v1 lint R-013 needs a top-level license_file: LICENSE.TXT (the feedstock's recipe/LICENSE.TXT,
#    # Microsoft's runtime terms, matching LicenseRef-ProprietaryMicrosoft). The BSD-3-Clause metapackages
#    # set `license_file: []` so they do not inherit it; meta.yaml ships them with no licence file.
# tests:
#    # The vs_<target> clang checks and their `clang` test requirement run under
#    # win and vsyear >= 2022. vc_runtime's flattened jinja dllname loop is three `for %%D`
#    # blocks: the base DLL list, plus the >=2019 and >=2022 lists.
####
