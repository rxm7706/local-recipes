# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated from python-maturin path; PyO3/maturin detected via sdist
# pyproject.toml [build-system].requires. Modelled on phonors PR pattern
# (modal 27-PR PyO3 sample, Mar 2020 – May 2026). Recipe shape follows the
# 2026 grayskull / conda-forge convention: literal ``package.name``, literal
# ``source.url`` (only ``${ version }`` templated), no ``name`` in context.
schema_version: 1

context:
  version: "0.4.0"

package:
  name: clvm-tools-rs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clvm-tools-rs/clvm_tools_rs-${{ version }}.tar.gz
  sha256: 81860b64bb0a67ec8b471d45632a2809c462356eacfbe3c2ccd9a53d9c4798dd

build:
  number: 0
  script:
    env:
      # Per conda-forge.org/docs/maintainer/example_recipes/rust/ — applies to
      # any Rust build (CLI binary OR maturin/PyO3 cdylib). maturin invokes
      # cargo build internally and inherits these env vars.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - clvm_tools_rs
      pip_check: true

about:
  homepage: https://pypi.org/project/clvm-tools-rs/
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: tools for working with chialisp language; compiler, repl, python and wasm bindings
  description: |
    tools for working with chialisp language; compiler, repl, python and wasm bindings
  repository: https://github.com/Chia-Network/clvm_tools_rs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: clvm-tools-rs
  cfe-upstream-registry: pypi
  cfe-upstream-name: clvm-tools-rs
  cfe-purls:
    - pkg:conda/clvm-tools-rs@${{ version }}?channel=conda-forge
    - pkg:pypi/clvm-tools-rs@${{ version }}
  cfe-upstream-repo: https://github.com/Chia-Network/clvm_tools_rs
  cfe-upstream-homepage: https://pypi.org/project/clvm-tools-rs/
  cfe-import-names: [clvm_tools_rs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: compiled
  cfe-pip-check: "true"
