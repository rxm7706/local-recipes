# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.34"

package:
  name: powerfx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/powerfx/powerfx-${{ version }}.tar.gz
  sha256: 956992e7afd272657ed16d80f4cad24ec95d9e4a79fb9dfa4a068a09e136af32

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65
    - wheel
  run:
    - python >=${{ python_min }}
    - pythonnet ==3.0.5
    - cffi ==2.0.0

tests:
  - python:
      imports:
        - powerfx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/powerfx/
  license: MIT
  license_file: LICENSE
  summary: Power Fx python bridge to invoke c# implementation.
  description: |
    Power Fx python bridge to invoke c# implementation.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: powerfx
