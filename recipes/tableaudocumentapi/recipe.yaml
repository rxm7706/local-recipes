# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11"

package:
  name: tableaudocumentapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tableaudocumentapi/tableaudocumentapi-${{ version }}.tar.gz
  sha256: 83a5755017fe3f6d45719911dcf1e8526766ad0c04be375dd552a1bcd9af3b2b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tableaudocumentapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tableau/document-api-python
  license: MIT
  license_file: LICENSE
  summary: A Python module for working with Tableau files.
  description: |
    A Python module for working with Tableau files.

extra:
  recipe-maintainers:
    - rxm7706

