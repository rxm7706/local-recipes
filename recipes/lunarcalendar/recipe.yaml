# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.9"

package:
  name: lunarcalendar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/LunarCalendar/LunarCalendar-${{ version }}.tar.gz
  sha256: 681142f22fc353c3abca4b25699e3d1aa7083ad1c268dce36ba297eca04bed5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - ephem
    - pytz

tests:
  - python:
      imports:
        - lunarcalendar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wolfhong/LunarCalendar
  license: MIT
  license_file: LICENSE
  summary: A lunar calendar converter, including a number of lunar and solar holidays, mainly from China.
  description: |
    A lunar calendar converter, including a number of lunar and solar holidays, mainly from China.

extra:
  recipe-maintainers:
    - bletham

