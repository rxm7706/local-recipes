# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: opencensus-ext-flask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opencensus-ext-flask/opencensus-ext-flask-${{ version }}.tar.gz
  sha256: 49155eb91c8582912ea1efd08bf9dea90baa4b29401fb8f17674dbc7aa40cd08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - opencensus

tests:
  - python:
      imports:
        - opencensus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/census-instrumentation/opencensus-python/tree/master/contrib/opencensus-ext-flask
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenCensus Flask Integration
  description: |
    OpenCensus Flask Integration

extra:
  recipe-maintainers:
    - rxm7706

