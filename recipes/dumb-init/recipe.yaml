# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.5.post1"

package:
  name: dumb-init
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dumb-init/dumb-init-${{ version }}.tar.gz
  sha256: 6510538a975e0de10658b0210ec2ad62dc3617543af5c6fbd29a3af111eae981

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dumb_init
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Yelp/dumb-init/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Simple wrapper script which proxies signals to a child
  description: |
    Simple wrapper script which proxies signals to a child

extra:
  recipe-maintainers:
    - rxm7706

