# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.3"

package:
  name: pyqt6-fluent-widgets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyQt6-Fluent-Widgets/pyqt6_fluent_widgets-${{ version }}.tar.gz
  sha256: 6facbc11912259fa762701d63ecc0c80c493ef32f8d5ecb1f3559a8c8b3b2ccd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyqt6
    - pyqt6-frameless-window >=0.8.0
    - darkdetect

tests:
  - python:
      imports:
        - qfluentwidgets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://qfluentwidgets.com
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A fluent design widgets library based on PyQt6
  description: |
    A fluent design widgets library based on PyQt6
  repository: https://github.com/zhiyiYo/PyQt-Fluent-Widgets/tree/PyQt6
  documentation: https://qfluentwidgets.com/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
