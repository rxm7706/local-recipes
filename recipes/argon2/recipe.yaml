# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.10"

package:
  name: argon2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/argon2/argon2-${{ version }}.tar.gz
  sha256: 523a3d3b88f3a46244b4976a6ca81994705848538bbe9e41426ea54ccb75eb90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - argon2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/flamewow/argon2_py
  license: CC0
  license_file: LICENSE
  summary: Bindings for the argon2 password hasher
  description: |
    Bindings for the argon2 password hasher

extra:
  recipe-maintainers:
    - rxm7706

