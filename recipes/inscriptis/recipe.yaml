# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.4"

package:
  name: inscriptis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/inscriptis/inscriptis-${{ version }}.tar.gz
  sha256: 8735e3a12f32b48e345d77ef059339b445f687a553fb255eb4812d6414c05b11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - lxml <6.2.0,>=5.4.0
    - requests <3.0.0,>=2.32.3

tests:
  - python:
      imports:
        - inscriptis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/weblyzard/inscriptis
  license: Apache-2.0
  license_file: LICENSE
  summary: inscriptis - HTML to text converter.
  description: |
    inscriptis - HTML to text converter.
  repository: https://github.com/weblyzard/inscriptis
  documentation: https://inscriptis.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
