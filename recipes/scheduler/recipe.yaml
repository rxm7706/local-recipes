# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.11"

package:
  name: scheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scheduler/scheduler-${{ version }}.tar.gz
  sha256: b2234a069448a617abbc511b9e18f48c4deb3dcd9dcc51721d9c90ef2943b72a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - typeguard >=3.0.0

tests:
  - python:
      imports:
        - scheduler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/scheduler/
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: A simple in-process python scheduler library with asyncio, threading and timezone support.
  description: |
    A simple in-process python scheduler library with asyncio, threading and timezone support.
  repository: https://gitlab.com/DigonIO/scheduler
  documentation: https://scheduler.digon.io

extra:
  recipe-maintainers:
    - sanurielf

#### CFE metadata AND comments
