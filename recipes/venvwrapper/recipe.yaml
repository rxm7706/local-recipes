# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: venvwrapper
  version: ${{ version }}

source:
  url: https://github.com/andy-maier/venvwrapper/archive/refs/tags/${{ version }}.tar.gz
  sha256: 36eaf822703b3231d025fdd35c72bf007d1889884ecb96d12150afb1d7bfc500

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=70.0.0
    - wheel >=0.41.3
  run:
    - python >=${{ python_min }}
    - venvwrapper

tests:
  - python:
      imports:
        - venvwrapper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/venvwrapper/
  license: Apache-2.0
  license_file: LICENSE
  summary: Wrapper script for Python's venv
  description: |
    Wrapper script for Python's venv
  repository: https://github.com/andy-maier/venvwrapper

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
