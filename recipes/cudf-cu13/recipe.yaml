# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: cudf-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/c/cudf-cu13/cudf_cu13-26.8.0-cp311-abi3-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: 9020b467f8274d618b6f61416da727c1949d058634ddbc79c2430e6f3c4424ad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cachetools
    - cuda-bindings <14.0,>=13.0.1
    - cuda-toolkit ==13.*
    - cupy-cuda13x !=14.1.0,>=14.0.1
    - fsspec >=0.6.0
    - libcudf-cu13 ==26.8.*
    - numba-cuda-mlir >=0.3.0
    - numba-cuda <0.31.0,>=0.22.2
    - numba <0.65.0,>=0.60.0
    - numpy <3.0,>=2.0
    - nvtx >=0.2.1
    - packaging
    - pandas <3.0.4a0,>=3.0.0
    - pyarrow <24,>=19.0.0
    - pylibcudf-cu13 ==26.8.*
    - rich
    - rmm-cu13 ==26.8.*

tests:
  - python:
      imports:
        - cudf_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cudf
  license: Apache-2.0
  license_file: LICENSE
  summary: cuDF - GPU Dataframe
  description: |
    cuDF - GPU Dataframe
  documentation: https://docs.rapids.ai/api/cudf/stable/

extra:
  recipe-maintainers:
    - rxm7706

