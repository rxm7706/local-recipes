# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: prophepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prophepy/prophepy-${{ version }}.tar.gz
  sha256: 9009ba16d06cfd7c4048864013198866b809fe5d05f7d0fd25699dde90734ad3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - prophepy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/prophepy/
  license: MIT
  license_file: LICENSE
  summary: Python mocks made for humans
  description: |
    Python mocks made for humans

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
