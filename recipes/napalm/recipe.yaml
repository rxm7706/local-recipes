# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.0"

package:
  name: napalm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/napalm/napalm-${{ version }}.tar.gz
  sha256: 9d1250d61e9412542263aa14d20e507fd9f34b0483e9e2719aaa00e2fc6c04da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12.0
  run:
    - python >=${{ python_min }}
    - paramiko >=3.5.0
    - requests >=2.7.0
    - textfsm >=1.1.3
    - jinja2 >=3.1.4
    - netaddr >=1.3.0
    - pyyaml >=6.0.2
    - pyeapi >=1.0.2
    - netmiko >=4.4.0
    - junos-eznc >=2.7.4
    - lxml >=4.3.0
    - ncclient >=0.6.16
    - ttp >=0.9.5
    - ttp-templates >=0.3.7
    - netutils >=1.0.0
    - typing_extensions >=4.12.2

tests:
  - python:
      imports:
        - napalm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/napalm-automation/napalm
  license: Apache-2.0
  license_file: LICENSE
  summary: Network Automation and Programmability Abstraction Layer with Multivendor support
  description: |
    Network Automation and Programmability Abstraction Layer with Multivendor support
  repository: https://github.com/napalm-automation/napalm

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: napalm
  cfe-upstream-registry: pypi
  cfe-upstream-name: napalm
