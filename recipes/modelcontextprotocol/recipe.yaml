# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: modelcontextprotocol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/modelcontextprotocol/modelcontextprotocol-${{ version }}.tar.gz
  sha256: 0d552129b5cd24241fdfee91182e231000c988935ee0620e4e71b3d7dc438b01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.0.0
    - jinja2 >=3.1.0
    - loguru >=0.7.0
    - mcp >=1.2.0
    - posthog >=3.0.0
    - rich >=13.0.0

tests:
  - python:
      imports:
        - modelcontextprotocol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/leanmcp/modelcontextprotocol
  license: MIT
  license_file: LICENSE
  summary: CLI tool and utilities for scaffolding Model Context Protocol (MCP) projects with enhanced logging
  description: |
    CLI tool and utilities for scaffolding Model Context Protocol (MCP) projects with enhanced logging
  repository: https://github.com/leanmcp/modelcontextprotocol
  documentation: https://github.com/leanmcp/modelcontextprotocol#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
