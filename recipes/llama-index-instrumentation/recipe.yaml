# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: llama-index-instrumentation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-instrumentation/llama_index_instrumentation-${{ version }}.tar.gz
  sha256: eeb724648b25d149de882a5ac9e21c5acb1ce780da214bda2b075341af29ad8e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - deprecated >=1.2.18
    - pydantic >=2.11.5

tests:
  - python:
      imports:
        - llama_index_instrumentation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://llamaindex.ai
  license: MIT
  license_file: LICENSE
  summary: Instrumentation and Observability for LlamaIndex
  description: |
    Instrumentation and Observability for LlamaIndex
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-instrumentation
  documentation: https://developers.llamaindex.ai/python/framework/module_guides/observability/instrumentation/

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
