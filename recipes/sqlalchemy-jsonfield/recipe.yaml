# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: sqlalchemy-jsonfield
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SQLAlchemy-JSONField/sqlalchemy_jsonfield-${{ version }}.tar.gz
  sha256: 162099ff6b6f475105afff90b15da114cbd87fd18df94e7d091df9f9d0e4f69f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.3.0
  run:
    - python >=${{ python_min }}
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_jsonfield
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/SQLAlchemy-JSONField/
  license: Apache-2.0
  license_file: LICENSE
  summary: SQLALchemy JSONField implementation for storing dicts at SQL
  description: |
    SQLALchemy JSONField implementation for storing dicts at SQL
  repository: https://github.com/penguinolog/sqlalchemy_jsonfield

extra:
  recipe-maintainers:
    - xylar

