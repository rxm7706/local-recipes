# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.0"
  python_min: "3.12"

package:
  name: llmwhisperer-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llmwhisperer-client/llmwhisperer_client-${{ version }}.tar.gz
  sha256: bf724e3a47e6faaab962869c8e9cbb9a5b6a42016e23adb111aa71ada40b31d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - requests >=2
    - tenacity >=8.0

tests:
  - python:
      imports:
        - unstract.llmwhisperer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://unstract.com/llmwhisperer/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Client library for LLM Whisperer
  description: |
    Client library for LLM Whisperer
  repository: https://github.com/Zipstack/llm-whisperer-python-client

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
