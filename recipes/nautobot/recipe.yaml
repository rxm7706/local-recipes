# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: nautobot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nautobot/nautobot-${{ version }}.tar.gz
  sha256: 50a3abae58b60d181863832e641f350bbd1161aea694cbbe4d0761c60a1db182

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - jinja2 <3.2,>=3.1.6
    - markdown <3.11,>=3.10.2
    - pyyaml <6.1,>=6.0.3
    - celery <5.7,>=5.6.3
    - cryptography <50,>=48.0.1
    - django <5.3,>=5.2.16
    - django-ajax-tables <1.2,>=1.1.1
    - django-celery-beat ==2.9.0
    - django-celery-results <2.7,>=2.6.0
    - django-constance <4.4,>=4.3.5
    - django-cors-headers <4.10,>=4.9.0
    - django-db-file-storage <0.6,>=0.5.6.1
    - django-extensions <4.2,>=4.1
    - django-filter <25.3,>=25.2
    - django-health-check <3.21,>=3.20.8
    - django-jinja <2.12,>=2.11.0
    - django-prometheus <2.6,>=2.5.0
    - django-redis <7.1,>=7.0.0
    - django-silk <5.6,>=5.5.0
    - django-structlog <10.2,>=10.1.0
    - django-tables2 <3.1,>=3.0.0
    - django-taggit <6.2,>=6.1.0
    - django-timezone-field <7.3,>=7.2.2
    - django-tree-queries <0.25,>=0.24.0
    - django-webserver <1.3,>=1.2.0
    - djangorestframework <3.18,>=3.17.1
    - drf-spectacular <0.30,>=0.29.0
    - emoji <2.16,>=2.15.0
    - gitpython <3.2,>=3.1.55
    - graphene-django <3.3,>=3.2.3
    - graphene-django-optimizer <0.11,>=0.10.0
    - jsonschema <5,>=4.7.0
    - kubernetes <37,>=36.0.3
    - netaddr <1.4,>=1.3.0
    - netutils <2,>=1.14.0
    - nh3 <0.4,>=0.3.6
    - opentelemetry-exporter-otlp <1.44,>=1.43.0
    - opentelemetry-instrumentation-celery <0.65,>=0.64b0
    - opentelemetry-instrumentation-dbapi <0.65,>=0.64b0
    - opentelemetry-instrumentation-django <0.65,>=0.64b0
    - opentelemetry-instrumentation-logging <0.65,>=0.64b0
    - opentelemetry-instrumentation-mysqlclient <0.65,>=0.64b0
    - opentelemetry-instrumentation-psycopg2 <0.65,>=0.64b0
    - opentelemetry-instrumentation-redis <0.65,>=0.64b0
    - opentelemetry-instrumentation-requests <0.65,>=0.64b0
    - opentelemetry-instrumentation-wsgi <0.65,>=0.64b0
    - opentelemetry-sdk <1.44,>=1.43.0
    - packaging >=23.2
    - pillow <13,>=12.3.0
    - prometheus_client <0.26,>=0.25.0
    - psycopg2 <2.10,>=2.9.12
    - python-slugify <8.1,>=8.0.4
    - pyuwsgi <2.1,>=2.0.30.post1
    - regex >=2026.7.19
    - social-auth-app-django <5.10,>=5.9.0
    - svgwrite <1.5,>=1.4.3
    - urllib3 <3.0.0,>=2.7.0

tests:
  - python:
      imports:
        - nautobot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://nautobot.com
  license: Apache-2.0
  license_file: LICENSE
  summary: Source of truth and network automation platform.
  description: |
    Source of truth and network automation platform.
  repository: https://github.com/nautobot/nautobot
  documentation: https://docs.nautobot.com

extra:
  recipe-maintainers:
    - rxm7706

