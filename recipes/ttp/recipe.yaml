# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.1"

package:
  name: ttp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/ttp/ttp-${{ version }}.tar.gz
  sha256: 9c928aeb1f2dade05419c7ecc756d62cb45857deb5cc6b1b9f2058e70f25ae59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ttp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dmulyalin/ttp
  license: MIT
  license_file: LICENSE
  summary: Template Text Parser
  description: |
    Template Text Parser
  repository: https://github.com/dmulyalin/ttp
  documentation: https://ttp.readthedocs.io/

extra:
  recipe-maintainers:
    - cousinbr

#### CFE metadata AND comments
