# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.18"

package:
  name: matplotlab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/matplotlab/matplotlab-${{ version }}.tar.gz
  sha256: 060eb334feb4ca9fc2f1b18b7772cf9379e4f4d08d967119fe67f78f558d3c66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.19.0
    - matplotlib-base >=3.3.0

tests:
  - python:
      imports:
        - matplotlab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yourusername/matplotlab
  license: MIT
  license_file: LICENSE
  summary: Laboratory Intelligence Toolkit - Swarm Intelligence Module
  description: |
    Laboratory Intelligence Toolkit - Swarm Intelligence Module

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
