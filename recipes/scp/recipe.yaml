# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.1"

package:
  name: scp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scp/scp-${{ version }}.tar.gz
  sha256: 3f2b260bf9bd4c2b6857f697a1d7e8edc26fa569282b77027e849dfe1e48580a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paramiko

tests:
  - python:
      imports:
        - scp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jbardin/scp.py
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  summary: scp module for paramiko
  description: |
    scp module for paramiko

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: scp
  cfe-upstream-registry: pypi
  cfe-upstream-name: scp
  cfe-purls:
    - pkg:conda/scp@${{ version }}?channel=conda-forge
    - pkg:pypi/scp@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/jbardin/scp.py
  cfe-import-names: [scp]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/scp-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T05:15:17Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T05:15:17Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T05:15:17Z
