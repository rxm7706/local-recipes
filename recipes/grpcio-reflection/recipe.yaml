# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.83.0"

package:
  name: grpcio-reflection
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpcio-reflection/grpcio_reflection-${{ version }}.tar.gz
  sha256: 6a2a30a462ac2c3c6d149734a8fe655fa7617c17fa2cda9949006f3bf07f5b3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.1
    - wheel
  run:
    - python >=${{ python_min }}
    - protobuf <8.0.0,>=7.35.1
    - grpcio >=1.83.0

tests:
  - python:
      imports:
        - grpc_reflection
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Standard Protobuf Reflection Service for gRPC
  description: |
    Standard Protobuf Reflection Service for gRPC
  documentation: https://grpc.github.io/grpc/python/grpc_reflection.html

extra:
  recipe-maintainers:
    - lidavidm
    - mariusvniekerk

