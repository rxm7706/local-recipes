# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: grpcio-reflection
  version: "1.83.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6a2a30a462ac2c3c6d149734a8fe655fa7617c17fa2cda9949006f3bf07f5b3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - grpcio =${{ version }}
    - protobuf >=3.12.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - grpc_reflection
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Standard Protobuf Reflection Service for gRPC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://grpc.io

extra:
  recipe-maintainers:
    - lidavidm
    - mariusvniekerk
