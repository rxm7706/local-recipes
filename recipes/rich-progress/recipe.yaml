# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: rich-progress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rich-progress/rich_progress-${{ version }}.tar.gz
  sha256: 2ce60e1527cee6170bbd0baeb857f3b846d5318701a002d6392c3b59382c4ddc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rich >=13.0.0
    - typing_extensions

tests:
  - python:
      imports:
        - rich_progress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yourusername/rich-progress
  license: MIT
  license_file: LICENSE
  summary: Thread-safe progress manager with rich logging
  description: |
    Thread-safe progress manager with rich logging

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
