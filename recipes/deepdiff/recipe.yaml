# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.1.0"

package:
  name: deepdiff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deepdiff/deepdiff-${{ version }}.tar.gz
  sha256: 07e9e366fab4297755153c4eab795ad4ef3cbd0d51660e847f5751c6bd727687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - cachebox <6,>=5.2
    - orderly-set <6,>=5.5.0

tests:
  - python:
      imports:
        - deepdiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://zepworks.com/deepdiff/
  license: MIT
  license_file: LICENSE
  summary: Deep Difference and Search of any Python object/data. Recreate objects by adding adding deltas to each other.
  description: |
    Deep Difference and Search of any Python object/data. Recreate objects by adding adding deltas to each other.
  repository: https://github.com/qlustered/deepdiff
  documentation: https://zepworks.com/deepdiff/

extra:
  recipe-maintainers:
    - loriab
    - seperman
    - synapticarbors

#### CFE metadata AND comments
