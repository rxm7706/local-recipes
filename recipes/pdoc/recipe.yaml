# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pdoc
  version: "16.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # pdoc does not currently upload a distrobution (tar.gz) file to PyPi, so I'm
  # stuck using the github URL for now. I requested this to be fixed, and it is
  # accepted, I can switch to the follow url:
  # url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # Until then, I must manually download and check with "openssl sha256 <download file>"
  url: https://github.com/mitmproxy/pdoc/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 667034288817f16ccbf77d8500925c3dfa0ace4febad90c908ff7d2693e932e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pdoc = pdoc.__main__:cli

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - jinja2 >=2.11.0
    - pygments >=2.12.0
    - markupsafe >=1.1.1
    - markdown2 >=2.5.4

tests:
  - python:
      imports:
        - pdoc
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - pdoc --help

about:
  summary: API Documentation for Python Projects
  description: |
    see our main page for more information
  license: Unlicense
  license_file: LICENSE
  homepage: https://pdoc.dev/
  repository: https://github.com/mitmproxy/pdoc
  documentation: https://pdoc.dev/docs/pdoc.html

extra:
  recipe-maintainers:
    - jacobwilliams
    - rtburns-jpl
    - jacksund
