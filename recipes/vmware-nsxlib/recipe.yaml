# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "19.4.3"

package:
  name: vmware-nsxlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmware-nsxlib/vmware-nsxlib-${{ version }}.tar.gz
  sha256: e47375f6bb2f2a19a714d70e71bbecbc0f9f6c9ac5be643038964c5c632a7398

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography
    - decorator
    - eventlet
    - netaddr
    - oslo.i18n
    - oslo.serialization
    - oslo.service
    - oslo.utils
    - pbr
    - pyopenssl
    - tenacity
    - oslo.log

tests:
  - python:
      imports:
        - vmware_nsxlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://opendev.org/x/vmware-nsxlib
  license: Apache-2.0
  license_file: LICENSE
  summary: A common library that interfaces with VMware NSX
  description: |
    A common library that interfaces with VMware NSX

extra:
  recipe-maintainers:
    - rxm7706

