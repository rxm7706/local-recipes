    - pkg:pypi/rasterstats@${{ version }}
  cfe-upstream-repo: https://github.com/perrygeo/python-rasterstats
  cfe-upstream-homepage: https://pypi.org/project/rasterstats/
  cfe-import-names: [rasterstats]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/rasterstats-feedstock
