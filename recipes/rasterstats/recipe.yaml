# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: rasterstats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rasterstats/rasterstats-${{ version }}.tar.gz
  sha256: 2b955f6775b7f641c8094d00bc4381492184ba162b5dba1baa69df8db98efa5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - affine
    - click !=8.2.1,>7.1
    - cligj >=0.4
    - numpy >=1.9
    - pyogrio
    - rasterio >=1.0
    - shapely
    - simplejson

tests:
  - python:
      imports:
        - rasterstats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rasterstats/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Summarize geospatial raster datasets based on vector geometries
  description: |
    Summarize geospatial raster datasets based on vector geometries
  repository: https://github.com/perrygeo/python-rasterstats
  documentation: https://pythonhosted.org/rasterstats/

extra:
  recipe-maintainers:
    - perrygeo
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rasterstats
  cfe-upstream-registry: pypi
  cfe-upstream-name: rasterstats
