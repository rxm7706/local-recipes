# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: alabaster
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alabaster/alabaster-${{ version }}.tar.gz
  sha256: c00dca57bca26fa62a6d7d0a9fcce65f3e026e9bfe33e9c538fd3fbb2144fd9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - alabaster
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://alabaster.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A light, configurable Sphinx theme
  description: |
    A light, configurable Sphinx theme
  repository: https://github.com/sphinx-doc/alabaster
  documentation: https://alabaster.readthedocs.io/

extra:
  recipe-maintainers:
    - AA-Turner
    - conda-forge/sphinx
    - msarahan
    - r-jain1
    - ocefpaf

#### CFE metadata AND comments
