# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: chispa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chispa/chispa-${{ version }}.tar.gz
  sha256: 4dcf4de9481979af77f8d697cb0f27f2599c21244537b4995204cdc529ce9a1b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - prettytable <4,>=3

tests:
  - python:
      imports:
        - chispa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MrPowers/chispa
  license: MIT
  license_file: LICENSE
  summary: Pyspark test helper library
  description: |
    Pyspark test helper library
  repository: https://github.com/MrPowers/chispa
  documentation: https://mrpowers.github.io/chispa

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: chispa
  cfe-upstream-registry: pypi
  cfe-upstream-name: chispa
  cfe-purls:
    - pkg:conda/chispa@${{ version }}?channel=conda-forge
    - pkg:pypi/chispa@${{ version }}
  cfe-upstream-repo: https://github.com/MrPowers/chispa
  cfe-upstream-homepage: https://github.com/MrPowers/chispa
  cfe-import-names: [chispa]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
