# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.3"

package:
  name: nautobot-plugin-nornir
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nautobot-plugin-nornir/nautobot_plugin_nornir-${{ version }}.tar.gz
  sha256: c56321b1d711c3adb0c844c564ee7b82888a938b25839b32273a330e57df7cf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - nautobot <4.0.0,>=3.1.0
    - nornir-nautobot <5.0.0,>=4.4.0

tests:
  - python:
      imports:
        - nautobot_plugin_nornir
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nautobot/nautobot-app-nornir
  license: Apache-2.0
  license_file: LICENSE
  summary: Nautobot App that provides a shim layer to simplify using Nornir within other Nautobot Apps and Nautobot Jobs
  description: |
    Nautobot App that provides a shim layer to simplify using Nornir within other Nautobot Apps and Nautobot Jobs
  repository: https://github.com/nautobot/nautobot-app-nornir
  documentation: https://docs.nautobot.com/projects/plugin-nornir/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

