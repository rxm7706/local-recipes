# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sf-hamilton-sdk
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sf_hamilton_sdk-${{ version }}.tar.gz
  sha256: 72834bced37b77d57106f1f4f938293b5170387136ce99c9ed66988709eec06a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hamilton-sdk = hamilton_sdk.cli.cli:cli

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - aiohttp
    - click
    - gitpython
    - jinja2
    - loguru
    - posthog
    - requests
    - sf-hamilton >=1.43.0
    - sqlglot

tests:
  - python:
      imports:
        - hamilton_sdk
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - hamilton-sdk --help

about:
  summary: Hamilton SDK for reading and writing to the Hamilton backend APIs that support the UI.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/DAGWorks-Inc/hamilton
  repository: https://github.com/dagworks-inc/hamilton/ui/sdk
  documentation: https://hamilton.dagworks.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
