# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.1"

package:
  name: bitmath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bitmath/bitmath-${{ version }}.tar.gz
  sha256: 56f2cda86b1f0aa6470f4aaa90f82ef029f0e16c31b66f0fdd9d67613bc5e9f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bitmath
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitmath.readthedocs.io/en/latest/index.html
  license: MIT
  license_file: LICENSE
  summary: Pythonic module for representing and manipulating file sizes with different prefix notations (file size unit conversion)
  description: |
    Pythonic module for representing and manipulating file sizes with different prefix notations (file size unit conversion)

extra:
  recipe-maintainers:
    - HeavyTony2

