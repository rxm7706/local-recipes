# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.9.3"

package:
  name: uncompyle6
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uncompyle6/uncompyle6-${{ version }}.tar.gz
  sha256: 78b764d4c843b0455fb39db6deb421a48d5d3ebb846537ba6444afe107c4ebc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - spark-parser <1.9.2,>=1.8.9
    - xdis <6.2.0,>=6.1.1

tests:
  - python:
      imports:
        - uncompyle6
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rocky/python-uncompyle6/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Python cross-version byte-code decompiler
  description: |
    Python cross-version byte-code decompiler

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
