# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pyark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyark/pyark-${{ version }}.tar.gz
  sha256: 5d87a1b9e96d261d07e37cb21a3db6c94a3f4ac4f6482445a90f525680302bad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/adfinis-sygroup/pyark
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Pyark is a small python-based CLI tool, which allows you to interact with the CyberArk Enterprise Password Vault API.
  description: |
    Pyark is a small python-based CLI tool, which allows you to interact with the CyberArk Enterprise Password Vault API.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
