# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.2.4"

package:
  name: strict_functions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strict_functions/strict_functions-${{ version }}.tar.gz
  sha256: c1f22784e77151bbc808f31bb5df0d5cfbc37d329b5f3aa94db10abb169e37fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strict_functions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CodyKochmann/strict_functions
  license: MIT
  license_file: LICENSE
  summary: Decorators for function scope control, overloading, type safety, thread safety, cache control, tracing and even self awareness!
  description: |
    Decorators for function scope control, overloading, type safety, thread safety, cache control, tracing and even self awareness!

extra:
  recipe-maintainers:
    - rxm7706

