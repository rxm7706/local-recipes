# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.3.post3"

package:
  name: wavedrom
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wavedrom/wavedrom-${{ version }}.tar.gz
  sha256: 327b4d5dca593c81257c202fea516f7a908747fb11527c359f034f5b7af7f47b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - svgwrite
    - pyyaml

tests:
  - python:
      imports:
        - wavedrom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wallento/wavedrompy
  license: MIT
  license_file: LICENSE
  summary: WaveDrom compatible python command line
  description: |
    WaveDrom compatible python command line

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wavedrom
