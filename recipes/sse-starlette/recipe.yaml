# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.8"

package:
  name: sse-starlette
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sse-starlette/sse_starlette-${{ version }}.tar.gz
  sha256: ed89ffbb75cbf78a5fe2f2109cd584792ee7f9dfac96f791db546df8f15f3f9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - starlette >=0.49.1
    - anyio >=4.7.0

tests:
  - python:
      imports:
        - sse_starlette
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sysid/sse-starlette
  license: BSD-3-Clause
  license_file: LICENSE
  summary: SSE plugin for Starlette
  description: |
    SSE plugin for Starlette
  repository: https://github.com/sysid/sse-starlette

extra:
  recipe-maintainers:
    - dhirschfeld
    - cyprienc

