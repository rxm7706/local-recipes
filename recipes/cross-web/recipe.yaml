# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: cross-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cross-web/cross_web-${{ version }}.tar.gz
  sha256: 15fbc8b9a824a055db8127fd6e43e0773074f620fdecb6b2b587d3d0a2bdd459

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - cross_web
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/usecross/cross-web
  license: MIT
  license_file: LICENSE
  summary: A library for working with web frameworks
  description: |
    A library for working with web frameworks
  repository: https://github.com/usecross/cross-web

extra:
  recipe-maintainers:
    - bollwyvl

