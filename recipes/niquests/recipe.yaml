# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.21.0"

package:
  name: niquests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/niquests/niquests-${{ version }}.tar.gz
  sha256: 5b7d10a05f4c7ed08cede0af74f492ae7a8a5a71291833d029e23365fc3ea80a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.6.0,<2
  run:
    - python >=${{ python_min }}
    - wassima
    - charset-normalizer <4,>=2
    - urllib3-future <3,>=2.13.903

tests:
  - python:
      imports:
        - niquests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/niquests/
  license: Apache-2.0
  license_file: LICENSE
  summary: Niquests is a simple, yet elegant, HTTP library. It is a drop-in replacement for Requests, which is under feature freeze.
  description: |
    Niquests is a simple, yet elegant, HTTP library. It is a drop-in replacement for Requests, which is under feature freeze.
  repository: https://github.com/jawah/niquests
  documentation: https://niquests.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706
    - jan-janssen

#### CFE metadata AND comments
