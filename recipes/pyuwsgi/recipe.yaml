# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.30.post1"

package:
  name: pyuwsgi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyuwsgi/pyuwsgi-${{ version }}.tar.gz
  sha256: b09a4a462173944f6f1d56f942074db02866e16f39045658fa8b7bec861042f4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - t.core.readline
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uwsgi-docs.readthedocs.io/en/latest/
  license: GPL-2.0-only
  license_file: LICENSE
  summary: The uWSGI server
  description: |
    The uWSGI server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
