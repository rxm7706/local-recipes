# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: ismember
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ismember/ismember-${{ version }}.tar.gz
  sha256: 2263aaaad010e29b7a71bd6a6740e6c925d66574051a49ecaa7d1d213414c9b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - ismember
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://erdogant.github.io/ismember
  license: MIT
  license_file: LICENSE
  summary: Python package ismember returns array elements that are members of set array.
  description: |
    Python package ismember returns array elements that are members of set array.

extra:
  recipe-maintainers:
    - rxm7706

