# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: behave-cucumber-formatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/behave-cucumber-formatter/behave_cucumber_formatter-${{ version }}.tar.gz
  sha256: c74ea2f4560a0b774e8eeb3802d577c59786047ab60d379241aa58cca6dd7046

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - behave_cucumber_formatter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/BluThaitanium/Cucumber-Behave-Package
  license: THE_UNLICENSED
  license_file: LICENSE
  summary: Cucumber JSON formatter for pipeline tests
  description: |
    Cucumber JSON formatter for pipeline tests

extra:
  recipe-maintainers:
    - rxm7706

