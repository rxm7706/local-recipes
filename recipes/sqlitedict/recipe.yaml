# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: sqlitedict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlitedict/sqlitedict-${{ version }}.tar.gz
  sha256: 03d9cfb96d602996f1d4c2db2856f1224b96a9c431bdd16e78032a72940f9e8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlitedict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/piskvorky/sqlitedict
  license: Apache-2.0
  license_file: LICENSE
  summary: Persistent dict in Python, backed up by sqlite3 and pickle, multithread-safe.
  description: |
    Persistent dict in Python, backed up by sqlite3 and pickle, multithread-safe.

extra:
  recipe-maintainers:
    - notestaff
    - synapticarbors

