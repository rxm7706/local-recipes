# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.4"

package:
  name: facebook-wda
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/facebook-wda/facebook-wda-${{ version }}.tar.gz
  sha256: c56bc4db64063f514b057b3609a9485d26f0231ecbb400ac98912a8b5e853cc3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - retry
    - pillow
    - cached_property ~=1.5.1
    - deprecated ~=1.2.6
    - construct >=2

tests:
  - python:
      imports:
        - wda
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openatx/facebook-wda
  license: MIT
  license_file: LICENSE
  summary: Python Client for Facebook WebDriverAgent
  description: |
    Python Client for Facebook WebDriverAgent

extra:
  recipe-maintainers:
    - rxm7706

