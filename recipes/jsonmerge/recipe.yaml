# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jsonmerge
  version: "1.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jsonmerge-${{ version }}.tar.gz
  sha256: c43757e0180b0e19b7ae4c130ad42a07cc580c31912f61f4823e8eaf2fa394a3

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - jsonschema >2.4.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonmerge
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Merge a series of JSON documents.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/jsonmerge/

extra:
  recipe-maintainers:
    - dokempf
