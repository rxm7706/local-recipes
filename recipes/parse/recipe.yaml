# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.22.1"

package:
  name: parse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parse/parse-${{ version }}.tar.gz
  sha256: d3a4740ec3da338e2b258b2d69741b731eadfddca59e24a14bc4ee5fce38c911

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/r1chardj0n3s/parse
  license: MIT
  license_file: LICENSE
  summary: parse() is the opposite of format()
  description: |
    parse() is the opposite of format()

extra:
  recipe-maintainers:
    - stuertz

