# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: parse
  version: "1.22.1"
  sha256: d3a4740ec3da338e2b258b2d69741b731eadfddca59e24a14bc4ee5fce38c911

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - parse
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: parse() is the opposite of format()
  description: |
    Parse strings using a specification based on the Python format() syntax.
  homepage: https://github.com/r1chardj0n3s/parse
  repository: https://github.com/r1chardj0n3s/parse
  documentation: https://github.com/r1chardj0n3s/parse/blob/master/README.rst

extra:
  recipe-maintainers:
    - stuertz
