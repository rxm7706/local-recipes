# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.99"

package:
  name: pyttsx3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyttsx3/pyttsx3-${{ version }}.tar.gz
  sha256: a18a5601530a570c43491b4112887fc34c47e118fc937287db8d21905da1f74e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyttsx3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nateshmbhat/pyttsx3
  license: MPL-2.0
  license_file: LICENSE
  summary: Text to Speech (TTS) library for Python 3. Works without internet connection or delay. Supports multiple TTS engines, including Sapi5, nsss, and espeak.
  description: |
    Text to Speech (TTS) library for Python 3. Works without internet connection or delay. Supports multiple TTS engines, including Sapi5, nsss, and espeak.

extra:
  recipe-maintainers:
    - rxm7706

