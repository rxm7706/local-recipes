# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mdit-py-plugins
  version: "0.6.1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a2bca0f039f39dbd35fb74ae1b5f998608c437463371f0ff7f49a19a17a114d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core >=3.4,<4
    - pip
    - python 3.10.*
  run:
    - markdown-it-py >=2.0.0,<5.0.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mdit_py_plugins
        - mdit_py_plugins.amsmath
        - mdit_py_plugins.anchors
        - mdit_py_plugins.container
        - mdit_py_plugins.deflist
        - mdit_py_plugins.dollarmath
        - mdit_py_plugins.footnote
        - mdit_py_plugins.front_matter
        - mdit_py_plugins.myst_blocks
        - mdit_py_plugins.myst_role
        - mdit_py_plugins.tasklists
        - mdit_py_plugins.texmath
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Collection of plugins for markdown-it-py
  homepage: https://github.com/executablebooks/mdit-py-plugins
  documentation: https://markdown-it-py.readthedocs.io/en/latest/plugins.html

extra:
  recipe-maintainers:
    - dopplershift
    - choldgraf
    - chrisjsewell
