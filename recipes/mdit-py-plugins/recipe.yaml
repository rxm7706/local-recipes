# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: mdit-py-plugins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mdit-py-plugins/mdit_py_plugins-${{ version }}.tar.gz
  sha256: a2bca0f039f39dbd35fb74ae1b5f998608c437463371f0ff7f49a19a17a114d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4,<4
  run:
    - python >=${{ python_min }}
    - markdown-it-py <5.0.0,>=2.0.0

tests:
  - python:
      imports:
        - mdit_py_plugins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/executablebooks/mdit-py-plugins
  license: MIT
  license_file: LICENSE
  summary: Collection of plugins for markdown-it-py
  description: |
    Collection of plugins for markdown-it-py
  documentation: https://mdit-py-plugins.readthedocs.io

extra:
  recipe-maintainers:
    - dopplershift
    - choldgraf
    - chrisjsewell

