# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: outdated
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/outdated/outdated-${{ version }}.tar.gz
  sha256: 4b7fdec88e36711120d096d485fc4d5035e4e5ffbd907cf3a6ce2af43058b970

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=44
    - wheel
  run:
    - python >=${{ python_min }}
    - setuptools
    - littleutils
    - requests

tests:
  - python:
      imports:
        - outdated
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/alexmojaki/outdated
  license: MIT
  license_file: LICENSE.txt
  summary: Check if a version of a PyPI package is outdated
  description: |
    Check if a version of a PyPI package is outdated

extra:
  recipe-maintainers:
    - hoechenberger

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: outdated
  cfe-upstream-registry: pypi
  cfe-upstream-name: outdated
  cfe-purls:
    - pkg:conda/outdated@${{ version }}?channel=conda-forge
    - pkg:pypi/outdated@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/alexmojaki/outdated
  cfe-import-names: [outdated]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/outdated-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.2

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T02:34:05Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T02:34:05Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T02:34:05Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
