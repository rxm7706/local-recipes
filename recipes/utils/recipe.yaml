# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/utils/utils-${{ version }}.tar.gz
  sha256: f4d5157e27e9d434006b5b52a1ec951a34e53e7ecaa145d43a153ec452eb5d9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/haaksmash/pyutils
  license: MIT
  license_file: LICENSE
  summary: A grab-bag of utility functions and objects
  description: |
    A grab-bag of utility functions and objects

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: utils
  cfe-upstream-registry: pypi
  cfe-upstream-name: utils
  cfe-purls:
    - pkg:conda/utils@${{ version }}?channel=conda-forge
    - pkg:pypi/utils@${{ version }}
  cfe-upstream-repo: http://github.com/haaksmash/pyutils
  cfe-upstream-homepage: http://github.com/haaksmash/pyutils
  cfe-import-names: [utils]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
