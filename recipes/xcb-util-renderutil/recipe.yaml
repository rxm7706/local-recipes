# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: xcb-util-renderutil
  version: "0.3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://xcb.freedesktop.org/dist/xcb-util-renderutil-${{ version }}.tar.xz
  sha256: 3e15d4f0e22d8ddbfbb9f5d77db43eacd7a304029bf25a6166cc63caa96d04ba

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - libxcb
    - xorg-xproto
  run_exports:
    - ${{ pin_subpackage('xcb-util-renderutil', upper_bound='x.x') }}

tests:
  - script:
      - test -f ${PREFIX}/lib/libxcb-render-util.so

about:
  license: MIT
  license_file: COPYING
  summary: Provides additional extensions to the XCB library
  homepage: https://xcb.freedesktop.org/

extra:
  recipe-maintainers:
    - erykoff
