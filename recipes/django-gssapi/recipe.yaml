# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: django-gssapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-gssapi/django-gssapi-${{ version }}.tar.gz
  sha256: e8e88cc5c1f9f7ad755439d32190f06854f77ad30806219c49b6f49f98303cff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - python-gssapi
    - six

tests:
  - python:
      imports:
        - django_gssapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://dev.entrouvert.org/projects/django-gssapi/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: GSSAPI authentication for Django
  description: |
    GSSAPI authentication for Django

extra:
  recipe-maintainers:
    - rxm7706

