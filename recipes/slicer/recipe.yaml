# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: slicer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/slicer/slicer-${{ version }}.tar.gz
  sha256: 2e7553af73f0c0c2d355f4afcc3ecf97c6f2156fcf4593955c3f56cf6c4d6eb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - slicer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/interpretml/slicer
  license: MIT
  license_file: LICENSE
  summary: A small package for big slicing.
  description: |
    A small package for big slicing.

extra:
  recipe-maintainers:
    - slundberg
    - connortann
    - paulbkoch

#### CFE metadata AND comments
