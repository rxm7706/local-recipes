# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.3"

package:
  name: check-wheel-contents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/check-wheel-contents/check_wheel_contents-${{ version }}.tar.gz
  sha256: 10e6939e2fe4e6ce1edf2ff6ec6157808677e80782e78021ae139dd88473a442

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - attrs >=18.1
    - backports.cached-property
    - click !=8.2.2,~=8.2
    - packaging
    - pydantic ~=2.0
    - tomli <3.0,>=1.2
    - wheel-filename ~=1.1

tests:
  - python:
      imports:
        - check_wheel_contents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/check-wheel-contents/
  license: MIT
  license_file: LICENSE
  summary: Check your wheels have the right contents
  description: |
    Check your wheels have the right contents
  repository: https://github.com/jwodder/check-wheel-contents

extra:
  recipe-maintainers:
    - bollwyvl

