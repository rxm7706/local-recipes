# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sas_kernel
  version: "2.4.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/SAS_kernel-${{ version }}.tar.gz
  sha256: 7f8f447e9b60d2501ef772bde29db6afacf496434b3336037ddb8b89d3028857

build:
  number: 0
  noarch: python
  script: NO_KERNEL_INSTALL=1 ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.9
    - metakernel >=0.27.5
    - jupyter_client >=6
    - ipython >=7
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9
    - saspy >=3.6
    - metakernel >=0.27.5
    - jupyter_client >=6
    - ipython >=7

tests:
  - python:
      imports:
        - sas_kernel
      pip_check: true

about:
  summary: A SAS kernel for Jupyter
  license: Apache-2.0
  license_file:
    - LICENSE.txt
  homepage: https://github.com/sassoftware/sas_kernel

extra:
  recipe-maintainers:
    - izahn
