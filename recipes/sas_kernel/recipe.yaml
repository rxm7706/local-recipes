# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.13"

package:
  name: sas-kernel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SAS-kernel/SAS_kernel-${{ version }}.tar.gz
  sha256: 7f8f447e9b60d2501ef772bde29db6afacf496434b3336037ddb8b89d3028857

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - IPython

tests:
  - python:
      imports:
        - sas_kernel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sassoftware/sas_kernel
  license: Apache-2.0
  license_file: LICENSE
  summary: A SAS kernel for Jupyter
  description: |
    A SAS kernel for Jupyter

extra:
  recipe-maintainers:
    - izahn

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sas_kernel
  cfe-upstream-registry: pypi
  cfe-upstream-name: sas-kernel
