    - pkg:pypi/sas-kernel@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/sassoftware/sas_kernel
  cfe-import-names: [sas_kernel]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sas_kernel-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.4.13

  cfe-forge-blocker-list: []
