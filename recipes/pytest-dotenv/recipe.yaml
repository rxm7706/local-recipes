# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: pytest-dotenv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-dotenv/pytest-dotenv-${{ version }}.tar.gz
  sha256: 2dc6c3ac6d8764c71c6d2804e902d0ff810fa19692e95fe138aefc9b1aa73732

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest
    - python-dotenv

tests:
  - python:
      imports:
        - pytest_dotenv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/quiqua/pytest-dotenv
  license: MIT
  license_file: LICENSE
  summary: A py.test plugin that parses environment files before running tests
  description: |
    A py.test plugin that parses environment files before running tests

extra:
  recipe-maintainers:
    - hadim

#### CFE metadata AND comments
