# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: winutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WinUtils/WinUtils-${{ version }}.tar.gz
  sha256: fdb9f0530286950219971c86e76b092f2cc814953602669d957a6fb70b1a302c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - winutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Simon3335/WinUtils
  license: MIT
  license_file: LICENSE
  summary: A module to provide simplified system calls on Windows
  description: |
    A module to provide simplified system calls on Windows

extra:
  recipe-maintainers:
    - rxm7706

