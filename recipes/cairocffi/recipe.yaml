# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: cairocffi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cairocffi/cairocffi-${{ version }}.tar.gz
  sha256: 2e48ee864884ec4a3a34bfa8c9ab9999f688286eb714a15a43ec9d068c36557b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - cffi >=1.1.0

tests:
  - python:
      imports:
        - cairocffi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cairocffi/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: cffi-based cairo bindings for Python
  description: |
    cffi-based cairo bindings for Python
  repository: https://github.com/Kozea/cairocffi/
  documentation: https://doc.courtbouillon.org/cairocffi/

extra:
  recipe-maintainers:
    - johanneskoester
    - carlodri

#### CFE metadata AND comments
