# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 2.8.0.post1

recipe:
  name: pytorch_geometric
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torch_geometric/torch_geometric-${{ version }}.tar.gz
  sha256: 2c0c81666ec10f2132f6b4e0b6c57fc813f2c9f6b57599d7b7a799c614c22fbd

build:
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

outputs:
    # Parity with "torch_geometry" pypi package
    # Parity with "pyg::pyg" and "pyg::pytorch-geometric" conda packages
  - package:
      name: pytorch_geometric
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}
        - flit-core >=3.2,<4
        - pip
      run:
        - python >=${{ python_min }}
        - aiohttp
        - fsspec
        - jinja2
        - numpy
        - psutil >=5.8.0
        - pyparsing
        - requests
        - tqdm
        - python-xxhash
    tests:
      - python:
          imports:
            - torch_geometric
            - torch_geometric.nn
            - torch_geometric.data
            - torch_geometric.utils
            - torch_geometric.datasets
            - torch_geometric.transforms
          pip_check: true
          python_version: ${{ python_min }}
    # Parity with "torch_geometry[graphgym]" pypi package
  - package:
      name: pytorch_geometric-graphgym
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('pytorch_geometric', exact=True) }}
        - protobuf  #<4.21
        - pytorch-lightning  #<2.3.0
        - yacs
    tests:
      - python:
          imports:
            - torch_geometric
            - torch_geometric.nn
            - torch_geometric.data
            - torch_geometric.utils
            - torch_geometric.datasets
            - torch_geometric.transforms
            - torch_geometric.graphgym
          pip_check: true
          python_version: ${{ python_min }}
    # Parity with "torch_geometry[modelhub]"
  - package:
      name: pytorch_geometric-modelhub
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('pytorch_geometric', exact=True) }}
        - huggingface_hub
    tests:
      - python:
          imports:
            - torch_geometric
            - torch_geometric.nn
            - torch_geometric.data
            - torch_geometric.utils
            - torch_geometric.datasets
            - torch_geometric.transforms
            - torch_geometric.nn.model_hub
          pip_check: true
          python_version: ${{ python_min }}

about:
  summary: Graph Neural Network Library for PyTorch
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pyg-team/pytorch_geometric
  repository: https://github.com/pyg-team/pytorch_geometric

extra:
  recipe-maintainers:
    - jameslamb
    - jan-janssen
    - bubblyorca
    - mxr-conda
    - mikemhenry
    - jamesmyatt
