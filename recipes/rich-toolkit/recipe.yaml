# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.20.3"

package:
  name: rich-toolkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rich-toolkit/rich_toolkit-${{ version }}.tar.gz
  sha256: 223dd2cfba325ed55e94933b9e53f3aca13e9fdf76622bd564c18109a2273c1b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - rich >=13.7.1
    - click >=8.1.7
    - typing_extensions >=4.12.2

tests:
  - python:
      imports:
        - rich_toolkit
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/patrick91/rich-toolkit
  summary: Rich toolkit for building command-line applications
  license: MIT
  license_file: LICENSE
  repository: https://github.com/patrick91/rich-toolkit

extra:
  recipe-maintainers:
    - synapticarbors
