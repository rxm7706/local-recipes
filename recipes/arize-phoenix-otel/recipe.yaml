# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.1"

package:
  name: arize-phoenix-otel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arize-phoenix-otel/arize_phoenix_otel-${{ version }}.tar.gz
  sha256: 63baec1128a036895dd49fa50222b9deac2cdeababbcca3d0f1f9b96e615fd6b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation >=0.1.38
    - openinference-semantic-conventions >=0.1.17
    - opentelemetry-exporter-otlp
    - opentelemetry-proto >=1.12.0
    - opentelemetry-sdk
    - opentelemetry-semantic-conventions
    - typing_extensions <5,>=4.5
    - wrapt

tests:
  - python:
      imports:
        - phoenix.otel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arize-phoenix-otel/
  license: Apache-2.0
  license_file: LICENSE
  summary: LLM Observability
  description: |
    LLM Observability
  repository: https://github.com/Arize-ai/phoenix
  documentation: https://arize.com/docs/phoenix/

extra:
  recipe-maintainers:
    - anticorrelator
    - mikeldking
    - rogerhyang
    - michaelschiff
    - fjcasti1
    - axiomofjoy

