# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: blobfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/blobfile/blobfile-${{ version }}.tar.gz
  sha256: 78514a9265b9aa7d4607042dc77c5e6461ab27036450ad8e1f6ef9a7f29bf958

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69
  run:
    - python >=${{ python_min }}
    - pycryptodomex >=3.8
    - urllib3 >=2
    - lxml >=4.9
    - filelock >=3.0

tests:
  - python:
      imports:
        - blobfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/blobfile/blobfile
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Read GCS, ABS and local paths with the same interface, clone of tensorflow.io.gfile
  description: |
    Read GCS, ABS and local paths with the same interface, clone of tensorflow.io.gfile

extra:
  recipe-maintainers:
    - BastianZim

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: blobfile
  cfe-upstream-registry: pypi
  cfe-upstream-name: blobfile
  cfe-purls:
    - pkg:conda/blobfile@${{ version }}?channel=conda-forge
    - pkg:pypi/blobfile@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/blobfile/blobfile
  cfe-import-names: [blobfile]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/blobfile-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-3.2.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

