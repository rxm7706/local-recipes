# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: ratelim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ratelim/ratelim-${{ version }}.tar.gz
  sha256: 826d32177e11f9a12831901c9fda6679fd5bbea3605910820167088f5acbb11d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - decorator

tests:
  - python:
      imports:
        - ratelim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/themiurgo/ratelim
  license: MIT
  license_file: LICENSE
  summary: Makes it easy to respect rate limits.
  description: |
    Makes it easy to respect rate limits.

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ratelim
  cfe-upstream-registry: pypi
  cfe-upstream-name: ratelim
