    - pkg:pypi/ratelim@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/themiurgo/ratelim
  cfe-import-names: [ratelim]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ratelim-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.6

  cfe-forge-blocker-list:
