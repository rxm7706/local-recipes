# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.13"

package:
  name: pytesseract
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytesseract/pytesseract-${{ version }}.tar.gz
  sha256: 4bf5f880c99406f52a3cfc2633e42d9dc67615e69d8a509d74867d3baddb5db9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.0.4
    - wheel >=0.29.0
  run:
    - python >=${{ python_min }}
    - packaging >=21.3
    - pillow >=8.0.0

tests:
  - python:
      imports:
        - pytesseract
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/madmaze/pytesseract
  license: Apache-2.0
  license_file: LICENSE
  summary: Python-tesseract is a python wrapper for Google's Tesseract-OCR
  description: |
    Python-tesseract is a python wrapper for Google's Tesseract-OCR

extra:
  recipe-maintainers:
    - mxr-conda
    - adbedada
    - agcopenhaver
    - int3l
    - oblute
    - rluria14

