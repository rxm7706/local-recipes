# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: umap-learn
  version: "0.5.12"
  sha256: 6aff02ecac5f2aad9f3c65ee518d7ae93e1a985ae38721fdcffceee4232c33c7

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - setuptools
    - numpy >=1.17
    - numba >=0.51.2
    - scikit-learn >=0.22
    - scipy >=1.3.1
    - tbb >=2019.0
    - pynndescent >=0.5
    - tqdm

tests:
  - python:
      imports:
        - umap
      pip_check: false

about:
  license: BSD-2-Clause
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Uniform Manifold Approximation and Projection
  description: |
    umap-learn provides the UMAP manifold based dimension reduction
    algorithm. The package provides an sklearn compatible interface
    to t-SNE like dimension reduction technique that has better
    runtime performance than t-SNE and often preserves more global
    structure than t-SNE.
  homepage: http://github.com/lmcinnes/umap
  repository: https://github.com/lmcinnes/umap

extra:
  recipe-maintainers:
    - lmcinnes
