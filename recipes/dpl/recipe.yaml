# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: dpl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dpl/dpl-${{ version }}.tar.gz
  sha256: 4b649f0191d470573824ec14b5e2cfba37c021d288b9f09017f566bb7b66cb50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dpl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/duytintruong/dpl
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A library for building readable and concise data pipelines
  description: |
    A library for building readable and concise data pipelines

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dpl
  cfe-upstream-registry: pypi
  cfe-upstream-name: dpl
  cfe-purls:
