# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-handyhelpers
  version: "0.3.33"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_handyhelpers-${{ version }}.tar.gz
  sha256: 493a954509c1837fb35cc3d8450b7b638ae68c300161771f751622e4e12b4308

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - djangorestframework
    - djangorestframework-filters ==1.0.0.dev0
    - drf-dynamic-fields
    - hurry.filesize
    - jinja2
    - markupsafe
    - python-dateutil
    - sqlparse
    - xlwt ==1.3.0

tests:
  - python:
      imports:
        - handyhelpers
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A collection of handy utilities to support django operations
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/davidslusser/django-handyhelpers

extra:
  recipe-maintainers:
    - rxm7706
