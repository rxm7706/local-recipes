# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.4"

package:
  name: python-slugify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-slugify/python-slugify-${{ version }}.tar.gz
  sha256: 59202371d1d05b54a9e7720c5e038f928f45daaffe41dd10822f3907b937c856

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - text-unidecode

tests:
  - python:
      imports:
        - slugify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/un33k/python-slugify
  license: MIT
  license_file: LICENSE
  summary: A Python slugify application that also handles Unicode
  description: |
    A Python slugify application that also handles Unicode

extra:
  recipe-maintainers:
    - proinsias
    - sodre
    - bollwyvl

