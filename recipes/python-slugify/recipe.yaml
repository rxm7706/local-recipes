# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.4"
  PYTHON: PYTHON | default("$PYTHON")
  pytest_args: pytest test.py -vv --cov=slugify --cov-branch --cov-report=term-missing:skip-covered --no-cov-on-fail --cov-fail-under=92

recipe:
  name: python-slugify
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/python-slugify/python-slugify-${{ version }}.tar.gz
    sha256: 59202371d1d05b54a9e7720c5e038f928f45daaffe41dd10822f3907b937c856
  - url: https://raw.githubusercontent.com/un33k/python-slugify/v${{ version }}/test.py
    sha256: 96a2fb00cb9a225c473cd0bcfab01286f16d47b51368a986a250e00a50ddcc92

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - slugify = slugify.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - text-unidecode >=1.3
  run_constraints:
    - slugify <0
    - awesome-slugify <0
    - unidecode >=1.1.1

outputs:
  - package:
      name: python-slugify
  - package:
      name: python-slugify-with-unidecode
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("python-slugify", upper_bound="x.x.x") }}
        - unidecode
    tests:
      - python:
          imports:
            - slugify
          pip_check: true
      - files:
          source:
            - test.py
        requirements:
          run:
            - pip
            - pytest-cov
        script:
          - slugify --help
          - ${{ pytest_args }}

tests:
  - python:
      imports:
        - slugify
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - test.py
    requirements:
      run:
        - pip
        - pytest-cov
        - python ${{ python_min }}
    script:
      - slugify --help
      - ${{ pytest_args }}

about:
  license: MIT
  license_file: LICENSE
  summary: A Python Slugify application that handles Unicode
  homepage: https://github.com/un33k/python-slugify
  repository: https://github.com/un33k/python-slugify

extra:
  feedstock-name: python-slugify
  recipe-maintainers:
    - proinsias
    - sodre
    - bollwyvl
