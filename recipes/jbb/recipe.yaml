# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: jbb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jbb/jbb-${{ version }}.tar.gz
  sha256: e930fca84a2126204c94b578e289de3c278d24b18bf34dc3eb7015b4f56897b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jbb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/genotrance/jbb
  license: MIT
  license_file: LICENSE
  summary: Download prebuilt libraries from Binary Builder
  description: |
    Download prebuilt libraries from Binary Builder
  repository: https://github.com/genotrance/jbb

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jbb
  cfe-upstream-registry: pypi
  cfe-upstream-name: jbb
