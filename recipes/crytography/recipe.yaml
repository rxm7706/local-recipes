schema_version: 1

context:
  version: "1.0.0"

package:
  name: crytography
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/crytography/crytography-${{ version }}.tar.gz
  sha256: 557311bf558b3be38dae79de7cebe27f6217ccdbd654085e44c688bb72339766

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - crytography
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/crytography/
  license: MIT
  license_file: LICENSE
  summary: I think you meant "cryptography"
  description: |
    I think you meant "cryptography"

extra:
  recipe-maintainers:
    - rxm7706

