# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: uritemplate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uritemplate/uritemplate-${{ version }}.tar.gz
  sha256: 480c2ed180878955863323eea31b0ede668795de182617fef9c6ca09e6ec9d0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uritemplate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uritemplate.readthedocs.org
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Implementation of RFC 6570 URI Templates
  description: |
    Implementation of RFC 6570 URI Templates
  repository: https://github.com/python-hyper/uritemplate

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: uritemplate
  cfe-upstream-registry: pypi
  cfe-upstream-name: uritemplate
  cfe-purls:
    - pkg:conda/uritemplate@${{ version }}?channel=conda-forge
    - pkg:pypi/uritemplate@${{ version }}
  cfe-upstream-repo: https://github.com/python-hyper/uritemplate
  cfe-upstream-homepage: https://uritemplate.readthedocs.org
  cfe-import-names: [uritemplate]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/uritemplate-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-4.2.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T07:02:22Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T07:02:22Z
  cfe-local-build-status: failed
  cfe-local-build-datetime: 2026-08-18T07:02:22Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
