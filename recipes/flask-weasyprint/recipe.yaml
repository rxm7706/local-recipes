# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: flask-weasyprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-weasyprint/flask_weasyprint-${{ version }}.tar.gz
  sha256: fc20a4fb5a18f311c98772a0b6c8428df345b15cdb2b356dff24962a4328287d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - flask >=2.3.0
    - weasyprint >=68.0

tests:
  - python:
      imports:
        - flask_weasyprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://doc.courtbouillon.org/flask-weasyprint/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Make PDF in your Flask app with WeasyPrint
  description: |
    Make PDF in your Flask app with WeasyPrint
  repository: https://github.com/Kozea/Flask-WeasyPrint
  documentation: https://doc.courtbouillon.org/flask-weasyprint

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
