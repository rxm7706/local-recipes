# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.3"

package:
  name: uritools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uritools/uritools-${{ version }}.tar.gz
  sha256: 3a498e7e85ef3249343d5710618d641a414da0fbae6d23053ada7976ee83ea5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
    - setuptools-scm >=8.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uritools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tkem/uritools/
  license: MIT
  license_file: LICENSE
  summary: URI parsing, classification and composition
  description: |
    URI parsing, classification and composition
  repository: https://github.com/tkem/uritools/
  documentation: https://uritools.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - mgorny

#### CFE metadata AND comments
