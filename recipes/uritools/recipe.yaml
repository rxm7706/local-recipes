# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: uritools
  version: "6.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3a498e7e85ef3249343d5710618d641a414da0fbae6d23053ada7976ee83ea5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=80
    - setuptools-scm >=8.2
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uritools
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
    requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - python -m unittest discover

about:
  license: MIT
  license_file: LICENSE
  summary: RFC 3986 compliant, Unicode-aware, scheme-agnostic replacement for urlparse
  homepage: https://github.com/tkem/uritools/
  repository: https://github.com/tkem/uritools/
  documentation: http://pythonhosted.org/uritools/

extra:
  recipe-maintainers:
    - mgorny
