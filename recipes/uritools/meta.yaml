{% set name = "uritools" %}
{% set version = "6.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3a498e7e85ef3249343d5710618d641a414da0fbae6d23053ada7976ee83ea5f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=80
    - setuptools-scm >=8.2
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - uritools
  commands:
    - pip check
    - python -m unittest discover
  source_files:
    - tests
  requires:
    - python {{ python_min }}
    - pip


about:
  home: https://github.com/tkem/uritools/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: RFC 3986 compliant, Unicode-aware, scheme-agnostic replacement for urlparse
  dev_url: https://github.com/tkem/uritools/
  doc_url: http://pythonhosted.org/uritools/

extra:
  recipe-maintainers:
    - mgorny
