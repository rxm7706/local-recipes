# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: panel-material-ui
  version: "0.14.1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/panel_material_ui-${{ version }}.tar.gz
  sha256: 709827337c39eb6ebc40fbd0297ebb7c8e8e104be11defac5c22e4323d4ccefa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - hatch-vcs
    - panel-core >=1.8.0
    - nodejs >=22
    - esbuild
    - packaging
    - pip
  run:
    - python >=${{ python_min }}
    - panel-core >=1.8.0
    - bokeh >=3.8.0
    - packaging

tests:
  - python:
      imports:
        - panel_material_ui
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An extension to bring MaterialUI components to Panel.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: panel-material-ui.holoviz.org
  repository: https://github.com/panel-extensions/panel-material-ui

extra:
  recipe-maintainers:
    - maximlt
    - philippjfr
    - hoxbro
