# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.2"

package:
  name: panel-material-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panel-material-ui/panel_material_ui-${{ version }}.tar.gz
  sha256: 4b4e9d6f771294d778b6c13ea77348a633d55e48264dfa803f4d8bbd9d5ebf6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - panel >=1.8.0
    - packaging
  run:
    - python >=${{ python_min }}
    - bokeh >=3.8.0
    - packaging
    - panel >=1.8.0

tests:
  - python:
      imports:
        - panel_material_ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/panel-extensions/panel-material-ui
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An extension to bring MaterialUI components to Panel.
  description: |
    An extension to bring MaterialUI components to Panel.
  repository: https://github.com/panel-extensions/panel-material-ui

extra:
  recipe-maintainers:
    - maximlt
    - philippjfr
    - hoxbro

