# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-cloud-run
  version: "0.16.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_run-${{ version }}.tar.gz
  sha256: 568bf7fceba8f844a39b69858a8e642f6cca27eab7246c621d9d341c289b1158

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.17.1,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    # more restrictive constraint for python >=3.13
    - proto-plus >=1.25.0,<2.0.0
    - protobuf >=4.25.8,<8.0.0
    - grpc-google-iam-v1 >=0.14.0,<1.0.0

tests:
  - python:
      imports:
        - google.cloud.run
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Run API client library
  license: Apache-2.0
  license_file: LICENSE
  description: |
    Cloud Run API: is a managed compute platform that enables you to run
    containers that are invocable via requests or events.
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-run
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-run
  documentation: https://googleapis.dev/python/run/latest/index.html

extra:
  recipe-maintainers:
    - xylar
