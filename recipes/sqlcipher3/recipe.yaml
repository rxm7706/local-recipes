# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: sqlcipher3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlcipher3/sqlcipher3-${{ version }}.tar.gz
  sha256: a2b675289ba8889f389625a21f3a01f1ff159a551b5b88fba8fd92da0e02380a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69
    - conan >=2.0
    - wheel
  run:
    - python >=${{ python_min }}
    - sqlcipher3

tests:
  - python:
      imports:
        - sqlcipher3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlcipher3/
  license: MIT
  license_file: LICENSE
  summary: DB-API 2.0 interface for SQLCipher 4.x
  description: |
    DB-API 2.0 interface for SQLCipher 4.x
  repository: https://github.com/coleifer/sqlcipher3

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
