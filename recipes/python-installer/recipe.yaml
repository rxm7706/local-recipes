# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-installer
  pypi_name: installer
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pypi_name[0] }}/${{ pypi_name }}/${{ pypi_name }}-${{ version }}.tar.gz
  sha256: 052c7fc3721d54c696e2dea019be67539d7b144e924f559f54beb3121831c364

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - flit-core >=3.2.0,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - installer
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  summary: A library for installing Python wheels.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pradyunsg/installer

extra:
  recipe-maintainers:
    - xhochy
