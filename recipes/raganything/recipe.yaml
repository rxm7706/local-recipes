# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: raganything
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/raganything/raganything-${{ version }}.tar.gz
  sha256: 65b882a89628b333db94dca5e85c764c88973d7be8bcab72aa1b85d136905d15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - huggingface-hub
    - lightrag-hku
    - mineru
    - tqdm

tests:
  - python:
      imports:
        - raganything
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/HKUDS/RAG-Anything
  license: MIT
  license_file: LICENSE
  summary: "RAGAnything: All-in-One RAG System"
  description: |
    RAGAnything: All-in-One RAG System
  repository: https://github.com/HKUDS/RAG-Anything
  documentation: https://github.com/HKUDS/RAG-Anything

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: raganything
