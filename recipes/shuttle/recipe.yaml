# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8"

package:
  name: shuttle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shuttle/shuttle-${{ version }}.tar.gz
  sha256: 2a83aa5c8d80f96aca8e0259624ecaccb60656123dd13e08bb138022b7f6cf21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - shuttle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/eventbrite/localization_shuttle
  license: MIT
  license_file: LICENSE
  summary: A command-line interface for moving content between help desk and translation systems
  description: |
    A command-line interface for moving content between help desk and translation systems

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
