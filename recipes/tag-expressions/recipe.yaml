# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: tag-expressions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tag-expressions/tag_expressions-${{ version }}.tar.gz
  sha256: 11b4b07c01feb0bdc9196f8239f0c0d9fedc2c6c8a99032c6f2c831b2d772e48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tagexpressions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/timofurrer/tag-expressions
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Built-in functions, types, exceptions, and other objects.
  description: |
    Built-in functions, types, exceptions, and other objects.

extra:
  recipe-maintainers:
    - rxm7706

