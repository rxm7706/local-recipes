# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pysimplegui
  version: "5.0.4"
  styledName: PySimpleGUI

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ styledName }}-${{ version }}.tar.gz
  sha256: a53846e81056c72f7c44451a7bdd720590ca2bc43565cd4f1e9a16ee785d980c

build:
  # License doesn't allow redistribution
  number: 0
  skip: true
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.4
  run:
    - python >=3.4

tests:
  - python:
      imports:
        - PySimpleGUI
      pip_check: false

about:
  license: LGPL-3.0-or-later
  license_file: license.txt
  summary: GUI SDK Launched in 2018 Actively developed and supported. Super-simple to create custom GUI's.  Python 2.7 & 3 Support. 100 Demo programs & Cookbook for rapid start. Extensive documentation. Examples using Machine Learning(GUI, OpenCV Integration,  Chatterbot), Rainmeter Style Floating Desktop Widgets, Matplotlib
    + Pyplot integration, add GUI to command line scripts, PDF & Image Viewer. Great for beginners as well as advanced GUI programmers
  homepage: https://github.com/PySimpleGUI/PySimpleGUI
  repository: https://github.com/PySimpleGUI/PySimpleGUI
  documentation: http://www.pysimplegui.org/

extra:
  recipe-maintainers:
    - mxr-conda
    - agcopenhaver
    - silun
    - rluria14
    - oblute
