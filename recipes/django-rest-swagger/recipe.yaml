# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: django-rest-swagger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-rest-swagger/django-rest-swagger-${{ version }}.tar.gz
  sha256: 48f6aded9937e90ae7cbe9e6c932b9744b8af80cc4e010088b3278c700e0685b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - coreapi
    - openapi-codec
    - djangorestframework
    - simplejson

tests:
  - python:
      imports:
        - rest_framework_swagger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/marcgibbons/django-rest-swagger
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Swagger UI for Django REST Framework 3.5+
  description: |
    Swagger UI for Django REST Framework 3.5+

extra:
  recipe-maintainers:
    - lsetiawan

