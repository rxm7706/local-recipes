# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.11"
  name: jax
  version: "0.10.2"

package:
  name: jax
  version: ${{ version }}

source:
  # Only pull source after PyPI release
  url: https://pypi.org/packages/source/j/jax/jax-${{ version }}.tar.gz
  sha256: bf77428a8c2e6904c4f46d5ab12aa5cfc6cad2179f07f7e4c0fc75ac86ef0639

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.6
    - ml_dtypes >=0.5.0
    - numpy >=2.0
    - opt_einsum
    - scipy >=1.14
    # Change the minimum jaxlib version to _minimum_jaxlib_version in https://github.com/jax-ml/jax/blob/main/jax/version.py
    - jaxlib >=0.10.1,<=0.10.2
  run_constraints:
    - cudnn >=9.8,<10.0

tests:
  - python:
      imports:
        - jax
        - jax._src
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Differentiate, compile, and transform Numpy code
  homepage: https://github.com/jax-ml/jax
  repository: http://github.com/jax-ml/jax

extra:
  recipe-maintainers:
    - ocefpaf
    - ericmjl
    - ngam
    - ehfd
    - conda-forge/jaxlib
