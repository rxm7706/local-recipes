# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.1"
  python_min: "3.12"

package:
  name: jax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jax/jax-${{ version }}.tar.gz
  sha256: 43e0d45b1dac002eca04c2de73298395225dd0d4651e3f573a540eaa18abfd80

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - jaxlib <=0.11.1,>=0.11.1
    - ml-dtypes >=0.5.0
    - numpy >=2.1
    - opt-einsum
    - scipy >=1.15

tests:
  - python:
      imports:
        - jax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jax-ml/jax
  license: Apache-2.0
  license_file: LICENSE
  summary: Differentiate, compile, and transform Numpy code.
  description: |
    Differentiate, compile, and transform Numpy code.

extra:
  recipe-maintainers:
    - ocefpaf
    - ericmjl
    - ngam
    - ehfd
    - conda-forge/jaxlib

#### CFE metadata AND comments
