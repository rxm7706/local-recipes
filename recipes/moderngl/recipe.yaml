# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: moderngl
  version: "5.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/moderngl/moderngl/archive/${{ version }}.tar.gz
  sha256: 7d13354ef4b450fb4f2546eb32f8a3670f05df117467b5df94eaf9296c098832

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - numpy
    - setuptools
    - if: linux
      then: xorg-libx11
    - if: linux
      then: libgl-devel
    - if: linux
      then: xorg-xorgproto
  run:
    - python
    - glcontext

tests:
  - python:
      imports:
        - moderngl
        - moderngl.mgl
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Modern OpenGL binding for python
  homepage: https://github.com/moderngl/moderngl

extra:
  recipe-maintainers:
    - pavelzw
    - cprogrammer1994
    - patricksnape
