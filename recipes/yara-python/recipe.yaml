# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.5.4"

package:
  name: yara-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yara-python/yara_python-${{ version }}.tar.gz
  sha256: 4c682170f3d5cb3a73aa1bd0dc9ab1c0957437b937b7a83ff6d7ffd366415b9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - yara-python

tests:
  - python:
      imports:
        - yara_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/VirusTotal/yara-python
  license: Apache-2.0
  license_file: LICENSE
  summary: Python interface for YARA
  description: |
    Python interface for YARA

extra:
  recipe-maintainers:
    - rxm7706

