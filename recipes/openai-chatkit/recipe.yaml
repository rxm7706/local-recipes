# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.5"

package:
  name: openai-chatkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openai-chatkit/openai_chatkit-${{ version }}.tar.gz
  sha256: 903e9702bf26cd8a2b23d4e7b199b657bee4379758e0ca11ebaee09362d2889e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pydantic
    - uvicorn
    - openai
    - openai-agents >=0.3.2
    - jinja2 <4,>=3.1

tests:
  - python:
      imports:
        - chatkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openai-chatkit/
  license: MIT
  license_file: LICENSE
  summary: A ChatKit backend SDK.
  description: |
    A ChatKit backend SDK.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
