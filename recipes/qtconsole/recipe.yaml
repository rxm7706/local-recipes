# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.7.2"

package:
  name: qtconsole
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qtconsole/qtconsole-${{ version }}.tar.gz
  sha256: 27b485b9161925924c1d8e78e66bb342e6e3bc49bf675d0a67b49bad9c291521

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - traitlets !=5.2.1,!=5.2.2
    - jupyter-core
    - jupyter-client >=4.1
    - pygments
    - ipykernel >=4.1
    - ipython_pygments_lexers
    - qtpy >=2.4.0
    - packaging

tests:
  - python:
      imports:
        - qtconsole
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Qt console
  description: |
    Jupyter Qt console

extra:
  recipe-maintainers:
    - dalthviz
    - Carreau
    - ccordoba12
    - jakirkham
    - minrk
    - takluyver
    - ocefpaf

