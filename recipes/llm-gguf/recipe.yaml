# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: llm-gguf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llm-gguf/llm_gguf-${{ version }}.tar.gz
  sha256: c8fcb07e32bc16c6f597fcd760c1baea88a555ac7b43b3e6651be18067ee27d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx
    - llm
    - llama-cpp-python

tests:
  - python:
      imports:
        - llm_gguf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/simonw/llm-gguf
  license: Apache-2.0
  license_file: LICENSE
  summary: Run models distributed as GGUF files
  description: |
    Run models distributed as GGUF files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
