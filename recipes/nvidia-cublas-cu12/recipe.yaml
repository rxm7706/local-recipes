# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.9.2.10"

package:
  name: nvidia-cublas-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cublas-cu12/nvidia_cublas_cu12-12.9.2.10-py3-none-manylinux_2_27_aarch64.whl
  sha256: 5572131a59c3eebeeb1c4c8144f772d49372c20124916e072a0e3fc30df421d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nvidia-cuda-nvrtc-cu12

tests:
  - python:
      imports:
        - nvidia_cublas_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: LicenseRef-NVIDIA-Proprietary
  license_file: LICENSE
  summary: CUBLAS native runtime libraries
  description: |
    CUBLAS native runtime libraries

extra:
  recipe-maintainers:
    - rxm7706

