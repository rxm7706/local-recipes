# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: anywidget
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anywidget/anywidget-${{ version }}.tar.gz
  sha256: 6695fbef9449cf8c27f421b96c5837aa37f909ec1f60cfa33add333e1b70b169

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6.0
    - psygnal >=0.8.1
    - typing_extensions >=4.2.0

tests:
  - python:
      imports:
        - anywidget
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/manzt/anywidget
  license: MIT
  license_file: LICENSE
  summary: custom jupyter widgets made easy
  description: |
    custom jupyter widgets made easy

extra:
  recipe-maintainers:
    - manzt
    - giswqs

#### CFE metadata AND comments
