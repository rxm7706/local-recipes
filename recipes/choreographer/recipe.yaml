# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  name: choreographer
  version: "1.3.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: 6c44a0e48e9b37977344d40bfa5a9ed88575fe4bc0fd836771bf702bc24d6884

build:
  number: 0
  noarch: python
  script: |
    rm -rf tests && rm -rf results
    ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-git-versioning
  run:
    - python >=${{ python_min }}
    - logistro >=2.0.1
    - platformdirs >=4.3.6
    - simplejson >=3.19.3

tests:
  - python:
      imports:
        - choreographer
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/plotly/choreographer
  license: MIT
  license_file: LICENSE.md
  summary: |
    choreographer allows remote control of browsers from Python.
    It was created to support image generation from browser-based charting tools, but can be used for other purposes as well.
  repository: https://github.com/plotly/choreographer

extra:
  recipe-maintainers:
    - ytausch
