# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.30"

package:
  name: uuid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uuid/uuid-${{ version }}.tar.gz
  sha256: 1f87cc004ac5120466f36c5beae48b4c48cc411968eed0eaecd3da82aa96193f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uuid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://zesty.ca/python/
  license: MIT
  license_file: LICENSE
  summary: UUID object and generation functions (Python 2.3 or higher)
  description: |
    UUID object and generation functions (Python 2.3 or higher)

extra:
  recipe-maintainers:
    - rxm7706

