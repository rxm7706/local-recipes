# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.3"

package:
  name: setuptools-zig
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-zig/setuptools_zig-${{ version }}.tar.gz
  sha256: 95a4ca3946d33370f22e176194713ad0fffb786399a0703d10de840f58c03eb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - distutils

tests:
  - python:
      imports:
        - setuptools_zig
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://sourceforge.net/p/setuptools-zig/code/ref/default/
  license: MIT
  license_file: LICENSE
  summary: A setuptools extension, for building cpython extensions in Zig or C with the Zig compiler
  description: |
    A setuptools extension, for building cpython extensions in Zig or C with the Zig compiler

extra:
  recipe-maintainers:
    - rxm7706

