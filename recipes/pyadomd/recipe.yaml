# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: pyadomd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyadomd/pyadomd-${{ version }}.tar.gz
  sha256: 9b01169c4ce30baedc6d21fa49b1abb2361b9a2953dafed4c0de2f624ddf313c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyadomd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Andboye/Pyadomd
  license: Apache-2.0
  license_file: LICENSE
  summary: A pythonic approach to query SSAS data models
  description: |
    A pythonic approach to query SSAS data models

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
