# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: josepy
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/josepy-${{ version }}.tar.gz
  sha256: 74c033151337c854f83efe5305a291686cef723b4b970c43cfe7270cf4a677a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - jws = josepy.jws:CLI.run

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - poetry-core >=1.0.8
  run:
    - cryptography >=1.5
    - python >=${{ python_min }}
    - setuptools >=1.0

tests:
  - python:
      imports:
        - josepy
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - jws --help

about:
  summary: JOSE protocol implementation in Python
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/certbot/josepy

extra:
  recipe-maintainers:
    - nehaljwani
