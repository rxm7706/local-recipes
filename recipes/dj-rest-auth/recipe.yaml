# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dj-rest-auth
  version: "7.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f77af37da5cf6ee28f03f283a378a2f5761860e72d1d6f2fa3d50e6286000482

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - django >=4.2
    - djangorestframework >=3.13.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dj_rest_auth
        - dj_rest_auth.registration
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Authentication and Registration in Django Rest Framework
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/iMerica/dj-rest-auth
  documentation: https://dj-rest-auth.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - BastianZim
