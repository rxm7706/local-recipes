# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.0.post1"

package:
  name: torch-geometric
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torch-geometric/torch_geometric-${{ version }}.tar.gz
  sha256: 2c0c81666ec10f2132f6b4e0b6c57fc813f2c9f6b57599d7b7a799c614c22fbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12,<4
  run:
    - python >=${{ python_min }}
    - torch
    - aiohttp
    - fsspec
    - jinja2
    - numpy
    - psutil >=5.8.0
    - pyparsing
    - requests
    - tqdm
    - python-xxhash

tests:
  - python:
      imports:
        - torch_geometric
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyg.org
  license: MIT
  license_file: LICENSE
  summary: Graph Neural Network Library for PyTorch
  description: |
    Graph Neural Network Library for PyTorch
  documentation: https://pytorch-geometric.readthedocs.io

extra:
  recipe-maintainers:
    - danielnachun

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: torch-geometric
  cfe-upstream-registry: pypi
  cfe-upstream-name: torch-geometric
