# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# https://github.com/freetype/freetype/blob/master/docs/VERSIONS.TXT
schema_version: 1

context:
  version: "2.14.3"
  so_name: "6.20.6"
  so_name_major: ${{ so_name.split('.')[0] }}

recipe:
  name: freetype-split
  version: ${{ version }}

source:
  url: https://download.savannah.gnu.org/releases/freetype/freetype-${{ version }}.tar.gz
  sha256: e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1

build:
  number: 2

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: win
      then: cmake
    - if: not win
      then: make
    - if: win
      then: ninja
    - pkg-config
    - if: unix
      then: libtool
  host:
    - libpng
    - zlib

outputs:
  # Everything needed to build against libfreetype (scripts in bin are for build config)
  - package:
      name: freetype
    files:
      include:
        - "**/*"
      exclude:
        - if: win
          then: Library/bin/*.dll
        # versioned libs
        - if: osx
          then: lib/lib*.*.dylib
        - if: linux
          then: lib/lib*.so.*
        # static libs
        - if: unix
          then: lib/lib*.a
    build:
      #  https://abi-laboratory.pro/tracker/timeline/freetype/
    requirements:
      host:
        - ${{ pin_subpackage('libfreetype', exact=True) }}
        - ${{ pin_subpackage('libfreetype' ~ so_name_major, exact=True) }}
      run:
        - ${{ pin_subpackage('libfreetype', exact=True) }}
        - ${{ pin_subpackage('libfreetype' ~ so_name_major, exact=True) }}
        # for pkg-config metadata
        - if: win
          then: zlib
      run_exports:
        - ${{ pin_subpackage('libfreetype', upper_bound=None) }}
        - ${{ pin_subpackage('libfreetype' ~ so_name_major, upper_bound=None) }}
    tests:
      - requirements:
          run:
            - pkg-config
        script:
          - if: unix
            then: test -f ${PREFIX}/include/freetype2/freetype/freetype.h
          - if: win
            then: if not exist %LIBRARY_INC%\freetype\freetype.h exit 1
          - if: unix
            then: test -f ${PREFIX}/lib/libfreetype${{ SHLIB_EXT }}
          - if: win
            then: if not exist %LIBRARY_LIB%\freetype.lib exit 1
          - if: unix
            then: test ! -f ${PREFIX}/lib/libfreetype.a
          - if: unix
            then: ${PREFIX}/bin/freetype-config --version
          - if: unix
            then: test -f ${PREFIX}/lib/pkgconfig/freetype2.pc
          - if: win
            then: if not exist %LIBRARY_LIB%\pkgconfig\freetype2.pc exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\cmake\freetype\freetype-config.cmake exit 1
          - pkg-config --print-errors freetype2
  - package:
      name: libfreetype
    requirements:
      run:
        - ${{ pin_subpackage('libfreetype' ~ so_name_major, upper_bound=None) }}
    about:
      license: GPL-2.0-only OR FTL
      summary: The libfreetype runtime library.
      description: >-
        This is a runtime meta-package only. Developers should install freetype to build with libfreetype.

  # Only what's needed for run_exports downstream
  - package:
      name: libfreetype${{ so_name_major }}
    files:
      include:
        - if: win
          then: Library/bin/*.dll
        - if: osx
          then: lib/lib*.*.dylib
        - if: linux
          then: lib/lib*.so.*
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
        - libpng
        - zlib
      run:
      # Pre-split versions of freetype don't know about libfreetypeX, so constrain
      # them from being installed to prevent clobber.
      run_constraints:
        - ${{ pin_subpackage('freetype', lower_bound='2.13.3', upper_bound=None) }}
    tests:
      - script:
          - if: osx
            then: test -f ${PREFIX}/lib/libfreetype.${{ so_name_major }}${{ SHLIB_EXT }}
          - if: linux
            then: test -f ${PREFIX}/lib/libfreetype${{ SHLIB_EXT }}.${{ so_name_major }}
          - if: linux
            then: test -f ${PREFIX}/lib/libfreetype${{ SHLIB_EXT }}.${{ so_name }}
          - if: win
            then: if not exist %LIBRARY_BIN%\freetype.dll exit 1
    about:
      license: GPL-2.0-only OR FTL
      summary: The libfreetype runtime library.
      description: >-
        This is a runtime package only. Developers should install freetype to build with libfreetype.



about:
  license: GPL-2.0-only OR FTL
  license_file:
    - docs/GPLv2.TXT
    - docs/FTL.TXT
  summary: A Free, High-Quality, and Portable Font Engine
  description: >-
    FreeType is designed to be small, efficient, highly customizable and portable while capable of producing high-quality output (glyph images) of most vector and bitmap font formats.
  homepage: https://www.freetype.org/
  repository: http://git.savannah.gnu.org/cgit/freetype/
  documentation: http://freetype.sourceforge.net/freetype2/documentation.html

extra:
  recipe-maintainers:
    - ccordoba12
    - msarahan
    - ocefpaf
    - carterbox
