# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: fastapi-utilities
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-utilities/fastapi_utilities-${{ version }}.tar.gz
  sha256: 2b52e4825f6cc3c546562f9b0b062d48a8b9867de97dd37795a2d2839003f43b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - click-spinner <0.2.0,>=0.1.10
    - croniter <2.0.0,>=1.0.13
    - fastapi
    - pydantic
    - sqlalchemy

tests:
  - python:
      imports:
        - fastapi_utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastapi-utilities/
  license: MIT
  license_file: LICENSE
  summary: Reusable utilities for FastAPI
  description: |
    Reusable utilities for FastAPI

extra:
  recipe-maintainers:
    - rxm7706

