# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2020.7.2"

package:
  name: temp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/temp/temp-${{ version }}.tar.gz
  sha256: aefecf9e4d0d3900fba7fde844dc9dc62918ab66ad4003c8fdddcf3cd0a1edb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - temp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andrewp-as-is/temp.py
  license: Unlicense
  license_file: LICENSE
  summary: temp.tempdir(), temp.tempfile() functions
  description: |
    temp.tempdir(), temp.tempfile() functions

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: temp
