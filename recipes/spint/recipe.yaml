# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: spint
  version: "1.1.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/spint-${{ version }}.tar.gz
  sha256: 33fec949d9ac1bb258dac8599f33cd3e9c70af241938fa49312ec8ac7cf116ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - libpysal >=4.0.0
    - numpy >=1.3
    - scipy >=0.11
    - spglm >=1.0.6
    - spreg

tests:
  - python:
      imports:
        - spint
        - spint.tests
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Efficient calibration of spatial interaction models in Python
  description: |
    The Spatial Interaction Modeling (SpInt) module provides a collection of
    tools to study spatial interaction processes and analyze spatial
    interaction data.
  homepage: http://pysal.org/
  repository: http://github.com/pysal/spint
  documentation: https://spint.readthedocs.io/

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - martinfleis
    - TaylorOshan
    - ocefpaf
