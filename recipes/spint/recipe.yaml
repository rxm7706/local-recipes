# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"
  python_min: "3.12"

package:
  name: spint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spint/spint-${{ version }}.tar.gz
  sha256: 33fec949d9ac1bb258dac8599f33cd3e9c70af241938fa49312ec8ac7cf116ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - libpysal >=4.12
    - numpy >=1.26
    - scipy >=1.12
    - spglm >=1.1
    - spreg >=1.3

tests:
  - python:
      imports:
        - spint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/spint/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: SPatial INTeraction models
  description: |
    SPatial INTeraction models
  repository: https://github.com/pysal/spint

extra:
  recipe-maintainers:
    - jGaboardi
    - knaaptime
    - martinfleis
    - TaylorOshan
    - ocefpaf

