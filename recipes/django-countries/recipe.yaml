# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-countries
  version: "9.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-countries/django_countries-${{ version }}.tar.gz
  sha256: a993416af08a8a4e6e866d56b71c7ce92351c81a2543da213cd7899917567a42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - uv-build >=0.9.6,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - asgiref
    - typing_extensions
    - django >=3.2,<6.0

tests:
  - python:
      imports:
        - django_countries
        - django_countries.graphql
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Provides a country field for Django models.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SmileyChris/django-countries/

extra:
  recipe-maintainers:
    - mxr-conda
    - rxm7706

