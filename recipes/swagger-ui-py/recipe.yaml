# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.7.1"

package:
  name: swagger-ui-py
  version: ${{ version }}

source:
  url: https://github.com/PWZER/swagger-ui-py/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e66b406bea30632aee697725d79ab9a7934e3405af98242d533adadba0d7937c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jinja2 >=2.0
    - packaging >=20.0
    - pyyaml >=5.0

tests:
  - python:
      imports:
        - swagger_ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PWZER/swagger-ui-py
  license: Apache-2.0
  license_file: LICENSE
  summary: Swagger UI for Python web framework, such as Tornado, Flask, Quart, Sanic and Falcon.
  description: |
    Swagger UI for Python web framework, such as Tornado, Flask, Quart, Sanic and Falcon.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
