# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.4"

package:
  name: pylint-venv
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-venv/pylint_venv-${{ version }}.tar.gz
  sha256: 4c71c2ad14fc0549699440bcc460994ffddc1481b9078404b4c43d2806ef0f59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylint_venv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jgosmann/pylint-venv/
  license: MIT
  license_file: LICENSE.txt
  summary: pylint-venv provides a Pylint init-hook to use the same Pylint installation with different virtual environments.
  description: |
    pylint-venv provides a Pylint init-hook to use the same Pylint installation with different virtual environments.
  repository: https://github.com/jgosmann/pylint-venv/

extra:
  recipe-maintainers:
    - ccordoba12
    - mwawra

#### CFE metadata AND comments
