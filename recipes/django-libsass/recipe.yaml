# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9"

package:
  name: django-libsass
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-libsass/django-libsass-${{ version }}.tar.gz
  sha256: bfbbb55a8950bb40fa04dd416605f92da34ad1f303b10a41abc3232386ec27b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=1.8
    - django-compressor >=1.3
    - libsass >=0.7.0

# CFEP-25-justified: Django app; a bare `import django_libsass` raises ImproperlyConfigured
# because compressor.conf reads settings.DEBUG at import. The feedstock's run_test.py
# configures settings and then imports, on python_min and on the newest Python.
tests:
  - files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - python run_test.py
      - pip check
  - files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python
    script:
      - python run_test.py
      - pip check

about:
  license: BSD-3-Clause
  # file not packaged; see https://github.com/torchbox/django-libsass/pull/28
  license_file: LICENSE
  summary: A django-compressor filter to compile SASS files using libsass
  description: |
    A django-compressor filter to compile Sass files using libsass.
  homepage: https://github.com/torchbox/django-libsass
  repository: https://github.com/torchbox/django-libsass
  documentation: https://github.com/torchbox/django-libsass

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - sannykr
    - pb01ka

