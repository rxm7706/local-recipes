# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: streamlit-slickgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-slickgrid/streamlit_slickgrid-${{ version }}.tar.gz
  sha256: 07345a2aece3ce967c0225aaed5c690b3915cf6ff67f77d10529e487bab209f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - python-build
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.40.0

tests:
  - python:
      imports:
        - streamlit_slickgrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/streamlit-slickgrid/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Streamlit component that wraps SlickGrid
  description: |
    A Streamlit component that wraps SlickGrid

extra:
  recipe-maintainers:
    - rxm7706

