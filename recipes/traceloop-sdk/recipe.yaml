# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: traceloop-sdk
  version: "0.61.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/traceloop_sdk-${{ version }}.tar.gz
  sha256: ca96fdfcbf36e5e9770b960a223be62237096f68f887fe2b1b83f15412e05d05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-sdk >=1.38.0,<2.0.0
    - opentelemetry-exporter-otlp-proto-http >=1.38.0,<2.0.0
    - opentelemetry-exporter-otlp-proto-grpc >=1.38.0,<2.0.0
    - opentelemetry-instrumentation-logging >=0.59b0
    - opentelemetry-instrumentation-requests >=0.59b0
    - opentelemetry-instrumentation-sqlalchemy >=0.59b0
    - opentelemetry-instrumentation-urllib3 >=0.59b0
    - opentelemetry-instrumentation-threading >=0.59b0
    - opentelemetry-instrumentation-redis >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - opentelemetry-instrumentation-agno 0.61.0.*
    - opentelemetry-instrumentation-mistralai 0.61.0.*
    - opentelemetry-instrumentation-openai 0.61.0.*
    - opentelemetry-instrumentation-openai-agents 0.61.0.*
    - opentelemetry-instrumentation-ollama 0.61.0.*
    - opentelemetry-instrumentation-anthropic 0.61.0.*
    - opentelemetry-instrumentation-cohere 0.61.0.*
    - opentelemetry-instrumentation-crewai 0.61.0.*
    - opentelemetry-instrumentation-google-generativeai 0.61.0.*
    - opentelemetry-instrumentation-pinecone 0.61.0.*
    - opentelemetry-instrumentation-qdrant 0.61.0.*
    - opentelemetry-instrumentation-langchain 0.61.0.*
    - opentelemetry-instrumentation-lancedb 0.61.0.*
    - opentelemetry-instrumentation-chromadb 0.61.0.*
    - opentelemetry-instrumentation-transformers 0.61.0.*
    - opentelemetry-instrumentation-together 0.61.0.*
    - opentelemetry-instrumentation-llamaindex 0.61.0.*
    - opentelemetry-instrumentation-milvus 0.61.0.*
    - opentelemetry-instrumentation-haystack 0.61.0.*
    - opentelemetry-instrumentation-bedrock 0.61.0.*
    - opentelemetry-instrumentation-sagemaker 0.61.0.*
    - opentelemetry-instrumentation-replicate 0.61.0.*
    - opentelemetry-instrumentation-vertexai 0.61.0.*
    - opentelemetry-instrumentation-watsonx 0.61.0.*
    - opentelemetry-instrumentation-weaviate 0.61.0.*
    - opentelemetry-instrumentation-alephalpha 0.61.0.*
    - opentelemetry-instrumentation-marqo 0.61.0.*
    - opentelemetry-instrumentation-groq 0.61.0.*
    - opentelemetry-instrumentation-mcp 0.61.0.*
    - opentelemetry-instrumentation-writer 0.61.0.*
    - opentelemetry-instrumentation-voyageai 0.61.0.*
    - colorama >=0.4.6,<0.5.0
    - tenacity >=8.2.3,<10
    - pydantic >=1
    - jinja2 >=3.1.5,<4.0.0
    - deprecated >=1.2.14,<2.0.0
    - posthog >3.0.2,<4
    - aiohttp >=3.11.11,<4.0.0
    - cuid >=0.4,<1

tests:
  - python:
      imports:
        - traceloop.sdk
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Traceloop Software Development Kit (SDK) for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
