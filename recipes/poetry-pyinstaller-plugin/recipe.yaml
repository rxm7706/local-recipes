# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.3"

package:
  name: poetry-pyinstaller-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/poetry-pyinstaller-plugin/poetry_pyinstaller_plugin-${{ version }}.tar.gz
  sha256: de56b4602125e86a70c2989f022ddc78ec053c22ab1379c0452e10df7cd7042b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.8.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - poetry

tests:
  - python:
      imports:
        - poetry_pyinstaller_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/poetry-pyinstaller-plugin/
  license: MIT
  license_file: LICENSE
  summary: Poetry plugin to build and/or bundle executable binaries with PyInstaller
  description: |
    Poetry plugin to build and/or bundle executable binaries with PyInstaller

extra:
  recipe-maintainers:
    - rxm7706

