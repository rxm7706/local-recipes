# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: sacrebleu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sacrebleu/sacrebleu-${{ version }}.tar.gz
  sha256: 91499b6cd46138d95154fff1e863c2f9be57e82f0c719d8dd718d0006cf6c566

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - portalocker
    - regex
    - tabulate >=0.8.9
    - numpy >=1.17
    - colorama
    - lxml

tests:
  - python:
      imports:
        - sacrebleu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sacrebleu/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Hassle-free computation of shareable, comparable, and reproducible BLEU, chrF, and TER scores
  description: |
    Hassle-free computation of shareable, comparable, and reproducible BLEU, chrF, and TER scores
  repository: https://github.com/mjpost/sacrebleu

extra:
  recipe-maintainers:
    - hmaarrfk

#### CFE metadata AND comments
