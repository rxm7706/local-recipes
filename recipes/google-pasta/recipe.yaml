    - pkg:pypi/google-pasta@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/google/pasta
  cfe-import-names: [pasta]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/google-pasta-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.0

  cfe-forge-blocker-list:
