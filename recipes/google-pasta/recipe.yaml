# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: google-pasta
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-pasta/google-pasta-${{ version }}.tar.gz
  sha256: c9f2c8dfc8f96d0d5808299920721be30c9eec37f2389f28904f454565c8a16e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - pasta
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/pasta
  license: Apache-2.0
  license_file: LICENSE
  summary: pasta is an AST-based Python refactoring library
  description: |
    pasta is an AST-based Python refactoring library

extra:
  recipe-maintainers:
    - jjhelmus
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: google-pasta
  cfe-upstream-registry: pypi
  cfe-upstream-name: google-pasta
