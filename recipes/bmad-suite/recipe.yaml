# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

# BMAD suite metapackage — one install pulls every channel product at
# upstream-aligned floors. Regenerate run pins with:
#   pixi run -e local-recipes generate-bmad-suite
# Build all members + metapackage locally:
#   pixi run -e local-recipes build-bmad-suite
# Manifest: recipes/bmad-suite/suite-members.yaml

context:
  name: bmad-suite
  # CalVer refresh stamp (unpadded) — bumped by generate-bmad-suite when pins change.
  version: "2026.9.26"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Metapackage — no upstream fetch; local LICENSE only (litellm-proxy pattern).
  - path: .

build:
  number: 0
  noarch: generic

requirements:
  # GENERATED-BEGIN: suite-run-requirements (bmad_suite_metapackage.py — do not edit by hand)
  run:
    - bmad-method >=6.12.0                               # "Build More Architect Dreams" - Agile Ai Driven Development — Turn an idea or change request into working software without giving up the thinking. # https://github.com/bmad-code-org/BMAD-METHOD # https://bmadcode.com/ # https://docs.bmad-method.org/
    - bmad-loop >=0.12.0                                 # Deterministic ralph-loop orchestrator that drives the BMAD implementation phase unattended. # https://github.com/bmad-code-org/bmad-loop # https://github.com/bmad-code-org/bmad-loop#readme
    - bmad-method-test-architecture-enterprise >=1.27.2  # TEA (Murat) — risk-based test strategy, test automation and release-gate decisions. # https://github.com/bmad-code-org/bmad-method-test-architecture-enterprise # https://bmad-code-org.github.io/bmad-method-test-architecture-enterprise/
    - bmad-builder >=2.2.2                               # BMad Core expansion module for creating, sharing and discovering AI modules and agents. # https://github.com/bmad-code-org/bmad-builder # https://bmad-builder-docs.bmad-method.org
    - bmad-creative-intelligence-suite >=0.3.2           # Creative agent suite for innovation, design thinking, storytelling and presentations. # https://github.com/bmad-code-org/bmad-module-creative-intelligence-suite # http://cis-docs.bmad-method.org
    - bmad-module-skill-forge >=2.2.0                    # Turns code and docs into instructions AI agents can actually follow (Quick/Forge/Forge+/Deep tiers). # https://github.com/armelhbobdad/bmad-module-skill-forge
    - bmad-eval-quality >=4.3.0                          # Compiles, seals, preflights and scores Behavioral Evaluation Contracts via a clean-vs-planted-defect twin run. # https://github.com/bmad-code-org/bmad-eval-quality
    - bmad-utility-skills >=2.0.0                        # Utility skills for BMad Method contributors — PR review, triage, changelog, root-cause analysis. # https://github.com/bmad-code-org/bmad-utility-skills
    - bmad-labs-skills >=1.0.0.dev0                      # Community BMAD skills marketplace for Claude Code (22 general-purpose skills). # https://github.com/bmad-labs/skills
    - bmad-module-template >=0.1.0                       # Scaffolding template for authoring a new installable BMad Method module. # https://github.com/bmad-code-org/bmad-module-template
    - bmad-manticore >=3.1.0.dev0                        # AI video-production pipeline packaged as an installable BMad module (15 mc-* skills). # https://github.com/bmad-code-org/bmad-manticore
    - bmad-dashboard >=1.2.2.dev0                        # VS Code extension giving BMad Method V6 projects a live project dashboard. # https://github.com/bmad-code-org/bmad-method-ui # https://github.com/bmad-code-org/bmad-method-ui#readme
    - if: linux or osx
      then:
        - mybmad-dashboard >=0.1.0.dev0                  # Self-hosted web dashboard for BMad Method V6 projects (linux/osx per upstream). # https://github.com/bmad-code-org/bmad-method-ui # https://github.com/bmad-code-org/bmad-method-ui/tree/main/web
  # GENERATED-END: suite-run-requirements

tests:
  - script:
      # Anchor CLIs — one per install class (see install-matrix.md).
      - bmad-loop --version
      - bmad-module-skill-forge --help
      - if: not win
        then:
          - bmad --help
          - bmad-builder-install --help
          - bmad-tea-install --help
        else:
          - bmad.bat --help
          - bmad-builder-install.bat --help
          - bmad-tea-install.bat --help
      - if: linux or osx
        then:
          - mybmad --help

about:
  homepage: https://bmadcode.com/
  repository: https://github.com/bmad-code-org
  documentation: https://docs.bmad-method.org/
  license: MIT
  license_file: LICENSE
  summary: The standard for enterprise grade AI delivery, installing the full BMad Method suite
  description: |
    **BMad Method:** The standard for enterprise-grade AI delivery, the BMad
    Method governs agile AI-driven development across the SDLC, and adapts to
    your regulatory and operational policies.

    This metapackage installs every active member of the suite in one
    transaction, giving you the full skills ecosystem (PRD, architecture,
    test strategy, implementation loop and more). See ``suite-members.yaml``
    for the population; entries marked ``deprecated: true`` are catalogued
    but excluded. Member recipes remain the unit of build and publish, so
    refresh these pins after a member bump.

extra:
  recipe-maintainers:
    - rxm7706
  cfe-conda-name: bmad-suite
  cfe-upstream-registry: none
  cfe-upstream-name: local-recipes/recipes/bmad-suite
  cfe-noarch: generic
  cfe-source-kind: metapackage
  cfe-pip-check: "false:not-a-python-package"
  cfe-on-conda-forge-status: not-applicable
  cfe-on-conda-forge-feedstock: none
