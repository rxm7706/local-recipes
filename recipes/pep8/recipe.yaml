# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pep8
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pep8/pep8-${{ version }}.tar.gz
  sha256: fe249b52e20498e59e0b5c5256aa52ee99fc295b26ec9eaa85776ffdb9fe6374

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - testsuite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://pep8.readthedocs.org/
  license: MIT
  license_file: LICENSE
  summary: Python style guide checker
  description: |
    Python style guide checker

extra:
  recipe-maintainers:
    - jakirkham
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pep8
  cfe-upstream-registry: pypi
  cfe-upstream-name: pep8
  cfe-purls:
    - pkg:conda/pep8@${{ version }}?channel=conda-forge
    - pkg:pypi/pep8@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://pep8.readthedocs.org/
  cfe-import-names: [testsuite]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pep8-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.1

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T02:58:31Z
