# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pep8
  version: "1.7.1"
  bundle: tar.gz
  hash: fe249b52e20498e59e0b5c5256aa52ee99fc295b26ec9eaa85776ffdb9fe6374
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: ${{ build }}
  noarch: python
  script: python setup.py install --single-version-externally-managed --record=record.txt
  python:
    entry_points:
      - pep8 = pep8:_main

requirements:
  build:
    - python
    - setuptools
  run:
    - python

tests:
  - script:
      - pep8 --help
      - pep8 --version

about:
  license: MIT
  summary: Python style guide checker
  homepage: https://pep8.readthedocs.org/
  repository: https://github.com/treyhunner/pep8
  documentation: https://pep8.readthedocs.org/

extra:
  recipe-maintainers:
    - jakirkham
    - pmlandwehr
