# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.6"

package:
  name: cypari
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/c/cypari/cypari-2.5.6-cp310-cp310-macosx_10_9_universal2.whl
  sha256: 99d89f222a66995176b6ad733dbf9abf0f23a0d214a3ae9988357e8ba194e2f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cypari
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/t3m/cypari
  license: GPLv2+
  license_file: LICENSE
  summary: Sage's PARI extension, modified to stand alone.
  description: |
    Sage's PARI extension, modified to stand alone.

extra:
  recipe-maintainers:
    - rxm7706

