# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: mcp-obsidian
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-obsidian/mcp_obsidian-${{ version }}.tar.gz
  sha256: 1a0e8240056fcc3b10e90ab76267bc29a7191048cbaaaeb9eb941aa617ec3cda

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.1.0
    - python-dotenv >=1.0.1
    - requests >=2.32.3

tests:
  - python:
      imports:
        - mcp_obsidian
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcp-obsidian/
  license: MIT
  license_file: LICENSE
  summary: MCP server to work with Obsidian via the remote REST plugin
  description: |
    MCP server to work with Obsidian via the remote REST plugin

extra:
  recipe-maintainers:
    - rxm7706

