# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: langgraph-store-mongodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-store-mongodb/langgraph_store_mongodb-${{ version }}.tar.gz
  sha256: 87d1e809f3b317c55c3106c30922246c1336c335d7ebc37d670e00f810c03ae5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >1.24
  run:
    - python >=${{ python_min }}
    - langchain-mongodb >=0.11.0
    - langgraph-checkpoint >=3.0.0
    - pymongo-search-utils >=0.2.1

tests:
  - python:
      imports:
        - langgraph.store.mongodb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-store-mongodb/
  license: MIT
  license_file: LICENSE
  summary: MongoDB implementation of the LangGraph long-term memory store.
  description: |
    MongoDB implementation of the LangGraph long-term memory store.

extra:
  recipe-maintainers:
    - rxm7706

