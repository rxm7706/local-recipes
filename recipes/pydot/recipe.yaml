# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"

package:
  name: pydot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydot/pydot-${{ version }}.tar.gz
  sha256: c2148f681c4a33e08bf0e26a9e5f8e4099a82e0e2a068098f32ce86577364ad5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.3.2
  run:
    - python >=${{ python_min }}
    - pyparsing >=3.1.0

tests:
  - python:
      imports:
        - pydot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydot/pydot
  license: MIT
  license_file: LICENSE
  summary: Python interface to Graphviz's Dot
  description: |
    Python interface to Graphviz's Dot

extra:
  recipe-maintainers:
    - nehaljwani
    - leycec
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydot
  cfe-upstream-registry: pypi
  cfe-upstream-name: pydot
