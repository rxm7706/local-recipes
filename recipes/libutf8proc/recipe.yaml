# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: libutf8proc
  version: "2.11.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/JuliaStrings/utf8proc/archive/v${{ version }}.tar.gz
  sha256: abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - cmake
    - make
  host:
  run_exports:
    - ${{ pin_subpackage('libutf8proc', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -f "${PREFIX}/include/utf8proc.h"
      - if: unix
        then: test -f "${PREFIX}/lib/libutf8proc${SHLIB_EXT}"
      - if: unix
        then: test ! -f "${PREFIX}/lib/libutf8proc.a"
      - if: win
        then: if not exist "%LIBRARY_INC%\utf8proc.h"    exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\utf8proc.dll"  exit 1
      - if: win
        then: if not exist "%LIBRARY_LIB%\utf8proc.lib"  exit 1
      - if: win
        then: if exist "%LIBRARY_LIB%\utf8proc_static.lib"  exit 1

about:
  license: MIT
  license_file: LICENSE.md
  summary: a clean C library for processing UTF-8 Unicode data
  description: |
    utf8proc is a small, clean C library that provides Unicode normalization,
    case-folding, and other operations for data in the UTF-8 encoding
  homepage: https://juliastrings.github.io/utf8proc/
  repository: https://github.com/JuliaStrings/utf8proc
  documentation: https://juliastrings.github.io/utf8proc/doc/

extra:
  recipe-maintainers:
    - jakirkham
    - mingwandroid
    - nehaljwani
    - xhochy
