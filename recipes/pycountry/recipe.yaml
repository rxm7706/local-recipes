# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.2.16"

package:
  name: pycountry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycountry/pycountry-${{ version }}.tar.gz
  sha256: 5b6027d453fcd6060112b951dd010f01f168b51b4bf8a1f1fc8c95c8d94a0801

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pycountry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pycountry/
  license: LGPL-2.1-only
  license_file: LICENSE.txt
  summary: ISO country, subdivision, language, currency and script definitions and their translations
  description: |
    ISO country, subdivision, language, currency and script definitions and their translations
  repository: https://github.com/pycountry/pycountry

extra:
  recipe-maintainers:
    - CurtLH

