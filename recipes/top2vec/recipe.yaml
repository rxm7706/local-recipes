# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.36"

package:
  name: top2vec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/top2vec/top2vec-${{ version }}.tar.gz
  sha256: a187eff3f5a020bdea98a2717ed7f0602a5765cb4d024b05162e9bc45b791384

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - torch
    - numpy >=1.20.0
    - pandas
    - scikit-learn >=1.2.0
    - gensim >=4.0.0
    - umap-learn >=0.5.1
    - hdbscan >=0.8.27
    - wordcloud
    - transformers
    - tqdm

tests:
  - python:
      imports:
        - top2vec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ddangelov/Top2Vec
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Top2Vec learns jointly embedded topic, document and word vectors.
  description: |
    Top2Vec learns jointly embedded topic, document and word vectors.

extra:
  recipe-maintainers:
    - llperez

#### CFE metadata AND comments
