# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.2"

package:
  name: llama-index-readers-github
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-readers-github/llama_index_readers_github-${{ version }}.tar.gz
  sha256: b65ddde1afdabe9881025146b1e9fcdb57f223a1254c24fa3972d1740f832bc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx >=0.26.0
    - llama-index-core <0.15,>=0.13.0
    - llama-index-embeddings-openai <0.7,>=0.6.0

tests:
  - python:
      imports:
        - llama_index.readers.github
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-readers-github/
  license: MIT
  license_file: LICENSE
  summary: llama-index readers github integration
  description: |
    llama-index readers github integration

extra:
  recipe-maintainers:
    - rxm7706

