# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.6.0.5"

package:
  name: tkinter-qpython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkinter-qpython/tkinter_qpython-${{ version }}.tar.gz
  sha256: 1cddd14a3f6c892db9bf89fb9b4260b44fbc3cfbd02461f583d017da5e4fa601

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - idlelib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://qpypi.qpython.org/project/tkinter-qpython/
  license: Apache-2.0
  license_file: LICENSE
  summary: tkinter — Python interface to Tcl/Tk
  description: |
    tkinter — Python interface to Tcl/Tk

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
