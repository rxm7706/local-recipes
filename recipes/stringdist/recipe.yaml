# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.9"

package:
  name: stringdist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/StringDist/StringDist-${{ version }}.tar.gz
  sha256: 91e6d4a348223db094d029e7e3de9ce89c561738047555dfad60ff5ccb7a5b74

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - stringdist
      pip_check: true

about:
  homepage: https://github.com/obulkin/string-dist
  license: MIT
  license_file: LICENSE
  summary: "This package provides the stringdist module, which includes several functions for calculating string distances."
  description: |
    This package provides the stringdist module, which includes several functions for calculating string distances. Under the hood, a C extension module is preferentially used for optimal performance, with an automatic fallback to a Python implementation.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
