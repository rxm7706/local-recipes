# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: tableau-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tableau-tools/tableau_tools-${{ version }}.tar.gz
  sha256: c06bf5887ab28c140ea3f4bff6196b5c7a9af63dfbeba4c371c269e35c39607b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tableau_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bryanthowell-tableau/tableau_tools
  license: MIT
  license_file: LICENSE
  summary: A library for programmatically working with Tableau files and Tableau Server, including the REST API
  description: |
    A library for programmatically working with Tableau files and Tableau Server, including the REST API

extra:
  recipe-maintainers:
    - rxm7706

