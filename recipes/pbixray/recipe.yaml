# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.4"

package:
  name: pbixray
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pbixray/pbixray-${{ version }}.tar.gz
  sha256: e9d78af2487bc5ee26c9f79e30ac89ebbbdbfe1509a3ee725c937011e4ba05e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - xpress8
    - xpress9
    - xmhuffman >=0.3.0
    - kaitaistruct
    - numpy
    - pandas
    - apsw

tests:
  - python:
      imports:
        - pbixray
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Hugoberry/pbixray
  license: MIT
  license_file: LICENSE
  summary: A Python library to parse and analyze PBIX files used with Microsoft Power BI and Excel PowerPivot.
  description: |
    A Python library to parse and analyze PBIX files used with Microsoft Power BI and Excel PowerPivot.

extra:
  recipe-maintainers:
    - rxm7706

