# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: ragparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ragparser/ragparser-${{ version }}.tar.gz
  sha256: a03c71b6f86269d6f2cced2cbfefd3f05c05b14edc0970564466429e46e12e91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=0.8.0

tests:
  - python:
      imports:
        - ragparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shubham7995/ragparser
  license: MIT
  license_file: LICENSE
  summary: A comprehensive document parser for RAG applications with support for PDF, DOCX, PPTX, XLSX, and more
  description: |
    A comprehensive document parser for RAG applications with support for PDF, DOCX, PPTX, XLSX, and more
  repository: https://github.com/shubham7995/ragparser
  documentation: https://github.com/shubham7995/ragparser#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
