# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.18.0"

package:
  name: fuzzywuzzy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fuzzywuzzy/fuzzywuzzy-${{ version }}.tar.gz
  sha256: 45016e92264780e58972dca1b3d939ac864b78437422beecebb3095f8efd00e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fuzzywuzzy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/seatgeek/fuzzywuzzy
  license: GPLv2
  license_file: LICENSE
  summary: Fuzzy string matching in python
  description: |
    Fuzzy string matching in python

extra:
  recipe-maintainers:
    - josegonzalez
    - synapticarbors
    - hadim

