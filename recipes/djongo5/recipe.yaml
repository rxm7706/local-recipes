# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: djongo5
  version: "1.3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/djongo5-${{ version }}.tar.gz
  sha256: b593931d5b712d90ef7bb42b6b4cbdc404e3db37e665264cbe7e56121474e268

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlparse >=0.2.4
    - pymongo >=3.2.0
    - django >=2.1
    - pytz >=2018.5

tests:
  - python:
      imports:
        - djongo
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Driver for allowing Django 5 to use MongoDB as the database backend.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://www.djongomapper.com/
  repository: https://github.com/minasielemma/djongo5-1.3.10

extra:
  recipe-maintainers:
    - rxm7706
