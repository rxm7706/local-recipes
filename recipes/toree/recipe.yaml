# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: toree
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toree/toree-${{ version }}.tar.gz
  sha256: 53d171abafde7ef627a3087b74e303e502b41b9c22d90020b5b03f398d731ee8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter-client
    - traitlets

tests:
  - python:
      imports:
        - toree
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://toree.incubator.apache.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Jupyter kernel for enabling remote applications to interaction with Apache Spark.
  description: |
    A Jupyter kernel for enabling remote applications to interaction with Apache Spark.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
