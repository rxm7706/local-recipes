# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.4"

package:
  name: flask-email
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Email/Flask-Email-${{ version }}.tar.gz
  sha256: 773f0fb4e13191da43c111a00399cb070a0b978b4047786d5479d5dde0469f6b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_email
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/allanlei/flask-email
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Flask extension for sending email
  description: |
    Flask extension for sending email

extra:
  recipe-maintainers:
    - rxm7706

