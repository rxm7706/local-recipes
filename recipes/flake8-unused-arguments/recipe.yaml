# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flake8-unused-arguments
  version: "0.0.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/flake8-unused-arguments-${{ version }}.tar.gz
  sha256: c5894d294424bf7915e44dff0917222c454151016f96edc55b9f847bf307f3f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - flake8 >3.0.0

tests:
  - python:
      imports:
        - flake8_unused_arguments
      pip_check: true

about:
  summary: flake8 extension to warn on unused function arguments
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/nhoad/flake8-unused-arguments

extra:
  recipe-maintainers:
    - santisoler
