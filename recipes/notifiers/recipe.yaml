# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: notifiers
  version: "1.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/notifiers-${{ version }}.tar.gz
  sha256: 070d69dc34892b0675bdbca8529fb13d542f0c84052c6fef48fe2ab1d98d661f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - notifiers = notifiers_cli.core:entry_point

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }},<4.0
    - click >=8.0.3
    - jsonschema >=4.4.0
    - requests >=2.27.1,<3.0.0
    - importlib-metadata >=3.6

tests:
  - python:
      imports:
        - notifiers
        - notifiers_cli
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - notifiers --help

about:
  summary: The easy way to send notifications
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/notifiers/notifiers

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
    - thewchan
