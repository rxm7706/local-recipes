# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.8.1"

package:
  name: flask-httpauth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-HTTPAuth/flask_httpauth-${{ version }}.tar.gz
  sha256: 88499b22f1353893743c3cd68f2ca561c4ad9ef75cd6bcc7f621161cd0e80744

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_httpauth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miguelgrinberg/flask-httpauth
  license: MIT
  license_file: LICENSE
  summary: HTTP authentication for Flask routes
  description: |
    HTTP authentication for Flask routes

extra:
  recipe-maintainers:
    - synapticarbors

