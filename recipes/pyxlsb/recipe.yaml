# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.10"

package:
  name: pyxlsb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyxlsb/pyxlsb-${{ version }}.tar.gz
  sha256: 8062d1ea8626d3f1980e8b1cfe91a4483747449242ecb61013bc2df85435f685

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyxlsb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/willtrnr/pyxlsb
  license: LGPLv3+
  license_file: LICENSE
  summary: Excel 2007-2010 Binary Workbook (xlsb) parser
  description: |
    Excel 2007-2010 Binary Workbook (xlsb) parser

extra:
  recipe-maintainers:
    - cdesouza21

#### CFE metadata AND comments
