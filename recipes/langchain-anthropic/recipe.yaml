# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-anthropic
  version: "1.5.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_anthropic-${{ version }}.tar.gz
  sha256: 648fdab25573fc9d29543c4b4af1d682b7b6e548d452bb46e67ebc586e195629

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - pydantic >=2.7.4,<3.0.0
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.5.4,<2.0.0
    - anthropic >=0.120.0,<1.0.0

tests:
  - python:
      imports:
        - langchain_anthropic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting AnthropicMessages and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
