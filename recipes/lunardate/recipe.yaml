# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lunardate
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lunardate-${{ version }}.tar.gz
  sha256: ae1daa9140bb1078b2c8e2a5b1623e6f25cf0443eca9ef2d6df27a4644f25fef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lunardate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Chinese Calendar Library in Pure Python
  license: GPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/lidaobing/python-lunardate

extra:
  recipe-maintainers:
    - bletham
    - thewchan
