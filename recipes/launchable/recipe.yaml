# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.124.4"

package:
  name: launchable
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/launchable/launchable-${{ version }}.tar.gz
  sha256: b9608e5ac343ea4b3d5f51cb6ae53cf988ef60c2ab27199095496c2308cbd28a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - click <8.1,>=8.0
    - dataclasses
    - requests >=2.25
    - urllib3 >=1.26
    - junitparser >=4.0.0
    - setuptools
    - more-itertools >=7.1.0
    - python-dateutil
    - tabulate
    - importlib-metadata

tests:
  - python:
      imports:
        - launchable
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://launchableinc.com/
  license: Apache-2.0
  license_file: LICENSE
  summary: Launchable CLI
  description: |
    Launchable CLI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: launchable
