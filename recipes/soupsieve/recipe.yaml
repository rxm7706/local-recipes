# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.2"

package:
  name: soupsieve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soupsieve/soupsieve-${{ version }}.tar.gz
  sha256: 4a55d8cf158a9c2e587fa4922f1bbb91d68ac829e2d6f25403a85747c71daf74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - soupsieve
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/facelessuser/soupsieve
  license: MIT
  license_file: LICENSE
  summary: A modern CSS selector implementation for Beautiful Soup.
  description: |
    A modern CSS selector implementation for Beautiful Soup.

extra:
  recipe-maintainers:
    - MementoRC
    - jschueller

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: soupsieve
  cfe-upstream-registry: pypi
  cfe-upstream-name: soupsieve
  cfe-purls:
    - pkg:conda/soupsieve@${{ version }}?channel=conda-forge
    - pkg:pypi/soupsieve@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/facelessuser/soupsieve
  cfe-import-names: [soupsieve]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/soupsieve-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.9.2

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

