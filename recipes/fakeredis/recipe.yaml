# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.37.0"

package:
  name: fakeredis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fakeredis/fakeredis-${{ version }}.tar.gz
  sha256: 7461f124dcba04a80691d72270b3d1d5cd100ef14dc068c76db825940f3ed799

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - redis-py <7.2
    - sortedcontainers >=2
    - typing_extensions >=4.7

tests:
  - python:
      imports:
        - fakeredis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cunla/fakeredis-py
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python implementation of redis API, can be used for testing purposes.
  description: |
    Python implementation of redis API, can be used for testing purposes.
  repository: https://github.com/cunla/fakeredis-py
  documentation: https://fakeredis.moransoftware.ca/

extra:
  recipe-maintainers:
    - cunla
    - synapticarbors

