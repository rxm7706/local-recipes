# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.annotation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.annotation/zope_annotation-${{ version }}.tar.gz
  sha256: ad44c641811d4a9fdfebd3d6839840032b4b84c4c052cda6911febc981101e53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.component
    - zope.location
    - zope.proxy

tests:
  - python:
      imports:
        - zope.annotation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.annotation
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Object annotation mechanism
  description: |
    Object annotation mechanism

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
