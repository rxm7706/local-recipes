# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"

package:
  name: llama2-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama2-py/llama2_py-${{ version }}.tar.gz
  sha256: 1fcb1440fcf7572d2316ceceb4f8860f97b915b64272a190fe5a40ab2efcecb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - llama2_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama2-py/
  license: MIT
  license_file: LICENSE
  summary: Inference Llama 2 in one file of pure Python
  description: |
    Inference Llama 2 in one file of pure Python

extra:
  recipe-maintainers:
    - rxm7706

