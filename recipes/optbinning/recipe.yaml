# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: optbinning
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/optbinning/optbinning-${{ version }}.tar.gz
  sha256: d608934cbf6fad8be896634d75ebdbc02f887d75c71ef46abbf2daa3b5d5afd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - numpy >=1.16.1
    - ortools <9.12,>=9.4
    - pandas
    - ropwr >=1.0.0
    - scikit-learn >=1.6.0
    - scipy >=1.6.0

tests:
  - python:
      imports:
        - optbinning
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/guillermo-navas-palencia/optbinning
  license: Apache-2.0
  license_file: LICENSE
  summary: "OptBinning: The Python Optimal Binning library"
  description: |
    Optimal binning of a feature, with monotonicity and other shape
    constraints, for scorecard and risk-model workflows.
  repository: https://github.com/guillermo-navas-palencia/optbinning

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: optbinning
  cfe-upstream-registry: pypi
  cfe-upstream-name: optbinning
  cfe-purls:
    - pkg:conda/optbinning@${{ version }}?channel=conda-forge
    - pkg:pypi/optbinning@${{ version }}
  cfe-upstream-repo: https://github.com/guillermo-navas-palencia/optbinning
  cfe-upstream-homepage: https://github.com/guillermo-navas-palencia/optbinning
  cfe-import-names: [optbinning]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: [ortools-not-on-conda-forge]
