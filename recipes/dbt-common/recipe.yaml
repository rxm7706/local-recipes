# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.39.0"

package:
  name: dbt-common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-common/dbt_common-${{ version }}.tar.gz
  sha256: 868256ab2b59328efdd455644172ad17303f3f6a78a015f06667e865e068d620

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - agate <1.10,>=1.7.0
    - colorama <0.5,>=0.3.9
    - dbt-protos <2.0.0,>=1.0.410
    - deepdiff <9.0,>=7.0
    - isodate <0.8,>=0.6
    - jinja2 <4,>=3.1.3
    - jsonschema <5.0,>=4.0
    - mashumaro <4.0,>=3.9
    - opentelemetry-api <3.0,>=1.26
    - pathspec <1.1,>=0.9
    - protobuf <7.0,>=6.0
    - python-dateutil <3.0,>=2.0
    - requests <3.0.0
    - typing_extensions <5.0,>=4.4

tests:
  - python:
      imports:
        - dbt_common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dbt-labs/dbt-common
  license: Apache-2.0
  license_file: LICENSE
  summary: The shared common utilities that dbt-core and adapter implementations use
  description: |
    The shared common utilities that dbt-core and adapter implementations use
  repository: https://github.com/dbt-labs/dbt-common.git

extra:
  recipe-maintainers:
    - zaneselvans
    - conda-forge/dbt
    - rxm7706

#### CFE metadata AND comments
