    - pkg:pypi/humanize@${{ version }}
  cfe-upstream-repo: https://github.com/python-humanize/humanize
  cfe-upstream-homepage: https://github.com/python-humanize/humanize
  cfe-import-names: [humanize]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
