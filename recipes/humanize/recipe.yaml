# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.16.0"

package:
  name: humanize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/humanize/humanize-${{ version }}.tar.gz
  sha256: 7dc2244a2f84a4bfb1d36c37bac80cd78e35cdc5c119206d87b018e1445f3a3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs
    - hatchling >=1.27
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - humanize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-humanize/humanize
  license: MIT
  license_file: LICENSE
  summary: Python humanize utilities
  description: |
    Python humanize utilities
  repository: https://github.com/python-humanize/humanize
  documentation: https://humanize.readthedocs.io/

extra:
  recipe-maintainers:
    - ericdill
    - licode
    - tacaswell
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: humanize
