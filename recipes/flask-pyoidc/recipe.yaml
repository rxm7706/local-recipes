# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.14.3"

package:
  name: flask-pyoidc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-pyoidc/Flask-pyoidc-${{ version }}.tar.gz
  sha256: 4a42589f76733c3968ac5f99595c1525a682754916c34f7c029acee6c8ce3bb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - oic ==1.6.1
    - flask
    - requests
    - importlib_resources

tests:
  - python:
      imports:
        - flask_pyoidc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zamzterz/flask-pyoidc
  license: Apache-2.0
  license_file: LICENSE
  summary: Flask extension for OpenID Connect authentication.
  description: |
    Flask extension for OpenID Connect authentication.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
