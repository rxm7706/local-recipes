# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.exceptions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.exceptions/zope_exceptions-${{ version }}.tar.gz
  sha256: 0ac0e078ecdd8acb5da231c39fc6454bdf3249216fd1c06d0578bf8ea6bf3299

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.exceptions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.exceptions
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Exceptions
  description: |
    Zope Exceptions

extra:
  recipe-maintainers:
    - rxm7706

