# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.9"

package:
  name: txt2tags
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/txt2tags/txt2tags-${{ version }}.tar.gz
  sha256: 7e4244db6a63aaa58fc17fa4cdec62b6fb89cc41d3a00ba4edaffa37f27d6746

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - txt2tags
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://txt2tags.org
  license: GPL2+
  license_file: LICENSE
  summary: Convert between markup languages
  description: |
    Convert between markup languages

extra:
  recipe-maintainers:
    - rxm7706

