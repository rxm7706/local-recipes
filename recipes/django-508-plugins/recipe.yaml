# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.2"

package:
  name: django-508-plugins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-508-plugins/django_508_plugins-${{ version }}.tar.gz
  sha256: 86722e16c01933f5651e623829783363d86194537fc0a114afb0f44937685e94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - plugins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/imsweb/django-508-plugins
  license: MIT
  license_file: LICENSE
  summary: Installable Django app containing 508-compliant plugins.
  description: |
    Installable Django app containing 508-compliant plugins.

extra:
  recipe-maintainers:
    - rxm7706

