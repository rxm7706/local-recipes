# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.21"

package:
  name: vectordb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vectordb/vectordb-${{ version }}.tar.gz
  sha256: 3f4857ed3f26dc2384415f28851526037058008156719ca0cfc208a9a02d88e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jina

tests:
  - python:
      imports:
        - vectordb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jina-ai/vectordb/
  license: Apache-2.0
  license_file: LICENSE
  summary: The Python VectorDB. Build your vector database from working as a library to scaling as a database in the cloud
  description: |
    The Python VectorDB. Build your vector database from working as a library to scaling as a database in the cloud

extra:
  recipe-maintainers:
    - rxm7706

