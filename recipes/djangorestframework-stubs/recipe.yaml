# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.18.0"

package:
  name: djangorestframework-stubs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework-stubs/djangorestframework_stubs-${{ version }}.tar.gz
  sha256: 072adaf1a6f507e2ccca2e4ba5611a2259d6c9d171eb6256c103acecdd33a40d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.0,<0.13.0
  run:
    - python >=${{ python_min }}
    - django-stubs >=6.0.9
    - typing_extensions >=4.0
    - types-pyyaml

tests:
  - python:
      imports:
        - mypy_drf_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/typeddjango/djangorestframework-stubs
  license: MIT
  license_file: LICENSE.txt
  summary: PEP-484 stubs for django-rest-framework
  description: |
    PEP-484 stubs for django-rest-framework

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
