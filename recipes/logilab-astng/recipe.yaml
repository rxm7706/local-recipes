# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.3"

package:
  name: logilab-astng
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logilab-astng/logilab-astng-${{ version }}.tar.gz
  sha256: e08fba39689e5a4dfa175749874811e516f019656544874defe05154073f69d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logilab_astng
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.logilab.org/project/logilab-astng
  license: MIT
  license_file: LICENSE
  summary: rebuild a new abstract syntax tree from Python's ast
  description: |
    rebuild a new abstract syntax tree from Python's ast

extra:
  recipe-maintainers:
    - rxm7706

