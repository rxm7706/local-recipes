    - pkg:pypi/django-revproxy@${{ version }}
  cfe-upstream-repo: https://github.com/jazzband/django-revproxy
  cfe-upstream-homepage: https://github.com/jazzband/django-revproxy
  cfe-import-names: [revproxy]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
