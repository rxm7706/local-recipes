# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.6.1"

package:
  name: pip-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-tools/pip_tools-${{ version }}.tar.gz
  sha256: 695556edeb647eb94ee8345cc7108657fdb7fb16b3876623a399b4f61bbede01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - python-build >=1.0.0
    - click >=8
    - pip >=22.2
    - pyproject_hooks
    - typing_extensions >=4.6.0
    - tomli
    - setuptools
    - wheel

tests:
  - python:
      imports:
        - piptools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jazzband/pip-tools/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pip-tools keeps your pinned dependencies fresh.
  description: |
    pip-tools keeps your pinned dependencies fresh.
  documentation: https://pip-tools.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - marcelotrevisani

