# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.4"

package:
  name: restrictedpython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/RestrictedPython/restrictedpython-${{ version }}.tar.gz
  sha256: 68e463c22396fd94606043795ac7dbee05072725f38d0db7e1748da3f54fb274

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<82
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - RestrictedPython
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/RestrictedPython/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: RestrictedPython is a defined subset of the Python language which allows to provide a program input into a trusted environment.
  description: |
    RestrictedPython is a defined subset of the Python language which allows to provide a program input into a trusted environment.
  repository: https://github.com/zopefoundation/RestrictedPython
  documentation: https://restrictedpython.readthedocs.io/

extra:
  recipe-maintainers:
    - BubblyOrca
    - mxr-conda
    - mgorny

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: restrictedpython
  cfe-upstream-registry: pypi
  cfe-upstream-name: restrictedpython
  cfe-purls:
    - pkg:conda/restrictedpython@${{ version }}?channel=conda-forge
    - pkg:pypi/restrictedpython@${{ version }}
  cfe-upstream-repo: https://github.com/zopefoundation/RestrictedPython
  cfe-upstream-homepage: https://pypi.org/project/RestrictedPython/
  cfe-import-names: [RestrictedPython]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/restrictedpython-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
