# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.21.0"

package:
  name: tensorboard
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/tensorboard/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6cf2193326759e9cefe5ef772c935e5b8f15a79093033cddff7e785b30f5bfd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py >=0.4
    - grpcio <2.0,>=1.74.0
    - markdown >=2.6.8
    - numpy >=1.12.0
    - packaging
    - pillow
    - protobuf <8.0.0,>=6.31.1
    - setuptools >=41.0.0
    - tensorboard-data-server <0.8.0,>=0.7.0
    - werkzeug >=1.0.1

tests:
  - python:
      imports:
        - rustboard_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tensorflow/tensorboard
  license: Apache-2.0
  license_file: LICENSE
  summary: TensorBoard lets you watch Tensors Flow
  description: |
    TensorBoard lets you watch Tensors Flow

extra:
  recipe-maintainers:
    - sdvillal
    - gilbertfrancois
    - farhantejani
    - mdraw
    - jschueller
    - xhochy
    - ngam
    - conda-forge/tensorflow

#### CFE metadata AND comments
