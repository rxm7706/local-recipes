schema_version: 1

context:
  name: opentelemetry-instrumentation-aiopg
  version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-aiopg/opentelemetry_instrumentation_aiopg-${{ version }}.tar.gz
  sha256: 9a0935a673dcd43ed1d0639d439581d334454d3403b496190408e0bc2547c178

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

