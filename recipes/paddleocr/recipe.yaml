# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.0"

package:
  name: paddleocr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/paddleocr/paddleocr-${{ version }}.tar.gz
  sha256: 9b81eb62cf37e590d4873e60262ff56f968ff9de6ce1f565749760ceb1c422e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - paddlex <3.8.0,>=3.7.0
    - pyyaml >=6
    - requests
    - aiohttp >=3.8.0
    - typing_extensions >=4.12

tests:
  - python:
      imports:
        - ppocr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PaddlePaddle/PaddleOCR
  license: Apache-2.0
  license_file: LICENSE
  summary: Awesome multilingual OCR and document parsing toolkits based on PaddlePaddle
  description: |
    Awesome multilingual OCR and document parsing toolkits based on PaddlePaddle
  documentation: https://github.com/PaddlePaddle/PaddleOCR/blob/main/README.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: paddleocr
