# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.12.0"

package:
  name: oslo.privsep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.privsep/oslo_privsep-${{ version }}.tar.gz
  sha256: 166edcd4a3e982f4ea851308df6408bc6ad5323fbdd83ad6b2a79faed50b9617

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - oslo.log >=5.0.2
    - oslo.i18n >=3.15.3
    - oslo.config >=5.2.0
    - oslo.utils >=3.33.0
    - cffi >=1.14.0
    - msgpack >=0.6.0
    - debtcollector >=3.0.0

tests:
  - python:
      imports:
        - oslo_privsep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.privsep
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenStack library for privilege separation
  description: |
    OpenStack library for privilege separation
  repository: https://opendev.org/openstack/oslo.privsep

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
