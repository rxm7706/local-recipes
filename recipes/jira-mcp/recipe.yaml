# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"
  python_min: "3.12"

package:
  name: jira-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jira-mcp/jira_mcp-${{ version }}.tar.gz
  sha256: 2e71f8b2040642685e66cedde33bd88376015f8c2d831542093be6dbc0020621

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dotenv >=0.9.9
    - mcp >=1.6.0

tests:
  - python:
      imports:
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jira-mcp/
  license: MIT
  license_file: LICENSE
  summary: Add your description here
  description: |
    Add your description here

extra:
  recipe-maintainers:
    - rxm7706

