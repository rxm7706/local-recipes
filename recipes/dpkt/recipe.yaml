# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dpkt
  version: "1.9.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 43f8686e455da5052835fd1eda2689d51de3670aac9799b1b00cfd203927ee45

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dpkt
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: fast, simple packet creation / parsing, with definitions for the basic TCP/IP protocols
  description: |
    dpkt is a simple packet creation / parsing, with definitions for the basic TCP/IP protocols
    and is implemented in pure python
  homepage: http://github.com/kbandla/dpkt
  repository: http://github.com/kbandla/dpkt
  documentation: https://dpkt.readthedocs.io

extra:
  recipe-maintainers:
    - kylekeppler
