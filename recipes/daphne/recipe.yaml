# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: daphne
  version: "4.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1c458f81926b37301cadc8ec1b6316d9a5db53fba061fc4826610395fe5d5c81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - daphne = daphne.cli:CommandLineInterface.entrypoint

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
    - pytest-runner
  run:
    - asgiref >=3.5.2,<4
    - autobahn >=22.4.2
    - python >=${{ python_min }}
    - twisted >=22.4
    # twisted[tls] extra dependencies
    - pyopenssl >=16
    - service_identity >=18.1
    - idna >=2.4

tests:
  - python:
      imports:
        - daphne
        - twisted.plugins
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - daphne --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django ASGI (HTTP/WebSocket) server
  homepage: https://github.com/django/daphne
  repository: https://github.com/django/daphne

extra:
  recipe-maintainers:
    - chrisbarber
    - swainn
