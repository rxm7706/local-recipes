# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.3"

package:
  name: daphne
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/daphne/daphne-${{ version }}.tar.gz
  sha256: 1c458f81926b37301cadc8ec1b6316d9a5db53fba061fc4826610395fe5d5c81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - asgiref <4,>=3.5.2
    - autobahn >=22.4.2
    - twisted >=22.4

tests:
  - python:
      imports:
        - daphne
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django/daphne
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django ASGI (HTTP/WebSocket) server
  description: |
    Django ASGI (HTTP/WebSocket) server
  documentation: https://channels.readthedocs.io

extra:
  recipe-maintainers:
    - chrisbarber
    - swainn

#### CFE metadata AND comments
