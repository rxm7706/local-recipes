# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.43.0"

package:
  name: rtk
  version: ${{ version }}

source:
  url: https://github.com/rtk-ai/rtk/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 196bec9e9b438f0b8cd0198f68e05f072ccdfdec2c2655a3562d6ea357fa485b

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install --locked --root $PREFIX --path .
    - rm $PREFIX/.crates.toml $PREFIX/.crates2.json

requirements:
  build:
    - ${{ compiler("rust") }}
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses

tests:
  - script:
      - rtk --help

about:
  summary: Rust Token Killer - CLI proxy that cuts LLM token consumption by 60-90% on common dev commands
  description: |
    rtk (Rust Token Killer) is a high-performance CLI proxy that minimizes
    LLM token consumption: prefix common dev commands (git, ls, cat, grep,
    test runners, ...) with ``rtk`` and it filters, deduplicates, and
    compacts their output before it reaches the model context — 60-90%
    fewer tokens on typical workflows. Single self-contained binary with a
    built-in gain-tracking database.
  homepage: https://www.rtk-ai.app
  repository: https://github.com/rtk-ai/rtk
  documentation: https://github.com/rtk-ai/rtk#readme
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rtk
  cfe-upstream-registry: github
  cfe-upstream-name: rtk-ai/rtk
  cfe-purls:
    - pkg:conda/rtk@${{ version }}?channel=conda-forge
    - pkg:github/rtk-ai/rtk@v${{ version }}
  cfe-upstream-repo: https://github.com/rtk-ai/rtk
  cfe-upstream-homepage: https://www.rtk-ai.app
  cfe-import-names: []
  cfe-source-kind: github-tag
  cfe-noarch: compiled
  cfe-pip-check: "false:not-a-python-package"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: "2026-07-12T16:20:00Z"
