# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: slackify-markdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/slackify-markdown/slackify_markdown-${{ version }}.tar.gz
  sha256: 90b57c0a4ef81306c2208573ab4d3afc945797eed0dd04c4876b4a0ca7222619

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - markdown-it-py >=3.0.0

tests:
  - python:
      imports:
        - slackify_markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thesmallstar/slackify-markdown-python
  license: MIT
  license_file: LICENSE
  summary: Convert markdown to Slack-compatible formatting
  description: |
    Convert markdown to Slack-compatible formatting
  documentation: https://github.com/thesmallstar/slackify-markdown-python#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: slackify-markdown
