{% set version = "4.0.2" %}

package:
  name: flit
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/flit/flit-{{ version }}.tar.gz
  sha256: 232bc4317279e8952eca9fb3f5e000d8395d693b39c105b99f619ce461e1da85
  folder: source

build:
  script: cd source/ && FLIT_ROOT_INSTALL=1 python -m flit install --deps=none
  noarch: python
  entry_points:
    - flit = flit:main
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - docutils
    - requests
    - tomli-w
    - flit-core {{ version }}
  run:
    - python >={{ python_min }}
    - pip
    - docutils
    - requests
    - tomli-w
    - flit-core {{ version }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - flit
  commands:
    - flit --version

about:
  home: https://flit.pypa.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: source/LICENSE
  summary: Simplified packaging of Python modules

extra:
  recipe-maintainers:
    - Carreau
    - minrk
    - takluyver
    - ocefpaf
