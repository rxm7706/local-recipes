# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "223"

package:
  name: pypiwin32
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypiwin32/pypiwin32-${{ version }}.tar.gz
  sha256: 71be40c1fbd28594214ecaecb58e7aa8b708eabfa0125c8a109ebd51edbd776a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pywin32

tests:
  - python:
      imports:
        - pypiwin32
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pypiwin32/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

