# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: json-toon-converter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-toon-converter/json_toon_converter-${{ version }}.tar.gz
  sha256: 7d1f648a5ee44cf632584778da9398c83026c85ec5bf6a1438e4dcc683b776b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - toon-python

tests:
  - python:
      imports:
        - json_to_toon_converter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/OrenGrinker/json-toon-converter
  license: MIT
  license_file: LICENSE
  summary: A package to convert JSON to TOON and TOON to JSON
  description: |
    A package to convert JSON to TOON and TOON to JSON

extra:
  recipe-maintainers:
    - rxm7706

