# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: ssladapter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/ssladapter/ssladapter-${{ version }}.tar.gz
  sha256: 87db7949717ef8844428e92dfb63327d44078054de8d2618e0f63665d9b40ad0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests ==2.27.1

tests:
  - python:
      imports:
        - ssladapter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lorenzofabro/ssladapter
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: SSL Adapter for requests library
  description: |
    SSL Adapter for requests library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
