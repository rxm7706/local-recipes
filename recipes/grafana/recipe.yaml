# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: grafana
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grafana/grafana-${{ version }}.tar.gz
  sha256: a6ad951495bb03f628c849eda3aeb9bfd29870c9fbe179f4cb2dfaea3218ac8a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - grafana
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wix
  license: MIT
  license_file: LICENSE
  summary: grafana
  description: |
    grafana

extra:
  recipe-maintainers:
    - rxm7706

