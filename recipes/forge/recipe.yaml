# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: forge
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/forge/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fb221afbe54cbd8dcfbe5a476df0b6aa93bea83e23455ac8eaca3b7b0eedd33c

build:
  number: 0
  script:
    - if: win
      then: call "%RECIPE_DIR%/build.bat"
      else: bash "${RECIPE_DIR}/build.sh"

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - forge version | grep -Fx "forge ${{ version }}"
      - forge --help
  - package_contents:
      bin:
        - if: unix
          then: forge
        - if: win
          then: forge.exe

about:
  homepage: https://github.com/git-pkgs/forge
  repository: https://github.com/git-pkgs/forge
  documentation: https://github.com/git-pkgs/forge
  summary: Unified CLI for GitHub, GitLab, Gitea/Forgejo, and Bitbucket Cloud
  description: |
    forge is a Go CLI and library that talks to GitHub, GitLab, Gitea/Forgejo,
    and Bitbucket Cloud through one interface. Packaged here for local PyForge
    consumption (Warden intake tooling); not yet on conda-forge.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: forge
  cfe-upstream-registry: golang
  cfe-upstream-name: github.com/git-pkgs/forge
  cfe-purls:
    - pkg:conda/forge@${{ version }}?channel=conda-forge
    - pkg:golang/github.com/git-pkgs/forge@${{ version }}
  cfe-upstream-repo: https://github.com/git-pkgs/forge
  cfe-upstream-homepage: https://github.com/git-pkgs/forge
  cfe-import-names: []
  cfe-source-kind: github-tag
  cfe-noarch: compiled
  cfe-pip-check: "false:not-a-python-package"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
