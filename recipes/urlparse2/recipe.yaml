# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: urlparse2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urlparse2/urlparse2-${{ version }}.tar.gz
  sha256: e6bf5115bf3a32318d7fbb25d53e2e6eefcaa7b5a720a34d0bbc57618b4819fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - urlparse2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mwhooker/urlparse2
  license: MIT
  license_file: LICENSE
  summary: urlparse for humans.
  description: |
    urlparse for humans.

extra:
  recipe-maintainers:
    - rxm7706

