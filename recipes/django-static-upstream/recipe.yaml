# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: django-static-upstream
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-static-upstream/django-static-upstream-${{ version }}.tar.gz
  sha256: d8eb691af0103aaace392b9abb6f0e756faecb155ad2e0252a5067a3bcc11429

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - supstream
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yaniv-aknin/supstream
  license: MIT
  license_file: LICENSE
  summary: Django package to handle (serve, reference, compile) static files
  description: |
    Django package to handle (serve, reference, compile) static files

extra:
  recipe-maintainers:
    - rxm7706

