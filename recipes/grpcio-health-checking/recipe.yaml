# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.83.0"

package:
  name: grpcio-health-checking
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpcio-health-checking/grpcio_health_checking-${{ version }}.tar.gz
  sha256: ad6bc4d5a1103ad704d25ccd82def300dfa27996b185cab3e4cceeef2c6867d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.1
    - wheel
  run:
    - python >=${{ python_min }}
    - protobuf <8.0.0,>=7.35.1
    - grpcio >=1.83.0

tests:
  - python:
      imports:
        - grpc_health
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: Standard Health Checking Service for gRPC
  description: |
    Standard Health Checking Service for gRPC
  documentation: https://grpc.github.io/grpc/python/grpc_health_checking.html

extra:
  recipe-maintainers:
    - bollwyvl

