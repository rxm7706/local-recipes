    - pkg:pypi/email@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/email/
  cfe-upstream-homepage: https://pypi.org/project/email/
  cfe-import-names: [email]
  cfe-source-kind: pypi-sdist
