# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.5.1"

package:
  name: jupyterhub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterhub/jupyterhub-${{ version }}.tar.gz
  sha256: 07f2e4a891cd767203b66b00a8f113d7033ddfc109aaa0ee43e70ae24f72659e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - alembic >=1.4
    - async_generator >=1.9
    - certipy >=0.1.2
    - idna
    - importlib-metadata >=3.6
    - jinja2 >=2.11.0
    - jupyter-events
    - oauthlib >=3.0
    - packaging
    - prometheus_client >=0.5.0
    - pydantic >=2
    - python-dateutil
    - requests
    - sqlalchemy >=1.4.1
    - tornado >=5.1
    - traitlets >=4.3.2
    - if: win
      then:
        - psutil

tests:
  - python:
      imports:
        - jupyterhub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://hub.jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "JupyterHub: A multi-user server for Jupyter notebooks"
  description: |
    JupyterHub: A multi-user server for Jupyter notebooks
  repository: https://github.com/jupyterhub/jupyterhub
  documentation: https://jupyterhub.readthedocs.io

extra:
  recipe-maintainers:
    - minrk
    - blink1073
    - consideRatio
    - manics
    - bollwyvl

