# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: hf-gradio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hf-gradio/hf_gradio-${{ version }}.tar.gz
  sha256: a017d942618f0d495a58ee4563047fa04bef614c00e0cb789a9a6d0633cffa7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - gradio-client <3.0,>=2.0
    - typer

tests:
  - python:
      imports:
        - hf_gradio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gradio-app/hf-gradio#
  license: MIT
  license_file: LICENSE
  summary: An extension of the Hugging Face CLI for interacting with Gradio Spaces and Apps.
  description: |
    An extension of the Hugging Face CLI for interacting with Gradio Spaces and Apps.

extra:
  recipe-maintainers:
    - flferretti
    - freddyaboulton

