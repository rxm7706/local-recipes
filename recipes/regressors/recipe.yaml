# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: regressors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/regressors/regressors-${{ version }}.tar.gz
  sha256: 857bcc92c71b62ca4c20adaae9b3c3ec38c6805cc72c2fad7148ca25d3309ae1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - regressors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nsh87/regressors
  license: ISCL
  license_file: LICENSE
  summary: Easy utilities for fitting various regressors, extracting stats, and making relevant plots
  description: |
    Easy utilities for fitting various regressors, extracting stats, and making relevant plots

extra:
  recipe-maintainers:
    - rxm7706

