# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: pix2tex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pix2tex/pix2tex-0.1.4-py3-none-any.whl
  sha256: a024309508fc3e8a4ce5241e095276626d098df53e609410013f2ec35a4b7612

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm >=4.47.0
    - munch >=2.5.0
    - pytorch >=1.7.1
    - opencv >=4.1.1.26
    - requests >=2.22.0
    - einops >=0.3.0
    - x-transformers ==0.15.0
    - transformers >=4.18.0
    - tokenizers >=0.13.0
    - numpy >=1.19.5
    - pillow >=9.1.0
    - pyyaml >=5.4.1
    - pandas >=1.0.0
    - timm ==0.5.4
    - albumentations <=1.4.24,>=0.5.2

tests:
  - python:
      imports:
        - pix2tex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lukas-blecher/LaTeX-OCR/
  license: MIT
  license_file: LICENSE
  summary: "pix2tex: Using a ViT to convert images of equations into LaTeX code."
  description: |
    pix2tex: Using a ViT to convert images of equations into LaTeX code.

extra:
  recipe-maintainers:
    - rxm7706

