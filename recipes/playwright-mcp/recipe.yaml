# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: playwright-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/playwright-mcp/playwright_mcp-${{ version }}.tar.gz
  sha256: 82dd9272399f0163db6c7e8768d9cda63163f0850f63fca3f934cf98b1d97212

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - mcp >=1.3.0
    - playwright >=1.50.0

tests:
  - python:
      imports:
        - playwright_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/playwright-mcp/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Playwright wrapper for MCP
  description: |
    Playwright wrapper for MCP

extra:
  recipe-maintainers:
    - rxm7706

