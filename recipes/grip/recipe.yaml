# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: grip
  version: "4.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3cf6dce0aa06edd663176914069af83f19dcb90f3a9c401271acfa71872f8ce3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - grip = grip:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - docopt >=0.4.0
    - Flask >=0.10.1
    - Markdown >=2.5.1
    - path-and-address >=2.0.1
    - Pygments >=1.6
    - requests >=2.4.1
    - werkzeug >=0.7

tests:
  - python:
      imports:
        - grip
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - grip -h

about:
  license: MIT
  license_file: LICENSE
  summary: Preview GitHub Markdown files like Readme locally before committing them.
  description: |
    Grip is a command-line server application written in Python that uses the GitHub markdown API
    to render a local readme file. The styles come directly from GitHub, so you'll know exactly
    how it will appear. Changes you make to the Readme will be instantly reflected in the browser
    without requiring a page refresh.
  homepage: https://github.com/joeyespo/grip
  repository: https://github.com/joeyespo/grip

extra:
  recipe-maintainers:
    - synapticarbors
