# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: pytest-env
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-env/pytest_env-${{ version }}.tar.gz
  sha256: 0c1dc1101fb8d3ab3611e8f8d657ba06c3c0c167fc85c90457e5b27f2508f43e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.5
    - hatchling >=1.29
  run:
    - python >=${{ python_min }}
    - pytest >=9.0.2
    - python-dotenv >=1.2.2
    - tomli >=2.4

tests:
  - python:
      imports:
        - pytest_env
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-env
  license: MIT
  license_file: LICENSE
  summary: pytest plugin that allows you to add environment variables.
  description: |
    pytest plugin that allows you to add environment variables.
  repository: https://github.com/pytest-dev/pytest-env

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
