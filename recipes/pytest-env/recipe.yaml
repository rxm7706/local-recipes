# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-env
  version: "1.7.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0c1dc1101fb8d3ab3611e8f8d657ba06c3c0c167fc85c90457e5b27f2508f43e
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.10.*
    - hatchling >=1.28
    - hatch-vcs >=0.5
  run:
    - python >=${{ python_min }}
    - pytest >=9.0.2
    - python-dotenv >=1.2.2
    - tomli >=2.4

tests:
  - python:
      imports:
        - pytest_env.plugin
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - pytest --help

about:
  license: MIT
  license_file: LICENSE
  summary: This is a pytest plugin that enables you to set environment variables in a pytest.ini or pyproject.toml file.
  homepage: https://github.com/pytest-dev/pytest-env
  repository: https://github.com/pytest-dev/pytest-env

extra:
  recipe-maintainers:
    - nicoddemus
