# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.5"

package:
  name: mpi4py-mpich
  version: ${{ version }}

source:
  url: https://github.com/mpi4py/mpi4py/archive/refs/tags/${{ version }}.tar.gz
  sha256: 29cc7ad701c190ef37622e4a2b2e2dab94fbc7777b1a15fa2029097c41b6edf0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.9.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mpi4py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mpi4py/mpi4py/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python bindings for MPI (includes MPICH binaries)
  description: |
    Python bindings for MPI (includes MPICH binaries)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
