# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: monotonic-alignment-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/monotonic-alignment-search/monotonic_alignment_search-${{ version }}.tar.gz
  sha256: 54935e3c5cb82497e5ac81167ef20e95bf62e8b46402eb2936da5e92612b0765

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - cython >=3.0.0
    - numpy >=2.0.0
  run:
    - python >=${{ python_min }}
    - torch
    - numpy >=1.21.6

tests:
  - python:
      imports:
        - monotonic_alignment_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/monotonic-alignment-search/
  license: MIT
  license_file: LICENSE
  summary: Monotonically align text and speech
  description: |
    Monotonically align text and speech
  repository: https://github.com/eginhard/monotonic_alignment_search

extra:
  recipe-maintainers:
    - rxm7706

