# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: fastapi-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-cache/fastapi-cache-${{ version }}.tar.gz
  sha256: 1f57e6e666672c84e3dd5d4141ec808d5339d158e10c87a87eb9ce11ff8b1735

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fastapi_cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/comeuplater/fastapi_cache
  license: MIT
  license_file: LICENSE
  summary: FastAPI simple cache
  description: |
    FastAPI simple cache

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
