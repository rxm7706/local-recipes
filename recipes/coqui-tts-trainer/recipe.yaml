# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: coqui-tts-trainer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coqui-tts-trainer/coqui_tts_trainer-${{ version }}.tar.gz
  sha256: d1658b5ee7cfc0a5a24dafbc899dab02a58e119115762dbfc37e1062045ad41d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - coqpit-config <0.3.0,>=0.2.2
    - fsspec >=2023.6.0
    - packaging >=21.0
    - psutil >=5
    - tensorboard >=2.17.1

tests:
  - python:
      imports:
        - trainer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/idiap/coqui-ai-Trainer
  license: Apache-2.0
  license_file: LICENSE
  summary: General purpose model trainer for PyTorch that is more flexible than it should be, by 🐸Coqui.
  description: |
    General purpose model trainer for PyTorch that is more flexible than it should be, by 🐸Coqui.
  repository: https://github.com/idiap/coqui-ai-Trainer

extra:
  recipe-maintainers:
    - rxm7706

