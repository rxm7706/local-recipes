# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: whatthepatch
  version: "1.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9eefb4ebea5200408e02d413d2b4bc28daea6b78bb4b4d53431af7245f7d7edf

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools >=65.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - whatthepatch
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: What The Patch!? is a library for both parsing and applying patch files
  description: What The Patch!? is a library for both parsing and applying patch files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cscorley/whatthepatch
  repository: https://github.com/cscorley/whatthepatch
  documentation: https://github.com/cscorley/whatthepatch

extra:
  recipe-maintainers:
    - ccordoba12
    - andfoy
    - steff456
    - dalthviz
