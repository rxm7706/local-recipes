# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: whatthepatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/whatthepatch/whatthepatch-${{ version }}.tar.gz
  sha256: 9eefb4ebea5200408e02d413d2b4bc28daea6b78bb4b4d53431af7245f7d7edf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - whatthepatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cscorley/whatthepatch
  license: MIT
  license_file: LICENSE
  summary: A patch parsing and application library.
  description: |
    A patch parsing and application library.

extra:
  recipe-maintainers:
    - ccordoba12
    - andfoy
    - steff456
    - dalthviz

