# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.5.0"

package:
  name: orderly-set
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orderly-set/orderly_set-${{ version }}.tar.gz
  sha256: e87185c8e4d8afa64e7f8160ee2c542a475b738bc891dc3f58102e654125e6ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - orderly_set
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/seperman/orderly-set
  license: MIT
  license_file: LICENSE
  summary: Orderly set
  description: |
    Orderly set

extra:
  recipe-maintainers:
    - synapticarbors

