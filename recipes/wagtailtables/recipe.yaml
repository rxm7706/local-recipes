# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtailtables
  version: "0.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtailtables-${{ version }}.tar.gz
  sha256: 45bfcfda12e56e479fae05e0438efb5026928793d588c9d08101d5af27021544

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=3.0

tests:
  - python:
      imports:
        - wagtailtables
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: jSpreadsheet table blocks for Wagtail
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/overcast/wagtailtables/

extra:
  recipe-maintainers:
    - rxm7706
