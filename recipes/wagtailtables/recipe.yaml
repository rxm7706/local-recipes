# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtailtables
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ce/8a/4245e13b1b94d13f3c7ebe3b3028dc2142679cbead8a11650bc36e970c14/wagtailtables-0.3.0.tar.gz
  sha256: fc05a63a659597706cfd4eb82c9a18fa6678addb50c500ab28ea3534f19d4c43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  run:
  - python >=${{ python_min }}
  - wagtail >=3.0

tests:
- python:
    imports:
    - wagtailtables
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: jSpreadsheet table blocks for Wagtail
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/overcast/wagtailtables/

extra:
  recipe-maintainers:
  - rxm7706
  cfe-local-build-status: success
  cfe-local-build-datetime: '2026-10-09T11:30:56Z'
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
