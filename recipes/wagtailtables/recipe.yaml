# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtailtables
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wagtailtables/wagtailtables-${{ version }}.tar.gz
  sha256: fc05a63a659597706cfd4eb82c9a18fa6678addb50c500ab28ea3534f19d4c43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wagtail >=3.0

tests:
- python:
    imports:
      - wagtailtables
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: jSpreadsheet table blocks for Wagtail
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/overcast/wagtailtables/

extra:
  recipe-maintainers:
    - rxm7706

