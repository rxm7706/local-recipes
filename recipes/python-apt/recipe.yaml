# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.8"

package:
  name: python-apt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-apt/python-apt-0.7.8.tar.bz2
  sha256: 83ab9be9ca103b401894ad076c551cdb39e6d8f7ee9b6f66e0617d6fedddc6d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_apt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://launchpad.net/python-apt/
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python bindings for libapt.
  description: |
    Python bindings for libapt.

extra:
  recipe-maintainers:
    - rxm7706

