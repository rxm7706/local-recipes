# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.51.1"

package:
  name: libucxx-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libucxx-cu12/libucxx_cu12-0.51.1-py3-none-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl
  sha256: 40e015102905df405fb8ab665cf40b53eda235d2b6f5eece6b95fff3836bca83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - librmm-cu12 ==26.8.*
    - libucx-cu12 <1.20,>=1.18.0

tests:
  - python:
      imports:
        - libucxx_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/ucxx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Bindings for the Unified Communication X library (UCX)
  description: |
    Python Bindings for the Unified Communication X library (UCX)

extra:
  recipe-maintainers:
    - rxm7706

