# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.6.0"

package:
  name: chardet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chardet/chardet-${{ version }}.tar.gz
  sha256: 93d9df6089ded42ed1fe9f57e272c0b74bd0464d45c0c7d50f09f26f31105c3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chardet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chardet/chardet
  license: 0BSD
  license_file: LICENSE
  summary: Universal character encoding detector
  description: |
    Universal character encoding detector
  repository: https://github.com/chardet/chardet
  documentation: https://chardet.readthedocs.io

extra:
  recipe-maintainers:
    - jschueller
    - dan-blanchard
    - sigmavirus24
    - nehaljwani

