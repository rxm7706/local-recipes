# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dominate
  version: "2.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dominate-${{ version }}.tar.gz
  sha256: 558284687d9b8aae1904e3d6051ad132dd4a8c0cf551b37ea4e7e42a31d19dc4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=62
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dominate
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Dominate is a Python library for creating and manipulating HTML documents using an elegant DOM API.
  homepage: http://github.com/Knio/dominate/
  repository: https://github.com/Knio/dominate

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
