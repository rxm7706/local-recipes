# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4"

package:
  name: logger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logger/logger-${{ version }}.tar.gz
  sha256: 4ecac57133c6376fa215f0fe6b4dc4d60e4d1ad8be005cab4e8a702df682f8b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Python logging helper
  description: |
    Python logging helper

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: logger
  cfe-upstream-registry: pypi
  cfe-upstream-name: logger
  cfe-purls:
