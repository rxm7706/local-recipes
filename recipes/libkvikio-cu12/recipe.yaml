# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: libkvikio-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libkvikio-cu12/libkvikio_cu12-26.8.0-py3-none-manylinux_2_28_aarch64.whl
  sha256: ef8910448153979c50280bd3fd12b7aacfa9e23b69b3d12119c12398c71d906c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-pathfinder
    - cuda-toolkit ==12.*
    - nvidia-cufile-cu12
    - rapids-logger ==0.2.*

tests:
  - python:
      imports:
        - libkvikio_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/kvikio
  license: Apache-2.0
  license_file: LICENSE
  summary: KvikIO - GPUDirect Storage (C++)
  description: |
    KvikIO - GPUDirect Storage (C++)

extra:
  recipe-maintainers:
    - rxm7706

