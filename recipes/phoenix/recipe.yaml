# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.1"

package:
  name: phoenix
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/phoenix/phoenix-0.9.1.zip
  sha256: 16c5d61d2e13c0ece7d2f656bcbd4532755ca36c1a3753f9158a5d53f58ebb20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - phoenix
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/phoenix
  license: UNKNOWN
  license_file: LICENSE
  summary: MUS Interface for Phoenix Emulator 3.x
  description: |
    MUS Interface for Phoenix Emulator 3.x

extra:
  recipe-maintainers:
    - rxm7706

