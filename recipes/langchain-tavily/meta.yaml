{% set name = "langchain-tavily" %}
{% set version = "0.2.18" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/langchain_tavily-{{ version }}.tar.gz
  sha256: cd7859ae1a6ce79236580ef67072ff5fc43c7ded94e7eac38ff04209ca85a320

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - langchain-core >=1.2.11,<2.0.0
    - langchain >=1.0.0,<2.0.0
    - aiohttp >=3.11.14,<4.0.0
    - requests >=2.32.3,<3.0.0

test:
  imports:
    - langchain_tavily
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tavily-ai/langchain-tavily
  summary: An integration package connecting Tavily and LangChain
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - benmoss
