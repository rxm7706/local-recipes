# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.1.4"
  python_min: "3.10"

package:
  name: gepa
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/g/gepa/gepa-${{ version }}.tar.gz
    sha256: 6dd153a676ae5481764860d19286a9c0e8ddb5ef70d7f13044faf24978bdb6b8

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.1
    - wheel
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - gepa
      pip_check: true

about:
  homepage: https://github.com/gepa-ai/gepa
  summary: A framework for optimizing textual system components (AI prompts, code snippets, etc.) using LLM-based reflection and Pareto-efficient evolutionary search.
  license: MIT
  license_file: LICENSE
extra:
  recipe-maintainers:
    - moritzwilksch
