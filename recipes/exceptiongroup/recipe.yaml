# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: exceptiongroup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/exceptiongroup/exceptiongroup-${{ version }}.tar.gz
  sha256: 8b412432c6055b0b7d14c310000ae93352ed6754f70fa8f7c34141f91c4e3219

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-scm
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - exceptiongroup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/exceptiongroup/
  license: MIT
  license_file: LICENSE
  summary: Backport of PEP 654 (exception groups)
  description: |
    Backport of PEP 654 (exception groups)

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
