# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mpire
  version: "2.10.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mpire-${{ version }}.tar.gz
  sha256: f66a321e93fadff34585a4bfa05e95bd946cf714b442f51c529038eb45773d97

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm >=4.27
    - pywin32-on-windows
    - pygments >=2.0

tests:
  - python:
      imports:
        - mpire
        - mpire.dashboard
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Python package for easy multiprocessing, but faster than multiprocessing
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sybrenjansen/mpire

extra:
  recipe-maintainers:
    - synapticarbors
