# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: syslogmp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/syslogmp/syslogmp-${{ version }}.tar.gz
  sha256: bcf94858407cf8993e9bf73dc306157f087db6c66503e74853d0a95bf6a4f0fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=51.1.2
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - syslogmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://homework.nwsnet.de/releases/76d6/#syslogmp
  license: MIT
  license_file: LICENSE
  summary: A parser for BSD syslog protocol (RFC 3164) messages
  description: |
    A parser for BSD syslog protocol (RFC 3164) messages

extra:
  recipe-maintainers:
    - rxm7706

