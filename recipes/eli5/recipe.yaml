# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: eli5
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/eli5/eli5-${{ version }}.tar.gz
  sha256: 6d8ab55b3535f8feecf4f98dbaadd6876121e5a2549735635cf71707d34bd47c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs >17.1.0
    - jinja2 >=3.0.0
    - numpy >=1.9.0
    - scipy
    - scikit-learn >=1.6.0
    - python-graphviz
    - tabulate >=0.7.7

tests:
  - python:
      imports:
        - eli5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eli5-org/eli5
  license: MIT
  license_file: LICENSE.txt
  summary: Debug machine learning classifiers and explain their predictions
  description: |
    Debug machine learning classifiers and explain their predictions

extra:
  recipe-maintainers:
    - rmax
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: eli5
  cfe-upstream-registry: pypi
  cfe-upstream-name: eli5
  cfe-purls:
    - pkg:conda/eli5@${{ version }}?channel=conda-forge
    - pkg:pypi/eli5@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/eli5-org/eli5
  cfe-import-names: [eli5]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/eli5-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-17T08:01:47Z
