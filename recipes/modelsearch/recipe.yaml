# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: modelsearch
  version: 1.3.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/modelsearch/modelsearch-${{ version }}.tar.gz
  sha256: f3b2e304dbef9f7c838423f591cfe0c60f4cef584bae8793d2aa8ac35a3c46e0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80,<81
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - django >=4.2
    - django-tasks >=0.7,<0.13
tests:
  - python:
      imports:
        - modelsearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*

about:
  summary: A library for indexing Django models with Elasicsearch, OpenSearch or database and searching them with the Django ORM.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/wagtail/django-modelsearch
  repository: https://github.com/wagtail/django-modelsearch

extra:
  recipe-maintainers:
    - darynwhite
    - rxm7706

#### CFE metadata AND comments
