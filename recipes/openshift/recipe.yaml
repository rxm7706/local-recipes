# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.2"

package:
  name: openshift
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openshift/openshift-${{ version }}.tar.gz
  sha256: f55789fce56fcbf7e2cd9377a68c4a99ab406074d3324b9abcca98477d101471

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - kubernetes
    - python-string-utils
    - six

tests:
  - python:
      imports:
        - openshift
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openshift/openshift-restclient-python
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenShift python client
  description: |
    OpenShift python client

extra:
  recipe-maintainers:
    - pb01ka

