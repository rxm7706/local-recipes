# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.10.0"

package:
  name: symspellpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/symspellpy/symspellpy-${{ version }}.tar.gz
  sha256: 7434e15c92b2af6ec0141df98f249b35a7ddc5496a410c2649c1ac74d84a3dfb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - symspellpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/symspellpy/
  license: MIT
  license_file: LICENSE
  summary: Python SymSpell
  description: |
    Python SymSpell
  repository: https://github.com/mammothb/symspellpy
  documentation: https://symspellpy.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - jm-rivera

