# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: soda
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soda/soda-${{ version }}.tar.gz
  sha256: bf81e0b4dd5d1026fc1307cf9b49906d7bcddd0dbeef1971a5c7f492d248afba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - soda
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/soda/
  license: MIT
  license_file: LICENSE
  summary: A generic pipeline based package for machine learning modelling which supports classification, regression and clustering.
  description: |
    A generic pipeline based package for machine learning modelling which supports classification, regression and clustering.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
