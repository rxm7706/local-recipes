# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.datetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.datetime/zope_datetime-${{ version }}.tar.gz
  sha256: c110ff575fbfbac9dc549d825b6a673c8023a047a9f8a9594b8aa56ab1472513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.datetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.datetime
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope datetime
  description: |
    Zope datetime

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zope.datetime
  cfe-upstream-registry: pypi
  cfe-upstream-name: zope.datetime
  cfe-purls:
    - pkg:conda/zope.datetime@${{ version }}?channel=conda-forge
    - pkg:pypi/zope.datetime@${{ version }}
  cfe-upstream-repo: http://github.com/zopefoundation/zope.datetime
  cfe-upstream-homepage: http://github.com/zopefoundation/zope.datetime
