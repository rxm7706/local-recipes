# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: grpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpc/grpc-${{ version }}.tar.gz
  sha256: e1aa035512b1cc8d5ce84685f30eae463dad9123d858f5676b1159a2b80eea86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - grpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: "Please install the official package with: pip install grpcio"
  description: |
    Please install the official package with: pip install grpcio

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
