# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cgen
  version: "2025.1"
  sha256: 79f01e010d49c13e58b4ca8f2d4996a6b7178968f5f2d906262733480ae7a2d4
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python 3.10.*
    - hatchling
    - pytools
    - pip
    - typing_extensions >=4.5
  run:
    - python >=${{ python_min }}
    - pytools
    - numpy
    - typing_extensions

tests:
  - python:
      imports:
        - ${{ name }}
      pip_check: false
      python_version: ${{ python_min }}
  - files:
      source:
        - test
    requirements:
      run:
        - pytest
        - python ${{ python_min }}
    script:
      - cd test && python -m pytest

about:
  license: MIT
  license_file: LICENSE
  summary: C/C++ source generation from an AST
  homepage: http://pypi.python.org/pypi/cgen
  repository: http://github.com/inducer/cgen
  documentation: https://documen.tician.de/cgen

extra:
  recipe-maintainers:
    - inducer
