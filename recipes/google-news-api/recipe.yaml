# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.16"

package:
  name: google-news-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-news-api/google_news_api-${{ version }}.tar.gz
  sha256: a80d77e2a33b86514db109c9fe7e9e33c8a8e50676188cdfb2429d7e16d55f54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.2.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - feedparser <7.0.0,>=6.0.11
    - httpx <0.29.0,>=0.28.1
    - selectolax <0.4.0,>=0.3.29
    - tqdm <5.0.0,>=4.67.1

tests:
  - python:
      imports:
        - google_news_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ma2za/google-news-api
  license: MIT
  license_file: LICENSE
  summary: Unofficial Python client for Google News RSS with sync, async, URL decoding, caching, and MCP support.
  description: |
    Unofficial Python client for Google News RSS with sync, async, URL decoding, caching, and MCP support.
  repository: https://github.com/ma2za/google-news-api

extra:
  recipe-maintainers:
    - rxm7706

