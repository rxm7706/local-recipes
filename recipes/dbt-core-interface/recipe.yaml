# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.7"

package:
  name: dbt-core-interface
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-core-interface/dbt_core_interface-${{ version }}.tar.gz
  sha256: f61417665c3db28be3dcc9ca01d5e7d15d0508b0da7ac8e1fb52145a91b31a14

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7.17,<0.8.0
  run:
    - python >=${{ python_min }}
    - dbt-core <2.0.0,>=1.8.0
    - dbt-adapters >=1.3.2
    - rich >10.0
    - typing_extensions
    - requests >=2.31.0

tests:
  - python:
      imports:
        - dbt_core_interface
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/z3z1ma/dbt-core-interface
  license: MIT
  license_file: LICENSE
  summary: Dbt Core Interface
  description: |
    Dbt Core Interface
  repository: https://github.com/z3z1ma/dbt-core-interface
  documentation: https://dbt-core-interface.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
