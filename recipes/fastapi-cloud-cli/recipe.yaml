# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.0"

package:
  name: fastapi-cloud-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-cloud-cli/fastapi_cloud_cli-${{ version }}.tar.gz
  sha256: 840895bb8d14309aeffc905e0dcd1334d18c6f5da54b735413a8f1cb385e581e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - typer >=0.16.0
    - uvicorn >=0.17.6
    - rignore >=0.5.1
    - httpx >=0.27.0
    - rich-toolkit >=0.20.3
    - pydantic >=2.7.4
    - sentry-sdk >=2.20.0
    - fastar >=0.10.0
    - detect-installer >=0.1.0

tests:
  - python:
      imports:
        - fastapi_cloud_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fastapilabs/fastapi-cloud-cli
  license: MIT
  license_file: LICENSE
  summary: Deploy and manage FastAPI Cloud apps from the command line 🚀
  description: |
    Deploy and manage FastAPI Cloud apps from the command line 🚀
  repository: https://github.com/fastapilabs/fastapi-cloud-cli
  documentation: https://fastapi.tiangolo.com/fastapi-cloud-cli/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
