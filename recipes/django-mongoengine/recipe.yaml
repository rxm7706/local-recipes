# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.6"

package:
  name: django-mongoengine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-mongoengine/django-mongoengine-${{ version }}.tar.gz
  sha256: 0474b32f818b442e3646ae1853a703fb1be9170dbf394ee7dfdd97e3a7d7b726

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources

tests:
  - python:
      imports:
        - django_mongoengine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mongoengine/django-mongoengine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django support for MongoDB via MongoEngine
  description: |
    Django support for MongoDB via MongoEngine

extra:
  recipe-maintainers:
    - rxm7706

