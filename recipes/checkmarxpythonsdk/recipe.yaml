# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: CheckmarxPythonSDK
  version: "0.5.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1793313d6b36e538289e587d3fde6a856d07551a5eb61ce291b09292a5a9e898

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - urllib3 ==1.26.8
    - requests >=2.22.0
    - requests-toolbelt >=0.9.1
    - zeep >=3.4.0
    - python-dateutil >=2.8.2

tests:
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: Simple, fast, extensible JSON encoder/decoder for Python
  description: |
    This is wrapper using Python for CxSAST and CxOSA REST API, Portal SOAP API, CxSAST ODATA API, CxSCA REST API.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/checkmarx-ts/checkmarx-python-sdk.git

extra:
  recipe-maintainers:
    - JFreitas9
