# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.20"
  python_min: "3.11"

package:
  name: mcpo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcpo/mcpo-${{ version }}.tar.gz
  sha256: bc192c8775aa9f46ecf3e84180644079f8832b5ed9f12a0aa1cb9e2728e0590c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.1.8
    - fastapi >=0.115.12
    - mcp >=1.17.0
    - passlib >=1.7.4
    - pydantic >=2.11.1
    - pyjwt >=2.10.1
    - python-dotenv >=1.1.0
    - typer >=0.15.2
    - uvicorn >=0.34.0
    - watchdog >=4.0.0

tests:
  - python:
      imports:
        - mcpo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/mcpo/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple, secure MCP-to-OpenAPI proxy server
  description: |
    A simple, secure MCP-to-OpenAPI proxy server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mcpo
