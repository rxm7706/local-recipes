# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: matrixprofile
  version: "1.1.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  #path: ../../src/matrixprofile
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/matrixprofile-${{ version }}.tar.gz
  sha256: d6d7dd13c2d1a1a725ce09c621960ee309ebac0b7b3cab680c4d91c683fff1b5

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  host:
    - cython
    - numpy
    - pip
    - python
  run:
    - matplotlib-base >=3.0.3
    - ${{ pin_compatible('numpy') }}
    - protobuf ==3.11.2
    - python
    - scipy <2.0.0,>=1.3.2

tests:
  - python:
      imports:
        - matrixprofile
      pip_check: true

about:
  summary: An open source time series data mining library based on Matrix Profile algorithms.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/matrix-profile-foundation/matrixprofile

extra:
  recipe-maintainers:
    - tylerwmarrs
    - vanbenschoten
