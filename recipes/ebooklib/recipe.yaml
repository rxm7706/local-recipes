# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20"

package:
  name: ebooklib
  version: ${{ version }}

source:
  # Note the sdist filename case: 0.18 and earlier published as EbookLib-*,
  # 0.19+ publish as ebooklib-*.
  url: https://pypi.org/packages/source/e/ebooklib/ebooklib-${{ version }}.tar.gz
  sha256: 35e2f9d7d39907be8d39ae2deb261b19848945903ae3dbb6577b187ead69e985

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - lxml
    - six

tests:
  - python:
      imports:
        - ebooklib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aerkalov/ebooklib
  repository: https://github.com/aerkalov/ebooklib
  license: AGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Ebook library which can handle EPUB2/EPUB3 and Kindle format
  description: |
    EbookLib is a Python library for reading and writing ebooks. It supports
    EPUB 2 and EPUB 3, and can read (but not write) the unencrypted Kindle
    format. It handles the package document, spine, table of contents,
    metadata and embedded items, so callers can build or inspect a book
    without hand-assembling the container format.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ebooklib
  cfe-upstream-registry: pypi
  cfe-upstream-name: ebooklib
  cfe-purls:
    - pkg:conda/ebooklib@${{ version }}?channel=conda-forge
    - pkg:pypi/ebooklib@${{ version }}
  cfe-upstream-repo: https://github.com/aerkalov/ebooklib
  cfe-upstream-homepage: https://github.com/aerkalov/ebooklib
  cfe-import-names: [ebooklib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
