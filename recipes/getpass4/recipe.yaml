# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.14.1"

package:
  name: getpass4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/getpass4/getpass4-${{ version }}.tar.gz
  sha256: 80aa4e3a665f2eccc6cda3ee22125eeb5c6338e91c40c4fd010b3c94c7aa4d3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - caugetch
    - clipboard
    - colorama
    - pyperclip

tests:
  - python:
      imports:
        - getpass4
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/getpass4/
  license: MIT
  license_file: LICENSE
  summary: getpass but with custom characters when you type your password
  description: |
    getpass but with custom characters when you type your password

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
