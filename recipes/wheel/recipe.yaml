# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.48.0"

package:
  name: wheel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wheel/wheel-${{ version }}.tar.gz
  sha256: 94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<5
  run:
    - python >=${{ python_min }}
    - wheel
    - packaging >=24.0

tests:
  - python:
      imports:
        - wheel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/wheel/
  license: MIT
  license_file: LICENSE.txt
  summary: Command line tool for manipulating wheel files
  description: |
    Command line tool for manipulating wheel files
  repository: https://github.com/pypa/wheel
  documentation: https://wheel.readthedocs.io/

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - ocefpaf
    - mingwandroid

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wheel
