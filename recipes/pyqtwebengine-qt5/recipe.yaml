# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.15.19"

package:
  name: pyqtwebengine-qt5
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/PyQtWebEngine-Qt5/pyqtwebengine_qt5-5.15.19-py3-none-macosx_10_13_x86_64.whl
  sha256: f267eca7e5db7341a97e8dada244a74cb5e1ea0b41feff8efd10c93395f29729

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyqtwebengine_qt5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.riverbankcomputing.com/software/pyqt/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: The subset of a Qt installation needed by PyQtWebEngine.
  description: |
    The subset of a Qt installation needed by PyQtWebEngine.

extra:
  recipe-maintainers:
    - rxm7706

