# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opencensus-context
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opencensus-context-${{ version }}.tar.gz
  sha256: a03108c3c10d8c80bb5ddf5c8a1f033161fa61972a9917f9b9b3a18517f0088c

build:
  number: 4
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - if: py<=3.7
      then: contextvars

tests:
  - python:
      imports:
        - opencensus
        - opencensus.common.runtime_context
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: The OpenCensus Runtime Context.
  description: |
    The OpenCensus Runtime Context provides in-process context propagation.
    By default, thread local storage is used for Python 2.7, 3.4 and 3.5;
    contextvars is used for Python >= 3.6, which provides asyncio support.

    PyPI: [https://pypi.org/project/opencensus-context/](https://pypi.org/project/opencensus-context/)

  homepage: https://github.com/census-instrumentation/opencensus-python/tree/master/context/opencensus-context
  repository: https://github.com/census-instrumentation/opencensus-python/tree/master/context/opencensus-context
  documentation: https://github.com/census-instrumentation/opencensus-python/tree/master/context/opencensus-context/examples

extra:
  recipe-maintainers:
    - basnijholt
    - dhirschfeld
    - sugatoray
