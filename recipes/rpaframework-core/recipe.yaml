# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rpaframework-core
  version: "11.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/rpaframework_core-${{ version }}.tar.gz
  sha256: 7e354b275d3a940921b842004c2dbfc2f71b957a73ba1db0be1c41458e2e08d4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.7,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.7.0,<4.0.0
    - selenium >=4.6.1,<5.0.0
    - webdriver-manager >=3.9.1,<4.0.0
    - pillow >=9.1.1,<10.0.0
    - packaging >=21.3,<24
    #- psutil >=5.9.0,<6.0.0
    #- pywin32-on-windows >=300,<304
    #- uiautomation >=2.0.15,<3.0.0

tests:
  - python:
      imports:
        - RPA
        - RPA.core
      pip_check: true

about:
  summary: Core utilities used by RPA Framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://rpaframework.org/

extra:
  recipe-maintainers:
    - osrjv
    - xylix
    - kariharju
