    - pkg:pypi/expo@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/expo/
  cfe-upstream-homepage: https://pypi.org/project/expo/
  cfe-import-names: [expo]
  cfe-source-kind: pypi-sdist
