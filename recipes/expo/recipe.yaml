# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: expo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/expo/expo-${{ version }}.tar.gz
  sha256: df9042d9d73307bf987e89791b6e36744c5fa99f7464210e956e76d7fe3e84bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - expo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/expo/
  license: MIT
  license_file: LICENSE
  summary: Selectively expose module functionality
  description: |
    Selectively expose module functionality

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: expo
  cfe-upstream-registry: pypi
  cfe-upstream-name: expo
