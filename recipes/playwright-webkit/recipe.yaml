# CFE comments
# Header:
#    # conda-forge's `playwright` package ships ONLY the Node driver -- 178
#    # files, all under lib/node_modules, no bin/ entry -- plus browsers.json,
#    # which carries revision PINS and no binaries. The browsers themselves
#    # come from a network `playwright install` into the machine-global
#    # ~/.cache/ms-playwright, which no lock file describes and no air-gapped
#    # host can reach. This package closes that gap for one browser.
#    # The archive has NO single root directory -- pw_run.sh, protocol.json
#    # and the two minibrowser trees sit at the top level -- so unlike the
#    # chromium/firefox archives rattler-build does not strip anything, and
#    # the contents land directly in webkit-2359/.
#    # No --version test: pw_run.sh launches MiniBrowser, which needs a
#    # display; running it in a test env would hang rather than report. The
#    # test asserts the launcher and both minibrowser trees are present and
#    # that the ELF resolves all its libraries.
#    # The archive ships no licence file; canonical LGPL-2.1-or-later text is
#    # shipped from the recipe directory (pattern 2). WebKit is LGPL-2.1+ for
#    # WebCore/JavaScriptCore with BSD-2-Clause portions.
# source:
#    # URL and sha256 are not guesses: `python -m playwright install --dry-run`
#    # was run to get the authoritative download URL and install directory, the
#    # archive was fetched, and the sha256 recorded from the fetched bytes.
#    # Playwright's own CDN mirror of the Chrome-for-Testing archives was
#    # verified byte-identical to Google's bucket (same sha256), so the Google
#    # origin is used for the two Chrome packages as the true publisher.
#    # ubuntu-22.04 variant chosen over the ubuntu-24.04 one Playwright
#    # would pick on this host. Playwright publishes per-distro builds and
#    # selects by the RUNNING distro, but a conda package must serve every
#    # linux-64 host, so the oldest available build (glibc 2.35) is the
#    # portable choice. Playwright locates a browser purely by directory
#    # name and does not check which variant is inside. Verified on the
#    # Ubuntu 24.04 build host: 0 unresolved libraries, and Firefox reports
#    # 155.0, so the older build runs on the newer distro as expected.
# build:
#    # The install directory name is what Playwright's registry reports, taken
#    # from --dry-run output rather than derived from the browser name.
#    # binary_relocation: false is load-bearing here, and the reason is not
#    # theoretical -- the same default corrupted a Bun static-PIE binary in the
#    # ccusage recipe in this repo (4,346,528 -> 4,352,649 bytes, first
#    # difference inside the ELF header, segfault at launch). These binaries
#    # are far larger and carry more embedded payload.
# requirements:
#    # No conda library dependencies on purpose. The binaries are built against
#    # Ubuntu's system libraries and resolve them from the host (verified: ldd
#    # reports 0 missing on the Ubuntu 24.04 build host). Pulling conda's nss /
#    # nspr / xorg stack in beside the system one invites version skew inside a
#    # browser process. This mirrors Playwright's own model, which validates
#    # host packages via `--with-deps` and ships deb.deps / rpm.deps manifests
#    # inside the archive rather than vendoring libraries.
#    # The cost of that choice: a minimal container without the usual X/NSS
#    # runtime will not launch this browser. That is the same constraint
#    # `playwright install` operates under, and it is why __glibc is declared.
# about:
#    # OSI-approved, unlike the two Chrome-for-Testing packages in this set:
#    # LGPL-2.1-or-later AND BSD-2-Clause. The remaining obstacle to conda-forge is provenance
#    # (a repackaged prebuilt binary), not the licence.
####
