# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"

package:
  name: pysignalr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysignalr/pysignalr-${{ version }}.tar.gz
  sha256: 1b3d965addb6db4c86510efd5072ecb38356a95d3f219c926de8ae9e8c69d754

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp
    - msgpack
    - orjson
    - websockets <17,>=16.0

tests:
  - python:
      imports:
        - pysignalr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/baking-bad/pysignalr
  license: MIT
  license_file: LICENSE
  summary: Modern, reliable and async-ready client for SignalR protocol
  description: |
    Modern, reliable and async-ready client for SignalR protocol
  repository: https://github.com/baking-bad/pysignalr

extra:
  recipe-maintainers:
    - rxm7706

