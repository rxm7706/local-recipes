# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: django-picker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-picker/django-picker-${{ version }}.tar.gz
  sha256: a02109e230a94608930a4e0efe0e796782b0aaf77c95ab0fa2931d3a81e75e15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - picker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/shinznatkid/picker
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Put javascript, css framework into your project.
  description: |
    Put javascript, css framework into your project.

extra:
  recipe-maintainers:
    - rxm7706

