# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"
  python_min: "3.11"

package:
  name: dd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dd/dd-${{ version }}.tar.gz
  sha256: 4baadadc9b2ebf6136a5b84dc51a43cec5fe91203286cd377e1e093358cdffcd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astutils >=0.0.5
    - networkx >=2.4
    - ply <=3.10,>=3.4
    - setuptools >=65.6.0

tests:
  - python:
      imports:
        - dd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tulip-control/dd
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Binary decision diagrams implemented in pure Python, as well as Cython wrappers of CUDD, Sylvan, and BuDDy.
  description: |
    Binary decision diagrams implemented in pure Python, as well as Cython wrappers of CUDD, Sylvan, and BuDDy.
  repository: https://github.com/tulip-control/dd
  documentation: https://github.com/tulip-control/dd/blob/main/doc.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dd
