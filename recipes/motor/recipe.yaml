# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.1"

package:
  name: motor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/motor/motor-${{ version }}.tar.gz
  sha256: 27b4d46625c87928f331a6ca9d7c51c2f518ba0e270939d395bc1ddc89d64526

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >1.24
    - hatch-requirements-txt >=0.4.1
  run:
    - python >=${{ python_min }}
    - pymongo <5.0,>=4.9

tests:
  - python:
      imports:
        - motor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.mongodb.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Non-blocking MongoDB driver for Tornado or asyncio
  description: |
    Non-blocking MongoDB driver for Tornado or asyncio
  repository: https://github.com/mongodb/motor
  documentation: https://motor.readthedocs.io

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - hodgsonw
    - ShaneHarvey
    - blink1073
    - hodgsonw

