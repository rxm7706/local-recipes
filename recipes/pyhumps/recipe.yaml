# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyhumps
  version: "3.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyhumps-${{ version }}.tar.gz
  sha256: 498026258f7ee1a8e447c2e28526c0bea9407f9a59c03260aee4bd6c04d681a3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - humps
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convert strings (and dictionary keys) between snake case, camel case and pascal case in Python.
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/nficano/humps

extra:
  recipe-maintainers:
    - thewchan
    - simstoykov
