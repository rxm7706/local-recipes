# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: jsonsir
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/JsonSir/JsonSir-${{ version }}.tar.gz
  sha256: 401447c5e931f7887851ce9bf2407fe34d5aab0b1467bb24bbbf3b760e5bd3fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonsir
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RussellLuo/jsonsir
  license: MIT
  license_file: LICENSE
  summary: A serializer for JSON-like data in Python.
  description: |
    A serializer for JSON-like data in Python.

extra:
  recipe-maintainers:
    - rxm7706

