# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: sharepoint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sharepoint/sharepoint-${{ version }}.tar.gz
  sha256: ae2221f88488a3be62faba07e7253c4e29192dac3e696175b3286a1427d1c979

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sharepoint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ox-it/python-sharepoint
  license: UNKNOWN
  license_file: LICENSE
  summary: Module and command-line utility to get data out of SharePoint
  description: |
    Module and command-line utility to get data out of SharePoint

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
