# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.91.0"
  boost_libs:
    - atomic
    - charconv
    - chrono
    - cobalt
    - container
    - context
    - contract
    - coroutine
    - date_time
    - filesystem
    - graph
    - iostreams
    - locale
    - log
    - log_setup
    - math_c99
    - math_c99f
    - math_tr1
    - math_tr1f
    - prg_exec_monitor
    - program_options
    - random
    - regex
    - serialization
    - thread
    - timer
    - type_erasure
    - unit_test_framework
    - wave
    - wserialization
  boost_libs_long_double:
    - math_c99l
    - math_tr1l
  boost_libs_static_only:
    - exception
    - test_exec_monitor

recipe:
  name: boost-split
  version: ${{ version }}

source:
  url: https://archives.boost.io/release/${{ version }}/source/boost_${{ version|replace(".", "_") }}.tar.bz2
  sha256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5
  patches:
    # ensure our compiler flags get used during bootstrapping
    - patches/0001-Add-default-value-for-cxx-and-cxxflags-options-for-t.patch

build:
  number: 0

outputs:
  - staging:
      name: boost-build
    build:
      script:
        file: ${{ 'bld.bat' if win else 'build.sh' }}
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: python ${{ python_min }}.* *_cpython
        - if: build_platform != target_platform
          then: numpy
        - ruby *
      host:
        - if: unix
          then: icu
        - if: unix
          then: liblzma-devel
        - bzip2
        - zlib
        - zstd
        - python ${{ python_min }}.* *_cpython
        - numpy
  - package:
      name: libboost-headers
    inherit:
      from: boost-build
      run_exports: false
    build:
      script:
        file: ${{ 'install-lib.bat' if win else 'install-lib.sh' if unix else '' }}
    requirements:
      # dummy build env to avoid EnvironmentLocationNotFound on win
      build:
        - if: win
          then: cmake
      host:
      run_constraints:
        - boost-cpp <0.0a0
    tests:
      - script:
          - if: unix
            then: test -d $PREFIX/include/boost
          - if: win
            then: if not exist %LIBRARY_INC%\boost exit 1
          - if: unix
            then: test -f $PREFIX/include/boost/python.hpp
          - if: unix
            then: test -f $PREFIX/include/boost/python/tuple.hpp
          - if: win
            then: if not exist %LIBRARY_INC%\boost\python.hpp exit 1
          - if: win
            then: if not exist %LIBRARY_INC%\boost\python\tuple.hpp exit 1
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/Boost-${{ version }}
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\Boost-${{ version }} exit 1
          - if: unix
            then: |
              for each_lib in ${{ (boost_libs + ([] if ppc64le else boost_libs_long_double) + boost_libs_static_only + ["python" ~ (python_min | replace(".", "")), "numpy" ~ (python_min | replace(".", ""))]) | join(" ") }}; do
                test ! -f $PREFIX/lib/libboost_${each_lib}.${{ "dylib" if osx else "so" }} || exit 1
                test ! -f $PREFIX/lib/libboost_${each_lib}.a || exit 1
                test ! -d $PREFIX/lib/cmake/boost_${each_lib}-${{ version }} || exit 1
              done
          - if: win
            then: |
              for %%L in (${{ (boost_libs + ([] if ppc64le else boost_libs_long_double) + boost_libs_static_only + ["python" ~ (python_min | replace(".", "")), "numpy" ~ (python_min | replace(".", ""))]) | join(" ") }}) do (
                if exist %LIBRARY_BIN%\boost_%%L.dll exit 1
                if exist %LIBRARY_LIB%\boost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\libboost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\cmake\boost_%%L-${{ version }} exit 1
              )
  # libraries without the headers (for run-export)
  - package:
      name: libboost
    inherit:
      from: boost-build
      run_exports: false
    build:
      script:
        file: ${{ 'install-lib.bat' if win else 'install-lib.sh' if unix else '' }}
    requirements:
      build:
        # for strong run-exports
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
      host:
        - if: unix
          then: icu
        - if: win
          then: libiconv
        - bzip2
        - liblzma-devel
        - zlib
        - zstd
      run_constraints:
        - boost-cpp <0.0a0
        - if: win
          then: __win >=10
    tests:
      - script:
          - if: unix
            then: test ! -d $PREFIX/include/boost
          - if: win
            then: if exist %LIBRARY_INC%\boost exit 1
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/Boost-${{ version }}
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\Boost-${{ version }} exit 1
          - if: unix
            then: |
              for each_lib in ${{ (boost_libs + ([] if ppc64le else boost_libs_long_double)) | join(" ") }}; do
                test -f $PREFIX/lib/libboost_${each_lib}.${{ "dylib" if osx else "so" }} || exit 1
                test ! -f $PREFIX/lib/libboost_${each_lib}.a || exit 1
                test ! -d $PREFIX/lib/cmake/boost_${each_lib}-${{ version }} || exit 1
              done
              for each_lib in ${{ boost_libs_static_only | join(" ") }}; do
                test ! -f $PREFIX/lib/libboost_${each_lib}.${{ "dylib" if osx else "so" }} || exit 1
                test -f $PREFIX/lib/libboost_${each_lib}.a || exit 1
                test ! -d $PREFIX/lib/cmake/boost_${each_lib}-${{ version }} || exit 1
              done
              for each_lib in ${{ ["python" ~ (python_min | replace(".", "")), "numpy" ~ (python_min | replace(".", ""))] | join(" ") }}; do
                test ! -f $PREFIX/lib/libboost_${each_lib}.${{ "dylib" if osx else "so" }} || exit 1
                test ! -f $PREFIX/lib/libboost_${each_lib}.a || exit 1
                test ! -d $PREFIX/lib/cmake/boost_${each_lib}-${{ version }} || exit 1
              done
          - if: win
            then: |
              for %%L in (${{ (boost_libs + ([] if ppc64le else boost_libs_long_double)) | join(" ") }}) do (
                if not exist %LIBRARY_BIN%\boost_%%L.dll exit 1
                if not exist %LIBRARY_LIB%\boost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\libboost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\cmake\boost_%%L-${{ version }} exit 1
              )
              for %%L in (${{ boost_libs_static_only | join(" ") }}) do (
                if exist %LIBRARY_BIN%\boost_%%L.dll exit 1
                if exist %LIBRARY_LIB%\boost_%%L.lib exit 1
                if not exist %LIBRARY_LIB%\libboost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\cmake\boost_%%L-${{ version }} exit 1
              )
              for %%L in (${{ ["python" ~ (python_min | replace(".", "")), "numpy" ~ (python_min | replace(".", ""))] | join(" ") }}) do (
                if exist %LIBRARY_BIN%\boost_%%L.dll exit 1
                if exist %LIBRARY_LIB%\boost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\libboost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\cmake\boost_%%L-${{ version }} exit 1
              )
  # libboost headers + libs + metadata
  - package:
      name: libboost-devel
    inherit:
      from: boost-build
      run_exports: false
    build:
      script:
        file: ${{ 'install-lib.bat' if win else 'install-lib.sh' if unix else '' }}
    requirements:
      host:
        - ${{ pin_subpackage("libboost", exact=True) }}
        - ${{ pin_subpackage("libboost-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libboost", exact=True) }}
        - ${{ pin_subpackage("libboost-headers", exact=True) }}
      run_exports:
        - ${{ pin_subpackage("libboost", upper_bound="x.x") }}
      run_constraints:
        - boost-cpp <0.0a0
    tests:
      - files:
          recipe:
            - test
            - test_lib.sh
            - test_lib.bat
        requirements:
          run:
            - if: build_platform == target_platform
              then: ${{ compiler('cxx') }}
        script:
          - if: unix
            then: test -d $PREFIX/lib/cmake/Boost-${{ version }}
          - if: win
            then: if not exist %LIBRARY_LIB%\cmake\Boost-${{ version }} exit 1
          - if: unix
            then: |
              for each_lib in ${{ (boost_libs + ([] if ppc64le else boost_libs_long_double) + boost_libs_static_only) | join(" ") }}; do
                test -d $PREFIX/lib/cmake/boost_${each_lib}-${{ version }} || exit 1
              done
          - if: win
            then: |
              for %%L in (${{ (boost_libs + ([] if ppc64le else boost_libs_long_double) + boost_libs_static_only) | join(" ") }}) do (
                if not exist %LIBRARY_LIB%\cmake\boost_%%L-${{ version }} exit 1
              )
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/boost_python-${{ version }}
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/boost_numpy-${{ version }}
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\boost_python-${{ version }} exit 1
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\boost_numpy-${{ version }} exit 1
          - if: unix
            then: ./test_lib.sh
          - if: win
            then: ./test_lib.bat
  # the python libraries (no headers)
  - package:
      name: libboost-python
    inherit:
      from: boost-build
      run_exports: false
    build:
      script:
        file: ${{ 'build-py.bat' if win else 'build-py.sh' if unix else '' }}
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: numpy
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
      host:
        # ensure python_impl gets picked up by smithy (by using it as a selector) and therefore
        # populated in the .ci_config/*.yaml files, for use in {build,install}-py.{sh,bat}.
        - if: python_impl == "cpython"
          then: python
        - if: python_impl == "pypy"
          then: python
        - numpy
        # keep this in host to ensure that the environment content snapshot before/after
        # installation doesn't consider the headers or CMake metadata part of this output
        - ${{ pin_subpackage("libboost-devel", exact=True) }}
      run:
        - ${{ pin_subpackage("libboost", exact=True) }}
        - python
      run_constraints:
        - boost <0.0a0
        - py-boost <0.0a0
    tests:
      - script:
          - if: unix
            then: test ! -d $PREFIX/include/boost
          - if: win
            then: if exist %LIBRARY_INC%\boost exit 1
          - if: unix
            then: |
              for each_lib in ${{ ["python" ~ (python | version_to_buildstring), "numpy" ~ (python | version_to_buildstring)] | join(" ") }}; do
                test -f $PREFIX/lib/libboost_${each_lib}.${{ "dylib" if osx else "so" }} || exit 1
                test ! -f $PREFIX/lib/libboost_${each_lib}.a || exit 1
              done
          - if: win
            then: |
              for %%L in (${{ ["python" ~ (python | version_to_buildstring), "numpy" ~ (python | version_to_buildstring)] | join(" ") }}) do (
                if not exist %LIBRARY_BIN%\boost_%%L.dll exit 1
                if not exist %LIBRARY_LIB%\boost_%%L.lib exit 1
                if exist %LIBRARY_LIB%\libboost_%%L.lib exit 1
              )
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/boost_python-${{ version }}
          - if: unix
            then: test ! -d $PREFIX/lib/cmake/boost_numpy-${{ version }}
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\boost_python-${{ version }} exit 1
          - if: win
            then: if exist %LIBRARY_LIB%\cmake\boost_numpy-${{ version }} exit 1
  # python libs w/ headers
  - package:
      name: libboost-python-devel
    inherit:
      from: boost-build
      run_exports: false
    build:
      script:
        file: ${{ 'install-py.bat' if win else 'install-py.sh' if unix else '' }}
    requirements:
      # dummy build env to avoid EnvironmentLocationNotFound on win
      build:
        - if: win
          then: cmake
      host:
        - python
        - numpy
        # as for libboost-python
        - ${{ pin_subpackage("libboost-devel", exact=True) }}
      run:
        - python
        - ${{ pin_subpackage("libboost-python", exact=True) }}
        - ${{ pin_subpackage("libboost-devel", exact=True) }}
      run_exports:
        - ${{ pin_subpackage("libboost-python", upper_bound="x.x") }}
      run_constraints:
        - boost <0.0a0
        - py-boost <0.0a0
    tests:
      - script:
          - if: unix
            then: test -d $PREFIX/lib/cmake/boost_python-${{ version }}
          - if: unix
            then: test -d $PREFIX/lib/cmake/boost_numpy-${{ version }}
          - if: win
            then: if not exist %LIBRARY_LIB%\cmake\boost_python-${{ version }} exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\cmake\boost_numpy-${{ version }} exit 1

about:
  license: BSL-1.0
  license_file: LICENSE_1_0.txt
  summary: Free peer-reviewed portable C++ source libraries.
  homepage: http://www.boost.org/
  repository: https://github.com/boostorg/boost
  documentation: https://www.boost.org/doc/

extra:
  recipe-maintainers:
    - ccordoba12
    - jakirkham
    - msarahan
    - ocefpaf
    - jschueller
    - scopatz
    - isuruf
    - xhochy
    - beckermr
    - matthiasdiener
    - h-vetinari
  feedstock-name: boost

#### CFE metadata AND comments
# CFE comments
# Header:
#    # mason Story 22.1 (2026-10-09): crm's 2026-08-16 v0->v1 conversion flattened meta.yaml's jinja
#    # for-each_lib test loops, leaving an each_lib reference outside any loop and a SentinelType
#    # key on the libboost test (G121). Rendered on linux-64 only; not built (heavyweight). The feedstock is
#    # still v0 and has since moved to 1.92.0; meta.yaml (1.91.0) stays beside this file.
# context:
#    # boost_libs mirrors meta.yaml's list; boost_libs_long_double holds math_c99l/math_tr1l, which meta.yaml
#    # adds only `# [not ppc64le]` (the loops add them `if not ppc64le`). meta.yaml's boost_libs_py
#    # ("python" plus py) is built in each loop: python_min for libboost-headers and libboost (they do not
#    # vary by python, so conda-build rendered them with the first python variant), and
#    # the python variant through version_to_buildstring for libboost-python.
# outputs:
#    # A multi-output v1 recipe has no top-level `requirements`, so conda-build's top-level build (its
#    # build.sh / bld.bat and requirements) is the `boost-build` staging output. Every package output
#    # inherits it with `run_exports: false`, so the staging host's run_exports stay out of the outputs as in
#    # meta.yaml. `# [win]` on the two dummy `build:` keys removed (v1 lint: comment selectors).
# tests:
#    # Each flattened loop is one `if: unix` shell loop and one `if: win` `for %%L` block per element, with
#    # the same checks as meta.yaml: shared libs present for boost_libs, absent for static-only and python
#    # libs; static libs present only for static-only; no per-lib CMake metadata outside libboost-devel.
#    # .so on linux, .dylib on osx. libboost-devel keeps meta.yaml's test files and ./test_lib.sh / .bat.
####
