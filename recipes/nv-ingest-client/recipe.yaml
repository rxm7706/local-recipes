# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.3.0"
  python_min: "3.11"

package:
  name: nv-ingest-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nv-ingest-client/nv_ingest_client-${{ version }}.tar.gz
  sha256: 2e47ab83dce6853f59569e55556c4c346005ea1e611c747c1c571c79d4f4c908

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1
    - wheel >=0.46.2
  run:
    - python >=${{ python_min }}
    - python-build >=1.2.2
    - charset-normalizer >=3.4.1
    - click >=8.1.8
    - fsspec >=2025.2.0
    - httpx >=0.28.1
    - pydantic >2.0.0
    - pydantic-settings >2.0.0
    - requests >=2.32.5
    - urllib3 ==2.6.3
    - setuptools >=78.1.1
    - tqdm >=4.67.1
    - lancedb >=0.25.3

tests:
  - python:
      imports:
        - nv_ingest_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NVIDIA/nv-ingest
  license: Apache-2.0
  license_file: LICENSE
  summary: Python client for the nv-ingest service
  description: |
    Python client for the nv-ingest service
  documentation: https://docs.nvidia.com/nv-ingest

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
