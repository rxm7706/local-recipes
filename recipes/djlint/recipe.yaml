# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: djlint
  version: "1.49.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djlint/djlint-${{ version }}.tar.gz
  sha256: 358f4f6afa0431b7526f18764ea38f470becbbfcced825e90bcb406e48592afe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - djlint = djlint:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.3.0
    - click >=8.2.0
    - colorama >=0.4.4
    - cssbeautifier >=1.13.0
    - html-tag-names >=0.1.2
    - html-void-elements >=0.1
    - jsbeautifier >=1.13.0
    - json5 >=0.10.0
    - pathspec >=0.9.0
    - pyyaml >=5.1
    - regex >=2022.6.2
    - tomli >=2.0.1
    - tqdm >=4.62.2

tests:
  - python:
      imports:
        - djlint
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - djlint --help

about:
  summary: HTML Template Linter and Formatter
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/djlint/djLint

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
