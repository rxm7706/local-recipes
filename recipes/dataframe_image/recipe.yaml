# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dataframe_image
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8d6739da53c66bd557f217237bab45943a452760b808bb7a3e635a939eed0bb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dataframe_image=dataframe_image._command_line:main

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - aiohttp
    - beautifulsoup4
    - matplotlib-base >=3.1
    - nbconvert >=5
    - pandas >=0.24
    - python >=3.6
    - requests

tests:
  - python:
      imports:
        - dataframe_image
        - tests
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - dataframe_image --help

about:
  summary: Embed pandas DataFrames as images in pdf and markdown files when converting from Jupyter Notebooks
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/dexplo/dataframe_image

extra:
  recipe-maintainers:
    - tdpetrou
