# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-mgmt-subscription
  version: "3.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.zip
  sha256: 4e255b4ce9b924357bb8c5009b3c88a2014d3203b2495e2256fa027bf84e800e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - msrest >=0.7.1
    - azure-common ~=1.1
    - azure-mgmt-core >=1.3.2,<2.0.0

tests:
  - python:
      imports:
        - azure
        - azure.mgmt
        - azure.mgmt.subscription
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Microsoft Azure Subscription Management Client Library for Python
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/subscription/azure-mgmt-subscription

extra:
  recipe-maintainers:
    - tim-werner
    - dhirschfeld
