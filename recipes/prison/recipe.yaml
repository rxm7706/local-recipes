# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: prison
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prison/prison-${{ version }}.tar.gz
  sha256: e6cd724044afcb1a8a69340cad2f1e3151a5839fd3a8027fd1357571e797c599

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - prison
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/betodealmeida/python-rison
  license: MIT
  license_file: LICENSE
  summary: Rison encoder/decoder
  description: |
    Rison encoder/decoder

extra:
  recipe-maintainers:
    - xylar

