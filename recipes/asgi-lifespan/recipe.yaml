# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: asgi-lifespan
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asgi-lifespan-${{ version }}.tar.gz
  sha256: 5e2effaf0bfe39829cf2d64e7ecc47c7d86d676a6599f7afba378c31f5e3a308

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - async-exit-stack
    - python >=${{ python_min }}
    - sniffio

tests:
  - python:
      imports:
        - asgi_lifespan
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Programmatic startup/shutdown of ASGI apps.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/florimondmanca/asgi-lifespan

extra:
  recipe-maintainers:
    - williamjamir
