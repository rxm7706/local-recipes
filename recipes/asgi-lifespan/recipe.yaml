# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: asgi-lifespan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asgi-lifespan/asgi-lifespan-${{ version }}.tar.gz
  sha256: 5e2effaf0bfe39829cf2d64e7ecc47c7d86d676a6599f7afba378c31f5e3a308

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - sniffio

tests:
  - python:
      imports:
        - asgi_lifespan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/florimondmanca/asgi-lifespan
  license: MIT
  license_file: LICENSE
  summary: Programmatic startup/shutdown of ASGI apps.
  description: |
    Programmatic startup/shutdown of ASGI apps.

extra:
  recipe-maintainers:
    - williamjamir

