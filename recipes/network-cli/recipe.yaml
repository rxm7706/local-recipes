# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: network-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/network-cli/network-cli-${{ version }}.tar.gz
  sha256: bf0b2ef4872597a8a27602b7f2d2b77785c618c900c141d14d908c0c45d40f9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorama
    - sh

tests:
  - python:
      imports:
        - network_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/amardeep-programmer/network-prober
  license: MIT
  license_file: LICENSE
  summary: network-probe-tool
  description: |
    network-probe-tool

extra:
  recipe-maintainers:
    - rxm7706

