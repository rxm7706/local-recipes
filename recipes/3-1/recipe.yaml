schema_version: 1

context:
  version: "1.0.0"

package:
  name: 3-1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/3/3-1/3-1-1.0.0.zip
  sha256: 2cf62306496e21e4bc4b15b22a0e153df8ab4b94fe53234ca0c2fd5b5cafe0b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - 3_1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: www.baidu.com
  license: UNKNOWN
  license_file: LICENSE
  summary: test
  description: |
    test

extra:
  recipe-maintainers:
    - rxm7706

