# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: dearpygui
  version: ${{ version }}

source:
  url: https://github.com/hoffstadt/DearPyGui/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d86822978f7856ea8556a715bb84d0ed4f909720c9ec78f6e1ec20102ad73ee2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dearpygui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hoffstadt/DearPyGui
  license: MIT
  license_file: LICENSE
  summary: "DearPyGui: A simple Python GUI Toolkit"
  description: |
    DearPyGui: A simple Python GUI Toolkit

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
