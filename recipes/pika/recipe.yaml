# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pika
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/p/pika/pika-${{ version }}.tar.gz
  sha256: beb19ff6dd1547f99a29acc2c6987ebb2ba7c44bf44a3f8e305877c5ef7d2fdc
  file_name: pika-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv

requirements:
  host:
    - pip
    - python >=3.6
    - setuptools
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - pika
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pure Python RabbitMQ/AMQP 0-9-1 client library
  homepage: https://pika.readthedocs.io
  repository: https://github.com/pika/pika
  documentation: https://pika.readthedocs.io

extra:
  recipe-maintainers:
    - ltalirz
    - chrisjsewell
