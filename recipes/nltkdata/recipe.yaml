# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: nltkdata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nltkdata/nltkdata-${{ version }}.tar.gz
  sha256: 8b7bf1d927cf774bacec405de72e0e996aeb177fc3d08154a745f17b9ee0d501

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nltkdata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nltk/nltk_data
  license: Apache-2.0
  license_file: LICENSE
  summary: NLTK Data
  description: |
    NLTK Data

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nltkdata
  cfe-upstream-registry: pypi
  cfe-upstream-name: nltkdata
