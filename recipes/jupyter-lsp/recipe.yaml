# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: jupyter-lsp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-lsp/jupyter_lsp-${{ version }}.tar.gz
  sha256: fdf8a4aa7d85813976d6e29e95e6a2c8f752701f926f2715305249a3829805a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter-server >=1.1.2
    - importlib-metadata >=4.8.3

tests:
  - python:
      imports:
        - jupyter_lsp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jupyter-lsp/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Multi-Language Server WebSocket proxy for Jupyter Notebook/Lab server
  description: |
    Multi-Language Server WebSocket proxy for Jupyter Notebook/Lab server
  repository: https://github.com/jupyter-lsp/jupyterlab-lsp
  documentation: https://jupyterlab-lsp.readthedocs.io/

extra:
  recipe-maintainers:
    - bollwyvl
    - fcollonval
    - krassowski

