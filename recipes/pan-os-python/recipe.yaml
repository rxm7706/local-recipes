# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.1"

package:
  name: pan-os-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pan-os-python/pan_os_python-${{ version }}.tar.gz
  sha256: a6c03ff075749bedaaa0a297945e55435bc9ec926b09671a68309f4fa83ecc59

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - pan-python <0.18.0,>=0.17.0

tests:
  - python:
      imports:
        - panos
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/PaloAltoNetworks/pan-os-python
  license: ISC
  license_file: LICENSE
  summary: Framework for interacting with Palo Alto Networks devices via API
  description: |
    Framework for interacting with Palo Alto Networks devices via API
  repository: https://github.com/PaloAltoNetworks/pan-os-python
  documentation: https://pan-os-python.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
