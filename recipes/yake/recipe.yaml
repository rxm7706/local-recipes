# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.3"

package:
  name: yake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yake/yake-${{ version }}.tar.gz
  sha256: 8778fb2832e58d26d838d6d7ac967b4947521f1fe8cdf23dd872636161fc53ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=6.0
    - jellyfish
    - networkx
    - numpy >=1.24.0
    - segtok
    - tabulate

tests:
  - python:
      imports:
        - yake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/yake/
  license: LGPLv3
  license_file: LICENSE
  summary: Keyword extraction Python package
  description: |
    Keyword extraction Python package
  repository: https://github.com/INESCTEC/yake
  documentation: https://inesctec.github.io/yake/docs/--home

extra:
  recipe-maintainers:
    - primozgodec

#### CFE metadata AND comments
