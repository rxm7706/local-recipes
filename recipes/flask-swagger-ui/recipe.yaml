# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.32.13"

package:
  name: flask-swagger-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-swagger-ui/flask_swagger_ui-${{ version }}.tar.gz
  sha256: 90c9bdff70f8a4329db725771defe549cb32a2e775d9dd955d68e47dbe735939

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_swagger_ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sveint/flask-swagger-ui
  license: MIT
  license_file: LICENSE
  summary: Swagger UI blueprint for Flask
  description: |
    Swagger UI blueprint for Flask

extra:
  recipe-maintainers:
    - xhochy

