# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.22.post20250219"

package:
  name: mediapipe-nightly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/m/mediapipe-nightly/mediapipe_nightly-0.10.22.post20250219-cp310-cp310-manylinux_2_28_x86_64.whl
  sha256: 226ffacda09aeaa6160e0e1dd9341e8a1106567d0508ce97977acac645602036

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py
    - attrs >=19.1.0
    - flatbuffers >=2.0
    - jax
    - jaxlib
    - matplotlib-base
    - numpy <2
    - opencv-contrib-python
    - protobuf <5,>=4.25.3
    - python-sounddevice >=0.4.4
    - sentencepiece

tests:
  - python:
      imports:
        - mediapipe_nightly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/mediapipe
  license: Apache-2.0
  license_file: LICENSE
  summary: MediaPipe is the simplest way for researchers and developers to build world-class ML solutions and applications for mobile, edge, cloud and the web.
  description: |
    MediaPipe is the simplest way for researchers and developers to build world-class ML solutions and applications for mobile, edge, cloud and the web.

extra:
  recipe-maintainers:
    - rxm7706

