# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: uwsgidecorators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uwsgidecorators/uwsgidecorators-${{ version }}.tar.gz
  sha256: 92693eeed4836fa3afde2954629bd9f846ea358b965fba6a00ce365cce68f976

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uwsgidecorators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://uwsgi-docs.readthedocs.org/en/latest/PythonDecorators.html
  license: MIT
  license_file: LICENSE
  summary: uwsgidecorators standalone package
  description: |
    uwsgidecorators standalone package

extra:
  recipe-maintainers:
    - rxm7706

