# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.51.1"
  python_min: "3.11"

package:
  name: ucxx-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/u/ucxx-cu13/ucxx_cu13-0.51.1-cp311-abi3-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: c9981088c590c905afc55d0611c591bd1e65d37458885d4e582fcb971a6d0875

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-core <2,>=0.5.1
    - libucxx-cu13 ==0.51.*
    - numpy <3.0,>=2.0
    - nvidia-ml-py >=12
    - rmm-cu13 ==26.8.*

tests:
  - python:
      imports:
        - ucxx_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/ucxx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Bindings for the Unified Communication X library (UCX)
  description: |
    Python Bindings for the Unified Communication X library (UCX)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
