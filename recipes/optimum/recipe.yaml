# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"

package:
  name: optimum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/optimum/optimum-${{ version }}.tar.gz
  sha256: aa96ad535a5cec68d12c6372574125452284632fe13699633a61e8bbfb09c4df

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - transformers >=4.29
    - pytorch >=1.11
    - packaging
    - numpy
    - huggingface-hub >=0.8.0

tests:
  - python:
      imports:
        - optimum.fx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huggingface/optimum
  license: Apache-2.0
  license_file: LICENSE
  summary: Optimum Library is an extension of the Hugging Face Transformers library, providing a framework to integrate third-party libraries from Hardware Partners and interface with their specific functionality.
  description: |
    Optimum Library is an extension of the Hugging Face Transformers library, providing a framework to integrate third-party libraries from Hardware Partners and interface with their specific functionality.

extra:
  recipe-maintainers:
    - ilya-lavrenov
    - sugatoray
    - shermansiu

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: optimum
  cfe-upstream-registry: pypi
  cfe-upstream-name: optimum
  cfe-purls:
    - pkg:conda/optimum@${{ version }}?channel=conda-forge
    - pkg:pypi/optimum@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/huggingface/optimum
  cfe-import-names: [optimum.fx]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/optimum-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.3.0

  cfe-forge-blocker-list: []
