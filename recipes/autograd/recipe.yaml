# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.1"

package:
  name: autograd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autograd/autograd-${{ version }}.tar.gz
  sha256: 7818c5c69ddf9efb7da74097bd741a4c7920133f41966f68537223a15ef798bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy <3

tests:
  - python:
      imports:
        - autograd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/autograd/
  license: MIT
  license_file: LICENSE
  summary: Efficiently computes derivatives of NumPy code.
  description: |
    Efficiently computes derivatives of NumPy code.
  repository: https://github.com/HIPS/autograd

extra:
  recipe-maintainers:
    - fjosw
    - agriyakhetarpal
    - richardotis
    - ericmjl
    - benvial

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: autograd
