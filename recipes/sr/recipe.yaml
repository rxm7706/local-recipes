# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: sr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sr/sr-${{ version }}.tar.gz
  sha256: 0d359115be56328bdffb560172826e41e1c9ea58e71f33c6fba0384e96906c99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://bitbucket.org/lorien/sr/
  license: MIT
  license_file: LICENSE
  summary: Console utility for search and replace in files
  description: |
    Console utility for search and replace in files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sr
  cfe-upstream-registry: pypi
  cfe-upstream-name: sr
  cfe-purls:
    - pkg:conda/sr@${{ version }}?channel=conda-forge
    - pkg:pypi/sr@${{ version }}
  cfe-upstream-repo: http://bitbucket.org/lorien/sr/
  cfe-upstream-homepage: http://bitbucket.org/lorien/sr/
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
