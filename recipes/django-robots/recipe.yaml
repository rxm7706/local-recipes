# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-robots
  version: "6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-robots-${{ version }}.tar.gz
  sha256: f86bcc3d16d7d7c2a4e37af6063cb4785f50ae16943f82248b48c9e7ac034f1d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - django >=2.2,<5.0

tests:
  - python:
      imports:
        - robots
        - robots.migrations
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Robots exclusion application for Django, complementing Sitemaps.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/jazzband/django-robots/

extra:
  recipe-maintainers:
    - mxr-conda
    - rxm7706
