# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: spacy-lookups-data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacy-lookups-data/spacy_lookups_data-${{ version }}.tar.gz
  sha256: 6f935c81f145bdcc84fc6115f648764285c7ff3e8ff246295046814e96dad63c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - spacy_lookups_data
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://spacy.io
  license: MIT
  license_file: LICENSE
  summary: Additional lookup tables and data resources for spaCy
  description: |
    Additional lookup tables and data resources for spaCy

extra:
  recipe-maintainers:
    - conda-forge/spacy

