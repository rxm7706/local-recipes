# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.11"

package:
  name: streamlit-launchpad
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-launchpad/streamlit-launchpad-${{ version }}.tar.gz
  sha256: eb6e6ec5717791d5985fec5fa558889725f17d45417db2fe83670ba5eecd0f0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit
    - tornado
    - click

tests:
  - python:
      imports:
        - launchpad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ideonate/streamlit-launchpad
  license: MIT
  license_file: LICENSE
  summary: Web launchpad to browse a folder containing multiple Streamlit applications
  description: |
    Web launchpad to browse a folder containing multiple Streamlit applications

extra:
  recipe-maintainers:
    - rxm7706

