# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: pure-eval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pure-eval/pure_eval-${{ version }}.tar.gz
  sha256: 5f4e983f40564c576c7c8635ae88db5956bb2229d7e9237d03b3c0b0190eaf42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=41
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pure_eval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/alexmojaki/pure_eval
  license: MIT
  license_file: LICENSE.txt
  summary: Safely evaluate AST nodes without side effects
  description: |
    Safely evaluate AST nodes without side effects

extra:
  recipe-maintainers:
    - alexmojaki

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pure_eval
  cfe-upstream-registry: pypi
  cfe-upstream-name: pure-eval
  cfe-purls:
    - pkg:conda/pure_eval@${{ version }}?channel=conda-forge
    - pkg:pypi/pure-eval@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/alexmojaki/pure_eval
  cfe-import-names: [pure_eval]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pure_eval-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.2.3

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T11:16:35Z
