# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.15.9.3.3"

package:
  name: pyqt5-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pyqt5-tools/pyqt5_tools-5.15.9.3.3-py3-none-any.whl
  sha256: 4b45b26111c583a34fa364b98d7120f5aeca4f96ac72e251f1b37a9cca809f86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - pyqt
    - pyqt5-plugins
    - python-dotenv

tests:
  - python:
      imports:
        - pyqt5_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/altendky/pyqt-tools
  license: GPL-3.0-only
  license_file: LICENSE
  summary: PyQt Designer and QML plugins
  description: |
    PyQt Designer and QML plugins

extra:
  recipe-maintainers:
    - rxm7706

