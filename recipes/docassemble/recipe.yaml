# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.5"

package:
  name: docassemble
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docassemble/docassemble-${{ version }}.tar.gz
  sha256: bedff0d0da2845830b5523d6d0fc02d1283f06719bed7d1b6d1b7c1e5274b835

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - docassemble
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docassemble.org
  license: MIT
  license_file: LICENSE
  summary: The namespace package for the docassemble system.
  description: |
    The namespace package for the docassemble system.

extra:
  recipe-maintainers:
    - rxm7706

