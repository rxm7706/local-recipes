# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: py-grpc-prometheus
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/py_grpc_prometheus-${{ version }}.tar.gz
  sha256: 364311dc88aaf4e74f8664e7f2bb8471f1822fd082e0aac174f72d35213bba6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools >=39.0.1
    - grpcio >=1.10.0
    - prometheus_client >=0.3.0

tests:
  - python:
      imports:
        - py_grpc_prometheus
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python gRPC Prometheus Interceptors
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/lchenn/py-grpc-prometheus

extra:
  recipe-maintainers:
    - rxm7706
