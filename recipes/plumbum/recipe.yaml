# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: plumbum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plumbum/plumbum-${{ version }}.tar.gz
  sha256: 233751d7819c9e6743ec1c2405927eb4fa52a284c7b894bd10e28106a9309a92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - plumbum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tomerfiliba/plumbum
  license: MIT
  license_file: LICENSE
  summary: "Plumbum: shell combinators library"
  description: |
    Plumbum: shell combinators library
  documentation: https://plumbum.readthedocs.io/

extra:
  recipe-maintainers:
    - henryiii

