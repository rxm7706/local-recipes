# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: moviepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/moviepy/moviepy-${{ version }}.tar.gz
  sha256: c80cb56815ece94e5e3e2d361aa40070eeb30a09d23a24c4e684d03e16deacb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - decorator <6.0,>=4.0.2
    - imageio <3.0,>=2.5
    - imageio-ffmpeg >=0.2.0
    - numpy >=1.25.0
    - proglog <=1.0.0
    - python-dotenv >=0.10
    - pillow <12.0,>=9.2.0

tests:
  - python:
      imports:
        - moviepy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/moviepy/
  license: MIT
  license_file: LICENSE
  summary: Video editing with Python
  description: |
    Video editing with Python

extra:
  recipe-maintainers:
    - jakirkham
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
