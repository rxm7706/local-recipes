{% set name = "celery-redbeat" %}
{% set version = "2.4.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/celery_redbeat-{{ version }}.tar.gz"
  sha256: a590fef7ef39d7e4511174ce8bafe310e07ef6cdf84a240cd311946815bd90bb

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - celery >=5.0
    - python >={{ python_min }}
    - python-dateutil
    - redis-py >=3.2
    - tenacity

test:
  requires:
    - python {{ python_min }}
  imports:
    - redbeat

about:
  home: "https://github.com/sibson/redbeat"
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: "A Celery Beat Scheduler using Redis for persistent storage"
  doc_url: "https://redbeat.readthedocs.io/en/latest/"

extra:
  recipe-maintainers:
    - soapy1
