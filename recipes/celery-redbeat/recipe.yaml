# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: celery-redbeat
  version: "2.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/celery_redbeat-${{ version }}.tar.gz
  sha256: a590fef7ef39d7e4511174ce8bafe310e07ef6cdf84a240cd311946815bd90bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - celery >=5.0
    - python >=${{ python_min }}
    - python-dateutil
    - redis-py >=3.2
    - tenacity

tests:
  - python:
      imports:
        - redbeat
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A Celery Beat Scheduler using Redis for persistent storage
  homepage: https://github.com/sibson/redbeat
  documentation: https://redbeat.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - soapy1
