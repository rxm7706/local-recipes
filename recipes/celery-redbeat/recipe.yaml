# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.2"

package:
  name: celery-redbeat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/celery-redbeat/celery_redbeat-${{ version }}.tar.gz
  sha256: a590fef7ef39d7e4511174ce8bafe310e07ef6cdf84a240cd311946815bd90bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - redis-py >=3.2
    - celery >=5.0
    - python-dateutil
    - tenacity

tests:
  - python:
      imports:
        - redbeat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sibson/redbeat
  license: Apache-2.0
  license_file: LICENSE
  summary: A Celery Beat Scheduler using Redis for persistent storage
  description: |
    A Celery Beat Scheduler using Redis for persistent storage

extra:
  recipe-maintainers:
    - soapy1

