# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.293"

package:
  name: aws-cdk.asset-awscli-v1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aws-cdk.asset-awscli-v1/aws_cdk_asset_awscli_v1-${{ version }}.tar.gz
  sha256: 88b6cb34ab6dc718bba8ac29a7a1cda4a3ecb4b54fc61f8f106764b7e20892f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ~=75.3.2
    - python-build ~=1.5.0
  run:
    - python >=${{ python_min }}
    - python-jsii <2.0.0,>=1.139.0
    - publication >=0.0.3

tests:
  - python:
      imports:
        - aws_cdk.asset_awscli_v1._jsii
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cdklabs/awscdk-asset-awscli#readme
  license: Apache-2.0
  license_file: LICENSE
  summary: A library that contains the AWS CLI for use in Lambda Layers
  description: |
    A library that contains the AWS CLI for use in Lambda Layers
  repository: https://github.com/cdklabs/awscdk-asset-awscli.git

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

