# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.5"

package:
  name: sqlalchemy-mixins
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-mixins/sqlalchemy_mixins-${{ version }}.tar.gz
  sha256: 85197fc3682c4bf9c35671fb3d10282a0973b19cd2ff2b6791d601cbfb0fb89e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=2.0
    - six
    - typing

tests:
  - python:
      imports:
        - sqlalchemy_mixins
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/absent1706/sqlalchemy-mixins
  license: MIT
  license_file: LICENSE
  summary: Active Record, Django-like queries, nested eager load and beauty __repr__ for SQLAlchemy
  description: |
    Active Record, Django-like queries, nested eager load and beauty __repr__ for SQLAlchemy

extra:
  recipe-maintainers:
    - rxm7706

