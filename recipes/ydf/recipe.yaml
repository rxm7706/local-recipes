# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.1"

package:
  name: ydf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/y/ydf/ydf-0.16.1-cp310-cp310-macosx_12_0_arm64.whl
  sha256: a3f37401323f37ebe251d6ffbc7b9f6096d6ede9b1f8d30cb4e6babc0c7300b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - absl-py
    - protobuf <8.0.0,>=6.31.1

tests:
  - python:
      imports:
        - ydf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/yggdrasil-decision-forests
  license: Apache-2.0
  license_file: LICENSE
  summary: YDF (short for Yggdrasil Decision Forests) is a library for training, serving, evaluating and analyzing decision forest models such as Random Forest and Gradient Boosted Trees.
  description: |
    YDF (short for Yggdrasil Decision Forests) is a library for training, serving, evaluating and analyzing decision forest models such as Random Forest and Gradient Boosted Trees.
  repository: https://github.com/google/yggdrasil-decision-forests.git
  documentation: https://ydf.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

