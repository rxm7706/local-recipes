# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: kutil
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kutil/kutil-${{ version }}.tar.gz
  sha256: 42b5f5797def3f5a3223a9bc9fd26ff7449e05760778d8e483318a733a7db884

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kutil
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/qtc-de/kutil
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A command line utility to work with Kerberos credential caches (MIT format)
  description: |
    A command line utility to work with Kerberos credential caches (MIT format)

extra:
  recipe-maintainers:
    - rxm7706

