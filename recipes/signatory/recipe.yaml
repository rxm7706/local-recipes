# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.6.1.9.0"

package:
  name: signatory
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/signatory/signatory-${{ version }}.tar.gz
  sha256: c9ab17df6286688c1c7b12c0e906031a1fe7681dfca551876c1ff616e12807d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - torch

tests:
  - python:
      imports:
        - signatory
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/patrick-kidger/signatory
  license: Apache-2.0
  license_file: LICENSE
  summary: Differentiable computations of the signature and logsignature transforms, on both CPU and GPU.
  description: |
    Differentiable computations of the signature and logsignature transforms, on both CPU and GPU.

extra:
  recipe-maintainers:
    - rxm7706

