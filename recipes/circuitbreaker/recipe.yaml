# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.3"

package:
  name: circuitbreaker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/circuitbreaker/circuitbreaker-${{ version }}.tar.gz
  sha256: 1a4baee510f7bea3c91b194dcce7c07805fe96c4423ed5594b75af438531d084

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - circuitbreaker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fabfuel/circuitbreaker
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python Circuit Breaker pattern implementation
  description: |
    Python Circuit Breaker pattern implementation

extra:
  recipe-maintainers:
    - manics

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: circuitbreaker
  cfe-upstream-registry: pypi
  cfe-upstream-name: circuitbreaker
