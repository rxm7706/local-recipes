    - pkg:conda/circuitbreaker@${{ version }}?channel=conda-forge
    - pkg:pypi/circuitbreaker@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/fabfuel/circuitbreaker
  cfe-import-names: [circuitbreaker]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/circuitbreaker-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.1.3

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

