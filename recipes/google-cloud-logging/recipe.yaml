# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.16.2"

package:
  name: google-cloud-logging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-logging/google_cloud_logging-${{ version }}.tar.gz
  sha256: d65044004d3a2ae6eced1f0118f0c44dc551872ddb837ba815f75d159ca148c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - google-cloud-appengine-logging <2.0.0,>=1.6.1
    - google-cloud-audit-log <1.0.0,>=0.3.2
    - google-cloud-core <3.0.0,>=2.0.0
    - grpc-google-iam-v1 <1.0.0,>=0.14.2
    - opentelemetry-api >=1.16.0
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.logging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-logging
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Logging API client library
  description: |
    Google Cloud Logging API client library

extra:
  recipe-maintainers:
    - parthea
    - xylar

