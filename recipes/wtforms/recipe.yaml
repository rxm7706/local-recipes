    - pkg:pypi/wtforms@${{ version }}
  cfe-upstream-repo: https://github.com/pallets-eco/wtforms/
  cfe-upstream-homepage: https://pypi.org/project/WTForms/
  cfe-import-names: [wtforms]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
