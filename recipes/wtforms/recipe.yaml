# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: wtforms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WTForms/wtforms-${{ version }}.tar.gz
  sha256: 7b00c73f8670f35d4edb0293dcd81b980528bee72fd662b182aaba27ae570b93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - babel
    - markupsafe >=1.1.1

tests:
  - python:
      imports:
        - wtforms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/WTForms/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Form validation and rendering for Python web development.
  description: |
    Form validation and rendering for Python web development.
  repository: https://github.com/pallets-eco/wtforms/
  documentation: https://wtforms.readthedocs.io

extra:
  recipe-maintainers:
    - mcs07
    - synapticarbors
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wtforms
  cfe-upstream-registry: pypi
  cfe-upstream-name: wtforms
