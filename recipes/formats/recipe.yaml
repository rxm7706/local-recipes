# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: formats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/formats/formats-${{ version }}.tar.gz
  sha256: feb7e3d268d7a4182872f739f7a1af833032c624ddd3121741c47ac37b94385d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - formats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/redodo/formats
  license: MIT
  license_file: LICENSE
  summary: Support multiple formats with ease
  description: |
    Support multiple formats with ease

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: formats
  cfe-upstream-registry: pypi
  cfe-upstream-name: formats
  cfe-purls:
