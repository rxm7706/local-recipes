# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: fast-langdetect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fast-langdetect/fast_langdetect-${{ version }}.tar.gz
  sha256: 22c651bf576aff3cb90edf070071f256996eabe612111ea9ced5b935e4376413

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - robust-downloader >=0.0.2
    - requests >=2.32.3
    - fasttext-predict >=0.9.2.4

tests:
  - python:
      imports:
        - fast_langdetect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fast-langdetect/
  license: MIT
  license_file: LICENSE
  summary: Quickly detect text language and segment language
  description: |
    Quickly detect text language and segment language

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
