# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: vsphere-automation-sdk-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vsphere-automation-sdk-python/vsphere-automation-sdk-python-${{ version }}.tar.gz
  sha256: a5b5b2d64a7008eb2c72872916112341bb0d5080e725e201145bb1367e59c2cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vsphere_automation_sdk_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/vsphere-automation-sdk-python
  license: MIT
  license_file: LICENSE
  summary: vsphere-automation-sdk-python
  description: |
    vsphere-automation-sdk-python

extra:
  recipe-maintainers:
    - rxm7706

