    - pkg:pypi/jaydebeapi@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/baztian/jaydebeapi
  cfe-import-names: [jaydebeapi]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/jaydebeapi-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.2.3

  cfe-forge-blocker-list:
