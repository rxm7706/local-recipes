# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: jaydebeapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/JayDeBeApi/JayDeBeApi-${{ version }}.tar.gz
  sha256: f25e9307fbb5960cb035394c26e37731b64cc465b197c4344cee85ec450ab92f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jpype1

tests:
  - python:
      imports:
        - jaydebeapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/baztian/jaydebeapi
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Use JDBC database drivers from Python 2/3 or Jython with a DB-API.
  description: |
    Use JDBC database drivers from Python 2/3 or Jython with a DB-API.

extra:
  recipe-maintainers:
    - sodre
    - scopatz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jaydebeapi
  cfe-upstream-registry: pypi
  cfe-upstream-name: jaydebeapi
