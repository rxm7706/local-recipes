# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: langchain-mongodb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-mongodb/langchain_mongodb-${{ version }}.tar.gz
  sha256: db483f12e8a4fdbbcfb0594881962fd1f0afcb38a3d42ee0d5fe8a2be20e1e86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >1.24
  run:
    - python >=${{ python_min }}
    - langchain-classic >=1.0
    - langchain-core >=1.2.5
    - langchain-text-splitters >=1.0
    - langchain >=1.0
    - lark <2.0.0,>=1.1.9
    - numpy >=1.26
    - pymongo-search-utils >=0.2.1
    - pymongo >=4.6.1

tests:
  - python:
      imports:
        - langchain_mongodb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langchain-mongodb/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: An integration package connecting MongoDB and LangChain
  description: |
    An integration package connecting MongoDB and LangChain

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
