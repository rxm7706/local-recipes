# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: matplotlib-venn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/matplotlib-venn/matplotlib-venn-${{ version }}.tar.gz
  sha256: 6f2b07a03e9bb5a62de2f32f965216739e175176f9d654dd19e7af2c22ec36e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scipy
    - matplotlib
    - numpy

tests:
  - python:
      imports:
        - matplotlib_venn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/konstantint/matplotlib-venn
  license: MIT
  license_file: LICENSE
  summary: Functions for plotting area-proportional two- and three-way Venn diagrams in matplotlib.
  description: |
    Functions for plotting area-proportional two- and three-way Venn diagrams in matplotlib.

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

#### CFE metadata AND comments
