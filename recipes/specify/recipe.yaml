# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.9"

package:
  name: specify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/specify/specify-${{ version }}.tar.gz
  sha256: 57d7a7d452c1fdbf208f4bd37e55eddeab8fb139b46ba491ec2fad04a07285cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - prophepy

tests:
  - python:
      imports:
        - specify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/specify/
  license: MIT
  license_file: LICENSE
  summary: A spec tool to describe your classes
  description: |
    A spec tool to describe your classes

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: specify
  cfe-upstream-registry: pypi
  cfe-upstream-name: specify
  cfe-purls:
    - pkg:conda/specify@${{ version }}?channel=conda-forge
    - pkg:pypi/specify@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/specify/
  cfe-upstream-homepage: https://pypi.org/project/specify/
  cfe-import-names: [specify]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
