# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.2"

package:
  name: dtreeviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dtreeviz/dtreeviz-${{ version }}.tar.gz
  sha256: d8413a01373237150fcccb763e469384fbd055a627517d77dbb0190a1403f059

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-graphviz >=0.9
    - pandas
    - numpy
    - scikit-learn
    - matplotlib-base
    - colour

tests:
  - python:
      imports:
        - dtreeviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/parrt/dtreeviz
  license: MIT
  license_file: LICENSE
  summary: A Python 3 library for sci-kit learn, XGBoost, LightGBM, Spark, and TensorFlow decision tree visualization
  description: |
    A Python 3 library for sci-kit learn, XGBoost, LightGBM, Spark, and TensorFlow decision tree visualization

extra:
  recipe-maintainers:
    - raybellwaves
    - pplonski
    - m-rossi

