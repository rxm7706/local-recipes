# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# deprioritize with_icu variant via build number
schema_version: 1

context:
  version: "3.53.4"
  year: 2026
  version_split: ${{ version | split(".") }}
  major: ${{ version_split[0] }}
  minor: ${{ version_split[1]|int * 10 }}
  bugfix: ${{ version_split[2]|int * 100 }}
  version_coded: (major ~ (("%03d" % minor)|string) ~ (("%03d" % bugfix)|string))

recipe:
  name: sqlite-split
  version: ${{ version }}

source:
  url: https://www.sqlite.org/${{ year }}/sqlite-autoconf-${{ version_coded }}.tar.gz
  sha256: 0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c

build:
  number: ${{ build_number }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: not win
      then: make
  host:
    - if: with_icu
      then: icu
    - if: not win
      then: ncurses
    - if: not win
      then: readline
    - if: not win
      then: zlib
  run_constraints:
    - if: not with_icu and not win
      then: icu <0.0a0

outputs:
  - package:
      name: libsqlite
    files:
      - if: unix
        then: lib/libsqlite*
      - if: unix
        then: include/sqlite*.h
      - if: unix
        then: lib/pkgconfig/sqlite3.pc
      - if: win
        then: Library\bin\sqlite3.dll
      - if: win
        then: Library\lib\sqlite3.lib
      - if: win
        then: Library\include\sqlite*.h
      - if: win
        then: Library\lib\pkgconfig\sqlite3.pc
    build:
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: not win
          then: make
      host:
        # readline and ncurses are only required by the executable
        # not the library. Leaving it out of the host requirements
        # ensures it doesn't appear in the run section (through run_export)
        - if: with_icu
          then: icu
        - if: not win
          then: zlib
      run_exports:
        - ${{ pin_subpackage('libsqlite') }}
    tests:
      - script:
          - if: not win
            then: test -f $PREFIX/lib/libsqlite3${SHLIB_EXT}
          - if: not win
            then: test ! -f $PREFIX/lib/libsqlite3.a
          - if: not win
            then: test -f $PREFIX/include/sqlite3.h
          - if: not win
            then: test -f $PREFIX/include/sqlite3ext.h
          - if: not win
            then: test -f $PREFIX/lib/pkgconfig/sqlite3.pc
          - if: win
            then: if not exist %PREFIX%\\Library\bin\sqlite3.dll exit 1
          - if: win
            then: if not exist %PREFIX%\\Library\lib\sqlite3.lib exit 1
          - if: win
            then: if not exist %PREFIX%\\Library\include\sqlite3.h exit 1
          - if: win
            then: if not exist %PREFIX%\\Library\include\sqlite3ext.h exit 1
          - if: win
            then: if not exist %PREFIX%\\Library\lib\pkgconfig\sqlite3.pc exit 1
  - package:
      name: sqlite
    files:
      - if: unix
        then: bin/sqlite3
      - if: win
        then: Library\bin\sqlite3.exe
    build:
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: not win
          then: make
      host:
        - if: with_icu
          then: icu
        - if: not win
          then: ncurses
        - if: not win
          then: readline
        - if: not win
          then: zlib
      run:
        - ${{ pin_subpackage('libsqlite', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libsqlite') }}
    tests:
      - script:
          - sqlite3 --version
          - if: not win
            then: echo "PRAGMA compile_options;" | sqlite3
          - if: win
            then: echo PRAGMA compile_options; | sqlite3

about:
  license: blessing
  summary: Implements a self-contained, zero-configuration, SQL database engine
  description: |
    SQLite is a self-contained, high-reliability, embedded, full-featured,
    public-domain, SQL database engine.It is the most used database engine
    in the world.
  homepage: http://www.sqlite.org/
  repository: https://github.com/mackyle/sqlite
  documentation: http://www.sqlite.org/docs.html

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - ocefpaf
    - mingwandroid
    - flaviomartins
