# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0.dev20260816"

package:
  name: ai-edge-quantizer-nightly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ai-edge-quantizer-nightly/ai_edge_quantizer_nightly-${{ version }}.tar.gz
  sha256: 90ca1f519157c1334b2c3414e0379c7cd00a4caf1afb910d4ac91391a0ee9525

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - absl-py
    - immutabledict
    - numpy
    - scipy
    - ml-dtypes
    - ai-edge-litert-nightly
    - litert-lm-builder

tests:
  - python:
      imports:
        - ai_edge_quantizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google-ai-edge/ai-edge-quantizer
  license: Apache-2.0
  license_file: LICENSE
  summary: A quantizer for advanced developers to quantize converted AI Edge models.
  description: |
    A quantizer for advanced developers to quantize converted AI Edge models.

extra:
  recipe-maintainers:
    - rxm7706

