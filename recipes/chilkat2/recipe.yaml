# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "11.5.0"

package:
  name: chilkat2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/c/chilkat2/chilkat2-11.5.0-cp310-cp310-macosx_10_14_x86_64.whl
  sha256: 771c07cb99d1445b7005e9383c702e005b0e837ee44a402df991fb587a9ef278

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chilkat2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.chilkatsoft.com
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Chilkat2 Python Module
  description: |
    Chilkat2 Python Module
  documentation: https://www.chilkatsoft.com/refdoc/python.asp

extra:
  recipe-maintainers:
    - rxm7706

