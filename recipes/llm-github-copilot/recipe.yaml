# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: llm-github-copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llm-github-copilot/llm_github_copilot-${{ version }}.tar.gz
  sha256: 369974427ca535125c74ed42c51ab2c7ae06f544b461bf111ec53fd5d4ba5717

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - llm
    - httpx

tests:
  - python:
      imports:
        - llm_github_copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jmdaly/llm-github-copilot
  license: Apache-2.0
  license_file: LICENSE
  summary: GitHub Copilot plugin for LLM CLI tool
  description: |
    GitHub Copilot plugin for LLM CLI tool

extra:
  recipe-maintainers:
    - rxm7706

