# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: all-minilm-l6-v2-model
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/all-minilm-l6-v2-model/all_minilm_l6_v2_model-${{ version }}.tar.gz
  sha256: 3d02964d9926a1f0077d3ddb643e8800c78470e8f952b3368ab3cde225637fcf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - sentence-transformers
    - pandas
    - matplotlib-base
    - tqdm

tests:
  - python:
      imports:
        - all_minilm_l6_v2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/all-minilm-l6-v2-model/
  license: MIT
  license_file: LICENSE
  summary: all-MiniLM-L6-v2 sentence transformer model packaged for PyPI distribution
  description: |
    all-MiniLM-L6-v2 sentence transformer model packaged for PyPI distribution

extra:
  recipe-maintainers:
    - rxm7706

