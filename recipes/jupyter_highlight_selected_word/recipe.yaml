# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: jupyter_highlight_selected_word
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter_highlight_selected_word/jupyter_highlight_selected_word-${{ version }}.tar.gz
  sha256: 9fa740424859a807950ca08d2bfd28a35154cd32dd6d50ac4e0950022adc0e7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyter_highlight_selected_word
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jcb91/jupyter_highlight_selected_word.git
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Jupyter notebook extension that enables highlighting every instance of the current word in the notebook.
  description: |
    Jupyter notebook extension that enables highlighting every instance of the current word in the notebook.

extra:
  recipe-maintainers:
    - jcb91
    - ocefpaf
    - xhochy

