# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: with
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/with/with-${{ version }}.tar.gz
  sha256: c12a4221efde312785565d1e84ea4de6423c00f5b50ce4de8fa8fda981491ef0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - appdirs
    - docopt
    - prompt-toolkit
    - python-slugify

tests:
  - python:
      imports:
        - withtool
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/renanivo/with
  license: MIT
  license_file: LICENSE
  summary: A shell context manager
  description: |
    A shell context manager

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: with
  cfe-upstream-registry: pypi
  cfe-upstream-name: with
  cfe-purls:
    - pkg:conda/with@${{ version }}?channel=conda-forge
    - pkg:pypi/with@${{ version }}
  cfe-upstream-repo: https://github.com/renanivo/with
  cfe-upstream-homepage: https://github.com/renanivo/with
  cfe-import-names: [withtool]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
