# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: matcher
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/matcher/matcher-${{ version }}.tar.gz
  sha256: fa3214f0fe8b4e67258b33e3df43afa7c0aab77307f9ef914743b1284135fae8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - matcher
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/afrieder/matcher
  license: MIT
  license_file: LICENSE
  summary: A simple functional, type-safe pattern matcher in Python
  description: |
    A simple functional, type-safe pattern matcher in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
