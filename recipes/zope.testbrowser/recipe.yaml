# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0"

package:
  name: zope.testbrowser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.testbrowser/zope_testbrowser-${{ version }}.tar.gz
  sha256: 35175e97be098cc4f8357ef83fbb5f3280e0e2400e8ea30b0e7e8533dd3d150d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.schema
    - zope.cachedescriptors
    - pytz
    - webtest >=2.0.30
    - beautifulsoup4
    - soupsieve >=1.9.0
    - wsgiproxy2
    - legacy-cgi

tests:
  - python:
      imports:
        - zope.testbrowser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.testbrowser
  license: ZPL-2.1
  license_file: LICENSE.rst
  summary: Programmable browser for functional black-box tests
  description: |
    Programmable browser for functional black-box tests
  documentation: https://zopetestbrowser.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
