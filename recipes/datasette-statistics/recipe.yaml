# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: datasette-statistics
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/datasette-statistics-${{ version }}.tar.gz
  sha256: 4bc1f8ccbd0ff106527d3435dc1bf9daba7f952ba4022cfe21cdf4f8e7f010b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8
    - datasette

tests:
  - python:
      imports:
        - datasette_statistics
      pip_check: true

about:
  summary: SQL statistics functions for Datasette
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/datasette-statistics

extra:
  recipe-maintainers:
    - rxm7706
