# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.2"

package:
  name: seaborn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/seaborn/seaborn-${{ version }}.tar.gz
  sha256: 93e60a40988f4d65e9f4885df477e2fdaff6b73a9ded434c1ab356dd57eefff7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - numpy >=1.20,!=1.24.0
    - pandas >=1.2
    - matplotlib-base >=3.4,!=3.6.1

tests:
  - python:
      imports:
        - seaborn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/seaborn/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Statistical data visualization
  description: |
    Statistical data visualization
  repository: https://github.com/mwaskom/seaborn
  documentation: http://seaborn.pydata.org

extra:
  recipe-maintainers:
    - msarahan
    - r-jain1
    - croth1

#### CFE metadata AND comments
# CFE metadata
