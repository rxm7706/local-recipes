# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.2"
  build: 3

recipe:
  name: seaborn-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/seaborn/seaborn-${{ version }}.tar.gz
  sha256: 93e60a40988f4d65e9f4885df477e2fdaff6b73a9ded434c1ab356dd57eefff7

build:
  number: ${{ build }}
  noarch: python

outputs:
  - package:
      name: seaborn-base
    build:
      noarch: python
      script:
        file: ${{ 'build_base.sh' if not win else 'build_base.bat' if win else '' }}
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - flit-core >=3.2,<4
      run:
        - python >=${{ python_min }}
        - numpy >=1.20,!=1.24.0
        - matplotlib-base >=3.4,!=3.6.1
        - scipy >=1.7
        - pandas >=1.2
      test:
        requires:
          - python ${{ python_min }}
        imports:
          - seaborn
      run_constraints:
        - seaborn =${{ version }}=*_${{ build }}
  - package:
      name: seaborn
    build:
      noarch: python
    requirements:
      run:
        - statsmodels >=0.12
        - ${{ pin_subpackage('seaborn-base', exact=True) }}

tests:
  - python:
      imports:
        - seaborn
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: Statistical data visualization
  description: |
    Seaborn is a Python visualization library based on matplotlib. It
    provides a high-level interface for drawing attractive statistical graphics.
  homepage: https://seaborn.pydata.org
  repository: https://github.com/mwaskom/seaborn
  documentation: https://seaborn.pydata.org

extra:
  feedstock-name: seaborn
  recipe-maintainers:
    - msarahan
    - r-jain1
    - croth1
