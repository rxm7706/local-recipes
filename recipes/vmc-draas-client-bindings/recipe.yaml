schema_version: 1

context:
  version: "0.0.1"

package:
  name: vmc-draas-client-bindings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmc-draas-client-bindings/vmc-draas-client-bindings-${{ version }}.tar.gz
  sha256: 7dd122a54fed656c052449d605c161dfc811130713c9db4e403c23c48ba25249

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vmc_draas_client_bindings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmware/vsphere-automation-sdk-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: vmc-draas-client-bindings
  description: |
    vmc-draas-client-bindings

extra:
  recipe-maintainers:
    - rxm7706

