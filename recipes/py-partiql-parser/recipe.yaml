# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.3"

package:
  name: py-partiql-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-partiql-parser/py_partiql_parser-${{ version }}.tar.gz
  sha256: 09cecf916ce6e3da2c050f0cb6106166de42c33d34a078ec2eb19377ea70389a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - py_partiql_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/getmoto/py-partiql-parser
  license: MIT
  license_file: LICENSE
  summary: Pure Python PartiQL Parser
  description: |
    Pure Python PartiQL Parser

extra:
  recipe-maintainers:
    - rxm7706

