# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: urlparse4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/urlparse4/urlparse4-${{ version }}.tar.gz
  sha256: ac0e9869b96a162ceeb175200d4c2f947c42991cfc2d53b8030748facbf8f791

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - urlparse4
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/commonsearch/urlparse4
  license: Apache-2.0
  license_file: LICENSE
  summary: Performance-focused replacement for Python's urlparse module
  description: |
    Performance-focused replacement for Python's urlparse module

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: urlparse4
  cfe-upstream-registry: pypi
  cfe-upstream-name: urlparse4
