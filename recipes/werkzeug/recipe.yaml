# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.8"

package:
  name: werkzeug
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/Werkzeug/werkzeug-${{ version }}.tar.gz
  sha256: 9bad61a4268dac112f1c5cd4630a56ede601b6ed420300677a869083d70a4c44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - markupsafe >=2.1.1

tests:
  - python:
      imports:
        - werkzeug
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Werkzeug/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: The comprehensive WSGI web application library.
  description: |
    The comprehensive WSGI web application library.
  repository: https://github.com/pallets/werkzeug/
  documentation: https://werkzeug.palletsprojects.com/

extra:
  recipe-maintainers:
    - goanpeca
    - bollwyvl

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: werkzeug
