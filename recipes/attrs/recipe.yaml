# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.1.0"

package:
  name: attrs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/attrs/attrs-${{ version }}.tar.gz
  sha256: d03ceb89cb322a8fd706d4fb91940737b6642aa36998fe130a9bc96c985eff32

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme >=23.2.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - attr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/attrs/
  license: MIT
  license_file: LICENSE
  summary: Classes Without Boilerplate
  description: |
    Classes Without Boilerplate
  repository: https://github.com/python-attrs/attrs
  documentation: https://www.attrs.org/

extra:
  recipe-maintainers:
    - CJ-Wright
    - licode
    - nicoddemus
    - jochym

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: attrs
  cfe-upstream-registry: pypi
  cfe-upstream-name: attrs
