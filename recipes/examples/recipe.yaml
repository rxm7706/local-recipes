# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: examples
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/examples/examples-${{ version }}.tar.gz
  sha256: f29ba443f158bb47913ac21f098306a9749ed459a2290540ff1f86baac074597

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - pydantic

tests:
  - python:
      imports:
        - examples
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/examples/
  license: MIT
  license_file: LICENSE
  summary: Tests and Documentation Done by Example.
  description: |
    Tests and Documentation Done by Example.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: examples
  cfe-upstream-registry: pypi
  cfe-upstream-name: examples
