# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: conllu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conllu/conllu-${{ version }}.tar.gz
  sha256: bc6072d49d00e77f4454039519118c0500fafa0d0eb509f53793081084f50aba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - conllu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/EmilStenstrom/conllu/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CoNLL-U Parser parses a CoNLL-U formatted string into a nested python dictionary
  description: |
    CoNLL-U Parser parses a CoNLL-U formatted string into a nested python dictionary

extra:
  recipe-maintainers:
    - nelson-liu

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: conllu
  cfe-upstream-registry: pypi
  cfe-upstream-name: conllu
  cfe-purls:
    - pkg:conda/conllu@${{ version }}?channel=conda-forge
    - pkg:pypi/conllu@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/EmilStenstrom/conllu/
  cfe-import-names: [conllu]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/conllu-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-6.0.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T07:14:20Z
