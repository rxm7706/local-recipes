# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.8"

package:
  name: aesedb
  version: ${{ version }}

source:
  url: https://github.com/skelsec/aesedb/archive/refs/tags/${{ version }}.tar.gz
  sha256: bdd11c6c47097f71e1a165f5695351e65f5572566bd239348db39a629d68007f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - unicrypto >=0.0.12
    - aiowinreg >=0.0.13
    - tqdm
    - colorama

tests:
  - python:
      imports:
        - aesedb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/aesedb
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: NTDS parser toolkit
  description: |
    NTDS parser toolkit

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aesedb
