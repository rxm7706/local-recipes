{% set name = "model_bakery" %}
{% set version = "1.24.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6469223c9fb0eccb021d5c33667b914e9208dd2282d7dc1e55394c2310a7687d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - uv-build >=0.9.26,<0.12.0
  run:
    - django >=1.11.0
    - python >={{ python_min }}

test:
  imports:
    - model_bakery
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/model-bakers/model_bakery
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Smart object creation facility for Django.
  doc_url: https://pypi.org/project/model-bakery/
  dev_url: https://github.com/model-bakers/model_bakery

extra:
  recipe-maintainers:
    - mxr-conda
    - bubblyorca
    - soapy1
