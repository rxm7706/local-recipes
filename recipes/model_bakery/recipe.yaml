# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.24.0"

package:
  name: model-bakery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/model-bakery/model_bakery-${{ version }}.tar.gz
  sha256: 6469223c9fb0eccb021d5c33667b914e9208dd2282d7dc1e55394c2310a7687d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.26,<0.12.0
  run:
    - python >=${{ python_min }}
    - django >=5.2

tests:
  - python:
      imports:
        - model_bakery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/model-bakers/model_bakery
  license: Apache-2.0
  license_file: LICENSE
  summary: Smart object creation facility for Django.
  description: |
    Smart object creation facility for Django.

extra:
  recipe-maintainers:
    - mxr-conda
    - bubblyorca
    - soapy1

