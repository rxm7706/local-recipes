# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0a5.dev0"

package:
  name: distutils2-py3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/Distutils2-py3/Distutils2-py3-${{ version }}.tar.gz
  sha256: 0738a3d5e4f337a4ba96380e432a20d89473a9cb9a7b5f8fd6282077c73af665

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distutils2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://wiki.python.org/moin/Distutils2
  license: PSF-2.0
  license_file: LICENSE
  summary: Python Packaging Library
  description: |
    Python Packaging Library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
