# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0"

package:
  name: chromium
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chromium/chromium-${{ version }}.tar.gz
  sha256: dfed04f56ab56721c1e05c77a97a79ad1b88be44c222eb1f7ffbd6fff54e1e72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chromium
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://matematikk.as
  license: MIT
  license_file: LICENSE
  summary: A hobby project
  description: |
    A hobby project

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
