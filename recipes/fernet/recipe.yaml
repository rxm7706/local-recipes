# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: fernet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fernet/fernet-${{ version }}.tar.gz
  sha256: c50a51c997e09199695b51761bdc090ccf4129917520681e69dcfff4355325c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fernet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/oz123/python-fernet
  license: MIT
  license_file: LICENSE
  summary: A simple python fernet implementation
  description: |
    A simple python fernet implementation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
