# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.1"

package:
  name: pytorch_optimizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytorch_optimizer/pytorch_optimizer-${{ version }}.tar.gz
  sha256: c262319cc3ae7be9f591e8728f1883d3096b9d7e15bea358b4ca20dd848c6d2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - numpy <=1.24.4
    - pytorch <2.5,>=1.10

tests:
  - python:
      imports:
        - pytorch_optimizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytorch_optimizer/
  license: Apache-2.0
  license_file: LICENSE
  summary: optimizer & lr scheduler & objective function collections in PyTorch
  description: |
    optimizer & lr scheduler & objective function collections in PyTorch

extra:
  recipe-maintainers:
    - rxm7706

