# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.3"

package:
  name: pytest-benchmark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-benchmark/pytest_benchmark-${{ version }}.tar.gz
  sha256: deb7317998a23c650fd4ff76e1230066a76cb45dcece0aca5607143c619e7779

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80
  run:
    - python >=${{ python_min }}
    - pytest >=8.1
    - py-cpuinfo

tests:
  - python:
      imports:
        - pytest_benchmark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-benchmark/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A ``pytest`` fixture for benchmarking code. It will group the tests into rounds that are calibrated to the chosen timer.
  description: |
    A ``pytest`` fixture for benchmarking code. It will group the tests into rounds that are calibrated to the chosen timer.
  documentation: https://pytest-benchmark.readthedocs.io/

extra:
  recipe-maintainers:
    - astrojuanlu
    - esloch

