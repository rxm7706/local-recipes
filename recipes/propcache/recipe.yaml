# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: propcache
  version: "0.5.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/propcache-${{ version }}.tar.gz
  sha256: 01c4fc7480cd0598bb4b57022df55b9ca296da7fc5a8760bd8451a7e63a7d427

build:
  number: 0
  noarch: ${{ 'python' if use_noarch else '' }}
  script:
    - if: not use_noarch
      then: ${{ PYTHON }} -m pip install . --no-deps -vv
    - if: use_noarch
      then: ${{ PYTHON }} -m pip install . --no-deps -vv  --config-settings=pure-python=true
  track_features:  # [use_noarch]
    - if: use_noarch
      then: propcache_no_compile

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
  host:
    - if: use_noarch
      then: python ${{ python_min }}
    - if: not use_noarch
      then: python
    - expandvars
    - setuptools >=47
    - tomli
    - cython
    - pip
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
    - if: not use_noarch
      then: python

tests:
  - python:
      imports:
        - propcache
      pip_check: true

about:
  summary: Accelerated property cache
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/aio-libs/propcache

extra:
  recipe-maintainers:
    - xhochy
