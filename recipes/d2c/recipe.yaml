# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.0"

package:
  name: d2c
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/d2c/D2C-${{ version }}.tar.gz
  sha256: 1f17991dd90196c74aaf460566975b37cb96f0e76bcb3d1f86fb51edfba36a4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - d2c
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/d2c/
  license: MIT
  license_file: LICENSE
  summary: Convert discrete dislocation data to continuous fields.
  description: |
    Convert discrete dislocation data to continuous fields.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
