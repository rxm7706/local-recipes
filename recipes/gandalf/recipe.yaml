# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: gandalf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/gandalf/gandalf-0.1.4-py3-none-any.whl
  sha256: b5c3349bfdf9356f471bd0a46fd22f83e86ab86fd40bf429ae4bd3a8be91a36b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gandalf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://infrascloudy.io/
  license: MIT
  license_file: LICENSE
  summary: Blazingly fast & beautifully expressive Web Apps and APIs
  description: |
    Blazingly fast & beautifully expressive Web Apps and APIs

extra:
  recipe-maintainers:
    - rxm7706

