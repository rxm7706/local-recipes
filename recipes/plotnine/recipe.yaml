# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.8"

package:
  name: plotnine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plotnine/plotnine-${{ version }}.tar.gz
  sha256: d3859997c3abd6edff6dee376d912716e75bbe0b0099b7054176d84fe11e8e20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.8.0
    - pandas >=2.2.0
    - mizani ~=0.14.0
    - numpy >=1.23.5
    - scipy >=1.8.0

tests:
  - python:
      imports:
        - plotnine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://plotnine.readthedocs.io/en/stable
  license: MIT
  license_file: LICENSE
  summary: A Grammar of Graphics for Python
  description: |
    A Grammar of Graphics for Python

extra:
  recipe-maintainers:
    - pmlandwehr
    - has2k1

