# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: plotnine
  version: "0.15.8"
  bundle: tar.gz
  hash: d3859997c3abd6edff6dee376d912716e75bbe0b0099b7054176d84fe11e8e20
  python_min: "3.10"
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: ${{ build }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.8.0
    - pandas >=2.2.0
    - mizani >=0.14.0,<0.15.0
    - numpy >=1.23.5
    - scipy >=1.8.0
    - statsmodels >=0.14.6

tests:
  - python:
      imports:
        - plotnine
        - plotnine.coords
        - plotnine.data
        - plotnine.facets
        - plotnine.geoms
        - plotnine.guides
        - plotnine.mapping
        - plotnine.positions
        - plotnine.scales
        - plotnine.stats
        - plotnine.themes
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
        - pyproject.toml
    requirements:
      run:
        - python ${{ python_min }}
        - pip
        - pytest
        - pytest-cov
    script:
      - pip list | grep -i ${{ name }} | grep ${{ version }}
      - echo $PWD
      - ls -larth

about:
  license_file: ${{ RECIPE_DIR }}/LICENSE
  license: MIT
  summary: A grammar of graphics for python
  homepage: https://github.com/has2k1/plotnine
  repository: https://github.com/has2k1/plotnine
  documentation: https://plotnine.org

extra:
  recipe-maintainers:
    - pmlandwehr
    - has2k1
