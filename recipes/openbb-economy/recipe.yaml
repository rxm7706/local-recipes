# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.2"

package:
  name: openbb-economy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-economy/openbb_economy-${{ version }}.tar.gz
  sha256: adbc4a7e46fb8502b05a3bbea03b0551879f89c977487734b7c3b26b2e1341dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-core <2.0.0,>=1.6.10

tests:
  - python:
      imports:
        - openbb_economy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-economy/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Economy extension for OpenBB
  description: |
    Economy extension for OpenBB

extra:
  recipe-maintainers:
    - rxm7706

