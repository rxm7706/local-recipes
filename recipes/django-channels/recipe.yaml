# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: django-channels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-channels/django-channels-${{ version }}.tar.gz
  sha256: c8bc623df4a7828c2e5ea453d0d0f066ff9b71b8c7c1a58b2f7fa86bc0bd619e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - channels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ymyzk/django-channels
  license: MIT
  license_file: LICENSE
  summary: A Django library for sending notifications
  description: |
    A Django library for sending notifications

extra:
  recipe-maintainers:
    - rxm7706

