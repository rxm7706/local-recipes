# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.9.6"

package:
  name: logging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logging/logging-${{ version }}.tar.gz
  sha256: 26f6b50773f085042d301085bd1bf5d9f3735704db9f37c1ce6d8b85c38f2417

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.red-dove.com/python_logging.html
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A logging module for Python
  description: |
    A logging module for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: logging
  cfe-upstream-registry: pypi
  cfe-upstream-name: logging
  cfe-purls:
    - pkg:conda/logging@${{ version }}?channel=conda-forge
    - pkg:pypi/logging@${{ version }}
  cfe-upstream-repo: http://www.red-dove.com/python_logging.html
  cfe-upstream-homepage: http://www.red-dove.com/python_logging.html
  cfe-import-names: [logging]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
