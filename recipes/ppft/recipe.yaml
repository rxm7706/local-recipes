# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.8"

package:
  name: ppft
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ppft/ppft-${{ version }}.tar.gz
  sha256: 5f696d4f397ae9b0af39b1faffb31957c51dfbc5a3815856472d4f4e872937ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/uqfoundation/ppft
  license: BSD-3-Clause
  license_file: LICENSE
  summary: distributed and parallel Python
  description: |
    distributed and parallel Python
  repository: https://github.com/uqfoundation/ppft
  documentation: http://ppft.rtfd.io

extra:
  recipe-maintainers:
    - jschueller
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
