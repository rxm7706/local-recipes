# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.1"

package:
  name: azure-mgmt-resourcegraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-resourcegraph/azure_mgmt_resourcegraph-${{ version }}.tar.gz
  sha256: 55a21d66da6b28a080d903eca192d02fc1cfd0775e139b30d44117ca4ba6ad1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - msrest >=0.7.1
    - azure-mgmt-core >=1.6.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-mgmt-resourcegraph/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Resourcegraph Management Client Library for Python
  description: |
    Microsoft Azure Resourcegraph Management Client Library for Python

extra:
  recipe-maintainers:
    - rxm7706

