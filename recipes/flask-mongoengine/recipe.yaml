# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: flask-mongoengine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-mongoengine/flask-mongoengine-${{ version }}.tar.gz
  sha256: ce68726d2be8d88006e88f17e4be3b7ad07c79ca8dedb60653d3dab5d9485840

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - wtforms
    - flask-wtf
    - mongoengine

tests:
  - python:
      imports:
        - flask_mongoengine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mongoengine/flask-mongoengine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Flask-MongoEngine is a Flask extension that provides integration with MongoEngine and WTF model forms.
  description: |
    Flask-MongoEngine is a Flask extension that provides integration with MongoEngine and WTF model forms.

extra:
  recipe-maintainers:
    - rxm7706

