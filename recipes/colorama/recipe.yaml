# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.6"

package:
  name: colorama
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/colorama/colorama-${{ version }}.tar.gz
  sha256: 08695f5cb7ed6e0531a20572697297273c47b8cae5a63ffc6d6ed5c201be6e44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.25.1
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - colorama
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tartley/colorama
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Cross-platform colored terminal text.
  description: |
    Cross-platform colored terminal text.

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: colorama
  cfe-upstream-registry: pypi
  cfe-upstream-name: colorama
  cfe-purls:
    - pkg:conda/colorama@${{ version }}?channel=conda-forge
    - pkg:pypi/colorama@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/tartley/colorama
  cfe-import-names: [colorama]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/colorama-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.4.6

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T07:05:39Z
