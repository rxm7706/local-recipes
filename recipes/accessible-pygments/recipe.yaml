# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: accessible-pygments
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/accessible-pygments/accessible_pygments-${{ version }}.tar.gz
  sha256: 40918d3e6a2b619ad424cb91e556bd3bd8865443d9f22f1dcdf79e33c8046872

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pygments >=1.5

tests:
  - python:
      imports:
        - a11y_pygments
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Quansight-Labs/accessible-pygments
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A collection of accessible pygments styles
  description: |
    A collection of accessible pygments styles

extra:
  recipe-maintainers:
    - carreau
    - trallard

#### CFE metadata AND comments
