# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.4"

package:
  name: upgrade-python-package
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/upgrade-python-package/upgrade_python_package-${{ version }}.tar.gz
  sha256: d0b80b204ede2ce41ca8dc7f645a4f7a10d14df153df02b9201b57e2875dcfbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - setuptools-scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - lxml >=4.9
    - requests ==2.*
    - packaging >=24.1

tests:
  - python:
      imports:
        - upgrade
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openlawlibrary/upgrade-python-package
  license: Apache-2.0
  license_file: LICENSE
  summary: A script for upgrading python packages
  description: |
    A script for upgrading python packages

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
