# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.8"

package:
  name: sqlagent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlagent/sqlagent-${{ version }}.tar.gz
  sha256: 473c8e5e00552e5cca917a295b01fa5f50d8b506bf0812a8e33598242451b381

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - llama-index <0.11.0,>=0.10.00
    - python-dotenv <2.0.0,>=1.0.0
    - pymysql <2.0.0,>=1.1.0
    - llama-index-embeddings-openai <0.2.0,>=0.1.00
    - pinecone <5.0.0,>=4.0.0
    - llama-index-vector-stores-pinecone <0.2.0,>=0.1.0
    - llmtext ==1.0.0

tests:
  - python:
      imports:
        - sqlagent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/sqlagent/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: SQL agent, query your database
  description: |
    SQL agent, query your database

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
