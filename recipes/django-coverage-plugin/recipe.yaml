# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.2"

package:
  name: django-coverage-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-coverage-plugin/django_coverage_plugin-${{ version }}.tar.gz
  sha256: fcc507ee02f3a8f7c1d79b6eba1bafebb4a95b5055801987b715f4f88270c441

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
    - wheel
  run:
    - python >=${{ python_min }}
    - coverage
    - django

tests:
  - python:
      imports:
        - django_coverage_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/coveragepy/django_coverage_plugin
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Django template coverage.py plugin
  description: |
    Django template coverage.py plugin
  repository: https://github.com/coveragepy/django_coverage_plugin

extra:
  recipe-maintainers:
    - rxm7706

