    - pkg:pypi/gravis@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://robert-haas.github.io/gravis-docs/
  cfe-import-names: [gravis]
  cfe-source-kind: pypi-sdist
