# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: gravis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gravis/gravis-${{ version }}.tar.gz
  sha256: a36342602aa7da3bbd674c970439717926a8f7ca0678aa82cc5d756e8c2a529b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - setuptools

tests:
  - python:
      imports:
        - gravis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://robert-haas.github.io/gravis-docs/
  license: Apache-2.0
  license_file: LICENSE
  summary: Interactive graph visualizations with Python and HTML/CSS/JS.
  description: |
    Interactive graph visualizations with Python and HTML/CSS/JS.

extra:
  recipe-maintainers:
    - julian-belina

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: gravis
