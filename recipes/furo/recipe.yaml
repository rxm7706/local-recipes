# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: furo
  version: "2025.12.19"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/furo-${{ version }}.tar.gz
  sha256: 188d1f942037d8b37cd3985b955839fea62baa1730087dc29d157677c857e2a7

build:
  number: 1
  noarch: python
  script:
    env:
      STB_USE_SYSTEM_NODE: 1
    content: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core >=2,<4
    - pip
    - python ${{ python_min }}
    - sphinx-theme-builder
    - nodeenv
    - nodejs ==18.20.5
  run:
    - accessible-pygments >=0.0.5
    - beautifulsoup4
    - pygments >=2.7
    - python >=${{ python_min }}
    - sphinx >=7.0,<10.0
    - sphinx-basic-ng

tests:
  - python:
      imports:
        - sphinx.application
        - furo
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A clean customisable Sphinx documentation theme.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pradyunsg/furo

extra:
  recipe-maintainers:
    - cxzhong
    - asmeurer
    - gforsyth
