# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: pytest_async
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest_async/pytest_async-${{ version }}.tar.gz
  sha256: 0d6ffd3ebac2f3aa47d606dbae1984750268a89dc8caf4a908ba61c60299cdfd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytest_async
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hyperleex/pytest-async
  license: MIT
  license_file: LICENSE
  summary: pytest-async - Run your coroutine in event loop without decorator
  description: |
    pytest-async - Run your coroutine in event loop without decorator

extra:
  recipe-maintainers:
    - rxm7706

