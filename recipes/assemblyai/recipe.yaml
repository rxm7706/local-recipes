# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.64.25"

package:
  name: assemblyai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/assemblyai/assemblyai-${{ version }}.tar.gz
  sha256: 4e5240b5732ba45748eee5853ac666bb3663e56b4c19b5cbc4a167e063c3bf75

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.19.0
    - pydantic >=2.0
    - pydantic-settings >=2.0
    - typing_extensions >=3.7
    - websockets >=11.0

tests:
  - python:
      imports:
        - assemblyai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/assemblyai/
  license: MIT
  license_file: LICENSE
  summary: AssemblyAI Python SDK
  repository: https://github.com/AssemblyAI/assemblyai-python-sdk
  documentation: https://github.com/AssemblyAI/assemblyai-python-sdk/blob/master/README.md
  description: |
    AssemblyAI's Python SDK provides access to speech-to-text,
    audio intelligence, and LeMUR models for transcribing and
    analyzing audio.

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka

