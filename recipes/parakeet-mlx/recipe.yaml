# CFE comments
# Header:
#    # Authored 2026-07-26, last of the four gap-closers, as the Apple Silicon
#    # half of bmad-manticore's transcription lane (its cross-platform sibling
#    # is onnx-asr, packaged alongside). manticore's 2.0.0 CHANGELOG: "the
#    # reference parakeet weights via parakeet-mlx on Apple Silicon and
#    # onnx-asr (same weights) on Windows, Linux, and Intel Macs".
# build:
#    # Pure Python (setuptools, no compiled extension) -> noarch:python. The
#    # Apple-Silicon association comes from the mlx DEPENDENCY, not from this
#    # package having native code.
# requirements:
#    # All 6 deps verified on conda-forge. mlx itself covers linux-64,
#    # linux-aarch64, osx-64 and osx-arm64 -- but NOT win-64, so this noarch
#    # package simply will not solve on Windows. That is correct behaviour
#    # rather than a defect: there is no mlx runtime there. A noarch package
#    # cannot carry a platform-gated hard dep (G76), so this is left to the
#    # solver instead of being papered over.
#    # huggingface-hub -> huggingface_hub is the conda-forge spelling (G10).
####
