# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: pluggy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pluggy/pluggy-${{ version }}.tar.gz
  sha256: 7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pluggy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pluggy/
  license: MIT
  license_file: LICENSE
  summary: plugin and hook calling mechanisms for python
  description: |
    plugin and hook calling mechanisms for python

extra:
  recipe-maintainers:
    - johnnygenomics
    - nicoddemus
    - adriendelsalle

#### CFE metadata AND comments
