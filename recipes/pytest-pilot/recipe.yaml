# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: pytest-pilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-pilot/pytest_pilot-${{ version }}.tar.gz
  sha256: c438041025424f586caa3a2d7ec7f79310189693e236211755367d869aa5f1f2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - six
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - enum34

tests:
  - python:
      imports:
        - pytest_pilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/smarie/python-pytest-pilot
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Slice in your test base thanks to powerful markers.
  description: |
    Slice in your test base thanks to powerful markers.

extra:
  recipe-maintainers:
    - killua156
    - mgorny

#### CFE metadata AND comments
