# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "45.0.4"

package:
  name: cm-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cm-client/cm-client-${{ version }}.tar.gz
  sha256: 7f5629345de8a1efc876013b516658124bf9a5b043643b37650a016cb1d95960

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cm_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cm-client/
  license: MIT
  license_file: LICENSE
  summary: Cloudera Manager API
  description: |
    Cloudera Manager API

extra:
  recipe-maintainers:
    - rxm7706

