# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.6"

package:
  name: langchain-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-core/langchain_core-${{ version }}.tar.gz
  sha256: b5f73bd9688c457b31ec73657a0ad56948f889fae27acee79286e9c285632ee6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - httpx <1.0.0,>=0.23.0
    - jsonpatch <2.0.0,>=1.33.0
    - langchain-protocol >=0.0.17
    - langsmith <1.0.0,>=0.3.45
    - packaging >=23.2.0
    - pydantic <3.0.0,>=2.7.4
    - pyyaml <7.0.0,>=5.3.0
    - tenacity !=8.4.0,<10.0.0,>=8.1.0
    - typing_extensions <5.0.0,>=4.7.0
    - uuid-utils <1.0,>=0.12.0

tests:
  - python:
      imports:
        - langchain_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: Building applications with LLMs through composability
  description: |
    Building applications with LLMs through composability
  repository: https://github.com/langchain-ai/langchain
  documentation: https://reference.langchain.com/python/langchain_core/

extra:
  recipe-maintainers:
    - dlqqq
    - jan-janssen
    - hinthornw
    - baskaryan
    - hwchase17
    - sydney-runkle
    - ccurme
    - agola11
    - pavelzw

