{% set name = "langchain-core" %}
{% set version = "1.5.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/langchain_core-{{ version }}.tar.gz
  sha256: c08d78176113867e9a76acc1007d641cd68fa5682e9e0018980d062b4ae0777e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - httpx >=0.23.0,<1.0.0
    - langchain-protocol >=0.0.17
    - uuid-utils >=0.12.0,<1.0
    - typing_extensions >=4.7.0,<5.0.0
    - python >={{ python_min }},<4.0
    - pydantic >=2.7.4,<3.0.0
    - langsmith >=0.3.45,<1.0.0
    - tenacity !=8.4.0,>=8.1.0,<10.0.0
    - jsonpatch >=1.33.0,<2.0.0
    - pyyaml >=5.3.0,<7.0.0
    - packaging >=23.2.0
  run_constrained:
    - jinja2 >=3.0.0,<4.0.0

test:
  imports:
    - langchain_core
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/langchain-ai/langchain
  doc_url: https://api.python.langchain.com/en/stable/core_api_reference.html
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/core
  summary: Core APIs for LangChain, the LLM framework for buildilng applications through composability
  description: LangChain Core contains the core abstractions powering LangChain, including LangChain Expression Language.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dlqqq
    - jan-janssen
    - hinthornw
    - baskaryan
    - hwchase17
    - sydney-runkle
    - ccurme
    - agola11
    - pavelzw
