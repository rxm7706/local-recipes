# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: microsoft-agents-hosting-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-agents-hosting-core/microsoft_agents_hosting_core-${{ version }}.tar.gz
  sha256: 1be7c5c9a7233ebc2a0a2d59c409dd39bc223eea89515e870ec1517bd3c2d815

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - microsoft-agents-activity ==1.3.0
    - pyjwt >=2.10.1
    - isodate >=0.6.1
    - python-dotenv >=1.1.1
    - opentelemetry-api >=1.27.0
    - opentelemetry-sdk >=1.27.0

tests:
  - python:
      imports:
        - microsoft_agents.hosting.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Agents
  license: MIT
  license_file: LICENSE
  summary: Core library for Microsoft Agents
  description: |
    Core library for Microsoft Agents

extra:
  recipe-maintainers:
    - rxm7706

