# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.7"

package:
  name: frozendict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/frozendict/frozendict-${{ version }}.tar.gz
  sha256: e478fb2a1391a56c8a6e10cc97c4a9002b410ecd1ac28c18d780661762e271bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - frozendict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Marco-Sulla/python-frozendict
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  summary: A simple immutable dictionary
  description: |
    A simple immutable dictionary
  repository: https://github.com/Marco-Sulla/python-frozendict

extra:
  recipe-maintainers:
    - Marco-Sulla

#### CFE metadata AND comments
