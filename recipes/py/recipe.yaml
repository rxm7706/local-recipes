    - pkg:pypi/py@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://py.readthedocs.io/
  cfe-import-names: [py]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/py-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.11.0

  cfe-forge-blocker-list: []
