# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robocorp-storage
  version: "1.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/39/97/407e7d06a14d65b20f0055b0a518ae1d775172f06eb02153946228b57593/robocorp_storage-1.1.1.tar.gz
  sha256: 0f86824a65308e7ec56df76326913d15d62bbce0f27dccb22074f97e653f1aaa

build:
  number: 0
  noarch: python
  script:
  - if: win
    then: echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md
  - if: unix
    then: cp -R ${{ RECIPE_DIR }}/README.md ${{ SRC_DIR }}/README.md
  - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
  - python ${{ python_min }}.*
  - poetry-core
  - pip
  run:
  - python >=${{ python_min }},<4.0.0
  - requests >=2.28.2
  - tenacity >=8.0.1
  - typing-extensions >=4.5.0,<5.0.0

tests:
- python:
    imports:
    - robocorp.storage
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: Robocorp Asset Storage library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/robocorp/robo/

extra:
  recipe-maintainers:
  - rxm7706

#### CFE metadata AND comments
