# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robocorp-storage
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robocorp_storage-${{ version }}.tar.gz
  sha256: ae9d0f654e88047ea8efcce9d7cbb1017a52993da57b83c38d243395c3198d96

build:
  number: 0
  noarch: python
  script:
    - if: win
      then: echo f | xcopy /f /y /S %RECIPE_DIR%\README.md %SRC_DIR%\README.md
    - if: unix
      then: cp -R ${{ RECIPE_DIR }}/README.md ${{ SRC_DIR }}/README.md
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - requests >=2.28.2
    - tenacity >=8.0.1
    - typing-extensions >=4.5.0,<5.0.0

tests:
  - python:
      imports:
        - robocorp.storage
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Robocorp Asset Storage library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/robocorp/robo/

extra:
  recipe-maintainers:
    - rxm7706
