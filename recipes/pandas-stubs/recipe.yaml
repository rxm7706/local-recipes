# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.5.260730"
  python_min: "3.11"

package:
  name: pandas-stubs
  version: ${{ version }}

source:
  url: https://github.com/pandas-dev/pandas-stubs/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2489c6ab80bf593a5729475aba04db5ac574fb0d6127ef1ccde00941728a0767

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0
  run:
    - python >=${{ python_min }}
    - pandas-stubs
    - numpy >=1.23.5

tests:
  - python:
      imports:
        - pandas_stubs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pandas.pydata.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Type annotations for pandas
  description: |
    Type annotations for pandas
  repository: https://github.com/pandas-dev/pandas-stubs
  documentation: https://pandas.pydata.org/pandas-docs/stable

extra:
  recipe-maintainers:
    - twoertwein
    - Dr-Irv

#### CFE metadata AND comments
