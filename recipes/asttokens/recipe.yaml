# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.2"

package:
  name: asttokens
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asttokens/asttokens-${{ version }}.tar.gz
  sha256: 3ecdbd8f2cc195f53ccada3a613538bb5f9ef6f6869129f13e03c30a677b8fe2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=44
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - asttokens
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gristlabs/asttokens
  license: Apache-2.0
  license_file: LICENSE
  summary: Annotate AST trees with source code positions
  description: |
    Annotate AST trees with source code positions
  documentation: https://asttokens.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - dopplershift

#### CFE metadata AND comments
