# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: sparkmonitor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sparkmonitor/sparkmonitor-${{ version }}.tar.gz
  sha256: df94a90579effc61b35a39c320319d1f34c64baf6848658201ace80c07178cf9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sparkmonitor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/swan-cern/sparkmonitor
  license: Apache-2.0
  license_file: LICENSE
  summary: Jupyter Notebook & Lab extension to monitor Apache Spark jobs from a notebook
  description: |
    Jupyter Notebook & Lab extension to monitor Apache Spark jobs from a notebook
  repository: https://github.com/swan-cern/sparkmonitor.git

extra:
  recipe-maintainers:
    - rxm7706

