# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.0"

package:
  name: graphene-django-optimizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphene-django-optimizer/graphene-django-optimizer-${{ version }}.tar.gz
  sha256: 5a5d9d1e1abda3571bdff77a71af5e71b994e5e9d97d17a576df89181284075d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - graphene-django
    - django
    - graphene

tests:
  - python:
      imports:
        - graphene_django_optimizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tfoxy/graphene-django-optimizer
  license: MIT
  license_file: LICENSE
  summary: Optimize database access inside graphene queries.
  description: |
    Optimize database access inside graphene queries.

extra:
  recipe-maintainers:
    - rxm7706

