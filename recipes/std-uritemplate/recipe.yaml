# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: std-uritemplate
  version: "2.0.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/std_uritemplate-${{ version }}.tar.gz
  sha256: c245e6d9c6804e435c45fa94ee4a3c8a57e08aeeb45af261101cb0d513964534

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stduritemplate
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: std-uritemplate implementation for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/std-uritemplate/std-uritemplate
  repository: https://github.com/std-uritemplate/std-uritemplate
  documentation: https://github.com/std-uritemplate/std-uritemplate/blob/main/Readme.md

extra:
  recipe-maintainers:
    - xylar
