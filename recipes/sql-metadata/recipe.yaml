# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: sql-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sql-metadata/sql_metadata-${{ version }}.tar.gz
  sha256: 4c83a48ddd1c6c4076eec2021347cb1311f0a190f18aabef7c2c6fd64d3afbc2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - sqlglot <31.0.0,>=30.12.0

tests:
  - python:
      imports:
        - sql_metadata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/macbre/sql-metadata
  license: MIT
  license_file: LICENSE
  summary: Uses sqlglot to parse SQL queries and extract metadata
  description: |
    Uses sqlglot to parse SQL queries and extract metadata
  repository: https://github.com/macbre/sql-metadata

extra:
  recipe-maintainers:
    - timkpaine
    - OstapStefakQC

