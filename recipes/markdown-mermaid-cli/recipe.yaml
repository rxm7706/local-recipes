# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: markdown-mermaid-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdown-mermaid-cli/markdown_mermaid_cli-${{ version }}.tar.gz
  sha256: 03a729db97a5991e6e772dd0729b2097f7d573c2333b35c48fbc0468951bda7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - markdown >=3.8

tests:
  - python:
      imports:
        - markdown_mermaid_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hkato/markdown-mermaid-cli
  license: MIT
  license_file: LICENSE
  summary: Mermaid extension for Python-Markdown using mermaid-cli.
  description: |
    Mermaid extension for Python-Markdown using mermaid-cli.
  repository: https://github.com/hkato/markdown-mermaid-cli
  documentation: https://hkato.github.io/markdown-mermaid-cli/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
