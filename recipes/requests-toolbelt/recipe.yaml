# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: requests-toolbelt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-toolbelt/requests-toolbelt-${{ version }}.tar.gz
  sha256: 7681a0a3d047012b5bdc0ee37d7f8f07ebe76ab08caeccfc3921ce23c88d5bc6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - requests_toolbelt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://toolbelt.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: A utility belt for advanced users of python-requests
  description: |
    A utility belt for advanced users of python-requests
  repository: https://github.com/requests/toolbelt

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox
    - sigmavirus24

