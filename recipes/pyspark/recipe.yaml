# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: pyspark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyspark/pyspark-${{ version }}.tar.gz
  sha256: 5ad689d53570ee1674193fd4f9bda065f0db3be9363a27d2a3406cc457b70b61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - py4j <0.10.9.10,>=0.10.9.7

tests:
  - python:
      imports:
        - pyspark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/apache/spark/tree/master/python
  license: Apache-2.0
  license_file: LICENSE
  summary: Apache Spark Python API
  description: |
    Apache Spark Python API

extra:
  recipe-maintainers:
    - parente
    - quasiben
    - dbast
    - mariusvniekerk
    - codesorcery
    - h-vetinari

