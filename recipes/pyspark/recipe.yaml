# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: pyspark
  version: ${{ version }}

source:
  # PyPI has had issues recently with timely releases due to size constraints of tarball;
  # Building from source runs into StackOverflow errors in CF CI; --> use upstream binary
  url: https://dist.apache.org/repos/dist/release/spark/spark-${{ version }}/pyspark-${{ version }}.tar.gz
  sha256: 5ad689d53570ee1674193fd4f9bda065f0db3be9363a27d2a3406cc457b70b61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - numpy >=1.21
    - pandas >=2.2.0
    - py4j >=0.10.9.7,<0.10.9.10
    - pyarrow >=18.0.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyspark
        - pyspark.cloudpickle
        - pyspark.ml
        - pyspark.ml.linalg
        - pyspark.ml.param
        - pyspark.mllib
        - pyspark.mllib.linalg
        - pyspark.mllib.stat
        - pyspark.pandas
        - pyspark.pandas.data_type_ops
        - pyspark.pandas.indexes
        - pyspark.pandas.missing
        - pyspark.pandas.plot
        - pyspark.pandas.spark
        - pyspark.pandas.typedef
        - pyspark.pandas.usage_logging
        - pyspark.python.pyspark
        - pyspark.python.lib
        - pyspark.sql
        - pyspark.sql.avro
        - pyspark.sql.pandas
        - pyspark.streaming
        - pyspark.bin
        - pyspark.sbin
        - pyspark.jars
        - pyspark.data
        - pyspark.licenses
        - pyspark.resource
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - if: not win
        then: bash -c "compgen -c spark && compgen -c pyspark"
      - if: win
        then: where *spark*

about:
  license: Apache-2.0
  # Not yet available in the pypi release
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: Apache Spark
  description: Apache Spark is a fast and general engine for large-scale data processing.
  homepage: http://spark.apache.org/

extra:
  recipe-maintainers:
    - parente
    - quasiben
    - dbast
    - mariusvniekerk
    - codesorcery
    - h-vetinari
