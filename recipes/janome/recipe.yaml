# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: Janome
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ce4a3ed7a4635c2f80139639327d5b1e0381858ad74a3c4a61e8cc83f820400e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - janome
        - janome.sysdic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Japanese morphological analysis engine.
  license: Apache-2.0
  license_file:
    - LICENSE.txt
    - NOTICE.txt
  homepage: https://github.com/mocobeta/janome
  repository: https://github.com/mocobeta/janome/wiki#for-contributors
  documentation: https://mocobeta.github.io/janome/en/

extra:
  recipe-maintainers:
    - BastianZim
