# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: janome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/Janome/Janome-${{ version }}.tar.gz
  sha256: ce4a3ed7a4635c2f80139639327d5b1e0381858ad74a3c4a61e8cc83f820400e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - janome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mocobeta.github.io/janome/en/
  license: AL2
  license_file: LICENSE
  summary: Japanese morphological analysis engine.
  description: |
    Japanese morphological analysis engine.
  repository: https://github.com/mocobeta/janome

extra:
  recipe-maintainers:
    - BastianZim

#### CFE metadata AND comments
