# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: brotlicffi
  version: "1.2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c20d5c596278307ad06414a6d95a892377ea274a5c6b790c2548c009385d621c

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cffi
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - cffi >=1.0.0
    - pip
    - python
    - setuptools
  run:
    - cffi >=1.0.0
    - if: match(python, "<3.4")
      then: enum34
    - python

tests:
  - python:
      imports:
        - brotlicffi
      pip_check: true

about:
  summary: Python CFFI bindings to the Brotli library
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/python-hyper/brotlicffi

extra:
  recipe-maintainers:
    - sarthakpati
    - sethmlarson
