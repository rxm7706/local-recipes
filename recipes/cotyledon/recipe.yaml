# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: cotyledon
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cotyledon/cotyledon-${{ version }}.tar.gz
  sha256: 5f9dcc4cfb8124e6550119bb4f6fbda8628bbe653804015b76c392fa5f208009

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - cotyledon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cotyledon/
  license: Apache-2.0
  license_file: LICENSE
  summary: Cotyledon provides a framework for defining long-running services.
  description: |
    Cotyledon provides a framework for defining long-running services.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
