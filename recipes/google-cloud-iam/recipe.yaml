# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.24.1"

package:
  name: google-cloud-iam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-iam/google_cloud_iam-${{ version }}.tar.gz
  sha256: 2d7edfe48fd24a181f55473a77584c0c947cf52915fc7af835d9ae0408fccae0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpc-google-iam-v1 <1.0.0,>=0.14.2
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.iam
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-iam
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Iam API client library
  description: |
    Google Cloud Iam API client library

extra:
  recipe-maintainers:
    - rxm7706
    - parthea

