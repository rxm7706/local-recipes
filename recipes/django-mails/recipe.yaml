# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: django-mails
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-mails/django_mails-${{ version }}.tar.gz
  sha256: 634a64734d708620e79605115a265ceff7fb779236019449c52f938419dfdddc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django
    - django-ckeditor
    - django-js-asset
    - html2text
    - jinja2
    - markupsafe
    - sqlparse

tests:
  - python:
      imports:
        - djangomails
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Hashtrust-technology-private-limited/django-email-service
  license: MIT
  license_file: LICENSE
  summary: A Django Library to Send Simple/HTML Emails
  description: |
    A Django Library to Send Simple/HTML Emails

extra:
  recipe-maintainers:
    - rxm7706

