# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8"

package:
  name: tex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tex/tex-${{ version }}.tar.gz
  sha256: b6950860c733b37b7c3631228abd3a70d8f75a96c3a2f17eac61158185dd224d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.profv.de/python-tex/
  license: UNKNOWN
  license_file: LICENSE
  summary: Convert LaTeX or TeX source to PDF or DVI, and escape strings for LaTeX.
  description: |
    Convert LaTeX or TeX source to PDF or DVI, and escape strings for LaTeX.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
