# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: github-copilot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/github-copilot/github-copilot-${{ version }}.tar.gz
  sha256: 6443c5983219d5d56129242ed0a91ccb62706ccc4dd02935becaa7a9188e8892

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - github_copilot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/github-copilot/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

