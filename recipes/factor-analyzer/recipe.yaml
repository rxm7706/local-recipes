# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: factor-analyzer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/factor-analyzer/factor_analyzer-${{ version }}.tar.gz
  sha256: 03703cd128ee9f91c9bd191a452b06e4a28296b5a24d11823ebb5d8250e8fdf6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59.0.0
  run:
    - python >=${{ python_min }}
    - pandas
    - scipy
    - numpy
    - scikit-learn

tests:
  - python:
      imports:
        - factor_analyzer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/EducationalTestingService/factor_analyzer
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Factor Analysis tool written in Python
  description: |
    A Factor Analysis tool written in Python

extra:
  recipe-maintainers:
    - kellend-git

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: factor-analyzer
  cfe-upstream-registry: pypi
  cfe-upstream-name: factor-analyzer
  cfe-purls:
    - pkg:conda/factor-analyzer@${{ version }}?channel=conda-forge
    - pkg:pypi/factor-analyzer@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/EducationalTestingService/factor_analyzer
  cfe-import-names: [factor_analyzer]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/factor-analyzer-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.5.1

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

