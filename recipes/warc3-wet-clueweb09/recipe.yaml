# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.5"

package:
  name: warc3-wet-clueweb09
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/warc3-wet-clueweb09/warc3-wet-clueweb09-${{ version }}.tar.gz
  sha256: 3054bfc07da525d5967df8ca3175f78fa3f78514c82643f8c81fbca96300b836

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - warc3_wet_clueweb09
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/seanmacavaney/warc3-clueweb
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python library to work with ARC and WARC files, with fixes for ClueWeb09
  description: |
    Python library to work with ARC and WARC files, with fixes for ClueWeb09

extra:
  recipe-maintainers:
    - rxm7706

