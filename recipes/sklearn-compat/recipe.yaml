# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: sklearn-compat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sklearn-compat/sklearn_compat-${{ version }}.tar.gz
  sha256: 8fd4731b4f709b66641b8f49c954dafec7e3b60afc48f2cfd298356c713277c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - scikit-learn <1.10,>=1.2

tests:
  - python:
      imports:
        - sklearn_compat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://sklearn-compat.readthedocs.io/en/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Ease support for compatible scikit-learn estimators across versions
  description: |
    Ease support for compatible scikit-learn estimators across versions
  repository: https://github.com/sklearn-compat/sklearn-compat

extra:
  recipe-maintainers:
    - glemaitre
    - adrinjalali

