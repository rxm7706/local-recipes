# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sklearn-compat
  version: "0.1.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sklearn_compat-${{ version }}.tar.gz
  sha256: 8fd4731b4f709b66641b8f49c954dafec7e3b60afc48f2cfd298356c713277c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - scikit-learn >=1.2,<1.10

tests:
  - python:
      imports:
        - sklearn_compat
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Ease support for compatible scikit-learn estimators across versions
  description: |
    This package provides a set of utilities to make scikit-learn estimators
    compatible with different versions of scikit-learn.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/sklearn-compat/sklearn-compat
  repository: https://github.com/sklearn-compat/sklearn-compat
  documentation: https://sklearn-compat.readthedocs.io/en

extra:
  recipe-maintainers:
    - glemaitre
    - adrinjalali
