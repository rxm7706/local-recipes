# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.1"

package:
  name: pyldavis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyLDAvis/pyLDAvis-${{ version }}.tar.gz
  sha256: 501775a4a7b7482e9033c924ef0e84eab3f657efce5c9fdb2ac85b77b60c91bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pandas
    - joblib
    - jinja2
    - numexpr
    - funcy
    - scikit-learn
    - gensim
    - setuptools

tests:
  - python:
      imports:
        - pyLDAvis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bmabey/pyLDAvis
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Interactive topic model visualization. Port of the R package.
  description: |
    Interactive topic model visualization. Port of the R package.

extra:
  recipe-maintainers:
    - sodre
    - CurtLH
    - thewchan

#### CFE metadata AND comments
