# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.0"

package:
  name: mssql-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mssql-django/mssql_django-${{ version }}.tar.gz
  sha256: 023a3d55a85d1d0d9f38d731182c35c2fecbf6bdc7b2464ed7ebf29c9e7bbdb2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django <6.2,>=3.2
    - pyodbc >=3.0
    - pytz

tests:
  - python:
      imports:
        - mssql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/mssql-django
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Django backend for Microsoft SQL Server
  description: |
    Django backend for Microsoft SQL Server

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

#### CFE metadata AND comments
