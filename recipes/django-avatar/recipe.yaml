# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-avatar
  version: "9.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 55a816df3adc02891aaa11dae1ad72a9f281a586b0a1f703ebaf9cc3a2b0f46d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=65.6.3
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - pillow >=10.0.1
    - django-appconf >=1.0.5
    - dnspython >=2.3.0
    # - Pillow >=10.0.1
    # - Pillow >=10.0.1

tests:
  - python:
      imports:
        - avatar
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A Django app for handling user avatars
  license: BSD-3-Clause AND BSD-4-Clause
  license_file:
    - LICENSE.txt
    - avatar/templates/notification/avatar_updated/notice.html
    - avatar/templates/notification/avatar_friend_updated/notice.html
  homepage: https://github.com/jazzband/django-avatar

extra:
  recipe-maintainers:
    - rxm7706
    - mxr-conda
