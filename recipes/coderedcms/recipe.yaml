# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: coderedcms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coderedcms/coderedcms-${{ version }}.tar.gz
  sha256: 5ee2fe9a1210cf63db4fdffa802311b233a394562a40d6bdc37c6ea2de273110

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 <5,>=4.8
    - django-eventtools ==1.0.*
    - django-bootstrap5 ==25.2
    - django <6.0,>=4.2
    - geocoder ==1.38.*
    - icalendar ==6.3.*
    - wagtail <8.0,>=7.0
    - wagtail-cache ==3.*
    - wagtail-flexible-forms <3.0,>=2.1
    - wagtail-seo <4.0,>=3.1

tests:
  - python:
      imports:
        - coderedcms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/coderedcms/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Wagtail + CodeRed Extensions enabling rapid development of marketing-focused websites.
  description: |
    Wagtail + CodeRed Extensions enabling rapid development of marketing-focused websites.
  repository: https://github.com/coderedcorp/coderedcms
  documentation: https://docs.coderedcorp.com/wagtail-crx/

extra:
  recipe-maintainers:

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: coderedcms
  cfe-upstream-registry: pypi
  cfe-upstream-name: coderedcms
