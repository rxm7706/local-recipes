# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: coderedcms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coderedcms/coderedcms-${{ version }}.tar.gz
  sha256: 5ee2fe9a1210cf63db4fdffa802311b233a394562a40d6bdc37c6ea2de273110

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.8,<5
    - django-eventtools >=1.0,<2.0
    - django-bootstrap5 >=25.2,<25.3
    - django >=4.2,<6.0
    - geocoder >=1.38,<=1.39
    - icalendar >=6.3,<6.4
    - python-tzdata
    - wagtail >=7.0,<8.0
    - wagtail-cache >=3.0,<4.0
    - wagtail-flexible-forms >=2.1,<3.0
    - wagtail-seo >=3.1,<4.0

tests:
  - python:
      imports:
        - coderedcms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/coderedcms/
  license: BSD-3-Clause AND MIT
  license_file:
    - LICENSE.txt
    - coderedcms/static/coderedcms/vendor/bootstrap/LICENSE
  summary: Wagtail + CodeRed Extensions enabling rapid development of marketing-focused websites.
  description: |
    Wagtail + CodeRed Extensions enabling rapid development of marketing-focused websites.
  repository: https://github.com/coderedcorp/coderedcms
  documentation: https://docs.coderedcorp.com/wagtail-crx/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
