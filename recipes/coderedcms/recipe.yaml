    - pkg:conda/coderedcms@${{ version }}?channel=conda-forge
    - pkg:pypi/coderedcms@${{ version }}
  cfe-upstream-repo: https://github.com/coderedcorp/coderedcms
  cfe-upstream-homepage: https://pypi.org/project/coderedcms/
  cfe-import-names: [coderedcms]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/coderedcms-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

