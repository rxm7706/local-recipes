# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: robust-downloader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robust-downloader/robust-downloader-${{ version }}.tar.gz
  sha256: 08c938b96e317abe6b037e34230a91bda9b5d613f009bca4a47664997c61de90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - tqdm
    - colorlog
    - requests

tests:
  - python:
      imports:
        - robust_downloader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fedebotu/robust-downloader
  license: Apache-2.0
  license_file: LICENSE
  summary: A Simple Robust Downloader written in Python
  description: |
    A Simple Robust Downloader written in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
