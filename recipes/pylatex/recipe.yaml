# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: pylatex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyLaTeX/PyLaTeX-${{ version }}.tar.gz
  sha256: bb7b21bec57ecdba3f6f44c856ebebdf6549fd6e80661bd44fd5094236729242

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ordered-set

tests:
  - python:
      imports:
        - pylatex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JelteF/PyLaTeX
  license: MIT
  license_file: LICENSE
  summary: A Python library for creating LaTeX files and snippets
  description: |
    A Python library for creating LaTeX files and snippets

extra:
  recipe-maintainers:
    - Hoxbro

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pylatex
