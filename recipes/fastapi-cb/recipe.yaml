# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: fastapi-cb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-cb/fastapi_cb-${{ version }}.tar.gz
  sha256: ebe664f8b508fbb93b81f4aa95d3bac3a539ade7a0f881e488c3b3ae70508b79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fastapi_cb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/YeonwooSung/fastapi-cb
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Circuit Breaker implementation for FastAPI.
  description: |
    Circuit Breaker implementation for FastAPI.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fastapi-cb
  cfe-upstream-registry: pypi
  cfe-upstream-name: fastapi-cb
