# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3.5.5"

package:
  name: amps-python-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/amps-python-client/amps_python_client-${{ version }}.tar.gz
  sha256: e29d12cac6684eabb2ce652814eeb01bac42e7ba20aca0172c0abe9a19a49007

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - amps-python-client

tests:
  - python:
      imports:
        - amps_python_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://crankuptheamps.com
  license: MIT
  license_file: LICENSE
  summary: AMPS Python Client
  description: |
    AMPS Python Client

extra:
  recipe-maintainers:
    - rxm7706

