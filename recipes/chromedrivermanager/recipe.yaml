# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: chromedrivermanager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chromedrivermanager/chromedrivermanager-${{ version }}.tar.gz
  sha256: 9f55af0f2976630c5248182ce0070e19871f7370a73eadc48bc58dfd14e5f785

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - pypiwin32
    - pywin32

tests:
  - python:
      imports:
        - chromedrivermanager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chromedrivermanager/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple Python library that check, update or download chrome driver
  description: |
    A simple Python library that check, update or download chrome driver

extra:
  recipe-maintainers:
    - rxm7706

