# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.2"

package:
  name: llama-index-llms-openai-like
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-openai-like/llama_index_llms_openai_like-${{ version }}.tar.gz
  sha256: ed9ff73f975dce470f98ac61c982151ba78eedfa3fb9b03894bc1d1312b213ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.14.3
    - llama-index-llms-openai <0.8,>=0.7.0

tests:
  - python:
      imports:
        - llama_index.llms.openai_like
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-llms-openai-like/
  license: MIT
  license_file: LICENSE
  summary: llama-index llms openai like integration
  description: |
    llama-index llms openai like integration

extra:
  recipe-maintainers:
    - JaRoSchm

