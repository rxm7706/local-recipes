# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.32"

package:
  name: naked
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/Naked/Naked-${{ version }}.tar.gz
  sha256: f81015107e3aefdc801d7144fbae214bdf3cb179c0020a1dc6d5acb3659d5d5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - pyyaml

tests:
  - python:
      imports:
        - lib.Naked
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chrissimpkins/naked
  license: MIT
  license_file: LICENSE
  summary: A command line application framework
  description: |
    A command line application framework

extra:
  recipe-maintainers:
    - millsks

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: naked
  cfe-upstream-registry: pypi
  cfe-upstream-name: naked
  cfe-purls:
    - pkg:conda/naked@${{ version }}?channel=conda-forge
    - pkg:pypi/naked@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/chrissimpkins/naked
  cfe-import-names: [lib.Naked]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/naked-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.32

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:54:44Z
