# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: flask-principal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Principal/Flask-Principal-${{ version }}.tar.gz
  sha256: f5d6134b5caebfdbb86f32d56d18ee44b080876a27269560a96ea35f75c99453

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - flask_principal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://packages.python.org/Flask-Principal/
  license: MIT
  license_file: LICENSE
  summary: Identity management for flask
  description: |
    Identity management for flask

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
