# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sanic-routing
  version: "23.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sanic-routing-${{ version }}.tar.gz
  sha256: 1dcadc62c443e48c852392dba03603f9862b6197fc4cba5bbefeb1ace0848b04

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sanic_routing
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Core routing component for Sanic
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sanic-org/sanic-routing/

extra:
  recipe-maintainers:
    - nicoddemus
