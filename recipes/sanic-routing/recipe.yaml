# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "23.12.0"

package:
  name: sanic-routing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sanic-routing/sanic-routing-${{ version }}.tar.gz
  sha256: 1dcadc62c443e48c852392dba03603f9862b6197fc4cba5bbefeb1ace0848b04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sanic_routing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sanic-org/sanic-routing/
  license: MIT
  license_file: LICENSE
  summary: Core routing component for Sanic
  description: |
    Core routing component for Sanic

extra:
  recipe-maintainers:
    - nicoddemus

