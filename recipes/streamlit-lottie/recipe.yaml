# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.5"

package:
  name: streamlit-lottie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-lottie/streamlit-lottie-${{ version }}.tar.gz
  sha256: c61589fb92bdf1dd5bd0a2ea75315d92e3383f46059b3704515d096a1e953d79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_lottie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andfanilo/streamlit-lottie
  license: MIT
  license_file: LICENSE
  summary: A Streamlit custom component to load Lottie animations
  description: |
    A Streamlit custom component to load Lottie animations

extra:
  recipe-maintainers:
    - rxm7706

