# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mkdocs-get-deps
  version: "0.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mkdocs_get_deps-${{ version }}.tar.gz
  sha256: 8ee8d5f316cdbbb2834bc1df6e69c08fe769a83e040060de26d3c19fad3599a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mkdocs-get-deps = mkdocs_get_deps.__main__:cli

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.3
    - mergedeep >=1.3.4
    - platformdirs >=2.2.0
    - pyyaml >=5.1

tests:
  - python:
      imports:
        - mkdocs_get_deps
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - mkdocs-get-deps --help

about:
  summary: MkDocs extension that lists all dependencies according to a mkdocs.yml file
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/mkdocs/get-deps

extra:
  recipe-maintainers:
    - dhirschfeld
