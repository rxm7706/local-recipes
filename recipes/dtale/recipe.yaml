# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.22.0"

package:
  name: dtale
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dtale/dtale-${{ version }}.tar.gz
  sha256: 01c3ec821327263f730afb1409f0ca7dd56f2363a92d03e7700961e6b276f8d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dtale = dtale.cli.script:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lz4 #<=2.2.1
    - beautifulsoup4 !=4.13.0b2
    - brotli #<=1.0.9
    - certifi #<=2021.10.8
    - cycler #<=0.11.0
    - dash #<=1.21.0
    - dash-bootstrap-components #==0.13.1
    - dash-daq #<=0.5.0
    - dataclasses #<1
    - decorator #<=4.4.2
    - et_xmlfile #<=1.0.1
    - flask #<=1.1.4
    - flask-compress #<=1.15
    - future #>=0.14.0
    - immutables #<=0.19
    - itsdangerous #<=1.1.0
    - joblib #<=1.1.1
    - kaleido-core #<=0.2.1  # dtale 3.22.0 would require kaleido <=0.2.1, for which no candidates were found.
    - kiwisolver #<=1.1.0
    - markupsafe #<=1.1.1
    - matplotlib-base #<=2.2.5
    - missingno !=0.4.3
    - networkx #<=2.2
    - numpy #<=1.16.6
    - openpyxl #<=2.6.4
    - packaging
    - pandas
    - pkginfo
    - plotly >=4.14.3
    - pyparsing #<=2.4.7
    - requests #<=2.31.0
    - scikit-learn #<=0.20.4
    - scipy #<=1.2.3
    - seaborn-base #<=0.9.1  # seaborn-base <=0.9.1, for which no candidates were found.
    - squarify
    - statsmodels #<=0.10.2
    - strsimpy
    - six
    - tenacity #<=7.0.0
    - threadpoolctl #<=3.1.0
    - urllib3 #<=2.0.7
    - werkzeug #<=1.0.1
    - xarray #<=0.11.3
    - xlrd
    - zipp #<=3.15.0
    - zstandard #<=0.20.0

tests:
  - python:
      imports:
        - dtale
        - dtale.cli
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - dtale --help

about:
  homepage: https://github.com/man-group/dtale
  description: |
    Web Client for Visualizing Pandas Objects
  license: LGPL-2.1-only
  license_file: LICENSE
  summary: D-Tale is the combination of a Flask back-end and a React front-end to bring you an easy way to view & analyze Pandas data structures
  repository: https://github.com/man-group/dtale/
  documentation: https://dtale.readthedocs.io

extra:
  recipe-maintainers:
    - aschonfeld


#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dtale
