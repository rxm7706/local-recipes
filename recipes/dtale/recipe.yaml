# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dtale
  version: "3.22.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 01c3ec821327263f730afb1409f0ca7dd56f2363a92d03e7700961e6b276f8d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - dtale = dtale.cli.script:main

requirements:
  host:
    - python ==2.7|>=3.6
    - pip
    - six
  run:
    - python ==2.7|>=3.6
    - lz4
    - beautifulsoup4
    - dash
    - dash-bootstrap-components
    - dash-core-components
    - dash-html-components
    - dash_colorscales
    - dash-daq
    - Flask-Compress
    - Flask
    - future
    - itsdangerous
    - missingno !=0.4.3
    - networkx
    - openpyxl
    - pandas
    - pkginfo
    - plotly >=4.14.3
    - requests
    - seaborn
    - scikit-learn
    - scipy
    - six
    - squarify
    - statsmodels
    - strsimpy
    - xarray
    - xlrd

tests:
  - python:
      imports:
        - dtale
        - dtale.cli
      pip_check: false
  - script:
      - dtale --help

about:
  license: LGPL-2.1-only
  license_file: LICENSE
  summary: D-Tale is the combination of a Flask back-end and a React front-end to bring you an easy way to view & analyze Pandas data structures
  homepage: https://github.com/man-group/dtale/
  repository: https://github.com/man-group/dtale/
  documentation: https://dtale.readthedocs.io

extra:
  recipe-maintainers:
    - aschonfeld
