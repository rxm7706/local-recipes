# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.1"

package:
  name: odfpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/odfpy/odfpy-${{ version }}.tar.gz
  sha256: db766a6e59c5103212f3cc92ec8dd50a0f3a02790233ed0b52148b70d3c438ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - odf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/eea/odfpy
  license: Apache-2.0
  license_file: LICENSE
  summary: Python API and tools to manipulate OpenDocument files
  description: |
    Python API and tools to manipulate OpenDocument files

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: odfpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: odfpy
  cfe-purls:
    - pkg:conda/odfpy@${{ version }}?channel=conda-forge
    - pkg:pypi/odfpy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/eea/odfpy
  cfe-import-names: [odf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/odfpy-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.4.1

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T02:08:53Z
