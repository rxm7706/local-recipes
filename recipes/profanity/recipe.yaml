# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: profanity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/profanity/profanity-${{ version }}.tar.gz
  sha256: 384d7a9d59567ec64196705838f79fdc64da943e52b2b33fe6d66fb0a417a951

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - profanity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ben174/profanity
  license: MIT
  license_file: LICENSE
  summary: A Python library to check for (and clean) profanity in strings
  description: |
    A Python library to check for (and clean) profanity in strings

extra:
  recipe-maintainers:
    - rxm7706

