# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: ebcdic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/ebcdic/ebcdic-${{ version }}.tar.gz
  sha256: 3a1bedfbeee76cab2d7e4de62409ac015cd7afb25d590fe1546105c32a065cf1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ebcdic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/ebcdic
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Additional EBCDIC codecs
  description: |
    Additional EBCDIC codecs
  repository: https://github.com/roskakori/CodecMapper.git
  documentation: https://github.com/roskakori/CodecMapper/blob/master/ebcdic/README.md

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ebcdic
  cfe-upstream-registry: pypi
  cfe-upstream-name: ebcdic
