    - pkg:pypi/ebcdic@${{ version }}
  cfe-upstream-repo: https://github.com/roskakori/CodecMapper.git
  cfe-upstream-homepage: https://pypi.python.org/pypi/ebcdic
  cfe-import-names: [ebcdic]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ebcdic-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.0.1

  cfe-forge-blocker-list:
