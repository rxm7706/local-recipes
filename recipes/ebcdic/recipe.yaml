# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ebcdic
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/roskakori/CodecMapper/archive/refs/tags/v${{ version }}.tar.gz
  sha256: bc70216a1b8d49fb3ccc6d374b0a50a9f1f9ee40e83380fbec2ffa3da068e6a5

build:
  number: 0
  noarch: python
  script: cd ${{ name }}; ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - flit-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ebcdic
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Build mapping files derived from Java Charsets which can be processed by Pythons gencodec.py.
  description: |
    Build mapping files derived from Java Charsets which can be processed
    by Python's gencodec.py.
  homepage: https://github.com/roskakori/CodecMapper
  repository: https://github.com/roskakori/CodecMapper
  documentation: https://github.com/roskakori/CodecMapper

extra:
  recipe-maintainers:
    - jan-janssen
