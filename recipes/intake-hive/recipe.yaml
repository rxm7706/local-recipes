# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: intake-hive
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/intake-hive-${{ version }}.tar.gz
  sha256: 759e3c05e568a083ef0dcdc83956d1334355b98f12cb64b417b7c85f6f0aab98

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - intake >=0.5.3
    - pyspark >=2.3.0

tests:
  - python:
      imports:
        - intake_hive
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Intake Hive DataSource Plugin.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/zillow/intake-hive

extra:
  recipe-maintainers:
    - rxm7706
