# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.1"

package:
  name: autocorrect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autocorrect/autocorrect-${{ version }}.tar.gz
  sha256: 2bc68192dc645b44bece2613caac338e93548c3dac9c563095b27224c7fd4391

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - autocorrect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fsondej/autocorrect
  license: https://opensource.org/licenses/LGPL-3.0
  license_file: LICENSE
  summary: Spelling Corrector
  description: |
    Spelling Corrector

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
