    - pkg:pypi/imagesize@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/shibukawa/imagesize_py
  cfe-import-names: [imagesize]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/imagesize-feedstock
  cfe-forge-recipe-updates-needed: 
