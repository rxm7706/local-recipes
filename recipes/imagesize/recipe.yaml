# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: imagesize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imagesize/imagesize-${{ version }}.tar.gz
  sha256: 8e8358c4a05c304f1fccf7ff96f036e7243a189e9e42e90851993c558cfe9ee3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imagesize
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Getting image size from png/jpeg/jpeg2000/gif file
  description: |
    This module analyzes jpeg/jpeg2000/png/gif image header and
    return image size.
  homepage: https://github.com/shibukawa/imagesize_py
  repository: https://github.com/shibukawa/imagesize_py

extra:
  recipe-maintainers:
    - chohner
