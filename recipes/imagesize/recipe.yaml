# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: imagesize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imagesize/imagesize-${{ version }}.tar.gz
  sha256: 8e8358c4a05c304f1fccf7ff96f036e7243a189e9e42e90851993c558cfe9ee3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imagesize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shibukawa/imagesize_py
  license: MIT
  license_file: LICENSE
  summary: Get image size from headers (BMP/PNG/JPEG/JPEG2000/GIF/TIFF/SVG/Netpbm/WebP/AVIF/HEIC/HEIF)
  description: |
    Get image size from headers (BMP/PNG/JPEG/JPEG2000/GIF/TIFF/SVG/Netpbm/WebP/AVIF/HEIC/HEIF)

extra:
  recipe-maintainers:
    - chohner

#### CFE metadata AND comments
