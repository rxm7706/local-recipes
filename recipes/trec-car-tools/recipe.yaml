# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6"

package:
  name: trec-car-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trec-car-tools/trec-car-tools-${{ version }}.tar.gz
  sha256: 2fce2de120224fd569b151d5bed358a4ed334e643889b9e3dfe3e5a3d15d21c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - trec_car
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TREMA-UNH/trec-car-tools/python3
  license: MIT
  license_file: LICENSE
  summary: Support tools for TREC CAR participants. Also see trec-car.cs.unh.edu
  description: |
    Support tools for TREC CAR participants. Also see trec-car.cs.unh.edu

extra:
  recipe-maintainers:
    - rxm7706

