schema_version: 1

context:
  version: "0.0.1.dev202412041639"

package:
  name: torch-xla2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/t/torch-xla2/torch_xla2-0.0.1.dev202412041639-py3-none-any.whl
  sha256: 454b8a5a94002a006b27701c9be59bb3c098e200a29f0ba193b2b0cde69c1a94

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - absl-py
    - immutabledict
    - pytest
    - pytorch >=2.3.0

tests:
  - python:
      imports:
        - torch_xla2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/torch-xla2/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

