# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: mpi4py-installer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mpi4py-installer/mpi4py-installer-${{ version }}.tar.gz
  sha256: fe8af44d651beff3d395072c9d5c23d60c40afcc34225b5d9cb957a2ee7d5f49

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mpi4py_installer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JBlaschke/mpi4py-installer
  license: MIT
  license_file: LICENSE
  summary: No more copy+paste of magic bash commands while installing mpi4py on HPC systems.
  description: |
    No more copy+paste of magic bash commands while installing mpi4py on HPC systems.

extra:
  recipe-maintainers:
    - rxm7706

