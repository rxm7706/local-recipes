# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.11"

package:
  name: tidevice
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tidevice/tidevice-${{ version }}.tar.gz
  sha256: d54be7354e72744008c0208b3eeafc4e6d54bf864c2e4d277444370c5563ae88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pillow
    - requests
    - colored
    - packaging
    - tornado
    - simple-tornado >=0.2.2
    - retry
    - simplejson
    - tabulate
    - logzero
    - deprecation
    - importlib-metadata

tests:
  - python:
      imports:
        - tidevice
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alibaba/tidevice
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

