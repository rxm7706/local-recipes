# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: blockdiag
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/blockdiag-${{ version }}.tar.gz
  sha256: dee4195bb87d23654546ba2bf5091480dbf253b409891fce2cd527c91d00a3e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - blockdiag = blockdiag.command:main

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - setuptools
    - funcparserlib >=1.0.0a0
    - pillow >3.0
    - webcolors

tests:
  - python:
      imports:
        - blockdiag
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - blockdiag --help

about:
  summary: blockdiag generates block-diagram image from text
  license: BSD-3-Clause-HP
  license_file:
    - LICENSE
    - src/blockdiag/tests/VLGothic/LICENSE
  homepage: http://blockdiag.com/

extra:
  recipe-maintainers:
    - sodre
