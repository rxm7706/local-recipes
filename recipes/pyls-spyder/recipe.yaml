# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: pyls-spyder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyls-spyder/pyls-spyder-${{ version }}.tar.gz
  sha256: 45a321c83f64267d82907492c55199fccabda45bc872dd23bf1efd08edac1b0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-lsp-server

tests:
  - python:
      imports:
        - pyls_spyder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spyder-ide/pyls-spyder
  license: MIT
  license_file: LICENSE
  summary: Spyder extensions for the python-lsp-server
  description: |
    Spyder extensions for the python-lsp-server

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12

