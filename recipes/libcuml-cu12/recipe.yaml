# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: libcuml-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/l/libcuml-cu12/libcuml_cu12-26.8.0-py3-none-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
  sha256: f1f881aa0f97b18497d440a77fbef399089379fcdc580be529bca5204045c544

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-toolkit ==12.*
    - libcuvs-cu12 ==26.8.*
    - libnvforest-cu12 ==26.8.*
    - libraft-cu12 ==26.8.*
    - librmm-cu12 ==26.8.*
    - nvidia-nvjitlink-cu12 <13,>=12.9
    - rapids-logger ==0.2.*

tests:
  - python:
      imports:
        - libcuml_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cuml
  license: Apache-2.0
  license_file: LICENSE
  summary: cuML - RAPIDS ML Algorithms (C++)
  description: |
    cuML - RAPIDS ML Algorithms (C++)

extra:
  recipe-maintainers:
    - rxm7706

