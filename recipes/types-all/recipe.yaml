# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: types-all
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-all/types_all-${{ version }}.tar.gz
  sha256: b61d204c31b733e4296e666399c0ecf829844ab7080d77e5404fa55ef1d7d972

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-datetimerange
    - types-deprecated
    - types-flask
    - types-jack-client
    - types-jinja2
    - types-markdown
    - types-markupsafe
    - types-pillow
    - types-pyjwt
    - types-pymysql
    - types-pyyaml
    - types-routes
    - types-werkzeug
    - types-aiofiles
    - types-annoy
    - types-atomicwrites
    - types-backports
    - types-backports-abc
    - types-bleach
    - types-boto
    - types-cachetools
    - types-certifi
    - types-characteristic
    - types-chardet
    - types-click
    - types-click-spinner
    - types-colorama
    - types-contextvars
    - types-croniter
    - types-cryptography
    - types-dataclasses
    - types-dateparser
    - types-decorator
    - types-docopt
    - types-docutils
    - types-emoji
    - types-enum34
    - types-fb303
    - types-filelock
    - types-first
    - types-freezegun
    - types-frozendict
    - types-futures
    - types-geoip2
    - types-ipaddress
    - types-itsdangerous
    - types-kazoo
    - types-maxminddb
    - types-mock
    - types-mypy-extensions
    - types-nmap
    - types-openssl-python
    - types-orjson
    - types-paramiko
    - types-pathlib2
    - types-pkg-resources
    - types-polib
    - types-protobuf
    - types-pyrfc3339
    - types-pyaudio
    - types-pycurl
    - types-pyfarmhash
    - types-pymssql
    - types-pysftp
    - types-python-dateutil
    - types-python-gflags
    - types-python-slugify
    - types-pytz
    - types-pyvmomi
    - types-redis
    - types-requests
    - types-retry
    - types-scribe
    - types-simplejson
    - types-singledispatch
    - types-six
    - types-tabulate
    - types-termcolor
    - types-toml
    - types-tornado
    - types-typed-ast
    - types-tzlocal
    - types-ujson
    - types-waitress
    - types-xxhash

tests:
  - python:
      imports:
        - types_all
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/asottile/types-all
  license: MIT
  license_file: LICENSE
  summary: A shim for the typeshed changes in mypy 0.900
  description: |
    A shim for the typeshed changes in mypy 0.900

extra:
  recipe-maintainers:
    - rxm7706

