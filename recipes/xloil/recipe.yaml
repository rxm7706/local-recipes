# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.22.1"

package:
  name: xloil
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/x/xloil/xloil-0.22.1-cp310-cp310-win32.whl
  sha256: b4126a526dfc5a2b6435a272a206c752fece706e6ba0896f87a10d68a9059f53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.18
    - tomlkit

tests:
  - python:
      imports:
        - xloil
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/stevecu/xloil
  license: Apache-2.0
  license_file: LICENSE
  summary: Excel interop for Python and Jupyter
  description: |
    Excel interop for Python and Jupyter
  documentation: https://xloil.readthedocs.io/en/stable

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
