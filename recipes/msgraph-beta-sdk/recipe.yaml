# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.62.0"

package:
  name: msgraph-beta-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msgraph-beta-sdk/msgraph_beta_sdk-${{ version }}.tar.gz
  sha256: 8279627ac7ef7f4584833bb2964e0d290aeab6d94f9d1423535fb628f525e718

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.10
  run:
    - python >=${{ python_min }}
    - azure-identity >=1.12.0
    - microsoft-kiota-serialization-json <2.0.0,>=1.9.0
    - microsoft-kiota-serialization-text <2.0.0,>=1.9.0
    - microsoft-kiota-serialization-form >=1.9.0
    - microsoft-kiota-serialization-multipart >=1.9.0
    - msgraph-core >=1.5.1

tests:
  - python:
      imports:
        - msgraph_beta
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoftgraph/msgraph-beta-sdk-python#readme
  license: MIT
  license_file: LICENSE
  summary: The Microsoft Graph Beta Python SDK
  description: |
    The Microsoft Graph Beta Python SDK
  documentation: https://github.com/microsoftgraph/msgraph-beta-sdk-python/docs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
