# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.0"

package:
  name: pysam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysam/pysam-${{ version }}.tar.gz
  sha256: db0f86c15532ef5dad263748324f45d9a639668e3497d8cabce54ef47a1a78d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=59.0
    - cython >=3,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysam
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysam-developers/pysam
  license: MIT
  license_file: LICENSE
  summary: Package for reading, manipulating, and writing genomic data
  description: |
    Package for reading, manipulating, and writing genomic data
  documentation: https://pysam.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysam
  cfe-upstream-registry: pypi
  cfe-upstream-name: pysam
  cfe-purls:
