    - pkg:pypi/pysam@${{ version }}
  cfe-upstream-repo: https://github.com/pysam-developers/pysam
  cfe-upstream-homepage: https://github.com/pysam-developers/pysam
  cfe-import-names: [pysam]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
