# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.4"

package:
  name: passlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/passlib/passlib-${{ version }}.tar.gz
  sha256: defd50f72b65c5402ab2c573830a6978e5f202ad0d984793c8dde2c4152ebe04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - passlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://passlib.readthedocs.io
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: comprehensive password hashing framework supporting over 30 schemes
  description: |
    comprehensive password hashing framework supporting over 30 schemes

extra:
  recipe-maintainers:
    - pmlandwehr
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: passlib
  cfe-upstream-registry: pypi
  cfe-upstream-name: passlib
  cfe-purls:
    - pkg:conda/passlib@${{ version }}?channel=conda-forge
    - pkg:pypi/passlib@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://passlib.readthedocs.io
  cfe-import-names: [passlib]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/passlib-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.4

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

