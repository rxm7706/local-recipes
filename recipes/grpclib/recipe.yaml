# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.9"

package:
  name: grpclib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpclib/grpclib-${{ version }}.tar.gz
  sha256: cc589c330fa81004c6400a52a566407574498cb5b055fa927013361e21466c46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
    - wheel
  run:
    - python >=${{ python_min }}
    - h2 <5,>=3.1.0
    - multidict

tests:
  - python:
      imports:
        - grpclib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vmagamedov/grpclib
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Pure-Python gRPC implementation for asyncio
  description: |
    Pure-Python gRPC implementation for asyncio

extra:
  recipe-maintainers:
    - asford

#### CFE metadata AND comments
