# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: dogpile.core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dogpile.core/dogpile.core-${{ version }}.tar.gz
  sha256: be652fb11a8eaf66f7e5c94d418d2eaa60a2fe81dae500f3743a863cc9dbed76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dogpile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://bitbucket.org/zzzeek/dogpile.core
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A 'dogpile' lock, typically used as a component of a larger caching solution
  description: |
    A 'dogpile' lock, typically used as a component of a larger caching solution

extra:
  recipe-maintainers:
    - rxm7706

