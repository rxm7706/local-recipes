# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.6"

package:
  name: db-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/db-utils/db_utils-${{ version }}.tar.gz
  sha256: 825531a57d5a1bd76d9c096f27a388b1ab03e1de870510fbf2eea2234223c8ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - boto3
    - psycopg2
    - pandas
    - sqlparse
    - awscli
    - snowflake-connector-python
    - mysql-connector-python
    - pyodbc
    - jinja2

tests:
  - python:
      imports:
        - db_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ktechboston/db_utils
  license: MIT
  license_file: LICENSE
  summary: Helper class to connect to Redshift, Snowflake, DynamoDB and S3
  description: |
    Helper class to connect to Redshift, Snowflake, DynamoDB and S3

extra:
  recipe-maintainers:
    - rxm7706

