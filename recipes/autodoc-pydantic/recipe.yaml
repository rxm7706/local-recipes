# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: autodoc-pydantic
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/autodoc_pydantic-${{ version }}.tar.gz
  sha256: 3cf1b973e2f5ff0fbbe9b951c11827b5e32d3409e238f7f5782359426ab8d360

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.8.*
    - poetry
  run:
    - python >=${{ python_min }},<4.0
    - sphinx >=4.0
    - pydantic >=2.0,<3.0.0
    - pydantic-settings >=2.0,<3.0.0

tests:
  - python:
      imports:
        - sphinxcontrib
        - sphinxcontrib.autodoc_pydantic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Seamlessly integrate pydantic models in your Sphinx documentation.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mansenfranzen/autodoc_pydantic
  documentation: https://autodoc-pydantic.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - bandersen23
