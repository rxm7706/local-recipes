# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.48.0"

package:
  name: blessed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/blessed/blessed-${{ version }}.tar.gz
  sha256: 5ed4c0d40d0121669ef949e4f23465982614eb821bd110d1d5a98ed97dea13d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - wcwidth >=0.8.1
    - jinxed <3,>=2.1

tests:
  - python:
      imports:
        - blessed
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jquast/blessed
  license: MIT
  license_file: LICENSE
  summary: Easy, practical library for making terminal apps, by providing an elegant, well-documented interface for Terminals.
  description: |
    Easy, practical library for making terminal apps, by providing an elegant, well-documented interface for Terminals.
  repository: https://github.com/jquast/blessed
  documentation: https://blessed.readthedocs.io

extra:
  recipe-maintainers:
    - mattip
    - hadim

#### CFE metadata AND comments
