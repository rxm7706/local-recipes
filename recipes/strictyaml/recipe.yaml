# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.3"

package:
  name: strictyaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strictyaml/strictyaml-${{ version }}.tar.gz
  sha256: 22f854a5fcab42b5ddba8030a0e4be51ca89af0267961c8d6cfa86395586c407

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil

tests:
  - python:
      imports:
        - strictyaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://hitchdev.com/strictyaml
  license: MIT
  license_file: LICENSE.txt
  summary: Strict, typed YAML parser
  description: |
    Strict, typed YAML parser
  documentation: https://hitchdev.com/strictyaml/using

extra:
  recipe-maintainers:
    - mcs07
    - chrisburr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: strictyaml
  cfe-upstream-registry: pypi
  cfe-upstream-name: strictyaml
  cfe-purls:
    - pkg:conda/strictyaml@${{ version }}?channel=conda-forge
    - pkg:pypi/strictyaml@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://hitchdev.com/strictyaml
  cfe-import-names: [strictyaml]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/strictyaml-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.3

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T06:11:07Z
