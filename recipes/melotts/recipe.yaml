# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: melotts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/melotts/melotts-${{ version }}.tar.gz
  sha256: e1ce679ee827e99b8eeaac5715e432737fa9d00f197139d4c85757464b76d1dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - txtsplit
    - pytorch <2.0
    - torchaudio
    - cached-path
    - transformers ==4.27.4
    - mecab-python3 ==1.0.5
    - num2words ==0.5.12
    - unidic-lite ==1.0.8
    - unidic ==1.1.0
    - pykakasi ==2.2.1
    - fugashi ==1.3.0
    - g2p-en ==2.1.0
    - anyascii ==0.3.2
    - jamo ==0.4.1
    - gruut ==2.2.3
    - g2pkk >=0.1.1
    - librosa ==0.9.1
    - pydub ==0.25.1
    - eng-to-ipa ==0.0.2
    - inflect ==7.0.0
    - unidecode ==1.3.7
    - pypinyin ==0.50.0
    - cn2an ==0.5.22
    - jieba ==0.42.1
    - gradio
    - langid ==1.1.6
    - tqdm

tests:
  - python:
      imports:
        - melo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/melotts/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

