# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: rinoh-typeface-texgyrecursor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rinoh-typeface-texgyrecursor/rinoh-typeface-texgyrecursor-${{ version }}.tar.gz
  sha256: 076f7dbbd0201b0d44f4c77e4f7070474e1365152dc8509b5cded04c1648308a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rinoh_typeface_texgyrecursor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/brechtm/rinoh-typeface-texgyrecursor
  license: MIT
  license_file: LICENSE
  summary: TeX Gyre Cursor typeface
  description: |
    TeX Gyre Cursor typeface

extra:
  recipe-maintainers:
    - rxm7706

