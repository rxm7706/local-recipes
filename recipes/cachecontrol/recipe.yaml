# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.4"

package:
  name: cachecontrol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/CacheControl/cachecontrol-${{ version }}.tar.gz
  sha256: e6220afafa4c22a47dd0badb319f84475d79108100d04e26e8542ef7d3ab05a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.6,<0.10.0
  run:
    - python >=${{ python_min }}
    - requests >=2.16.0
    - msgpack <2.0.0,>=0.5.2

tests:
  - python:
      imports:
        - cachecontrol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/CacheControl/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: httplib2 caching for requests
  description: |
    httplib2 caching for requests
  repository: https://github.com/psf/cachecontrol

extra:
  recipe-maintainers:
    - djsutherland
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cachecontrol
