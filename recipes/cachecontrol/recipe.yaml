    - pkg:pypi/cachecontrol@${{ version }}
  cfe-upstream-repo: https://github.com/psf/cachecontrol
  cfe-upstream-homepage: https://pypi.org/project/CacheControl/
  cfe-import-names: [cachecontrol]
