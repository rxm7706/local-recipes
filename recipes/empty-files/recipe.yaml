# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.9"

package:
  name: empty-files
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/empty-files/empty-files-${{ version }}.tar.gz
  sha256: 22e74de327271ef9592a661aaa53bb1d5fa6cfd539dac7315625c8b30b7292ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - empty_files
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/approvals/EmptyFiles.Python
  license: Apache-2.0
  license_file: LICENSE
  summary: Serves empty files of many types
  description: |
    Serves empty files of many types

extra:
  recipe-maintainers:
    - apmorton

