# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: brewer2mpl
  version: "1.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2e094d1bea766885aa77e4ed40cc718af6458a1d5e08cc87a5f453c6095b1b1c
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 3
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - setuptools

tests:
  - python:
      imports:
        - brewer2mpl
        - brewer2mpl.wesanderson
      pip_check: false

about:
  license: MIT
  summary: Connect colorbrewer2.org color maps to Python and matplotlib
  homepage: https://github.com/jiffyclub/palettable/wiki/brewer2mpl
  documentation: https://github.com/jiffyclub/palettable/wiki/brewer2mpl

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
