# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: python-cowsay
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-cowsay/python_cowsay-${{ version }}.tar.gz
  sha256: e2700075e3814dd3d3da40d678f04abfc7916dc8c4ea289449b5d91481061988

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cowsay
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-cowsay/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Cowsay clone in Python
  description: |
    A Cowsay clone in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-cowsay
