# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytorch-metric-learning
  version: "2.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pytorch-metric-learning-${{ version }}.tar.gz
  sha256: 27a626caf5e2876a0fd666605a78cb67ef7597e25d7a68c18053dd503830701f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scikit-learn
    - tqdm
    - pytorch >=1.6.0

tests:
  - python:
      imports:
        - pytorch_metric_learning
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The easiest way to use deep metric learning in your application. Modular, flexible, and extensible. Written in PyTorch.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/KevinMusgrave/pytorch-metric-learning

extra:
  recipe-maintainers:
    - giswqs
    - KevinMusgrave
