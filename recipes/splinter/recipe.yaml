# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.21.0"

package:
  name: splinter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splinter/splinter-${{ version }}.tar.gz
  sha256: 60cbbec9209acefccf39608d677eecdb248bbd700023663ce406595322c38fe5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 <3.0,>=1.26.14

tests:
  - python:
      imports:
        - splinter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cobrateam/splinter
  license: BSD-3-Clause
  license_file: LICENSE
  summary: browser abstraction for web acceptance testing
  description: |
    browser abstraction for web acceptance testing
  repository: https://github.com/cobrateam/splinter/
  documentation: https://splinter.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: splinter
  cfe-upstream-registry: pypi
  cfe-upstream-name: splinter
  cfe-purls:
    - pkg:conda/splinter@${{ version }}?channel=conda-forge
    - pkg:pypi/splinter@${{ version }}
  cfe-upstream-repo: https://github.com/cobrateam/splinter/
  cfe-upstream-homepage: https://github.com/cobrateam/splinter
  cfe-import-names: [splinter]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
