# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: jupyter-telemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-telemetry/jupyter_telemetry-${{ version }}.tar.gz
  sha256: 445c613ae3df70d255fe3de202f936bba8b77b4055c43207edf22468ac875314

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jsonschema
    - python-json-logger
    - traitlets
    - ruamel.yaml

tests:
  - python:
      imports:
        - jupyter_telemetry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter telemetry library
  description: |
    Jupyter telemetry library

extra:
  recipe-maintainers:
    - minrk
    - consideratio

