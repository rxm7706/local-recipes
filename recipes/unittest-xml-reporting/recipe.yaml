# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.0"

package:
  name: unittest-xml-reporting
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unittest-xml-reporting/unittest_xml_reporting-${{ version }}.tar.gz
  sha256: bfa1ed65e9e6f33c161d04470d89050458cfb65a5a5d0358834ef7ce037d9136

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - lxml

tests:
  - python:
      imports:
        - xmlrunner
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/xmlrunner/unittest-xml-reporting/tree/master/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: unittest-based test runner with Ant/JUnit like XML reporting.
  description: |
    unittest-based test runner with Ant/JUnit like XML reporting.

extra:
  recipe-maintainers:
    - mxr-conda
    - oblute
    - benhuff

