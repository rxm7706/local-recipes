# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.50"

package:
  name: tableau-api-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tableau-api-lib/tableau_api_lib-${{ version }}.tar.gz
  sha256: c85e81c2b245ddd42430dd71495691b8dd218c4fc87ddccc0aa3b10594a89d72

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3
    - pandas
    - requests-toolbelt
    - bleach
    - typeguard
    - packaging

tests:
  - python:
      imports:
        - tableau_api_lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/divinorum-webb/tableau-api-lib
  license: MIT
  license_file: LICENSE
  summary: This library enables developers to call any method seen in Tableau Server's REST API documentation.
  description: |
    This library enables developers to call any method seen in Tableau Server's REST API documentation.

extra:
  recipe-maintainers:
    - rxm7706

