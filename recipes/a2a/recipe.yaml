# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.44"

package:
  name: a2a
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2a/a2a-${{ version }}.tar.gz
  sha256: 16c483f670b4aadc381f53aa1e4922b05ff2b8a1de9b581c1cca2623c2ad6483

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - a2a
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kshitijcode/a2a
  license: MIT
  license_file: LICENSE
  summary: Finds corresponding service offerings in Microsoft Azure and Amazon AWS .
  description: |
    Finds corresponding service offerings in Microsoft Azure and Amazon AWS .

extra:
  recipe-maintainers:
    - rxm7706

