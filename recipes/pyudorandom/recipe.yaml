# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pyudorandom
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyudorandom/pyudorandom-${{ version }}.tar.gz
  sha256: f30a093a0170c15f9c7f87eb29f71f0f5fde995528b7c6dc4606d389e8c37755

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyudorandom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Generate pseudorandom numbers by using algebra
  description: |
    Generate pseudorandom numbers by using algebra

extra:
  recipe-maintainers:
    - rxm7706

