# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.3"

package:
  name: behave
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/behave/behave-${{ version }}.tar.gz
  sha256: 2b8f4b64ed2ea756a5a2a73e23defc1c4631e9e724c499e46661778453ebaf51

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - cucumber-tag-expressions >=4.1.0
    - cucumber-expressions >=17.1.0
    - enum34
    - parse >=1.18.0
    - parse-type >=0.6.0
    - six >=1.15.0
    - contextlib2
    - pathlib
    - pathlib2 >=2.3.6
    - scandir >=1.10.0
    - traceback2
    - win-unicode-console
    - colorama >=0.3.7
    - tomli >=1.1.0
    - toml >=0.10.2

tests:
  - python:
      imports:
        - behave
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/behave/behave
  license: BSD-2-Clause
  license_file: LICENSE
  summary: behave is behaviour-driven development, Python style
  description: |
    behave is behaviour-driven development, Python style
  repository: https://github.com/behave/behave
  documentation: https://behave.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706
    - stuertz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: behave
