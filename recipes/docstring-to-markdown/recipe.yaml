# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17"

package:
  name: docstring-to-markdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docstring-to-markdown/docstring_to_markdown-${{ version }}.tar.gz
  sha256: df72a112294c7492487c9da2451cae0faeee06e86008245c188c5761c9590ca3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=3.6
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - docstring_to_markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/docstring-to-markdown/
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: On the fly conversion of Python docstrings to markdown
  description: |
    On the fly conversion of Python docstrings to markdown
  repository: https://github.com/python-lsp/docstring-to-markdown

extra:
  recipe-maintainers:
    - bollwyvl

