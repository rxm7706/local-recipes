# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: subprocess.run
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/subprocess.run/subprocess.run-${{ version }}.tar.gz
  sha256: 5760270139acc4cc4058184e539f5b613dbe0073d84ee43247c2e0fc5c04db4e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - run
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xando/subprocess.run
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The subprocess module extension to run processes.
  description: |
    The subprocess module extension to run processes.

extra:
  recipe-maintainers:
    - rxm7706

