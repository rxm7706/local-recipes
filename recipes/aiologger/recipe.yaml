# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: aiologger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiologger/aiologger-${{ version }}.tar.gz
  sha256: 7a4d5c91b836b61e842a791071786a3d80d6b6fa46fb8fd8e73391253ecb72ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiologger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/b2wdigital/aiologger
  license: MIT
  license_file: LICENSE
  summary: Asynchronous logging for python and asyncio
  description: |
    Asynchronous logging for python and asyncio
  repository: https://github.com/b2wdigital/aiologger
  documentation: https://aiologger.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
