# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.17.1"

package:
  name: awswrangler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/awswrangler/awswrangler-${{ version }}.tar.gz
  sha256: cc9735a854446c2ccfa25a87295078036361fc170a01c0246e4cf30d4739a2d1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - boto3 <2,>=1.20.32
    - botocore <2,>=1.23.32
    - numpy <3.0,>=1.26
    - packaging <27.0,>=21.1
    - pandas <4.0.0,>=1.2.0
    - pyarrow <26.0.0,>=8.0.0
    - setuptools
    - typing_extensions <5,>=4.4.0

tests:
  - python:
      imports:
        - awswrangler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://aws-sdk-pandas.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Pandas on AWS.
  description: |
    Pandas on AWS.
  repository: https://github.com/aws/aws-sdk-pandas
  documentation: https://aws-sdk-pandas.readthedocs.io/

extra:
  recipe-maintainers:
    - cnfait
    - malachi-constant
    - nicolas-geniteau
    - maximerihouey
    - ncolomer
    - igorborgest
    - jaidisido
    - kukushking
    - BastianZim
    - EthanBunce

