# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: voila
  version: "0.5.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 33d81577775e22d85fad989e9d115774f3cacf1ec21a92d81e9cf3c2a7d5bc3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  python:
    entry_points:
      - voila = voila.app:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - nodejs >=18,<19
    - hatch-jupyter-builder >=0.3.2
    - hatchling >=1.8.1
  run:
    - python >=${{ python_min }}
    - nbconvert >=6.4.5,<8
    - jupyter_core >=4.11.0
    - jupyterlab_server >=2.3.0,<3
    - jupyter_client >=7.4.4,<=9
    - jupyter_server >=1,<3
    - nbclient >=0.4.0
    - websockets >=9
    - traitlets >=5.0.3,<6
  run_constraints:
    - ipywidgets >=7

tests:
  - python:
      imports:
        - voila
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - voila --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Rendering of live Jupyter notebooks with interactive widgets
  description: |
    Voila serves live Jupyter notebooks including Jupyter interactive widgets.
    Unlike the usual HTML-converted notebooks, each user connecting to the
    Voila tornado application is associated with a dedicated Jupyter kernel
    which can execute triggered by Jupyter interactive widgets.

    By default, voila disallows execute requests from the front-end, disabling
    the ability to execute arbitrary code.
  homepage: https://github.com/voila-dashboards/voila
  repository: https://github.com/voila-dashboards/voila

extra:
  recipe-maintainers:
    - SylvainCorlay
    - maartenbreddels
    - JohanMabille
    - jtpio
    - trungleduc
    - martinRenou
