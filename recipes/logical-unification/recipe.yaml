# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.7"

package:
  name: logical-unification
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logical-unification/logical_unification-${{ version }}.tar.gz
  sha256: 3d73b263a870827b3f52d89c94f3336afd7fcaecf1e0c67fa18e73025399775c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.0.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - toolz
    - multipledispatch

tests:
  - python:
      imports:
        - unification
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pythological/unification
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Logical unification in Python
  description: |
    Logical unification in Python

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard

#### CFE metadata AND comments
