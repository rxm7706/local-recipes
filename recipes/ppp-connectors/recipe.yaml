# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.13"

package:
  name: ppp-connectors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ppp-connectors/ppp_connectors-${{ version }}.tar.gz
  sha256: 4ad9aed3418952103298f75a1f4cb1222f8a2585e6799197324cbd91c72a8532

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - python-dotenv <2.0.0,>=1.1.1
    - pymongo <5.0.0,>=4.15.0
    - elasticsearch <10.0.0,>=9.1.1
    - splunk-sdk <3.0.0,>=2.1.1
    - httpx <0.29.0,>=0.28.1
    - tenacity <10.0.0,>=9.1.2

tests:
  - python:
      imports:
        - ppp_connectors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ppp-connectors/
  license: MIT
  license_file: LICENSE
  summary: A simple, lightweight set of connectors and functions to various APIs and DBMSs, controlled by a central broker.
  description: |
    A simple, lightweight set of connectors and functions to various APIs and DBMSs, controlled by a central broker.

extra:
  recipe-maintainers:
    - rxm7706

