# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: nanolog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanolog/nanolog-${{ version }}.tar.gz
  sha256: a85ef8e441b76bba9daf7ba7b1fdafc79097f91c80b4cd2ef16f08c5eb38f433

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - prettyprinter

tests:
  - python:
      imports:
        - nanolog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/SurrealAI/nanolog
  license: GPL-3.0-only
  license_file: LICENSE
  summary: python logging on steroids, lightweight and convenient
  description: |
    python logging on steroids, lightweight and convenient

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
