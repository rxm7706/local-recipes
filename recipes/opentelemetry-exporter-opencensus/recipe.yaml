# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-exporter-opencensus
  version: 0.52b1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_exporter_opencensus-${{ version }}.tar.gz
  sha256: be57907cdabb4c27db9b85c9c5a7e6e7a6ee9c54183834886775ab3682f0eb6c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - grpcio >=1.66.2,<2.0.0
    - opencensus-proto >=0.1.0,<1.0.0
    - opentelemetry-api >=1.31.1
    - opentelemetry-sdk >=1.15
    - protobuf >=3.13
    - setuptools >=16.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.exporter
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script: {}

about:
  summary: OpenCensus Exporter
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-opencensus

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
