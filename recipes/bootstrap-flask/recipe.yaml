# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: Bootstrap-Flask
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: b6e5ea1ce40616fb289c9e85d4beedd43fea2048b4032f4abc83a582db494978

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools >=61.0
  run:
    - flask
    - python >=${{ python_min }}
    - wtforms

tests:
  - python:
      imports:
        - flask_bootstrap
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Bootstrap 4 & 5 helper for your Flask projects.
  license: MIT
  license_file: LICENSE
  homepage: https://bootstrap-flask.readthedocs.io
  repository: https://github.com/helloflask/bootstrap-flask
  documentation: https://bootstrap-flask.readthedocs.io

extra:
  recipe-maintainers:
    - m-rossi
