# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.6.4"

package:
  name: gcloud-aio-storage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcloud-aio-storage/gcloud_aio_storage-${{ version }}.tar.gz
  sha256: 4da741e9e45f0ab5f57aa9ba2d46032dde4b80f3eb0a03de31ac741add420485

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - aiofiles <26.0.0,>=0.6.0
    - gcloud-aio-auth <6.0.0,>=5.4.4
    - pyasn1-modules <0.5.0,>=0.2.1
    - rsa <5.0.0,>=3.1.4

tests:
  - python:
      imports:
        - gcloud.aio.storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gcloud-aio-storage/
  license: MIT
  license_file: LICENSE
  summary: Python Client for Google Cloud Storage
  description: |
    Python Client for Google Cloud Storage
  repository: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar

