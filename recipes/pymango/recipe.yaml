# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: pymango
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymango/pymango-${{ version }}.tar.gz
  sha256: 4c32e907d42c1a4e6481ee56473015f700cfed9eee650ee7d2f319216ac1c0ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pymango
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://getmango.com/
  license: MIT
  license_file: LICENSE
  summary: Python library for Mango Payment API
  description: |
    Python library for Mango Payment API

extra:
  recipe-maintainers:
    - rxm7706

