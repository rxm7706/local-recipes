# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: convertdate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/convertdate/convertdate-${{ version }}.tar.gz
  sha256: ace904a9d0230742732471748160b99d6ae881c2d0dc9a2463c7a37340c56c91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.1.1
    - wheel
  run:
    - python >=${{ python_min }}
    - pymeeus <=1,>=0.3.13

tests:
  - python:
      imports:
        - convertdate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fitnr/convertdate
  license: MIT
  license_file: LICENSE
  summary: Converts between Gregorian dates and other calendar systems
  description: |
    Converts between Gregorian dates and other calendar systems

extra:
  recipe-maintainers:
    - tacaswell
    - ocefpaf

