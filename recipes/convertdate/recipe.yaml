# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: convertdate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/convertdate/convertdate-${{ version }}.tar.gz
  sha256: ace904a9d0230742732471748160b99d6ae881c2d0dc9a2463c7a37340c56c91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pymeeus <=1,>=0.3.6
    - pytz >=2014.10

tests:
  - python:
      imports:
        - convertdate
        - convertdate.data
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: "Converts between Gregorian dates and other calendar systems.Calendars included: Baha'i, French Republican, Hebrew, Indian Civil, Islamic, ISO, Julian, Mayan and Persian."
  homepage: https://github.com/fitnr/convertdate

extra:
  recipe-maintainers:
    - tacaswell
    - ocefpaf
