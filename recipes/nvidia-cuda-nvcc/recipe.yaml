# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.3.73"

package:
  name: nvidia-cuda-nvcc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/n/nvidia-cuda-nvcc/nvidia_cuda_nvcc-13.3.73-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
  sha256: 70f250825355d2c3aa6c7a972a0ec00f020bad66d2679e527eb4336301c904aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nvidia-nvvm
    - nvidia-cuda-runtime
    - nvidia-cuda-crt

tests:
  - python:
      imports:
        - nvidia_cuda_nvcc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-zone
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CUDA nvcc
  description: |
    CUDA nvcc

extra:
  recipe-maintainers:
    - rxm7706

