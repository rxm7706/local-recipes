# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.4.0"

package:
  name: acceldata-airflow-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/acceldata-airflow-sdk/acceldata_airflow_sdk-${{ version }}.tar.gz
  sha256: ea5cd83f7c78dfc3d7a76ee2a5f1e44e72d33e3300aee03342d461298919952e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - acceldata-sdk >=26.4.0
    - requests
    - dataclasses
    - typing

tests:
  - python:
      imports:
        - acceldata_airflow_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/acceldata-airflow-sdk/
  license: Apache-2.0
  license_file: LICENSE
  summary: Acceldata Airflow SDK
  description: |
    Acceldata Airflow SDK

extra:
  recipe-maintainers:
    - rxm7706

