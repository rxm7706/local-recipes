# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0b0"

package:
  name: opentelemetry-util-genai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-util-genai/opentelemetry_util_genai-${{ version }}.tar.gz
  sha256: d5f2ab950d08b965f4f090c415eca6f0b02a87a0f07814534c38ff9bdb407c11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.43
    - opentelemetry-instrumentation ~=0.64b0
    - opentelemetry-semantic-conventions ~=0.64b0
    - wrapt <3.0.0,>=1.0.0

tests:
  - python:
      imports:
        - opentelemetry.util.genai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/util/opentelemetry-util-genai
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry GenAI Utils
  description: |
    OpenTelemetry GenAI Utils
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706

