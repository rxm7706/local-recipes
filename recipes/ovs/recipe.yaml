# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.1"

package:
  name: ovs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ovs/ovs-${{ version }}.tar.gz
  sha256: dbe6c5f5de18fc926b7258fcaf59fd4003ede90b7c34f2829888ea5e854b44c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sortedcontainers
    - if: win
      then:
        - pywin32

tests:
  - python:
      imports:
        - ovs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.openvswitch.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Open vSwitch library
  description: |
    Open vSwitch library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ovs
