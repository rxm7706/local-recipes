# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "13.3.1"

package:
  name: cuda-toolkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/c/cuda-toolkit/cuda_toolkit-13.3.1-py2.py3-none-any.whl
  sha256: 2ceda460a540323d52469bcfde48b48c1861f6482e4b5ea3cb5bdac00a1b11bd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - nvidia-cublas
        - nvidia-cuda-cccl
        - nvidia-cuda-crt
        - nvidia-cuda-culibos
        - nvidia-cuda-cuobjdump
        - nvidia-cuda-cupti
        - nvidia-cuda-cuxxfilt
        - nvidia-cuda-nvcc
        - nvidia-cuda-nvdisasm
        - nvidia-cuda-nvrtc
        - nvidia-cuda-opencl
        - nvidia-cuda-profiler-api
        - nvidia-cuda-runtime
        - nvidia-cuda-sanitizer-api
        - nvidia-cuda-tileiras
        - nvidia-cudla
        - nvidia-cufft
        - nvidia-cufile
        - nvidia-curand
        - nvidia-cusolver
        - nvidia-cusparse
        - nvidia-npp
        - nvidia-nvfatbin
        - nvidia-nvjitlink
        - nvidia-nvjpeg
        - nvidia-nvml-dev
        - nvidia-nvptxcompiler
        - nvidia-nvtx
        - nvidia-nvvm
        - nvidia-cuda-cccl
        - nvidia-cuda-crt
        - nvidia-cublas
        - nvidia-cuda-nvrtc
        - nvidia-cuda-runtime
        - nvidia-cudla
        - nvidia-cufft
        - nvidia-nvjitlink
        - nvidia-cufile
        - nvidia-cuda-culibos
        - nvidia-cuda-cuobjdump
        - nvidia-cuda-cupti
        - nvidia-curand
        - nvidia-cublas
        - nvidia-cusolver
        - nvidia-cusparse
        - nvidia-nvjitlink
        - nvidia-cusparse
        - nvidia-nvjitlink
        - nvidia-cuda-cuxxfilt
        - nvidia-npp
        - nvidia-cuda-crt
        - nvidia-cuda-nvcc
        - nvidia-cuda-runtime
        - nvidia-nvvm
        - nvidia-cuda-nvdisasm
        - nvidia-nvfatbin
        - nvidia-nvjitlink
        - nvidia-nvjpeg
        - nvidia-nvml-dev
        - nvidia-nvptxcompiler
        - nvidia-cuda-nvrtc
        - nvidia-nvtx
        - nvidia-nvvm
        - nvidia-cuda-opencl
        - nvidia-cuda-profiler-api
        - nvidia-cuda-sanitizer-api
        - nvidia-cuda-nvcc
        - nvidia-cuda-tileiras
        - nvidia-nvjitlink
        - nvidia-nvvm

tests:
  - python:
      imports:
        - cuda_toolkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.nvidia.com/cuda-toolkit
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: CUDA Toolkit meta-package
  description: |
    CUDA Toolkit meta-package
  documentation: https://docs.nvidia.com/cuda/

extra:
  recipe-maintainers:
    - conda-forge/cuda

