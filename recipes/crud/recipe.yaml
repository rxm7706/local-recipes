# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: crud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/crud/crud-${{ version }}.tar.gz
  sha256: 45aabbf1d5b9a0406059c4210ce5aadd83f369b24628756eb9b6366d813b0a31

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - crud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: CRUD operations for wsgi applications
  description: |
    CRUD operations for wsgi applications

extra:
  recipe-maintainers:
    - rxm7706

