    - pkg:pypi/pyperclip@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/asweigart/pyperclip
  cfe-import-names: [pyperclip]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
