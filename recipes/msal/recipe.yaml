# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.37.0"

package:
  name: msal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msal/msal-${{ version }}.tar.gz
  sha256: 1b1672a33ee467c1d70b341bb16cafd51bb3c817147a95b93263794b03971bec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.0.0
    - pyjwt <3,>=1.0.0
    - cryptography <51,>=2.5

tests:
  - python:
      imports:
        - msal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AzureAD/microsoft-authentication-library-for-python
  license: MIT
  license_file: LICENSE
  summary: The Microsoft Authentication Library (MSAL) for Python library enables your app to access the Microsoft Cloud by supporting authentication of users with Microsoft Azure Active Directory accounts (AAD) and Microsoft Accounts (MSA) using industry standard OAuth2 and OpenID Connect.
  description: |
    The Microsoft Authentication Library (MSAL) for Python library enables your app to access the Microsoft Cloud by supporting authentication of users with Microsoft Azure Active Directory accounts (AAD) and Microsoft Accounts (MSA) using industry standard OAuth2 and OpenID Connect.
  documentation: https://msal-python.readthedocs.io/

extra:
  recipe-maintainers:
    - janjagusch
    - roederja
    - dhirschfeld

