# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: msal
  version: "1.37.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1b1672a33ee467c1d70b341bb16cafd51bb3c817147a95b93263794b03971bec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.0.0
    - pyjwt <3,>=1.0.0
    - cryptography <51,>=2.5

tests:
  - python:
      imports:
        - msal
        - msal.oauth2cli
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Microsoft Authentication Library (MSAL) for Python makes it easy to authenticate to Azure Active Directory
  description: |
    The MSAL library for Python enables your app to access the Microsoft Cloud by supporting
    authentication of users with Microsoft Azure Active Directory accounts and Microsoft Accounts
    using industry standard OAuth2 and OpenID Connect.
  homepage: https://github.com/AzureAD/microsoft-authentication-library-for-python
  repository: https://github.com/AzureAD/microsoft-authentication-library-for-python
  documentation: https://msal-python.readthedocs.io

extra:
  recipe-maintainers:
    - janjagusch
    - roederja
    - dhirschfeld
