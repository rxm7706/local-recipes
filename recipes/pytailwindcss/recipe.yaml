# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"
  python_min: "3.11"

package:
  name: pytailwindcss
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytailwindcss/pytailwindcss-${{ version }}.tar.gz
  sha256: e83c65985f078ff91500f74bca595f615e54059d5afc90b233382e118b509b4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytailwindcss
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/timonweb/pytailwindcss
  license: MIT
  license_file: LICENSE
  summary: Standalone Tailwind CSS CLI, installable via pip. Use Tailwind CSS without Node.js.
  description: |
    Standalone Tailwind CSS CLI, installable via pip. Use Tailwind CSS without Node.js.

extra:
  recipe-maintainers:
    - rxm7706

