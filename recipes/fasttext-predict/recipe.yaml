# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.2.4"

package:
  name: fasttext-predict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fasttext-predict/fasttext_predict-${{ version }}.tar.gz
  sha256: 18a6fb0d74c7df9280db1f96cb75d990bfd004fa9d669493ea3dd3d54f84dbc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - pybind11 >=2.10.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python.fasttext_module.fasttext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/searxng/fasttext-predict/
  license: MIT
  license_file: LICENSE
  summary: fasttext with wheels and no external dependency, but only the predict method (<1MB)
  description: |
    fasttext with wheels and no external dependency, but only the predict method (<1MB)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
