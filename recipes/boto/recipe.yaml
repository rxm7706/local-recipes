# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.49.0"

package:
  name: boto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boto/boto-${{ version }}.tar.gz
  sha256: ea0d3b40a2d852767be77ca343b58a9e3a4b00d9db440efb8da74b4e58025e5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - boto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/boto/boto/
  license: MIT
  license_file: LICENSE
  summary: Amazon Web Services Library
  description: |
    Amazon Web Services Library

extra:
  recipe-maintainers:
    - mariusvniekerk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: boto
  cfe-upstream-registry: pypi
  cfe-upstream-name: boto
