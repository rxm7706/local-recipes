    - pkg:pypi/boto@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/boto/boto/
  cfe-import-names: [boto]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/boto-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.49.0

  cfe-forge-blocker-list:
