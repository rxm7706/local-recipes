# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.1.30"

package:
  name: scrapli-community
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scrapli-community/scrapli_community-${{ version }}.tar.gz
  sha256: 5357d1e471879203f648948adf114d8155a69ca1242060504d9b92f54f79d119

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - scrapli >=2021.07.30a1

tests:
  - python:
      imports:
        - scrapli_community
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapli/scrapli_community
  license: MIT
  license_file: LICENSE
  summary: Easily add support for 'non-core' platforms to scrapli
  description: |
    Easily add support for 'non-core' platforms to scrapli
  documentation: https://scrapli.github.io/scrapli_community/

extra:
  recipe-maintainers:
    - rxm7706

