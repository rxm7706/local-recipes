# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: pydantic-ai-filesystem-sandbox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-ai-filesystem-sandbox/pydantic_ai_filesystem_sandbox-${{ version }}.tar.gz
  sha256: d8d81f01d5c9330e4df24302055c989427e349634d553912dd16e9b45258b69e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic-ai-blocking-approval >=0.7.0
    - pydantic-ai >=0.1
    - pydantic >=2.0

tests:
  - python:
      imports:
        - pydantic_ai_filesystem_sandbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zby/pydantic-ai-filesystem-sandbox
  license: MIT
  license_file: LICENSE
  summary: Filesystem sandbox toolset for PydanticAI agents with LLM-friendly errors
  description: |
    Filesystem sandbox toolset for PydanticAI agents with LLM-friendly errors
  repository: https://github.com/zby/pydantic-ai-filesystem-sandbox

extra:
  recipe-maintainers:
    - rxm7706

