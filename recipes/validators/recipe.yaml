    - pkg:pypi/validators@${{ version }}
  cfe-upstream-repo: https://github.com/python-validators/validators
  cfe-upstream-homepage: https://python-validators.github.io/validators
  cfe-import-names: [validators]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/validators-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.35.0

  cfe-forge-blocker-list:
