# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.35.0"

package:
  name: validators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/validators/validators-${{ version }}.tar.gz
  sha256: 992d6c48a4e77c81f1b4daba10d16c3a9bb0dbb79b3a19ea847ff0928e70497a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - validators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://python-validators.github.io/validators
  license: MIT
  license_file: LICENSE.txt
  summary: Python Data Validation for Humans™
  description: |
    Python Data Validation for Humans™
  repository: https://github.com/python-validators/validators
  documentation: https://yozachar.github.io/pyvalidators

extra:
  recipe-maintainers:
    - brl0
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: validators
  cfe-upstream-registry: pypi
  cfe-upstream-name: validators
