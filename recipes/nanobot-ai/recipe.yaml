# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: nanobot-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanobot-ai/nanobot_ai-${{ version }}.tar.gz
  sha256: ff10abe426b6b86b724513ef94a3c949e22b88dc2df5a5353518ff6538fd0b1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anthropic <1.0.0,>=0.45.0
    - chardet <6.0.0,>=3.0.2
    - croniter <7.0.0,>=6.0.0
    - ddgs <10.0.0,>=9.5.5
    - defusedxml <1.0.0,>=0.7.1
    - dulwich <1.0.0,>=0.22.0
    - filelock >=3.25.2
    - httpx <1.0.0,>=0.28.0
    - jinja2 <4.0.0,>=3.1.0
    - json-repair <1.0.0,>=0.57.0
    - loguru <1.0.0,>=0.7.3
    - lxml-html-clean <1.0.0,>=0.4.0
    - mcp <2.0.0,>=1.26.0
    - oauth-cli-kit <1.0.0,>=0.1.6
    - openai >=2.8.0
    - openpyxl <4.0.0,>=3.1.0
    - packaging >=24.0
    - prompt-toolkit <4.0.0,>=3.0.50
    - pydantic-settings <3.0.0,>=2.12.0
    - pydantic <3.0.0,>=2.12.0
    - pypdf <6.0.0,>=5.0.0
    - python-docx <2.0.0,>=1.1.0
    - python-pptx <2.0.0,>=1.0.0
    - pyyaml <7.0.0,>=6.0
    - questionary <3.0.0,>=2.0.0
    - readability-lxml <1.0.0,>=0.8.4
    - rich <15.0.0,>=14.0.0
    - tiktoken <1.0.0,>=0.12.0
    - typer <1.0.0,>=0.20.0
    - watchfiles <2.0.0,>=1.1.1
    - websocket-client <2.0.0,>=1.9.0
    - websockets <17.0,>=16.0
    - if: win
      then:
        - python-tzdata

tests:
  - python:
      imports:
        - nanobot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nanobot-ai/
  license: MIT
  license_file: LICENSE
  summary: A lightweight personal AI assistant framework
  description: |
    A lightweight personal AI assistant framework

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nanobot-ai
