# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.1.1"

package:
  name: aiorun
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiorun/aiorun-${{ version }}.tar.gz
  sha256: 86d1075a034ce2671ab532db06e9204fe784cdd0c66ca7b8cc47a7527d0d50a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiorun
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cjrh/aiorun
  license: Apache-2.0
  license_file: LICENSE
  summary: Boilerplate for asyncio applications
  description: |
    Boilerplate for asyncio applications

extra:
  recipe-maintainers:
    - scopatz

