# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bibtexparser
  version: "1.4.4"
  sha256: 093b6c824f7a71d3a748867c4057b71f77c55b8dbc07efc993b781771520d8fb

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pyparsing >=2.0.3
    - python ${{ python_min }}
    - setuptools
  run:
    - pyparsing >=2.0.3
    - python >=${{ python_min }}

tests:
  - python:
      imports: bibtexparser
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: LGPL-3.0-only OR BSD-3-Clause
  license_file: COPYING
  summary: A module for parsing BibTeX files.
  homepage: https://bibtexparser.readthedocs.org/

extra:
  recipe-maintainers:
    - pkgw
