# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.28.0"

package:
  name: arq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arq/arq-${{ version }}.tar.gz
  sha256: a458188aefc2d7ee17d136f80d8fa8df1d6eba4ceebdead87e9f172d027dc311

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.0
    - redis-py <6,>=4.2.0

tests:
  - python:
      imports:
        - arq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-arq/arq
  license: MIT
  license_file: LICENSE
  summary: Job queues in python with asyncio and redis
  description: |
    Job queues in python with asyncio and redis
  repository: https://github.com/python-arq/arq
  documentation: https://arq-docs.helpmanual.io

extra:
  recipe-maintainers:
    - maresb
    - mgorny

