# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.2"

package:
  name: junos-eznc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/junos-eznc/junos_eznc-${{ version }}.tar.gz
  sha256: bb0426e74bce4544405723a9047341ede91b29cd9b61f1be9e633a55c470fffc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml >=3.2.4
    - ncclient ==0.7.0
    - scp >=0.7.0
    - jinja2 >=3.1.6
    - pyyaml >=5.1
    - paramiko >=3.5.0
    - six
    - pyserial
    - yamlloader
    - pyparsing
    - transitions

tests:
  - python:
      imports:
        - lib.jnpr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.github.com/Juniper/py-junos-eznc
  license: Apache-2.0
  license_file: LICENSE
  summary: Junos 'EZ' automation for non-programmers
  description: |
    Junos 'EZ' automation for non-programmers

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
