# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ydata-synthetic
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ydata_synthetic-${{ version }}.tar.gz
  sha256: bbb37d8d1cd079a74b50587885274f30a9f603d147d64761408dfa420634244c
  patches:
    - patches/0001-import-warn.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.12
    - requests >=2.28,<2.31
    - pandas <3
    - numpy <2
    - scikit-learn <2
    - matplotlib-base <4
    - tensorflow-cpu 2.15.*
    - tensorflow-probability
    - easydict
    - pmlb 1.0.*
    - tqdm <5.0
    - typeguard 4.2.*
    - pytest 7.4.*

tests:
  - python:
      imports:
        - ydata_synthetic
      pip_check: false
      python_version: ${{ python_min }}

about:
  summary: Synthetic data generation methods with different synthetization methods.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ydataai/ydata-synthetic

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
