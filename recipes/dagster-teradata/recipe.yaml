# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dagster-teradata
  version: "0.0.7"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dagster_teradata-${{ version }}.tar.gz
  sha256: 55ff0c58affcf54ca7118269a11a39a4e80c54b48a6c8543fa850f0166e56164

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - setuptools >=42
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - dagster >=1.8.0
    - teradatasql
    - paramiko

tests:
  - python:
      imports:
        - dagster_teradata
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A dagster module that provides integration with Teradata Vantage.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dagster-io/community-integrations

extra:
  recipe-maintainers:
    - rxm7706
