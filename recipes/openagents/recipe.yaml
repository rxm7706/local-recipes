# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.3.post20"

package:
  name: openagents
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openagents/openagents-${{ version }}.tar.gz
  sha256: 3146d56740834e049b55eda3d7216c41181c039d5292c2bf1c292f6104ece65e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - sdk
    - pydantic >=2.0.0
    - pyyaml >=6.0
    - typing_extensions >=4.4.0
    - packaging >=21.0
    - aiohttp >=3.9.0
    - websockets >=11.0
    - asyncio-throttle >=1.0.0
    - requests >=2.25.0
    - click >=8.1.0
    - rich >=13.0.0
    - typer >=0.9.0
    - textual >=0.47.0
    - python-dotenv >=1.0.0

tests:
  - python:
      imports:
        - sdk.src.openagents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://openagents.org
  license: Apache-2.0
  license_file: LICENSE
  summary: A flexible framework for building multi-agent systems with customizable protocols
  description: |
    A flexible framework for building multi-agent systems with customizable protocols
  repository: https://github.com/openagents-org/openagents
  documentation: https://openagents.org/docs/getting-started/overview

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: openagents
  cfe-upstream-registry: pypi
  cfe-upstream-name: openagents
