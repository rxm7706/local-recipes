# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sphinxext-opengraph
  version: "0.13.0"
  sha256: 103335d08567ad8468faf1425f575e3b698e9621f9323949a6c8b96d9793e80b

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0]|lower }}/${{ name|lower }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - flit-core >=3.12
  run:
    - sphinx >=6
    # Not in pyproject.toml, but referenced in code (automatically installed by Sphinx)
    - docutils
    - python >=${{ python_min }}
    - matplotlib-base >=3

tests:
  - python:
      imports:
        - sphinxext.opengraph
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENCE.rst
  summary: Sphinx extension to generate Open Graph metadata
  description: |
    Sphinx extension to generate Open Graph metadata
    for each page of your documentation.
  homepage: https://sphinxext-opengraph.readthedocs.io/
  repository: https://github.com/sphinx-doc/sphinxext-opengraph
  documentation: https://sphinxext-opengraph.readthedocs.io/

extra:
  recipe-maintainers:
    - CAM-Gerlach
    - manics
