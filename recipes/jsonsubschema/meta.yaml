{% set name = "jsonsubschema" %}
{% set version = "0.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jsonsubschema-{{ version }}.tar.gz
  sha256: 39846ece264fe62aae5dd86e71bef8899a5d0869b8be03ab582066acbee7f9d9

build:
  entry_points:
    - jsonsubschema=jsonsubschema.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - portion
    - greenery >=4.0.0
    - jsonschema
    - jsonref

test:
  imports:
    - jsonsubschema
  commands:
    - pip check
    - jsonsubschema --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/IBM/jsonsubschema
  summary: A tool to check whether a JSON schema is subset/subschema of another JSON schema
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - josk0
