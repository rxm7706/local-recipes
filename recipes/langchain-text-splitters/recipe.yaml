# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: langchain-text-splitters
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-text-splitters/langchain_text_splitters-${{ version }}.tar.gz
  sha256: 782a723db0a4746ac91e251c7c1d57fd23636e4f38ed733074e28d7a86f41627

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core <2.0.0,>=1.2.31

tests:
  - python:
      imports:
        - langchain_text_splitters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/
  license: MIT
  license_file: LICENSE
  summary: LangChain text splitting utilities
  description: |
    LangChain text splitting utilities
  repository: https://github.com/langchain-ai/langchain
  documentation: https://docs.langchain.com/

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw

