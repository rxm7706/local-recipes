# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchain-text-splitters
  version: "1.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_text_splitters-${{ version }}.tar.gz
  sha256: 782a723db0a4746ac91e251c7c1d57fd23636e4f38ed733074e28d7a86f41627

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - pip >=25.2
    - python >=${{ python_min }}
    - langchain-core >=1.2.31,<2.0.0

tests:
  - python:
      imports:
        - langchain_text_splitters
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: LangChain text splitting utilities
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain
  repository: https://github.com/langchain-ai/langchain/tree/master/libs/text-splitters

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
