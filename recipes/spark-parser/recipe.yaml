# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: spark-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spark-parser/spark_parser-${{ version }}.tar.gz
  sha256: dc66d48c4265c4133db41a9c5fe9c1c502b3b20167df158a0f234cd31712cf64

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spark_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rocky/python-spark/
  license: MIT
  license_file: LICENSE
  summary: An Earley-Algorithm Context-free grammar Parser Toolkit
  description: |
    An Earley-Algorithm Context-free grammar Parser Toolkit

extra:
  recipe-maintainers:
    - rxm7706

