# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: string-color
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/string-color/string_color-${{ version }}.tar.gz
  sha256: 007f15c33ef178c9f3d6e55cb812cab4b7ab63df931e06b2e60afd36e3b77ca0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - columnar >=1.3.1
    - colorama
    - importlib-metadata

tests:
  - python:
      imports:
        - stringcolor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/shindagger/string-color
  license: MIT
  license_file: LICENSE
  summary: just another mod to print strings in 256 colors in the terminal.
  description: |
    just another mod to print strings in 256 colors in the terminal.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
