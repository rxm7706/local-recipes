# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"

package:
  name: argostranslate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/argostranslate/argostranslate-${{ version }}.tar.gz
  sha256: be43fa826cbac15399a33a90c842dfe504ad6b8fa55e252514e7071f5425b406

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ctranslate2 <5,>=4.0
    - minisbd
    - packaging
    - sacremoses <0.2,>=0.0.53
    - sentencepiece <0.3,>=0.2.0
    - spacy
    - stanza ==1.10.1

tests:
  - python:
      imports:
        - argostranslate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.argosopentech.com
  license: MIT
  license_file: LICENSE
  summary: Open-source neural machine translation library based on OpenNMT's CTranslate2
  description: |
    Open-source neural machine translation library based on OpenNMT's CTranslate2
  repository: https://github.com/argosopentech/argos-translate
  documentation: https://argos-translate.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
