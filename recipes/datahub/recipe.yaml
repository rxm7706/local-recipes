schema_version: 1

context:
  version: "0.999.1"

package:
  name: datahub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datahub/datahub-${{ version }}.tar.gz
  sha256: 76c94974d00897fb680ba1f3eceed029d13b8d048947862f3f1b9617efd81b01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acryl-datahub

tests:
  - python:
      imports:
        - datahub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/acryl-datahub
  license: MIT
  license_file: LICENSE
  summary: Dummy package for acryl-datahub
  description: |
    Dummy package for acryl-datahub

extra:
  recipe-maintainers:
    - rxm7706

