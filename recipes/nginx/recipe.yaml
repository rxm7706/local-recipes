# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: nginx
  version: "1.31.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/release-{{ version }}.tar.gz
  url: https://nginx.org/download/${{ name }}-${{ version }}.tar.gz
  sha256: a7657c50811c2d92d9895395e8b873ef60398142c4db21eb647811c38f6dd525
  file_name: ${{ name }}-${{ version }}.tar.gz
  patches:
    - if: osx and arm64
      then: test.patch
    - pcre-config.patch  # find pcre in PREFIX instead of /usr

build:
  number: 0
  skip: win
  always_copy_files:
    - etc/*
    - var/log/nginx/*

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - make
    - gnuconfig
  host:
    - libgd
    - libxslt ==1.1.39
    - if: linux
      then: libgcrypt
    - openssl
    - pcre2
    - zlib

tests:
  - requirements:
      run:
        - curl
        - if: linux
          then: procps-ng
    script:
      - nginx -h

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Nginx is an HTTP and reverse proxy server
  description: |
    Nginx can act as a reverse proxy server for TCP, UDP, HTTP, HTTPS, SMTP,
    POP3, IMAP, and gRPC protocols, as well as a load balancer and an HTTP cache.
    Nginx uses an asynchronous event-driven approach to handling requests.
  homepage: http://www.nginx.org
  repository: http://hg.nginx.org/nginx
  documentation: http://nginx.org/en/docs

extra:
  recipe-maintainers:
    - sodre
    - fhoehle
    - pavelzw
    - hobu
