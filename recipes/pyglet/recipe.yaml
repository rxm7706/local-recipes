# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.15"

package:
  name: pyglet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyglet/pyglet-${{ version }}.tar.gz
  sha256: 0ef34fe730808a97e48c24dd6ed4ff614024b980955ed8dbc2dd01ededaa08cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}
    - freetype
    - ffmpeg >=4.0.0

tests:
  - files:
      recipe:
        - run_tests.py
    requirements:
      run:
        - if: linux
          then: libglu
        - python ${{ python_min }}
        - pip
    script:
      - pip check
      - if: not linux
        then: python run_tests.py
      - if: linux
        then: xvfb-run --server-args=":99 -screen 0 1024x768x24 -ac +extension GLX -noreset" python run_tests.py

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  homepage: http://pyglet.org
  repository: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hmaarrfk  # just a maintainer to help move things forward. Happy to retire myself
