# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.3"

package:
  name: markdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/Markdown/markdown-${{ version }}.tar.gz
  sha256: 3589362618f743188b4d955b874402bc814f4f83f544dc207719f4baa7d9c45f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://Python-Markdown.github.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python implementation of John Gruber's Markdown.
  description: |
    Python implementation of John Gruber's Markdown.
  repository: https://github.com/Python-Markdown/markdown
  documentation: https://Python-Markdown.github.io/

extra:
  recipe-maintainers:
    - djsutherland
    - philip-khor

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: markdown
  cfe-upstream-registry: pypi
  cfe-upstream-name: markdown
  cfe-purls:
    - pkg:conda/markdown@${{ version }}?channel=conda-forge
    - pkg:pypi/markdown@${{ version }}
  cfe-upstream-repo: https://github.com/Python-Markdown/markdown
  cfe-upstream-homepage: https://Python-Markdown.github.io/
  cfe-import-names: [markdown]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/markdown-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:25:12Z
