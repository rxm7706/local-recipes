# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.92"
  python_min: "3.11"

package:
  name: chex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chex/chex-${{ version }}.tar.gz
  sha256: fa8beff1124204ae466a6eb13cb91ae3c24322a1c7216946aee93d031e2f1996

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - absl-py >=2.3.1
    - typing_extensions >=4.15.0
    - jax >=0.7.0
    - jaxlib >=0.7.0
    - numpy >=1.24.1
    - toolz >=1.0.0

tests:
  - python:
      imports:
        - chex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google-deepmind/chex
  license: Apache-2.0
  license_file: LICENSE
  summary: "Chex: Testing made fun, in JAX!"
  description: |
    Chex: Testing made fun, in JAX!
  documentation: https://chex.readthedocs.io/

extra:
  recipe-maintainers:
    - jan-janssen
    - PhilipVinc
    - hbq1

#### CFE metadata AND comments
# CFE metadata
