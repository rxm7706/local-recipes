# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: chex
  version: 0.1.92
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/chex-${{ version }}.tar.gz
  sha256: fa8beff1124204ae466a6eb13cb91ae3c24322a1c7216946aee93d031e2f1996

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolatio

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - flit-core
  run:
    - typing_extensions >=4.15.0
    - python >=${{ python_min }}
    - absl-py >=2.3.1
    - jax >=0.7.0
    - jaxlib >=0.7.0
    - numpy >=1.24.1
    - toolz >=1.0.0
tests:
  - python:
      imports:
        - chex
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: 'Chex: Testing made fun, in JAX!'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/deepmind/chex

extra:
  recipe-maintainers:
    - jan-janssen
    - PhilipVinc
    - hbq1
