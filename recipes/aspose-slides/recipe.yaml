# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7.0"

package:
  name: aspose-slides
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/aspose-slides/aspose_slides-26.7.0-py3-none-macosx_10_14_x86_64.whl
  sha256: c17e8b017285e984253fc8a9b4ffba13109256b3e1e5cea2fd70019e310b03a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aspose_slides
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://products.aspose.com/slides/python-net/
  license: https://about.aspose.com/legal/eula/
  license_file: LICENSE
  summary: Aspose.Slides for Python via .NET is a presentation file formats processing library for working with Microsoft PowerPoint files without using Microsoft PowerPoint.
  description: |
    Aspose.Slides for Python via .NET is a presentation file formats processing library for working with Microsoft PowerPoint files without using Microsoft PowerPoint.
  documentation: https://docs.aspose.com/slides/python-net/

extra:
  recipe-maintainers:
    - rxm7706

