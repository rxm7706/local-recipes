# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: impala
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/impala/impala-${{ version }}.tar.gz
  sha256: f7b1f7f34af30ea9912c4afd65dc0c76c0ab30aa1fe64d0c81f72f31f5720523

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - impala
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/roman-neuhauser/py-impala
  license: MIT
  license_file: LICENSE
  summary: Import packages from "wrongly" named directories
  description: |
    Import packages from "wrongly" named directories

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: impala
  cfe-upstream-registry: pypi
  cfe-upstream-name: impala
