# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: profiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/profiler/profiler-${{ version }}.tar.gz
  sha256: ddef5c12d48aac1ce0473d628242ba6f7cd7be3bd8ab8ecfec758431b3c903c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - profiler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bpabel/profiler
  license: MIT
  license_file: LICENSE
  summary: Simple tool to make profiling easy.
  description: |
    Simple tool to make profiling easy.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: profiler
  cfe-upstream-registry: pypi
  cfe-upstream-name: profiler
  cfe-purls:
