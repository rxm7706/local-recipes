# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyct-core
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/p/pyct/pyct-${{ version }}.tar.gz
  sha256: dd9f4ac5cbd8e37c352c04036062d3c5f67efec76d404761ef16b0cbf26aa6a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pyct=pyct.__main__:main

requirements:
  host:
    - python >=3.7
    - param >=1.7.0
    - setuptools >=61.0
    - pip
  run:
    - distutils
    - python >=3.7
    - param >=1.7.0
    # cli
    - pyyaml
    - requests
  run_constraints:
    - pyct 0.5.0.*

tests:
  - python:
      imports:
        - pyct
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - pyct --help

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Common tasks for package building (e.g. bundle examples)
  homepage: https://github.com/pyviz/pyct
  repository: https://github.com/pyviz/pyct
  documentation: https://github.com/pyviz/pyct#pyctbuild

extra:
  recipe-maintainers:
    - ceball

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyct-core
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyct-core
  cfe-purls:
    - pkg:conda/pyct-core@${{ version }}?channel=conda-forge
    - pkg:pypi/pyct-core@${{ version }}
  cfe-upstream-repo: https://github.com/pyviz/pyct
  cfe-upstream-homepage: https://github.com/pyviz/pyct
  cfe-import-names: [pyct]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pyct-core-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T03:30:06Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T03:30:06Z
  cfe-local-build-status: build-clean-test-blocked
  cfe-local-build-datetime: 2026-08-18T03:30:06Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
