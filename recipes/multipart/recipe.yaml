# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: multipart
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/multipart/multipart-${{ version }}.tar.gz
  sha256: d6076567b489270271d9ec103d404745da1501ad5b70e3a7f1f07f5623d82850

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.9,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - multipart
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://multipart.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Parser for multipart/form-data
  description: |
    Parser for multipart/form-data
  repository: https://github.com/defnull/multipart
  documentation: https://multipart.readthedocs.io/

extra:
  recipe-maintainers:
    - ocefpaf

