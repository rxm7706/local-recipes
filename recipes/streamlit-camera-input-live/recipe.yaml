# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: streamlit-camera-input-live
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-camera-input-live/streamlit-camera-input-live-${{ version }}.tar.gz
  sha256: 20ceb952b98410084176fcfeb9148e02ea29033a88d4a923161ac7890cedae0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit
    - jinja2

tests:
  - python:
      imports:
        - camera_input_live
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/blackary/streamlit-camera-input-live
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Alternative version of st.camera_input which returns the webcam images live, without any button press needed
  description: |
    Alternative version of st.camera_input which returns the webcam images live, without any button press needed

extra:
  recipe-maintainers:
    - rxm7706

