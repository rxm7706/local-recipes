# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: copilot-token-tracker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/copilot-token-tracker/copilot_token_tracker-${{ version }}.tar.gz
  sha256: b7492f65d91f1495df261a6b2f545486f44b45de8875e0efffdb421c3daa5b96

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tokentracker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/J-Bax/copilot-token-tracker
  license: MIT
  license_file: LICENSE
  summary: Global token tracker for GitHub Copilot CLI and VS Code sessions
  description: |
    Global token tracker for GitHub Copilot CLI and VS Code sessions
  repository: https://github.com/J-Bax/copilot-token-tracker

extra:
  recipe-maintainers:
    - rxm7706

