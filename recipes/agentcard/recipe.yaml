# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: agentcard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agentcard/agentcard-${{ version }}.tar.gz
  sha256: 1b1b3c49c46c14b020bfa1483ded92409093b81418f525ead4fb6726fe96d1ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - agentcard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/urteagatech/agentcard
  license: MIT
  license_file: LICENSE
  summary: A lightweight framework for documenting operational AI agents.
  description: |
    A lightweight framework for documenting operational AI agents.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: agentcard
  cfe-upstream-registry: pypi
  cfe-upstream-name: agentcard
  cfe-purls:
    - pkg:conda/agentcard@${{ version }}?channel=conda-forge
    - pkg:pypi/agentcard@${{ version }}
  cfe-upstream-repo: https://github.com/urteagatech/agentcard
  cfe-upstream-homepage: https://github.com/urteagatech/agentcard
  cfe-import-names: [agentcard]
