# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.10.post3"
  python_min: "3.11"

package:
  name: access
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/access/access-${{ version }}.tar.gz
  sha256: 3dbfbd7cc5a09d30ad314955d061fb46fd2d48ce1f84f15adc5b760bb8b4a34b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=1.0.1
    - numpy >=1.26.0
    - pandas >=2.1.0
    - scipy >=1.14.1

tests:
  - python:
      imports:
        - access
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/access/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Calculate spatial accessibility metrics.
  description: |
    Access is a class and function for calculating the spatial accessibility
    of resources.  It is designed for python 3.7 and higher.
    Pandas (and numpy) are required, and geopandas allows for some additional functionality.
  repository: https://github.com/pysal/access
  documentation: https://pysal.org/access/

extra:
  recipe-maintainers:
    - ocefpaf
    - JamesSaxon
    - jkoschinsky
    - martinfleis
    - knaaptime
    - jGaboardi

