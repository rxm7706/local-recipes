# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"

package:
  name: python-ulid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-ulid/python_ulid-${{ version }}.tar.gz
  sha256: bbeec02556190bb9dc3401faa7268696acbfbe7b6db9908c155dc3548629f20c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - ulid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdomke/python-ulid
  license: MIT
  license_file: LICENSE
  summary: Universally unique lexicographically sortable identifier
  description: |
    Universally unique lexicographically sortable identifier
  repository: https://github.com/mdomke/python-ulid
  documentation: https://python-ulid.readthedocs.io

extra:
  recipe-maintainers:

