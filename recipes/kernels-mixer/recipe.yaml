# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.16"

package:
  name: kernels-mixer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kernels-mixer/kernels_mixer-${{ version }}.tar.gz
  sha256: 375e5256542e048680b4bf242f00bf7414870c1558da551ed775ae6c8bfd9d16

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter-server >=2.7.3
    - traitlets
    - google-cloud-jupyter-config

tests:
  - python:
      imports:
        - kernels_mixer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudPlatform/jupyter-extensions/tree/master/kernels-mixer
  license: Apache-2.0
  license_file: LICENSE
  summary: Jupyter server extension that allows mixing local and remote kernels together
  description: |
    Jupyter server extension that allows mixing local and remote kernels together

extra:
  recipe-maintainers:
    - rxm7706

