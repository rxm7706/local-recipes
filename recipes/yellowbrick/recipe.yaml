# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5"

package:
  name: yellowbrick
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yellowbrick/yellowbrick-${{ version }}.tar.gz
  sha256: 99a6336dd2e7ce586a8cde67966b79c51b479d3759f3c083d7e19ffe949f6076

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - distutils
    - matplotlib-base
    - scipy
    - scikit-learn
    - numpy
    - cycler

tests:
  - python:
      imports:
        - yellowbrick
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://scikit-yb.org/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: A suite of visual analysis and diagnostic tools for machine learning.
  description: |
    A suite of visual analysis and diagnostic tools for machine learning.
  repository: https://github.com/DistrictDataLabs/yellowbrick
  documentation: http://scikit-yb.org/

extra:
  recipe-maintainers:
    - kellend-git

#### CFE metadata AND comments
