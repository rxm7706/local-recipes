# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: celery-types
  version: "0.26.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: fa318136fdad83f83f1531deecd9fe664b5dfffff29f3c31e9120a46b8e3908f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python ${{ python_min }}.*
    - uv-build
    - pip
  host:
    - python ${{ python_min }}.*
    - uv-build
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.15.0,<5
tests:
  - package_contents:
      site_packages:
        - amqp-stubs/__init__.pyi
        - billiard-stubs/__init__.pyi
        - celery-stubs/__init__.pyi
        - django_celery_results-stubs/__init__.pyi
        - ephem-stubs/__init__.pyi
        - kombu-stubs/__init__.pyi
        - vine-stubs/__init__.pyi

about:
  summary: Type stubs for Celery and its related packages
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/sbdchd/celery-types

extra:
  recipe-maintainers:
    - StevenSchaererQC
    - janjagusch
