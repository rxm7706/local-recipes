# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.26.0"

package:
  name: celery-types
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/c/celery-types/celery_types-0.26.0-py3-none-any.whl
  sha256: eb9da76f461786091970df466ec647d9a27956399852542cb6cab9309970f950

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions <5,>=4.15.0

tests:
  - python:
      imports:
        - celery_types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/celery-types/
  license: Apache-2.0
  license_file: LICENSE
  summary: Type stubs for Celery and its related packages
  description: |
    Type stubs for Celery and its related packages
  repository: https://github.com/sbdchd/celery-types

extra:
  recipe-maintainers:
    - StevenSchaererQC
    - janjagusch

