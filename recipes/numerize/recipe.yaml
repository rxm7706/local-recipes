# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12"

package:
  name: numerize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numerize/numerize-${{ version }}.tar.gz
  sha256: 5548fe72adceb2c7964998179697d80117bb117f57cd02f872cf5db40d615c04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - numerize
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidsa03/numerize
  license: MIT
  license_file: LICENSE
  summary: Convert large numbers into readable numbers for humans.
  description: |
    Convert large numbers into readable numbers for humans.

extra:
  recipe-maintainers:
    - rxm7706

