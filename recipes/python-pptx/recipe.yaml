# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: python-pptx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-pptx/python_pptx-${{ version }}.tar.gz
  sha256: 479a8af0eaf0f0d76b6f00b0887732874ad2e3188230315290cd1f9dd9cc7095

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - pillow >=3.3.2
    - xlsxwriter >=0.5.7
    - lxml >=3.1.0
    - typing_extensions >=4.9.0

tests:
  - python:
      imports:
        - pptx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scanny/python-pptx
  license: MIT
  license_file: LICENSE
  summary: Create, read, and update PowerPoint 2007+ (.pptx) files.
  description: |
    Create, read, and update PowerPoint 2007+ (.pptx) files.
  repository: https://github.com/scanny/python-pptx
  documentation: https://python-pptx.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

