# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.16"

package:
  name: pretty-html-table
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pretty-html-table/pretty_html_table-${{ version }}.tar.gz
  sha256: c0de765ca9fd59cafc6912425eff3a4eff34607b96dddf9edf419718b77f9ae3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas

tests:
  - python:
      imports:
        - pretty_html_table
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sbi-rviot/ph_table
  license: MIT
  license_file: LICENSE.txt
  summary: Make pandas dataframe looking pretty again
  description: |
    Make pandas dataframe looking pretty again

extra:
  recipe-maintainers:
    - Maarten-vd-Sande

#### CFE metadata AND comments
