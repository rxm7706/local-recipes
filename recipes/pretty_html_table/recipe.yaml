# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pretty_html_table
  version: "0.9.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c0de765ca9fd59cafc6912425eff3a4eff34607b96dddf9edf419718b77f9ae3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - pandas
    - python >=3.6

tests:
  - python:
      imports:
        - pretty_html_table
      pip_check: false

about:
  license: MIT
  # check to see if PR: https://github.com/sbi-rviot/ph_table/pull/5 has been merged
  # so we can drop the local license in recipe
  license_file: LICENSE.txt
  summary: Make pandas dataframe looking pretty again
  homepage: https://github.com/sbi-rviot/ph_table
  repository: https://github.com/sbi-rviot/ph_table
  documentation:

extra:
  recipe-maintainers:
    - Maarten-vd-Sande
