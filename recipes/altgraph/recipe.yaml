# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.5"

package:
  name: altgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altgraph/altgraph-${{ version }}.tar.gz
  sha256: c87b395dd12fabde9c99573a9749d67da8d29ef9de0125c7f536699b4a9bc9e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - altgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://altgraph.readthedocs.io
  license: MIT
  license_file: LICENSE
  summary: Python graph (network) package
  description: |
    Python graph (network) package
  repository: https://github.com/ronaldoussoren/altgraph
  documentation: https://altgraph.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - bkpoon
    - anthchirp
    - rth

