# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: xxx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/x/xxx/xxx-0.0.1-py3-none-any.whl
  sha256: ad8eef890c6ac253fbd45fa9e5ee0b6a6ff22d206d1c771bfa1bfaf88c64d13e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xxx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/xxx/
  license: MIT
  license_file: LICENSE
  summary: a minimal example package (pure python version)
  description: |
    a minimal example package (pure python version)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
