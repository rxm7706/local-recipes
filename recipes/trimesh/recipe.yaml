# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.0"

package:
  name: trimesh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/trimesh/trimesh-${{ version }}.tar.gz
  sha256: 0195003198baaf2550aebe612254ba2f01c385cec46c37ecc5beca8291f79a13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21

tests:
  - python:
      imports:
        - trimesh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mikedh/trimesh
  license: MIT
  license_file: LICENSE
  summary: Import, export, process, analyze and view triangular meshes.
  description: |
    Import, export, process, analyze and view triangular meshes.
  documentation: https://trimesh.org

extra:
  recipe-maintainers:
    - mikedh
    - pauldmccarthy

#### CFE metadata AND comments
# CFE metadata
