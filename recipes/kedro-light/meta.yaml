{% set python_min = "3.11" %}
{% set name = "kedro-light" %}
{% set version = "2026.6.22" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 325abbe1928c2b40980646fefcb6b3f260f5f7633466a7b5127c80f5cbeb762a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - kedro
    - kedro-viz

test:
  imports:
    - kedro_light
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A lightweight interface to Kedro and Kedro-Viz
  home: https://github.com/ellwise/kedro-light
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
