# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.6.22"
  python_min: "3.11"

package:
  name: kedro-light
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kedro-light/kedro_light-${{ version }}.tar.gz
  sha256: 325abbe1928c2b40980646fefcb6b3f260f5f7633466a7b5127c80f5cbeb762a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - kedro
    - kedro-viz

tests:
  - python:
      imports:
        - kedro_light
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/kedro-light/
  license: MIT
  license_file: LICENSE
  summary: A lightweight interface to Kedro and Kedro-Viz
  description: |
    A lightweight interface to Kedro and Kedro-Viz
  repository: https://github.com/ellwise/kedro-light

extra:
  recipe-maintainers:
    - rxm7706

