# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.37.0"

package:
  name: referencing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/referencing/referencing-${{ version }}.tar.gz
  sha256: 44aefc3142c5b842538163acb373e24cce6632bd54bdb01b21ad5863489f50d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs >=22.2.0
    - rpds-py >=0.7.0
    - typing_extensions >=4.4.0

tests:
  - python:
      imports:
        - referencing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-jsonschema/referencing
  license: MIT
  license_file: LICENSE
  summary: JSON Referencing + Python
  description: |
    JSON Referencing + Python
  repository: https://github.com/python-jsonschema/referencing
  documentation: https://referencing.readthedocs.io/

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
