# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: grpcio-gcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpcio-gcp/grpcio-gcp-${{ version }}.tar.gz
  sha256: e292605effc7da39b7a8734c719afb12ec4b5362add3528d8afad3aa3aa9057c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google
    - grpcio

tests:
  - python:
      imports:
        - grpc_gcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  summary: gRPC extensions for Google Cloud Platform
  description: |
    gRPC extensions for Google Cloud Platform

extra:
  recipe-maintainers:
    - xylar
    - BrentDorsey

#### CFE metadata AND comments
