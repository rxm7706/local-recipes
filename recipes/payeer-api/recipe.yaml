# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: payeer-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/payeer-api/payeer_api-${{ version }}.tar.gz
  sha256: c4d09ffc2335b2905a5da34f905ebd00586c48b85a0f3754daa58d5e50736d9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - payeer_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AshotS/payeer_api
  license: MIT
  license_file: LICENSE
  summary: Python Payeer API client
  description: |
    Python Payeer API client

extra:
  recipe-maintainers:
    - rxm7706

