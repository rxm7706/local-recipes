# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.0"
  python_min: "3.11"

package:
  name: myst-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/myst-parser/myst_parser-${{ version }}.tar.gz
  sha256: ab69322dc6719dcc7f296479dbb70181b66df6ed315064f92dbc85c0e1bf2f02

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4,<4
  run:
    - python >=${{ python_min }}
    - docutils <0.23,>=0.20
    - jinja2
    - markdown-it-py ~=4.2
    - mdit-py-plugins >=0.6.1,~=0.6
    - pyyaml
    - sphinx <10,>=8

tests:
  - python:
      imports:
        - myst_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/executablebooks/MyST-Parser
  license: MIT
  license_file: LICENSE
  summary: "An extended [CommonMark](https://spec.commonmark.org/) compliant parser,"
  description: |
    An extended [CommonMark](https://spec.commonmark.org/) compliant parser,
  documentation: https://myst-parser.readthedocs.io

extra:
  recipe-maintainers:
    - dopplershift
    - choldgraf

