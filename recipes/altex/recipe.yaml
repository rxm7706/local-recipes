# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: altex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altex/altex-${{ version }}.tar.gz
  sha256: 5ed6404af0d242a751111bd78421951d5e7025f9c559b7bcb151d3b4e63299d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - altair >=4.0.0
    - pandas >=1.0.0
    - streamlit >=1.18.0

tests:
  - python:
      imports:
        - altex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arnaudmiribel/altex
  license: Apache-2.0
  license_file: LICENSE
  summary: A simple wrapper on top of Altair to make charts with an express API
  description: |
    A simple wrapper on top of Altair to make charts with an express API

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
