# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.1"

package:
  name: tempdir
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tempdir/tempdir-${{ version }}.tar.gz
  sha256: 689680ed3ba4cc8347a70e67efc25086ce85b53b9d24a1420899c585bbf7ba8e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tempdir
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/another_thomas/tempdir
  license: MIT
  license_file: LICENSE
  summary: Tempdirs are temporary directories, based on tempfile.mkdtemp
  description: |
    Tempdirs are temporary directories, based on tempfile.mkdtemp

extra:
  recipe-maintainers:
    - kain88-de

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tempdir
  cfe-upstream-registry: pypi
  cfe-upstream-name: tempdir
  cfe-purls:
    - pkg:conda/tempdir@${{ version }}?channel=conda-forge
    - pkg:pypi/tempdir@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://bitbucket.org/another_thomas/tempdir
  cfe-import-names: [tempdir]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/tempdir-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.7.1

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T06:21:00Z
