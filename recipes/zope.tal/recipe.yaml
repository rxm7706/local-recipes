# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.tal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.tal/zope_tal-${{ version }}.tar.gz
  sha256: 726f1b6d46c5ce229ea0ee02138de0276de333c30853cd0a38b5981202ba3585

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.i18nmessageid
    - zope.interface

tests:
  - python:
      imports:
        - zope.tal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.tal
  license: ZPL-2.1
  license_file: LICENSE.rst
  summary: Zope Template Application Language (TAL)
  description: |
    Zope Template Application Language (TAL)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
