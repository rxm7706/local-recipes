# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: queuelib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/queuelib/queuelib-${{ version }}.tar.gz
  sha256: b12fea79fd8c1dd23e212b1f3db58003b773949801d4f4e6f34d882467d4a192

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - queuelib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/queuelib
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Collection of persistent (disk-based) and non-persistent (memory-based) queues
  description: |
    Collection of persistent (disk-based) and non-persistent (memory-based) queues
  repository: https://github.com/scrapy/queuelib
  documentation: https://github.com/scrapy/queuelib/blob/master/README.rst

extra:
  recipe-maintainers:
    - synapticarbors
    - Gallaecio
    - kmike
    - wRAR

