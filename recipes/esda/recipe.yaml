# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.0"
  python_min: "3.12"

package:
  name: esda
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esda/esda-${{ version }}.tar.gz
  sha256: 2dad5b73d8408bc2fe5fff95524a38b98552e09cc494df5010649f8f12019ea5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - geopandas >=1.0
    - libpysal >=4.12
    - numpy >=2.1
    - pandas >=2.3
    - scikit-learn >=1.6
    - scipy >=1.14
    - shapely >=2.1

tests:
  - python:
      imports:
        - esda
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pysal.org/esda/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Exploratory Spatial Data Analysis in PySAL
  description: |
    Exploratory Spatial Data Analysis in PySAL
  repository: https://github.com/pysal/esda

extra:
  recipe-maintainers:
    - knaaptime
    - martinfleis
    - jGaboardi
    - ocefpaf

#### CFE metadata AND comments
