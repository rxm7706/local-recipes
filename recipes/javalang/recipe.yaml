# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: javalang
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/javalang/javalang-${{ version }}.tar.gz
  sha256: 1681a5a480a58116d42a7eedfd132abe25e6c0ffe552868d581ad84e6aa3424c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - javalang
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/c2nes/javalang
  license: MIT
  license_file: LICENSE
  summary: Pure Python Java parser and tools
  description: |
    Pure Python Java parser and tools

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: javalang
