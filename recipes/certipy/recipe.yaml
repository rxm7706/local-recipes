# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: certipy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certipy/certipy-${{ version }}.tar.gz
  sha256: 4e8701e6a2f281e7a154c2f368cff4edf374009084d29788cbe8c3838897784f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=7
  run:
    - python >=${{ python_min }}
    - cryptography

tests:
  - python:
      imports:
        - certipy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LLNL/certipy
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utility to create and sign CAs and certificates
  description: |
    Utility to create and sign CAs and certificates

extra:
  recipe-maintainers:
    - minrk

#### CFE metadata AND comments
