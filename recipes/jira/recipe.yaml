# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.10.5"

package:
  name: jira
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jira/jira-${{ version }}.tar.gz
  sha256: 2d09ae3bf4741a2787dd889dfea5926a5d509aac3b28ab3b98c098709e6ee72d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60.0.0
  run:
    - python >=${{ python_min }}
    - defusedxml
    - packaging
    - requests-oauthlib >=1.1.0
    - requests >=2.10.0
    - requests-toolbelt
    - typing_extensions >=3.7.4.2

tests:
  - python:
      imports:
        - jira
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pycontribs/jira
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python library for interacting with JIRA via REST APIs.
  description: |
    Python library for interacting with JIRA via REST APIs.
  repository: https://github.com/pycontribs/jira.git
  documentation: https://jira.readthedocs.io

extra:
  recipe-maintainers:
    - ericdill
    - parente
    - bollwyvl

