    - pkg:pypi/docx2txt@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/ankushshah89/python-docx2txt
  cfe-import-names: [docx2txt]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/docx2txt-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.9

  cfe-forge-blocker-list:
