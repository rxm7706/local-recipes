# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9"

package:
  name: docx2txt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/docx2txt/docx2txt-${{ version }}.tar.gz
  sha256: 18013f6229b14909028b19aa7bf4f8f3d6e4632d7b089ab29f7f0a4d1f660e28

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - docx2txt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ankushshah89/python-docx2txt
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A pure python-based utility to extract text and images from docx files.
  description: |
    A pure python-based utility to extract text and images from docx files.

extra:
  recipe-maintainers:
    - pmlandwehr
    - rxm7706
    - nikicc

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: docx2txt
  cfe-upstream-registry: pypi
  cfe-upstream-name: docx2txt
