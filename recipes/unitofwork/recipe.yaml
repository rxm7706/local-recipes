# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.12"

package:
  name: unitofwork
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/unitofwork/unitofwork-${{ version }}.tar.gz
  sha256: 4d830c5b01b689457afa686abd9e53d510e0abf75929cc1f82cbebfb4abfa547

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - unitofwork
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ivanovmg/unitofwork
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

