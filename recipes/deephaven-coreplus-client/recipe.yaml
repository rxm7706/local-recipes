# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.1.38"

package:
  name: deephaven-coreplus-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-coreplus-client/deephaven_coreplus_client-${{ version }}.tar.gz
  sha256: 7d076810eb66ef11247479eaf8457589dde490aec42ef715aab91826644f5557

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - pydeephaven ==41.7
    - pycryptodomex >=3.19.0
    - pycryptodome >=3.19.0
    - grpcio >=1.76.0
    - httpx >=0.27.0

tests:
  - python:
      imports:
        - deephaven_coreplus_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://deephaven.io/
  license: MIT
  license_file: LICENSE
  summary: The Deephaven Enterprise Core+ Python Client
  description: |
    The Deephaven Enterprise Core+ Python Client

extra:
  recipe-maintainers:
    - rxm7706

