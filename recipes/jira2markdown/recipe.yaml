# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: jira2markdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jira2markdown/jira2markdown-${{ version }}.tar.gz
  sha256: e23f1ae5368ef93399de82ca75d4837ebefbb1a4bf15af153f659ced9ee5fcd7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pyparsing >=3

tests:
  - python:
      imports:
        - jira2markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jira2markdown/
  license: MIT
  license_file: LICENSE
  summary: Convert text from JIRA markup to Markdown using parsing expression grammars
  description: |
    Convert text from JIRA markup to Markdown using parsing expression grammars
  repository: https://github.com/catcombo/jira2markdown

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jira2markdown
