# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: deephaven-plugin-utilities
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-plugin-utilities/deephaven_plugin_utilities-${{ version }}.tar.gz
  sha256: 64fa190b0b222733660725982979607e9d68675b3b72e08ef55dfa48dcfa277b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - deephaven-plugin >=0.6.0

tests:
  - python:
      imports:
        - deephaven.plugin.utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugins
  license: Apache-2.0
  license_file: LICENSE
  summary: Deephaven Plugin Utilities
  description: |
    Deephaven Plugin Utilities
  repository: https://github.com/deephaven/deephaven-plugins

extra:
  recipe-maintainers:
    - rxm7706

