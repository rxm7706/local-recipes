# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: llama-index-vector-stores-elasticsearch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-vector-stores-elasticsearch/llama_index_vector_stores_elasticsearch-${{ version }}.tar.gz
  sha256: 9d51ea2637cc99d807276947107c67f18fcdcffb79bfbfd4a7d5b928b88c90cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiohttp <4,>=3.9.5
    - elasticsearch <9,>=8.13.1
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.vector_stores.elasticsearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-vector-stores-elasticsearch/
  license: MIT
  license_file: LICENSE
  summary: llama-index vector_stores elasticsearch integration
  description: |
    llama-index vector_stores elasticsearch integration

extra:
  recipe-maintainers:
    - rxm7706

