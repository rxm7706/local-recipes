# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"

package:
  name: loglib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/loglib/loglib-${{ version }}.tar.gz
  sha256: 5193d560f8a0b2299f3f81042d89088717cfcfbc4c3226dc26fc6d2b0a7a388a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - neotermcolor

tests:
  - python:
      imports:
        - loglib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/teddybear315/loglib
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A decent logging system with some settings built in
  description: |
    A decent logging system with some settings built in

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
