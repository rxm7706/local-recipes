# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: nornir-netmiko
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nornir-netmiko/nornir_netmiko-${{ version }}.tar.gz
  sha256: 498546df001e0e499f10c5646d1356e361ccbb165b1335b89cfe8f19765e24d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.1.8
  run:
    - python >=${{ python_min }}
    - netmiko

tests:
  - python:
      imports:
        - nornir_netmiko
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ktbyers/nornir_netmiko
  license: Apache-2.0
  license_file: LICENSE
  summary: Netmiko's plugins for Nornir
  description: |
    Netmiko's plugins for Nornir
  repository: https://github.com/ktbyers/nornir_netmiko

extra:
  recipe-maintainers:
    - rxm7706

