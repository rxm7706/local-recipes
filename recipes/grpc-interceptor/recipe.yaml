# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.4"

package:
  name: grpc-interceptor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpc-interceptor/grpc-interceptor-${{ version }}.tar.gz
  sha256: 1f45c0bcb58b6f332f37c637632247c9b02bc6af0fdceb7ba7ce8d2ebbfb0926

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - grpcio

tests:
  - python:
      imports:
        - grpc_interceptor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/d5h-foss/grpc-interceptor
  license: MIT
  license_file: LICENSE
  summary: Simplifies gRPC interceptors
  description: |
    Simplifies gRPC interceptors
  repository: https://github.com/d5h-foss/grpc-interceptor
  documentation: https://grpc-interceptor.readthedocs.io

extra:
  recipe-maintainers:
    - xylar

