# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: grpc-interceptor
  version: "0.15.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/grpc-interceptor-${{ version }}.tar.gz
  sha256: 1f45c0bcb58b6f332f37c637632247c9b02bc6af0fdceb7ba7ce8d2ebbfb0926

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - grpcio >=1.49.1,<2.0.0
  run_constraints:
    - protobuf >=4.21.9

tests:
  - python:
      imports:
        - grpc_interceptor
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Simplifies gRPC interceptors
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/d5h-foss/grpc-interceptor
  repository: https://github.com/d5h-foss/grpc-interceptor

extra:
  recipe-maintainers:
    - xylar
