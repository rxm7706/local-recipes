# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-dremio-client
  version: "0.15.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/d/dremio_client/dremio_client-${{ version }}.tar.gz
  sha256: ff77bc63cb5e3ae50ff14df1834af45c4ac1613779aab8dd06b9392093f512a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - dremio_client=dremio_client.cli:cli

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - python >=2.7
    - click >=6.0
    - requests >=2.21.0
    - confuse
    - pyyaml
    - simplejson
    - attrs
    - six
    - pandas >=0.24.2
    - pyarrow >=0.15.1
    - requests-futures ==1.0.0
    - markdown

tests:
  - python:
      imports:
        - dremio_client
        - dremio_client.auth
        - dremio_client.conf
        - dremio_client.flight
        - dremio_client.model
        - dremio_client.util
      pip_check: false
  - script:
      - dremio_client --help

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Un-official python client for Dremio. See https://dremio.com
  homepage: https://github.com/rymurr/dremio_client
  repository: https://github.com/rymurr/dremio_client
  documentation: https://dremio-client.readthedocs.io/

extra:
  recipe-maintainers:
    - harelwa
