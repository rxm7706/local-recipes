# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.4"

package:
  name: simpleparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simpleparse/SimpleParse-${{ version }}.tar.gz
  sha256: 892b2ef7cd182bef9197d9d47622978a7ff63e488bc1296e842a7f1f2d76fea6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - simpleparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://simpleparse.sourceforge.net/
  license: MIT
  license_file: LICENSE
  summary: A Parser Generator for Python (w/mxTextTools derivative)
  description: |
    A Parser Generator for Python (w/mxTextTools derivative)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: simpleparse
  cfe-upstream-registry: pypi
  cfe-upstream-name: simpleparse
  cfe-purls:
