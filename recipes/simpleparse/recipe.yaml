    - pkg:pypi/simpleparse@${{ version }}
  cfe-upstream-repo: http://simpleparse.sourceforge.net/
  cfe-upstream-homepage: http://simpleparse.sourceforge.net/
  cfe-import-names: [simpleparse]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
