# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.2.17.0"

package:
  name: abstract
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/abstract/abstract-${{ version }}.tar.gz
  sha256: 2e7a789595120aefce951a357fc622899599b7b4cb71500abde92f25f10847cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-graphviz
    - base32hex
    - colouration

tests:
  - python:
      imports:
        - abstract
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/idin/abstract
  license: MIT
  license_file: LICENSE
  summary: Python library for creating and drawing graphs and taking advantage of graph properties
  description: |
    Python library for creating and drawing graphs and taking advantage of graph properties

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
