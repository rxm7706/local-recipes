# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.41.0"

package:
  name: deephaven-plugin-ui
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deephaven-plugin-ui/deephaven_plugin_ui-${{ version }}.tar.gz
  sha256: 6c16dd58c377db4603b3be7f0aa8d6ab4e734605a96b420820d275f378671af3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=43.0.0
    - wheel
    - deephaven-plugin-packaging
  run:
    - python >=${{ python_min }}
    - deephaven-core >=42.0
    - deephaven-plugin >=0.7.0
    - json-rpc ~=1.15.0
    - pyjsonpatch ~=0.1.3
    - deephaven-plugin-utilities >=0.0.2
    - typing_extensions
    - puremagic

tests:
  - python:
      imports:
        - deephaven.ui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugins
  license: Apache-2.0
  license_file: LICENSE
  summary: deephaven.ui plugin
  description: |
    deephaven.ui plugin
  repository: https://github.com/deephaven/deephaven-plugins

extra:
  recipe-maintainers:
    - rxm7706

