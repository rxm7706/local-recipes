# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: pdfrw2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdfrw2/pdfrw2-${{ version }}.tar.gz
  sha256: e6a9ccab83e769a7a8bfe2dbddf0f49dd7ebe52032e929574f01bbbfa21971ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pdfrw
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sarnold/pdfrw
  license: MIT
  license_file: LICENSE
  summary: PDF file reader/writer library
  description: |
    PDF file reader/writer library

extra:
  recipe-maintainers:
    - rxm7706

