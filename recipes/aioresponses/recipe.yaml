# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.9"

package:
  name: aioresponses
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioresponses/aioresponses-${{ version }}.tar.gz
  sha256: 1dcfa28938fc006f046a98383a7c07ac180be7a492c1ed557f5cd7b0805357d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging >=22.0
    - aiohttp <4.0,>=3.8

tests:
  - python:
      imports:
        - aioresponses
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pnuckowski/aioresponses
  license: MIT
  license_file: LICENSE
  summary: Mock out requests made by ClientSession from aiohttp package
  description: |
    Mock out requests made by ClientSession from aiohttp package

extra:
  recipe-maintainers:
    - jonashaag

#### CFE metadata AND comments
