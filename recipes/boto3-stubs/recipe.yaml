# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: boto3-stubs
  version: "1.43.72"
  lib_version: ${{ version.split(".post")[0] }}

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: caec1105abf0e78f9b2db5dd3c364ce10c283d5a128c69665db428c705d08f3f

build:
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

outputs:
  - package:
      name: boto3-stubs
    build:
      noarch: python
      script:
        - python -m pip install . -vv
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
      run:
        - python >=${{ python_min }}
        - botocore-stubs
        - types-s3transfer
        - typing-extensions >=4.1.0
    tests:
      - script:
          - pip check
        requirements:
          run:
            - pip
            - python ${{ python_min }}
  - package:
      name: boto3-stubs-essential
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python ${{ python_min }}
        - setuptools
      run:
        - python >=${{ python_min }}
        # <https://docs.conda.io/projects/conda-build/en/latest/resources/variants.html#extra-jinja2-functions>
        # <https://docs.conda.io/projects/conda-build/en/latest/resources/variants.html#pinning-at-the-recipe-level>
        - ${{ pin_subpackage(name, exact=True) }}
        # For the dependencies, use the pin >=MAJOR.MINOR
        - ${{ pin_compatible('mypy_boto3_cloudformation', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy_boto3_dynamodb', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy_boto3_ec2', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy_boto3_lambda', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy_boto3_rds', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy-boto3-s3', lower_bound='x.x') }}
        - ${{ pin_compatible('mypy_boto3_sqs', lower_bound='x.x') }}
    tests:
      - python:
          imports:
            - mypy_boto3_cloudformation
            - mypy_boto3_dynamodb
            - mypy_boto3_ec2
            - mypy_boto3_lambda
            - mypy_boto3_rds
            - mypy_boto3_s3
            - mypy_boto3_sqs
          pip_check: true
          python_version: "3.12"
      - script: test_essential.py

about:
  summary: Type annotations for boto3 ${{ lib_version }}, generated with mypy-boto3-builder
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vemel/mypy_boto3_builder
  repository: https://github.com/vemel/mypy_boto3_builder
  documentation: https://youtype.github.io/boto3_stubs_docs/

extra:
  recipe-maintainers:
    - maresb
    - thewchan
    - vemel
