# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kedro-pandera
  version: "0.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kedro_pandera-${{ version }}.tar.gz
  sha256: d42168b74bfecc6ab551438e794b613ca6304342bfa772a78619d7d8baae3f5b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.12
    - pandera >=0.15
    - kedro >=0.19.0,<0.20
    # kedro-pandera requirements uses pandera[io] ; io dependencies added.
    #   https://github.com/Galileo-Galilei/kedro-pandera/blob/main/requirements.txt#L1C1-L1C18
    #   pandera[io]>=0.15
    #   https://github.com/unionai-oss/pandera/blob/v0.15.0/setup.py#L13C13-L13C61
    #   "io": ["pyyaml >= 5.1", "black", "frictionless <= 4.40.8"],
    - pyyaml >=5.1
    - black
    - frictionless <=4.40.8

tests:
  - python:
      imports:
        - kedro_pandera
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A kedro plugin to use pandera in your kedro projects
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Galileo-Galilei/kedro-pandera

extra:
  recipe-maintainers:
    - rxm7706
