# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.21"

package:
  name: breadability
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/breadability/breadability-${{ version }}.tar.gz
  sha256: a4ca059c1d1ecd1186076ab6a63a9e184d65d74571c23ce7d9d7dbf4a80b59a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - docopt <0.7,>=0.6.1
    - chardet
    - lxml >=2.0

tests:
  - python:
      imports:
        - breadability
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bookieio/breadability
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Port of Readability HTML parser in Python
  description: |
    Port of Readability HTML parser in Python

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: breadability
  cfe-upstream-registry: pypi
  cfe-upstream-name: breadability
  cfe-purls:
    - pkg:conda/breadability@${{ version }}?channel=conda-forge
    - pkg:pypi/breadability@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/bookieio/breadability
  cfe-import-names: [breadability]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/breadability-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.21

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-17T06:48:51Z
