# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: breadability
  version: "0.1.20"
  py_ver: PY_VER

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/breadability-${{ version }}.tar.gz
  sha256: f1a7fdad1e58e295df80954879143824c706bbfb1826cdf4b1d15de1a86afe99

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - breadability = breadability.scripts.client:main
      - breadability-${{ py_ver }} = breadability.scripts.client:main
      - breadability_test = breadability.scripts.test_helper:main
      - breadability_test-${{ py_ver }} = breadability.scripts.test_helper:main

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - chardet
    - docopt >=0.6.1,<0.7
    - lxml >=2.0
    - lxml-html-clean
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - breadability
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - breadability --help
      - breadability-${{ py_ver }} --help
      - breadability_test --help
      - breadability_test-${{ py_ver }} --help

about:
  summary: Port of Readability HTML parser in Python
  license: BSD-2-Clause
  license_file: LICENSE.rst
  homepage: https://github.com/bookieio/breadability

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz
