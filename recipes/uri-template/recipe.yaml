# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: uri-template
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/u/uri-template/uri-template-${{ version }}.tar.gz
    sha256: 0e00f8eb65e18c7de20d595a14336e9f337ead580c70934141624b6d1ffdacc7
    target_directory: dist
  - url: https://github.com/plinss/uri_template/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 5bce2cfa1d21aaca82622c68fb0deb233ca334b0c28749f104b983563f28f004
    target_directory: src

build:
  number: 1
  noarch: python
  script: cd dist && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uri_template
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - src/test.py
        - src/tests
    requirements:
      run:
        - coverage
        - if: win
          then: m2-grep
        - mypy
        - pip
        - python ${{ python_min }}
    script:
      - pip list
      - pip list | grep -iE "uri-template\s+${{ version | replace(".", "\\.") }}"
      - mypy -p uri_template
      - cd src && coverage run --source=uri_template test.py && coverage report -m --fail-under=91

about:
  license: MIT
  license_file: dist/LICENSE
  summary: RFC 6570 URI Template Processor
  homepage: https://github.com/plinss/uri_template

extra:
  recipe-maintainers:
    - bollwyvl
