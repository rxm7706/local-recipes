# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: uri-template
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uri-template/uri-template-${{ version }}.tar.gz
  sha256: 0e00f8eb65e18c7de20d595a14336e9f337ead580c70934141624b6d1ffdacc7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - uri_template
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.linss.com/open-source/python/uri-template
  license: MIT
  license_file: LICENSE
  summary: RFC 6570 URI Template Processor
  description: |
    RFC 6570 URI Template Processor

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
