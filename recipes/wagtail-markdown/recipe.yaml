# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-markdown
  version: "0.15.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/7e/2a/cb5233b65ca355d39f16c58c110f1ad4b04a378843d39a8a85d2cb087b7a/wagtail_markdown-0.15.0.tar.gz
  sha256: 08d58177a6f015c99d2597f681d6f8c276df5d7f74721ab24996d4582a2426da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - flit-core >=3.2,<4
  - pip
  run:
  - nh3 >=0.3.4
  - python >=${{ python_min }}
  - wagtail >=7.0
  - markdown >=3.3,<4
  - bleach >=3.3,<5

tests:
- python:
    imports:
    - wagtailmarkdown
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: Markdown support for Wagtail
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/torchbox/wagtail-markdown

extra:
  recipe-maintainers:
  - rxm7706

#### CFE metadata AND comments
