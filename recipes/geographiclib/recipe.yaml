# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: geographiclib
  version: "2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/geographiclib-${{ version }}.tar.gz
  sha256: 6a6545e6262d0ed3522e13c515713718797e37ed8c672c31ad7b249f372ef108

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - geographiclib
        - geographiclib.test
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -m unittest -v geographiclib.test.test_geodesic
      - python -m unittest -v geographiclib.test.test_sign

about:
  license: MIT
  license_file: LICENSE.txt
  summary: The geodesic routines from GeographicLib
  description: |
    This implements algorithms for geodesics (Karney, 2013) for solving
    the direct and inverse problems for an ellipsoid of revolution.
  homepage: https://github.com/geographiclib/geographiclib-python
  repository: https://github.com/geographiclib/geographiclib-python
  documentation: https://geographiclib.sourceforge.io/Python/doc/

extra:
  recipe-maintainers:
    - QuLogic
    - cffk
    - ocefpaf
