# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1"

package:
  name: geographiclib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geographiclib/geographiclib-${{ version }}.tar.gz
  sha256: 6a6545e6262d0ed3522e13c515713718797e37ed8c672c31ad7b249f372ef108

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - geographiclib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://geographiclib.sourceforge.io/Python/
  license: MIT
  license_file: LICENSE
  summary: The geodesic routines from GeographicLib
  description: |
    The geodesic routines from GeographicLib
  repository: https://github.com/geographiclib/geographiclib-python
  documentation: https://geographiclib.sourceforge.io/Python/doc/

extra:
  recipe-maintainers:
    - QuLogic
    - cffk
    - ocefpaf

