# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: views
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/views/views-${{ version }}.tar.gz
  sha256: 17f60ecbc213d5aaa8f5359973ab8840071123547e1897cae2f6e762b62dcd68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - views
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/k7hoven/views
  license: MIT
  license_file: LICENSE
  summary: views
  description: |
    views

extra:
  recipe-maintainers:
    - rxm7706

