# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-json-widget
  version: "0.0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f1/03/bde22e3ef383d485195e2fa2d82983c8a945da0a34a352a39cd01c4c9645/wagtail_json_widget-0.0.9.tar.gz
  sha256: 2d80976cc7d9d0754b06a0779ff10ad76b89b38570f597b2231cb1ea61a9359c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  run:
  - python >=${{ python_min }}
  - wagtail >=4.0

tests:
- python:
    imports:
    - wagtail_json_widget
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: JSON editing for Wagtail
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cursive-works/wagtail-json-widget

extra:
  recipe-maintainers:
  - rxm7706
  cfe-local-build-status: failed
  cfe-local-build-datetime: '2026-10-09T11:35:42Z'
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
