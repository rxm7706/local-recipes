# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.3"

package:
  name: jupyter-packaging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-packaging/jupyter_packaging-${{ version }}.tar.gz
  sha256: 9d9b2b63b97ffd67a8bc5391c32a421bc415b264a32c99e4d8d8dd31daae9cf4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.25
  run:
    - python >=${{ python_min }}
    - deprecation
    - packaging
    - setuptools >=60.2.0
    - tomlkit
    - wheel

tests:
  - python:
      imports:
        - jupyter_packaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Jupyter Packaging Utilities.
  description: |
    Jupyter Packaging Utilities.
  repository: https://github.com/jupyter/jupyter-packaging/

extra:
  recipe-maintainers:
    - blink1073
    - vidartf
    - timkpaine
    - xmnlab

#### CFE metadata AND comments
