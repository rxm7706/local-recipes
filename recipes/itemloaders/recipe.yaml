# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: itemloaders
  version: "1.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b5338308a819098f43525b7afc5f7d46ba338ba4710f5ebe7a21b3b47bb29929

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    # Same order as setup.py:
    - parsel >=1.5.0
    - jmespath >=0.9.5
    - itemadapter >=0.1.0

tests:
  - python:
      imports:
        - itemloaders
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - itemloaders
        - tests
    requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}
    script:
      - pytest tests

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Collect data from HTML and XML sources
  description: |
    Library that helps you collect data from HTML and XML sources.


  homepage: https://github.com/scrapy/itemloaders

extra:
  recipe-maintainers:
    - Gallaecio
    - wRAR
    - dangra
    - rmax
