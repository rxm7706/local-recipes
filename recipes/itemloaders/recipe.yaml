# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: itemloaders
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/itemloaders/itemloaders-${{ version }}.tar.gz
  sha256: b5338308a819098f43525b7afc5f7d46ba338ba4710f5ebe7a21b3b47bb29929

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - itemadapter >=0.1.0
    - jmespath >=0.9.5
    - parsel >=1.5.0

tests:
  - python:
      imports:
        - itemloaders
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/itemloaders
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Base library for scrapy's ItemLoader
  description: |
    Base library for scrapy's ItemLoader
  repository: https://github.com/scrapy/itemloaders
  documentation: https://itemloaders.readthedocs.io/

extra:
  recipe-maintainers:
    - Gallaecio
    - wRAR
    - dangra
    - rmax

#### CFE metadata AND comments
