# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.18.4"

package:
  name: radish-bdd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/radish-bdd/radish_bdd-${{ version }}.tar.gz
  sha256: e883004ab78121d1fd681099244d14afbabd1da5ffe99cd038aea661374868dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - docopt
    - colorful >=0.3.11
    - tag-expressions >=2.0.0
    - parse-type >0.4.0
    - humanize

tests:
  - python:
      imports:
        - radish
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://radish-bdd.github.io
  license: MIT
  license_file: LICENSE
  summary: Behaviour-Driven-Development tool for Python
  description: |
    Behaviour-Driven-Development tool for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
