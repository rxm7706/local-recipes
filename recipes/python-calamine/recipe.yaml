# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-calamine
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/python_calamine-${{ version }}.tar.gz
  sha256: 3182d653cc9bdcc37938a55edabd0ed8180361b1392815de5e1e198aac156f28

build:
  number: 0
  skip: python == "3.14.* *_cp314t" and (target_platform == "linux-aarch64" or target_platform == "linux-ppc64le")
  script:
    # PyPy has weird sysconfigdata name
    - if: build_platform != target_platform and target_platform == "linux-ppc64le"
      then: rm -f $PREFIX/lib/pypy$PY_VER/_sysconfigdata.py
    - ${{ PYTHON }} -m pip install . -vv
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

tests:
  - python:
      imports:
        - python_calamine
      pip_check: true

about:
  summary: Python binding for Rust's library for reading excel and odf file - calamine.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/dimastbk/python-calamine
  repository: https://github.com/dimastbk/python-calamine

extra:
  recipe-maintainers:
    - dimastbk
