# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lifelines
  version: "0.30.3"
  sha256: 28811893a32851a45d593980d5076348cb0f60ca438e7bd9c1e9fa67132c7eee

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/CamDavidsonPilon/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.14.0
    - scipy >=1.7
    - pandas >=2.1,<3.0
    - matplotlib-base >=3.0
    - autograd >=1.5
    - autograd-gamma >=0.3
    - formulaic >=0.2.2

tests:
  - python:
      imports:
        - lifelines
        - lifelines.datasets
        - lifelines.fitters
        - lifelines.utils
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Survival analysis in Python, including Kaplan Meier, Nelson Aalen and regression
  homepage: https://github.com/CamDavidsonPilon/lifelines

extra:
  recipe-maintainers:
    - mariusvniekerk
    - CamDavidsonPilon
