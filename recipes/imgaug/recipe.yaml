# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: imgaug
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 46bab63ed38f8980630ff721a09ca2281b7dbd4d8c11258818b6ebcc69ea46c7
  patches:
    # opencv doesn't pass the pip check command
    - remove_opencv_dependency_from_pip.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <82
  run:
    - python >=${{ python_min }}
    - six
    - numpy >=1.15,<2.0
    - scipy
    - pillow
    - matplotlib-base
    - scikit-image >=0.14.2
    - opencv
    - imageio
    - shapely
    - imagecodecs <2026.0.0

tests:
  - python:
      imports:
        - imgaug
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Image augmentation for machine learning experiments
  description: |
    This python library helps you with augmenting images for your machine
    learning projects. It converts a set of input images into a new, much
    larger set of slightly altered images.
  homepage: https://github.com/aleju/imgaug
  repository: https://github.com/aleju/imgaug
  documentation: https://imgaug.readthedocs.io/

extra:
  recipe-maintainers:
    - mdraw
    - aleju
    - hmaarrfk

#### CFE metadata AND comments
