    - pkg:pypi/ezlogger@${{ version }}
  cfe-upstream-repo: https://github.com/zerosignal0/ezlogger/blob/master/README.md
  cfe-upstream-homepage: https://github.com/zerosignal0/ezlogger/blob/master/README.md
  cfe-import-names: [ezlogger]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
