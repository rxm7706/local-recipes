# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.11"

package:
  name: langgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph/langgraph-${{ version }}.tar.gz
  sha256: 9ecfe11e50d338b34b15cf4d8a442642de103e8ae6971320efba84e4542eb363

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - bench
    - langchain-core <2,>=1.4.7
    - langgraph-checkpoint <5.0.0,>=4.1.0
    - langgraph-prebuilt <1.2.0,>=1.1.0
    - langgraph-sdk <0.5.0,>=0.4.2
    - pydantic >=2.7.4
    - python-xxhash >=3.5.0

tests:
  - python:
      imports:
        - bench
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.langchain.com/oss/python/langgraph/overview
  license: MIT
  license_file: LICENSE
  summary: Building stateful, multi-actor applications with LLMs
  description: |
    Building stateful, multi-actor applications with LLMs
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/langgraph
  documentation: https://reference.langchain.com/python/langgraph/

extra:
  recipe-maintainers:
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langgraph
