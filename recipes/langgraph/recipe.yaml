    - pkg:pypi/langgraph@${{ version }}
  cfe-upstream-repo: https://github.com/langchain-ai/langgraph/tree/main/libs/langgraph
  cfe-upstream-homepage: https://docs.langchain.com/oss/python/langgraph/overview
