# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.5"

package:
  name: driverlessai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/d/driverlessai/driverlessai-2.4.5-py3-none-any.whl
  sha256: a49d00c6b9111335b4632d7ebd435236005fe980d85ae1bf8de5119fc6206cf7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3 >=1.26.0
    - tabulate
    - toml
    - packaging >=21.0

tests:
  - python:
      imports:
        - driverlessai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://h2o.ai/products/h2o-driverless-ai/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Python client for H2O Driverless AI.
  description: |
    Python client for H2O Driverless AI.
  documentation: https://docs.h2o.ai/driverless-ai/pyclient/docs/html/index.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
