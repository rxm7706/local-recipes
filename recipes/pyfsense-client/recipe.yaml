# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.11"

package:
  name: pyfsense-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfsense-client/pyfsense_client-${{ version }}.tar.gz
  sha256: 3bfd855c622258fe3c53d1ac84a240696827e888bfda2e19a6bd721ba75fc228

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pyfsense-client
    - pydantic >=2.10
    - requests

tests:
  - python:
      imports:
        - pyfsense_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/devinbarry/pyfsense-client
  license: MIT
  license_file: LICENSE
  summary: A client for the unofficial pfSense API.
  description: |
    A client for the unofficial pfSense API.
  documentation: https://yaleman.github.io/pfsense-api-client/

extra:
  recipe-maintainers:
    - rxm7706

