# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: typing-inspect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typing-inspect/typing_inspect-${{ version }}.tar.gz
  sha256: b23fc42ff6f6ef6954e4852c1fb512cdd18dbea03134f91f856a95ccc9461f78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - mypy_extensions
    - typing_extensions
    - typing

tests:
  - python:
      imports:
        - typing_inspect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ilevkivskyi/typing_inspect
  license: MIT
  license_file: LICENSE
  summary: Runtime inspection utilities for typing module.
  description: |
    Runtime inspection utilities for typing module.

extra:
  recipe-maintainers:
    - tarcisioe
    - thewchan

