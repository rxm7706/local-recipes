# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.108"

package:
  name: enterprise-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/enterprise-utils/enterprise-utils-${{ version }}.tar.gz
  sha256: d373d727d1a6a15fb65915628d1f1e1961ce6cccf3e4f1ec3bd227894d4e2c38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ~=62.1.0
    - wheel ~=0.37.1
  run:
    - python >=${{ python_min }}
    - aws-cdk-lib
    - constructs
    - python-jsii
    - publication
    - typeguard

tests:
  - python:
      imports:
        - enterprise_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/professionalaf/enterprise-utils.git
  license: Apache-2.0
  license_file: LICENSE
  summary: "@professionalaf/enterprise-utils"
  description: |
    @professionalaf/enterprise-utils
  repository: https://github.com/professionalaf/enterprise-utils.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
