# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: stdlibs
  version: "2025.5.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stdlibs-${{ version }}.tar.gz
  sha256: 75d55a0b7b070ec44bd7dae5bc1ee1a6cea742122fb4253313cb4ab354f7f0c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stdlibs
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: List of packages in the stdlib
  license: MIT
  license_file: LICENSE
  homepage: https://stdlibs.omnilib.dev

extra:
  recipe-maintainers:
    - dstoeckel
    - nicornk
