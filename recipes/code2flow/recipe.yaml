# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: code2flow
  version: "2.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/code2flow-${{ version }}.tar.gz
  sha256: ad98717920da6598dac38a1951f38b84891f4aa4bd2f36c119b0dbac729f4785

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - code2flow=code2flow.engine:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - code2flow
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - code2flow --help

about:
  summary: Visualize your source code as DOT flowcharts
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/scottrogowski/code2flow

extra:
  recipe-maintainers:
    - thewchan
