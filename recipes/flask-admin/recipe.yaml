# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: flask-admin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Admin/flask_admin-${{ version }}.tar.gz
  sha256: 4a5b844789c10076da89320563600a7addf781e73ab315ae800521b3ec018509

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask >=2.0
    - jinja2 >=3.0
    - markupsafe >=2.0
    - werkzeug >=2.0
    - wtforms >=2.3
    - typing_extensions

tests:
  - python:
      imports:
        - flask_admin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-Admin/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Simple and extensible admin interface framework for Flask
  description: |
    Simple and extensible admin interface framework for Flask
  repository: https://github.com/pallets-eco/flask-admin/
  documentation: https://flask-admin.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - xylar

