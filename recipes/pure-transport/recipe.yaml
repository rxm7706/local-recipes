# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: pure-transport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pure-transport/pure-transport-${{ version }}.tar.gz
  sha256: 78f76851ead7395fc725e5f5052f404aa4146374ba98e9d289b575097c49958d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - thrift
    - pure-sasl
    - thrift_sasl

tests:
  - python:
      imports:
        - puretransport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/devinstevenson/pure-transport
  license: GPLv3+
  license_file: LICENSE
  summary: Pure Sasl Based Thrift Transport for PyHive
  description: |
    Pure Sasl Based Thrift Transport for PyHive

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
