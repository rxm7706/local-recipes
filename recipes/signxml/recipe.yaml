# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: signxml
  version: "5.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9b5fb208b59e843a87f36fd9fc3c8ccbb46e11b1ffab037d4b177ece33b5fd18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vvv --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - certifi >=2023.11.17
    - cryptography >=45
    - lxml >=5.2.1,<7
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - signxml
        - signxml.util
      python_version: ${{ python_min }}.*
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python XML Signature library
  homepage: https://xml-security.github.io/signxml/
  repository: https://github.com/XML-Security/signxml
  documentation: https://xml-security.github.io/signxml/

extra:
  recipe-maintainers:
    - fhoehle
