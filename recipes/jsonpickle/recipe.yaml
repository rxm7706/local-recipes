# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.2"

package:
  name: jsonpickle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonpickle/jsonpickle-${{ version }}.tar.gz
  sha256: 8afed18aa189fd81e2e833b426bb4af485594921f0b1d36c2001fc5637a2f210

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonpickle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jsonpickle.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: jsonpickle encodes/decodes any Python object to/from JSON
  description: |
    jsonpickle encodes/decodes any Python object to/from JSON
  repository: https://github.com/jsonpickle/jsonpickle
  documentation: https://jsonpickle.readthedocs.io/

extra:
  recipe-maintainers:
    - robmcmullen
    - ChrisBarker-NOAA
    - synapticarbors

