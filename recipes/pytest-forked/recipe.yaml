# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.5"

package:
  name: pytest-forked
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-forked/pytest_forked-${{ version }}.tar.gz
  sha256: 00f2bee51612f29b8e6b81eed2c3b2975e824c2693394f5bdaf7a1369078ba5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=41.4
    - setuptools-scm >=3.3
  run:
    - python >=${{ python_min }}
    - pytest >=7

tests:
  - python:
      imports:
        - pytest_forked
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-forked
  license: MIT
  license_file: LICENSE
  summary: run tests in isolated forked subprocesses
  description: |
    run tests in isolated forked subprocesses

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
