# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: bankfind
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bankfind/bankfind-${{ version }}.tar.gz
  sha256: 5c5ee1abc5d7e0c36fa80e431bf665e48da4bd4afcba997ee56369b0946d028b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}
    - requests ==2.24.0
    - pandas >=0.24

tests:
  - python:
      imports:
        - bankfind
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dpguthrie/bankfind
  license: MIT
  license_file: LICENSE
  summary: Python interface to the FDIC's API for publically available bank data
  description: |
    Python interface to the FDIC's API for publically available bank data
  documentation: https://bankfind.dpguthrie.com

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
