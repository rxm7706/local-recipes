    - pkg:pypi/guardrails-ai@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/guardrails-ai/
  cfe-upstream-homepage: https://pypi.org/project/guardrails-ai/
  cfe-import-names: [guardrails]
