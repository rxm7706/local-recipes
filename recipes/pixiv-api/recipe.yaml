# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pixiv-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pixiv-api/pixiv-api-${{ version }}.tar.gz
  sha256: c180ae5ba7d6e22cecb91608e0bad5c33278ac7ab078cb1b3c76414f00ffb073

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - requests
    - cloudscraper

tests:
  - python:
      imports:
        - pixivapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/azuline/pixiv-api
  license: Apache-2.0
  license_file: LICENSE
  summary: A library for the Pixiv API.
  description: |
    A library for the Pixiv API.
  repository: https://github.com/azuline/pixiv-api

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pixiv-api
  cfe-upstream-registry: pypi
  cfe-upstream-name: pixiv-api
