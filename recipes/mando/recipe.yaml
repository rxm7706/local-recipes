# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mando
  version: "0.6.4"
  sha256: 79feb19dc0f097daa64a1243db578e7674909b75f88ac2220f1c065c10a0d960

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  build:
    - python
    - setuptools
  run:
    - six
    - python

tests:
  - python:
      imports:
        - mando
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Create Python CLI apps with little to no effort at all!
  description: |
    mando is a wrapper around argparse, and allows you to write complete CLI applications
    in seconds while maintaining all the flexibility.


  homepage: https://github.com/rubik/mando

extra:
  recipe-maintainers:
    - igortg
