# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: wikipedia
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wikipedia/wikipedia-${{ version }}.tar.gz
  sha256: db0fad1829fdd441b1852306e9856398204dc0786d2996dd2e0c8bb8e26133b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bs4
    - requests

tests:
  - python:
      imports:
        - wikipedia
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/goldsmith/Wikipedia
  license: MIT
  license_file: LICENSE
  summary: Wikipedia API for Python
  description: |
    Wikipedia API for Python

extra:
  recipe-maintainers:
    - nikicc
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wikipedia
  cfe-upstream-registry: pypi
  cfe-upstream-name: wikipedia
  cfe-purls:
    - pkg:conda/wikipedia@${{ version }}?channel=conda-forge
    - pkg:pypi/wikipedia@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/goldsmith/Wikipedia
  cfe-import-names: [wikipedia]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/wikipedia-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.4.0

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T12:38:49Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T12:38:49Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T12:38:49Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
