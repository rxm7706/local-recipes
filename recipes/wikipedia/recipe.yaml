# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wikipedia
  version: "1.4.0"
  sha256: db0fad1829fdd441b1852306e9856398204dc0786d2996dd2e0c8bb8e26133b2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - requests >=2.0.0,<3.0.0

tests:
  - python:
      imports:
        - wikipedia
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Wikipedia is a Python library that makes it easy to access and parse data from Wikipedia.
  homepage: https://github.com/goldsmith/Wikipedia
  repository: https://github.com/goldsmith/Wikipedia
  documentation: https://wikipedia.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nikicc
    - xylar
