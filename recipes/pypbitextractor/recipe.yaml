# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pypbitextractor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyPbitExtractor/pypbitextractor-${{ version }}.tar.gz
  sha256: 4e64ff1f87e751bfe8a878c3ff654b7695720daf49a279505c664d20ad49d900

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - PyPbitExtractor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyPbitExtractor/
  license: MIT
  license_file: LICENSE
  summary: Extract Measures and its Description, Source Information, and Relationships from Power BI template.
  description: |
    Extract Measures and its Description, Source Information, and Relationships from Power BI template.

extra:
  recipe-maintainers:
    - rxm7706

