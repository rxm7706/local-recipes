# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.3"

package:
  name: st-theme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/st-theme/st-theme-${{ version }}.tar.gz
  sha256: ca97aece1a48ded6e83fd742c27cb0851e1bce2100ab4b6c37c7b6e003b65b42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.33

tests:
  - python:
      imports:
        - streamlit_theme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gabrieltempass/streamlit-theme
  license: MIT
  license_file: LICENSE
  summary: A component that returns the active theme of the Streamlit app.
  description: |
    A component that returns the active theme of the Streamlit app.
  repository: https://github.com/gabrieltempass/streamlit-theme
  documentation: https://github.com/gabrieltempass/streamlit-theme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
