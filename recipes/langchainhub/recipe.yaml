# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: langchainhub
  version: "0.1.21"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchainhub-${{ version }}.tar.gz
  sha256: 723383b3964a47dbaea6ad5d0ef728accefbc9d2c07480e800bdec43510a8c10

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - packaging >=23.2,<25
    - python >=${{ python_min }},<4.0
    - requests >=2.0.0,<3.0.0
    - types-requests >=2.31.0,<3.0.0
    - typing-extensions

tests:
  - python:
      imports:
        - langchainhub
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The LangChain Hub API client
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/hwchase17/langchain-hub

extra:
  recipe-maintainers:
    - jan-janssen
