# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: microsoft-agents-copilotstudio-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-agents-copilotstudio-client/microsoft_agents_copilotstudio_client-${{ version }}.tar.gz
  sha256: 377b02ea050c4b1e56d3c89ffe08e5bb5af0158268733ab42d57c3619f06990d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - microsoft-agents-hosting-core ==1.3.0

tests:
  - python:
      imports:
        - microsoft_agents.copilotstudio.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Agents
  license: MIT
  license_file: LICENSE
  summary: A client library for Microsoft Agents
  description: |
    A client library for Microsoft Agents

extra:
  recipe-maintainers:
    - rxm7706

