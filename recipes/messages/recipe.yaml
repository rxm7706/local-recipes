    - pkg:pypi/messages@${{ version }}
  cfe-upstream-repo: https://github.com/trp07/messages
  cfe-upstream-homepage: https://github.com/trp07/messages
  cfe-import-names: [messages]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
