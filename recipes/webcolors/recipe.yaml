# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.10.0"

package:
  name: webcolors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/webcolors/webcolors-${{ version }}.tar.gz
  sha256: 62abae86504f66d0f6364c2a8520de4a0c47b80c03fc3a5f1815fedbef7c19bf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - webcolors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/webcolors/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A library for working with the color formats defined by HTML and CSS.
  description: |
    A library for working with the color formats defined by HTML and CSS.
  repository: https://github.com/ubernostrum/webcolors
  documentation: https://webcolors.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham

#### CFE metadata AND comments
