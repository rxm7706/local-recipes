# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.16.0"

package:
  name: python3-saml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-saml/python3-saml-${{ version }}.tar.gz
  sha256: 97c9669aecabc283c6e5fb4eb264f446b6e006f5267d01c9734f9d8bffdac133

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry >=1.1.15
    - setuptools >=40.1.0
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - xmlsec >=1.3.9
    - lxml >=4.6.5,!=4.7.0

tests:
  - python:
      imports:
        - onelogin
        - onelogin.saml2
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Onelogin Python Toolkit. Add SAML support to your Python software using this library
  homepage: https://github.com/onelogin/python3-saml

extra:
  recipe-maintainers:
    - xylar
    - jaimergp
