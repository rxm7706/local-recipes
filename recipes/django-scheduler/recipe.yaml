# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: django-scheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-scheduler/django_scheduler-${{ version }}.tar.gz
  sha256: a9c280bd4fd7978ea85c4b265d17a69070213ba99b76192e80a143805259d2a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - python-dateutil >=2.1
    - pytz >=2013.9
    - icalendar >=3.8.4

tests:
  - python:
      imports:
        - schedule
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/llazzaro/django-scheduler
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A calendaring app for Django.
  description: |
    A calendaring app for Django.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
