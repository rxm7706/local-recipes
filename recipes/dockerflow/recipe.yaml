    - pkg:pypi/dockerflow@${{ version }}
  cfe-upstream-repo: https://github.com/mozilla-services/python-dockerflow
  cfe-upstream-homepage: https://github.com/mozilla-services/python-dockerflow
  cfe-import-names: [dockerflow]
