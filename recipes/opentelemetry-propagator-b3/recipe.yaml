# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-propagator-b3
  version: "1.44.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_propagator_b3-${{ version }}.tar.gz
  sha256: 93c94885fd75429121bb3d5c496c9bbd1b36199e194a0a6876867d7bf3999300

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.7
    - pip
    - hatchling
  run:
    - python >=3.7
    - deprecated >=1.2.6
    - opentelemetry-api ~=1.3
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - opentelemetry.propagators.b3
      pip_check: true

about:
  summary: OpenTelemetry B3 Propagator
  license: Apache-2.0
  license_file: LICENSE
  description: This library provides a propagator for the B3 format
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/master/propagator/opentelemetry-propagator-b3

extra:
  recipe-maintainers:
    - twoodwark
