# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-propagator-b3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-propagator-b3/opentelemetry_propagator_b3-${{ version }}.tar.gz
  sha256: 93c94885fd75429121bb3d5c496c9bbd1b36199e194a0a6876867d7bf3999300

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.3
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - opentelemetry.propagators.b3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/propagator/opentelemetry-propagator-b3
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry B3 Propagator
  description: |
    OpenTelemetry B3 Propagator
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - twoodwark

