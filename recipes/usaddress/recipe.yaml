# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.16"

package:
  name: usaddress
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/usaddress/usaddress-${{ version }}.tar.gz
  sha256: f7e614e2489c159cf85be1b6f86edbfaf329dbeedef4d002a025757afd1ec6c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
    - parserator
    - probableparsing
  run:
    - python >=${{ python_min }}
    - python-crfsuite >=0.7
    - probableparsing

tests:
  - python:
      imports:
        - usaddress
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/datamade/usaddress
  license: MIT
  license_file: LICENSE
  summary: Parse US addresses using conditional random fields
  description: |
    Parse US addresses using conditional random fields

extra:
  recipe-maintainers:
    - wyseguy7
    - zaneselvans

#### CFE metadata AND comments
# CFE metadata
