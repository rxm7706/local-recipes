# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: aioflask
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioflask/aioflask-${{ version }}.tar.gz
  sha256: 96403709fff88351c606667fce1a5a66bdef2d634a04b358713c8304216db68f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - greenletio
    - flask
    - uvicorn

tests:
  - python:
      imports:
        - aioflask
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miguelgrinberg/aioflask
  license: MIT
  license_file: LICENSE
  summary: Flask running on asyncio.
  description: |
    Flask running on asyncio.

extra:
  recipe-maintainers:
    - rxm7706

