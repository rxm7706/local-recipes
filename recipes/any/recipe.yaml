# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: any
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/any/any-${{ version }}.tar.gz
  sha256: 848382e76eedcf6c7c7eeb5e6fac4c6c497e97661cbbc03c473e7ff05378d937

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - any
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/any/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Command Line Interface for Anyscale
  description: |
    Command Line Interface for Anyscale

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: any
  cfe-upstream-registry: pypi
  cfe-upstream-name: any
  cfe-purls:
    - pkg:conda/any@${{ version }}?channel=conda-forge
    - pkg:pypi/any@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/any/
  cfe-upstream-homepage: https://pypi.org/project/any/
  cfe-import-names: [any]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
