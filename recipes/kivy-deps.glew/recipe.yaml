schema_version: 1

context:
  version: "0.3.1"

package:
  name: kivy-deps.glew
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/k/kivy-deps.glew/kivy_deps.glew-0.3.1-cp310-cp310-win32.whl
  sha256: 8f4b3ed15acb62474909b6d41661ffb4da9eb502bb5684301fb2da668f288a58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kivy_deps.glew
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://kivy.org/
  license: MIT
  license_file: LICENSE
  summary: Repackaged binary dependency of Kivy.
  description: |
    Repackaged binary dependency of Kivy.

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER

