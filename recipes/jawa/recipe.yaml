# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: jawa
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jawa/jawa-${{ version }}.tar.gz
  sha256: 34775c93b07b810e7e7155592a241588e977e13ce77fdaab61a1d0b369200af3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - jawa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/TkTech/Jawa
  license: MIT
  license_file: LICENSE
  summary: Doing fun stuff with JVM ClassFiles.
  description: |
    Doing fun stuff with JVM ClassFiles.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jawa
