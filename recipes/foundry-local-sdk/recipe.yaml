# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.4"
  python_min: "3.11"

package:
  name: foundry-local-sdk
  version: ${{ version }}

source:
  url: https://github.com/microsoft/Foundry-Local/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 85e354a381986d0f0fcbbda1e2770aa2f92ce944591731fde7bd56825d9f6fe8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0.0
    - requests >=2.32.4
    - openai >=2.24.0
    - foundry-local-core ==1.2.4

tests:
  - python:
      imports:
        - sdk.python.src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Foundry-Local
  license: MIT
  license_file: LICENSE
  summary: "Foundry Local Manager Python SDK: Control-plane SDK for Foundry Local."
  description: |
    Foundry Local Manager Python SDK: Control-plane SDK for Foundry Local.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
