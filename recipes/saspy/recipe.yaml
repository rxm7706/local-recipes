# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.108.6"

package:
  name: saspy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/saspy/saspy-${{ version }}.tar.gz
  sha256: 9e949888f66d8227e27e53e1e5ddb4f65d434e2e3cbc04a2d38609d73a3af349

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - saspy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sassoftware/saspy
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python interface to SAS
  description: |
    A Python interface to SAS

extra:
  recipe-maintainers:
    - tomweber-sas
    - DMcGee-SAS
    - pecarmon-sas

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: saspy
  cfe-upstream-registry: pypi
  cfe-upstream-name: saspy
