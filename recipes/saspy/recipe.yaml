    - pkg:pypi/saspy@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/sassoftware/saspy
  cfe-import-names: [saspy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/saspy-feedstock
  cfe-forge-recipe-updates-needed: 
