# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: saspy
  version: "5.108.6"
  hash_val: 9e949888f66d8227e27e53e1e5ddb4f65d434e2e3cbc04a2d38609d73a3af349

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('_', '-') }}-${{ version }}.tar.gz
  sha256: ${{ hash_val }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - ipython >=4
    - pygments
    - pandas

tests:
  - python:
      imports:
        - saspy
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: A Python interface module to the SAS System
  homepage: https://github.com/sassoftware/saspy

extra:
  recipe-maintainers:
    - tomweber-sas
    - DMcGee-SAS
    - pecarmon-sas
