# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: django-oauth-toolkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-oauth-toolkit/django_oauth_toolkit-${{ version }}.tar.gz
  sha256: e43bef1568d6322b44175e27eff82ed7d7cf210889a07d10b8a64e4190ff1351

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - requests >=2.13.0
    - urllib3 >=1.26
    - oauthlib >=3.3.0
    - jwcrypto >=1.5.0

tests:
  - python:
      imports:
        - oauth2_provider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://django-oauth-toolkit.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: OAuth2 Provider for Django
  description: |
    OAuth2 Provider for Django
  repository: https://github.com/django-oauth/django-oauth-toolkit

extra:
  recipe-maintainers:
    - abraha2d

