# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"

package:
  name: pysnmp-mibs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysnmp-mibs/pysnmp-mibs-${{ version }}.tar.gz
  sha256: 00fa321ca598e8a14c0ad98702bf10fb5e9d57b7d06bb99dc818fea07683720c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysnmp_mibs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://sourceforge.net/projects/pysnmp/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A collection of IETF & IANA MIBs pre-compiled for PySNMP
  description: |
    A collection of IETF & IANA MIBs pre-compiled for PySNMP

extra:
  recipe-maintainers:
    - rxm7706

