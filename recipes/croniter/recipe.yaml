# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.4"

package:
  name: croniter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/croniter/croniter-${{ version }}.tar.gz
  sha256: fc124f751b1b04805c2a04b061898b436b45ab2320b045e1e052ea895de65189

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.30.1
    - packaging ==26.2
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    - trove-classifiers ==2026.6.1.19
  run:
    - python >=${{ python_min }}
    - python-dateutil

tests:
  - python:
      imports:
        - croniter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pallets-eco/croniter
  license: MIT
  license_file: LICENSE
  summary: croniter provides iteration for datetime object with cron like format
  description: |
    croniter provides iteration for datetime object with cron like format

extra:
  recipe-maintainers:
    - mariusvniekerk
    - bollwyvl

#### CFE metadata AND comments
