# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: pod-porter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pod-porter/pod_porter-${{ version }}.tar.gz
  sha256: 44f75a27d72dd8b51bf4fca38474199827c2f3ff29c229ee5d1bf0a14e20097a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=67.6.0
    - wheel >=0.40.0
  run:
    - python >=${{ python_min }}
    - jinja2 ~=3.1.6
    - jsonschema >=4.26.0
    - pyyaml ~=6.0.3

tests:
  - python:
      imports:
        - pod_porter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pod-porter/
  license: MIT
  license_file: LICENSE
  summary: Like Helm but for Container Compose Files
  description: |
    Like Helm but for Container Compose Files
  repository: https://github.com/btr1975/pod-porter
  documentation: https://pod-porter.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
