# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash_cytoscape
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0669c79c197e4b150a5db7a278d1c7acebc947f3f5cbad5274835ebb44f712cd

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.5
  run:
    - dash
    - python >=3.5

tests:
  - python:
      imports:
        - dash_cytoscape
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: A Component Library for Dash aimed at facilitating network visualization in Python, wrapped around Cytoscape.js
  homepage: https://github.com/plotly/dash-cytoscape
  repository: https://github.com/plotly/dash-cytoscape
  documentation: https://dash.plot.ly/cytoscape

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - oblute
    - adbeda
