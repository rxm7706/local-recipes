# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: dash-cytoscape
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash-cytoscape/dash_cytoscape-${{ version }}.tar.gz
  sha256: a61019d2184d63a2b3b5c06d056d3b867a04223a674cc3c7cf900a561a9a59aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash

tests:
  - python:
      imports:
        - dash_cytoscape
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://dash.plotly.com/cytoscape
  license: MIT
  license_file: LICENSE
  summary: A Component Library for Dash aimed at facilitating network visualization in Python, wrapped around Cytoscape.js
  description: |
    A Component Library for Dash aimed at facilitating network visualization in Python, wrapped around Cytoscape.js

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - oblute
    - adbeda

