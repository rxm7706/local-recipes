# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0a3"

package:
  name: jupyterlab-dash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-dash/jupyterlab-dash-${{ version }}.tar.gz
  sha256: 70f2835833759bea6d5ee94e7b72f8cd5978875dd795bc3b372578d6a235c02c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipykernel
    - IPython

tests:
  - python:
      imports:
        - jupyterlab_dash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/plotly/jupyterlab-dash
  license: MIT
  license_file: LICENSE.txt
  summary: A JupyterLab extensions for rendering Plotly Dash apps
  description: |
    A JupyterLab extensions for rendering Plotly Dash apps

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jupyterlab-dash
  cfe-upstream-registry: pypi
  cfe-upstream-name: jupyterlab-dash
  cfe-purls:
    - pkg:conda/jupyterlab-dash@${{ version }}?channel=conda-forge
    - pkg:pypi/jupyterlab-dash@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/plotly/jupyterlab-dash
  cfe-import-names: [jupyterlab_dash]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/jupyterlab-dash-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.0a3

  cfe-forge-blocker-list:
