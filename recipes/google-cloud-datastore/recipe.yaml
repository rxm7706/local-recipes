# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.26.0"

package:
  name: google-cloud-datastore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-datastore/google_cloud_datastore-${{ version }}.tar.gz
  sha256: 1ac4882f033fcb90bd75d1171b46400ecd5def23768598843d9c041e0c0b4a6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.24.2
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - google-cloud-core <3.0.0,>=2.0.0
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.cloud.datastore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-datastore
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Datastore API client library
  description: |
    Google Cloud Datastore API client library

extra:
  recipe-maintainers:
    - xylar
    - mathiaseitz
    - trendelkampschroer
    - parthea

