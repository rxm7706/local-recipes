# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.30.6"

package:
  name: cloudvision
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudvision/cloudvision-${{ version }}.tar.gz
  sha256: af4871585c75145a5866cf97ad9b10df2bcafdc86695aa4acd8c5672eca081be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.1.0
  run:
    - python >=${{ python_min }}
    - aristaproto ==0.1.5
    - cryptography ==50.0.0
    - grpcio >=1.53.0
    - msgpack >=1.0.3
    - protobuf <6.0dev,>=5.28.3
    - pyavd-utils ==0.0.1
    - requests >=2.20.1
    - typing_extensions >=4.2.0

tests:
  - python:
      imports:
        - fmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cloudvision/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python library for Arista's CloudVision APIs and Provisioning Action integrations.
  description: |
    A Python library for Arista's CloudVision APIs and Provisioning Action integrations.
  repository: https://github.com/aristanetworks/cloudvision-python
  documentation: https://aristanetworks.github.io/cloudvision-python/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cloudvision
