# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: singleton-decorator
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/singleton-decorator-${{ version }}.tar.gz
  sha256: 1a90ad8a8a738be591c9c167fdd677c5d4a43d1bc6b1c128227be1c5e03bee07

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - singleton_decorator
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A testable singleton decorator
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/Kemaweyan/singleton_decorator

extra:
  recipe-maintainers:
    - rxm7706
