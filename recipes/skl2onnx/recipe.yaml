# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.20.0"

package:
  name: skl2onnx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/skl2onnx/skl2onnx-${{ version }}.tar.gz
  sha256: c74ea827d92ba186fe659695e8fc989cd97bfc320edce3d32b9936a5878da10a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=70
  run:
    - python >=${{ python_min }}
    - onnx >=1.2.1
    - scikit-learn >=1.1

tests:
  - python:
      imports:
        - skl2onnx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/onnx/sklearn-onnx
  license: Apache-2.0
  license_file: LICENSE
  summary: Convert scikit-learn models to ONNX
  description: |
    Convert scikit-learn models to ONNX

extra:
  recipe-maintainers:
    - xhochy
    - janjagusch
    - cbourjau
    - jtilly

