# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyftpdlib
  version: "2.2.0"
  sha256: 70098f1f30cb5af6bca24f5d09042811942192eb420206650f5360c33311fa56

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/giampaolo/pyftpdlib/archive/release-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: release-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyftpdlib
        - pyftpdlib.authorizers
        - pyftpdlib.exceptions
        - pyftpdlib.handlers
        - pyftpdlib.filesystems
        - pyftpdlib.ioloop
        - pyftpdlib.servers
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - python -m pyftpdlib --help

about:
  license: MIT
  license_file: LICENSE
  summary: pyftpdlib is a high-level library to easily write asynchronous portable FTP servers with Python.
  description: |
    Python FTP server library provides a high-level portable interface to easily
    write very efficient, scalable and asynchronous FTP servers with Python. It
    is the most complete RFC-959 FTP server implementation available for Python
    programming language and it's used in projects like Google Chromium and Bazaar
    and included in Debian, Fedora and FreeBSD package repositories.
  homepage: https://github.com/giampaolo/pyftpdlib
  repository: https://github.com/giampaolo/pyftpdlib
  documentation: http://pythonhosted.org/pyftpdlib/

extra:
  recipe-maintainers:
    - edisongustavo
    - nicoddemus
    - tadeu
