# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.11"
  name: inequality
  version: "1.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2010253c26cfe3745d36beb02aeff5503e1b21cb06e1d52aa7f13c37acd9adf1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}
    - libpysal >=4.12
    - matplotlib-base >=3.8
    - numpy >=1.26
    - pandas >=2.1
    - scipy >=1.12

tests:
  - python:
      imports:
        - inequality
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Spatial inequality analysis for PySAL A library of spatial analysis functions.
  description: |
    Spatial inequality analysis for PySAL A library of spatial analysis functions.
  homepage: https://github.com/pysal/inequality
  repository: https://github.com/pysal/inequality/
  documentation: https://pysal.org/inequality

extra:
  recipe-maintainers:
    - martinfleis
    - jGaboardi
    - knaaptime
    - sjsrey
