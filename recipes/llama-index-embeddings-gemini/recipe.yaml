# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: llama-index-embeddings-gemini
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-embeddings-gemini/llama_index_embeddings_gemini-${{ version }}.tar.gz
  sha256: 198f7cddc991b708abfb6ab4ab2256e621662bef7a79de65bbaa4a1dc526ff88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - google-generativeai >=0.5.2
    - llama-index-core <0.15,>=0.13.0

tests:
  - python:
      imports:
        - llama_index.embeddings.gemini
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-embeddings-gemini/
  license: MIT
  license_file: LICENSE
  summary: llama-index embeddings gemini integration
  description: |
    llama-index embeddings gemini integration

extra:
  recipe-maintainers:
    - rxm7706

