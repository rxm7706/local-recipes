# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: tls-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tls-client/tls_client-${{ version }}.tar.gz
  sha256: dad797f3412bb713606e0765d489f547ffb580c5ffdb74aed47a183ce8505ff5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tls_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tls-client/
  license: MIT
  license_file: LICENSE
  summary: Advanced Python HTTP Client.
  description: |
    Advanced Python HTTP Client.
  repository: https://github.com/FlorianREGAZ/Python-Tls-Client

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
