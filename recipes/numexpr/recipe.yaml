# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.14.2"

package:
  name: numexpr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numexpr/numexpr-${{ version }}.tar.gz
  sha256: e7144e83ea9e581f2273e0304f15836736c4e470e2bd2e378ce617662a1ca278

build:
  # pypy not participating in numpy2 migration; numexpr not buildable anymore with numpy 1.x
  number: ${{ build }}
  string: ${{ build_string }}py${{ py }}h${{ PKG_HASH }}_${{ build }}
  skip: python_impl == "pypy"
  script: ${{ 'bash ${{ RECIPE_DIR }}/build_with_mkl.sh' if linux64 and mkl_support == 'mkl' else 'bash ${{ RECIPE_DIR }}/build_without_mkl.sh' if unix and not (linux64 and mkl_support == 'mkl') else '' }}

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy >=2
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - if: (linux64 or win64) and mkl_support == 'mkl'
      then: mkl
    - if: (linux64 or win64) and mkl_support == 'mkl'
      then: mkl-devel
    - numpy >=2
    - pip
    - python
    - setuptools
  run:
    - if: (linux64 or win64) and mkl_support == 'mkl'
      then: libblas * *mkl
    - if: (linux64 or win64) and mkl_support == 'mkl'
      then: mkl
    - if: (linux64 or win64) and mkl_support != 'mkl'
      then: nomkl
    - python
    - numpy >=1.23.0

tests:
  - python:
      imports:
        - numexpr
        - numexpr.interpreter
      pip_check: true

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Fast numerical expression evaluator for NumPy.
  description: |
    Numexpr is a fast numerical expression evaluator for NumPy. With it,
    expressions that operate on arrays (like "3*a+4*b") are accelerated and use
    less memory than doing the same calculation in Python.
  homepage: https://github.com/pydata/numexpr
  repository: https://github.com/pydata/numexpr
  documentation: https://github.com/pydata/numexpr/wiki/Numexpr-Users-Guide

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf
    - scopatz
    - djkirkham
