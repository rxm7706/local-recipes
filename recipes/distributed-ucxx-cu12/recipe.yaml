# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.51.1"
  python_min: "3.11"

package:
  name: distributed-ucxx-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/d/distributed-ucxx-cu12/distributed_ucxx_cu12-0.51.1-py3-none-manylinux_2_28_aarch64.manylinux_2_28_x86_64.whl
  sha256: 01be67aed339bac193176af0e45cd413c7ff6a209423d1b08c65e190e2cc139f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml >=6
    - rapids-dask-dependency ==26.8.*
    - ucxx-cu12 ==0.51.*

tests:
  - python:
      imports:
        - distributed_ucxx_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/ucxx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: UCX communication module for Dask Distributed
  description: |
    UCX communication module for Dask Distributed
  repository: https://github.com/rapidsai/ucxx
  documentation: https://distributed.dask.org/

extra:
  recipe-maintainers:
    - rxm7706

