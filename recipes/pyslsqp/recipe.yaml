# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: pyslsqp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyslsqp/pyslsqp-${{ version }}.tar.gz
  sha256: 989cb560ad28a5e2a09d91a1fd432fb1c835c41c1271bfa2849b564a8ef916ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - meson-python
    - setuptools
    - ninja
    - numpy
  run:
    - python >=${{ python_min }}
    - numpy <3,>=1.24
    - h5py <4,>=3.11.0
    - matplotlib-base <4,>=3.4

tests:
  - python:
      imports:
        - pyslsqp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyslsqp/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A transparent Python interface to the SLSQP optimization algorithm, with advanced features and visualization capabilities.
  description: |
    A transparent Python interface to the SLSQP optimization algorithm, with advanced features and visualization capabilities.
  documentation: https://pyslsqp.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
