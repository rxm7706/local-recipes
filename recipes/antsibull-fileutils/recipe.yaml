# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.3"

package:
  name: antsibull-fileutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-fileutils/antsibull_fileutils-${{ version }}.tar.gz
  sha256: 24779de4bc0047f0e037f643ffb4983577d59795b330a082500a1ed212728ce3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiofiles
    - pyyaml

tests:
  - python:
      imports:
        - antsibull_fileutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-fileutils/
  license: GPL-3.0-or-later AND BSD-2-Clause AND MIT AND PSF-2.0
  license_file: LICENSE
  summary: Tools for building the Ansible Distribution
  description: |
    Tools for building the Ansible Distribution

extra:
  recipe-maintainers:
    - rxm7706

