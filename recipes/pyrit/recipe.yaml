# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: pyrit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrit/pyrit-${{ version }}.tar.gz
  sha256: 39c640330ff3b224c267ec4bdad4f784f893c99cc69976d0d08fa34533d1e5cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64.0.0
    - wheel >=0.46.2
  run:
    - python >=${{ python_min }}
    - aiofiles <26,>=24
    - alembic >=1.16.0
    - appdirs >=1.4.0
    - art >=6.5.0
    - av >=14.0.0
    - azure-core >=1.38.0
    - azure-identity >=1.19.0
    - azure-keyvault-secrets >=4.9.0
    - azure-ai-contentsafety >=1.0.0
    - azure-storage-blob >=12.19.0
    - base2048 >=0.1.3
    - colorama >=0.4.6
    - confusables >=1.2.0
    - confusable-homoglyphs >=3.3.1
    - ecoji >=0.1.1
    - datasets >=4.8.0
    - exceptiongroup >=1.2.0
    - fastapi >=0.133.0
    - httpx >=0.27.2
    - jinja2 >=3.1.6
    - numpy >=1.26.0
    - openai >=2.2.0
    - openpyxl >=3.1.5
    - pillow >=12.2.0
    - pydantic >=2.11.5
    - pyjwt >=2.8.0
    - pyodbc >=5.1.0
    - pypdf >=6.10.2
    - python-docx >=1.1.0
    - python-dotenv >=1.2.2
    - reportlab >=4.4.4
    - segno >=1.6.6
    - scipy >=1.15.3
    - sqlalchemy >=2.0.41
    - starlette >=1.0.1
    - termcolor >=2.4.0
    - tenacity >=9.1.2
    - tinytag >=2.2.1
    - tqdm >=4.67.1
    - transformers >=5.0.0rc3
    - treelib >=1.7.1
    - uvicorn >=0.32.0
    - websockets >=14.0

tests:
  - python:
      imports:
        - pyrit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyrit/
  license: MIT
  license_file: LICENSE
  summary: The Python Risk Identification Tool for LLMs (PyRIT) is a library used to assess the robustness of LLMs
  description: |
    The Python Risk Identification Tool for LLMs (PyRIT) is a library used to assess the robustness of LLMs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyrit
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyrit
  cfe-purls:
    - pkg:conda/pyrit@${{ version }}?channel=conda-forge
    - pkg:pypi/pyrit@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/pyrit/
  cfe-upstream-homepage: https://pypi.org/project/pyrit/
  cfe-import-names: [pyrit]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
