# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.42.1"

package:
  name: jieba
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jieba/jieba-${{ version }}.tar.gz
  sha256: 055ca12f62674fafed09427f176506079bc135638a14e23e25be909131928db2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jieba
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fxsjy/jieba
  license: MIT
  license_file: LICENSE
  summary: Chinese Words Segmentation Utilities
  description: |
    Chinese Words Segmentation Utilities

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
