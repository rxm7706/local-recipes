# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.11.1"

package:
  name: azure-keyvault-secrets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-keyvault-secrets/azure_keyvault_secrets-${{ version }}.tar.gz
  sha256: 23b11cbecf4525081121e68a82d7f3a4211556f6dbb4ddbb390a94db8b72c938

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-core >=1.31.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-keyvault-secrets/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Corporation Key Vault Secrets Client Library for Python
  description: |
    Microsoft Corporation Key Vault Secrets Client Library for Python

extra:
  recipe-maintainers:
    - dhirschfeld

