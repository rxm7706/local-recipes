# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: azure-keyvault-secrets
  version: "4.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 23b11cbecf4525081121e68a82d7f3a4211556f6dbb4ddbb390a94db8b72c938

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - typing_extensions >=4.6.0
    - python >=${{ python_min }}
    - azure-core >=1.31.0
    - isodate >=0.6.1
    - typing-extensions >=4.0.1

tests:
  - python:
      imports:
        - azure.keyvault.secrets
        - azure.keyvault.secrets.aio
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Azure Key Vault Secret client library for Python
  homepage: https://docs.microsoft.com/en-au/azure/key-vault/
  repository: https://github.com/Azure/azure-sdk-for-python/tree/master/sdk/keyvault/azure-keyvault-secrets
  documentation: https://azuresdkdocs.blob.core.windows.net/$web/python/azure-keyvault-secrets/latest/index.html

extra:
  recipe-maintainers:
    - dhirschfeld
