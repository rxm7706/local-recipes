# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.4"
  python_min: "3.11"

package:
  name: meteostat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/meteostat/meteostat-${{ version }}.tar.gz
  sha256: 186936378be1a8234a91530ccac2464023cc610a9c5db5f1b988a07883e0c5c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pandas <4.0.0,>=2.3.0
    - pytz <2024.0,>=2023.3.post1
    - requests <3.0.0,>=2.31.0

tests:
  - python:
      imports:
        - meteostat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/meteostat/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Access and analyze historical weather and climate data with Python.
  description: |
    Access and analyze historical weather and climate data with Python.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
