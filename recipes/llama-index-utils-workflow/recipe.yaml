# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: llama-index-utils-workflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-utils-workflow/llama_index_utils_workflow-${{ version }}.tar.gz
  sha256: 6063e8c5868933ec69ed4962a06acec562b183b6382fc7b670261e382a95558d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.10,<0.10.0
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15.0,>=0.14
    - llama-index-workflows <3.0.0,>=2.22.0
    - pyvis >=0.3.2

tests:
  - python:
      imports:
        - llama_index.utils.workflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-utils-workflow/
  license: MIT
  license_file: LICENSE
  summary: llama-index utils for workflows
  description: |
    llama-index utils for workflows

extra:
  recipe-maintainers:
    - rxm7706

