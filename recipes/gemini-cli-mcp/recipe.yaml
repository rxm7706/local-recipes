# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.6"
  python_min: "3.12"

package:
  name: gemini-cli-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gemini-cli-mcp/gemini_cli_mcp-${{ version }}.tar.gz
  sha256: f71df1afd5f1555c0614ad36c8bb5aeb68523f15b7b876fd5256c88232a32513

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fastapi >=0.116.0
    - mcp >=1.10.1
    - pytest >=8.4.1
    - python-dotenv >=1.1.1
    - uv >=0.7.20
    - uvicorn >=0.35.0

tests:
  - python:
      imports:
        - gemini_cli_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/gemini-cli-mcp/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Gemini CLI MCP Server
  description: |
    Gemini CLI MCP Server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
