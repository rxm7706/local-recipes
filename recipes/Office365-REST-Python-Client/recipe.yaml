# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: office365-rest-python-client
  version: "2.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/office365_rest_python_client-${{ version }}.tar.gz
  sha256: ce27f5a1c0cc3ff97041ccd9b386145692be4c64739f243f7d6ac3edbe0a3c46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - typing_extensions >=4.0.0
    - python >=${{ python_min }}
    - requests
    - msal
    - pytz
    - typing-extensions >=4.0.0

tests:
  - python:
      imports:
        - office365
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft 365 & Microsoft Graph Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vgrem/Office365-REST-Python-Client

extra:
  recipe-maintainers:
    - marcelotrevisani
    - rxm7706
