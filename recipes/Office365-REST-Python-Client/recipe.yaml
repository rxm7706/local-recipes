# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: office365-rest-python-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/office365-rest-python-client/office365_rest_python_client-${{ version }}.tar.gz
  sha256: 3f95d29794ee0adc58e0b16f6574257c885c74af108e1789e4b3c286bc2ce5ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9,<0.10
  run:
    - python >=${{ python_min }}
    - msal <2,>=1.28
    - pytz >=2021.1
    - requests <3,>=2.32.4
    - typing_extensions >=4.5

tests:
  - python:
      imports:
        - office365
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/office365-rest-python-client/
  license: MIT
  license_file: LICENSE
  summary: Microsoft 365 & Microsoft Graph Library for Python
  description: |
    Microsoft 365 & Microsoft Graph Library for Python

extra:
  recipe-maintainers:
    - marcelotrevisani
    - rxm7706

