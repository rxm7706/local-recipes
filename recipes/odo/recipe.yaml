# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: odo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/odo/odo-${{ version }}.tar.gz
  sha256: e892ffe58e87d6b1c12838c4ab252bd0ae8c0ec43e5179409309ded4929905d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - odo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/blaze/odo
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Data migration utilities
  description: |
    Data migration utilities

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: odo
  cfe-upstream-registry: pypi
  cfe-upstream-name: odo
  cfe-purls:
    - pkg:conda/odo@${{ version }}?channel=conda-forge
    - pkg:pypi/odo@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/blaze/odo
  cfe-import-names: [odo]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/odo-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.5.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T02:08:58Z
