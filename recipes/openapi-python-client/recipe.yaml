# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openapi-python-client
  version: "0.29.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/openapi_python_client-${{ version }}.tar.gz
  sha256: 4ff439a63765aaef548e69c4eedd86dfad57891dc322709450af0c2c9a72a23e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - openapi-python-client = openapi_python_client.cli:app

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}
  run:
    - attrs >=22.2.0
    - colorama >=0.4.3
    - httpx >=0.23.1,<0.29.0
    - jinja2 >=3.0.0,<4.0.0
    - pydantic >=2.10,<3.0.0
    - python >=${{ python_min }}
    - ruamel.yaml >=0.18.6,<0.20.0
    - ruff >=0.2
    - shellingham >=1.3.2,<2.0.0
    - typer >0.16,<0.27

tests:
  - python:
      imports:
        - openapi_python_client
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - openapi-python-client --help

about:
  summary: Generate modern Python clients from OpenAPI
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/triaxtec/openapi-python-client

extra:
  recipe-maintainers:
    - wolfgang-noichl
    - asford
    - tdsmith
