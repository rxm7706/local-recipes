# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: pyt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyt/pyt-${{ version }}.tar.gz
  sha256: 09a12322f7027953b1195ea657b2b82f3c4d0b38df622bdaa6c8ff29674be216

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=62.3.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/Jaymon/pyt
  license: MIT
  license_file: LICENSE
  summary: easily run python unit tests
  description: |
    easily run python unit tests
  repository: https://github.com/Jaymon/pyt

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyt
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyt
  cfe-purls:
    - pkg:conda/pyt@${{ version }}?channel=conda-forge
    - pkg:pypi/pyt@${{ version }}
  cfe-upstream-repo: https://github.com/Jaymon/pyt
  cfe-upstream-homepage: http://github.com/Jaymon/pyt
  cfe-import-names: [pyt]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
