# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.0"

package:
  name: google-cloud-storage-control
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-storage-control/google_cloud_storage_control-${{ version }}.tar.gz
  sha256: 48351122e3375d2f00a393d6fbfed929c614246a2bd27c9410382b615a4641c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5
    - grpc-google-iam-v1 <1.0.0,>=0.14.2

tests:
  - python:
      imports:
        - google.cloud.storage_control
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage-control
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Storage Control API client library
  description: |
    Google Cloud Storage Control API client library

extra:
  recipe-maintainers:
    - ankitaluthra1
    - chandra-siri
    - xhochy

