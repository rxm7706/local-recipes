    - pkg:pypi/prob@${{ version }}
  cfe-upstream-repo: http://github.com/nuance/prob
  cfe-upstream-homepage: http://github.com/nuance/prob
  cfe-import-names: [prob]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
