# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: prob
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prob/prob-${{ version }}.tar.gz
  sha256: f1a140a2203f461f26841d76d6e378e9f61c384015e9659599eef35c403462fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - prob
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/nuance/prob
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Utilities for creating and working with discreteprobability distributions
  description: |
    Utilities for creating and working with discreteprobability distributions

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: prob
  cfe-upstream-registry: pypi
  cfe-upstream-name: prob
  cfe-purls:
