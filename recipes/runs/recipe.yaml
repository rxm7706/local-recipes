# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: runs
  version: "1.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/runs-${{ version }}.tar.gz
  sha256: 9dc1815e2895cfb3a48317b173b9f1eac9ba5549b36a847b5cc60c3bf82ecef1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - poetry-core
    - pip
  run:
    - python >=3.8
    - xmod

tests:
  - python:
      imports:
        - runs
      pip_check: true

about:
  summary: 🏃 Run a block of text as a subprocess  🏃
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rec/runs

extra:
  recipe-maintainers:
    - nicornk
