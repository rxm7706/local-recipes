# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2"

package:
  name: class-registry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/class-registry/class-registry-${{ version }}.tar.gz
  sha256: 678bdb0322566c07a4d8905140d364bd34a73baf46bf7580fc2e06fa994d4e7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - typing

tests:
  - python:
      imports:
        - class_registry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://class-registry.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Factory+Registry pattern for Python classes.
  description: |
    Factory+Registry pattern for Python classes.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
