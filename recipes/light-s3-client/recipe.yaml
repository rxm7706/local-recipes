# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.40"

package:
  name: light-s3-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/light-s3-client/light_s3_client-${{ version }}.tar.gz
  sha256: 73cd22d141a19813b5351edebd962db00a770d26be52e3c47eae5ce5d3b41851

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - requests <3,>=2.31
    - xmltodict ~=0.13.0

tests:
  - python:
      imports:
        - light_s3_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/light-s3-client/
  license: MIT
  license_file: LICENSE
  summary: A lightweight S3 client.
  description: |
    A lightweight S3 client.

extra:
  recipe-maintainers:
    - rxm7706

