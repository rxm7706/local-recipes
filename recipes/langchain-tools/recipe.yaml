# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.34"

package:
  name: langchain-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-tools/langchain-tools-${{ version }}.tar.gz
  sha256: 9d10fa288b2611342d3ae8c9aa44f8aba34d7e2ea5ce92aed320bc11eff12c05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - langchain
    - langchain-community
    - langchain-openai

tests:
  - python:
      imports:
        - langchain_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/MartinChen1973/langchain-tools
  license: MIT
  license_file: LICENSE
  summary: Simplifying, enhancing, and extending the LangChain library functionality
  description: |
    Simplifying, enhancing, and extending the LangChain library functionality

extra:
  recipe-maintainers:
    - rxm7706

