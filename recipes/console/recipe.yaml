# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9912"

package:
  name: console
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/console/console-${{ version }}.tar.gz
  sha256: f264ba2afe0c1f470b0ba61b0f7693f6a123461c0511e6a6c16a5a7e0c0f867c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ezenv >=0.92
    - jinxed

tests:
  - python:
      imports:
        - console
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mixmastamyk/console
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Comprehensive, composable utility library for ANSI terminals. Better, stronger, faster.  Tch-tch-tch-tch…
  description: |
    Comprehensive, composable utility library for ANSI terminals. Better, stronger, faster.  Tch-tch-tch-tch…
  repository: https://github.com/mixmastamyk/console
  documentation: https://mixmastamyk.bitbucket.io/console/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: console
  cfe-upstream-registry: pypi
  cfe-upstream-name: console
