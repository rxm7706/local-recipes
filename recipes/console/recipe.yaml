    - pkg:pypi/console@${{ version }}
  cfe-upstream-repo: https://github.com/mixmastamyk/console
  cfe-upstream-homepage: https://github.com/mixmastamyk/console
  cfe-import-names: [console]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
