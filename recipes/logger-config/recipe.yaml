# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: logger-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logger-config/logger-config-${{ version }}.tar.gz
  sha256: 840f729ffe1c1b860c1056ae8ef034aeeb1e7453f086e6db24c3576fcdc8ba01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - arrow

tests:
  - python:
      imports:
        - logger_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/insigmo/simple_logger
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

