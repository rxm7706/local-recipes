# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.ptresource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.ptresource/zope_ptresource-${{ version }}.tar.gz
  sha256: d77ccfa687ae7fe0b4d2b63dfd483d5fcad3c6c8101812e0e05bc7690fd29bd6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.browserresource
    - zope.interface
    - zope.pagetemplate
    - zope.publisher
    - zope.security

tests:
  - python:
      imports:
        - zope.ptresource
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.ptresource/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Page template resource plugin for zope.browserresource
  description: |
    Page template resource plugin for zope.browserresource

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
