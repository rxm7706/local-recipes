# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.3"

package:
  name: betterproto-fw
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/betterproto-fw/betterproto_fw-${{ version }}.tar.gz
  sha256: bade467215224f2807842da18fe81258a0a856766bad5f0a20a1474c5cdb6b93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - grpclib <0.5.0,>=0.4.1
    - python-dateutil <3.0.0,>=2.8.0
    - typing_extensions <5.0.0,>=4.7.1

tests:
  - python:
      imports:
        - betterproto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/betterproto-fw/
  license: MIT
  license_file: LICENSE
  summary: A better Protobuf / gRPC generator & library
  description: |
    A better Protobuf / gRPC generator & library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: betterproto-fw
