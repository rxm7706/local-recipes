# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.11"

package:
  name: neotermcolor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/neotermcolor/neotermcolor-${{ version }}.tar.gz
  sha256: 9a5a1d4d6987278f459aed25d1d60ff811478a8fe1ae0692c66875f250e82e6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - neotermcolor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/neotermcolor/
  license: MIT
  license_file: LICENSE
  summary: Fork of termcolor library
  description: |
    Fork of termcolor library
  repository: https://github.com/alttch/neotermcolor

extra:
  recipe-maintainers:
    - rxm7706

