# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.0"

package:
  name: nslookup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nslookup/nslookup-${{ version }}.tar.gz
  sha256: 8e660032fe1afcf16750e82e47f43f13548f9ff3228a580bf730df5585f02820

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dnspython

tests:
  - python:
      imports:
        - nslookup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wesinator/pynslookup
  license: MPL-2.0
  license_file: LICENSE
  summary: Sensible high-level DNS lookups in Python, using DNSpython resolver
  description: |
    Sensible high-level DNS lookups in Python, using DNSpython resolver

extra:
  recipe-maintainers:
    - rxm7706

