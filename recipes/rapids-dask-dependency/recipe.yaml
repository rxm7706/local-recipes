# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: rapids-dask-dependency
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/r/rapids-dask-dependency/rapids_dask_dependency-26.8.0-py3-none-any.whl
  sha256: 08ff4f4f7e97be3d24f4ca250bb4725ca9344279cc4446d3029b67c0a3f00792

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dask <2026.7.2,>=2026.7.1
    - distributed <2026.7.2,>=2026.7.1

tests:
  - python:
      imports:
        - rapids_dask_dependency
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rapids-dask-dependency/
  license: Apache-2.0
  license_file: LICENSE
  summary: Dask and Distributed version pinning for RAPIDS
  description: |
    Dask and Distributed version pinning for RAPIDS

extra:
  recipe-maintainers:
    - rxm7706

