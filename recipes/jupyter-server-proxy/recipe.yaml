# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.5.0"

package:
  name: jupyter-server-proxy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server-proxy/jupyter_server_proxy-${{ version }}.tar.gz
  sha256: 40835ed475fe30bea6e8f2e493fd8dfc700a7f37d86d6e97bc5298034521ac1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-jupyter-builder >=0.8.3
    - hatchling >=1.18.0
    - jupyterlab >=4.0.6,<5.0.0a0
  run:
    - python >=${{ python_min }}
    - aiohttp
    - importlib-metadata >=4.8.3
    - jupyter-server >=1.24.0
    - simpervisor >=1.0.0
    - tornado >=6.1.0
    - traitlets >=5.1.0

tests:
  - python:
      imports:
        - jupyter_server_proxy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jupyter-server-proxy/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Jupyter server extension to run additional processes and proxy to them that comes bundled JupyterLab extension to launch pre-defined processes.
  description: |
    A Jupyter server extension to run additional processes and proxy to them that comes bundled JupyterLab extension to launch pre-defined processes.
  repository: https://github.com/jupyterhub/jupyter-server-proxy
  documentation: https://jupyter-server-proxy.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham
    - lsetiawan
    - minrk
    - ocefpaf
    - xhochy
    - consideratio
    - bollwyvl
    - manics

