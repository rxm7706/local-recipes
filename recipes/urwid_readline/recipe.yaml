# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: urwid_readline
  version: "0.15.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/urwid_readline-${{ version }}.tar.gz
  sha256: 9301444b86d58f7d26388506b704f142cefd193888488b4070d3a0fdfcfc0f84

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - urwid

tests:
  - python:
      imports:
        - urwid_readline
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A textbox edit widget for urwid that supports readline shortcuts
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rr-/urwid_readline

extra:
  recipe-maintainers:
    - inducer
