# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-test-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-test-utils/opentelemetry_test_utils-${{ version }}.tar.gz
  sha256: f52a5182ea869a2c85f8ce1e7da80ada0327a361a57d0962a4504c36a3272884

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - asgiref ~=3.0
    - opentelemetry-api ==1.44.0
    - opentelemetry-sdk ==1.44.0
    - requests ~=2.28

tests:
  - python:
      imports:
        - opentelemetry.test
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tests/opentelemetry-test-utils
  license: Apache-2.0
  license_file: LICENSE
  summary: Test utilities for OpenTelemetry unit tests
  description: |
    Test utilities for OpenTelemetry unit tests
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - rxm7706

