# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0"

package:
  name: zope.processlifetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.processlifetime/zope_processlifetime-${{ version }}.tar.gz
  sha256: f35279eca8f88ab41f22107b3b2d2908a3916d058f5fbfb5c1dccfc99f7155ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.processlifetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.processlifetime
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope process lifetime events
  description: |
    Zope process lifetime events

extra:
  recipe-maintainers:
    - rxm7706

