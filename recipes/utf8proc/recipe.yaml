# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: utf8proc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/utf8proc/utf8proc-${{ version }}.tar.gz
  sha256: 8884bf31d5a489ee1a1e46fecd539a94fc0a1d7a225a2563c5ee5035bc70f53a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pybind11

tests:
  - python:
      imports:
        - utf8proc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TransitApp/utf8proc
  license: MIT
  license_file: LICENSE
  summary: Python wrapper on libutf8proc
  description: |
    Python wrapper on libutf8proc

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
