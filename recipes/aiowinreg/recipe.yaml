# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.13"

package:
  name: aiowinreg
  version: ${{ version }}

source:
  url: https://github.com/skelsec/aiowinreg/archive/refs/tags/${{ version }}.tar.gz
  sha256: 289c815d6eb7838a8933cdd2569a54d60da4273bbd81b5eee8eb658e56b8eac6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - prompt-toolkit >=3.0.2
    - winacl >=0.1.9

tests:
  - python:
      imports:
        - aiowinreg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/aiowinreg
  license: MIT
  license_file: LICENSE
  summary: Windows registry file reader
  description: |
    Windows registry file reader

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aiowinreg
