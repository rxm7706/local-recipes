# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.13.2"

package:
  name: antlr4-python3-runtime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antlr4-python3-runtime/antlr4_python3_runtime-${{ version }}.tar.gz
  sha256: 909b647e1d2fc2b70180ac586df3933e38919c85f98ccc656a96cd3f25ef3916

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - typing

tests:
  - python:
      imports:
        - antlr4
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.antlr.org
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: ANTLR 4.13.2 runtime for Python 3
  description: |
    ANTLR 4.13.2 runtime for Python 3

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
