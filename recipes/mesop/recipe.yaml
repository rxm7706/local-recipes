# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.4"

package:
  name: mesop
  version: ${{ version }}

source:
  url: https://github.com/mesop-dev/mesop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7315c1897dea946a53a181c4c8ed6f0b6bbbdf530addaef0196f452abf82f3da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.8.0
    - wheel
  run:
    - python >=${{ python_min }}
    - absl-py
    - deepdiff <9,>=8.6.1
    - flask
    - msgpack
    - protobuf
    - pydantic
    - python-dotenv
    - watchdog
    - werkzeug >=3.0.6

tests:
  - python:
      imports:
        - mesop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mesop-dev/mesop
  license: Apache-2.0
  license_file: LICENSE
  summary: Build UIs in Python
  description: |
    Build UIs in Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mesop
  cfe-upstream-registry: pypi
  cfe-upstream-name: mesop
  cfe-purls:
    - pkg:conda/mesop@${{ version }}?channel=conda-forge
    - pkg:pypi/mesop@${{ version }}
  cfe-upstream-repo: https://github.com/mesop-dev/mesop
  cfe-upstream-homepage: https://github.com/mesop-dev/mesop
  cfe-import-names: [mesop]
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
  cfe-noarch: python
  cfe-pip-check: "true"
