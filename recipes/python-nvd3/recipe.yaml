# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-nvd3
  version: "0.16.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/python-nvd3-${{ version }}.tar.gz
  sha256: 0115887289b3f751716ddd05c7b53ac5f05e71201e52496decdac453a50dcf7e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - nvd3 = nvd3.NVD3Chart:_main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-slugify >=1.2.5
    - jinja2 >=2.8

tests:
  - python:
      imports:
        - nvd3
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - nvd3 --help

about:
  license: MIT
  license_file: LICENSE
  summary: Python NVD3 - Chart Library for d3.js
  description: |
    NVD3 is an attempt to build re-usable charts and chart components
    for d3.js without taking away the power that d3.js offers you.
    Python-NVD3 makes your life easy! You write Python and the library
    renders JavaScript for you!
  homepage: http://github.com/areski/python-nvd3
  repository: http://github.com/areski/python-nvd3
  documentation: http://python-nvd3.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - sodre
    - xylar
