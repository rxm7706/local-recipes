# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.0"

package:
  name: python-nvd3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-nvd3/python-nvd3-${{ version }}.tar.gz
  sha256: 0115887289b3f751716ddd05c7b53ac5f05e71201e52496decdac453a50dcf7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - slugify
    - jinja2

tests:
  - python:
      imports:
        - nvd3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/areski/python-nvd3
  license: MIT
  license_file: LICENSE
  summary: Python NVD3 - Chart Library for d3.js
  description: |
    Python NVD3 - Chart Library for d3.js

extra:
  recipe-maintainers:
    - sodre
    - xylar

#### CFE metadata AND comments
