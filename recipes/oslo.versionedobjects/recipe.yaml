# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.11.0"
  python_min: "3.11"

package:
  name: oslo.versionedobjects
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oslo.versionedobjects/oslo_versionedobjects-${{ version }}.tar.gz
  sha256: eb4ecc831259fd43f6eb598a0e397c4dff44f9c78e0992b5d4ac3e59fc42a132

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - oslo.config >=5.2.0
    - oslo.context >=2.19.2
    - oslo.messaging >=5.29.0
    - oslo.utils >=7.4.0
    - oslo.log >=3.36.0
    - oslo.i18n >=3.15.3
    - netaddr >=0.7.18

tests:
  - python:
      imports:
        - oslo_versionedobjects
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/oslo.versionedobjects
  license: Apache-2.0
  license_file: LICENSE
  summary: Oslo Versioned Objects library
  description: |
    Oslo Versioned Objects library
  repository: https://opendev.org/openstack/oslo.versionedobjects

extra:
  recipe-maintainers:
    - rxm7706

