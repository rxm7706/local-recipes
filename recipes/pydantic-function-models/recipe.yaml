# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.12"

package:
  name: pydantic-function-models
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-function-models/pydantic_function_models-${{ version }}.tar.gz
  sha256: 530964fe7d77a3e153a7394bd4a6b1bbd7aa4bdfc7bc1420e58ebf815a527175

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.6,<0.12
  run:
    - python >=${{ python_min }}
    - pydantic >=2.10

tests:
  - python:
      imports:
        - pydantic_function_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lmmx/pydantic-function-models
  license: MIT
  license_file: LICENSE
  summary: Migrating v1 Pydantic ValidatedFunction to v2.
  description: |
    Migrating v1 Pydantic ValidatedFunction to v2.
  repository: https://github.com/lmmx/pydantic-function-models

extra:
  recipe-maintainers:
    - rxm7706

