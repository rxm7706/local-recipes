# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.1"

package:
  name: resource
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/Resource/Resource-${{ version }}.tar.gz
  sha256: 98354abd8efe73d5a10f21099d80bbef85ecedf7ca22a416ff20250a51acd916

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rsrc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RussellLuo/resource
  license: MIT
  license_file: LICENSE
  summary: A Python library concentrated on the Resource layer of RESTful APIs.
  description: |
    A Python library concentrated on the Resource layer of RESTful APIs.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
