# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.2.0"

package:
  name: pyfakefs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfakefs/pyfakefs-${{ version }}.tar.gz
  sha256: e59a36db447bf509ce9c97ab3d1510c08cc51895c5311325a560a5e5b5dc1940

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyfakefs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pyfakefs
  license: Apache-2.0
  license_file: LICENSE
  summary: Implements a fake file system that mocks the Python file system modules.
  description: |
    Implements a fake file system that mocks the Python file system modules.
  documentation: https://pytest-pyfakefs.readthedocs.io/

extra:
  recipe-maintainers:
    - tswast
    - thewchan

#### CFE metadata AND comments
