# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.6.0"

package:
  name: cuxfilter-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/c/cuxfilter-cu13/cuxfilter_cu13-26.6.0-py3-none-manylinux_2_28_aarch64.manylinux_2_28_x86_64.whl
  sha256: b1c1421aa07eb044853edfd49d183cc02904e9f52a10e3f106564348a62eec0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bokeh <=3.6.3,>=3.1
    - certifi >=2026.1.4
    - cudf-cu13 ==26.6.*
    - cupy-cuda13x !=14.0.0,!=14.1.0,>=13.6.0
    - dask-cudf-cu13 ==26.6.*
    - datashader >=0.15
    - geopandas >=0.11.0
    - holoviews <1.21.0,>=1.16.0
    - jupyter-server-proxy
    - numba-cuda <0.29.0,>=0.22.2
    - numba <0.65.0,>=0.60.0
    - numpy <3.0,>=1.23
    - packaging
    - panel >=1.0
    - requests
    - shapely

tests:
  - python:
      imports:
        - cuxfilter_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cuxfilter
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: GPU accelerated cross filtering with cuDF
  description: |
    GPU accelerated cross filtering with cuDF
  documentation: https://docs.rapids.ai/api/cuxfilter/stable/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
