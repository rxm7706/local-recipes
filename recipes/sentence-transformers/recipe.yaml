# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.7.0"

package:
  name: sentence-transformers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sentence-transformers/sentence_transformers-${{ version }}.tar.gz
  sha256: fd8c8fc35e6323631dff9f3760969ebf7980dc3cfda0ab1354bc6a774cc0e5d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - transformers <6.0.0,>=4.41.0
    - tokenizers >=0.19
    - huggingface-hub >=0.23.0
    - pytorch >=1.11.0
    - numpy >=1.20.0
    - scikit-learn >=0.22.0
    - scipy >=1.0.0
    - typing_extensions >=4.5.0
    - tqdm >=4.0.0

tests:
  - python:
      imports:
        - sentence_transformers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.SBERT.net
  license: Apache-2.0
  license_file: LICENSE
  summary: Embeddings, Retrieval, and Reranking
  description: |
    Embeddings, Retrieval, and Reranking
  repository: https://github.com/huggingface/sentence-transformers/

extra:
  recipe-maintainers:
    - rluria14
    - oblute
    - ndmaxar
    - sugatoray
    - glemaitre

