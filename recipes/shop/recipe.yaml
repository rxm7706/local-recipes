# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: shop
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SHop/SHop-${{ version }}.tar.gz
  sha256: 4bf3bb8bf97449169cdf672c7ff4c41d9e449614b4857cbfc74a13b19969a547

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - SHop_src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/sampleproject
  license: MIT
  license_file: LICENSE
  summary: Paquete para simulacion hidrologica operacional
  description: |
    Paquete para simulacion hidrologica operacional

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: shop
  cfe-upstream-registry: pypi
  cfe-upstream-name: SHop
