    - pkg:pypi/shop@${{ version }}
  cfe-upstream-repo: https://github.com/pypa/sampleproject
  cfe-upstream-homepage: https://github.com/pypa/sampleproject
  cfe-import-names: [SHop_src]
  cfe-source-kind: pypi-sdist
