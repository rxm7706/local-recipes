# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: siphash24
  version: "1.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/siphash24-${{ version }}.tar.gz
  sha256: aa932f0af4a7335caef772fdaf73a433a32580405c41eb17ff24077944b0aa97

build:
  number: 2

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then: meson >=1.0.0
    - if: build_platform != target_platform
      then: cython >=3.1.0
    - if: build_platform != target_platform
      then: meson-python >=0.18.0
  host:
    - python
    - cython >=3.1.0
    - meson >=1.0.0
    - meson-python >=0.18.0
    - pip
    - python-build
  run:
    - python

tests:
  - python:
      imports:
        - siphash24
      pip_check: false
  - files:
      source:
        - test.py
        - check.py
    requirements:
      run:
        - pip
    script:
      - if: not win
        then: PYTHONHASHSEED=0 python check.py
      - if: win
        then: set "PYTHONHASHSEED=0" && python check.py
      - python test.py

about:
  summary: Streaming-capable SipHash-1-3 and SipHash-2-4 Implementation
  license: Apache-2.0 or LGPL-2.1-or-later
  license_file:
    - LICENSES/Apache-2.0.txt
    - LICENSES/LGPL-2.1-or-later.txt
  homepage: https://github.com/dnicolodi/python-siphash24/
  repository: https://github.com/dnicolodi/python-siphash24/

extra:
  recipe-maintainers:
    - dnicolodi
    - inducer
    - matthiasdiener
