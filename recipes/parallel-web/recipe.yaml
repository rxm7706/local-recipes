# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: parallel-web
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parallel-web/parallel_web-${{ version }}.tar.gz
  sha256: a0aaa45535ac907b0eb94f636f6a0c142f8b1658add0510f7dd9a26e8a81b4ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - anyio <5,>=3.5.0
    - distro <2,>=1.7.0
    - httpx <1,>=0.23.0
    - pydantic <3,>=1.9.0
    - sniffio
    - typing_extensions <5,>=4.14

tests:
  - python:
      imports:
        - parallel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/parallel-web/parallel-sdk-python
  license: MIT
  license_file: LICENSE
  summary: The official Python library for the Parallel API
  description: |
    The official Python library for the Parallel API
  repository: https://github.com/parallel-web/parallel-sdk-python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: parallel-web
  cfe-upstream-registry: pypi
  cfe-upstream-name: parallel-web
