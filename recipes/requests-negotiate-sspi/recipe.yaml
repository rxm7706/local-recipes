# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: requests-negotiate-sspi
  version: "0.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/brandond/${{ name }}/archive/${{ version }}.tar.gz
  sha256: ada9105eab78e4f11081f13be63b61e1e9be80b705f6e132e05e4d7f7bfa429e

build:
  number: 5
  skip: not win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - pywin32 >=223
    - requests >=2.0

tests:
  - python:
      imports:
        - requests_negotiate_sspi
      pip_check: false

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Windows SSPI-based Negotiate authentication support for Requests
  homepage: https://github.com/brandond/requests-negotiate-sspi
  repository: https://github.com/brandond/requests-negotiate-sspi

extra:
  recipe-maintainers:
    - theavey
    - dhirschfeld
    - rzillman
