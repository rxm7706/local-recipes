# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.1.0"

package:
  name: argon2-cffi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/argon2-cffi/argon2_cffi-${{ version }}.tar.gz
  sha256: 694ae5cc8a42f4c4e2bf2ca0e64e51e23a040c6a517a85074683d3959e1346c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - argon2-cffi-bindings

tests:
  - python:
      imports:
        - argon2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/argon2-cffi/
  license: MIT
  license_file: LICENSE
  summary: Argon2 for Python
  description: |
    Argon2 for Python
  repository: https://github.com/hynek/argon2-cffi
  documentation: https://argon2-cffi.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
