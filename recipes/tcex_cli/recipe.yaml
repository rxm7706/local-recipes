# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"
  python_min: "3.11"

package:
  name: tcex_cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tcex_cli/tcex_cli-${{ version }}.tar.gz
  sha256: ffe525480d9df2877e84f7a37e7f47dc60acb7b1da2c86830a36a2ff4289dd82

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - arrow ~=1.4.0
    - black ~=26.5.1
    - debugpy ~=1.8
    - fakeredis ~=2.36.0
    - inflection ~=0.5.1
    - isort ~=8.0.1
    - jmespath ~=1.1.0
    - paho-mqtt ~=2.1.0
    - pyaes ~=1.6.1
    - pydantic ~=2.0
    - pydantic-settings ~=2.10
    - python-dateutil ~=2.9.0.post0
    - python-dotenv ~=1.0
    - pyyaml ~=6.0.3
    - redis-py ~=8.0.0
    - requests ~=2.34.2
    - rich ~=15.0.0
    - semantic_version ~=2.10.0
    - tinydb ~=4.8
    - typer ~=0.26.7
    - watchfiles ~=1.0
    - wrapt ~=2.2.1

tests:
  - python:
      imports:
        - tcex_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tcex_cli/
  license: Apache-2.0
  license_file: LICENSE
  summary: ThreatConnect Exchange App CLI Tool
  description: |
    ThreatConnect Exchange App CLI Tool
  repository: https://github.com/ThreatConnect-Inc/tcex-cli
  documentation: https://github.com/ThreatConnect-Inc/tcex-cli

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tcex_cli
