# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: authencoding
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/AuthEncoding/authencoding-${{ version }}.tar.gz
  sha256: 9b7ed85772cd28f35aa035276b566c038a44cce0cffeb6cb90df06a6caa0b0bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <=75.6.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - AuthEncoding
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/AuthEncoding
  license: ZPL-2.1
  license_file: LICENSE
  summary: Framework for handling LDAP style password hashes.
  description: |
    Framework for handling LDAP style password hashes.

extra:
  recipe-maintainers:
    - rxm7706

