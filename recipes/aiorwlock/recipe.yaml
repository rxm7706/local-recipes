# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aiorwlock
  version: "1.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aiorwlock-${{ version }}.tar.gz
  sha256: 2729c77ec736c8d85ec305aa3827a50394fd8c6d823f4404d301cc8c59a4b7f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiorwlock
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Read write lock for asyncio.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aio-libs/aiorwlock

extra:
  recipe-maintainers:
    - wendazhou
    - soapy1
