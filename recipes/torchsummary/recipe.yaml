# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: torchsummary
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/torchsummary/torchsummary-${{ version }}.tar.gz
  sha256: 981bf689e22e0cf7f95c746002f20a24ad26aa6b9d861134a14bc6ce92230590

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytorch
    - numpy

tests:
  - python:
      imports:
        - torchsummary
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sksq96/pytorch-summary
  license: MIT
  license_file: LICENSE
  summary: Model summary in PyTorch similar to Keras model.summary()
  description: |
    Model summary in PyTorch similar to `model.summary()` in Keras

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: torchsummary
  cfe-upstream-registry: pypi
  cfe-upstream-name: torchsummary
  cfe-purls:
    - pkg:conda/torchsummary@${{ version }}?channel=conda-forge
    - pkg:pypi/torchsummary@${{ version }}
  cfe-upstream-repo: https://github.com/sksq96/pytorch-summary
  cfe-upstream-homepage: https://github.com/sksq96/pytorch-summary
  cfe-import-names: [torchsummary]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
