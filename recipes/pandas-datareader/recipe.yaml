# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.1"

package:
  name: pandas-datareader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-datareader/pandas_datareader-${{ version }}.tar.gz
  sha256: e1eadb6d2ccaa4b7a876a1c81b6ff0307fa7a08b56f7799862a50207c2e65a05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8,<9
    - wheel
  run:
    - python >=${{ python_min }}
    - lxml
    - pandas >=2.1.4
    - requests >=2.19.0
    - setuptools

tests:
  - python:
      imports:
        - pandas_datareader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pandas.pydata.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pandas-compatible data readers. Formerly a component of pandas.
  description: |
    Pandas-compatible data readers. Formerly a component of pandas.
  repository: https://github.com/pydata/pandas-datareader.git
  documentation: https://pandas-datareader.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - mariusvniekerk
    - femtotrader
    - jreback
    - davidastephens
    - bashtage

