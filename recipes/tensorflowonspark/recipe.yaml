# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tensorflowonspark
  version: "2.2.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 589c56f2faee45200d5dad7cf0cc110f950287b4f2c53cbdcae5fd5504e91fdd
  patches:
    - 0001-fix-version-check.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - setuptools >=41.0.0
  host:
    - pip
    - python >=3.6
  run:
    - packaging
    - pyspark
    - python >=3.6
    - six
    - tensorflow

tests:
  - python:
      imports:
        - tensorflowonspark
      pip_check: false

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Deep learning with TensorFlow on Apache Spark clusters
  homepage: https://github.com/yahoo/TensorFlowOnSpark
  documentation: https://yahoo.github.io/TensorFlowOnSpark

extra:
  recipe-maintainers:
    - afloren
