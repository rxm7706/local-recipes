# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"

package:
  name: tgext.crud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tgext.crud/tgext.crud-${{ version }}.tar.gz
  sha256: f6b6271cd85faf402fff918190b596ad7eb60c922949ada461dbc4b29ab6b451

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tgext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TurboGears/tgext.crud
  license: MIT
  license_file: LICENSE
  summary: Crud Controller Extension for TG2
  description: |
    Crud Controller Extension for TG2

extra:
  recipe-maintainers:
    - rxm7706

