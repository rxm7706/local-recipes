# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyreadstat
  version: "1.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c7b3bde1d86d5b4bd93b8a783d306a1cc6b9cc64adc4b892754f24caa8270aa5

build:
  number: 0
  skip: match(python, "<3.5")
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: win
      then: ${{ compiler('c') }}
    - if: not win
      then: ${{ compiler('c') }}
    - if: not win
      then: ${{ stdlib("c") }}
  host:
    - python
    - pip
    - cython
    - setuptools
    - if: not win
      then: zlib
    - if: win
      then: zlib
    - if: win
      then: libiconv
  run:
    - python
    - narwhals >=2.10.1
    - numpy
    - if: not win
      then: zlib
    - if: win
      then: zlib
    - if: win
      then: libiconv

tests:
  - python:
      imports:
        - pyreadstat
      pip_check: false

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: read SAS, SPSS and STATA files into pandas data frames
  description: |
    A Python package to read SAS (sas7bdat, sas7bcat, xport/xpt), SPSS (sav, zsav, por) and Stata (dta) files into pandas data frames. It is a wrapper around the C library readstat.
  homepage: https://github.com/Roche/pyreadstat
  repository: https://github.com/Roche/pyreadstat
  documentation: https://github.com/Roche/pyreadstat

extra:
  recipe-maintainers:
    - ofajardo
