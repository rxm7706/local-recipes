# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.3"

package:
  name: zapish-logger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zapish-logger/zapish_logger-${{ version }}.tar.gz
  sha256: 85de29c3220eec45f72f4a22e9308af22725fc7522201cf7edf39d42123ffda8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=67.6.0
    - wheel >=0.40.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - zapish_logger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/zapish-logger/
  license: MIT
  license_file: LICENSE
  summary: A simple logger that logs in a JSON format inspired by go zap
  description: |
    A simple logger that logs in a JSON format inspired by go zap
  repository: https://github.com/btr1975/zapish-logger
  documentation: https://zapish-logger.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pb01ka
    - mgorny

