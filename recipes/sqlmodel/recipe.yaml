# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.39"

package:
  name: sqlmodel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlmodel/sqlmodel-${{ version }}.tar.gz
  sha256: 23d8e50a8d8ee936032ed79c55023a5d618dd6bc3c510bbf4909d1a7a605a570

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - docs-src
    - sqlalchemy <2.1.0,>=2.0.14
    - pydantic >=2.11.0
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - docs_src
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fastapi/sqlmodel
  license: MIT
  license_file: LICENSE
  summary: SQLModel, SQL databases in Python, designed for simplicity, compatibility, and robustness.
  description: |
    SQLModel, SQL databases in Python, designed for simplicity, compatibility, and robustness.
  repository: https://github.com/fastapi/sqlmodel
  documentation: https://sqlmodel.tiangolo.com

extra:
  recipe-maintainers:
    - tiangolo
    - maresb
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sqlmodel
  cfe-upstream-registry: pypi
  cfe-upstream-name: sqlmodel
  cfe-purls:
    - pkg:conda/sqlmodel@${{ version }}?channel=conda-forge
    - pkg:pypi/sqlmodel@${{ version }}
  cfe-upstream-repo: https://github.com/fastapi/sqlmodel
  cfe-upstream-homepage: https://github.com/fastapi/sqlmodel
  cfe-import-names: [docs_src]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sqlmodel-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
