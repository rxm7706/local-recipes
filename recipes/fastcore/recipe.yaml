# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.12"

package:
  name: fastcore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastcore/fastcore-${{ version }}.tar.gz
  sha256: 843589e613b1b6f69dc81fedb04075a0bcea159088509f560780aef6d3528294

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fastcore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastcore/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python supercharged for fastai development
  description: |
    Python supercharged for fastai development
  repository: https://github.com/AnswerDotAI/fastcore/
  documentation: https://fastcore.fast.ai/

extra:
  recipe-maintainers:
    - kai-tub
    - synapticarbors
    - thewchan

#### CFE metadata AND comments
