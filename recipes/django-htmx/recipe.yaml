# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-htmx
  version: "1.29.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 337dfa35b8da13fd68bf968f2b9cc9a4144a4e71f06c204d7ff10f7343988102

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.12.1,<0.13
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - asgiref >=3.6

tests:
  - python:
      imports:
        - django_htmx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Extensions for using Django with htmx.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/adamchainz/django-htmx
  documentation: https://django-htmx.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
