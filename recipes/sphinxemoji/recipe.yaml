# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: sphinxemoji
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxemoji/sphinxemoji-${{ version }}.tar.gz
  sha256: 814da89a9a7603b7e4d85c487c7381656fa83632f20065e5ed782ab1dbbb5083

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx >=5.0

tests:
  - python:
      imports:
        - sphinxemoji
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://sphinxemojicodes.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An extension to use emoji codes in your Sphinx documentation
  description: |
    An extension to use emoji codes in your Sphinx documentation
  repository: https://github.com/sphinx-contrib/emojicodes
  documentation: https://sphinxemojicodes.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
