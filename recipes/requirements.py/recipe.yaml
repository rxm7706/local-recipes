# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: requirements.py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requirements.py/requirements.py-${{ version }}.tar.gz
  sha256: abd71adc6a9ce564c04b602f7ab75586a9888563b9154fa55fe95e5feae07648

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - pip
    - packaging

tests:
  - python:
      imports:
        - requirements
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cvzi/requirements
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Find updates for packages in requirements.txt on pypi
  description: |
    Find updates for packages in requirements.txt on pypi

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: requirements.py
  cfe-upstream-registry: pypi
  cfe-upstream-name: requirements.py
  cfe-purls:
    - pkg:conda/requirements.py@${{ version }}?channel=conda-forge
    - pkg:pypi/requirements.py@${{ version }}
  cfe-upstream-repo: https://github.com/cvzi/requirements
  cfe-upstream-homepage: https://github.com/cvzi/requirements
  cfe-import-names: [requirements]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T19:31:03Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T19:31:03Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
