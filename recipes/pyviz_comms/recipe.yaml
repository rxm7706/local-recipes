# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.6"

package:
  name: pyviz_comms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyviz_comms/pyviz_comms-${{ version }}.tar.gz
  sha256: 73d66b620390d97959b2c4d8a2c0778d41fe20581be4717f01e46b8fae8c5695

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - param
    - pip
    - jupyter-packaging >=0.7.9,<0.8
    - jupyterlab >=4.0,<5
    - notebook
    - hatchling
    - hatch-nodejs-version
    - hatch-jupyter-builder
  run:
    - python >=${{ python_min }}
    - param
  run_constraints:
    - jupyterlab >=4.0,<5

tests:
  - python:
      imports:
        - pyviz_comms
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - param
        - python ${{ python_min }}

about:
  summary: Bidirectional communication for PyViz
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://www.holoviz.org

extra:
  recipe-maintainers:
    - jlstevens
    - philippjfr
    - maximlt
