# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.6"

package:
  name: pyviz-comms
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyviz-comms/pyviz_comms-${{ version }}.tar.gz
  sha256: 73d66b620390d97959b2c4d8a2c0778d41fe20581be4717f01e46b8fae8c5695

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version
  run:
    - python >=${{ python_min }}
    - param

tests:
  - python:
      imports:
        - pyviz_comms
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/holoviz/pyviz_comms
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A JupyterLab extension for rendering HoloViz content.
  description: |
    A JupyterLab extension for rendering HoloViz content.
  repository: https://github.com/holoviz/pyviz_comms.git

extra:
  recipe-maintainers:
    - jlstevens
    - philippjfr
    - maximlt

