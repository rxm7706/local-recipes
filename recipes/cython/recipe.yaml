# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.9"
  build_number: 0
  build_num: ${{ build_number + 100 }}

package:
  name: cython
  # handle cases like https://github.com/cython/cython/issues/7414
  version: ${{ version.split('-')[0] }}

source:
  url: https://github.com/cython/cython/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7f6e286ff834e1897cf54418cd6643422ad11ad6bcd4d15ba0521bb0b4decee8

build:
  number: ${{ build_number }}
  skip: use_noarch and not is_python_min
  noarch: ${{ 'python' if use_noarch else '' }}
  script:
    - if: use_noarch
      then: export NO_CYTHON_COMPILE=true
    - ${{ PYTHON }} -m pip install . --no-deps -vv
  variant:
    use_keys:
      - python
      - use_noarch
      - is_freethreading
  python:
    entry_points:
      - cython = Cython.Compiler.Main:setuptools_main
      - cythonize = Cython.Build.Cythonize:main
      - cygdb = Cython.Debugger.Cygdb:main
  track_features:
    - if: use_noarch
      then: cython_no_compile

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - if: use_noarch
      then: python ${{ python_min }}
    - if: not use_noarch
      then: python
    - pip
    - setuptools
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
    - if: not use_noarch
      then: python

tests:
  - files:
      recipe:
        - fib.pyx
    requirements:
      run:
        - setuptools
    script:
      - cython --version

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: The Cython compiler for writing C extensions for the Python language
  description: |
    Cython is an optimising static compiler for both the Python programming
    language and the extended Cython programming language. It makes writing C
    extensions for Python as easy as Python itself.
  homepage: http://www.cython.org/
  repository: https://github.com/cython/cython
  documentation: https://docs.cython.org

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - ocefpaf
    - synapticarbors
    - isuruf
    - scopatz
    - h-vetinari
