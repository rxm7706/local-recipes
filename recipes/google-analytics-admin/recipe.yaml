# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.30.1"

package:
  name: google-analytics-admin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-analytics-admin/google_analytics_admin-${{ version }}.tar.gz
  sha256: cc8b150217dbec45708867d9d81216e8a10e0f6d432e5e6ac66da2a83d4119b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.24.2
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.analytics.admin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-analytics-admin
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Analytics Admin API client library
  description: |
    Google Analytics Admin API client library

extra:
  recipe-maintainers:
    - xylar

