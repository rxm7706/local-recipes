    - pkg:pypi/common@${{ version }}
  cfe-upstream-repo: https://pypi.python.org/pypi/common
  cfe-upstream-homepage: https://pypi.python.org/pypi/common
  cfe-import-names: [common]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
