# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/common/common-${{ version }}.tar.gz
  sha256: 3dfa982670abefc870043b239eaa0ecd860be7aa952b1931c1356b426ff8c76a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - common
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.python.org/pypi/common
  license: UNKNOWN
  license_file: LICENSE
  summary: Common tools and data structures implemented in pure python.
  description: |
    Common tools and data structures implemented in pure python.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: common
  cfe-upstream-registry: pypi
  cfe-upstream-name: common
  cfe-purls:
