# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: pptxtopdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pptxtopdf/pptxtopdf-${{ version }}.tar.gz
  sha256: 6463703de7a3ee221879819ea829d9bf11812188debdad9a80eccc4c6273f2f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - comtypes

tests:
  - python:
      imports:
        - pptxtopdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hlviones/pptxtopdf
  license: MIT
  license_file: LICENSE
  summary: Convert PowerPoint files to PDF
  description: |
    Convert PowerPoint files to PDF

extra:
  recipe-maintainers:
    - rxm7706

