# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: nautobot-data-validation-engine
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nautobot-data-validation-engine/nautobot_data_validation_engine-${{ version }}.tar.gz
  sha256: ba7ca728c89bbc7462a8959ac9041c8b6bac5710cb68bdf82c741593c9802367

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - nautobot <3.0.0,>=2.4.20

tests:
  - python:
      imports:
        - nautobot_data_validation_engine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nautobot/nautobot-app-data-validation-engine
  license: Apache-2.0
  license_file: LICENSE
  summary: Provides UI to build custom data validation rules for data in Nautobot
  description: |
    Provides UI to build custom data validation rules for data in Nautobot
  repository: https://github.com/nautobot/nautobot-app-data-validation-engine
  documentation: https://docs.nautobot.com/projects/data-validation/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

