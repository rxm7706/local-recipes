# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1.0"

package:
  name: prometheus-fastapi-instrumentator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prometheus-fastapi-instrumentator/prometheus_fastapi_instrumentator-${{ version }}.tar.gz
  sha256: b77f3043665e8d28e2bbd21017506195a43d9adf1d402d01bf95b494b7e560e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0
  run:
    - python >=${{ python_min }}
    - prometheus_client <1.0.0,>=0.8.0
    - starlette <2.0.0,>=1.0.0

tests:
  - python:
      imports:
        - prometheus_fastapi_instrumentator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/trallnag/prometheus-fastapi-instrumentator
  license: ISC
  license_file: LICENSE
  summary: Instrument your FastAPI app with Prometheus metrics
  description: |
    Instrument your FastAPI app with Prometheus metrics

extra:
  recipe-maintainers:
    - rxm7706
    - lsetiawan

