# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.204.0"

package:
  name: daytona_api_client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/daytona_api_client/daytona_api_client-${{ version }}.tar.gz
  sha256: dce709c443ee8f676a715774cf765bf1b837df230c12e29ae72d693a529047d1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - urllib3 <3.0.0,>=2.7.0
    - python-dateutil >=2.9.0.post0
    - pydantic >=2.13.4
    - typing_extensions >=4.16.0

tests:
  - python:
      imports:
        - daytona_api_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/daytona_api_client/
  license: Apache-2.0
  license_file: LICENSE
  summary: Daytona
  description: |
    Daytona
  repository: https://github.com/daytona/clients

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
