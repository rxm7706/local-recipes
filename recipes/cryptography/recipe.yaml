# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated from python-maturin path; PyO3/maturin detected via sdist
# pyproject.toml [build-system].requires. Modelled on phonors PR pattern
# (modal 27-PR PyO3 sample, Mar 2020 – May 2026). Recipe shape follows the
# 2026 grayskull / conda-forge convention: literal ``package.name``, literal
# ``source.url`` (only ``${ version }`` templated), no ``name`` in context.
schema_version: 1

context:
  version: "50.0.0"

package:
  name: cryptography
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cryptography/cryptography-${{ version }}.tar.gz
  sha256: eeac2acb5a20ed25e0ad6d1df9891a520b78b404266b6d11778f25d5d691a6c9

build:
  number: 0
  script:
    env:
      # Per conda-forge.org/docs/maintainer/example_recipes/rust/ — applies to
      # any Rust build (CLI binary OR maturin/PyO3 cdylib). maturin invokes
      # cargo build internally and inherits these env vars.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python
    - cffi >=2.0.0
    - typing_extensions >=4.13.2

tests:
  - python:
      imports:
        - _cffi_src
      pip_check: true

about:
  homepage: https://github.com/pyca/cryptography
  license: Apache-2.0 OR BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: cryptography is a package which provides cryptographic recipes and primitives to Python developers.
  description: |
    cryptography is a package which provides cryptographic recipes and primitives to Python developers.
  repository: https://github.com/pyca/cryptography/
  documentation: https://cryptography.io/

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - h-vetinari

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cryptography
  cfe-upstream-registry: pypi
  cfe-upstream-name: cryptography
  cfe-purls:
    - pkg:conda/cryptography@${{ version }}?channel=conda-forge
    - pkg:pypi/cryptography@${{ version }}
  cfe-upstream-repo: https://github.com/pyca/cryptography/
  cfe-upstream-homepage: https://github.com/pyca/cryptography
  cfe-import-names: [_cffi_src]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cryptography-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T07:20:35Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T07:20:35Z
  cfe-local-build-status: failed
  cfe-local-build-datetime: 2026-08-17T07:20:35Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
