# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.37"

package:
  name: openinference-instrumentation-litellm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation-litellm/openinference_instrumentation_litellm-${{ version }}.tar.gz
  sha256: 1431f13e35ef9a979f818377c5dd3b1c0efcca97bd27bcba652b61d4d6877e6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation >=0.1.54
    - openinference-semantic-conventions >=0.1.31
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-sdk
    - setuptools
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.litellm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-litellm
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference liteLLM Instrumentation
  description: |
    OpenInference liteLLM Instrumentation

extra:
  recipe-maintainers:
    - rxm7706

