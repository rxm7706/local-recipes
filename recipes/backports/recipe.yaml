# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

package:
  name: backports
  version: 1.0

build:
  number: 5
  noarch: python
  script:
    - cd ${{ SP_DIR if SP_DIR is defined else '' }}
    - mkdir -p backports
    - cp ${{ RECIPE_DIR }}/init.py backports/__init__.py

requirements:
  host:
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - if: unix
        then: unset PIP_NO_INDEX
      - if: win
        then: set "PIP_NO_INDEX="
      - python -m pip install --target alt-site backports.tarfile
      - if: unix
        then: export PYTHONPATH="${SP_DIR}:alt-site"
      - if: win
        then: set "PYTHONPATH=%SP_DIR%;alt-site"
      - python -c "import backports.tarfile"

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A package to ensure the `backports` namespace is available.
  homepage: http://github.com/conda-forge/backports-feedstock

extra:
  recipe-maintainers:
    - jakirkham
    - isuruf
