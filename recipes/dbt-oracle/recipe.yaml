# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.0"

package:
  name: dbt-oracle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-oracle/dbt_oracle-${{ version }}.tar.gz
  sha256: 0deb9d4f2ce5a27354a3480e8604a1f0dc911aeda776d874a3e7606de35affaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
    - wheel
  run:
    - python >=${{ python_min }}
    - dbt-common <2.0,>=1.1.0
    - dbt-adapters <2.0,>=1.2.1
    - dbt-core <1.13,~=1.12
    - oracledb

tests:
  - python:
      imports:
        - dbt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dbt-oracle/
  license: Apache-2.0
  license_file: LICENSE
  summary: dbt (data build tool) adapter for Oracle Autonomous Database
  description: |
    dbt (data build tool) adapter for Oracle Autonomous Database
  repository: https://github.com/oracle/dbt-oracle
  documentation: https://docs.getdbt.com/reference/warehouse-profiles/oracle-profile

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
