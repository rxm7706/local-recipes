# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: double-conversion
  version: "3.4.0"
  sha256: 42fd4d980ea86426e457b24bdfa835a6f5ad9517ddb01cdb42b99ab9c8dd5dc9

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/google/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  prefix_detection:
    ignore_binary_files: false

requirements:
  build:
    - cmake
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
  run_exports:
    - ${{ pin_subpackage('double-conversion', upper_bound='x.x') }}

tests:
  - files:
      recipe:
        - test.cc
    requirements:
      run:
        - ${{ compiler('cxx') }}
    script:
      - if: unix
        then: test -f $PREFIX/lib/libdouble-conversion.a
      - if: unix
        then: test -f $PREFIX/lib/libdouble-conversion${SHLIB_EXT}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Efficient binary-decimal and decimal-binary conversion routines for IEEE doubles.
  description: |
    double-conversion provides binary-decimal and decimal-binary routines for IEEE doubles.
    The library consists of efficient conversion routines that have been extracted from
    the V8 JavaScript engine. The code has been refactored and improved so that it can be
    used more easily in other projects.
  homepage: http://github.com/google/double-conversion
  repository: https://github.com/google/${{ name }}
  documentation: https://github.com/google/${{ name }}

extra:
  recipe-maintainers:
    - xmnlab
    - pearu
    - xhochy
