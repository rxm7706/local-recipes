# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.21"

package:
  name: composio-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/composio-core/composio_core-${{ version }}.tar.gz
  sha256: 776e8961ffcaaa422d2ce53516fb80a3832cef25be13475cf5282f8626a9abdc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - requests <3,>=2.31.0
    - jsonschema <5,>=4.21.1
    - sentry-sdk >=2.0.0
    - pysher ==1.0.8
    - pydantic >=2.6.4
    - importlib-metadata >=4.8.1
    - jsonref >=1.1.0
    - inflection >=0.5.1
    - semver >=2.13.0
    - click
    - rich <14,>=13.7.1
    - pyperclip <2,>=1.8.2
    - pillow <11,>=10.2.0
    - paramiko >=3.4.1
    - fastapi
    - uvicorn
    - pyyaml >=6.0.2

tests:
  - python:
      imports:
        - composio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/composiohq/composio
  license: Apache-2.0
  license_file: LICENSE
  summary: [DEPRECATED] Core package to act as a bridge between composio platform and other services. Please use 'composio' instead.
  description: |
    [DEPRECATED] Core package to act as a bridge between composio platform and other services. Please use 'composio' instead.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: composio-core
  cfe-upstream-registry: pypi
  cfe-upstream-name: composio-core
