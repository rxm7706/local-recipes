    - pkg:pypi/composio-core@${{ version }}
  cfe-upstream-repo: https://github.com/composiohq/composio
  cfe-upstream-homepage: https://github.com/composiohq/composio
  cfe-import-names: [composio]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
