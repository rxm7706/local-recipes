# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.1.0"

package:
  name: social-auth-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/social-auth-core/social_auth_core-${{ version }}.tar.gz
  sha256: 1e8b678473fef38a972d3e4c5f6fa898558abe7ba46bd56b8429cc484483bf7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=78.0.2
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography >=46.0.7
    - defusedxml >=0.7.1
    - oauthlib >=3.3.1
    - pyjwt >=2.13.0
    - python3-openid >=3.2.0
    - requests-oauthlib >=2.0.0
    - requests >=2.34.0

tests:
  - python:
      imports:
        - social_core
        - social_core.backends
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python social authentication made simple
  homepage: https://github.com/python-social-auth/social-core

extra:
  recipe-maintainers:
    - ocefpaf
