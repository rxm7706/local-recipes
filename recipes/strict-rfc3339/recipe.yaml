# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7"

package:
  name: strict-rfc3339
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/strict-rfc3339/strict-rfc3339-${{ version }}.tar.gz
  sha256: 5cad17bedfc3af57b399db0fed32771f18fc54bbd917e85546088607ac5e1277

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strict_rfc3339
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.danielrichman.co.uk/libraries/strict-rfc3339.html
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Strict, simple, lightweight RFC3339 functions
  description: |
    Strict, simple, lightweight RFC3339 functions

extra:
  recipe-maintainers:
    - kynan
    - bollwyvl

