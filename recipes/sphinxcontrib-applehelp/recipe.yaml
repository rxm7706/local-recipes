# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: sphinxcontrib-applehelp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-applehelp/sphinxcontrib_applehelp-${{ version }}.tar.gz
  sha256: 2f29ef331735ce958efa4734873f084941970894c6090408b079c61b2e1c06d1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}
    - sphinx >=5

tests:
  - python:
      imports:
        - sphinxcontrib
        - sphinxcontrib.applehelp
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENCE.rst
  summary: sphinxcontrib-applehelp is a sphinx extension which outputs Apple help books
  homepage: https://www.sphinx-doc.org/
  repository: https://github.com/sphinx-doc/sphinxcontrib-applehelp
  documentation: https://www.sphinx-doc.org/en/master/

extra:
  recipe-maintainers:
    - AA-Turner
    - conda-forge/sphinx
    - ocefpaf
