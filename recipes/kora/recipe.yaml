# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.20"

package:
  name: kora
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kora/kora-${{ version }}.tar.gz
  sha256: e61f21711011cda4563b9165f16c6b3ed8237ef23f776ad9a85367fcbc281375

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython
    - fastcore

tests:
  - python:
      imports:
        - kora
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/korakot/kora
  license: MIT
  license_file: LICENSE
  summary: Convenient tools for Colab
  description: |
    Convenient tools for Colab

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: kora
