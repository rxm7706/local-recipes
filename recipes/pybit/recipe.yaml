# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.17.0"

package:
  name: pybit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pybit/pybit-${{ version }}.tar.gz
  sha256: 6ac46f4567c37c25bd7bd079b060535c9f1e02cd7a909dc72615ec63462d2c20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - websocket-client
    - pycryptodome

tests:
  - python:
      imports:
        - pybit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bybit-exchange/pybit
  license: MIT
  license_file: LICENSE
  summary: Python3 Bybit HTTP/WebSocket API Connector
  description: |
    Python3 Bybit HTTP/WebSocket API Connector

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
