# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3.post10"

package:
  name: fabric-analytics-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/f/fabric-analytics-sdk/fabric_analytics_sdk-0.0.3.post10-py3-none-any.whl
  sha256: 08de023d96add207ed132d2dd7b61f1d284dc0697b6879c045bef1f00c83d03f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core
    - azure-identity

tests:
  - python:
      imports:
        - fabric_analytics_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fabric-analytics-sdk/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: SDK for the Fabric Analytics Client
  description: |
    SDK for the Fabric Analytics Client

extra:
  recipe-maintainers:
    - rxm7706

