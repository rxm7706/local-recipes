# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: pdf-chunker-for-rag
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pdf-chunker-for-rag/pdf_chunker_for_rag-${{ version }}.tar.gz
  sha256: adf6abb6c3683ca25a5170192ceeef192982eca394239ac86f7d24661bd3e19a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pymupdf >=1.23.0
    - pypdf >=3.0.0

tests:
  - python:
      imports:
        - pdf_chunker_for_rag
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/your-username/chunk_creation
  license: MIT
  license_file: LICENSE
  summary: Production-ready PDF chunking library with intelligent content filtering and strategic header detection
  description: |
    Production-ready PDF chunking library with intelligent content filtering and strategic header detection

extra:
  recipe-maintainers:
    - rxm7706

