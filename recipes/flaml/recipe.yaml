# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: flaml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/FLAML/flaml-${{ version }}.tar.gz
  sha256: fee0a8419d8a4862afe8aa817c312c7479f4d137b806430ecf3b3c7033270730

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.17

tests:
  - python:
      imports:
        - flaml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/FLAML
  license: MIT
  license_file: LICENSE
  summary: A fast library for automated machine learning and tuning
  description: |
    A fast library for automated machine learning and tuning

extra:
  recipe-maintainers:
    - michalchromcak
    - skzhang1
    - thewchan

#### CFE metadata AND comments
