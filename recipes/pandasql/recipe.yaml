# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.3"

package:
  name: pandasql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandasql/pandasql-${{ version }}.tar.gz
  sha256: 1eb248869086435a7d85281ebd9fe525d69d9d954a0dceb854f71a8d0fd8de69

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pandasql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yhat/pandasql/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: sqldf for pandas
  description: |
    sqldf for pandas

extra:
  recipe-maintainers:
    - psortos
    - mxr-conda

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pandasql
  cfe-upstream-registry: pypi
  cfe-upstream-name: pandasql
  cfe-purls:
    - pkg:conda/pandasql@${{ version }}?channel=conda-forge
    - pkg:pypi/pandasql@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/yhat/pandasql/
  cfe-import-names: [pandasql]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pandasql-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.7.3

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T02:40:23Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T02:40:23Z
  cfe-local-build-status: failed
  cfe-local-build-datetime: 2026-08-18T02:40:23Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
