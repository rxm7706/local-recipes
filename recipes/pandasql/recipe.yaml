# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pandasql
  version: "0.7.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1eb248869086435a7d85281ebd9fe525d69d9d954a0dceb854f71a8d0fd8de69

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - numpy
    - pandas
    - python >=3.6
    - sqlalchemy

tests:
  - python:
      imports:
        - pandasql
        - pandasql.tests
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.txt
  summary: sqldf for pandas
  homepage: https://github.com/yhat/pandasql/
  repository: https://github.com/yhat/pandasql/

extra:
  recipe-maintainers:
    - psortos
    - mxr-conda
