# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.site
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.site/zope_site-${{ version }}.tar.gz
  sha256: d8139a3ad0f3e51732082dc98db8de29c834a6594126e63f25be6ea2ebc4064b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.annotation
    - zope.container
    - zope.deprecation
    - zope.security
    - zope.component >=4.5.0
    - zope.event
    - zope.interface >=4.5.0
    - zope.lifecycleevent
    - zope.location

tests:
  - python:
      imports:
        - zope.site
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://zopesite.readthedocs.io
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Local registries for zope component architecture
  description: |
    Local registries for zope component architecture

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zope.site
