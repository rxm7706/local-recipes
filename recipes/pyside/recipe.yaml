# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.4"

package:
  name: pyside
  version: ${{ version }}

source:
  url: https://pypi.python.org/packages/source/P/PySide/PySide-${{ version }}.tar.gz
  sha256: 1421bc1bf612c396070de9e1ffe227c07c1f3129278bc7d30c754b5146be2433
  file_name: PySide-${{ version }}.tar.gz
  patches:
    # eliminate spurious shiboken stderr output to avoid the 4MB log limit on Travis
    # https://codereview.qt-project.org/#/c/172582/
    - shiboken-osx-fix-stderr-output.patch
    # https://github.com/sparsehash/sparsehash/commit/7b8afad35bd601ea780b0f72e215de96613d3c95
    # https://codereview.qt-project.org/#/c/172583/
    - fix-vc2013-hash_map.patch
    # https://bugreports.qt.io/browse/PYSIDE-321
    # Backported https://code.qt.io/cgit/pyside/pyside.git/commit/?id=23d77136da1f249f0a78c8c7e8124adc8c604230
    - fix-vs2015-4.8.patch
    # make the testsuite pass
    - disable-failing-tests.patch
    # https://bugreports.qt.io/browse/PYSIDE-103
    - wrapinstance-overflow.patch
    # https://github.com/looooo/pivy/issues/18
    - if: win
      then: win_pointer_conversion_fix.patch

build:
  number: 8
  prefix_detection:
    ignore_binary_files: false

requirements:
  build:
    - toolchain
    - python
    - cmake
    - qt 4.8.*
    - libxslt
    - if: win and match(python, "==2.7") or win and match(python, "==2.7")
      then: vc 9.*
    - if: win and match(python, ">=3.5") or win and match(python, ">=3.5")
      then: vc 14.*
  run:
    - python
    - qt 4.8.*
    - libxslt
    - if: win and match(python, "==2.7") or win and match(python, "==2.7")
      then: vc 9.*
    - if: win and match(python, ">=3.5") or win and match(python, ">=3.5")
      then: vc 14.*

tests:
  - python:
      imports:
        - PySide.QtCore
        - PySide.QtDeclarative
        - PySide.QtGui
        - PySide.QtHelp
        - PySide.QtMultimedia
        - PySide.QtNetwork
        - PySide.QtScript
        - PySide.QtScriptTools
        - PySide.QtSql
        - PySide.QtSvg
        - PySide.QtTest
        - PySide.QtUiTools
        - PySide.QtWebKit
        - PySide.QtXml
        - PySide.QtXmlPatterns
        - PySide.QtOpenGL
        - if: not linux
          then: PySide.phonon
        - pysideuic
      pip_check: false
  - script:
      - pyside-lupdate -help
      - pyside-uic -help

about:
  license: LGPLLR
  license_file: sources/pyside/COPYING
  summary: Python bindings for Qt
  homepage: https://wiki.qt.io/PySide

extra:
  recipe-maintainers:
    - jschueller
    - ccordoba12
