# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-filter-subpackage
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3f468f1b36518128869b95deab661ba45ed6293854329fef14da4c8cac78af56

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools_scm
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - packaging

tests:
  - python:
      imports:
        - pytest_filter_subpackage
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pytest
        - pytest-doctestplus
        - pytest-cov
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Pytest plugin for filtering based on sub-packages
  description: |
    This package contains a simple plugin for the pytest framework that
    provides a shortcut to testing all code and documentation for a given
    sub-package.
  homepage: https://github.com/astropy/pytest-filter-subpackage
  repository: https://github.com/astropy/pytest-filter-subpackage
  documentation: https://github.com/astropy/pytest-filter-subpackage/blob/master/README.rst

extra:
  recipe-maintainers:
    - mwcraig
    - astrofrog
