# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: pytest-filter-subpackage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-filter-subpackage/pytest-filter-subpackage-${{ version }}.tar.gz
  sha256: 3f468f1b36518128869b95deab661ba45ed6293854329fef14da4c8cac78af56

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - packaging

tests:
  - python:
      imports:
        - pytest_filter_subpackage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/astropy/pytest-filter-subpackage
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pytest plugin for filtering based on sub-packages
  description: |
    Pytest plugin for filtering based on sub-packages

extra:
  recipe-maintainers:
    - mwcraig
    - astrofrog

#### CFE metadata AND comments
