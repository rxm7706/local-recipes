# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: gradio-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gradio-client/gradio_client-${{ version }}.tar.gz
  sha256: e648110efa31347bb8b1abda150a7a975b40a9658fdd8562803e2ad6a300d033

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-requirements-txt
    - hatch-fancy-pypi-readme >=22.5.0
  run:
    - python >=${{ python_min }}
    - fsspec
    - httpx >=0.24.1
    - huggingface_hub >=0.19.3,<2.0
    - packaging
    - typing_extensions ~=4.0

tests:
  - python:
      imports:
        - gradio_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gradio-app/gradio
  license: Apache-2.0
  license_file: LICENSE
  summary: Python library for easily interacting with trained machine learning models
  description: |
    Python library for easily interacting with trained machine learning models

extra:
  recipe-maintainers:
    - abidlabs
    - Sclare87

#### CFE metadata AND comments
