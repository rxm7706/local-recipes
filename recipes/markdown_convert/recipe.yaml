# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.13"

package:
  name: markdown_convert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdown_convert/markdown_convert-${{ version }}.tar.gz
  sha256: 48625c95017acf97ed7b6994b5ba3202a7586b7a3d3d4688bcb3d7f212284482

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - argsdict ==1.0.0
    - beautifulsoup4 >=4.14.3
    - python-duckdb >=1.4.4
    - install-playwright >=1.0.0
    - latex2mathml >=3.78.1
    - lxml >=6.0.2
    - markdown-it-py >=4.0.0
    - mdit-py-plugins >=0.5.0
    - pandas >=3.0.1
    - playwright >=1.57.0
    - pygments <3,>=2.17.2
    - ruamel.yaml >=0.19.1
    - string-grab >=1.3.0
    - vl-convert-python >=1.9.0.post1
    - yaml-to-schemdraw >=0.1.2

tests:
  - python:
      imports:
        - markdown_convert
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Julynx/markdown_convert
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Convert Markdown files to PDF from your command line.
  description: |
    Convert Markdown files to PDF from your command line.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: markdown_convert
  cfe-upstream-registry: pypi
  cfe-upstream-name: markdown_convert
