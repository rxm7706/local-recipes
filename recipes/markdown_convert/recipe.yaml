    - pkg:pypi/markdown-convert@${{ version }}
  cfe-upstream-repo: https://github.com/Julynx/markdown_convert
  cfe-upstream-homepage: https://github.com/Julynx/markdown_convert
  cfe-import-names: [markdown_convert]
