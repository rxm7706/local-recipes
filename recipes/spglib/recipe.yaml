# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: spglib
  version: "2.7.0"
  sha256: b22fc9abae9716c574fbc6d55cfc53ed654a714fccc5657a26ff5d18114bd8bd

package:
  name: ${{ name|lower }}
  version: ${{ version|replace("-","") }}

source:
  url: https://github.com/spglib/spglib/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  # Build is currently failing for pypy and aarch64 or ppc64le due to a rpath issue:
  number: 1
  skip: ((python_impl == 'pypy') and (aarch64 or ppc64le)) or match(python, "<3.9")

requirements:
  build:
    # cross-python needed to run $PYTHON -m pip on build
    # Otherwise it gets Bad CPU type in executable
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - gtest
    - cmake
    - ninja
  host:
    - python
    - numpy
    # These are technically `build` requirements, but conda build fails if put there
    - pip
    - scikit-build-core
    - setuptools-scm
    - pybind11
  run:
    - python
    - typing-extensions
    - importlib-resources
  run_exports:
    - ${{ 'spglib' if not win else '' }}

tests:
  - python:
      imports:
        - spglib
      pip_check: false
  - files:
      source:
        - pyproject.toml
        - test/functional/python
    requirements:
      run:
        - pyyaml
        - pytest
    script:
      - pytest

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Space symmetry groups spglib module/library.
  description: |
    Spglib is a library for finding and handling crystal symmetries.
  homepage: https://spglib.readthedocs.io
  repository: https://github.com/spglib/spglib
  documentation: https://spglib.readthedocs.io

extra:
  recipe-maintainers:
    - LecrisUT
    - jochym
    - atztogo
