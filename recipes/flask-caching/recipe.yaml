# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: Flask-Caching
  version: "2.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: ecef4ca80b9cb1fa01d461373a0fce441527cd57eecee1aa71c1f6d750d7ff77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - flask
    - cachelib >=0.9.0

tests:
  - python:
      imports:
        - flask_caching
        - flask_caching.backends
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Adds caching support to your Flask application
  homepage: https://github.com/sh4nks/flask-caching
  repository: https://github.com/sh4nks/flask-caching
  documentation: https://pythonhosted.org/Flask-Caching

extra:
  recipe-maintainers:
    - halldc
    - ap--
    - soapy1
