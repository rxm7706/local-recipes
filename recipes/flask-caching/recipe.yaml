# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: flask-caching
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Caching/flask_caching-${{ version }}.tar.gz
  sha256: ecef4ca80b9cb1fa01d461373a0fce441527cd57eecee1aa71c1f6d750d7ff77

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - flask >=2.0
    - cachelib >=0.9.0

tests:
  - python:
      imports:
        - flask_caching
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-Caching/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Adds caching support to Flask applications.
  description: |
    Adds caching support to Flask applications.
  repository: https://github.com/pallets-eco/flask-caching
  documentation: https://flask-caching.readthedocs.io

extra:
  recipe-maintainers:
    - halldc
    - ap--
    - soapy1

