# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.23"

package:
  name: asyauth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyauth/asyauth-${{ version }}.tar.gz
  sha256: 36f0384ddb2b625a10333363cafe190d6e9c9ed17fd07b3e2887641a3cc626f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - unicrypto >=0.0.12
    - asn1crypto >=1.3.0
    - asysocks >=0.2.18
    - minikerberos >=0.4.9

tests:
  - python:
      imports:
        - asyauth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/asyauth
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Unified authentication library
  description: |
    Unified authentication library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
