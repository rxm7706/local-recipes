# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"
  python_min: "3.11"

package:
  name: naampy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/naampy/naampy-${{ version }}.tar.gz
  sha256: 75f6a736f1ef5ce4e564136b17752864b78b58e6ebd5368d33f2b8c889929006

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.13,<0.10.0
  run:
    - python >=${{ python_min }}
    - pytorch >=2.0.0
    - numpy >=1.21.0
    - pandas <2.3.0,>=1.5.0
    - requests >=2.25.0
    - tqdm >=4.60.0

tests:
  - python:
      imports:
        - naampy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/appeler/naampy
  license: MIT
  license_file: LICENSE
  summary: Infer Gender from Indian Names
  description: |
    Infer Gender from Indian Names
  repository: https://github.com/appeler/naampy
  documentation: https://appeler.github.io/naampy/

extra:
  recipe-maintainers:
    - rxm7706

