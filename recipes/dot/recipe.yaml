# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: dot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dot/dot-${{ version }}.tar.gz
  sha256: 3543921eefa82923870fc752ebdadc593962e0d0db507d27daab9528c05ceb58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dot/
  license: MIT
  license_file: LICENSE
  summary: Providing context to models...
  description: |
    Providing context to models...

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
