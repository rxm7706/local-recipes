# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: llama-index-embeddings-adapter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-embeddings-adapter/llama_index_embeddings_adapter-${{ version }}.tar.gz
  sha256: 4af75cb2ab10861316bea55ad2eaf9641c0953c6d99651bd6656fc5fff955148

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - pytorch >=2.0.0

tests:
  - python:
      imports:
        - llama_index.embeddings.adapter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-embeddings-adapter/
  license: MIT
  license_file: LICENSE
  summary: llama-index embeddings adapter integration
  description: |
    llama-index embeddings adapter integration

extra:
  recipe-maintainers:
    - rxm7706

