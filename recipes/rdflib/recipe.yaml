# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.6.0"

package:
  name: rdflib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rdflib/rdflib-${{ version }}.tar.gz
  sha256: 6c831288d5e4a5a7ece85d0ccde9877d512a3d0f02d7c06455d00d6d0ea379df

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.4.0
  run:
    - python >=${{ python_min }}
    - isodate <1.0.0,>=0.7.2
    - pyparsing <4,>=2.1.0

tests:
  - python:
      imports:
        - rdflib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RDFLib/rdflib
  license: BSD-3-Clause
  license_file: LICENSE
  summary: RDFLib is a Python library for working with RDF, a simple yet powerful language for representing information.
  description: |
    RDFLib is a Python library for working with RDF, a simple yet powerful language for representing information.
  repository: https://github.com/RDFLib/rdflib
  documentation: https://rdflib.readthedocs.org/

extra:
  recipe-maintainers:
    - aucampia
    - satra
    - nicholascar
    - bollwyvl

