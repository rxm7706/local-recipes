# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.2"

package:
  name: channels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/channels/channels-${{ version }}.tar.gz
  sha256: f2bb6bfb73ad7fb4705041d07613c7b4e69528f01ef8cb9fb6c21d9295f15667

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - asgiref <4,>=3.9.0

tests:
  - python:
      imports:
        - channels
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/django/channels
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Brings async, event-driven capabilities to Django.
  description: |
    Brings async, event-driven capabilities to Django.

extra:
  recipe-maintainers:
    - chrisbarber
    - swainn

#### CFE metadata AND comments
