# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.22.1"

package:
  name: roadtx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roadtx/roadtx-${{ version }}.tar.gz
  sha256: 90eb17a303392cce635fc5d6f86f2eeb93fdcb6ffa64c230305bdb02d3bf6f7e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42.0.0
  run:
    - python >=${{ python_min }}
    - roadlib >=1.7
    - requests
    - selenium
    - selenium-wire-roadtx >=5.2.4
    - pyotp
    - pycryptodomex
    - signxml >3
    - setuptools

tests:
  - python:
      imports:
        - roadtools.roadtx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dirkjanm/ROADtools/
  license: MIT
  license_file: LICENSE
  summary: ROADtools Token eXchange
  description: |
    ROADtools Token eXchange

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
