# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: honcho
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/honcho-${{ version }}.tar.gz
  sha256: af3815c03c634bf67d50f114253ea9fef72ecff26e4fd06b29234789ac5b8b2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - honcho=honcho.command:main

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.8
    - colorama

tests:
  - python:
      imports:
        - honcho
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - honcho --help

about:
  summary: Python clone of Foreman for managing Procfile-based applications.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/nickstenning/honcho

extra:
  recipe-maintainers:
    - thewchan
