# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.2"

package:
  name: execnet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/execnet/execnet-${{ version }}.tar.gz
  sha256: 63d83bfdd9a23e35b9c6a3261412324f964c2ec8dcd8d3c6916ee9373e0befcd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.26
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - execnet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://execnet.readthedocs.io/en/latest/
  license: MIT
  license_file: LICENSE
  summary: "execnet: rapid multi-Python deployment"
  description: |
    execnet: rapid multi-Python deployment

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
