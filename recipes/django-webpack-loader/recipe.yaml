# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-webpack-loader
  version: "3.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0a253113ea6b150403cd2de802e732872c1d5e3185f0ad4a7fac673c00ae5af2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - jinja2
    - python >=${{ python_min }}
    - django >=3.2

tests:
  - python:
      imports:
        - webpack_loader
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Transparently use webpack with django
  homepage: https://github.com/owais/django-webpack-loader
  repository: https://github.com/owais/django-webpack-loader

extra:
  recipe-maintainers:
    - rxm7706
    - mxr-conda
    - rluria14
    - oblute
