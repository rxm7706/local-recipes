# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: proto-parser
  version: "1.6.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/proto-parser-${{ version }}.tar.gz
  sha256: 64fa04560414ece2f9dea87135e997534e3d96db1a001d1c42a98daca9da7711

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lark-parser >=0.8.6
    - numpy >=1.14.0

tests:
  - python:
      imports:
        - protoparser
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A package for parsing proto files
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/khadgarmage/protoparser

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
