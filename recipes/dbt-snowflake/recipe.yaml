# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.1"

package:
  name: dbt-snowflake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbt-snowflake/dbt_snowflake-${{ version }}.tar.gz
  sha256: e78d14f2f874924b0fe417bfbce0cad59dc9910a487811692795927ce140e503

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
  run:
    - python >=${{ python_min }}
    - dbt-common >=1.10,<2.0
    - dbt-adapters >=1.24.4,<2.0
    - snowflake-connector-python >=4.2.0,<5.0.0
    - certifi <2025.4.26
    - dbt-core >=1.10.0rc0,<2.0
    - agate

tests:
  - python:
      imports:
        - dbt.adapters.snowflake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The Snowflake adapter plugin for dbt
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dbt-labs/dbt-snowflake

extra:
  recipe-maintainers:
    - rxm7706
    - maresb
    - thewchan

#### CFE metadata AND comments
