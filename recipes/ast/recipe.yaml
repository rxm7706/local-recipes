# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: ast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/AST/AST-${{ version }}.tar.gz
  sha256: dc5b79c6ba11aea72c59c791a0bc5ae483b4c18fec6f643002d6fae24361eba0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - AST
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yijunyu/needle/
  license: MIT
  license_file: LICENSE
  summary: Conversion between protobuf3 and srcML.
  description: |
    Conversion between protobuf3 and srcML.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ast
  cfe-upstream-registry: pypi
  cfe-upstream-name: AST
  cfe-purls:
