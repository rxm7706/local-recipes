    - pkg:pypi/ast@${{ version }}
  cfe-upstream-repo: https://github.com/yijunyu/needle/
  cfe-upstream-homepage: https://github.com/yijunyu/needle/
  cfe-import-names: [AST]
  cfe-source-kind: pypi-sdist
