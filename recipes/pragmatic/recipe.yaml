# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4"

package:
  name: pragmatic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pragmatic/pragmatic-${{ version }}.tar.gz
  sha256: 85bb2eca17c39e49d78090ab8d172dce08b5253cca923a8fdb599d62b19672c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - auto_graph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pragmatic/
  license: MIT
  license_file: LICENSE
  summary: C++ accelerated parts of auto_graph
  description: |
    C++ accelerated parts of auto_graph

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pragmatic
  cfe-upstream-registry: pypi
  cfe-upstream-name: pragmatic
  cfe-purls:
    - pkg:conda/pragmatic@${{ version }}?channel=conda-forge
    - pkg:pypi/pragmatic@${{ version }}
  cfe-upstream-repo: https://pypi.org/project/pragmatic/
  cfe-upstream-homepage: https://pypi.org/project/pragmatic/
  cfe-import-names: [auto_graph]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T17:47:11Z
