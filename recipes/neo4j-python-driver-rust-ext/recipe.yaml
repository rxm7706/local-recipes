# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  pypi_name: neo4j-rust-ext
  name: neo4j-python-driver-rust-ext
  version: "6.2.0.0"
  driver_target_version: ${{ ".".join(version | split(".")[:3]) }}
  docs_version: ${{ ".".join(version | split(".")[:2]) }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pypi_name[0] }}/${{ pypi_name }}/${{ pypi_name | replace("-", "_") }}-${{ version }}.tar.gz
  sha256: f30e27741729924a1466c9d91890174524851d0eb07616cd7ebe297af6ed786a

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform and not linux
      then: maturin ~=1.13.1
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin ~=1.13.1
  run:
    - python
    - neo4j-python-driver ==${{ driver_target_version }}

tests:
  - requirements:
      run:
        - python
        - pip
    script:
      - pip check
      - python -c "import neo4j._codec.packstream; assert neo4j._codec.packstream.RUST_AVAILABLE is True"

about:
  summary: Rust Extensions for a Faster Neo4j Bolt Driver for Python
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE.txt
    - LICENSE.MIT.txt
    - LICENSE.APACHE2.txt
    - THIRDPARTY.yml
  homepage: https://neo4j.com/
  repository: https://github.com/neo4j/neo4j-python-driver-rust-ext
  documentation: https://neo4j.com/docs/api/python-driver/${{ docs_version }}/

extra:
  recipe-maintainers:
    - robsdedude
