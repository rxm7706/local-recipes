# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.518"

package:
  name: omsdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/o/omsdk/omsdk-1.2.518-py2.py3-none-any.whl
  sha256: d0ae3ada1182ca2b03acdd5acb3c73d730bf7e26262bb4ed5cffad7289d1a571

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.12.3
    - pyyaml >=3.12
    - future >=0.16.0
    - pysnmp-mibs >=0
    - ipaddress >=0
    - enum34

tests:
  - python:
      imports:
        - omsdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://support.dell.com
  license: Apache-2.0
  license_file: LICENSE
  summary: Dell OpenManage SDK
  description: |
    Dell OpenManage SDK

extra:
  recipe-maintainers:
    - rxm7706

