# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: sorted-in-disk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sorted-in-disk/sorted-in-disk-${{ version }}.tar.gz
  sha256: 7b81a6c6f4fddc2efe4c2c3bb1eaf3259e71fcfb12895b4ca2fb7345ea20303a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - easy-binary-file
    - quick-queue

tests:
  - python:
      imports:
        - sorted_in_disk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Invarato/sort_in_disk_project
  license: MIT
  license_file: LICENSE
  summary: Sort a bulk of data in disk and parallel (RAM memory free)
  description: |
    Sort a bulk of data in disk and parallel (RAM memory free)

extra:
  recipe-maintainers:
    - rxm7706

