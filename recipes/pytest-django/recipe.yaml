# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.14.0"

package:
  name: pytest-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-django/pytest_django-${{ version }}.tar.gz
  sha256: 26787dd3f422cfbab8f55b80a776e2edea7a11092cb74e960bef1312515708ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - pytest_django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-django/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Django plugin for pytest.
  description: |
    A Django plugin for pytest.
  repository: https://github.com/pytest-dev/pytest-django
  documentation: https://pytest-django.readthedocs.io/

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf

#### CFE metadata AND comments
