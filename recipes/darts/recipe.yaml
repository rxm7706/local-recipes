# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pt.darts
  version: "0.2"

package:
  name: ${{ name | replace("pt.", "") }}
  version: ${{ version }}

source:
  url: https://github.com/khanrc/${{ name }}/archive/${{ version }}.tar.gz
  sha256: b0c4689cdabc5fdec0ba3c829057aa2cb94f9a97036cf5ae545de6247d301e9c

build:
  number: 0
  noarch: python
  script:
    - cp -r $SRC_DIR $SP_DIR/${{ name | replace("pt.", "") }}

requirements:
  host:
    - python >=3.6
  run:
    - python >=3.6
    - numpy
    - graphviz
    - pytorch >=0.4.1
    - torchvision
    - tensorboard
    - tensorboardx

tests:
  - python:
      imports:
        - darts
      pip_check: false

about:
  summary: Differentiable Architecture Search
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/khanrc/pt.darts
  repository: https://github.com/khanrc/pt.darts

extra:
  recipe-maintainers:
    - rluria14
    - oblute
    - ndmaxar
