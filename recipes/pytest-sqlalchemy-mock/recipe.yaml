# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: pytest-sqlalchemy-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-sqlalchemy-mock/pytest_sqlalchemy_mock-${{ version }}.tar.gz
  sha256: 516637fcdaf7c88687ea21a8c1f3649da50da7e32f6743e10dbc13cb9fb5e46e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0
    - sqlalchemy >=2.0.6

tests:
  - python:
      imports:
        - pytest_sqlalchemy_mock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/resulyrt93/pytest-sqlalchemy-mock
  license: MIT
  license_file: LICENSE
  summary: pytest sqlalchemy plugin for mock
  description: |
    pytest sqlalchemy plugin for mock

extra:
  recipe-maintainers:
    - rxm7706

