# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "151.0.7922.76"

package:
  name: chromedriver-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chromedriver-py/chromedriver_py-${{ version }}.tar.gz
  sha256: 196484093fc290b3a089c63916c602963866ea80f3828df61f5867799e586ab8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chromedriver_py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/breuerfelix/chromedriver-py
  license: Apache-2.0
  license_file: LICENSE
  summary: chromedriver binaries for all platforms
  description: |
    chromedriver binaries for all platforms

extra:
  recipe-maintainers:
    - rxm7706

