# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.3"

package:
  name: pytest-twisted
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-twisted/pytest_twisted-${{ version }}.tar.gz
  sha256: 37e150cbbc0edba6592d36c53f44fc1196f3a9e93e7bef6a25bb10d9963f7f3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - twisted
    - greenlet
    - pytest >=2.3
    - decorator

tests:
  - python:
      imports:
        - pytest_twisted
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-twisted
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A twisted plugin for pytest.
  description: |
    A twisted plugin for pytest.

extra:
  recipe-maintainers:
    - akrherz

#### CFE metadata AND comments
