# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash-ag-grid
  version: "35.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dash_ag_grid-${{ version }}.tar.gz
  sha256: 012f7e7d5bff4862d1377ccb545ae2c80577e7909e118a88f1c408ff03a2403e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash >=2

tests:
  - python:
      imports:
        - dash_ag_grid
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Dash wrapper around AG Grid, the best interactive data grid for the web.
  license: MIT
  license_file: LICENSE
  homepage: https://dash.plotly.com/dash-ag-grid
  repository: https://github.com/plotly/dash-ag-grid

extra:
  recipe-maintainers:
    - rxm7706
    - JohanMabille
