# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.26.0"

package:
  name: pan-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pan-python/pan_python-${{ version }}.tar.gz
  sha256: 0a0ea34279b745e8e3d55df015e18ab299051ffdd519128d9340ff7aae4e2392

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lib.pan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kevinsteves/pan-python
  license: ISC
  license_file: LICENSE
  summary: Multi-tool set for Palo Alto Networks PAN-OS, Panorama, WildFire and AutoFocus
  description: |
    Multi-tool set for Palo Alto Networks PAN-OS, Panorama, WildFire and AutoFocus

extra:
  recipe-maintainers:
    - rxm7706

