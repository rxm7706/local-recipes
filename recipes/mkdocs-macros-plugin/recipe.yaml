# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mkdocs-macros-plugin
  version: "1.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 12aa45ce7ecb7a445c66b9f649f3dd05e9b92e8af6bc65e4acd91d26f878c01f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - mkdocs >=0.17
    - hjson-py
    - jinja2
    - packaging
    - pathspec
    - python-dateutil
    - super-collections
    - termcolor
    - pyyaml

tests:
  - python:
      imports:
        - mkdocs_macros
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.md
  summary: Unleash the power of MkDocs with macros and variables
  homepage: https://github.com/fralau/mkdocs_macros_plugin

extra:
  recipe-maintainers:
    - marcelotrevisani
    - hoechenberger
