# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: exception
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/exception/exception-${{ version }}.tar.gz
  sha256: b11176dc5c4386a1649476d498b2efd3cd6eb1151ca6c2214f16b90a785c0a3b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - exception
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tdhopper/exception
  license: MIT
  license_file: LICENSE
  summary: Extract unique Python exceptions with their traceback from a log file.
  description: |
    Extract unique Python exceptions with their traceback from a log file.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
