# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.7"

package:
  name: ruamel.yaml.clibz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ruamel.yaml.clibz/ruamel_yaml_clibz-${{ version }}.tar.gz
  sha256: 2be85214793cfc787eb12380fa3226e10cd7727b24551c3067c173d66c9bedd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.9.0
    - setuptools-zig >=0.5.1
    - ziglang >=0.15,<0.16
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ruamel.yaml.clibz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://sourceforge.net/p/ruamel-yaml-clibz/
  license: MIT
  license_file: LICENSE
  summary: C version of reader, parser and emitter for ruamel.yaml, compiled with Zig, derived from libyaml
  description: |
    C version of reader, parser and emitter for ruamel.yaml, compiled with Zig, derived from libyaml
  repository: https://sourceforge.net/p/ruamel-yaml-clibz/code/ci/default/tree/
  documentation: https://yaml.dev/doc/ruamel.yaml.clibz

extra:
  recipe-maintainers:
    - rxm7706

