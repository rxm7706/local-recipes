# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.14"

package:
  name: flask-swagger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-swagger/flask-swagger-${{ version }}.tar.gz
  sha256: b4085f5bc36df4c20b6548cd1413adc9cf35719b0f0695367cd542065145294d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - pyyaml

tests:
  - python:
      imports:
        - flask_swagger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gangverk/flask-swagger
  license: MIT
  license_file: LICENSE
  summary: Extract swagger specs from your flask project
  description: |
    Extract swagger specs from your flask project

extra:
  recipe-maintainers:
    - sodre
    - xylar

