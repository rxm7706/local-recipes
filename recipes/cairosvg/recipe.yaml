# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.9.0"

package:
  name: cairosvg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/CairoSVG/cairosvg-${{ version }}.tar.gz
  sha256: 1debb00cd2da11350d8b6f5ceb739f1b539196d71d5cf5eb7363dbd1bfbc8dc5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cairocffi
    - cssselect2
    - defusedxml
    - pillow
    - tinycss2

tests:
  - python:
      imports:
        - cairosvg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://courtbouillon.org/cairosvg
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: A Simple SVG Converter based on Cairo
  description: |
    A Simple SVG Converter based on Cairo
  repository: https://github.com/Kozea/CairoSVG/
  documentation: https://cairosvg.org/documentation/

extra:
  recipe-maintainers:
    - johanneskoester
    - carlodri

#### CFE metadata AND comments
