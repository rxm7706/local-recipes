# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: helpers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/helpers/helpers-${{ version }}.tar.gz
  sha256: bdfe1641fdaa1be60de8d0a8e3d243e5273582969b1118e87895616f83acdf90

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - helpers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/infosmith/helpers
  license: MIT
  license_file: LICENSE
  summary: Improved developer experience, accumulated.
  description: |
    Improved developer experience, accumulated.

extra:
  recipe-maintainers:
    - rxm7706

