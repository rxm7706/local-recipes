# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.22.0"

package:
  name: rdt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rdt/rdt-${{ version }}.tar.gz
  sha256: 85f29aa98df8fcac3d5ec89d6b66d758b4e8994fa80579579cda63835fbeff2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - pandas <3,>=1.4.0
    - scipy >=1.7.3
    - scikit-learn >=1.0.2
    - faker !=37.11.0,>=17
    - python-dateutil >=2.9

tests:
  - python:
      imports:
        - rdt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rdt/
  license: BUSL-1.1
  license_file: LICENSE
  summary: Reversible Data Transforms
  description: |
    Reversible Data Transforms
  repository: https://github.com/sdv-dev/RDT/

extra:
  recipe-maintainers:
    - conda-forge/sdv

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rdt
  cfe-upstream-registry: pypi
  cfe-upstream-name: rdt
