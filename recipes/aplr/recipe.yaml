# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "10.25.0"

package:
  name: aplr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aplr/aplr-${{ version }}.tar.gz
  sha256: dccd44e3f9b4195db3c7f326e22419b064cb55bb2ad62306d8147fc4e1700e08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - pybind11 >=2.13.6
  run:
    - python >=${{ python_min }}
    - numpy >=1.11
    - pandas >=1.0.0

tests:
  - python:
      imports:
        - aplr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ottenbreit-data-science/aplr
  license: MIT
  license_file: LICENSE
  summary: Automatic Piecewise Linear Regression
  description: |
    Automatic Piecewise Linear Regression

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aplr
