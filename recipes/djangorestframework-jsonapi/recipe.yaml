# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.0.0"

package:
  name: djangorestframework-jsonapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework-jsonapi/djangorestframework_jsonapi-${{ version }}.tar.gz
  sha256: b0e0d2b31ad07cefae6475a267be82de48a563d26678c5c9da0b97221641c8ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - django-filter
    - python >=${{ python_min }}
    - inflection >=0.5.0
    - djangorestframework >=3.17
    - django >=5.2

tests:
  - python:
      imports:
        - rest_framework_json_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django-json-api/django-rest-framework-json-api
  license: BSD-2-Clause
  license_file: LICENSE
  summary: "A Django REST framework API adapter for the JSON:API spec."
  description: |
    A Django REST framework API adapter for the JSON:API spec.
  repository: https://github.com/django-json-api/django-rest-framework-json-api
  documentation: https://django-rest-framework-json-api.readthedocs.org/

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley

