{% set name = "djangorestframework-jsonapi" %}
{% set version = "9.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b0e0d2b31ad07cefae6475a267be82de48a563d26678c5c9da0b97221641c8ba

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - django-filter
    - python >={{ python_min }}
    - inflection >=0.5.0
    - djangorestframework >=3.17
    - django >=5.2

test:
  imports:
    - rest_framework_json_api
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/django-json-api/django-rest-framework-json-api
  summary: A Django REST framework API adapter for the JSON:API spec.
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
