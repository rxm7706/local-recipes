# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.0.1"

package:
  name: astropy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/astropy/astropy-${{ version }}.tar.gz
  sha256: 45ca31d5b91fa294cd590a4791a32db94de7f9c8a343155f4d5877baa82351da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
    - setuptools-scm >=8.0.0
    - cython >=3.0.0,<4
    - numpy >=2.0.0,<3
    - extension-helpers >=1.4,<2
    - pyerfa >=2.0.1.3
  run:
    - python >=${{ python_min }}
    - astropy-iers-data >=0.2026.6.22.1.23.34
    - numpy >=2.0
    - packaging >=25.0
    - pyerfa >=2.0.1.3
    - pyyaml >=6.0.0

tests:
  - python:
      imports:
        - astropy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.astropy.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Astronomy and astrophysics core library
  description: |
    Astronomy and astrophysics core library
  documentation: https://docs.astropy.org

extra:
  recipe-maintainers:
    - astrofrog
    - mwcraig
    - bsipocz
    - Cadair

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: astropy
