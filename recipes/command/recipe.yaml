# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: command
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/Command/Command-${{ version }}.tar.gz
  sha256: 825af5adb84df91a4130c3fd112df0b33fbbb8ae77b16c29d21c6eb655102bf0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - command
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/helgi/python-command
  license: MIT
  license_file: LICENSE
  summary: Command runner with debug capabilities
  description: |
    Command runner with debug capabilities

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: command
  cfe-upstream-registry: pypi
  cfe-upstream-name: Command
  cfe-purls:
    - pkg:conda/command@${{ version }}?channel=conda-forge
    - pkg:pypi/command@${{ version }}
  cfe-upstream-repo: http://github.com/helgi/python-command
  cfe-upstream-homepage: http://github.com/helgi/python-command
  cfe-import-names: [command]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:00:03Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T23:00:03Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
