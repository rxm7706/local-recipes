# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kedro-aim
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kedro_aim-${{ version }}.tar.gz
  sha256: 306d5ab2e7196e808acdc4697f9a42fce84f622b2dc996854a53883b295298b1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.11
    - kedro >=0.18.0
    - aim >=3.14.1,<4.0.0
    - pydantic >=1.10.2,<2.0.0

tests:
  - python:
      imports:
        - kedro_aim
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A plugin to integrate the mlops plattform aim into your kedro project
  license: MIT
  license_file: LICENSE
  homepage: https://kedro-aim.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
