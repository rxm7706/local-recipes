# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.18"

package:
  name: pykcs11
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyKCS11/pykcs11-${{ version }}.tar.gz
  sha256: 12fd878b369821d80c1be8a140c85e8a0fb1358fcaaba66ca66869213692f227

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - swig
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - PyKCS11
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LudovicRousseau/PyKCS11
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Full PKCS#11 wrapper for Python
  description: |
    A Full PKCS#11 wrapper for Python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pykcs11
