# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.52"

package:
  name: sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SQLAlchemy/sqlalchemy-${{ version }}.tar.gz
  sha256: 5e2d46356ac2ccb7d268ab6c2319ac6a2b42f1b8d5fd8bd3d46855cd82abee97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - cython >=0.29.24
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - greenlet >=1
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - lib.sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sqlalchemy.org
  license: MIT
  license_file: LICENSE
  summary: Database Abstraction Library
  description: |
    Database Abstraction Library
  documentation: https://docs.sqlalchemy.org

extra:
  recipe-maintainers:
    - xylar
    - ocefpaf
    - nehaljwani
    - igortg

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sqlalchemy
  cfe-upstream-registry: pypi
