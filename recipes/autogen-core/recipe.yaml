# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.5"

package:
  name: autogen-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autogen-core/autogen_core-${{ version }}.tar.gz
  sha256: 70c2871389f1d0a7f6db8ef78717a51b7ce877ff4a08a836b7758d604dece203

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - jsonref ~=1.1.0
    - opentelemetry-api >=1.34.1
    - pillow >=11.0.0
    - protobuf ~=5.29.3
    - pydantic <3.0.0,>=2.10.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - autogen_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/autogen-core/
  license: MIT
  license_file: LICENSE
  summary: Foundational interfaces and agent runtime implementation for AutoGen
  description: |
    Foundational interfaces and agent runtime implementation for AutoGen

extra:
  recipe-maintainers:
    - specter119
    - jan-janssen

#### CFE metadata AND comments
