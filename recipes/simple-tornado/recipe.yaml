# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: simple-tornado
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simple-tornado/simple_tornado-${{ version }}.tar.gz
  sha256: 388df9806cdb0f40529cc41e701f6d933985e15a385e968587ea61a7d111bdbb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tornado

tests:
  - python:
      imports:
        - simple_tornado
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/codeskyblue/simple_tornado
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

