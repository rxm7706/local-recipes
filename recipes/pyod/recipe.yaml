# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.5"

package:
  name: pyod
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyod/pyod-${{ version }}.tar.gz
  sha256: 1080a25452abda883b784ebea9f2976e549f1818cf1be2fc454daaf47545e431

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - joblib >=1.5
    - matplotlib-base
    - numpy >=1.19
    - numba >=0.51
    - scipy >=1.5.1
    - scikit-learn >=0.22.0

tests:
  - python:
      imports:
        - pyod
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yzhao062/pyod
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A Python library for anomaly detection across tabular, time series, graph, text, image, and audio data. 61 detectors, benchmark-backed ADEngine orchestration, and an agentic workflow for AI agents.
  description: |
    A Python library for anomaly detection across tabular, time series, graph, text, image, and audio data. 61 detectors, benchmark-backed ADEngine orchestration, and an agentic workflow for AI agents.
  repository: https://github.com/yzhao062/pyod
  documentation: https://pyod.readthedocs.io

extra:
  recipe-maintainers:
    - yzhao062
    - apcamargo

