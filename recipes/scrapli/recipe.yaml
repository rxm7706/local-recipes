# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.2.20"

package:
  name: scrapli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scrapli/scrapli-${{ version }}.tar.gz
  sha256: b6f8492110601c11ca8394d8540814464bb97681b87e92b30bb6853b5213558a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - scrapli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/carlmontanari/scrapli
  license: MIT
  license_file: LICENSE
  summary: Fast, flexible, sync/async, Python 3.7+ screen scraping client specifically for network devices
  description: |
    Fast, flexible, sync/async, Python 3.7+ screen scraping client specifically for network devices
  documentation: https://carlmontanari.github.io/scrapli/

extra:
  recipe-maintainers:
    - rxm7706

