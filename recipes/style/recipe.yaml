# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.6"

package:
  name: style
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/style/style-${{ version }}.tar.gz
  sha256: d0ad01f3688b83e7fcbb305123df26f7018adf41babe2c12e4b9a68d4e598eb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - style
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lmittmann/style
  license: MIT
  license_file: LICENSE
  summary: 🌈 Terminal string styling
  description: |
    🌈 Terminal string styling

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: style
  cfe-upstream-registry: pypi
  cfe-upstream-name: style
  cfe-purls:
    - pkg:conda/style@${{ version }}?channel=conda-forge
    - pkg:pypi/style@${{ version }}
  cfe-upstream-repo: https://github.com/lmittmann/style
  cfe-upstream-homepage: https://github.com/lmittmann/style
  cfe-import-names: [style]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
