# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: streamlit-datetime-picker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-datetime-picker/streamlit-datetime-picker-${{ version }}.tar.gz
  sha256: 1de3b8654e59401f0b159b2ae1f8330ca8e19a91dd7ef2dd97be5361be37ed0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_datetime_picker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/NathanChen198/streamlit-datetime-picker
  license: MIT
  license_file: LICENSE
  summary: Streamlit Date and Time Picker
  description: |
    Streamlit Date and Time Picker

extra:
  recipe-maintainers:
    - rxm7706

