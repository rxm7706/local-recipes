# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.6"

package:
  name: robinhood-aiokafka
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/robinhood-aiokafka/robinhood-aiokafka-${{ version }}.tar.gz
  sha256: efe6bdc0d6bb07945135799f34f436d2ec912774b096765daa189a66e2f89faa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - kafka-python

tests:
  - python:
      imports:
        - aiokafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://aiokafka.readthedocs.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Kafka integration with asyncio.
  description: |
    Kafka integration with asyncio.

extra:
  recipe-maintainers:
    - rxm7706

