# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: toolz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toolz/toolz-${{ version }}.tar.gz
  sha256: 27a5c770d068c110d9ed9323f24f1543e83b2f300a687b7891c1a6d56b697b5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-git-versioning >=2.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tlz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytoolz/toolz
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: List processing tools and functional utilities
  description: |
    List processing tools and functional utilities
  documentation: https://toolz.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - hendrikmakait
    - jrbourbeau
    - mrocklin
    - eriknw
    - jcrist
    - jakirkham
    - ocefpaf

#### CFE metadata AND comments
