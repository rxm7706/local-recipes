# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: toolz
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/toolz-${{ version }}.tar.gz
  sha256: 27a5c770d068c110d9ed9323f24f1543e83b2f300a687b7891c1a6d56b697b5b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=77
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tlz
        - toolz
        - toolz.curried
        - toolz.functoolz
        - toolz.sandbox
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -c "import toolz; assert toolz.__version__ != '0.0.0'"

about:
  summary: A functional standard library for Python
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://toolz.readthedocs.org/

extra:
  recipe-maintainers:
    - hendrikmakait
    - jrbourbeau
    - mrocklin
    - eriknw
    - jcrist
    - jakirkham
    - ocefpaf
