# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: decouple
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/decouple/decouple-${{ version }}.tar.gz
  sha256: c253c1cc62b76e9720a066f334552548c6de1884bc3bdf456ddb62d61b867b09

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - decouple
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/andrey-avdeev/decouple
  license: Apache-2.0
  license_file: LICENSE
  summary: Decoupling logic
  description: |
    Decoupling logic

extra:
  recipe-maintainers:
    - rxm7706

