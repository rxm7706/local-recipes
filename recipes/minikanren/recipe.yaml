    - pkg:pypi/minikanren@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/miniKanren/
  cfe-import-names: [kanren]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/minikanren-feedstock
  cfe-forge-recipe-updates-needed: 
