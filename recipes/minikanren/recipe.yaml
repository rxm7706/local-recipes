# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: minikanren
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/miniKanren/minikanren-${{ version }}.tar.gz
  sha256: c030e3e9a3fa5f372f84b66966776a8dc63b16b98768b78be0401982b892e00d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.0
  run:
    - python >=${{ python_min }}
    - cons >=0.4.0
    - etuples >=0.3.1
    - logical-unification >=0.4.1
    - multipledispatch
    - toolz
    - typing_extensions

tests:
  - python:
      imports:
        - kanren
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/miniKanren/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Relational programming in Python
  description: |
    Relational programming in Python

extra:
  recipe-maintainers:
    - maresb
    - brandonwillard

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: minikanren
  cfe-upstream-registry: pypi
  cfe-upstream-name: minikanren
