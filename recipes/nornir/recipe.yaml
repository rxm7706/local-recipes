# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.0"

package:
  name: nornir
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nornir/nornir-${{ version }}.tar.gz
  sha256: 829e52b37cbe6c0454fc81b73b010f148f107d81e22b81db4583b570cce6f0e7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.0,<0.12.0
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.17

tests:
  - python:
      imports:
        - nornir
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/nornir/
  license: Apache-2.0
  license_file: LICENSE
  summary: Pluggable multi-threaded framework with inventory management to help operate collections of devices
  description: |
    Pluggable multi-threaded framework with inventory management to help operate collections of devices
  repository: https://github.com/nornir-automation/nornir

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: nornir
