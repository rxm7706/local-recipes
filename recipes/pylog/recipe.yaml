# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: pylog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylog/pylog-${{ version }}.tar.gz
  sha256: a053aa2e8d885691dd3585a3e3192b24a03af6298f557ba4907213f27a1ef415

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RussAbbott/pylog
  license: MIT
  license_file: LICENSE
  summary: Python implementation of Prolog features.
  description: |
    Python implementation of Prolog features.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
