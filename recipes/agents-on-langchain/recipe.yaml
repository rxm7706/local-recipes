# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: agents-on-langchain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agents-on-langchain/agents_on_langchain-${{ version }}.tar.gz
  sha256: 09bd6e637631a56ed64096001361041ab98284359a2c970671ee45a9c1e6029b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - langchain-core >=0.3.31
    - pytorch >=2.4.1
    - typing_extensions >=4.0.0
    - numpy >=1.26.4

tests:
  - python:
      imports:
        - agents_on_langchain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/sinan-ozel/agents-on-langchain
  license: MIT
  license_file: LICENSE
  summary: A lightweight Python package for creating agents on Langchain for Agentic platforms
  description: |
    A lightweight Python package for creating agents on Langchain for Agentic platforms

extra:
  recipe-maintainers:
    - rxm7706

