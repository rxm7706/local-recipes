# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.13"

package:
  name: etl-jobs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/etl-jobs/etl_jobs-${{ version }}.tar.gz
  sha256: e594b64401345c149d704db1087805603a99f5a41508bf2cae5e15fca9ea9709

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - requests
    - polars
    - deltalake
    - pyspark

tests:
  - python:
      imports:
        - etl_jobs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/etl-jobs/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

