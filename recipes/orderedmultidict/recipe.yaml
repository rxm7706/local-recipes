# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: orderedmultidict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orderedmultidict/orderedmultidict-${{ version }}.tar.gz
  sha256: 16a7ae8432e02cc987d2d6d5af2df5938258f87c870675c73ee77a0920e6f4a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.8.0

tests:
  - python:
      imports:
        - orderedmultidict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gruns/orderedmultidict
  license: Unlicense
  license_file: LICENSE
  summary: Ordered Multivalue Dictionary
  description: |
    Ordered Multivalue Dictionary

extra:
  recipe-maintainers:
    - pmlandwehr
    - fhoehle

#### CFE metadata AND comments
