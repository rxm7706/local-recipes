# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: sphinxcontrib-serializinghtml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-serializinghtml/sphinxcontrib_serializinghtml-${{ version }}.tar.gz
  sha256: e9d912827f872c029017a53f0ef2180b327c3f7fd23c87229f7a8e8b70031d4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.7
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sphinxcontrib.serializinghtml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.sphinx-doc.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: sphinxcontrib-serializinghtml is a sphinx extension which outputs "serialized" HTML files (json and pickle)
  description: |
    sphinxcontrib-serializinghtml is a sphinx extension which outputs "serialized" HTML files (json and pickle)
  repository: https://github.com/sphinx-doc/sphinxcontrib-serializinghtml/

extra:
  recipe-maintainers:
    - AA-Turner
    - conda-forge/sphinx
    - ocefpaf

#### CFE metadata AND comments
