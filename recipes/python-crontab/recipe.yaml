# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-crontab
  version: "3.3.0"
  sha256: 007c8aee68dddf3e04ec4dce0fac124b93bd68be7470fc95d2a9617a15de291b

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil

tests:
  - python:
      imports:
        - crontab
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: LGPL-3.0-only
  license_file: COPYING
  summary: Crontab module for reading and writing crontab files and accessing the system cron automatically and simply using a direct API.
  homepage: https://github.com/doctormo/python-crontab

extra:
  recipe-maintainers:
    - scopatz
    - jan-janssen
