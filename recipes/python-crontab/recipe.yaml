# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: python-crontab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-crontab/python_crontab-${{ version }}.tar.gz
  sha256: 007c8aee68dddf3e04ec4dce0fac124b93bd68be7470fc95d2a9617a15de291b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_crontab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitlab.com/doctormo/python-crontab/
  license: LGPLv3
  license_file: LICENSE
  summary: Python Crontab API
  description: |
    Python Crontab API

extra:
  recipe-maintainers:
    - scopatz
    - jan-janssen

