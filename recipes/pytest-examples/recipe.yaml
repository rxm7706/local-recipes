# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.18"

package:
  name: pytest-examples
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-examples/pytest_examples-${{ version }}.tar.gz
  sha256: 9a464f007f805b113677a15e2f8942ebb92d7d3eb5312e9a405d018478ec9801

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - black >=23
    - pytest >=7
    - ruff >=0.5.0

tests:
  - python:
      imports:
        - pytest_examples
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-examples/
  license: MIT
  license_file: LICENSE
  summary: Pytest plugin for testing examples in docstrings and markdown files.
  description: |
    Pytest plugin for testing examples in docstrings and markdown files.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
