# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: flask-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-SQLAlchemy/flask_sqlalchemy-${{ version }}.tar.gz
  sha256: e4b68bb881802dda1a7d878b2fc84c06d1ee57fb40b874d3dc97dabfa36b8312

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask >=2.2.5
    - sqlalchemy >=2.0.16

tests:
  - python:
      imports:
        - flask_sqlalchemy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-SQLAlchemy/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Add SQLAlchemy support to your Flask application.
  description: |
    Add SQLAlchemy support to your Flask application.
  repository: https://github.com/pallets-eco/flask-sqlalchemy/
  documentation: https://flask-sqlalchemy.palletsprojects.com

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors

#### CFE metadata AND comments
