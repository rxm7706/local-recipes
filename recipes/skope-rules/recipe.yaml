    - pkg:conda/skope-rules@${{ version }}?channel=conda-forge
    - pkg:pypi/skope-rules@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/scikit-learn-contrib/skope-rules
  cfe-import-names: [skrules]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/skope-rules-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.0.1

  cfe-forge-blocker-list:
