# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: skope-rules
  version: ${{ version }}

source:
  url: https://github.com/scikit-learn-contrib/skope-rules/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 733a1ee9c4125fde221f0ccc9ec76f35408daf29a99878e271f357976974b295

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.10
    - numpy >=1.10.4
    - scikit-learn >=0.17.1,<1.0.0
    - scipy >=0.17.0
    - pandas >=0.18.1

tests:
  - python:
      imports:
        - skrules
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scikit-learn-contrib/skope-rules
  license: BSD-3-Clause AND MIT
  license_file:
    - license.txt
    - COPYING
  summary: Machine Learning with Interpretable Rules
  description: |
    Machine Learning with Interpretable Rules

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
