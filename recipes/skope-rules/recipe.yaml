# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: skope-rules
  version: ${{ version }}

source:
  url: https://github.com/scikit-learn-contrib/skope-rules/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 733a1ee9c4125fde221f0ccc9ec76f35408daf29a99878e271f357976974b295

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scikit-learn
    - scipy
    - pandas

tests:
  - python:
      imports:
        - skrules
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scikit-learn-contrib/skope-rules
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Machine Learning with Interpretable Rules
  description: |
    Machine Learning with Interpretable Rules

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: skope-rules
  cfe-upstream-registry: pypi
  cfe-upstream-name: skope-rules
