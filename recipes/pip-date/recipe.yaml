# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: pip-date
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pip-date/pip_date-1.0.5-py3-none-any.whl
  sha256: 9ed7192a5f475af8a7bd82ec2b3fa53ae0795908c0d850cdc23377e4f54ae3e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - lxml

tests:
  - python:
      imports:
        - pip_date
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/E3V3A/pip-date/
  license: LICENSE.txt
  license_file: LICENSE
  summary: Show the installation/modification times of all your pip packages and other tools
  description: |
    Show the installation/modification times of all your pip packages and other tools

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
