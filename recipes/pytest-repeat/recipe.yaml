# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.4"

package:
  name: pytest-repeat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-repeat/pytest_repeat-${{ version }}.tar.gz
  sha256: d92ac14dfaa6ffcfe6917e5d16f0c9bc82380c135b03c2a5f412d2637f224485

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pytest

tests:
  - python:
      imports:
        - pytest_repeat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-repeat
  license: MPL-2.0
  license_file: LICENSE
  summary: pytest plugin for repeating tests
  description: |
    pytest plugin for repeating tests

extra:
  recipe-maintainers:
    - hmaarrfk

