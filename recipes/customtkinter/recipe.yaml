# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: customtkinter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/customtkinter/customtkinter-${{ version }}.tar.gz
  sha256: c782df167bc64ab3fc3140286df06967ac2de4dcc97dd5958426fe9c1a98057b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - darkdetect
    - typing_extensions
    - packaging

tests:
  - python:
      imports:
        - customtkinter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://customtkinter.tomschimansky.com
  license: MIT
  license_file: LICENSE
  summary: Create modern looking GUIs with Python
  description: |
    Create modern looking GUIs with Python

extra:
  recipe-maintainers:
    - rxm7706

