# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-utils-six
  version: "2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django-utils-six-${{ version }}.tar.gz
  sha256: 4ef9d20de679a5b2448429476452493661fe08f23d6e788a8e9816ec05e3c5b0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0

tests:
  - python:
      imports:
        - django
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Forward compatibility django.utils.six for Django 3
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/whtsky/django-utils-six

extra:
  recipe-maintainers:
    - rxm7706

