# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.3"

package:
  name: sas7bdat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sas7bdat/sas7bdat-${{ version }}.tar.gz
  sha256: 484c609d962442203c15bc719a638de992a23cd13bc1971a5af6dfb0daf9f797

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - sas7bdat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/jaredhobbs/sas7bdat
  license: MIT
  license_file: LICENSE
  summary: A sas7bdat file reader for Python
  description: |
    A sas7bdat file reader for Python

extra:
  recipe-maintainers:
    - izahn

#### CFE metadata AND comments
