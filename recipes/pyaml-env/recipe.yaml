# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: pyaml-env
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyaml-env/pyaml_env-${{ version }}.tar.gz
  sha256: f83502516b6f1561ba7c2db9ced939a7a9933a66702d8071e98ad07da49a4bb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml <=7.0,>=5.0

tests:
  - python:
      imports:
        - pyaml_env
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mkaranasou/pyaml_env
  license: MIT
  license_file: LICENSE
  summary: Provides yaml file parsing with environment variable resolution
  description: |
    Provides yaml file parsing with environment variable resolution

extra:
  recipe-maintainers:
    - cburing
    - jan-janssen

#### CFE metadata AND comments
