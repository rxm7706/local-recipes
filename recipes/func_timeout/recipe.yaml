# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.5"

package:
  name: func-timeout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/func-timeout/func_timeout-${{ version }}.tar.gz
  sha256: 74cd3c428ec94f4edfba81f9b2f14904846d5ffccc27c92433b8b5939b5575dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - func_timeout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kata198/func_timeout
  license: LGPLv2
  license_file: LICENSE
  summary: Python module which allows you to specify timeouts when calling any existing function. Also provides support for stoppable-threads
  description: |
    Python module which allows you to specify timeouts when calling any existing function. Also provides support for stoppable-threads

extra:
  recipe-maintainers:
    - nehaljwani

