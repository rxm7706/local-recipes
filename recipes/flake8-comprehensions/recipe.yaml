# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.17.0"

package:
  name: flake8-comprehensions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flake8-comprehensions/flake8_comprehensions-${{ version }}.tar.gz
  sha256: bf4fa102b2bf4d6c9e999e29e4b2724cbadffb70b937600fc782161be4dc0f4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - flake8 !=3.2,>=3

tests:
  - python:
      imports:
        - flake8_comprehensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/flake8-comprehensions/
  license: MIT
  license_file: LICENSE
  summary: A flake8 plugin to help you write better list/set/dict comprehensions.
  description: |
    A flake8 plugin to help you write better list/set/dict comprehensions.
  repository: https://github.com/adamchainz/flake8-comprehensions

extra:
  recipe-maintainers:
    - dopplershift

