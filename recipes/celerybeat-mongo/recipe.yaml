# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.0"

package:
  name: celerybeat-mongo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/celerybeat-mongo/celerybeat-mongo-${{ version }}.tar.gz
  sha256: e65b2ec62da522b3d08987175e22c620b75c7c779d45bb15266da1925fda1f6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - celerybeatmongo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/celerybeat-mongo/
  license: Apache-2.0
  license_file: LICENSE
  summary: A Celery Beat Scheduler that uses MongoDB to store both schedule definitions and status information
  description: |
    A Celery Beat Scheduler that uses MongoDB to store both schedule definitions and status information

extra:
  recipe-maintainers:
    - rxm7706

