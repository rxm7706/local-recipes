# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: oracledb-mcp-server
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oracledb-mcp-server/oracledb_mcp_server-${{ version }}.tar.gz
  sha256: df5b7a174ba9e25ead703bc96a8cbb9cb52fc42bbf4ce18a9d1bfbc0cb8f04f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - mcp >=1.5.0
    - oracledb >=3.0.0
    - pandas >=2.2.3
    - python-dotenv >=1.0.1
    - sqlalchemy >=2.0.39

tests:
  - python:
      imports:
        - oracledb_mcp_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rahgadda/oracledb_mcp_server
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: MCP Server For Oracle Database
  description: |
    MCP Server For Oracle Database

extra:
  recipe-maintainers:
    - rxm7706

