# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: oslo.i18n
  version: "6.9.0"
  bundle: tar.gz
  hash: 574bcf21873b185068bcec951de1ec093158ffdff05a8055fd18ddcb69f69e65

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/oslo_i18n-${{ version }}.tar.gz
  sha256: ${{ hash }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.11.*
    - setuptools
    - pip
    - pbr !=2.1.0,>=2.0.0
  run:
    - python >=${{ python_min }}
    - pbr !=2.1.0,>=2.0.0

tests:
  - python:
      imports:
        - oslo_i18n
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE
  license: Apache-2.0
  summary: Utilities for working with internationalization (i18n) features, especially translation for text strings in an application or library.
  homepage: http://docs.openstack.org/developer/oslo.i18n/
  repository: http://git.openstack.org/cgit/openstack/oslo.i18n
  documentation: http://docs.openstack.org/developer/oslo.i18n/

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj
