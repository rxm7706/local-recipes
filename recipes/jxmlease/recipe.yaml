# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.3"

package:
  name: jxmlease
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jxmlease/jxmlease-${{ version }}.tar.gz
  sha256: 612c1575d8a87026dea096bb75acec7302dd69040fa23d9116e71e30d5e0839e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jxmlease
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Juniper/jxmlease
  license: MIT
  license_file: LICENSE
  summary: jxmlease converts between XML and intelligent Python data structures.
  description: |
    jxmlease converts between XML and intelligent Python data structures.

extra:
  recipe-maintainers:
    - rxm7706

