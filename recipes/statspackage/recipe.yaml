# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1"

package:
  name: statspackage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/statspackage/statspackage-${{ version }}.tar.gz
  sha256: 920575cc6cb9e027d53fd0be19a096b6f8c108cca65044d27804a468f18a8f2e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - statspackage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Vishalkanna2001/statistics-pyt
  license: MIT
  license_file: LICENSE
  summary: To find Mean,Median,Mode of the given numbers
  description: |
    To find Mean,Median,Mode of the given numbers

extra:
  recipe-maintainers:
    - rxm7706

