# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.10"

package:
  name: pydocx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyDocX/PyDocX-${{ version }}.tar.gz
  sha256: 07bd9bce7834f8a5e0b00130f29b54bbdda22d625711a591421913bdfa8470e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pydocx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/CenterForOpenScience/pydocx
  license: BSD-3-Clause
  license_file: LICENSE
  summary: docx (OOXML) to html converter
  description: |
    docx (OOXML) to html converter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydocx
  cfe-upstream-registry: pypi
  cfe-upstream-name: PyDocX
  cfe-purls:
