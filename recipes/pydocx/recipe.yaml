    - pkg:pypi/pydocx@${{ version }}
  cfe-upstream-repo: http://github.com/CenterForOpenScience/pydocx
  cfe-upstream-homepage: http://github.com/CenterForOpenScience/pydocx
  cfe-import-names: [pydocx]
