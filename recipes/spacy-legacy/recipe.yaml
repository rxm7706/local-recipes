# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.12"

package:
  name: spacy-legacy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spacy-legacy/spacy-legacy-${{ version }}.tar.gz
  sha256: b37d6e0c9b6e1d7ca1cf5bc7152ab64a4c4671f59c85adaf7a3fcb870357a774

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spacy_legacy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://spacy.io
  license: MIT
  license_file: LICENSE
  summary: Legacy registered functions for spaCy backwards compatibility
  description: |
    Legacy registered functions for spaCy backwards compatibility

extra:
  recipe-maintainers:
    - conda-forge/spacy

