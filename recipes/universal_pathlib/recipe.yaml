# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.10"

package:
  name: universal-pathlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/universal-pathlib/universal_pathlib-${{ version }}.tar.gz
  sha256: 4487cbc90730a48cfb64f811d99e14b6faed6d738420cd5f93f59f48e6930bfb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - fsspec >=2024.5.0
    - pathlib-abc <0.6.0,>=0.5.1

tests:
  - python:
      imports:
        - upath
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fsspec/universal_pathlib
  license: MIT
  license_file: LICENSE
  summary: pathlib api extended to use fsspec backends
  description: |
    pathlib api extended to use fsspec backends

extra:
  recipe-maintainers:
    - ap--
    - andrewfulton9

