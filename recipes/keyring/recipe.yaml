# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.7.0"

package:
  name: keyring
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/keyring/keyring-${{ version }}.tar.gz
  sha256: fe01bd85eb3f8fb3dd0405defdeac9a5b4f6f0439edbb3149577f244a2e8245b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.11.4
    - jaraco.classes
    - jaraco.functools
    - jaraco.context
    - if: win
      then:
        - pywin32-ctypes
    - if: linux
      then:
        - secretstorage
        - jeepney

tests:
  - python:
      imports:
        - keyring
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/keyring/
  license: MIT
  license_file: LICENSE
  summary: Store and access your passwords safely.
  description: |
    Store and access your passwords safely.
  repository: https://github.com/jaraco/keyring

extra:
  recipe-maintainers:
    - xylar
    - licode
    - tacaswell
    - ccordoba12

