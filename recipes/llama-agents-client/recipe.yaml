# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.11"

package:
  name: llama-agents-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-agents-client/llama_agents_client-${{ version }}.tar.gz
  sha256: b9ade0ddf72fdf4567e0c05b8c2d109c767a390d07cce06b0b40fdac326ba140

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.6,<0.10.0
  run:
    - python >=${{ python_min }}
    - httpx <1,>=0.28.1
    - llama-index-workflows <3.0.0,>=2.15.0

tests:
  - python:
      imports:
        - llama_agents.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-agents-client/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: HTTP client for connecting to and interacting with LlamaIndex workflow servers
  description: |
    HTTP client for connecting to and interacting with LlamaIndex workflow servers

extra:
  recipe-maintainers:
    - rxm7706

