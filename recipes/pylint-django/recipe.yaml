# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.0"

package:
  name: pylint-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint-django/pylint_django-${{ version }}.tar.gz
  sha256: 42accea9098e4a3298b4bfbae0e4da81f909f8bff0deda9485efbd6035a86d6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1
  run:
    - python >=${{ python_min }}
    - pylint <5,>=3.0
    - pylint-plugin-utils >=0.8

tests:
  - python:
      imports:
        - pylint_django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pylint-dev/pylint-django
  license: GPL-2.0
  license_file: LICENSE
  summary: A Pylint plugin to help Pylint understand the Django web framework
  description: |
    A Pylint plugin to help Pylint understand the Django web framework
  repository: https://github.com/pylint-dev/pylint-django

extra:
  recipe-maintainers:
    - anthchirp
    - rxm7706
    - jakirkham

#### CFE metadata AND comments
