# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "12.5.0"

package:
  name: path.py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/path.py/path.py-${{ version }}.tar.gz
  sha256: 8d885e8b2497aed005703d94e0fd97943401f035e42a136810308bff034529a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=34.4
    - wheel
    - setuptools-scm >=1.15
  run:
    - python >=${{ python_min }}
    - path

tests:
  - python:
      imports:
        - path.py
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jaraco/path
  license: MIT
  license_file: LICENSE
  summary: A module wrapper for os.path
  description: |
    A module wrapper for os.path

extra:
  recipe-maintainers:
    - jakirkham
    - nehaljwani

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: path.py
  cfe-upstream-registry: pypi
  cfe-upstream-name: path-py
  cfe-purls:
