# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: path.py
  version: "12.5.0"
  checksum: 8d885e8b2497aed005703d94e0fd97943401f035e42a136810308bff034529a8

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # path.py is a metapackage which depends on path, source is retained here
  # to allow to update bot to bump the version
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ checksum }}

build:
  number: 0
  noarch: true

requirements:
  run:
    - python >=3.5
    - path

tests:
  - python:
      imports:
        - path
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: A module wrapper for os.path
  description: |
    path.py implements a path objects as first-class entities, allowing common
    operations on files to be invoked on those path objects directly.
  homepage: https://github.com/jaraco/path.py
  repository: https://github.com/jaraco/path.py
  documentation: https://pathpy.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - jakirkham
    - nehaljwani
