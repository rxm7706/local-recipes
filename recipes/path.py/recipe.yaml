    - pkg:pypi/path-py@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/jaraco/path
  cfe-import-names: [path.py]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/path.py-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-12.5.0

  cfe-forge-blocker-list: []
