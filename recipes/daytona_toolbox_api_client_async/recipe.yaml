# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.204.0"

package:
  name: daytona_toolbox_api_client_async
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/daytona_toolbox_api_client_async/daytona_toolbox_api_client_async-${{ version }}.tar.gz
  sha256: 67813d0accc9de5659994f153a0c7448cac4c8c304e60126253117231b2dc805

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.9.0.post0
    - aiohttp >=3.14.3
    - aiohttp-retry >=2.9.1
    - pydantic >=2.13.4
    - typing_extensions >=4.16.0

tests:
  - python:
      imports:
        - daytona_toolbox_api_client_async
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/daytona_toolbox_api_client_async/
  license: Apache-2.0
  license_file: LICENSE
  summary: Daytona Toolbox API
  description: |
    Daytona Toolbox API
  repository: https://github.com/daytona/clients

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
