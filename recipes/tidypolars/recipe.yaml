# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: tidypolars
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tidypolars/tidypolars-${{ version }}.tar.gz
  sha256: 009cb92d3211fb20a375adbfcf043703b04411aa22c05351addd13addff84f67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - numpy >=1.16.0
    - polars >=1.0.0

tests:
  - python:
      imports:
        - tidypolars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tidypolars/
  license: MIT
  license_file: LICENSE
  summary: Tidy interface to polars
  description: |
    Tidy interface to polars

extra:
  recipe-maintainers:
    - markfairbanks
    - nsandau

