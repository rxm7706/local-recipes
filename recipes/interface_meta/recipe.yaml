# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: interface_meta
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8a4493f8bdb73fb9655dcd5115bc897e207319e36c8835f39c516a2d7e9d79a1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - poetry
    - poetry-dynamic-versioning
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - interface_meta
        - interface_meta.utils
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: "`interface_meta` provides a convenient way to expose an extensible API with enforced method signatures and consistent documentation."
  homepage: https://github.com/matthewwardrop/interface_meta
  repository: https://github.com/matthewwardrop/interface_meta
  documentation: https://github.com/matthewwardrop/interface_meta

extra:
  recipe-maintainers:
    - matthewwardrop
