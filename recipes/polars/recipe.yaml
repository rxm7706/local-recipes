# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.43.2"

package:
  name: polars
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/polars/polars-${{ version }}.tar.gz
  sha256: c699671b99eb71ff53334d237917aaa3db5ad4dda480abcb6c80e0eaee7b677b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=${{ python_min }}
    - polars-runtime-32 ==1.43.2

tests:
  - python:
      imports:
        - polars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.pola.rs/
  license: MIT
  license_file: LICENSE
  summary: Blazingly fast DataFrame library
  description: |
    Blazingly fast DataFrame library
  repository: https://github.com/pola-rs/polars
  documentation: https://docs.pola.rs/api/python/stable/reference/index.html

extra:
  recipe-maintainers:
    - borchero
    - Maxyme
    - timkpaine
    - ritchie46
    - sugatoray
    - xhochy
    - dhirschfeld
    - pavelzw
    - 0xbe7a

