# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: pdpbox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PDPbox/PDPbox-${{ version }}.tar.gz
  sha256: 86931543e0032803ba38ea4d7486146fa8d715451e40c90ec874b2d2ebb707fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - joblib
    - matplotlib-base
    - numpy
    - pandas
    - plotly
    - pqdm
    - psutil
    - pytest
    - scikit-learn
    - setuptools
    - sphinx
    - sphinx-rtd-theme
    - tqdm
    - numpydoc
    - xgboost

tests:
  - python:
      imports:
        - pdpbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/SauceCat/PDPbox
  license: MIT
  license_file: LICENSE.txt
  summary: Python partial dependence plot toolbox
  description: |
    Python partial dependence plot toolbox

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pdpbox
