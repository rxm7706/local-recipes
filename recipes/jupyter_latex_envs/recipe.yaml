# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.6"

package:
  name: jupyter_latex_envs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter_latex_envs/jupyter_latex_envs-${{ version }}.tar.gz
  sha256: 070a31eb2dc488bba983915879a7c2939247bf5c3b669b398bdb36a9b5343872

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - nbconvert
    - IPython

tests:
  - python:
      imports:
        - latex_envs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jfbercher/jupyter_latex_envs
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Jupyter notebook extension which supports (some) LaTeX environments within markdown cells. Also provides support for labels and crossreferences, document wide numbering, bibliography, and more...
  description: |
    Jupyter notebook extension which supports (some) LaTeX environments within markdown cells. Also provides support for labels and crossreferences, document wide numbering, bibliography, and more...

extra:
  recipe-maintainers:
    - jcb91
    - jfbercher
    - xhochy

