# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.1"

package:
  name: zope.component
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.component/zope_component-${{ version }}.tar.gz
  sha256: 1b3e06647a8bd3c071c6bc9b80d708ded120bce981185c2db5647fd9a0d5279d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
    - wheel
  run:
    - python >=${{ python_min }}
    - zope.event
    - zope.hookable >=4.2.0
    - zope.interface >=5.3

tests:
  - python:
      imports:
        - zope.component
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/zope.component/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Component Architecture
  description: |
    Zope Component Architecture
  repository: https://github.com/zopefoundation/zope.component
  documentation: https://zopecomponent.readthedocs.io/

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
