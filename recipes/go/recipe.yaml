# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: go
  version: "1.26.6"

recipe:
  name: ${{ name }}-${{ go_variant_str }}-split
  version: ${{ version }}

source:
  - url: https://dl.google.com/${{ name }}/go${{ version }}.src.tar.gz
    sha256: a0721c54c688901448d77ad9b3ec7ea7c474730755ff891382e92ecb93ff2cb1
    target_directory: go
    patches:
      # Please see patches/README.md for more details
      - patches/0001-Fix-cgo_fortran-test-setup-for-conda.patch
      - patches/0002-Add-CC-C-CPP-LD-FLAGS-to-script_test-extraEnvKeys.patch
      - patches/0003-Inherit-CGO_-environment-variables.patch
      - patches/0004-Add-conda-aware-default-values-for-GOPATH-and-GOBIN.patch
      - patches/0005-cmd-link-internal-ld-disable-testWindowsBuildmodeCSh.patch
      - patches/0006-Revert-cmd-link-enable-internal-linker-in-more-cases.patch
      - patches/0007-Mark-ftree-as-a-safe-compiler-flag.patch
      - patches/0008-Mark-merge-constants-as-a-safe-compiler-flag.patch
  # Update this with a release from https://go.dev/dl/
  - url: ${{ 'https://go.dev/dl/go${{ version }}.darwin-arm64.tar.gz' if build_platform == "osx-arm64" else 'https://go.dev/dl/go${{ version }}.darwin-amd64.tar.gz' if build_platform == "osx-64" else 'https://go.dev/dl/go${{ version }}.windows-amd64.zip' if build_platform == "win-64" else 'https://go.dev/dl/go${{ version }}.linux-arm64.tar.gz' if build_platform == "linux-aarch64" else 'https://go.dev/dl/go${{ version }}.linux-amd64.tar.gz' if build_platform == "linux-64" else '' }}
    sha256: ${{ '2dc95ce4675829f2df0e86b28bcef3283635902062a5f0580ca659bf570f3204' if build_platform == "osx-arm64" else '08b65a63f244115121ced6c3b55ad38d801a7442acad5c949a17aad84ae6d684' if build_platform == "osx-64" else '5b6c5b556525810463b5c897b50dc7a82d6a3dc0bfaf55d990a7e9f31d6b2318' if build_platform == "win-64" else 'd0507e9e9d7fe012aae570108cbd76c15de879e17130ab8cb90d4d7445cb1f2e' if build_platform == "linux-aarch64" else '708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89' if build_platform == "linux-64" else '' }}
    target_directory: go-bootstrap

build:
  number: 0
  skip: linux and s390x

outputs:
  - package:
      name: go-${{ go_variant_str }}
    build:
      # test data links to these DSOs
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
        missing_dso_allowlist:
          - if: linux and not cgo
            then: $RPATH/libc.so.6
          - if: osx
            then: /usr/lib/libSystem.B.dylib
          - if: win
            then: $SYSROOT\System32\winmm.dll
      force_ignore_keys:  # [win]
        - if: win
          then: c_compiler
        - if: win
          then: cxx_compiler
        - if: win
          then: fortran_compiler
    requirements:
      run:
        - ${{ pin_subpackage(name, exact=true) }}
        - if: unix and cgo
          then: ${{ compiler('c') }}
        - if: win and cgo
          then: ${{ compiler('m2w64_c') }}
    tests:
      - script:
          - go help
  - package:
      name: go
    build:
      prefix_detection:
        ignore_binary_files: true
      dynamic_linking:
        binary_relocation: false
      script:
        file: ${{ go_variant_str }}/build. if unix else go_variant_str }}/build.b if win else '' }}
    requirements:
      build:
        - if: unix and cgo
          then: ${{ compiler('c') }}
        - if: unix and cgo
          then: ${{ stdlib("c") }}
        - if: unix and cgo
          then: ${{ compiler('cxx') }}
        - if: unix and cgo
          then: ${{ compiler('fortran') }}
        - if: win and cgo
          then: ${{ compiler('m2w64_c') }}
        - if: win and cgo
          then: ${{ stdlib("m2w64_c") }}
        - if: win and cgo
          then: ${{ compiler('m2w64_cxx') }}
        - if: win and cgo
          then: ${{ compiler('m2w64_fortran') }}
      run:
        - _go_select ==${{ go_variant_ver }}=${{ go_variant_str }}
      run_exports:
        - strong:
            - if: linux and cgo
              then: __glibc >=${{ c_stdlib_version }}
            - if: osx and cgo
              then: __osx >=12
      run_constraints:
        - if: unix and cgo
          then: ${{ pin_compatible(compiler('c')) }}
        - if: unix and cgo
          then: ${{ pin_compatible(compiler('cxx')) }}
        - if: unix and cgo
          then: ${{ pin_compatible(compiler('fortran')) }}
        - if: win and cgo
          then: ${{ pin_compatible(compiler('m2w64_c')) }}
        - if: win and cgo
          then: ${{ pin_compatible(compiler('m2w64_cxx')) }}
        - if: win and cgo
          then: ${{ pin_compatible(compiler('m2w64_fortran')) }}
    tests:
      - files:
          recipe:
            - ${{ go_variant_str }}
        requirements:
          run:
            - if: unix and cgo
              then: ${{ compiler('c') }}
            - if: win and cgo
              then: ${{ compiler('m2w64_c') }}
            - if: unix
              then: git
            - if: osx
              then: binutils
            - perl
        script:
          - if: unix
            then: chmod +x ${{ go_variant_str }}/test.sh
          - if: unix
            then: ./${{ go_variant_str }}/test.sh
          - if: win
            then: ${{ go_variant_str }}/test.bat
          - if: unix
            then: test "$GOTOOLCHAIN" = "local"
          - if: win
            then: if not "%GOTOOLCHAIN%"=="local" exit /b 1
    about:
      license: BSD-3-Clause
      license_file: go/LICENSE
      summary: The Go Programming Language
      homepage: https://go.dev/

about:
  license: BSD-3-Clause
  license_file: go/LICENSE
  summary: The Go Programming Language (${{ go_variant_str }})
  description: |
    Go is expressive, concise, clean, and efficient. Its concurrency mechanisms
    make it easy to write programs that get the most out of multicore and
    networked machines, while its novel type system enables flexible and
    modular program construction. Go compiles quickly to machine code yet has
    the convenience of garbage collection and the power of run-time reflection.
    It's a fast, statically typed, compiled language that feels like a
    dynamically typed, interpreted language.
  homepage: https://go.dev/
  repository: https://github.com/golang/
  documentation: https://go.dev/doc

extra:
  feedstock-name: go
  recipe-maintainers:
    - pavelzw
    - nehaljwani
    - scopatz
    - sodre
    - stuarteberg
    - xhochy
    - hmaarrfk
