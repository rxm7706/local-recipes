# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: cobol-copybook-to-json
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cobol-copybook-to-json/cobol_copybook_to_json-${{ version }}.tar.gz
  sha256: 636bf021fdf46b08080c6910874c36b2d085fbed5a2fa05cf211432d7b7921a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cobol_copybook_to_json
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arunkumars-mf/cobol-copybook-to-json
  license: MIT
  license_file: LICENSE
  summary: Convert COBOL copybooks to JSON schema format
  description: |
    Convert COBOL copybooks to JSON schema format
  repository: https://github.com/arunkumars-mf/cobol-copybook-to-json

extra:
  recipe-maintainers:
    - rxm7706

