# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.6"

package:
  name: pyinstaller-hooks-contrib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyinstaller-hooks-contrib/pyinstaller_hooks_contrib-${{ version }}.tar.gz
  sha256: bef5002c32f4f50bd55b005da12cff64eca8783e7eaf86a06a62410164bab725

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - importlib-metadata >=4.6
    - packaging >=22.0

tests:
  - python:
      imports:
        - _pyinstaller_hooks_contrib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyinstaller/pyinstaller-hooks-contrib
  license: Apache-2.0
  license_file: LICENSE
  summary: Community maintained hooks for PyInstaller
  description: |
    Community maintained hooks for PyInstaller

extra:
  recipe-maintainers:
    - soapy1
    - nehaljwani

