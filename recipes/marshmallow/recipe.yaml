# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.1"

package:
  name: marshmallow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/marshmallow/marshmallow-${{ version }}.tar.gz
  sha256: fb6b8048af08d4ab061610d5b7d3696a7e4c95337dbda880edb9f95812cabc20

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12,<4
  run:
    - python >=${{ python_min }}
    - backports-datetime-fromisoformat
    - typing_extensions

tests:
  - python:
      imports:
        - marshmallow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/marshmallow/
  license: MIT
  license_file: LICENSE
  summary: A lightweight library for converting complex datatypes to and from native Python datatypes.
  description: |
    A lightweight library for converting complex datatypes to and from native Python datatypes.
  repository: https://github.com/marshmallow-code/marshmallow

extra:
  recipe-maintainers:
    - hajapy
    - rth
    - frol
    - carlodri
    - mariusvniekerk
    - xylar

