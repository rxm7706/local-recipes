# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.3"

package:
  name: fillpdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fillpdf/fillpdf-${{ version }}.tar.gz
  sha256: 0cb6ff80f27930a62ac4537df0b888a86d2a9b350b85b08f6037df54b4e2e6aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pdfrw2
    - pdf2image
    - pillow
    - pymupdf

tests:
  - python:
      imports:
        - fillpdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/t-houssian/fillpdf
  license: MIT
  license_file: LICENSE
  summary: A Library to fill and flatten pdfs
  description: |
    A Library to fill and flatten pdfs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fillpdf
  cfe-upstream-registry: pypi
  cfe-upstream-name: fillpdf
