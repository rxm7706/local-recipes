# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pytest-doctestplus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-doctestplus/pytest_doctestplus-${{ version }}.tar.gz
  sha256: 64ae16dbda66c3db775ef596828d8d7adda09c6f34dd85099c119e4ff8cfe5b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=30.3.0
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=7.0
    - packaging >=17.0

tests:
  - python:
      imports:
        - pytest_doctestplus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scientific-python/pytest-doctestplus
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pytest plugin with advanced doctest features.
  description: |
    Pytest plugin with advanced doctest features.

extra:
  recipe-maintainers:
    - anthchirp
    - astrofrog
    - bsipocz
    - pllim
    - mwcraig

#### CFE metadata AND comments
