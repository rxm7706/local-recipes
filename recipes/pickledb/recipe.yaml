# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6"

package:
  name: pickledb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pickledb/pickledb-${{ version }}.tar.gz
  sha256: 0a1311e932d92fb66ce6eeb7f6a9af56852dffa2054b6021ba3563402d5219e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.9,<4
  run:
    - python >=${{ python_min }}
    - orjson
    - aiofiles

tests:
  - python:
      imports:
        - pickledb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://patx.github.io/pickledb
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An in-memory key-value store using orjson.
  description: |
    An in-memory key-value store using orjson.
  repository: https://github.com/patx/pickledb

extra:
  recipe-maintainers:
    - xhochy

#### CFE metadata AND comments
