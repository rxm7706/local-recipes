# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.0"

package:
  name: pydocstyle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydocstyle/pydocstyle-${{ version }}.tar.gz
  sha256: 7ce43f0c0ac87b07494eb9c0b462c0b73e6ff276807f204d6b53edc72b7e44e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - snowballstemmer
    - importlib-metadata

tests:
  - python:
      imports:
        - pydocstyle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.pydocstyle.org/en/stable/
  license: MIT
  license_file: LICENSE
  summary: Python docstring style checker
  description: |
    Python docstring style checker
  repository: https://github.com/PyCQA/pydocstyle
  documentation: https://www.pydocstyle.org/en/stable/

extra:
  recipe-maintainers:
    - goanpeca
    - jakirkham
    - Nurdok
    - dopplershift

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pydocstyle
  cfe-upstream-registry: pypi
  cfe-upstream-name: pydocstyle
  cfe-purls:
    - pkg:conda/pydocstyle@${{ version }}?channel=conda-forge
    - pkg:pypi/pydocstyle@${{ version }}
  cfe-upstream-repo: https://github.com/PyCQA/pydocstyle
  cfe-upstream-homepage: https://www.pydocstyle.org/en/stable/
  cfe-import-names: [pydocstyle]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pydocstyle-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-6.3.0

  cfe-forge-blocker-list:
