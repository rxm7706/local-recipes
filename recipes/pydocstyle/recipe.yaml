# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pydocstyle
  version: "6.3.0"
  hash: 7ce43f0c0ac87b07494eb9c0b462c0b73e6ff276807f204d6b53edc72b7e44e1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ hash }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - pydocstyle = pydocstyle.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - poetry-core
  run:
    - python >=${{ python_min }}
    - snowballstemmer >=2.2.0
    - tomli >=1.2.3

tests:
  - python:
      imports:
        - pydocstyle
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - pydocstyle --version

about:
  license: MIT
  license_file: LICENSE-MIT
  summary: Python docstring style checker (formerly pep257)
  description: |
    pydocstyle is a static analysis tool for checking compliance with Python
    docstring conventions. pydocstyle supports most of PEP 257 out of the box,
    but it should not be considered a reference implementation.
    The framework for checking docstring style is flexible, and custom checks
    can be easily added, for example to cover NumPy docstring conventions.
    pydocstyle supports Python 3.4, 3.5, 3.6, and 3.7.
  homepage: https://github.com/PyCQA/pydocstyle
  repository: https://github.com/PyCQA/pydocstyle
  documentation: http://pydocstyle.readthedocs.org

extra:
  recipe-maintainers:
    - goanpeca
    - jakirkham
    - Nurdok
    - dopplershift
