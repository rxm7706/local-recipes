# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: PyMetis
  version: "2025.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: 79c6d56c30c6f3df7cc755617cbadcfc252a175ce4e5a59982edad0f1ab71c99

build:
  number: 0
  skip: match(python, "<3.10")
  script:
    # Need to pass MESON_ARGS to make sure meson finds the correct executables for cross-compilation.
    - if: unix
      then: $PYTHON -m build -w -n -x -Csetup-args=${MESON_ARGS// / -Csetup-args=} -Csetup-args="-Duse-shipped-metis=false"
    - if: unix
      then: $PYTHON -m pip install dist/pymetis*.whl
    - if: win
      then: python -m pip install . -vv -Csetup-args="-Duse-shipped-metis=false"

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: pybind11
    - if: build_platform != target_platform
      then: ninja
    - if: build_platform != target_platform
      then: meson-python
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: build_platform != target_platform
      then: metis
  host:
    - python
    - python-build
    - pip
    - pybind11
    - meson-python
    - metis
  run:
    - typing_extensions >=4.5
    - python
    - metis

tests:
  - python:
      imports:
        - pymetis
      pip_check: true
  - files:
      source:
        - test
    requirements:
      run:
        - pip
        - pytest
        - numpy
        - metis
        - if: unix and x86_64
          then: meshpy
    script:
      - if: unix and build_platform == target_platform
        then: cd test && python -m pytest

about:
  summary: A Graph Partitioning Package
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/inducer/pymetis

extra:
  recipe-maintainers:
    - inducer
