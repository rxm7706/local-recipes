# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.0"

package:
  name: mode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mode/mode-${{ version }}.tar.gz
  sha256: 2a73f1b8034f922d31b3827016cbddf3b64d01815eed9d6c31377ef82a11d9a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorlog
    - mypy_extensions
    - aiocontextvars
    - typing_extensions

tests:
  - python:
      imports:
        - t
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ask/mode
  license: BSD-3-Clause
  license_file: LICENSE
  summary: AsyncIO Service-based programming.
  description: |
    AsyncIO Service-based programming.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mode
  cfe-upstream-registry: pypi
  cfe-upstream-name: mode
  cfe-purls:
    - pkg:conda/mode@${{ version }}?channel=conda-forge
    - pkg:pypi/mode@${{ version }}
  cfe-upstream-repo: https://github.com/ask/mode
  cfe-upstream-homepage: https://github.com/ask/mode
  cfe-import-names: [t]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:40:12Z
