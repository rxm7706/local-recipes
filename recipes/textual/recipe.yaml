# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.2.8"

package:
  name: textual
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/textual/textual-${{ version }}.tar.gz
  sha256: 3f106a9fbc73e39dd266c9712432087de78a6d644084c7c241d6a25c3169115b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.2.0
  run:
    - python >=${{ python_min }}
    - markdown-it-py >=2.1.0
    - mdit-py-plugins
    - platformdirs <5,>=3.6.0
    - pygments <3.0.0,>=2.19.2
    - rich >=14.2.0
    - typing_extensions <5.0.0,>=4.4.0

tests:
  - python:
      imports:
        - textual
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Textualize/textual
  license: MIT
  license_file: LICENSE
  summary: Modern Text User Interface framework
  description: |
    Modern Text User Interface framework
  repository: https://github.com/Textualize/textual
  documentation: https://textual.textualize.io/

extra:
  recipe-maintainers:
    - davidbrochart
    - carlodri
    - xhochy

#### CFE metadata AND comments
# CFE metadata
