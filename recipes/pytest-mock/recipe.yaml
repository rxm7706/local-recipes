# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.15.1"

package:
  name: pytest-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-mock/pytest_mock-${{ version }}.tar.gz
  sha256: 1849a238f6f396da19762269de72cb1814ab44416fa73a8686deac10b0d87a0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=6.2.5

tests:
  - python:
      imports:
        - pytest_mock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-mock/
  license: MIT
  license_file: LICENSE
  summary: Thin-wrapper around the mock package for easier use with pytest
  description: |
    Thin-wrapper around the mock package for easier use with pytest
  repository: https://github.com/pytest-dev/pytest-mock/
  documentation: https://pytest-mock.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nicoddemus

#### CFE metadata AND comments
