# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.41.3"

package:
  name: agent-starter-pack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agent-starter-pack/agent_starter_pack-${{ version }}.tar.gz
  sha256: bf5affe1a915ad2ea156f03ea657d6f860b8b948f43532a8a18171f092d90c3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - backoff >=2.2.1
    - click >=8.1.7
    - cookiecutter <3.0.0,>=2.6.0
    - google-cloud-aiplatform >=1.120.0
    - pyyaml >=6.0.1
    - requests >=2.31.0
    - rich >=13.7.0
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - agent_starter_pack.cli.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/agent-starter-pack/
  license: Apache-2.0
  license_file: LICENSE
  summary: CLI to bootstrap production-ready Google Cloud GenAI agent projects from templates.
  description: |
    CLI to bootstrap production-ready Google Cloud GenAI agent projects from templates.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
