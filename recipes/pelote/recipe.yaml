# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"

package:
  name: pelote
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pelote/pelote-${{ version }}.tar.gz
  sha256: 45b9d0aafaf3a45b33bcb764ec52c9cf166f4647b8d5bb4d11100d55dec4fd1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ebbe <2,>=1.9.0
    - pyllist
    - networkx <3,>=2

tests:
  - python:
      imports:
        - pelote
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/medialab/pelote
  license: MIT
  license_file: LICENSE
  summary: Collection of network-related utilities for python.
  description: |
    Collection of network-related utilities for python.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pelote
