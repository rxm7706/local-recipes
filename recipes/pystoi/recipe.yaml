# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pystoi
  version: "0.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/pystoi-${{ version }}.tar.gz
  sha256: 1c6f50d6fbfee46b00c922458cdbd27228d9830ca81cea788fd600fc2f7de6e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - numpy
    - scipy

tests:
  - python:
      imports:
        - pystoi
      pip_check: true

about:
  summary: Computes Short Term Objective Intelligibility measure
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mpariente/pystoi

extra:
  recipe-maintainers:
    - tyrius02
