# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.1"

package:
  name: asgi-correlation-id
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asgi-correlation-id/asgi_correlation_id-${{ version }}.tar.gz
  sha256: ad54374a300f000b8bef3b39738768842394de0a3c528a6f77ef3ca053eb89a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.7.2,<0.8
  run:
    - python >=${{ python_min }}
    - starlette >=0.18

tests:
  - python:
      imports:
        - asgi_correlation_id
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/snok/asgi-correlation-id
  license: MIT
  license_file: LICENSE
  summary: Middleware correlating project logs to individual requests
  description: |
    Middleware correlating project logs to individual requests
  repository: https://github.com/snok/asgi-correlation-id

extra:
  recipe-maintainers:
    - sondrelg
    - ludaavics
    - soapy1

