# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"
  python_min: "3.11"

package:
  name: pydata-sphinx-theme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydata-sphinx-theme/pydata_sphinx_theme-${{ version }}.tar.gz
  sha256: 0da172d41e19a66de875f4002f7054b385372ec65763852193791e658d50bb4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - sphinx-theme-builder >=0.3.2
  run:
    - python >=${{ python_min }}
    - sphinx <10,>=8.2
    - beautifulsoup4
    - docutils !=0.17.0
    - babel
    - pygments >=2.7
    - accessible-pygments
    - jinja2
    - requests

tests:
  - python:
      imports:
        - pydata_sphinx_theme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pydata-sphinx-theme/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Bootstrap-based Sphinx theme from the PyData community
  description: |
    Bootstrap-based Sphinx theme from the PyData community
  repository: https://github.com/pydata/pydata-sphinx-theme

extra:
  recipe-maintainers:
    - jorisvandenbossche
    - bollwyvl
    - Yann-P
    - Carreau

