# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: lerc
  version: ${{ version }}

source:
  # CMakeLists.txt taken from master, and adapted for better compatibility
  # PR made: https://github.com/Esri/lerc/pull/128
  url: https://github.com/Esri/lerc/archive/v${{ version }}.tar.gz
  sha256: a1fb593ed1fcb5b38800caf3c4454f872745202e961d00d745e53d81447e17c9

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make
    - if: win
      then: ninja
  #host:
  # TODO: add support for
  # gdal
  # geotiff
  run_exports:
    - ${{ pin_subpackage('lerc', upper_bound='x') }}

tests:
  - script:
      - if: win
        then: if not exist %LIBRARY_INC%\Lerc_types.h exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\Lerc.dll exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\Lerc.lib exit 1
      - if: unix
        then: test -f ${PREFIX}/lib/libLerc${SHLIB_EXT}
      - if: unix
        then: test -f ${PREFIX}/include/Lerc_types.h

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: LERC - Limited Error Raster Compression
  description: |
    LERC is an open-source image or raster format which
    supports rapid encoding and decoding for any pixel type
    (not just RGB or Byte). Users set the maximum compression
    error per pixel while encoding, so the precision of the
    original input image is preserved (within user defined
    error bounds).


  homepage: https://github.com/Esri/lerc

extra:
  recipe-maintainers:
    - hmaarrfk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: lerc
  cfe-upstream-registry: github
  cfe-upstream-name: Esri/lerc
  cfe-purls:
    - pkg:conda/lerc@${{ version }}?channel=conda-forge
    - pkg:github/esri/lerc@v${{ version }}
  cfe-upstream-repo: https://github.com/Esri/lerc
  cfe-upstream-homepage: https://github.com/Esri/lerc
  cfe-import-names: []
  cfe-source-kind: github-tag
  cfe-noarch: compiled
  cfe-pip-check: false:not-a-python-package
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/lerc-feedstock
  cfe-forge-recipe-updates-needed: [meta-yaml-to-recipe-yaml]
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-10-09T09:52:00Z
