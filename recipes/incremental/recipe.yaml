# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "24.11.0"

package:
  name: incremental
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/Incremental/incremental-${{ version }}.tar.gz
  sha256: 87d3480dbb083c1d736222511a8cf380012a8176c2456d01ef483242abbbcf8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - incremental
  run:
    - python >=${{ python_min }}
    - incremental
    - packaging >=17.0
    - tomli

tests:
  - python:
      imports:
        - incremental
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/twisted/incremental
  license: MIT
  license_file: LICENSE
  summary: A CalVer version manager that supports the future.
  description: |
    A CalVer version manager that supports the future.
  documentation: https://twisted.org/incremental/docs/

extra:
  recipe-maintainers:
    - isuruf
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: incremental
  cfe-upstream-registry: pypi
  cfe-upstream-name: incremental
  cfe-purls:
    - pkg:conda/incremental@${{ version }}?channel=conda-forge
    - pkg:pypi/incremental@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/twisted/incremental
  cfe-import-names: [incremental]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/incremental-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T23:53:01Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T23:53:01Z
  cfe-local-build-status: build-clean-test-blocked
  cfe-local-build-datetime: 2026-08-17T23:53:01Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
