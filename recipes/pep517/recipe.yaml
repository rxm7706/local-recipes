# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"

package:
  name: pep517
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pep517/pep517-${{ version }}.tar.gz
  sha256: 1b2fa2ffd3938bb4beffe5d6146cbcb2bda996a5a4da9f31abffd8b24e07b317

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}
    - tomli >=1.1.0
    - importlib-metadata
    - zipp

tests:
  - python:
      imports:
        - pep517
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/pep517
  license: MIT
  license_file: LICENSE
  summary: Wrappers to build Python packages using PEP 517 hooks
  description: |
    Wrappers to build Python packages using PEP 517 hooks

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
