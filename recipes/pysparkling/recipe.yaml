# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: pysparkling
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysparkling/pysparkling-${{ version }}.tar.gz
  sha256: 74056d975fa06bb9c4a73c91e8f7e7115089249a8cdeb7692f9a7c7ec0dc0a44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysparkling
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/svenkreiss/pysparkling
  license: MIT
  license_file: LICENSE
  summary: Pure Python implementation of the Spark RDD interface.
  description: |
    Pure Python implementation of the Spark RDD interface.

extra:
  recipe-maintainers:
    - cdesouza21

#### CFE metadata AND comments
# CFE metadata
