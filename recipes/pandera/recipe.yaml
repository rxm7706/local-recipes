# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.32.1"

package:
  name: pandera
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandera/pandera-${{ version }}.tar.gz
  sha256: 72ecd74226847abf0f0437c05f7f10cc8368e306d88a2acc78fa93762c5a0a02

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - packaging >=20.0
    - pydantic
    - typeguard
    - typing_extensions
    - typing_inspect >=0.6.0

tests:
  - python:
      imports:
        - pandera
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pandera-dev/pandera
  license: MIT
  license_file: LICENSE.txt
  summary: A light-weight and flexible data validation and testing tool for statistical data objects.
  description: |
    A light-weight and flexible data validation and testing tool for statistical data objects.
  documentation: https://pandera.readthedocs.io

extra:
  recipe-maintainers:
    - cosmicBboy
    - fhoehle

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pandera
  cfe-upstream-registry: pypi
  cfe-upstream-name: pandera
