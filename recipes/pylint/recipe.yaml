# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.7"

package:
  name: pylint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylint/pylint-${{ version }}.tar.gz
  sha256: 9b2d1d15791c84b77a4fe2aafe8f0d9570717e2dea06d53b19c105cf60275a52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astroid <=4.1.dev0,>=4.0.2
    - dill >=0.2
    - isort !=5.13,<9,>=5
    - mccabe <0.8,>=0.6
    - platformdirs >=2.2
    - tomli >=1.1
    - tomlkit >=0.10.1
    - typing_extensions >=3.10
    - if: win
      then:
        - colorama

tests:
  - python:
      imports:
        - pylint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pylint-dev/pylint
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: python code static checker
  description: |
    python code static checker
  repository: https://github.com/pylint-dev/pylint

extra:
  recipe-maintainers:
    - timkpaine
    - jakirkham
    - timleslie
    - goanpeca
    - bollwyvl
    - wshanks

#### CFE metadata AND comments
