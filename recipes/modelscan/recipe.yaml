# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.8"

package:
  name: modelscan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/modelscan/modelscan-${{ version }}.tar.gz
  sha256: 34b134084370eb9832e0a7571297c3054ebfbff9f005992fe6f28ffc10135514

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
    - poetry-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - click <9.0.0,>=8.1.3
    - numpy >=1.24.3
    - rich <15.0.0,>=13.4.2
    - tomlkit <0.14.0,>=0.12.3

tests:
  - python:
      imports:
        - modelscan
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/modelscan/
  license: Apache-2.0
  license_file: LICENSE
  summary: The modelscan package is a cli tool for detecting unsafe operations in model files across various model serialization formats.
  description: |
    The modelscan package is a cli tool for detecting unsafe operations in model files across various model serialization formats.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
