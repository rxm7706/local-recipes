# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: three-merge
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/three-merge/three-merge-${{ version }}.tar.gz
  sha256: 60f6afe144595560d63ae32625351bcef3b94733b54eb97800a9feb0f3d9d970

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - diff-match-patch

tests:
  - python:
      imports:
        - three_merge
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spyder-ide/three-merge
  license: MIT
  license_file: LICENSE
  summary: Simple library for merging two strings with respect to a base one
  description: |
    Simple library for merging two strings with respect to a base one

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12

