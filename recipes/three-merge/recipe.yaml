# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: three-merge
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 60f6afe144595560d63ae32625351bcef3b94733b54eb97800a9feb0f3d9d970

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - diff-match-patch

tests:
  - python:
      imports:
        - three_merge
        - three_merge.merge
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Simple Python library to perform a 3-way merge between strings
  description: |
    Simple Python library to perform a 3-way merge between strings,
    based on diff-match-patch. This library performs merges at a character
    level, as opposed to most VCS systems, which opt for a line-based approach.
  homepage: https://github.com/spyder-ide/three-merge
  repository: https://github.com/spyder-ide/three-merge

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
