# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.2"

package:
  name: vadersentiment
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vaderSentiment/vaderSentiment-${{ version }}.tar.gz
  sha256: 5d7c06e027fc8b99238edb0d53d970cf97066ef97654009890b83703849632f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vaderSentiment
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cjhutto/vaderSentiment
  license: MIT
  license_file: LICENSE.txt
  summary: VADER Sentiment Analysis. VADER (Valence Aware Dictionary and sEntiment Reasoner) is a lexicon and rule-based sentiment analysis tool that is specifically attuned to sentiments expressed in social media, and works well on texts from other domains.
  description: |
    VADER Sentiment Analysis. VADER (Valence Aware Dictionary and sEntiment Reasoner) is a lexicon and rule-based sentiment analysis tool that is specifically attuned to sentiments expressed in social media, and works well on texts from other domains.

extra:
  recipe-maintainers:
    - thewchan

