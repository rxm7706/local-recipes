# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: weasel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/weasel/weasel-${{ version }}.tar.gz
  sha256: ca5dbfd24002dd85bd8a73a7f02d2471744c1b1a64d25698e05bb587a099a43e
  patches:
    - patches/0001-loosen-expected-error-in-test_project_config_interpo.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - weasel = weasel.cli:app

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - click >=8.0.0,<9.0.0
    - python >=${{ python_min }}
    # explosion libraries
    - cloudpathlib >=0.7.0
    - confection >=1.3.4,<2.0.0
    - smart-open >=5.2.1
    - srsly >=2.4.3
    - typer >=0.3.0
    - typer-slim >=0.3.0,<1.0.0
    - wasabi >=0.9.1
    # third-party libraries
    - httpx >=0.24.0
    - packaging >=20.0
    - pydantic >=2.0.0
    - requests >=2.13.0,<3.0.0

tests:
  - python:
      imports:
        - weasel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest >=5.2.0,!=7.1.0
        - pip
        - git
        - python ${{ python_min }}.*
    script:
      - weasel --help
      - python -m pytest --tb=native --pyargs weasel

about:
  license: MIT
  license_file: LICENSE
  summary: A small and easy workflow system
  description: |
    Weasel lets you manage and share end-to-end workflows for different use
    cases and domains, and orchestrate training, packaging and serving your
    custom pipelines.
  homepage: https://github.com/explosion/weasel
  repository: https://github.com/explosion/weasel
  documentation: https://github.com/explosion/weasel

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/spacy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: weasel
  cfe-upstream-registry: pypi
  cfe-upstream-name: weasel
