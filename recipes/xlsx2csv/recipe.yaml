# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: xlsx2csv
  version: "0.8.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/xlsx2csv-${{ version }}.tar.gz
  sha256: 618fc502612860de8ab8e3d6195e99ef332fffc68337f6b89e59690aad0d20b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - xlsx2csv = xlsx2csv:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=61.2.0
    - wheel
    - setuptools-scm >=3.4.3
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xlsx2csv
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
        - pip
    script:
      - xlsx2csv --help

about:
  summary: xlsx to csv converter
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/dilshod/xlsx2csv

extra:
  recipe-maintainers:
    - borchero
