# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: transformer-smaller-training-vocab
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/transformer_smaller_training_vocab-${{ version }}.tar.gz
  sha256: aed4390331e63d9a0998d76f277b7d44ad5d38b8427ad7792b1e28c807801ed8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - transformers >=4.1.0,<5.0.0
    - pytorch >=1.8.0,<3.0.0,!=2.0.1
    - sentencepiece >=0.1.97,<0.2.0
    - numpy <2.0.0,>=1.21.0

tests:
  - python:
      imports:
        - transformer_smaller_training_vocab
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Temporary remove unused tokens during training to save ram and speed.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/helpmefindaname/transformer-smaller-training-vocab

extra:
  recipe-maintainers:
    - BastianZim
