# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.2"

package:
  name: transformer-smaller-training-vocab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/transformer-smaller-training-vocab/transformer_smaller_training_vocab-${{ version }}.tar.gz
  sha256: aed4390331e63d9a0998d76f277b7d44ad5d38b8427ad7792b1e28c807801ed8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - transformers <5.0,>=4.1
    - pytorch !=2.0.1,<3.0.0,>=1.8.0

tests:
  - python:
      imports:
        - transformer_smaller_training_vocab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/helpmefindaname/transformer-smaller-training-vocab
  license: MIT
  license_file: LICENSE
  summary: Temporary remove unused tokens during training to save ram and speed.
  description: |
    Temporary remove unused tokens during training to save ram and speed.
  repository: https://github.com/helpmefindaname/transformer-smaller-training-vocab

extra:
  recipe-maintainers:
    - BastianZim

