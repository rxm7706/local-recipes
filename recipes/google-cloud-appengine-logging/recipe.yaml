# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-cloud-appengine-logging
  version: "1.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_appengine_logging-${{ version }}.tar.gz
  sha256: b5563e76010a36e6adf1cc489620c29ee4fb3b986b006d237e9a061eb0f0abb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.17.1,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    # more restrictive constraint for python >=3.13
    - proto-plus >=1.25.0,<2.0.0
    - protobuf >=4.25.8,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.appengine_logging
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Python Client for Google Cloud Appengine Logging
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-appengine-logging
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-appengine-logging
  documentation: https://github.com/googleapis/google-cloud-python/blob/main/packages/google-cloud-appengine-logging/README.rst

extra:
  recipe-maintainers:
    - xylar
