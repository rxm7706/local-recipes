# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.3"

package:
  name: packaging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/packaging/packaging-${{ version }}.tar.gz
  sha256: 94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12
  run:
    - python >=${{ python_min }}
    - packaging

tests:
  - python:
      imports:
        - packaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/packaging/
  license: Apache-2.0 OR BSD-2-Clause
  license_file: LICENSE
  summary: Core utilities for Python packages
  description: |
    Core utilities for Python packages
  repository: https://github.com/pypa/packaging
  documentation: https://packaging.pypa.io/

extra:
  recipe-maintainers:
    - jakirkham
    - nicoddemus
    - matthewfeickert
    - ofek

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: packaging
  cfe-upstream-registry: pypi
  cfe-upstream-name: packaging
