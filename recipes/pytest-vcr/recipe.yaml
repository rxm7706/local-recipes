# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: pytest-vcr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-vcr/pytest-vcr-${{ version }}.tar.gz
  sha256: 23ee51b75abbcc43d926272773aae4f39f93aceb75ed56852d0bf618f92e1896

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest
    - vcrpy

tests:
  - python:
      imports:
        - pytest_vcr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ktosiek/pytest-vcr
  license: MIT
  license_file: LICENSE
  summary: Plugin for managing VCR.py cassettes
  description: |
    Plugin for managing VCR.py cassettes

extra:
  recipe-maintainers:
    - ocefpaf

