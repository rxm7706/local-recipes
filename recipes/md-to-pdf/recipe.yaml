# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: md-to-pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/md-to-pdf/md-to-pdf-${{ version }}.tar.gz
  sha256: 5f5fc21ed684cb0fd829931eea35d6669298f19f9663fae3670003738d1bccdf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - md_to_pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/vpoulailleau/md-to-pdf
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Yet another Markdown to PDF converter
  description: |
    Yet another Markdown to PDF converter
  repository: https://github.com/vpoulailleau/md-to-pdf
  documentation: https://github.com/vpoulailleau/md-to-pdf

extra:
  recipe-maintainers:
    - rxm7706

