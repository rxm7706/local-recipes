# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: findspark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/findspark/findspark-${{ version }}.tar.gz
  sha256: aa10a96cb616cab329181d72e8ef13d2dc453b4babd02b5482471a0882c1195e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - findspark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/minrk/findspark
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Find pyspark to make it importable.
  description: |
    Find pyspark to make it importable.

extra:
  recipe-maintainers:
    - mariusvniekerk
    - minrk

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: findspark
  cfe-upstream-registry: pypi
  cfe-upstream-name: findspark
  cfe-purls:
    - pkg:conda/findspark@${{ version }}?channel=conda-forge
    - pkg:pypi/findspark@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/minrk/findspark
  cfe-import-names: [findspark]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/findspark-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.0.1

  cfe-forge-blocker-list:
