# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: findspark
  version: "2.0.1"
  bundle: tar.gz
  sha256: aa10a96cb616cab329181d72e8ef13d2dc453b4babd02b5482471a0882c1195e
  build: 1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - findspark
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license_file: LICENSE.md
  license: BSD-3-Clause
  summary: Find pyspark to make it importable.
  homepage: https://github.com/minrk/findspark
  repository: https://github.com/minrk/findspark

extra:
  recipe-maintainers:
    - mariusvniekerk
    - minrk
