# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: tabula
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tabula/tabula-${{ version }}.tar.gz
  sha256: b48ddacac12934a0d316ccb27d51b0895caa766ab312053587d6de5f495fe288

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tabula
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ronniedada/tabula
  license: Apache-2.0
  license_file: LICENSE
  summary: Ascii table
  description: |
    Ascii table

extra:
  recipe-maintainers:
    - rxm7706

