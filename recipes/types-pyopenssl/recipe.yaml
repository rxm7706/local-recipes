# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "24.1.0.20240722"

package:
  name: types-pyopenssl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-pyopenssl/types-pyOpenSSL-${{ version }}.tar.gz
  sha256: 47913b4678a01d879f503a12044468221ed8576263c1540dcb0484ca21b08c39

build:
  number: 2
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography >=35.0.0
    - types-cffi

tests:
  - package_contents:
      site_packages:
        - OpenSSL-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed
  summary: Typing stubs for pyOpenSSL
  license: Apache-2.0 AND MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
