# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.6.1"

package:
  name: apache-airflow-providers-mysql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-mysql/apache_airflow_providers_mysql-${{ version }}.tar.gz
  sha256: 2d655ad27c660eaf272c1d6a57da48e9fcdb06745f6b45676786939dee4a5439

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.12.0
    - apache-airflow-providers-common-sql >=1.32.0
    - mysql-connector-python >=9.1.0
    - aiomysql >=0.2.0
    - pymysql <1.2,>=1.0.3

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-mysql/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-mysql for Apache Airflow
  description: |
    Provider package apache-airflow-providers-mysql for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-mysql/6.6.1

extra:
  recipe-maintainers:
    - xylar

