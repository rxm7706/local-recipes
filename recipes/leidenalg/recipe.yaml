# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: leidenalg
  version: "0.12.0"
  sha256: c81a45a2fb874fe71e903d43a869d0efeb7f907af70476c03f6945ef0e8f44c5

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  skip: win and vc<14
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - libleidenalg >=0.13
    - python
    - setuptools
    - setuptools_scm
    - pip
  run:
    - python-igraph
    - python
    - pip

tests:
  - python:
      imports:
        - leidenalg
      pip_check: false
  - files:
      source:
        - tests
    requirements:
      run:
        - ddt
    script:
      - python -m unittest -v --locals

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Implementation of the Leiden algorithm for various methods for use with igraph in python.
  description: |
    This package implements the Leiden algorithm in C++ and
    exposes it to python. It relies on (python-)igraph for it to
    function. Besides the relative flexibility of the
    implementation, it also scales well, and can be run on graphs
    of millions of nodes (as long as they can fit in memory).
    The core function is find_partition which is able to optimize a
    variety of quality functions using the Leiden algorithm.
  homepage: https://github.com/vtraag/leidenalg
  repository: https://github.com/vtraag/leidenalg
  documentation: http://leidenalg.readthedocs.io/

extra:
  recipe-maintainers:
    - vtraag
