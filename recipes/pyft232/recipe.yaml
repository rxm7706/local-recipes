# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12"

package:
  name: pyft232
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyft232/pyft232-${{ version }}.tar.gz
  sha256: 819b8d0d6f33e97bb5d6c850cc63645b7638c1917523a22ff900b0cb8ce4d5d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ft232
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyft232/
  license: MIT
  license_file: LICENSE
  summary: Python bindings to d2xx and libftdi to access FT232 chips with the same interface as pyserial. Using this method gives easy access to the additional features on the chip like CBUS GPIO.
  description: |
    Python bindings to d2xx and libftdi to access FT232 chips with the same interface as pyserial. Using this method gives easy access to the additional features on the chip like CBUS GPIO.

extra:
  recipe-maintainers:
    - rxm7706

