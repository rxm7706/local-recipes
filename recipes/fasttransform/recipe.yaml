# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: fasttransform
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fasttransform/fasttransform-${{ version }}.tar.gz
  sha256: 18ea6964128be779a1c483d4775f1b5a2e452f915c2d30dfa2d91adca98453d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64.0
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - fastcore
    - plum-dispatch

tests:
  - python:
      imports:
        - fasttransform
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/AnswerDotAI/fasttransform
  license: Apache-2.0
  license_file: LICENSE
  summary: Transform is the main building block of data pipelines in fastai. And elsewhere if you want.
  description: |
    Transform is the main building block of data pipelines in fastai. And elsewhere if you want.

extra:
  recipe-maintainers:
    - tonyhoo

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fasttransform
  cfe-upstream-registry: pypi
  cfe-upstream-name: fasttransform
