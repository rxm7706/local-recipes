    - pkg:pypi/fasttransform@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/AnswerDotAI/fasttransform
  cfe-import-names: [fasttransform]
  cfe-source-kind: pypi-sdist
