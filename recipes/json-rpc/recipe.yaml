    - pkg:pypi/json-rpc@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/pavlov99/json-rpc
  cfe-import-names: [jsonrpc]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/json-rpc-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.15.0

  cfe-forge-blocker-list:
