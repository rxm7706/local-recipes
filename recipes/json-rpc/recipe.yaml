# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.0"

package:
  name: json-rpc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-rpc/json-rpc-${{ version }}.tar.gz
  sha256: e6441d56c1dcd54241c937d0a2dcd193bdf0bdc539b5316524713f554b7f85b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonrpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pavlov99/json-rpc
  license: MIT
  license_file: LICENSE.txt
  summary: JSON-RPC transport implementation
  description: |
    JSON-RPC transport implementation

extra:
  recipe-maintainers:
    - mgorny
    - dharhas
    - ccordoba12

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: json-rpc
  cfe-upstream-registry: pypi
  cfe-upstream-name: json-rpc
