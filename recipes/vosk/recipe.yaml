# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.45"

package:
  name: vosk
  version: ${{ version }}

source:
  url: https://github.com/alphacep/vosk-api/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 930fb9cfa6c1b3035d3730feee7d670fb893caa0c71bd2159ee7623102674c26

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cffi
    - requests
    - tqdm
    - srt
    - websockets

tests:
  - python:
      imports:
        - python.vosk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alphacep/vosk-api
  license: Apache-2.0
  license_file: LICENSE
  summary: Offline open source speech recognition API based on Kaldi and Vosk
  description: |
    Offline open source speech recognition API based on Kaldi and Vosk

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: vosk
  cfe-upstream-registry: pypi
  cfe-upstream-name: vosk
