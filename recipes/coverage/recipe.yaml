# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 7.15.4

package:
  name: coverage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coverage/coverage-${{ version }}.tar.gz
  sha256: 0548198fff07ccf4faf469520bce1c2eceb1ce3e62891921138dec10907f9d00

build:
  number: 1
  noarch: ${{ "python" if use_noarch }}
  variant:
    down_prioritize_variant: ${{ 1 if use_noarch else 0 }}
  python:
    entry_points:
      - coverage = coverage.cmdline:main

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform and not use_noarch
      then: python
    - if: not use_noarch
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
  host:
    - if: use_noarch
      then: python ${{ python_min }}.*
      else: python
    - pip
    - setuptools
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
      else: python
    # extra dependency
    - tomli

tests:
  - if: use_noarch
    then:
      - python:
          imports:
            - coverage
          python_version: ${{ python_min }}.*
          pip_check: true
      - script:
          - coverage --help
        requirements:
          run:
            - python ${{ python_min }}.*
    else:
      - python:
          imports:
            - coverage
          pip_check: true
      - script:
          - coverage --help

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Code coverage measurement for Python
  homepage: https://coverage.readthedocs.io

extra:
  recipe-maintainers:
    - thewchan
    - ericmjl
    - jakirkham
    - ocefpaf
