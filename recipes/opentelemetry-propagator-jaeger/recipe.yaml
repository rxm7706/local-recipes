# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.45.1"

package:
  name: opentelemetry-propagator-jaeger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-propagator-jaeger/opentelemetry_propagator_jaeger-${{ version }}.tar.gz
  sha256: 96b5a71ec3177715a2fad3653d93cbc05ac358f2cbe437681edf88a055674af6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.3

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.propagators
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Jaeger Propagator
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/propagator/opentelemetry-propagator-jaeger

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk

