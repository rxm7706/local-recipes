# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-propagator-jaeger
  version: "1.44.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_propagator_jaeger-${{ version }}.tar.gz
  sha256: 0fba4127600f5eca1d5ce31f208f4e13bdd80050a236f3953f6f244c197178b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.3

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.propagators
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Jaeger Propagator
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/propagator/opentelemetry-propagator-jaeger

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
