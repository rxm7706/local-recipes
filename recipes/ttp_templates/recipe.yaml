# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.9"

package:
  name: ttp_templates
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/ttp_templates/ttp_templates-${{ version }}.tar.gz
  sha256: ea992b91fbc200233524fb70f8a311e901e451f3112294cff7e63e886b8b1026

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - ttp >=0.10.0
    - pydantic >=2.0

tests:
  - python:
      imports:
        - ttp_templates
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dmulyalin/ttp_templates
  license: MIT
  license_file: LICENSE
  summary: Template Text Parser Templates collections
  description: |
    Template Text Parser Templates collections
  repository: https://github.com/dmulyalin/ttp_templates
  documentation: https://dmulyalin.github.io/ttp_templates/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
