# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.32.post2"

package:
  name: disutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/disutils/disutils-${{ version }}.tar.gz
  sha256: 29529e3436a95e9863934d6ce3f20335860c7fdffe5e6f95b5ceaeb3ffea4574

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - asyncio

tests:
  - python:
      imports:
        - disutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pintermor9/disutils/
  license: MIT
  license_file: LICENSE
  summary: disutils is a very useful library made to be used with discord.py
  description: |
    disutils is a very useful library made to be used with discord.py

extra:
  recipe-maintainers:
    - rxm7706

