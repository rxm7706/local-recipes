# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"
  python_min: "3.12"

package:
  name: verbose-csrf-middleware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/verbose-csrf-middleware/verbose_csrf_middleware-${{ version }}.tar.gz
  sha256: 9bd4fee530137cf1005416d8fac4e843df69eb665e95d446b62458d0f421504d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - verbose_csrf_middleware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.bugsink.com/docs/verbose_csrf_middleware/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Verbatim copy of Django's CSRF middleware, but with more verbose error messages.
  description: |
    Verbatim copy of Django's CSRF middleware, but with more verbose error messages.
  documentation: https://www.bugsink.com/docs/verbose_csrf_middleware/

extra:
  recipe-maintainers:
    - rxm7706

