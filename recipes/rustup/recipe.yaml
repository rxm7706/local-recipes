# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.29.0.1"

package:
  name: rustup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rustup/rustup-${{ version }}.tar.gz
  sha256: 57942851dba8d044e571c0bd3c84321b1f094cc93f804ae4871cc5926dbb67f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - httpx >=0.28.1,<0.29.0
    - tqdm >=4.67.1,<5.0.0
    - uv-build >=0.10.0,<0.11.0
    - puccinialin >=0.1.0,<0.2.0
    - tomli >=2.2.1,<3.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rustup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/rustup/
  license: MIT OR Apache-2.0
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://github.com/konstin/rustup-pypi

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: rustup
  cfe-upstream-registry: pypi
  cfe-upstream-name: rustup
  cfe-purls:
    - pkg:conda/rustup@${{ version }}?channel=conda-forge
    - pkg:pypi/rustup@${{ version }}
  cfe-upstream-repo: https://github.com/konstin/rustup-pypi
  cfe-upstream-homepage: https://pypi.org/project/rustup/
  cfe-import-names: [rustup]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
