# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flask-bcrypt
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/Flask-Bcrypt-${{ version }}.tar.gz
  sha256: f07b66b811417ea64eb188ae6455b0b708a793d966e1a80ceec4a23bc42a4369

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bcrypt >=3.1.1
    - flask

tests:
  - python:
      imports:
        - flask_bcrypt
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE
  license: BSD-3-Clause
  summary: Bcrypt hashing for Flask.
  homepage: https://github.com/maxcountryman/flask-bcrypt
  repository: https://github.com/maxcountryman/flask-bcrypt
  documentation: https://flask-bcrypt.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - xylar
    - pmlandwehr
