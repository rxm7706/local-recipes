# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: flask-bcrypt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Bcrypt/Flask-Bcrypt-${{ version }}.tar.gz
  sha256: f07b66b811417ea64eb188ae6455b0b708a793d966e1a80ceec4a23bc42a4369

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - bcrypt

tests:
  - python:
      imports:
        - flask_bcrypt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/maxcountryman/flask-bcrypt
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Brcrypt hashing for Flask.
  description: |
    Brcrypt hashing for Flask.

extra:
  recipe-maintainers:
    - xylar
    - pmlandwehr

