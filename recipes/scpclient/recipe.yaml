# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7"

package:
  name: scpclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scpclient/scpclient-${{ version }}.tar.gz
  sha256: 2a7336123d9fbfb0064907719747a96f1c0add38a99b4d2741adc218d25e11d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - scpclient
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/ericvsmith/scpclient
  license: Apache-2.0
  license_file: LICENSE
  summary: scp client, for use with paramiko.
  description: |
    scp client, for use with paramiko.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
