# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4"

package:
  name: ssdeep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/ssdeep/ssdeep-${{ version }}.tar.gz
  sha256: 1b5510716bc495a2b18300ea837fcf944552a1cc678bb74e384bce251d99a85f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ssdeep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/DinoTools/python-ssdeep
  license: LGPLv3+
  license_file: LICENSE
  summary: Python wrapper for the ssdeep library
  description: |
    Python wrapper for the ssdeep library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ssdeep
  cfe-upstream-registry: pypi
  cfe-upstream-name: ssdeep
  cfe-purls:
