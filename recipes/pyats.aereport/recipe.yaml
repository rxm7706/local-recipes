# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.aereport
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats.aereport/pyats_aereport-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: 38b4e87443302bd3c4dc705c08ec3849a35640def4dd53043d91666b4ca56755

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - psutil
    - jinja2
    - junit-xml
    - pyats.log <26.8.0,>=26.7.0
    - pyats.results <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats.aereport
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: "pyATS AEreport: Result Collection and Reporting"
  description: |
    pyATS AEreport: Result Collection and Reporting

extra:
  recipe-maintainers:
    - rxm7706

