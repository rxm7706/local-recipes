# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.3"

package:
  name: missforest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/MissForest/missforest-${{ version }}.tar.gz
  sha256: 5b754a6ff98ff11c578dbddf7ce4fa1fa73b7f7d65847cf50de6bec067fb7a5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - lightgbm
    - pandas
    - numpy

tests:
  - python:
      imports:
        - missforest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/yuenshingyan/MissForest
  license: MIT
  license_file: LICENSE
  summary: Best imputation method.
  description: |
    Best imputation method.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
