# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.3"

package:
  name: alchemy-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alchemy-mock/alchemy-mock-${{ version }}.tar.gz
  sha256: 7914c3f56aa7dd793d31a5ea3816972ff57de6e3c82651febfaab135e8f39d7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six
    - sqlalchemy
    - setuptools

tests:
  - python:
      imports:
        - alchemy_mock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/miki725/alchemy-mock
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy mock helpers.
  description: |
    SQLAlchemy mock helpers.

extra:
  recipe-maintainers:
    - rxm7706

