# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: pychronotab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pychronotab/pychronotab-${{ version }}.tar.gz
  sha256: 240a04167c39b4cc088c3866459a35b4b8fa0cf793d2731d706e3a0a0e8fd420

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pychronotab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/millsks/pychronotab
  license: MIT
  license_file: LICENSE
  summary: A cron expression iterator with croniter-compatible API, supporting 5 and 6-field cron (with seconds). Named after Chronos (time) to avoid conflicts with crontab packages.
  description: |
    A cron expression iterator with croniter-compatible API, supporting 5 and 6-field cron (with seconds). Named after Chronos (time) to avoid conflicts with crontab packages.
  documentation: https://github.com/millsks/pychronotab

extra:
  recipe-maintainers:
    - rxm7706

