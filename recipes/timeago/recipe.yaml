# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.16"

package:
  name: timeago
  version: ${{ version }}

source:
  url: https://github.com/hustcc/timeago/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7b54b88b3d0566cbf01ca11077dad8f7ae07a4318479e3d1b30feebe85f7137f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timeago
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hustcc/timeago
  license: MIT
  license_file: LICENSE
  summary: "A very simple python library, used to format datetime with `*** time ago` statement. eg: '3 hours ago'."
  description: |
    A very simple python library, used to format datetime with `*** time ago` statement. eg: "3 hours ago".

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
