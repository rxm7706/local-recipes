# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.32.3"

package:
  name: filelock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/filelock/filelock-${{ version }}.tar.gz
  sha256: 0ffa185a3540854c95caa7fa76b76cb219d907415e2c5dc9af25fd970563487f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.5
    - hatchling >=1.29
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - filelock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tox-dev/py-filelock
  license: MIT
  license_file: LICENSE
  summary: A platform independent file lock.
  description: |
    A platform independent file lock.
  repository: https://github.com/tox-dev/py-filelock
  documentation: https://py-filelock.readthedocs.io

extra:
  recipe-maintainers:
    - jakirkham
    - mariusvniekerk
    - nicoddemus

#### CFE metadata AND comments
