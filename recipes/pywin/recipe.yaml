# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.1"

package:
  name: pywin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywin/pywin-0.3.1.zip
  sha256: 4f9195735d6fd726a4e90b7f950383c964ecd52614453a5dd4dfae3a86b8163a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources

tests:
  - python:
      imports:
        - pywin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/davidmarble/pywin/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Lightweight python 2.5-3.3 launcher and switcher for Windows command line and MSYS/MINGW32. Partly PEP 397 compliant.
  description: |
    Lightweight python 2.5-3.3 launcher and switcher for Windows command line and MSYS/MINGW32. Partly PEP 397 compliant.

extra:
  recipe-maintainers:
    - rxm7706

