# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"
  python_min: "3.14"

package:
  name: routers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/routers/routers-${{ version }}.tar.gz
  sha256: 4c224265148d3393f73c96d755e25677916e356cfb1d8b21e24e775e11c8352e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cryptography
    - opn-api >=0.4.0
    - pyfsense-client >=0.5.0
    - python-decouple
    - python-dotenv
    - redis-py

tests:
  - python:
      imports:
        - routers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/devinbarry/routers
  license: MIT
  license_file: LICENSE
  summary: A Python client library for both OPNsense and pfSense.
  description: |
    A Python client library for both OPNsense and pfSense.
  documentation: https://github.com/devinbarry/routers

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
