# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: python3-chatgpt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-chatgpt/python3_chatgpt-${{ version }}.tar.gz
  sha256: 5a0972c88deca6792b7b0c76b20e0370ad41fe412b4d4e701208d061453652f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - openai
    - python3-log

tests:
  - python:
      imports:
        - chatgpt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitee.com/devops_dev/chatgpt
  license: MIT
  license_file: LICENSE
  summary: used to ssh to use chatgpt to ask question
  description: |
    used to ssh to use chatgpt to ask question
  documentation: https://gitee.com/devops_dev/chatgpt/README.md

extra:
  recipe-maintainers:
    - rxm7706

