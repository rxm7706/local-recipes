# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: alpaca-trade-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alpaca-trade-api/alpaca-trade-api-${{ version }}.tar.gz
  sha256: ddc92c3992fedcf8316c5b8a761b72f485b754fee14d77bb5bab9878e79acc46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas >=0.18.1
    - numpy >=1.11.1
    - requests <3,>2
    - urllib3 <2,>1.24
    - websocket-client <2,>=0.56.0
    - websockets <11,>=9.0
    - msgpack ==1.0.3
    - aiohttp <4,>=3.8.3
    - pyyaml ==6.0.1
    - deprecation ==2.1.0

tests:
  - python:
      imports:
        - alpaca_trade_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alpacahq/alpaca-trade-api-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Alpaca API python client
  description: |
    Alpaca API python client

extra:
  recipe-maintainers:
    - rxm7706

