# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: jupyter-contrib-nbextensions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-contrib-nbextensions/jupyter_contrib_nbextensions-${{ version }}.tar.gz
  sha256: 06e33f005885eb92f89cbe82711e921278201298d08ab0d886d1ba09e8c3e9ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyter-nbextensions-configurator

tests:
  - python:
      imports:
        - jupyter_contrib_nbextensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ipython-contrib/jupyter_contrib_nbextensions.git
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A collection of Jupyter nbextensions.
  description: |
    A collection of Jupyter nbextensions.

extra:
  recipe-maintainers:
    - jcb91
    - juhasch
    - ocefpaf
    - xhochy

#### CFE metadata AND comments
