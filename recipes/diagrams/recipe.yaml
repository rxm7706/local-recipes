# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: diagrams
  version: "0.25.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 87480ba0b2d26987a69f7d553aa0cb1cebf1406adc03fef7031bdfff026bfc51
  patches:
    - 0001-chore-move-pre-commit-from-runtime-to-dev-dependenci.patch

build:
  number: 0
  noarch: python
  script:
    - $PYTHON -m pip install . -vv
    - cp -r $SRC_DIR/resources $SP_DIR/resources

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - jinja2 >=2.10,<4.0
    - python-graphviz >=0.13.2,<0.21.0
    - typed-ast >=1.5.4,<2.0.0

tests:
  - python:
      imports:
        - diagrams
        - diagrams.alibabacloud
        - diagrams.aws
        - diagrams.azure
        - diagrams.base
        - diagrams.custom
        - diagrams.gcp
        - diagrams.k8s
        - diagrams.oci
        - diagrams.onprem
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  license: MIT
  license_file: LICENSE
  summary: Diagram as Code
  homepage: https://diagrams.mingrammer.com
  repository: https://github.com/mingrammer/diagrams
  documentation: https://diagrams.mingrammer.com/

extra:
  recipe-maintainers:
    - mxr-conda
    - oblute
    - rluria14
    - ndmaxar
    - dhirschfeld
    - dbast

