    - pkg:pypi/pyct@${{ version }}
  cfe-upstream-repo: https://github.com/holoviz-dev/pyct
  cfe-upstream-homepage: https://github.com/holoviz-dev/pyct
  cfe-import-names: [pyct]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pyct-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.6.0

  cfe-forge-blocker-list:
