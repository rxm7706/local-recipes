# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: pyct
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyct/pyct-${{ version }}.tar.gz
  sha256: d4e513b2cf35b6165605ae5fce5f2a49985bc67473c579de85134b8c71d374a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.25.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - param >=1.7.0

tests:
  - python:
      imports:
        - pyct
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/holoviz-dev/pyct
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Python package common tasks for users (e.g. copy examples, fetch data, ...)
  description: |
    Python package common tasks for users (e.g. copy examples, fetch data, ...)
  repository: https://github.com/holoviz-dev/pyct

extra:
  recipe-maintainers:
    - hoxbro
    - maximlt
    - ocefpaf
    - apmorton

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyct
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyct
