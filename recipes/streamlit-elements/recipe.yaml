# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: streamlit-elements
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-elements/streamlit-elements-${{ version }}.tar.gz
  sha256: 5f9f116f22df3ce4a8636b1dee7c2fd3dc3cb0c66267fd28c3e0314aa1d303a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_elements
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://share.streamlit.io/okld/streamlit-gallery/main?p=elements
  license: MIT
  license_file: LICENSE
  summary: React Components for Streamlit.
  description: |
    React Components for Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
