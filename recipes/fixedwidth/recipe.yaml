# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fixedwidth
  version: "1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/FixedWidth-${{ version }}.tar.gz
  sha256: 472fe49c93dff14975cb8ea5bf6a7ef4c42343a7a1b494993640c6580be3de93

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - fixedwidth
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Two-way fixed-width <--> Python dict converter.
  license: BSD-Source-Code
  license_file: LICENSE.txt
  homepage: https://github.com/ShawnMilo/fixedwidth

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fixedwidth
  cfe-upstream-registry: pypi
  cfe-upstream-name: fixedwidth
  cfe-purls:
    - pkg:conda/fixedwidth@${{ version }}?channel=conda-forge
    - pkg:pypi/fixedwidth@${{ version }}
  cfe-upstream-repo: https://github.com/ShawnMilo/fixedwidth
  cfe-upstream-homepage: https://github.com/ShawnMilo/fixedwidth
  cfe-import-names: [fixedwidth]
  cfe-source-kind: pypi-sdist
