# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: audioread
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/audioread/audioread-${{ version }}.tar.gz
  sha256: 1c4ab2f2972764c896a8ac61ac53e261c8d29f0c6ccd652f84e18f08a4cab190

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - standard-aifc
    - standard-sunau

tests:
  - python:
      imports:
        - audioread
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/beetbox/audioread
  license: MIT
  license_file: LICENSE
  summary: Multi-library, cross-platform audio decoding.
  description: |
    Multi-library, cross-platform audio decoding.
  repository: https://github.com/beetbox/audioread

extra:
  recipe-maintainers:
    - bmcfee
    - sampsyo
    - scopatz
    - mfansler
    - mgorny

