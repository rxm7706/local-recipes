# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: django-fake-database-backends
  version: ${{ version }}

source:
  url: https://github.com/David-Wobrock/django-fake-database-backends/archive/refs/tags/v${{ version }}.tar.gz
  sha256: aa0f799a3509be1bb28fae3422b04ecd3f0316f23d39112632d11810564fe604

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django

tests:
  - python:
      imports:
        - django_fake_database_backends
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/David-Wobrock/django-fake-database-backends
  license: MIT
  license_file: LICENSE
  summary: Fake django database backends to generate sql without a real database
  description: |
    Fake django database backends to generate sql without a real database

extra:
  recipe-maintainers:
    - rxm7706

