# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.32.0"

package:
  name: mlx-metal
  version: ${{ version }}

source:
  url: https://github.com/ml-explore/mlx/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8e74a0eb613861ce50c09402dd99dbc42b65a762e7fdd291caa39f611db978ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - cmake >=3.25
    - mlx >=0.18.0
    - nanobind ==2.13.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python.mlx.nn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ml-explore/mlx
  license: MIT
  license_file: LICENSE
  summary: A framework for machine learning on Apple silicon.
  description: |
    A framework for machine learning on Apple silicon.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
