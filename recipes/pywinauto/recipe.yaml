# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pywinauto
  version: "0.6.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 94d710bfa796df245250f952ffa65d97233d9807bcd42e052b71b81af469b6de

build:
  number: 1
  skip: osx
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - if: win
      then: comtypes
    - python
    - if: not win
      then: python-xlib
    - if: win
      then: pywin32
    - six

tests:
  - python:
      imports:
        - pywinauto
        - if: win
          then: pywinauto.controls
        - pywinauto.linux
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A set of Python modules to automate the Microsoft Windows GUI
  homepage: http://pywinauto.github.io/
  repository: https://github.com/pywinauto/pywinauto
  documentation: https://pywinauto.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - m-rossi
