# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.80"

package:
  name: winstats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/winstats/winstats-${{ version }}.tar.gz
  sha256: 6076805d9a118b6dceff75f1ff49d04683da70884fb7392fa0a7583c42b3e6a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - winstats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mixmastamyk/winstats
  license: MIT
  license_file: LICENSE
  summary: A simple Windows status retrieval module with no additional dependencies.
  description: |
    A simple Windows status retrieval module with no additional dependencies.

extra:
  recipe-maintainers:
    - rxm7706

