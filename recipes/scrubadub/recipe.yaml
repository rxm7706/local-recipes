# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: scrubadub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scrubadub/scrubadub-${{ version }}.tar.gz
  sha256: 52a1fb8aa9bc0226043e02c3ec22d450bd4ebeede9e7e8db2def7c89b37c5aad

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - textblob ==0.15.3
    - phonenumbers
    - python-stdnum
    - dateparser
    - catalogue
    - scikit-learn
    - typing_extensions
    - faker

tests:
  - python:
      imports:
        - scrubadub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/LeapBeyond/scrubadub
  license: MIT
  license_file: LICENSE
  summary: Clean personally identifiable information from dirty dirty text.
  description: |
    Clean personally identifiable information from dirty dirty text.

extra:
  recipe-maintainers:
    - soapy1

