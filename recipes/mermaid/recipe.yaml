# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: mermaid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/m/mermaid/mermaid-0.3.2-py3-none-any.whl
  sha256: 4632b4584d528e3d2c79f9557ebf9e618f3a264318312b5de6004e6e3c84cf49

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython
    - jupyter
    - ipykernel
    - numpy
    - pynrrd
    - future
    - cython
    - scikit-image
    - tabulate
    - termcolor
    - cffi
    - itk
    - pytorch
    - pandas
    - matplotlib-base
    - scipy
    - openpyxl
    - sphinx-gallery
    - sphinx
    - nbsphinx
    - pandoc
    - pypandoc
    - statsmodels
    - progressbar2

tests:
  - python:
      imports:
        - mermaid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/uncbiag/mermaid
  license: Apache-2.0
  license_file: LICENSE
  summary: Image registration toolbox based on pyTorch
  description: |
    Image registration toolbox based on pyTorch

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
