# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.4"
  python_min: "3.12"

package:
  name: kauldron
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kauldron/kauldron-${{ version }}.tar.gz
  sha256: 4abf92cb7714a3f023849864c78f8a14f321a0638d2aef366b8a3ac694728e5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}
    - absl-py
    - altair
    - chex
    - clu
    - einops
    - etils
    - flax
    - python-graphviz
    - immutabledict
    - jax
    - jaxtyping
    - lark
    - mediapy
    - ml-collections
    - numpy
    - opencv
    - optax
    - orbax-checkpoint
    - pandas
    - scikit-image
    - scikit-learn
    - tabulate
    - tensorboard
    - tensorflow-cpu
    - tensorflow-datasets >=4.9.7
    - tqdm
    - typeguard >=4.4.1
    - typing_extensions
    - xmanager

tests:
  - python:
      imports:
        - kauldron
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google-research/kauldron
  license: Apache-2.0
  license_file: LICENSE
  summary: Kauldron is a ML research library optimized for quick iteration and modularity.
  description: |
    Kauldron is a ML research library optimized for quick iteration and modularity.
  documentation: https://kauldron.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
