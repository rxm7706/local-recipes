# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: shillelagh
  version: "1.4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/shillelagh-${{ version }}.tar.gz
  sha256: d22b5f6e357c0d34820179e9d62ac3ed8a7b46f996dd42071c6362e4746a9029

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - shillelagh = shillelagh.console:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=46.1.0
    - setuptools-scm >=5
    - toml
    - wheel
    - pyscaffold >=3.2a0
    - pip
  run:
    - appdirs >=1.4.4
    - boto3 >=1.24.28
    - botocore
    - defusedxml >=0.7.1
    - holidays >=0.23
    - jsonpath
    - numpy
    - pandas >=1.2.2
    - prison >=0.2.1
    - prompt_toolkit >=3
    - psutil >=5.8.0
    - psycopg2 >=2.9.9
    - pyarrow >=14.0.1
    - pygments >=2.8
    - pyyaml
    - sqlglot >=23.0.2
    - tabulate >=0.8.9
    - typing_extensions >=3.7.4.3
    - yarl >=1.8.1
    - python >=${{ python_min }}
    - importlib-metadata
    - apsw >=3.43.2.0
    - python-dateutil >=2.8.1
    - requests >=2.31.0
    - requests-cache >=0.7.1
    - sqlalchemy >=1.3
    - greenlet >=2.0.2
    - typing-extensions >=3.7.4.3
    - packaging
