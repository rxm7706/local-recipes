  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/betodealmeida/shillelagh/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: shillelagh
  cfe-upstream-registry: pypi
  cfe-upstream-name: shillelagh
  cfe-purls:
    - pkg:conda/shillelagh@${{ version }}?channel=conda-forge
    - pkg:pypi/shillelagh@${{ version }}
  cfe-upstream-repo: https://github.com/betodealmeida/shillelagh
  cfe-upstream-homepage: https://github.com/betodealmeida/shillelagh
  cfe-import-names: [shillelagh]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: true
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/shillelagh-feedstock
  cfe-forge-recipe-updates-needed:
    - meta-yaml-to-recipe-yaml
    - dependency-fix
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-06-20T00:00:00Z
  cfe-generated-by-version: 8.37.0
  cfe-generated-at-datetime: 2026-06-20T00:00:00Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-06-20T00:00:00Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
####
# CFE comments
# Header:
#    # WAVE-C C1 keep-meta: conda-forge feedstock is STILL v0/meta.yaml (no
#    # recipe.yaml upstream, confirmed 404). meta.yaml kept alongside as a
#    # faithful mirror of the deployed v1.4.4 feedstock; this recipe.yaml is
#    # the proposed v1 migration. Delete meta.yaml only after the feedstock's
#    # own v0->v1 PR merges.
# build:
#    # entry_points kept (console_scripts shillelagh = shillelagh.console:main);
#    # the script is installed even though its console-extra runtime deps
#    # (PyYAML/prompt_toolkit/pygments/tabulate/appdirs) are NOT in base run,
#    # so no shillelagh --help test command (would need the console extra).
# requirements:
#  host:
#    # setuptools + setuptools-scm + wheel kept in host: pyscaffold project
#    # (setup.cfg + pyproject build-system requires setuptools_scm[toml]>=5,
#    # setuptools>=46.1.0, wheel). Dropped grayskull-redundant toml/pyscaffold
#    # host entries the deployed feedstock carried; setuptools_scm[toml] pulls
#    # toml transitively at build, pyscaffold is not a build backend.
#  run:
#    # G25 BASE-ONLY: shillelagh has MANY optional adapter extras (console,
#    # all, gsheetsapi, s3selectapi, dbtmetricflowapi, htmltableapi,
#    # pandasmemory, holidaysmemory, systemapi, generic{json,xml}api, ...).
#    # Shipped ONLY the 9 setup.cfg [options] install_requires base deps. The
#    # deployed feedstock OVER-FLATTENED the extras (appdirs/boto3/numpy/pandas/
#    # pyarrow/sqlglot/yarl/...) into run: — NOT mirrored here (that is the
#    # dependency-fix recorded in cfe-forge-recipe-updates-needed). The
#    # upstream importlib-metadata; python_version<"3.10" marker is dropped:
#    # at the conda-forge 3.10 floor stdlib importlib.metadata always exists,
#    # so the marker never fires (avoids a G35 per-Python run selector).
# context:
#    # python_min OMITTED: upstream requires-python >=3.9 clamps to the
#    # conda-forge 3.10 floor; let conda-forge-pinning supply python_min.
# tests:
#    # CFEP-25 triad [python_min.*, "*"]; top-level import shillelagh is a
#    # trivial version lookup, safe under base-only run.
####
