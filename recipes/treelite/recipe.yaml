# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: treelite
  version: "4.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/dmlc/treelite/archive/${{ version }}.tar.gz
  sha256: d267a3ff3f6c030f127a8066d3cae0545497de901185765635c045df6fa7059e
  patches:
    - 0001-Open-libtreelite.so-with-global-visibility.patch

build:
  number: 1
  skip: python_impl == 'pypy' and win

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - cmake >=3.14
    - ninja
    - fmt
    - rapidjson >=v1.1.0.post20240409
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip >=19.0
    - hatchling >=1.12.1
  run:
    - python
    - numpy
    - scipy
    - packaging

tests:
  - python:
      imports:
        - treelite
      pip_check: false
  - requirements:
      run:
        - setuptools

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Universal model exchange and serialization format for decision tree forests
  description: Universal model exchange and serialization format for decision tree forests
  homepage: https://github.com/dmlc/treelite
  repository: https://github.com/dmlc/treelite
  documentation: https://treelite.readthedocs.io/

extra:
  recipe-maintainers:
    - chyunsu3
