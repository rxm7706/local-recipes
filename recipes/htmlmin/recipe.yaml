# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.12"

package:
  name: htmlmin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/htmlmin/htmlmin-${{ version }}.tar.gz
  sha256: 50c1ef4630374a5d723900096a961cff426dff46b48f34d194a81bbe14eca178

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cgi

tests:
  - python:
      imports:
        - htmlmin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://htmlmin.readthedocs.io/en/latest/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An HTML Minifier
  description: |
    An HTML Minifier

extra:
  recipe-maintainers:
    - daf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: htmlmin
  cfe-upstream-registry: pypi
  cfe-upstream-name: htmlmin
  cfe-purls:
    - pkg:conda/htmlmin@${{ version }}?channel=conda-forge
    - pkg:pypi/htmlmin@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://htmlmin.readthedocs.io/en/latest/
  cfe-import-names: [htmlmin]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/htmlmin-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.12

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-17T11:00:51Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-17T11:00:51Z
  cfe-local-build-status: build-clean-test-blocked
  cfe-local-build-datetime: 2026-08-17T11:00:51Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
