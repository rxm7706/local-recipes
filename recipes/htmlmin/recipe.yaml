# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.12"

package:
  name: htmlmin
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/h/htmlmin/htmlmin-${{ version }}.tar.gz
  sha256: 50c1ef4630374a5d723900096a961cff426dff46b48f34d194a81bbe14eca178

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  python:
    entry_points:
      - htmlmin = htmlmin.command:main

requirements:
  host:
    - pip
    - python
    - setuptools
    - python >=3.6
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - htmlmin
      pip_check: false
  - script:
      - htmlmin --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A configurable HTML Minifier with safety features
  description: A configurable HTML Minifier with safety features
  homepage: https://htmlmin.readthedocs.org/en/latest/
  repository: https://github.com/mankyd/htmlmin/
  documentation: https://htmlmin.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - daf
