# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jsonrpcserver
  version: "5.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b15d3fd043ad0c40b2ff17f7df2ddaec2e880bb923b40d133939a107c97fde5c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - oslash <1
    - jsonschema <4

tests:
  - python:
      imports:
        - jsonrpcserver
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Process JSON-RPC requests in Python.
  homepage: https://github.com/explodinglabs/jsonrpcserver
  repository: https://github.com/explodinglabs/jsonrpcserver
  documentation: https://www.jsonrpcserver.com/

extra:
  recipe-maintainers:
    - bcb
