# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.16"

package:
  name: ssl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/ssl/ssl-${{ version }}.tar.gz
  sha256: ac21156fee6aee9eb8d765bbb16f5f49492d81ff4b22f7b8fc001d2251120930

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ssl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pypa/ssl
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: SSL wrapper for socket objects (2.3, 2.4, 2.5 compatible)
  description: |
    SSL wrapper for socket objects (2.3, 2.4, 2.5 compatible)

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
