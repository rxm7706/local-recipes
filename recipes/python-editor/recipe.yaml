# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.4"

package:
  name: python-editor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-editor/python-editor-${{ version }}.tar.gz
  sha256: 51fda6bcc5ddbbb7063b2af7509e43bd84bfc32a4ff71349ec7847713882327b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-editor

tests:
  - python:
      imports:
        - python_editor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fmoo/python-editor
  license: Apache-2.0
  license_file: LICENSE
  summary: Programmatically open an editor, capture the result.
  description: |
    Programmatically open an editor, capture the result.

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-editor
  cfe-upstream-registry: pypi
  cfe-upstream-name: python-editor
