# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.3"
  python_min: python_min | default("3.9")

package:
  name: graphene
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphene/graphene-${{ version }}.tar.gz
  sha256: 2a3786948ce75fe7e078443d37f609cbe5bb36ad8d6b828740ad3b95ed1a0aaa

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - graphql-core >=3.1,<3.3
    - graphql-relay >=3.1,<3.3
    - python-dateutil >=2.7.0,<3
    - python >=${{ python_min }}
    - typing_extensions >=4.7.1,<5

tests:
  - python:
      imports:
        - graphene
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      recipe:
        - fix_tests.py
      source:
        - graphene/tests
    requirements:
      run:
        - python ${{ python_min }}
        - pip
        - pytest >=8,<9
        - pytest-asyncio >=0.16,<2
        - pytest-benchmark >=4,<5
        - pytest-cov >=5,<6
        - pytest-mock >=3,<4
    script:
      - python fix_tests.py
      - cd graphene/tests
      - coverage run --source=graphene --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=48

about:
  license_file: LICENSE
  license: MIT
  summary: GraphQL Framework for Python
  homepage: https://graphene-python.org
  repository: https://github.com/graphql-python/graphene
  documentation: https://docs.graphene-python.org

extra:
  recipe-maintainers:
    - bollwyvl
    - carlodri
