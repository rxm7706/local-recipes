# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.4"

package:
  name: accesscontrol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/AccessControl/accesscontrol-${{ version }}.tar.gz
  sha256: d3558b40495c5fca98215ff0de78694f1f7ac7cfb444323e582cf5539c7f8aa0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - acquisition
    - authencoding
    - btrees
    - datetime
    - extensionclass
    - persistence
    - restrictedpython
    - transaction
    - zexceptions
    - zope.component
    - zope.configuration
    - zope.deferredimport
    - zope.interface
    - zope.publisher
    - zope.schema
    - zope.security
    - zope.testing

tests:
  - python:
      imports:
        - AccessControl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/AccessControl/
  license: ZPL-2.1
  license_file: LICENSE
  summary: Security framework for Zope
  description: |
    Security framework for Zope
  repository: https://github.com/zopefoundation/AccessControl

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
