# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.0"

package:
  name: unidecode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/Unidecode/Unidecode-${{ version }}.tar.gz
  sha256: ce35985008338b676573023acc382d62c264f307c8f7963733405add37ea2b23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - unidecode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Unidecode/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: ASCII transliterations of Unicode text
  description: |
    ASCII transliterations of Unicode text

extra:
  recipe-maintainers:
    - synapticarbors
    - xhochy

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: unidecode
  cfe-upstream-registry: pypi
  cfe-upstream-name: unidecode
  cfe-purls:
    - pkg:conda/unidecode@${{ version }}?channel=conda-forge
    - pkg:pypi/unidecode@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/Unidecode/
  cfe-import-names: [unidecode]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/unidecode-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T07:00:46Z
