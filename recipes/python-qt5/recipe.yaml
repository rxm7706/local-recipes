# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.0"

package:
  name: python-qt5
  version: ${{ version }}

source:
  url: https://github.com/pyqt/python-qt5/archive/refs/tags/${{ version }}.tar.gz
  sha256: ad95de18e1ccf7c1934dec100c0fe147d856ea843a50a9748dfb63d996bf9087

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - PyQt5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyqt/python-qt5
  license: GPLv3
  license_file: LICENSE
  summary: PyQt5
  description: |
    PyQt5

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-qt5
