# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: marshmallow-enum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/marshmallow-enum/marshmallow-enum-${{ version }}.tar.gz
  sha256: 38e697e11f45a8e64b4a1e664000897c659b60aa57bfa18d44e226a9920b6e58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - marshmallow

tests:
  - python:
      imports:
        - marshmallow_enum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/marshmallow-enum/
  license: MIT
  license_file: LICENSE
  summary: Enum field for Marshmallow
  description: |
    Enum field for Marshmallow

extra:
  recipe-maintainers:
    - xylar

