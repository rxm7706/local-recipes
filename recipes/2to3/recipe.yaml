# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: 2to3
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/2/2to3/2to3-${{ version }}.tar.gz
  sha256: 958bc212c928bbdcbc778b72528e0a39ae4ee8040eda6af6c3b5dd640c98ce6d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cmd_2to3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/2to3/
  license: MIT
  license_file: LICENSE
  summary: Adds the 2to3 command directly to entry_points.
  description: |
    Adds the 2to3 command directly to entry_points.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
