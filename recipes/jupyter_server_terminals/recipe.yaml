# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.4"

package:
  name: jupyter-server-terminals
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server-terminals/jupyter_server_terminals-${{ version }}.tar.gz
  sha256: bbda128ed41d0be9020349f9f1f2a4ab9952a73ed5f5ac9f1419794761fb87f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - pywinpty >=2.0.3
    - terminado >=0.8.3

tests:
  - python:
      imports:
        - jupyter_server_terminals
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://jupyter.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Jupyter Server Extension Providing Terminals.
  description: |
    A Jupyter Server Extension Providing Terminals.
  repository: https://github.com/jupyter-server/jupyter_server_terminals
  documentation: https://jupyter-server-terminals.readthedocs.io

extra:
  recipe-maintainers:
    - conda-forge/jupyter_server

