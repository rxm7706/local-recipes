# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.91.3"

package:
  name: gapic-google-cloud-logging-v2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gapic-google-cloud-logging-v2/gapic-google-cloud-logging-v2-${{ version }}.tar.gz
  sha256: b0b87bf56c50e4617fb539e5c36f2e286ba87c67a9b1ef5c9ec854d6d7b10023

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - google
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/googleapis
  license: Apache-2.0
  license_file: LICENSE
  summary: GAPIC library for the Stackdriver Logging API
  description: |
    GAPIC library for the Stackdriver Logging API

extra:
  recipe-maintainers:
    - rxm7706

