# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: zip-files
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zip-files/zip_files-${{ version }}.tar.gz
  sha256: fc797a78b92d44f9c5e740896771f12d41d240f47f8b185321d4a3766847dc97

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - zip_files
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/goerz/zip_files
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Command line utilities for creating zip files
  description: |
    Command line utilities for creating zip files

extra:
  recipe-maintainers:
    - rxm7706

