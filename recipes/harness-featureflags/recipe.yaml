# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.5"

package:
  name: harness-featureflags
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/harness-featureflags/harness_featureflags-${{ version }}.tar.gz
  sha256: 338a7753cb2657b2d586ff9581221cee12b01b3bf66548d7e2b03a333ae061c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.24.1
    - pyjwt >=2.4.0
    - attrs >=23.2.0
    - mmh3 >=3.0.0
    - requests >=2.31.0
    - tenacity >=8.2.0
    - typing_extensions >=4.7.1

tests:
  - python:
      imports:
        - featureflags
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/harness/ff-python-server-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: Feature flag server SDK for python
  description: |
    Feature flag server SDK for python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: harness-featureflags
