# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.0"

package:
  name: typeguard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typeguard/typeguard-${{ version }}.tar.gz
  sha256: e7414f09111317de3e335de92cd397c5c0ca00b1cc1676de12e1d444a79b3f21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - typeguard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/typeguard/
  license: MIT
  license_file: LICENSE
  summary: Run-time type checker for Python
  description: |
    Run-time type checker for Python
  documentation: https://typeguard.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - jan-janssen
    - itamarst
    - agronholm

#### CFE metadata AND comments
