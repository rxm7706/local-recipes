# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.4"
  sha256: 38c65e836b289ce14436b57ba35d3a87438218a1c0af535d89d648b1ed6b072e

package:
  name: sh
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sh/sh-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - poetry-core >=1.0.0a5
  run:
    - python >=${{ python_min }}
    - __unix

tests:
  - python:
      imports:
        - sh
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Python subprocess replacement
  homepage: https://sh.readthedocs.io/
  repository: https://github.com/amoffat/sh
  documentation: https://sh.readthedocs.io/

extra:
  recipe-maintainers:
    - jakirkham
