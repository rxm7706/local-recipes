# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: srsly
  version: ${{ version }}

source:
  url: https://github.com/explosion/srsly/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4490e70cf118c40e254285700a2aafc7a706aecedb749d8ddfa1271127b02640

build:
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cython
  run:
    - python
    - catalogue >=2.0.3,<2.1.0
    - cloudpickle >=3.1.2,<4
    - msgpack-python >=1.1,<2
    - ruamel.yaml >=0.18.16,<1
    - ujson >=5.11.0,<6

tests:
  - python:
      imports:
        - srsly
        - srsly.tests
      pip_check: true
  - requirements:
      run:
        - pytest
        - pytz
        - mock
        - numpy >=1.15.0
        - psutil
        - pip
    script:
      - python -m pytest --tb=native --pyargs srsly

about:
  license: MIT
  license_file: LICENSE
  summary: Modern high-performance serialization utilities for Python
  homepage: http://github.com/explosion/srsly
  repository: https://github.com/explosion/srsly
  documentation: https://github.com/explosion/srsly

extra:
  recipe-maintainers:
    - conda-forge/spacy
