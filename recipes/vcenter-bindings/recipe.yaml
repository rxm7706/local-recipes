# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: vcenter-bindings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vcenter-bindings/vcenter-bindings-${{ version }}.tar.gz
  sha256: a9ad584b46effd70fa9c2009e07eee152d811625efcc6b13eca336ae51213f19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vcenter_bindings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/vcenter-bindings/
  license: MIT
  license_file: LICENSE
  summary: Python bindings for vCenter
  description: |
    Python bindings for vCenter

extra:
  recipe-maintainers:
    - rxm7706

