# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.1"

package:
  name: zope.schema
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.schema/zope_schema-${{ version }}.tar.gz
  sha256: 2d9faa7f91a7bf09fcab2c039d9182fcc9ce7042dc77e18d3df277904aee0948

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - zope.interface >=5.0.0
    - zope.event

tests:
  - python:
      imports:
        - zope.schema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.schema
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: zope.interface extension for defining data schemas
  description: |
    zope.interface extension for defining data schemas

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zope.schema
  cfe-upstream-registry: pypi
  cfe-upstream-name: zope.schema
  cfe-purls:
    - pkg:conda/zope.schema@${{ version }}?channel=conda-forge
    - pkg:pypi/zope.schema@${{ version }}
  cfe-upstream-repo: https://github.com/zopefoundation/zope.schema
  cfe-upstream-homepage: https://github.com/zopefoundation/zope.schema
  cfe-import-names: [zope.schema]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
