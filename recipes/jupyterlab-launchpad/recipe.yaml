# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyterlab-launchpad
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterlab-launchpad/jupyterlab_launchpad-${{ version }}.tar.gz
  sha256: 545f30665b8dd985c2ca2cd3b293f7923f1090f553520e375097dd3ee5fcc1aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
    - hatch-jupyter-builder
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - jupyter_server >=2.0.1,<3

tests:
- python:
    imports:
      - jupyterlab_launchpad
    pip_check: true
    python_version: ${{ python_min }}.*

about:
  summary: A redesigned JupyterLab launcher
  homepage: https://github.com/nebari-dev/jupyterlab-launchpad
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - style/icons/md/LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
