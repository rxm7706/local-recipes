    - pkg:pypi/pynessie@${{ version }}
  cfe-upstream-repo: https://github.com/projectnessie/nessie
  cfe-upstream-homepage: https://github.com/projectnessie/nessie
  cfe-import-names: [pynessie]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
