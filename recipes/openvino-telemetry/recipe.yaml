# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2025.2.0"

package:
  name: openvino-telemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openvino-telemetry/openvino_telemetry-${{ version }}.tar.gz
  sha256: 8bf8127218e51e99547bf38b8fb85a8b31c9bf96e6f3a82eb0b3b6a34155977c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - utils

tests:
  - python:
      imports:
        - utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openvinotoolkit/telemetry
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenVINO™ Telemetry package for sending statistics with user's consent, used in combination with other OpenVINO™ packages.
  description: |
    OpenVINO™ Telemetry package for sending statistics with user's consent, used in combination with other OpenVINO™ packages.

extra:
  recipe-maintainers:
    - popovaan

