# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.6"

package:
  name: statsmodels
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/statsmodels/statsmodels-${{ version }}.tar.gz
  sha256: 4d17873d3e607d398b85126cd4ed7aad89e4e9d89fc744cdab1af3189a996c2a

build:
  number: 0
  skip: python_impl == "pypy"
  skip: true  # [python_impl == "pypy"]
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython >=3.0.10,<4
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - cython >=3.0.10,<4
    # Do not add any constraint on numpy here to use global pinning
    - numpy
    - scipy >=1.13.0
    - pandas >=1.4
    - patsy >=0.5.6
    - setuptools_scm >=8.0.0,<9
  run:
    - numpy <3,>=1.22.3
    - python
    - scipy !=1.9.2,>=1.8
    - pandas !=2.1.0,>=1.4
    - patsy >=0.5.6
    - packaging >=21.3

tests:
  - python:
      imports:
        - statsmodels
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: INSTALL.txt
  summary: Statistical computations and models for use with SciPy
  homepage: https://www.statsmodels.org
  repository: https://github.com/statsmodels/statsmodels
  documentation: https://www.statsmodels.org/stable/

extra:
  recipe-maintainers:
    - tomaugspurger
    - croth1
    - ocefpaf
    - bashtage
