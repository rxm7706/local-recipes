# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: llama-index-vector-stores-pinecone
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-vector-stores-pinecone/llama_index_vector_stores_pinecone-${{ version }}.tar.gz
  sha256: 2328c5ef99a85bf3b1c2709f5086671c44077824332ef81be96a0f9221771815

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core <0.15,>=0.13.0
    - pinecone <10.0.0,>=7.0.0

tests:
  - python:
      imports:
        - llama_index.vector_stores.pinecone
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-vector-stores-pinecone/
  license: MIT
  license_file: LICENSE
  summary: llama-index vector_stores pinecone integration
  description: |
    llama-index vector_stores pinecone integration

extra:
  recipe-maintainers:
    - rxm7706

