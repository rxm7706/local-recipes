#    # release exactly. sha256 computed from the live tarball (G61: a
#    # commit-archive sha can drift when GitHub re-gzips — a TAG archive is the
#    # stabler form, but re-verify on every bump).
#    # target_directory: src keeps the generated library_licenses/ a sibling of
#    # the source tree rather than inside it (mcp-grafana pattern), so
