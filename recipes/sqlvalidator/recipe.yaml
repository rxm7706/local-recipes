# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.20"

package:
  name: sqlvalidator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlvalidator/sqlvalidator-${{ version }}.tar.gz
  sha256: 6f399be1bf0ba54a17ad16f6818836c169d17c16306f4cfa6fc883f13b1705fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlvalidator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/David-Wobrock/sqlvalidator
  license: MIT
  license_file: LICENSE
  summary: SQL queries formatting, syntactic and semantic validation
  description: |
    SQL queries formatting, syntactic and semantic validation

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sqlvalidator
  cfe-upstream-registry: pypi
