# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "8.90.0"

package:
  name: openrewrite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openrewrite/openrewrite-${{ version }}.tar.gz
  sha256: a3ecc7c5dc4f06f745c7f8b05504900e7013a05da5d617b2f3b3465d4658a606

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - more-itertools >=10.0.0
    - ty-types >=0.0.71
    - parso <0.8,>=0.7.1

tests:
  - python:
      imports:
        - rewrite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openrewrite/rewrite
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenRewrite automated refactoring for Python.
  description: |
    OpenRewrite automated refactoring for Python.
  repository: https://github.com/openrewrite/rewrite.git
  documentation: https://docs.openrewrite.org

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: openrewrite
