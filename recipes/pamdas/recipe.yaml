# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: pamdas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pamdas/pamdas-${{ version }}.tar.gz
  sha256: 6e3b270c37ce0db93849f90c9ebee05168903aa3b36ac7f37e4320d3007cdbd7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pamdas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pamdas/
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

