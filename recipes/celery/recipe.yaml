# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: celery
  version: "5.6.3"
  # celery 5.6 depends on kombu >=5.6, which requires Python >=3.10
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/celery-${{ version }}.tar.gz
  sha256: 177006bd2054b882e9f01be59abd8529e88879ef50d7918a7050c5a9f4e12912

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - celery = celery.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - billiard >=4.2.1,<5.0
    - kombu >=5.6.0
    - vine >=5.1.0,<6.0
    - click >=8.1.2,<9.0
    - click-didyoumean >=0.3.0
    - click-repl >=0.2.0
    - click-plugins >=1.1.1
    - python-dateutil >=2.8.2
    - tzlocal
    - exceptiongroup >=1.3.0

tests:
  - python:
      imports:
        - celery
        - celery.app
        - celery.app.task
        - celery.apps
        - celery.backends
        - celery.bin
        - celery.concurrency
        - celery.contrib
        - celery.events
        - celery.fixups
        - celery.loaders
        - celery.utils
        - celery.utils.dispatch
        - celery.worker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - celery --version
      - celery --help
      - celery worker --help
      - celery beat --help
      - celery multi help
      - celery shell --help

about:
  license_file: LICENSE
  license: BSD-3-Clause
  summary: Distributed Task Queue
  homepage: http://celeryproject.org
  repository: https://github.com/celery/celery
  documentation: http://docs.celeryproject.org/en/latest/index.html

extra:
  recipe-maintainers:
    - achimgaedke
    - moritzwilksch
    - chrisburr
    - kwilcox
    - sodre

