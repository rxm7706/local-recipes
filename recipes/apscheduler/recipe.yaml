# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.11.3"

package:
  name: apscheduler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/APScheduler/apscheduler-${{ version }}.tar.gz
  sha256: cd2fcc9330039a81a5893472ad49facf23a6d5604cbe1d918c835c6de7834d5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=6.4
  run:
    - python >=${{ python_min }}
    - tzlocal >=3.0
    - backports.zoneinfo

tests:
  - python:
      imports:
        - apscheduler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/APScheduler/
  license: MIT
  license_file: LICENSE.txt
  summary: In-process task scheduler with Cron-like capabilities
  description: |
    In-process task scheduler with Cron-like capabilities
  documentation: https://apscheduler.readthedocs.io/en/3.x/

extra:
  recipe-maintainers:
    - ddunwoody
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: apscheduler
  cfe-upstream-registry: pypi
  cfe-upstream-name: apscheduler
