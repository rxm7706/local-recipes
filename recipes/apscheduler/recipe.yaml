    - pkg:pypi/apscheduler@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://pypi.org/project/APScheduler/
  cfe-import-names: [apscheduler]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/apscheduler-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
