# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mock
  version: "5.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mock-${{ version }}.tar.gz
  sha256: 4e460e818629b4b173f32d08bf30d3af8123afbb8e04bb5707a1fd4799e503f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mock
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Rolling backport of unittest.mock for all Pythons
  license: BSD-2-Clause
  license_file: LICENSE.txt
  homepage: http://mock.readthedocs.org/en/latest/
  repository: https://github.com/testing-cabal/mock

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - xylar
