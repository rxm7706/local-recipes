# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.2.0"

package:
  name: mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mock/mock-${{ version }}.tar.gz
  sha256: 4e460e818629b4b173f32d08bf30d3af8123afbb8e04bb5707a1fd4799e503f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://mock.readthedocs.org/en/latest/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Rolling backport of unittest.mock for all Pythons
  description: |
    Rolling backport of unittest.mock for all Pythons
  repository: https://github.com/testing-cabal/mock

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - xylar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mock
  cfe-upstream-registry: pypi
  cfe-upstream-name: mock
  cfe-purls:
    - pkg:conda/mock@${{ version }}?channel=conda-forge
    - pkg:pypi/mock@${{ version }}
  cfe-upstream-repo: https://github.com/testing-cabal/mock
  cfe-upstream-homepage: http://mock.readthedocs.org/en/latest/
  cfe-import-names: [mock]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/mock-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-5.2.0

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T01:42:06Z
