# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: optuna
  version: "4.9.0"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b322e5cbdf1655fb84c37646c4a7a1f391de1b47806bbe222e015825d0a82b87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - optuna = optuna.cli:main

requirements:
  host:
    - pip
    - python 3.9.*
  run:
    - alembic >=1.5.0
    - colorlog
    - numpy
    - packaging >=20.0
    - python >=${{ python_min }}
    - sqlalchemy >=1.4.2
    - tqdm
    - PyYAML

tests:
  - python:
      imports:
        - optuna
      pip_check: false
  - script:
      - optuna --help

about:
  license: MIT
  license_file: LICENSE
  summary: A hyperparameter optimization framework
  homepage: https://optuna.org/
  repository: https://github.com/optuna/optuna
  documentation: https://optuna.readthedocs.io/

extra:
  recipe-maintainers:
    - eukaryo
    - y0z
    - nabenabe0928
    - c-bata
    - contramundum53
    - g-votte
    - himkt
    - HideakiImamura
    - hvy
    - iwiwi
