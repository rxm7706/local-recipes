# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.9.0"

package:
  name: optuna
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/optuna/optuna-${{ version }}.tar.gz
  sha256: b322e5cbdf1655fb84c37646c4a7a1f391de1b47806bbe222e015825d0a82b87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.1.0
    - wheel
  run:
    - python >=${{ python_min }}
    - alembic >=1.5.0
    - colorlog
    - numpy
    - packaging >=20.0
    - sqlalchemy >=1.4.2
    - tqdm
    - pyyaml

tests:
  - python:
      imports:
        - optuna
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://optuna.org/
  license: MIT
  license_file: LICENSE
  summary: A hyperparameter optimization framework
  description: |
    A hyperparameter optimization framework
  documentation: https://optuna.readthedocs.io

extra:
  recipe-maintainers:
    - eukaryo
    - y0z
    - nabenabe0928
    - c-bata
    - contramundum53
    - g-votte
    - himkt
    - HideakiImamura
    - hvy
    - iwiwi
    - knshnb
    - not522
    - sile
    - smly
    - toshihikoyanase
    - ytsmiling

