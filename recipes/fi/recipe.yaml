# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.2"

package:
  name: fi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fi/fi-${{ version }}.tar.gz
  sha256: 7f2549e381f000d3f7d5561b72ea5e149c712f8402cc8ce6f91afbe80f44fae8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-efficiency/fi
  license: MIT
  license_file: LICENSE
  summary: The file open library the government doesn't want you to know about
  description: |
    The file open library the government doesn't want you to know about

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: fi
  cfe-upstream-registry: pypi
  cfe-upstream-name: fi
  cfe-purls:
    - pkg:conda/fi@${{ version }}?channel=conda-forge
    - pkg:pypi/fi@${{ version }}
  cfe-upstream-repo: https://github.com/python-efficiency/fi
  cfe-upstream-homepage: https://github.com/python-efficiency/fi
  cfe-import-names: [fi]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:56:19Z
