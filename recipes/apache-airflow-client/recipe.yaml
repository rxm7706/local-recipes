# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: apache-airflow-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-client/apache_airflow_client-${{ version }}.tar.gz
  sha256: b89761a62f5629d0554ad4a49f6b8bca9b6e452bcb6698fb720362e2d19097ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.30.1
    - packaging ==26.2
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    - tomli ==2.4.1
  run:
    - python >=${{ python_min }}
    - pydantic >=2.11.0
    - python-dateutil
    - urllib3 !=2.6.0,>=2.1.0

tests:
  - python:
      imports:
        - airflow_client.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://airflow.apache.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Apache Airflow API (Stable)
  description: |
    Apache Airflow API (Stable)
  repository: https://github.com/apache/airflow-client-python
  documentation: https://airflow.apache.org/docs/apache-airflow/stable/stable-rest-api-ref.html

extra:
  recipe-maintainers:
    - rxm7706

