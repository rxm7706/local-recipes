# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: sphinxcontrib-jsmath
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-jsmath/sphinxcontrib-jsmath-${{ version }}.tar.gz
  sha256: a9925e4a4587247ed2191a22df5f6970656cb8ca2bd6284309578f2153e0c4b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sphinxcontrib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://sphinx-doc.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A sphinx extension which renders display math in HTML via JavaScript
  description: |
    A sphinx extension which renders display math in HTML via JavaScript

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - ocefpaf

