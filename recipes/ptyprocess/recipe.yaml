# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: ptyprocess
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ptyprocess/ptyprocess-${{ version }}.tar.gz
  sha256: 5c5d0a3b48ceee0b48485e0c26037c0acd7d29765ca3fbb5cb3831d347423220

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ptyprocess
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pexpect/ptyprocess
  license: ISC
  license_file: LICENSE
  summary: Run a subprocess in a pseudo terminal
  description: |
    Run a subprocess in a pseudo terminal

extra:
  recipe-maintainers:
    - pelson
    - takluyver
    - ocefpaf

