# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: promptlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/promptlib/promptlib-${{ version }}.tar.gz
  sha256: b2aee79f39253241bdba09f997a89f23f497a655629580a2d78deead1a7426da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - promptlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/promptlib/
  license: MIT
  license_file: LICENSE
  summary: Prompt library
  description: |
    Prompt library

extra:
  recipe-maintainers:
    - rxm7706

