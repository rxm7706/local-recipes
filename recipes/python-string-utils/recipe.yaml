# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: python-string-utils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-string-utils/python-string-utils-${{ version }}.tar.gz
  sha256: dcf9060b03f07647c0a603408dc8b03f807f3b54a05c6e19eb14460256fac0cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - string_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/daveoncode/python-string-utils
  license: MIT
  license_file: LICENSE
  summary: Utility functions for strings validation and manipulation.
  description: |
    Utility functions for strings validation and manipulation.

extra:
  recipe-maintainers:
    - pb01ka

