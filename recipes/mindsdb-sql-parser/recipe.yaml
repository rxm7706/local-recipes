# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.8"

package:
  name: mindsdb-sql-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mindsdb-sql-parser/mindsdb_sql_parser-${{ version }}.tar.gz
  sha256: 2c077a92883c11a6ccfe0f7095e5e575d2c58a4fdaa53fa7867a0d9c4ad563e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sly
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mindsdb/mindsdb_sql_parser
  license: MIT
  license_file: LICENSE
  summary: Mindsdb SQL parser
  description: |
    Mindsdb SQL parser

extra:
  recipe-maintainers:
    - rxm7706

