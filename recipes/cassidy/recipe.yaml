# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: cassidy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cassidy/cassidy-${{ version }}.tar.gz
  sha256: d51a0f4210a614f6b092e25fe29c981de0d9b769c42129b43708e8f847e22bee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cassidy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cassidy/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: String case conversion, identification and parsing
  description: |
    String case conversion, identification and parsing

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cassidy
  cfe-upstream-registry: pypi
  cfe-upstream-name: cassidy
