# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: StringZilla
  version: "5.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ashvardanian/StringZilla/archive/v${{ version }}.tar.gz
  sha256: 95b0f91a013a1113fd6dc5585f39a31f2fe2321a0ea0ed64334e57f0383f4b56
  #patches:
  #- patches/0001-fix-build-option.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sz_split=cli.split:main
      - sz_wc=cli.wc:main

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: python
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=42
    - wheel
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - cli
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - sz_split --help
      - sz_wc --help

about:
  summary: SIMD-accelerated string search, sort, hashes, fingerprints, & edit distances
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ashvardanian/StringZilla

extra:
  recipe-maintainers:
    - mukhery
    - pb01ka
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: stringzilla
  cfe-upstream-registry: github
  cfe-upstream-name: ashvardanian/StringZilla
