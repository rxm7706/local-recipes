    - pkg:github/ashvardanian/stringzilla@v${{ version }}
    - pkg:pypi/stringzilla@${{ version }}
  cfe-upstream-repo: https://github.com/ashvardanian/StringZilla
  cfe-upstream-homepage: https://github.com/ashvardanian/StringZilla
  cfe-import-names: [cli]
  cfe-source-kind: github-tag
