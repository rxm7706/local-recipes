# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: redis-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/redis-cli/redis-cli-${{ version }}.tar.gz
  sha256: 6be46d8e6ae638fec27cb425d499b7f25b1592402c74d5d17f5b85b5e7f988a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - redis-py >=4

tests:
  - python:
      imports:
        - redis_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/will4j/redis-cli-py
  license: MIT
  license_file: LICENSE
  summary: A Redis Python Client
  description: |
    A Redis Python Client

extra:
  recipe-maintainers:
    - rxm7706

