# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: hurry.filesize
  version: "0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hurry.filesize-${{ version }}.tar.gz
  sha256: f5368329adbef86accd3bc9490522340bb79260455ae89b1a42c10f63801b9a6

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - hurry
        - hurry.filesize
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Python library for human readable file sizes (or anything sized in bytes)
  homepage: https://pypi.org/project/hurry.filesize/

extra:
  recipe-maintainers:
    - iamthebot
    - rxm7706
    - raivivek
