# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9"

package:
  name: hurry.filesize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hurry.filesize/hurry.filesize-${{ version }}.tar.gz
  sha256: f5368329adbef86accd3bc9490522340bb79260455ae89b1a42c10f63801b9a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hurry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A simple Python library for human readable file sizes (or anything sized in bytes).
  description: |
    A simple Python library for human readable file sizes (or anything sized in bytes).

extra:
  recipe-maintainers:
    - iamthebot
    - rxm7706
    - raivivek

#### CFE metadata AND comments
