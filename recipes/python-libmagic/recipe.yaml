# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"

package:
  name: python-libmagic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-libmagic/python-libmagic-${{ version }}.tar.gz
  sha256: fd42e14fca5f346e36b6a8e984f0798f02f38e5eb1b4868424b1480293baacb1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cffi

tests:
  - python:
      imports:
        - magic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dveselov/python-libmagic
  license: MIT
  license_file: LICENSE
  summary: Python bindings to libmagic
  description: |
    Python bindings to libmagic

extra:
  recipe-maintainers:
    - rxm7706

