# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: sphinx-collections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-collections/sphinx_collections-${{ version }}.tar.gz
  sha256: 42506b0ec456b70a63be1641a84b33399503f3233bfdc1d181775c7475466b85

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4,<4
  run:
    - python >=${{ python_min }}
    - sphinx >=4.0
    - jinja2 >=3.0
    - gitpython >=3.1
    - packaging >=20.0

tests:
  - python:
      imports:
        - sphinx_collections
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/useblocks/sphinx-collections
  license: MIT
  license_file: LICENSE
  summary: Sphinx collections extension for mapping directories and services as document folders
  description: |
    Sphinx collections extension for mapping directories and services as document folders
  repository: https://github.com/useblocks/sphinx-collections
  documentation: https://sphinx-collections.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
