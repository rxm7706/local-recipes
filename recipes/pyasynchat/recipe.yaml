# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyasynchat
  version: "1.0.5"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 36665473ae730dac51e6d7dad70f8295962120c830ab692f0a31efba32687e24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.12.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pyasyncore >=1.0.5

tests:
  - python:
      imports:
        - asynchat
      pip_check: true

about:
  summary: Make asynchat available for Python 3.12 onwards
  license: PSF-2.0
  license_file: LICENSE
  homepage: https://github.com/simonrob/pyasynchat

extra:
  recipe-maintainers:
    - anderslindho
