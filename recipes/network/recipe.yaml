# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: network
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/network/network-${{ version }}.tar.gz
  sha256: 786b171895c3ecaaf05948c29e206ab99285f328f799c3bbc5e22a2805bfc27f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - network
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.raspberrypi.org/learning/networking-lessons/
  license: MIT
  license_file: LICENSE
  summary: A very simple networking library written by David Whale (@whaleygeek).
  description: |
    A very simple networking library written by David Whale (@whaleygeek).

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
