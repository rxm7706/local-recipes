# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: flightsql-dbapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flightsql-dbapi/flightsql_dbapi-${{ version }}.tar.gz
  sha256: b6de4d81fa31e7357507c3d493be31c4e68672dd1b4a2a4554463ac4450e5851

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling <=1.18.0
  run:
    - python >=${{ python_min }}
    - protobuf >=4.21.0
    - pyarrow >=14.0.1
    - sqlalchemy <2.0

tests:
  - python:
      imports:
        - flightsql
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/influxdata/flightsql-dbapi
  license: Apache-2.0
  license_file: LICENSE
  summary: DB API 2 and SQLAlchemy adapter for Flight SQL
  description: |
    DB API 2 and SQLAlchemy adapter for Flight SQL

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
