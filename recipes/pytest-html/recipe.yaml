# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: pytest-html
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-html/pytest_html-${{ version }}.tar.gz
  sha256: b6a88cba507500d8709959201e2e757d3941e859fd17cfd4ed87b16fc0c67912

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatch-vcs >=0.3
    - hatchling >=1.13
  run:
    - python >=${{ python_min }}
    - jinja2 >=3
    - pytest-metadata >=2
    - pytest >=7

tests:
  - python:
      imports:
        - pytest_html
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pytest-dev/pytest-html
  license: MPL-2.0
  license_file: LICENSE
  summary: pytest plugin for generating HTML reports
  description: |
    pytest plugin for generating HTML reports
  repository: https://github.com/pytest-dev/pytest-html

extra:
  recipe-maintainers:
    - 0xbe7a
    - birdsarah
    - davehunt
    - nicoddemus
    - dbast

