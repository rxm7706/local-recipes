# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: mimeparse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mimeparse/mimeparse-${{ version }}.tar.gz
  sha256: REPLACE_SHA256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mimeparse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://code.google.com/p/mimeparse/
  license: MIT
  license_file: LICENSE
  summary: A module provides basic functions for parsing mime-type names and matching them against a list of media-ranges.
  description: |
    A module provides basic functions for parsing mime-type names and matching them against a list of media-ranges.

extra:
  recipe-maintainers:
    - rxm7706

