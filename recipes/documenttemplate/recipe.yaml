# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3"

package:
  name: documenttemplate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/DocumentTemplate/documenttemplate-${{ version }}.tar.gz
  sha256: 677b3005139046e55a169552ff136062267990e87ce4c10eebc1c99c27d406de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=78.1.1,<81
    - wheel
  run:
    - python >=${{ python_min }}
    - accesscontrol >=4.0a5
    - acquisition
    - extensionclass >=4.1a1
    - restrictedpython >=4.0a1
    - roman
    - zexceptions
    - zope.sequencesort
    - zope.structuredtext

tests:
  - python:
      imports:
        - TreeDisplay
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/DocumentTemplate/
  license: ZPL-2.1
  license_file: LICENSE
  summary: Document Templating Markup Language (DTML)
  description: |
    Document Templating Markup Language (DTML)
  repository: https://github.com/zopefoundation/DocumentTemplate
  documentation: https://zope.readthedocs.io/en/latest/zopebook/index.html

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
