# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: genie.libs.clean
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/g/genie.libs.clean/genie_libs_clean-26.7-py3-none-any.whl
  sha256: 37512c3ddf618599f7362d867e932a261112d4c9ee5495ea02039ddbf6aa7a21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - wheel
    - genie

tests:
  - python:
      imports:
        - genie.libs.clean
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats
  license: Apache-2.0
  license_file: LICENSE
  summary: Genie Library for device clean support
  description: |
    Genie Library for device clean support

extra:
  recipe-maintainers:
    - rxm7706

