# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"

package:
  name: userprovided
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/userprovided/userprovided-${{ version }}.tar.gz
  sha256: 256f8bd38cafa9a5705ee2e274a7e5f9f435dc9d0bcd101ebbadd1c278e36e52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - userprovided
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RuedigerVoigt/userprovided
  license: Apache-2.0
  license_file: LICENSE
  summary: "Validate, normalize, and convert user input: URLs, emails, dates, hashes, parameters — pure stdlib, no dependencies"
  description: |
    Validate, normalize, and convert user input: URLs, emails, dates, hashes, parameters — pure stdlib, no dependencies
  repository: https://github.com/RuedigerVoigt/userprovided
  documentation: https://github.com/RuedigerVoigt/userprovided#readme

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: userprovided
  cfe-upstream-registry: pypi
  cfe-upstream-name: userprovided
  cfe-purls:
    - pkg:conda/userprovided@${{ version }}?channel=conda-forge
    - pkg:pypi/userprovided@${{ version }}
  cfe-upstream-repo: https://github.com/RuedigerVoigt/userprovided
  cfe-upstream-homepage: https://github.com/RuedigerVoigt/userprovided
  cfe-import-names: [userprovided]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
