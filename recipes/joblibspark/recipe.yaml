# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: joblibspark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/joblibspark/joblibspark-${{ version }}.tar.gz
  sha256: 928a11a829c08cd60097ccc3ad27b1bcbd8d426f7fd26069afe07fbb06951e81

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - joblib >=0.14

tests:
  - python:
      imports:
        - joblibspark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/joblib/joblib-spark
  license: Apache-2.0
  license_file: LICENSE
  summary: Joblib Apache Spark Backend
  description: |
    Joblib Apache Spark Backend

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: joblibspark
  cfe-upstream-registry: pypi
  cfe-upstream-name: joblibspark
  cfe-purls:
    - pkg:conda/joblibspark@${{ version }}?channel=conda-forge
    - pkg:pypi/joblibspark@${{ version }}
  cfe-upstream-repo: https://github.com/joblib/joblib-spark
  cfe-upstream-homepage: https://github.com/joblib/joblib-spark
  cfe-import-names: [joblibspark]
