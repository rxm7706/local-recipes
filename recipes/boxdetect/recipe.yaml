# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: boxdetect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/boxdetect/boxdetect-${{ version }}.tar.gz
  sha256: 07bef139176c2291bb252a0d1489ef71fca89ac5776318567c823731f0d1ae43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - opencv
    - numpy
    - imutils
    - pyyaml
    - scikit-learn

tests:
  - python:
      imports:
        - boxdetect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/karolzak/boxdetect
  license: MIT
  license_file: LICENSE
  summary: boxdetect is a Python package based on OpenCV which allows you to easily detect rectangular shapes like characters boxes on scanned forms.
  description: |
    boxdetect is a Python package based on OpenCV which allows you to easily detect rectangular shapes like characters boxes on scanned forms.

extra:
  recipe-maintainers:
    - rxm7706

