# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.18.2"

package:
  name: eel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/Eel/eel-${{ version }}.tar.gz
  sha256: 0f70b0f8aa2da57859b35d448ea89ad2102d56b206f8500f130df069e9df2c3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bottle
    - bottle-websocket
    - future
    - pyparsing
    - typing_extensions
    - importlib_resources

tests:
  - python:
      imports:
        - eel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-eel/Eel
  license: MIT
  license_file: LICENSE
  summary: For little HTML GUI applications, with easy Python/JS interop
  description: |
    For little HTML GUI applications, with easy Python/JS interop

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: eel
  cfe-upstream-registry: pypi
  cfe-upstream-name: Eel
  cfe-purls:
    - pkg:conda/eel@${{ version }}?channel=conda-forge
    - pkg:pypi/eel@${{ version }}
  cfe-upstream-repo: https://github.com/python-eel/Eel
  cfe-upstream-homepage: https://github.com/python-eel/Eel
  cfe-import-names: [eel]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
