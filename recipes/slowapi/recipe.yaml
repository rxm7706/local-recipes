# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.10"

package:
  name: slowapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/slowapi/slowapi-${{ version }}.tar.gz
  sha256: d320d5bc04d9f171a77fb16700faf3036d85b00f420f22924c8a225f95bd14f9

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - limits >=2.3
    - starlette
  run_constraints:
    - redis-py >=3.4.1

tests:
  - python:
      imports:
        - slowapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import slowapi, redis; from limits.storage import storage_from_string; storage_from_string('memory://'); print('redis-py', redis.__version__, 'co-installed OK')"
    requirements:
      run:
        - python
        - redis-py >=8

about:
  homepage: https://github.com/laurents/slowapi
  summary: A rate limiting extension for Starlette and Fastapi
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mediocretech

#### CFE metadata AND comments
