# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.22.1"

package:
  name: aiosqlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiosqlite/aiosqlite-${{ version }}.tar.gz
  sha256: 043e0bd78d32888c0a9ca90fc788b38796843360c855a7262a532813133a0650

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiosqlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/aiosqlite/
  license: MIT
  license_file: LICENSE
  summary: asyncio bridge to the standard sqlite3 module
  description: |
    asyncio bridge to the standard sqlite3 module
  documentation: https://aiosqlite.omnilib.dev

extra:
  recipe-maintainers:
    - flaviomartins
    - carlodri

