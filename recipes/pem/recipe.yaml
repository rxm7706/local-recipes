# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "23.1.0"

package:
  name: pem
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pem/pem-${{ version }}.tar.gz
  sha256: 06503ff2441a111f853ce4e8b9eb9d5fedb488ebdbf560115d3dd53a1b4afc73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pem
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pem/
  license: MIT
  license_file: LICENSE
  summary: PEM file parsing in Python.
  description: |
    PEM file parsing in Python.
  repository: https://github.com/hynek/pem
  documentation: https://pem.readthedocs.io/

extra:
  recipe-maintainers:
    - millsks

#### CFE metadata AND comments
