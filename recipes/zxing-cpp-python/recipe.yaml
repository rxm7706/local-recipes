# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: zxing-cpp-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zxing-cpp/zxing_cpp-${{ version }}.tar.gz
  sha256: 1051a521b21a9fe206702ad4186aeb195154e3e1badcd99576d030723f36382b

build:
  number: 2
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: not win
      then:
        - make
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - python
        - scikit-build-core
        - nanobind
  host:
    - python
    - scikit-build-core >=0.12
    - nanobind >=2.11.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - zxingcpp
      pip_check: true

about:
  homepage: https://github.com/zxing-cpp/zxing-cpp/
  summary: Python bindings for the zxing-cpp barcode library
  documentation: https://github.com/zxing-cpp/zxing-cpp/blob/master/wrappers/python/README.md
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - carlodri

