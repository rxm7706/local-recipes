# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: dateparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dateparser/dateparser-${{ version }}.tar.gz
  sha256: bed2a3fd9bad8f2fb2d72b57748bada260b3a9349a264c22ffc23c3249d7049a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.7.0
    - pytz >=2024.2
    - regex >=2024.9.11
    - tzlocal >=0.2

tests:
  - python:
      imports:
        - dateparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/dateparser/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Date parsing library designed to parse dates from HTML pages
  description: |
    Date parsing library designed to parse dates from HTML pages
  repository: https://github.com/scrapinghub/dateparser

extra:
  recipe-maintainers:
    - tacaswell
    - ocefpaf

#### CFE metadata AND comments
