# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yarg
  version: "0.1.9"
  sha256: 55695bf4d1e3e7f756496c36a69ba32c40d18f821e38f61d028f6049e5e15911

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  build:
    - python
    - setuptools
  run:
    - python
    - requests

tests:
  - python:
      imports:
        - tests
        - yarg
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: A semi hard Cornish cheese, also queries PyPI (PyPI client)
  homepage: https://yarg.readthedocs.org/
  repository: https://github.com/kura/yarg
  documentation: https://yarg.readthedocs.io/

extra:
  recipe-maintainers:
    - proinsias
