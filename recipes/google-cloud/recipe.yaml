# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.34.0"

package:
  name: google-cloud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud/google-cloud-${{ version }}.tar.gz
  sha256: 01430187cf56df10a9ba775dd547393185d4b40741db0ea5889301f8e7a9d5d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - google_cloud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudPlatform/google-cloud-python
  license: Apache-2.0
  license_file: LICENSE
  summary: API Client library for Google Cloud
  description: |
    API Client library for Google Cloud

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
