# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.13"

package:
  name: ipdb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ipdb/ipdb-${{ version }}.tar.gz
  sha256: e3ac6018ef05126d442af680aad863006ec19d02290561ac88b8b1c0b0cfc726

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipython
    - toml
    - decorator
    - pathlib
    - tomli

tests:
  - python:
      imports:
        - ipdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gotcha/ipdb
  license: BSD-3-Clause
  license_file: LICENSE
  summary: IPython-enabled pdb
  description: |
    IPython-enabled pdb

extra:
  recipe-maintainers:
    - vamega

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ipdb
  cfe-upstream-registry: pypi
  cfe-upstream-name: ipdb
  cfe-purls:
    - pkg:conda/ipdb@${{ version }}?channel=conda-forge
    - pkg:pypi/ipdb@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/gotcha/ipdb
  cfe-import-names: [ipdb]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ipdb-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.13.13

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

