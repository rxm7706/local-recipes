    - pkg:pypi/gspread@${{ version }}
  cfe-upstream-repo: https://github.com/burnash/gspread
  cfe-upstream-homepage: https://pypi.org/project/gspread/
  cfe-import-names: [gspread]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/gspread-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-6.2.1

  cfe-forge-blocker-list:
