# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.5"

package:
  name: panel-graphic-walker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panel-graphic-walker/panel_graphic_walker-${{ version }}.tar.gz
  sha256: ae89a4a22f2db53b0bc48a2c86b95813277e3209b73b39edd306a0c8d2dc9cb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - panel >=1.6.1
    - packaging
    - narwhals
  run:
    - python >=${{ python_min }}
    - narwhals
    - panel >=1.6.1
    - if: linux
      then:
        - jedi-language-server

tests:
  - python:
      imports:
        - panel_gwalker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/panel-extensions/panel-graphic-walker
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A project providing a Graphic Walker Pane for use with HoloViz Panel.
  description: |
    A project providing a Graphic Walker Pane for use with HoloViz Panel.
  repository: https://github.com/panel-extensions/panel-graphic-walker

extra:
  recipe-maintainers:
    - philippjfr

