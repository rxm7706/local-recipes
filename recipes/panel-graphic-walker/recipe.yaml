# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: panel-graphic-walker
  version: "0.6.5"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/panel_graphic_walker/panel_graphic_walker-${{ version }}.tar.gz
  sha256: ae89a4a22f2db53b0bc48a2c86b95813277e3209b73b39edd306a0c8d2dc9cb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - hatchling
    - hatch-vcs
    - panel >=1.6.1
    - packaging
    - narwhals
    - pip
    - nodejs >=18
    - esbuild
  run:
    - python >=${{ python_min }}
    - panel >=1.6.1
    - narwhals

tests:
  - python:
      imports:
        - panel_gwalker
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A project providing a Graphic Walker Pane for use with HoloViz Panel.
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/panel-extensions/panel-graphic-walker

extra:
  recipe-maintainers:
    - philippjfr
