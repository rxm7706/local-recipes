# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "22.2.0.1"

package:
  name: cplex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/c/cplex/cplex-22.2.0.1-cp310-cp310-macosx_11_0_arm64.whl
  sha256: 31fecb466566dfea449f096cf0d74de69f316156aab3199115cad17d50fa4e92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cplex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.ibm.com/products/ilog-cplex-optimization-studio
  license: Proprietary
  license_file: LICENSE
  summary: A Python interface to the CPLEX Callable Library, Community Edition.
  description: |
    A Python interface to the CPLEX Callable Library, Community Edition.

extra:
  recipe-maintainers:
    - rxm7706

