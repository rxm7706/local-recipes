# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: cron-converter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cron-converter/cron_converter-${{ version }}.tar.gz
  sha256: 53eb26be3eb2e0f206a6e227ca0c19b3807b44a24b39f4eda3718703e6474f4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil

tests:
  - python:
      imports:
        - cron_converter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Sonic0/cron-converter
  license: MIT
  license_file: LICENSE
  summary: Cron string parser and scheduler for Python
  description: |
    Cron string parser and scheduler for Python

extra:
  recipe-maintainers:
    - rxm7706

