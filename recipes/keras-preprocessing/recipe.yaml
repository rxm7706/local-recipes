# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: keras-preprocessing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/Keras-Preprocessing/Keras_Preprocessing-${{ version }}.tar.gz
  sha256: add82567c50c8bc648c14195bf544a5ce7c1f76761536956c3d2978970179ef3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - six

tests:
  - python:
      imports:
        - keras_preprocessing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/keras-team/keras-preprocessing
  license: MIT
  license_file: LICENSE
  summary: Easy data preprocessing and data augmentation for deep learning models
  description: |
    Easy data preprocessing and data augmentation for deep learning models

extra:
  recipe-maintainers:
    - CurtLH
    - h-vetinari

