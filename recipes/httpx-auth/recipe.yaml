# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.1"

package:
  name: httpx-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpx-auth/httpx_auth-${{ version }}.tar.gz
  sha256: 27b5a6022ad1b41a303b8737fa2e3e4bce6bbbe7ab67fed0b261359be62e0434

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - httpx ==0.28.*

tests:
  - python:
      imports:
        - httpx_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/httpx-auth/
  license: MIT
  license_file: LICENSE
  summary: Authentication for HTTPX
  description: |
    Authentication for HTTPX
  documentation: https://colin-b.github.io/httpx_auth/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
