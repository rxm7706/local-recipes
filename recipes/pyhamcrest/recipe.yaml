# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: pyhamcrest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyHamcrest/pyhamcrest-${{ version }}.tar.gz
  sha256: c6acbec0923d0cb7e72c22af1926f3e7c97b8e8d69fc7498eabacaf7c975bd9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hamcrest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/PyHamcrest/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Hamcrest framework for matcher objects
  description: |
    Hamcrest framework for matcher objects
  repository: https://github.com/hamcrest/PyHamcrest/

extra:
  recipe-maintainers:
    - duncanwp
    - stuertz

#### CFE metadata AND comments
