# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: paginate
  version: "0.5.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/paginate-${{ version }}.tar.gz
  sha256: 22bd083ab41e1a8b4f3690544afb2c60c25e5c9a63a30fa2f483f6c60c8e5945

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - paginate
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Divides large result sets into pages for easier browsing
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Signum/paginate

extra:
  recipe-maintainers:
    - thewchan
