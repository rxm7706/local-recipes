# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: bayketinymce-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bayketinymce-django/bayketinymce-django-${{ version }}.tar.gz
  sha256: c75ad93c6b798c4acfae1b80162583095fe8ebd1780ef9fc8478710d6147a7da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tinymce
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.bayke.shop
  license: MIT
  license_file: LICENSE
  summary: 一个简单的tinymce富文本编辑器的django第三方包！
  description: |
    一个简单的tinymce富文本编辑器的django第三方包！

extra:
  recipe-maintainers:
    - rxm7706

