# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: yamlordereddictloader
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7f30f0b99ea3f877f7cb340c570921fa9d639b7f69cba18be051e27f8de2080e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - pip
    - python
  run:
    - python
    - pyyaml

tests:
  - python:
      imports:
        - yamlordereddictloader
      pip_check: false

about:
  license: MIT
  license_file: LICENSE.txt
  summary: YAML loader and dump for PyYAML allowing to keep keys order.
  homepage: https://github.com/fmenabe/python-yamlordereddictloader

extra:
  recipe-maintainers:
    - PertuyF
    - bgruening
