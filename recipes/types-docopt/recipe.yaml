# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.11.20241107"

package:
  name: types-docopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-docopt/types-docopt-${{ version }}.tar.gz
  sha256: 61c44d03ac4895b5be8d40ba5cc80ce52a63d3d76777ad14669e94b5e9edf7a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - types_docopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  license: Apache-2.0
  license_file: LICENSE
  summary: Typing stubs for docopt
  description: |
    Typing stubs for docopt
  repository: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy

