    - pkg:pypi/schedule@${{ version }}
  cfe-upstream-repo: https://github.com/dbader/schedule.git
  cfe-upstream-homepage: https://github.com/dbader/schedule
  cfe-import-names: [schedule]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/schedule-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.2.2

  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T12:09:53Z
