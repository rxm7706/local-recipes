# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.2"

package:
  name: schedule
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/schedule/schedule-${{ version }}.tar.gz
  sha256: 15fe9c75fe5fd9b9627f3f19cc0ef1420508f9f9a46f45cd0769ef75ede5f0b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - schedule
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dbader/schedule
  license: MIT
  license_file: LICENSE.txt
  summary: Job scheduling for humans.
  description: |
    Job scheduling for humans.
  repository: https://github.com/dbader/schedule.git
  documentation: https://schedule.readthedocs.io

extra:
  recipe-maintainers:
    - tschoonj

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: schedule
  cfe-upstream-registry: pypi
  cfe-upstream-name: schedule
  cfe-purls:
