# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.1"

package:
  name: pythest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pythest/pythest-${{ version }}.tar.gz
  sha256: f4cd717a7aa95146b877dc0e6bbd23c34d7fba5da83ab7669ae80d8c71dacada

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pythest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bemaudettest/pythest
  license: MIT
  license_file: LICENSE
  summary: Bonjour
  description: |
    Bonjour

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pythest
  cfe-upstream-registry: pypi
  cfe-upstream-name: pythest
