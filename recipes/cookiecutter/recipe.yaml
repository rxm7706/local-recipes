# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.7.1"

package:
  name: cookiecutter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cookiecutter/cookiecutter-${{ version }}.tar.gz
  sha256: ca7bb7bc8c6ff441fbf53921b5537668000e38d56e28d763a1b73975c66c6138

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - binaryornot >=0.4.4
    - jinja2 <4.0.0,>=2.7
    - click <9.0.0,>=7.0
    - pyyaml >=5.3.1
    - python-slugify >=4.0.0
    - requests >=2.23.0
    - arrow
    - rich

tests:
  - python:
      imports:
        - cookiecutter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cookiecutter/cookiecutter
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A command-line utility that creates projects from project templates, e.g. creating a Python package project from a Python package project template.
  description: |
    A command-line utility that creates projects from project templates, e.g. creating a Python package project from a Python package project template.
  documentation: https://cookiecutter.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
    - cadair
    - jakirkham
    - pydanny

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cookiecutter
  cfe-upstream-registry: pypi
  cfe-upstream-name: cookiecutter
  cfe-purls:
    - pkg:conda/cookiecutter@${{ version }}?channel=conda-forge
    - pkg:pypi/cookiecutter@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/cookiecutter/cookiecutter
  cfe-import-names: [cookiecutter]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cookiecutter-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T07:17:24Z
