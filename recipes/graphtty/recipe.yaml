# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.8"
  python_min: "3.11"

package:
  name: graphtty
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphtty/graphtty-${{ version }}.tar.gz
  sha256: 069cd84764cc64d414928451071fc9c97c05becbf564c2f0278691a6451a8240

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - graphtty
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/graphtty/
  license: MIT
  license_file: LICENSE
  summary: Turn any directed graph into colored ASCII art for your terminal
  description: |
    Turn any directed graph into colored ASCII art for your terminal
  repository: https://github.com/uipath/graphtty
  documentation: https://uipath.github.io/uipath-python/

extra:
  recipe-maintainers:
    - rxm7706

