# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: behave-pandas
  version: ${{ version }}

source:
  url: https://github.com/clembou/behave-pandas/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 00341aaf8f9cdf1b2d9a9fb2a3e11fe2286c274623d26f0f8e8dc9f06c16f375

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - behave
    - pandas
    - tabulate

tests:
  - python:
      imports:
        - behave_pandas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/clembou/behave-pandas
  license: MIT
  license_file: LICENSE
  summary: Provides helper functions to help converting behave tables into pandas dataframes and vice versa.
  description: |
    Provides helper functions to help converting behave tables into pandas dataframes and vice versa.

extra:
  recipe-maintainers:

