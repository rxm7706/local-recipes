# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opencensus-ext-azure
  version: "1.1.15"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8d108af15875ea3c52238646fba924c3ba9fbfaaf1fd0d350707dc5b7880ade7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.12.0,<2.0.0
    - azure-identity >=1.5.0,<2.0.0
    - opencensus >=0.11.4,<1.0.0
    - psutil >=5.6.3
    - requests >=2.19.0

tests:
  - python:
      imports:
        - opencensus.ext.azure
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenCensus Azure Monitor Exporters
  description: |
    OpenCensus Azure Monitor Exporters. The Azure Monitor Log Handler allows
    you to export Python logs to Azure Monitor.
  homepage: https://github.com/census-instrumentation/opencensus-python
  repository: https://github.com/census-instrumentation/opencensus-python/tree/master/contrib/opencensus-ext-azure
  documentation: https://github.com/census-instrumentation/opencensus-python/tree/master/contrib/opencensus-ext-azure/examples

extra:
  recipe-maintainers:
    - basnijholt
    - krisevans
    - dhirschfeld
    - soapy1
