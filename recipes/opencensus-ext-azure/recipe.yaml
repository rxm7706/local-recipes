# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.15"

package:
  name: opencensus-ext-azure
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opencensus-ext-azure/opencensus_ext_azure-${{ version }}.tar.gz
  sha256: 8d108af15875ea3c52238646fba924c3ba9fbfaaf1fd0d350707dc5b7880ade7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core <2.0.0,>=1.12.0
    - azure-identity <2.0.0,>=1.5.0
    - opencensus <1.0.0,>=0.11.4
    - psutil >=5.6.3
    - requests >=2.19.0

tests:
  - python:
      imports:
        - opencensus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/census-instrumentation/opencensus-python/tree/master/contrib/opencensus-ext-azure
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenCensus Azure Monitor Exporter
  description: |
    OpenCensus Azure Monitor Exporter

extra:
  recipe-maintainers:
    - basnijholt
    - krisevans
    - dhirschfeld
    - soapy1

#### CFE metadata AND comments
