# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"

package:
  name: backports.tempfile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/backports.tempfile/backports.tempfile-${{ version }}.tar.gz
  sha256: 1c648c452e8770d759bdc5a5e2431209be70d25484e1be24876cf2168722c762

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - backports
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pjdelport/backports.tempfile
  license: PSF-2.0
  license_file: LICENSE
  summary: Backport of new features in Python's tempfile module
  description: |
    Backport of new features in Python's tempfile module

extra:
  recipe-maintainers:
    - mvdbeek

