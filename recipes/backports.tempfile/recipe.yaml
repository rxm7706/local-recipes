# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: backports.tempfile
  version: "1.0"
  sha256: 1c648c452e8770d759bdc5a5e2431209be70d25484e1be24876cf2168722c762

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - python
    - pip
    - setuptools_scm
  run:
    - python
    - backports.weakref

tests:
  - python:
      imports:
        - backports.tempfile
      pip_check: false

about:
  license: PSF-2.0
  license_file: LICENSE
  summary: Backports of new features in Python's tempfile module
  description: |
    This package provides backports of new features in Python’s tempfile module under the backports namespace.


  homepage: https://github.com/pjdelport/backports.tempfile

extra:
  recipe-maintainers:
    - mvdbeek
