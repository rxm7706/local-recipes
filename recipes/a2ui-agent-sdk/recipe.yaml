# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: a2ui-agent-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/a2ui-agent-sdk/a2ui_agent_sdk-${{ version }}.tar.gz
  sha256: c350e1ed640c494ae9d6bc3d08444eb598545f3f184f95e776b0947ec03405c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - jsonschema
    - pyink >=24.10.0
    - antlr4-tools >=0.2.1
    - antlr4-python3-runtime >=4.13.0,<4.14.0
  run:
    - python >=${{ python_min }}
    - a2a-sdk <0.4.0,>=0.3.0
    - a2ui-core <0.2.0,>=0.1.1
    - antlr4-python3-runtime <4.14.0,>=4.13.0
    - google-adk >=1.28.1
    - google-genai >=1.27.0
    - jsonschema >=4.0.0

tests:
  - python:
      imports:
        - a2ui.adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/a2ui-agent-sdk/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A2UI Agent SDK
  description: |
    A2UI Agent SDK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
