# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: shadowcopy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shadowcopy/shadowcopy-${{ version }}.tar.gz
  sha256: ed89817dda065f893607a04c0b7d6b3b34c3507a4711f441111a4bcb1b1826c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - wmi

tests:
  - python:
      imports:
        - shadowcopy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/csm10495/shadowcopy
  license: MIT
  license_file: LICENSE
  summary: A project for shadowcopy
  description: |
    A project for shadowcopy
  documentation: https://csm10495.github.io/shadowcopy

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
