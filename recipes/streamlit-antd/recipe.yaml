# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.3"

package:
  name: streamlit-antd
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-antd/streamlit-antd-${{ version }}.tar.gz
  sha256: e3c9bc41b2b3036e630720cb85b52c1b178c49bd35e62db9fefd59adb8e10ac1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - streamlit_antd
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pragmatic-streamlit/streamlit-antd
  license: MIT
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

