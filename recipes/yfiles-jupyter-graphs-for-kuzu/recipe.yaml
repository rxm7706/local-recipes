# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: yfiles-jupyter-graphs-for-kuzu
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yfiles-jupyter-graphs-for-kuzu/yfiles_jupyter_graphs_for_kuzu-${{ version }}.tar.gz
  sha256: 396f3a967d0bfc6fc5a98ec44a4b737572cab6fe4377db4eccd9bf7f45e3f4b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - yfiles-jupyter-graphs >=1.10.9

tests:
  - python:
      imports:
        - yfiles_jupyter_graphs_for_kuzu
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/yfiles-jupyter-graphs-for-kuzu/
  license: MIT
  license_file: LICENSE
  summary: A Kuzu graph visualization package that uses the yfiles-jupyter-graphs widget
  description: |
    A Kuzu graph visualization package that uses the yfiles-jupyter-graphs widget
  repository: https://github.com/yWorks/yfiles-jupyter-graphs-for-kuzu.git
  documentation: https://github.com/yWorks/yfiles-jupyter-graphs-for-kuzu/

extra:
  recipe-maintainers:
    - rxm7706

