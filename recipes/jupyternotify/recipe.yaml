# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.15"

package:
  name: jupyternotify
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyternotify/jupyternotify-${{ version }}.tar.gz
  sha256: 843509e7c3e3369f221a87af310165d51122e0ee8ed1c4ce0cdc34338e17b73a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pkg-resources
    - IPython

tests:
  - python:
      imports:
        - jupyternotify
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/shoprunner/jupyter-notify
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A Jupyter Notebook %%magic for Browser Notifications of Cell Completion
  description: |
    A Jupyter Notebook %%magic for Browser Notifications of Cell Completion

extra:
  recipe-maintainers:
    - djsutherland

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jupyternotify
  cfe-upstream-registry: pypi
  cfe-upstream-name: jupyternotify
