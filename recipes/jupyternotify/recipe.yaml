    - pkg:pypi/jupyternotify@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/shoprunner/jupyter-notify
  cfe-import-names: [jupyternotify]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/jupyternotify-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
