# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18.1"

package:
  name: swat
  version: ${{ version }}

source:
  url: https://github.com/sassoftware/python-swat/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8b0c3a16f5a294f9e02f41b2269747f89415b2379210a7bae7d02056091a5921

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas >=0.16.0
    - pytz
    - six >=1.9.0
    - requests
    - urllib3

tests:
  - python:
      imports:
        - swat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/sassoftware/python-swat/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: SAS Scripting Wrapper for Analytics Transfer (SWAT)
  description: |
    SAS Scripting Wrapper for Analytics Transfer (SWAT)

extra:
  recipe-maintainers:
    - EllaBootQC

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: swat
  cfe-upstream-registry: pypi
  cfe-upstream-name: swat
  cfe-purls:
    - pkg:conda/swat@${{ version }}?channel=conda-forge
    - pkg:pypi/swat@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/sassoftware/python-swat/
  cfe-import-names: [swat]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/swat-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-1.18.1

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T06:16:12Z
