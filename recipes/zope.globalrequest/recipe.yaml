# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0"

package:
  name: zope.globalrequest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.globalrequest/zope_globalrequest-${{ version }}.tar.gz
  sha256: 7a17403b4d4b56a030609bac28b0833a091711db9367f1956d9148bc73a23439

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.publisher
    - zope.traversing

tests:
  - python:
      imports:
        - zope.globalrequest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.globalrequest
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Global way of retrieving the currently active request.
  description: |
    Global way of retrieving the currently active request.

extra:
  recipe-maintainers:
    - rxm7706

