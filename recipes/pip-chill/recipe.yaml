# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.5"

package:
  name: pip-chill
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-chill/pip_chill-${{ version }}.tar.gz
  sha256: e79bc514abfe144f2ef52290f59677d279cb05b4084fa9f814bbe5cc0ea04c1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pip_chill
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rbanffy/pip-chill
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Like `pip freeze` but lists only the packages that are not dependencies of installed packages.
  description: |
    Like `pip freeze` but lists only the packages that are not dependencies of installed packages.

extra:
  recipe-maintainers:
    - rxm7706

