# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: flask-mailman
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Mailman/flask_mailman-${{ version }}.tar.gz
  sha256: 3bc1ffffbd655ba9e468946a5f02e9cc772594fe1e98ace636c2f6717419eefa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - flask >=1.0

tests:
  - python:
      imports:
        - flask_mailman
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/waynerv/flask-mailman
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Porting Django's email implementation to your Flask applications.
  description: |
    Porting Django's email implementation to your Flask applications.
  repository: https://github.com/waynerv/flask-mailman

extra:
  recipe-maintainers:
    - thewchan

