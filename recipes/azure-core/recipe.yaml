# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.41.0"

package:
  name: azure-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-core/azure_core-${{ version }}.tar.gz
  sha256: f46ff5dfcd230f25cf1c19e8a34b8dc08a337b2503e268bb600a16c00db8ad5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - requests >=2.21.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/azure-core/
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Core Library for Python
  description: |
    Microsoft Azure Core Library for Python
  repository: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/core/azure-core

extra:
  recipe-maintainers:
    - TomAugspurger
    - marcelotrevisani

