# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.1"

package:
  name: pathvalidate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathvalidate/pathvalidate-${{ version }}.tar.gz
  sha256: b18c07212bfead624345bb8e1d6141cdcf15a39736994ea0b94035ad2b1ba177

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathvalidate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/thombashi/pathvalidate
  license: MIT
  license_file: LICENSE
  summary: pathvalidate is a Python library to sanitize/validate a string such as filenames/file-paths/etc.
  description: |
    pathvalidate is a Python library to sanitize/validate a string such as filenames/file-paths/etc.
  repository: https://github.com/thombashi/pathvalidate
  documentation: https://pathvalidate.rtfd.io/

extra:
  recipe-maintainers:
    - basnijholt

