# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pathvalidate
  version: "3.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pathvalidate-${{ version }}.tar.gz
  sha256: b18c07212bfead624345bb8e1d6141cdcf15a39736994ea0b94035ad2b1ba177

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=64
    - setuptools-scm
    - releasecmd
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathvalidate
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: pathvalidate is a Python library to sanitize/validate a string such as filenames/file-paths/etc.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/thombashi/pathvalidate
  repository: https://github.com/thombashi/pathvalidate

extra:
  recipe-maintainers:
    - basnijholt
