# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.3"

package:
  name: cufflinks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cufflinks/cufflinks-${{ version }}.tar.gz
  sha256: 48c1b3406dc030004121966489eebc5518cea70fd4e3f16379b491328501a644

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cufflinks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/santosjorge/cufflinks
  license: MIT
  license_file: LICENSE
  summary: Productivity Tools for Plotly + Pandas
  description: |
    Productivity Tools for Plotly + Pandas

extra:
  recipe-maintainers:
    - dhirschfeld
    - cshaley
    - timkpaine

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cufflinks-py
  cfe-upstream-registry: pypi
  cfe-upstream-name: cufflinks
  cfe-purls:
    - pkg:conda/cufflinks-py@${{ version }}?channel=conda-forge
    - pkg:pypi/cufflinks@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/santosjorge/cufflinks
  cfe-import-names: [cufflinks]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/cufflinks-py-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.17.3

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-17T07:24:27Z
