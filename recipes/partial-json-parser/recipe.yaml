# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: partial-json-parser
  version: 0.2.1.1.post7

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/partial_json_parser-${{ version }}.tar.gz
  sha256: 86590e1ba6bcb6739a2dfc17d2323f028cb5884f4c6ce23db376999132c9a922

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - json-playground = partial_json_parser.playground:main

requirements:
  host:
    - python ${{ python_min }}
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - partial_json_parser
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Parse partial JSON generated by LLM
  license: MIT
  license_file: LICENSE
  homepage: https://promplate.dev/partial-json-parser

extra:
  recipe-maintainers:
    - maresb
