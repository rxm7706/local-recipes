# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: sortedcollections
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sortedcollections/sortedcollections-${{ version }}.tar.gz
  sha256: d8e9609d6c580a16a1224a3dc8965789e03ebc4c3e5ffd05ada54a2fed5dcacd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sortedcontainers

tests:
  - python:
      imports:
        - sortedcollections
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.grantjenks.com/docs/sortedcollections/
  license: Apache-2.0
  license_file: LICENSE
  summary: Python Sorted Collections
  description: |
    Python Sorted Collections

extra:
  recipe-maintainers:
    - grantjenks
    - mrocklin
    - nehaljwani

