# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sqlite-history
  version: "0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlite-history-${{ version }}.tar.gz
  sha256: d8d95776d6c633e4dbfd48ac59eca0f4f760bc2fcc63a2131c65efcffbdf5621

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlite_history
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Track changes to SQLite tables using triggers
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/sqlite-history

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
