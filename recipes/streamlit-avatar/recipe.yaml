# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: streamlit-avatar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-avatar/streamlit_avatar-${{ version }}.tar.gz
  sha256: 023893bd80db5a923d397fc64d27c7a972107da4f0bea0feb99a32f9363f2691

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=0.63

tests:
  - python:
      imports:
        - streamlit_avatar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ppspps824/streamlit_avatar
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Component to display avatar icon in Streamlit
  description: |
    Component to display avatar icon in Streamlit

extra:
  recipe-maintainers:
    - rxm7706

