# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.4"

package:
  name: chuk-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-mcp/chuk_mcp-${{ version }}.tar.gz
  sha256: 7729b158113c782c15e8c3f56d2b7594392a37af186342eb6d0f705c47588eff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - anyio >=4.9.0
    - httpx >=0.28.1
    - typing_extensions <5.0.0,>=4.7.1

tests:
  - python:
      imports:
        - chuk_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chuk-mcp/
  license: Apache-2.0
  license_file: LICENSE
  summary: Model Context Protocol client and server library with optional Pydantic support
  description: |
    Model Context Protocol client and server library with optional Pydantic support

extra:
  recipe-maintainers:
    - rxm7706

