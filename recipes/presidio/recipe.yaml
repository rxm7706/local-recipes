# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.364"

package:
  name: presidio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/presidio/presidio-${{ version }}.tar.gz
  sha256: 867dd1398e72c52fac96fd5fa0848159529ecc8da93bbcc0d5efab2d6f12dca0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - presidio-analyzer <3.0.0,>=2.2.0
    - presidio-anonymizer <3.0.0,>=2.2.0

tests:
  - python:
      imports:
        - presidio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/data-privacy-stack/presidio
  license: MIT
  license_file: LICENSE
  summary: Presidio - Data Protection and De-identification SDK
  description: |
    Presidio - Data Protection and De-identification SDK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
