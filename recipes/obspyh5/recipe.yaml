# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: obspyh5
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/obspyh5/obspyh5-${{ version }}.tar.gz
  sha256: ae7e1714b69f03fa39714dbe89adfefd41a7227cfaefb22db9c3e5cae63a55b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - obspy
    - numpy

tests:
  - python:
      imports:
        - obspyh5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/trichter/obspyh5
  license: MIT
  license_file: LICENSE
  summary: HDF5 write/read support for obspy
  description: |
    HDF5 write/read support for obspy

extra:
  recipe-maintainers:
    - rxm7706

