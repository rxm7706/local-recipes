# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: wdapy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wdapy/wdapy-${{ version }}.tar.gz
  sha256: 6712f62eed59721e3b7833647739dd0609d04ed9dcb656dc8bc7b6250e2f0e33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - deprecated >=1.2.6
    - pillow
    - retry
    - construct >=2
    - pydantic >=2.5.1

tests:
  - python:
      imports:
        - wdapy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/openatx/wdapy
  license: MIT
  license_file: LICENSE
  summary: Python Client for Facebook WebDriverAgent
  description: |
    Python Client for Facebook WebDriverAgent

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wdapy
