# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bc-detect-secrets
  version: "1.5.49"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 74412fde2f617b61f28312f0106a9f8902be80db0084fd3d7c88f673ee707d7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - detect-secrets = detect_secrets.main:main
      - detect-secrets-hook = detect_secrets.pre_commit_hook:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml
    - requests
    - unidiff

tests:
  - python:
      imports:
        - detect_secrets
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - detect-secrets --help
      - detect-secrets-hook --help

about:
  summary: Tool for detecting secrets in the codebase
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/bridgecrewio/detect-secrets

extra:
  recipe-maintainers:
    - borchero
    - nick-harmening
