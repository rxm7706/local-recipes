# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: postman
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/postman/postman-${{ version }}.tar.gz
  sha256: 7fbb526cc54eb76a684614c7917fe719068de830cf79a8d038d1011c59810e8c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - postman
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: UNKNOWN
  license: MIT
  license_file: LICENSE
  summary: Command line for Amazon SES
  description: |
    Command line for Amazon SES

extra:
  recipe-maintainers:
    - rxm7706

