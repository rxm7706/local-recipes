# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.4"

package:
  name: pgserver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pgserver/pgserver-0.1.4-cp310-cp310-macosx_10_9_x86_64.whl
  sha256: 79041d91d4d28e3a6a75dd472ee395e2da036ffd7f77cd826052697532291646

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fasteners >=0.19
    - platformdirs >=4.0.0
    - psutil >=5.9.0

tests:
  - python:
      imports:
        - pgserver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pgserver/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Self-contained postgres server for your python applications
  description: |
    Self-contained postgres server for your python applications

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
