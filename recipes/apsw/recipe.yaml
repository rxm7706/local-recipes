# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.53.4.0"
  sqlite_version: "3.53.4"

package:
  name: apsw
  version: ${{ version|replace("-", ".") }}

source:
  url: https://github.com/rogerbinns/apsw/releases/download/${{ version }}/apsw-${{ version }}.zip
  sha256: c5be7f898a40aecff4b621d969f37c0c554c80515a0adfaca842c89875a1321e

build:
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - libsqlite ==${{ sqlite_version }}
  run:
    - python
    - libsqlite ==${{ sqlite_version }}

tests:
  - python:
      imports:
        - apsw
      pip_check: true

about:
  license: any-OSI
  license_file: LICENSE
  summary: APSW stands for Another Python SQLite Wrapper.
  description: |
    APSW is a Python wrapper for the SQLite embedded relational database
    engine. It focuses translating between the complete SQLite C API and
    Python's C API. It is recommended to use the builtin sqlite3 module, unless
    you want SQLite specific functionality. The documentation has a section on
    the differences between APSW and sqlite3. APSW supports CPython 3.6
    onwards:
  homepage: https://github.com/rogerbinns/apsw/
  repository: https://github.com/rogerbinns/apsw
  documentation: https://rogerbinns.github.io/apsw/pysqlite.html

extra:
  recipe-maintainers:
    - stuertz
    - mikemhenry
