# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.1"

package:
  name: autoapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/autoapi/autoapi-${{ version }}.tar.gz
  sha256: 4003b17599020652d0738dc1c426d0abf2f58f8a1821f5500816043210b3d1d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lib.autoapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://autoapi.readthedocs.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Automatic API reference documentation generation for Sphinx inspired by Doxygen
  description: |
    Automatic API reference documentation generation for Sphinx inspired by Doxygen

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: autoapi
  cfe-upstream-registry: pypi
  cfe-upstream-name: autoapi
