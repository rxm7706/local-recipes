# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.4"

package:
  name: python-docx-replace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-docx-replace/python-docx-replace-${{ version }}.tar.gz
  sha256: 5365e5dfdc1a56e1154b23340c8fc715f4eb6df6de4d0364153be13e7014fb4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-docx

tests:
  - python:
      imports:
        - python_docx_replace
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ivanbicalho/python-docx-replace
  license: MIT
  license_file: LICENSE
  summary: Replace words and remove blocks inside a Word document without losing format
  description: |
    Replace words and remove blocks inside a Word document without losing format

extra:
  recipe-maintainers:
    - rxm7706

