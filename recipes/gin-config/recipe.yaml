# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gin-config
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/gin-config-${{ version }}.tar.gz
  sha256: 0c6ea5026ded927c8c93c990b01c695257c1df446e45e549a158cfbc79e19ed6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6

tests:
  - python:
      imports:
        - gin
        - gin.testdata
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: "Gin-Config: A lightweight configuration library for Python"
  homepage: https://github.com/google/gin-config
  repository: https://github.com/google/gin-config
  documentation: https://github.com/google/gin-config/blob/master/docs/index.md

extra:
  recipe-maintainers:
    - mxr-conda
