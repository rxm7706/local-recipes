# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.0"

package:
  name: gin-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gin-config/gin-config-${{ version }}.tar.gz
  sha256: 0c6ea5026ded927c8c93c990b01c695257c1df446e45e549a158cfbc79e19ed6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/gin-config
  license: Apache-2.0
  license_file: LICENSE
  summary: "Gin-Config: A lightweight configuration library for Python"
  description: |
    Gin-Config: A lightweight configuration library for Python
  repository: https://github.com/google/gin-config
  documentation: https://github.com/google/gin-config/docs

extra:
  recipe-maintainers:
    - mxr-conda

#### CFE metadata AND comments
