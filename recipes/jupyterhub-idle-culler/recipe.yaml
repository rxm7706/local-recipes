# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: jupyterhub-idle-culler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterhub-idle-culler/jupyterhub_idle_culler-${{ version }}.tar.gz
  sha256: a377454a115eb04da9beec5f8e9b20023f94f0259c12f1a590c44122d4bebd0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - packaging
    - python-dateutil
    - tornado
    - traitlets

tests:
  - python:
      imports:
        - jupyterhub_idle_culler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jupyterhub-idle-culler/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: JupyterHub Python repository template
  description: |
    JupyterHub Python repository template
  repository: https://github.com/jupyterhub/jupyterhub-idle-culler
  documentation: https://github.com/jupyterhub/jupyterhub-idle-culler#readme

extra:
  recipe-maintainers:
    - ktaletsk
    - minrk
    - consideRatio

