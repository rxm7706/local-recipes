# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: uiautodev
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/uiautodev/uiautodev-${{ version }}.tar.gz
  sha256: 003da1b1df3c72ec39240d57fe50833b98567e23bad3c77799030b8ec6d95c54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }}
    - pillow >=9
    - adbutils <3,>=2.8.10
    - click <9.0.0,>=8.1.7
    - construct
    - fastapi <1,>=0.115.12
    - httpx >=0.28.1
    - lxml >=6.0.2
    - pydantic <3.0,>=2.6
    - pygments >=2
    - python-multipart >=0.0.18
    - rich
    - uiautomator2 <4,>=3.2.0
    - uvicorn >=0.33.0
    - wdapy <1,>0.2.2
    - websockets >=10.4

tests:
  - python:
      imports:
        - uiautodev
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://uiauto.dev
  license: MIT
  license_file: LICENSE
  summary: Mobile UI Automation, include UI hierarchy inspector, script recorder
  description: |
    Mobile UI Automation, include UI hierarchy inspector, script recorder

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
