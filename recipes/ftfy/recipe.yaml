    - pkg:pypi/ftfy@${{ version }}
  cfe-upstream-repo: https://github.com/rspeer/python-ftfy
  cfe-upstream-homepage: https://ftfy.readthedocs.io/en/latest/
  cfe-import-names: [ftfy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ftfy-feedstock
  cfe-forge-recipe-updates-needed: 
