# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.1"

package:
  name: ftfy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/ftfy/ftfy-${{ version }}.tar.gz
  sha256: 9b3c3d90f84fb267fe64d375a07b7f8912d817cf86009ae134aa03e1819506ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - wcwidth

tests:
  - python:
      imports:
        - ftfy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ftfy.readthedocs.io/en/latest/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Fixes mojibake and other problems with Unicode, after the fact
  description: |
    Fixes mojibake and other problems with Unicode, after the fact
  repository: https://github.com/rspeer/python-ftfy
  documentation: https://ftfy.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - rmax
    - FernandezMathieu
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ftfy
  cfe-upstream-registry: pypi
