# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: streamlit-js-eval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-js-eval/streamlit_js_eval-${{ version }}.tar.gz
  sha256: 9e2b2005e3e8a4971d222488a02c880b7b93c8951393ff7f97419ded914498e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.0.0

tests:
  - python:
      imports:
        - streamlit_js_eval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aghasemi/streamlit_js_eval
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A custom Streamlit component to evaluate arbitrary Javascript expressions.
  description: |
    A custom Streamlit component to evaluate arbitrary Javascript expressions.

extra:
  recipe-maintainers:
    - pb01ka
    - mgorny

#### CFE metadata AND comments
