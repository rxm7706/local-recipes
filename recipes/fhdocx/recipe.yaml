# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: fhdocx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fhdocx/fhdocx-${{ version }}.tar.gz
  sha256: c3b8bf50b6080e96a8a820c7f3908a0ad5d5c4ef8aa490cc358f37000c888812

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - lxml <7.0.0,>=6.0.2
    - python-pptx <2.0.0,>=1.0.2
    - typing_extensions <5.0.0,>=4.15.0

tests:
  - python:
      imports:
        - fhdocx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fhdocx/
  license: MIT
  license_file: LICENSE
  summary: *fh-docx* is a Python library for reading, creating, and updating Microsoft Word 2007+ (.docx) files.
  description: |
    *fh-docx* is a Python library for reading, creating, and updating Microsoft Word 2007+ (.docx) files.

extra:
  recipe-maintainers:
    - rxm7706

