# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: python3-openid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-openid/python3-openid-${{ version }}.tar.gz
  sha256: 33fbf6928f401e0b790151ed2b5290b02545e8775f982485205a066f874aaeaf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - defusedxml

tests:
  - python:
      imports:
        - openid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/necaris/python3-openid
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenID support for modern servers and consumers.
  description: |
    OpenID support for modern servers and consumers.

extra:
  recipe-maintainers:
    - carlodri
    - xylar

