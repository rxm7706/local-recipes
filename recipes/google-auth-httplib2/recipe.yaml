# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: google-auth-httplib2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-auth-httplib2/google_auth_httplib2-${{ version }}.tar.gz
  sha256: 125b1bb4fcfdd2d97f19b673c1f46f831603d0acaffe415c8a35dadb312552a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-auth <3.0.0,>=2.14.1
    - httplib2 <1.0.0,>=0.19.0

tests:
  - python:
      imports:
        - google_auth_httplib2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/packages/google-auth-httplib2
  license: Apache-2.0
  license_file: LICENSE
  summary: "Google Authentication Library: httplib2 transport"
  description: |
    Google Authentication Library: httplib2 transport

extra:
  recipe-maintainers:
    - xylar
    - jreback
    - parthea
    - theacodes
    - tswast

