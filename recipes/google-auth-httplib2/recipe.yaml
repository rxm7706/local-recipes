# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: google-auth-httplib2
  version: 0.4.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 125b1bb4fcfdd2d97f19b673c1f46f831603d0acaffe415c8a35dadb312552a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-auth >=2.14.1,<3.0.0
    - httplib2 >=0.19.0,<1.0.0
tests:
  - python:
      imports:
        - google_auth_httplib2
      pip_check: true
      python_version: 
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Authentication Library httplib2 transport
  description: This library provides an httplib2 transport for google-auth. Note that httplib has lots of problems such as lack of threadsafety and insecure usage of TLS. Using it is highly discouraged. This library is intended to help existing users of oauth2client migrate to google-auth.
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth-httplib2
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth-httplib2
  documentation: https://google-auth.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - xylar
    - jreback
    - parthea
    - theacodes
    - tswast
