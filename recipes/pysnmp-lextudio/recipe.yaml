# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.3.0"

package:
  name: pysnmp-lextudio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysnmp-lextudio/pysnmp_lextudio-${{ version }}.tar.gz
  sha256: e946c9a80b48af4cfe3c8281eecb396be48cfa47c14107696aff6d10d7fa5be1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pyasn1 !=0.5.0,<0.6.1,>=0.4.8
    - pysnmpcrypto <0.0.5,>=0.0.4
    - pysmi-lextudio <2.0.0,>=1.3.0
    - pytest-cov <5.0.0,>=4.0.0

tests:
  - python:
      imports:
        - pysnmp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lextudio/pysnmp
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A deprecated package. Please use 'pysnmp' instead.
  description: |
    A deprecated package. Please use 'pysnmp' instead.
  repository: https://github.com/lextudio/pysnmp

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
