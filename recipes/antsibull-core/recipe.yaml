# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6.0"

package:
  name: antsibull-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/antsibull-core/antsibull_core-${{ version }}.tar.gz
  sha256: 3e07400d718485febd5ca556b8e5ec9383797f5d7c795bfa00c6ed00d399b688

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiofiles
    - aiohttp >=3.3.0
    - antsibull-fileutils <2.0.0,>=1.0.0
    - python-build
    - packaging >=20.0
    - perky
    - pydantic ~=2.0
    - semantic_version
    - twiggy >=0.5.0

tests:
  - python:
      imports:
        - antsibull_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/antsibull-core/
  license: GPL-3.0-or-later AND BSD-2-Clause AND MIT AND PSF-2.0
  license_file: LICENSE
  summary: Tools for building the Ansible Distribution
  description: |
    Tools for building the Ansible Distribution

extra:
  recipe-maintainers:
    - rxm7706

