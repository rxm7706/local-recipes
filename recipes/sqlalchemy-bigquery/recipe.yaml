# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.17.2"

package:
  name: sqlalchemy-bigquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlalchemy-bigquery/sqlalchemy_bigquery-${{ version }}.tar.gz
  sha256: 32f7893c16546d5cc5dc939fb7cf74f51505766a16422f21dd2e7e78ea8ec849

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth <3.0.0,>=2.14.1
    - google-cloud-bigquery <4.0.0,>=3.20.0
    - packaging
    - sqlalchemy <3.0.0,>=1.4.16

tests:
  - python:
      imports:
        - sqlalchemy_bigquery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/sqlalchemy-bigquery
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy dialect for BigQuery
  description: |
    SQLAlchemy dialect for BigQuery

extra:
  recipe-maintainers:
    - xylar

