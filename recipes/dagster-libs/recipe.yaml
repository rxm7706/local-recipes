# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.29.18"

package:
  name: dagster-celery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dagster-celery/dagster_celery-${{ version }}.tar.gz
  sha256: 81371afb4b0835d62241698c0b0dcef17e88aff2dc29244988968fb7b29382f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - celery >=4.3.0
    - click <9.0,>=5.0
    - dagster ==1.13.18
    - importlib-metadata <5.0.0

tests:
  - python:
      imports:
        - dagster_celery
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/dagster-io/dagster/tree/master/python_modules/libraries/dagster-celery
  license: Apache-2.0
  license_file: LICENSE
  summary: Package for using Celery as Dagster's execution engine.
  description: |
    Package for using Celery as Dagster's execution engine.

extra:
  recipe-maintainers:
    - bollwyvl
    - conda-forge/dagster

