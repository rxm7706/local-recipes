    - pkg:pypi/xhtml2pdf@${{ version }}
  cfe-upstream-repo: https://github.com/xhtml2pdf/xhtml2pdf
  cfe-upstream-homepage: https://pypi.org/project/xhtml2pdf/
  cfe-import-names: [xhtml2pdf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
