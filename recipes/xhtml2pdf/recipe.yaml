# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.17"

package:
  name: xhtml2pdf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xhtml2pdf/xhtml2pdf-${{ version }}.tar.gz
  sha256: 09ddbc31aa0e38a16f2f3cb73be89af5f7c968c17a564afdd685d280e39c526d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - arabic_reshaper >=3.0.0
    - html5lib >=1.1
    - pillow >=8.1.1
    - pyhanko >=0.12.1
    - pyhanko-certvalidator >=0.19.5
    - pypdf >=3.1.0
    - python-bidi >=0.5.0
    - reportlab <5,>=4.0.4
    - svglib >=1.2.1

tests:
  - python:
      imports:
        - xhtml2pdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/xhtml2pdf/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: PDF generator using HTML and CSS
  description: |
    PDF generator using HTML and CSS
  repository: https://github.com/xhtml2pdf/xhtml2pdf
  documentation: https://xhtml2pdf.readthedocs.io/

extra:
  recipe-maintainers:
    - mrakitin

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: xhtml2pdf
  cfe-upstream-registry: pypi
  cfe-upstream-name: xhtml2pdf
