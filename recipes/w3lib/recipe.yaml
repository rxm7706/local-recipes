# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.1"

package:
  name: w3lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/w3lib/w3lib-${{ version }}.tar.gz
  sha256: 8dd69ee39ff6398d708c793abc779c334a69bac7cee1cdf71736c669ed6be864

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - w3lib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy/w3lib
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Library of web-related functions
  description: |
    Library of web-related functions
  repository: https://github.com/scrapy/w3lib
  documentation: https://w3lib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mgorny

