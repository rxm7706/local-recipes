# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sklearn-pandas
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/sklearn-pandas-${{ version }}.tar.gz
  sha256: bf908ea0e384e132da04355c7db67bd4f8efe145f0c9cd9f14726ce899d27542

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - python >=3.7
    - scikit-learn >=0.23.0
    - scipy >=1.5.1
    - pandas >=1.1.4
    - numpy >=1.18.1

tests:
  - python:
      imports:
        - sklearn_pandas
      pip_check: true

about:
  summary: Pandas integration with sklearn
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-learn-contrib/sklearn-pandas

extra:
  recipe-maintainers:
    - FernandezMathieu
    - ragrawal
