# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"

package:
  name: sklearn-pandas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sklearn-pandas/sklearn-pandas-${{ version }}.tar.gz
  sha256: bf908ea0e384e132da04355c7db67bd4f8efe145f0c9cd9f14726ce899d27542

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scikit-learn
    - scipy
    - pandas
    - numpy

tests:
  - python:
      imports:
        - sklearn_pandas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scikit-learn-contrib/sklearn-pandas
  license: MIT
  license_file: LICENSE
  summary: Pandas integration with sklearn
  description: |
    Pandas integration with sklearn

extra:
  recipe-maintainers:
    - FernandezMathieu
    - ragrawal

