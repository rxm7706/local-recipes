# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: email-validator
  version: "2.3.0"

recipe:
  name: ${{ name|lower }}-meta
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/email_validator-${{ version }}.tar.gz
  sha256: 9fc05c37f2f6cf439ff414f8fc46d917929974a82244c20eb10231ba60c54426

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: ${{ name|lower }}
    build:
      noarch: python
      python:
        entry_points:
          - email_validator = email_validator.__main__:main
      script:
        file: build_email_validator.sh
    requirements:
      host:
        - python ${{ python_min }}
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        - dnspython >=2.0.0
        - idna >=2.0.0
    tests:
      - python:
          imports:
            - email_validator
          pip_check: false
          python_version: ${{ python_min }}
      - files:
          source:
            - tests
        requirements:
          run:
            - coverage
            - docutils
            - flake8
            - pytest
            - pytest-cov
            - python ${{ python_min }}
        script:
          - email_validator blah@blah.com
          - pytest --cov=email_validator
  # Provide package with alternative name for backward compatibility
  - package:
      name: email_validator
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('email-validator', upper_bound="x.x.x") }}
    tests:
      - python:
          imports:
            - email_validator
          pip_check: false
      - script:
          - email_validator blah@blah.com

about:
  summary: A robust email address syntax and deliverability validation library.
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/JoshData/python-email-validator
  repository: https://github.com/JoshData/python-email-validator
  documentation: https://github.com/JoshData/python-email-validator

extra:
  feedstock-name: email-validator
  recipe-maintainers:
    - xylar
    - pmlandwehr
