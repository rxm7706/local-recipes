# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.2"

package:
  name: pyjulia
  version: ${{ version }}

source:
  - url: https://pypi.io/packages/source/j/julia/julia-${{ version }}.tar.gz
    sha256: 35eefc030671392b79ba0e1898b7103ed1286ad044783c4cadc99d4401c368e3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6,<4.0
    - pip
  run:
    - python >=3.6,<4.0
    - julia >=1.5.0

tests:
  - python:
      imports:
        - julia
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - python -c 'import julia; julia.install(); from julia.core import Julia; Julia(compiled_modules=False); from julia import Main'

about:
  license: MIT
  license_file: LICENSE.md
  summary: An interface to the Julia language from Python
  homepage: https://github.com/JuliaPy/pyjulia
  repository: https://github.com/JuliaPy/pyjulia
  documentation: https://pyjulia.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - MilesCranmer
    - ngam
    - mkitti
