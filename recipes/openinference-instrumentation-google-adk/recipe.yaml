# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.20"

package:
  name: openinference-instrumentation-google-adk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openinference-instrumentation-google-adk/openinference_instrumentation_google_adk-${{ version }}.tar.gz
  sha256: 764835b2c2f8c0bc9281a1457c592e453f469c90a14ad6c50d3017cd6ba1690d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - openinference-instrumentation >=0.1.51
    - openinference-semantic-conventions >=0.1.31
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - typing_extensions
    - wrapt

tests:
  - python:
      imports:
        - openinference.instrumentation.google_adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Arize-ai/openinference/tree/main/python/instrumentation/openinference-instrumentation-google-adk
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenInference Google ADK Instrumentation
  description: |
    OpenInference Google ADK Instrumentation

extra:
  recipe-maintainers:
    - rxm7706

