# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: eerepr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/eerepr/eerepr-${{ version }}.tar.gz
  sha256: 304dc23c365d6fa7cc3b07bc09cf77b565c19af86733e5deed804fdce16fb51f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - earthengine-api

tests:
  - python:
      imports:
        - eerepr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/aazuspan/eerepr
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Code Editor-style reprs for Earth Engine data in a Jupyter notebook.
  description: |
    Code Editor-style reprs for Earth Engine data in a Jupyter notebook.

extra:
  recipe-maintainers:
    - aazuspan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: eerepr
  cfe-upstream-registry: pypi
  cfe-upstream-name: eerepr
  cfe-purls:
    - pkg:conda/eerepr@${{ version }}?channel=conda-forge
    - pkg:pypi/eerepr@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/aazuspan/eerepr
  cfe-import-names: [eerepr]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/eerepr-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.1.2

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

