# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.6"

package:
  name: patternfork-nosql
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/patternfork-nosql/patternfork_nosql-${{ version }}.tar.gz
  sha256: 90e3c3d1163d57a944f6888b3d5ff76f409a4fb69dfd7ae6775b81d825f62f52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pattern
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.clips.ua.ac.be/pages/pattern
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Web mining module for Python.
  description: |
    Web mining module for Python.

extra:
  recipe-maintainers:
    - rxm7706

