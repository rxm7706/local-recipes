# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"
  python_min: "3.11"

package:
  name: cudf-polars-cu13
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/c/cudf-polars-cu13/cudf_polars_cu13-26.8.0-py3-none-any.whl
  sha256: 5a367429874eaabf8386504c2f6db52cf39a9b7918877e9ceeef159994825dcf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cuda-bindings <14.0,>=13.0.1
    - cudf-streaming-cu13 ==26.8.*
    - nvidia-ml-py >=12
    - packaging
    - polars <1.43,>=1.35
    - pylibcudf-cu13 ==26.8.*
    - rapidsmpf-cu13 ==26.8.*
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - cudf_polars_cu13
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cudf
  license: Apache-2.0
  license_file: LICENSE
  summary: Executor for polars using cudf
  description: |
    Executor for polars using cudf

extra:
  recipe-maintainers:
    - rxm7706

