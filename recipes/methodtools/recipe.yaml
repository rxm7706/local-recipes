# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.7"

package:
  name: methodtools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/methodtools/methodtools-${{ version }}.tar.gz
  sha256: e213439dd64cfe60213f7015da6efe5dd4003fd89376db3baa09fe13ec2bb0ba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - wirerope

tests:
  - python:
      imports:
        - methodtools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youknowone/methodtools
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Expand standard functools to methods
  description: |
    Expand standard functools to methods

extra:
  recipe-maintainers:
    - timkpaine

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: methodtools
  cfe-upstream-registry: pypi
  cfe-upstream-name: methodtools
  cfe-purls:
    - pkg:conda/methodtools@${{ version }}?channel=conda-forge
    - pkg:pypi/methodtools@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/youknowone/methodtools
  cfe-import-names: [methodtools]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/methodtools-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.4.7

  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-18T01:36:22Z
