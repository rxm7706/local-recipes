# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: mint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mint/mint-${{ version }}.tar.gz
  sha256: 30df771d00852c041d80a863b5ab2c331fb97748807611c40ae0db71a7ef2d2c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/riffm/mint
  license: MIT
  license_file: LICENSE
  summary: Simple indetion based template engine
  description: |
    Simple indetion based template engine

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mint
  cfe-upstream-registry: pypi
  cfe-upstream-name: mint
  cfe-purls:
    - pkg:conda/mint@${{ version }}?channel=conda-forge
    - pkg:pypi/mint@${{ version }}
  cfe-upstream-repo: http://github.com/riffm/mint
  cfe-upstream-homepage: http://github.com/riffm/mint
  cfe-import-names: []
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T20:39:37Z
