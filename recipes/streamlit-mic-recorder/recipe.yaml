# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.8"

package:
  name: streamlit-mic-recorder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-mic-recorder/streamlit_mic_recorder-${{ version }}.tar.gz
  sha256: 5a29a98f3bd1582f9d5d90911ef498b32244863d646759c2f5ceec515befb6cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aifc
    - streamlit >=0.63
    - speechrecognition

tests:
  - python:
      imports:
        - streamlit_mic_recorder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/B4PT0R/streamlit-mic-recorder
  license: MIT
  license_file: LICENSE
  summary: Streamlit component that allows to record mono audio from the user's microphone, and/or perform speech recognition directly.
  description: |
    Streamlit component that allows to record mono audio from the user's microphone, and/or perform speech recognition directly.

extra:
  recipe-maintainers:
    - rxm7706

