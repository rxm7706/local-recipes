# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: starlette
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/starlette/starlette-${{ version }}.tar.gz
  sha256: d4e3ac5e546444960c710297a3c9fc3f7ebae1b7e963f3d36173b49da535be9b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio <5,>=3.6.2
    - typing_extensions >=4.10.0

tests:
  - python:
      imports:
        - starlette
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Kludex/starlette
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The little ASGI library that shines.
  description: |
    The little ASGI library that shines.
  repository: https://github.com/Kludex/starlette
  documentation: https://starlette.dev/

extra:
  recipe-maintainers:
    - carlodri
    - dgasmith
    - thewchan
    - bollwyvl

#### CFE metadata AND comments
