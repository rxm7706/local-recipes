# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: yang.connector
  version: ${{ version }}

source:
  url: https://github.com/CiscoTestAutomation/yang/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 288f678b7681353c60d51c19340ce9b9b5facd7aa1ad09eecb3ea1215aecc839

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paramiko >=1.15.1
    - lxml >=6.0.1
    - ncclient >=0.6.6
    - grpcio >=1.63.0
    - protobuf >=5.27.2

tests:
  - python:
      imports:
        - ncdiff.src.yang.ncdiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CiscoTestAutomation/yang.git
  license: Apache-2.0
  license_file: LICENSE
  summary: YANG defined interface API protocol connector
  description: |
    YANG defined interface API protocol connector

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: yang.connector
  cfe-upstream-registry: pypi
