# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.4"

package:
  name: pywebio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pywebio/pywebio-${{ version }}.tar.gz
  sha256: 8108fbd2af035db0af42e8e4d001cbef9c26ec527a2ff869725b1caf2af5a114

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - demos
    - tornado >=5.0
    - user-agents

tests:
  - python:
      imports:
        - demos
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pywebio.readthedocs.io
  license: MIT
  license_file: LICENSE
  summary: Write interactive web app in script way.
  description: |
    Write interactive web app in script way.
  repository: https://github.com/wang0618/PyWebIO
  documentation: https://pywebio.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pywebio
  cfe-upstream-registry: pypi
  cfe-upstream-name: pywebio
