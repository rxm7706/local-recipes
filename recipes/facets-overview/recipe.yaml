# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"

package:
  name: facets-overview
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py2.py3/f/facets-overview/facets_overview-1.1.1-py2.py3-none-any.whl
  sha256: ee1feafcb0b486a598937246ac86ffb84d5fed2c32ddcaceeed01df792c26b73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - protobuf

tests:
  - python:
      imports:
        - facets_overview
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/pair-code/facets
  license: Apache-2.0
  license_file: LICENSE
  summary: Python code to support the Facets Overview visualization
  description: |
    Python code to support the Facets Overview visualization

extra:
  recipe-maintainers:
    - rxm7706

