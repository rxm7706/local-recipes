# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.4"

package:
  name: layoutparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/layoutparser/layoutparser-${{ version }}.tar.gz
  sha256: 0dfb2194c36a5ad1075b8310f3cbc280c00306d1758cef127d20283f7ce085ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - opencv
    - scipy
    - pandas
    - pillow
    - pyyaml
    - iopath
    - pdfplumber
    - pdf2image

tests:
  - python:
      imports:
        - layoutparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Layout-Parser/layout-parser
  license: Apache-2.0
  license_file: LICENSE
  summary: A unified toolkit for Deep Learning Based Document Image Analysis
  description: |
    A unified toolkit for Deep Learning Based Document Image Analysis

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: layoutparser
