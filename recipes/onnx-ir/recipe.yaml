# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"

package:
  name: onnx-ir
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/onnx-ir/onnx_ir-${{ version }}.tar.gz
  sha256: 9e261f25fde8da9612ae5cb43b3b374d5ff469c04af0363cad588b2bb000b812

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - onnx >=1.16
    - typing_extensions >=4.10
    - ml_dtypes >=0.5.0
    - sympy >=1.13

tests:
  - python:
      imports:
        - onnx_ir
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Efficient in-memory representation for ONNX
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/onnx/ir-py

extra:
  recipe-maintainers:
    - hmaarrfk
    - apmorton
