# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.10"

package:
  name: spanner-graph-notebook
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spanner-graph-notebook/spanner_graph_notebook-${{ version }}.tar.gz
  sha256: d8a1ce287ee26c76373404f09f15a66c522b15b45a01d78e1128cb0d6d5afe66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - networkx
    - numpy
    - google-cloud-spanner >=3.65.0
    - ipython
    - ipywidgets
    - notebook
    - requests
    - portpicker
    - pydata-google-auth

tests:
  - python:
      imports:
        - spanner_graphs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cloudspannerecosystem/spanner-graph-notebook
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - third_party/LICENSE
  summary: Visually query Spanner Graph data in notebooks.
  description: |
    Visually query Spanner Graph data in notebooks.

extra:
  recipe-maintainers:
    - rxm7706

