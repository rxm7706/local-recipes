# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.4"

package:
  name: cachelib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cachelib/cachelib-${{ version }}.tar.gz
  sha256: 66fb75f48f9077713c8a1ce2319f523d08418a1576f2cbdaad8aad15c884afa0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cachelib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cachelib/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A collection of cache libraries in the same API interface.
  description: |
    A collection of cache libraries in the same API interface.
  repository: https://github.com/pallets-eco/cachelib/
  documentation: https://cachelib.readthedocs.io

extra:
  recipe-maintainers:
    - fuglede

#### CFE metadata AND comments
