# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cachelib
  version: "0.15.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cachelib-${{ version }}.tar.gz
  sha256: 66fb75f48f9077713c8a1ce2319f523d08418a1576f2cbdaad8aad15c884afa0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
    - flit-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cachelib
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A collection of cache libraries in the same API interface.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/pallets-eco/cachelib

extra:
  recipe-maintainers:
    - fuglede
