# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: pytest-trio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-trio/pytest-trio-${{ version }}.tar.gz
  sha256: 8363db6336a79e6c53375a2123a41ddbeccc4aa93f93788651641789a56fb52e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - trio
    - outcome
    - pytest

tests:
  - python:
      imports:
        - pytest_trio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python-trio/pytest-trio
  license: Apache-2.0
  license_file: LICENSE
  summary: Pytest plugin for trio
  description: |
    Pytest plugin for trio

extra:
  recipe-maintainers:
    - krisevans
    - dhirschfeld

#### CFE metadata AND comments
