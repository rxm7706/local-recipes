# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: itables
  version: "2.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mwouts/itables/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5efb85497cd9bcdb545ed473a33c6450369ccebb963d6e87f84e0cfc1e8b7e02

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - nodejs
    - python ${{ python_min }}
    - python-build
    - hatch-jupyter-builder
    - dash
    - pyyaml
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - itables
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - python -c "import itables; print(itables.__version__)"

about:
  summary: Python DataFrames as Interactive DataTables
  license: MIT
  license_file:
    - LICENSE
    - LICENSE_jquery.txt
    - LICENSE_datatables-net.txt
  description: |
    Render Pandas and Polars DataFrames as interactive [DataTables](https://datatables.net/)
    that you can sort, paginate, scroll or filter. ITables works in Jupyter,
    VS Code, Google Colab, Quarto, Marimo, and in many application frameworks like
    Dash, Panel, Shiny, or Streamlit.


  homepage: https://github.com/mwouts/itables
  documentation: https://itables.org

extra:
  recipe-maintainers:
    - mwouts
    - asford
