# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  python_min: "3.12"
  name: pointpats
  version: "2.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pointpats-${{ version }}.tar.gz
  sha256: 6c21e0a03d9ad4ca0f62393f888842212580d99b828b4b68ddeb1929eac8bdf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.12.*
    - setuptools >=61.0
    - setuptools-scm >=6.2
  run:
    - libpysal >=4.10
    - matplotlib-base >=3.9
    - numpy >=1.26
    - pandas >=2.2
    - python >=${{ python_min }}
    - scipy >=1.12
    - shapely >=2.1
    - geopandas >=1.0

tests:
  - python:
      imports:
        - pointpats
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Statistical analysis of planar point patterns.
  description: |
    This pointpats package is intended to support the statistical analysis
    of planar point patterns.
  homepage: http://pysal.org
  repository: https://github.com/pysal/pointpats
  documentation: https://pointpats.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - weikang9009
    - slumnitz
    - martinfleis
    - knaaptime
    - jGaboardi
