# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.6.0"
  python_min: "3.12"

package:
  name: pointpats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pointpats/pointpats-${{ version }}.tar.gz
  sha256: 6c21e0a03d9ad4ca0f62393f888842212580d99b828b4b68ddeb1929eac8bdf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - libpysal >=4.12
    - geopandas >=1.1.0
    - matplotlib-base >=3.10
    - numpy >=2.0.0
    - pandas >=2.3.0
    - scipy >=1.14.0
    - shapely >=2.1

tests:
  - python:
      imports:
        - pointpats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pysal/pointpats/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Methods and Functions for planar point pattern analysis
  description: |
    Methods and Functions for planar point pattern analysis
  repository: https://github.com/pysal/pointpats

extra:
  recipe-maintainers:
    - weikang9009
    - slumnitz
    - martinfleis
    - knaaptime
    - jGaboardi

#### CFE metadata AND comments
