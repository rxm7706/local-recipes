# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: plyer
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/plyer-${{ version }}.tar.gz
  sha256: 65b7dfb7e11e07af37a8487eb2aa69524276ef70dad500b07228ce64736baa61

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - cython
    - pyjnius
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - plyer
        - plyer.facades
        - plyer.platforms
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Platform-independent wrapper for platform-dependent APIs
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/kivy/plyer
  documentation: https://plyer.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - thewchan
