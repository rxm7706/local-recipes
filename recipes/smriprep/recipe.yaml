# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.19.2"

package:
  name: smriprep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/smriprep/smriprep-${{ version }}.tar.gz
  sha256: 843c2646764f92ebb824fe6da9ce809dcbac801c8d5f4fd19784450a1c31f963

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - acres >=0.2
    - indexed-gzip >=1.7
    - lockfile >=0.12.2
    - looseversion >=1.3.0
    - matplotlib-base >=3.5
    - nibabel >=4.0.1
    - nipype >=1.8.5
    - nireports >=25.3.0
    - nitransforms >=24.1.1
    - niworkflows >=1.14.0
    - numpy >=1.24
    - packaging >=24
    - pybids >=0.16
    - pyyaml >=6.0
    - templateflow >=25.0

tests:
  - python:
      imports:
        - smriprep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nipreps/smriprep
  license: Apache-2.0
  license_file: LICENSE
  summary: Structural MRI Preprocessing Pipelines
  description: |
    Structural MRI Preprocessing Pipelines
  documentation: https://nipreps.org/smriprep

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: smriprep
  cfe-upstream-registry: pypi
  cfe-upstream-name: smriprep
  cfe-purls:
    - pkg:conda/smriprep@${{ version }}?channel=conda-forge
    - pkg:pypi/smriprep@${{ version }}
  cfe-upstream-repo: https://github.com/nipreps/smriprep
  cfe-upstream-homepage: https://github.com/nipreps/smriprep
  cfe-import-names: [smriprep]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
