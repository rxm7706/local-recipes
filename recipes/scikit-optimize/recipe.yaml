# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.2"

package:
  name: scikit-optimize
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scikit-optimize/scikit_optimize-${{ version }}.tar.gz
  sha256: 00a3d91bf9015e292b6e7aaefe7e6cb95e8d25ce19adafd2cd88849e1a0b0da0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - joblib >=0.11
    - pyaml >=16.9
    - numpy >=1.20.3
    - scipy >=1.1.0
    - scikit-learn >=1.0.0
    - packaging >=21.3

tests:
  - python:
      imports:
        - skopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://scikit-optimize.readthedocs.io/en/latest/contents.html
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Sequential model-based optimization toolbox.
  description: |
    Sequential model-based optimization toolbox.
  repository: https://github.com/holgern/scikit-optimize

extra:
  recipe-maintainers:
    - holgern

#### CFE metadata AND comments
