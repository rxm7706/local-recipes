# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.5"

package:
  name: csscompressor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/csscompressor/csscompressor-${{ version }}.tar.gz
  sha256: afa22badbcf3120a4f392e4d22f9fff485c044a1feda4a950ecc5eba9dd31a05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - csscompressor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/sprymix/csscompressor
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A python port of YUI CSS Compressor
  description: |
    A python port of YUI CSS Compressor

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: csscompressor
  cfe-upstream-registry: pypi
  cfe-upstream-name: csscompressor
