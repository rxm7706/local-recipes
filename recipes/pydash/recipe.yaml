    - pkg:pypi/pydash@${{ version }}
  cfe-upstream-repo: https://github.com/dgilland/pydash
  cfe-upstream-homepage: https://github.com/dgilland/pydash
  cfe-import-names: [pydash]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pydash-feedstock
  cfe-forge-recipe-updates-needed: 
