# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.74.0"

package:
  name: datamodel-code-generator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datamodel-code-generator/datamodel_code_generator-${{ version }}.tar.gz
  sha256: db0998d920e774f48442ca2702b901049be60c35ccb547086c574b1d261f1444

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - argcomplete <4,>=2.10.1
    - genson <2,>=1.2.1
    - inflect <8,>=4.1
    - jinja2 <4,>=2.10.1
    - pydantic <3,>=2
    - pyyaml >=6.0.1
    - tomli <3,>=2.2.1

tests:
  - python:
      imports:
        - datamodel_code_generator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/koxudaxi/datamodel-code-generator
  license: MIT
  license_file: LICENSE
  summary: Datamodel Code Generator
  description: |
    Datamodel Code Generator
  repository: https://github.com/koxudaxi/datamodel-code-generator

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
