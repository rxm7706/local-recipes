# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"
  python_min: "3.13"

package:
  name: spark
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/Spark/spark-${{ version }}.tar.gz
  sha256: adaf63da20392e9ff0aa5ac1b425a930ad1496670dd6328ae869d99c571a1831

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - spark
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wensheng/spark
  license: MIT
  license_file: LICENSE
  summary: An easy to use actor model framework in Python
  description: |
    An easy to use actor model framework in Python
  repository: https://github.com/wensheng/spark

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
