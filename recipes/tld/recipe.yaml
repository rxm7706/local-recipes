# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: tld
  version: "0.13.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tld-${{ version }}.tar.gz
  sha256: d983fa92b9d717400742fca844e29d5e18271079c7bcfabf66d01b39b4a14345

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - update-tld-names = tld.utils:update_tld_names_cli

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tld
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - update-tld-names --help

about:
  license: LGPL-2.1-or-later
  license_file: LICENSE_LGPL_2.1.txt
  summary: Extracts the top level domain (TLD) from the URL given.
  description: |
    Extract the top level domain (TLD) from the URL given. List of TLD
    names is taken from Public Suffix.
  homepage: https://github.com/barseghyanartur/tld
  repository: https://github.com/barseghyanartur/tld
  documentation: http://tld.readthedocs.io/

extra:
  recipe-maintainers:
    - jan-janssen
