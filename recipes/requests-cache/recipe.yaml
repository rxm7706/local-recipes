# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.3"

package:
  name: requests-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-cache/requests_cache-${{ version }}.tar.gz
  sha256: 79b72d5ac5143992d1836ad78f4d8e65666061dd44e220548caab3723089826b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.0.0
  run:
    - python >=${{ python_min }}
    - attrs >=21.2
    - cattrs >=22.2
    - platformdirs >=2.5
    - requests >=2.22
    - url-normalize >=2.0
    - urllib3 >=1.25.5

tests:
  - python:
      imports:
        - requests_cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/requests-cache/requests-cache
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A persistent cache for python requests
  description: |
    A persistent cache for python requests
  documentation: https://requests-cache.readthedocs.io

extra:
  recipe-maintainers:
    - jwcook
    - cj-wright

#### CFE metadata AND comments
