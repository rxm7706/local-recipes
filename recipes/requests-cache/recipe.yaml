# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.3"

package:
  name: requests-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-cache/requests_cache-${{ version }}.tar.gz
  sha256: 79b72d5ac5143992d1836ad78f4d8e65666061dd44e220548caab3723089826b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - attrs >=21.2
    - cattrs >=22.2
    - itsdangerous >=2.0
    - platformdirs >=2.5
    - pyyaml >=6.0.1
    - requests >=2.22
    - ujson >=5.4
    - url-normalize >=1.4
    - urllib3 >=1.25.5

tests:
  - python:
      imports:
        - requests_cache
        - requests_cache.backends
        - requests_cache.models
        - requests_cache.policy
        - requests_cache.serializers
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE
  license: BSD-2-Clause
  summary: A persistent HTTP cache for python requests
  homepage: https://github.com/requests-cache/requests-cache
  documentation: https://requests-cache.readthedocs.io

extra:
  recipe-maintainers:
    - jwcook
    - cj-wright
