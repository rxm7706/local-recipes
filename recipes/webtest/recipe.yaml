# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.7"

package:
  name: webtest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WebTest/webtest-${{ version }}.tar.gz
  sha256: 7aeab50f970d46c068e7a36dd162cb242591edf72a1d04efd21374772b931741

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - webob >=1.2
    - waitress >=3.0.2
    - beautifulsoup4

tests:
  - python:
      imports:
        - webtest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.pylonsproject.org/projects/webtest/en/latest/
  license: MIT
  license_file: LICENSE
  summary: Helper to test WSGI applications
  description: |
    Helper to test WSGI applications

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
