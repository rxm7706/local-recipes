# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.16.2"

package:
  name: asyncio-mqtt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/asyncio-mqtt/asyncio_mqtt-0.16.2-py3-none-any.whl
  sha256: fe70ea2c648b248779a7ff3d9218262cdd739083743dfaa7c0d52ba458a8ad71

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - paho-mqtt
    - typing_extensions

tests:
  - python:
      imports:
        - asyncio_mqtt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/asyncio-mqtt/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Idiomatic asyncio wrapper around paho-mqtt
  description: |
    Idiomatic asyncio wrapper around paho-mqtt

extra:
  recipe-maintainers:
    - rxm7706

