# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/p/pyats/pyats-26.7-cp310-cp310-macosx_11_0_universal2.whl
  sha256: 610dfdbdd0366f3a684b3930ad8a24061e4c447bdac1132e68219764f6138fae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging >=20.0
    - pyats.aereport <26.8.0,>=26.7.0
    - pyats.aetest <26.8.0,>=26.7.0
    - pyats.async <26.8.0,>=26.7.0
    - pyats.log <26.8.0,>=26.7.0
    - pyats.kleenex <26.8.0,>=26.7.0
    - pyats.connections <26.8.0,>=26.7.0
    - pyats.datastructures <26.8.0,>=26.7.0
    - pyats.easypy <26.8.0,>=26.7.0
    - pyats.results <26.8.0,>=26.7.0
    - pyats.reporter <26.8.0,>=26.7.0
    - pyats.tcl <26.8.0,>=26.7.0
    - pyats.topology <26.8.0,>=26.7.0
    - pyats.utils <26.8.0,>=26.7.0

tests:
  - python:
      imports:
        - pyats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: pyATS - Python Automation Test System
  description: |
    pyATS - Python Automation Test System

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
