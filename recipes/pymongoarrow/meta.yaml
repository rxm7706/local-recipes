{% set name = "pymongoarrow" %}
{% set version = "1.15.0" %}

# just to be able to use libarrow in jinja below
{% if libarrow is undefined %}
{% set libarrow = "19" %}
{% endif %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pymongoarrow/pymongoarrow-{{ version }}.tar.gz
  sha256: 155a0a4491f5c88611c218038b7378697ed87e4d08e3915c0facae238a39c4e8

build:
  number: 0
  {% if libarrow.split(".")[0]|int < 18 %}
  # py3.13 only supported from v18 onwards
  skip: true  # [py>=313]
  {% endif %}
  {% if libarrow.split(".")[0]|int < 21 %}
  # py3.14 only supported from v21 onwards
  skip: true  # [py>=314]
  {% endif %}
  {% if libarrow.split(".")[0]|int < 24 %}
  # py3.14t (free-threaded) only supported from v24 onwards
  skip: true  # [is_freethreading]
  {% endif %}

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.0                           # [build_platform != target_platform]
    - libarrow                               # [build_platform != target_platform]
    - pyarrow                                # [build_platform != target_platform]
    - libbson                                # [build_platform != target_platform]
    - pkg-config                             # [build_platform != target_platform]
    - cmake >=3.17
    - ninja
    - pip
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}

  host:
    - python
    - libarrow
    - pyarrow
    - cython >=3.0
    - libbson >=2.0.1,<3
    - numpy  # for headers
    - pip
    - pkg-config
    - scikit-build-core >=0.10

  run:
    - pymongo >=4.4,<5
    - pyarrow
    - numpy
    - packaging >=23.2
    - python

test:
  source_files:
    - .
  files:
    - run_the_tests.sh
  requires:
    - pip
    - pandas
    - numpy
    - pytest
    - polars  # [not is_freethreading]
    # TODO: replace with mongodb install once https://github.com/conda-forge/mongodb-feedstock/pull/72 is resolved
    - icu
    - yaml-cpp
    - boost-cpp
    - curl
    - pytz

  commands:
    - bash run_the_tests.sh  # [osx]

about:
  home: https://pypi.org/project/pymongoarrow/
  summary: Tools for using NumPy, Pandas and PyArrow with MongoDB
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - blink1073
    - ShaneHarvey
