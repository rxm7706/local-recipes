# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# just to be able to use libarrow in jinja below
schema_version: 1

context:
  name: pymongoarrow
  version: "1.15.0"
  libarrow: 19

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymongoarrow/pymongoarrow-${{ version }}.tar.gz
  sha256: 155a0a4491f5c88611c218038b7378697ed87e4d08e3915c0facae238a39c4e8

build:
  # py3.13 only supported from v18 onwards
  # py3.14 only supported from v21 onwards
  # py3.14t (free-threaded) only supported from v24 onwards
  number: 0
  skip:
    - is_freethreading
    - match(python, ">=3.14")

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython >=3.0
    - if: build_platform != target_platform
      then: libarrow
    - if: build_platform != target_platform
      then: pyarrow
    - if: build_platform != target_platform
      then: libbson
    - if: build_platform != target_platform
      then: pkg-config
    - cmake >=3.17
    - ninja
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - libarrow
    - pyarrow
    - cython >=3.0
    - libbson >=2.0.1,<3
    - numpy  # for headers
    - pip
    - pkg-config
    - scikit-build-core >=0.10
  run:
    - pymongo >=4.4,<5
    - pyarrow
    - numpy
    - packaging >=23.2
    - python

tests:
  - files:
      recipe:
        - run_the_tests.sh
      source:
        - .
    requirements:
      run:
        - pip
        - pandas
        - numpy
        - pytest
        - if: not is_freethreading
          then: polars
        - icu
        - yaml-cpp
        - boost-cpp
        - curl
        - pytz
    script:
      - if: osx
        then: bash run_the_tests.sh

about:
  summary: Tools for using NumPy, Pandas and PyArrow with MongoDB
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pymongoarrow/

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - blink1073
    - ShaneHarvey
