# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.0a0"

package:
  name: opentelemetry-exporter-gcp-logging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-gcp-logging/opentelemetry_exporter_gcp_logging-${{ version }}.tar.gz
  sha256: c402db5c90ff3bb98d730ce337f9947237a369fc88a005d4ef2bb7e87a2778b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-cloud-logging ~=3.0
    - opentelemetry-sdk >=1.39.0
    - opentelemetry-api >=1.39.0
    - opentelemetry-resourcedetector-gcp <1.15,>=1.5.0dev0
    - typing_extensions

tests:
  - python:
      imports:
        - opentelemetry.exporter.cloud_logging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudPlatform/opentelemetry-operations-python/tree/main/opentelemetry-exporter-gcp-logging
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Logging exporter for OpenTelemetry
  description: |
    Google Cloud Logging exporter for OpenTelemetry

extra:
  recipe-maintainers:
    - soapy1

