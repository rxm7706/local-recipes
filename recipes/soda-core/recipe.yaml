# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.21.0"

package:
  name: soda-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soda-core/soda_core-${{ version }}.tar.gz
  sha256: 96b63382dd42738ad3bec8026749230a8b7be8064197178b7fb23ae2faecc868

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }}
    - ruamel.yaml <0.18.0,>=0.17.0
    - requests <2.34.0,>=2.32.3
    - pydantic <3.0,>=2.11
    - opentelemetry-api <2.0.0,>=1.16.0
    - opentelemetry-exporter-otlp-proto-http <2.0.0,>=1.16.0
    - tabulate
    - python-dotenv ~=1.0
    - sqlglot

tests:
  - python:
      imports:
        - soda_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/soda-core/
  license: Proprietary
  license_file: LICENSE
  summary: Soda core library & CLI
  description: |
    Soda core library & CLI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
