# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: trufflehog
  version: "2.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/truffleHog-${{ version }}.tar.gz
  sha256: 7f0d09c8cda2a90ae42f81405e5944a3325d90a5842d2dde014471e4d65c71e4

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - trufflehog = truffleHog.truffleHog:main

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.12
    - gitpython >=3.0.5
    - trufflehogregexes ==0.0.7

tests:
  - python:
      imports:
        - truffleHog
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}

about:
  summary: Searches through git repositories for high entropy strings, digging deep into commit history.
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/dxa4481/truffleHog

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
