# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyodc
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ecmwf/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: a039c6223d5d756f57b9760b06d50ca795fc74f0ed6cdac1def43e7292bfd569

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - cffi
    - pandas

tests:
  - python:
      imports:
        - pyodc
      pip_check: true
  - files:
      source:
        - CHANGELOG.md
        - codc
        - tests
        - pyodc
        - README.md
        - setup.py
    requirements:
      run:
        - pip
        - pytest
        - if: not win
          then: odc
    script:
      - if: not win
        then: ODC_DIR=$PREFIX python -c "import codc"
      - if: not win
        then: ODC_DIR=$PREFIX python -m pytest

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python interface to odc for encoding/decoding ODB-2 files
  description: |
    The package contains two different implementations of the same library:

    * pyodc is a pure-python encoder and decoder for ODB-2 data, which encodes
    data from, and decodes it into pandas data frames
    * codc is an implementation of the same API as pyodc that depends on the
    ECMWF odc library, and comes with _much_ better performance
  homepage: https://pypi.org/project/pyodc/
  repository: https://github.com/ecmwf/pyodc
  documentation: https://pyodc.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - simondsmart
    - dvuckovic
