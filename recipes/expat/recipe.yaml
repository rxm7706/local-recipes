# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.8.1"
  ver: ${{ version|replace(".", "_") }}

recipe:
  name: expat-split
  version: ${{ version }}

source:
  url: https://github.com/libexpat/libexpat/releases/download/R_${{ ver }}/expat-${{ version }}.tar.xz
  sha256: 10b195ee78160a908388180a8fe3603d4e9a12f4755fbf5f3816b23a9d750da0
  patches:
    # Add missing symbol on Windows
    - 3cdd1df2644388aff25dd0ed7128c7bb1de1a7d8.patch

build:
  number: 1

requirements:
  build:
    - if: win
      then: cmake-no-system
    - if: unix
      then: make
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:

outputs:
  - package:
      name: libexpat
    files:
      - if: linux
        then: lib/libexpat.so.*
      - if: osx
        then: lib/libexpat.*.dylib
      - if: win
        then: Library/bin/libexpat.dll
    build:
      script:
        file: ${{ 'install.sh' if unix else 'install.bat' if win else '' }}
    requirements:
      build:
        - if: win
          then: cmake-no-system
        - if: unix
          then: make
        - if: unix
          then: gnuconfig
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
      host:
      run:
      ignore_run_exports:
        from_package:
          - ${{ compiler('cxx') }}
      run_constraints:
        - expat ${{ version }}.*
  - package:
      name: expat
    build:
      script:
        file: ${{ 'install.sh' if unix else 'install.bat' if win else '' }}
    requirements:
      build:
        - if: win
          then: cmake-no-system
        - if: unix
          then: make
        - if: unix
          then: gnuconfig
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
      host:
        - ${{ pin_subpackage('libexpat', exact=True) }}
      run:
        - ${{ pin_subpackage('libexpat', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libexpat') }}
      ignore_run_exports:
        from_package:
          - ${{ compiler('cxx') }}

tests:
  - script:
      - xmlwf -h

about:
  license: MIT
  license_file: COPYING
  summary: Expat XML parser library in C
  homepage: http://expat.sourceforge.net/
  repository: https://github.com/libexpat/libexpat

extra:
  feedstock-name: expat
  recipe-maintainers:
    - kwilcox
    - ocefpaf
    - isuruf
    - pelson
    - mingwandroid
    - msarahan
    - scopatz
