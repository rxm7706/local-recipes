    - pkg:pypi/opencensus@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/census-instrumentation/opencensus-python
  cfe-import-names: [opencensus]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/opencensus-feedstock
  cfe-forge-recipe-updates-needed: 
