# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.4"

package:
  name: opencensus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opencensus/opencensus-${{ version }}.tar.gz
  sha256: cbef87d8b8773064ab60e5c2a1ced58bbaa38a6d052c41aec224958ce544eff2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - opencensus-context
    - six
    - google-api-core

tests:
  - python:
      imports:
        - opencensus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/census-instrumentation/opencensus-python
  license: Apache-2.0
  license_file: LICENSE
  summary: A stats collection and distributed tracing framework
  description: |
    A stats collection and distributed tracing framework

extra:
  recipe-maintainers:
    - basnijholt
    - dhirschfeld

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: opencensus
  cfe-upstream-registry: pypi
  cfe-upstream-name: opencensus
