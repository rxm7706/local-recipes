# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: pathable
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pathable/pathable-${{ version }}.tar.gz
  sha256: 6404b8b82aef5ff0fd478934137128b99b12212ba35afdde5525ca4f8388ea58

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pathable
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pathable/
  license: Apache-2.0
  license_file: LICENSE
  summary: Object-oriented paths
  description: |
    Object-oriented paths
  repository: https://github.com/p1c2u/pathable

extra:
  recipe-maintainers:
    - bollwyvl

#### CFE metadata AND comments
