# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: opentelemetry-exporter-otlp-proto-http
  version: "1.44.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_exporter_otlp_proto_http-${{ version }}.tar.gz
  sha256: c633d7270ad6b57cd4cfbe8b0007a9e2e7c0cb50bd6c50fe2a7b245f721a09d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >=${{ python_min }}
    - deprecated >=1.2.6
    - googleapis-common-protos >=1.52,<2.dev0
    - opentelemetry-api >=1.15,<2.dev0
    - opentelemetry-proto ==1.44.0
    - opentelemetry-sdk >=1.44.0,<1.45.dev0
    - opentelemetry-exporter-otlp-proto-common ==1.44.0
    - requests >=2.7,<3.dev0
  <conda_recipe_manager.types.SentinelType object at 0x7acf68051be0>:  # NOTE backoff only required for py<37 but pip checks fails without it
    #- backoff >=1.10.0,<3.0.0
    # - responses ==0.22.0
    # - typing_extensions >=4.5.0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0
    # - opentelemetry-exporter-credential-provider-gcp >=0.59b0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.exporter
        - opentelemetry.exporter.otlp.proto.http
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: OpenTelemetry Collector Protobuf over HTTP Exporter
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-proto
    - conda-forge/opentelemetry-sdk
    - conda-forge/opentelemetry-exporter-otlp-proto-common
