# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-exporter-otlp-proto-http
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-otlp-proto-http/opentelemetry_exporter_otlp_proto_http-${{ version }}.tar.gz
  sha256: c633d7270ad6b57cd4cfbe8b0007a9e2e7c0cb50bd6c50fe2a7b245f721a09d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - googleapis-common-protos ~=1.52
    - opentelemetry-api ~=1.15
    - opentelemetry-exporter-otlp-proto-common ==1.44.0
    - opentelemetry-proto ==1.44.0
    - opentelemetry-sdk ~=1.44.0
    - requests ~=2.7
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - opentelemetry.exporter.otlp.proto.http
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Collector Protobuf over HTTP Exporter
  description: |
    OpenTelemetry Collector Protobuf over HTTP Exporter
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-proto
    - conda-forge/opentelemetry-sdk
    - conda-forge/opentelemetry-exporter-otlp-proto-common

