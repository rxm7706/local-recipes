# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: asgi-csrf
  version: "0.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: e19a4f87d5af3feabde04c57921ee15510c3bfb0565627df9cb20bcb303282c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - itsdangerous
    - python >=${{ python_min }}
    - python-multipart

tests:
  - python:
      imports:
        - asgi_csrf
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: ASGI middleware for protecting against CSRF attacks
  description: |
    This middleware implements the Double Submit Cookie pattern, where a cookie
    is set that is then compared to a csrftoken hidden form field or a
    x-csrftoken HTTP header.


  homepage: https://github.com/simonw/asgi-csrf

extra:
  recipe-maintainers:
    - thewchan
