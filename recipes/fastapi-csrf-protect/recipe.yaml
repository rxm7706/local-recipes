# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.7"

package:
  name: fastapi-csrf-protect
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-csrf-protect/fastapi_csrf_protect-${{ version }}.tar.gz
  sha256: 888b15b232625aae5b997fbcf81ef45633a7694f0312a054f1eec6d132b295fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - itsdangerous <3.0.0,>=2.0.1
    - pydantic-settings >=2.0.0
    - pydantic >=2.0.0
    - starlette >=0

tests:
  - python:
      imports:
        - fastapi_csrf_protect
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/fastapi-csrf-protect/
  license: MIT
  license_file: LICENSE
  summary: Stateless implementation of Cross-Site Request Forgery (XSRF) Protection by using Double Submit Cookie mitigation pattern
  description: |
    Stateless implementation of Cross-Site Request Forgery (XSRF) Protection by using Double Submit Cookie mitigation pattern

extra:
  recipe-maintainers:
    - rxm7706

