# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "19.1.1"

package:
  name: approvaltests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/approvaltests/approvaltests-${{ version }}.tar.gz
  sha256: 0b049a815e5c8462a8dfde2b781bb5956c822e980b8ddd8c270a657a4d78dda3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=69.0.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=8.0.0
    - empty-files >=0.0.3
    - typing_extensions >=4.12.0
    - pyperclip >=1.5.29
    - beautifulsoup4 >=4.9.0
    - allpairspy >=2.1.0
    - testfixtures <12,>=7.1.0
    - mock >=5.1.0
    - psutil >=5.9.0
    - approval-utilities ==19.1.1

tests:
  - python:
      imports:
        - approvaltests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/approvals/ApprovalTests.Python
  license: Apache-2.0
  license_file: LICENSE
  summary: Assertion/verification library to aid testing
  description: |
    Assertion/verification library to aid testing

extra:
  recipe-maintainers:
    - apmorton
    - mgorny

