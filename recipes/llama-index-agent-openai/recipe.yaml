# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.12"

package:
  name: llama-index-agent-openai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-agent-openai/llama_index_agent_openai-${{ version }}.tar.gz
  sha256: d2fe53feb69cfe45752edb7328bf0d25f6a9071b3c056787e661b93e5b748a28

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core >=0.12.41,<0.13
    - llama-index-llms-openai >=0.4.0,<0.5
    - openai >=1.14.0

tests:
  - python:
      imports:
        - llama_index.agent.openai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-agent-openai/
  license: MIT
  license_file: LICENSE
  summary: llama-index agent openai integration
  description: |
    llama-index agent openai integration
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/agent/llama-index-agent-openai

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw

