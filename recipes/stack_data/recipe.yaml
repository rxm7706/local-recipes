    - pkg:pypi/stack-data@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: http://github.com/alexmojaki/stack_data
  cfe-import-names: [stack_data]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
