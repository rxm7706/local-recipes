# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.3"

package:
  name: stack-data
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stack-data/stack_data-${{ version }}.tar.gz
  sha256: 836a778de4fec4dcd1dcd89ed8abff8a221f58308462e1c4aa2a3cf30148f0b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=44
    - wheel
  run:
    - python >=${{ python_min }}
    - executing >=1.2.0
    - asttokens >=2.1.0
    - pure_eval

tests:
  - python:
      imports:
        - stack_data
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/alexmojaki/stack_data
  license: MIT
  license_file: LICENSE.txt
  summary: Extract data from python stack frames and tracebacks for informative displays
  description: |
    Extract data from python stack frames and tracebacks for informative displays

extra:
  recipe-maintainers:
    - alexmojaki

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: stack_data
  cfe-upstream-registry: pypi
  cfe-upstream-name: stack-data
