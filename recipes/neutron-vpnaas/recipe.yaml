# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "28.0.0"

package:
  name: neutron-vpnaas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/neutron-vpnaas/neutron_vpnaas-${{ version }}.tar.gz
  sha256: 55416a22c768281e19e09f34958df913938a35e70f5e8ac0efd29908a69eee61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - pbr >=4.0.0
    - jinja2 >=2.10
    - netaddr >=0.7.18
    - sqlalchemy >=1.3.0
    - alembic >=1.6.5
    - neutron-lib >=3.18.0
    - oslo.concurrency >=3.26.0
    - oslo.config >=8.0.0
    - oslo.db >=4.44.0
    - oslo.log >=4.5.0
    - oslo.messaging >=7.0.0
    - oslo.reports >=1.18.0
    - oslo.serialization >=2.25.0
    - oslo.service >=1.31.0
    - oslo.utils >=4.5.0
    - neutron >=25.0.0.0b1

tests:
  - python:
      imports:
        - neutron_vpnaas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/neutron-vpnaas/latest/
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenStack Networking VPN as a Service
  description: |
    OpenStack Networking VPN as a Service
  repository: https://opendev.org/openstack/neutron-vpnaas

extra:
  recipe-maintainers:
    - rxm7706

