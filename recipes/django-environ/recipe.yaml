# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: django-environ
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-environ/django_environ-${{ version }}.tar.gz
  sha256: b6c48d93b9d2ff8a3ea14099e90c35aa4f101c1b4d5f262dfee0d27b06742ed7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=3.10.0

tests:
  - python:
      imports:
        - environ
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://django-environ.readthedocs.org
  license: MIT
  license_file: LICENSE.txt
  summary: A package that allows you to utilize 12factor inspired environment variables to configure your Django application.
  description: |
    A package that allows you to utilize 12factor inspired environment variables to configure your Django application.
  repository: https://github.com/joke2k/django-environ
  documentation: https://django-environ.readthedocs.org

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - rxm7706
    - millsks
    - elanqo
    - zaigner

