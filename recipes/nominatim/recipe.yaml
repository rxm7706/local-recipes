# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: nominatim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nominatim/nominatim-${{ version }}.tar.gz
  sha256: 6a3684be6b7f8dd08a1f60366718bea15635a6df9e85779d089245e161ded290

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nominatim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/damianbraun/nominatim
  license: MIT
  license_file: LICENSE
  summary: OSM Nominatim API module
  description: |
    OSM Nominatim API module

extra:
  recipe-maintainers:
    - rxm7706

