    - pkg:pypi/langserve@${{ version }}
  cfe-upstream-repo: https://github.com/langchain-ai/langserve
  cfe-upstream-homepage: https://github.com/langchain-ai/langserve
  cfe-import-names: [langserve]
  cfe-source-kind: pypi-sdist
