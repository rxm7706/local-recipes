# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.3"

package:
  name: langserve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langserve/langserve-${{ version }}.tar.gz
  sha256: 2d0f74fb8e633e98fdbd5038fe9774a9dcf136e5c779aa9c6475ac26b5c88d0a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - httpx <1.0,>=0.23.0
    - langchain-core <2,>=0.3
    - orjson <4,>=2
    - pydantic <3.0,>=2.7

tests:
  - python:
      imports:
        - langserve
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/langchain-ai/langserve
  license: LangServe
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION
  repository: https://github.com/langchain-ai/langserve

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: langserve
  cfe-upstream-registry: pypi
  cfe-upstream-name: langserve
