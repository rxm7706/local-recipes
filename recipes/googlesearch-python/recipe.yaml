# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: googlesearch-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/googlesearch-python/googlesearch_python-${{ version }}.tar.gz
  sha256: c5729b1247c2a8f5c4b48ed73c4f8e9fd558ac4e09de67865479f0a33f2d97dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.9
    - requests >=2.20

tests:
  - python:
      imports:
        - googlesearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Nv7-GitHub/googlesearch
  license: MIT
  license_file: LICENSE
  summary: A Python library for scraping the Google search engine.
  description: |
    A Python library for scraping the Google search engine.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
