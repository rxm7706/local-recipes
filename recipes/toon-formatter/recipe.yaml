# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: toon-formatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/toon-formatter/toon_formatter-${{ version }}.tar.gz
  sha256: 806600392b71adc6077fe56cd947640977073f42f7abd82d09c64c7714082967

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0,<3.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - toon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/toon-formatter/
  license: MIT
  license_file: LICENSE
  summary: A comprehensive Python library for encoding, decoding, and converting data using the Token-Oriented Object Notation (TOON) format - optimized for LLM contexts and human readability
  description: |
    A comprehensive Python library for encoding, decoding, and converting data using the Token-Oriented Object Notation (TOON) format - optimized for LLM contexts and human readability

extra:
  recipe-maintainers:
    - rxm7706

