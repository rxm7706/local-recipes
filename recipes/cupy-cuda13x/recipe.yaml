# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "14.1.1"

package:
  name: cupy-cuda13x
  version: ${{ version }}

source:
  url: https://github.com/cupy/cupy/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a57923db0f65e9b65e856a1ec4c16566af51e79a8fcc3d38658b2d6027b20945

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
    - cython >=3.2,<3.3
    - numpy >=2.0
  run:
    - python >=${{ python_min }}
    - numpy <2.6,>=2.0
    - cuda-pathfinder ==1.*,>=1.3.4

tests:
  - python:
      imports:
        - cupy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://cupy.dev/
  license: MIT
  license_file: LICENSE
  summary: "CuPy: NumPy & SciPy for GPU"
  description: |
    CuPy: NumPy & SciPy for GPU
  repository: https://github.com/cupy/cupy
  documentation: https://docs.cupy.dev/

extra:
  recipe-maintainers:
    - rxm7706

