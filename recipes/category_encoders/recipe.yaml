# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.10.0"

package:
  name: category-encoders
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/category-encoders/category_encoders-${{ version }}.tar.gz
  sha256: 28e28a01813ac56d4ed068bb8561f523a527b04abf4261be890ab9adbc5fd143

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - numpy >=1.14.0
    - pandas >=1.0.5
    - patsy >=0.5.1
    - scikit-learn >=1.6.0
    - scipy >=1.0.0
    - statsmodels >=0.9.0

tests:
  - python:
      imports:
        - category_encoders
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/category-encoders/
  license: BSD-3
  license_file: LICENSE
  summary: A package for encoding categorical variables for machine learning
  description: |
    A package for encoding categorical variables for machine learning

extra:
  recipe-maintainers:
    - bollwyvl
    - nirajd
    - wdm0006

