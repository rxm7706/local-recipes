# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.20.0"

package:
  name: meson-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/meson-python/meson_python-${{ version }}.tar.gz
  sha256: 6d9726ae6cd37e22f210c74b364b30180a68c20442e97ff09f3c566a414af738

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - meson >=0.64.0
    - pyproject-metadata >=0.9.0
    - tomli >=1.0.0

tests:
  - python:
      imports:
        - mesonpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mesonbuild/meson-python
  license: MIT
  license_file: LICENSE
  summary: Meson Python build backend (PEP 517)
  description: |
    Meson Python build backend (PEP 517)
  documentation: https://mesonbuild.com/meson-python/

extra:
  recipe-maintainers:
    - awvwgk
    - rgommers

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: meson-python
  cfe-upstream-registry: pypi
  cfe-upstream-name: meson-python
  cfe-purls:
    - pkg:conda/meson-python@${{ version }}?channel=conda-forge
    - pkg:pypi/meson-python@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/mesonbuild/meson-python
  cfe-import-names: [mesonpy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
