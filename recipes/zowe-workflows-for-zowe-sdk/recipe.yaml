# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0.dev26"

package:
  name: zowe-workflows-for-zowe-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zowe-workflows-for-zowe-sdk/zowe_workflows_for_zowe_sdk-${{ version }}.tar.gz
  sha256: 49d69e602c32aa9c9bb017192a8594ab23c227c07816ce5732b6e0cf47432ff1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - -version
    - zowe.core-for-zowe-sdk ~=1.0.0-dev26

tests:
  - python:
      imports:
        - zowe.workflows_for_zowe_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zowe/zowe-client-python-sdk
  license: EPL-2.0
  license_file: LICENSE
  summary: Zowe Python SDK - z/OSMF Workflows package
  description: |
    Zowe Python SDK - z/OSMF Workflows package

extra:
  recipe-maintainers:
    - rxm7706

