# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.44.0"

package:
  name: opentelemetry-proto
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-proto/opentelemetry_proto-${{ version }}.tar.gz
  sha256: c547a79c2f8c0c515d31509154682e5921c7cfd5ca67b70e1f9266e2c3e103f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - protobuf <8.0,>=5.0

tests:
  - python:
      imports:
        - opentelemetry.proto
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-proto
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Python Proto
  description: |
    OpenTelemetry Python Proto
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - pb01ka
    - mparry
    - rxm7706
    - mariusvniekerk

