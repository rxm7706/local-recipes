{% set name = "python-frontmatter" %}
{% set version = "1.3.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: acc73e477a568dc2a25c9e130c6c68ae8daa8c204c8f7e813db47d6a7280dcf2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.11.15,<0.12
  run:
    - python >={{ python_min }}
    - pyyaml

test:
  imports:
    - frontmatter
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eyeseast/python-frontmatter
  summary: Parse and manage posts with YAML (or other) frontmatter
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - abkfenris
