# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: python-frontmatter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-frontmatter/python_frontmatter-${{ version }}.tar.gz
  sha256: acc73e477a568dc2a25c9e130c6c68ae8daa8c204c8f7e813db47d6a7280dcf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.15,<0.12
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - frontmatter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/python-frontmatter/
  license: MIT
  license_file: LICENSE
  summary: Parse and manage posts with YAML (or other) frontmatter
  description: |
    Parse and manage posts with YAML (or other) frontmatter
  documentation: http://python-frontmatter.rtfd.io

extra:
  recipe-maintainers:
    - abkfenris

#### CFE metadata AND comments
