# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-frontmatter
  version: "1.3.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: acc73e477a568dc2a25c9e130c6c68ae8daa8c204c8f7e813db47d6a7280dcf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - uv-build >=0.11.15,<0.12
  run:
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - frontmatter
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Parse and manage posts with YAML (or other) frontmatter
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/eyeseast/python-frontmatter

extra:
  recipe-maintainers:
    - abkfenris
