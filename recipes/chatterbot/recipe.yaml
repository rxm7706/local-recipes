# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.14"

package:
  name: chatterbot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ChatterBot/chatterbot-${{ version }}.tar.gz
  sha256: adf4024ffe8ba1cee391cfa86f324365a2087375e8b8707ebffbeea3f5cc5be4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - mathparse <0.3,>=0.2
    - python-dateutil <2.10,>=2.9
    - sqlalchemy <2.1,>=2.0
    - spacy <3.9,>=3.8
    - tqdm

tests:
  - python:
      imports:
        - chatterbot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/ChatterBot/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: ChatterBot is a machine learning, conversational dialog engine
  description: |
    ChatterBot is a machine learning, conversational dialog engine
  repository: https://github.com/gunthercox/ChatterBot
  documentation: https://docs.chatterbot.us

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: chatterbot
