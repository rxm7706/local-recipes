# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: pyqtgraph
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pyqtgraph/pyqtgraph-0.14.0-py3-none-any.whl
  sha256: 7abb7c3e17362add64f8711b474dffac5e7b0e9245abdf992e9a44119b7aa4f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.25.0
    - colorama

tests:
  - python:
      imports:
        - pyqtgraph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.pyqtgraph.org
  license: MIT
  license_file: LICENSE
  summary: Scientific Graphics and GUI Library for Python
  description: |
    Scientific Graphics and GUI Library for Python
  repository: https://github.com/pyqtgraph/pyqtgraph
  documentation: https://pyqtgraph.readthedocs.io

extra:
  recipe-maintainers:
    - astaric
    - marcelotrevisani
    - ksunden
    - j9ac9k

