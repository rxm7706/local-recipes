# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.7"

package:
  name: vizro-e2e-flow
  version: ${{ version }}

source:
  url: https://github.com/mckinsey/vizro/archive/refs/tags/vizro-e2e-flow-${{ version }}.tar.gz
  sha256: e42331df75bde0b6f96d7098fc8c40cb02ae4f4b526af044146aea15b6cd10a7

build:
  number: 0
  noarch: generic

requirements:
  run:
    - python >=3.10

tests:
  - script:
      - if: not win
        then:
          - vizro-e2e-flow-install --help
          - test -d "${CONDA_PREFIX}/share/vizro-e2e-flow/skills"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/.claude-plugin/plugin.json"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/dashboard-design/SKILL.md"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/dashboard-build/SKILL.md"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/designing-vizro-layouts/SKILL.md"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/selecting-vizro-charts/SKILL.md"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/writing-vizro-yaml/SKILL.md"
          - test -f "${CONDA_PREFIX}/share/vizro-e2e-flow/skills/wiring-vizro-actions/SKILL.md"
      - if: win
        then:
          - vizro-e2e-flow-install.bat --help
          - if not exist "%CONDA_PREFIX%\share\vizro-e2e-flow\skills" exit 1
          - if not exist "%CONDA_PREFIX%\share\vizro-e2e-flow\.claude-plugin\plugin.json" exit 1

about:
  homepage: https://github.com/mckinsey/vizro/tree/main/vizro-e2e-flow
  repository: https://github.com/mckinsey/vizro
  documentation: https://vizro.readthedocs.io/
  license: Apache-2.0
  license_file: vizro-e2e-flow/LICENSE.txt
  summary: Claude Code plugin with skills for end-to-end Vizro dashboard development
  description: |
    vizro-e2e-flow is McKinsey Vizro's Claude Code plugin (six skills: dashboard-design,
    dashboard-build, designing-vizro-layouts, selecting-vizro-charts, writing-vizro-yaml,
    wiring-vizro-actions). It is not published on PyPI; this recipe installs the tagged
    plugin tree into ``$PREFIX/share/vizro-e2e-flow``.

    After installation, run ``vizro-e2e-flow-install`` in a project directory to copy
    the skills into ``.claude/skills/``. Playwright MCP is a host-side Cursor/Claude
    config, not a conda dependency.

extra:
  recipe-maintainers:
    - rxm7706

