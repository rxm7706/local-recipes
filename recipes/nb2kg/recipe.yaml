# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: nb2kg
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nb2kg/nb2kg-${{ version }}.tar.gz
  sha256: 7d6ee9063bc9ba4c0c2f85e61bb83b99e081a09a4a696d7fc28ec56467820560

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nb2kg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyter-incubator/nb2kg
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Extension for Jupyter Notebook 4.2.x to enable remote kernels hosted by Kernel Gateway or Enterprise Gateway
  description: |
    Extension for Jupyter Notebook 4.2.x to enable remote kernels hosted by Kernel Gateway or Enterprise Gateway

extra:
  recipe-maintainers:
    - rxm7706

