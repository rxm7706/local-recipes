    - pkg:pypi/dash@${{ version }}
  cfe-upstream-repo: https://github.com/plotly/dash
  cfe-upstream-homepage: https://plotly.com/dash
  cfe-import-names: [dash]
  cfe-source-kind: pypi-sdist
