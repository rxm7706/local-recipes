# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.1"

package:
  name: dash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dash/dash-${{ version }}.tar.gz
  sha256: 9356ca7856bc496c12c5b6de5978aaf783e090d07450ee395ade1c0c2cbdf816

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    # https://github.com/plotly/dash/blob/dev/requirements/install.txt
    - flask >=1.0.4,<3.2
    - werkzeug <3.2
    - plotly >=5.0.0
    - importlib-metadata
    - typing_extensions >=4.1.1
    - requests
    - retrying
    - nest-asyncio
    - setuptools
    - janus >=1.0.0
    - pydantic >=2.10
    - comm
  run_constraints:
    - dash-html-components >=2.0.0
    - dash-core-components >=2.0.0
    - dash_table >=5.0.0

tests:
  - python:
      imports:
        - dash
        - dash.dash
        - dash.dependencies
        - dash.exceptions
        - dash.resources
        - dash.dcc
        - dash.html
        - dash.dash_table
        - dash.testing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://plotly.com/dash
  license: MIT
  license_file: LICENSE
  summary: A Python framework for building reactive web-apps. Developed by Plotly.
  description: |
    A Python framework for building reactive web-apps. Developed by Plotly.
  repository: https://github.com/plotly/dash
  documentation: https://dash.plotly.com

extra:
  recipe-maintainers:
    - bandersen23
    - moorepants

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dash
  cfe-upstream-registry: pypi
  cfe-upstream-name: dash
