# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jupyterhub-ldapauthenticator
  version: "2.0.2"
  sha256: c08cecd9bd996ab523c810d45204bb4a5eaac7adae38d3ef05eebc58fffc7a87

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyterhub >=4.1.6
    - ldap3 >=2.9.1
    - traitlets

tests:
  - python:
      imports:
        - ldapauthenticator
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: LDAP Authenticator for JupyterHub
  homepage: https://github.com/jupyterhub/ldapauthenticator

extra:
  recipe-maintainers:
    - dhirschfeld
    - minrk
    - consideRatio
