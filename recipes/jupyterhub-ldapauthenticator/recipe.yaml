# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.2"

package:
  name: jupyterhub-ldapauthenticator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyterhub-ldapauthenticator/jupyterhub_ldapauthenticator-${{ version }}.tar.gz
  sha256: c08cecd9bd996ab523c810d45204bb4a5eaac7adae38d3ef05eebc58fffc7a87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jupyterhub >=4.1.6
    - ldap3 >=2.9.1
    - traitlets

tests:
  - python:
      imports:
        - ldapauthenticator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jupyterhub/ldapauthenticator
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: LDAP Authenticator for JupyterHub
  description: |
    LDAP Authenticator for JupyterHub

extra:
  recipe-maintainers:
    - dhirschfeld
    - minrk
    - consideRatio

#### CFE metadata AND comments
