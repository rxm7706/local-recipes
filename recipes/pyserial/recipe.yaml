# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.5"

package:
  name: pyserial
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyserial/pyserial-${{ version }}.tar.gz
  sha256: 3c77e014170dfffbd816e6ffc205e9842efb10be9f58ec16d3e8675b4925cddb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - serial
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pyserial/pyserial
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Python Serial Port Extension
  description: |
    Python Serial Port Extension

extra:
  recipe-maintainers:
    - shaunwbell
    - carlodri

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyserial
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyserial
  cfe-purls:
    - pkg:conda/pyserial@${{ version }}?channel=conda-forge
    - pkg:pypi/pyserial@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/pyserial/pyserial
  cfe-import-names: [serial]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/pyserial-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
    - missing-license-file

  cfe-last-checked: 2026-08-18T04:01:51Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-18T04:01:51Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-08-18T04:01:51Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
