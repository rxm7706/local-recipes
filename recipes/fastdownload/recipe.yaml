# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastdownload
  version: "0.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastdownload-${{ version }}.tar.gz
  sha256: 20507edb8e89406a1fbd7775e6e2a3d81a4dd633dd506b0e9cf0e1613e831d6a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
  run:
    - python >=${{ python_min }}
    - fastprogress
    - fastcore >=1.3.26

tests:
  - python:
      imports:
        - fastdownload
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A general purpose data downloading library.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fastai/fastdownload/tree/master/

extra:
  recipe-maintainers:
    - giswqs
