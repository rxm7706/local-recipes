# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: jinja2-ansible-filters
  version: "1.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jinja2-ansible-filters-${{ version }}.tar.gz
  sha256: 07c10cf44d7073f4f01102ca12d9a2dc31b41d47e4c61ed92ef6a6d2669b356b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - jinja2
    - python >=${{ python_min }}
    - pyyaml

tests:
  - python:
      imports:
        - jinja2_ansible_filters
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A port of Ansible's jinja2 filters without requiring ansible core.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/jinja2-ansible-filters/

extra:
  recipe-maintainers:
    - kir0ul
