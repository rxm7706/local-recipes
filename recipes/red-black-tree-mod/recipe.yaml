# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.22"

package:
  name: red-black-tree-mod
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/red-black-tree-mod/red-black-tree-mod-${{ version }}.tar.gz
  sha256: 38e3652903a2bf96379c27c2082ca0b7b905158662dd7ef0c97f4fd93a9aa908

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - red_black_tree_mod
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://stromberg.dnsalias.org/~strombrg/red-black-tree-mod/
  license: MIT
  license_file: LICENSE
  summary: Flexible python implementation of red black trees
  description: |
    Flexible python implementation of red black trees

extra:
  recipe-maintainers:
    - jan-janssen

