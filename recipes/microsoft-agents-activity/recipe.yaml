# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: microsoft-agents-activity
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/microsoft-agents-activity/microsoft_agents_activity-${{ version }}.tar.gz
  sha256: b62f51710343548ca90d5b192ba9a27a31fc9868ed1ccd79a09d5442e74e8690

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - pyjwt
    - pydantic >=2.10.4

tests:
  - python:
      imports:
        - microsoft_agents.activity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/Agents
  license: MIT
  license_file: LICENSE
  summary: A protocol library for Microsoft Agents
  description: |
    A protocol library for Microsoft Agents

extra:
  recipe-maintainers:
    - rxm7706

