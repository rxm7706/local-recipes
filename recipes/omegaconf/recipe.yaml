# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.1"

package:
  name: omegaconf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/omegaconf/omegaconf-${{ version }}.tar.gz
  sha256: e5e7de64aeebeddaf8e6d3f7a783b32ac2a01c0fbd9c878012caecb891a1f42a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - antlr4-python3-runtime ==4.9.*
    - pyyaml >=5.1.0
    - dataclasses

tests:
  - python:
      imports:
        - omegaconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/omry/omegaconf
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A flexible configuration library
  description: |
    A flexible configuration library

extra:
  recipe-maintainers:
    - maresb
    - mdraw
    - omry
    - benjaminrwilson

#### CFE metadata AND comments
