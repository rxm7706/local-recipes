# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: azure-mgmt-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-mgmt-core/azure_mgmt_core-${{ version }}.tar.gz
  sha256: b26232af857b021e61d813d9f4ae530465255cb10b3dde945ad3743f7a58e79c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core >=1.32.0

tests:
  - python:
      imports:
        - azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/core/azure-mgmt-core
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Management Core Library for Python
  description: |
    Microsoft Azure Management Core Library for Python

extra:
  recipe-maintainers:
    - tim-werner
    - xylar

