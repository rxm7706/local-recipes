# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: numkong
  version: "7.7.0"

recipe:
  name: numkong-with-alias
  version: ${{ version }}

source:
  url: https://github.com/ashvardanian/NumKong/archive/v${{ version }}.tar.gz
  sha256: 5a93b73d1aa551dff05bb5ba3520977fba64ac2ce10036d525db831cedd26bf2

build:
  number: 0

outputs:
  - package:
      name: numkong
    build:
      script: python -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: osx
          then: llvm-openmp
        - if: linux
          then: libgomp
      host:
        - python
        - setuptools
        - wheel
        - pip
        - if: osx
          then: llvm-openmp
        - if: linux
          then: libgomp
      run:
        - python
        - _openmp_mutex
    tests:
      - python:
          imports:
            - numkong
          pip_check: true
  - package:
      name: simsimd
    requirements:
      host:
        - python
      run:
        - python
        - ${{ pin_subpackage(name, exact=True) }}
    tests:
      - python:
          imports:
            - numkong
          pip_check: false
      - requirements:
          run:
            - python

about:
  summary: Portable mixed-precision BLAS-like vector math library for x86 and ARM
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ashvardanian/NumKong

extra:
  recipe-maintainers:
    - mukhery
