# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"
  python_min: "3.11"

package:
  name: quart-authlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quart-authlib/quart_authlib-${{ version }}.tar.gz
  sha256: 240992dfa89c796f64bf609d103b2b018952c4a5b12bf37626e84448b652d837

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - authlib
    - requests
    - quart

tests:
  - python:
      imports:
        - quart_authlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/quart-authlib/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Quart extension for the Authlib library
  description: |
    Quart extension for the Authlib library

extra:
  recipe-maintainers:
    - rxm7706

