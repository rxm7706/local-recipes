# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: cloudevents
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cloudevents-${{ version }}.tar.gz
  sha256: fc52440a1fecde882b3b745361e1c7dd4e044e71a6b719cfec2e2c0aa1a19fa3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - hatchling
  run:
    - python >=${{ python_min }}
    - deprecation >=2.0,<3.0
    - pydantic >=1.0.0,<3.0
    - python-dateutil >=2.8.2

tests:
  - python:
      imports:
        - cloudevents
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: CloudEvents Python SDK
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/cloudevents/sdk-python

extra:
  recipe-maintainers:
    - sarthakpati
