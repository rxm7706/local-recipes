# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: interpret-community
  version: "0.32.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/interpret_community-${{ version }}.tar.gz
  sha256: 23fc09bc17f23da786927f178f999c221299d89303a8186acdfb7cadc90ab41b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scipy
    - ml-wrappers >=0.6.0,<0.7.dev0
    - scikit-learn
    - packaging
    - interpret-core >=0.1.20,<=0.6.9
    - shap >=0.20.0,<=0.46.0
    - raiutils ~=0.4.0
    # - tensorflow
    # - pyyaml
    # - lime >=0.2.0.0
    # - lightgbm
    # - keras
    # - hdbscan

tests:
  - python:
      imports:
        - interpret_community
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Microsoft Interpret Extensions SDK for Python
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/interpretml/interpret-community

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: interpret-community
  cfe-upstream-registry: pypi
  cfe-upstream-name: interpret-community
  cfe-purls:
    - pkg:conda/interpret-community@${{ version }}?channel=conda-forge
    - pkg:pypi/interpret-community@${{ version }}
  cfe-upstream-repo: https://github.com/interpretml/interpret-community
  cfe-upstream-homepage: https://github.com/interpretml/interpret-community
  cfe-import-names: [interpret_community]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/interpret-community-feedstock
