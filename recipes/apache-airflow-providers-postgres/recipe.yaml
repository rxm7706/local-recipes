# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0.1"

package:
  name: apache-airflow-providers-postgres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-postgres/apache_airflow_providers_postgres-${{ version }}.tar.gz
  sha256: 41176eb06fdc39aa8d3623aa95e12e49349ed243eca39043e5944c35bc7659ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.12.0
    - apache-airflow-providers-common-sql >=1.32.0
    - psycopg >=3.2.9
    - psycopg2 >=2.9.9
    - asyncpg >=0.30.0

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-postgres/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-postgres for Apache Airflow
  description: |
    Provider package apache-airflow-providers-postgres for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-postgres/7.0.1

extra:
  recipe-maintainers:
    - xylar

