# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: ropwr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ropwr/ropwr-${{ version }}.tar.gz
  sha256: af0d8b7d6df279ce180f409660216ee3dd228f86a2127a1d9e7aa8f44adac8a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cvxpy >=1.6
    - numpy >=1.16
    - scikit-learn >=1.6.0
    - scipy >=1.6.1

tests:
  - python:
      imports:
        - ropwr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/guillermo-navas-palencia/ropwr
  license: Apache-2.0
  license_file: LICENSE
  summary: "RoPWR: Robust Piecewise Regression"
  description: |
    Robust piecewise regression with shape constraints, implemented on
    top of cvxpy / scikit-learn.
  repository: https://github.com/guillermo-navas-palencia/ropwr

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ropwr
  cfe-upstream-registry: pypi
  cfe-upstream-name: ropwr
  cfe-purls:
    - pkg:conda/ropwr@${{ version }}?channel=conda-forge
    - pkg:pypi/ropwr@${{ version }}
  cfe-upstream-repo: https://github.com/guillermo-navas-palencia/ropwr
  cfe-upstream-homepage: https://github.com/guillermo-navas-palencia/ropwr
  cfe-import-names: [ropwr]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
