# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: os-service-types
  version: "1.9.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 1f2e5fb71d1f6f4ff31d8992674f2368465bc2f25cd94018015c3ddbfc5c617f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools
    - pbr !=2.1.0,>=2.0.0
  run:
    - python >=${{ python_min }}
    - pbr !=2.1.0,>=2.0.0
    - typing-extensions

tests:
  - python:
      imports:
        - os_service_types
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Summary of the package
  description: Python library for consuming OpenStack sevice-types-authority data.
  homepage: https://docs.openstack.org/os-service-types/latest/
  repository: https://git.openstack.org/cgit/openstack/os-service-types
  documentation: https://docs.openstack.org/os-service-types/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - tschoonj
