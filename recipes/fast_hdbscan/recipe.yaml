# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fast_hdbscan
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fast_hdbscan-${{ version }}.tar.gz
  sha256: 248e09202eda04da4b84dd819de3cc714469912205bb447ad4c7136db580f205

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=40.6.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.21
    - numba >=0.56
    - scikit-learn >=1.1

tests:
  - python:
      imports:
        - fast_hdbscan
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A fast multicore version of hdbscan for low dimensional euclidean spaces
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://github.com/TutteInstitute/fast_hdbscan

extra:
  recipe-maintainers:
    - apcamargo
