# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.2"

package:
  name: cutie
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cutie/cutie-${{ version }}.tar.gz
  sha256: 0798dee98e71d84ebc01a125155c8d94c96cc9d04cf69294d8b9a68edd93696d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - colorama
    - readchar

tests:
  - python:
      imports:
        - cutie
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kamik423/cutie
  license: MIT
  license_file: LICENSE
  summary: Commandline User Tools for Input Easification
  description: |
    Commandline User Tools for Input Easification

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: cutie
  cfe-upstream-registry: pypi
  cfe-upstream-name: cutie
  cfe-purls:
    - pkg:conda/cutie@${{ version }}?channel=conda-forge
    - pkg:pypi/cutie@${{ version }}
  cfe-upstream-repo: https://github.com/kamik423/cutie
  cfe-upstream-homepage: https://github.com/kamik423/cutie
