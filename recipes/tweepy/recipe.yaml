# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.17.0"

package:
  name: tweepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tweepy/tweepy-${{ version }}.tar.gz
  sha256: c232e9fffa0b15b81d5ff8ec59d46af85e330285ffc3e64614d2418fb9af71b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - oauthlib <4,>=3.2.0
    - requests <3,>=2.27.0
    - requests-oauthlib <3,>=1.2.0

tests:
  - python:
      imports:
        - tweepy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://tweepy.org
  license: MIT
  license_file: LICENSE
  summary: Library for accessing the X API (Twitter)
  description: |
    Library for accessing the X API (Twitter)
  repository: https://github.com/tweepy/tweepy
  documentation: https://docs.tweepy.org

extra:
  recipe-maintainers:
    - nikicc
    - ocefpaf

