# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.4"

package:
  name: flask-babelex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-BabelEx/Flask-BabelEx-${{ version }}.tar.gz
  sha256: 39a59ccee9386a9d52d80b9101224402036aedc2c7873b11deef6e4e21cace27

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - babel
    - speaklater
    - jinja2

tests:
  - python:
      imports:
        - flask_babelex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/mrjoes/flask-babelex
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Adds i18n/l10n support to Flask applications
  description: |
    Adds i18n/l10n support to Flask applications

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf

