# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: hachoir
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hachoir/hachoir-${{ version }}.tar.gz
  sha256: fd7679f649c17ee45ab2ba5eacddc702c667ea5200c0a1fd063d4615fa7270d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hachoir
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://hachoir.readthedocs.io/
  license: GPL-2.0
  license_file: LICENSE
  summary: Package of Hachoir parsers used to open binary files
  description: |
    Package of Hachoir parsers used to open binary files
  repository: https://github.com/vstinner/hachoir

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
