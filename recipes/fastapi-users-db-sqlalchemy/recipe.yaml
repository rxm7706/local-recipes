# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fastapi-users-db-sqlalchemy
  version: "7.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6823eeedf8a92f819276a2b2210ef1dcfd71fe8b6e37f7b4da8d1c60e3dfd595

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core
    - pip
    - hatchling
    - hatch-regex-commit
    - python ${{ python_min }}
  run:
    - python >=${{ python_min }}
    - fastapi-users >=10.0.0
    - sqlalchemy >=2.0.0,<2.1.0

tests:
  - python:
      imports:
        - fastapi_users_db_sqlalchemy
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: FastAPI Users - Database adapter for SQLAlchemy + encode/databases
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/fastapi-users/fastapi-users-db-sqlalchemy
  documentation: https://fastapi-users.github.io/fastapi-users

extra:
  recipe-maintainers:
    - davidbrochart
