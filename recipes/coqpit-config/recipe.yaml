# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.5"

package:
  name: coqpit-config
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coqpit-config/coqpit_config-${{ version }}.tar.gz
  sha256: e1dc8a1269c18490005cd1135499bc338d34129bc5781fd817f62cad25a64b55

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.10

tests:
  - python:
      imports:
        - coqpit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/coqpit-config/
  license: MIT
  license_file: LICENSE
  summary: Simple (maybe too simple), light-weight config management through python data-classes.
  description: |
    Simple (maybe too simple), light-weight config management through python data-classes.
  repository: https://github.com/idiap/coqui-ai-coqpit

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
