# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.0"

package:
  name: progressbar2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/progressbar2/progressbar2-${{ version }}.tar.gz
  sha256: fe48c8955a84428af77bff2642ba47041e1b8f7c867a5b7cc94f8bc255a8f0cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - python-utils >=3.8.1
    - if: win
      then:
        - pywin32

tests:
  - python:
      imports:
        - progressbar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/progressbar2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A Python Progressbar library to provide visual (yet text based) progress to long running operations.
  description: |
    A Python Progressbar library to provide visual (yet text based) progress to long running operations.
  documentation: https://progressbar-2.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - maartenbreddels
    - WoLpH
    - marcelotrevisani
    - BastianZim

