# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10"

package:
  name: symphony
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/symphony/symphony-${{ version }}.tar.gz
  sha256: 3974cf9e14e556e382507058b0037bb5608bfa3217fb3806fd234f2a26b8776a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - libtmux
    - nanolog
    - docker-py
    - pyyaml
    - benedict

tests:
  - python:
      imports:
        - symphony
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/SurrealAI/symphony
  license: GPL-3.0-only
  license_file: LICENSE
  summary: a distributed process orchestration platform that supports both laptop and major cloud providers
  description: |
    a distributed process orchestration platform that supports both laptop and major cloud providers

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
