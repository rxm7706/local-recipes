# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "20.3.0"

package:
  name: arize-phoenix
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arize-phoenix/arize_phoenix-${{ version }}.tar.gz
  sha256: c7dbed1be7c14e6a9aa2e212d0e39a7ebfaa6c134cf86201ec69c85cdfdd2388

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aioitertools
    - aiosqlite >=0.22.1
    - alembic <2,>=1.3.0
    - arize-phoenix-client >=3.0.0
    - arize-phoenix-evals >=3.4.0
    - arize-phoenix-otel >=0.17.0
    - arize-phoenix-sqlean
    - authlib >=1.7.0
    - bashkit !=0.14.2,>=0.10.0
    - cachetools
    - email-validator
    - fastapi >=0.137.0
    - fastmcp-slim <4,>=3.4.2
    - grpc-interceptor
    - grpcio
    - httpx
    - jinja2
    - jmespath
    - joserfc
    - jsonpath-ng
    - jsonschema
    - ldap3
    - numpy
    - openinference-instrumentation-openai >=0.1.41
    - openinference-instrumentation >=0.1.44
    - openinference-semantic-conventions >=0.1.26
    - opentelemetry-exporter-otlp
    - opentelemetry-proto >=1.12.0
    - opentelemetry-sdk
    - orjson
    - pandas >=1.0
    - prometheus_client
    - psutil
    - pyarrow
    - pydantic-ai-slim <3,>=2.26.0
    - pydantic-monty ==0.0.19
    - pydantic >=2.1.0
    - pystache
    - python-dateutil
    - python-multipart
    - pyyaml
    - scikit-learn
    - scipy
    - sqlalchemy <3,>=2.0.46
    - sqlglot ==30.15.0
    - starlette >=0.37.0
    - strawberry-graphql ==0.320.4
    - tqdm
    - typing_extensions >=4.6
    - uvicorn
    - wrapt <3,>=1.17.2

tests:
  - python:
      imports:
        - evals
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/arize-phoenix/
  license: Elastic-2.0
  license_file: LICENSE
  summary: AI Observability and Evaluation
  description: |
    AI Observability and Evaluation
  repository: https://github.com/Arize-ai/phoenix
  documentation: https://arize.com/docs/phoenix/

extra:
  recipe-maintainers:
    - anticorrelator
    - mikeldking
    - rogerhyang
    - michaelschiff
    - fjcasti1
    - axiomofjoy

