# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: orchestra-sdk
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orchestra-sdk/orchestra_sdk-${{ version }}.tar.gz
  sha256: 1eb8dea1a33a04f2fa84f8bd418bf982729d46bcde2005750ef19404e30825eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=${{ python_min }}
    - requests
    - tenacity

tests:
  - python:
      imports:
        - orchestra_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/orchestra-sdk/
  license: MIT
  license_file: LICENSE
  summary: Orchestra SDK for updating self-hosted Tasks.
  description: |
    Orchestra SDK for updating self-hosted Tasks.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
