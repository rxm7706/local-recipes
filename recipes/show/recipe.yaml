# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: show
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/show/show-1.6.0.zip
  sha256: 5317c2f0e43a15af580e2698d16f5b7dccddc597a945267b3a1f0164c6e8d340

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - show
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://bitbucket.org/jeunice/show
  license: Apache-2.0
  license_file: LICENSE
  summary: Debug print statements, done right. E.g. show(x)
  description: |
    Debug print statements, done right. E.g. show(x)

extra:
  recipe-maintainers:
    - rxm7706

