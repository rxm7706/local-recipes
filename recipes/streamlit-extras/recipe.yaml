# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: streamlit-extras
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-extras/streamlit_extras-${{ version }}.tar.gz
  sha256: d75bfabd2be35f1fba6bce3935d1c446cfcfbe03123478df1b5ba4a02a7c49c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - plotly >=5.23.0
    - streamlit >=1.54.0

tests:
  - python:
      imports:
        - streamlit_extras
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arnaudmiribel/streamlit-extras
  license: Apache-2.0
  license_file: LICENSE
  summary: A community-driven collection of useful Streamlit components and utilities that extend Streamlit's functionality.
  description: |
    A community-driven collection of useful Streamlit components and utilities that extend Streamlit's functionality.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
