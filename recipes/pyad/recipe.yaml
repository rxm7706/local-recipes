# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: pyad
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyad/pyad-${{ version }}.tar.gz
  sha256: 99f8b491e15045ada151ebf6d6951e9dd4b5bb4add9c926c8f5a934ddbf075c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://zakird.com/pyad
  license: Apache-2.0
  license_file: LICENSE
  summary: An Object-Oriented Active Directory management framework built on ADSI
  description: |
    An Object-Oriented Active Directory management framework built on ADSI

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyad
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyad
