    - pkg:pypi/pyad@${{ version }}
  cfe-upstream-repo: https://zakird.com/pyad
  cfe-upstream-homepage: https://zakird.com/pyad
  cfe-import-names: [pyad]
  cfe-source-kind: pypi-sdist
