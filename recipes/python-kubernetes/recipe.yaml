# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2"

package:
  name: python-kubernetes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-kubernetes/python-kubernetes-${{ version }}.tar.gz
  sha256: d35ccb8ae7a30554b589c3a39ec07b78a64b5107fd828527d2d96d2ac0e7ef04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - kubernetes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cosmos-io/python-kubernetes
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python wrapper around the Kubernetes API
  description: |
    A Python wrapper around the Kubernetes API

extra:
  recipe-maintainers:
    - johanneskoester
    - ocefpaf

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-kubernetes
  cfe-upstream-registry: pypi
  cfe-upstream-name: python-kubernetes
