    - pkg:pypi/python-kubernetes@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/cosmos-io/python-kubernetes
  cfe-import-names: [kubernetes]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/python-kubernetes-feedstock
  cfe-forge-recipe-updates-needed: 
    - version-update-to-0.2

  cfe-forge-blocker-list:
