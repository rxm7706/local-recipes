# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0"

package:
  name: socks
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/socks/socks-${{ version }}.tar.gz
  sha256: 727e9b4620730601c0360a00c7f4ae26295146c0a91af173bd155cc991edf765

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - socks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/socks/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: This package was automatically generated with 'register_pypi' and should be deleted soon!
  description: |
    This package was automatically generated with 'register_pypi' and should be deleted soon!

extra:
  recipe-maintainers:
    - rxm7706

