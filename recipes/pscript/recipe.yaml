# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pscript
  version: "0.8.1"
  sha256: d3858bf9b34454af8018c7eab832c2f4aaf54f878d7e40f3131ff6dd634bcdfd

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=2.7,<3|>=3.5
    - pip
    - flit
  run:
    - python >=2.7,<3|>=3.5

tests:
  - python:
      imports:
        - pscript
      pip_check: false

about:
  summary: library for transpiling Python code to JavaScript.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: http://pscript.readthedocs.io
  repository: https://github.com/flexxui/pscript
  documentation: http://pscript.readthedocs.io

extra:
  recipe-maintainers:
    - almarklein
