# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.1"

package:
  name: structlog-sentry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/structlog-sentry/structlog_sentry-${{ version }}.tar.gz
  sha256: 78cf8751c7712e361d9d5e82fcde6c3f692a67e3e67068ccdd46448014636138

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.5.1
  run:
    - python >=${{ python_min }}
    - sentry-sdk <3.0.0,>=2.15.0
    - structlog

tests:
  - python:
      imports:
        - structlog_sentry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kiwicom/structlog-sentry
  license: MIT
  license_file: LICENSE
  summary: Sentry integration for structlog
  description: |
    Sentry integration for structlog
  repository: https://github.com/kiwicom/structlog-sentry

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
