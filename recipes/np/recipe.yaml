# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: np
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/np/np-${{ version }}.tar.gz
  sha256: 781265283f3823663ad8fb48741aae62abcf4c78bc19f908f8aa7c1d3eb132f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - np
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/k7hoven/np
  license: MIT
  license_file: LICENSE
  summary: "np = numpy++: numpy with added convenience functionality"
  description: |
    np = numpy++: numpy with added convenience functionality

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: np
  cfe-upstream-registry: pypi
  cfe-upstream-name: np
  cfe-purls:
    - pkg:conda/np@${{ version }}?channel=conda-forge
    - pkg:pypi/np@${{ version }}
  cfe-upstream-repo: https://github.com/k7hoven/np
  cfe-upstream-homepage: https://github.com/k7hoven/np
  cfe-import-names: [np]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
