# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.7"

package:
  name: pyats.contrib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/p/pyats.contrib/pyats_contrib-26.7-py3-none-any.whl
  sha256: 316bfdf7c54c279f3bb8c8f2b173ebbd26aa98e5195e49711d7494a03b269fa4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - requests-toolbelt
    - xlrd ==1.2
    - xlwt
    - xlsxwriter

tests:
  - python:
      imports:
        - pyats.contrib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://developer.cisco.com/pyats/
  license: Apache-2.0
  license_file: LICENSE
  summary: Open source package for pyATS framework extensions.
  description: |
    Open source package for pyATS framework extensions.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
