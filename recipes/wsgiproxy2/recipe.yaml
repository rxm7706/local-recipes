# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.1"

package:
  name: wsgiproxy2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/WSGIProxy2/WSGIProxy2-${{ version }}.tar.gz
  sha256: 0d9ecb141de720e2fd4f7a275a4a83a961ffeb6717483d940021ffa1c46f665c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - webob

tests:
  - python:
      imports:
        - wsgiproxy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/gawel/WSGIProxy2/
  license: MIT
  license_file: LICENSE
  summary: A WSGI Proxy with various http client backends
  description: |
    A WSGI Proxy with various http client backends

extra:
  recipe-maintainers:
    - nehaljwani

#### CFE metadata AND comments
