# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.26.4.post0"

package:
  name: farm-haystack
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/farm-haystack/farm_haystack-${{ version }}.tar.gz
  sha256: 000b6e9ac19151423ede24c20ad99130ff6a61fef0309b21b553ca85e5e906fe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.8.0
  run:
    - python >=${{ python_min }}
    - boilerpy3
    - events
    - httpx
    - jsonschema
    - lazy-imports ==0.3.1
    - more-itertools
    - networkx
    - pandas
    - pillow
    - platformdirs
    - posthog
    - prompthub-py ==4.0.0
    - pydantic <2
    - quantulum3
    - rank-bm25
    - requests
    - requests-cache <1.0.0
    - scikit-learn >=1.3.0
    - sseclient-py
    - tenacity
    - tiktoken >=0.5.1
    - tqdm
    - transformers <5.0,>=4.46

tests:
  - python:
      imports:
        - haystack
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deepset-ai/haystack
  license: Apache-2.0
  license_file: LICENSE
  summary: LLM framework to build customizable, production-ready LLM applications. Connect components (models, vector DBs, file converters) to pipelines or agents that can interact with your data.
  description: |
    LLM framework to build customizable, production-ready LLM applications. Connect components (models, vector DBs, file converters) to pipelines or agents that can interact with your data.

extra:
  recipe-maintainers:
    - rxm7706

