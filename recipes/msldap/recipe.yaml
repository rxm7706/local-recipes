# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.15"

package:
  name: msldap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msldap/msldap-${{ version }}.tar.gz
  sha256: b8024a2c0559158ec407cb6317201ecc83627248baaeecee5dfd4419ca773e3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
  run:
    - python >=${{ python_min }}
    - unicrypto >=0.0.10
    - asyauth >=0.0.18
    - asysocks >=0.2.11
    - asn1crypto >=1.3.0
    - winacl >=0.1.8
    - prompt-toolkit >=3.0.2
    - tqdm
    - wcwidth
    - tabulate

tests:
  - python:
      imports:
        - msldap
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/skelsec/msldap
  license: MIT
  license_file: LICENSE
  summary: Python library to play with MS LDAP
  description: |
    Python library to play with MS LDAP

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
