# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: WebHelpers
  version: "1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ea86f284e929366b77424ba9a89341f43ae8dee3cbeb8702f73bcf86058aa583
  patches:
    - patch4.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
    - markupsafe >=0.9.2
  run:
    - markupsafe >=0.9.2
    - python

tests:
  - python:
      imports:
        - webhelpers
        - webhelpers.html
        - webhelpers.pylonslib
      pip_check: false
  - requirements:
      run:
        - nose
        - routes
        - webob

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Web Helpers
  homepage: http://webhelpers.groovie.org/
  repository: https://bitbucket.org/bbangert/webhelpers/src/trunk/
  documentation: https://webhelpers.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mxr-conda
    - mwilson8
    - rluria14
    - oblute
