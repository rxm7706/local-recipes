# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.9.10"

package:
  name: tensorflow-datasets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tensorflow-datasets/tensorflow_datasets-${{ version }}.tar.gz
  sha256: c681c9b0e5de2acbec79ece2ad41712dfda3f1bfdb3ffc34d5c0afd786eba0f6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - packaging
  run:
    - python >=${{ python_min }}
    - absl-py
    - dm-tree
    - etils >=1.6.0
    - immutabledict
    - numpy
    - promise
    - protobuf >=3.20
    - psutil
    - pyarrow
    - requests >=2.19.0
    - simple-parsing
    - tensorflow-metadata
    - termcolor
    - toml
    - tqdm
    - wrapt
    - importlib_resources
    - if: linux
      then:
        - envlogger
        - envlogger
        - envlogger
        - envlogger
        - envlogger
        - envlogger

tests:
  - python:
      imports:
        - tensorflow_datasets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tensorflow/datasets
  license: Apache-2.0
  license_file: LICENSE
  summary: tensorflow/datasets is a library of datasets ready to use with TensorFlow.
  description: |
    tensorflow/datasets is a library of datasets ready to use with TensorFlow.

extra:
  recipe-maintainers:
    - JennaLipscomb
    - mxr-conda
    - ngam

#### CFE metadata AND comments
