# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.0"

package:
  name: cloudpathlib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudpathlib/cloudpathlib-${{ version }}.tar.gz
  sha256: c521a984e77b47e656fe78e20a7e3e260e0ab45fc69e33ac01094227c979e34a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - typing_extensions >4

tests:
  - python:
      imports:
        - cloudpathlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/cloudpathlib/
  license: MIT
  license_file: LICENSE
  summary: pathlib-style classes for cloud storage services.
  description: |
    pathlib-style classes for cloud storage services.
  repository: https://github.com/drivendataorg/cloudpathlib
  documentation: https://cloudpathlib.drivendata.org/

extra:
  recipe-maintainers:
    - jayqi

