# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.8"

package:
  name: walrus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/walrus/walrus-${{ version }}.tar.gz
  sha256: fd2827ac265e857b485792c9da83ed6e22a00fe3e5fb9c2655ad59e2daf7966e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - redis-py

tests:
  - python:
      imports:
        - walrus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/walrus/
  license: MIT
  license_file: LICENSE
  summary: a set of utilities for working with redis
  description: |
    a set of utilities for working with redis
  repository: https://github.com/coleifer/walrus
  documentation: https://walrus.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
