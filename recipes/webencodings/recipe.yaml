# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: webencodings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/webencodings/webencodings-${{ version }}.tar.gz
  sha256: 565f9ad031c702dae404e27a099e3e09186a3ab1b9520f06d215502b651fd910

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<5
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - webencodings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/CourtBouillon/webencodings
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Character encoding aliases for legacy web content
  description: |
    Character encoding aliases for legacy web content
  repository: https://github.com/CourtBouillon/webencodings
  documentation: https://doc.courtbouillon.org/webencodings

extra:
  recipe-maintainers:
    - jschueller
    - ocefpaf

