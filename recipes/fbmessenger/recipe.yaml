# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0"

package:
  name: fbmessenger
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fbmessenger/fbmessenger-${{ version }}.tar.gz
  sha256: 6e42c4588a4c942547be228886278bbc7a084e0b34799c7e6ebd786129f021e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - fbmessenger
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rehabstudio/fbmessenger
  license: Apache-2.0
  license_file: LICENSE
  summary: A python library to communicate with the Facebook Messenger API's
  description: |
    A python library to communicate with the Facebook Messenger API's

extra:
  recipe-maintainers:
    - rxm7706

