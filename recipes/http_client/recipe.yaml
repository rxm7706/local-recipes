# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.22"

package:
  name: http_client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/http_client/http_client-${{ version }}.tar.gz
  sha256: f33d77e4e08b70659e1497eeb3d2121a3c6e8a4c252b3c6a56e87a16bb442f91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - http_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/huynhminhson/http_client
  license: MIT
  license_file: LICENSE
  summary: Fast and robust HTTP client based on PyCurl
  description: |
    Fast and robust HTTP client based on PyCurl

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: http_client
  cfe-upstream-registry: pypi
  cfe-upstream-name: http_client
  cfe-purls:
