    - pkg:pypi/http-client@${{ version }}
  cfe-upstream-repo: https://github.com/huynhminhson/http_client
  cfe-upstream-homepage: https://github.com/huynhminhson/http_client
  cfe-import-names: [http_client]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
