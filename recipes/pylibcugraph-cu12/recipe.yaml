# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: pylibcugraph-cu12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp311/p/pylibcugraph-cu12/pylibcugraph_cu12-26.8.0-cp311-abi3-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl
  sha256: d4d984440d41ba137e40abb1fb38b66c2dcd0456180110a00b47ba810f258fb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cupy-cuda12x !=14.1.0,>=14.0.1
    - libcugraph-cu12 ==26.8.*
    - numpy <3.0,>=2.0
    - pylibraft-cu12 ==26.8.*
    - rmm-cu12 ==26.8.*

tests:
  - python:
      imports:
        - pylibcugraph_cu12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidsai/cugraph
  license: Apache-2.0
  license_file: LICENSE
  summary: pylibcugraph - Python bindings for the libcugraph cuGraph C/C++/CUDA library
  description: |
    pylibcugraph - Python bindings for the libcugraph cuGraph C/C++/CUDA library
  documentation: https://docs.rapids.ai/api/cugraph/stable/

extra:
  recipe-maintainers:
    - rxm7706

