# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: pytest-click
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-click/pytest_click-${{ version }}.tar.gz
  sha256: fdd9f6721f877dda021e7c5dc73e70aecd37e5ed23ec6820f8a7b3fd7b4f8d30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=40.6.0
    - wheel
  run:
    - python >=${{ python_min }}
    - click
    - pytest

tests:
  - python:
      imports:
        - pytest_click
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Stranger6667/pytest-click
  license: MIT
  license_file: LICENSE
  summary: Pytest plugin for Click
  description: |
    Pytest plugin for Click

extra:
  recipe-maintainers:
    - chrisburr

