# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-click
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pytest_click-${{ version }}.tar.gz
  sha256: fdd9f6721f877dda021e7c5dc73e70aecd37e5ed23ec6820f8a7b3fd7b4f8d30

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=40.6.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - click >=6.0
    - pytest >=5.0

tests:
  - python:
      imports:
        - pytest_click
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pytest plugin for Click
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Stranger6667/pytest-click

extra:
  recipe-maintainers:
    - chrisburr
