# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "69.0"

package:
  name: weasyprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/weasyprint/weasyprint-${{ version }}.tar.gz
  sha256: a7a32f39ca16bd82ef11de99c92ea4b5f14951c9033af035e451ce4f4ee0a88c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - pydyf >=0.11.0
    - cffi >=0.6
    - tinyhtml5 >=2.0.0b1
    - tinycss2 >=1.5.0
    - cssselect2 >=0.8.0
    - pyphen >=0.9.1
    - pillow >=9.1.0
    - fonttools >=4.59.2

tests:
  - python:
      imports:
        - weasyprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://weasyprint.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The Awesome Document Factory
  description: |
    The Awesome Document Factory
  repository: https://github.com/Kozea/WeasyPrint
  documentation: https://doc.courtbouillon.org/weasyprint/

extra:
  recipe-maintainers:
    - liZe
    - mrandrewandrade
    - rxm7706

