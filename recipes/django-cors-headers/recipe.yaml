# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.9.0"

package:
  name: django-cors-headers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-cors-headers/django_cors_headers-${{ version }}.tar.gz
  sha256: fe5d7cb59fdc2c8c646ce84b727ac2bca8912a247e6e68e1fb507372178e59e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - asgiref >=3.6
    - django >=4.2

tests:
  - python:
      imports:
        - corsheaders
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/django-cors-headers/
  license: MIT
  license_file: LICENSE
  summary: django-cors-headers is a Django application for handling the server headers required for Cross-Origin Resource Sharing (CORS).
  description: |
    django-cors-headers is a Django application for handling the server headers required for Cross-Origin Resource Sharing (CORS).
  repository: https://github.com/adamchainz/django-cors-headers

extra:
  recipe-maintainers:
    - rxm7706
    - lsetiawan
    - timsnyder
    - MichelML

