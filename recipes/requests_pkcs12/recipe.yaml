# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.27"

package:
  name: requests-pkcs12
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/requests-pkcs12/requests_pkcs12-${{ version }}.tar.gz
  sha256: 258b320bac8773b5c310a92382e3cb3b1fece1d5cc4fd4a6f93a70b009154ea5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - cryptography >=42.0.0
    - requests >=2.32.5

tests:
  - python:
      imports:
        - requests_pkcs12
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/m-click/requests_pkcs12
  license: ISC
  license_file: LICENSE
  summary: Add PKCS#12 support to the requests library in a clean way, without monkey patching or temporary files
  description: |
    Add PKCS#12 support to the requests library in a clean way, without monkey patching or temporary files

extra:
  recipe-maintainers:
    - sodre
    - synapticarbors

