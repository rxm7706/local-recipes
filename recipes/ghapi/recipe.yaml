# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ghapi
  version: "2.1.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ghapi-${{ version }}.tar.gz
  sha256: 60f309a1a60dfff5e003e3874edd3044e5b029215df07600ba896180ed59e90d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ghapi=ghapi.cli:ghapi
      - ghpath=ghapi.cli:ghpath
      - ghraw=ghapi.cli:ghraw
      - completion-ghapi=ghapi.cli:completion_ghapi
      - gh-create-workflow=ghapi.actions:gh_create_workflow

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - fastcore >=2.2.6
    - fastspec >=0.2.0
    - tomli

tests:
  - python:
      imports:
        - ghapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ghapi --help
      - ghpath --help
      - ghraw --help
      - completion-ghapi --help
      - gh-create-workflow --help

about:
  summary: A python client for the GitHub API
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fastai/ghapi/

extra:
  recipe-maintainers:
    - jtpio
    - thewchan
