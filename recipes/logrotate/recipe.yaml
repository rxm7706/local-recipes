# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: logrotate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/logrotate/logrotate-${{ version }}.tar.gz
  sha256: d0ed47758a06ca9603631238f08134900675640744a992f58028078a3c6a2b5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - logrotate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://jimmyg.org
  license: MIT
  license_file: LICENSE
  summary: A small, simple logrotate implementation for the Python logging module that only rotates files (it doesn't create and delete them) and therefore maintains owner, group and permission information
  description: |
    A small, simple logrotate implementation for the Python logging module that only rotates files (it doesn't create and delete them) and therefore maintains owner, group and permission information

extra:
  recipe-maintainers:
    - rxm7706

