# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dataproperty
  version: "1.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dataproperty-${{ version }}.tar.gz
  sha256: a83af82a234edda5378a36fb092bc90dd554646c5e58202a310acf468ae81bc8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - releasecmd
    - pip
  run:
    - python >=${{ python_min }}
    - mbstrdecoder >=1.0.0,<2
    - setuptools >=64
    - typepy >=1.3.2,<3

tests:
  - python:
      imports:
        - dataproperty
        - dataproperty.logger
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python library for extract property from data.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/thombashi/DataProperty
  repository: https://github.com/thombashi/DataProperty

extra:
  recipe-maintainers:
    - basnijholt
