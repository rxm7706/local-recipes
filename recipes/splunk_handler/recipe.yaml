# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: splunk-handler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/splunk-handler/splunk_handler-${{ version }}.tar.gz
  sha256: a835b0a7161148aceb977301c6dba21bb96e7635279c7e90e0216c78a4bcbb24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - splunk_handler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zach-taylor/splunk_handler
  license: MIT
  license_file: LICENSE
  summary: A Python logging handler that sends your logs to Splunk
  description: |
    A Python logging handler that sends your logs to Splunk

extra:
  recipe-maintainers:
    - sodre
    - soapy1

