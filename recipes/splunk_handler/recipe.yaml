# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: splunk_handler
  version: "3.0.0"
  sha256: a835b0a7161148aceb977301c6dba21bb96e7635279c7e90e0216c78a4bcbb24

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.6.0,<3.0.0

tests:
  - python:
      imports:
        - splunk_handler
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: A Python logging handler that sends your logs to Splunk
  description: |
    Splunk Handler is a Python Logger for sending logged events to an installation
    of Splunk Enterprise. This logger requires the destination Splunk Enterprise
    server to have enabled and configured the Splunk HTTP Event Collector.


  homepage: https://github.com/zach-taylor/splunk_handler
  repository: https://github.com/zach-taylor/splunk_handler
  documentation: https://github.com/zach-taylor/splunk_handler

extra:
  recipe-maintainers:
    - sodre
    - soapy1
