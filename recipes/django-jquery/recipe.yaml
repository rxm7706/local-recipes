# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: django-jquery
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-jquery/django-jquery-${{ version }}.tar.gz
  sha256: 414ac1083708ac71cc771612e7287702c939d06cd357fd53bb1271a4f6255115
  file_name: django-jquery-${{ version }}.tar.gz

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
    - django >=1.3
  run:
    - python >=${{ python_min }}
    - django >=1.3

tests:
  - python:
      imports:
        - jquery
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: ${{ env.get("RECIPE_DIR") }}/LICENSE
  summary: jQuery packaged in an handy django app to speed up new applications and deployment.
  homepage: http://bitbucket.org/massimilianoravelli/django-jquery

extra:
  recipe-maintainers:
    - ocefpaf
