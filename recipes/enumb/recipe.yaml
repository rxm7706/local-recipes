# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: enumb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/enumb/enumb-${{ version }}.tar.gz
  sha256: 02a6eda94322ae06a52754e46be6d89310b21e0751a9fc5c9546e977b4fa1884

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - cassidy
    - expo

tests:
  - python:
      imports:
        - enumb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/enumb/
  license: MIT
  license_file: LICENSE
  summary: Concise, Pythonic Enums
  description: |
    Concise, Pythonic Enums

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
