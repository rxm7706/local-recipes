# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.0"

package:
  name: injector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/injector/injector-${{ version }}.tar.gz
  sha256: e85a75d1516cff2f03170f3fd1219f56acb25c9a05e307819ae0dcde3dad3d3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=3.7.4

tests:
  - python:
      imports:
        - injector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alecthomas/injector
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Injector - Python dependency injection framework, inspired by Guice
  description: |
    Injector - Python dependency injection framework, inspired by Guice

extra:
  recipe-maintainers:
    - fuglede

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: injector
  cfe-upstream-registry: pypi
  cfe-upstream-name: injector
  cfe-purls:
    - pkg:conda/injector@${{ version }}?channel=conda-forge
    - pkg:pypi/injector@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/alecthomas/injector
  cfe-import-names: [injector]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/injector-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.24.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-18T09:44:23Z
