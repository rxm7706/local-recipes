# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0"
  release: model-files-v1.0

package:
  name: kokoro-onnx-models-fp16
  version: ${{ version }}

source:
  # A bare release asset, not an archive, so file_name is required -- there is
  # no extension-driven unpacking to rely on.
  - url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/${{ release }}/kokoro-v1.0.fp16.onnx
    sha256: c1610a859f3bdea01107e73e50100685af38fff88f5cd8e5c56df109ec880204
    file_name: kokoro-v1.0.fp16.onnx

build:
  number: 0
  noarch: generic
  dynamic_linking:
    # The .onnx is a protobuf container holding tensor data at fixed offsets.
    # It is data, not a linkable object, and relocation would silently corrupt
    # weights rather than fail loudly -- the quiet cousin of the failure that
    # corrupted a Bun binary in this repo's ccusage recipe.
    binary_relocation: false
  script:
    - if: unix
      then: |
        set -ex
        DEST="${PREFIX}/share/kokoro-onnx"
        mkdir -p "${DEST}"
        cp -a kokoro-v1.0.fp16.onnx "${DEST}/"

requirements:
  run:
    # Voices are shared by every variant and ship separately so the three can
    # co-install; the resolver lives there too. Pinned exactly because both
    # come from the same upstream release tag.
    - kokoro-onnx-voices ==${{ version }}
  run_constraints:
    - kokoro-onnx >=0.6.0

tests:
  - package_contents:
      files:
        - share/kokoro-onnx/kokoro-v1.0.fp16.onnx
  - script:
      # Resolution goes through the shared resolver, so this also proves the
      # voices dependency actually arrived.
      - python -c "import kokoro_onnx_models as m; print('model:', m.get_model_path('fp16'))"
      - python -c "import kokoro_onnx_models as m, sys; assert m.get_model_path('fp16').startswith(sys.prefix)"
      - python -c "import kokoro_onnx_models as m; assert m.list_variants() == ['fp16'], m.list_variants(); print('variants:', m.list_variants())"
      # With this the only variant installed, the no-argument call must find it.
      - python -c "import kokoro_onnx_models as m; assert m.get_model_path() == m.get_model_path('fp16'); print('default resolution OK')"
      # `fp16-gpu` is a separate upstream asset whose bytes are IDENTICAL to
      # `kokoro-v1.0.fp16.onnx` (confirmed by independent re-fetch 2026-09-07), so the
      # resolver aliases it rather than shipping 169 MB twice. If upstream ever
      # makes them genuinely different, this assertion is what will notice.
      - python -c "import kokoro_onnx_models as m; assert m.get_model_path('fp16-gpu') == m.get_model_path('fp16'); print('fp16-gpu alias OK')"
      # Exact size catches truncation; the ONNX parse plus the node count
      # catches a mangled or swapped payload, which a contents check would not.
      - python -c "import kokoro_onnx_models as m, os; s=os.path.getsize(m.get_model_path('fp16')); assert s == 177464787, s; print('bytes OK:', s)"
      - python -c "import onnx, kokoro_onnx_models as m; g=onnx.load(m.get_model_path('fp16')).graph; assert len(g.node) == 2511, len(g.node); print('onnx graph OK, nodes:', len(g.node))"
    requirements:
      run:
        - python
        - onnx

about:
  homepage: https://github.com/thewh1teagle/kokoro-onnx
  repository: https://huggingface.co/hexgrad/Kokoro-82M
  documentation: https://github.com/thewh1teagle/kokoro-onnx#readme
  summary: Kokoro v1.0 TTS model weights (fp16) for kokoro-onnx
  description: |
    The Kokoro v1.0 ONNX model, fp16 variant (169 MB) -- mixed-precision weights, roughly half the f32 size --
    installed into `$CONDA_PREFIX/share/kokoro-onnx/` so an environment is
    complete from the lock alone rather than requiring a manual download.

    Despite upstream's name, this file contains NO float16 tensors.
    Measured composition: 126.9 MB float32 + 49.4 MB int8, with 53
    QuantizeLinear and 128 DequantizeLinear nodes -- a statically
    quantized mixed-precision build in which about a third of the
    weight bytes were taken to int8 and the rest left at float32.
    The name is kept because it is the upstream asset name people
    search for, not because it describes the dtype.

    Practically it is the best size/speed trade of the three:
    roughly half the disk of f32, essentially f32's CPU speed
    (0.68 s vs 0.59 s per 2.7 s utterance) and output that tracks
    f32 closely (duration-normalised envelope correlation 0.95).
    See `kokoro-onnx-models-int8` for the full measured table.

    Voice embeddings are shared across variants and come from
    `kokoro-onnx-voices`, pulled in automatically, which also provides the
    resolver:

        from kokoro_onnx import Kokoro
        from kokoro_onnx_models import get_model_path, get_voices_path

        kokoro = Kokoro(get_model_path("fp16"), get_voices_path())
        samples, sample_rate = kokoro.create("Hello world", voice="af_sarah")

    All three variants co-install; `get_model_path()` with no argument returns
    the highest-precision one present.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

