# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.0"

package:
  name: roman-numerals
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/roman-numerals/roman_numerals-${{ version }}.tar.gz
  sha256: 1af8b147eb1405d5839e78aeb93131690495fe9da5c91856cb33ad55a7f1e5b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.12,<4
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - roman_numerals
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/roman-numerals/
  license: 0BSD OR CC0-1.0
  license_file: LICENSE
  summary: Manipulate well-formed Roman numerals
  description: |
    Manipulate well-formed Roman numerals
  repository: https://github.com/AA-Turner/roman-numerals/

extra:
  recipe-maintainers:
    - AA-Turner
    - ocefpaf

