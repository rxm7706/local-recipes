# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: atlassian-python-api
  version: "5.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d4c724647c3797340bd1aae19bf03bf7e2f0218efcc825fcffe3e564838ac64b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - deprecated
    - jmespath
    - lxml
    - oauthlib
    - requests >=2.8.1
    - requests-oauthlib
    - requests-kerberos 0.14.0.*
    - six

tests:
  - python:
      imports:
        - atlassian
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python Atlassian REST API Wrapper
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/atlassian-api/atlassian-python-api

extra:
  recipe-maintainers:
    - dbast
    - epilif1017a
