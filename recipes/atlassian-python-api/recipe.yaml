# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0.2"

package:
  name: atlassian-python-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/atlassian-python-api/atlassian_python_api-${{ version }}.tar.gz
  sha256: d4d4adb747048d637aaa63fbd14791d742f17172f6d02b03c23d9a5aaa038276

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - deprecated
    - requests
    - oauthlib
    - requests-oauthlib
    - jmespath
    - beautifulsoup4
    - typing_extensions

tests:
  - python:
      imports:
        - atlassian
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/atlassian-api/atlassian-python-api
  license: Apache-2.0
  license_file: LICENSE
  summary: Python Atlassian REST API Wrapper
  description: |
    Python Atlassian REST API Wrapper

extra:
  recipe-maintainers:
    - dbast
    - epilif1017a

#### CFE metadata AND comments
