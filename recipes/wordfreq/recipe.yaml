# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: wordfreq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wordfreq/wordfreq-${{ version }}.tar.gz
  sha256: 7943098975f25c2a70e1151ee5a62083b14a5f86f6cc5703cc9526f716ceb408

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - msgpack
    - langcodes
    - regex
    - ftfy
    - locate

tests:
  - python:
      imports:
        - wordfreq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rspeer/wordfreq/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Look up the frequencies of words in many languages, based on many sources of data.
  description: |
    Look up the frequencies of words in many languages, based on many sources of data.

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
