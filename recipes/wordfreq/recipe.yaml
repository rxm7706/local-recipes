# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wordfreq
  version: "3.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/wordfreq-${{ version }}.tar.gz
  sha256: 7943098975f25c2a70e1151ee5a62083b14a5f86f6cc5703cc9526f716ceb408

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python >=3.8,<4
  run:
    - python >=3.8,<4
    - msgpack-python >=1.0.7,<2.0.0
    - langcodes >=3.0
    - regex >=2023.10.3
    - ftfy >=6.1
    - locate >=1.1.1,<2.0.0

tests:
  - python:
      imports:
        - wordfreq
      pip_check: true

about:
  summary: Python library for looking up the frequencies of words in many languages.
  license: MIT
  license_file: MIT-LICENSE.txt
  homepage: http://github.com/LuminosoInsight/wordfreq/

extra:
  recipe-maintainers:
    - thewchan
