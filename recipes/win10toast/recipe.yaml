# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: win10toast
  version: "0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/jithurjacob/Windows-10-Toast-Notifications/archive/9d52b73.tar.gz
  sha256: c0a92c26705486e107362588acb9561c44e33ef0b24dd25ddc8ac6ea80821d86
  patches:
    - patches/0001-Fix-for-parse_requirements.patch
    - patches/0002-Fix-for-ParseRequirements-in-pip-v20.patch

build:
  number: 7
  skip: not win
  script: ${{ PYTHON }} -m pip install .

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - pywin32
    - setuptools

tests:
  - python:
      imports:
        - win10toast
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Python library to display Windows 10 Toast Notifications
  description: An easy-to-use Python library for displaying Windows 10 Toast Notifications
  homepage: https://github.com/jithurjacob/Windows-10-Toast-Notifications
  repository: https://github.com/jithurjacob/Windows-10-Toast-Notifications

extra:
  recipe-maintainers:
    - setu4993
