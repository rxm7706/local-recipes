# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sphinxcontrib-bibtex
  version: "2.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: fee700f7aae29bb8f654c62913f00d34ac44fc0b8ca0fa67ac922ff4453addee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - docutils >=0.20
    - pybtex >=0.25
    - pybtex-docutils >=1.0.2
    - sphinx >=7.4

tests:
  - python:
      imports:
        - sphinxcontrib
        - sphinxcontrib.bibtex
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: A Sphinx extension for BibTeX style citations.
  description: This extension allows BibTeX citations to be inserted into documentation generated by Sphinx."
  homepage: https://github.com/mcmtroffaes/sphinxcontrib-bibtex
  repository: https://github.com/mcmtroffaes/sphinxcontrib-bibtex/
  documentation: http://sphinxcontrib-bibtex.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - croth1
