{% set name = "sphinxcontrib-bibtex" %}
{% set version = "2.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: fee700f7aae29bb8f654c62913f00d34ac44fc0b8ca0fa67ac922ff4453addee

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - docutils >=0.20
    - pybtex >=0.25
    - pybtex-docutils >=1.0.2
    - sphinx >=7.4

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - sphinxcontrib
    - sphinxcontrib.bibtex
  commands:
    - pip check

about:
  home: https://github.com/mcmtroffaes/sphinxcontrib-bibtex
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: A Sphinx extension for BibTeX style citations.
  description: This extension allows BibTeX citations to be inserted into documentation generated by Sphinx."
  doc_url: http://sphinxcontrib-bibtex.readthedocs.org/en/latest/
  dev_url: https://github.com/mcmtroffaes/sphinxcontrib-bibtex/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - croth1
