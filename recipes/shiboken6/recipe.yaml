schema_version: 1

context:
  version: "6.11.1"

package:
  name: shiboken6
  version: ${{ version }}

source:
  url: https://pypi.org/packages/cp310/s/shiboken6/shiboken6-6.11.1-cp310-abi3-macosx_13_0_universal2.whl
  sha256: 1a16867f103ef1c662a5f09dfed03273a9f81688b174555162c58e83650a3f02

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - shiboken6
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pyside.org
  license: MIT
  license_file: LICENSE
  summary: Python/C++ bindings helper module
  description: |
    Python/C++ bindings helper module
  repository: https://code.qt.io/cgit/pyside/pyside-setup.git/
  documentation: https://doc.qt.io/qtforpython

extra:
  recipe-maintainers:
    - rxm7706

