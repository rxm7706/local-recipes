# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.6.3"

package:
  name: textdistance
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/textdistance/textdistance-${{ version }}.tar.gz
  sha256: d6dabc50b4ea832cdcf0e1e6021bd0c7fcd9ade155888d79bb6a3c31fce2dc6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - textdistance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/orsinium/textdistance
  license: MIT
  license_file: LICENSE
  summary: Compute distance between the two texts.
  description: |
    Compute distance between the two texts.

extra:
  recipe-maintainers:
    - cu8blank
    - andfoy
    - ccordoba12

