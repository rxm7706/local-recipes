# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: tomotopy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tomotopy/tomotopy-${{ version }}.tar.gz
  sha256: ce981f29ee91cff4cfc5290637bbc1c1725cc17b93ee384499818f8358d2baa4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - scikit-build-core >=0.10
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - tomotopy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bab2min/tomotopy
  license: MIT
  license_file: LICENSE
  summary: Tomoto, Topic Modeling Tool for Python
  description: |
    Tomoto, Topic Modeling Tool for Python
  repository: https://github.com/bab2min/tomotopy
  documentation: https://bab2min.github.io/tomotopy/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tomotopy
