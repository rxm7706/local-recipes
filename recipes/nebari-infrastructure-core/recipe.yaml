# CFE comments
# Header:
#    # Go CLI (binary `nic`), NOT a Python package -- no PyPI distribution
#    # exists, so none of the PyPI/npm/CRAN generator paths apply. Authored by
#    # hand from the upstream Makefile + .goreleaser.yml.
#    # lookup_feedstock 2026-09-07: no conda-forge/nebari-infrastructure-core-feedstock
#    # (G58 clear). `nebari` and `nebi` ARE on conda-forge; `nic` is free but is
#    # deliberately NOT used as the conda package name -- it is a 3-letter generic
#    # token with high collision risk (CFEP-26). The package name mirrors the
#    # upstream project; the command it installs is `nic`.
# source:
#    # The release-asset source tarball is used in preference to the
#    # archive/refs/tags GitHub-generated archive: it is an UPLOADED asset
#    # (byte-stable, so not exposed to the G61 re-gzip sha256 drift that affects
#    # generated archives), it is covered by upstream's own checksums.txt, and it
#    # carries a sigstore attestation. sha256 verified twice 2026-09-07 -- streamed
#    # download AND the GitHub release-asset digest field both report
#    # 3090113f1ec93bc4070750788fbb861409277b25122d64adca7add7014bc1c58.
#    # NOTE the archive has NO top-level wrapper directory: entries extract flat
#    # into the work dir, so build paths are ./cmd/nic, not <pkg>-<ver>/cmd/nic.
# build:
#  script:
#    # Pure Go: the upstream Makefile and .goreleaser.yml both build with
#    # CGO_ENABLED=0, so this uses compiler("go-nocgo") and -- per the SKILL.md
#    # go-nocgo exception -- correctly omits stdlib("c").
#    # -trimpath and -s -w mirror upstream's own release build flags.
#    # ldflags injects ONLY version. Upstream also injects commit and date; both
#    # are deliberately left at their in-source defaults ("none"/"unknown")
#    # because a build timestamp would make the artifact non-reproducible, and the
#    # commit is not knowable from a source tarball. The -X target is the
#    # internal/cli package path, NOT main -- version.go documents that pointing
#    # it at main.version silently injects nothing.
#    # GOPATH is pinned under $SRC_DIR rather than inherited: rattler-build v0.62+
#    # strict env-isolation remaps $HOME, so the default $HOME/go module cache
#    # location is not a stable place to write. Same pattern as recipes/osv-scanner.
#    # The build fetches modules from the network (upstream vendors nothing --
#    # no vendor/ directory in the tarball). That is fine: conda-forge BUILD jobs
#    # have network; only the TEST phase is offline. Same shape as the merged
#    # mailpit and osv-scanner Go recipes.
#    # Each entry of a script LIST runs in its own shell (G1), so the exports and
#    # the commands that consume them are kept in ONE multi-line entry per platform.
#    # --ignore <own module> per G79: go-licenses exits fatal on any package it
#    # cannot classify, and a project's own packages are a routine false positive;
#    # the project LICENSE ships separately via about.license_file.
# requirements:
#  build:
#    # No run: requirements. The binary is statically linked (CGO_ENABLED=0).
#    # NOTE: at runtime nic resolves an OpenTofu binary from NIC_TOFU_PATH or
#    # PATH and otherwise downloads its own pinned build. conda-forge ships
#    # opentofu, but it is deliberately NOT declared here: it is optional, and a
#    # hard dependency would pull a version nic may warn is untested against.
#    # Revisit if upstream ever pins a range that conda-forge's opentofu satisfies.
# tests:
#    # nic version is offline-safe: tofu.ResolveExternal only inspects
#    # NIC_TOFU_PATH/PATH and REPORTS resolution errors rather than failing, so the
#    # command stays usable as a diagnostic with no tofu present and no network.
####
