# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.2"

package:
  name: wand
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/Wand/wand-${{ version }}.tar.gz
  sha256: 0387fd08848d00cadd1d885fcb19a17dd4250df2029e5338b6b668b7fed64b5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wand
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.wand-py.org
  license: MIT
  license_file: LICENSE
  summary: Ctypes-based simple MagickWand API binding for Python
  description: |
    Ctypes-based simple MagickWand API binding for Python
  repository: https://github.com/emcconville/wand
  documentation: https://docs.wand-py.org/en/latest/index.html

extra:
  recipe-maintainers:
    - kellend-git
    - r78v10a07

#### CFE metadata AND comments
