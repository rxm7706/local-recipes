# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: elasticsearch
  version: "9.4.1"
  bundle: tar.gz
  hash_val: 1d78fdfba97a903ec35a5eb5808a74e33392b7c620bd5f742d465a3a26c27d75

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash_val }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - hatchling
    - pip
    - elastic-transport >=9.4.1,<10
    - python-dateutil
    - typing-extensions
    - sniffio
    - anyio
  run:
    - python >=${{ python_min }}
    - elastic-transport >=9.2.0,<10
    - python-dateutil
    - typing-extensions
    - sniffio
    - anyio

tests:
  - python:
      imports:
        - elasticsearch
        - elasticsearch.helpers
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python client for Elasticsearch
  homepage: https://github.com/elastic/elasticsearch-py
  repository: https://github.com/elastic/elasticsearch-py
  documentation: https://elasticsearch-py.readthedocs.io

extra:
  recipe-maintainers:
    - ahlaw
    - ezimuel
    - joshmock
    - miguelgrinberg
    - pquentin
