# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.1"

package:
  name: django-import-export
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-import-export/django_import_export-${{ version }}.tar.gz
  sha256: 165dc7fdcd56a6356342eef3f88f3f3682b64b6f67e9a259a137e8b57aeff10c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
    - setuptools-scm >=7.1.0
  run:
    - python >=${{ python_min }}
    - diff-match-patch ==20241021
    - django >=4.2
    - tablib >=3.7.0

tests:
  - python:
      imports:
        - import_export
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/django-import-export/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Django application and library for importing and exporting data with included admin integration.
  description: |
    Django application and library for importing and exporting data with included admin integration.
  repository: https://github.com/django-import-export/django-import-export
  documentation: https://django-import-export.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - ocefpaf

#### CFE metadata AND comments
