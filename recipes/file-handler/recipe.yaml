# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3"

package:
  name: file-handler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/file-handler/file-handler-${{ version }}.tar.gz
  sha256: 142eab46250bc3560e3ddd5495fa3d3f9e8feab1fb099b45f0130845087a070f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click

tests:
  - python:
      imports:
        - fim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/file-handler/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: REPLACE_SUMMARY
  description: |
    REPLACE_DESCRIPTION

extra:
  recipe-maintainers:
    - rxm7706

