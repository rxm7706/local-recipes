# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.27.4"

package:
  name: python-levenshtein
  version: ${{ version }}

source:
  url: https://github.com/rapidfuzz/python-Levenshtein/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ea886250057218ca5939c71de48f944345a79b46f62c01f9a70f4b8d8c7a767a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-levenshtein
    - levenshtein ==0.27.4

tests:
  - python:
      imports:
        - python_levenshtein
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rapidfuzz/python-Levenshtein
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Python extension for computing string edit distances and similarities.
  description: |
    Python extension for computing string edit distances and similarities.
  repository: https://github.com/rapidfuzz/python-Levenshtein.git
  documentation: https://rapidfuzz.github.io/Levenshtein/

extra:
  recipe-maintainers:
    - maxbachmann
    - pmlandwehr
    - peterjc

#### CFE metadata AND comments
