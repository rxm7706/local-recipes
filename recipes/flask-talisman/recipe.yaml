# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.0"

package:
  name: flask-talisman
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-talisman/flask-talisman-${{ version }}.tar.gz
  sha256: c5f486f5f54420729f84b3c3850cd63f96e8b033a9629bee66c524ea363797ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask

tests:
  - python:
      imports:
        - flask_talisman
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/wntrblm/flask-talisman
  license: Apache-2.0
  license_file: LICENSE
  summary: HTTP security headers for Flask.
  description: |
    HTTP security headers for Flask.

extra:
  recipe-maintainers:
    - sodre
    - xmnlab

#### CFE metadata AND comments
