# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.2.0"

package:
  name: langgraph-checkpoint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-checkpoint/langgraph_checkpoint-${{ version }}.tar.gz
  sha256: 51a593b6bee684b0818e5d6e58e28ab340c6db7794575056ce7bd1b746a84ed7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - langchain-core >=0.2.38
    - ormsgpack >=1.12.0

tests:
  - python:
      imports:
        - langgraph.cache.base
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-checkpoint/
  license: MIT
  license_file: LICENSE
  summary: Library with base interfaces for LangGraph checkpoint savers.
  description: |
    Library with base interfaces for LangGraph checkpoint savers.
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint

extra:
  recipe-maintainers:
    - jan-janssen

