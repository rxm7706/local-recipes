# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.14.0"
  robin_map_commit: 188c45569cc2a5dd768077c193830b51d33a5020
  abi_version: 20

recipe:
  name: nanobind-split
  version: ${{ version }}

source:
  - url: https://github.com/wjakob/nanobind/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 937b08801b9b61c98192d9ec5ddb712256961fbe8ccc1122d6ee3d574600287c
  - url: https://github.com/Tessil/robin-map/archive/${{ robin_map_commit }}.tar.gz
    sha256: 2f4be670fa4f53c3261ed7af392b414a00e75591f87da0a8dd525de376430747
    target_directory: ext/robin_map

build:
  number: 0

outputs:
  - package:
      name: nanobind-abi
      version: ${{ abi_version }}
    build:
      noarch: generic
    requirements:
      run_exports:
        - nanobind-abi ==${{ abi_version }}
      run_constraints:
        - nanobind >=2.4
    tests:
      - files:
          source:
            - src/nb_abi.h
        script:
          - if [[ $(grep "define NB_INTERNALS_VERSION" src/nb_abi.h | grep -E -o '[0-9]+') != "${{ abi_version }}" ]]; then exit 1; fi
  - package:
      name: nanobind
    build:
      noarch: python
      script: $PYTHON -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}
        - scikit-build-core
        - cmake
        - make
        - pip
        - git
      run:
        - python >=${{ python_min }}
      run_constraints:
        - nanobind-abi ==${{ abi_version }}
    tests:
      - requirements:
          run:
            - python ${{ python_min }}
            - pip
        script:
          - pip check
          - python -c "import nanobind; import os; assert os.path.isdir(nanobind.cmake_dir()) and os.path.isdir(nanobind.include_dir())"

about:
  summary: Seamless operability between C++17 and Python
  description: |
    nanobind is a small binding library that exposes C++ types in Python and
    vice versa. It is reminiscent of Boost.Python and pybind11 and uses
    near-identical syntax. In contrast to these existing tools, nanobind is
    more efficient: bindings compile in a shorter amount of time, producing
    smaller binaries with better runtime performance.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - ext/robin_map/LICENSE
  homepage: https://github.com/wjakob/nanobind
  repository: https://github.com/wjakob/nanobind

extra:
  feedstock-name: nanobind
  recipe-maintainers:
    - MatthiasKohl
    - wjakob
