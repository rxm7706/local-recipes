# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-vite
  version: "3.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/51/42/7c7a8b97f56468705bcd37cdd382b4d001c53890d04a9283ce2f151a01e6/django_vite-3.2.0.tar.gz
  sha256: fdb96b3f4307466d1edd1c19a79cf7dbfabb1a7827c5cb2991d9a6aae528c9db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools
  run:
  - python >=${{ python_min }}
  - django >=3.2
    # - black
    # - Django >=3.2

tests:
- python:
    imports:
    - django_vite
    pip_check: true
    python_version: ${{ python_min }}

about:
  summary: Integration of Vite in a Django project.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/MrBin99/django-vite

extra:
  recipe-maintainers:
  - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: django-vite
  cfe-upstream-registry: pypi
  cfe-upstream-name: django-vite
  cfe-purls:
  - pkg:conda/django-vite@${{ version }}?channel=conda-forge
  - pkg:pypi/django-vite@${{ version }}
  cfe-upstream-repo: https://github.com/MrBin99/django-vite
  cfe-upstream-homepage: https://github.com/MrBin99/django-vite
  cfe-import-names: [django_vite]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: true
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/django-vite-feedstock
  cfe-forge-recipe-updates-needed:
  - meta-yaml-to-recipe-yaml
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-06-20T00:00:00Z
