# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: sqlalchemy-utc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SQLAlchemy-Utc/SQLAlchemy-Utc-${{ version }}.tar.gz
  sha256: 8e041624595b66d7b1d5ea8b6de486df5c1b9352697f3b24f862f0ded56cd7aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - sqlalchemy

tests:
  - python:
      imports:
        - sqlalchemy_utc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/spoqa/sqlalchemy-utc
  license: MIT
  license_file: LICENSE
  summary: SQLAlchemy type to store aware datetime values
  description: |
    SQLAlchemy type to store aware datetime values

extra:
  recipe-maintainers:
    - igortg
    - lvoliveira
    - lincrosenbach

