# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "14.3.1"
  python_min: "3.12"

package:
  name: ansible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/ansible/ansible-${{ version }}.tar.gz
  sha256: 98d4ad2b355feac8dc04d99e8377d6cb801b1d58bbfadd6d80534e4607fb5c4d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ansible-core ~=2.21.3

tests:
  - python:
      imports:
        - ansible_collections.inspur.ispim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://ansible.com/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Radically simple IT automation
  description: |
    Radically simple IT automation
  documentation: https://docs.ansible.com/projects/ansible

extra:
  recipe-maintainers:
    - brainstorm
    - tschoonj
    - pavelzw
    - Wafflenator

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: ansible
  cfe-upstream-registry: pypi
  cfe-upstream-name: ansible
