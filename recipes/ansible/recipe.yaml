    - pkg:pypi/ansible@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://ansible.com/
  cfe-import-names: [ansible_collections.inspur.ispim]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/ansible-feedstock
  cfe-forge-recipe-updates-needed: 
