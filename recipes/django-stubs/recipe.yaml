# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.1.0"

package:
  name: django-stubs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-stubs/django_stubs-${{ version }}.tar.gz
  sha256: b6aecc5c738a103135f76ba160a6f75e3b27dcf0200c64d7226018cdbc2340dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.0,<0.13.0
  run:
    - python >=${{ python_min }}
    - django
    - django-stubs-ext >=6.0.2
    - types-pyyaml
    - typing_extensions >=4.11.0

tests:
  - python:
      imports:
        - mypy_django_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/typeddjango/django-stubs
  license: MIT
  license_file: LICENSE
  summary: Mypy stubs for Django
  description: |
    Mypy stubs for Django

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: django-stubs
  cfe-upstream-registry: pypi
  cfe-upstream-name: django-stubs
