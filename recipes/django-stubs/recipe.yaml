    - pkg:pypi/django-stubs@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/typeddjango/django-stubs
  cfe-import-names: [mypy_django_plugin]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
