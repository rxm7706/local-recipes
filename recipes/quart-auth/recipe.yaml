# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: quart-auth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quart-auth/quart_auth-${{ version }}.tar.gz
  sha256: 7703df693d795b3ec43a634efe4118c6adbddd98e7b8195008ca6def6d45cb47

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - quart >=0.18
    - typing_extensions

tests:
  - python:
      imports:
        - quart_auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/quart-auth/
  license: MIT
  license_file: LICENSE
  summary: A Quart extension to provide secure cookie authentication
  description: |
    A Quart extension to provide secure cookie authentication

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
