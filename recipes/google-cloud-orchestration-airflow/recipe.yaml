# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.22.0"

package:
  name: google-cloud-orchestration-airflow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-orchestration-airflow/google_cloud_orchestration_airflow-${{ version }}.tar.gz
  sha256: 1883195aa861658eb6c53a794d0658b9f626bd8ee75d30055b4c8c6a743042cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8

tests:
  - python:
      imports:
        - google.cloud.orchestration.airflow.service
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-orchestration-airflow
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Orchestration Airflow API client library
  description: |
    Google Cloud Orchestration Airflow API client library

extra:
  recipe-maintainers:
    - xylar

