# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: fugue-sql-antlr
  version: "0.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 688cec1f76ff88dd1b1a714629e097989384b27e54c0a672cc3d6adcbed824d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - antlr4-python3-runtime <4.14
    - jinja2
    - python >=${{ python_min }}
    - triad >=0.6.8
    # Not listed upstream but required
    - packaging

tests:
  - python:
      imports:
        - fugue_sql_antlr
        - fugue_sql_antlr_version
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Fugue SQL Antlr Parser
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fugue-project/fugue-sql-antlr

extra:
  recipe-maintainers:
    - charlesbluca
    - kvnkho
    - goodwanghan
    - thewchan
