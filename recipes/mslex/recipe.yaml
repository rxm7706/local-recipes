# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: mslex
  version: "1.3.0"
  python_min: "3.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mslex-${{ version }}.tar.gz
  sha256: 641c887d1d3db610eee2af37a8e5abda3f70b3006cdfd2d0d29dc0d1ae28a85d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - mslex-split=mslex:split_cli

requirements:
  host:
    - python 3.5.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mslex
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - mslex-split --help

about:
  summary: shlex for windows
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/smoofra/mslex

extra:
  recipe-maintainers:
    - klauer
