# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8"

package:
  name: grandalf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grandalf/grandalf-${{ version }}.tar.gz
  sha256: 2813f7aab87f0d20f334a3162ccfbcbf085977134a17a5b516940a93a77ea974

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyparsing

tests:
  - python:
      imports:
        - grandalf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bdcht/grandalf
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Graph and drawing algorithms framework
  description: |
    Graph and drawing algorithms framework

extra:
  recipe-maintainers:
    - shcheklein

#### CFE metadata AND comments
