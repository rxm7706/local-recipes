# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.17.6"

recipe:
  name: lief
  version: ${{ version }}

source:
  - url: https://github.com/lief-project/LIEF/archive/${{ version }}.tar.gz
    sha256: 5fbbd19c85912d417eabbaef2b98e70144496356964685b82e0792d708b9be87

build:
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ccache
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: not win
      then: pkg-config
    - cmake
    - ninja
  host:
    - nlohmann_json
    - mbedtls 3.*

outputs:
  - package:
      name: py-lief
    build:
      script:
        file: ${{ 'install-py-lief.bat' if win else 'install-py-lief.sh' if unix else '' }}
    requirements:
      build:
        - ccache
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: not win
          then: pkg-config
        - cmake
        - ninja
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: build_platform != target_platform
          then: pydantic >=2.4.2
        - if: build_platform != target_platform
          then: pydantic-core >=2.10.1
        - if: build_platform != target_platform
          then: scikit-build-core >=0.6.0
        - if: build_platform != target_platform
          then: setuptools >=68.2.2
        - if: build_platform != target_platform
          then: tomli >=2.0.1
      host:
        - nlohmann_json
        # Dynamically linked to libLIEF for now; see comment in patch section.
        - ${{ pin_subpackage('liblief', exact=True) }}
        - python
        - pip
        # Upstream pins build dependencies exactly; we are a bit more lenient
        # here to avoid potential solvability issues.
        - pydantic >=2.4.2
        - pydantic-core >=2.10.1
        - scikit-build-core >=0.6.0
        - setuptools >=68.2.2
        # Required for msvc.msvc14_get_vc_env
        - if: win
          then: setuptools <=70.2
        - tomli >=2.0.1
      run:
        - ${{ pin_subpackage('liblief', exact=True) }}
        - python
      run_exports:
        - ${{ pin_subpackage('py-lief', upper_bound='x.x') }}
      ignore_run_exports:
        by_name:
          - python
    tests:
      - python:
          imports:
            - lief
          pip_check: false
      - requirements:
          run:
            - ${{ compiler('cxx') }}
        script:
          - python -c "import ctypes.util, lief; missing = {name for name in {s.name for s in lief.parse(lief._lief.__file__).imported_functions} - {s.name for s in lief.parse(ctypes.util.find_library('LIEF')).exported_functions} if '4LIEF' in name}; assert not missing, missing"
  - package:
      name: liblief
    build:
      script:
        file: ${{ 'install-liblief.bat' if win else 'install-liblief.sh' if unix else '' }}
    requirements:
      build:
        - ccache
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: not win
          then: pkg-config
        - cmake
        - ninja
      host:
        - nlohmann_json
        - mbedtls 3.*
      run_exports:
        - ${{ pin_subpackage('liblief', upper_bound='x.x') }}
    tests:
      - files:
          recipe:
            - tests
        requirements:
          run:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
        script:
          - if: not win
            then: set -x
          - if: win
            then: echo on
          - pushd tests
          - if: not win
            then: PATH=".:${PATH}"
          - if: not win
            then: findstr() { grep "${@}"; }
          - if: not win
            then: call() { true; }
          - pushd self
          - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
          - ninja || exit 1
          - if: not win
            then: test-lief-self || exit 1
          - popd
          - pushd macho
          - cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug . || exit 1
          - ninja || exit 1
          - if: not win
            then: test-lief-macho macOS-libpython2.7.a-getbuildinfo.o > output.txt || exit 1
          - findstr has_dynamic_symbol_command output.txt && exit 1 || call;
          - popd
          - popd

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A cross platform library to parse, modify and abstract ELF, PE and MachO formats.
  description: |
    It turns out that many projects need to parse executable formats and they usually re-implement
    their own parser. Moreover these parsers are usually bound to one language.
    LIEF attempts to fill this void.
  homepage: https://lief.quarkslab.com/
  repository: https://github.com/lief-project/LIEF
  documentation: https://lief.quarkslab.com/doc/stable/index.html

extra:
  recipe-maintainers:
    - isuruf
    - mbargull
    - msarahan
    - xhochy
    - wolfv
