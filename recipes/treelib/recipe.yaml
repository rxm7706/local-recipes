# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: treelib
  version: "1.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a2b57ba38290f7da6af97b41de8ff7be98e7a8c00815f95d0782241f77503952

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install --no-deps . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.13.0

tests:
  - python:
      imports:
        - treelib
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python 2/3 implementation of tree structure.
  description: |
    treelib is a simple tree data structure implementation in Python.
  homepage: https://github.com/caesar0301/treelib
  repository: https://github.com/caesar0301/treelib
  documentation: https://treelib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - shcheklein
    - maxhora
