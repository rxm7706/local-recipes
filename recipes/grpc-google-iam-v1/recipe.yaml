# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.5"

package:
  name: grpc-google-iam-v1
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grpc-google-iam-v1/grpc_google_iam_v1-${{ version }}.tar.gz
  sha256: 07fd3a9fafb586588e771831fbfc8f6597050181d0c3b45e039d18b8fdc1aab5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio <2.0.0,>=1.59.0
    - googleapis-common-protos <2.0.0,>=1.69.2
    - protobuf <8.0.0,>=6.33.5

tests:
  - python:
      imports:
        - google.iam.v1
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/grpc-google-iam-v1/
  license: Apache-2.0
  license_file: LICENSE
  summary: IAM API client library
  description: |
    IAM API client library
  repository: https://github.com/googleapis/google-cloud-python

extra:
  recipe-maintainers:
    - BrentDorsey
    - xylar

