# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"

package:
  name: modopt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/modopt/modopt-${{ version }}.tar.gz
  sha256: d5e8edd935b813c3677beeed3245ef4894e7ac09e180150368eda044914488b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - tqdm
    - importlib-metadata

tests:
  - python:
      imports:
        - modopt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/modopt/
  license: MIT
  license_file: LICENSE
  summary: Modular Optimisation tools for soliving inverse problems.
  description: |
    Modular Optimisation tools for soliving inverse problems.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: modopt
