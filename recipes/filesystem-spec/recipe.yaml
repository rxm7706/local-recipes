# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.7.0"

package:
  name: fsspec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fsspec/fsspec-${{ version }}.tar.gz
  sha256: c803c40f4cf860b49dea58ee3e1c33cb9c790520e233537e1340049f89b82a88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - fsspec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fsspec/filesystem_spec
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: File-system specification
  description: |
    File-system specification
  documentation: https://filesystem-spec.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - martindurant
    - TomAugspurger

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: filesystem-spec
  cfe-upstream-registry: pypi
  cfe-upstream-name: fsspec
  cfe-purls:
    - pkg:conda/filesystem-spec@${{ version }}?channel=conda-forge
    - pkg:pypi/fsspec@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/fsspec/filesystem_spec
  cfe-import-names: [fsspec]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/filesystem-spec-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2026.7.0

  cfe-forge-blocker-list:
    - license-unresolved:REPLACE_LICENSE

  cfe-last-checked: 2026-08-17T08:14:44Z
