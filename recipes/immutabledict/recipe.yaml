# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.1"

package:
  name: immutabledict
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/immutabledict/immutabledict-${{ version }}.tar.gz
  sha256: f844a669106cfdc73f47b1a9da003782fb17dc955a54c80972e0d93d1c63c514

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - immutabledict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/corenting/immutabledict
  license: MIT
  license_file: LICENSE
  summary: Immutable wrapper around dictionaries (a fork of frozendict)
  description: |
    Immutable wrapper around dictionaries (a fork of frozendict)
  repository: https://github.com/corenting/immutabledict
  documentation: https://immutabledict.corenting.fr

extra:
  recipe-maintainers:
    - althonos

