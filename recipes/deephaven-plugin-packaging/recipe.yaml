# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: deephaven-plugin-packaging
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/d/deephaven-plugin-packaging/deephaven_plugin_packaging-0.0.1-py3-none-any.whl
  sha256: 492aed50f592c3641c9a4df9f45326476bb8600de6a95a06d0eb945e460e499a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - deephaven_plugin_packaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/deephaven/deephaven-plugins
  license: Apache-2.0
  license_file: LICENSE
  summary: Deephaven Plugin Packaging
  description: |
    Deephaven Plugin Packaging
  repository: https://github.com/deephaven/deephaven-plugins

extra:
  recipe-maintainers:
    - rxm7706

