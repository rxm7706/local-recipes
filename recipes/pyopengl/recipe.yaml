# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pyopengl
  version: "3.1.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c4a02d6866b54eb119c8e9b3fb04fa835a95ab802dd96607ab4cdb0012df8335

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}
  run:
    - if: linux
      then: __linux
    - if: osx
      then: __osx
    - if: win
      then: __win
    - python >=${{ python_min }}
    - if: linux
      then: libopengl-devel

tests:
  - python:
      imports:
        - OpenGL.GL
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: LicenseRef-pyopengl
  license_file: license.txt
  summary: Standard OpenGL bindings for Python
  homepage: http://pyopengl.sourceforge.net
  repository: https://github.com/mcfletch/pyopengl
  documentation: http://pyopengl.sourceforge.net/documentation/index.html

extra:
  recipe-maintainers:
    - almarklein
    - mcfletch
    - tadeu
    - psobolewskiPhD
    - pauldmccarthy
