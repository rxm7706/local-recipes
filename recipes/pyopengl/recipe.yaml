# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.10"

package:
  name: pyopengl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/PyOpenGL/pyopengl-${{ version }}.tar.gz
  sha256: c4a02d6866b54eb119c8e9b3fb04fa835a95ab802dd96607ab4cdb0012df8335

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - OpenGL
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://mcfletch.github.io/pyopengl/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Standard OpenGL bindings for Python
  description: |
    Standard OpenGL bindings for Python
  repository: https://github.com/mcfletch/pyopengl
  documentation: https://mcfletch.github.io/pyopengl/documentation/index.html

extra:
  recipe-maintainers:
    - almarklein
    - mcfletch
    - tadeu
    - psobolewskiPhD
    - pauldmccarthy

#### CFE metadata AND comments
