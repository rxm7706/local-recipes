# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.4"

package:
  name: bonobo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bonobo/bonobo-${{ version }}.tar.gz
  sha256: cde6810082cd532bd685a815455a80a364e87b27ed8660a400d5ebb6e3dc8250

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fs
    - python-graphviz
    - jinja2
    - mondrian
    - packaging
    - psutil
    - python-slugify
    - requests
    - stevedore
    - whistle

tests:
  - python:
      imports:
        - bonobo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.bonobo-project.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: Bonobo, a simple, modern and atomic extract-transform-load toolkit for python 3.5+.
  description: |
    Bonobo, a simple, modern and atomic extract-transform-load toolkit for python 3.5+.

extra:
  recipe-maintainers:
    - rxm7706

