# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: libxkbcommon
  version: "1.13.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/xkbcommon/${{ name }}/archive/xkbcommon-${{ version }}.tar.gz
  sha256: acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528

build:
  number: 0
  skip: win or osx
  dynamic_linking:
    missing_dso_allowlist:
      - /lib/libc.so.6

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - meson
    - ninja
    - m4
    - bison
    - cmake
    - pkg-config
  host:
    - xorg-libxau
    - libxcb
    - xorg-xproto
    - xcb-proto
    - pthread-stubs
    - libxml2-devel
    - xkeyboard-config
  run:
    - xkeyboard-config
  run_exports:
    - ${{ pin_subpackage('libxkbcommon') }}

tests:
  - script:
      - test -f "${PREFIX}/lib/libxkbcommon${SHLIB_EXT}"
      - xkbcli --help

about:
  license: MIT/X11 Derivative
  license_file: LICENSE
  summary: keymap handling library for toolkits and window systems
  description: |
    libxkbcommon is a keyboard keymap compiler and support library which
    processes a reduced subset of keymaps as defined by the XKB (X Keyboard
    Extension) specification.
  homepage: https://github.com/xkbcommon/libxkbcommon
  repository: https://github.com/xkbcommon/libxkbcommon
  documentation: https://xkbcommon.org/

extra:
  recipe-maintainers:
    - scopatz
    - hmaarrfk
