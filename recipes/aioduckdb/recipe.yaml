# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: aioduckdb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioduckdb/aioduckdb-${{ version }}.tar.gz
  sha256: 9171ffa590ac2056a1eca357c397205575bad973e35ffad59bf7fc291ab73456

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=2,<4
  run:
    - python >=${{ python_min }}
    - python-duckdb
    - typing_extensions >=4.0

tests:
  - python:
      imports:
        - aioduckdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kouta-kun/aioduckdb
  license: MIT
  license_file: LICENSE
  summary: asyncio bridge to the standard sqlite3 module
  description: |
    asyncio bridge to the standard sqlite3 module

extra:
  recipe-maintainers:
    - rxm7706

