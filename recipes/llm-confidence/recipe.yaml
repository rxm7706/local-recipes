# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: llm-confidence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llm-confidence/llm_confidence-${{ version }}.tar.gz
  sha256: 3828d4d70dd220dc3ea88a2fc53c6e23a2eba9447063534aeb1e333e37981e53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas

tests:
  - python:
      imports:
        - llm_confidence
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/VATBox/llm-confidence
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python package for extracting confidence scores from LLM models outputs, particularly using log probabilities
  description: |
    A Python package for extracting confidence scores from LLM models outputs, particularly using log probabilities

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
