# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.2"

package:
  name: dopamine-rl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dopamine-rl/dopamine_rl-${{ version }}.tar.gz
  sha256: 61b791d11edf80e08a164db7bc60166bb669db8a57b6cf21c8717a4aea1a84ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tensorflow >=2.2.0
    - gin-config >=0.3.0
    - absl-py >=0.9.0
    - ale-py >=0.10.1
    - opencv >=3.4.8.29
    - gym <=0.25.2
    - gymnasium >=1.0.0
    - flax >=0.2.0
    - jax >=0.1.72
    - jaxlib >=0.1.51
    - pillow >=7.0.0
    - numpy >=1.16.4
    - pygame >=1.9.2
    - pandas >=0.24.2
    - python-snappy >=0.7.3
    - tf-slim >=1.0
    - tensorflow-probability >=0.13.0
    - tf-keras >=2.18.0
    - tqdm >=4.64.1

tests:
  - python:
      imports:
        - dopamine
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/google/dopamine
  license: Apache-2.0
  license_file: LICENSE
  summary: "Dopamine: A framework for flexible Reinforcement Learning research"
  description: |
    Dopamine: A framework for flexible Reinforcement Learning research
  repository: https://github.com/google/dopamine
  documentation: https://github.com/google/dopamine

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dopamine-rl
  cfe-upstream-registry: pypi
  cfe-upstream-name: dopamine-rl
