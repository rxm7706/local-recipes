# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: shot-scraper
  version: "1.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/shot_scraper-${{ version }}.tar.gz
  sha256: af3efcad697f3b001f624ccdb2499417e4169bee5bf01672840a55175eef6d92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - shot-scraper = shot_scraper.cli:cli

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - uv-build >=0.9.7,<0.10.0
  run:
    - pydantic
    - playwright >=1.61.0
    - python >=${{ python_min }}
    - click
    - pyyaml
    - playwright-python
    - click-default-group

tests:
  - python:
      imports:
        - shot_scraper
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}

about:
  summary: A command-line utility for taking automated screenshots of websites
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/shot-scraper

extra:
  recipe-maintainers:
    - rxm7706

