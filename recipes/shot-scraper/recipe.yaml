# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10"

package:
  name: shot-scraper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/shot-scraper/shot_scraper-${{ version }}.tar.gz
  sha256: 571be6d721d1d3cbc47c703b1cd3314ed43457e2c3f5fa65fa217fdcdaf16679

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - click
    - pyyaml
    - pydantic
    - playwright >=1.61.0
    - click-default-group

tests:
  - python:
      imports:
        - shot_scraper
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://shot-scraper.datasette.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: A CLI utility for taking screenshots of websites, recording video demos and scraping sites using JavaScript
  description: |
    A CLI utility for taking screenshots of websites, recording video demos and scraping sites using JavaScript

extra:
  recipe-maintainers:
    - rxm7706

