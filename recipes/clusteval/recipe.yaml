# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.7"

package:
  name: clusteval
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/clusteval/clusteval-${{ version }}.tar.gz
  sha256: 439ab17de89d6f9a6d1e9e9d7f7058b24b8520dd9590135414b8297e7ec569d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - scatterd >=1.3.5
    - pypickle
    - matplotlib-base
    - numpy
    - pandas
    - tqdm
    - seaborn-base
    - scikit-learn
    - colourmap >=1.1.14
    - datazets >=1.1.0
    - df2onehot

tests:
  - python:
      imports:
        - clusteval
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://erdogant.github.io/clusteval
  license: MIT
  license_file: LICENSE
  summary: clusteval is a python package for unsupervised cluster validation.
  description: |
    clusteval is a python package for unsupervised cluster validation.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
