# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.2"

package:
  name: django-bootstrap5
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-bootstrap5/django_bootstrap5-${{ version }}.tar.gz
  sha256: 12331059c8230ba372ffaad990a706151e1ad8f721a870aa2e862cf6746f0d33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.6,<0.11.0
  run:
    - python >=${{ python_min }}
    - django >=4.2

tests:
  - python:
      imports:
        - django_bootstrap5
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zostera/django-bootstrap5
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Bootstrap 5 for Django
  description: |
    Bootstrap 5 for Django
  repository: https://github.com/zostera/django-bootstrap5
  documentation: https://django-bootstrap5.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706
    - swainn

