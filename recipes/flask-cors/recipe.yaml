# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.5"

package:
  name: flask-cors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-cors/flask_cors-${{ version }}.tar.gz
  sha256: 30c5031552cd59f620ac0c8211dac45b345d3b2df310e7721879e4f46ef9c601

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - flask >=0.9
    - werkzeug >=0.7
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - flask_cors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://corydolphin.github.io/flask-cors/
  license: MIT
  license_file: LICENSE
  summary: A Flask extension simplifying CORS support
  description: |
    A Flask extension simplifying CORS support
  repository: https://github.com/corydolphin/flask-cors
  documentation: https://corydolphin.github.io/flask-cors/

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
    - bollwyvl

#### CFE metadata AND comments
