# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: poetry-plugin-shell
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/poetry-plugin-shell/poetry_plugin_shell-${{ version }}.tar.gz
  sha256: 2c2f878f2dbf488cdfd990fc7205af858280942f4ff766d7bbc5aa8b198a1762

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - pexpect <5.0.0,>=4.7.0
    - poetry <3.0,>=2.0
    - shellingham <2.0,>=1.5

tests:
  - python:
      imports:
        - poetry_plugin_shell
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://python-poetry.org/
  license: MIT
  license_file: LICENSE
  summary: Poetry plugin to run subshell with virtual environment activated
  description: |
    Poetry plugin to run subshell with virtual environment activated
  repository: https://github.com/python-poetry/poetry-plugin-shell

extra:
  recipe-maintainers:
    - rxm7706

