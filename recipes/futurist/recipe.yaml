# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.4.0"

package:
  name: futurist
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/futurist/futurist-${{ version }}.tar.gz
  sha256: ed00c6f4c815cce9549157e8ec28624b2f5ec83f9577b0dbe54f7516137d43d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pbr >=6.1.1
  run:
    - python >=${{ python_min }}
    - debtcollector >=3.0.0

tests:
  - python:
      imports:
        - futurist
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://docs.openstack.org/futurist
  license: Apache-2.0
  license_file: LICENSE
  summary: Useful additions to futures, from the future.
  description: |
    Useful additions to futures, from the future.
  repository: https://opendev.org/openstack/futurist

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
