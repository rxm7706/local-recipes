# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.9"

package:
  name: intake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/intake/intake-${{ version }}.tar.gz
  sha256: 39b4b20abd3ccb7ddc735412b28e411db8bf6b27ff16e705cf77e4dc96137165

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - platformdirs
    - fsspec >=2023.0.0
    - pyyaml
    - networkx

tests:
  - python:
      imports:
        - intake
      pip_check: true
      python_version: ${{ python_min }}
  - files:
      source:
        - intake

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Data load and catalog system
  homepage: https://github.com/intake/intake

extra:
  recipe-maintainers:
    - ocefpaf
    - martindurant
