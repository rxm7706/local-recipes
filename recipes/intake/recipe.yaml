# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.9"

package:
  name: intake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/intake/intake-${{ version }}.tar.gz
  sha256: 39b4b20abd3ccb7ddc735412b28e411db8bf6b27ff16e705cf77e4dc96137165

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - fsspec >=2023.0.0
    - pyyaml
    - platformdirs
    - networkx

tests:
  - python:
      imports:
        - intake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - intake

about:
  homepage: https://pypi.org/project/intake/
  license: MIT
  license_file: LICENSE
  summary: Data catalog, search and load
  description: |
    Data catalog, search and load

extra:
  recipe-maintainers:
    - ocefpaf
    - martindurant

#### CFE metadata AND comments
