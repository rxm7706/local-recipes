# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.4.0"

package:
  name: pandas_market_calendars
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas_market_calendars/pandas_market_calendars-${{ version }}.tar.gz
  sha256: b02f3a0e9bcb4b9e82a5060bf260ef0060ccd398f989b5e6f8208f4352967806

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >=${{ python_min }}
    - exchange-calendars >=3.3
    - pandas >=1.1

tests:
  - python:
      imports:
        - pandas_market_calendars
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rsheftel/pandas_market_calendars
  license: MIT
  license_file: LICENSE
  summary: Market and exchange trading calendars for pandas
  description: |
    Market and exchange trading calendars for pandas
  repository: https://github.com/rsheftel/pandas_market_calendars
  documentation: https://pandas-market-calendars.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - mathiaseitz
    - trendelkampschroer
    - yehoshuadimarsky

