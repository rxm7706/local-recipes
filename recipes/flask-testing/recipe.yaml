    - pkg:pypi/flask-testing@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/jarus/flask-testing
  cfe-import-names: [flask_testing]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/flask-testing-feedstock
  cfe-forge-recipe-updates-needed: 
