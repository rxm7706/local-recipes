# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"

package:
  name: flask-testing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Testing/Flask-Testing-${{ version }}.tar.gz
  sha256: 0a734d7b68e63a9410b413cd7b1f96456f9a858bd09a6222d465650cc782eb01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask
    - werkzeug

tests:
  - python:
      imports:
        - flask_testing
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jarus/flask-testing
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Unit testing for Flask
  description: |
    Unit testing for Flask

extra:
  recipe-maintainers:
    - pmlandwehr

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: flask-testing
  cfe-upstream-registry: pypi
  cfe-upstream-name: flask-testing
