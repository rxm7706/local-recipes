# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-word
  version: "1.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail_word-${{ version }}.tar.gz
  sha256: a014fbc72d4a480278f301cfde37a482d10ba15a25b0c98ebf7fc920ff7328ab

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=40.8.0
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - wagtail >=4.2
    - python-docx >=1.1.0

tests:
  - python:
      imports:
        - wagtail_word
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Easily upload your word documents to Wagtail as pages
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/Nigel2392/wagtail_word

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: wagtail-word
  cfe-upstream-registry: pypi
  cfe-upstream-name: wagtail-word
