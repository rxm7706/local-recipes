# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.5"

package:
  name: pyhcl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyhcl/pyhcl-${{ version }}.tar.gz
  sha256: c47293a51ccdd25e18bb5c8c0ab0ffe355b37c87f8d6f9d3280dc41efd4740bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hcl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/virtuald/pyhcl
  license: MPL-2.0
  license_file: LICENSE
  summary: HCL configuration parser for python
  description: |
    HCL configuration parser for python

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pyhcl
  cfe-upstream-registry: pypi
  cfe-upstream-name: pyhcl
  cfe-purls:
    - pkg:conda/pyhcl@${{ version }}?channel=conda-forge
    - pkg:pypi/pyhcl@${{ version }}
  cfe-upstream-repo: https://github.com/virtuald/pyhcl
  cfe-upstream-homepage: https://github.com/virtuald/pyhcl
  cfe-import-names: [hcl]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
