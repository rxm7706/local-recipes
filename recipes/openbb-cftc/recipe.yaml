# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.4.2"

package:
  name: openbb-cftc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openbb-cftc/openbb_cftc-${{ version }}.tar.gz
  sha256: 86c363d39b4b84b3fbf933dc33b491423154e3cf997ed8abd27d435dc4a7fc3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}
    - openbb-core <2.0.0,>=1.6.10
    - openbb-platform-api <2.0.0,>=1.3.5

tests:
  - python:
      imports:
        - openbb_cftc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/openbb-cftc/
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: The mission of the Commodity Futures Trading Commission (CFTC) is to promote the integrity, resilience, and vibrancy of the U.S. derivatives markets through sound regulation.
  description: |
    The mission of the Commodity Futures Trading Commission (CFTC) is to promote the integrity, resilience, and vibrancy of the U.S. derivatives markets through sound regulation.

extra:
  recipe-maintainers:
    - rxm7706

