# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.9"

package:
  name: bottle-websocket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bottle-websocket/bottle-websocket-${{ version }}.tar.gz
  sha256: 9887f70dc0c7592ed8d0d11a14aa95dede6cd08d50d83d5b81fd963e5fec738b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bottle_websocket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zeekay/bottle-websocket
  license: MIT
  license_file: LICENSE
  summary: WebSockets for bottle
  description: |
    WebSockets for bottle

extra:
  recipe-maintainers:
    - rxm7706

