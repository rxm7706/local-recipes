# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.11.9"

package:
  name: standard-distutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/standard-distutils/standard_distutils-${{ version }}.tar.gz
  sha256: 37d6c9f0f0321ed3c9c923e54b0fdbafa3d7bf556821de55fd8158d7f440deb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/youknowone/python-deadlib
  license: PSF-2.0
  license_file: LICENSE
  summary: Standard library distutils redistribution. "dead battery".
  description: |
    Standard library distutils redistribution. "dead battery".

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
