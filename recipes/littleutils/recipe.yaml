# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: littleutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/littleutils/littleutils-${{ version }}.tar.gz
  sha256: c7835b01020ced42e291118b7d78fb16bc2d9a1b4f3f42f3cb3787bb4da53d19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - littleutils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/alexmojaki/littleutils
  license: MIT
  license_file: LICENSE
  summary: Small personal collection of python utility functions
  description: |
    Small personal collection of python utility functions

extra:
  recipe-maintainers:
    - hoechenberger

