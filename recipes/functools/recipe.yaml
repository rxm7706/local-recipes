# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: functools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/functools/functools-${{ version }}.tar.gz
  sha256: 596ed8999dee419c0749a41bfdd82e4697e80ea27ee01c716003ef55be9a54c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - functools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.trit.org/~dima/
  license: MIT
  license_file: LICENSE
  summary: Fast tools for functional programming
  description: |
    Fast tools for functional programming

extra:
  recipe-maintainers:
    - rxm7706

