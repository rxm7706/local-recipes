# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: streamlit-embedcode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-embedcode/streamlit-embedcode-${{ version }}.tar.gz
  sha256: 22a50eb43407bab3d0ed2d4b58e89819da477cd0592ef87edbd373c286712e3a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_embedcode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/randyzwitch/streamlit-embedcode
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Streamlit component for embedded code snippets
  description: |
    Streamlit component for embedded code snippets

extra:
  recipe-maintainers:
    - rxm7706

