# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.sequencesort
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.sequencesort/zope_sequencesort-${{ version }}.tar.gz
  sha256: 81a745cc6261d5544de883593d1926867ceb5195b26727c88ed25bc39919fcea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports:
        - zope.sequencesort
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zopefoundation/zope.sequencesort
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Sequence Sorting
  description: |
    Sequence Sorting

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
