# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"

package:
  name: async-to-sync
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/async-to-sync/async_to_sync-${{ version }}.tar.gz
  sha256: 592b07f1644bae56202f13efa6a7b1f048ed9b24eb7c9e927e4064535273fcaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - async_to_sync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xloem/async_to_sync
  license: MIT
  license_file: LICENSE
  summary: Convert async coroutines to normal python functions
  description: |
    Convert async coroutines to normal python functions

extra:
  recipe-maintainers:
    - rxm7706

