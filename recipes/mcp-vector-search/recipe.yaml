# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.14"

package:
  name: mcp-vector-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mcp-vector-search/mcp_vector_search-${{ version }}.tar.gz
  sha256: ea3afb020d2528c3de155a295d4411c49b11027e102d9009200d5a4ca65e5d0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=23.0.0
    - authlib >=1.6.4
    - boto3 >=1.35.0
    - click-didyoumean >=0.3.0
    - fastapi >=0.104.0
    - httpx >=0.25.0
    - kuzu >=0.7.0
    - lancedb >=0.20.0
    - loguru >=0.7.0
    - mcp >=1.12.4
    - networkx >=3.0
    - orjson >=3.9.0
    - packaging >=23.0
    - pandas >=2.0.0
    - psutil >=5.9.0
    - py-mcp-installer >=0.1.4
    - pydantic-settings >=2.1.0
    - pydantic >=2.5.0
    - pylance >=0.20.0
    - pyyaml >=6.0
    - rank-bm25 >=0.2.2
    - rich >=13.0.0
    - sentence-transformers <6.0.0,>=5.2.0
    - starlette >=0.49.1
    - transformers <5.0.0,>=4.34.0
    - tree-sitter-language-pack >=0.9.0
    - tree-sitter >=0.20.1
    - typer >=0.9.0
    - uvicorn >=0.24.0
    - watchdog >=3.0.0
    - yake >=0.4.8
    - if: osx
      then:
        - pytorch

tests:
  - python:
      imports:
        - mcp_vector_search
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bobmatnyc/mcp-vector-search
  license: MIT
  license_file: LICENSE
  summary: CLI-first semantic code search with MCP integration and interactive D3.js visualization for exploring code relationships
  description: |
    CLI-first semantic code search with MCP integration and interactive D3.js visualization for exploring code relationships
  repository: https://github.com/bobmatnyc/mcp-vector-search
  documentation: https://mcp-vector-search.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
