# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# Generated from python-maturin path; PyO3/maturin detected via sdist
# pyproject.toml [build-system].requires. Modelled on phonors PR pattern
# (modal 27-PR PyO3 sample, Mar 2020 – May 2026). Recipe shape follows the
# 2026 grayskull / conda-forge convention: literal ``package.name``, literal
# ``source.url`` (only ``${ version }`` templated), no ``name`` in context.
schema_version: 1

context:
  version: "2.8.2"

package:
  name: abnf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/abnf/abnf-${{ version }}.tar.gz
  sha256: 6f20bf1246d0cd21da51c8f65a37893ad12a12daf0db6adf941d16f443a13866

build:
  number: 0
  script:
    env:
      # Per conda-forge.org/docs/maintainer/example_recipes/rust/ — applies to
      # any Rust build (CLI binary OR maturin/PyO3 cdylib). maturin invokes
      # cargo build internally and inherits these env vars.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - abnf
      pip_check: true

about:
  homepage: https://github.com/declaresub/abnf
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Parsers for ABNF grammars.
  description: |
    Parsers for ABNF grammars.
  repository: https://github.com/declaresub/abnf
  documentation: https://abnf.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: abnf
  cfe-upstream-registry: pypi
  cfe-upstream-name: abnf
  cfe-purls:
    - pkg:conda/abnf@${{ version }}?channel=conda-forge
    - pkg:pypi/abnf@${{ version }}
  cfe-upstream-repo: https://github.com/declaresub/abnf
  cfe-upstream-homepage: https://github.com/declaresub/abnf
  cfe-import-names: [abnf]
  cfe-source-kind: pypi-sdist
  cfe-noarch: compiled
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
  cfe-last-checked: 2026-08-16T23:47:53Z
  cfe-generated-by-version: 8.81.0
  cfe-generated-at-datetime: 2026-08-16T23:47:53Z
  cfe-local-build-status: not-attempted
  cfe-local-build-datetime: none
  cfe-local-build-platform: none
  cfe-local-build-tool: none
