# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"

package:
  name: markdownlit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/markdownlit/markdownlit-${{ version }}.tar.gz
  sha256: 553e2db454e2be4567caebef5176c98a40a7e24f7ea9c2fe8a1f05c1d9ea4005

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - streamlit
    - streamlit-extras
    - htbuilder
    - markdown
    - lxml
    - favicon
    - pymdown-extensions

tests:
  - python:
      imports:
        - markdownlit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/arnaudmiribel/markdownlit
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: markdownlit adds a couple of lit Markdown capabilities to your Streamlit apps
  description: |
    markdownlit adds a couple of lit Markdown capabilities to your Streamlit apps

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
