# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"
  python_min: "3.11"

package:
  name: chuk-session-manager
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chuk-session-manager/chuk_session_manager-${{ version }}.tar.gz
  sha256: 9cb896642b36e0e7c366b3e13ba99cbb9e5356c778a6cd63ba0c10f719674f98

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - aiofiles >=24.1.0
    - chuk-tool-processor >=0.1.6
    - pydantic >=2.11.3

tests:
  - python:
      imports:
        - chuk_session_manager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/chuk-session-manager/
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Session manager for A2A applications
  description: |
    Session manager for A2A applications

extra:
  recipe-maintainers:
    - rxm7706

