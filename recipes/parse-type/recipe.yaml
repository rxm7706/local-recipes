# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.6"

package:
  name: parse-type
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/parse-type/parse_type-${{ version }}.tar.gz
  sha256: 513a3784104839770d690e04339a8b4d33439fcd5dd99f2e4580f9fc1097bfb2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - parse >=1.13.1
    - enum34
    - six >=1.15

tests:
  - python:
      imports:
        - parse_type
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jenisys/parse_type
  license: MIT
  license_file: LICENSE
  summary: Simplifies to build parse types based on the parse module
  description: |
    Simplifies to build parse types based on the parse module
  repository: https://github.com/jenisys/parse_type

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
