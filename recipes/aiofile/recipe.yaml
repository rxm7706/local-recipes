# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.12.3"

package:
  name: aiofile
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aiofile/aiofile-${{ version }}.tar.gz
  sha256: caa6aa746b5e47e2165f7abd741b6415e49cf4d44fddc0f61844612cc3924d41

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - caio ~=0.12.0

tests:
  - python:
      imports:
        - aiofile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mosquito/aiofile
  license: Apache-2.0
  license_file: LICENSE
  summary: Asynchronous file operations.
  description: |
    Asynchronous file operations.

extra:
  recipe-maintainers:
    - BastianZim

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: aiofile
  cfe-upstream-registry: pypi
