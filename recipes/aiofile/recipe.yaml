# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: aiofile
  version: "3.12.3"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aiofile-${{ version }}.tar.gz
  sha256: caa6aa746b5e47e2165f7abd741b6415e49cf4d44fddc0f61844612cc3924d41

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python 3.11.*
    - hatchling
  run:
    - caio >=0.12.0,<0.13.dev0
    # Conda version of ~=0.9.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aiofile
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Asynchronous file operations.
  license: Apache-2.0
  license_file: LICENCE.md
  homepage: http://github.com/mosquito/aiofile

extra:
  recipe-maintainers:
    - BastianZim
