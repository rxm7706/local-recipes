# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: composio
  version: "0.19.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/composio-${{ version }}.tar.gz
  sha256: 828d4072d35b511f44d97575801e2bf1412dbbe4c51c33f165b151d2da98b083

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
  run:
    - jsonschema >=4.23.0
    - json-schema-to-pydantic >=0.4.11
    - python >=${{ python_min }},<4.0
    - pysher >=1.0.8
    - pydantic >=2.11.9
    - composio-client ==1.43.0
    - typing_extensions >=4.16.0
    - openai >=2.48.0

tests:
  - python:
      imports:
        - composio
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: SDK for integrating Composio with your applications.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/composiohq/composio

extra:
  recipe-maintainers:
    - jan-janssen
