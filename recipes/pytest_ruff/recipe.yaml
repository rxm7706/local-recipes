# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest_ruff
  python_min: "3.8"
  version: "0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f611c780fc2b9b8d7041fa0e7589f0a9f352b288d0cfc330881101b35d382063

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.8.*
    - poetry-core
    - poetry-dynamic-versioning
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=5
    - ruff >=0.0.242

tests:
  - python:
      imports:
        - pytest_ruff
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A pytest plugin to run ruff
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pytest-ruff/
  repository: https://github.com/businho/pytest-ruff

extra:
  recipe-maintainers:
    - kynan
