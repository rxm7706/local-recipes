# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5"

package:
  name: pytest-ruff
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-ruff/pytest_ruff-${{ version }}.tar.gz
  sha256: f611c780fc2b9b8d7041fa0e7589f0a9f352b288d0cfc330881101b35d382063

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - pytest >=5
    - ruff >=0.0.242

tests:
  - python:
      imports:
        - pytest_ruff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/businho/pytest-ruff
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: pytest plugin to check ruff requirements.
  description: |
    pytest plugin to check ruff requirements.

extra:
  recipe-maintainers:
    - kynan

#### CFE metadata AND comments
