# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.1"

package:
  name: streamlit-embeded
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/streamlit-embeded/streamlit_embeded-${{ version }}.tar.gz
  sha256: f95bf0eb27ad14b8423d2219497f7f5b0b23664fa9939d7325cad04694370d46

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit

tests:
  - python:
      imports:
        - streamlit_embeded
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mapix/streamlit-embeded
  license: MIT
  license_file: LICENSE
  summary: Common embeded for Streamlit.
  description: |
    Common embeded for Streamlit.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
