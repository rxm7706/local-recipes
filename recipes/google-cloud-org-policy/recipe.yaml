# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.18.0"

package:
  name: google-cloud-org-policy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-org-policy/google_cloud_org_policy-${{ version }}.tar.gz
  sha256: 41e330cfc833863d10a6b5f5ffaa2a12d0fe2f08fa03d619faaad744ae8d922b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.17.1
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.22.3
    - protobuf <8.0.0,>=4.25.8

tests:
  - python:
      imports:
        - google.cloud.orgpolicy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-org-policy
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Org Policy API client library
  description: |
    Google Cloud Org Policy API client library

extra:
  recipe-maintainers:
    - rxm7706

