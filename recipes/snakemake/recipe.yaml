# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.25.1"
  python_min: "3.11"

package:
  name: snakemake
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/snakemake/snakemake-${{ version }}.tar.gz
  sha256: 5a0486d397370a19b636fd1f734765520fa744bc5071c309e3393b62f5d87aa5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - platformdirs
    - immutables
    - configargparse
    - connection_pool >=0.0.3
    - docutils <0.23,>=0.20
    - gitpython
    - humanfriendly
    - jinja2 <4.0,>=3.0
    - jsonschema
    - nbformat
    - packaging <26,>=24.0
    - psutil
    - pulp <3.4,>=2.3.1
    - pyyaml
    - referencing
    - requests <3.0,>=2.8.1
    - tenacity <10.0,>=9.1.4
    - smart-open <8.0,>=4.0
    - snakemake-interface-executor-plugins <10.0,>=9.3.2
    - snakemake-interface-common <2.0,>=1.20.1
    - snakemake-interface-storage-plugins <5.0,>=4.4.1
    - snakemake-interface-report-plugins <2.0.0,>=1.2.0
    - snakemake-interface-logger-plugins <3.0.0,>=1.1.0
    - snakemake-interface-scheduler-plugins <3.0.0,>=2.0.0
    - tabulate
    - throttler
    - wrapt
    - yte <2.0,>=1.5.5
    - dpath <3.0.0,>=2.1.6
    - conda-inject <2.0,>=1.3.1
    - sqlmodel <0.0.38,>=0.0.37

tests:
  - python:
      imports:
        - snakemake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://snakemake.github.io
  license: MIT
  license_file: LICENSE
  summary: Workflow management system to create reproducible and scalable data analyses
  description: |
    Workflow management system to create reproducible and scalable data analyses
  repository: https://github.com/snakemake/snakemake
  documentation: https://snakemake.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
