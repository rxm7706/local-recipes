# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: chevron
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chevron/chevron-${{ version }}.tar.gz
  sha256: 87613aafdf6d77b6a90ff073165a61ae5086e21ad49057aa0e53681601800ebf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - chevron
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/noahmorrison/chevron
  license: MIT
  license_file: LICENSE
  summary: Mustache templating language renderer
  description: |
    Mustache templating language renderer

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - oblute
    - ndmaxar

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: chevron
  cfe-upstream-registry: pypi
  cfe-upstream-name: chevron
  cfe-purls:
    - pkg:conda/chevron@${{ version }}?channel=conda-forge
    - pkg:pypi/chevron@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/noahmorrison/chevron
  cfe-import-names: [chevron]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/chevron-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-0.14.0

  cfe-forge-blocker-list:
    - missing-license-file
    - missing-license-file
    - missing-license-file
    - missing-license-file

  cfe-last-checked: 2026-08-18T08:29:24Z
