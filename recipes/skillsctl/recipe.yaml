# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: skillsctl
  version: ${{ version }}

source:
  url: https://github.com/nebari-dev/skillsctl/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d1184f4ad4f1b4c2528e3e164f75b3423c93771adeaabcfb584b420e6a2146da
  target_directory: src

build:
  number: 0
  script:
    env:
      GOTOOLCHAIN: local
    content:
      - cd src
      - go-licenses save ./cli ./backend/cmd/server --save_path ../library_licenses
      - if: unix
        then: |
          go build -v -trimpath -o "${PREFIX}/bin/skillsctl" -ldflags="-s -w -X github.com/nebari-dev/skillsctl/cli/cmd.version=${{ version }}" ./cli
          go build -v -trimpath -o "${PREFIX}/bin/skillsctl-server" -ldflags="-s -w -X main.buildVersion=${{ version }}" ./backend/cmd/server
        else: |
          go build -v -trimpath -o %LIBRARY_BIN%\skillsctl.exe -ldflags="-s -w -X github.com/nebari-dev/skillsctl/cli/cmd.version=${{ version }}" ./cli

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - skillsctl --version
      - skillsctl --help
  - if: unix
    then:
      script:
        - test -x "${PREFIX}/bin/skillsctl-server"
  - package_contents:
      bin:
        - skillsctl

about:
  homepage: https://github.com/nebari-dev/skillsctl
  repository: https://github.com/nebari-dev/skillsctl
  documentation: https://github.com/nebari-dev/skillsctl#readme
  summary: CLI and registry server for discovering, installing, and publishing Claude Code skills
  description: |
    skillsctl is the Nebari skill registry: a CLI for discovering, installing
    and publishing Claude Code skills, plus the registry server that backs it.
    Skills are versioned, governed artifacts an organization can host inside
    its own perimeter rather than re-pasting into each agent session.

    This package ships both binaries upstream releases: `skillsctl`, the
    client, and `skillsctl-server`, the registry backend (Unix only, matching
    upstream's own release matrix). The server is configured entirely through
    environment variables — `PORT`, `DB_PATH`, `OIDC_ISSUER_URL`,
    `OIDC_CLIENT_ID` — and stores its data in SQLite via a pure-Go driver.

    skillsctl is the project Nebari Frames succeeds and borrows its registry
    foundations from; it continues to ship as the Claude Code skill registry.
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - rxm7706

