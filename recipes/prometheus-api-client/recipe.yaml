# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.2"

package:
  name: prometheus-api-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/prometheus-api-client/prometheus_api_client-${{ version }}.tar.gz
  sha256: ddc79ca905c6001aac31a15c42d362d410ce38847e762cecc56edc79c6012e05

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - dateparser

tests:
  - python:
      imports:
        - prometheus_api_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/4n4nd/prometheus-api-client-python
  license: MIT
  license_file: LICENSE
  summary: A small python api to collect data from prometheus
  description: |
    A small python api to collect data from prometheus

extra:
  recipe-maintainers:
    - rxm7706

