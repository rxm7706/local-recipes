# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.52.0"

package:
  name: espeak-ng
  version: ${{ version }}

source:
  url: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/${{ version }}.tar.gz
  sha256: bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23

build:
  number: 0
  script:
    - if: unix
      then: |
        set -ex
        # N_PATH_HOME defaults to 230 bytes (speech.h), and speech.c:338 fills
        # it with a bare strcpy() of the compiled-in PATH_ESPEAK_DATA. conda's
        # placeholder build prefix is longer than that, so a stock build
        # aborts on the FIRST call with "*** buffer overflow detected ***"
        # under _FORTIFY_SOURCE -- even `espeak-ng --version`. speech.h wraps
        # the constant in `#ifndef N_PATH_HOME`, so raising it is the
        # upstream-sanctioned override and needs no source patch.
        export CFLAGS="${CFLAGS:-} -DN_PATH_HOME=1024"
        export CXXFLAGS="${CXXFLAGS:-} -DN_PATH_HOME=1024"
        ./autogen.sh
        ./configure \
          --prefix="${PREFIX}" \
          --without-pcaudiolib \
          --without-mbrola
        make -j"${CPU_COUNT}"
        make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - autoconf
    - automake
    - libtool
    - pkg-config

tests:
  - script:
      - espeak-ng --version
      # The real capability this package exists for: text -> IPA phonemes.
      # `--version` alone would pass on a binary that cannot find its data.
      - espeak-ng -q -x --ipa "hello world"
      - 'espeak-ng -q -x --ipa "hello world" | grep -q "h"'
  - package_contents:
      bin:
        - espeak-ng
      lib:
        - espeak-ng
      files:
        - share/espeak-ng-data/phontab
        - share/espeak-ng-data/en_dict

about:
  homepage: https://github.com/espeak-ng/espeak-ng
  repository: https://github.com/espeak-ng/espeak-ng
  documentation: https://github.com/espeak-ng/espeak-ng/blob/master/docs/guide.md
  summary: Compact open-source speech synthesizer and text-to-phoneme engine
  description: |
    eSpeak NG is a compact open-source software speech synthesizer supporting
    over 100 languages and accents. It uses a formant synthesis method, which
    keeps the installed size small at some cost in naturalness.

    Beyond synthesis it is widely used as a text-to-phoneme (grapheme-to-
    phoneme) engine: `espeak-ng -q -x --ipa` emits IPA for input text, which
    is how the `phonemizer` library and TTS front-ends such as kokoro-onnx
    obtain phonemes.

    This package ships the `espeak-ng` command, the `libespeak-ng` shared
    library, and the compiled `espeak-ng-data` dictionaries.
  license: GPL-3.0-or-later AND Apache-2.0 AND BSD-2-Clause AND Unicode-DFS-2016
  license_file:
    - COPYING
    - COPYING.APACHE
    - COPYING.BSD2
    - COPYING.UCD

extra:
  recipe-maintainers:
    - rxm7706

