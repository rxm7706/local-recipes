# CFE comments
# Header:
#    # espeak-ng is ABSENT from conda-forge under every spelling (checked
#    # 2026-09-07 against live channeldata: the only *speak* matches are the
#    # unrelated `genespeak` and `speaklater`). It is the foundation of the
#    # kokoro-onnx TTS chain in this repo -- phonemizer talks to
#    # libespeak-ng, and kokoro-onnx talks to phonemizer.
#    #
#    # WHY BUILD IT RATHER THAN REPACKAGE espeakng-loader's WHEEL: the PyPI
#    # `espeakng-loader` wheels bundle a prebuilt libespeak-ng whose data
#    # path is COMPILED IN as the upstream CI machine's own build directory
#    # (/home/runner/work/espeakng-loader/...). Nothing overrides it --
#    # neither phonemizer's EspeakWrapper.set_data_path() (which kokoro-onnx
#    # already calls correctly) nor the ESPEAK_DATA_PATH environment
#    # variable. Verified 2026-09-07: stock `pip install kokoro-onnx` fails
#    # identically on Python 3.12 AND 3.14 with
#    # "Error processing file '/home/runner/.../phontab'", and succeeds the
#    # moment PHONEMIZER_ESPEAK_LIBRARY points at a real espeak-ng.
#    #
#    # A conda build does not have that defect: configure bakes
#    # ${PREFIX}/share/espeak-ng-data into the binary, conda records it in
#    # info/has_prefix, and the path is REWRITTEN at install time to the
#    # real environment. That placeholder mechanism is precisely what the
#    # wheel lacks -- which is why this package exists rather than a
#    # binary repackage.
# build:
#    # autotools, not the CMakeLists: CMakeLists.txt in 1.52.0 is a stub
#    # (one option, one install rule) while configure.ac is the maintained
#    # build. `make` also COMPILES the dictionaries in dictsource/ into
#    # espeak-ng-data/*_dict using the freshly built binary, so the data
#    # this package ships is built here, not vendored.
#    # --without-pcaudiolib: drops the runtime audio-output dependency.
#    # Nothing in this chain plays audio -- phonemizer and kokoro-onnx only
#    # ever ask espeak-ng for phonemes, and kokoro does its own synthesis
#    # through onnxruntime. --without-mbrola drops the optional external
#    # MBROLA voice backend for the same reason.
# tests:
#    # The test phonemizes rather than only printing --version, because
#    # --version passes on a binary that cannot locate espeak-ng-data --
#    # which is exactly the failure mode the wheel exhibits. package_contents
#    # additionally pins phontab and en_dict, the two data files whose
#    # absence produces that error.
# about:
#    # Compound licence: COPYING is GPL-3.0 (the engine), with Apache-2.0,
#    # BSD-2-Clause and Unicode data licences covering vendored components;
#    # all four texts ship. GPL-3.0-or-later is OSI-approved, so unlike the
#    # Chrome-for-Testing packages in this repo there is no licensing bar to
#    # conda-forge here -- espeak-ng is simply an unfilled gap.
####
