# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.13.1"

package:
  name: google-cloud-storage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-storage/google_cloud_storage-${{ version }}.tar.gz
  sha256: a80bf8cac2794808aa61c50c5f769ecbbe2d10331bacd0d69d30e59b14b346b2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-auth <3.0.0,>=2.26.1
    - google-api-core <3.0.0,>=2.27.0
    - google-cloud-core <3.0.0,>=2.4.2
    - google-resumable-media <3.0.0,>=2.7.2
    - requests <3.0.0,>=2.22.0
    - google-crc32c <2.0.0,>=1.6.0

tests:
  - python:
      imports:
        - google.cloud.storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Storage API client library
  description: |
    Google Cloud Storage API client library

extra:
  recipe-maintainers:
    - xylar
    - andreyz4k
    - johanneskoester
    - tswast

