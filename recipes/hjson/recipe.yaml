# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.0"

package:
  name: hjson
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hjson/hjson-${{ version }}.tar.gz
  sha256: 55af475a27cf83a7969c808399d7bccdec8fb836a07ddbd574587593b9cdcf75

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hjson
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/hjson/hjson-py
  license: MIT
  license_file: LICENSE
  summary: Hjson, a user interface for JSON.
  description: |
    Hjson, a user interface for JSON.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
