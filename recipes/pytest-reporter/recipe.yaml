# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.3"

package:
  name: pytest-reporter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-reporter/pytest-reporter-${{ version }}.tar.gz
  sha256: 426ae38f3c5304659635eff1d4080c8acf4dc6cd833469caed427a9a80bb41aa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest

tests:
  - python:
      imports:
        - pytest_reporter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/christiansandberg/pytest-reporter
  license: MIT
  license_file: LICENSE
  summary: Generate Pytest reports with templates
  description: |
    Generate Pytest reports with templates

extra:
  recipe-maintainers:
    - rxm7706

