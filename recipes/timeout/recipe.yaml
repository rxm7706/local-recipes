# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.2"

package:
  name: timeout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/timeout/timeout-${{ version }}.tar.gz
  sha256: de24cd09024898f04779f7685150f47e1c67ba4e34a198d23b8412be21e13baa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timeout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.finalcog.com
  license: MIT
  license_file: LICENSE
  summary: Python Timeout Decorators
  description: |
    Python Timeout Decorators

extra:
  recipe-maintainers:
    - rxm7706

