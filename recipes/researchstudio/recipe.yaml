#    # a noarch:generic skills payload under share/<name>/ plus a Python
#    # installer entry point.
# context:
#    # NOT on npm — package.json is only an installer stub invoked as
#    # `npx github:microsoft/ResearchStudio` (registry lookup: 404), so the
#    # npm generator path does not apply. No releases and no tags either, so
#    # the source is a commit archive rather than a tag archive.
# build:
#    # Ships both skill bundles + docs + the Idea .env.template. bin/install.mjs
#    # and install.sh are upstream's own installers, which symlink skills into a
#    # repo's .claude/ or .codex/ dir and shell out to pip/apt; they are NOT
#    # packaged. The conda entry point does the copy directly instead, so
#    # nothing in this package writes outside the destination you name.
# requirements:
#    # python is required only by the researchstudio-install entry point.
#    # Per-skill extras (python-docx, PyMuPDF, Pillow, numpy for paper2blog;
#    # edge-tts for paper2poster — the latter is NOT on conda-forge) are
#    # deliberately NOT declared: the skills are markdown instructions run by a
#    # coding agent, only some are used in any given project, and pinning them
#    # would force a heavy install on a documentation payload. Same call as
#    # bmad-manticore.
