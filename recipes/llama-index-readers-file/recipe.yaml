# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: llama-index-readers-file
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-readers-file/llama_index_readers_file-${{ version }}.tar.gz
  sha256: ff366d6ff5ecb7119275ac859310d8b672d8b6b3261afae02f4084fce9076bd0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 <5,>=4.12.3
    - defusedxml >=0.7.1
    - llama-index-core <0.15,>=0.13.0
    - pandas <3,>=2.0.0
    - pypdf <7,>=6.1.3
    - striprtf <0.0.27,>=0.0.26

tests:
  - python:
      imports:
        - llama_index.readers.file
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/llama-index-readers-file/
  license: MIT
  license_file: LICENSE
  summary: llama-index readers file integration
  description: |
    llama-index readers file integration

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw

#### CFE metadata AND comments
