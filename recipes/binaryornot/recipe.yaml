# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.0"

package:
  name: binaryornot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/binaryornot/binaryornot-${{ version }}.tar.gz
  sha256: cc8d57cfa71d74ff8c28a7726734d53a851d02fad9e3a5581fb807f989f702f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - binaryornot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/binaryornot/binaryornot
  license: MIT
  license_file: LICENSE
  summary: Ultra-lightweight pure Python package to check if a file is binary or text.
  description: |
    Ultra-lightweight pure Python package to check if a file is binary or text.
  documentation: https://binaryornot.github.io/binaryornot/

extra:
  recipe-maintainers:
    - bollwyvl

