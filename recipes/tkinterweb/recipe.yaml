# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.25.3"

package:
  name: tkinterweb
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tkinterweb/tkinterweb-${{ version }}.tar.gz
  sha256: 5540407b77d0b6663afb88b4030c3f57766eeaa48bd1c83293a43bc59e82e3e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tkinterweb-tkhtml >=2.1.1

tests:
  - python:
      imports:
        - tkinterweb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Andereoo/TkinterWeb
  license: MIT
  license_file: LICENSE
  summary: HTML/CSS widgets for Tkinter
  description: |
    HTML/CSS widgets for Tkinter

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: tkinterweb
