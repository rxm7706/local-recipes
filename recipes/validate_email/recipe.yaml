# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: validate_email
  version: "1.3"
  sha256: 784719dc5f780be319cdd185dc85dd93afebdb6ebb943811bc4c7c5f9c72aeaf

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 4
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - validate_email
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: |
    Validate_email is a package for Python that check if an email is
    valid, properly formatted and really exists.
  homepage: https://github.com/syrusakbary/validate_email
  repository: https://github.com/syrusakbary/validate_email

extra:
  recipe-maintainers:
    - nikicc
    - mariusvniekerk
    - xylar
