# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.61.0"

package:
  name: memory-profiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/memory-profiler/memory_profiler-${{ version }}.tar.gz
  sha256: 4e5b73d7864a1d1292fb76a03e82a3e78ef934d06828a698d9dada76da2067b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - psutil

tests:
  - python:
      imports:
        - memory_profiler
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pythonprofilers/memory_profiler
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A module for monitoring memory usage of a python program
  description: |
    A module for monitoring memory usage of a python program

extra:
  recipe-maintainers:
    - jakirkham
    - carlodri

#### CFE metadata AND comments
