# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.3.0"
  python_min: "3.11"

package:
  name: pantab
  version: ${{ version }}

source:
  url: https://github.com/innobi/pantab/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b9337cac58d9abeebcb7fc7b2c580ac55cadb40a12e0737a00219f1f2101827a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - scikit-build-core
    - nanobind >=2.2.0
  run:
    - python
    - pyarrow >=14.0.0

tests:
  - python:
      imports:
        - pantab
      pip_check: true

about:
  homepage: https://pypi.org/project/pantab/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Converts pandas DataFrames into Tableau Hyper Extracts and back
  description: |
    Converts pandas DataFrames into Tableau Hyper Extracts and back
  repository: https://github.com/innobi/pantab

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pantab
  cfe-upstream-registry: pypi
  cfe-upstream-name: pantab
  cfe-purls:
    - pkg:conda/pantab@${{ version }}?channel=conda-forge
    - pkg:pypi/pantab@${{ version }}
  cfe-upstream-repo: https://github.com/innobi/pantab
  cfe-upstream-homepage: https://pypi.org/project/pantab/
  cfe-import-names: [pantab]
  cfe-source-kind: github-tag:no-sdist-on-pypi-G54
  cfe-noarch: false
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list: []
