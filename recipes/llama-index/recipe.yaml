# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: llama-index
  version: "0.14.23"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/llama_index-${{ version }}.tar.gz
  sha256: eac2049816a7410ff4568490cce4bdff99cda3ab99d59f52f6227dad22cda44b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-cli >=0.5.0,<0.6
    - llama-index-core >=0.14.23,<0.15.0
    - llama-index-embeddings-openai >=0.6.0,<0.7
    - llama-index-indices-managed-llama-cloud >=0.4.0
    - llama-index-llms-openai >=0.7.0,<0.8
    - llama-index-readers-file >=0.5.0,<0.6
    - llama-index-readers-llama-parse >=0.4.0
    - nltk >=3.9.3

tests:
  - python:
      imports:
        - llama_index
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Interface between LLMs and your data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
