# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.39.1"

package:
  name: google-cloud-pubsub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-pubsub/google_cloud_pubsub-${{ version }}.tar.gz
  sha256: dacead1fa0aca7b2015f1acc88d279cd4b12852087908f426fbecf71985940e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core <3.0.0,>=2.25.0
    - google-auth !=2.24.0,!=2.25.0,<3.0.0,>=2.14.1
    - grpcio <2.0.0,>=1.59.0
    - proto-plus <2.0.0,>=1.26.1
    - protobuf <8.0.0,>=6.33.5
    - grpc-google-iam-v1 <1.0.0,>=0.14.2
    - grpcio-status <2.0.0,>=1.59.0
    - opentelemetry-api >=1.27.0
    - opentelemetry-sdk >=1.27.0

tests:
  - python:
      imports:
        - google.pubsub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-pubsub
  license: Apache-2.0
  license_file: LICENSE
  summary: Google Cloud Pub/Sub API client library
  description: |
    Google Cloud Pub/Sub API client library

extra:
  recipe-maintainers:
    - xylar
    - hmaarrfk
    - tpdownes
    - tswast

