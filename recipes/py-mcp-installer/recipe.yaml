# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.5"

package:
  name: py-mcp-installer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/py-mcp-installer/py_mcp_installer-${{ version }}.tar.gz
  sha256: c17957d502f5e69f61d550724b2c24ce2625e1c8f82c4add1862c85dfa330d7d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0.0
    - typing_extensions >=4.0.0
    - tomli-w >=1.0.0
    - tomli >=2.0.0

tests:
  - python:
      imports:
        - py_mcp_installer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bobmatnyc/py-mcp-installer-service
  license: MIT
  license_file: LICENSE
  summary: Universal MCP server installer for AI coding tools
  description: |
    Universal MCP server installer for AI coding tools
  repository: https://github.com/bobmatnyc/py-mcp-installer-service
  documentation: https://github.com/bobmatnyc/py-mcp-installer-service/tree/main/docs

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
