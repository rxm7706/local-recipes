# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.65b0"

package:
  name: opentelemetry-exporter-prometheus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-exporter-prometheus/opentelemetry_exporter_prometheus-${{ version }}.tar.gz
  sha256: 2777cbf41c403c119e10f418fce5d645c956b47f673a2ee120285d1d0c6df2d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12
    - opentelemetry-sdk ~=1.44.0
    - prometheus_client <1.0.0,>=0.5.0

tests:
  - python:
      imports:
        - opentelemetry.exporter.prometheus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-prometheus
  license: Apache-2.0
  license_file: LICENSE
  summary: Prometheus Metric Exporter for OpenTelemetry
  description: |
    Prometheus Metric Exporter for OpenTelemetry
  repository: https://github.com/open-telemetry/opentelemetry-python

extra:
  recipe-maintainers:
    - thewchan
    - rxm7706
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-sdk
    - zbowling

