# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# library version is different from project version
# Check 'meson.build' upstream in every release!
context:
  version: 1.5.4
  so_name: 7.0.0
  so_name_major: ${{ so_name | split('.') | first }}

recipe:
  name: dav1d-split
  version: ${{ version }}

source:
  - url: https://code.videolan.org/videolan/dav1d/-/archive/${{ version }}/dav1d-${{ version }}.tar.gz
    sha256: a1d5b63d2d38ec9bd03acf643caa51fa22edd1e89c5a109c4807717216bbec07

build:
  number: 2

outputs:

  # The cache build
  - staging:
      name: dav1d-split
    build:
      script: cache
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - meson >=0.49
        - ninja
        - nasm >=2.14
        - pkg-config
        - if: target_platform == "win-arm64"
          then:
            - m2-perl
            - clang

  # Only what's needed for run_exports downstream
  - package:
      name: libdav1d${{ so_name_major }}

    inherit:
      from: dav1d-split
      run_exports: true

    requirements:
      build:
        # If this output accepts run_exports from dav1d-split, then I would expect to not
        # need to specify the build dependencies again?
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}

    build:
      files:
        include:
          - if: win
            then: Library/bin/*.dll
          - if: osx
            then: lib/lib*.*.dylib
          - if: linux
            then: lib/*.so.*
    tests:
      - script:
          - if: linux
            then:
              - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name_major }}
              - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name }}
          - if: osx
            then:
              - test -f ${PREFIX}/lib/libdav1d.${{ so_name_major }}.dylib
              - test ! -f ${PREFIX}/lib/libdav1d.${{ so_name }}.dylib
          - if: unix
            then:
              - test ! -f ${PREFIX}/bin/dav1d
              - test ! -f ${PREFIX}/lib/libdav1d$SHLIB_EXT
              - test ! -f ${PREFIX}/lib/pkgconfig/dav1d.pc
              - test ! -f ${PREFIX}/include/dav1d/dav1d.h
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\bin\\dav1d.dll exit 1
              - if exist %PREFIX%\\Library\\bin\\dav1d exit 1
              - if exist %PREFIX%\\Library\\lib\\dav1d.lib exit 1
              - if exist %PREFIX%\\Library\\include\\dav1d\\dav1d.h exit 1
              - if exist %PREFIX%\\Library\\lib\\pkgconfig\\dav1d.pc exit 1

  - package:
      name: libdav1d
    build:
      files:
        # Required to exclude everything else rattler-puts everything in this package
        exclude:
          - '*'
    requirements:
      run:
        - ${{ pin_subpackage('libdav1d' ~ so_name_major, upper_bound=None) }}
      run_constraints:
        - _libdav1d_api < 0

  # Everything needed to build against libdav1d (excludes binary)
  - package:
      name: dav1d-devel
    inherit:
      from: dav1d-split
      run_exports: false
    build:
      files:
        include:
          - if: win
            then:
              - Library/include/*
              - Library/lib/*
          - if: osx
            then: lib/lib*.dylib
          - if: linux
            then: lib/*.so
          - if: unix
            then:
              - include/*
              - lib/pkgconfig/*
    requirements:
      run:
        - if: not win
          then: ${{ pin_subpackage('libdav1d' ~ so_name_major, exact=True) }}
      run_exports:
        - if: win
          then: ${{ pin_subpackage('libdav1d', upper_bound=None) }}
        - ${{ pin_subpackage('libdav1d' ~ so_name_major, upper_bound=None) }}
    tests:
      - script:
        - if: linux
          then:
            - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name_major }}
            - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name }}
        - if: osx
          then:
            - test -f ${PREFIX}/lib/libdav1d.${{ so_name_major }}.dylib
        - if: unix
          then:
            - test -f ${PREFIX}/lib/libdav1d$SHLIB_EXT
            - test -f ${PREFIX}/include/dav1d/dav1d.h
            - test -f ${PREFIX}/lib/pkgconfig/dav1d.pc
            - test ! -f ${PREFIX}/lib/libdav1d.a
            - test ! -f ${PREFIX}/bin/dav1d
        - if: win
          then:
            - if not exist %PREFIX%\\Library\\lib\\dav1d.lib exit 1
            - if not exist %PREFIX%\\Library\\include\\dav1d\\dav1d.h exit 1
            - if not exist %PREFIX%\\Library\\lib\\pkgconfig\\dav1d.pc exit 1
            - if exist %PREFIX%\\Library\\bin\\dav1d.dll exit 1
            - if exist %PREFIX%\\Library\\bin\\dav1d exit 1

  - package:
      name: dav1d-dev
    requirements:
      host:
        - ${{ pin_subpackage('dav1d-devel', exact=True) }}
      run:
        - ${{ pin_subpackage('dav1d-devel', exact=True) }}
      run_exports:
        - if: win
          then: ${{ pin_subpackage('libdav1d', upper_bound=None) }}
        - ${{ pin_subpackage('libdav1d' ~ so_name_major, upper_bound=None) }}

  # Everything needed to run the dav1d binary
  - package:
      name: dav1d
    inherit:
      from: dav1d-split
      run_exports: true
    build:
      files:
        include:
          - if: win
            then: Library/bin/dav1d.exe
          - if: unix
            then: bin/dav1d
    requirements:
      build:
        # If this output accepts run_exports from dav1d-split, then I would expect to not
        # need to specify the build dependencies again?
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
        - ${{ pin_subpackage('dav1d-devel', exact=True) }}
      run:
        # run_exports from subpackages dav1d-devel exist when built with rattler-build pre-release,
        # so the following are redundant:
        - if: win
          then: ${{ pin_subpackage('libdav1d', upper_bound=None) }}
        - ${{ pin_subpackage('libdav1d' ~ so_name_major, upper_bound=None) }}
    tests:
      - script:
          - dav1d -v
          - if: linux
            then:
              - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name_major }}
              - test -f ${PREFIX}/lib/libdav1d.so.${{ so_name }}
          - if: osx
            then:
              - test -f ${PREFIX}/lib/libdav1d.${{ so_name_major }}.dylib
          - if: unix
            then:
              - test ! -f ${PREFIX}/lib/libdav1d$SHLIB_EXT
              - test ! -f ${PREFIX}/include/dav1d/dav1d.h
              - test ! -f ${PREFIX}/lib/pkgconfig/dav1d.pc
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\bin\\dav1d.dll exit 1
              - if exist %PREFIX%\\Library\\lib\\dav1d.lib exit 1
              - if exist %PREFIX%\\Library\\include\\dav1d\\dav1d.h exit 1
              - if exist %PREFIX%\\Library\\lib\\pkgconfig\\dav1d.pc exit 1

about:
  summary: dav1d is the fastest AV1 decoder on all platforms
  license: BSD-2-Clause
  license_file: COPYING
  homepage: https://code.videolan.org/videolan/dav1d

extra:
  feedstock-name: dav1d
  recipe-maintainers:
    - carterbox
    - jaimergp
