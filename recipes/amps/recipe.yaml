# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.3"

package:
  name: amps
  version: ${{ version }}

source:
  url: https://pypi.org/packages/py3/a/amps/amps-0.0.3-py3-none-any.whl
  sha256: c160c70310395e822bc753bf84b77ff9263d556b26ef0ebb0601b9201e562e40

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - distro
    - lxml
    - python-dotenv
    - requests
    - rich

tests:
  - python:
      imports:
        - amps
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/isaacmg00/amps
  license: MIT
  license_file: LICENSE
  summary: Arch Linux package scanner
  description: |
    Arch Linux package scanner

extra:
  recipe-maintainers:
    - rxm7706

