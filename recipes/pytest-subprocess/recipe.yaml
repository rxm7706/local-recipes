# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytest-subprocess
  version: "1.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: b2d746eb1b768a6f9087e5c7c91f87fb9d40c7fdc777550dc00397af428a0654

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=4.0.0

tests:
  - python:
      imports:
        - pytest_subprocess
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A plugin to fake subprocess for pytest
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pytest-subprocess/
  repository: https://github.com/aklajnert/pytest-subprocess

extra:
  recipe-maintainers:
    - aklajnert
    - henryiii
