# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.0"

package:
  name: pytest-subprocess
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-subprocess/pytest_subprocess-${{ version }}.tar.gz
  sha256: b2d746eb1b768a6f9087e5c7c91f87fb9d40c7fdc777550dc00397af428a0654

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=4.0.0

tests:
  - python:
      imports:
        - pytest_subprocess
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pytest-subprocess/
  license: MIT
  license_file: LICENSE
  summary: A plugin to fake subprocess for pytest
  description: |
    A plugin to fake subprocess for pytest
  repository: https://github.com/aklajnert/pytest-subprocess
  documentation: https://pytest-subprocess.readthedocs.io

extra:
  recipe-maintainers:
    - aklajnert
    - henryiii

