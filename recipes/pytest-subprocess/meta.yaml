{% set name = "pytest-subprocess" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b2d746eb1b768a6f9087e5c7c91f87fb9d40c7fdc777550dc00397af428a0654

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - pytest >=4.0.0

test:
  imports:
    - pytest_subprocess
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/pytest-subprocess/
  summary: A plugin to fake subprocess for pytest
  dev_url: https://github.com/aklajnert/pytest-subprocess
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - aklajnert
    - henryiii
