# Arch-specific (Prisma native engine). Windows skipped in recipe.yaml.
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
build_platform:
  linux_aarch64: linux_64
  osx_arm64: osx_64
provider:
  linux_aarch64: azure
  osx_arm64: azure
test: native_and_emulated
bot:
  automerge: true
  check_solvable: true
  inspection: hint-all
