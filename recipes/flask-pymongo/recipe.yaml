# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: flask-pymongo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-PyMongo/flask_pymongo-${{ version }}.tar.gz
  sha256: d225b51c21ceca2e670e6cca79b5c584ad17b96252b48e84e3b423ddb73304cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - flask >=3.0
    - pymongo >=4.0

tests:
  - python:
      imports:
        - flask_pymongo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://flask-pymongo.readthedocs.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: PyMongo support for Flask applications
  description: |
    PyMongo support for Flask applications

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - blink1073
    - jan-janssen

