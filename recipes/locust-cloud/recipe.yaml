# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.30.0"

package:
  name: locust-cloud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/locust-cloud/locust_cloud-${{ version }}.tar.gz
  sha256: 324ae23754d49816df96d3f7472357a61cd10e56cebcb26e2def836675cb3c68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - requests
    - configargparse >=1.7.1
    - gevent <26.0.0,>=24.10.1
    - platformdirs <5.0.0,>=4.3.6
    - python-engineio >=4.12.2
    - python-socketio <6.0.0,>=5.14.1
    - tomli >=1.1.0

tests:
  - python:
      imports:
        - locust_cloud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://locust.cloud
  license: MIT
  license_file: LICENSE
  summary: Locust Cloud
  description: |
    Locust Cloud

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
