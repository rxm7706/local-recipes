# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.12"

package:
  name: dateutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dateutils/dateutils-${{ version }}.tar.gz
  sha256: 03dd90bcb21541bd4eb4b013637e4f1b5f944881c46cc6e4b67a6059e370e3f1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dateadd = dateutils.dateadd:main
      - datediff = dateutils.datediff:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    # - argparse only for py<27
    - python-dateutil
    - pytz

tests:
  - python:
      imports:
        - dateutils
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}
    script:
      - dateadd --help
      - datediff --help

about:
  license: 0BSD
  license_file: LICENSE
  summary: Various utilities for working with date and datetime objects
  homepage: https://pypi.org/project/dateutils

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
