# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
# handle undefined PYTHON in `noarch: generic` outputs
schema_version: 1

context:
  version: "30.8.0"
  sqlglotrs_version: "0.13.0"
  PYTHON: $PYTHON

recipe:
  name: sqlglot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlglot/sqlglot-${{ version }}.tar.gz
  sha256: 1c5f93fb742dd9aaa75eee6bb33a637794a858b9a86375fac23a2dc0f7bc127e

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: sqlglot
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools_scm
        - setuptools
      run:
        - python >=${{ python_min }}
      run_constraints:
        - sqlglotrs ==${{ sqlglotrs_version }}
    tests:
      - python:
          imports:
            - sqlglot
          pip_check: true
          python_version: ${{ python_min }}.*
      - files:
          source:
            - tests/
        requirements:
          run:
            - openjdk
            - pandas
            - pip
            - pyspark
            - pytest
            - python-dateutil
            - python-duckdb >=0.6
            - python ${{ python_min }}.*
        script:
          - pytest -vvv --capture=tee-sys --color=yes --tb=long tests
  - package:
      name: sqlglot-rs
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('sqlglot', exact=True) }}
        - sqlglotrs
    tests:
      - python:
          imports:
            - sqlglot
          pip_check: true
          python_version: ${{ python_min }}.*
      - files:
          source:
            - tests/
        requirements:
          run:
            - openjdk
            - pandas
            - pip
            - pyspark
            - pytest
            - python-dateutil
            - python-duckdb >=0.6
            - python ${{ python_min }}.*
        script:
          - pytest -vvv --capture=tee-sys --color=yes --tb=long tests

about:
  summary: An easily customizable SQL parser and transpiler
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tobymao/sqlglot

extra:
  recipe-maintainers:
    - tobymao
    - thewchan

#### CFE metadata AND comments
