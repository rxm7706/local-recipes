# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.4"

package:
  name: openvpn-monitor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openvpn-monitor/openvpn_monitor-${{ version }}.tar.gz
  sha256: 5e97c35694e37296a85af27157029a9ce886d6e3d881e14757cff62bcc0dbb4f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask ==3.1.0
    - flask-wtf ==1.2.2
    - geoip2 ==4.8.1
    - humanize ==4.11.0
    - semver ==3.0.2

tests:
  - python:
      imports:
        - openvpn_monitor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://openvpn-monitor.openbytes.ie
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A simple web based openvpn monitor
  description: |
    A simple web based openvpn monitor

extra:
  recipe-maintainers:
    - rxm7706

