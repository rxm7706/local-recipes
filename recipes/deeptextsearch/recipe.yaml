# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"

package:
  name: deeptextsearch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/DeepTextSearch/deeptextsearch-${{ version }}.tar.gz
  sha256: 9f98c4122b9bc5d100033890ec3f33d7ead9921a0a8fb3765fa14ab7e32372cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68.0
    - wheel
  run:
    - python >=${{ python_min }}
    - sentence-transformers >=3.0
    - faiss-cpu >=1.7.4
    - numpy >=1.24
    - rank-bm25 >=0.2.2
    - pandas >=1.5
    - pytorch >=2.0

tests:
  - python:
      imports:
        - DeepTextSearch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/TechyNilesh/DeepTextSearch
  license: MIT
  license_file: LICENSE
  summary: AI-powered multilingual text search, recommendation, and reranking engine with hybrid search (semantic + keyword), FAISS indexing, cross-encoder reranking, and pluggable vector store backends.
  description: |
    AI-powered multilingual text search, recommendation, and reranking engine with hybrid search (semantic + keyword), FAISS indexing, cross-encoder reranking, and pluggable vector store backends.
  repository: https://github.com/TechyNilesh/DeepTextSearch

extra:
  recipe-maintainers:
    - rxm7706

