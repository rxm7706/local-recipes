# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.3"

package:
  name: sweetviz
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sweetviz/sweetviz-${{ version }}.tar.gz
  sha256: a7982da660020e98e3977af55c5ee99abc9a7aa935e98de1b7f1e6018cd88c3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pandas !=1.0.0,!=1.0.1,!=1.0.2,>=0.25.3
    - numpy >=1.16.0
    - matplotlib-base >=3.1.3
    - tqdm >=4.43.0
    - scipy >=1.3.2
    - jinja2 >=2.11.1
    - importlib_resources >=1.2.0
    - importlib-metadata

tests:
  - python:
      imports:
        - sweetviz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/fbdesignpro/sweetviz
  license: MIT
  license_file: LICENSE
  summary: A pandas-based library to visualize and compare datasets.
  description: |
    A pandas-based library to visualize and compare datasets.

extra:
  recipe-maintainers:
    - ocefpaf

