# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: sweetviz
  version: "2.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sweetviz-${{ version }}.tar.gz
  sha256: a7982da660020e98e3977af55c5ee99abc9a7aa935e98de1b7f1e6018cd88c3e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=61
    - pip
  run:
    - importlib-metadata
    - importlib_resources >=1.2.0
    - python >=${{ python_min }}
    - pandas >=0.25.3,!=1.0.0,!=1.0.1,!=1.0.2
    - numpy >=1.16.0
    - matplotlib-base >=3.1.3
    - tqdm >=4.43.0
    - scipy >=1.3.2
    - jinja2 >=2.11.1
    - importlib-resources >=1.2.0

tests:
  - python:
      imports:
        - sweetviz
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A pandas-based library to visualize and compare datasets.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/fbdesignpro/sweetviz

extra:
  recipe-maintainers:
    - ocefpaf
