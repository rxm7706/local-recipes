# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.4.0"

package:
  name: env-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/env-tools/env_tools-${{ version }}.tar.gz
  sha256: 5979fb0486d428e0659865335385990f9776f27b05346dcdcfbd290ab9ff9b4a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.2.0
    - tini >=4.0.0

tests:
  - python:
      imports:
        - env_tools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/beaugunderson/python-env-tools
  license: MIT
  license_file: LICENSE
  summary: Tools for using .env files in Python
  description: |
    Tools for using .env files in Python

extra:
  recipe-maintainers:
    - rxm7706

