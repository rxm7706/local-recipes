# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: astor
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6a6effda93f4e1ce9f618779b2dd1d9d84f1e32812c23a29b3fff6fd7f63fa5e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - astor
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  summary: Read, rewrite, and write Python ASTs nicely
  license_file: LICENSE
  description: |
    astor is designed to allow easy manipulation of Python source via the AST.
  homepage: https://github.com/berkerpeksag/astor
  repository: https://github.com/berkerpeksag/astor
  documentation: http://astor.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - drewokane
    - xhochy
