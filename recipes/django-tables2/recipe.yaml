# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"

package:
  name: django-tables2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-tables2/django_tables2-${{ version }}.tar.gz
  sha256: 3c5343f72663b0d6684e8e6cbcb16caae10d7621a51c1cf3c581f57ce605f8ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=4.2

tests:
  - python:
      imports:
        - django_tables2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jieter/django-tables2/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Table/data-grid framework for Django
  description: |
    Table/data-grid framework for Django
  documentation: https://django-tables2.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - gscoppino
    - miguelgomezgomez

#### CFE metadata AND comments
