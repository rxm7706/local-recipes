# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.43.0"

package:
  name: repowise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/repowise/repowise-${{ version }}.tar.gz
  sha256: 9e4b90b0dbe955fc5080531c10efe9fa76ab14b12a3eec2343ac369ebb073da8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=75
  run:
    - python >=${{ python_min }}
    - httpx <1,>=0.27
    - tree-sitter <1,>=0.23
    - tree-sitter-python <1,>=0.23
    - tree-sitter-typescript <1,>=0.23
    - tree-sitter-javascript <1,>=0.23
    - tree-sitter-go <1,>=0.23
    - tree-sitter-rust <1,>=0.23
    - tree-sitter-java <1,>=0.23
    - tree-sitter-cpp <1,>=0.23
    - tree-sitter-dart <1,>=0.1
    - tree-sitter-kotlin <2,>=1
    - tree-sitter-ruby <1,>=0.23
    - tree-sitter-c-sharp <1,>=0.23
    - tree-sitter-swift >=0.0.1
    - tree-sitter-scala <1,>=0.23
    - tree-sitter-php <1,>=0.23
    - tree-sitter-pascal <1,>=0.11
    - tree-sitter-luau <2,>=1.2
    - tree-sitter-bash <1,>=0.23
    - tree-sitter-svelte <2,>=1
    - tree-sitter-html <1,>=0.23
    - sqlglot <28,>=26
    - networkx <4,>=3.3
    - scipy <2,>=1.11
    - jinja2 <4,>=3.1
    - pathspec <1,>=0.12
    - structlog <25,>=24
    - sqlalchemy <3,>=2.0
    - aiosqlite <1,>=0.20
    - alembic <2,>=1.13
    - pydantic <3,>=2.8
    - tenacity <10,>=9
    - gitpython <4,>=3.1
    - pyyaml <7,>=6.0
    - lancedb <1,>=0.12
    - click <9,>=8.1
    - rich <14,>=13
    - watchdog <5,>=4
    - fastapi <1,>=0.115
    - uvicorn <1,>=0.32
    - mcp <2,>=1.0
    - apscheduler <4,>=3.10
    - cryptography <51,>=50.0.0
    - anthropic <1,>=0.40
    - openai <3,>=1.50
    - google-genai <2,>=1.0
    - litellm <2,>=1.84.0

tests:
  - python:
      imports:
        - packages.cli.src.repowise.cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/repowise-dev/repowise
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: The codebase intelligence layer for your AI coding agent — dependency graph, git history, dead code, decisions, and code health, exposed over MCP
  description: |
    The codebase intelligence layer for your AI coding agent — dependency graph, git history, dead code, decisions, and code health, exposed over MCP
  repository: https://github.com/repowise-dev/repowise
  documentation: https://github.com/repowise-dev/repowise/blob/main/docs/start/USER_GUIDE.md

extra:
  recipe-maintainers:
    - rxm7706

