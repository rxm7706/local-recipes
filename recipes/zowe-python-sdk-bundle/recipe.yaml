# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0.dev26"

package:
  name: zowe-python-sdk-bundle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zowe-python-sdk-bundle/zowe_python_sdk_bundle-${{ version }}.tar.gz
  sha256: 907cd402c1ca7445f90b09ee8aa7332584eb7d3995bc17adab523f735c513be1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - -version
    - zowe.zos-console-for-zowe-sdk ==1.0.0-dev26
    - zowe.zos-files-for-zowe-sdk ==1.0.0-dev26
    - zowe.zos-tso-for-zowe-sdk ==1.0.0-dev26
    - zowe.zos-jobs-for-zowe-sdk ==1.0.0-dev26
    - zowe.zosmf-for-zowe-sdk ==1.0.0-dev26
    - zowe.workflows-for-zowe-sdk ==1.0.0-dev26

tests:
  - python:
      imports:
        - zowe_python_sdk_bundle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/zowe/zowe-client-python-sdk
  license: EPL-2.0
  license_file: LICENSE
  summary: Zowe Python SDK
  description: |
    Zowe Python SDK

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
