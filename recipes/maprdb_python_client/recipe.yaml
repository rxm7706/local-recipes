# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.6"

package:
  name: maprdb_python_client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/maprdb_python_client/maprdb_python_client-${{ version }}.tar.gz
  sha256: 7b3f6b6910d7a0ec1db25229e91a5f4e6b9074e0c03a4a775faea8c57a80bca3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mapr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mapr/maprdb-python-client/
  license: MIT
  license_file: LICENSE
  summary: MapR-DB Python Client
  description: |
    MapR-DB Python Client

extra:
  recipe-maintainers:
    - rxm7706

