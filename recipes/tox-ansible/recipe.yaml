# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "26.8.0"

package:
  name: tox-ansible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tox-ansible/tox_ansible-${{ version }}.tar.gz
  sha256: 44d5d08aab3bc471eef78fdb8e19eb81b347b70e0c75b728bfa9c0a1841c05e4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pytest >=8.4.1
    - pytest-ansible >=3.1.0
    - pytest-xdist >=3.8.0
    - pyyaml >=6.0.1
    - tomli >=1.1.0
    - tox >=4.47.3

tests:
  - python:
      imports:
        - tox_ansible
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ansible/tox-ansible
  license: MIT
  license_file: LICENSE
  summary: A radical approach to testing ansible content
  description: |
    A radical approach to testing ansible content
  documentation: https://ansible.readthedocs.io/projects/tox-ansible/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
