# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-oxmsg
  version: "0.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/python_oxmsg-${{ version }}.tar.gz
  sha256: a6aff4deb1b5975d44d49dab1d9384089ffeec819e19c6940bc7ffbc84775fad

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - oxmsg = oxmsg.cli:oxmsg

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - pip
  run:
    - typing_extensions >=4.9.0
    - python >=${{ python_min }}
    - click
    - olefile
    - typing-extensions >=4.9.0

tests:
  - python:
      imports:
        - oxmsg
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - oxmsg --help

about:
  summary: Extract attachments from Outlook .msg files.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/scanny/python-oxmsg

extra:
  recipe-maintainers:
    - jan-janssen
