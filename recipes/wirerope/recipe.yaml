# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wirerope
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7da8bb6feeff9dd939bd7141ef0dc392674e43ba662e20909d6729db81a7c8d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.11.0

tests:
  - python:
      imports:
        - wirerope
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Turn functions and methods into fully controllable objects
  description: |
    Turn functions and methods into fully controllable objects
  homepage: https://github.com/youknowone/wirerope
  repository: https://github.com/youknowone/wirerope

extra:
  recipe-maintainers:
    - timkpaine
