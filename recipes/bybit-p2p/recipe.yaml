# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.1"

package:
  name: bybit-p2p
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bybit-p2p/bybit_p2p-${{ version }}.tar.gz
  sha256: 826a6b2ecc0c74689f722e985e17478a62abc1ded23517da1051261dc056a618

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pycryptodome
    - requests
    - requests-toolbelt

tests:
  - python:
      imports:
        - bybit_p2p
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/bybit-exchange/bybit_p2p
  license: MIT
  license_file: LICENSE
  summary: Deprecated: use pybit for Bybit API integrations.
  description: |
    Deprecated: use pybit for Bybit API integrations.

extra:
  recipe-maintainers:
    - rxm7706

