# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: pynvjitlink-cu12
  version: ${{ version }}

source:
  url: https://github.com/rapidsai/pynvjitlink/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 350abe5e45a9f137c947f8cd06095a02c982689e1ed174e4d9bd06ba675268ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - rapids-build-backend >=0.3.0,<0.4.0dev0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pynvjitlink
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://rapids.ai/
  license: Apache-2.0
  license_file: LICENSE
  summary: nvJitLink Python binding
  description: |
    nvJitLink Python binding
  repository: https://github.com/rapidsai/pynvjitlink
  documentation: https://github.com/rapidsai/pynvjitlink/blob/main/README.md

extra:
  recipe-maintainers:
    - rxm7706

