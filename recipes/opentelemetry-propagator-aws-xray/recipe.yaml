# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.2"

package:
  name: opentelemetry-propagator-aws-xray
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-propagator-aws-xray/opentelemetry_propagator_aws_xray-${{ version }}.tar.gz
  sha256: 6b2cee5479d2ef0172307b66ed2ed151f598a0fd29b3c01133ac87ca06326260

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api ~=1.12

tests:
  - python:
      imports:
        - opentelemetry.propagators.aws
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/propagator/opentelemetry-propagator-aws-xray
  license: Apache-2.0
  license_file: LICENSE
  summary: AWS X-Ray Propagator for OpenTelemetry
  description: |
    AWS X-Ray Propagator for OpenTelemetry

extra:
  recipe-maintainers:
    - jan-janssen

