# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.14.0"

package:
  name: accelerate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/accelerate/accelerate-${{ version }}.tar.gz
  sha256: 41b9c4377a54e0b460a959b0defa1b736e4ca0a2373252d9a539964c2afe3c8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - accelerate=accelerate.commands.accelerate_cli:main
      - accelerate-config=accelerate.commands.config:main
      - accelerate-estimate-memory=accelerate.commands.estimate:main
      - accelerate-launch=accelerate.commands.launch:main
      - accelerate-merge-weights=accelerate.commands.merge:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.17
    - packaging >=20.0
    - psutil
    - pyyaml
    - pytorch >=2.0.0
    - huggingface_hub >=0.21.0
    - safetensors >=0.4.3

tests:
  - python:
      imports:
        - accelerate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - datasets
        - evaluate
        - pip
        - pytest
        - scipy
        - scikit-learn
        - transformers
        - tqdm
    script:
      - accelerate --help
      - accelerate-config --help
      - accelerate-launch --help
      - accelerate-estimate-memory --help
      - accelerate-merge-weights --help

about:
  homepage: https://github.com/huggingface/accelerate
  license: Apache-2.0
  license_file: LICENSE
  summary: Training loop of PyTorch without boilerplate code
  description: |
    Accelerate, Training loop of PyTorch without boilerplate code
  documentation: https://huggingface.co/docs/accelerate

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
