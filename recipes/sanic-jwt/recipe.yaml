# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.8.0"

package:
  name: sanic-jwt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sanic-jwt/sanic-jwt-${{ version }}.tar.gz
  sha256: ae16cdaebc8cd9569dae6f633a2a876205d7b36134e5920698ae5b8e4f1b83f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sanic
    - pyjwt

tests:
  - python:
      imports:
        - sanic_jwt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ahopkins/sanic-jwt
  license: MIT
  license_file: LICENSE
  summary: JWT oauth flow for Sanic
  description: |
    JWT oauth flow for Sanic

extra:
  recipe-maintainers:
    - rxm7706

