    - pkg:pypi/pypi@${{ version }}
  cfe-upstream-repo: http://wiki.python.org/moin/CheeseShopDev
  cfe-upstream-homepage: http://wiki.python.org/moin/CheeseShopDev
  cfe-import-names: []
