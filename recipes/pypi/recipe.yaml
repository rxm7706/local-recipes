# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1"

package:
  name: pypi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypi/pypi-${{ version }}.tar.gz
  sha256: f014c87f871c2143ff613d9d13a59cc8ab8309b048754c27da8c58b21de2c10d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://wiki.python.org/moin/CheeseShopDev
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "PyPI is the Python Package Index at http://pypi.org/"
  description: |
    PyPI is the Python Package Index at http://pypi.org/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pypi
  cfe-upstream-registry: pypi
  cfe-upstream-name: pypi
