# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1"

package:
  name: afp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/afp/afp-${{ version }}.tar.gz
  sha256: 05691b86d555c1b74da1aa1dc20b9f4e8e9bb09c3aa000eabbdd284e278a4118

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - afp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mdneale/afp
  license: UNKNOWN
  license_file: LICENSE
  summary: Python package and utilities for reading AFP (Advanced Function Presentation) files
  description: |
    Python package and utilities for reading AFP (Advanced Function Presentation) files

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
