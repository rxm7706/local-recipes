# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2.1"

package:
  name: extratools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/extratools/extratools-${{ version }}.tar.gz
  sha256: d1410f4ffb59a508a3ec4b9f801eb378c6ce051f70360001536824542d6deb7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - extratools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/chuanconggao/extratools
  license: MIT
  license_file: LICENSE
  summary: 145+ extra higher-level functional tools beyond standard and third-Party libraries.
  description: |
    145+ extra higher-level functional tools beyond standard and third-Party libraries.

extra:
  recipe-maintainers:
    - rxm7706

