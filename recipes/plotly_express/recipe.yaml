# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.1"

package:
  name: plotly-express
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/plotly-express/plotly_express-${{ version }}.tar.gz
  sha256: ff73a41ce02fb43d1d8e8fa131ef3e6589857349ca216b941b8f3f862bce0278

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - plotly
    - statsmodels
    - scipy
    - patsy
    - numpy

tests:
  - python:
      imports:
        - plotly_express
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://plotly.express/
  license: MIT
  license_file: LICENSE.txt
  summary: Plotly Express - a high level wrapper for Plotly.py
  description: |
    Plotly Express - a high level wrapper for Plotly.py

extra:
  recipe-maintainers:
    - dpryan79

#### CFE metadata AND comments
# CFE metadata
