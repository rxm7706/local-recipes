# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: grafana-client
  version: "5.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grafana-client/grafana_client-${{ version }}.tar.gz
  sha256: f8d66e6210512914f3d2f3e9a726f9452e6c45a0e3670d6098552ab50d83f1c8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip >=20.0
    - setuptools >=40.0
    - setuptools-scm >=4.0,<8
    - wheel
  run:
    - importlib-metadata
    - urllib3
    - python >=${{ python_min }}
    - niquests >=3.4.0,<4
    - verlib2 <26.3

tests:
  - python:
      imports:
        - grafana_client
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A client library for accessing the Grafana HTTP API, written in Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/panodata/grafana-client
  repository: https://github.com/panodata/grafana-client

extra:
  recipe-maintainers:
    - rxm7706
    - marie59

#### CFE metadata AND comments
