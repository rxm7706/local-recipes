# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: python3-log
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python3-log/python3_log-${{ version }}.tar.gz
  sha256: a13b5097835cbcbacd9c8013d5b33915aac7196ed6daac791790796dc65f1f42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - concurrent-log-handler

tests:
  - python:
      imports:
        - log
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://gitee.com/devops_dev/log
  license: MIT
  license_file: LICENSE
  summary: used to print log for any app or platform
  description: |
    used to print log for any app or platform
  documentation: https://gitee.com/devops_dev/log/README.md

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
