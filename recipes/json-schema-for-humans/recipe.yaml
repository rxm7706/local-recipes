# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: json-schema-for-humans
  version: 1.5.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/json_schema_for_humans-${{ version }}.tar.gz
  sha256: a43023f6c1b99f8e75126cc824c22992d8f55e941060aa3fddfc7c38de3cb973

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - generate-schema-doc = json_schema_for_humans.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.0.1,<9.0.0
    - dataclasses-json >=0.6.7,<0.7.0
    - htmlmin2 >=0.1.13,<0.2.0
    - jinja2 >3
    - markdown2 >=2.5.0,<3.0.0
    - pygments >=2.18.0,<3.0.0
    - pytz
    - pyyaml >=6.0.2,<7
    - requests >=2.32.3,<3.0.0
    - markupsafe >=2.1.5,<3.0.0

tests:
  - python:
      imports:
        - json_schema_for_humans
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - generate-schema-doc --help

about:
  summary: Generate static HTML documentation from JSON schemas
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/coveooss/json-schema-for-humans

extra:
  recipe-maintainers:
    - pavelzw
