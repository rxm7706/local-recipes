# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: kornia
  version: "0.8.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/kornia-${{ version }}.tar.gz
  sha256: 5411b2ce0dd909d1608016308cd68faeef90f88c47f47e8ecd40553fd4d8b937

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - pytest-runner
  run:
    - python >=${{ python_min }}
    - pytorch >=1.10
    - packaging
    - kornia-rs

tests:
  - python:
      imports:
        - kornia
        - kornia.augmentation
        - kornia.color
        - kornia.contrib
        - kornia.feature
        - kornia.filters
        - kornia.geometry
        - kornia.losses
        - kornia.utils
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Kornia is a differentiable computer vision library for PyTorch.
  homepage: https://github.com/kornia/kornia
  repository: https://github.com/kornia/kornia
  documentation: https://pypi.org/project/kornia/

extra:
  recipe-maintainers:
    - edgarriba
    - mxr-conda
    - dsangillo
    - benjaminrwilson
    - bubblyorca
    - mukhery
