# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: yfiles-jupyter-graphs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yfiles-jupyter-graphs/yfiles_jupyter_graphs-${{ version }}.tar.gz
  sha256: 94b845c41060169b5c9e6a7eee8735610bfce17aa09e36bf25dd1f366df19f7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.21.1
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - ipywidgets >=7.6.0

tests:
  - python:
      imports:
        - yfiles_jupyter_graphs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.yworks.com/products/yfiles-graphs-for-jupyter
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A diagram visualization extension for JupyterLab and Jupyter Notebooks powered by yFiles for HTML
  description: |
    A diagram visualization extension for JupyterLab and Jupyter Notebooks powered by yFiles for HTML
  documentation: https://yworks.github.io/yfiles-jupyter-graphs/

extra:
  recipe-maintainers:
    - rxm7706

