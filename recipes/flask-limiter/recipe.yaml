# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.1.1"

package:
  name: flask-limiter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Limiter/flask_limiter-${{ version }}.tar.gz
  sha256: ca11608fc7eec43dcea606964ca07c3bd4ec1ae89043a0f67f717899a4f48106

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.14.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - flask >=2
    - limits >=3.13
    - ordered-set <5,>4
    - typing_extensions >=4.3

tests:
  - python:
      imports:
        - flask_limiter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://flask-limiter.readthedocs.org
  license: MIT
  license_file: LICENSE.txt
  summary: Rate limiting for flask applications
  description: |
    Rate limiting for flask applications
  repository: https://github.com/alisaifee/flask-limiter
  documentation: https://flask-limiter.readthedocs.org

extra:
  recipe-maintainers:
    - xylar

#### CFE metadata AND comments
