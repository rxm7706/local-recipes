# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: flask-limiter
  version: "4.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flask_limiter-${{ version }}.tar.gz
  sha256: ca11608fc7eec43dcea606964ca07c3bd4ec1ae89043a0f67f717899a4f48106

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - hatchling >=1.14.0
    - hatch-vcs >=0.4.0
  run:
    - python >=${{ python_min }}
    - limits >=3.13
    - flask >=2
    - ordered-set >4,<5
    - typing_extensions >=4.3

tests:
  - python:
      imports:
        - flask_limiter
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Rate limiting for flask applications
  license: MIT
  license_file: LICENSE.txt
  homepage: https://flask-limiter.readthedocs.org
  repository: https://github.com/alisaifee/flask-limiter

extra:
  recipe-maintainers:
    - xylar
