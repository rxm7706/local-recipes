# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.4.2"

package:
  name: spark-nlp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spark-nlp/spark_nlp-${{ version }}.tar.gz
  sha256: 8bb178f1c83a3b21b9896a5fd6e00c8e7dd6e24a74a2d47034bc42f73d6046ab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyspark >=3.0,<4

tests:
  - python:
      imports:
        - sparknlp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/JohnSnowLabs/spark-nlp
  license: Apache-2.0
  license_file: LICENSE
  summary: Natural language processing library built on Apache Spark ML
  description: |
    John Snow Labs Spark NLP is a natural language processing library built on top of Apache Spark ML. It provides simple, performant & accurate NLP annotations for machine learning pipelines, that scale easily in a distributed environment.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: spark-nlp
  cfe-upstream-registry: pypi
  cfe-upstream-name: spark-nlp
