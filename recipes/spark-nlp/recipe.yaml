    - pkg:pypi/spark-nlp@${{ version }}
  cfe-upstream-repo: https://github.com/JohnSnowLabs/spark-nlp
  cfe-upstream-homepage: https://github.com/JohnSnowLabs/spark-nlp
  cfe-import-names: [sparknlp]
  cfe-source-kind: pypi-sdist
