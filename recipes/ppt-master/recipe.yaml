# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1
context:
  name: ppt-master
  version: "5.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/hugohe3/ppt-master/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6fa6904867b220133b6aa8a705b5f98cf78bb70d3481a5f7bee245b33ab0401b

build:
  number: 0
  noarch: generic

requirements:
  build:
    # Build-time only: the build script ASCII-normalizes the Chinese-named
    # brand/deck kit paths and rewrites their internal references via
    # normalize_paths.sed. Deliberately NOT python — a `python` build dep makes
    # rattler-build expand the python variant matrix and split this
    # noarch:generic package into four identical py3XX artifacts. sed carries
    # no variant, so the package stays a single noarch artifact installable on
    # every platform at any python >=3.10.
    - if: win
      then: m2-sed
      else: sed
  run:
    - python >=3.10
    - python-pptx >=0.6.21
    - pillow >=9.0.0
    - requests >=2.31.0
    - beautifulsoup4 >=4.12.0
    - numpy >=1.20.0
    # reportlab + svglib dropped in v4: no longer listed in
    # skills/ppt-master/requirements.txt (SVG handling moved to the native
    # DrawingML converter in scripts/svg_to_pptx.py).
    - pymupdf >=1.23.0
    - google-genai >=1.0.0
    # v3 additions (upstream marks all skill deps optional)
    - mammoth >=1.6.0
    - markdownify >=0.11.6
    # upstream wants >=0.18; conda-forge tops out at 0.17 — loosened,
    # TODO tighten when conda-forge catches up
    - ebooklib >=0.17
    - nbconvert >=7.0.0
    - openpyxl >=3.1.0
    - curl-cffi >=0.7.0
    - flask >=3.0.0
    # v4 addition (svg_to_pptx.py / xlsx export path)
    - xlsxwriter >=3.0.0
    # v5 additions
    - pyyaml >=6.0
    - skia-pathops >=0.9.2
    - uharfbuzz >=0.50.0
    - edge-tts >=7.2.8

tests:
  - script:
      - if: not win
        then:
          - ppt-master-install --help
          - test -d "${CONDA_PREFIX}/share/ppt-master/skills/ppt-master"
          - test -f "${CONDA_PREFIX}/share/ppt-master/skills/ppt-master/SKILL.md"
          - test -d "${CONDA_PREFIX}/share/ppt-master/skills/ppt-master/scripts"
          - test -d "${CONDA_PREFIX}/share/ppt-master/skills/ppt-master/templates"
      - if: win
        then:
          - ppt-master-install.bat --help
          - if not exist "%CONDA_PREFIX%\share\ppt-master\skills\ppt-master" exit 1
          - if not exist "%CONDA_PREFIX%\share\ppt-master\skills\ppt-master\SKILL.md" exit 1

about:
  homepage: https://github.com/hugohe3/ppt-master
  repository: https://github.com/hugohe3/ppt-master
  license: MIT
  license_file: LICENSE
  summary: Claude skill for creating professional PowerPoint presentations using SVG-based templates

extra:
  recipe-maintainers:
    - rxm7706

