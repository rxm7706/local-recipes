# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.1.1"

package:
  name: langgraph-checkpoint-sqlite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-checkpoint-sqlite/langgraph_checkpoint_sqlite-${{ version }}.tar.gz
  sha256: 6fcb20db4c37ef7aad52f29b539eb98c38e2dad6fab7c2446a2a9db24f37a70e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - aiosqlite >=0.20
    - langgraph-checkpoint <5.0.0,>=4.1.0
    - sqlite-vec >=0.1.6

tests:
  - python:
      imports:
        - langgraph.cache.sqlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/langgraph-checkpoint-sqlite/
  license: MIT
  license_file: LICENSE
  summary: Library with a SQLite implementation of LangGraph checkpoint saver.
  description: |
    Library with a SQLite implementation of LangGraph checkpoint saver.
  repository: https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-sqlite

extra:
  recipe-maintainers:
    - rxm7706

