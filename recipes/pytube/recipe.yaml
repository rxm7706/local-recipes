# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: pytube
  version: "15.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pytube-${{ version }}.tar.gz
  sha256: 076052efe76f390dfa24b1194ff821d4e86c17d41cb5562f3a276a8bcbfc9d1d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pytube = pytube.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pytube
        - pytube.contrib
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pytube --help

about:
  license: Unlicense
  license_file: LICENSE
  summary: A lightweight, dependency-free Python library (and command-line utility) for downloading YouTube Videos.
  description: |
    pytube is a very serious, lightweight, dependency-free Python library
    (and command-line utility) for downloading YouTube Videos.
  homepage: https://pytube.io/
  repository: https://github.com/pytube/pytube
  documentation: https://pytube.io

extra:
  recipe-maintainers:
    - jan-janssen
