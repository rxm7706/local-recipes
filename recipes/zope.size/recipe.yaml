# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.size
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.size/zope_size-${{ version }}.tar.gz
  sha256: e5ceb10bc878aed4fa4c205e4865bfb936df916a4d0c5d2cd87e5b369c84048d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface
    - zope.i18nmessageid

tests:
  - python:
      imports:
        - zope.size
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.size
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Interfaces and simple adapter that give the size of an object
  description: |
    Interfaces and simple adapter that give the size of an object

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
