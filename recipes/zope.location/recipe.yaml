# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0"

package:
  name: zope.location
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.location/zope_location-${{ version }}.tar.gz
  sha256: baa3e0e8eab734ff908ffd9860185c8de458025d49eae62f11ba3b16579ee6ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface >=4.0.2
    - zope.schema >=4.2.2
    - zope.proxy >=4.0.1

tests:
  - python:
      imports:
        - zope.location
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/zopefoundation/zope.location/
  license: ZPL-2.1
  license_file: LICENSE.txt
  summary: Zope Location
  description: |
    Zope Location

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: zope.location
  cfe-upstream-registry: pypi
  cfe-upstream-name: zope.location
  cfe-purls:
    - pkg:conda/zope.location@${{ version }}?channel=conda-forge
    - pkg:pypi/zope.location@${{ version }}
  cfe-upstream-repo: http://github.com/zopefoundation/zope.location/
  cfe-upstream-homepage: http://github.com/zopefoundation/zope.location/
  cfe-import-names: [zope.location]
