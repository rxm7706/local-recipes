# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.3"

package:
  name: gcs-jupyter-plugin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gcs-jupyter-plugin/gcs_jupyter_plugin-${{ version }}.tar.gz
  sha256: cf3e1a07eaa71fc65d335819348a9c6b17766f6ba7ad5cd053513eed0e427f52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
  run:
    - python >=${{ python_min }}
    - aiohttp ~=3.9.5
    - google-cloud-jupyter-config >=0.0.10
    - google-cloud-storage ~=2.18.2
    - jupyter-server <3,>=2.4.0

tests:
  - python:
      imports:
        - gcs_jupyter_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GoogleCloudDataproc/gcs-jupyter-plugin
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A JupyterLab extension.
  description: |
    A JupyterLab extension.
  repository: https://github.com/GoogleCloudDataproc/gcs-jupyter-plugin.git

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
