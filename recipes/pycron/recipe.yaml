# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"

package:
  name: pycron
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycron/pycron-${{ version }}.tar.gz
  sha256: e125a28aca0295769541a40633f70b602579df48c9cb357c36c28d2628ba2b13

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pycron
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kipe/pycron
  license: MIT
  license_file: LICENSE
  summary: Simple cron-like parser, which determines if current datetime matches conditions.
  description: |
    Simple cron-like parser, which determines if current datetime matches conditions.
  repository: https://github.com/kipe/pycron

extra:
  recipe-maintainers:
    - synapticarbors

#### CFE metadata AND comments
