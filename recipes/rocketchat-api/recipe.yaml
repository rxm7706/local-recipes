# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.7.1"

package:
  name: rocketchat-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rocketchat-API/rocketchat_api-${{ version }}.tar.gz
  sha256: 915e7eeeddcdca02601fe06e4fbc596f45a5d366a71c72f3fb48f6103708696c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - requests
    - packaging

tests:
  - python:
      imports:
        - rocketchat_API
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jadolg/rocketchat_API
  license: MIT
  license_file: LICENSE
  summary: Python API wrapper for Rocket.Chat
  description: |
    Python API wrapper for Rocket.Chat

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
