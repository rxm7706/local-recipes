    - pkg:pypi/executing@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/alexmojaki/executing
  cfe-import-names: [executing]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/executing-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-2.2.1

  cfe-forge-blocker-list:
    - missing-license-file

