# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.0"

package:
  name: jsonschema2md
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonschema2md/jsonschema2md-${{ version }}.tar.gz
  sha256: d69a5b011bf355c005e3c18be4515ae46d2689b38b593ced8d03c5ab66ddbaf3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - pyyaml <7,>=6
    - babel <3,>=2
    - markdown <4,>=3

tests:
  - python:
      imports:
        - jsonschema2md
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/jsonschema2md/
  license: Apache-2.0
  license_file: LICENSE
  summary: Convert JSON Schema to human-readable Markdown documentation
  description: |
    Convert JSON Schema to human-readable Markdown documentation
  repository: https://github.com/sbrunner/jsonschema2md

extra:
  recipe-maintainers:
    - ollyhensby
    - brynpickering

#### CFE metadata AND comments
