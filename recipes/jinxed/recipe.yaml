# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.1.0"

package:
  name: jinxed
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jinxed/jinxed-${{ version }}.tar.gz
  sha256: 7e755b831faa2443d44fb4ce7c0202eb9c3ed39bd5bf1193365888f4f6092b54

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jinxed
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Rockhopper-Technologies/jinxed
  license: MPLv2.0
  license_file: LICENSE
  summary: Jinxed Terminal Library
  description: |
    Jinxed Terminal Library

extra:
  recipe-maintainers:
    - mattip

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: jinxed
  cfe-upstream-registry: pypi
  cfe-upstream-name: jinxed
