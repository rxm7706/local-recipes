# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: python-binance
  version: "1.0.37"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 03a302d8c598d270f1206adf165450ce4d0df58691e92a5e0bff665831f75a1e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}.*
  run:
    - aiohttp
    - dateparser
    - python >=${{ python_min }}
    - requests
    - six
    - ujson
    - pycryptodome
    - websockets

tests:
  - python:
      imports:
        - binance
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Binance Exchange API python implementation for automated trading
  description: |
    This is an unofficial Python wrapper for the Binance exchange REST API
    v3.
  homepage: https://github.com/sammchardy/python-binance
  repository: https://github.com/sammchardy/python-binance
  documentation: https://python-binance.readthedocs.io/

extra:
  recipe-maintainers:
    - jan-janssen
