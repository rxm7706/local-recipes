# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.13.0"

package:
  name: mssql-python
  version: ${{ version }}

source:
  url: https://github.com/microsoft/mssql-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d8be2c4f5c957d8d1cfd9111ed9e0258e08d802dac666dcc8bfaa3ab4acfaa01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-identity >=1.12.0
    - mssql-python-odbc ==18.6.2.1

tests:
  - python:
      imports:
        - mssql_python
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/mssql-python
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: A Python library for interacting with Microsoft SQL Server
  description: |
    A Python library for interacting with Microsoft SQL Server

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: mssql-python
  cfe-upstream-registry: pypi
  cfe-upstream-name: mssql-python
  cfe-purls:
    - pkg:conda/mssql-python@${{ version }}?channel=conda-forge
    - pkg:pypi/mssql-python@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/microsoft/mssql-python
  cfe-import-names: [mssql_python]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: pending-submission-to-conda-forge
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
