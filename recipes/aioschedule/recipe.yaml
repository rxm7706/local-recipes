# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.5.2"

package:
  name: aioschedule
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioschedule/aioschedule-${{ version }}.tar.gz
  sha256: 1fe8621d287f58cbba3d73695fbbd890355294ac0c01981a1fd1e4f0510fc744

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - aioschedule
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ibrb/python-aioschedule
  license: MIT
  license_file: LICENSE
  summary: Job scheduling for humans.
  description: |
    Job scheduling for humans.

extra:
  recipe-maintainers:
    - rxm7706

