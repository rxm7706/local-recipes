# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.2"

package:
  name: salib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/SALib/salib-${{ version }}.tar.gz
  sha256: a8eeedc4e87cf070f7ef450b76cdecd120d1e5c602a9c35855ec7777591f949f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.5
    - multiprocess
    - numpy >=2.0
    - pandas >=2.0
    - scipy >=1.9.3

tests:
  - python:
      imports:
        - SALib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/SALib/
  license: MIT
  license_file: LICENSE
  summary: Tools for global sensitivity analysis. Contains Sobol', Morris, FAST, DGSM, PAWN, HDMR, Moment Independent and fractional factorial methods
  description: |
    Tools for global sensitivity analysis. Contains Sobol', Morris, FAST, DGSM, PAWN, HDMR, Moment Independent and fractional factorial methods
  documentation: https://salib.readthedocs.io

extra:
  recipe-maintainers:
    - jschueller
    - willu47
    - ConnectedSystems

#### CFE metadata AND comments
