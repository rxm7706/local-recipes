# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.2"

package:
  name: salib
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/16/63/bdde6c303e95e2c819c668076fb3255f4453ee2041103d0edd18a90b6839/salib-${{ version }}.tar.gz
  sha256: a8eeedc4e87cf070f7ef450b76cdecd120d1e5c602a9c35855ec7777591f949f
  file_name: SALib-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - hatchling >=1.8.1
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - pandas >=1.1.2
    - scipy >=1.7.3
    - matplotlib-base
    - pathos >=0.2.5
    - multiprocess

tests:
  - python:
      imports:
        - SALib
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.md
  summary: Sensitivity Analysis Library
  description: |
    Python implementations of commonly used sensitivity analysis methods.
    Useful in systems modeling to calculate the effects of model inputs or
    exogenous factors on outputs of interest.


  homepage: http://salib.github.io/SALib/
  repository: https://github.com/SALib/SALib
  documentation: http://salib.readthedocs.org

extra:
  recipe-maintainers:
    - jschueller
    - willu47
    - ConnectedSystems
