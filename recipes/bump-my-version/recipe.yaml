# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bump-my-version
  version: "1.5.1"
  build_number: 0
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5079e443ab8c9a9903f140b427ff9f6fe8dd54013a55a4cf48b89326f3a71c07

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bump-my-version = bumpversion.cli:cli

requirements:
  host:
    - python 3.10.*
    - hatchling >=1.25.0
    - pip
  run:
    - python >=${{ python_min }}
    - click <8.4
    - httpx2
    - pydantic >=2.0.0
    - pydantic-settings
    - questionary
    - rich-click
    - rich
    - tomlkit
    - wcmatch >=8.5.1

tests:
  - python:
      imports:
        - bumpversion
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - bump-my-version --help

about:
  summary: Version bump your Python project
  description: >-
    A small command line tool to simplify releasing software by updating all version strings in your source code by the correct increment and optionally commit and tag the changes.

    * version formats are highly configurable * works without any source code manager, but happily reads tag information from and writes commits and tags to Git and Mercurial if available * just handles text files, so it's not specific to any programming language * supports Python 3.8+ and PyPy3. Python 3.7 should work but
    isn't actively tested.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/callowayproject/bump-my-version
  documentation: https://callowayproject.github.io/bump-my-version/

extra:
  recipe-maintainers:
    - coordt
    - mfisher87
