# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.1"

package:
  name: bump-my-version
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bump-my-version/bump_my_version-${{ version }}.tar.gz
  sha256: 5079e443ab8c9a9903f140b427ff9f6fe8dd54013a55a4cf48b89326f3a71c07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click !=8.4
    - httpx2
    - pydantic-settings
    - pydantic >=2.0.0
    - questionary
    - rich
    - rich-click
    - tomlkit
    - wcmatch >=8.5.1

tests:
  - python:
      imports:
        - bumpversion
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/callowayproject/bump-my-version
  license: MIT
  license_file: LICENSE
  summary: Version bump your Python project
  description: |
    Version bump your Python project
  documentation: https://callowayproject.github.io/bump-my-version/

extra:
  recipe-maintainers:
    - coordt
    - mfisher87

#### CFE metadata AND comments
