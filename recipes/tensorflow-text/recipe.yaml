# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.20.1"

package:
  name: tensorflow-text
  version: ${{ version }}

source:
  url: https://github.com/tensorflow/text/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f04cd737b64ac7bdbba46ac649f5de7c30e4e4ccd78c41ead8999758bf6f3685

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tensorflow <2.21,>=2.20.0

tests:
  - python:
      imports:
        - tensorflow_text
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://github.com/tensorflow/text
  license: Apache-2.0
  license_file: LICENSE
  summary: TF.Text is a TensorFlow library of text related ops, modules, and subgraphs.
  description: |
    TF.Text is a TensorFlow library of text related ops, modules, and subgraphs.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
