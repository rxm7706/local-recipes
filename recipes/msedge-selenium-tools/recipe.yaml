# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.141.4"

package:
  name: msedge-selenium-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msedge-selenium-tools/msedge-selenium-tools-${{ version }}.tar.gz
  sha256: e1d397b2830c6c6f282cc0da2c6745631ab039c9dcd92dcf51b30f135c96caf2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - selenium

tests:
  - python:
      imports:
        - msedge
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/microsoft/edge-selenium-tools
  license: Apache-2.0
  license_file: LICENSE
  summary: An updated EdgeDriver implementation for Selenium 3 with newly-added support for Microsoft Edge (Chromium).
  description: |
    An updated EdgeDriver implementation for Selenium 3 with newly-added support for Microsoft Edge (Chromium).

extra:
  recipe-maintainers:
    - rxm7706

