# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.15.2"

package:
  name: apache-airflow-providers-ftp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-ftp/apache_airflow_providers_ftp-${{ version }}.tar.gz
  sha256: 0355ea366f3bc1fee0c5d48d6d2c6a65555863659bbd998e3ddeafcb88461526

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==3.12.0
  run:
    - python >=${{ python_min }}
    - airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.8.0

tests:
  - python:
      imports:
        - airflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-ftp/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-ftp for Apache Airflow
  description: |
    Provider package apache-airflow-providers-ftp for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-ftp/3.15.2

extra:
  recipe-maintainers:
    - xylar

