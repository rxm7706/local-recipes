# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"

package:
  name: flask-pydantic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/Flask-Pydantic/flask_pydantic-${{ version }}.tar.gz
  sha256: eb27fa6fd62d952b421df05c72349b5b1dc6fadacbd52879aac80cc519e4eab6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask
    - pydantic >=2.0
    - typing_extensions >=4.1.1

tests:
  - python:
      imports:
        - flask_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flask-Pydantic/
  license: MIT
  license_file: LICENSE.txt
  summary: Flask extension for integration with Pydantic library.
  description: |
    Flask extension for integration with Pydantic library.
  repository: https://github.com/pallets-eco/flask-pydantic

extra:
  recipe-maintainers:
    - killua156

