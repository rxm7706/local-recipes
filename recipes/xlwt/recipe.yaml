# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: xlwt
  version: "1.3.0"
  sha256: c59912717a9b28f1a3c2a98fd60741014b06b043936dcecbc113eaaada156c88

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - xlwt
      pip_check: false

about:
  license: 0BSD
  summary: Library to create spreadsheet files compatible with MS Excel 97/2000/XP/2003 XLS files, on any platform, with Python 2.6, 2.7, 3.3+
  license_file: docs/licenses.rst
  summary: Writing data and formatting information to Excel files
  description: |
    Xlwt is a library for developers to use to generate spreadsheet files
    compatible with Microsoft Excel versions 95 to 2003.
  homepage: http://www.python-excel.org/
  repository: https://github.com/python-excel/xlwt
  documentation: http://xlwt.readthedocs.org/en/latest/

extra:
  recipe-maintainers:
    - nehaljwani
