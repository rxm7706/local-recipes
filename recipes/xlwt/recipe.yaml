# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.0"

package:
  name: xlwt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xlwt/xlwt-${{ version }}.tar.gz
  sha256: c59912717a9b28f1a3c2a98fd60741014b06b043936dcecbc113eaaada156c88

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - xlwt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://www.python-excel.org/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Library to create spreadsheet files compatible with MS Excel 97/2000/XP/2003 XLS files, on any platform, with Python 2.6, 2.7, 3.3+
  description: |
    Library to create spreadsheet files compatible with MS Excel 97/2000/XP/2003 XLS files, on any platform, with Python 2.6, 2.7, 3.3+

extra:
  recipe-maintainers:
    - nehaljwani

