    - pkg:conda/Flake8-pyproject@${{ version }}?channel=conda-forge
    - pkg:pypi/flake8-pyproject@${{ version }}
  cfe-upstream-repo: https://github.com/john-hen/Flake8-pyproject
  cfe-upstream-homepage: https://pypi.org/project/Flake8-pyproject/
  cfe-import-names: [flake8p]
  cfe-source-kind: github-tag
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/Flake8-pyproject-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.2.4

  cfe-forge-blocker-list: []
