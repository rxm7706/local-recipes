# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.4"

package:
  name: flake8-pyproject
  version: ${{ version }}

source:
  url: https://github.com/john-hen/Flake8-pyproject/archive/refs/tags/${{ version }}.tar.gz
  sha256: 9075bdd9712b03a9dad78652425081bbee63c9ad759bf9efb3a0eb1cd1b180c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.4
  run:
    - python >=${{ python_min }}
    - flake8 >=5
    - tomli <2

tests:
  - python:
      imports:
        - flake8p
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/Flake8-pyproject/
  license: MIT
  license_file: LICENSE
  summary: Flake8 plug-in loading the configuration from pyproject.toml
  description: |
    Flake8 plug-in loading the configuration from pyproject.toml
  repository: https://github.com/john-hen/Flake8-pyproject

extra:
  recipe-maintainers:

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: Flake8-pyproject
  cfe-upstream-registry: pypi
  cfe-upstream-name: flake8-pyproject
