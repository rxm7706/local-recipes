    - pkg:pypi/multimapping@${{ version }}
  cfe-upstream-repo: https://github.com/zopefoundation/MultiMapping
  cfe-upstream-homepage: https://pypi.org/project/MultiMapping/
  cfe-import-names: [MultiMapping]
