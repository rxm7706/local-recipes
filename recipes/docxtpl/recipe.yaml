# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: docxtpl
  version: "0.19.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 9cbacfe58ecf9eb481f28f60043c200f3e02205c0f41d710328e2558acbefba9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - python-docx >=1.1.2,<2.0.0
    - docxcompose >=1.4.0,<2.0.0
    - jinja2 >=3.1.4,<4.0.0
    - black >=24.4.2,<25.0.0
    - lxml

tests:
  - python:
      imports:
        - docxtpl
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: LGPL-2.1-only
  license_file: LICENSE.txt
  summary: Python docx template engine
  description: |
    Use a MS Word docx document as a jinja2 template
  homepage: https://github.com/elapouya/python-docx-template
  repository: https://github.com/elapouya/python-docx-template
  documentation: https://docxtpl.readthedocs.io/

extra:
  recipe-maintainers:
    - jfcorbett
    - YYYasin19
