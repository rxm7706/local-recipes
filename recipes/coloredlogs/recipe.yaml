    - pkg:pypi/coloredlogs@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://coloredlogs.readthedocs.io
  cfe-import-names: [coloredlogs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/coloredlogs-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-15.0.1

  cfe-forge-blocker-list:
