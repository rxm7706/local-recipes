# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "5.0"

package:
  name: python-gettext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-gettext/python-gettext-${{ version }}.tar.gz
  sha256: 869af1ea45e3dab6180557259824c2a62f1800e1286226af912431fe75c5084c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pythongettext
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hannosch/python-gettext
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Python Gettext po to mo file compiler.
  description: |
    Python Gettext po to mo file compiler.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: python-gettext
