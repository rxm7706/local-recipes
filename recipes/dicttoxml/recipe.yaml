# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.16"

package:
  name: dicttoxml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dicttoxml/dicttoxml-${{ version }}.tar.gz
  sha256: 6f36ce644881db5cd8940bee9b7cb3f3f6b7b327ba8a67d83d3e2caa0538bf9d
  file_name: dicttoxml-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dicttoxml
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: GPL-2.0-only
  summary: Converts a Python dictionary or other native data type into a valid XML string.
  license_file: LICENCE.txt
  homepage: https://github.com/quandyfactory/dicttoxml
  repository: https://github.com/quandyfactory/dicttoxml
  documentation: https://github.com/quandyfactory/dicttoxml

extra:
  recipe-maintainers:
    - johanneskoester
    - jan-janssen
