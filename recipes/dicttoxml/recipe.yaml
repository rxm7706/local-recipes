    - pkg:pypi/dicttoxml@${{ version }}
  cfe-upstream-repo: none
  cfe-upstream-homepage: https://github.com/quandyfactory/dicttoxml
  cfe-import-names: [dicttoxml]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/dicttoxml-feedstock
  cfe-forge-recipe-updates-needed: 
    - meta-yaml-to-recipe-yaml
    - version-update-to-1.7.16

  cfe-forge-blocker-list:
