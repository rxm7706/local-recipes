# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.16"

package:
  name: dicttoxml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dicttoxml/dicttoxml-${{ version }}.tar.gz
  sha256: 6f36ce644881db5cd8940bee9b7cb3f3f6b7b327ba8a67d83d3e2caa0538bf9d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0.0
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dicttoxml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/quandyfactory/dicttoxml
  license: REPLACE_LICENSE
  license_file: LICENSE
  summary: Converts a Python dictionary or other native data type into a valid XML string.
  description: |
    Converts a Python dictionary or other native data type into a valid XML string.

extra:
  recipe-maintainers:
    - johanneskoester
    - jan-janssen

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: dicttoxml
  cfe-upstream-registry: pypi
  cfe-upstream-name: dicttoxml
  cfe-purls:
