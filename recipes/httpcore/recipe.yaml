    - pkg:pypi/httpcore@${{ version }}
  cfe-upstream-repo: https://github.com/encode/httpcore
  cfe-upstream-homepage: https://www.encode.io/httpcore/
  cfe-import-names: [httpcore]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/httpcore-feedstock
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
