# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.9"

package:
  name: httpcore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/httpcore/httpcore-${{ version }}.tar.gz
  sha256: 6e34463af53fd2ab5d807f399a9b45ea31c3dfa2276f15a2c3f00afff6e176e8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=${{ python_min }}
    - certifi
    - h11 >=0.16

tests:
  - python:
      imports:
        - httpcore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://www.encode.io/httpcore/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A minimal low-level HTTP client.
  description: |
    A minimal low-level HTTP client.
  repository: https://github.com/encode/httpcore
  documentation: https://www.encode.io/httpcore

extra:
  recipe-maintainers:
    - nicoddemus
    - synapticarbors

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: httpcore
  cfe-upstream-registry: pypi
  cfe-upstream-name: httpcore
