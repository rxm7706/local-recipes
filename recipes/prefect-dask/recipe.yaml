# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: prefect-dask
  version: "0.3.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 776151f6865dfca7dcdde146f3234af134f4d01d51e07cc4a063296d471a4219

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - distributed >=2022.2.0
    - prefect >=3.4.7
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - prefect_dask
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Prefect integrations with the Dask execution framework.
  homepage: https://github.com/PrefectHQ/prefect-dask
  repository: https://github.com/PrefectHQ/prefect-dask
  documentation: https://prefecthq.github.io/prefect-dask/

extra:
  recipe-maintainers:
    - zzstoatzz
    - cicdw
    - desertaxle
