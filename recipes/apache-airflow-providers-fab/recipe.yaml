# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.8.0"

package:
  name: apache-airflow-providers-fab
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apache-airflow-providers-fab/apache_airflow_providers_fab-${{ version }}.tar.gz
  sha256: 1d1a86e040ad3bdadcb0fc56e05ee10d3efca5755fb0e66155288f364c170419

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.31.0
    - packaging ==26.2
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    - tomli ==2.4.1
  run:
    - python >=${{ python_min }}
    - apache-airflow-providers-common-compat >=1.18.0
    - airflow >=3.0.2
    - blinker >=1.6.2
    - cachetools >=6.0
    - flask-appbuilder ==5.2.2
    - flask-limiter >3
    - flask-login >=0.6.2
    - flask-session >=0.8.0
    - flask-sqlalchemy >=3.0.5
    - flask-wtf >=1.1.0
    - flask >=2.2.1
    - jmespath >=0.7.0
    - marshmallow >=3
    - msgpack >=1.0.0
    - pyjwt >=2.11.0
    - werkzeug >=2.2
    - wtforms >=3.0

tests:
  - python:
      imports:
        - airflow.providers.fab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/apache-airflow-providers-fab/
  license: Apache-2.0
  license_file: LICENSE
  summary: Provider package apache-airflow-providers-fab for Apache Airflow
  description: |
    Provider package apache-airflow-providers-fab for Apache Airflow
  repository: https://github.com/apache/airflow
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-fab/3.8.0

extra:
  recipe-maintainers:
    - xylar

