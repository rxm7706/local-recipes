# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.17"

package:
  name: pysnow
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pysnow/pysnow-${{ version }}.tar.gz
  sha256: 9ca04d53b897999426854ab03577a9fdbefe925526373a2fd647ee551fe520ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=0.12
  run:
    - python >=${{ python_min }}
    - requests
    - oauthlib
    - python-magic
    - requests-oauthlib
    - six
    - ijson
    - pytz

tests:
  - python:
      imports:
        - pysnow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/rbw/pysnow
  license: MIT
  license_file: LICENSE
  summary: ServiceNow HTTP client library
  description: |
    ServiceNow HTTP client library

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: pysnow
