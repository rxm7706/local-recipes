# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: enlighten
  version: "1.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 85c35412a9a4f3886b3337d41f813441fab9a30d9f5b5f0c015bd078a4411473

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - blessed >=1.17.7
    - prefixed >=0.3.2

tests:
  - python:
      imports:
        - enlighten
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Enlighten Progress Bar
  homepage: https://python-enlighten.readthedocs.io/en/stable/
  repository: https://github.com/Rockhopper-Technologies/enlighten
  documentation: https://python-enlighten.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - fcollonval
