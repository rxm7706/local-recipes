# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pyctuator
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyctuator/pyctuator-${{ version }}.tar.gz
  sha256: c225fe04a508cf5e95efff3aaf413e1e9a3abf3e6d5234e1b510e1454ead17b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry >=1.1
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyctuator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/SolarEdgeTech/pyctuator
  license: Apache-2.0
  license_file: LICENSE
  summary: A Python implementation of the Spring Actuator API for popular web frameworks
  description: |
    A Python implementation of the Spring Actuator API for popular web frameworks
  repository: https://github.com/SolarEdgeTech/pyctuator

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
