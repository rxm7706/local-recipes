# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.15.0"

package:
  name: pydantic-settings
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-settings/pydantic_settings-${{ version }}.tar.gz
  sha256: 694b793e84f766ba76a90ebdefc01d0a9a045dab0382bee70393da93712ad117

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pydantic >=2.7.0
    - python-dotenv >=0.21.0
    - typing-inspection >=0.4.0

tests:
  - python:
      imports:
        - pydantic_settings
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/pydantic/pydantic-settings
  license: MIT
  license_file: LICENSE
  summary: Settings management using Pydantic
  description: |
    Settings management using Pydantic
  repository: https://github.com/pydantic/pydantic-settings
  documentation: https://docs.pydantic.dev/dev-v2/concepts/pydantic_settings/

extra:
  recipe-maintainers:
    - jan-janssen
    - fhoehle

