# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: rpm-vercmp
  version: "0.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rpm_vercmp-${{ version }}.tar.gz
  sha256: 73dd583f1ff7a798faff62d39659d8a3e5183099972b2fc028bfadd70a43eda8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pbr
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rpm_vercmp
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Pure Python implementation of rpmvercmp
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/sassoftware/python-rpm-vercmp

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
