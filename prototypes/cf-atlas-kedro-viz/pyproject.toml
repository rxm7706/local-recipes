[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cf_atlas_kedro"
version = "0.1.0"
description = "Illustrative Kedro model of the target-state cf_atlas pipeline (kedro-viz prototype for docs/specs/cfe-atlas-datapipeline-kedro-migration.md)"
requires-python = ">=3.11"
dependencies = []

[tool.kedro]
package_name = "cf_atlas_kedro"
project_name = "cf-atlas-kedro-viz"
kedro_init_version = "1.3.1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro_telemetry]
project_id = "937a045583154457a3790b9124ac5253"
