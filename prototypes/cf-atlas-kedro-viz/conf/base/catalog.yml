# Catalog for the target-state cf_atlas DAG prototype.
#
# Every dataset is a MemoryDataset (stub run, no IO). The kedro-viz `layer`
# metadata models the real storage tiers of the migration:
#   raw          — external API feeds / tarballs (18 resolve_*_urls endpoints)
#   atlas        — today's cf_atlas.db tables -> tomorrow's DuckDB parquet
#   views        — the 5 named views (query-time-correct surfaces)
#   derived      — regenerated artifacts (purl export, BOMs, reports)
#   read_surface — BSL / Vizro / kedro-mcp consumption layer
#
# Underscore keys are YAML anchors, ignored by the catalog loader.

_raw: &raw
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: raw

_atlas: &atlas
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: atlas

_views: &views
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: views

_derived: &derived
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: derived

_read_surface: &read_surface
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: read_surface

