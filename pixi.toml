# Steward Story 63.6 (spec-pyforge-steward CAP-152, 2026-09-20): tasks station code shells to at
# runtime moved here from [feature.local-recipes.tasks] -- only pyforge-guild exists at runtime.
# deck-export / deck-facts / deck-trio need pyforge-herald (pinned below in the Guild feature);
# platform-ci-local is a bash wrapper that provisions and uses the platform envs' own bins.
[feature.guild-tasks.tasks.deck-export]
description = "Regenerate a presentation deck's derived export artifacts (standalone infographic HTML + PPTX) from its Marp .md sources via marp — keeps the § Standard export set reproducible. Usage: pixi run -e local-recipes deck-export <slug> [html|deck-pptx|infographic-pptx ...] (default: all). PPTX needs Chrome (skipped, not crashed, when unavailable — Story 23.3). Every produced artifact gets a <artifact>.stamp.json provenance sidecar (Story 23.3, pyforge.herald.stamps). See docs/specs/presentation-deck.md."
cmd = "python scripts/deck_export.py"
env = { PYTHONPATH = "src/shared/packages/pyforge-herald/src:src/shared/packages/pyforge-core/src" }  # Story 23.3: imports pyforge.herald.stamps, which imports pyforge.core.atomic_write -- both paths listed explicitly (mirrors this file's other PYTHONPATH entries) rather than relying on pyforge-core arriving as pyforge-doctor's transitive run-dep

[feature.guild-tasks.tasks.deck-facts]
description = "Derive a presentation deck's fact ledger presentations/<slug>/facts.yaml from TRACKED live sources only (every guild-roster station's tracked sprint-status-ledger.yaml via fleet_scan.parse_sprint_status, spec-<slug>/SPEC.md + docs/dreams/<slug>.md status, pyproject.toml, _bmad/_config/manifest.yaml, pixi.lock, the CFE SKILL.md frontmatter, bmad-groundtruth, recipes/) — deterministic: sorted by id, tree = HEAD sha, byte-identical on an unchanged tree; unsourceable facts are omitted and named on stderr, never guessed. -- --check reads the deck's `<Persona> Infographic standalone.html` and reports unmarked / mismatch / drifted / unshown facts, one line each plus a summary — ADVISORY: exit 0 always, not a detector, never in detectors/detectors-ci. -- --refresh (CAP-6) re-derives, then rewrites every stale data-fact literal in the poster from the fresh ledger, keeping its shape (advisory, exit 0). -- --with-tests adds a tests_collected row (runs the station's own pytest --collect-only). Usage: pixi run -e local-recipes deck-facts <slug> [--check] [--refresh] [--with-tests]. Contract: spec-deck-family-currency CAP-2/CAP-5 (facts-ledger.md)."
cmd = "python scripts/deck_facts.py"

[feature.guild-tasks.tasks.deck-trio]
description = "Derive a deck's Infographic HEAD and/or Infographic Deck from its standalone poster — two independently combinable modes, both pure functions of the standalone's bytes. --head: project/<Persona> - Infographic.dc.html via three mechanical transforms — wrap the body in <x-dc><helmet>, move the standalone's <head><style> block + font/stylesheet <link> tags into <helmet> verbatim, and add the support.js script tag + a data-dc-script/$preview block whose height is an actual headless-Chromium measurement of the standalone (never a guess, never a render of the head). --deck: project/<Persona> - Infographic Deck.dc.html — parses the standalone's masthead (content before the first act/section, when present), act bands (<div class=\"act\">, never split) and numbered sections (<section class=\"sec\">, split only when a section's own rendered content overflows a slide's content budget, packed at its own direct-child boundaries), and closing band (content after the last act/section, when present, never split) in document order, same skeleton convention as the family's other decks; a non-numbered banner between act/section elements produces no slide. Both refuse (exit 2) rather than guess on a missing/ambiguous poster, an unlocatable <style> block, or (--deck) zero act bands/numbered sections, an empty act/section label, a section with zero direct children, or a measured-vs-parsed section-count mismatch; both skip the write when the derived bytes already match what's on disk; neither ever touches the standalone; combined, both modes are validated before either is written. Every derived write also gets a <artifact>.stamp.json provenance sidecar (Story 23.3, pyforge.herald.stamps). Usage: pixi run -e local-recipes deck-trio <slug> --head [--deck] (at least one required). See docs/specs/presentation-deck.md § Artifact dependency tree."
cmd = "python scripts/deck_trio.py"
env = { PYTHONPATH = "src/shared/packages/pyforge-herald/src:src/shared/packages/pyforge-core/src" }  # Story 23.3: imports pyforge.herald.stamps, which imports pyforge.core.atomic_write -- both paths listed explicitly (mirrors this file's other PYTHONPATH entries) rather than relying on pyforge-core arriving as pyforge-doctor's transitive run-dep

[feature.guild-tasks.tasks.platform-ci-local]
