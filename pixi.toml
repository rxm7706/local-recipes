[feature.guild-tasks.tasks.loop-stall-check]
description = "Watchdog: a live bmad-loop run has stopped making progress. `bmad-loop status` reports the last phase it WROTE, so a session blocked on an interactive startup dialog reads `dev-running` forever — and the dialog never reaches the session log, it renders only in the tmux pane, so the log just stops growing. The supervisor's stall ladder does not fire either. Live cost 2026-07-31: scribe 1.3 sat 74 min on the CLAUDE.md external-import dialog, seven times its 600s grace, while five siblings wrote every second. Compares now against the newest mtime across a run's logs + journal, for runs whose state.json says neither finished, stopped, paused, nor parked-only (a paused run is SUPPOSED to sit still, and since Story 25.5 a parked-only run — every task awaiting-operator — reports awaiting-operator (run bmad-loop confirm) and exits 0 instead of reading as a stall). Threshold 15m, override with -- --minutes N. Catches any cause: folder-trust prompt, external-import prompt, wedged model call, hung nested CLI. Contract: spec-bmad-loop-governance."
cmd = "python scripts/loop_stall_check.py"

[feature.guild-tasks.tasks.baseline-drift-check]
description = "Watchdog: a story permanently deferred by bmad-loop's stuck-orchestrator baseline-drift bug and not yet recovered. `task.baseline_commit`, stamped once when a story's isolated worktree opens, can drift to the shared loop/<slug> branch's later tip while a dev session is still running -- the verify gate then mismatches it against the session's own correct baseline and permanently defers real, reviewed work while the dispatcher silently opens the next story's worktree. Not ours to fix (bmad_loop ships git-pinned via pixi); this is the loud-defer containment. Hit 5 times in one session on 2026-08-14 (marshal 8.1-9.6, mason 3.6-3.9) before this containment existed, 3 more the same day (atlas 14-2, herald 14-2/14-3) — every occurrence's real commits survive as an attempt-preserve/<run>-<hash> branch, recoverable by hand (land/<slug>-<story> off origin/loop/<slug>, same shape as PRs #482-484/#510) but invisible until an operator notices. Scans every run's journal.jsonl under every ~/.bmad-loops loop home; a finding silences itself the moment the story reads `done` in that station's tracked sprint-status-ledger.yaml (the same source fleet-picture reads), so a landed recovery clears it with no commit-message archaeology. Contract: spec-bmad-loop-baseline-drift."
cmd = "python scripts/bmad_loop_baseline_drift_check.py"

[feature.guild-tasks.tasks.index-freshness-check]
description = "Detector: codegraph and cocoindex indices in loop homes are present and fresh (Story 28.7, SPEC-marshal-token-economy CAP-10). Advisory only: staleness never blocks a run; the findings inform admission decisions. For each loop home, reads its rendered `.bmad-loop/policy.toml`, checks the `[context]` layer declarations, and for each ENABLED layer (structure-graph → codegraph, derived-context → cocoindex), verifies the index is present and its mtime is at or after HEAD's commit timestamp — the same git-timestamp discipline CAP-13 requires for graph-node staleness. If git cannot report HEAD (not a repo, no commits, no git binary), freshness is not evaluated; presence alone reports OK. scope=runtime (loop homes live in ~/.bmad-loops, a gitignored Tier-3 directory), excluded from detectors-ci."
cmd = "python scripts/index_freshness_check.py"

[feature.guild-tasks.tasks.scribe-graph-freshness-check]
description = "Detector (Story 8.1, spec-8-1): the compiled scribe knowledge graph (.claude/data/pyforge-scribe/graph.json) is fresh -- its mtime is no older than the nightly trigger's own 24h period (pyforge-scribe-nightly-compile.timer). Advisory only: never a PR gate, never a second verdict alongside the detector set's existing gates -- proof the nightly trigger fired, nothing more. Missing graph.json (never compiled, or the trigger was never installed) is its own advisory finding, not an error. scope=runtime (a gitignored, host-local derived artifact a CI runner never populates), excluded from detectors-ci."
cmd = "python scripts/scribe_graph_freshness_check.py"

[feature.guild-tasks.tasks.missing-preserve-check]
description = "Watchdog: an intent-gap halt left no preserve artifact (Story 20.5 / CAP-3 of spec-bmad-loop-intent-gap-work-preservation). Story 20.4 parks attempt-preserve/* or failed/<story>/changes.patch before the halt reverts; if that seam is bypassed or upstream shifts, the halt still looks clean while the attempt is gone. Scans marshal journals under ~/.bmad-loops for escalation-detected (intent-gap reason) or intent-gap-preserve-failed; trips when no preserve branch/patch is present. scope=runtime (excluded from detectors-ci), same placement as loop-stall-check / baseline-drift-check — NOT pyforge.doctor.sources. Never imports bmad_loop. Contract: spec-20-5-missing-preserve-detector."
cmd = "python scripts/missing_preserve_check.py"

[feature.guild-tasks.tasks.forward-dependency-check]
description = "Detector: a story's own documented **Deps:** names a story in a LATER epic, and bmad-loop cannot see it. `next_actionable` (bmad_loop.sprintstatus) is a strict file-order scan within the current epic with no depends_on concept at all — confirmed against the installed library. A plain `bmad-loop run` would dispatch the forward-dependent story the moment its own epic clears, burning a dev attempt on work that can't complete yet. Found live 2026-08-03 in marshal (2-3 deps S-3.2, 2-7 deps S-4.1, 8-5 deps S-10.2); the fix is the non-standard `blocked` status (the loader does not validate against STORY_STATUSES, same mechanism `optional` relies on), then `python scripts/promote_sprint_status.py`. COVERAGE is keyed on MACHINE-READABLE refs, four classes (reworked 2026-08-08): `measured` (every declaration resolved or explicitly none) · `partial` (a real dependency stated in a grammar DEP_RE cannot parse — the ratio is named, so a station can never read as fully verified; this is how mason reported clean with 0 of 30 declarations parseable) · `no-dispatch` (the ledger positively shows 0 actionable stories, so nothing can be dispatched early — a measured fact, NOT a parse-clean claim) · `unmeasured` (no declaration and work remains, or the ledger is unreadable). Grammar: `S-<epic>.<num>` story, `S-<epic>.*` whole epic, `<station>:S-<epic>.<num>` cross-station, `—` none; prose only as trailing context. Contract: docs/dreams/bmad-loop-forward-dependency-blindness.md + its Spec under pyforge-marshal."
cmd = "python -m pyforge.doctor.sources forward-dependency"

[feature.local-recipes.tasks.seed-claude-consent]
description = "Pre-approve the Claude CLI's per-workspace STARTUP dialogs (folder-trust, CLAUDE.md external-import) for every loop home, so an interactive prompt cannot stall an unattended run. These are NOT tool-permission prompts: loop sessions already run --permission-mode bypassPermissions, which is a different layer and did not suppress them — scribe 1.3 stalled 74 min anyway. OPERATOR DECISION 2026-07-31: this removes the one moment a human sees the list of files imported into the model's system context, and the imported file (.claude/memory/MEMORY.md) is AGENT-WRITTEN — scribe's own output. The residual control is that .claude/memory/** is git-tracked, so review the diff as instructions, not notes; and loop-stall-check catches any FUTURE prompt within 15 min. Scope is guarded to git worktrees under ~/.bmad-loops; atomic write with a .bak. Run `-- --check` for a read-only report. Contract: spec-bmad-loop-governance."
cmd = "python scripts/seed_claude_consent.py"

