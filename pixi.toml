[feature.pyforge-atlas.tasks.viz-build]
description = "Epic 12/FR-62: static `kedro viz build` of the REAL atlas DAG (never the stub-mirror prototype) -> build/api + build/index.html. Wipes any prior build/ first -- kedro-viz's own LocalDeployer only mkdir's the build dir, it never clears stale content, so a node/dataset removed from a real DAG change would otherwise leave its old file behind forever across repeated local invocations (CI's own fresh-checkout-per-run makes this moot there, but a clean slate here removes the gap everywhere). PYTHONHASHSEED=0 is NOT decorative: kedro-viz's static export enumerates nodes/pipelines/edges from internal Python `set`s, whose iteration order CPython randomizes per-process by default (a per-run string-hash seed) -- pinning the seed makes that enumeration order reproducible across runs, which `viz-publish-stage`'s normalize-then-diff pipeline depends on to tell a real DAG change from build noise."
cmd = "rm -rf build && kedro viz build"
