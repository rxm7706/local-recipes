[feature.guild-tasks.tasks.docs-map-hygiene-check]
description = "Detector: docs/MAP.md alignment with the four Diátaxis quadrants it governs — docs/tutorials, docs/how-to, docs/reference, docs/explanation (Story 30.1, spec-pyforge-doctor CAP-83). A MAP link to a missing page under docs/ is FAIL; a quadrant page not linked from MAP.md is FAIL too (promoted from WARN by Story 30.2, spec-pyforge-doctor CAP-84, once docs/MAP.md's generated Page registry section links every docs/map.yaml page). Quadrant README.md index pages are exempt; MAP.md's own 'Outside this map' layers are never scanned. Read-only, fail-open."
cmd = "python -m pyforge.doctor.sources docs-map-hygiene"

[feature.guild-tasks.tasks.docs-currency-check]
description = "Detector: docs/map.yaml is the registry, docs/MAP.md's generated Page registry section is its render (Story 30.2, spec-pyforge-doctor CAP-84). Three warn-first checks: map-render (MAP.md's generated section byte-matches a fresh render of docs/map.yaml), authored-page-stale (a kind: authored page's own sources:/verified: frontmatter has fallen behind a named source's git last-touch, or the page body cites a backticked skill/script/path token that no longer resolves), skill-dir-hygiene (a stray non-layout file inside a bmad-*/pyforge-*/skf-* skill directory). Read-only, fail-open — a missing/invalid docs/map.yaml degrades to one WARN, never FAIL, never a crash. Contract: spec-30-2-docs-map-yaml-is-the-registry-map-md-is-its-render-and-docs-currency-reds-a-stale-page."
cmd = "python -m pyforge.doctor.sources docs-currency"

[feature.guild-tasks.tasks.docs-map-render]
description = "Mutator: regenerates docs/MAP.md's generated '## Page registry' section from docs/map.yaml — the only sanctioned way to edit the content between the docs-map:registry:begin/docs-map:registry:end markers (Story 30.2, spec-pyforge-doctor CAP-84). Run after editing docs/map.yaml, or after docs-currency-check reports the section stale."
cmd = "python scripts/docs_map_render.py"

[feature.guild-tasks.tasks.docs-map-render-test]
description = "tests/scripts/test_docs_map_render.py — scripts/docs_map_render.py's schema-validated error handling and marker-splice logic (review pass 1, Story 30.2, spec-pyforge-doctor CAP-84). Lives here, not folded into pyforge-doctor-scripts-test (pyforge-ci), because docs_map_render.py imports pyforge.doctor.sources.docs_currency for its shared render/splice functions, which needs jsonschema — unavailable in pyforge-ci's deliberately dependency-free env (that file's own tests skip cleanly there via pytest.importorskip). pyforge-guild carries pyforge-doctor's run-deps already."
