[feature.local-recipes.tasks.tea-playwright-all]
description = "Story 19.1 / FR-129: regenerate every station's planning-artifacts/test-architecture.md from epics + live test inventory. TBD in output is a hard fail. Idempotent on an unchanged tree."
cmd = "python _bmad/scripts/bmad_tea_playwright.py --all"

[feature.local-recipes.tasks.tea-playwright-check]
description = "Story 19.4 / CAP-5: fail if any epic story id is absent from a station's on-disk Story Coverage Matrix (or the doc/matrix is missing). Does not write; cure with tea-playwright-all."
cmd = "python _bmad/scripts/bmad_tea_playwright.py --all --check"

[feature.local-recipes.tasks.tea-test-review]
description = "Story 46.3 (spec-bmad-suite-lifecycle CAP-4 half): headless run of TEA's bmad-testarch-test-review skill (steward provision --module tea) against the PR's changed test files -- a Marshal review-lens / Warden-advisory precursor, never this task itself. Default: --base origin/main --min-score 80. Override or add flags after `--`, e.g. `pixi run -e local-recipes tea-test-review -- --min-score 90`. Not a gate: never joins detectors/detectors-ci -- Warden's own PR-gate exit code is unaffected by this task's existence."
cmd = "tea-test-review --base origin/main --min-score 80"

[feature.guild-tasks.tasks.bmad-drift-check]
description = "Detector: report drift between the _bmad-output/pyforge-marshal factory-doc artifacts and the live factory (pins, counts, coverage completeness, baseline, stale rules). Exits non-zero on drift. Ported into pyforge-doctor (Story 6.9); --fix/--write-baseline are mutation, outside Doctor's read-only-gather scope, so they were not ported -- run them via `python scripts/bmad_drift_check.py` instead. See _bmad-output/projects/pyforge-marshal/SYNC-RUNBOOK.md."
cmd = "python -m pyforge.doctor.sources bmad-drift"

[feature.guild-tasks.tasks.bmad-groundtruth]
description = "Print the live ground-truth factory facts (skill version, schema, MCP tools, atlas phases, pixi envs, gotchas) as JSON — the source of truth the BMAD docs must portray."
cmd = "python -m pyforge.doctor.sources bmad-drift --groundtruth"

[feature.guild-tasks.tasks.llms-full-check]
description = "Detector: report drift between docs/reference/library-llms-full.md (the library catalog) and pixi.toml — undocumented deps, ghost entries, version-floor drift. Exits non-zero on drift. Reconciler = the regeneration prompt in the catalog header. Pass -- --json for machine output."
cmd = "python scripts/llms_full_check.py"

[feature.guild-tasks.tasks.platform-ci-test-requirements-check]
description = "Detector (Story 16.1 / CAP-5): src/platform/requirements/{base,local,production}.txt stay retired — pixi.toml is the sole platform dep authority. Exits non-zero if those files are resurrected. Pass -- --json for machine output."
cmd = "python scripts/platform_ci_test_requirements_check.py"


[feature.guild-tasks.tasks.pixi-version-check]
description = "Detector: every pixi-version pin site (CI workflows, both Containerfiles, environment.yaml, pixi.toml's own feature floors) agrees with pixi.toml's requires-pixi floor. Registry lives in scripts/pixi_version_registry.py, not a hand-maintained comment — that comment drifted three times before this existed, most recently 2026-08-21 when a pixi upgrade left 10 external sites stale and one (src/platform/compose/dbgpt/Containerfile) unregistered entirely, breaking container-dbgpt CI. Reconciler: bump-pixi-version. Pass -- --json for machine output."
cmd = "python scripts/pixi_version_check.py"

[feature.local-recipes.tasks.bump-pixi-version]
description = "Mutator: rewrite every scripts/pixi_version_registry.py site to one target pixi version in a single pass (pixi.toml's $schema/requires-pixi/3 feature floors, dashboard.yml, kedro-viz-publish.yml, herald-live-demo.yml's 3 pins, sync-pypi-mappings/action.yml, staged-recipes-linter.yml's micromamba floor, both Containerfiles + the dbgpt-sidecar one), then regenerates environment.yaml with the real exporter and re-runs pixi-version-check to confirm convergence. Verifies the target ghcr.io/prefix-dev/pixi image tag exists first. Usage: pixi run -e local-recipes bump-pixi-version -- 0.78.0 (omit the version to re-converge sites to pixi.toml's current floor after fixing an unregistered one by hand)."
cmd = "python scripts/bump_pixi_version.py"

[feature.guild-tasks.tasks.deferred-work-check]
description = "Detector: no deferred-work entry lives ONLY in gitignored Tier-3. bmad-loop's follow-up-review damping refiles a still-recommended review into implementation-artifacts/deferred-work.md, which is gitignored — so its own safety valve leaks. Fails when a Tier-3 DW-* id has no tracked twin in planning-artifacts/deferred-work-ledger.md, or when a project carries a substantive Tier-3 ledger and no tracked one at all. Reconcile by promoting into the tracked ledger. Contract: spec-regenerable-factory."
cmd = "python -m pyforge.doctor.sources deferred-work"

[feature.guild-tasks.tasks.due-for-verification-check]
description = "Batches every tracked planning-artifacts/deferred-work-ledger.md entry (every project) that has never been re-checked against live code (no `verified:` line) or was last checked past the DUE_FOR_VERIFICATION_STALENESS_DAYS staleness threshold (sources/chain.py) — informs only, always WARN, never gates. Every ID'd entry counts regardless of status: (closed/done entries are not exempt). Each due entry is additionally churn-checked: when every code path its ledger text cites (backtick-quoted, excluding `source_spec:`) has had zero git commits since the entry's churn-window start (its `verified:` date, or a derived authoring date when never verified), the SAME finding's evidence is tagged `skip_reason: no-churn` — deprioritized, not resolved; any unresolved or churned path, or zero extractable paths, leaves it fully due (safe default). Each due entry that SURVIVES the churn filter is further offered a mechanical check for ONE grep-recomputable claim shape: a backtick-quoted bare identifier claimed unused/unreferenced/never called/no callers/dead code within 80 characters. `git grep -n -w -I --untracked --no-exclude-standard` (whole repo, including not-yet-committed and gitignored-but-untracked files, excluding every `**/deferred-work-ledger.md` so an entry's own claim text never counts as a call site against itself, excluding the symbol's own `def`/`async def`/`class` line except for any further occurrence of the symbol on that same line) recomputes its live call-site count without an agent, tagging the finding `mechanical_verdict: still-open` (count still 0) or `mechanical_verdict: escalate` (count now nonzero — needs Story 11.4's agent judgment); never `resolved`. A verdict is only asserted when the symbol resolves to a real found declaration — a bare identifier with no `def`/`class` anywhere (e.g. a variable/constant) gets no verdict. No recognizable claim, a churn-skipped entry, an unresolved declaration, or a git failure leaves the finding with no `mechanical_*` keys. Reconcile by re-reading the entry against live code and appending a fresh `verified: <date> — ...` line. Contract: spec-deferred-work-resolution-sweep CAP-1 + CAP-2 + CAP-3."
cmd = "python -m pyforge.doctor.sources due-for-verification"

[feature.guild-tasks.tasks.bmad-method-version-drift-check]
description = "Compares this pixi.toml's own declared bmad-method floor (max across every dependencies/feature.*.dependencies/target-scoped table) against _bmad/_config/manifest.yaml's installed version, and separately against the latest bmad-method release actually published on npm (a live, fail-open registry query) — informs only, always WARN or OK, never gates. Reconcile by running the BMAD-METHOD installer to bring the installed core up to date, or by lowering the declared floor if an upgrade is not yet intended. Contract: spec-10-1-the-declared-floor-and-the-installed-core-are-compared-and-reported, spec-10-2-the-installed-core-is-compared-against-the-latest-upstream-release."
cmd = "python -m pyforge.doctor.sources bmad-method-version-drift"

[feature.guild-tasks.tasks.story-status-check]
description = "Detector: no story reads `done` in a sprint feed without having landed. A bmad-loop dev pass self-marks its story `done`; if the REVIEW then fails to converge the story is deferred and NOTHING rolls the feed back — a false green in the artifact the dashboard renders and the next run dispatches from, so the board over-reports AND the next run SKIPS a story that was never finished. Caught 3 live on 2026-07-31 (marshal 1-6, doctor 1-4, mason 1-3), all in the same shape: dev completed, review failed. Confirms a landing via a merge commit on any ref OR a harness-recorded commit_sha (AD-33: git owns repository facts), and reports only when the harness positively says deferred/escalated — so hand-implemented stories with no run record are never flagged. The real fix belongs upstream in bmad-loop; this is the containment. Premise note (2026-08-22): BMAD 6.11's build-auto finalize writes `done` only at true finalize (post-review), shrinking — not closing — the dev-marks-done window; pre-6.11 feeds and interrupted runs keep the premise live, so detector behavior is unchanged. Contract: spec-regenerable-factory."
cmd = "python -m pyforge.doctor.sources story-status"

[feature.guild-tasks.tasks.capability-effect-check]
description = "Detector: a shipped/realized Spec CAP carries no `verified:` line (Story 21.10/21.11, spec-capability-effect-check CAP-2). Answers \"is the capability reached\" beside story-status-check's \"did the story land\" in one detectors run. Read-only — never authors a verified line. Warn-only, never gates. Contract: spec-21-11-the-effect-check-renders-beside-story-status-check."
cmd = "python -m pyforge.doctor.sources capability-effect"

[feature.guild-tasks.tasks.status-body-consistency-check]
