#                             VVVVVV  minimum `pixi` version
"$schema" = "https://pixi.sh/v0.73.0/schema/manifest/schema.json"

[workspace]
name = "staged-recipes"
preview = ["pixi-build"]  # enable the pixi build backend for the ./src/shared/packages/pyforge-warden workspace member (Option B). Only unlocks [package]/build tables; does not change the rattler-build recipe workflow.
# NOTE: Gemini PR#49 suggested a `[workspace] members = [...]` key, but pixi
# (through 0.72.2) has no such key — workspace members are declared via path
# dependencies (see [feature.pyforge-warden.dependencies]).
requires-pixi = ">=0.73.0"  # single pixi floor for the workspace — matches feature.python/local-recipes `pixi = ">=0.73.0"`, environment.yaml, and the CI pixi-version pin in .github/workflows/dashboard.yml. Keep all four in step. 0.71+ is a hard floor regardless: the named platform entry `osx-arm64-min` ({ name, platform, macos }) replaced the deprecated [system-requirements] table and older pixi cannot read it.
description = "The entry point to conda-forge"
version = "0.2.0"
license = "BSD-3-Clause"
license-file = "LICENSE.txt"
authors = ["@conda-forge/core"]
channels = ["conda-forge", "SelfExplainML"]
platforms = [
    "linux-64", "win-64",
    # "osx-arm64-min" = the osx-arm64 subdir with a declared minimum macOS
    # (a virtual-package FLOOR, not a pin: it states the oldest Mac the lock
    # must support; newer macOS always satisfies it). Currently 14.5 (Sonoma),
    # the exact minimum demanded by mlx 0.31.2+ (__osx >=14.5); bump only when
    # a dependency requires it. This named-entry form is the pixi 0.71+
    # replacement for the deprecated [system-requirements] table; feature
    # `platforms` lists must reference it by name — a plain "osx-arm64"
    # entry would error.
    { name = "osx-arm64-min", platform = "osx-arm64", macos = "14.5" },
    # TODO: add osx-64 / linux-aarch64 / win-arm64 (+ in the features below)
    # when the full dep set resolves on them.
]

[feature.python.dependencies]
python = ">=3.14.6,3.14.*"        # Python language interpreter
pixi = ">=0.73.0"                 # Pixi package & environment manager
gh = ">=2.96.0"                   # GitHub CLI for PR / issue / repo automation
gitpython = ">=3.1.57"            # Pythonic Git wrapper for complex repo interactions
nodejs = ">=24.16.0,24.*,<25.0"   # Pin to LTS version
bmad-method = ">=6.10.0"          # BMAD agent-driven dev framework (planning + dev skills)
spec-kit = ">=0.14.2"             # Spec-kit for spec-driven development
truststore = ">=0.10.4"           # OS trust store for corporate CA / JFrog TLS
# pixi upgrade --pinning-strategy latest-up --exclude conda-libmamba-solver --exclude conda-build --exclude conda-index --exclude conda-forge-ci-setup --exclude conda-forge-pinning --exclude frozendict --exclude networkx --exclude rattler-build-conda-compat --exclude grayskull --exclude conda-recipe-manager --exclude conda-smithy --exclude shellcheck --exclude python --exclude django --exclude wagtail --exclude nodejs --exclude coderedcms
# Canonical upgrade command (19 excludes). tomlkit / structlog / sqlglot / pyarrow / pandas
# no longer need excluding: their ceilings came from upstream package metadata, not from us.
# pixi upgrade --pinning-strategy latest-up --exclude conda-libmamba-solver --exclude conda-build --exclude conda-index --exclude conda-forge-ci-setup --exclude conda-forge-pinning --exclude frozendict --exclude networkx --exclude rattler-build-conda-compat --exclude grayskull --exclude conda-recipe-manager --exclude conda-smithy --exclude shellcheck --exclude nodejs --exclude python --exclude django --exclude channels --exclude daphne --exclude wagtail --exclude coderedcms

[feature.build.dependencies]
conda = ">=26.5.0"                # conda package manager
conda-libmamba-solver = ">=24.9.0"  # fast libmamba-backed solver for conda
conda-build = ">=25.3.1"          # v0 recipe build engine (meta.yaml)
conda-index = ">=0.3.0"           # repodata.json index generator
conda-forge-ci-setup = ">=4.9.3,<5.0"  # conda-forge CI bootstrap scripts (CI fidelity)
conda-forge-pinning = "*"         # global conda-forge version pinning manifest
frozendict = "*"                  # immutable dict (transitive build dep)
#networkx = "2.4.*"                # graph library; pinned to 2.4 for conda-build compat
rattler-build-conda-compat = ">=1.2.0,<2.0.0a0"  # rattler-build ↔ conda-build compat shims

[feature.linux]
# The linux feature runs on every platform that can run Docker.
platforms = ["linux-64", "osx-arm64-min", "win-64"]
[feature.linux.tasks.build-linux]
description = "build for Linux inside a docker container"
cmd = "python build-locally.py --filter 'linux*'"

[feature.osx]
# The osx env will run directly on the machine.
platforms = ["osx-arm64-min"]
[feature.osx.tasks.build-osx]
description = "build directly on a MacOS host machine"
cmd = "python build-locally.py --filter 'osx*'"
[feature.osx.tasks.build-osx.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"
OSX_SDK_DIR = "$PIXI_PROJECT_ROOT/.pixi/macOS-SDKs"

[feature.win]
# The windows env will run directly on the machine.
platforms = ["win-64"]
[feature.win.tasks.build-win]
description = "build directly on a Windows host machine"
cmd = "python build-locally.py --filter 'win*'"
[feature.win.tasks.build-win.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"

[feature.grayskull.dependencies]
grayskull = ">=2.7.3"             # auto-generate conda recipes from PyPI / CRAN
conda-recipe-manager = ">=0.8.0"  # lint + migrate v0 ↔ v1 conda recipes
[feature.grayskull.tasks.pypi]
description = "generate a v1 (rattler-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.cran]
description = "generate a v1 (rattler-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.pypi-v0]
description = "generate a v0 (conda-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge"
[feature.grayskull.tasks.cran-v0]
description = "generate a v0 (conda-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge"

[feature.conda-smithy.dependencies]
conda-smithy = ">=3.44.6,<4"      # feedstock generator + recipe linter (NOTE: CalVer 2026.x needs the `conda` pkg, not in this env — for CI-parity lint use `pixi exec conda-smithy recipe-lint`)
[feature.conda-smithy.tasks.lint]
description = "validate all recipes with `conda-smithy`"
cmd = "conda-smithy recipe-lint --conda-forge recipes/*"

[feature.shellcheck]
# merge this with `conda-smithy` when available for `linux-ppc64le`
platforms = ["linux-64", "osx-arm64-min", "win-64"]
dependencies.shellcheck = ">=0.10.0"

[feature.gcloud-sdk]
# Heavy (~91 MB) opt-in feature carrying the `gcloud` CLI for one-time
# interactive auth (`gcloud auth application-default login`). Once
# Application Default Credentials are cached at
# `~/.config/gcloud/application_default_credentials.json`, the
# `google-cloud-bigquery` lib in the `local-recipes` env picks them up
# automatically and you don't need the `gcloud` env again until you
# want to refresh creds or switch projects.
# Linux + macOS only — google-cloud-sdk isn't on conda-forge for win-64.
platforms = ["linux-64", "osx-arm64-min"]
dependencies.google-cloud-sdk = ">=577.0.0"

# --- pyforge-mason (Mason): pixi build workspace member (warden/doctor mirror, Story 1.1) --
# Source + package manifest live in ./src/shared/packages/pyforge-mason (its own
# [package] table, no [workspace]). One hatchling pyproject is the single Python
# build backend:
#   * conda pkg   -> pixi-build-python wraps the hatchling wheel (pyforge-mason-build-conda)
#   * wheel+sdist -> `python -m build` from the same pyproject    (pyforge-mason-build-dist)
# Story 1.1 is build wiring only: dual-artifact manifest + PEP 420 namespace +
# argparse dispatcher. FR-41 forbids a CLI framework, so there is deliberately no
# click/typer here. Spec: _bmad-output/projects/pyforge-mason/planning-artifacts/.
[feature.pyforge-mason.dependencies]
pyforge-mason = { path = "src/shared/packages/pyforge-mason" }  # -> built conda pkg
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner

[feature.pyforge-mason.tasks.pyforge-mason-build-conda]
description = "Build the pyforge-mason conda package via pixi-build-python."
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-mason"   # pixi build has NO --manifest-path flag (0.73.0); siblings target the member by cwd

[feature.pyforge-mason.tasks.pyforge-mason-build-dist]
description = "Build the pyforge-mason wheel + sdist from the same hatchling pyproject."
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-mason"

[feature.pyforge-mason.tasks.pyforge-mason-build]
description = "Build BOTH pyforge-mason artifacts (conda + wheel/sdist) from one manifest."
depends-on = ["pyforge-mason-build-conda", "pyforge-mason-build-dist"]

[feature.pyforge-mason.tasks.pyforge-mason-test]
description = "Run the pyforge-mason test suite (unit + meta)."
cmd = "pytest src/shared/packages/pyforge-mason/tests -q"

# --- pyforge-steward (Steward): pixi build workspace member (warden mirror, Story 1.1) --
# Task names mirror pyforge-warden's verbatim, per the story's acceptance criteria.
# Story 1.1 delivers the package, the CLI dispatcher and the Duty contract (AD-7);
# main() is the sole owner of the exit code (AD-8). Spec:
# _bmad-output/projects/pyforge-steward/planning-artifacts/.
[feature.pyforge-steward.dependencies]
pyforge-steward = { path = "src/shared/packages/pyforge-steward" }  # -> built conda pkg
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner

[feature.pyforge-steward.tasks.pyforge-steward-build-conda]
description = "Build the pyforge-steward conda package via pixi-build-python."
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-steward"   # pixi build has NO --manifest-path flag (0.73.0); siblings target the member by cwd

[feature.pyforge-steward.tasks.pyforge-steward-build-dist]
description = "Build the pyforge-steward wheel + sdist from the same hatchling pyproject."
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-steward"

[feature.pyforge-steward.tasks.pyforge-steward-build]
description = "Build BOTH pyforge-steward artifacts (conda + wheel/sdist) from one manifest."
depends-on = ["pyforge-steward-build-conda", "pyforge-steward-build-dist"]

[feature.pyforge-steward.tasks.pyforge-steward-test]
description = "Run the pyforge-steward suite across all three tiers (unit + conformance + meta)."
cmd = "pytest src/shared/packages/pyforge-steward/tests -q"

[feature.pyforge-steward.tasks.pyforge-steward-dogfood]
description = "Steward dogfoods itself: run the CLI from the built env."
cmd = "steward --version"

# --- pyforge-marshal (Marshal): pixi build workspace member (doctor/warden mirror, Story 1.1) --
# Task names mirror the sibling convention verbatim. Story 1.1 delivers the
# package spine, the closed verdict lattice + finding-code registry
# (core/model.py, core/findings.py, core/verdict.py), the one response
# envelope (AD-14/AD-39), a --version/--help-only CLI, and the import-linter
# AD-3/AD-4 contracts. Spec:
# _bmad-output/projects/pyforge-marshal/planning-artifacts/.
[feature.pyforge-marshal.dependencies]
pyforge-marshal = { path = "src/shared/packages/pyforge-marshal" }  # -> built conda pkg
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner
import-linter = ">=2.13"                 # enforces the AD-3 seam + AD-4 purity contracts (pyproject.toml's [tool.importlinter])

[feature.pyforge-marshal.tasks.pyforge-marshal-build-conda]
description = "Build the pyforge-marshal conda package via pixi-build-python."
# NOTE: the pyforge-steward block this mirrors uses `--manifest-path`, which
# the installed pixi (0.73.0) rejects (`pixi build --help` names the flag
# `--path`); steward's own build-conda task fails identically. Using the
# correct flag here rather than propagating the same bug into a new task.
cmd = "pixi build --path src/shared/packages/pyforge-marshal --output-dir dist-conda"

[feature.pyforge-marshal.tasks.pyforge-marshal-build-dist]
description = "Build the pyforge-marshal wheel + sdist from the same hatchling pyproject."
# --no-isolation (warden/doctor precedent): without it `python -m build`
# creates an isolated venv and pip-fetches hatchling from PyPI -- dead weight
# for the hatchling provisioned above, and a hard failure air-gapped.
cmd = "python -m build --no-isolation --outdir dist src/shared/packages/pyforge-marshal"

[feature.pyforge-marshal.tasks.pyforge-marshal-build]
description = "Build BOTH pyforge-marshal artifacts (conda + wheel/sdist) from one manifest."
depends-on = ["pyforge-marshal-build-conda", "pyforge-marshal-build-dist"]

[feature.pyforge-marshal.tasks.pyforge-marshal-test]
description = "Run the pyforge-marshal test suite (unit + meta)."
cmd = "pytest src/shared/packages/pyforge-marshal/tests -q"

# --- pyforge-ci: the CI build/publish surface, layered on feature.python --------
# Deliberately its OWN feature rather than additions to feature.python: that one is
# shared by build / grayskull / conda-smithy / local-recipes / vuln-db / gcloud /
# linux / osx / win, so anything added there fattens all nine.
#
# Covers every artifact the pyforge packages publish, from one hatchling pyproject:
#   wheel + sdist -> python-build (frontend) + hatchling (backend). The build tasks
#                    pass --no-isolation, so the backend MUST be in the env; without
#                    it `python -m build` fetches its own into a temp venv (network).
#   .conda        -> pixi build via pixi-build-python / pixi-build-rattler-build.
#                    hatchling alone does NOT emit .conda — pixi-build-python wraps
#                    the hatchling wheel (see the pyforge-mason note above).
#   PyPI          -> twine.
#   GitHub release-> gh (already in feature.python).
#   conda-forge   -> nothing needed: publishing there is a PR to staged-recipes /
#                    the feedstock, and conda-forge's own CI builds and uploads.
# Pins are the repo's existing ones, unchanged, so this adds no second source of
# truth. STILL MISSING for JFrog conda uploads: anaconda-client or a jfrog CLI —
# absent from every feature today, so that target is a real gap, not just here.
[feature.pyforge-ci.dependencies]
hatchling = ">=1.31.0"                    # Python build backend (conda + wheel/sdist)
python-build = ">=1.5.0"                  # PyPA `python -m build` frontend
pytest = ">=9.1.1"                        # test runner
pixi-build-python = ">=0.8.3"             # pixi build backend -> .conda from the hatchling wheel
pixi-build-rattler-build = ">=0.4.4"      # pixi build backend -> recipe-driven .conda
twine = ">=6.2.0"                         # PyPI upload

[environments]
# default-env: local-recipes
# ^ The "default-env:" directive above tells scripts/load-env.sh which environment
# to activate by default when entering this repository. Change the value to any
# environment name defined below. If omitted, the first environment key is used.
# linux only needs Python to run build-locally.py. Everything else happens in Docker.
linux = ["linux", "python"]
# osx and win do run natively on the machine, so we need the build deps too
osx = ["osx", "python", "build"]
win = ["win", "python", "build"]
build = ["python", "build"]
grayskull = ["python", "grayskull"]
conda-smithy = ["python", "conda-smithy", "shellcheck"]
local-recipes = ["python", "build", "grayskull", "conda-smithy", "local-recipes"]
vuln-db = ["python", "vuln-db"]
gcloud = ["python", "gcloud-sdk"]
# pyforge-ci — the LEAN CI environment. feature.python gives pixi, bmad-method,
# nodejs, gh, gitpython, spec-kit + truststore; feature.pyforge-ci adds everything
# needed to BUILD and PUBLISH: wheel + sdist + .conda, to PyPI and conda-forge.
# no-default-feature keeps the fat default [dependencies] out; both features are
# referenced BY NAME, never by copied pins, so this tracks them automatically.
#
# Why it exists: CI should always have pixi, but the only env exposing the tooling
# was local-recipes at 1102 packages / ~9.8 GB — a download per Pages deploy against
# a 10 GB cache ceiling. The health detectors never needed it at all (stdlib + git;
# generate.py now runs them directly — see _run_detector), so this env carries the
# build/publish surface without the 9.8 GB.
#
# Named to match the eight sibling pyforge-* envs so it sorts with the family.
pyforge-ci = { features = ["python", "pyforge-ci"], no-default-feature = true }
# Lean standalone-tool env (NFR1/NFR2): no-default-feature excludes the fat
# default [dependencies] (python 3.14 + pixi + conda + pip + uv), so this env
# carries only the built pyforge-warden package + its conda run-deps + pytest.
pyforge-warden = { features = ["pyforge-warden"], no-default-feature = true }
# Lean atlas env (Story A1, AD-16/§ 2.5): no-default-feature excludes the fat
# default [dependencies]; loop worktrees materialize THIS env, never the fat
# local-recipes env — this is the worktree-affordability claim A3 measures.
pyforge-atlas = { features = ["pyforge-atlas"], no-default-feature = true }
# Lean doctor env (Story 1.1): no-default-feature excludes the fat default
# [dependencies]; carries only the built pyforge-doctor package + its conda
# run-deps + pytest — mirrors pyforge-warden's/pyforge-atlas's lean shape.
pyforge-doctor = { features = ["pyforge-doctor"], no-default-feature = true }
# Lean scribe env (Story 1.1, pyforge-warden mirror): no-default-feature
# excludes the fat default [dependencies], so this env carries only the
# built pyforge-scribe package + its runtime deps (typer, pydantic) + pytest.
pyforge-scribe = { features = ["pyforge-scribe"], no-default-feature = true }
# BMad Method UI dashboards (docs/specs/bmad-loop-adoption.md W4): consumes the
# LOCALLY-BUILT bmad-dashboard + mybmad-dashboard packages (consume-not-submit
# mirrors of conda-forge/staged-recipes#33513) from ./build_artifacts/linux64.
bmad-ui = { features = ["bmad-ui"], no-default-feature = true }
# Lean herald env (Story 1.1, warden/atlas mirror): no-default-feature
# excludes the fat default [dependencies]; carries only the built
# pyforge-herald package + pytest. Spec:
# _bmad-output/projects/pyforge-herald/planning-artifacts/.
pyforge-herald = { features = ["pyforge-herald"], no-default-feature = true }
# Lean mason env (Story 1.1): no-default-feature, so it carries only the built
# pyforge-mason package + pytest + the two build frontends.
pyforge-mason = { features = ["pyforge-mason"], no-default-feature = true }
# Lean steward env (Story 1.1, pyforge-warden mirror): same lean shape.
pyforge-steward = { features = ["pyforge-steward"], no-default-feature = true }
# Lean marshal env (Story 1.1, pyforge-warden mirror): no-default-feature,
# so it carries only the built pyforge-marshal package + its conda
# run-deps + pytest + import-linter.
pyforge-marshal = { features = ["pyforge-marshal"], no-default-feature = true }

[feature.local-recipes.activation]
scripts = ["scripts/load-env.sh"]
env = { PYTHONWARNINGS = "ignore:Kedro is not yet fully compatible" }  # suppress kedro Python 3.14 compat warning

[feature.local-recipes.tasks.sync-upstream-conda-forge]
description = "Sync with upstream conda-forge/staged-recipes and rebase local commits"
cmd = "bash scripts/sync-upstream-conda-forge.sh"

[feature.local-recipes.tasks.sync-upstream-public-fork]
description = "Pull the latest from the public GitHub fork and merge/rebase the local commits"
cmd = "bash scripts/sync-public-fork.sh"

[feature.local-recipes.tasks.verify-env]
description = "Verify that the shell is running inside the local-recipes pixi environment"
cmd = "bash scripts/ensure-local-recipes-env.sh"

[feature.local-recipes.tasks.env-inspect]
description = "Inspect a pixi/conda env from multiple angles: default lists root packages; flags select mode (--audit / --freshness / --security / --bus-factor / --licenses / --sbom / --diff). Defaults to the active env; pass --environment NAME or --prefix PATH to inspect any env. Add --json for machine-readable output."
cmd = "python .claude/scripts/conda-forge-expert/env_inspect.py"

[feature.local-recipes.tasks.my-feedstocks]
description = "Per-maintainer feedstock portfolio + --triage punch list (ranks by KEV/Critical CVEs, CI-red, stuck bots, upstream lag, open PRs/issues). Defaults to $GITHUB_USERNAME or $USER; override with --maintainer."
cmd = "python .claude/scripts/conda-forge-expert/my_feedstocks.py"

[feature.local-recipes.tasks.bmad-preflight]
description = "Verify local-recipes env, BMAD installation, and active project before BMAD workflows"
cmd = "bash scripts/ensure-bmad-preflight.sh"

[feature.local-recipes.tasks.bmad-drift-check]
description = "Detector: report drift between the _bmad-output/local-recipes artifacts and the live factory (pins, counts, coverage completeness, baseline, stale rules). Exits non-zero on drift. Flags: -- --fix (archive moves), -- --integrity-only, -- --write-baseline (stamp after a reconciliation). See _bmad-output/projects/local-recipes/SYNC-RUNBOOK.md."
cmd = "python scripts/bmad_drift_check.py"

[feature.local-recipes.tasks.bmad-groundtruth]
description = "Print the live ground-truth factory facts (skill version, schema, MCP tools, atlas phases, pixi envs, gotchas) as JSON — the source of truth the BMAD docs must portray."
cmd = "python scripts/bmad_drift_check.py --json"

[feature.local-recipes.tasks.dashboard-check]
description = "Detector: execute the Guildhall's own JavaScript against the live data.js and fail on any runtime error. Catches a partial derived object (e.g. timing without perStory) that passes a truthiness guard then throws, blanking every section below it. The three doc detectors and the meta suite do NOT run this code."
cmd = "node docs/dashboard/check_render.js"

[feature.local-recipes.tasks.llms-full-check]
description = "Detector: report drift between docs/reference/library-llms-full.md (the library catalog) and pixi.toml — undocumented deps, ghost entries, version-floor drift. Exits non-zero on drift. Reconciler = the regeneration prompt in the catalog header. Pass -- --json for machine output."
cmd = "python scripts/llms_full_check.py"

[feature.local-recipes.tasks.spec-surface-check]
description = "Detector: every tracked file is governed by a spec surface: manifest or explicitly allowlisted (scripts/spec_surface_allowlist.txt), and no governed file drifted without its spec's memlog moving. Exits non-zero on findings. Reconcile: update the spec (bmad-spec re-derive), then -- --write-baseline. Contract: spec-regenerable-factory CAP-3."
cmd = "python scripts/spec_surface_check.py"

[feature.local-recipes.tasks.deck-export]
description = "Regenerate a presentation deck's derived export artifacts (standalone infographic HTML + PPTX) from its Marp .md sources via marp — keeps the § Standard export set reproducible. Usage: pixi run -e local-recipes deck-export <slug> [html|deck-pptx|infographic-pptx ...] (default: all). PPTX needs Chrome. See docs/specs/presentation-deck.md."
cmd = "python scripts/deck_export.py"

[feature.local-recipes.tasks.dashboard-gen]
description = "Refresh docs/dashboard/data.js (the committed Warden+Atlas program console) from the live per-project sprint-status.yaml files — syncs each story's status + the snapshot timestamp. Local-only (the sprint-status sources are Tier-3 gitignored). Commit data.js + push to redeploy the GitHub Pages console. See docs/dashboard/README.md."
cmd = "python docs/dashboard/generate.py"

[feature.local-recipes.tasks.dashboard-dryrun]
description = "Wave D verify gate (Story D2, FR-9 / AD-8 / AD-17 / NFR-8): dashboard-dryrun — build the BSL-driven Vizro Dashboard OBJECT offline (no server, no .run()), assert each expected page is present w/ a stable id+title (deterministic layout), pages are BSL-driven (loaders route through the D1 semantic models, proven vs an independent BSL query), the factory-status page reads the real sprint-status.yaml + carries a build timestamp (AD-17), and the agent-legibility structural props hold. Runs in local-recipes (the env carrying vizro + boring_semantic_layer). Full 28-page inventory is CIS-two-spine deferred (DW-D2). Offline, --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/dashboard -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.vizro-ai-dryrun]
description = "Wave D verify gate (Story D3, FR-9 / AD-7 / AD-8 / Q3 §11): vizro-ai-dryrun — offline, no-network, no-live-LLM. Asserts the query_vizro_ai MCP tool is registered (FastMCP server + audit + package export) and callable; with NO backend env configured returns the structured 'backend not configured — attended Q3 bring-up (DW-D3)' advisory (no network, no crash, no fabricated chart); the backend resolver reads the endpoint from repo model-backend config (OPENAI_BASE_URL/ANTHROPIC_BASE_URL env) with NO hardcoded public host baked in (Q3 §11 load-bearing invariant); the tool body stays AD-7-thin (only the _nl seam); and the NL query is grounded in the D1 BSL models (AD-8). The live NL->chart invocation + the dashboard NL query field are the attended Q3 event (DW-D3). Offline, --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/nl -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.wasm-build]
description = "Wave G build step (Story G1, FR-14): build the self-contained, backend-free DuckDB-WASM read-surface artifact into src/shared/packages/pyforge-atlas/wasm/build/ (gitignored). npm-installs @duckdb/duckdb-wasm + esbuild, bundles the browser ESM (inlining apache-arrow), copies the MVP wasm module + worker, VENDORS the matching parquet extension locally (so the runtime never hits extensions.duckdb.org), and materializes the demo Parquet from wasm/data/feedstock_health.csv. BUILD-TIME network is allowed (npm + the extension host); the artifact it produces runs fully OFFLINE. Run this once before wasm-smoke."
cmd = "python src/shared/packages/pyforge-atlas/wasm/build.py"

[feature.local-recipes.tasks.wasm-smoke]
description = "Wave G verify gate (Story G1, FR-14 / AD-11 / AD-21): wasm-smoke — a Playwright HEADLESS Chromium load-and-query against the built wasm artifact (run `wasm-build` first). Proves the intelligence read surface loads and its query runs CLIENT-SIDE in the browser with NO backend: serves wasm/build/ over a loopback static host, drives the pre-provisioned Chromium, BLOCKS + asserts zero non-loopback requests (offline / no-CDN proof), waits for the in-browser DuckDB-WASM query to reach ready (an in-page error FAILS, never silently passes), and asserts the client-side ci_red result (D1 feedstock-health semantics). Full Vizro-in-Pyodide render is deferred (DW-G1). Offline at runtime, --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/wasm -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.publish]
description = "Wave G build step (Story G2, FR-14 / AD-2): emit the host-agnostic static-host layout — chunked Parquet + a single-owner manifest.json — for the demo core_feedstock_health dataset into src/shared/packages/pyforge-atlas/src/pyforge/atlas/publish/_site/ (gitignored). The emitter targets a filesystem PATH ('the static host filesystem'); WHICH host serves it (GitHub Pages public path, or an enterprise mirror) is a deploy choice, never baked in. Fully local + offline. The LIVE GitHub Pages publish is the ATTENDED boundary event and is DEFERRED (DW-G2)."
cmd = "python -m pyforge.atlas.publish"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.publish-range]
description = "Wave G verify gate (Story G2, FR-14 / AD-2 / AD-21): publish-range — prove the emitted static-host layout is consumed via HTTP RANGE. Emits the chunked Parquet + manifest to a tmp dir, serves it over a Range-capable loopback host, points a DuckDB httpfs client at it, and asserts (a) consumption is via 206 Partial Content reading STRICTLY FEWER bytes than the whole file (a whole-file 200 FAILS), (b) the chunk path is discovered FROM the manifest + matches its checksums, (c) host-agnostic (same dir, two bases), (d) the D1 ci_red result is correct over the range-served Parquet — plus determinism + edge cases (empty/multi-chunk/corruption/past-EOF/non-Range fallback). httpfs LOADed OFFLINE from cache (skips if unprovisioned locally, fails under CI). Live publish DEFERRED (DW-G2). --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/publish -q"
# PUBLISH_RANGE_REQUIRED: the AUTHORITATIVE gate must FAIL (not skip) if httpfs is
# unprovisioned, so it can never exit 0 having proven nothing about HTTP Range — the
# load-bearing G2 claim (Reviewer-A skip-to-green). Ad-hoc local runs use the bare pytest.
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src", PUBLISH_RANGE_REQUIRED = "1" }


