[feature.guild-tasks.tasks.live-proof-surface-check]
description = "Detector: a touched surface catalogued in live-proof-surfaces.md gets an advisory finding naming it (Story 26.1, spec-pyforge-doctor CAP-77). Matches ONLY the catalog's hand-authored Surface globs column against origin/main..HEAD -- never a keyword pulled from prose (the first attempt's substring fallback matched unrelated real files; amended 2026-09-20). Quotes the catalog's own 'how to prove it live' cell verbatim, including the atlas Chromium/DuckDB/WASM row's honest named gap. Warn-only, read-only, fail-open -- never a second PR gate."
cmd = "python -m pyforge.doctor.sources live-proof-surface"

[feature.guild-tasks.tasks.chain-completeness-check]
description = "Detector: a station's board tells the truth about what it OWNS and what it has DONE. INV-A every open Spec a station owns is decomposed into its chain, or is registered in DEFERRED_SPECS with a reason (Marshal's PRD decomposed 2 of 24; Steward rendered 18/18 while owning three undecomposed drafts). INV-B epics.md story ids == the tracked ledger's keys, both directions (Doctor rendered complete 16/16 while carrying a story with no ledger key). INV-C the Guildhall build line == the ledger (Herald rendered 12/19 against a ledger of 47/47). Reports UNMEASURABLE rather than inventing orphans for projects keying stories non-numerically by design. Every one of these needed a human to notice."
cmd = "python -m pyforge.doctor.sources chain-completeness"

[feature.guild-tasks.tasks.chain-currency-sweep-check]
description = "Detector: the eight station planning spines are CURRENT -- the CAP-3 chain audit's staleness + coherence checkpoints swept across all 8 stations in one run (layers/orphans deliberately excluded: they are chain-completeness policy work, and folding the deck gap in would make this permanently red). scope=repo -- reads tracked planning artifacts, dreams, and tracked ledgers only. Exit 0 current / 1 findings (run the reconciler per _bmad-output/projects/pyforge-doctor/CHAIN-CURRENCY-RUNBOOK.md) / 2 could-not-run. Flags: -- --json, -- --project <slug>. Contract: docs/dreams/chain-currency-sweep.md."
cmd = "python scripts/chain_currency_sweep_check.py"

[feature.guild-tasks.tasks.governance-currency]
description = "Detector: every skill, script and path named in the governance documents (_bmad-output/EXEMPLAR-STANDARD.md, AGENTS.md, CLAUDE.md, docs/reference/test-charter.md) still resolves. Story 32.6 / spec-fleet-consistency-standard CAP-6, written because EXEMPLAR-STANDARD spent two BMAD versions naming four skills that had not existed since 6.11 with no gate noticing -- INV-4's argument applied to the prose that governs the detectors. A name resolves as a skill, a script or a pixi task/dependency, all derived from the tree; deliberate historical citations are exempted only by an explicit governance-currency:ignore-start/end marker, never a heuristic. scope=repo. Exit 0 clean / 1 findings / 2 could-not-run. Flags: -- --json, -- --file <path>."
cmd = "python scripts/governance_currency_check.py"

[feature.guild-tasks.tasks.chain-layers-audit-check]
description = "Detector: Stories 17-3 + 21-1 / FR-150 + FR-192 CAP-3 — read-only per-project chain audit. Pass/fail per checkpoint (layers, coherence, staleness, orphan-freedom) seeded from pyforge.doctor.sources.fleet_scan + dream-chain (never a cached table). Distinct from chain-completeness INV-A..D and dreams-hygiene. Pass -- --project <slug> (required). Exit non-zero on checkpoint fail."
cmd = "python -m pyforge.doctor.sources chain-completeness --layers"

[feature.guild-tasks.tasks.ledger-regression-check]
description = "Detector: no commit un-finishes a story in a tracked sprint ledger. The OUTERMOST of three guards on the same failure: promote_sprint_status.py refuses the write, --project bounds the blast radius, and this compares two TRACKED files across a revision range so it holds even when those are bypassed, hand-edited, or --allow-regression-ed. Reads only the tracked twin via git show, so it runs in bare CI where the gitignored Tier-3 feeds are invisible — the asymmetry that let one sync destroy 96 `done` markers across four stations on 2026-08-08 while printing success. `done` is the only guarded state; reopening a story is legitimate but must be its own commit. Compares origin/main..HEAD."
cmd = "python -m pyforge.doctor.sources ledger-regression"

[feature.guild-tasks.tasks.ad-citation-check]
description = "Detector: every architecture-decision citation resolves to exactly one spine. FAILs on an `AD-n` that names no AD anywhere in the fleet; reports (advisory) any project whose several spines share an id range, which makes a bare `AD-n` there unresolvable without reading the citing file. Measured 2026-09-08 at first run: 11,198 citations across 935 files, ZERO broken, 172 legitimately cross-project, and steward the one project with overlapping spines. The graph being healthy is exactly why a bulk renumber is dangerous -- it can only subtract correctness."
cmd = "python scripts/ad_citation_check.py"

[feature.guild-tasks.tasks.bmad-cursor-mdc-check]
description = "Detector: generated Cursor .mdc rules for the bmad-build / bmad-build-auto pilot match their SKILL.md sources (Marshal Stories 45.1–45.2 / spec-bmad-cursor-interactive-routing CAP-2 OQ-3). scope=repo. Exit 0 clean / 1 findings / 2 could-not-run. -- --write regenerates the two files."
cmd = "python scripts/bmad_cursor_mdc_check.py"

[feature.guild-tasks.tasks.bmad-cursor-mdc-generate]
description = "Regenerate .cursor/rules/bmad-build.mdc and bmad-build-auto.mdc from the pilot SKILL.md files (Marshal Story 45.1)."
cmd = "python scripts/bmad_cursor_mdc_check.py --write"

[feature.guild-tasks.tasks.memlog-fidelity-check]
description = "Harness: inventory every spec SPEC.md and architecture ARCHITECTURE-SPINE.md across the eight stations; verify sibling .memlog.md exists; optionally diff scratch bmad-spec/bmad-architecture re-derives against live rendered files (--compare SCRATCH). Reconcile by memlog append then headless re-derive (see --invoke-hints). Contract: spec-44-13-memlog-fidelity / fnd:AD-20."
cmd = "python scripts/memlog_fidelity_check.py"

[feature.guild-tasks.tasks.ledger-direction-check]
description = "Detector: the tracked sprint ledger versus git merge history, WITH DIRECTION (marshal FR-137/FR-138). `landed-but-unpromoted` — merge history names a story the ledger has not marked done — is the FAIL half and the incident this exists for. `done-but-unmerged` is advisory (WARN, never reds the run): a done flip absent from the ledger at the base ref AND unnamed by any merge subject. Both read git only, never the gitignored Tier-3 sprint-status.yaml — a statement of intent is not evidence of landing."
cmd = "python -m pyforge.doctor.sources ledger-direction"

[feature.local-recipes.tasks.dashboard-layout-check]
description = "Detector: the Guildhall console bar LOOKS right, not merely that its JavaScript runs (which is all check_render.js proves). Asserts chip edges, no overlap per row, one row above the 720px breakpoint, and no chip clipping its own label — across 6 viewport widths x 5 font-pressure steps via headless Chrome. Font pressure rather than live content, because both bugs it was written for are a function of text width and the live board is whatever it happens to be that minute. Reports UNKNOWN (exit 2) without a browser rather than claiming green. Contract: docs/dreams/fidelity-enforcement.md."
cmd = "python -m pyforge.doctor.sources check-layout"

[feature.guild-tasks.tasks.fleet-picture]
description = "PyForge fleet progress REPORT: per-station done / in-progress / projected / blocked, plus an ATTENTION block naming anything that needs a human (escalation, dead run, idle-with-backlog, open PR). Read-only and NEVER gating -- always exits 0, unlike the six detectors. Counts come from each station's TRACKED planning-artifacts/sprint-status-ledger.yaml (the twin of the gitignored Tier-3 feed), never from an ad-hoc regex over commit subjects and never from docs/dashboard/data.js, which lags until a merge to main. Running stations are detected live from `marshal status --format json`, so a finished run flips to `complete` on its own rather than rotting in a hardcoded list."
cmd = "python scripts/fleet_picture.py"

[feature.local-recipes.tasks.fleet-poll-hourly]
description = "Background hourly fleet poll at :30 past each hour — git pull/push on main and all pyforge loop homes, then emit AGENT_LOOP_TICK_fleet-poll to wake an agent for fleet-picture. Log: .cursor/fleet-poll.log"
cmd = "bash scripts/fleet-poll-hourly.sh"

[feature.guild-tasks.tasks.unpushed-work-check]
description = "Detector: no work exists only on this disk — local branches carrying unique content that are on no remote, plus dangling commits holding real work that `git gc` may collect without warning. scope=runtime and deliberately NOT in CI: a runner has neither local branches nor dangling objects, so this check would pass vacuously there, which is a false green of the purest kind. Live cost 2026-07-31 when nothing checked: six station loop branches, ~5,150 lines on recover/*, herald 1.2's 734-line transport story (spec included) unpushed for six days, 156 dangling commits, and marshal 1.8's 1,748 lines committed 40 minutes earlier. Flags: -- --branches-only (skip the fsck scan), -- --min-files N, -- --json. Contract: docs/dreams/fidelity-enforcement.md. The standing signal for between-runs staleness now that the standalone interval-push watcher is retired (Story 4.15/FR-177): S-3.10's tip comparison already covers `loop/*` station branches."
cmd = "python scripts/unpushed_work_check.py"

[feature.guild-tasks.tasks.mason-cfe-surface-check]
description = "Detector (FR-45/AD-15): Mason (src/shared/packages/pyforge-mason/**) never modifies the conda-forge-expert surface (.claude/skills/conda-forge-expert/**, .claude/scripts/conda-forge-expert/**, .claude/tools/conda_forge_server.py). Scans every commit touching the mason path (derived range, no hardcoded baseline) and flags any non-sanctioned one that also touches CFE — exactly one exception is allowed: a commit whose subject starts `retro:` AND whose diff includes the CFE CHANGELOG.md (subject alone never launders a CFE touch); a second such commit is itself a finding (`exception-reused`). scope=repo — reads tracked commit history only. Exits non-zero on any finding. Pass -- --json for machine output. Contract: _bmad-output/projects/pyforge-mason/planning-artifacts (Story 5.2)."
cmd = "python scripts/mason_cfe_surface_check.py"

[feature.guild-tasks.tasks.cfe-rebuild-guard-check]
description = "Detector (Epic 6/Story 6.2, clause (d) added by Story 12.4): guards the CFE-rebuild campaign against silent divergence and a stalled endgame. Reads campaign-state.yaml + bounded git history for four clauses: (a) stale-equivalence — any slice with status parallel/audited/cut-over must have equivalence: green; (b) unmirrored-retro — for every slice with a brief_path set, a landed CFE Rule-2 retro (a commit since the Story-6.1 landing merge touching both the CFE surface and CHANGELOG.md, no commit-subject pattern involved) must be mirrored into brief_mirrored_through; (c) legacy-caller-at-endgame — once campaign.endgame_declared is true, no campaign.callers entry may still resolves_to: legacy; (d) gate-bypassed — a brief_path set on any slice of order >= 2 while campaign.re_scope_gate.pre_conditions does not record all four named pre-conditions closed or waived. scope=repo — reads tracked commit history only. Exits non-zero on any finding. Pass -- --json for machine output, -- --since <sha> to override the clause-(b) lower bound. Contract: _bmad-output/projects/pyforge-mason/planning-artifacts (Story 6.2)."
cmd = "python scripts/cfe_rebuild_guard_check.py"

[feature.guild-tasks.tasks.detectors]
description = "Run EVERY detector, discovered from the filesystem rather than a hand-written list — the registry fails on its own gaps (a detector with no pixi task, or a check script declaring no scope). Exit 0 pass, 1 findings, 2 could-not-run: a detector that cannot run reports unknown, NEVER green. Flags: -- --scope repo|runtime|all, -- --list, -- --json."
cmd = "python scripts/detectors.py"

[feature.guild-tasks.tasks.detectors-ci]
description = "The CI-safe detector subset: scope=repo only, i.e. those reading tracked files alone. retired-console-check (dashboard-drift reintroduction gate) is repo-scope. Remaining scope=runtime detectors (e.g. loop-stall-check) observe gitignored Tier-3 feeds, tmux and ~/.bmad-loops, which do not exist on a runner — that exclusion is the missing observation plane showing up as a deployment constraint, not a convenience."
cmd = "python scripts/detectors.py --scope repo"

[feature.guild-tasks.tasks.pyforge-station-tests]
description = "Run pyforge-core's suite + every PyForge station's own pytest suite locally, mirroring .github/workflows/pyforge-station-tests.yml's core-test + per-station jobs — the exact set that ALL fire together whenever pixi.toml/pixi.lock/pyforge-core/pyforge-testing-kit changes (that workflow's shared-surface rule), which is easy to miss since most day-to-day PRs only touch one station and never see this combination locally. Added 2026-09-14 after a 5-day GitHub Actions billing outage let ~260 PRs merge with this workflow never actually running; a pixi.toml dep bump was the first push afterward to touch shared surface, and it surfaced 5 days of accumulated drift (doctor/marshal/mason) all at once. The pyforge-core leg (Story 52.2, spec-pyforge-core CAP-8) runs FIRST: it is the cheapest (~10 s) and fails fastest, and its sole-ownership meta-tests scan every station's tree, so a station-only change can red it. Fails fast (first red leg stops the run) and covers only pyforge-core's `pyforge-core-test` plus each station's own `pyforge-<station>-test` task — NOT atlas's Chromium/DuckDB/WASM setup, herald's browser check, scribe's Postgres+pgvector service (see `scribe-pg-up`), or the separate guild-container job; run those stations' own CI-mirroring steps first if you touched them. Run this before pushing any pixi.toml/pixi.lock/pyforge-core/pyforge-testing-kit change."
# Declarative cross-environment depends-on, NOT a shell loop. The original
# 2026-09-14 landing used `set -euo pipefail` + a bash `for`, which pixi's task
# shell (deno_task_shell) cannot parse -- so this task errored out on its very
# first token and never ran a single station. Caught 2026-09-14 on the first
# real invocation. depends-on runs the nine in order (core first), stops at the
# first red, and needs no shell at all.
depends-on = [
  { task = "pyforge-core-test", environment = "pyforge-core" },
  { task = "pyforge-atlas-test", environment = "pyforge-atlas" },
  { task = "pyforge-doctor-test", environment = "pyforge-doctor" },
  { task = "pyforge-herald-test", environment = "pyforge-herald" },
  { task = "pyforge-marshal-test", environment = "pyforge-marshal" },
  { task = "pyforge-mason-test", environment = "pyforge-mason" },
  { task = "pyforge-scribe-test", environment = "pyforge-scribe" },
  { task = "pyforge-steward-test", environment = "pyforge-steward" },
  { task = "pyforge-warden-test", environment = "pyforge-warden" },
]

[feature.guild-tasks.tasks.pyforge-station-coverage-gates]
description = "Run every station's CI-mirroring coverage gate (scripts/coverage_gates_ci.py, touched modules, 80% unit floor) in its own pixi env — the local twin of .github/workflows/coverage-gates.yml's `named-module-gates` matrix. Declarative depends-on, never a shell loop (pixi's task shell cannot parse one; see pyforge-station-tests)."
depends-on = [
  { task = "pyforge-atlas-coverage-gate", environment = "pyforge-atlas" },
  { task = "pyforge-doctor-coverage-gate", environment = "pyforge-doctor" },
  { task = "pyforge-herald-coverage-gate", environment = "pyforge-herald" },
  { task = "pyforge-marshal-coverage-gate", environment = "pyforge-marshal" },
  { task = "pyforge-mason-coverage-gate", environment = "pyforge-mason" },
  { task = "pyforge-scribe-coverage-gate", environment = "pyforge-scribe" },
  { task = "pyforge-steward-coverage-gate", environment = "pyforge-steward" },
  { task = "pyforge-warden-coverage-gate", environment = "pyforge-warden" },
]

[feature.guild-tasks.tasks.pr-preflight]
description = """Run locally, before pushing, everything a PR to rxm7706/local-recipes actually gates on. One command, so a green local run means a green CI run.

Covers the four lanes that red a PR: `detectors-ci` (the CI detector subset), `test-ci` (the CFE regression suite — this is the lane that owns the spec-surface meta-test), `pyforge-station-tests` (pyforge-core + all 8 station suites, which ALL fire together on any shared-surface change), and `pyforge-station-coverage-gates` (the touched-module coverage floors).

Added 2026-09-14 after PR #1355 went red on two lanes that had NO local equivalent: `cfe-regression-net` failed on a stale spec-surface baseline (a scoped `--write-baseline` had been taken, then a governed file was edited again, silently invalidating it), and `named-module-gates (doctor)` failed on a coverage floor that only measures modules a branch touches — so it had been latent for weeks and surfaced on an unrelated edit. Neither was reachable from `detectors` or `pyforge-station-tests`.

NOT covered (needs Docker/podman or a live service): the container/guild-container jobs, atlas's Chromium/DuckDB/WASM setup, herald's browser check, and scribe's Postgres+pgvector service (`scribe-pg-up` first, or scribe's durable GraphStore tests error).

Runs from `-e pyforge-guild` (the session default) as well as `-e local-recipes`: the `test-ci` leg is pinned to `local-recipes` because the CFE regression suite is a factory task that lives only there (found 2026-09-16, steward Story 63.1 -- the first `pr-preflight` from the Guild env failed with "could not find the task 'test-ci'"), the same per-leg pinning the two station aggregates already use. Fifth leg added the same day: `scripts-suite` (`tests/scripts`, the detectors.yml job `pyforge-doctor-scripts-test` in `-e pyforge-ci`) redded PR #1388 on a test that pinned a task to `feature.local-recipes` -- a CI lane this aggregate did not cover, the very gap it exists to close. Sixth leg added 2026-09-18 (herald Story 24.2, spec-pyforge-herald CAP-49, closes DW-FU-23-5): `site-check` (`-e site`) mirrors the new `docsite-check.yml` `pull_request` lane -- until then no `pr-preflight` leg, and no PR-gating CI lane at all, ran `docsite/build.py`, so a broken family-page template could merge with every gate green. Seventh leg added 2026-09-20 (doctor Story 30.2 review pass): `docs-map-render-test` -- a `tests/scripts/` file needing jsonschema (unavailable in `pyforge-ci`, which `pyforge-doctor-scripts-test` already covers for the stdlib-only subset) needs its OWN leg here rather than silently only ever skipping."""
depends-on = ["lint-types", "detectors-ci", { task = "test-ci", environment = "local-recipes" }, { task = "pyforge-doctor-scripts-test", environment = "pyforge-ci" }, "docs-map-render-test", "pyforge-station-tests", "pyforge-station-coverage-gates", { task = "site-check", environment = "site" }]

[feature.local-recipes.tasks.eval-quality-smoke]
description = "Story 45.2: compiles the shipped bmad-eval-quality dev corpus's own worked example (satisfied-declarations.json) plus this repo's own pilot contract (evals/review-catches-planted-defect/contract.json) — a cheap sanity check that the installed eval-quality CLI and this pilot's contract still agree with the published EvalContract schema. Not a gate: never joins detectors/detectors-ci. See evals/review-catches-planted-defect/driver.py."
cmd = "python evals/review-catches-planted-defect/driver.py smoke"

[feature.local-recipes.tasks.eval-quality-review-twin-run]
description = "Story 45.2 (spec-45-2-the-reviewer-is-measured-against-a-planted-defect): drives the edge-case-hunter review layer headlessly via `claude -p` against a clean and a mutated arm of a planted boundary-condition defect (pkg/discount.py:17, >= flipped to >), then runs the real eval-quality preflight/score pipeline over both. One trial by default; pass `-- --trials N` for N trials per arm, aggregated into a catch-rate. Measurement harness, not a gate — never joins detectors/detectors-ci. Always exits 0: each arm/trial's `eval-quality score` exit is measurement data, printed per-trial and as a worst-case summary line, never propagated as this task's own exit code."
cmd = "python evals/review-catches-planted-defect/driver.py twin-run"

[feature.local-recipes.tasks.eval-quality-review-replay]
description = "Story 45.2: re-scores a previously sealed run record from an eval-quality-review-twin-run invocation (same --out-dir) without re-invoking `claude -p`. Usage: pixi run -e local-recipes eval-quality-review-replay -- <path-to-a-*-record.json>. Missing record file exits non-zero with a clear message. Not a gate: never joins detectors/detectors-ci."
cmd = "python evals/review-catches-planted-defect/driver.py replay"

[feature.guild-tasks.tasks.sprint-ledger-sync]
description = "Promote each project's Tier-3 story-status map to its TRACKED twin at planning-artifacts/sprint-status-ledger.yaml. implementation-artifacts/ is gitignored wholesale, so sprint-status.yaml is invisible to CI. Written in the feed's own shape so fleet_scan.parse_sprint_status reads both. Idempotent; run it when a story lands, then commit."
cmd = "python scripts/promote_sprint_status.py"

[feature.guild-tasks.tasks.retired-console-check]
description = "FR-7 / Story 30.2: fail if the retired Guildhall generator, data.js, or the four dashboard-gen/watch/check/drift pixi tasks are reintroduced. Kedro-Viz is out of scope."
cmd = "python -m pyforge.doctor.sources dashboard-drift"

[feature.local-recipes.tasks.dashboard-serve]
description = "Serve the pyforge-atlas Vizro dashboard locally (DW-D2-3's missing entrypoint): builds via the same build_dashboard() the 34-page dashboard-dryrun gate exercises, then .run()s a local dev server -- foreground, 127.0.0.1:8050 by default (-- --port N to change), no daemon. dashboard-dryrun proves the OBJECT builds; this is how you LOOK at it."
cmd = "python scripts/dashboard_serve.py"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.dashboard-dryrun]
description = "Wave D verify gate (Story D2, FR-9 / AD-8 / AD-17 / NFR-8): dashboard-dryrun — build the BSL-driven Vizro Dashboard OBJECT offline (no server, no .run()), assert each expected page is present w/ a stable id+title (deterministic layout), pages are BSL-driven (loaders route through the D1 semantic models, proven vs an independent BSL query), the factory-status page reads the real sprint-status.yaml + carries a build timestamp (AD-17), and the agent-legibility structural props hold. Runs in local-recipes (the env carrying vizro + boring_semantic_layer). Full 34-page inventory shipped (Story 20.5 CAP-7 + Story 21.9 CAP-5 — closes DW-D2-1); Story 22.5 adds identity catalog/ops/workbook canvas-vs-Vizro parity coverage (test_identity_parity.py). This suite also runs the Playwright e2e + §2.1 semantic-HTML/ARIA navigation check (test_dashboard_e2e.py), which launches a real local server -- not fully offline despite the gate's name. --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/integration/dashboard -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.vizro-ai-dryrun]
description = "Wave D verify gate (Story D3, FR-9 / AD-7 / AD-8 / Q3 §11): vizro-ai-dryrun — offline, no-network, no-live-LLM. Asserts the query_vizro_ai MCP tool is registered (FastMCP server + audit + package export) and callable; with NO backend env configured returns the structured 'backend not configured — attended Q3 bring-up (DW-D3)' advisory (no network, no crash, no fabricated chart); the backend resolver reads the endpoint from repo model-backend config (OPENAI_BASE_URL/ANTHROPIC_BASE_URL env) with NO hardcoded public host baked in (Q3 §11 load-bearing invariant); the tool body stays AD-7-thin (only the _nl seam); and the NL query is grounded in the D1 BSL models (AD-8). The live NL->chart invocation + the dashboard NL query field are the attended Q3 event (DW-D3). Offline, --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/unit/nl -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.wasm-build]
description = "Wave G build step (Story G1, FR-14): build the self-contained, backend-free DuckDB-WASM read-surface artifact into src/shared/packages/pyforge-atlas/wasm/build/ (gitignored). npm-installs @duckdb/duckdb-wasm + esbuild, bundles the browser ESM (inlining apache-arrow), copies the MVP wasm module + worker, VENDORS the matching parquet extension locally (so the runtime never hits extensions.duckdb.org), and materializes the demo Parquet from wasm/data/feedstock_health.csv. BUILD-TIME network is allowed (npm + the extension host); the artifact it produces runs fully OFFLINE. Run this once before wasm-smoke."
cmd = "python src/shared/packages/pyforge-atlas/wasm/build.py"

[feature.local-recipes.tasks.wasm-smoke]
description = "Wave G verify gate (Story G1, FR-14 / AD-11 / AD-21): wasm-smoke — a Playwright HEADLESS Chromium load-and-query against the built wasm artifact (run `wasm-build` first). Proves the intelligence read surface loads and its query runs CLIENT-SIDE in the browser with NO backend: serves wasm/build/ over a loopback static host, drives the pre-provisioned Chromium, BLOCKS + asserts zero non-loopback requests (offline / no-CDN proof), waits for the in-browser DuckDB-WASM query to reach ready (an in-page error FAILS, never silently passes), and asserts the client-side ci_red result (D1 feedstock-health semantics). Full Vizro-in-Pyodide render is deferred (DW-G1). Offline at runtime, --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/integration/wasm -q"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.publish]
description = "Wave G build step (Story G2, FR-14 / AD-2): emit the host-agnostic static-host layout — chunked Parquet + a single-owner manifest.json — for the demo core_feedstock_health dataset into src/shared/packages/pyforge-atlas/src/pyforge/atlas/publish/_site/ (gitignored). The emitter targets a filesystem PATH ('the static host filesystem'); WHICH host serves it (GitHub Pages public path, or an enterprise mirror) is a deploy choice, never baked in. Fully local + offline. The LIVE GitHub Pages publish is the ATTENDED boundary event and is DEFERRED (DW-G2)."
cmd = "python -m pyforge.atlas.publish"
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src" }

[feature.local-recipes.tasks.publish-range]
description = "Wave G verify gate (Story G2, FR-14 / AD-2 / AD-21): publish-range — prove the emitted static-host layout is consumed via HTTP RANGE. Emits the chunked Parquet + manifest to a tmp dir, serves it over a Range-capable loopback host, points a DuckDB httpfs client at it, and asserts (a) consumption is via 206 Partial Content reading STRICTLY FEWER bytes than the whole file (a whole-file 200 FAILS), (b) the chunk path is discovered FROM the manifest + matches its checksums, (c) host-agnostic (same dir, two bases), (d) the D1 ci_red result is correct over the range-served Parquet — plus determinism + edge cases (empty/multi-chunk/corruption/past-EOF/non-Range fallback). httpfs LOADed OFFLINE from cache (skips if unprovisioned locally, fails under CI). Live publish DEFERRED (DW-G2). --frozen."
cmd = "python -m pytest src/shared/packages/pyforge-atlas/tests/integration/publish -q"
# PUBLISH_RANGE_REQUIRED: the AUTHORITATIVE gate must FAIL (not skip) if httpfs is
# unprovisioned, so it can never exit 0 having proven nothing about HTTP Range — the
# load-bearing G2 claim (Reviewer-A skip-to-green). Ad-hoc local runs use the bare pytest.
env = { PYTHONPATH = "src/shared/packages/pyforge-atlas/src:src/shared/packages/pyforge-warden/src", PUBLISH_RANGE_REQUIRED = "1" }


[feature.local-recipes.tasks.submit-pr]
description = "Submit a recipe PR to conda-forge/staged-recipes (use --dry-run first). Runs prepare-pr internally then opens the PR."
