#                             VVVVVV  minimum `pixi` version
"$schema" = "https://pixi.sh/v0.80.0/schema/manifest/schema.json"

[workspace]
name = "staged-recipes"
preview = ["pixi-build"]  # enable the pixi build backend for the ./src/shared/packages/pyforge-warden workspace member (Option B). Only unlocks [package]/build tables; does not change the rattler-build recipe workflow.
# NOTE: Gemini PR#49 suggested a `[workspace] members = [...]` key, but pixi
# (through 0.72.2) has no such key — workspace members are declared via path
# dependencies (see [feature.pyforge-warden.dependencies]).
requires-pixi = ">=0.80.0"  # single pixi floor for the workspace. SIXTEEN places carry a pixi version and must be kept in step. COUNT THE LIST, DO NOT TRUST THE NUMERAL — two earlier revisions of this comment stated a total its own enumeration contradicted (see below), so the enumeration is the authority: (1) this key (floor), (2) the `"$schema"` URL two lines above (EXACT), (3-5) feature.python/local-recipes/build `pixi = ">=0.77.0"` (3 floors), (6) `environment.yaml`'s `pixi >=0.77.0` (floor, DERIVED — regenerate, never hand-edit), (7) the `pixi-version` pin in .github/workflows/dashboard.yml (EXACT), (8) the same pin in .github/workflows/kedro-viz-publish.yml (EXACT), (9-11) THREE such pins in .github/workflows/herald-live-demo.yml (EXACT), (12) the same pin in .github/actions/sync-pypi-mappings/action.yml (EXACT), (13) the micromamba create-arg in .github/workflows/staged-recipes-linter.yml (floor), (14) the root Containerfile's builder-stage `ghcr.io/prefix-dev/pixi:` image tag (EXACT, Story 7.1), (15) `src/platform/Containerfile`'s builder-stage image tag (EXACT, Story 10.3), and (16) `src/platform/compose/dbgpt/Containerfile`'s builder-stage image tag (EXACT, Story 10.5 -- the site this same 2026-08-21 pass discovered had NEVER been registered here at all, see below). AS OF 2026-08-21, ALL SIXTEEN ARE 0.77.0, and for the first time this is ENFORCED, not just asserted: `scripts/pixi_version_registry.py` is now the single source of truth for every site (this comment is a narrative pointer to it, not the registry), `pixi run -e local-recipes pixi-version-check` (repo-scope, CI-safe) fails on any drift, and `pixi run -e local-recipes bump-pixi-version -- <version>` rewrites every site plus regenerates environment.yaml in one pass. Read the rest of this comment as history, not as an instruction to hand-edit anything below the requires-pixi key above -- the registry is authoritative now.

# The road to that registry, preserved as motivation for why it exists.
# Read that sentence as the CURRENT STATE, not as history: an earlier revision said "NINE places … ALL NINE ARE 0.76.1", the state DW-7-1-2 recorded and resolved on 2026-08-09, and everything except the root Containerfile has since moved to 0.76.2. The TOTAL has now been wrong three times: it omitted herald-live-demo.yml's three pins, then Story 10.3 added a site of its own, then a revision numbered the list correctly while leaving the headline at THIRTEEN — the numeral is the part that rots, which is why counting the enumeration beats reading the total. DW-7-1-2 itself is RESOLVED (see the pyforge-steward deferred-work ledger); what survives it is its residual, restated here: the four-plus EXACT sites are the sharp ones — any one below this floor installs a pixi that refuses to parse this manifest, which is exactly the failure `sync-pypi-mappings` shipped at 0.73.0. 0.71+ is a hard floor regardless: the named platform entry `osx-arm64-min` ({ name, platform, macos }) replaced the deprecated [system-requirements] table and older pixi cannot read it. The pin sites should follow the LOCK'S PRODUCER, the rule dashboard.yml states for itself ("pixi-version stays pinned to the lock's producer... Bump it in step with pixi.lock"). NOTHING ENFORCES ANY OF THIS — the equality is comment-maintained, which is how it drifted three ways before, how the herald pins and the root Containerfile went unnoticed, and how this very sentence's own total went stale three times; a detector is the durable fix -- and, as of the dbgpt-sidecar Containerfile's discovery (a FOURTH drift, an entire unregistered site rather than a stale numeral), finally exists: see the requires-pixi comment above.
description = "The entry point to conda-forge"
version = "0.2.0"
license = "BSD-3-Clause"
license-file = "LICENSE.txt"
authors = ["@conda-forge/core"]
channels = ["conda-forge", "SelfExplainML"]
platforms = [
    "linux-64", "win-64",
    # "osx-arm64-min" = the osx-arm64 subdir with a declared minimum macOS
    # (a virtual-package FLOOR, not a pin: it states the oldest Mac the lock
    # must support; newer macOS always satisfies it). Currently 14.5 (Sonoma),
    # the exact minimum demanded by mlx 0.31.2+ (__osx >=14.5); bump only when
    # a dependency requires it. This named-entry form is the pixi 0.71+
    # replacement for the deprecated [system-requirements] table; feature
    # `platforms` lists must reference it by name — a plain "osx-arm64"
    # entry would error.
    { name = "osx-arm64-min", platform = "osx-arm64", macos = "14.5" },
    # TODO: add osx-64 / linux-aarch64 / win-arm64 (+ in the features below)
    # when the full dep set resolves on them.
]

[feature.python.dependencies]
python = ">=3.14.7,3.14.*"        # Python language interpreter
pixi = ">=0.80.0"                 # Pixi package & environment manager
gh = ">=2.100.0"                  # GitHub CLI for PR / issue / repo automation
gitpython = ">=3.1.62"            # Pythonic Git wrapper for complex repo interactions
nodejs = ">=24.19.0,<27.0,!=25.*"  # Pin to LTS version -- allows the 24.x and 26.x LTS lines; excludes 25.x (Node's odd/non-LTS release)
pnpm = ">=12.4.1"                 # Fast disk-efficient Node package manager
bmad-method = ">=6.12.0"          # BMAD agent-driven dev framework (planning + dev skills)
spec-kit = ">=1.0.5"              # Spec-kit for spec-driven development
truststore = ">=0.10.4"           # OS trust store for corporate CA / JFrog TLS
# pixi upgrade --pinning-strategy latest-up --exclude conda-libmamba-solver --exclude conda-build --exclude conda-index --exclude conda-forge-ci-setup --exclude conda-forge-pinning --exclude frozendict --exclude networkx --exclude rattler-build-conda-compat --exclude grayskull --exclude conda-recipe-manager --exclude conda-smithy --exclude shellcheck --exclude python --exclude django --exclude wagtail --exclude nodejs --exclude coderedcms
# Canonical upgrade command (19 excludes). tomlkit / structlog / sqlglot / pyarrow / pandas
# no longer need excluding: their ceilings came from upstream package metadata, not from us.
# pixi upgrade --pinning-strategy latest-up --exclude conda-libmamba-solver --exclude conda-build --exclude conda-index --exclude conda-forge-ci-setup --exclude conda-forge-pinning --exclude frozendict --exclude networkx --exclude rattler-build-conda-compat --exclude grayskull --exclude conda-recipe-manager --exclude conda-smithy --exclude shellcheck --exclude nodejs --exclude python --exclude django --exclude channels --exclude daphne --exclude wagtail --exclude coderedcms

[feature.build.dependencies]
conda = ">=26.5.0"                # conda package manager
conda-libmamba-solver = ">=24.9.0"  # fast libmamba-backed solver for conda
conda-build = ">=25.3.1"          # v0 recipe build engine (meta.yaml)
conda-index = ">=0.3.0"           # repodata.json index generator
conda-forge-ci-setup = ">=4.9.3,<5.0"  # conda-forge CI bootstrap scripts (CI fidelity)
conda-forge-pinning = "*"         # global conda-forge version pinning manifest
frozendict = "*"                  # immutable dict (transitive build dep)
networkx = ">=3.0"                # REQUIRED by .ci_support/build_all.py (`import networkx as nx`, line 8), which
                                  # `.scripts/build_steps.sh` runs from THIS env -- it installs
                                  # `environment.yaml`, exported from [feature.build]. Commented out until
                                  # 2026-09-09, which is a third, independent reason the Linux Docker lane could
                                  # never build anything here (see build_steps.sh's own header for the other two):
                                  # every run died on `ModuleNotFoundError: No module named 'networkx'` before it
                                  # reached a single recipe. Restored WITHOUT the old `2.4.*` pin -- that ceiling
                                  # dates to 2019 and its stated reason ("conda-build compat") no longer holds;
                                  # build_all.py uses only DiGraph/topological_sort, stable since 2.x.
rattler-build-conda-compat = ">=1.2.0,<2.0.0a0"  # rattler-build ↔ conda-build compat shims

[feature.linux]
# The linux feature runs on every platform that can run Docker.
platforms = ["linux-64", "osx-arm64-min", "win-64"]
[feature.linux.tasks.build-linux]
description = "build for Linux inside a docker container"
cmd = "python build-locally.py --filter 'linux*'"

[feature.osx]
# The osx env will run directly on the machine.
platforms = ["osx-arm64-min"]
[feature.osx.tasks.build-osx]
description = "build directly on a MacOS host machine"
cmd = "python build-locally.py --filter 'osx*'"
[feature.osx.tasks.build-osx.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"
OSX_SDK_DIR = "$PIXI_PROJECT_ROOT/.pixi/macOS-SDKs"

[feature.win]
# The windows env will run directly on the machine.
platforms = ["win-64"]
[feature.win.tasks.build-win]
description = "build directly on a Windows host machine"
cmd = "python build-locally.py --filter 'win*'"
[feature.win.tasks.build-win.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"

[feature.grayskull.dependencies]
grayskull = ">=2.7.3"             # auto-generate conda recipes from PyPI / CRAN
[feature.crm.dependencies]
# crm+feedrattler isolated from the grayskull FEATURE 2026-08-30 so local-recipes
# (which composes grayskull) stops inheriting conda-recipe-manager's exact
# click==8.2.1 pin (feedstock bug, conda-forge/conda-recipe-manager-feedstock#44) —
# that pin walled headroom-ai + the dbt trio out of local-recipes. Only the
# standalone grayskull ENV includes this feature; migrations still run via
# `pixi run -e grayskull conda-recipe-manager convert …` / `… feedrattler …`.
conda-recipe-manager = ">=0.8.0"  # lint + migrate v0 ↔ v1 conda recipes
feedrattler = ">=0.3.14"          # Convert conda-forge feedstocks to rattler-build (v1) format (moved here with crm — it requires conda-recipe-manager >=0.4.0)
[feature.grayskull.tasks.pypi]
description = "generate a v1 (rattler-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.cran]
description = "generate a v1 (rattler-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.pypi-v0]
description = "generate a v0 (conda-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge"
[feature.grayskull.tasks.cran-v0]
description = "generate a v0 (conda-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge"

[feature.conda-smithy.dependencies]
conda-smithy = ">=3.44.6,<4"      # feedstock generator + recipe linter (NOTE: CalVer 2026.x needs the `conda` pkg, not in this env — for CI-parity lint use `pixi exec conda-smithy recipe-lint`)
[feature.conda-smithy.tasks.lint]
description = "Lint every recipe with the CI-parity conda-smithy (the CalVer 2026.x line the conda-forge webservice runs, solved ephemerally by `pixi exec` because it hard-depends on the `conda` package this env cannot carry -- G65). Passes only directories that hold a recipe.yaml or meta.yaml: `recipes/*` also matches holding dirs (broken-recipes, sample, ...) and the linter aborts the whole run on the first one. Until 2026-09-05 this task ran the env's pinned 3.62.0, which cannot lint a v1 cross-compile `if/then` build block at all (hint_suggest_noarch .startswith on a mapping; recipes/array-record). The --conda-forge mode calls GitHub per recipe through os.environ[GH_TOKEN] (anonymous = 60 req/h, and a corpus this size crawls); the task exports `gh auth token` when GH_TOKEN is unset. Budget an hour for the whole corpus -- pass a single `recipes/<name>` via `conda-smithy recipe-lint --conda-forge recipes/<name>` (G65) for one recipe."
cmd = """bash -c 'export GH_TOKEN="${GH_TOKEN:-$(gh auth token 2>/dev/null)}"; exec pixi exec --spec "conda-smithy>=2026.6.14" conda-smithy recipe-lint --conda-forge $(for d in recipes/*/; do { [ -f "${d}recipe.yaml" ] || [ -f "${d}meta.yaml" ]; } && printf "%s " "${d%/}"; done)'"""

[feature.shellcheck]
# merge this with `conda-smithy` when available for `linux-ppc64le`
platforms = ["linux-64", "osx-arm64-min", "win-64"]
dependencies.shellcheck = ">=0.10.0"

[feature.gcloud-sdk]
# Heavy (~91 MB) opt-in feature carrying the `gcloud` CLI for one-time
# interactive auth (`gcloud auth application-default login`). Once
# Application Default Credentials are cached at
# `~/.config/gcloud/application_default_credentials.json`, the
# `google-cloud-bigquery` lib in the `local-recipes` env picks them up
# automatically and you don't need the `gcloud` env again until you
# want to refresh creds or switch projects.
# Linux + macOS only — google-cloud-sdk isn't on conda-forge for win-64.
platforms = ["linux-64", "osx-arm64-min"]
dependencies.google-cloud-sdk = ">=583.0.0"

[feature.python-agent-platform]
# --- python-agent-platform (CAP-5, spec-python-agent-platform, Story 10.2) ---
# The ONE environment that runs the three agentic engines (langflow, dbgpt,
# dbgpt-serve) alongside Django on a single Python interpreter, sourced
# entirely from this factory's own conda-forge feedstocks. Pins
# `python = "3.14.*"` -- CAP-5's one interpreter across laptop and cluster;
# every pixi env in this file shares the same floor (Story 43.6). Promotes the
# operator-verified 373-package conda-native solve
# (docs/dreams/enterprise-multi-agent-orchestration.md) into a first-class,
# reproducible pixi env. Epic 11's engine-mounting stories and this epic's
# own Story 10.3 (container image) both depend on this existing first.
#
# "Host deps" scope (Design Notes, spec-10-2): `fastapi` (Story 10.1's own
# ASGI/FastAPI-integration seam, floor matches its pin exactly -- also
# arrives transitively via langflow-base's own `fastapi >=0.135.0,<1.0.0`
# run-dep, so the explicit pin only documents intent) and
# `django-health-check` (Story 10.1's K8s liveness/readiness requirement,
# CAP-1) as the Django-host-specific additions, plus `psycopg2` and
# `redis-py` as the PostgreSQL/Redis client drivers the "infrastructure is
# exactly PostgreSQL + Redis" constraint requires Django/Celery to actually
# reach either backing service. Import-name gotcha: the conda-forge package
# is named `redis-py`; it imports as `redis`.
#
# `redis-py >=6.0.0` also forces the solver off conda-forge's `slowapi`
# (transitive via langflow -> langflow-base -> slowapi, which carries a
# stale `run_constrained: redis-py >=3.4.1,<4.0.0`) and onto a relaxed
# `slowapi 0.1.10` build already published on the `SelfExplainML` channel
# (already in the workspace `channels` list above -- no channel change
# needed). Expect `slowapi` from SelfExplainML in `pixi.lock`; that is
# correct, not an error (see this story's Spec Change Log).
#
# `channel-priority = "flexible"` (feature-scoped, NOT touching [workspace]'s
# implicit default of "strict" for every other feature/env): "strict" hard-
# excludes an entire lower-priority channel the moment the higher-priority
# channel has ANY build of a package name, so it would exclude SelfExplainML's
# slowapi 0.1.10 outright even though conda-forge's own only build (0.1.9)
# is infeasible against redis-py >=6.0.0 -- confirmed live (pixi 0.76.2):
# `slowapi 0.1.10 is excluded because due to strict channel priority not
# using this option from 'SelfExplainML'`. "flexible" is the mode that
# actually implements the fallthrough this story's Change Log describes:
# exhaust conda-forge's candidates first, only fall back to SelfExplainML
# once conda-forge is exhausted.
platforms = ["linux-64", "osx-arm64-min"]
channel-priority = "flexible"

