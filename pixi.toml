# spec-bmad-suite-metapackage's CAP-4: depends on the published `bmad-suite`
# metapackage (SelfExplainML) instead of hand-maintaining the ~11 explicit
# bmad-* pins carried under [feature.local-recipes.dependencies] above. Opt-in
# only -- `local-recipes` does NOT compose this feature and keeps every
# explicit member pin (pipeline-truth / doctor drift granularity); never
# remove those pins in favor of this feature. `feature.bmad-ui` (dashboards)
# stays separate and untouched. linux-64 only: bmad-suite's run deps include
# bmad-module-skill-forge, whose SelfExplainML build is linux-64-only (see the
# [feature.local-recipes.target.linux-64.dependencies] comment above) -- this
# feature does not duplicate that platform skip per member (the metapackage
# recipe is the one place that belongs), it simply scopes the whole feature to
# the platform the metapackage actually solves on, same precedent as
# feature.bmad-ui. Docs: install-matrix.md's Greenfield one-pin section.
[feature.bmad-suite-full]
platforms = ["linux-64"]
channels = ["conda-forge", "SelfExplainML"]

[feature.bmad-suite-full.dependencies]
python = ">=3.14.7,3.14.*"        # minimal python floor so the lean proof env below solves standalone (no other feature composed)
bmad-suite = ">=2026.9.9"         # SelfExplainML metapackage (spec-bmad-suite-metapackage CAP-2) -- pulls all 13 active suite members at upstream-aligned pins

