# The OPERATOR path to a loop home's harness policy. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and gitignored it,
# closing the F-1 cross-project bleed -- but nothing reachable RENDERED it: the
# writer's only callers were its own tests, `marshal config` merely printed, and no
# task called either. Merging the story then DELETED the file from
# pyforge-marshal's own loop home, leaving it with no policy at all, which is the
# exact state 1.10's own SEQUENCING (hard) note forbade. This closes that.
#
# Composes AD-16's chain (Marshal defaults -> the TRACKED
# planning-artifacts/marshal-policy.toml, found by convention -> flags) and writes
# the projection whole. Refuses to write when the composition carries
# error-severity findings, so bmad-loop never receives a policy born of a failed
# invocation.
#
#   pixi run -e pyforge-marshal marshal-render-policy -- \
#     --project pyforge-doctor --write-harness-policy ~/.bmad-loops/pyforge-doctor
[feature.pyforge-marshal.tasks.marshal-render-policy]
description = "Render a loop home's .bmad-loop/policy.toml from its tracked project-policy layer (AD-12 derived artifact; pass --project <slug> --write-harness-policy <loop-home>)."
cmd = "marshal config"

# --- pyforge-ci: the CI build/publish surface, layered on feature.python --------
# Deliberately its OWN feature rather than additions to feature.python: that one is
# shared by build / grayskull / conda-smithy / local-recipes / vuln-db / gcloud /
# linux / osx / win, so anything added there fattens all nine.
#
# Covers every artifact the pyforge packages publish, from one hatchling pyproject:
#   wheel + sdist -> python-build (frontend) + hatchling (backend). The build tasks
#                    pass --no-isolation, so the backend MUST be in the env; without
#                    it `python -m build` fetches its own into a temp venv (network).
#   .conda        -> pixi build via pixi-build-python / pixi-build-rattler-build.
#                    hatchling alone does NOT emit .conda — pixi-build-python wraps
#                    the hatchling wheel (see the pyforge-mason note above).
#   PyPI          -> twine.
#   GitHub release-> gh (already in feature.python).
#   conda-forge   -> nothing needed: publishing there is a PR to staged-recipes /
#                    the feedstock, and conda-forge's own CI builds and uploads.
# Pins are the repo's existing ones, unchanged, so this adds no second source of
# truth. STILL MISSING for JFrog conda uploads: anaconda-client or a jfrog CLI —
# absent from every feature today, so that target is a real gap, not just here.
[feature.pyforge-ci.dependencies]
hatchling = ">=1.32.0"            # Python build backend (conda + wheel/sdist)
python-build = ">=1.6.0"          # PyPA `python -m build` frontend
pytest = ">=9.1.1"                # test runner
"ruamel.yaml" = ">=0.19.1"        # failure_catalog_generator import in tests/scripts/test_failure_catalog_check.py
pixi-build-python = ">=0.8.6"     # pixi build backend -> .conda from the hatchling wheel
pixi-build-rattler-build = ">=0.4.6"  # pixi build backend -> recipe-driven .conda
twine = ">=7.0.0"                 # PyPI upload

# The dependency-completeness + manifest-parity gate for ALL `pyforge-*` packages
# (AUD-REPO-001, the permanent form of the auditor that found AUD-ATLAS-010 and
# AUD-WARDEN-010). It AST-scans each package's src/ for unconditional
# module-level imports and proves every one is declared in pyproject.toml AND
# mirrored into pixi.toml [package.run-dependencies].
#
# It lives in `pyforge-ci` on purpose: the check is pure stdlib (ast + tomllib),
# so running it in the leanest env in the repo — which carries no runtime
# libraries at all — is the standing proof that it never needs the very
# dependencies it audits. A check that needed them installed would be circular.
# It also discovers packages by glob, so a new `pyforge-*` package is covered the
# day it lands with nobody having to remember. Runs in ~0.4s.
[feature.pyforge-ci.tasks.pyforge-deps-test]
description = "Dependency-completeness + wheel/.conda manifest parity for every pyforge-* package (pure stdlib; no runtime deps required)"
cmd = "python -m pytest tests/packaging -q"

# `scripts/detectors.py`'s `_doctor_sources()` (Story 6.2) reads
# `pyforge.doctor.sources.REGISTRY` directly from source (sys.path insertion,
# no built package needed) -- both it and `pyforge.doctor.models` are pure
# stdlib, so this fits the same lean env as `pyforge-deps-test` above. Lives
# here, not under `pyforge-doctor-test`, because the thing under test is the
# repo-root detector CLI, not the pyforge-doctor package itself.
[feature.pyforge-ci.tasks.pyforge-doctor-scripts-test]
description = "scripts/detectors.py's Doctor-registry integration (Story 6.2; pure stdlib, no runtime deps required)"
cmd = "python -m pytest tests/scripts -q"

# --- pyforge-guild: the Guild's session environment (steward Story 63.1, spec-pyforge-steward CAP-5) ---
# The DEFAULT environment for every agent and harness doing planning-chain work -- Claude,
# Cursor (IDE + Cloud Agents), Copilot, Gemini, Marshal dispatch/spin. Carries the current
# state of PyForge (core, doctor, marshal, steward, testing-kit) and NOTHING
# of the recipe factory: local-recipes (222 deps, 171 tasks, 10 GB) is Mason's environment and
# includes feature.guild-tasks (the moved tasks, no deps) so every `pixi run -e local-recipes
# <guild task>` keeps working. Tasks MOVE, never duplicate (Spec Constraint CAP-5): a task name
# exists in one feature. Deps live HERE, not in guild-tasks -- see the banner at the task blocks.
# The token-economy kit is on the floor by construction (CAP-5 corrected 2026-09-16 after
# probing the lean pyforge-marshal env: no headroom; caveman is a per-harness skill, so the
# env guarantees nodejs for `npx skills add` via the python feature): headroom-ai is declared
# here explicitly so wire `auto` never degrades to MRS-DISP-033 for want of a binary.
# Scribe capture/recall run here too since 2026-09-19 (Story 19.2, the core package only); `scribe graph compile` with the graphify/cocoindex/postgres extras stays `-e pyforge-scribe` (those are heavy and already per-env).
# Foundry mode: rebuild -- python-foundry re-derives the same split.
[feature.pyforge-guild.dependencies]
pyforge-core = { path = "src/shared/packages/pyforge-core" }
pyforge-doctor = { path = "src/shared/packages/pyforge-doctor" }      # run-deps bring jsonschema, pyyaml, mcp, pyforge-core
# pyforge-warden is deliberately NOT here (found at the first solve, 2026-09-16): warden range-pins
# its engine to the empirically-verified minor (`osv-scanner >=2.4.0,<2.5`, package.run-dependencies,
# meta-test-enforced) while the factory pins `osv-scanner >=2.5.1`, so a warden-carrying feature
# cannot be included by local-recipes. Doctor does not require warden at runtime (its run-deps are
# jsonschema, pyyaml, mcp, pyforge-core) and degrades that seam to cannot-evaluate -- exactly how
# detectors-ci has always run in local-recipes. The warden seam stays `-e pyforge-doctor` / `-e pyforge-warden`.
pyforge-marshal = { path = "src/shared/packages/pyforge-marshal" }    # dispatch / spin / seed check; run-dep bmad-loop
pyforge-steward = { path = "src/shared/packages/pyforge-steward" }    # workspace start/clean, frame-preflight; run-dep age
pyforge-herald = { path = "src/shared/packages/pyforge-herald" }  # Story 63.6 (spec-pyforge-steward CAP-152): deck-export / deck-trio import pyforge.herald.stamps; herald's deck pipeline shells those tasks under -e pyforge-guild (herald 25.1)
pyforge-scribe = { path = "src/shared/packages/pyforge-scribe" }      # scribe capture / recall from the session default (scribe Story 19.2, spec-pyforge-scribe CAP-28, 2026-09-19): the CORE package only (run-deps typer + pydantic + pyforge-core); the heavy compile extras (graphifyy, cocoindex, psycopg) stay in -e pyforge-scribe, so `scribe graph compile` with an extra still runs there
pyforge-testing-kit = { path = "src/shared/packages/pyforge-testing-kit" }
headroom-ai = ">=0.37.0"          # wire-compression layer (marshal-token-economy); absent -> silent MRS-DISP-033, so it is on the floor
# headroom-ai's `[proxy]` extra (needed for `headroom wrap claude`'s actual wire-compression
# proxy, not just the CLI) declares these at runtime; found missing live 2026-09-20 when
# `marshal factory dispatch`'s `claude` harness profile (which always declares a [wrapper], so
# wire "auto" resolves enabled) crashed the whole dispatch in <2s with "No module named 'openai'"
# before the harness session ever started. Pinned to the extra's own declared floors.
openai = ">=2.14.0"
orjson = ">=3.9.14"
magika = ">=0.6.0"
zstandard = ">=0.20.0"
