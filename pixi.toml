# --- pyforge-warden (Warden): pixi build workspace member (Option B) -----------------
# Source + package manifest live in ./src/shared/packages/pyforge-warden (its
# own [package] table, no [workspace]) — the unity-data-stack src/shared/packages
# convention. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-warden-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-warden-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps) into the dedicated `pyforge-warden` env. Spec: docs/specs/pyforge-warden.md.
[feature.pyforge-warden.dependencies]
pyforge-warden = { path = "src/shared/packages/pyforge-warden" }  # -> built conda pkg
hatchling = ">=1.31.0"            # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"          # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                # test runner
py-rattler = ">=0.25.0"           # test-only oracle for extract/lockfiles.py (Story 2.6); NEVER a pyforge-warden runtime dep
py-rattler-build = ">=0.70.1"     # test-only differential-oracle for extract/recipe_v1.py (Story 2.2, v1 recipe.yaml render); NEVER a pyforge-warden runtime dep
conda-build = ">=25.3.1"          # test-only differential-oracle for extract/meta_v0.py (Story 2.2, v0 meta.yaml render); NEVER a pyforge-warden runtime dep

[feature.pyforge-warden.tasks.warden-scan]
description = "Run the Warden multi-axis dependency gate (hygiene + security [+ license/currency v1.x])"
cmd = "warden"

[feature.pyforge-warden.tasks.pyforge-warden-test]
description = "Run the pyforge.warden test suite (fast default loop -- excludes @pytest.mark.slow)"
cmd = "pytest src/shared/packages/pyforge-warden/tests -q -m \"not slow\""

[feature.pyforge-warden.tasks.pyforge-warden-test-corpus-oracle]
description = "Run the slow, corpus-scale differential-oracle + full-corpus determinism + egress-counter proofs (Story 5.2) -- not part of the default loop"
cmd = "pytest src/shared/packages/pyforge-warden/tests -q -m slow"

[feature.pyforge-warden.tasks.pyforge-warden-dogfood]
description = "Warden scans its own package (pyproject.toml + src/, tests/ excluded) -- epics.md AC3's dogfood gate"
cmd = "python scripts/dogfood_scan.py"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build-conda]
description = "Build the conda package (.conda) via pixi-build-python -> dist-conda/"
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build-dist]
description = "Build the pypi wheel (.whl) + sdist (.tar.gz) via hatchling"
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build]
description = "Build all three artifacts: conda + wheel + sdist"
depends-on = ["pyforge-warden-build-conda", "pyforge-warden-build-dist"]

# --- pyforge-atlas (Atlas): pixi build workspace member (warden mirror, Story A1) -----
# Source + package manifest live in ./src/shared/packages/pyforge-atlas (its
# own [package] table, no [workspace]) — same src/shared/packages convention as
# warden. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-atlas-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-atlas-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps, incl. pyforge-warden — the [gate] extra default-installed in-repo,
# AC-8) into the dedicated lean `pyforge-atlas` env.
# Spec: docs/specs/cfe-atlas-datapipeline-kedro-migration.md § 9 Story A1.
[feature.pyforge-atlas.dependencies]
pyforge-atlas = { path = "src/shared/packages/pyforge-atlas" }  # -> built conda pkg
pyforge-warden = { path = "src/shared/packages/pyforge-warden" }  # AC-8: the [gate] extra default-installed IN-REPO at feature level (A1-A5 alternative route) — NOT a pyforge-atlas package run-dep, so external conda installs stay warden-optional
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner (kedro-test)
kedro-viz = ">=12.4.0"             # C2 `viz` task + test_viz_loadable smoke — NOT a pyforge-atlas run-dep so not pulled transitively; the lean no-default-feature env needs it explicitly (Gemini #85)

[feature.pyforge-atlas.tasks.kedro-test]
description = "Wave A deterministic gate: pyforge.atlas import smokes + Kedro namespace seam + scaffold layout (AD-11)"
cmd = "pytest src/shared/packages/pyforge-atlas/tests -q"

[feature.pyforge-atlas.tasks.kedro-catalog-check]
description = "Wave A gate 2 (Story A2, AD-11): catalog resolves offline w/ stub creds + no-inline-IO + AD-1 import-direction meta-tests + naming/layer/TTL/path conventions + 20 override points + per-host credential scoping (FR-1)"
cmd = "pytest src/shared/packages/pyforge-atlas/tests/catalog -q"

[feature.pyforge-atlas.tasks.parity-diff]
description = "Wave B verify gate (Story B1, AC-7): fixture-mode parity diff — each migrated node's output DataFrame vs its captured legacy snapshot (offline, non-credentialed, --frozen; B1 seeds Core/VCS fixtures, B4 consumes it at the attended credentialed event)"
cmd = "pytest src/shared/packages/pyforge-atlas/tests/parity -q"

[feature.pyforge-atlas.tasks.bsl-metric-check]
description = "Wave D verify gate (Story D1, AC-4, FR-8 / AD-7): BSL metric-parity — each core metric (staleness / adoption stage / feedstock health / downloads / actionable + the first-class maintainer ⋈) declared ONCE as Ibis->DuckDB (AD-4) matches its legacy CLI formula, anchored by an INDEPENDENT re-implementation (DW-B1-1 honesty). Offline, --frozen."
cmd = "pytest src/shared/packages/pyforge-atlas/tests/semantic -q"

[feature.pyforge-atlas.tasks.dagster-dryrun]
description = "Wave C verify gate (Story C1, AC-5, FR-6): kedro-dagster dryrun — build Dagster Definitions from KedroProjectTranslator, assert schedules enumerate + jobs resolve + each op carries its OWN timeout + Phase P admin-only + profile precedence. DEFINITIONS LOAD ONLY — NO live daemon/scheduled run (attended bring-up deferred, DW-C1). Offline, --frozen."
cmd = "pytest src/shared/packages/pyforge-atlas/tests/orchestration -q"

[feature.pyforge-atlas.tasks.duckdb-singularity]
description = "Wave F verify gate (Story F1, FR-5 / AD-4): the DuckDB-singularity grep gate — NO sqlite3 read/write path anywhere in the migrated pyforge/atlas surface (DuckDB/Parquet is the sole engine); the one legacy-SQLite reader (the B4 credentialed parity comparator) is pinned to tests/, never src/. The cold-start/warm-incremental benchmark is the ATTENDED half (DW-F1-1). Offline, --frozen."
cmd = "pytest src/shared/packages/pyforge-atlas/tests/singularity -q"

[feature.pyforge-atlas.tasks.viz]
description = "Wave C (Story C2, FR-6 / AC-3): launch Kedro-Viz on the migrated atlas DAG — inspect dataset schemas + data lineage in the browser instead of reading orchestrator source. Runs from the atlas project root (kedro CLI needs the project cwd). --no-browser so it works headless; open the printed localhost URL."
cmd = "kedro viz run --no-browser"
cwd = "src/shared/packages/pyforge-atlas"

[feature.pyforge-atlas.tasks.pyforge-atlas-build-conda]
description = "Build the conda package (.conda) via pixi-build-python -> dist-conda/"
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-atlas"

[feature.pyforge-atlas.tasks.pyforge-atlas-build-dist]
description = "Build the pypi wheel (.whl) + sdist (.tar.gz) via hatchling"
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-atlas"

[feature.pyforge-atlas.tasks.pyforge-atlas-build]
description = "Build all three artifacts: conda + wheel + sdist"
depends-on = ["pyforge-atlas-build-conda", "pyforge-atlas-build-dist"]

# --- pyforge-doctor (Doctor): pixi build workspace member (warden mirror, Story 1.1) ---
# Source + package manifest live in ./src/shared/packages/pyforge-doctor (its
# own [package] table, no [workspace]) — same src/shared/packages convention as
# warden/atlas. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-doctor-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-doctor-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps) into the dedicated lean `pyforge-doctor` env. Spec:
# _bmad-output/projects/pyforge-doctor/planning-artifacts/.
[feature.pyforge-doctor.dependencies]
pyforge-doctor = { path = "src/shared/packages/pyforge-doctor" }  # -> built conda pkg
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner
# --- pyforge-scribe (Scribe): pixi build workspace member (warden mirror, Story 1.1) --
# Source + package manifest live in ./src/shared/packages/pyforge-scribe (its
# own [package] table, no [workspace]) — same src/shared/packages convention as
# warden/atlas. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-scribe-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-scribe-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps) into the dedicated lean `pyforge-scribe` env. Spec:
# _bmad-output/projects/pyforge-scribe/planning-artifacts/.
[feature.pyforge-scribe.dependencies]
pyforge-scribe = { path = "src/shared/packages/pyforge-scribe" }  # -> built conda pkg
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner
# --- pyforge-herald (Herald): pixi build workspace member (warden/atlas mirror, Story 1.1) --
# Source + package manifest live in ./src/shared/packages/pyforge-herald (its
# own [package] table, no [workspace]) — same src/shared/packages convention as
# warden/atlas. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-herald-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-herald-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps) into the dedicated lean `pyforge-herald` env. This story delivers
# the build-wiring skeleton only (argparse CLI + empty `deck` subcommand
# group, no bridge logic). Spec:
# _bmad-output/projects/pyforge-herald/planning-artifacts/.
[feature.pyforge-herald.dependencies]
pyforge-herald = { path = "src/shared/packages/pyforge-herald" }  # -> built conda pkg
mcp = ">=1.28.1"                         # MCP SDK -- the Story 1.2 primary transport (also a package run-dep)
hatchling = ">=1.31.0"                    # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"                 # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                       # test runner

