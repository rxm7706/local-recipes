cmd = "python .claude/scripts/conda-forge-expert/failure_catalog_generator.py"

[feature.guild-tasks.tasks.failure-catalog-check]
description = "Detector (Story 7.2): independently re-resolves every committed failure-catalog.yaml enforced_by pointer against the live check registry — recipe_optimizer.py can drift (a check code renamed or removed) without SKILL.md or the catalog changing at all, which the generator's own --check alone would not distinguish from a genuine drift-free state. Delegates catalog<->SKILL.md drift detection to failure_catalog_generator.py --check (Story 7.1) and reports the null-rows backlog count as an informational stat — never a finding, never gates the exit code. scope=repo. Exit 0 clean, 1 findings (unresolved-pointer, catalog-drift), 2 could-not-run (the generator itself failed on an unrecoverable error). Pass -- --json for machine output."
cmd = "python scripts/failure_catalog_check.py"

