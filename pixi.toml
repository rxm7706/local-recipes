cmd = "bash scripts/platform-ci-local.sh"

[feature.guild-tasks.tasks.claude-instruction-mode-check]
description = "Advisory host check (scribe Story 19.3, spec-pyforge-scribe CAP-29): is this machine's Claude Code >= 2.1.277 (the built-in agents-md mod) and is the mod pinned to instructionFiles=claude-md-and-agents-md in ~/.claude/settings.json? The mod's DEFAULT mode stays out of any project that has a CLAUDE.md, so without the pin AGENTS.md still arrives only through CLAUDE.md's @AGENTS.md import (the floor on every runtime) and nested AGENTS.md files (src/shared/packages/pyforge-atlas/AGENTS.md) never load in interactive sessions. Warn-only, never gating; silent when no claude binary is on the host; runtime scope (reads the host, never joins detectors-ci). Dispatched sessions are pinned by marshal's claude harness profile (Story 46.11, --settings), so this is about the operator's own sessions. Override the settings path with -- --settings <file>."
cmd = "python scripts/claude_instruction_mode_check.py"

