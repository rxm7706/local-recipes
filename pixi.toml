[feature.platform-dev]
# --- platform-dev (AD-16, spec-python-agent-platform, Story 11.1) ---
# The per-user local-process dev baseline Epic 11's schema-isolation work needs:
# `postgresql` + `pgvector` (the ONE PostgreSQL instance `langflow_schema`/
# `dbgpt_schema`/`public` all share, AD-5/AD-1) + `redis-server` (the cache +
# Celery-broker backend, AD-1), plus `kubernetes-helm`/`kubernetes-client` for
# later chart work (Epic 12). Verified solving together from conda-forge
# 2026-08-14 (ARCHITECTURE-SPINE AD-16, dry-run). Platforms mirror
# `python-agent-platform`'s own list exactly, NOT the workspace default: no
# win-64 -- `redis-server` has no native win-64 conda-forge build (AD-16's
# native-Windows sub-posture note: WSL2 or a remote Redis stands in there).
#
# NOT a standalone environment -- the `platform-dev` ENVIRONMENT below composes
# THIS feature onto `python-agent-platform` (langflow/dbgpt/django) so one
# `pixi install -e platform-dev` gives a full local Tier-1 dev baseline: the
