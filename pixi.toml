# --- pyforge-mason (Mason): pixi build workspace member (warden/doctor mirror, Story 1.1) --
# Source + package manifest live in ./src/shared/packages/pyforge-mason (its own
# [package] table, no [workspace]). One hatchling pyproject is the single Python
# build backend:
#   * conda pkg   -> pixi-build-python wraps the hatchling wheel (pyforge-mason-build-conda)
#   * wheel+sdist -> `python -m build` from the same pyproject    (pyforge-mason-build-dist)
# Story 1.1 is build wiring only: dual-artifact manifest + PEP 420 namespace +
# argparse dispatcher. FR-41 forbids a CLI framework, so there is deliberately no
# click/typer here. Spec: _bmad-output/projects/pyforge-mason/planning-artifacts/.
[feature.pyforge-mason.dependencies]
pyforge-mason = { path = "src/shared/packages/pyforge-mason" }  # -> built conda pkg
pyforge-core = { path = "src/shared/packages/pyforge-core" }  # Story 14.3, CAP-5: errors.py's MasonError re-parents to pyforge.core.errors.PyforgeError -- also a package run-dep (mirrors [feature.pyforge-warden.dependencies]'s identical edge)
pyforge-testing-kit = { path = "src/shared/packages/pyforge-testing-kit" }  # retro-2026-09-04 action item 11: branch_diff_guard.py shared by tests/conftest.py + tests/meta/*.py (test-time only; not a package run-dep)
pyyaml = ">=6.0.3"                # PyYAML -- Story 4.4's engines/condalock.py::check() metadata.content_hash parser (also a package run-dep; mirrors [feature.pyforge-doctor.dependencies]'s identical line)
truststore = ">=0.10.4"           # Story 16.1: CFE_IMPORT_FLOOR (`cfe.py`) -- mirrors [feature.python.dependencies]'s identical floor (OS trust store for corporate CA / JFrog TLS)
conda-forge-metadata = ">=2026.9.10"  # Story 16.1: CFE_IMPORT_FLOOR (`cfe.py`) -- mirrors [feature.vuln-db.dependencies]'s identical floor
hatchling = ">=1.32.0"            # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"          # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                # test runner
pytest-cov = ">=7.1.0"            # Story 32.7 (spec-pyforge-testing-charter CAP-4, amended by spec-fleet-consistency-standard): coverage JSON for the named-module gate. Declared in only pyforge-marshal and local-recipes until 2026-09-07, so seven station envs could not run a coverage gate at all -- verified live against scribe, which exited 1 with "unrecognized arguments: --cov".
