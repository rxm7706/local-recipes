[feature.pyforge-scribe.tasks.pyforge-scribe-nightly-compile]
description = "Story 8.1 (spec-8-1): the nightly-compile TRIGGER body -- the one command the checked-in systemd-user timer (pyforge-scribe-nightly-compile.timer, under src/shared/packages/pyforge-scribe/ops/systemd/, installed by `scribe-install-nightly-trigger`) invokes every night. When PYFORGE_GRAPHSTORE_OWNER=steward (PostgreSQL GraphStore), ensures the local cluster is up (`pixi run -e pyforge-scribe-pg scribe-pg-up`) or refuses cleanly (exit 0, never red) rather than compiling against an unconfirmed store; the default FlatFileGraphStore path needs no service and is unaffected. Otherwise invokes `scribe graph compile --nightly` (Story 3.3's own flock-safe, prompt-free, exit-0-on-overlap contract) and propagates its exit code unchanged. Builds no new compile capability -- only triggers the existing one."
cmd = "python scripts/scribe_nightly_trigger.py"

[feature.pyforge-scribe.tasks.scribe-install-nightly-trigger]
description = "Story 8.1 (spec-8-1): installs the checked-in nightly-compile trigger via a pluggable backend (`--backend NAME` or PYFORGE_SCRIBE_TRIGGER_BACKEND, default `crontab`). `crontab` (default) writes a plain user-crontab entry via python-crontab -- no systemctl/loginctl needed. `systemd` is the original systemd-user timer (`ops/systemd/pyforge-scribe-nightly-compile.service.tmpl` + `.timer`, `systemctl --user daemon-reload` + `enable --now`). `apscheduler` and `supercronic` are in-process/foreground-only options that write their job definition but do not supervise the process themselves -- the installer prints that caveat. Idempotent: re-running re-asserts the trigger for whichever backend is selected. Replaces the former hand-typed `crontab -e` line documented in docs/cli-runbooks.md -- this IS the documented, repeatable installation act."
cmd = "python scripts/scribe_install_nightly_trigger.py"

