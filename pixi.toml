[feature.dbgpt-sidecar]
# --- dbgpt-sidecar (Story 10.5, AD-14 Pattern B deviation) ---
# Isolated pixi feature/environment for the DB-GPT sidecar CONTAINER ONLY --
# deliberately never composed onto `python-agent-platform`/`platform-dev`.
# `dbgpt-app` (recipes/db-gpt/recipe.yaml, delivered upstream via PR #33883,
# live on conda-forge at 0.8.1 -- verified live 2026-08-21) transitively
# requires `dbgpt-client`, which pins `fastapi >=0.100.0,<0.113.0`; the
# shared `python-agent-platform` env already carries `langflow-base`'s
# `fastapi >=0.135.0,<1.0.0` floor (Story 11.1). The two ranges are disjoint
# -- no `fastapi` version satisfies both, confirmed live by attempting to
# add `dbgpt-app` to `python-agent-platform` and watching the solve fail
# with exactly this conflict -- which is the demonstrated pluggability
# failure `docs/dreams/db-gpt-django-plugin.md`'s 2026-08-21 AD-14 entry
# records: DB-GPT moves from Pattern A (in-process Django mount, still how
# Langflow runs) to Pattern B (its own container). This feature/environment
# exists SOLELY so `src/platform/compose/dbgpt/Containerfile`'s builder
# stage can materialize it -- it is not installed for local dev the way
# `platform-dev` is, so it stays off the workspace's default macOS/Windows
# platform list.
platforms = ["linux-64"]  # container-only: the Containerfile pins --platform=linux/amd64, same reason as python-agent-platform's own linux-64 entry

