pyforge-mason = { features = ["pyforge-mason"], no-default-feature = true }
# Lean steward env (Story 1.1, pyforge-warden mirror): same lean shape.
pyforge-steward = { features = ["pyforge-steward"], no-default-feature = true }
# Lean marshal env (Story 1.1, pyforge-warden mirror): no-default-feature,
