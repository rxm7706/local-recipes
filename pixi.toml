[feature.pyforge-mason.tasks.pyforge-mason-build-conda]
description = "Build the pyforge-mason conda package via pixi-build-python."
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-mason"   # pixi build has NO --manifest-path flag (0.73.0); siblings target the member by cwd

[feature.pyforge-mason.tasks.pyforge-mason-build-dist]
description = "Build the pyforge-mason wheel + sdist from the same hatchling pyproject."
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-mason"

[feature.pyforge-mason.tasks.pyforge-mason-build]
description = "Build BOTH pyforge-mason artifacts (conda + wheel/sdist) from one manifest."
depends-on = ["pyforge-mason-build-conda", "pyforge-mason-build-dist"]

[feature.pyforge-mason.tasks.pyforge-mason-test]
description = "Run the pyforge-mason test suite (unit + meta, fast default loop -- excludes @pytest.mark.slow) plus Story 16.3's CFE CLI⇄tool parity meta-test."
cmd = "pytest src/shared/packages/pyforge-mason/tests -q -m \"not slow\" && pytest .claude/skills/conda-forge-expert/tests/meta/test_cli_tool_parity.py -q"

[feature.pyforge-mason.tasks.pyforge-mason-recipe-build-smoke]
description = "Story 16.2: the first real estate caller of `mason recipe build` (FR-9's use-case, wired outside mason's own test tree) -- builds recipes/click-help-colors (a tiny, already-graduated noarch: python recipe with an explicit setuptools host dep and no ${{ python_min }} reference, chosen for a fast, dependency-light smoke build that needs neither the conda-forge-pinning overlay nor an isolated pip build-backend fetch) through `mason recipe build` against mason's own env, rather than `pixi run -e local-recipes recipe-build`. Wired into .github/workflows/pyforge-station-tests.yml's mason-test job so it runs on every execution of that already-existing lane, not only on demand. Does not replace the local-recipes route as the estate's primary recipe-build path."
cmd = "mason recipe build recipes/click-help-colors"

[feature.pyforge-mason.tasks.pyforge-mason-coverage-gate]
description = "Mirror of .github/workflows/coverage-gates.yml's `named-module-gates (mason)` job: run scripts/coverage_gates_ci.py over the modules THIS branch touches, in mason's own env, against the 80% unit floor. Distinct from pyforge-mason-test-coverage, which measures named modules against seeded ratchet floors -- this one measures only touched modules and is the gate that actually reds a PR. Added 2026-09-14 after PR #1355: board.py had sat at 70.1% since the Guildhall console was retired, and because the gate only measures TOUCHED modules it stayed invisible until an unrelated edit to that file surfaced it in CI with no local equivalent to catch it first."
cmd = "python scripts/coverage_gates_ci.py --base origin/main --head HEAD --suites unit"
env = { COVERAGE_GATES_STATIONS = "mason" }

[feature.pyforge-mason.tasks.pyforge-mason-test-coverage]
description = "Story 32.7 (spec-pyforge-testing-charter CAP-4): full-package named-module coverage evaluate for pyforge-mason. Floors are SEEDED FROM MEASUREMENT and ratchet upward only -- nobody had ever measured this station before 2026-09-07, so a flat 80/70 would have redded the fleet on day one. Fails naming each module under its floor, never a bare percentage."
cmd = "python scripts/run_station_coverage_gate.py --station mason"

[feature.pyforge-mason.tasks.pyforge-mason-test-slow]
description = "Run the slow, real-CFE-dependent tests (@pytest.mark.slow) -- not part of the default loop (mirrors pyforge-marshal-test-slow's split; collects zero tests until Story 5.3 lands FR-46's delegation-fidelity test)."
cmd = "pytest src/shared/packages/pyforge-mason/tests -q -m slow"

