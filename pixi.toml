# _bmad-output/projects/pyforge-herald/planning-artifacts/.
[feature.scribe-pg]
# --- scribe-pg: the local PostgreSQL + pgvector server pyforge-scribe's tests need ---
# `pyforge-scribe` ships only the CLIENT (`psycopg`). Its durable GraphStore tests
# (Story 28.1) fail LOUDLY rather than skipping when no server answers on
# 127.0.0.1:5433 -- deliberate, so an absent database can never read as a green
# suite -- but nothing in this repo provisioned one. CI supplies a
# `pgvector/pgvector:pg16` service container, so the gap was invisible there and
# only bit locally, where the sole recourse was hand-rolling a container. That
# contradicts `platform-dev`'s own pap:AD-16 posture: "all pixi-provisioned, zero
# containers or managed services".
#
# A SEPARATE feature, deliberately not folded into `pyforge-scribe`, for one hard
# reason: `pgvector` has NO win-64 conda-forge build and the scribe feature
# inherits the workspace platform list (which includes win-64), so adding it there
# breaks that solve outright. Composing instead leaves the lean env CI installs
# untouched -- the same layering `platform-dev` uses over `python-agent-platform`.
platforms = ["linux-64", "osx-arm64-min"]

[feature.scribe-pg.dependencies]
postgresql = ">=18.3,<19"         # server binaries: initdb / pg_ctl / psql / pg_isready.
                                  # 18, NOT platform-dev's 17.11: that env pairs with
                                  # psycopg2, whereas scribe's `psycopg >=3.3.4` pulls
                                  # psycopg-c, which requires libpq >=18.3. Pinning <18
                                  # here made the solve fail on libpq ==17.11 vs 18.3.
pgvector = ">=0.8.6"              # the `vector` extension conftest.py requires by name

[feature.scribe-pg.tasks.scribe-pg-up]
