# referenced BY NAME, never by copied pins, so this tracks them automatically.
#
# Why it exists: CI should always have pixi, but the only env exposing the tooling
# was local-recipes at 1102 packages / ~9.8 GB — a download per Pages deploy against
# a 10 GB cache ceiling. The health detectors never needed it at all (stdlib + git;
# generate.py now runs them directly — see _run_detector), so this env carries the
# build/publish surface without the 9.8 GB.
#
# Named to match the eight sibling pyforge-* envs so it sorts with the family.
pyforge-ci = { features = ["python", "pyforge-ci"], no-default-feature = true }
# Lean standalone-tool env (NFR1/NFR2): no-default-feature excludes the fat
# default [dependencies] (python 3.14 + pixi + conda + pip + uv), so this env
# carries only the built pyforge-warden package + its conda run-deps + pytest.
pyforge-warden = { features = ["pyforge-warden"], no-default-feature = true }
# Lean atlas env (Story A1, AD-16/§ 2.5): no-default-feature excludes the fat
# default [dependencies]; loop worktrees materialize THIS env, never the fat
# local-recipes env — this is the worktree-affordability claim A3 measures.
pyforge-atlas = { features = ["pyforge-atlas"], no-default-feature = true }
# Lean doctor env (Story 1.1): no-default-feature excludes the fat default
# [dependencies]; carries only the built pyforge-doctor package + its conda
# run-deps + pytest — mirrors pyforge-warden's/pyforge-atlas's lean shape.
pyforge-doctor = { features = ["pyforge-doctor"], no-default-feature = true }
detectors = { features = ["detectors"], no-default-feature = true }  # the Detectors workflow's locked env (pixi first, pip fallback) -- PR #1043
# Lean scribe env (Story 1.1, pyforge-warden mirror): no-default-feature
