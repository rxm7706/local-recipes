python = "3.14.*"                 # env-scoped python floor -- CAP-5's one interpreter; the rest of the repo stays on 3.14
langflow = ">=1.11.4"             # agentic engine 1/3 (langflow-suite feedstock, python_min 3.11 -- compatible with our 3.14 floor)
dbgpt = ">=0.8.2"                 # agentic engine 2/3 (db-gpt feedstock)
dbgpt-serve = ">=0.8.2"           # agentic engine 3/3 (db-gpt feedstock)
django = ">=5.2.17,<6"            # the host web framework the engines mount into (Epic 11)
fastapi = ">=0.141.1"             # Story 10.1's ASGI/FastAPI-integration seam; also arrives transitively via langflow-base's fastapi >=0.135.0,<1.0.0 -- explicit pin documents intent
django-health-check = ">=4.5.1"   # Story 10.1's K8s liveness/readiness requirement (CAP-1); needs django>=5.2, matching this env's floor -- a DIFFERENT install from Story 10.1's pip-pinned django-health-check==3.24.0
postgresql = ">=17.11,<18"        # pg_basebackup/pg_dump for Story 41.1 backup CronJob (client + server binaries)
psycopg2 = ">=2.9.10"             # Django sync driver; 2.9.10 added PostgreSQL 17 errorcodes (NEWS). Server is postgresql >=17 in platform-dev.
redis-py = ">=8.1.0"              # Redis client driver -- imports as `redis` (name gotcha); DO NOT relax this floor
# Story 11.1: `langflow.main.create_app()` hard-imports these four at module load
# (`langflow.api.router` -> `langflow.api.v1` -> `knowledge_bases`/`voice_mode`),
# even though the langflow-suite recipe lists all four as `run_constraints` (soft,
# optional) rather than `run` (hard) for the `langflow` package output -- verified
# live: `import langflow.main` ModuleNotFoundErrors on each in turn until all four
# are present. Pinned here to the SAME floors the recipe's own `run_constraints`
# declare, so this env satisfies what the feedstock already documents as the
# compatible range; not a recipe change (AD-9 -- consume, never fork/vendor).
chromadb = ">=1.5.9"        # langflow.api.v1.knowledge_bases hard-imports chromadb.errors
langchain-chroma = ">=1.1.0"  # lfx.base.knowledge_bases.backends.chroma hard-imports langchain_chroma.Chroma
elevenlabs = ">=1.52.0"     # langflow.api.v1.voice_mode hard-imports elevenlabs.ElevenLabs
# Story 11.1: neither `psycopg` (v3) nor `asyncpg` is anywhere in the langflow-suite
# recipe (not even as a run_constraint) -- upstream langflow-base's own wheel gates
# a Postgres driver behind an unused `[postgresql]` pip extra
# (`sqlalchemy[postgresql-psycopg]`) that the conda recipe never turns into a
# dependency, so this env has NO Postgres driver for Langflow's own SQLAlchemy
# engine without it. `LANGFLOW_DATABASE_URL` (AD-5 schema isolation) is a
# `postgresql://` URL; Langflow's own `services/database/service.py` rewrites that
# scheme to `postgresql+psycopg` itself, so plain `psycopg` (its conda-forge build
# already bundles the compiled `psycopg_c` extension -- no separate
# `psycopg-binary`/`psycopg-c` package exists on conda-forge, unlike PyPI) is the
# whole fix; psycopg 3 supports SQLAlchemy's async engine natively.
