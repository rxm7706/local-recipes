# --- pyforge-warden (Warden): pixi build workspace member (Option B) -----------------
# Source + package manifest live in ./src/shared/packages/pyforge-warden (its
# own [package] table, no [workspace]) — the unity-data-stack src/shared/packages
# convention. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-warden-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-warden-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps) into the dedicated `pyforge-warden` env. Spec: docs/specs/pyforge-warden.md.
[feature.pyforge-warden.dependencies]
pyforge-warden = { path = "src/shared/packages/pyforge-warden" }  # -> built conda pkg
pyforge-core = { path = "src/shared/packages/pyforge-core" }  # Story 14.2, CAP-2: feeds.py's mandatory run-dep (atomic_write_text)
pyforge-testing-kit = { path = "src/shared/packages/pyforge-testing-kit" }  # retro-2026-09-04 action item 11: branch_diff_guard.py shared by tests/meta/*.py (test-time only; not a package run-dep)
hatchling = ">=1.32.0"            # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"          # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                # test runner
pytest-cov = ">=7.1.0"            # Story 32.7 (spec-pyforge-testing-charter CAP-4, amended by spec-fleet-consistency-standard): coverage JSON for the named-module gate. Declared in only pyforge-marshal and local-recipes until 2026-09-07, so seven station envs could not run a coverage gate at all -- verified live against scribe, which exited 1 with "unrecognized arguments: --cov".
py-rattler = ">=0.25.0"           # test-only oracle for extract/lockfiles.py (Story 2.6); NEVER a pyforge-warden runtime dep. 2026-09-20 (steward Story 63.5): floor back to 0.25.0 -- the 0.26.0 bump was a catalog sync (8beb582d30), not an API need (LockFile.from_path / CondaLockedPackage / PypiLockedPackage exist in 0.25), and conda's rattler-solver variant (the only conda that tolerates ruamel.yaml 0.19, which mason's deps need) caps py-rattler <0.26 -- the pyforge-foundry-full union solve surfaced it
py-rattler-build = ">=0.72.2"     # test-only differential-oracle for extract/recipe_v1.py (Story 2.2, v1 recipe.yaml render); NEVER a pyforge-warden runtime dep
conda-build = ">=25.3.1"          # test-only differential-oracle for extract/meta_v0.py (Story 2.2, v0 meta.yaml render); NEVER a pyforge-warden runtime dep
# spec-library-catalog-manifest-sync CAP-1: mirror this station's own pixi.toml
# [package.run-dependencies] pins, undocumented in root pixi.toml until 2026-09-12.
packaging = ">=26.3"              # hygiene.py, engines.py, extract/_identity.py, extract/pyproject.py
jsonschema = ">=4.26.0"           # report.py
packageurl-python = ">=0.17.6"    # sbom.py, sources.py, eligibility_sbom.py; imports as `packageurl`
license-expression = ">=30.4.4"   # license.py; imports as `license_expression`

[feature.pyforge-warden.tasks.warden-scan]
description = "Run the Warden multi-axis dependency gate (hygiene + security [+ license/currency v1.x])"
cmd = "warden"

[feature.pyforge-warden.tasks.pyforge-warden-test]
description = "Run the pyforge.warden test suite (fast default loop -- excludes @pytest.mark.slow)"
cmd = "pytest src/shared/packages/pyforge-warden/tests -q -m \"not slow\""

[feature.pyforge-warden.tasks.pyforge-warden-coverage-gate]
description = "Mirror of .github/workflows/coverage-gates.yml's `named-module-gates (warden)` job: run scripts/coverage_gates_ci.py over the modules THIS branch touches, in warden's own env, against the 80% unit floor. Distinct from pyforge-warden-test-coverage, which measures named modules against seeded ratchet floors -- this one measures only touched modules and is the gate that actually reds a PR. Added 2026-09-14 after PR #1355: board.py had sat at 70.1% since the Guildhall console was retired, and because the gate only measures TOUCHED modules it stayed invisible until an unrelated edit to that file surfaced it in CI with no local equivalent to catch it first."
cmd = "python scripts/coverage_gates_ci.py --base origin/main --head HEAD --suites unit"
env = { COVERAGE_GATES_STATIONS = "warden" }

[feature.pyforge-warden.tasks.pyforge-warden-test-coverage]
description = "Story 32.7 (spec-pyforge-testing-charter CAP-4): full-package named-module coverage evaluate for pyforge-warden. Floors are SEEDED FROM MEASUREMENT and ratchet upward only -- nobody had ever measured this station before 2026-09-07, so a flat 80/70 would have redded the fleet on day one. Fails naming each module under its floor, never a bare percentage."
cmd = "python scripts/run_station_coverage_gate.py --station warden"

[feature.pyforge-warden.tasks.pyforge-warden-test-corpus-oracle]
description = "Run the slow, corpus-scale differential-oracle + full-corpus determinism + egress-counter proofs (Story 5.2) -- not part of the default loop"
cmd = "pytest src/shared/packages/pyforge-warden/tests -q -m slow"

[feature.pyforge-warden.tasks.pyforge-warden-dogfood]
description = "Warden scans its own package (pyproject.toml + src/, tests/ excluded) -- epics.md AC3's dogfood gate"
cmd = "python scripts/dogfood_scan.py"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build-conda]
description = "Build the conda package (.conda) via pixi-build-python -> dist-conda/"
cmd = "pixi build --output-dir dist-conda"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build-dist]
description = "Build the pypi wheel (.whl) + sdist (.tar.gz) via hatchling"
cmd = "python -m build --no-isolation --outdir dist"
cwd = "src/shared/packages/pyforge-warden"

[feature.pyforge-warden.tasks.pyforge-warden-build]
description = "Build all three artifacts: conda + wheel + sdist"
depends-on = ["pyforge-warden-build-conda", "pyforge-warden-build-dist"]

# --- pyforge-atlas (Atlas): pixi build workspace member (warden mirror, Story A1) -----
# Source + package manifest live in ./src/shared/packages/pyforge-atlas (its
# own [package] table, no [workspace]) — same src/shared/packages convention as
# warden. One hatchling pyproject is the single Python build backend:
#   * conda pkg  -> pixi-build-python wraps the hatchling wheel  (pyforge-atlas-build-conda)
#   * wheel+sdist-> `python -m build` from the same pyproject     (pyforge-atlas-build-dist)
# The path dependency below builds the CONDA package and installs it (plus
# run-deps, incl. pyforge-warden — the [gate] extra default-installed in-repo,
# AC-8) into the dedicated lean `pyforge-atlas` env.
# Spec: docs/specs/cfe-atlas-datapipeline-kedro-migration.md § 9 Story A1.
[feature.pyforge-atlas.dependencies]
pyforge-atlas = { path = "src/shared/packages/pyforge-atlas" }  # -> built conda pkg
pyforge-warden = { path = "src/shared/packages/pyforge-warden" }  # AC-8: the [gate] extra default-installed IN-REPO at feature level (A1-A5 alternative route) — NOT a pyforge-atlas package run-dep, so external conda installs stay warden-optional
pyforge-core = { path = "src/shared/packages/pyforge-core" }  # Story 14.2, CAP-2: admission.py/lasuite.py/basilisk.py/migration_status.py/refresh.py's mandatory run-dep (atomic_write)
pyforge-testing-kit = { path = "src/shared/packages/pyforge-testing-kit" }  # retro-2026-09-04 action item 11: branch_diff_guard.py shared by tests/meta/*.py (test-time only; not a package run-dep)
hatchling = ">=1.32.0"            # Python build backend (drives both conda + wheel/sdist)
python-build = ">=1.5.0"          # PyPA `python -m build` frontend (wheel + sdist)
pytest = ">=9.1.1"                # test runner (kedro-test)
pytest-cov = ">=7.1.0"            # Story 32.7 (spec-pyforge-testing-charter CAP-4, amended by spec-fleet-consistency-standard): coverage JSON for the named-module gate. Declared in only pyforge-marshal and local-recipes until 2026-09-07, so seven station envs could not run a coverage gate at all -- verified live against scribe, which exited 1 with "unrecognized arguments: --cov".
attrs = ">=26.1.0"                # spec-library-catalog-manifest-sync CAP-1: mirrors this station's own pixi.toml [package.run-dependencies] pin; observability.py's own run-dep, undocumented in root pixi.toml until 2026-09-12
filelock = ">=3.32.0"             # spec-library-catalog-manifest-sync CAP-1 (scoping correction): duckdb_writer.py + admission.py's own run-dep, undocumented in root pixi.toml until 2026-09-12 -- distinct from the separate marshal/scribe filelock *adoption* question tracked in pyforge-unifying-strategy's Estate leverage table
kedro-viz = ">=12.4.0"            # C2 `viz` task + test_viz_loadable smoke — NOT a pyforge-atlas run-dep so not pulled transitively; the lean no-default-feature env needs it explicitly (Gemini #85)
# AUD-ATLAS-010 (2026-07-27): G1 `wasm-smoke` + the D2 dashboard e2e test drive headless
# Chromium. TEST-ONLY — deliberately NOT package run-deps (the shipped package never drives
# a browser), so they live here rather than in the member pixi.toml run-dependencies.
# BOTH are required and they are different things: conda-forge `playwright` ships only the
# CLI/browser driver (bin/playwright, no site-packages module), while the Python bindings
# `import playwright` come from `playwright-python`. Declaring only the former resolves
# cleanly and still fails at import — which is exactly how this was missed.
playwright = ">=1.63.0"            # CLI + browser driver
playwright-python = ">=1.62.0"     # the `import playwright` bindings
# Story 14.3 (CAP-2, review-pass patch): tests/views/test_live.py hard-imports
# `starlette.testclient.TestClient`, which requires `httpx` at import time. Was TEST-ONLY
# (mirroring the playwright pair above) — already resolvable transitively via a2a-sdk's own
# httpx run-dep, but AUD-ATLAS-010 doctrine is that an undeclared hard import is a runtime
# dependency whether or not the manifest says so, and this diff's own commit message invokes
# that doctrine for tornado/starlette without applying it to this test file's httpx import.
# Story 16.2 (CAP-2) added a SECOND, non-test consumer: shipped operator tooling
# `src/shared/packages/pyforge-atlas/tools/lasuite_bringup.py` hard-imports httpx to build the
# real La Suite/Wagtail opener for the attended DW-H3 bring-up (it lives under tools/, outside
# the no-inline-IO scan root, so package code still imports no HTTP client — AC-2). Named here
# so pruning the starlette test never takes this declaration with it and breaks the bring-up.
httpx = ">=0.28.1"                # A next-generation HTTP client for Python.
mcp = ">=2.2.0"                   # steward 21.2: official SDK for atlas MCP host face (no fastmcp in this env)
# Story 12-1 (kedro-skills-audit-then-adopt): dev/tooling-only CLI, never a
# pyproject.toml runtime dep. SelfExplainML conda (not conda-forge). Same floor
# as [feature.local-recipes.dependencies]. See
# _bmad-output/projects/pyforge-atlas/planning-artifacts/specs/spec-kedro-org-tooling-adoption/kedro-skills-audit-report.md.
kedro-skills = ">=0.1.1"          # Distribute AI coding skills to Kedro projects.
# AUD-ATLAS-010: semantic/models.py imports boring_semantic_layer at module
# level. TEST/env supply only — not a pyforge-atlas package run-dep. Conda
# from SelfExplainML (conda-forge still at 0.2.0). Same floor as local-recipes.
boring-semantic-layer = ">=0.2.0" # A boring semantic layer built with ibis

[feature.pyforge-atlas.target.linux-64.dependencies]
# Story 20.1 (CAP-5, `query-plane-face` ruling 2026-08-26): Mosaic duckdb-server —
# the optional HTTP/Arrow face raised ONLY by pyforge.atlas.query_plane_boot (the
# one boot script) when the platform stack is up. Env supply only — deliberately
# NOT a pyforge-atlas package run-dep: the in-process library face never needs it
# (AD-16 local-first) and the boot degrades to library-face-only without it.
# linux-64 only here: duckdb-server itself is noarch, but hard-deps socketify,
# which conda-forge ships only on linux-64/osx-64 (no osx-arm64, no win-64) —
# placing it in the cross-platform table breaks the osx-arm64-min/win-64 solves
# (same shape as local-recipes' ocrmypdf/pixitainer scoping). On the other
# platforms the boot's provisioning preflight fails loud with the typed
# DuckDBServerNotProvisionedError instead — never a silent INSTALL.
# Import name is "pkg", NOT "duckdb_server" (recipes/duckdb-server G7 note).
# Floor confirmed against the solve 2026-08-27: conda-forge carries 0.27.0–0.31.0.
duckdb-server = ">=0.31.0"

[feature.pyforge-atlas.tasks.pyforge-atlas-test]
description = "Run the pyforge-atlas test suite. Story 32.2 (spec-fleet-consistency-standard CAP-5): the canonical fleet grammar is `pixi run -e pyforge-<station> pyforge-<station>-test`, documented in CLAUDE.md, and atlas was the one station where that command did not exist -- its suite only answered to `kedro-test`, so anyone following the documented contract got 'task not found'."
