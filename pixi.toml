# The Detectors workflow's environment (operator decision 2026-09-04, PR #1043): pixi
# first, pip only as the documented fallback in .github/workflows/detectors.yml.
# Deliberately tiny -- the repo-scope detectors are pyforge-doctor (+ its package
# run-deps: python>=3.14, jsonschema, pyyaml, mcp, pyforge-core), ruamel.yaml for the
# CFE catalog generator that failure_catalog_check shells out to, and playwright-python
# for check-layout's browser probe. No pytest/hatchling: this env RUNS detectors; it
# builds and tests nothing (that is `pyforge-doctor`). One lock, one authority: the
# pip fallback list in the workflow mirrors this table and exists only for a runner
# where pixi cannot be set up.
[feature.detectors.dependencies]
pyforge-doctor = { path = "src/shared/packages/pyforge-doctor" }  # -> built conda pkg; its run-deps bring python, jsonschema, pyyaml, mcp, pyforge-core
"ruamel.yaml" = ">=0.19.1"        # failure_catalog_generator.py, the subprocess behind failure_catalog_check (missing -> UNKNOWN, run 33906009816)
playwright-python = ">=1.62.0"    # check-layout's browser probe (unimportable -> cannot-measure, never a false green)

# --- PyForge dossier + infographic site -------------------------------------
# Renders docsite/content/ into a static site. The published copy is built in CI
# straight into docs/dashboard/ by dashboard.yml (a repo has ONE Pages
# deployment, so this never deploys itself); these tasks are the local loop.
[feature.site.dependencies]
python = ">=3.12"
jinja2 = ">=3.1.6"                # renders docsite/templates/*.j2
pyyaml = ">=6.0.3"                # reads docsite/content/*.yml

[feature.site.tasks.site]
description = "Build the PyForge dossier + infographic site into dist/."
cmd = "python docsite/build.py --out dist"

[feature.site.tasks.site-check]
description = "Build the site and verify its output (required pages, no stray template syntax, every infographic published intact)."
cmd = "python docsite/build.py --out dist --check"

[feature.site.tasks.site-verify]
description = "Check the dossier's stated figures against the source tree; exits 1 on drift."
cmd = "python docsite/tools/verify_claims.py"

[feature.site.tasks.site-serve]
description = "Build the site and serve it at http://localhost:8000 for preview."
cmd = "python -m http.server 8000 --directory dist"
depends-on = ["site-check"]

[environments]
# default-env: pyforge-guild
# ^ Story 63.1 (CAP-5): the Guild's session environment is the default; `local-recipes` is Mason's.
# ^ The "default-env:" directive above tells scripts/load-env.sh which environment
# to activate by default when entering this repository. Change the value to any
# environment name defined below. If omitted, the first environment key is used.
# linux only needs Python to run build-locally.py. Everything else happens in Docker.
linux = ["linux", "python"]
# osx and win do run natively on the machine, so we need the build deps too
osx = ["osx", "python", "build"]
win = ["win", "python", "build"]
build = ["python", "build"]
grayskull = ["python", "grayskull", "crm"]
conda-smithy = ["python", "conda-smithy", "shellcheck"]
local-recipes = ["python", "build", "grayskull", "conda-smithy", "local-recipes", "guild-tasks"]  # guild-tasks (tasks only, no deps) so every moved Guild task still resolves here (Story 63.1)
pyforge-guild = { features = ["python", "pyforge-guild", "guild-tasks"], no-default-feature = true }
default = { features = ["python", "pyforge-guild", "guild-tasks"], no-default-feature = true }  # ALIAS of pyforge-guild (operator 2026-09-16, Story 63.1): pixi resolves a bare `pixi run <task>` that several envs provide to the env NAMED `default`, and bare `pixi shell` activates it -- so the Guild env is the default by the tool, not by a doc. Keep the two feature lists identical; `pyforge-guild` stays the name every surface uses.  # THE session default for agents/harnesses (steward Story 63.1, CAP-5); python feature = python, pixi, gh, nodejs, bmad-method, spec-kit, truststore
vuln-db = ["python", "vuln-db"]
gcloud = ["python", "gcloud-sdk"]
