cmd = "python .claude/scripts/conda-forge-expert/cve_watcher.py"

[feature.local-recipes.tasks.platform-breakdown]
description = "Per-platform conda-forge download breakdown (Phase F+ Wave 2). Single package: PKG. Ranking: --top 50 --platform linux-aarch64. Maintainer roundup: --feedstock-roundup --maintainer X. --format markdown|json|csv (default markdown). Read-only; offline."
cmd = "python .claude/scripts/conda-forge-expert/platform_breakdown.py"

[feature.local-recipes.tasks.pyver-breakdown]
description = "Per-Python conda-forge download breakdown + python_min policy check (Phase F+ Wave 3). Single package: PKG. Policy check: --policy-check PKG (or --maintainer X). --threshold-pct N (default 2.0). Sort order in --policy-check: bump-safe -> aligned -> aggressive. --format markdown|json|csv (default markdown). Read-only; offline."
cmd = "python .claude/scripts/conda-forge-expert/pyver_breakdown.py"

[feature.local-recipes.tasks.find-alternative]
description = "Suggest healthier conda-forge packages for an archived/abandoned one. Combines keyword/summary/dependent/maintainer overlap with recency × downloads."
cmd = "python .claude/scripts/conda-forge-expert/find_alternative.py"

[feature.local-recipes.tasks.adoption-stage]
description = "Lifecycle classifier (bleeding-edge / stable / mature / declining / silent). Uses Phase F + Phase I data. --package NAME or --maintainer HANDLE."
cmd = "python .claude/scripts/conda-forge-expert/adoption_stage.py"

[feature.local-recipes.tasks.pypi-only-candidates]
description = "List PyPI projects with no conda-forge equivalent. Reads the pypi_universe side table (Phase D, schema v20+). --limit N, --min-serial M, --json. Admin-persona candidate list."
cmd = "python .claude/scripts/conda-forge-expert/pypi_only_candidates.py"

[feature.local-recipes.tasks.export-purls]
description = "Export the six purl + mapping artifacts (conda purls, versioned, pypi universe, conda↔pypi TSV, recipe exceptions, non-pypi upstream TSV) from cf_atlas.db + recipes/. --out-dir DIR, --json. cyclonedx-universe-inventory Wave A/S1."
cmd = "python .claude/scripts/conda-forge-expert/export_purls.py"

[feature.local-recipes.tasks.mapping-gap]
description = "Classify + recover conda↔PyPI mapping gaps offline (inverse-G10 spellings vs pypi_universe + grayskull reverse index). DRY-RUN by default; --write applies the no-clobber g10_spelling writeback. --json, --limit N, --report PATH. cyclonedx-universe-inventory Wave A/S2."
cmd = "python .claude/scripts/conda-forge-expert/mapping_gap.py"

[feature.local-recipes.tasks.universe-sbom]
description = "Emit the full conda-forge + PyPI universe inventory as a CycloneDX 1.6 (or SPDX 2.3) SBOM from cf_atlas.db. Slices: --actionable-only, --mapped-only, --conda-only, --pypi-only; --with-vulns, --allow-stale, --format, --out, --json. Refuses on a >14d-stale atlas (decision 6). cyclonedx-universe-inventory Wave B/S3."
cmd = "python .claude/scripts/conda-forge-expert/universe_sbom.py"

[feature.local-recipes.tasks.inventory-match]
description = "Match a user inventory (manifests / locks / SBOMs / pip+conda list text) against cf_atlas.db: ADD / ADD-NONPYPI / UPDATE-FEEDSTOCK / UPDATE-PIN / CURRENT / UNKNOWN buckets via three-way version comparison, freshness percentile, optional --policy CI gate (exit 2 on violations) + --weights sidecar; --sbom-in/--sbom-out annotates the BOM with cfe:gap_status. cyclonedx-universe-inventory Wave C/S5."
cmd = "python .claude/scripts/conda-forge-expert/inventory_match.py"

[feature.local-recipes.tasks.library-futures]
description = "Score conda-forge packages for 2027–2030 survival (keep/watch/plan-migration/replace) via a transparent weighted composite over atlas signals (upstream freshness, cadence, adoption, downloads, vuln posture, feedstock health, license, blast radius) + horizon signals (Python 3.14 readiness; LTS/EOL from endoflife.date→lts-registry→heuristic). --package NAME (repeatable) and/or inventory inputs; --json, --allow-stale. cyclonedx-universe-inventory Wave D/S7."
cmd = "python .claude/scripts/conda-forge-expert/library_futures.py"

[feature.local-recipes.tasks.recommend-2027]
description = "Single scorecard for the 2027–2030 window: runs inventory-match then library-futures over a user inventory → markdown + --json + optional annotated CycloneDX (cfe:futures_tier/score, cfe:py314_readiness, cfe:lts_status). --matches RESULT.json replays a saved match; --weights criticality sidecar; --overrides operator tier overrides (shown, never silent); Phase-P downloads refresh is OFFERED when stale, never run. cyclonedx-universe-inventory Wave D/S8."
cmd = "python .claude/scripts/conda-forge-expert/recommend_2027.py"

[feature.local-recipes.tasks.add-handoff]
description = "Emit the ADD-bucket packaging worklist from inventory-match results (name, readiness, template, blockers e.g. non-OSI license, signals_absent; ADD-NONPYPI appended unscored). Runs a bounded Phase-R-style single-package PyPI enrichment BEFORE scoring (idempotent pypi_intelligence upsert; --no-enrich for offline, --limit N caps fetches with dropped names reported). --matches RESULT.json consumes a saved inventory-match --json run. cyclonedx-universe-inventory Wave C/S6."
cmd = "python .claude/scripts/conda-forge-expert/add_handoff.py"

[feature.local-recipes.tasks.pypi-intelligence]
description = "Surface PyPI candidates with rich enrichment filters (schema v22+ pypi_intelligence). --not-in-conda-forge, --activity hot|warm|cold|dormant, --license-ok, --noarch-python-candidate, --min-downloads N, --in-bioconda / --in-pytorch / etc., --score-min N, --sort-by score|downloads|serial|name, --limit N, --json. Admin/maintainer-persona ranked candidate list with conda_forge_readiness scores."
cmd = "python .claude/scripts/conda-forge-expert/pypi_intelligence.py"

[feature.local-recipes.tasks.feedstock-health]
description = "Surface feedstocks with stuck bot version-update PRs / open bot PRs / cf-graph 'bad' flag. --maintainer X, --filter stuck|bad|open-pr|all, --limit N, --json"
cmd = "python .claude/scripts/conda-forge-expert/feedstock_health.py"

[feature.local-recipes.tasks.version-downloads]
description = "Per-version download breakdown for one package (Phase I). --by-downloads to rank by adoption, --limit N, --json"
cmd = "python .claude/scripts/conda-forge-expert/version_downloads.py"

[feature.local-recipes.tasks.release-cadence]
description = "Release cadence trend (Phase I). --package NAME or --maintainer HANDLE. Classifies trend as accelerating/stable/decelerating/silent. --json"
cmd = "python .claude/scripts/conda-forge-expert/release_cadence.py"

# ── vuln-db feature: AppThreat multi-source vulnerability database ─────────
# Adds NVD + GHSA + OSV + npm + custom advisory sources (vs. our OSV-only
# pypi_cve_db.json). Deliberately a separate env to keep local-recipes lean.
# First `vdb-refresh` is slow (~5-10 min, ~500MB-1GB at ~/.local/share/vdb).
# Subsequent refreshes are incremental.

[feature.vuln-db]
platforms = ["linux-64", "osx-arm64-min", "win-64"]

[feature.vuln-db.dependencies]
python = "3.14.*"                 # Python language interpreter
conda-forge-metadata = ">=0.16.1"  # so --deep also works in this env
apsw = ">=3.53.3.1"               # SQLite bindings for Python (vdb backend)
appthreat-vulnerability-db = ">=6.7.0"  # AppThreat Deep Signals vulnerability database (CVE, CISA KEV, EPSS, CWE, SPDX)
cyclonedx-bom = ">=7.3.0"         # CycloneDX Software Bill of Materials (SBOM) generation utility.
cyclonedx-python-lib= ">=11.11.0"  # Python library for CycloneDX.
#cdxgen = ">=12.7.1"               # Creates CycloneDX Bill of Materials (BOM) for projects and containers in 20+ languages and package managers
#oras-py = ">=0.2.42"              # OCI registry client for Python (vdb backend) — ORAS-hosted CVE DB snapshots blocked by conda-forge-metadata -> conda-oci-mirror -> oras-py ==0.1.14 i
# truststore lives in [feature.python.dependencies] — included via the python feature

[feature.vuln-db.pypi-dependencies]
#appthreat-vulnerability-db = { version = "*", extras = ["all"] }  # multi-source CVE DB (NVD + GHSA + OSV + npm + Snyk)
appthreat-vulnerability-db = "*"  # multi-source CVE DB (NVD + GHSA + OSV + npm + Snyk)

[feature.vuln-db.activation.env]
VDB_HOME = "$PIXI_PROJECT_ROOT/.claude/data/conda-forge-expert/vdb"
VDB_CACHE = "$PIXI_PROJECT_ROOT/.claude/data/conda-forge-expert/vdb-cache"
TRUSTSTORE = "1"

[feature.vuln-db.tasks.vdb-refresh]
description = "Build/refresh the AppThreat multi-source vulnerability DB (~5-10 min first time, ~600MB at .claude/data/conda-forge-expert/vdb/). Sources: OSV + GHSA. NOTE on KEV: --cache-os was evaluated for DW13 to add AquaSource (which carries NVD + distro CVEs), but appthreat-vulnerability-db's aqua.py hardcodes `kevc` (CISA KEV) into DEFAULT_IGNORE_SOURCE_PATTERNS with no env-var override, so --cache-os would download ~33 GB and still leave vuln_kev_affecting_current=0. KEV is therefore pulled out-of-band via `fetch-cisa-kev` (Path C; <1 MB direct from cisa.gov) and Phase G / G' overlay the result onto vdb's per-CVE output."
cmd = 'python -c "import truststore; truststore.inject_into_ssl(); from vdb.cli import main; main()" --cache'

[feature.vuln-db.tasks.detail-cf-atlas]
description = "Detail card with --vdb on by default (multi-source vulnerability summary: NVD + GHSA + OSV + Snyk + npm + …); add --version VER to scope the affecting-set to an arbitrary release. Pass --no-vdb to skip the vuln pass for a faster card."
cmd = "python .claude/scripts/conda-forge-expert/detail_cf_atlas.py --vdb"

[feature.vuln-db.tasks.detail-cf-atlas-vdb]
description = "Detail card with --vdb --vdb-all preset; pass <name> [--version VER] to list every CVE affecting a specific release (verbose variant of detail-cf-atlas)"
cmd = "python .claude/scripts/conda-forge-expert/detail_cf_atlas.py --vdb --vdb-all"

[feature.vuln-db.tasks.scan-project]
description = "Scan a project's manifests (pixi.lock, pixi.toml, Cargo.lock/toml, requirements.txt, pyproject.toml, environment.yml, Containerfile/Dockerfile) for CVEs. Use --github URL or local path. Add --os for OS-package lookups, --brief for summary, --sbom {cyclonedx,spdx} for SBOM output."
cmd = "python .claude/scripts/conda-forge-expert/scan_project.py"

[feature.vuln-db.tasks.inventory-channel]
description = "Inventory a channel/mirror (conda repodata.json | PyPI Simple v1 | npm registry | crates.io). Auto-detects format. --with-vulns ON by default for conda, OFF for others. JFrog auth via env vars. --diff for upstream comparison, --health for mirror signals, --sbom for SBOM."
cmd = "python .claude/scripts/conda-forge-expert/inventory_channel.py"

[feature.vuln-db.tasks.build-cf-atlas]
description = "Build the conda-forge atlas FROM THE VULN-DB ENV — runs Phase G (vdb summary) which needs the AppThreat vdb library importable. Set PHASE_GP_ENABLED=1 to also run Phase G' (per-version vuln scoring). All other phases run too; TTL gates keep them cheap."
cmd = "python .claude/scripts/conda-forge-expert/conda_forge_atlas.py build"

[feature.vuln-db.tasks.atlas-phase]
description = "Run a single cf_atlas phase from the vuln-db env (use for Phase G / G' which need the vdb library). Same CLI as the local-recipes version."
cmd = "python .claude/scripts/conda-forge-expert/atlas_phase.py"

