# --- Guild / planning tasks live in feature.guild-tasks (steward Story 63.1, CAP-5) -----------
# Detectors, ledger sync, surface stamps, fleet-picture and the three preflight aggregates.
# guild-tasks carries TASKS ONLY (no dependencies) and is included by both `-e pyforge-guild`
# (the session default; deps come from feature.pyforge-guild) and `-e local-recipes`. It is a
# separate feature from pyforge-guild because a deps-carrying feature cannot be included by
# local-recipes: station packages range-pin their engines to the empirically-verified minor
# (pyforge-marshal `tomlkit >=0.13,<0.13.3`, pyforge-warden `osv-scanner >=2.4,<2.5`) while the
# factory floats (`tomlkit >=0.15.1`, `osv-scanner >=2.5.1`) -- both found at the first solve,
# 2026-09-16. One name, one feature: never re-add a copy under feature.local-recipes.
# Interleaved with the factory tasks on purpose -- the move is a header rename, so
# `git blame` on every description survives.
[feature.guild-tasks.tasks.bmad-preflight]
description = "Verify local-recipes env, BMAD installation, and active project before BMAD workflows"
cmd = "bash scripts/ensure-bmad-preflight.sh"

[feature.guild-tasks.tasks.sprint-ledger-query]
description = "Pluggable estate sprint ledger query CLI duty (Story 65.1, spec-pyforge-steward CAP-146..149). Reads each station's TRACKED planning-artifacts/sprint-status-ledger.yaml + epics.md; counts agree with fleet_scan.parse_sprint_status. --format: markdown (default), summary, json, table; flag-gated: sync-matrix/jira-csv/github-json (enable_jira_github_matrix), herald-facts (enable_herald_facts), atlas-dataset (enable_vizro_dataset), static-dossier (enable_dossier_export) -- open one with `-- --flag <name>=true`, FLAGS_<NAME>=true, or .steward/flags.json. stdout carries the payload only; `--output PATH` writes it to that file instead (stdout empty). Writes into no other station's tree by default."
