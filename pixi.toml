[feature.pyforge-atlas.tasks.pyforge-atlas-coverage-gate]
description = "Mirror of .github/workflows/coverage-gates.yml's `named-module-gates (atlas)` job: run scripts/coverage_gates_ci.py over the modules THIS branch touches, in atlas's own env, against the 80% unit floor. Distinct from pyforge-atlas-test-coverage, which measures named modules against seeded ratchet floors -- this one measures only touched modules and is the gate that actually reds a PR. Added 2026-09-14 after PR #1355: board.py had sat at 70.1% since the Guildhall console was retired, and because the gate only measures TOUCHED modules it stayed invisible until an unrelated edit to that file surfaced it in CI with no local equivalent to catch it first."
cmd = "python scripts/coverage_gates_ci.py --base origin/main --head HEAD --suites unit"
env = { COVERAGE_GATES_STATIONS = "atlas" }

[feature.pyforge-atlas.tasks.pyforge-atlas-test-coverage]
description = "Story 32.7 (spec-pyforge-testing-charter CAP-4): full-package named-module coverage evaluate for pyforge-atlas. Floors are SEEDED FROM MEASUREMENT and ratchet upward only -- nobody had ever measured this station before 2026-09-07, so a flat 80/70 would have redded the fleet on day one. Fails naming each module under its floor, never a bare percentage."
cmd = "python scripts/run_station_coverage_gate.py --station atlas"

[feature.pyforge-atlas.tasks.kedro-test]
description = "Wave A deterministic gate: pyforge.atlas import smokes + Kedro namespace seam + scaffold layout (AD-11). Retained as a delegating alias of `pyforge-atlas-test` (Story 32.2) so existing callers and muscle memory keep working; the canonical name is the fleet-grammar one."
depends-on = ["pyforge-atlas-test"]

[feature.pyforge-atlas.tasks.kedro-catalog-check]
description = "Wave A gate 2 (Story A2, AD-11): catalog resolves offline w/ stub creds + no-inline-IO + AD-1 import-direction meta-tests + naming/layer/TTL/path conventions + 20 override points + per-host credential scoping (FR-1)"
cmd = "pytest src/shared/packages/pyforge-atlas/tests/unit/catalog -q"

[feature.pyforge-atlas.tasks.pyforge-atlas-bootstrap]
description = "Story 21.1 (CAP-1, Epic 21 success signal): fresh-clone Kedro bootstrap on PYFORGE_ATLAS_DATA_ROOT -- no legacy bootstrap-data / CF_ATLAS_DB required on this path. tools/bootstrap.py first mkdir's the two § 3.4 external-refresh store dirs (stores/vdb, stores/osv) under the data root, then seeds an EMPTY conf/local/credentials.yml stub (github_token/bigquery_adc) only if one is not already there -- Kedro resolves every catalog entry's `credentials:` key eagerly regardless of --pipeline, so a totally absent file would KeyError before a single node runs; both referencing datasets already no-op offline by default, so an empty stub is enough (a real operator's own credentials.yml is never touched). `kedro run --pipelines <list>` SUMS the named pipelines into ONE combined DAG and lets Kedro's own topological sort order every node -- no hand-guessed sequence: core, pypi_intelligence, vulnerability, vcs_health, upstream_discovery, derived_artifacts, seed_gaps, artifactory_downloads (Story 21.6, CAP-3: added because build_identity_packages_primary now reads artifactory_downloads' enterprise_jfrog_names as a real cross-pipeline free input -- a plain pandas.ParquetDataset with no AD-13 missing-file degrade, so it must actually be materialized once per fresh clone; params:artifactory.virtual_repos defaults to [] so the pipeline stays functionally inert -- zero live JFrog calls, zero new credentials). B5 external-refresh (vdb/OSV/mapping-cache) rides inside vulnerability's + pypi_intelligence's own trigger nodes, not a separate step. Excludes universal_sbom (entry-scoped, needs --params sbom_intake_path; spec non-goal) and semantic_packages/query_plane_cache (downstream composition/cache, not data-fetch). Exits 0 on an empty data root; credentialed-only nodes (live GitHub/BigQuery fan-out) degrade to their existing AD-13 seeded-or-empty default rather than failing the run."
cmd = "python tools/bootstrap.py && kedro run --pipelines core,pypi_intelligence,vulnerability,vcs_health,upstream_discovery,derived_artifacts,seed_gaps,artifactory_downloads"
cwd = "src/shared/packages/pyforge-atlas"

[feature.pyforge-atlas.tasks.trending-candidates]
description = "Story 13.3 (CAP-3, FR-66): query the CAP-2 tiered/classified GitHub-trending candidate list read-side, offline-safe — filterable by period/tier/top/not-on-cf/min-stars (tier-taxonomy.md's Operator-surface parameters table). Reads ONLY the already-materialized trending_candidates_classified dataset (no fetch here); mirrors the query_trending_candidates MCP tool byte-for-byte for identical filters, since both delegate to the SAME pyforge.atlas.trending_candidates.query.query_trending_candidates function. `--json` for machine-readable output, a formatted table otherwise."
cmd = "python -m pyforge.atlas.trending_candidates"

[feature.pyforge-atlas.tasks.trending-handoff]
description = "Story 13.5 (CAP-5, FR-68): hand off ONE tier-1/2 candidate from the CAP-2 classified set to the packaging factory (Mason) as a structured, schema-documented JSON record — never a recipe, never a staged-recipes PR. Requires a caller-supplied PASSING health-screen verdict (--verdict pass + non-empty --abandonment-signal/--license-clarity) on EVERY call; gates eligibility on the row's tier (1/2) directly, never on a not_on_cf boolean. Reads ONLY the already-materialized trending_candidates_classified dataset (no fetch here). NFR-6 exit codes: 0 pass, 1 policy-fail, 2 error, 130 interrupted."
cmd = "python -m pyforge.atlas.trending_candidates.handoff_main"

[feature.pyforge-atlas.tasks.parity-diff]
description = "Wave B verify gate (Story B1, AC-7): fixture-mode parity diff — each migrated node's output DataFrame vs its captured legacy snapshot (offline, non-credentialed, --frozen; B1 seeds Core/VCS fixtures, B4 consumes it at the attended credentialed event)"
cmd = "pytest src/shared/packages/pyforge-atlas/tests/unit/parity -q"

[feature.pyforge-atlas.tasks.bsl-metric-check]
description = "Wave D verify gate (Story D1, AC-4, FR-8 / AD-7): BSL metric-parity — each core metric (staleness / adoption stage / feedstock health / downloads / actionable + the first-class maintainer ⋈) declared ONCE as Ibis->DuckDB (AD-4) matches its legacy CLI formula, anchored by an INDEPENDENT re-implementation (DW-B1-1 honesty). Offline, --frozen."
