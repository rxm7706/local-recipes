# Repo-wide policy defaults (Marshal layer 2 of 4 in AD-16).
#
# The composition chain is: DEFAULT_POLICY (code) -> THIS FILE (repo-wide) ->
# project-layer marshal-policy.toml (per-station) -> invocation flags (--set),
# last wins. This file documents repo-wide decisions that apply to all loop
# homes unless explicitly overridden at the project or flag level.
#
# File location is canonical at `_bmad-output/policy-defaults.toml`; Story 1.10
# (policy rendering) reads from this file to render `.bmad-loop/policy.toml` for
# each project. The policy composition happens in `cli/config.py` (file I/O) +
# `core/policy.py` (the pure fold), and `core/policy.compose()` will accept a
# `repo_defaults` parameter once S-1.10 wires it in.
#
# Only keys that diverge from Marshal's built-in DEFAULT_POLICY should appear
# here. Keys deliberately ABSENT: `worktree_seed_paths` (generated from slug),
# `model_tier_map` (per-difficulty mapping, settable per story in FR-51).


# max_followup_reviews: 2 is a REPO-WIDE decision, not project-scoped.
#
# The upstream bmad-loop default is 1, which damped five still-recommended
# follow-up reviews across three projects (atlas 10.5/10.6, marshal 1.1,
# warden 6.3/5.1) into a gitignored ledger. That incident (DW-AD23-3) led to
# the creation of deferred-work-check itself -- a detector that only exists to
# surface work that the cap hid.
#
# The root cause: the cap was left at its upstream default (1) until it became
# a burden. Now it is explicitly 2 with reasoning inline (here). This is the
# only place this repo-wide decision lives; all 9 loop homes inherit it unless
# a project layer explicitly overrides it (rare), and new homes inherit it
# automatically.
#
# See the corresponding comment in `src/shared/packages/pyforge-marshal/src/
# pyforge/marshal/core/policy.py:DEFAULT_POLICY` for the full incident history
# and the design rationale for keeping this at the repo level.
max_followup_reviews = 2

# harness_preference (Story 22.8, FR-193 CAP-8): THIS MACHINE's expressed
# session-harness order for `marshal factory dispatch` AND (via
# render_policy_toml's [adapter].name derivation) bmad-loop -- one
# preference, two engines. Recorded 2026-08-27 after the live fleet-drain
# failure: the harness was hardcoded to `cursor agent`, whose auth had
# lapsed, and all three real dispatches died instantly. Order reflects this
# machine's verified estate that day: claude (authenticated, the reference
# adapter), cursor (re-authenticated the same day; the previous incumbent),
# copilot + gemini (authenticated in the repo pixi env, smoke-verified),
# devin (declared stub, no local binary). Resolution skips anything whose
# binary or authcheck fails, loudly (MRS-DISP-027), so a lapsed login moves
# the launch down this list instead of killing it.
#
# Wired since Story 22.8: `marshal config` and `marshal factory dispatch`
# read this layer (compose()'s repo_defaults); it wins over marshal's code
# default and loses to a project's marshal-policy.toml / --set flags.
harness_preference = ["claude", "cursor", "copilot", "gemini", "devin"]

# context (Story 46.4): repo-wide default for the 5-layer [context] block
# (Story 28.1, CAP-1). The 4 harness-agnostic layers default ON everywhere;
# `wire` alone defaults to the tri-state "auto" -- resolved per-launch,
# against the concrete harness profile, to on iff that profile declares a
# [wrapper] (off for a profile like cursor's that declares none, per Story
# 28.29). A station's own marshal-policy.toml [context] block, if present,
# is a force-override only -- per core/policy.py's wholesale-per-field
# composition, declaring ANY part of [context] there replaces this entire
# block for that station, so a station file should declare nothing here to
# inherit this default shape.
[context.output]
enabled = true

[context."structure-graph"]
enabled = true

[context."derived-context"]
enabled = true

[context."planning-graph"]
enabled = true

[context.wire]
enabled = "auto"
