# model_tier_map (FR-51, Story 33.6): difficulty class -> {stage: model}.
# Must stay LAST in this file (TOML table scoping).
# context.planning-graph (Story 28.27, token-economy CAP-6/CAP-13): verified
# live 2026-09-10 against pyforge-marshal (the canary) -- grounded retrieval,
# real measured savings, zero further engineering needed. scribe recall's
# own project-scoping gap (a lexical query naming a project slug could still
# be outscored by another project's denser-vocabulary node) was found and
# fixed in the same pass -- see scribe Story marshal-28.27 / recall.py's own
# scope= parameter. wire/output/structure-graph/derived-context stay
# declared-off (undeclared = default off) pending Story 28.31 (dispatch
# cost spike) / 28.33 (spin reference wiring).
[context."planning-graph"]
enabled = true

# context.derived-context (Story 28.28/28.32, token-economy CAP-5): scribe's
# `index refresh --declare` shipped and the lean pyforge-scribe env's
# missing cocoindex dependency was fixed -- verified live 2026-09-10
# against pyforge-marshal, mode: incremental with zero findings.
[context."derived-context"]
enabled = true

# context.output (Story 28.30/28.32, token-economy CAP-3): caveman skill
# deployment now reaches dispatch worktrees too (not just loop homes), and
# bmad-build-auto's own step-01-clarify-and-route.md tells the agent to
# invoke it.
[context.output]
enabled = true

# 2026-09-12 (dispatch-tier-routing-fails-safe): dev/review reverted to the
# same models the plain [adapter]/[adapter.review] baseline already uses.
# Cursor's composer-2.5/-fast is confirmed permanently dead for headless
# dispatch (spec-28-29-wire-is-dead-for-cursor-...) and this fleet's own
# harness_preference is cursor-only with no bmad-loop counterpart, so every
# heavy/medium/easy dispatch was silently launching claude with an invalid
# model string. render_policy_toml now refuses that mismatch outright
# (provider_declaring_model), so this revert is belt-and-suspenders: it
# keeps the config honest about what actually runs, not just safe by
# accident of a runtime filter.
[model_tier_map.heavy]
dev = "sonnet"
review = "opus"

[model_tier_map.medium]
dev = "sonnet"
review = "opus"

[model_tier_map.easy]
dev = "sonnet"

