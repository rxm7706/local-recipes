# Marshal project-policy layer for pyforge-herald.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#   (`model_tier_map` lives at file end — Story 33.6 / FR-51.)
#
# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"

# harness_preference (Story 22.8, FR-193 CAP-8): claude-only from 2026-09-18
# (operator ruling: Cursor is out of usage for the week). It was cursor-only
# from 2026-09-01 while Claude Code was spend-limited (Epic 28 + atlas drain on
# composer-2.5-fast; this station got the override 2026-09-10 after a
# drain-to-zero dispatch failed at launch on the claude-first repo default
# paired with a Cursor-only model name). Why a policy edit and not
# `--harness claude`: the tier map below is what actually leads the harness
# walk (Story 28.11) -- an inline `{ harness = "cursor", ... }` dev entry put
# cursor first regardless of the flag, and cursor's authcheck passes while
# its session dies on "You're out of usage" (herald 23.1 run
# pyforge-herald-20260918T132400673Z, launched with --harness claude, still
# ran cursor/grok-4.6 and failed in three seconds). The doctor/marshal claude
# dispatches earlier that day only happened because two prior cursor
# failures tripped the transient-exclusion. Flip both this line and the
# tier map together when Cursor comes back.
harness_preference = ["claude"]


# merge_subject_template: no override -- the repo default
# ("Merge {slug}/{key} into main", Story 50.4/FR-191 CAP-247) is now
# station-scoped at the grammar layer, making this station's former override
# redundant. It's removed here rather than kept-but-inert to avoid a second
# truth that could silently drift from the default. History: this override
# was added 2026-09-18 after atlas's seven `Merge 23-N into main` commits
# were misread as this station's own 23.1/23.2/23.5/23.6 landing (the
# default template carried no station token, and Story 35.1's known_keys
# corroboration only rejects a match whose key is NOT already tracked). The
# gate-side fix -- the `{slug}` placeholder in the templated shape itself --
# is what Story 50.4 shipped.


# verify_commands: THIS station's own suite. Every home except atlas and warden was
# cloned from warden's and inherited `pyforge-warden-test`, so a story here would have
# gone green on warden's tests while this station's own never ran.
verify_commands = [
  "pixi run --frozen -e pyforge-herald pyforge-herald-test",
]


