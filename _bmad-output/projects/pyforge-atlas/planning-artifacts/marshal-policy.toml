  "docs/reference/conda-forge-packaging-inventory-operations_*.md",
  "docs/dashboard/kedro-viz/**",
  ".github/workflows/kedro-viz-publish.yml",
  ".gitignore",
  "pixi.toml",
  "pixi.lock",
  "environment.yaml",
  "src/shared/packages/pyforge-atlas/**",
  "_bmad-output/projects/pyforge-atlas/planning-artifacts/specs/**",
  "_bmad-output/projects/pyforge-atlas/planning-artifacts/deferred-work-ledger.md",
