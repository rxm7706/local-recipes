# Marshal project-policy layer for pyforge-atlas.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#   * `model_tier_map` -- it maps DIFFICULTY CLASS to {stage: model}, and which
#     difficulty applies to a story is explicitly "a later story's concern", so the
#     vocabulary does not exist yet. The rendered template already carries the stage
#     baselines (`[adapter] model = "sonnet"`, `[adapter.review] model = "fable"`),
#     so per-stage tiering works without it. Populate when FR-51 tier-batching lands.
#
# Two commands: atlas gates on its suite AND its catalog contract. NOTE: Epic 10
# ran opus on both dev and review, which this layer does NOT express -- see the
# model_tier_map note below.

# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"


# verify_commands: THIS station's own suite. Every home except atlas and warden was
# cloned from warden's and inherited `pyforge-warden-test`, so a story here would have
# gone green on warden's tests while this station's own never ran.
#
# TEMPORARILY EMPTIED (2026-08-30, operator direction) for the drain_to_zero fleet
# campaign draining atlas's remaining backlog: an empty verify_commands composes to
# MRS-GATE-004 (Verdict.WARN, "nothing was run"), not a gate failure, so a story no
# longer blocks the whole campaign on kedro-test's own worktree-environment gaps.
# Landed stories are UNVERIFIED while this is empty. RESTORE THE TWO COMMANDS BELOW
# once the campaign finishes, then run the suite by hand across everything it landed.
verify_commands = []
# verify_commands = [
#   "pixi run --frozen -e pyforge-atlas kedro-test",
#   "pixi run --frozen -e pyforge-atlas kedro-catalog-check",
# ]


# epic_surfaces (AD-27, MRS-GATE-007/Story 2.3): per-epic writable-surface allowlist,
# narrowed further by a story spec's own `surface:` field when it declares one. The
# DEFAULT for an undeclared epic is `()` -- deny by default, narrow-only, never
# widened -- so an epic with no entry here blocks EVERY changed path from landing,
# not just an unexpected one. Story 21.3 (2026-08-30) was the first story on ANY
# station to reach marshal's fully-automated dispatch->verify->land path to
# completion, and hit exactly that: no station in this repo had ever declared
# epic_surfaces before. Scoped to what Epic 21's stories actually touch (per 21.3's
# own diff) plus Epics 22/23's stated scope in epics.md, not a wildcard.
# Widened 2026-08-30 (course-correction, sprint-change-proposal-2026-08-30): the first
# cut listed only what 21.3's diff touched, but the same spec's later stories land on
# the rest of the inventory quartet (21.7 identity.py, 22.1 priority.py, 22.6 the
# UI switch, 23.8/23.9 the workbook retirement), the quartet's docs/conf, the
# Kedro-Viz CI workflow (21.10), and pixi.toml (+ its ungated environment.yaml
# twin). fnmatch globs: `*` spans `/`, so `**` and `*` are equivalent here.
[epic_surfaces]
"21" = [
  "scripts/conda-forge-packaging-inventory-operations_metrics.py",
  "scripts/conda-forge-packaging-inventory-operations_openteams_identity.py",
  "scripts/conda-forge-packaging-inventory-operations_priority.py",
  "scripts/openteams_identity_dashboards.py",
  "scripts/tests/test_conda_forge_packaging_inventory_operations_*.py",
  "scripts/tests/test_openteams_identity_dashboards*.py",
  "conf/conda-forge-packaging-inventory-operations*",
  "docs/reference/conda-forge-packaging-inventory-operations_*.md",
  "docs/dashboard/kedro-viz/**",
  ".github/workflows/kedro-viz-publish.yml",
  "pixi.toml",
  "pixi.lock",
  "environment.yaml",
  "src/shared/packages/pyforge-atlas/**",
  "_bmad-output/projects/pyforge-atlas/planning-artifacts/specs/**",
  "_bmad-output/projects/pyforge-atlas/planning-artifacts/deferred-work-ledger.md",
  "_bmad-output/projects/pyforge-atlas/implementation-artifacts/**",
]
