# Optional, hand-maintained order overrides + declared skips for `marshal factory drain`
# (pyforge.marshal.core.dispatch_fleet.QUEUE_CONFIG_FILENAME). Absent = the station's
# backlog in topological `Deps:` order read from its epics.md (Story 28.12), ledger order
# breaking ties. A NON-EMPTY `order_overrides` list for a station replaces that: its keys
# run first, in list order, and every other backlog key follows in plain story-key order
# with `Deps:` ignored -- even when every listed key is already `done` or renamed, because
# the list itself is what switches the Deps sort off (dispatch_fleet.station_backlog). So
# prune a station's list once its keys have landed. A key that is `done` or absent from the
# station's tracked ledger is otherwise ignored (never a crash).
#
# 2026-09-27: every override list was pruned. Each of the 59 keys was `done` or no longer
# in its station's ledger, yet the lists still switched the Deps sort off for atlas,
# marshal and steward. History of the retired orderings: git log -p on this file (atlas
# 2026-08-30 course correction; marshal 2026-09-01 addendum F and the 2026-09-06
# spec-bmad-suite-lifecycle planning PR; steward the same PR).
order_overrides: {}

# Declared skips: honoured under every campaign mode (drain only -- a single
# `marshal factory dispatch` never reads this file). This is the one place a story whose
# ledger row must stay `backlog` is kept out of a drain; a "Parked ... do not dispatch"
# line in epics.md is prose that no code reads.
skip_policies:
  - station: pyforge-steward
    story: 44-4-fold-the-packages
    reason: "Parked 2026-09-13 (regenerate-not-fold), epics.md Story 44.4: file-move story superseded by Epic 54 / fnd:CAP-11; ledger stays backlog. Deps 44.3 + 44.12 are done, so without this a steward drain dispatches it first."
  - station: pyforge-steward
    story: 44-5-move-the-estate
    reason: "Parked 2026-09-13 (regenerate-not-fold), epics.md Story 44.5: not dispatched as a tree copy; suite/skills appear by re-provision from the register. Ledger stays backlog."
  - station: pyforge-steward
    story: 44-6-cfe-comes-home
    reason: "Parked 2026-09-13 (regenerate-not-fold), epics.md Story 44.6: not dispatched as a cell move; foundry CFE is rebuilt from Specs. Ledger stays backlog."
