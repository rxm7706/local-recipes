# landing_rules (Story 4.7, AD-40): this REPO's own two real landing rules,
# verbatim from CLAUDE.md's "PR CI gates" section -- now governed, machine-
# readable policy instead of a paragraph a human has to remember.
#
# maintenance-label: any change outside `recipes/**` needs the `maintenance`
# label at PR open/update time (gated -- suppressed for a recipe-only PR).
# trigger_mode = "exclude": fires when at least one changed path is OUTSIDE
# `recipes/**` (corrected in review, 2026-08-06 -- see core/landing.py).
[[landing_rules]]
name = "maintenance-label"
trigger_path_glob = "recipes/**"
trigger_mode = "exclude"
label = "maintenance"
ungated = false

# environment-yaml-sync: a `pixi.toml` change must regenerate `environment.yaml`.
# UNGATED -- this check applies regardless of the `maintenance` label.
# trigger_mode = "include": fires when `pixi.toml` itself is among the
# changed paths (corrected in review, 2026-08-06 -- the shipped code had
# this backwards, firing on almost every PR EXCEPT the one it exists to
# catch; see core/landing.py).
#
# `required_check` is a GitHub CHECK-RUN name, not this rule's own name, and the
# two are not the same thing here (corrected 2026-08-20). This repo emits exactly
# two check runs -- `linter` and `detectors` -- and the environment.yaml/pixi.toml
# sync assertion is step 3 INSIDE `.github/workflows/scripts/linter.py`, published
# under the `linter` job of staged-recipes-linter.yml. There has never been a check
# named `environment-yaml-sync`, so this rule could only ever resolve to
# "has not yet concluded" and then refuse the merge -- every `marshal land` on a
# pixi.toml-touching branch stalled on MRS-LAND-005/006 until a human acknowledged
# a finding about a check that does not exist. Observed live landing marshal 8.5.
[[landing_rules]]
name = "environment-yaml-sync"
trigger_path_glob = "pixi.toml"
trigger_mode = "include"
required_check = "linter"
ungated = true

# mcp_servers (Story 18.1 / FR-153+FR-154, AD-43): Marshal's own FastMCP
# surface. PATH-relative command only — `marshal init` renders this into the
# loop home's `.mcp.json` (seed-not-overwrite). Never a machine-absolute path.
[mcp_servers.marshal]
command = "marshal-mcp"
args = []

# dispatch (Story 33.8, CAP-6): factory-dispatch wave concurrency -- independent
# of bmad-loop scm max_parallel (spin). Must sit BEFORE model_tier_map (TOML
# table-scoping: trailing root keys nest under the last opened table).
[dispatch]
max_parallel = 2

# model_tier_map (FR-51, Story 3.11): DIFFICULTY CLASS -> {stage: model}. Must stay
# the LAST thing in this file -- see the comment block above. "heavy"/"easy" reuse
# Story 6.1's own test-fixture vocabulary (`test_spin.py::_model_tier_map_policy_path`)
# rather than inventing a second one. "medium" added 2026-08-30: it pins the flat
# baseline EXPLICITLY because `resolve_dispatch_model`'s unmapped-difficulty fallback
# is `next(iter(tier_map))` -- without this entry a `difficulty: medium` story
# dispatched via `marshal factory dispatch` would silently inherit the FIRST entry
# (heavy -> opus dev) instead of the baseline. Spin is unaffected (unmapped -> no
# override there); this makes the two paths agree.
# 2026-09-18: back on Claude Code (see harness_preference above) -- the same
# sonnet-dev / opus-review pairing the plain [adapter]/[adapter.review]
# baseline uses, kept as explicit {harness, model} tables in the fails-safe
# shape Story 33.15 established (spec-cursor-native-tier-map CAP-1). The
# 2026-09-13 Cursor Ultra ladder (composer-2.5-fast / grok-4.6 / composer-2.5)
# is in git history for the week Cursor usage returns.
[model_tier_map.heavy]
dev = { harness = "claude", model = "sonnet" }
review = { harness = "claude", model = "opus" }

[model_tier_map.medium]
dev = { harness = "claude", model = "sonnet" }
review = { harness = "claude", model = "opus" }

[model_tier_map.easy]
dev = { harness = "claude", model = "sonnet" }

