# Marshal project-policy layer for pyforge-marshal.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#
# `model_tier_map` IS present (see the bottom of this file, after the
# `[[landing_rules]]` array-of-tables entries -- TOML scopes a bare `key = value`
# line to the most recently opened table, so this dotted-table key must sit last or
# it would silently swallow `verify_commands`/`gate_mode` into itself). It maps a
# DIFFICULTY CLASS (a free-form string) to `{stage: model}`. A story declares which
# class governs its own launch via `difficulty: <key>` in its own Tier-3 spec
# frontmatter (`.claude/skills/bmad-dev-auto/spec-template.md` /
# `.claude/skills/bmad-quick-dev/spec-template.md`) -- authored, never derived from
# `epics.md`'s separate PM-time `Effort:` field. An undeclared or declared-but-unmapped
# difficulty resolves to "no override": the flat baseline stays unchanged
# (`[adapter] model = "sonnet"`, `[adapter.review] model = "opus"`). Only the stages
# present under the matched key get overridden -- an absent stage keeps its own
# existing baseline (`dev`/`triage` inherit `[adapter].model`; `review` has its own
# `[adapter.review].model` baseline and is untouched by a tier that omits it -- e.g.
# `easy` below overrides only `dev`, so an `easy` story's review still runs on the
# `opus` baseline, not a downgraded value).
#
# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"


# verify_commands: THIS station's own suite. Every home except atlas and warden was
# cloned from warden's and inherited `pyforge-warden-test`, so a story here would have
# gone green on warden's tests while this station's own never ran.
#
# TWO commands since 2026-07-30, because this home now runs TWO products. Marshal
# absorbed the genesis installer's 36 stories (epics 7-12, `epics-genesis-installer.md`)
# when `pyforge-genesis` was retired to constitutive. Marshal's own suite cannot gate a
# story that builds `pyforge-genesis` -- it would pass regardless, which is exactly the
# false green the 2026-07-30 audit found on six homes running warden's suite.
#
# `pyforge-deps-test` closes that: it is `tests/packaging/test_dependency_completeness.py`,
# pure stdlib in the lean `pyforge-ci` env, and it DISCOVERS `src/shared/packages/pyforge-*`
# BY GLOB -- so a package is covered the day it lands, with nobody having to remember.
# Per package it asserts manifest parity, that every hard import is a declared dependency,
# that conda run-deps cover the project deps and add nothing undeclared, that shared pins
# agree, and that versions match. ~0.4s, and it also covers pyforge-marshal itself.
#
# It is the RIGHT gate for S-7.1 (package skeleton) specifically, because of a bootstrap
# constraint worth remembering: `pixi run --frozen -e pyforge-genesis pyforge-genesis-test`
# cannot work until that env is in `pixi.lock`, and `--frozen` forbids solving. Marshal hit
# this itself -- `feature.pyforge-marshal.tasks.pyforge-marshal-test` first appears in
# `3b804eeb9d`, which IS its own S-1.1 merge. A package-creating story creates its own gate;
# it cannot be gated by it on the run that creates it.
#
# Add a third entry (`pixi run --frozen -e pyforge-genesis pyforge-genesis-test`) once S-7.1
# has landed the package, its pixi feature/env and the lock update.
verify_commands = [
  "pixi run --frozen -e pyforge-marshal pyforge-marshal-test",
  "pixi run --frozen -e pyforge-ci pyforge-deps-test",
]

# epic_surfaces (AD-27, MRS-GATE-007/Story 2.3): per-epic writable-surface allowlist,
# narrowed further by a story spec's own `surface:` field when it declares one. The
# DEFAULT for an undeclared epic is `()` -- deny by default, narrow-only, never
# widened -- so an epic with no entry here blocks EVERY changed path from landing,
# not just an unexpected one (see pyforge-atlas's own marshal-policy.toml, the first
# station to hit this: Story 21.3 was the first story on ANY station to reach
# marshal's fully-automated dispatch->verify->land path). Story 28.1 (2026-08-30)
# was pyforge-marshal's own first story through that path and hit the same wall.
# Scoped to what 28.1 actually touches, not a wildcard; widen per-story as later
# Epic 28 stories land, same pattern atlas used.
