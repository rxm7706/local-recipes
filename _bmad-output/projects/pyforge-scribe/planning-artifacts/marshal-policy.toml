# Marshal project-policy layer for pyforge-scribe.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#   * `model_tier_map` -- it maps DIFFICULTY CLASS to {stage: model}, and which
#     difficulty applies to a story is explicitly "a later story's concern", so the
#     vocabulary does not exist yet. The rendered template already carries the stage
#     baselines (`[adapter] model = "sonnet"`, `[adapter.review] model = "fable"`),
#     so per-stage tiering works without it. Populate when FR-51 tier-batching lands.
#
# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"


# verify_commands: THIS station's own suite. Every home except atlas and warden was
# cloned from warden's and inherited `pyforge-warden-test`, so a story here would have
# gone green on warden's tests while this station's own never ran.
verify_commands = [
  "pixi run --frozen -e pyforge-scribe pyforge-scribe-test",
]

# epic_surfaces (AD-27, MRS-GATE-007/Story 2.3): per-epic writable-surface allowlist,
# narrowed further by a story spec's own `surface:` field when it declares one. The
# DEFAULT for an undeclared epic is `()` -- deny by default, narrow-only, never
# widened -- so an epic with no entry here blocks EVERY changed path from landing,
# not just an unexpected one (see pyforge-atlas's own marshal-policy.toml, the first
# station to hit this). Story 6.1 (2026-08-30) was pyforge-scribe's own first story
# through marshal's fully-automated dispatch->verify->land path and hit the same
# wall. Scoped to what 6.1 actually touches, not a wildcard; widen per-story as
# later Epic 6 stories land, same pattern atlas used.
[epic_surfaces]
"6" = [
  # Widened 2026-08-31 for consistency with pyforge-marshal's epic-28 stopgap
  # and pyforge-atlas's own convention -- see that epic's comment for why.
  "src/shared/packages/pyforge-scribe/**",
  "_bmad-output/projects/pyforge-scribe/planning-artifacts/specs/**",
  "_bmad-output/projects/pyforge-scribe/implementation-artifacts/**",
  ".gitignore",
  "environment.yaml",
  "scripts/.spec-surface-baseline.json",
  ".claude/skills/pyforge-scribe/0.1.0/pyforge-scribe/SKILL.md",
  "_bmad-output/projects/pyforge-scribe/planning-artifacts/specs/spec-6-1-the-graphify-ingest-extra-and-its-move-list-verbs.md",
  "_bmad-output/projects/pyforge-scribe/planning-artifacts/specs/spec-6-2-the-cocoindex-incremental-ingest-extra.md",
  "_bmad-output/projects/pyforge-scribe/planning-artifacts/specs/spec-6-3-the-graph-node-staleness-flag.md",
  "pixi.toml",
  "pixi.lock",
  "src/shared/packages/pyforge-scribe/docs/cli-runbooks.md",
  "src/shared/packages/pyforge-scribe/pyproject.toml",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/cli.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/compile.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/extras/*.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/graph_store_pg.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/graph_store_plane.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/models.py",
  "src/shared/packages/pyforge-scribe/src/pyforge/scribe/recall.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_cli.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_compile.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_graph_store_operations.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_graph_store_plane.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_*graphify*.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_extras_*.py",
  "src/shared/packages/pyforge-scribe/tests/unit/test_recall.py",
]
