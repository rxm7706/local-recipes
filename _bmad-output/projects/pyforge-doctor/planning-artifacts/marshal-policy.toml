# Marshal project-policy layer for pyforge-doctor.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#   (`model_tier_map` lives at file end — Story 33.6 / FR-51.)
#
# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"

# harness_preference (Story 22.8, FR-193 CAP-8): cursor-only while Claude Code
# is spend-limited (2026-09-01 Epic 28 + atlas drain on composer-2.5-fast).
# Mirrors pyforge-marshal's/-atlas's/-warden's/-steward's own override -- this
# station never got it, so its dispatches inherited the repo-default
# `harness_preference` (claude-first) while still resolving `model_tier_map`'s
# composer-2.5-fast (a Cursor-only model name), a pairing Claude Code's CLI
# refuses outright. Found live 2026-09-10 when the drain-to-zero dispatch
# failed identically at launch.
# 2026-09-18 (operator ruling: Cursor is out of usage for the week) -- claude-only,
# mirroring pyforge-herald PR #1458. `--harness claude` alone cannot move a
# station whose tier map names an inline `{ harness = "cursor", ... }` dev entry
# (Story 28.11 leads the walk with it; spec-pyforge-marshal CAP-246 / Story 50.3
# is the fix). Flip this line and the tier map together when Cursor returns.
harness_preference = ["claude"]

# merge_subject_template: no override -- the repo default
# ("Merge {slug}/{key} into main", Story 50.4/spec-pyforge-marshal CAP-247)
# is now station-scoped at the grammar layer, making this station's former
# override redundant. It's removed here rather than kept-but-inert to avoid
# a second truth that could silently drift from the default. History: this
# override was added 2026-09-18 after herald PR #1457's finding that another
# station's unscoped "Merge N-M into main" merge could read as this
# station's own N.M already merged (Story 35.1's known_keys corroboration
# only rejects a match whose key is NOT already tracked). The gate-side fix
# -- the `{slug}` placeholder in the templated shape itself -- is what Story
# 50.4 shipped.


# verify_commands: THIS station's own suite. Every home except atlas and warden was
# cloned from warden's and inherited `pyforge-warden-test`, so a story here would have
# gone green on warden's tests while this station's own never ran.
verify_commands = [
  "pixi run --frozen -e pyforge-doctor pyforge-doctor-test",
]


