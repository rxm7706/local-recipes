        status: "closed"
        note: "Story 12.2 (2026-08-27): branch (a) chosen -- a dedicated blocking CI step re-runs cfe_rebuild_guard_check and lets its exit code stand (.github/workflows/detectors.yml); the CFE regression suite + slice-1 equivalence harness also now run in CI for the first time (.github/workflows/cfe-regression-net.yml). Durable: a tracked workflow-file change, not per-worktree state."
