# Status vocabulary (CAP-4, reconciled against CAP-3's explicit "any slice marked `parallel`"
# language — SPEC.md's own CAP-4 bullet prose omits `parallel` from its listed chain and
# orders cut-over before audited; CAP-3's parallel-run-detector capability presupposes a
# `parallel` state exists, so this file follows the fuller, CAP-3-consistent ordering below,
# not CAP-4's literal prose list). This story (6.1) only requires the vocabulary to exist and
# the first slice initialized at `mapped` — no slice reaches `parallel`/`audited`/`cut-over`/
# `retired` in this story.
status_vocabulary:
  - mapped     # slice boundary + total file/tool coverage derived and documented in slice-map.md
  - briefed    # skf-brief-skill has produced the slice's brief (Story 6.2 targets this for slice 1)
  - compiled   # skf-create-skill has produced a replacement; not yet running against live traffic
  - parallel   # replacement runs alongside the live original; equivalence-harness-gated (CAP-3)
  - audited    # skf-audit-skill reports zero drift between original and replacement
  - cut-over   # campaign-end state: callers flip to the replacement (CAP-2's "caller flip... at the campaign's end cutover")
  - retired    # campaign-end state: legacy code removed
  - skipped    # re-scope-gate (CAP-4/Story 6.4) decided "adjust" (drop/reorder) or "stop" for this slice -- the decision space CAP-4 names is explicitly go/adjust/stop, and no other state here can represent a slice the gate declines to continue

# Divergence-and-endgame guard hooks (Story 6.2, scripts/cfe_rebuild_guard_check.py).
# Per-slice fields (declared-state only -- populating them accurately is later work, not
# this detector's job):
#   equivalence               null | "green" | "red" | "stale". Required to read "green" once
#                              status is parallel/audited/cut-over (clause a) -- written by the
#                              equivalence harness (CAP-3/Story 6.3), never computed here from
#                              timestamps.
#   brief_path                null until skf-brief-skill has produced this slice's brief. Once
#                              set, the slice is checked by clause (b) below.
#   brief_mirrored_through    null | a commit SHA. The newest landed CFE Rule-2 retro (a commit
#                              touching both the CFE surface and CHANGELOG.md) that has been
#                              mirrored into this slice's brief. Stale relative to the newest
#                              qualifying retro in range -> `unmirrored-retro` finding.
# Campaign-level fields (under `campaign:` below):
#   endgame_declared           false throughout Epic 6. Once true, clause (c) requires every
#                              `campaign.callers` entry to have flipped off `resolves_to: "legacy"`.
#   callers                    [] until the end-cutover effort populates real caller-resolution
#                              entries (each an object with at least `resolves_to`).

