      c_cross_slice_rederivation:
        status: "open"
        note: "Not yet done -- this is Story 12.6's own job (slice 2's brief must re-derive its full cross-slice-dependency list before compiling, not just reconfirm the CVE-DB/Slice-3 ordering risk slice-map.md already names). Closes when 12.6's brief actually does that, not before."
      d_ownership_decision:
        status: "open"
        note: "SPEC.md Open Question 1 unresolved. Story 12.5 (backlog, not yet run) will record the operator's decision here (populate this entry -- do not invent a second key) and in SPEC.md's own Open Questions section."
    note: |
      2026-08-21 (Story 6.4, CAP-4 re-scope gate). DECISION: ADJUST (closer to
      "conditional go" than to this file's own status_vocabulary sense of "adjust" --
      see `decision` field's comment above for why the label was still kept as
      "adjust" rather than invented as a fourth term) -- continue toward slice 2, but
      not on an unconditional go; four concrete pre-conditions (below) gate slice 2's
      brief. No slice-2+ brief was written by this story.

      MEASURED COST (Stories 6.1-6.3, PRs #570/#578/#586, all landed 2026-08-21): 4
      substantive commits took the SMALLEST slice (3 scripts/3 wrappers/3 MCP tools) from
      "mapped" to "compiled, equivalence: green" -- 23130ee53f (6.1, 548 changed lines:
