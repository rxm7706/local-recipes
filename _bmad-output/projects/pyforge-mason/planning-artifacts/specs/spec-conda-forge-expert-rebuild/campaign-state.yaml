# CFE Rebuild campaign state (Epic 6, pyforge-mason).
#
# PURPOSE: a fresh session with zero prior context should be able to read this ONE file and
# know (1) what slices exist, (2) each slice's current status, and (3) what the next action
# is — enough to resume the campaign without hunting for that information elsewhere. This is
# a resumable POINTER, not a hermetic full-detail record: a `next_action` may cite a
# slice-map.md section or a gotcha ID for the FULL derivation detail (per-file coverage,
# knowledge sections, caller inventory) behind its one-line summary — `slice_map` / `spec`
# below are exactly those pointers, followed only when the summary here isn't enough.
#
# HOW TO RESUME: read `campaign.current_focus`, find that slice under `slices:`, read its
# `next_action`. That is the whole resume protocol.

