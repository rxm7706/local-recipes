      review-pass test-assertion hardening, not noise -- closed the gap per an explicit
      operator-decided resolution). ~7,330 total changed lines (insertions + deletions)
      and 2 of 4 substantive commits ending BLOCKED-then-retry, to fully close out a
      3-script slice.

      GATHERED GAPS:
      1. skf-audit-skill (CAP-2's own zero-drift tool) could not run in Story 6.3: this
         worktree has no `_bmad/_memory/forger-sidecar/forge-tier.yaml` (setup-forge never
