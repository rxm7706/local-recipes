    # records the measured cost and the go/adjust/stop decision for the remaining slices
    # before any second brief is written." Reached by Story 6.4 -- see `note` below for the
    # full cost accounting, decision, and end-cutover plan.
    reached: true
    decision: "adjust"  # structured, greppable verdict -- read this field, not prose
                         # substring-matching in `note` (the note's own reasoning text
                         # contains the literal word "go" inside negated phrases like "not
                         # an unconditional go"). NOT machine-enforced today: no detector
                         # (cfe_rebuild_guard_check.py or otherwise) reads this field or
                         # `reached`/`note` -- see GATHERED GAPS #5 below. This field's
                         # value is looser than this file's own `status_vocabulary`
                         # comment's use of "adjust" (which means drop/reorder a specific
                         # slice, reflected by marking it `skipped`) -- no slice is
                         # skipped here; this is closer to "conditional go" (continue, but
                         # slice 2's brief is gated on four named pre-conditions, not
                         # dropped/reordered). Kept as "adjust" to match CAP-4's literal
