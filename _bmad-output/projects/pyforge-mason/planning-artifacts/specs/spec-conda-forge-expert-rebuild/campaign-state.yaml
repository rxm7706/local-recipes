      #   "closed" -- the pre-condition's own specific concern (per its bullet in `note`
      #               below) is proven, by real evidence cited in this entry's `note`.
      #               That proof itself need not be re-run per worktree/session to stay
      #               "closed" -- but a `note` may honestly flag that a DIFFERENT,
      #               narrower operational step still recurs per worktree (see
      #               `b_skf_setup` below) without that reopening this status.
      #   "waived" -- a human explicitly decided to proceed without it; `note` records
      #               who/when/why.
