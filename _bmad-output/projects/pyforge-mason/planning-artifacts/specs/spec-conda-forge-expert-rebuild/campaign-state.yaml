  current_focus: "slice-1-recipe-generation"
  # Not restated here -- see slices[current_focus].next_action, the single source of truth
  # for "what's next" (avoids two independently-editable descriptions of the same fact).
  next_story: "6.2 — see slices[current_focus].next_action below"
  re_scope_gate:
    # CAP-4: "after the first slice completes, a dated re-scope note in the campaign state
    # records the measured cost and the go/adjust/stop decision for the remaining slices
    # before any second brief is written." Not yet reached — slice 1 has not completed
    # briefing, let alone compiling/parallel-run/audit.
    reached: false
    note: null
  # Story 6.2 guard hooks -- see the "Divergence-and-endgame guard hooks" comment above
  # status_vocabulary for the full field descriptions.
  endgame_declared: false
  callers: []

