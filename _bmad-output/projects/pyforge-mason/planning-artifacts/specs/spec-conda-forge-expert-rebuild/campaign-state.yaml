      an independent rebuild unit (ported opportunistically alongside whichever domain
      slice needs its modules). The "7-12x larger" framing applies specifically to slices
      2 and 3, not uniformly across 2-5.

      REASONING: the evidence does not support an unconditional go -- slice 1's own
      4-commit, 2-BLOCKED-pass cost for the smallest slice, plus the five gathered gaps
      above, make recording an unconditional go for slices 2 and 3 specifically (the
      ones actually 7.3x/12.3x larger -- slice 4 is smaller than slice 1 and slice 5
      isn't an independent unit, per REMAINING-SLICE SIZES above) irresponsible without
      naming what closes the gap first. It also does not support stop: slice 1 genuinely
      completed (status: compiled, equivalence: green, 60/60 regression + 6/6 equivalence
      tests pass), the parallel-run/detector structure is real, though currently
      advisory-only in CI enforcement (gap #2 above -- not glossed over: closing that gap
      is pre-condition (a) below, not assumed already solved), and Mason already has
      production callers into slice 2 (8 of 10 _CFE_SCRIPTS adapters) with real value in
      continuing. Pre-conditions before slice 2's brief is written (concrete and
      independently closeable, but NOT machine-enforced -- gap #5 above -- so honored by
      session/human discipline until a follow-up story adds detector support):
        (a) CI enforcement -- either make the repo-scope detector step block on
            cfe_rebuild_guard_check findings specifically, or explicitly and consciously
            accept advisory-only enforcement (this branch does not close gap #2, it
            accepts the residual risk) and add the CFE test suite + equivalence-harness
            test to a CI workflow as partial mitigation.
        (b) Run setup-forge (skf-setup) in whichever worktree will do slice 2's audit, so
            skf-audit-skill's real zero-drift tool -- not a manual sha256 substitute --
            backs the CAP-2 success bar. Gated at brief-time (not just audit-time)
            deliberately: discovering this tooling gap only at slice 2's audit step would
            mean investing a full brief-and-compile cycle before finding out the audit
            can't run for real, repeating gap #1's cost pattern one step later.
        (c) Slice 2's brief must re-derive its full cross-slice-dependency list (not just
            reconfirm the CVE-DB/Slice-3 ordering risk slice-map.md already names) before
            compiling, and should budget for at least one BLOCKED-and-retry cycle given
            slice 1's precedent.
        (d) Get the operator decision SPEC.md's Open Question 1 asks for (mason owns the
            whole rebuild vs. per-slice station ownership) before slice 2's brief --
            Slice 3 (atlas-intelligence) in particular arguably belongs to `atlas`, and
            the answer may reshape who authors which brief. No owner/timeline is named
            for raising this to the operator beyond this note itself; the fallback if it
            goes unanswered is that slice 2 briefing simply stays gated.
      All four are concrete, but "none requires re-opening slice 1's own recorded facts"
      is only mostly true: slice 1's `equivalence: green` currently rests partly on a
      manual sha256 substitute standing in for skf-audit-skill's real zero-drift tool
      (gap #1); once pre-condition (b) is met and skf-audit-skill actually runs -- quite
      possibly against slice 1 first, being the only compiled slice -- there is a real,
      non-zero chance it surfaces drift the manual substitute could not detect, which
      would reopen exactly that fact. Given slice 3 is even larger (12.3x) than slice 2,
      a repeat of this same measured-cost exercise before slice 3's brief -- not just
      slice 2's -- is recommended, though not mandated by CAP-4's literal one-time text.

      END-CUTOVER PLAN (high-level; trigger not yet reached):
      - Trigger: every slice reaches a terminal parallel-run status (audited, with
        equivalence: green) and campaign.endgame_declared is set true.
      - Mechanical steps: populate campaign.callers (currently []) from the Mason Caller
        Inventory in slice-map.md (10 _CFE_SCRIPTS adapters -- 2 into slice 1, 8 into
        slice 2 today, 0 into slices 3/4), flipping each entry's resolves_to from
        "legacy" to the compiled replacement one caller at a time. cfe_rebuild_guard_
        check.py's clause (c) already enforces (confirmed by reading the script directly;
        untouched by this story) that once endgame_declared is true, no campaign.callers
        entry may still resolve to "legacy" -- it is a finding until every caller flips.
        Legacy retirement follows once all callers have flipped and clause (c) is clean.
        Not yet accounted for in this plan: slice-map.md's Coverage Reconciliation notes
        two CFE-root artifacts Mason also invokes -- `native-build.sh` and
        `build-locally.py` (Slice 2, `build_native`/`build_docker`) -- that sit outside
        all three counted surfaces (scripts/wrappers/MCP tools) and outside the 10-adapter
        count above; whether they need their own `campaign.callers` entries or are
        permanently out of cutover scope is undecided and should be resolved no later
        than slice 2's own brief.
      - Sub-questions this plan deliberately leaves open (acceptable at this stage per
        this story's own boundaries): the delete-vs-dated-stub deprecation posture
        (SPEC.md Open Question 4, explicitly "per-slice choice") and how Rule-2 retros
        land during the overlap window (SPEC.md Open Question 5) -- neither blocks slice
        2 briefing; both should be settled before the actual end cutover executes.
