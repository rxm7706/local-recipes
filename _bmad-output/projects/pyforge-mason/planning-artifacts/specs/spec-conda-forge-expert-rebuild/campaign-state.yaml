  # Not restated here -- see slices[current_focus].next_action, the single source of truth
  # for "what's next" (avoids two independently-editable descriptions of the same fact).
  next_story: "6.2-6.4 done; next is gated on campaign.re_scope_gate's 4 pre-conditions — see slices[current_focus].next_action below"
