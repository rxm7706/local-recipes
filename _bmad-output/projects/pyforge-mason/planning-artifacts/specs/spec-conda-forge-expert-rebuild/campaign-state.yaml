         the same wall until setup-forge runs once per relevant worktree.
      2. No CI workflow runs the CFE test suite or the equivalence-harness test
         (test_slice1_equivalence.py, @pytest.mark.slow) -- grepped every
         .github/workflows/*.yml for `pytest`; the only hit is platform-ci.yml's
         src/platform-scoped Django suite, unrelated to CFE. cfe_rebuild_guard_check.py
         itself IS auto-discovered and run in CI (detectors.yml -> `python
         scripts/detectors.py --scope repo`, via its own `DETECTOR = {"scope": "repo"}`
         registry declaration; confirmed clean today, exit 0) -- but that CI step always
         `exit 0` regardless of the sweep's own exit code, so findings surface only as
         PR-warning annotations + a job-summary table, never a red/blocking check.
         SPEC.md's CAP-3 promise ("a detector... fails CI") is therefore advisory in
         practice today, for both the guard-check and the regression/equivalence net.
      3. Cross-slice-dependency risk scales with slice size: slice 1's one cross-slice
         import (github_updater.py -> Slice 2's github_version_checker.py) was invisible
         to Story 6.1's derivation pass and cost a full BLOCKED-then-retry cycle to find
         and close by hand. slice-map.md's own Slice-5 cross-slice-shared-imports table
         shows slices 2-4 depend on materially more shared infrastructure than slice 1 did
         (2 total cross-slice imports) -- e.g. `_http.py` alone spans all 4 domain slices
         -- and slice-map.md already names one live, unresolved instance for slice 2
         specifically: "Slice 2 is ordered before Slice 3 even though
         scan_for_vulnerabilities (Slice 2) consumes the CVE database cve_manager.py
         (Slice 3) builds... whoever briefs Slice 2 should re-confirm this ordering still
         holds up."
      4. SPEC.md's own Open Question 1 ("Is this genuinely Mason's to own, or
         cross-station?... Needs an operator decision before any slice beyond the first")
         is still unanswered -- a Spec-authored precondition for continuing past slice 1
         that predates this story.
      5. None of this note's own four pre-conditions (below) are machine-enforced: grepped
         every `.py` under `scripts/`, `_bmad/skf/`, `.claude/skills/` for `re_scope_gate`
         -- zero hits outside prose docs. `cfe_rebuild_guard_check.py`'s three clauses
         read only `slices[].status/equivalence/brief_path/brief_mirrored_through` and
