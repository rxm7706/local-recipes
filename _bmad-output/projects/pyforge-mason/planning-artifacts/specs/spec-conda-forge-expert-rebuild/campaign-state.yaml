# Status vocabulary (CAP-4, reconciled against CAP-3's explicit "any slice marked `parallel`"
# language — SPEC.md's own CAP-4 bullet prose omits `parallel` from its listed chain and
# orders cut-over before audited; CAP-3's parallel-run-detector capability presupposes a
# `parallel` state exists, so this file follows the fuller, CAP-3-consistent ordering below,
# not CAP-4's literal prose list). This story (6.1) only requires the vocabulary to exist and
# the first slice initialized at `mapped` — no slice reaches `parallel`/`audited`/`cut-over`/
# `retired` in this story.
status_vocabulary:
  - mapped     # slice boundary + total file/tool coverage derived and documented in slice-map.md
  - briefed    # skf-brief-skill has produced the slice's brief (Story 6.2 targets this for slice 1)
  - compiled   # skf-create-skill has produced a replacement; not yet running against live traffic
  - parallel   # replacement runs alongside the live original; equivalence-harness-gated (CAP-3)
  - audited    # skf-audit-skill reports zero drift between original and replacement
  - cut-over   # campaign-end state: callers flip to the replacement (CAP-2's "caller flip... at the campaign's end cutover")
  - retired    # campaign-end state: legacy code removed
  - skipped    # re-scope-gate (CAP-4/Story 6.4) decided "adjust" (drop/reorder) or "stop" for this slice -- the decision space CAP-4 names is explicitly go/adjust/stop, and no other state here can represent a slice the gate declines to continue

# Divergence-and-endgame guard hooks (Story 6.2, scripts/cfe_rebuild_guard_check.py).
# Per-slice fields (declared-state only -- populating them accurately is later work, not
# this detector's job):
#   equivalence               null | "green" | "red" | "stale". Required to read "green" once
#                              status is parallel/audited/cut-over (clause a) -- written by the
#                              equivalence harness (CAP-3/Story 6.3), never computed here from
#                              timestamps.
#   brief_path                null until skf-brief-skill has produced this slice's brief. Once
#                              set, the slice is checked by clause (b) below.
#   brief_mirrored_through    null | a commit SHA. The newest landed CFE Rule-2 retro (a commit
#                              touching both the CFE surface and CHANGELOG.md) that has been
#                              mirrored into this slice's brief. Stale relative to the newest
#                              qualifying retro in range -> `unmirrored-retro` finding.
# Campaign-level fields (under `campaign:` below):
#   endgame_declared           false throughout Epic 6. Once true, clause (c) requires every
#                              `campaign.callers` entry to have flipped off `resolves_to: "legacy"`.
#   callers                    [] until the end-cutover effort populates real caller-resolution
#                              entries (each an object with at least `resolves_to`).

campaign:
  # The one slice actively being worked. A fresh session should start here.
  current_focus: "slice-1-recipe-generation"
  # Not restated here -- see slices[current_focus].next_action, the single source of truth
  # for "what's next" (avoids two independently-editable descriptions of the same fact).
  next_story: "6.2-6.4 done; next is gated on campaign.re_scope_gate's 4 pre-conditions — see slices[current_focus].next_action below"
  re_scope_gate:
    # CAP-4: "after the first slice completes, a dated re-scope note in the campaign state
    # records the measured cost and the go/adjust/stop decision for the remaining slices
    # before any second brief is written." Reached by Story 6.4 -- see `note` below for the
    # full cost accounting, decision, and end-cutover plan.
    reached: true
    decision: "adjust"  # structured, greppable verdict -- read this field, not prose
                         # substring-matching in `note` (the note's own reasoning text
                         # contains the literal word "go" inside negated phrases like "not
                         # an unconditional go"). NOT machine-enforced today: no detector
                         # (cfe_rebuild_guard_check.py or otherwise) reads this field or
                         # `reached`/`note` -- see GATHERED GAPS #5 below. This field's
                         # value is looser than this file's own `status_vocabulary`
                         # comment's use of "adjust" (which means drop/reorder a specific
                         # slice, reflected by marking it `skipped`) -- no slice is
                         # skipped here; this is closer to "conditional go" (continue, but
                         # slice 2's brief is gated on four named pre-conditions, not
                         # dropped/reordered). Kept as "adjust" to match CAP-4's literal
                         # three-way vocabulary (go/adjust/stop) rather than inventing a
                         # fourth label; read the full `note` for the actual meaning.
    note: |
      2026-08-21 (Story 6.4, CAP-4 re-scope gate). DECISION: ADJUST (closer to
      "conditional go" than to this file's own status_vocabulary sense of "adjust" --
      see `decision` field's comment above for why the label was still kept as
      "adjust" rather than invented as a fourth term) -- continue toward slice 2, but
      not on an unconditional go; four concrete pre-conditions (below) gate slice 2's
      brief. No slice-2+ brief was written by this story.

      MEASURED COST (Stories 6.1-6.3, PRs #570/#578/#586, all landed 2026-08-21): 4
      substantive commits took the SMALLEST slice (3 scripts/3 wrappers/3 MCP tools) from
      "mapped" to "compiled, equivalence: green" -- 23130ee53f (6.1, 548 changed lines:
      547 insertions + 1 deletion), 1510a022e6 (6.2, 901 changed lines, all insertions;
      its own commit message says it is a re-run of an earlier reverted attempt that
      wrongly gated clause (b) on a literal commit-subject pattern), bf81f0b7ff (6.3 first
      pass, 5374 changed lines: 5367 insertions + 7 deletions, ended BLOCKED -- compiled
      the package but found a real, previously undocumented cross-slice import and
      correctly refused to fabricate a green equivalence result), ec193303b6 (6.3 second
      pass, 509 changed lines: 447 insertions + 62 deletions -- the deletions are the
      review-pass test-assertion hardening, not noise -- closed the gap per an explicit
      operator-decided resolution). ~7,330 total changed lines (insertions + deletions)
      and 2 of 4 substantive commits ending BLOCKED-then-retry, to fully close out a
      3-script slice.

      GATHERED GAPS:
      1. skf-audit-skill (CAP-2's own zero-drift tool) could not run in Story 6.3: this
         worktree has no `_bmad/_memory/forger-sidecar/forge-tier.yaml` (setup-forge never
         run here -- confirmed absent in this worktree, confirmed present in a sibling
         worktree, so it is per-worktree state, not a one-time global fix). Story 6.3
         substituted a manual sha256 diff instead. Every future slice's audit step hits
         the same wall until setup-forge runs once per relevant worktree.
      2. No CI workflow runs the CFE test suite or the equivalence-harness test
         (test_slice1_equivalence.py, @pytest.mark.slow) -- grepped every
         .github/workflows/*.yml for `pytest`; the only hit is platform-ci.yml's
         src/platform-scoped Django suite, unrelated to CFE. cfe_rebuild_guard_check.py
         itself IS auto-discovered and run in CI (detectors.yml -> `python
         scripts/detectors.py --scope repo`, via its own `DETECTOR = {"scope": "repo"}`
         registry declaration; confirmed clean today, exit 0) -- but that CI step always
         `exit 0` regardless of the sweep's own exit code, so findings surface only as
         PR-warning annotations + a job-summary table, never a red/blocking check.
         SPEC.md's CAP-3 promise ("a detector... fails CI") is therefore advisory in
         practice today, for both the guard-check and the regression/equivalence net.
      3. Cross-slice-dependency risk scales with slice size: slice 1's one cross-slice
         import (github_updater.py -> Slice 2's github_version_checker.py) was invisible
         to Story 6.1's derivation pass and cost a full BLOCKED-then-retry cycle to find
         and close by hand. slice-map.md's own Slice-5 cross-slice-shared-imports table
         shows slices 2-4 depend on materially more shared infrastructure than slice 1 did
         (2 total cross-slice imports) -- e.g. `_http.py` alone spans all 4 domain slices
         -- and slice-map.md already names one live, unresolved instance for slice 2
         specifically: "Slice 2 is ordered before Slice 3 even though
         scan_for_vulnerabilities (Slice 2) consumes the CVE database cve_manager.py
         (Slice 3) builds... whoever briefs Slice 2 should re-confirm this ordering still
         holds up."
      4. SPEC.md's own Open Question 1 ("Is this genuinely Mason's to own, or
         cross-station?... Needs an operator decision before any slice beyond the first")
         is still unanswered -- a Spec-authored precondition for continuing past slice 1
         that predates this story.
      5. None of this note's own four pre-conditions (below) are machine-enforced: grepped
         every `.py` under `scripts/`, `_bmad/skf/`, `.claude/skills/` for `re_scope_gate`
         -- zero hits outside prose docs. `cfe_rebuild_guard_check.py`'s three clauses
         read only `slices[].status/equivalence/brief_path/brief_mirrored_through` and
         `campaign.endgame_declared/callers`; nothing stops a future session from writing
         slice 2's brief before these pre-conditions are met. This story's own boundary
         forbids touching that detector's clause logic, so closing this enforcement gap
         (e.g. a clause (d) gating `brief_path` writes on `re_scope_gate.decision`) is
         explicitly out of scope here and is itself worth a small follow-up story --
         until then, this gate is honored by session/human discipline reading this note,
         not by tooling.

      REMAINING-SLICE SIZES (slice-map.md Coverage Reconciliation table; scripts/
      wrappers/MCP tools): slice 2 Recipe Lifecycle 22/17/19 (~7.3x slice 1's scripts);
      slice 3 Atlas Intelligence 37/35/22 (~12.3x); slice 4 Project Scanning & Security
