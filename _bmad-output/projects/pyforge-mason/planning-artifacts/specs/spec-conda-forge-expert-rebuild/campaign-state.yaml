         slice 2's brief before these pre-conditions are met. This story's own boundary
         forbids touching that detector's clause logic, so closing this enforcement gap
         (e.g. a clause (d) gating `brief_path` writes on `re_scope_gate.decision`) is
         explicitly out of scope here and is itself worth a small follow-up story --
         until then, this gate is honored by session/human discipline reading this note,
         not by tooling.

      REMAINING-SLICE SIZES (slice-map.md Coverage Reconciliation table; scripts/
      wrappers/MCP tools): slice 2 Recipe Lifecycle 22/17/19 (~7.3x slice 1's scripts);
      slice 3 Atlas Intelligence 37/35/22 (~12.3x); slice 4 Project Scanning & Security
