# conda-forge-expert per Rule 1, each with a Rule-2 retro that lands in the CFE
# CHANGELOG. Station default + the recipe/CFE surfaces those two stories actually touch,
# per the epic body -- not a wildcard.
"13" = [
  "src/shared/packages/pyforge-mason/**",
  "_bmad-output/projects/pyforge-mason/planning-artifacts/specs/**",
  "_bmad-output/projects/pyforge-mason/implementation-artifacts/**",
  "recipes/**",
  ".claude/skills/conda-forge-expert/**",
