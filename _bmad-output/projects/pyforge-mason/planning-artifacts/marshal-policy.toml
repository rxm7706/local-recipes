# model_tier_map (FR-51, Story 33.6): difficulty class -> {stage: model}.
# Must stay LAST in this file (TOML table scoping).
# context (Story 28.34, token-economy CAP-3): this station declares NO
# [context] block -- 28.31 (dispatch-cost spike) and 28.33 (spin reference
# wiring) both landed 2026-09-10/20, so the two layers this file used to
# hold declared-off (wire, structure-graph) are no longer blocked. Per
# policy-defaults.toml's own composition rule (declaring ANY part of
# [context] here wholesale-replaces the 5-layer default for this station),
# the fix is to declare nothing and inherit the clean repo-wide default:
# all 4 harness-agnostic layers on, wire auto-resolved per harness.

# 2026-09-13 (spec-cursor-native-tier-map / Story 33.15): Cursor Ultra
# ladder as explicit {harness, model} tables so a Cursor id cannot land
# on claude --model (fails-safe CAP-1). Unattended drain stays off until
# 28.29 is separately proven. This IDE drives the wave.
# 2026-10-03 (operator ruling, see harness_preference above): Cursor on composer-2.5-fast for dev and review in the
# heavy and medium tiers (an undeclared difficulty resolves to medium on dispatch); easy keeps composer-2.5.
[model_tier_map.heavy]
dev = { harness = "cursor", model = "composer-2.5-fast" }
review = { harness = "cursor", model = "composer-2.5-fast" }

[model_tier_map.medium]
dev = { harness = "cursor", model = "composer-2.5-fast" }
review = { harness = "cursor", model = "composer-2.5-fast" }

[model_tier_map.easy]
dev = { harness = "cursor", model = "composer-2.5" }

