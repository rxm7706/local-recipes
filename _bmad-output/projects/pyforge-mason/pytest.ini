[pytest]
testpaths = tests/unit tests/integration tests/performance tests/meta
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=src/pyforge_$(station)
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    --strict-markers
    -v
markers =
    unit: unit tests (fast, <1s each)
    integration: integration tests (medium, <10s each)
    e2e: end-to-end tests (slow, >10s)
    performance: performance benchmarks
    meta: invariant verification (determinism, envelope)
    high_risk: high-risk feature tests
timeout = 30
timeout_method = thread
