name: pyforge-steward-fresh-clone

# Story 31.3 / spec-bmad-suite-install-class-wiring CAP-3: the documented
# fresh-clone class-path must be able to fail CI. Lean: pytest + pyforge-core
# + pyforge-steward + PyYAML (suite probes). Does not run npm Installer classes.

on:
  pull_request:
    paths:
      - 'src/shared/packages/pyforge-steward/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-bmad-suite-install-class-wiring/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-bmad-suite-channel-product/install-matrix.md'
      - 'pixi.toml'
      - 'docs/dashboard/kedro-viz/**'
      - '.github/workflows/pyforge-steward-fresh-clone.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/packages/pyforge-steward/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-bmad-suite-install-class-wiring/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-bmad-suite-channel-product/install-matrix.md'
      - 'pixi.toml'
      - 'docs/dashboard/kedro-viz/**'
      - '.github/workflows/pyforge-steward-fresh-clone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyforge-steward-fresh-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.14 since 2026-09-08 (marshal Story 32.2, spec-fleet-consistency-standard
          # CAP-5). This lane pip-installs the pyforge packages outside pixi, so raising
          # their requires-python to >=3.14 made pip refuse here: "Package 'pyforge-core'
          # requires a different Python: 3.12.14 not in '>=3.14'". These three workflows
          # were the ONLY thing in the repo still exercising 3.12 -- see the correction
          # recorded on the Spec. detectors.yml already ran 3.14.
          python-version: '3.14'

      - name: Install check packages and pytest
        run: |
          python -m pip install --quiet pytest PyYAML
          python -m pip install --quiet --no-deps ./src/shared/packages/pyforge-core
          python -m pip install --quiet --no-deps ./src/shared/packages/pyforge-steward

      - name: Prove fresh-clone class-path (CAP-3)
        run: >
          pytest -q
          src/shared/packages/pyforge-steward/tests/unit/test_fresh_clone_class_path.py
