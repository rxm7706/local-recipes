name: directory_linter

# Explicit-run only. Upstream fires this on pull_request_target when a recipe is
# added directly under recipes/ instead of recipes/<pkg>/. That is contributor
# education for a community repo; in this fork it has never fired once. Kept as a
# manual tool rather than deleted, so it needs the PR number passed in —
# context.issue.number is empty on a workflow_dispatch event.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to comment on'
        required: true
        type: number

jobs:
  comment:
    name: Notify user about wrong dir
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ inputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Hi! Thanks for your contribution to conda-forge.' +
                    '\nUnfortunately, the recipe was added directly in the `recipes` folder without its own subfolder.\n' +
                    'Please move the recipe file (`<your_package.yaml>`) into a folder with the name of the package you want to submit.\n\n' +
                    'For example: if your recipe is currently under `recipes/<your_package>.yaml`, ' +
                    'it should be moved to `recipes/<your_package>/<your_package>.yaml`.\n' +
                    'Thanks!'
            })
