name: pyforge-core

# Story 22.1 (FR-13): generate the unified-CLI parity matrix in CI.
# Lean on purpose — pyforge-core is stdlib-only; pytest is the only extra.

on:
  pull_request:
    paths:
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/pyforge-*/pyproject.toml'
      - 'src/shared/packages/pyforge-*/src/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-22-prep-*.md'
      - '.github/workflows/pyforge-core.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/pyforge-*/pyproject.toml'
      - 'src/shared/packages/pyforge-*/src/**'
      - '_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-22-prep-*.md'
      - '.github/workflows/pyforge-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyforge-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pyforge-core and pytest
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet ./src/shared/packages/pyforge-core

      - name: Generate parity matrix and run pyforge-core tests
        run: >
          pytest -q
          src/shared/packages/pyforge-core/tests/unit
          src/shared/packages/pyforge-core/tests/meta/test_cli_parity_matrix.py
          src/shared/packages/pyforge-core/tests/meta/test_leaf_constraint.py
          src/shared/packages/pyforge-core/tests/meta/test_plugin_registration_conformance.py
