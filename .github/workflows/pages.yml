name: Pages

# Steward owns this duct (spec-pyforge-steward CAP-168 / Story 102.1–102.2). Herald owns
# the artifact content (pages-build, pages-check, docsite/, docs-site/, /herald/).
# This workflow is the sole actions/deploy-pages caller (herald herald:AD-21). No
# bot commit on main.
#
# Publishes one GitHub Pages artifact assembled at docs-site/build/site/
# (Starlight docs shelf at /, herald dossier at /herald/, Kedro-Viz at
# /dashboard/kedro-viz/). Story 102.4: atlas's kedro-viz-publish.yml uploads the export as
# the workflow artifact kedro-viz-export (atlas Story 30.1); the build job downloads the
# newest unexpired one into docs/dashboard/kedro-viz/ (gitignored), which
# docsite/tools/assemble_pages.py mounts, and skips the mount when there is none (herald
# Story 42.2). Lane 1 /console/ is the operator console.
#
# Story 102.2: build on pull_request and push (one filter),
# deploy on main only when the tree hash differs from live build.json.
# Story 102.3: a Guild step writes herald's fleet board input
# (docsite/content/fleet-status.json, from sprint-ledger-query --format json) before
# every build, and the build env carries PYFORGE_STATUS_PAGES (herald Story 42.1's
# flag); `steward pages build|deploy|status` is the duty that speaks to this workflow.
# Story 102.5: actions/configure-pages is authoritative on every host -- its base_url and
# base_path reach the build (SITE_URL, PAGES_HOST_BASE_URL, PAGES_HOST_BASE_PATH) with no flag
# (herald Story 42.3 retires the second-host flag) -- and after each deploy the
# deployed site ships as pages-site.zip on the rolling `pages-site` pre-release, for a host that
# cannot reach github.io and pulls reviewed bytes instead of rebuilding behind a mirror.

on:
  pull_request:
    paths: &pages_paths
      - 'docs/tutorials/**'
      - 'docs/how-to/**'
      - 'docs/reference/**'
      - 'docs/explanation/**'
      - 'docs/index.md'
      - 'docs/404.md'
      - 'docs/map.yaml'
      - 'docs-site/**'
      - 'docsite/**'
      - 'presentations/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths: *pages_paths
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # ci-surfaces: pages.build
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PAGES != 'true') }}
    runs-on: ubuntu-latest
    # actions: read (Story 102.4) lets the job list another workflow's runs and download its artifact.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    timeout-minutes: 20
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.stamp.outputs.changed }}
      tree_hash: ${{ steps.stamp.outputs.tree_hash }}
      pages_duty: ${{ steps.duty.outputs.pages_duty }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow, not sparse: the deck family pages publish each deck's PPTX (src/pptx/) and Marp
          # (src/marp/) files and its stamp sidecars (project/*.stamp.json), which is 77.6 MB of the
          # 84.9 MB tracked under presentations/ (2026-10-14). A sparse set that drops them still
          # passes site-check, because an absent download directory lists nothing.
          fetch-depth: 1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: site
          locked: true
          cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Resolve build env (flags)
        run: |
          pixi run --frozen -e pyforge-guild python docsite/tools/export_ci_surfaces_tile_env.py >> "$GITHUB_ENV"
          pixi run --frozen -e pyforge-guild python docsite/tools/export_pages_one_generator_env.py >> "$GITHUB_ENV"
          pixi run --frozen -e pyforge-guild python docsite/tools/export_status_pages_env.py >> "$GITHUB_ENV"
          pixi run --frozen -e pyforge-guild python scripts/pages_artifact_download.py --flag-env >> "$GITHUB_ENV"

      # Story 102.5: the deploy job's release-asset step reads steward's duty flag from here.
      - name: Carry the duty flag to the deploy job
        id: duty
        run: echo "pages_duty=${PYFORGE_PAGES_DUTY:-0}" >> "$GITHUB_OUTPUT"

      # The Kedro-Viz mount's build input (Story 102.4): atlas's newest unexpired kedro-viz-export,
      # into docs/dashboard/kedro-viz/. Absent (no run, no artifact, expired) is a normal build: it
      # exports KEDRO_VIZ_EXPORT=absent and herald's assembler skips the mount; a gh error fails the
      # step. Another artifact mount is a copy of this step with its own --workflow, --artifact,
      # --dest and --env-prefix.
      - name: Download the Kedro-Viz export artifact
        if: ${{ env.PYFORGE_PAGES_DUTY == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run --frozen -e pyforge-guild python scripts/pages_artifact_download.py
          --workflow kedro-viz-publish.yml --artifact kedro-viz-export
          --dest docs/dashboard/kedro-viz --env-prefix KEDRO_VIZ_EXPORT

      # Herald's fleet board reads this input when pyforge.herald.status_pages is on (herald
      # Story 42.1); it is written on every build so the flag can flip without a workflow edit.
      # The snapshot time is the built commit's, so a scheduled build of an unmoved tree hashes the
      # same and skips its deploy.
      - name: Write the fleet board's build input
        run: |
          pixi run --frozen -e pyforge-guild sprint-ledger-query -- --format json --output "$RUNNER_TEMP/sprint-ledger.json"
          pixi run --frozen -e pyforge-guild python scripts/pages_fleet_status.py \
            --ledger "$RUNNER_TEMP/sprint-ledger.json" \
            --generated-at "$(git log -1 --format=%cI HEAD)" \
            --out docsite/content/fleet-status.json

      # configure-pages is authoritative on every host (Story 102.5, herald Story 42.3): the
      # deploying host's base URL and path reach pages-check and the Astro build, no flag.
      - name: Build and verify the unified Pages artifact
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pixi run --frozen -e site pages-check

      - name: Validate docs-site (PR gate folded from docsite-check.yml)
        run: pixi run --frozen -e site docs-site-validate

      - name: Verify the dossier's numbers against the source tree
        continue-on-error: true
        run: pixi run --frozen -e site site-verify

      - name: Stamp build.json and decide deploy
        id: stamp
        run: |
          pixi run --frozen -e pyforge-guild python scripts/pages_build_stamp.py \
            --root docs-site/build/site \
            --live-url "${{ steps.pages.outputs.base_url }}/build.json" \
            >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact (non-PR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build/site

      # Every event (Story 102.5): a PR's review copy, and on main the deploy job's release asset.
      - name: Upload the site artifact (pages-site)
        uses: actions/upload-artifact@v7
        with:
          name: pages-site
          path: docs-site/build/site
          retention-days: 14

  deploy:
    # ci-surfaces: pages.deploy
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PAGES != 'true' && ((github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PAGES != 'true')) && github.event_name != 'pull_request' && needs.build.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    # contents: write is this job's alone (Story 102.5): the release asset. The build job keeps read.
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Story 102.5: the deployed bytes as pages-site.zip (build.json inside) on the rolling
      # `pages-site` pre-release, moved to the deploying commit. Not a version and outside every
      # protected tag pattern. Skipped with steward's duty flag off; a pull_request never deploys.
      - name: Download the deployed site
        if: ${{ needs.build.outputs.pages_duty == '1' && github.event_name != 'pull_request' }}
        uses: actions/download-artifact@v8
        with:
          name: pages-site
          path: pages-site

      - name: Publish the site as the pages-site release asset
        if: ${{ needs.build.outputs.pages_duty == '1' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # gh talks to the host that ran this workflow (github.com or a GitHub Enterprise host).
          export GH_HOST="${GITHUB_SERVER_URL#*://}"
          test -f pages-site/build.json
          (cd pages-site && zip -qr "$RUNNER_TEMP/pages-site.zip" .)
          if gh release view pages-site >/dev/null 2>&1; then
            gh release delete pages-site --cleanup-tag --yes
          fi
          gh release create pages-site --prerelease --target "$GITHUB_SHA" \
            --title "Pages site (rolling)" --notes "built_from $GITHUB_SHA, run $GITHUB_RUN_ID"
          gh release upload pages-site "$RUNNER_TEMP/pages-site.zip" --clobber
