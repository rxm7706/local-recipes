name: Pages

# Steward owns this duct (spec-pyforge-steward CAP-168 / Story 102.1). Herald owns
# the artifact content (pages-build, pages-check, docsite/, docs-site/, /herald/).
# This workflow is the sole actions/deploy-pages caller (herald herald:AD-21). No
# bot commit on main.
#
# Publishes one GitHub Pages artifact assembled at docs-site/build/site/
# (Starlight docs shelf at /, herald dossier at /herald/, Kedro-Viz at
# /dashboard/kedro-viz/). Atlas Kedro-Viz is staged under docs/dashboard/kedro-viz/
# by kedro-viz-publish.yml and copied into the artifact by docsite/tools/assemble_pages.py.
# Lane 1 /console/ is the operator console.
#
# kedro-viz-publish.yml stages the export, then this workflow republishes on push
# to main when published inputs change. Story 102.2 adds pull_request and the no-op
# deploy skip.

on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorials/**'
      - 'docs/how-to/**'
      - 'docs/reference/**'
      - 'docs/explanation/**'
      - 'docs/index.md'
      - 'docs/404.md'
      - 'docs/map.yaml'
      - 'docs/dashboard/**'
      - 'docs-site/**'
      - 'docsite/**'
      - 'presentations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ci-surfaces: dashboard.build
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_DASHBOARD != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/presentations/
            /presentations/*/project/*.html
          sparse-checkout-cone-mode: false

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: site
          locked: true
          cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Resolve Pages host env (flag + configure-pages)
        run: |
          pixi run --frozen -e pyforge-guild python docsite/tools/export_pages_host_env.py >> "$GITHUB_ENV"
          pixi run --frozen -e pyforge-guild python docsite/tools/export_ci_surfaces_tile_env.py >> "$GITHUB_ENV"
        env:
          PAGES_HOST_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Build and verify the unified Pages artifact
        run: pixi run --frozen -e site pages-check

      - name: Verify the dossier's numbers against the source tree
        continue-on-error: true
        run: pixi run --frozen -e site site-verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build/site

  deploy:
    # ci-surfaces: dashboard.deploy
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_DASHBOARD != 'true') }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
