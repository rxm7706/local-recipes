name: Dashboard (GitHub Pages)

# Publishes docs/dashboard/ to GitHub Pages. Steward 30.2 retired the
# Guildhall generator; this tree's live content is atlas Kedro-Viz under
# kedro-viz/. Lane 1 /console/ is the operator console.
# kedro-viz-publish.yml stages the export, then this workflow republishes
# on push to main. No scheduled regen — there is no data.js to refresh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: pyforge-ci
          locked: true
          cache: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dashboard
      - id: deployment
        uses: actions/deploy-pages@v5
