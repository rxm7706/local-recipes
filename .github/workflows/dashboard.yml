name: Dashboard (GitHub Pages)

# Publishes one GitHub Pages artifact assembled at docs-site/build/site/
# (Starlight docs shelf at /, herald dossier at /herald/, Kedro-Viz at
# /dashboard/kedro-viz/). Steward 30.2 retired the Guildhall generator; atlas
# Kedro-Viz is staged under docs/dashboard/kedro-viz/ by kedro-viz-publish.yml
# and copied into the artifact by docsite/tools/assemble_pages.py. Lane 1
# /console/ is the operator console.
#
# kedro-viz-publish.yml stages the export, then this workflow republishes
# on push to main. No scheduled regen — there is no data.js to refresh.
#
# This workflow is the only deploy-pages caller. A second workflow calling
# deploy-pages would race this one and intermittently wipe the Kedro-Viz
# export. Same reason kedro-viz-publish.yml stages rather than deploys.
# docsite/build.py only ever deletes the outputs it owns; nothing under
# docs-site/build/ is committed — see .gitignore.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: site
          locked: true
          cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Resolve Pages host env (flag + configure-pages)
        run: |
          pixi run --frozen -e pyforge-guild python docsite/tools/export_pages_host_env.py >> "$GITHUB_ENV"
        env:
          PAGES_HOST_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Build and verify the unified Pages artifact
        run: pixi run --frozen -e site pages-check

      - name: Verify the dossier's numbers against the source tree
        continue-on-error: true
        run: pixi run --frozen -e site site-verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
