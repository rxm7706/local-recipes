name: Dashboard (GitHub Pages)

# Publishes the static program console at docs/dashboard/ to GitHub Pages.
# NOTE: there is no data-generation step here — the data source
# (_bmad-output/**/sprint-status.yaml) is Tier-3 gitignored and unavailable in
# CI. Refresh data.js LOCALLY (`python docs/dashboard/generate.py`), commit it,
# and push; this workflow then republishes the committed docs/dashboard/.

on:
  push:
    branches: [main]
    paths:
      - 'docs/dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
