name: Kedro-Viz publish (real atlas DAG)

# Epic 12/FR-62 + Story 30.1 (CAP-62): build the REAL pyforge-atlas Kedro DAG's
# static kedro-viz export on every push touching its pipelines, stage it locally,
# and upload it as the workflow artifact ``kedro-viz-export`` (90-day retention).
# Pages consumes that artifact (steward 102.4); this job never commits to git.

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/pipelines/**'
      - 'src/shared/packages/pyforge-atlas/conf/base/catalog.yml'
      - 'src/shared/packages/pyforge-atlas/conf/base/globals.yml'
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/datasets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kedro-viz-publish
  cancel-in-progress: false

jobs:
  publish:
    # ci-surfaces: kedro-viz-publish
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_KEDRO_VIZ_PUBLISH != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: >-
            pyforge-atlas
          locked: true
          cache: true

      # `kedro viz build` resolves the WHOLE catalog, and two entries declare
      # `credentials:` (catalog.yml: `pypi_bigquery_downloads_raw` ->
      # `bigquery_adc`, `vcs_github_api_raw` -> `github_token`). Those live in
      # `conf/local/credentials.yml`, which `pyforge-atlas/.gitignore` excludes
      # via `conf/**/*credentials*` -- deliberately, and that rule is what keeps
      # real credentials out of the tree and out of the image. So a runner has
      # no credentials file at all and the build died with
      # "Unable to find credentials 'bigquery_adc'" the first time this
      # workflow ever fired (atlas 13.1 was the first push to touch
      # `pipelines/**`, this workflow's only path trigger).
      #
      # Both entries are `api.APIDataset`-family, whose `credentials` is an auth
      # pair -- viz only INTROSPECTS the DAG, it never loads through them. So
      # obviously-fake pairs are sufficient and nothing here is a secret. Shapes
      # mirror `pyforge-atlas/tests/catalog/conftest.py::STUB_CREDENTIALS`,
      # which is the project's existing stub vocabulary; keep them in step.
      #
      # Guarded on absence so this can never clobber a real file if the workflow
      # is ever run somewhere a developer's `conf/local/` is populated.
      - name: Materialize stub credentials for offline catalog resolution
        run: |
          set -euo pipefail
          CRED=src/shared/packages/pyforge-atlas/conf/local/credentials.yml
          if [ -e "$CRED" ]; then
            echo "$CRED already exists — leaving it untouched."
            exit 0
          fi
          cat > "$CRED" <<'YAML'
          # STUB credentials, written by .github/workflows/kedro-viz-publish.yml.
          # Not secrets. `kedro viz build` only introspects the DAG; it never
          # loads through these. Shapes mirror tests/catalog/conftest.py.
          bigquery_adc:
            - service-account
            - stub-adc
          github_token:
            - x-access-token
            - stub-token
          YAML
          echo "wrote stub $CRED"

      - name: Build + normalize + stage the real DAG's kedro-viz export
        run: pixi run -e pyforge-atlas viz-publish-stage

      - name: Resolve viz export artifact flag
        id: viz_export_flag
        run: |
          pixi run --frozen -e pyforge-guild python \
            src/shared/packages/pyforge-atlas/tools/print_viz_export_flag.py >> "$GITHUB_OUTPUT"

      - name: Upload kedro-viz export artifact
        if: ${{ steps.viz_export_flag.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kedro-viz-export
          path: docs/dashboard/kedro-viz/
          retention-days: 90
