name: Kedro-Viz publish (real atlas DAG)

# Epic 12/FR-62 + Story 30.1 (CAP-62): build the REAL pyforge-atlas Kedro DAG's
# static kedro-viz export on every push touching its pipelines, stage it locally,
# and upload it as the workflow artifact ``kedro-viz-export`` (90-day retention).
# Pages consumes that artifact (steward 102.4); this job never commits to git.
#
# Story 30.2 (CAP-63): a second producer, the `vizro` job, exports the Vizro boards as
# static pages (`vizro-static-export`, in `-e pyforge-atlas`) and uploads them as the
# artifact ``vizro-static-export`` (90 days); Pages mounts it at /dashboard/vizro/ (steward
# 102.4's consumer step, herald CAP-61). GitHub filters paths per workflow, not per job, so
# `on.push.paths` is the union of both producers' paths and the `changes` job tells each
# producer whether the push touched its own (workflow_dispatch runs both).

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/pipelines/**'
      - 'src/shared/packages/pyforge-atlas/conf/base/catalog.yml'
      - 'src/shared/packages/pyforge-atlas/conf/base/globals.yml'
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/datasets/**'
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/dashboard/**'
      - 'src/shared/packages/pyforge-atlas/src/pyforge/atlas/semantic/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kedro-viz-publish
  cancel-in-progress: false

jobs:
  changes:
    # ci-surfaces: kedro-viz-publish.changes
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_KEDRO_VIZ_PUBLISH != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kedro_viz: ${{ steps.paths.outputs.kedro_viz }}
      vizro: ${{ steps.paths.outputs.vizro }}
    steps:
      - uses: actions/checkout@v7

      # Each list is one producer's own paths (the `on.push.paths` entries, as git pathspecs).
      # Anything other than a push with a readable `before` commit runs both producers.
      - name: Which producer's paths did this push touch
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          KEDRO_VIZ_PATHS: >-
            src/shared/packages/pyforge-atlas/src/pyforge/atlas/pipelines
            src/shared/packages/pyforge-atlas/conf/base/catalog.yml
            src/shared/packages/pyforge-atlas/conf/base/globals.yml
            src/shared/packages/pyforge-atlas/src/pyforge/atlas/datasets
          VIZRO_PATHS: >-
            src/shared/packages/pyforge-atlas/src/pyforge/atlas/dashboard
            src/shared/packages/pyforge-atlas/src/pyforge/atlas/semantic
            src/shared/packages/pyforge-atlas/conf/base/catalog.yml
        run: |
          set -euo pipefail
          kedro_viz=true
          vizro=true
          # `git diff --quiet` exits 0 when the paths did not change and 1 when they did; any other
          # code is an error, and an error runs the producer rather than skipping it silently.
          touched() {
            local rc=0
            # shellcheck disable=SC2086  # the list is deliberately split into pathspecs
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $1 || rc=$?
            if [ "$rc" -eq 0 ]; then echo false; else echo true; fi
          }
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            kedro_viz=$(touched "$KEDRO_VIZ_PATHS")
            vizro=$(touched "$VIZRO_PATHS")
          fi
          echo "kedro_viz=$kedro_viz" >> "$GITHUB_OUTPUT"
          echo "vizro=$vizro" >> "$GITHUB_OUTPUT"
          echo "kedro_viz=$kedro_viz vizro=$vizro"

  publish:
    # ci-surfaces: kedro-viz-publish.publish
    # render: python scripts/ci_surface_gates.py --render
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_KEDRO_VIZ_PUBLISH != 'true' && (needs.changes.outputs.kedro_viz == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: >-
            pyforge-atlas
          locked: true
          cache: true

      # `kedro viz build` resolves the WHOLE catalog, and every entry that declares
      # `credentials:` needs its key in `conf/local/credentials.yml`, which
      # `pyforge-atlas/.gitignore` excludes via `conf/**/*credentials*` --
      # deliberately, and that rule is what keeps real credentials out of the tree
      # and out of the image. So a runner has no credentials file at all.
      #
      # The stub comes from the one list `tools/bootstrap.py` holds
      # (`CREDENTIAL_KEYS`, the eight keys `conf/base/catalog.yml` names, each
      # written `{}`), never from a list kept here: the two-key list this step used
      # to carry drifted from the catalog's eight (atlas Story 27.2 added six) and
      # run 39002722593 died with "Unable to find credentials 'gitlab_token'"
      # (atlas Story 32.1). `{}` is enough for every key, `api.APIDataset`-family
      # included: viz only INTROSPECTS the DAG and never loads through a
      # credential (measured 2026-10-17, kedro-viz 12.5.0: an all-`{}` stub and an
      # all-pair stub both build). Nothing here is a secret.
      # `tests/unit/test_viz_publish_build.py` fails when the catalog names a key
      # that list lacks, or when a step here carries a key list again.
      #
      # `--credentials-only` writes the stub only when the file is absent or empty
      # (no store directories), so it can never clobber a real file if the
      # workflow is ever run somewhere a developer's `conf/local/` is populated.
      - name: Materialize stub credentials for offline catalog resolution
        run: pixi run --frozen -e pyforge-atlas python src/shared/packages/pyforge-atlas/tools/bootstrap.py --credentials-only

      - name: Build + normalize + stage the real DAG's kedro-viz export
        run: pixi run -e pyforge-atlas viz-publish-stage

      - name: Resolve viz export artifact flag
        id: viz_export_flag
        run: |
          pixi run --frozen -e pyforge-guild python \
            src/shared/packages/pyforge-atlas/tools/print_viz_export_flag.py >> "$GITHUB_OUTPUT"

      - name: Upload kedro-viz export artifact
        if: ${{ steps.viz_export_flag.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kedro-viz-export
          path: docs/dashboard/kedro-viz/
          retention-days: 90

  vizro:
    # ci-surfaces: kedro-viz-publish.vizro
    # render: python scripts/ci_surface_gates.py --render
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_KEDRO_VIZ_PUBLISH != 'true' && (needs.changes.outputs.vizro == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pyforge-atlas carries vizro and plotly (the same env as the publish job); local-recipes
      # (over 10 GB) is the recipe factory's env, never a station job's (orchestrator ruling 2026-10-15).
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: >-
            pyforge-atlas
          locked: true
          cache: true

      - name: Resolve Vizro static boards flag
        id: vizro_flag
        run: |
          pixi run --frozen -e pyforge-atlas python \
            src/shared/packages/pyforge-atlas/tools/vizro_static_export.py --print-flag >> "$GITHUB_OUTPUT"

      # The same Dashboard object dashboard-dryrun builds, one static page per board, ONE
      # vendored assets/plotly.min.js; never a commit (the export is gitignored).
      - name: Export the Vizro boards as static pages
        if: ${{ steps.vizro_flag.outputs.enabled == 'true' }}
        run: pixi run --frozen -e pyforge-atlas vizro-static-export

      - name: Upload Vizro static export artifact
        if: ${{ steps.vizro_flag.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vizro-static-export
          path: docs/dashboard/vizro
          retention-days: 90
