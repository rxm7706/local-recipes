name: Detectors

# Runs the repo-scope detector suite on every PR and every push to main.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-07-31, which is the point of it: this
# repo had NINE detectors, seven pixi tasks, three rows on the dashboard, and
# ZERO automatic invocations. `EXEMPLAR-STANDARD.md` says of `dream_chain_check`
# that it "exits non-zero so it gates CI" — it gated nothing, because nothing
# ran it. Every green anyone reported was hand-run, by whoever remembered.
#
# The cost was not theoretical. PR #170 broke `spec_surface_check` (it changed a
# file governed by spec-pyforge-genesis without moving that Spec's memlog) and
# merged green, because the only check that ran was the staged-recipes linter.
#
# WHAT RUNS. `detectors-ci` = the scope=repo subset, discovered from the
# filesystem by scripts/detectors.py rather than listed here — a second
# hand-written list in this file would reproduce the exact defect the registry
# exists to prevent, and would omit the next detector somebody adds.
#
# WHAT DOES NOT RUN, and why it is not an oversight: the scope=runtime pair
# (dashboard-drift-check, loop-stall-check) reads gitignored Tier-3 sprint
# feeds, tmux, and ~/.bmad-loops. None of that exists on a runner. Those
# detectors observe what the factory DID, and the factory has no durable
# observation plane yet — see docs/dreams/fidelity-enforcement.md. Their absence
# here is that gap, surfacing as a deployment constraint.
#
# EXIT CODES: 0 pass · 1 findings · 2 could-not-run. 2 fails the job on purpose.
# A detector that cannot run reports unknown, never green (fidelity-enforcement,
# invariant 3); treating "we could not look" as success is the false-green this
# whole suite exists to refuse.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # story_status_check reads commit SUBJECTS on main to confirm a `done`
          # story is backed by a real merge; a shallow clone silently narrows
          # what it can see and would let a false green through.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Deliberately NOT pixi. The repo-scope detectors are stdlib + PyYAML and
      # shell out to git alone — the same property that lets generate.py run them
      # directly at deploy time. The `local-recipes` env is ~1102 packages /
      # ~9.8 GB, which is a poor trade for a suite that finishes in ten seconds.
      - name: Install detector dependencies
        run: python -m pip install --quiet pyyaml playwright

      # check_layout drives headless Chrome. ubuntu-latest ships google-chrome,
      # which the detector prefers via channel="chrome" before falling back to a
      # playwright-managed chromium. If neither resolves it reports UNKNOWN and
      # the suite exits 2 — visibly, rather than quietly skipping the one gate
      # that asserts the console bar LOOKS right.
      - name: Verify a browser is present for the layout gate
        run: |
          which google-chrome || which chromium || \
            python -m playwright install --with-deps chromium

      - name: Registry integrity
        # Fails when a detector script declares no scope, or declares one but has
        # no pixi task — i.e. when the registry itself has a hole. Run first and
        # separately so that failure reads as "the registry is wrong", not as a
        # finding from some detector.
        run: python scripts/detectors.py --list

      - name: Run repo-scope detectors
        run: python scripts/detectors.py --scope repo
