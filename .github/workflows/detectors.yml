name: Detectors

# Runs the repo-scope detector suite on every PR and every push to main.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-07-31, which is the point of it: this
# repo had NINE detectors, seven pixi tasks, three rows on the dashboard, and
# ZERO automatic invocations. `EXEMPLAR-STANDARD.md` says of `dream_chain_check`
# that it "exits non-zero so it gates CI" — it gated nothing, because nothing
# ran it. Every green anyone reported was hand-run, by whoever remembered.
#
# The cost was not theoretical. PR #170 broke `spec_surface_check` (it changed a
# file governed by spec-pyforge-genesis without moving that Spec's memlog) and
# merged green, because the only check that ran was the staged-recipes linter.
#
# WHAT RUNS. `detectors-ci` = the scope=repo subset, discovered from the
# filesystem by scripts/detectors.py rather than listed here — a second
# hand-written list in this file would reproduce the exact defect the registry
# exists to prevent, and would omit the next detector somebody adds.
#
# WHAT DOES NOT RUN, and why it is not an oversight: the scope=runtime pair
# (dashboard-drift-check, loop-stall-check) reads gitignored Tier-3 sprint
# feeds, tmux, and ~/.bmad-loops. None of that exists on a runner. Those
# detectors observe what the factory DID, and the factory has no durable
# observation plane yet — see docs/dreams/fidelity-enforcement.md. Their absence
# here is that gap, surfacing as a deployment constraint.
#
# ADVISORY, NOT BLOCKING — operator decision 2026-07-31 — WITH TWO SCOPED
# EXCEPTIONS, each a dedicated blocking step below whose exit code stands.
# (1) Story 12.2, pyforge-mason, 2026-08-27: `cfe_rebuild_guard_check`. The
# CFE-rebuild campaign's re-scope gate named CI enforcement as pre-condition (a)
# for continuing to slice 2, and SPEC.md's CAP-3 promises a detector that
# "fails CI". (2) Operator ruling 2026-09-14 (DW-VOCAB-2026-09-14-16): Doctor's
# durability verdict on Marshal's row — `ledger-regression`. Charter §6 makes
# Doctor the judge of Marshal so Marshal never grades itself, and §5 assumes
# the judge's verdict is the one with force; but this sweep was advisory while
# marshal's own coverage gate (coverage-gates.yml) blocks, so the judge
# annotated and the judged station's gate red the PR. The ruling reverses that
# for exactly ONE row, not fleet-wide. Every other detector's findings still
# surface as GitHub warning annotations and a job summary; the advisory sweep
# itself always succeeds, so their findings never block a merge.
#
# State that plainly rather than letting the green tick imply more than it means:
# this is FAST FEEDBACK, not a gate. docs/dreams/fidelity-enforcement.md holds
# that "a contract that nothing can fail against is a plan", and by its own test
# an advisory check is the weaker thing. It is still a large step up from what
# preceded it — nothing ran these at all, and PR #170 merged a real
# spec_surface_check break unnoticed — but it is deliberately short of a gate,
# and the Dream records that as an open decision rather than a settled one.
#
# To make it gate later: delete the `|| true`, drop the annotation plumbing, and
# let the runner's exit code stand (0 pass · 1 findings · 2 could-not-run — 2
# being "could not look", which must never read as success).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # tests/scripts is the detectors' own test suite (scripts/detectors.py's
  # Doctor-registry integration, the spec-surface / deferred-work / mirror /
  # bmad-switch scripts). Until 2026-09-05 no workflow ran it and 24 stale
  # tests had rotted on main unnoticed. It runs in the pure-stdlib
  # `pyforge-ci` env the `pyforge-doctor-scripts-test` task was written for.
  scripts-suite:
  # ci-surfaces: detectors.scripts-suite
  # render: python scripts/ci_surface_gates.py --render
  if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_DETECTORS != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The rebuild-guard and mason-surface tests walk real history
          # (806cb63046..HEAD) and diff each commit against its parents; on a
          # shallow clone the PR's synthetic merge commit has no parents, reads
          # as a root commit that 'touches' the whole tree, and both suites go red.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-ci pyforge-doctor
          cache: true
      - name: tests/scripts (pyforge-doctor-scripts-test)
        run: pixi run --frozen -e pyforge-ci pyforge-doctor-scripts-test
      # The detector-aggregate tests that load Doctor's dispatch table, and the
      # verdict-writer tests that import its citation predicate (doctor Story 41.1),
      # skip above (pyforge-ci has none of Doctor's run-deps, by design); they run
      # for real here, where Doctor's run-deps are installed (doctor Story 38.5).
      # pr-preflight runs the same task (doctor Story 39.1): every step in this job must be a
      # `pixi run --frozen -e <env> <task>` that pr-preflight also runs, or
      # doctor's test_preflight_mirrors_scripts_suite.py reds.
      - name: tests/scripts/test_detectors_doctor_sources.py + test_apply_verification_verdicts.py (pyforge-doctor-aggregate-scripts-test)
        run: pixi run --frozen -e pyforge-doctor pyforge-doctor-aggregate-scripts-test

  detectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # story_status_check reads commit SUBJECTS on main to confirm a `done`
          # story is backed by a real merge; a shallow clone silently narrows
          # what it can see and would let a false green through.
          fetch-depth: 0

      # pixi FIRST (operator decision 2026-09-04, PR #1043): the dedicated
      # `detectors` environment in the root workspace -- pyforge-doctor (+ its
      # run-deps), ruamel.yaml for the CFE catalog generator, playwright-python
      # for the layout gate -- installed from pixi.lock with `locked: true`, so
      # the detectors run on exactly the versions pixi.toml pins and there is no
      # second, hand-maintained dependency list to drift (the 2026-09-04 ruamel
      # gap was that drift). It is small on purpose: the `local-recipes` env is
      # ~1102 packages / ~9.8 GB, a poor trade for a suite that finishes in
      # seconds.
      #
      # pip is the FALLBACK, not a second primary: if setup-pixi cannot run
      # (action outage, a runner without the binary, a lock the manifest has
      # outgrown), the job says so with a visible warning and installs the same
      # packages with pip so the detectors still run. The fallback is the old
      # path verbatim; it exists so a pixi problem never reads as "no findings".
      - uses: actions/setup-python@v7
        with:
          # pyforge-doctor's own requires-python floor (Story 6.9). Used by the
          # pip fallback only -- the pixi env carries its own interpreter.
          python-version: '3.14'

      - name: Set up pixi (primary)
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: detectors
          locked: true
          cache: true

      - name: Choose the interpreter (pixi, else pip)
        id: py
        run: |
          if [ "${{ steps.pixi.outcome }}" = "success" ] \
             && pixi run --frozen -e detectors python -c "import pyforge.doctor, yaml, ruamel.yaml" >/dev/null 2>&1; then
            echo "cmd=pixi run --frozen -e detectors python" >> "$GITHUB_OUTPUT"
            echo "mode=pixi" >> "$GITHUB_OUTPUT"
            echo "Detectors run in the locked pixi 'detectors' environment."
          else
            echo "cmd=python" >> "$GITHUB_OUTPUT"
            echo "mode=pip" >> "$GITHUB_OUTPUT"
            echo "::warning title=Detectors::pixi unavailable (setup-pixi outcome: ${{ steps.pixi.outcome }}) -- falling back to pip. Findings below are real, but the environment is not the locked one."
          fi

      - name: Install detector dependencies (pip fallback)
  # ci-surfaces: detectors.detectors
  # render: python scripts/ci_surface_gates.py --render
  if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_DETECTORS != 'true') }}
