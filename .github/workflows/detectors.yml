name: Detectors

# Runs the repo-scope detector suite on every PR and every push to main.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-07-31, which is the point of it: this
# repo had NINE detectors, seven pixi tasks, three rows on the dashboard, and
# ZERO automatic invocations. `EXEMPLAR-STANDARD.md` says of `dream_chain_check`
# that it "exits non-zero so it gates CI" — it gated nothing, because nothing
# ran it. Every green anyone reported was hand-run, by whoever remembered.
#
# The cost was not theoretical. PR #170 broke `spec_surface_check` (it changed a
# file governed by spec-pyforge-genesis without moving that Spec's memlog) and
# merged green, because the only check that ran was the staged-recipes linter.
#
# WHAT RUNS. `detectors-ci` = the scope=repo subset, discovered from the
# filesystem by scripts/detectors.py rather than listed here — a second
# hand-written list in this file would reproduce the exact defect the registry
# exists to prevent, and would omit the next detector somebody adds.
#
# WHAT DOES NOT RUN, and why it is not an oversight: the scope=runtime pair
# (dashboard-drift-check, loop-stall-check) reads gitignored Tier-3 sprint
# feeds, tmux, and ~/.bmad-loops. None of that exists on a runner. Those
# detectors observe what the factory DID, and the factory has no durable
# observation plane yet — see docs/dreams/fidelity-enforcement.md. Their absence
# here is that gap, surfacing as a deployment constraint.
#
# ADVISORY, NOT BLOCKING — operator decision 2026-07-31 — WITH ONE SCOPED
# EXCEPTION (Story 12.2, pyforge-mason, 2026-08-27): `cfe_rebuild_guard_check`
# alone is a real gate. The CFE-rebuild campaign's re-scope gate named CI
# enforcement as pre-condition (a) for continuing to slice 2, and SPEC.md's
# CAP-3 promises a detector that "fails CI" — so that ONE detector gets a
# dedicated blocking step below whose exit code stands. Every other detector's
# findings still surface as GitHub warning annotations and a job summary; the
# advisory sweep itself always succeeds, so their findings never block a merge.
#
# State that plainly rather than letting the green tick imply more than it means:
# this is FAST FEEDBACK, not a gate. docs/dreams/fidelity-enforcement.md holds
# that "a contract that nothing can fail against is a plan", and by its own test
# an advisory check is the weaker thing. It is still a large step up from what
# preceded it — nothing ran these at all, and PR #170 merged a real
# spec_surface_check break unnoticed — but it is deliberately short of a gate,
# and the Dream records that as an open decision rather than a settled one.
#
# To make it gate later: delete the `|| true`, drop the annotation plumbing, and
# let the runner's exit code stand (0 pass · 1 findings · 2 could-not-run — 2
# being "could not look", which must never read as success).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # story_status_check reads commit SUBJECTS on main to confirm a `done`
          # story is backed by a real merge; a shallow clone silently narrows
          # what it can see and would let a false green through.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # pyforge-doctor's own requires-python floor (Story 6.9) -- ten of
          # the repo-scope detectors are now that package's sources.
          python-version: '3.14'

      # Deliberately NOT pixi. The repo-scope detectors are stdlib + PyYAML and
      # shell out to git alone — the same property that lets generate.py run them
      # directly at deploy time. The `local-recipes` env is ~1102 packages /
      # ~9.8 GB, which is a poor trade for a suite that finishes in ten seconds.
      # Story 6.9: ten of those detectors are now `pyforge.doctor.sources`
      # library gathers with no `scripts/*_check.py` file left to run directly
      # -- a plain (non-editable) `pip install` of the package is enough
      # (jsonschema/mcp/PyYAML all resolve from PyPI; no conda/pixi needed).
      # Story 14.3 (pyforge-core CAP-3/CAP-4) added pyforge-core as a real
      # run-dependency of pyforge-doctor -- a workspace-local path package,
      # not on PyPI, so it must be pip-installed first (stdlib-only leaf,
      # same plain-pip treatment) or pip's resolver 404s trying to fetch it.
      - name: Install detector dependencies
        run: |
          python -m pip install --quiet pyyaml playwright
          python -m pip install --quiet ./src/shared/packages/pyforge-core
          python -m pip install --quiet ./src/shared/packages/pyforge-doctor

      # check_layout drives headless Chrome. ubuntu-latest ships google-chrome,
      # which the detector prefers via channel="chrome" before falling back to a
      # playwright-managed chromium. If neither resolves, check_layout reports
      # UNKNOWN and the runner exits 2 — surfaced as a warning here, rather than
      # quietly skipping the one check that asserts the bar LOOKS right.
      - name: Verify a browser is present for the layout gate
        run: |
          which google-chrome || which chromium || \
            python -m playwright install --with-deps chromium

      # Registry integrity is reported first and separately, so a hole in the
      # registry reads as "the registry is wrong" rather than as a finding from
      # some detector.
      - name: Registry integrity
        run: python scripts/detectors.py --list || true

      - name: Run repo-scope detectors
        run: |
          set +e
          python scripts/detectors.py --scope repo 2>&1 | tee detectors.out
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## Detectors — repo scope"
            echo
            echo '```'
            sed -n '1,40p' detectors.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # One annotation per detector that reported, so findings are visible on
          # the PR without opening the log. Advisory: the step still exits 0.
          grep -E '^\s+(✗|\?) ' detectors.out | while read -r line; do
            echo "::warning title=Detector::${line}"
          done || true

          case "$rc" in
            0) echo "All repo-scope detectors passed." ;;
            1) echo "::warning title=Detectors::Findings reported (advisory — not blocking). See the job summary." ;;
            2) echo "::warning title=Detectors::A detector COULD NOT RUN — unknown, not green. See the job summary." ;;
            *) echo "::warning title=Detectors::Runner exited ${rc}." ;;
          esac
          exit 0

      # Story 12.2 (pyforge-mason, spec-conda-forge-expert-rebuild CAP-3 /
      # re-scope pre-condition (a)): cfe_rebuild_guard_check ALONE is blocking.
      # This deliberately re-runs the one detector after the advisory sweep
      # (which already surfaced its findings as annotations) and lets its exit
      # code stand: 0 clean · 1 findings · 2 could-not-run — and 2 must never
      # read as success, so ANY non-zero reds this job. Scoped on purpose: the
      # 2026-07-31 advisory posture for every OTHER repo-scope detector is
      # unchanged (see the header comment above).
      - name: CFE rebuild guard (blocking — Story 12.2)
        run: python scripts/cfe_rebuild_guard_check.py
