# The ten pyforge-* and nine django-* portal packages' ruff gate, pyforge-* mypy, and the
# pre-commit set's existence check (steward Stories 66.1–66.2 / 93.1, CAP-153 / CAP-154).
# Django packages on NOT_YET_CLEAN in scripts/lint_types.py only shrink per-station fix stories.
#
# ONE invocation, shared with the local twin: this job runs `pixi run --frozen -e pyforge-guild
# lint-types`, the same task `pr-preflight` runs as its first leg, so what the runner measures is
# exactly what a contributor measured before pushing. The task fans out to `ruff`, `ruff-format`,
# `mypy`, `target-version-check` and `precommit-config-check`; each package's own [tool.ruff] /
# [tool.mypy] is what the tools read. src/platform keeps its own platform-ci lane.
#
# Story 31.1: the job also runs the existing `mypy` task in `pyforge-foundry-full` (real Vizro,
# Dagster, Kedro, Bokeh, … types). Guild mypy alone misses those libraries; this second leg keeps
# CI aligned with `sbom-laptop-gate`.
#
# The setup-pixi pin below is a registered site of scripts/pixi_version_registry.py
# (`lint-types.yml setup-pixi`); bump it with `pixi run -e local-recipes bump-pixi-version`.
name: Lint and types

on:
  pull_request:
    paths:
      - "src/shared/packages/**"
      - "pixi.toml"
      - "pixi.lock"
      - "scripts/lint_types.py"
      - "scripts/target_version_check.py"
      - "scripts/precommit_config_check.py"
      - "scripts/commit_msg_hook.py"
      - "scripts/pre_push_preflight.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint-types.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types:
    # ci-surfaces: lint-types.lint-types
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_LINT_TYPES != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.80.0
          environments: pyforge-guild pyforge-foundry-full
          locked: true
          cache: true
      # Story 117.7 (spec-pyforge-steward CAP-175): mypy rebuilt its cache on every run (87 s of the
      # foundry-full leg alone). scripts/lint_types.py keeps one cache per package and environment under
      # <package>/.mypy_cache/<environment> (Story 106.1), gitignored, so restoring those directories is safe
      # and a warm run only re-checks the modules whose sources or dependencies moved.
      - name: Restore the per-environment mypy caches
        uses: actions/cache@v6
        with:
          path: src/shared/packages/*/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ hashFiles('src/shared/packages/*/src/**/*.py', 'src/shared/packages/*/src/**/*.pyi') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-
      - name: lint-types (ruff, ruff-format, mypy, target-version-check, precommit-config-check)
        run: pixi run --frozen -e pyforge-guild lint-types
      - name: mypy (pyforge-foundry-full — real atlas runtime libraries)
        run: pixi run --frozen -e pyforge-foundry-full mypy
