name: PyForge station tests

# DW-14-2-1 (pyforge-herald deferred-work ledger): no CI workflow ran herald's
# own pytest suite -- its Chromium-dependent render gate had zero CI coverage.
# Auditing all 8 stations found the same gap almost everywhere: only
# pyforge-marshal's full suite happens to run today, as a side effect of
# coverage-gates.yml's coverage measurement (`coverage_gates_ci.py` invokes
# pytest over the whole `tests/unit` tree to compute `--cov`) -- a different
# workflow's implementation detail, not a guarantee this workflow should lean
# on. pyforge-doctor's only CI-run task, `pyforge-doctor-scripts-test`
# (detectors.yml), tests the repo-root detector CLI's integration with
# doctor's registry -- NOT doctor's own package suite at
# `src/shared/packages/pyforge-doctor/tests` (1440 tests, zero CI coverage
# before this workflow). So every one of the 8 stations gets its own job
# here, uniformly, each gated on that station's own changed paths so an
# unrelated station's PR doesn't pay for eight suites. Marshal and doctor's
# jobs are therefore intentionally redundant with coverage-gates.yml /
# detectors.yml -- cheap insurance, not wasted work, since neither of those
# workflows contracts to keep running the full suite forever. Story 52.2 added
# a ninth, NON-station job beside them: `core-test` (pyforge-core's own suite,
# sole-ownership meta-tests included), gated differently from the eight -- it
# runs whenever the shared surface OR any single station changed, because
# those meta-tests scan every station's tree. Story 19.5 added a tenth:
# `testing-kit-test` (the testing kit's own suite), gated on the shared
# surface OR the two non-station inputs its tests read.
#
# Story 98.1 (spec-pyforge-steward CAP-159): every job runs when a tracked
# path ITS TESTS READ changes, not only when its own package does. Herald
# Story 38.1 changed scripts/lint_types.py and django-herald and steward's
# test_lint_types_django_tables.py went red on main with no job to catch it:
# the suites read far outside their own package (scripts, the django-*
# portal packages, other stations' src, .github/workflows, the planning
# artifacts the doctor and marshal gatherers walk). The rule, as built: one
# pathspec array per job in the `changes` step, and `on.*.paths` (identical)
# carrying the union as GitHub globs. The arrays are not remembered, they
# are derived -- steward's tests/meta/test_station_tests_trigger_map.py reads
# each suite's tests (and the root-handoff declarations for the tests that
# give the bare repo root to the code under test), and proves a one-path diff
# of every read fires its job's output AND the on.pull_request.paths filter.
# Planning content triggers like any other read (operator ruling 2026-10-12,
# "Trigger on planning too"); the cost is more runs on planning-only PRs.
# Local twin: pr-preflight picks its lanes by running this `changes` step.

on:
  pull_request:
    paths:
      - '.github/workflows/pyforge-station-tests.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/**'
      - '.gitignore'
      - '.marshal/**'
      - '.pre-commit-config.yaml'
      - '.vscode/settings.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '_bmad-output/PROJECTS.md'
      - '_bmad-output/harness-profiles/*.toml'
      - '_bmad-output/harness-profiles/cursor.toml'
      - '_bmad-output/projects/*/README.md'
      - '_bmad-output/projects/*/planning-artifacts/**'
      - '_bmad-output/projects/pyforge-doctor/README.md'
      - '_bmad-output/projects/pyforge-marshal/**'
      - '_bmad-output/projects/pyforge-warden/**'
      - '_bmad/**'
      - 'archive/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'presentations/**'
      - 'recipes/**'
      - 'scripts/**'
      - 'scripts/tests/**'
      - 'src/platform/**'
      - 'src/platform/config/flags.json'
      - 'src/prototype/**'
      - 'src/sentinel/**'
      - 'src/shared/packages/django-*/**'
      - 'src/shared/packages/django-pyforge/**'
      - 'src/shared/packages/pyforge-*/tests/**'
      - 'src/shared/packages/pyforge-atlas/**'
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/pyforge-doctor/**'
      - 'src/shared/packages/pyforge-herald/**'
      - 'src/shared/packages/pyforge-marshal/**'
      - 'src/shared/packages/pyforge-mason/**'
      - 'src/shared/packages/pyforge-scribe/**'
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-testing-kit/**'
      - 'src/shared/packages/pyforge-warden/**'
      - 'tests/packaging/test_openteams_handoffs.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pyforge-station-tests.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/**'
      - '.gitignore'
      - '.marshal/**'
      - '.pre-commit-config.yaml'
      - '.vscode/settings.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '_bmad-output/PROJECTS.md'
      - '_bmad-output/harness-profiles/*.toml'
      - '_bmad-output/harness-profiles/cursor.toml'
      - '_bmad-output/projects/*/README.md'
      - '_bmad-output/projects/*/planning-artifacts/**'
      - '_bmad-output/projects/pyforge-doctor/README.md'
      - '_bmad-output/projects/pyforge-marshal/**'
      - '_bmad-output/projects/pyforge-warden/**'
      - '_bmad/**'
      - 'archive/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'presentations/**'
      - 'recipes/**'
      - 'scripts/**'
      - 'scripts/tests/**'
      - 'src/platform/**'
      - 'src/platform/config/flags.json'
      - 'src/prototype/**'
      - 'src/sentinel/**'
      - 'src/shared/packages/django-*/**'
      - 'src/shared/packages/django-pyforge/**'
      - 'src/shared/packages/pyforge-*/tests/**'
      - 'src/shared/packages/pyforge-atlas/**'
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/pyforge-doctor/**'
      - 'src/shared/packages/pyforge-herald/**'
      - 'src/shared/packages/pyforge-marshal/**'
      - 'src/shared/packages/pyforge-mason/**'
      - 'src/shared/packages/pyforge-scribe/**'
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-testing-kit/**'
      - 'src/shared/packages/pyforge-warden/**'
      - 'tests/packaging/test_openteams_handoffs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyforge-station-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # ci-surfaces: pyforge-station-tests.changes
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true') }}
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      testing_kit: ${{ steps.filter.outputs.testing_kit }}
      atlas: ${{ steps.filter.outputs.atlas }}
      doctor: ${{ steps.filter.outputs.doctor }}
      herald: ${{ steps.filter.outputs.herald }}
      marshal: ${{ steps.filter.outputs.marshal }}
      mason: ${{ steps.filter.outputs.mason }}
      scribe: ${{ steps.filter.outputs.scribe }}
      steward: ${{ steps.filter.outputs.steward }}
      steward_live: ${{ steps.filter.outputs.steward_live }}
      doctor_live: ${{ steps.filter.outputs.doctor_live }}
      warden: ${{ steps.filter.outputs.warden }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Story 117.11 (spec-pyforge-steward CAP-175): two commits, not full history. On a pull_request HEAD is the
          # merge commit and its first parent is the base tip, so the three-dot diff below has its merge base; on a
          # push HEAD~1 is the previous tip. A full clone of this repository cost ~20 s per job.
          fetch-depth: 2

      - name: Compute per-station changed paths
        id: filter
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # spec-pyforge-core CAP-10: never a name a local ref or tag can wear. The local twin (preflight_ci) and
            # the trigger-map harness keep a full history with a real remote-tracking ref, so it wins when it exists;
            # the two-commit CI checkout has none, and the merge commit's first parent is the base tip (Story 117.11).
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          else
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          # pyforge-core / pyforge-testing-kit / pixi.toml / pixi.lock changes
          # are shared surface -- any of them re-runs every station (and
          # core-test and testing-kit-test), since all eight depend on
          # pyforge-core and pixi.lock pins every env at once.
          SHARED_CHANGED=false
          if ! git diff --quiet "$BASE"...HEAD -- \
              src/shared/packages/pyforge-core \
              src/shared/packages/pyforge-testing-kit \
              pixi.toml pixi.lock \
              .github/workflows/pyforge-station-tests.yml 2>/dev/null; then
            SHARED_CHANGED=true
          fi
          # Story 98.1 (spec-pyforge-steward CAP-159): each job runs when a tracked path its tests
          # read changes. One array per job, below, carries those paths as git pathspecs; the
          # pathspecs stay quoted so git, not the shell, matches a glob -- a deleted file still
          # counts. `on.pull_request.paths` / `on.push.paths` carry the same paths as GitHub globs
          # and steward's tests/meta/test_station_tests_trigger_map.py derives them from the tests
          # themselves and proves every one fires its job. The shared surface above stays: it runs
          # every job.
          atlas_paths=(
            .claude/skills
            .github/workflows
            .gitignore
            AGENTS.md
            CLAUDE.md
            _bmad-output/projects/pyforge-atlas/planning-artifacts
            _bmad/core/config.yaml
            _bmad/custom/bmad-cis-design-thinking.toml
            _bmad/scripts/resolve_customization.py
            _bmad/skf
            docs/dashboard/README.md
            docs/governance/ci-surfaces.yaml
            docs/reference
            recipes
            scripts
            src/platform
            src/shared/packages
            tests/packaging/test_openteams_handoffs.py
          )
          # Story 117.4 (doctor 55.4): the package half reads nothing outside its package; the live-tree half
          # (pyforge-doctor-live-test) carries the paths its pytest.mark.live_tree modules read, derived by
          # steward's tests/meta/test_station_tests_trigger_map.py.
          doctor_paths=(
            src/shared/packages/pyforge-doctor
          )
          doctor_live_paths=(
            .claude/scripts
            .claude/skills
            .github/workflows/detectors.yml
            AGENTS.md
            CLAUDE.md
            _bmad
            '_bmad-output/projects/*/README.md'
            '_bmad-output/projects/*/planning-artifacts/*'
            _bmad-output/projects/pyforge-doctor/README.md
            archive
            docs/404.md
            docs/MAP.md
            docs/dashboard
            docs/dreams
            docs/explanation
            docs/foundry/frames/pyforge.frame.md
            docs/governance
            docs/how-to
            docs/index.md
            docs/map.yaml
            docs/reference
            'recipes/*/recipe.yaml'
            recipes/bmad-suite/suite-members.yaml
            recipes/docker/recipe.yaml
            scripts
            src
          )
          herald_paths=(
            src/shared/packages/pyforge-herald
            .claude/skills
            .github/workflows
            .gitignore
            AGENTS.md
            CLAUDE.md
            _bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-pyforge-steward/adoption-register.md
            _bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-foundry-regenerate-not-fold/case-list.md
            _bmad/scripts/resolve_customization.py
            _bmad/skf
            docs
            docs-site
            presentations
            src/platform
            src/shared/packages/django-herald
            src/shared/packages/pyforge-steward/src
            src/shared/packages/pyforge-steward/tests/meta/test_adoption_register.py
          )
          marshal_paths=(
            src/shared/packages/pyforge-marshal
            .claude
            .cursor
            .gemini
            .github/copilot-instructions.md
            .github/workflows/detectors.yml
            .gitignore
            .marshal
            AGENTS.md
            CLAUDE.md
            _bmad
            _bmad-output/PROJECTS.md
            '_bmad-output/harness-profiles/*.toml'
            _bmad-output/harness-profiles/cursor.toml
            '_bmad-output/projects/*/README.md'
            '_bmad-output/projects/*/planning-artifacts/*'
            _bmad-output/projects/pyforge-marshal
            docs/dreams
            docs/governance/preserve-purge-list.json
            docs/how-to/troubleshoot-bmad-agent-loops.md
            docs/reference/story-spec-flag-block.md
            scripts/.spec-surface-baseline.json
            scripts/bmad-loop-worktree
            scripts/bmad-switch
            scripts/bmad_loop_baseline_drift_check.py
            scripts/coverage_gate.py
            scripts/detectors.py
            scripts/flag_gate_check.py
            scripts/fleet_picture.py
            scripts/fleet_scan.py
            scripts/index_freshness_check.py
            scripts/missing_preserve_check.py
            scripts/promote_sprint_status.py
            scripts/spec_surface_check.py
            scripts/spec_surface_reconcile.py
            src/platform
            src/shared/packages/django-marshal
            src/shared/packages/django-pyforge/src
            'src/shared/packages/pyforge-*/tests/*'
            src/shared/packages/pyforge-atlas/src/pyforge/atlas/dashboard/scan_submit.py
            src/shared/packages/pyforge-atlas/tools/bootstrap.py
            src/shared/packages/pyforge-doctor/src/pyforge/doctor/sources/marshal.py
            src/shared/packages/pyforge-scribe/src/pyforge/scribe/catalog.py
          )
          mason_paths=(
            src/shared/packages/pyforge-mason
            .claude/scripts/conda-forge-expert
            .claude/skills
            AGENTS.md
            CLAUDE.md
            _bmad/scripts/resolve_customization.py
            _bmad/skf
            recipes/click-help-colors
            scripts/cfe_rebuild_guard_check.py
            src/platform
            src/shared/packages/django-mason
            src/shared/packages/django-pyforge/src/django_pyforge/templates/django_pyforge/base.html
          )
          scribe_paths=(
            .claude/memory/MEMORY.md
            .claude/memory/feedback
            .claude/settings.json
            .claude/skills/bmad-agent-scribe
            .claude/skills/conda-forge-expert/SKILL.md
            .claude/skills/pyforge-marshal/0.1.0/pyforge-marshal/SKILL.md
            .claude/skills/pyforge-scribe/0.1.0/pyforge-scribe/SKILL.md
            .claude/skills/pyforge-scribe/skill-brief.yaml
            '.cursor/rules/*.mdc'
            .cursor/rules/scribe-recall.mdc
            .cursor/rules/specs.mdc
            .cursor/rules/trunk-worktree-pr.mdc
            .gemini/settings.json
            .github/copilot-instructions.md
            .vscode/settings.json
            AGENTS.md
            CLAUDE.md
            GEMINI.md
            _bmad-output/projects/pyforge-warden
            _bmad/scripts/resolve_customization.py
            docs/dreams/README.md
            docs/how-to/README.md
            docs/how-to/pixi-tasks.md
            docs/reference/library-llms-full.md
            docs/tutorials/getting-started.md
            presentations/pyforge-scribe/facts.yaml
            presentations/pyforge-warden/facts.yaml
            scripts/claude_instruction_mode_check.py
            src/platform
            src/shared/packages
          )
          # Story 117.4 (doctor 55.4): the package half reads nothing outside its package; the live-tree half
          # (pyforge-steward-live-test) carries the paths its pytest.mark.live_tree modules read, derived by
          # steward's tests/meta/test_station_tests_trigger_map.py.
          steward_paths=(
            src/shared/packages/pyforge-steward
          )
          steward_live_paths=(
            src/shared/packages/pyforge-steward
            .claude/hooks/pre-shell.py
            .claude/hooks/session-start.sh
            .claude/memory/MEMORY.md
            .claude/settings.json
            .claude/skills
            .cursor/environment.json
            .github/workflows
            .gitignore
            .pre-commit-config.yaml
            AGENTS.md
            CLAUDE.md
            _bmad
            '_bmad-output/projects/*/README.md'
            '_bmad-output/projects/*/planning-artifacts/*'
            archive/_bmad-output/projects/pyforge-steward/planning-artifacts/specs/spec-bmad-suite-lifecycle/SPEC.md
            archive/docs/dreams/build-league-scorecard.md
            docs-site/scripts
            docs-site/src/lib
            docs/404.md
            docs/dreams
            docs/foundry
            docs/governance
            docs/index.md
            docs/map.yaml
            docs/how-to/pixi-tasks.md
            docs/reference/bmad-estate-llms-full.md
            docs/reference/environments.md
            docs/reference/library-llms-full.md
            recipes/bmad-suite
            recipes/click-help-colors
            scripts/bmad-loop-worktree
            scripts/ci_canary.py
            scripts/coverage_gates_ci.py
            scripts/detectors.py
            scripts/lint_types.py
            scripts/pages_artifact_download.py
            scripts/pages_build_stamp.py
            scripts/pages_fleet_status.py
            scripts/pixi_env_matrix.py
            scripts/platform-ci-local.sh
            scripts/precommit_config_check.py
            scripts/target_version_check.py
            scripts/tests
            src/platform
            'src/shared/packages/django-*/*'
            'src/shared/packages/pyforge-*/tests/*'
            src/shared/packages/pyforge-herald/src/pyforge/herald/pages_env.py
            src/shared/packages/pyforge-marshal/src/pyforge/marshal/cli/dispatch.py
            src/shared/packages/pyforge-mason
            tests/packaging/test_openteams_handoffs.py
          )
          warden_paths=(
            src/shared/packages/pyforge-warden
            .claude/skills
            AGENTS.md
            CLAUDE.md
            _bmad/scripts/resolve_customization.py
            _bmad/skf
            src/platform
            src/shared/packages/django-pyforge/src/django_pyforge/assertion/client.py
            src/shared/packages/django-warden
          )
          # Story 52.2 (spec-pyforge-core CAP-8): pyforge-core's own suite runs whenever the shared
          # surface OR any single station moved -- its sole-ownership meta-tests scan every sibling
          # station's src tree. Story 98.1: it also scans all of src/ and scripts/ (the
          # preserve-refs grammar test), the django-* portal packages included, so core_paths names
          # those roots; the atlas quartet's test file stays a core input as it was.
          core_paths=(
            _bmad-output/projects/pyforge-steward/planning-artifacts/specs
            docs/governance/guild-roster.json
            scripts
            src
            tests/packaging/test_openteams_handoffs.py
          )
          CORE_CHANGED="$SHARED_CHANGED"
          for s in atlas doctor herald marshal mason scribe steward warden; do
            unset -n job_paths 2>/dev/null || true
            declare -n job_paths="${s}_paths"
            station_path="src/shared/packages/pyforge-$s"
            if [ "$SHARED_CHANGED" = "true" ] || ! git diff --quiet "$BASE"...HEAD -- "${job_paths[@]}" 2>/dev/null; then
              echo "$s=true" >> "$GITHUB_OUTPUT"
            else
              echo "$s=false" >> "$GITHUB_OUTPUT"
            fi
            if ! git diff --quiet "$BASE"...HEAD -- "$station_path" 2>/dev/null; then
              CORE_CHANGED=true
            fi
            # Story 117.4: a station with a live-tree half fires it on the package, the shared surface and what its
            # live_tree modules read (today's full array); the package half above fires on the package alone.
            live_name="${s}_live_paths"
            if declare -p "$live_name" >/dev/null 2>&1; then
              unset -n live_paths 2>/dev/null || true
              declare -n live_paths="$live_name"
              if [ "$SHARED_CHANGED" = "true" ] || ! git diff --quiet "$BASE"...HEAD -- "$station_path" "${live_paths[@]}" 2>/dev/null; then
                echo "${s}_live=true" >> "$GITHUB_OUTPUT"
              else
                echo "${s}_live=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          done
          if ! git diff --quiet "$BASE"...HEAD -- "${core_paths[@]}" 2>/dev/null; then
            CORE_CHANGED=true
          fi
          echo "core=$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          # Story 19.5: the testing kit's own suite reads two inputs outside the
          # shared surface -- django-pyforge (its station API contract test) and
          # the platform flag tree (test_flags.py's shape check).
          TESTING_KIT_CHANGED="$SHARED_CHANGED"
          if ! git diff --quiet "$BASE"...HEAD -- \
              src/shared/packages/django-pyforge \
              src/platform/config/flags.json 2>/dev/null; then
            TESTING_KIT_CHANGED=true
          fi
          echo "testing_kit=$TESTING_KIT_CHANGED" >> "$GITHUB_OUTPUT"

  # Story 52.2 (spec-pyforge-core CAP-8): until this job, NO workflow invoked
  # the `pyforge-core-test` pixi task -- `pyforge-core/**` appeared above only
  # as a shared-surface TRIGGER for the eight station jobs, and
  # pyforge-pip-install.yml runs a hand-enumerated subset that never held the
  # four `tests/meta/*_sole_ownership.py` guards (CAP-5/CAP-7's enforcement).
  # Six violations accumulated unseen between 2026-09-07 and 09-15 and were
  # cleared by Story 52.1; this job is what keeps that from recurring. It runs
  # the pixi TASK (the whole `tests/` tree, meta included), never a file list
  # -- enumeration is how the meta-tests were lost. A peer of the station
  # jobs, gated on `core` (shared surface OR any station), not a gate on them.
  # Story 98.1: core reads all of `src/` and `scripts/` (the
  # `test_preserve_refs_sole_grammar.py` scan roots), the `django-*` portal
  # packages included, so `core_paths` names those roots and the
  # `on.*.paths` list enumerates `src/` instead of one `src/**` glob (each
  # package family is its own trigger). Before 98.1 this comment called the
  # `django-*` packages "deliberately not `core` inputs"; that was wrong.
  # (django-pyforge is also a path trigger for testing-kit-test.)
  # Pinned by pyforge-core's `tests/meta/test_conformance_lane_wired.py`.
  core-test:
    # ci-surfaces: pyforge-station-tests.core-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.core == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-core
          cache: true
      - run: pixi run --frozen -e pyforge-core pyforge-core-test

  testing-kit-test:
    # Story 19.5 (spec-pyforge-testing-charter CAP-3): until this job, NO
    # workflow invoked the `pyforge-testing-kit-test` pixi task -- the kit
    # appeared above only as a shared-surface TRIGGER for the station jobs and
    # core-test, and the local `pyforge-station-tests` aggregate skipped it too.
    # Its suite went red unseen when steward Story 76.2 gave
    # src/platform/config/flags.json flagd `metadata`. A peer of core-test,
    # gated on `testing_kit`: the shared surface OR one of the two other inputs
    # its tests read (django-pyforge and the platform flag tree). Pinned by the
    # kit's `tests/meta/test_testing_kit_lane_wired.py`.
    # ci-surfaces: pyforge-station-tests.testing-kit-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.testing_kit == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-testing-kit
          cache: true
      - run: pixi run --frozen -e pyforge-testing-kit pyforge-testing-kit-test

  atlas-test:
    # ci-surfaces: pyforge-station-tests.atlas-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.atlas == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 3 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      # test_wasm_smoke.py's _chromium_executable() reads this var itself
      # (falling back to a hardcoded /opt/pw-browsers otherwise, which this
      # runner does not have) -- set once, at job level, so the install step
      # and the test run resolve the identical browser.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PYTEST_ADDOPTS: --splits 3 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-atlas.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-atlas
          cache: true
      # Three of atlas's gates fail loud (never silently skip) when their
      # prerequisite isn't provisioned: the dashboard E2E suite AND the WASM
      # smoke test both need a real Chromium (unconditionally -- both launch
      # Playwright's own managed browser directly, never a system one),
      # test_emit_range.py's PUBLISH_RANGE_REQUIRED path needs the DuckDB
      # httpfs extension, and test_wasm_smoke.py's WASM_SMOKE_REQUIRED path
      # needs the built WASM artifact. All three provisioned here so a fresh
      # runner has what a maintainer's already-provisioned machine has.
      # Story 117.7 (spec-pyforge-steward CAP-175; the CAP-174 shape): install the browser alone, launch it
      # once, and pull its system packages through apt only when it does not launch on the runner image --
      # the apt download was 636-668 s on a slow mirror for libraries the image already carries.
      - name: Install Chromium for the dashboard E2E + WASM smoke gates
        run: |
          probe() {
            pixi run --frozen -e pyforge-atlas python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              playwright.chromium.launch().close()
          PY
          }
          pixi run --frozen -e pyforge-atlas python -m playwright install chromium
          if probe; then
            echo "Chromium launches on this runner image; no system packages installed."
          else
            echo "::warning::Chromium does not launch on this runner image; installing its system packages through apt (playwright install-deps chromium)."
            pixi run --frozen -e pyforge-atlas python -m playwright install-deps chromium
            if ! probe; then
              echo "::error::Chromium still does not launch after playwright install-deps chromium."
              exit 1
            fi
          fi
      - name: Provision the DuckDB httpfs extension
        run: pixi run --frozen -e pyforge-atlas python -c "import duckdb; duckdb.connect().execute('INSTALL httpfs')"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the WASM smoke-test artifact
        run: pixi run --frozen -e pyforge-atlas python src/shared/packages/pyforge-atlas/wasm/build.py
      - run: pixi run --frozen -e pyforge-atlas kedro-test
      - run: pixi run --frozen -e pyforge-atlas kedro-catalog-check
      # Story 117.10: this shard's report; the atlas-gate job merges every shard's and judges the floor.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/atlas-unit.json .steward/coverage/atlas-unit-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-atlas-unit-${{ matrix.group }}
          path: .steward/coverage/atlas-unit-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.10 (spec-pyforge-steward CAP-175): the atlas suite runs as shards, so the floor is judged here from
  # every shard's coverage report merged (coverage_gates_ci.py --report, repeatable); it rides the suite's rule.
  atlas-gate:
    # ci-surfaces: pyforge-station-tests.atlas-gate
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.atlas == 'true')) }}
    needs: [changes, atlas-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-atlas
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-atlas-*
          path: .steward/coverage
          merge-multiple: true
      - name: Coverage gate for atlas (every shard's report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: atlas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-atlas python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report ".steward/coverage/atlas-unit*.json"

  doctor-test:
    # ci-surfaces: pyforge-station-tests.doctor-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.doctor == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-doctor
          cache: true
      - run: pixi run --frozen -e pyforge-doctor pyforge-doctor-test
      # Story 117.4: the package half's report, merged with the live-tree half's by the doctor-gate job.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-doctor-unit
          path: .steward/coverage/doctor-unit.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.4 (spec-pyforge-steward CAP-175, ruling D4): the live-tree half of the doctor suite -- the modules
  # marked pytest.mark.live_tree -- fires on the package, the shared surface and what those modules read; the package
  # half (doctor-test) fires on the package and the shared surface only.
  doctor-live-test:
    # ci-surfaces: pyforge-station-tests.doctor-live-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.doctor_live == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 2 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      PYTEST_ADDOPTS: --splits 2 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-doctor-live.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-doctor
          cache: true
      - run: pixi run --frozen -e pyforge-doctor pyforge-doctor-live-test
      # Story 117.4: the live-tree half's report, merged with the package half's by the doctor-gate job.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/doctor-live.json .steward/coverage/doctor-live-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-doctor-live-${{ matrix.group }}
          path: .steward/coverage/doctor-live-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.4: the coverage floor is judged from the union of both halves' reports (Story 117.2's --report, now
  # repeatable); it rides the package half's rule and needs both halves' artifacts.
  doctor-gate:
    # ci-surfaces: pyforge-station-tests.doctor-gate
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.doctor == 'true')) }}
    needs: [changes, doctor-test, doctor-live-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-doctor
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-doctor-*
          path: .steward/coverage
          merge-multiple: true
      - name: Coverage gate for doctor (every shard of both halves)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: doctor
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-doctor python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report .steward/coverage/doctor-unit.json --report ".steward/coverage/doctor-live*.json"

  herald-test:
    # ci-surfaces: pyforge-station-tests.herald-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.herald == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 2 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      PYTEST_ADDOPTS: --splits 2 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-herald.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      # Herald Story 45.1: the last step runs pyforge-herald-test-built, docs-site-install (npm ci in the site env)
      # then herald's suite, so its built-site tests build Astro here instead of skipping; setting up `site` beside
      # herald caches that env. pyforge-herald-test itself stays npm-free for the SBOM laptop gate (fnd:CAP-13).
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-herald site
          cache: true
      # DW-14-2-1: the render gate's real-browser tests need Chromium. Steward Story 112.1 / CAP-174's shape
      # (the Platform CI test job, the atlas job): install Playwright's own chromium, launch it once, and pull its
      # system packages through apt only when that launch fails. `which google-chrome` alone proved nothing:
      # on PR #2335 the render gate's chrome-channel launch failed on a runner that had google-chrome, and the
      # bundled fallback the test then tries had never been installed (herald-test (1), 2026-10-27).
      - name: Verify a browser is present for the render gate
        run: |
          probe() {
            pixi run --frozen -e pyforge-herald python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              playwright.chromium.launch().close()
          PY
          }
          pixi run --frozen -e pyforge-herald python -m playwright install chromium
          if probe; then
            echo "Chromium launches on this runner image; no system packages installed."
          else
            echo "::warning::Chromium does not launch on this runner image; installing its system packages through apt (playwright install-deps chromium)."
            pixi run --frozen -e pyforge-herald python -m playwright install-deps chromium
            if ! probe; then
              echo "::error::Chromium still does not launch after playwright install-deps chromium."
              exit 1
            fi
          fi
      # test_skf_validators_pass invokes `uv run` directly (not a pixi
      # dependency -- this station's own skf-frontmatter validator script
      # is meant to be runnable standalone via uv).
      - uses: astral-sh/setup-uv@v7
      # HERALD_DOCS_SITE_REQUIRED: a built-site test whose install is missing fails here, never skips.
      - run: pixi run --frozen -e pyforge-herald pyforge-herald-test-built
        env:
          HERALD_DOCS_SITE_REQUIRED: "1"
      # Story 117.10: this shard's report; the herald-gate job merges every shard's and judges the floor.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/herald-unit.json .steward/coverage/herald-unit-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-herald-unit-${{ matrix.group }}
          path: .steward/coverage/herald-unit-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.10 (spec-pyforge-steward CAP-175): the herald suite runs as shards, so the floor is judged here from
  # every shard's coverage report merged (coverage_gates_ci.py --report, repeatable); it rides the suite's rule.
  herald-gate:
    # ci-surfaces: pyforge-station-tests.herald-gate
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.herald == 'true')) }}
    needs: [changes, herald-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-herald
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-herald-*
          path: .steward/coverage
          merge-multiple: true
      - name: Coverage gate for herald (every shard's report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: herald
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-herald python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report ".steward/coverage/herald-unit*.json"

  marshal-test:
    # ci-surfaces: pyforge-station-tests.marshal-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.marshal == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 4 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      PYTEST_ADDOPTS: --splits 4 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-marshal.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-marshal
          cache: true
      # Seed verbs + integration harnesses create real commits; GHA runners
      # have no git identity by default (same precedent as coverage-gates.yml).
      - run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - run: pixi run --frozen -e pyforge-marshal pyforge-marshal-test
      # Story 117.10: this shard's report; the marshal-gate job merges every shard's and judges the floor.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/marshal-unit.json .steward/coverage/marshal-unit-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-marshal-unit-${{ matrix.group }}
          path: .steward/coverage/marshal-unit-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.10 (spec-pyforge-steward CAP-175): the marshal suite runs as shards, so the floor is judged here from
  # every shard's coverage report merged (coverage_gates_ci.py --report, repeatable); it rides the suite's rule.
  marshal-gate:
    # ci-surfaces: pyforge-station-tests.marshal-gate
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.marshal == 'true')) }}
    needs: [changes, marshal-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-marshal
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-marshal-*
          path: .steward/coverage
          merge-multiple: true
      - name: Coverage gate for marshal (every shard's report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: marshal
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-marshal python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report ".steward/coverage/marshal-unit*.json"

  mason-test:
    # ci-surfaces: pyforge-station-tests.mason-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.mason == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-mason
          cache: true
      - run: pixi run --frozen -e pyforge-mason pyforge-mason-test
      # Story 117.2 (spec-pyforge-steward CAP-175, ruling D2): the floor is judged from the JSON the suite step
      # above wrote (.steward/coverage/mason-unit.json); the gate never re-runs the suite. coverage-gates.yml retired.
      - name: Coverage gate for mason (reads the suite's own report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: mason
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-mason python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report .steward/coverage/mason-unit.json
      # Story 16.2: the first real estate caller of `mason recipe build` --
      # runs on every execution of this already-existing lane (not only on
      # demand), against mason's own env, so `mason doctor`'s post-16.1
      # "recipe verb available" claim is actually exercised here, not just
      # decomposed and merged. Does not replace the local-recipes
      # recipe-build route as the estate's primary path.
      - run: pixi run --frozen -e pyforge-mason pyforge-mason-recipe-build-smoke

  scribe-test:
    # ci-surfaces: pyforge-station-tests.scribe-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.scribe == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # pyforge-scribe's durable GraphStore (Story 28.1) needs a real
      # PostgreSQL + pgvector; the test suite's own conftest.py fails loudly
      # (does not silently skip) when it can't reach one. Port/user/password/
      # db match tests/unit/conftest.py's _DEFAULT_PG_DSN verbatim, so
      # SCRIBE_GRAPH_DSN does not need to be set.
      postgres:
        image: pgvector/pgvector:pg17  # PostgreSQL 17, like every pin in the estate (steward Story 67.1)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scribe
          POSTGRES_DB: scribe_graph
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-scribe
          cache: true
      - name: Enable pgvector extension
        env:
          PGPASSWORD: scribe
        run: psql -h 127.0.0.1 -p 5433 -U postgres -d scribe_graph -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: pixi run --frozen -e pyforge-scribe pyforge-scribe-test
      # Story 117.2 (spec-pyforge-steward CAP-175, ruling D2): the floor is judged from the JSON the suite step
      # above wrote (.steward/coverage/scribe-unit.json); the gate never re-runs the suite. coverage-gates.yml retired.
      - name: Coverage gate for scribe (reads the suite's own report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: scribe
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-scribe python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report .steward/coverage/scribe-unit.json

  steward-test:
    # ci-surfaces: pyforge-station-tests.steward-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.steward == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 2 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      PYTEST_ADDOPTS: --splits 2 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-steward.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-steward
          cache: true
      - run: pixi run --frozen -e pyforge-steward pyforge-steward-test
      # Story 117.4: the package half's report, merged with the live-tree half's by the steward-gate job.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/steward-unit.json .steward/coverage/steward-unit-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-steward-unit-${{ matrix.group }}
          path: .steward/coverage/steward-unit-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.4 (spec-pyforge-steward CAP-175, ruling D4): the live-tree half of the steward suite -- the modules
  # marked pytest.mark.live_tree -- fires on the package, the shared surface and what those modules read; the package
  # half (steward-test) fires on the package and the shared surface only.
  steward-live-test:
    # ci-surfaces: pyforge-station-tests.steward-live-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.steward_live == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Story 117.10 (spec-pyforge-steward CAP-175): 4 shards; each runs its pytest-split group on top of xdist and
    # uploads its own coverage report, which the gate job merges with the others' (minutes are free on this public
    # repository; the wall is one shard). The local preflight runs the task unsharded.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      PYTEST_ADDOPTS: --splits 4 --group ${{ matrix.group }} --durations-path tests/durations/pyforge-steward-live.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-steward
          cache: true
      - run: pixi run --frozen -e pyforge-steward pyforge-steward-live-test
      # Story 117.4: the live-tree half's report, merged with the package half's by the steward-gate job.
      - name: Name this shard's coverage report
        run: mv .steward/coverage/steward-live.json .steward/coverage/steward-live-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-steward-live-${{ matrix.group }}
          path: .steward/coverage/steward-live-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3

  # Story 117.4: the coverage floor is judged from the union of both halves' reports (Story 117.2's --report, now
  # repeatable); it rides the package half's rule and needs both halves' artifacts.
  steward-gate:
    # ci-surfaces: pyforge-station-tests.steward-gate
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.steward == 'true')) }}
    needs: [changes, steward-test, steward-live-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-steward
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-steward-*
          path: .steward/coverage
          merge-multiple: true
      - name: Coverage gate for steward (every shard of both halves)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: steward
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-steward python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report ".steward/coverage/steward-unit*.json" --report ".steward/coverage/steward-live*.json"

  warden-test:
    # ci-surfaces: pyforge-station-tests.warden-test
    # render: python scripts/ci_surface_gates.py --render
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && (needs.changes.outputs.warden == 'true')) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Story 117.11: the merge commit and its parents; a gate's three-dot diff needs no more
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-warden
          cache: true
      - run: pixi run --frozen -e pyforge-warden pyforge-warden-test
      # Story 117.2 (spec-pyforge-steward CAP-175, ruling D2): the floor is judged from the JSON the suite step
      # above wrote (.steward/coverage/warden-unit.json); the gate never re-runs the suite. coverage-gates.yml retired.
      - name: Coverage gate for warden (reads the suite's own report)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          COVERAGE_GATES_STATIONS: warden
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CAP-4: never a name a local ref or tag can wear; Story 117.11: the two-commit checkout has no remote ref,
            # so the merge commit's first parent (the base tip) is the base; the remote ref wins where it exists.
            if git rev-parse -q --verify "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              BASE="refs/remotes/origin/${GITHUB_BASE_REF}"
            else
              BASE="$(git rev-parse HEAD^1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          pixi run --frozen -e pyforge-warden python scripts/coverage_gates_ci.py --base "$BASE" --head HEAD --suites unit --report .steward/coverage/warden-unit.json

  # Story 48.10: CAP-5 needs a build time — the root Containerfile was
  # referenced by no workflow until this job. Mirrors platform-ci.yml's
  # docker/podman matrix (spec 10.3 / Story 48.10).
  guild-container:
    # ci-surfaces: station-tests.guild-container
    # render: python scripts/ci_surface_gates.py --render
    # Story 117.6 (spec-pyforge-steward CAP-175, ruling D1): the two image builds (263 s + 150 s, after 110-170 s of
    # freeing the runner's disk) ran on every pull_request of this workflow with no path gate. They run on
    # push-to-main and nightly in ci-canary.yml (registry row station-tests.guild-container, trigger: main).
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.PAUSE_ALL_CI != 'true' && vars.PAUSE_PYFORGE_STATION_TESTS != 'true' && vars.PAUSE_CONTAINER_BUILDS != 'true' && (github.event_name != 'pull_request')) }}
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Ensure podman is available (rootless)
        if: matrix.engine == 'podman'
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          id -u

      - name: Free runner disk for the guild image build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: pyforge-steward
          cache: true

      - name: Build root Containerfile and run container gates (${{ matrix.engine }})
        run: pixi run --frozen -e pyforge-steward pyforge-steward-guild-image-build -- ${{ matrix.engine }}
