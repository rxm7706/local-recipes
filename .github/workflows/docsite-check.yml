name: Docsite check

# Story 24.2 (spec-pyforge-herald CAP-49, closes DW-FU-23-5): until now the
# only workflow that ever ran docsite/build.py was dashboard.yml, triggered on
# `push: branches: [main]` only -- so a PR could merge a broken family-page
# template (an unrendered Jinja tag, a shrunk infographic, a missing download)
# with every other gate green, and one did: Story 23.5's 296-line family-page
# change landed exactly that way (verified 2026-09-18, DW-FU-23-5).
#
# This workflow is the PR-time twin of dashboard.yml's build step -- it builds
# and checks, it never deploys. `dashboard.yml` stays the only `deploy-pages`
# caller; a second one would race it and intermittently wipe the Kedro-Viz
# export (see that workflow's own header comment).
#
# Two independent checks, deliberately not collapsed into one:
#   1. `docsite/build.py --check` with the exact same pip-installed deps
#      dashboard.yml itself uses (not the pixi `site` feature -- see that
#      workflow's "own python/deps" comment), so a PR predicts whether that
#      build + check step would pass. It does NOT run dashboard.yml's
#      separate `verify_claims.py` (`site-verify`) step -- that step is
#      already `continue-on-error` there (advisory, never blocks a deploy),
#      so it stays out of this gate too. Builds into the default `./dist/`,
#      never `docs/dashboard/` -- a PR job must never write into that
#      tracked, shared Pages-publish root.
#   2. `pixi run -e site site-check` -- the pixi `site` feature's own task,
#      the one `docsite/README.md` and every developer's local loop actually
#      run. Reused here, not re-minted. `pixi.toml`'s `pr-preflight` gains the
#      same leg so a local run predicts this lane.

on:
  pull_request:
    paths:
      - 'docsite/**'
      - 'docs/dashboard/**'
      - 'presentations/**'
      - 'pixi.toml'
      - '.github/workflows/docsite-check.yml'
  push:
    branches: [main]
    paths:
      - 'docsite/**'
      - 'docs/dashboard/**'
      - 'presentations/**'
      - 'pixi.toml'
      - '.github/workflows/docsite-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docsite-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR runs -- never a push:main run, so main always
  # keeps one full, uncancelled CI result per commit to bisect against
  # (same convention as platform-ci.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site build dependencies
        run: python -m pip install --disable-pip-version-check jinja2 pyyaml
      - name: Build + check the PyForge site (predicts dashboard.yml)
        run: python docsite/build.py --check

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: site
          locked: true
          cache: true
      - name: pixi run -e site site-check
        run: pixi run --frozen -e site site-check
