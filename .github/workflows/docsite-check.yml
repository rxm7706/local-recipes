name: Docsite check

# Story 24.2 (spec-pyforge-herald CAP-49): PR-time twin of dashboard.yml's build
# step — it builds and checks, it never deploys. Story 27.2 reshaped both lanes
# to `pixi run -e site pages-check`, which assembles Starlight + herald +
# dashboard into docs-site/build/site/ and verifies redirects and links.
#
# `dashboard.yml` stays the only `deploy-pages` caller; a second one would race
# it and intermittently wipe the Kedro-Viz export (see that workflow's header).

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'docsite/**'
      - 'docs/dashboard/**'
      - 'presentations/**'
      - 'pixi.toml'
      - '.github/workflows/docsite-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'docsite/**'
      - 'docs/dashboard/**'
      - 'presentations/**'
      - 'pixi.toml'
      - '.github/workflows/docsite-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docsite-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: site
          locked: true
          cache: true

      - name: pixi run -e site pages-check
        run: pixi run --frozen -e site pages-check
