name: rerun-staged-recipes-linter

on:
  issue_comment: null

permissions:
  contents: read
  checks: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rerun-linter:
    name: rerun-linter
    runs-on: ubuntu-slim
    # Only fire when a comment explicitly ASKS for a re-lint. Upstream runs on every
    # PR comment; here that meant 139 runner jobs in a month with nothing requesting
    # them. A push, or toggling any label, already re-triggers staged-recipes-linter.
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && (contains(github.event.comment.body, 'please rerun linter')
      || contains(github.event.comment.body, '/rerun-linter'))
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install code
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          environment-name: lint
          condarc: |
            show_channel_urls: true
            channel_priority: strict
            channels:
              - conda-forge
          create-args: >-
            pygithub

      - name: rerun linter
        run: |
          python .github/workflows/scripts/linter_issue_comment.py \
            --repo=${{ github.repository }} \
            --pr-num=${{ github.event.issue.number  }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
