name: do_not_edit_example

# Explicit-run only. Upstream fires this on pull_request_target when a PR touches
# recipes/example/meta.yaml. That is contributor education for a community repo;
# in this fork it has never fired once. Kept as a manual tool rather than deleted,
# so it needs the PR number passed in — context.issue.number is empty on a
# workflow_dispatch event.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to comment on'
        required: true
        type: number

jobs:
  comment:
    name: Notify user about not editing example recipe
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ inputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Hi! Thanks for your contribution to conda-forge.' +
                    '\nWhen submitting a pull request, please do not change anything in the example recipe.\n' +
                    'Please make sure that any changes are reverted before you submit it for review.\n' +
                    'Thanks!'
            })
