name: pyforge-steward-five-tier

# Story 29.3 (FR-39): 03 five-tier completeness must be able to fail CI.
# Lean: the check is stdlib + pyforge-core; do not install steward extras.

on:
  pull_request:
    paths:
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-*/pyproject.toml'
      - 'src/shared/packages/django-*/**'
      - '.claude/skills/pyforge-*/**'
      - '.claude/skills/bmad-agent-*/**'
      - '.github/workflows/pyforge-steward-five-tier.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-*/pyproject.toml'
      - 'src/shared/packages/django-*/**'
      - '.claude/skills/pyforge-*/**'
      - '.claude/skills/bmad-agent-*/**'
      - '.github/workflows/pyforge-steward-five-tier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyforge-steward-five-tier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install check packages and pytest
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet --no-deps ./src/shared/packages/pyforge-core
          python -m pip install --quiet --no-deps ./src/shared/packages/pyforge-steward

      - name: Run five-tier completeness check
        run: >
          pytest -q
          src/shared/packages/pyforge-steward/tests/meta/test_five_tier_check.py
