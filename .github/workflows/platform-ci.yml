name: Platform CI

# Story 10.1 / spec-python-agent-platform: `src/platform/` is a separately
# built Django host (PostgreSQL + Redis + a FastAPI ASGI seam) with its own
# requirements, its own import-linter boundary contract (`pyproject.toml`'s
# `[tool.importlinter]` -- `src/platform/` never imports `pyforge.*`), and
# its own cost profile -- entirely disjoint from the conda-forge factory's
# own detector/linter CI (`detectors.yml`, `staged-recipes-linter.yml`).
# The `paths:` filter on both trigger events below is the cost isolation:
# factory CI never triggers on a platform-only change, and this workflow
# triggers on a factory change ONLY for the handful of paths the image
# genuinely builds from (enumerated below). It is NOT true, as an earlier
# revision of this comment claimed, that this workflow "never triggers on a
# factory-only change" -- `src/shared/packages/pyforge-{steward,core}/**`
# ARE factory trees, and they are in the filter because the build-time
# secrets-scan env is built from them. Note also that `paths:` is
# WORKFLOW-scoped, not job-scoped: any path below runs BOTH jobs, so a
# pyforge-steward commit also pays for the `test` job (pixi platform-ci-test).
# That cost is accepted
# is accepted deliberately here and recorded as deferred work; narrowing it
# would mean splitting this file per job. `working-directory:
# src/platform` on every run step keeps `manage.py`, `pyproject.toml`, and
# `pyproject.toml` resolvable by relative path, matching the render root
# spec-python-agent-platform fixes at `src/platform/`.
#
# THE FILTER IS NOT JUST `src/platform/**` (Story 10.3, corrected in
# review). The `container` job's build context is the REPO ROOT, so its
# real inputs reach well outside the platform tree: `pixi.toml`/`pixi.lock`
# (the builder stage's `pixi install --frozen -e python-agent-platform`,
# plus the `requires-pixi` floor that must match the pinned pixi image),
# `.dockerignore` (the only ignore file either COPY consults),
# `.pixi/config.toml` (GIT-TRACKED and load-bearing -- it carries
# `run-post-link-scripts = "insecure"`, without which `pixi install` skips
# the post-link scripts gdk-pixbuf/gtk3/librsvg/graphviz ship, changing what
# the builder materializes into the runtime layer; `.dockerignore` carries an
# explicit `!.pixi/config.toml` negation for exactly that reason),
# `scripts/container-gates` (the secrets-scan gate), and
# `src/shared/packages/pyforge-*` (the build-time-only `pyforge-steward`
# env that gate runs in). Every one of those can break the image build
# while leaving `src/platform/**` untouched -- and that is not theoretical:
# Story 10.3 hit exactly it, a `pixi.toml` `requires-pixi` bump failing the
# builder stage with `this project requires pixi '>=0.76.2', but you have
# pixi 0.76.1`. Without these entries such a change lands on main with this
# workflow never having run.
#
# Story 10.5 added `src/platform/compose/dbgpt/**` (the DB-GPT sidecar's own
# Containerfile) and the `container-dbgpt` job below, which builds it.
# That path entry is technically REDUNDANT with `src/platform/**` already
# above it (GitHub's `**` matches any depth, so it already covers
# `src/platform/compose/dbgpt/*`) -- kept anyway, explicit and
# self-documenting, per this story's own spec wording. `container-dbgpt`'s
# OTHER real inputs (`pixi.toml`/`pixi.lock`/`.pixi/config.toml`/
# `.dockerignore`/`scripts/container-gates`/`src/shared/packages/pyforge-
# {steward,core}/**` -- its build context is the repo root too, for the
# identical reason the `container` job's is) are already covered by the
# entries above; no separate ones were needed for it.
#
# Story 12.3 added `scripts/build-pixi-mirror.py` and the `air-gap-parity`
# job below, which invokes that script as a CI step (not baked into the
# Containerfile the way `scripts/container-gates` is) -- same rule as
# every other entry in this list: a change to it can break the job while
# leaving `src/platform/**` untouched, so it needs its own filter entry.
# The job itself is optional (default off): set repo variable
# PLATFORM_CI_AIR_GAP_PARITY=true to opt in on push/PR; workflow_dispatch
# input air_gap_parity overrides for manual runs.
#
# P1 fan-in (2026-08-23): `build-platform-image` builds once for
# gke-portability-smoke, ocp-portability-smoke, and air-gap-parity
# (Docker-only jobs). The `container` job keeps TWO INDEPENDENT builds
# (spec 10.3): docker build and podman build each solve the Containerfile
# on their own engine -- never load the shared artifact. container-dbgpt
# keeps its own build.

# The two lists below are duplicated verbatim rather than shared via a YAML
# anchor: GitHub Actions does not support YAML anchors/aliases in workflow
# files. Keep them in step by hand.
on:
  pull_request:
    paths:
      - 'src/platform/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.pixi/config.toml'
      - '.dockerignore'
      - 'scripts/container-gates'
      - 'scripts/build-pixi-mirror.py'
      - 'scripts/platform_ci_test_requirements_check.py'
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/django-*/**'
      - 'src/platform/compose/dbgpt/**'
      - '.github/workflows/platform-ci.yml'
      - '.github/actions/platform-test-setup/**'
  push:
    branches: [main]
    paths:
      - 'src/platform/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.pixi/config.toml'
      - '.dockerignore'
      - 'scripts/container-gates'
      - 'scripts/build-pixi-mirror.py'
      - 'scripts/platform_ci_test_requirements_check.py'
      - 'src/shared/packages/pyforge-steward/**'
      - 'src/shared/packages/pyforge-core/**'
      - 'src/shared/packages/django-*/**'
      - 'src/platform/compose/dbgpt/**'
      - '.github/workflows/platform-ci.yml'
      - '.github/actions/platform-test-setup/**'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Run all Platform CI jobs or only build-platform-image + air-gap-parity (debug)'
        type: choice
        options: [all, air-gap-parity-only]
        default: all
      air_gap_parity:
        description: 'Run air-gap-parity (Story 12.3 AD-13 proof); default off'
        type: boolean
        default: false
      gke_portability_smoke:
        description: 'Run gke-portability-smoke (kind + ingress + helm); default off'
        type: boolean
        default: false
      ocp_portability_smoke:
        description: 'Run ocp-portability-smoke (CRC + Route + helm); default off'
        type: boolean
        default: false

permissions:
  contents: read

# platform-ci-test (pixi) is the sole test-job dependency path (Story 16.1 / CAP-5).
# Optional Platform CI jobs (default off on push/PR — opt in with repo variables):
#   PLATFORM_CI_AIR_GAP_PARITY=true
#   PLATFORM_CI_GKE_PORTABILITY_SMOKE=true
#   PLATFORM_CI_OCP_PORTABILITY_SMOKE=true
# Requires GitHub Actions secret CRC_PULL_SECRET (Red Hat pull secret from
# console.redhat.com/openshift/create/local) when ocp-portability-smoke runs.
# workflow_dispatch exposes air_gap_parity / gke_portability_smoke /
# ocp_portability_smoke inputs instead.
env:
  # Shared platform image tag from build-platform-image (gke + ocp + air-gap
  # only; container runs independent docker/podman builds per spec 10.3).
  PLATFORM_CI_IMAGE_REF: platform:ci-${{ github.sha }}
  # The chart renders the DB-GPT sidecar unconditionally, so the shared build
  # produces it too -- see build-platform-image's own step for why.
  PLATFORM_CI_SIDECAR_REF: platform-dbgpt-sidecar:ci-${{ github.sha }}

concurrency:
  group: platform-ci-${{ github.ref }}
  # Only cancel superseded PR runs -- never a push:main run, so main always
  # keeps one full, uncancelled CI result per commit to bisect against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/platform

    # Infra stays exactly PostgreSQL + Redis (spec's own Boundaries &
    # Constraints) -- no third backing service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      # workflow_dispatch (unlike pull_request/push) has no `paths:` filter --
      # GitHub Actions doesn't support one for that trigger -- so a manual run
      # against a ref predating this story would otherwise fail on the
      # working-directory step below with a confusing "no such directory".
      - name: Verify src/platform exists on this ref
        working-directory: .
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      # Slim pixi env `platform-ci-test` (sole authority — Story 16.1 / CAP-5).
      - name: Install test dependencies
        uses: ./.github/actions/platform-test-setup

      - name: Django system checks (PostgreSQL + Redis, no other backing service)
        run: python manage.py check

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy platformapp config tests

      # Steward 16.4 / CAP-4: named lane for the executable policy suite
      # (dependency / credential-surface / typing / coverage). Also collected
      # by the full pytest step below; this step keeps the suite visible as
      # its own CI gate rather than an accidental collect.
      - name: Policy suite
        run: python -m pytest tests/policy -v

      - name: Full test suite (platformapp app tests, the ASGI seam, and the import boundary)
        run: python -m pytest -v

  # P1 fan-in: one Docker build exported for gke-portability-smoke,
  # ocp-portability-smoke, and air-gap-parity only. container runs
  # independent docker + podman builds (spec 10.3 — both engines, both
  # build paths).
  build-platform-image:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (
          (inputs.jobs == 'all' && (inputs.air_gap_parity || inputs.gke_portability_smoke || inputs.ocp_portability_smoke)) ||
          (inputs.jobs == 'air-gap-parity-only' && inputs.air_gap_parity)
        )
      ) ||
      (
        github.event_name != 'workflow_dispatch' &&
        (vars.PLATFORM_CI_AIR_GAP_PARITY == 'true' || vars.PLATFORM_CI_GKE_PORTABILITY_SMOKE == 'true' || vars.PLATFORM_CI_OCP_PORTABILITY_SMOKE == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Verify src/platform exists on this ref
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      - name: Build platform image (once per workflow run)
        run: docker build -f src/platform/Containerfile -t "${{ env.PLATFORM_CI_IMAGE_REF }}" .

      # The chart renders the DB-GPT sidecar Deployment UNCONDITIONALLY
      # (sidecar-deployment.yaml has no `enabled` guard), so every `helm
      # install` of the core chart references `platform-dbgpt-sidecar`. Built
      # here alongside the platform image so air-gap-parity can prove the whole
      # rendered release resolves node-locally -- without it that job's pod
      # pulls from a registry, which is the exact thing CAP-6 forbids.
      - name: Build DB-GPT sidecar image (chart renders it unconditionally)
        run: docker build -f src/platform/compose/dbgpt/Containerfile -t "${{ env.PLATFORM_CI_SIDECAR_REF }}" .

      - name: Export platform + sidecar images for downstream jobs
        run: docker save "${{ env.PLATFORM_CI_IMAGE_REF }}" "${{ env.PLATFORM_CI_SIDECAR_REF }}" | gzip -1 > platform-ci-image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: platform-ci-image
          path: platform-ci-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Story 10.3 ("One image, both engines"): builds + smoke-tests
  # `src/platform/Containerfile` under BOTH engines from the same file --
  # spec-python-agent-platform's own Constraints name this explicitly ("CI
  # exercises both engines, not one"). `fail-fast: false` so a podman-only
  # break doesn't hide a docker-only break (or vice versa) in the same run.
  #
  # Build context is the REPO ROOT, not `src/platform` -- the builder
  # stage's `pixi install --frozen -e python-agent-platform` needs the
  # workspace-root `pixi.toml`/`pixi.lock`; see the Containerfile's own
  # top-of-file comment for the full reasoning (this mirrors it exactly).
  #
  # This job's `/ht/` + `manage.py check` steps depend on `django-health-
  # check`'s registration matching `pixi.toml`'s conda-sourced `>=4.5.0`
  # pin (Story 10.2) rather than Story 10.1's original pip-pinned 3.24.0
  # API -- `config/settings/base.py`'s `INSTALLED_APPS` and
  # `config/urls.py`'s `/ht/` route were updated in this same story to the
  # 4.x registration API (plain `HealthCheckView(checks=[...])`, no more
  # `health_check.db`/`health_check.cache` sub-apps or `health_check.urls`)
  # after live verification found `django.setup()` failing with
  # `ModuleNotFoundError: No module named 'health_check.db'` under the old
  # wiring -- see spec-10-3-one-image-both-engines.md's Design Notes for
  # the full investigation and evidence. Both steps are expected green.
  container:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all'
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    runs-on: ubuntu-latest
    # 45, not 20: each leg cold-builds the full Containerfile on its own
    # engine (spec 10.3 — independent docker build + independent podman
    # build; neither loads build-platform-image's artifact).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Verify src/platform exists on this ref
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      # ubuntu-latest GitHub-hosted runners ship podman preinstalled, and
      # the runner's own user is already non-root, so this naturally
      # exercises ROOTLESS podman -- the spec's own reference posture (it
      # "predicts passing the first deployment target", OCP's
      # `restricted-v2`). The `command -v` guard makes this correct either
      # way if that ever stops being true upstream.
      - name: Ensure podman is available (rootless)
        if: matrix.engine == 'podman'
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          id -u

      - name: Build image (${{ matrix.engine }})
        run: ${{ matrix.engine }} build -f src/platform/Containerfile -t platform-ci-${{ matrix.engine }} .

      - name: Start postgres + redis (${{ matrix.engine }})
        run: |
          ${{ matrix.engine }} network create platform-ci-net-${{ matrix.engine }}
          ${{ matrix.engine }} run -d --name platform-ci-postgres-${{ matrix.engine }} \
            --network platform-ci-net-${{ matrix.engine }} \
            -e POSTGRES_USER=platform -e POSTGRES_PASSWORD=platform -e POSTGRES_DB=platform \
            postgres:17
          ${{ matrix.engine }} run -d --name platform-ci-redis-${{ matrix.engine }} \
            --network platform-ci-net-${{ matrix.engine }} \
            redis:7
          # `-h 127.0.0.1` is load-bearing, not decoration: it forces a TCP
          # probe. A socket-only `pg_isready` also answers from the temporary
          # server the official postgres image runs DURING its initdb
          # bootstrap (`-c listen_addresses=''`), which then stops and
          # restarts -- so the loop would break while nothing is listening on
          # 5432 yet, and the un-retried Migrate step below (which connects
          # over TCP via DATABASE_URL) would fail with "connection refused"
          # and read as a real regression. `compose/compose.yml` documents the
          # same race and absorbs it with `restart: on-failure`; this job has
          # no restart policy, so it has to wait for the real server.
          for i in $(seq 1 30); do
            ${{ matrix.engine }} exec platform-ci-postgres-${{ matrix.engine }} pg_isready -h 127.0.0.1 -p 5432 -U platform >/dev/null 2>&1 && break
            if [ "$i" = "30" ]; then
              echo "::error::postgres (${{ matrix.engine }}) never became ready"
              ${{ matrix.engine }} logs platform-ci-postgres-${{ matrix.engine }}
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            ${{ matrix.engine }} exec platform-ci-redis-${{ matrix.engine }} redis-cli ping >/dev/null 2>&1 && break
            if [ "$i" = "30" ]; then
              echo "::error::redis (${{ matrix.engine }}) never became ready"
              ${{ matrix.engine }} logs platform-ci-redis-${{ matrix.engine }}
              exit 1
            fi
            sleep 2
          done

      # The image's own ENTRYPOINT/CMD deliberately does NOT migrate -- on
      # Kubernetes/OCP that belongs to a separate Job, not to every pod's
      # boot (concurrent replicas would race the same migration). So CI has
      # to do it explicitly, exactly as `compose/compose.yml` does for the
      # local stack, and for the same reason: without it every assertion
      # below runs against a database with ZERO TABLES and still passes.
      # That is not hypothetical -- this story shipped exactly that state in
      # compose and only caught it because someone requested `/admin/login/`
      # by hand. `/ht/`'s Database check is a bare connectivity probe and
      # `/` renders with no query at all, so neither notices.
      #
      # Story 11.1 moved this step AHEAD of "Run platform container" (it used
      # to run after, via `exec` against the already-started app container):
      # Langflow's own ASGI lifespan startup now runs `langflow_schema`'s
      # Alembic bootstrap the moment the app process boots (config/asgi.py's
      # dual-lifespan dispatch), and that fails loudly if `langflow_schema`
      # doesn't exist yet -- which it doesn't until THIS migration
      # (`langflow_integration`'s `RunSQL`) has run. A one-off `run --rm`
      # against the same image/network stands in for the container that
      # doesn't exist yet; `exec` only works against an already-running one.
      - name: Migrate the database (the image's CMD deliberately doesn't)
        run: |
          ${{ matrix.engine }} run --rm \
            --network platform-ci-net-${{ matrix.engine }} \
            --user 12345:0 \
            --entrypoint /app/entrypoint.sh \
            -e DATABASE_URL=postgres://platform:platform@platform-ci-postgres-${{ matrix.engine }}:5432/platform \
            -e REDIS_URL=redis://platform-ci-redis-${{ matrix.engine }}:6379/0 \
            -e DJANGO_SECRET_KEY=ci-placeholder-not-a-real-secret \
            -e DJANGO_ADMIN_URL=admin/ \
            -e COMPONENT_RUNTIME=local \
            platform-ci-${{ matrix.engine }} \
            python manage.py migrate --noinput || {
            echo "::error::migrate failed (${{ matrix.engine }})"
            exit 1
          }

      # `--user 12345:0` proves the image runs under an arbitrary uid that
      # was never baked into the Containerfile anywhere (the spec's own
      # I/O & Edge-Case Matrix row for this).
      - name: Run platform container (${{ matrix.engine }})
        run: |
          ${{ matrix.engine }} run -d --name platform-ci-app-${{ matrix.engine }} \
            --network platform-ci-net-${{ matrix.engine }} \
            --user 12345:0 \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-placeholder-not-a-real-secret \
            -e DJANGO_ADMIN_URL=admin/ \
            -e COMPONENT_RUNTIME=local \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SECURE_SSL_REDIRECT=False \
            -e DATABASE_URL=postgres://platform:platform@platform-ci-postgres-${{ matrix.engine }}:5432/platform \
            -e REDIS_URL=redis://platform-ci-redis-${{ matrix.engine }}:6379/0 \
            platform-ci-${{ matrix.engine }}

      # 120s, not 60: a cold runner has already spent its budget on the
      # build, and a slow-but-correct gunicorn/uvicorn boot that trips a
      # tight poll reads exactly like a real regression.
      - name: Poll /ht/ for 200
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ht/ || true)"
            if [ "$code" = "200" ]; then echo "healthy (200)"; exit 0; fi
            sleep 2
          done
          echo "::error::/ht/ never returned 200 (${{ matrix.engine }})"
          ${{ matrix.engine }} logs platform-ci-app-${{ matrix.engine }}
          exit 1

      # The only assertion here that actually QUERIES an application table.
      # `/admin/login/` reads `django_site`; against an unmigrated database
      # it 500s with `relation "django_site" does not exist` (observed live
      # in this story). It is therefore the step that proves the migrate
      # above ran AND that the conda-sourced psycopg2 driver round-trips the
      # ORM -- neither of which any other step in this job can fail on.
      - name: Smoke-test an ORM-backed page (proves migrations ran)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/login/ || true)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /admin/login/ returned $code, expected 200 (${{ matrix.engine }})"
            ${{ matrix.engine }} logs platform-ci-app-${{ matrix.engine }}
            exit 1
          fi

      # `/ht/` alone is NOT sufficient coverage for this image, and this step
      # exists because review proved it: `/ht/` renders no `{% static %}`
      # tag, so it stayed green while the image could not serve a single
      # real page (`production.py`'s strict WhiteNoise manifest storage +
      # `COMPRESS_OFFLINE` need the Containerfile's three-pass
      # `collectstatic` -> `compress --force` -> `collectstatic` sequence;
      # regress that ordering and only a template-rendering page notices).
      # `/` extends `templates/base.html`, which carries six `{% static %}`
      # references and a `{% compress %}` block -- the cheapest request that
      # actually exercises both mechanisms.
      - name: Smoke-test a real template page (static manifest + offline compression)
        run: |
          code="$(curl -s -o /tmp/home.html -w '%{http_code}' http://localhost:8000/ || true)"
          if [ "$code" != "200" ]; then
            echo "::error::GET / returned $code, expected 200 (${{ matrix.engine }})"
            ${{ matrix.engine }} logs platform-ci-app-${{ matrix.engine }}
            exit 1
          fi
          # A 200 alone is not proof: Django can return a rendered error page.
          if grep -qE 'OfflineGenerationError|Missing staticfiles manifest entry|Traceback' /tmp/home.html; then
            echo "::error::GET / returned 200 but the body contains a static/compress failure (${{ matrix.engine }})"
            exit 1
          fi

      # ...and a clean page body is still not proof the assets it names are
      # actually SERVABLE. WhiteNoise's manifest storage rewrites every
      # `{% static %}` reference to a hashed filename, and django-compressor
      # emits `/static/CACHE/...` bundles that exist only if pass 2 of the
      # three-pass sequence ran; a break in either produces a page that
      # renders fine and 404s every stylesheet. Fetch what the page itself
      # asked for -- derived from the rendered HTML, never a hardcoded list,
      # so it keeps testing the right URLs as the templates change.
      - name: Fetch every static asset the home page references
        run: |
          urls="$(grep -oE '/static/[^"]+' /tmp/home.html | sort -u)"
          if [ -z "$urls" ]; then
            echo "::error::GET / referenced no /static/ URL at all -- template or manifest regression (${{ matrix.engine }})"
            exit 1
          fi
          rc=0
          for u in $urls; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$u" || true)"
            echo "$code $u"
            [ "$code" = "200" ] || rc=1
          done
          if [ "$rc" != "0" ]; then
            echo "::error::at least one static asset referenced by / did not return 200 (${{ matrix.engine }})"
            exit 1
          fi

      # Every request above lands on the DJANGO half of `config/asgi.py`'s
      # dispatcher. `/api/*` is routed to `fastapi_application` instead, and
      # nothing here had ever sent it one -- so the image's whole `/api/`
      # namespace was untested against the stack it actually ships. That is
      # not the same coverage the `test` job provides: `fastapi` is on the
      # pip-layer exclusion list, so the image runs the CONDA fastapi while
      # `test` runs pip's `fastapi==0.141.1`. `/api/health` is the seam's
      # only route (`config/fastapi_app.py`).
      - name: Smoke-test the FastAPI seam (/api/, the other half of the ASGI dispatcher)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health || true)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /api/health returned $code, expected 200 (${{ matrix.engine }})"
            ${{ matrix.engine }} logs platform-ci-app-${{ matrix.engine }}
            exit 1
          fi

      # Story 11.1: proves the Langflow mount is live in the BUILT image, not
      # just under local dev/pytest (neither of which drives a real ASGI
      # lifespan -- see tests/test_langflow_mount.py's module docstring).
      # `/health` (not `/api/v1/...`) is the smoke target because it is
      # Langflow's own unconditional liveness ping (`{"status": "ok"}`, no
      # DB/service dependency) -- the "or Langflow's /health" alternative the
      # spec names, and the one least coupled to Langflow's internal route
      # names. By the time this runs, "Poll /ht/ for 200" has already proven
      # the app process survived Langflow's own Alembic-bootstrap lifespan
      # startup (which now runs against the pre-migrated `langflow_schema`
      # from the "Migrate the database" step above) -- this step proves that
      # startup specifically wired the Langflow ASGI app into the dispatcher,
      # not just that Django came up.
      - name: Smoke-test the Langflow mount (bare /health, unchanged forward per AD-4)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /health returned $code, expected 200 (${{ matrix.engine }})"
            ${{ matrix.engine }} logs platform-ci-app-${{ matrix.engine }}
            exit 1
          fi

      - name: manage.py check inside the running container
        run: ${{ matrix.engine }} exec platform-ci-app-${{ matrix.engine }} /app/entrypoint.sh python manage.py check

      # TWO distinct assertions, because they prove different things:
      #   1. The running container's uid -- but that container was started
      #      with an explicit `--user 12345:0`, so this only proves the
      #      ENGINE honored the flag. It is the arbitrary-UID contract
      #      (OCP `restricted-v2` assigns a random uid at deploy time).
      #   2. The IMAGE's own default uid, with NO `--user` override -- this
      #      is what an operator running `docker run <image>` actually gets,
      #      and the only thing that catches a regression of the
      #      Containerfile's `USER 1001:0` line. Assertion 1 alone was
      #      tautological; review caught it.
      - name: Confirm non-root UID (running container, arbitrary uid honored)
        run: |
          uid="$(${{ matrix.engine }} exec platform-ci-app-${{ matrix.engine }} id -u)"
          echo "running container uid: $uid"
          if [ "$uid" != "12345" ]; then
            echo "::error::--user 12345:0 was not honored (got uid $uid)"
            exit 1
          fi

      # BOTH halves of `USER 1001:0`, because only the uid half was ever
      # asserted: the arbitrary-UID model gives the process its write access
      # through GROUP 0, not through its uid. A regression to `USER
      # 1001:1001` keeps this uid non-zero while silently making `$HOME` and
      # `MEDIA_ROOT` unwritable for anyone who runs the image WITHOUT a
      # `--user` override -- and the probe steps below cannot see it, because
      # they run in the container started with an explicit `--user 12345:0`.
      - name: Confirm the image itself declares a non-root USER in group 0
        run: |
          uid="$(${{ matrix.engine }} run --rm --entrypoint id platform-ci-${{ matrix.engine }} -u)"
          gid="$(${{ matrix.engine }} run --rm --entrypoint id platform-ci-${{ matrix.engine }} -g)"
          echo "image default uid:gid = $uid:$gid"
          if [ "$uid" = "0" ]; then
            echo "::error::image defaults to root (uid 0); Containerfile USER directive regressed"
            exit 1
          fi
          if [ "$gid" != "0" ]; then
            echo "::error::image default gid is $gid, expected 0; the arbitrary-UID write contract depends on group 0"
            exit 1
          fi

      # The arbitrary-UID contract is TWO properties, and the uid assertions
      # above only cover the first (the process is not root). The second is
      # that a uid with no `/etc/passwd` entry can actually WRITE where the
      # app needs to: `$HOME` (gunicorn 26 opens a control socket there on
      # boot) and `MEDIA_ROOT`. Both depend on the Containerfile's `chgrp 0`
      # /`chmod g+rwX` lines, which have already regressed once in this
      # story's own history -- `$HOME` was root-owned 0755 and every write
      # failed, invisible to every other check here. `STATIC_ROOT` is
      # asserted NON-writable in the same step: it is deliberately `g+rX`,
      # and a future blanket `chmod -R g+rwX /app` would silently hand every
      # visitor-facing JS bundle to the runtime user.
      #
      # `/app` ITSELF is asserted non-writable for a different reason. On
      # POSIX, the right to unlink or rename an entry comes from the
      # DIRECTORY, not the file -- so an earlier revision of this story that
      # set `$HOME=/app` and made `/app` group-0-writable let the runtime user
      # `rm /app/entrypoint.sh` and `mv /app/config`, i.e. replace the very
      # script the next start executes. Nothing in this job could see it. That
      # is why `$HOME` is now the dedicated `/app/.home`, and why this asserts
      # the containing directory stayed 0755 root:root.
      #
      # Each negative probe requires the target to EXIST first: `touch` on a
      # missing directory fails with ENOENT exactly like it fails with EACCES,
      # so without the `test -d` a deleted or renamed `staticfiles` would read
      # as "the read-only contract holds".
      - name: Confirm the arbitrary UID can write $HOME and media, but not staticfiles or /app
        run: |
          ${{ matrix.engine }} exec platform-ci-app-${{ matrix.engine }} sh -c '
            set -e
            test -d "$HOME" || { echo "HOME_MISSING: $HOME"; exit 1; }
            touch "$HOME/.ci-probe" && rm "$HOME/.ci-probe"
            test -d /app/platformapp/media || { echo "MEDIA_MISSING"; exit 1; }
            touch /app/platformapp/media/.ci-probe && rm /app/platformapp/media/.ci-probe
            test -d /app/staticfiles || { echo "STATICFILES_MISSING"; exit 1; }
            if touch /app/staticfiles/.ci-probe 2>/dev/null; then
              rm -f /app/staticfiles/.ci-probe
              echo "STATICFILES_WRITABLE"
              exit 1
            fi
            if touch /app/.ci-probe 2>/dev/null; then
              rm -f /app/.ci-probe
              echo "APP_DIR_WRITABLE: the runtime user can replace /app/entrypoint.sh"
              exit 1
            fi
          ' || { echo "::error::arbitrary-UID filesystem contract regressed (${{ matrix.engine }})"; exit 1; }

      - name: Teardown
        if: always()
        run: |
          ${{ matrix.engine }} rm -f \
            platform-ci-app-${{ matrix.engine }} \
            platform-ci-postgres-${{ matrix.engine }} \
            platform-ci-redis-${{ matrix.engine }} || true
          ${{ matrix.engine }} network rm platform-ci-net-${{ matrix.engine }} || true
          ${{ matrix.engine }} rmi platform-ci-${{ matrix.engine }} || true

  # Story 10.5 (AD-14 Pattern B): the DB-GPT sidecar's own docker/podman
  # build + health + rootless-UID job, sibling to `container` above and
  # reusing its exact `matrix.engine: [docker, podman]` pattern (the spec's
  # own wording: "asserting the same rootless / non-root / arbitrary-UID
  # contract Story 10.3 already proves for the main image"). Deliberately a
  # SEPARATE job rather than folded into `container`: this sidecar has no
  # postgres/redis dependency, no migrate step, no Django static-asset
  # surface -- the main job's own steps for those don't apply, and bolting
  # DB-GPT-only steps onto an already-long Django-image job would make
  # neither easier to read. See `src/platform/compose/dbgpt/Containerfile`'s
  # own top-of-file comment for why this image is built from a separate,
  # isolated `dbgpt-sidecar` pixi env in the first place.
  container-dbgpt:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all'
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    runs-on: ubuntu-latest
    # 30, not 45 (the `container` job's own budget): the `dbgpt-sidecar` env
    # is a much smaller solve than `python-agent-platform`'s 395 packages
    # (confirmed live locally: `dbgpt-app` + its dozen `pin_subpackage`'d
    # siblings, no Django/Langflow/Postgres/Redis client deps) plus the same
    # build-time-only `pyforge-steward` secrets-scan env `container` also
    # pays for -- still generous over a cold runner's pixi-cache-miss cost.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Verify src/platform/compose/dbgpt exists on this ref
        run: test -d src/platform/compose/dbgpt || { echo "::error::src/platform/compose/dbgpt does not exist on this ref"; exit 1; }

      # Same rootless-podman rationale as `container`'s own step -- not
      # re-derived here.
      - name: Ensure podman is available (rootless)
        if: matrix.engine == 'podman'
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          id -u

      - name: Build image (${{ matrix.engine }})
        run: ${{ matrix.engine }} build -f src/platform/compose/dbgpt/Containerfile -t dbgpt-sidecar-ci-${{ matrix.engine }} .

      # No postgres/redis to start first, and no separate migrate step --
      # unlike `platform`, this image's own ENTRYPOINT/CMD (`dbgpt start
      # webserver -y -c /app/dbgpt-sidecar-config.toml`) runs DB-GPT's own
      # alembic migration against its baked-in SQLite metadata store as part
      # of that one boot sequence (see the Containerfile's `pilot_template/`
      # comment) -- there is no concurrent-replica migration race to avoid
      # sequencing separately, because this job runs exactly one container.
      - name: Run dbgpt-sidecar container (${{ matrix.engine }})
        run: |
          ${{ matrix.engine }} rm -f dbgpt-sidecar-ci-app-${{ matrix.engine }} || true
          ${{ matrix.engine }} run -d --name dbgpt-sidecar-ci-app-${{ matrix.engine }} \
            -p 5670:5670 \
            dbgpt-sidecar-ci-${{ matrix.engine }}

      # 90s budget (vs. `container`'s 120s over its own, heavier boot): a
      # `docker run` of this same image locally reached `/api/health` in
      # ~20-25s (alembic autogenerate-and-upgrade, then component
      # registration); this is a generous margin for a cold, uncached
      # runner, not a value tuned to an observed failure.
      - name: Poll /api/health for 200
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            health_url() {
              port="$(${{ matrix.engine }} port dbgpt-sidecar-ci-app-${{ matrix.engine }} 5670/tcp | head -1 | cut -d: -f2)"
              echo "http://127.0.0.1:${port}/api/health"
            }
          else
            health_url() { echo "http://localhost:5670/api/health"; }
          fi
          url="$(health_url)"
          echo "polling ${url}"
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then echo "healthy (200)"; exit 0; fi
            sleep 2
          done
          echo "::error::/api/health never returned 200 (${{ matrix.engine }})"
          ${{ matrix.engine }} logs dbgpt-sidecar-ci-app-${{ matrix.engine }}
          exit 1

      # Same TWO-assertion split as `container`'s own arbitrary-UID checks,
      # and the same reason: the running-container uid only proves the
      # ENGINE honored `--user`, while the image's OWN default (no
      # `--user` override) is what an operator actually gets and the only
      # thing that catches a `USER` directive regression.
      - name: Confirm non-root UID (running container, arbitrary uid honored)
        run: |
          ${{ matrix.engine }} rm -f dbgpt-sidecar-ci-arbuid-${{ matrix.engine }} || true
          ${{ matrix.engine }} run -d --name dbgpt-sidecar-ci-arbuid-${{ matrix.engine }} \
            --user 12345:0 \
            dbgpt-sidecar-ci-${{ matrix.engine }}
          sleep 3
          uid="$(${{ matrix.engine }} exec dbgpt-sidecar-ci-arbuid-${{ matrix.engine }} id -u)"
          echo "running container uid: $uid"
          if [ "$uid" != "12345" ]; then
            echo "::error::--user 12345:0 was not honored (got uid $uid)"
            exit 1
          fi

      - name: Confirm the image itself declares a non-root USER in group 0
        run: |
          uid="$(${{ matrix.engine }} run --rm --entrypoint id dbgpt-sidecar-ci-${{ matrix.engine }} -u)"
          gid="$(${{ matrix.engine }} run --rm --entrypoint id dbgpt-sidecar-ci-${{ matrix.engine }} -g)"
          echo "image default uid:gid = $uid:$gid"
          if [ "$uid" = "0" ]; then
            echo "::error::image defaults to root (uid 0); Containerfile USER directive regressed"
            exit 1
          fi
          if [ "$gid" != "0" ]; then
            echo "::error::image default gid is $gid, expected 0; the arbitrary-UID write contract depends on group 0"
            exit 1
          fi

      # Same shape as `container`'s own filesystem-contract probe: `$HOME`
      # must be writable by an arbitrary uid (DB-GPT's own sqlite metadata
      # store + generated `pilot/` scaffold + logs all land there), and
      # `/app` itself must stay non-writable (POSIX unlink/rename permission
      # comes from the DIRECTORY, not the file -- a writable `/app` would let
      # the runtime user replace `/app/entrypoint.sh`).
      - name: Confirm the arbitrary UID can write $HOME but not /app
        run: |
          ${{ matrix.engine }} exec dbgpt-sidecar-ci-arbuid-${{ matrix.engine }} sh -c '
            set -e
            test -d "$HOME" || { echo "HOME_MISSING: $HOME"; exit 1; }
            touch "$HOME/.ci-probe" && rm "$HOME/.ci-probe"
            if touch /app/.ci-probe 2>/dev/null; then
              rm -f /app/.ci-probe
              echo "APP_DIR_WRITABLE: the runtime user can replace /app/entrypoint.sh"
              exit 1
            fi
          ' || { echo "::error::arbitrary-UID filesystem contract regressed (${{ matrix.engine }})"; exit 1; }

      - name: Teardown
        if: always()
        run: |
          ${{ matrix.engine }} rm -f \
            dbgpt-sidecar-ci-app-${{ matrix.engine }} \
            dbgpt-sidecar-ci-arbuid-${{ matrix.engine }} || true
          ${{ matrix.engine }} rmi dbgpt-sidecar-ci-${{ matrix.engine }} || true

  # Story 12.2 ("GKE as a portability profile"): proves AD-11's portability
  # clause ("GKE runs as a CI smoke profile, never a second implementation")
  # -- 12.1's own `deploy/README.md` names "No live-cluster verification in
  # this repo" as an open gap. This job installs the UNMODIFIED Story 12.1
  # core chart (`src/platform/deploy/charts/platform/`, only scalar `--set`
  # overrides at install time -- never a second chart/overlay/values file)
  # onto an ephemeral `kind` cluster -- a GKE-shaped, non-OCP target -- and
  # curls it through a real `Ingress` + `ingress-nginx` controller, never a
  # `kubectl port-forward` or a direct Service curl. That substitution IS
  # the proof: the same chart, reached through a real Ingress object and a
  # real ingress controller, rather than the parsed-manifest assertions
  # `test_chart_invariants.py` already covers.
  #
  # Single engine (Docker) only -- `container`'s own docker+podman matrix is
  # deliberately not duplicated here; a portability profile job is out of
  # scope for that second axis.
  #
  # No `needs:` on `test`/`container-dbgpt` -- this job loads the shared
  # platform image from build-platform-image rather than rebuilding it.
  gke-portability-smoke:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && inputs.gke_portability_smoke) ||
        (github.event_name != 'workflow_dispatch' && vars.PLATFORM_CI_GKE_PORTABILITY_SMOKE == 'true')
      ) &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all')
    needs: build-platform-image
    runs-on: ubuntu-latest
    # kind + ingress + helm; image build happens in build-platform-image.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Same workflow_dispatch guard as `test`/`container`/`container-dbgpt`
      # (workflow_dispatch has no `paths:` filter) -- see `test`'s own step
      # for the full rationale.
      - name: Verify src/platform exists on this ref
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      # Found live (2026-08-22, PR #618's first CI run): this job stacks
      # THREE real disk consumers on one `ubuntu-latest` runner -- the
      # `platform-dev` pixi env below (composes the 395-package
      # `python-agent-platform` solve for helm/kubectl on the RUNNER
      # itself), `docker build`'s own build cache (the builder stage
      # SEPARATELY solves that same env again, inside the container), and
      # `kind load docker-image` duplicating the ~2GB final image a second
      # time into the kind node's own containerd storage. Together they
      # exceeded the runner's default free disk (~14GB of ~84GB total --
      # the rest is preinstalled toolchains this job never touches), and
      # `kind load` failed mid-run: "write .../django-5.2.15.dist-info/
      # RECORD: no space left on device" (run 32588653903, job
      # 97068844446). This is the well-known GitHub-hosted-runner fix:
      # reclaim the large preinstalled SDKs no step here uses. `|| true` on
      # each removal -- runner images change contents/paths over time, and
      # a path that's already absent is not a failure.
      - name: Free disk space (reclaim unused preinstalled toolchains)
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/az || true
          echo "After:"; df -h /

      - uses: actions/download-artifact@v7
        with:
          name: platform-ci-image

      # AD-16: helm and kubectl come from the `platform-dev` pixi
      # environment, never a system install -- mirrors `dashboard.yml`'s
      # single-environment usage, which activates it onto PATH so later
      # steps invoke `helm`/`kubectl` directly (no `pixi run -e` prefix
      # needed).
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: platform-dev
          locked: true
          cache: true

      # `kind` is AD-16's one explicit, named system-level exception
      # alongside the container engine itself -- everything else in this
      # job's toolchain (helm, kubectl) is pixi-provisioned above. Pinned to
      # the verified-latest release at story time; bump deliberately.
      - name: Install kind v0.32.0 (pinned; AD-16's named system exception)
        run: |
          curl -fLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # GKE-shaped, non-OCP target: extraPortMappings 80/443 forward the
      # runner's own 127.0.0.1:80/443 into the kind node container, and the
      # ingress-ready=true node label is what the pinned ingress-nginx kind
      # provider manifest below node-selects onto -- the standard upstream
      # kind+ingress-nginx shape (kind.sigs.k8s.io/docs/user/ingress).
      - name: Create kind cluster (GKE-shaped, non-OCP target)
        run: |
          cat <<'EOF' > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF
          kind create cluster --name gke-smoke --config kind-config.yaml --wait 90s

      # Pinned to controller-v1.15.1 -- the exact tag names the manifest URL,
      # so this apply is reproducible independent of whatever "latest" means
      # on the day the job runs.
      - name: Install ingress-nginx (kind provider, pinned controller-v1.15.1)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      # Same Containerfile artifact as `container` / air-gap-parity -- loaded
      # from build-platform-image, retagged away from `latest` deliberately:
      # `_helpers.tpl`'s `platform.imagePullPolicy` forces `Always` whenever
      # the EFFECTIVE tag is "latest", and a kind-loaded image has no registry
      # behind it for that pull to reach -- the pod would sit in
      # `ImagePullBackOff` forever (this story's own I/O & Edge-Case Matrix
      # names this gotcha explicitly).
      - name: Load shared platform image (retag for kind)
        run: |
          gunzip -c platform-ci-image.tar.gz | docker load
          docker tag "${{ env.PLATFORM_CI_IMAGE_REF }}" platform:gke-smoke

      # No registry push -- `kind load` sideloads the image directly into
      # every node's containerd, which is what makes the non-`latest` tag
      # above resolvable with no registry configured at all.
      - name: kind load the built image (no registry push)
        run: kind load docker-image platform:gke-smoke --name gke-smoke

      # AD-12: the chart never renders a Secret. NOTES.txt's own documented
      # shape (postgres://<user>:<password>@<release>-postgres:5432/<db>),
      # composed here with the release name fixed to "platform" below
      # (predictable DNS: platform-postgres / platform-redis / platform).
      - name: Create namespace + platform-secrets Secret
        run: |
          kubectl create namespace platform-smoke
          kubectl create secret generic platform-secrets \
            --namespace platform-smoke \
            --from-literal=DJANGO_SECRET_KEY=ci-gke-smoke-placeholder-not-a-real-secret \
            --from-literal=DATABASE_URL=postgres://platform:ci-gke-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=MIGRATION_DATABASE_URL=postgres://platform:ci-gke-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=POSTGRES_PASSWORD=ci-gke-smoke-not-a-real-secret

      # ONLY scalar --set value overrides -- never a second chart/overlay/
      # values file (AD-11: GKE is a profile, not a parallel implementation).
      # Both overrides are named, live gotchas, not speculative hardening:
      #   image.tag           -- see the build step above (latest -> Always
      #                           pull -> ImagePullBackOff with no registry).
      #   django.secureSslRedirect -- defaults "True"; this bare-HTTP kind
      #                           ingress has no TLS terminator, so a plain
      #                           http:// probe would 301 instead of 200 --
      #                           the exact override deploy/README.md
      #                           documents for TLS-less installs and the
      #                           `container` job's own
      #                           DJANGO_SECURE_SSL_REDIRECT=False convention.
      # Deliberately NO --wait: `helm install --wait` blocks on the release's
      # Deployments reaching Ready BEFORE it fires post-install hooks (the
      # migrate Job) -- proven live (2026-08-22, this story): the web pod's
      # in-process Langflow ASGI lifespan (Story 11.1) hard-crashes with
      # `psycopg.errors.InvalidSchemaName: no schema has been selected to
      # create in` whenever `langflow_schema` doesn't exist yet, so with
      # --wait the pod can never reach Ready, the migrate Job that would
      # create that schema never gets scheduled at all, and the install
      # times out -- a genuine deadlock, not the merely transient
      # "Honest limitations" migration window deploy/README.md documents
      # for Django's own (schema-agnostic) migrations. Dropping --wait lets
      # Helm submit every resource immediately: the migrate Job runs right
      # away, the web pod's first boot attempt still races it and crashes
      # once, but Kubernetes' normal restart policy retries after the
      # schema exists -- confirmed live, one restart, then Ready. The two
      # explicit `kubectl wait`/curl-retry steps below stand in for what
      # --wait would otherwise have proven.
      - name: helm install the unmodified core chart (scalar --set overrides only)
        run: |
          helm install platform src/platform/deploy/charts/platform \
            --namespace platform-smoke \
            --set image.tag=gke-smoke \
            --set django.secureSslRedirect=False \
            --timeout 5m || {
            echo "::error::helm install failed"
            kubectl get pods,jobs,events -n platform-smoke
            exit 1
          }

      # `/ht/`'s Database check is connectivity-only (deploy/README.md
      # "Honest limitations"), so it may legitimately 200 before the migrate
      # Job finishes -- this poll is therefore NOT gated on the explicit
      # `kubectl wait` below (that wait belongs before the ORM-backed
      # `/admin/login/` assertion instead, not before this one).
      - name: Smoke-test /ht/ through the Ingress (connectivity-only)
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: platform.internal' http://127.0.0.1/ht/ || true)"
            if [ "$code" = "200" ]; then echo "healthy (200)"; exit 0; fi
            sleep 2
          done
          echo "::error::/ht/ through the Ingress never returned 200"
          kubectl get pods -n platform-smoke
          exit 1

      # Load-bearing now that helm install runs without --wait (see that
      # step's comment): this is what actually closes the migration window
      # before the ORM-backed assertion below runs. 180s (vs. the /ht/
      # step's 60s budget above) because `migrate.backoffLimit: 6`
      # (values.yaml) absorbs the postgres-boot race compose/the chart's own
      # comments document -- several retries can legitimately take longer
      # than the one web-pod restart the /ht/ loop is sized for.
      - name: Wait for the migrate hook Job to complete
        run: |
          kubectl wait --namespace platform-smoke --for=condition=complete job/platform-migrate --timeout=180s || {
            echo "::error::migrate Job did not reach Complete"
            kubectl get pods,jobs,events -n platform-smoke
            kubectl logs -n platform-smoke -l app.kubernetes.io/component=migrate --tail=200 || true
            exit 1
          }

      # The ORM-backed assertion: `/platform-admin/login/` reads `django_site`,
      # so this proves the migrate Job actually ran through the Ingress path,
      # not just that the app process answers a bare connectivity probe.
      # CAP-3 / steward 16.2: chart default adminUrl is `platform-admin/`
      # (stage-1 refuses the cookiecutter placeholder `admin/`).
      - name: Smoke-test /platform-admin/login/ through the Ingress (proves the ORM round-trip)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: platform.internal' http://127.0.0.1/platform-admin/login/ || true)"
          if [ "$code" != "200" ]; then
            echo "::error::/platform-admin/login/ through the Ingress returned $code, expected 200"
            kubectl get pods,events -n platform-smoke || true
            kubectl logs -n platform-smoke -l app.kubernetes.io/component=web --tail=200 || true
            exit 1
          fi

      - name: Teardown
        if: always()
        run: kind delete cluster --name gke-smoke || true

  # Story 12.9 ("OCP as a portability profile"): proves AD-11's OCP overlay
  # path on a real OpenShift API -- CRC / OpenShift Local with Route admission
  # and restricted-v2 SCC behavior that kind cannot exercise. Reuses
  # `gke-portability-smoke`'s established patterns (disk reclaim, setup-pixi,
  # artifact download, platform-secrets Secret, no-`--wait` helm install,
  # migrate-Job wait, Route-routed curl retries, `if: always()` teardown) --
  # only the NEW pieces this story adds are commented in depth below.
  #
  # Single engine (Docker) only -- same rationale as `gke-portability-smoke`.
  # Image delivery uses the CRC internal registry push pattern from
  # `cluster-bringup-facts.md`, not `kind load`.
  #
  # No `needs:` on test/container-dbgpt. Loads the shared platform image from
  # build-platform-image (P1 fan-in) rather than rebuilding it.
  ocp-portability-smoke:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && inputs.ocp_portability_smoke) ||
        (github.event_name != 'workflow_dispatch' && vars.PLATFORM_CI_OCP_PORTABILITY_SMOKE == 'true')
      ) &&
      (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all')
    needs: build-platform-image
    runs-on: ubuntu-latest
    # CRC preset (4 cores, 10.5 GiB RAM, 35 GiB disk) + bundle download +
    # internal-registry push + helm/Routes -- sized above gke-smoke's 45m.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Verify src/platform exists on this ref
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      # Block If: the job is enabled but the Red Hat pull secret is absent --
      # fail fast with an explicit annotation rather than letting CRC start
      # with the action's dummy default and flake later.
      - name: Verify CRC_PULL_SECRET is configured
        env:
          CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}
        run: |
          if [ -z "${CRC_PULL_SECRET}" ]; then
            echo "::error::CRC_PULL_SECRET GitHub Actions secret is required when ocp-portability-smoke is enabled. Obtain a pull secret from console.redhat.com/openshift/create/local and set it with: gh secret set CRC_PULL_SECRET --repo ${{ github.repository }} < pull-secret.txt"
            exit 1
          fi

      # Same disk-pressure rationale as `gke-portability-smoke` -- CRC's
      # openshift preset alone wants ~35 GiB, and this job also stacks the
      # `platform-dev` pixi env plus a second copy of the platform image.
      - name: Free disk space (reclaim unused preinstalled toolchains)
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/az || true
          echo "After:"; df -h /

      - uses: actions/download-artifact@v7
        with:
          name: platform-ci-image

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: platform-dev
          locked: true
          cache: true

      # AD-16 named system exception alongside kind (gke-smoke) and the
      # container engine: CRC bundles its own `oc`, installed by the action
      # below. helm/kubectl remain pixi-provisioned above.
      - name: Start OpenShift Local (CRC 2.63.0 / OpenShift 4.22.7)
        uses: crc-org/crc-github-action@v1
        with:
          pull-secret: ${{ secrets.CRC_PULL_SECRET }}
          preset: openshift
          cpus: '4'
          memory: '10752'
          disk: '35'
          version: '2.63.0'

      # CRC's internal registry route uses a cluster-signed cert that Docker
      # rejects by default -- mirror the operator-locked flow in
      # cluster-bringup-facts.md with Docker's insecure-registry knob.
      - name: Configure Docker for the CRC internal registry
        run: |
          echo '{"insecure-registries":["default-route-openshift-image-registry.apps-crc.testing"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Create deploy namespace
        run: oc create namespace platform-smoke

      # Shared Containerfile artifact from build-platform-image -- retagged
      # away from `latest` for the same ImagePullPolicy reason as gke-smoke.
      - name: Push platform image to the CRC internal registry
        env:
          REGISTRY: default-route-openshift-image-registry.apps-crc.testing
          NS: platform-smoke
          IMAGE_TAG: ocp-smoke
        run: |
          gunzip -c platform-ci-image.tar.gz | docker load
          docker tag "${{ env.PLATFORM_CI_IMAGE_REF }}" "${REGISTRY}/${NS}/platform:${IMAGE_TAG}"
          TOKEN="$(oc whoami -t)"
          echo "${TOKEN}" | docker login -u kubeadmin --password-stdin "${REGISTRY}"
          docker push "${REGISTRY}/${NS}/platform:${IMAGE_TAG}"
          oc get imagestream -n "${NS}" || true

      # AD-12: same Secret shape as gke-smoke / deploy README (NOTES.txt).
      - name: Create platform-secrets Secret
        run: |
          oc create secret generic platform-secrets \
            --namespace platform-smoke \
            --from-literal=DJANGO_SECRET_KEY=ci-ocp-smoke-placeholder-not-a-real-secret \
            --from-literal=DATABASE_URL=postgres://platform:ci-ocp-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=MIGRATION_DATABASE_URL=postgres://platform:ci-ocp-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=POSTGRES_PASSWORD=ci-ocp-smoke-not-a-real-secret \
            --from-literal=REDIS_PASSWORD=ci-ocp-smoke-not-a-real-secret

      # AD-11: OCP deltas ONLY via the checked-in overlay values file --
      # never a second chart or OCP kinds in the core templates. Image
      # seams aim at the ImageStream this job just pushed; django.secureSslRedirect
      # is False for the same TLS-less-probe rationale documented in
      # gke-smoke (the Route still terminates TLS at the edge).
      # Deliberately NO --wait: same migrate-hook deadlock as gke-smoke.
      - name: helm install core chart with OCP overrides
        run: |
          helm install platform src/platform/deploy/charts/platform \
            --namespace platform-smoke \
            -f src/platform/deploy/overlays/ocp/core-overrides.yaml \
            --set image.registry=default-route-openshift-image-registry.apps-crc.testing \
            --set image.repository=platform-smoke/platform \
            --set image.tag=ocp-smoke \
            --set django.secureSslRedirect=False \
            --timeout 5m || {
            echo "::error::helm install platform failed"
            kubectl get pods,jobs,events,routes -n platform-smoke
            exit 1
          }

      - name: helm install Route overlay beside the core release
        run: |
          helm install platform-ocp src/platform/deploy/overlays/ocp/chart \
            --namespace platform-smoke \
            --set route.host=platform-smoke.apps-crc.testing || {
            echo "::error::helm install platform-ocp failed"
            kubectl get pods,jobs,events,routes -n platform-smoke
            oc describe route -n platform-smoke || true
            exit 1
          }

      - name: Verify a Route exists and targets the core web Service
        run: |
          oc get route platform-ocp -n platform-smoke -o jsonpath='{.spec.to.name}{"\n"}' | grep -qx platform
          oc get route platform-ocp -n platform-smoke -o jsonpath='{.status.ingress[0].host}{"\n"}' | grep -q .

      # `/ht/` is connectivity-only (deploy/README.md) -- may 200 before migrate
      # finishes; not gated on the explicit migrate wait below.
      - name: Smoke-test /ht/ through the Route (connectivity-only)
        run: |
          ROUTE_HOST="platform-smoke.apps-crc.testing"
          for i in $(seq 1 30); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' "https://${ROUTE_HOST}/ht/" || true)"
            if [ "$code" = "200" ]; then echo "healthy (200)"; exit 0; fi
            sleep 2
          done
          echo "::error::/ht/ through the Route never returned 200"
          kubectl get pods,routes,events -n platform-smoke
          exit 1

      - name: Wait for the migrate hook Job to complete
        run: |
          kubectl wait --namespace platform-smoke --for=condition=complete job/platform-migrate --timeout=180s || {
            echo "::error::migrate Job did not reach Complete"
            kubectl get pods,jobs,events -n platform-smoke
            kubectl logs -n platform-smoke -l app.kubernetes.io/component=migrate --tail=200 || true
            exit 1
          }

      - name: Smoke-test /admin/login/ through the Route (proves the ORM round-trip)
        run: |
          ROUTE_HOST="platform-smoke.apps-crc.testing"
          code="$(curl -sk -o /dev/null -w '%{http_code}' "https://${ROUTE_HOST}/admin/login/" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::/admin/login/ through the Route returned $code, expected 200"
            kubectl get pods,events,routes -n platform-smoke || true
            kubectl logs -n platform-smoke -l app.kubernetes.io/component=web --tail=200 || true
            exit 1
          fi

      # Spot-check that the OCP overlay nulled the data-service UID pins so
      # restricted-v2 assigns arbitrary UIDs (Story 12.1 contract).
      - name: Verify postgres pod has no fixed runAsUser (SCC-assigned UID path)
        run: |
          RUN_AS_USER="$(kubectl get pod -n platform-smoke -l app.kubernetes.io/component=postgres -o jsonpath='{.items[0].spec.containers[0].securityContext.runAsUser}' 2>/dev/null || true)"
          if [ -n "${RUN_AS_USER}" ]; then
            echo "::error::postgres pod has fixed runAsUser=${RUN_AS_USER}; expected absent/null for OCP overlay"
            kubectl describe pod -n platform-smoke -l app.kubernetes.io/component=postgres || true
            exit 1
          fi
          echo "postgres pod runAsUser absent (SCC-assigned UID path)"

      - name: Teardown
        if: always()
        run: |
          oc delete namespace platform-smoke --ignore-not-found=true || true
          crc stop -f || true
          crc delete -f || true

  # Story 12.3 ("Air-gap parity is a failing check"): proves AD-13/CAP-6 --
  # a build + deploy executed with external egress blocked must succeed
  # end-to-end. Reuses `gke-portability-smoke`'s established patterns
  # verbatim wherever they apply (disk-reclaim, setup-pixi, pinned kind,
  # `docker build` with the unmodified Containerfile at the repo-root
  # context, `kind load` with no registry push, the `platform-secrets` K8s
  # Secret pattern, the no-`--wait` helm-install / migrate-Job-wait split,
  # `if: always()` teardown) -- only the NEW pieces this story adds are
  # commented in depth below.
  #
  # Single engine (Docker) only, same rationale as `gke-portability-smoke`:
  # a second network-egress axis (docker vs. podman) is out of scope here.
  #
  # No `needs:` on test/container-dbgpt. Loads the shared platform image
  # from build-platform-image (P1 fan-in) rather than rebuilding it.
  air-gap-parity:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && inputs.air_gap_parity) ||
        (github.event_name != 'workflow_dispatch' && vars.PLATFORM_CI_AIR_GAP_PARITY == 'true')
      ) &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.jobs == 'all' ||
        inputs.jobs == 'air-gap-parity-only'
      )
    needs: build-platform-image
    runs-on: ubuntu-latest
    # 60: mirror build (428 conda packages, network-limited) plus the same
    # 395-package image `gke-portability-smoke` builds, minus ingress-nginx
    # but plus blocked-egress reinstall + helm/port-forward proof. Prior 40m
    # budget timed out on the mirror step alone on GHA (2026-08-23, PR #622).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Same workflow_dispatch guard as every other job in this workflow
      # (workflow_dispatch has no `paths:` filter) -- see `test`'s own step
      # for the full rationale.
      - name: Verify src/platform exists on this ref
        run: test -d src/platform || { echo "::error::src/platform does not exist on this ref"; exit 1; }

      # Block If (this story's own Boundaries & Constraints): iptables
      # unavailable or sudo refused makes the whole egress-block premise
      # impossible -- HALT, not a silent skip. Checked FIRST, before this
      # job spends 30+ minutes on a build/deploy it can't actually prove
      # anything with.
      - name: Verify iptables + ip6tables + passwordless sudo are available (egress-block precondition)
        run: |
          if ! command -v iptables >/dev/null 2>&1; then
            echo "::error::iptables not found on this runner -- cannot prove the AD-13 egress block (BLOCKED)"
            exit 1
          fi
          # IPv4-only blocking is not actually air-gap parity: a runner
          # with IPv6 connectivity could resolve conda.anaconda.org over an
          # AAAA record and bypass an iptables-only block entirely, a
          # false green on this story's own core Acceptance Criterion.
          # ip6tables ships alongside iptables on every GitHub-hosted
          # ubuntu-latest runner; treated as an equally hard precondition.
          if ! command -v ip6tables >/dev/null 2>&1; then
            echo "::error::ip6tables not found on this runner -- cannot prove the AD-13 egress block is IPv6-safe (BLOCKED)"
            exit 1
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "::error::sudo is not available non-interactively on this runner -- cannot install the egress-block iptables/ip6tables rules (BLOCKED)"
            exit 1
          fi

      # Same disk-pressure rationale as `gke-portability-smoke`'s own step
      # (this job stacks the identical three real disk consumers: the
      # `platform-dev` pixi env, `docker build`'s own cache, and a second
      # copy of the image inside the kind node) -- not re-derived here.
      - name: Free disk space (reclaim unused preinstalled toolchains)
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/az || true
          echo "After:"; df -h /

      - uses: actions/download-artifact@v7
        with:
          name: platform-ci-image

      # AD-16: helm and kubectl come from the `platform-dev` pixi
      # environment, never a system install -- identical usage to
      # `gke-portability-smoke`'s own step. This FIRST install runs with
      # egress still open (it is also how `python`/`requests`/`pyyaml` --
      # all already in this env's real solve, see pixi.toml's own
      # `python-agent-platform` feature comment -- reach the mirror-builder
      # script below) and is DELIBERATELY evicted and reinstalled later,
      # under the egress block, as the actual AD-13 proof -- see "Evict the
      # pixi cache" below for why a second install is needed at all.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: platform-dev
          locked: true
          cache: true

      # Same AD-16 named system exception as `gke-portability-smoke`'s own
      # step -- not re-derived here.
      - name: Install kind v0.32.0 (pinned; AD-16's named system exception)
        run: |
          curl -fLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # No ingress-ready node label / extraPortMappings here -- this job
      # curls the app through `kubectl port-forward`, not an Ingress (12.2
      # already proves the Ingress path); a plain cluster is enough.
      - name: Create kind cluster
        run: kind create cluster --name air-gap-smoke --wait 90s

      # Shared Containerfile artifact from build-platform-image -- retagged
      # away from `latest` for the same reason as gke-portability-smoke.
      # Runs BEFORE the mirror is built below (deliberately reordered from a
      # naive top-to-bottom reading of this story's own Boundaries): the
      # mirror can total hundreds of MB across 428 packages, and prefetching
      # it before kind load would waste disk on this runner for no gain.
      - name: Load shared platform + sidecar images (retag for kind)
        run: |
          gunzip -c platform-ci-image.tar.gz | docker load
          docker tag "${{ env.PLATFORM_CI_IMAGE_REF }}" platform:air-gap-smoke
          docker tag "${{ env.PLATFORM_CI_SIDECAR_REF }}" platform-dbgpt-sidecar:air-gap-smoke

      # No registry push -- same as `gke-portability-smoke`'s own step.
      # The sidecar goes in for the same reason postgres/redis do below: the
      # chart renders its Deployment unconditionally, so leaving it out means a
      # pod in this release reaches for a registry, and this job's whole
      # premise is that nothing does.
      - name: kind load the built images (no registry push)
        run: kind load docker-image platform:air-gap-smoke platform-dbgpt-sidecar:air-gap-smoke --name air-gap-smoke

      # The chart's own postgres/redis StatefulSet/Deployment default to
      # plain upstream images (values.yaml: postgres.image
      # registry=""/repository=postgres/tag="17", redis.image
      # registry=""/repository=redis/tag="7" -- i.e. `postgres:17` and
      # `redis:7`) that this job never builds itself, unlike the platform
      # image above. The egress block below only touches the `OUTPUT` chain
      # (this RUNNER's own host-originated traffic) -- it does not touch
      # `FORWARD` (container-routed traffic), so a pod would otherwise
      # retain real internet access and could silently pull these two from
      # Docker Hub instead of proving anything about the mirror-only
      # premise. `docker pull` (network still on) + `kind load` (no push,
      # same pattern as the platform image) puts both node-local BEFORE the
      # block goes up, so the postgres/redis pods pull nothing over the
      # network either.
      - name: Pull + kind load postgres:17 and redis:7 (the chart's default infra images)
        run: |
          docker pull postgres:17
          docker pull redis:7
          kind load docker-image postgres:17 redis:7 --name air-gap-smoke

      # AD-12 pattern, identical to `gke-portability-smoke`'s own step
      # (chart never renders a Secret) -- separate namespace name so the
      # two jobs' logs are never confusable when read side by side.
      - name: Create namespace + platform-secrets Secret
        run: |
          kubectl create namespace platform-airgap
          kubectl create secret generic platform-secrets \
            --namespace platform-airgap \
            --from-literal=DJANGO_SECRET_KEY=ci-airgap-smoke-placeholder-not-a-real-secret \
            --from-literal=DATABASE_URL=postgres://platform:ci-airgap-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=MIGRATION_DATABASE_URL=postgres://platform:ci-airgap-smoke-not-a-real-secret@platform-postgres:5432/platform \
            --from-literal=POSTGRES_PASSWORD=ci-airgap-smoke-not-a-real-secret

      # Builds the mirror BEFORE the egress block goes up -- network is
      # still on here, exactly like the `docker build` step above. Reads
      # `pixi.lock` directly (never a live repodata fetch) for the
      # `platform-dev` environment's `linux-64` package set, downloading
      # each artifact into `<dest>/<channel>/<subdir>/<filename>` with
      # sha256 verification (script's own module docstring has the full
      # design). `ci-airgap-mirror/` is not `.dockerignore`d (checked --
      # only named entries are excluded, no catch-all) and is created only
      # at CI-runtime, never committed. Deliberately AFTER the image is
      # already built and kind-loaded -- see that step's own comment.
      #
      # GHA cache (P0): restore the mirror prefetch keyed on pixi.lock so
      # unchanged locks skip hundreds of HTTP GETs. The AD-13 proof still
      # runs live -- egress block, evicted env, mirror-only pixi install.
      # build-pixi-mirror.py remains idempotent (md5-valid cache hits skip;
      # fresh downloads still verify sha256). PRs and main both save so
      # steward iteration and post-merge runs warm the same pixi.lock key.
      - name: Restore ci-airgap-mirror cache
        id: airgap-mirror-cache
        uses: actions/cache/restore@v5
        with:
          path: ci-airgap-mirror
          key: platform-ci-airgap-mirror-${{ hashFiles('pixi.lock') }}
          restore-keys: |
            platform-ci-airgap-mirror-

      - name: Build the local pixi mirror from pixi.lock (network still on)
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/build-pixi-mirror.py \
            --lockfile pixi.lock \
            --environment platform-dev \
            --platform linux-64 \
            --dest "${{ github.workspace }}/ci-airgap-mirror" \
            --workers 32

      - name: Save ci-airgap-mirror cache
        uses: actions/cache/save@v5
        with:
          path: ci-airgap-mirror
          key: platform-ci-airgap-mirror-${{ hashFiles('pixi.lock') }}

      # Appends to THIS CHECKOUT'S OWN `.pixi/config.toml` only -- never
      # committed (no `git add`/`git commit` anywhere in this job). The
      # file already carries `run-post-link-scripts = "insecure"` as a
      # top-level key, which TOML requires to precede any `[table]` header,
      # so appending `[mirrors]` after it is valid. Schema per
      # `docs/reference/pixi-config-jfrog.example.toml`:
      # `{"<original-channel-url>" = ["<mirror-url>", ...]}`. Both channels
      # this workspace's `python-agent-platform`/`platform-dev` solve
      # actually uses (pixi.toml's own comment: SelfExplainML's `slowapi`
      # alongside conda-forge) are mapped -- the mirror-builder step above
      # downloaded both into `${{ github.workspace }}/ci-airgap-mirror/
      # <channel>/`, so each mapped `file://` base matches on disk exactly.
      - name: Append the local mirror to .pixi/config.toml (this checkout only)
        run: |
          cat >> .pixi/config.toml <<EOF

          [mirrors]
          "https://conda.anaconda.org/conda-forge" = ["file://${{ github.workspace }}/ci-airgap-mirror/conda-forge"]
          "https://conda.anaconda.org/SelfExplainML" = ["file://${{ github.workspace }}/ci-airgap-mirror/SelfExplainML"]
          EOF
          cat .pixi/config.toml

      # THE false-green guard this story's own I/O & Edge-Case Matrix names
      # explicitly: the `platform-dev` env this job's own setup-pixi step
      # already installed above (network on) would otherwise let a second
      # `pixi install --frozen -e platform-dev` no-op straight off the
      # existing, already-valid `.pixi/envs/platform-dev` prefix -- proving
      # nothing about the mirror or the egress block, regardless of whether
      # either actually works. Moving the installed env prefix aside (not
      # deleting it -- `rm -rf` of a full prefix hangs on GHA the same way
      # `~/.cache/rattler` does) forces the next install to genuinely
      # re-materialize the environment from scratch. For the package cache,
      # use a fresh empty `PIXI_CACHE_DIR` on the proof step (the spec's
      # named alternative to `rm -rf ~/.cache/rattler`).
      - name: Evict the pixi cache + installed env before the mirror-only install
        run: |
          # mv is O(1) on the directory inode; rm -rf of a full conda env
          # prefix (same scale as ~/.cache/rattler) also hangs 20+ min on GHA.
          if [ -d .pixi/envs/platform-dev ]; then
            mv .pixi/envs/platform-dev ".pixi/envs/platform-dev-bootstrap-${GITHUB_RUN_ID}"
          fi
          rm -rf "${{ runner.temp }}/pixi-cache-proof-empty"
          mkdir -p "${{ runner.temp }}/pixi-cache-proof-empty"

      # iptables ordering is load-bearing (this story's own Design Notes):
      # `-I` (insert at head) for every ACCEPT so they are evaluated BEFORE
      # the final `-A` (append) DROP regardless of the order these lines
      # run in. Loopback + the three private ranges cover kubectl/helm
      # talking to the kind API server (127.0.0.1:<port>) and the
      # Docker/kind bridge networks kind-internal traffic uses -- nothing
      # else is reachable after this step.
      #
      # IPv4 alone is not a real egress block: `ip6tables` gets the
      # identical ACCEPT-then-DROP treatment (loopback `::1/128` + the
      # `fc00::/7` unique-local-address range, IPv6's private-range
      # equivalent), or a runner with IPv6 connectivity could resolve
      # conda.anaconda.org over AAAA and sail straight past the IPv4-only
      # rules below -- a silent bypass of this story's own core AC.
      # `-w 30` on iptables-restore: Docker + kind both hold xtables.lock on
      # GHA runners. Apply IPv4/IPv6 OUTPUT rules in one atomic restore each
      # (not nine separate iptables calls — each one races the lock). Do NOT
      # use `fuser /run/xtables.lock` — it can hang silently on GHA. Do NOT
      # run `iptables -L -v` — listing Docker's OUTPUT graph hangs for minutes.
      - name: Block all non-private-network egress
        timeout-minutes: 3
        run: |
          set -euo pipefail

          _apply_restore() {
            local restore=$1
            local label=$2
            shift 2
            local attempt=1
            while [ "$attempt" -le 5 ]; do
              echo "Applying ${label} egress block (attempt ${attempt}/5)..."
              if printf '%s\n' "$@" | timeout 60 sudo "${restore}" -w 30 -n; then
                echo "${label} egress block installed"
                return 0
              fi
              echo "::warning::${restore} failed (attempt ${attempt}), retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::${restore} failed after 5 attempts"
            return 1
          }

          _apply_restore iptables-restore IPv4 \
            '*filter' \
            '-I OUTPUT -o lo -j ACCEPT' \
            '-I OUTPUT -d 127.0.0.0/8 -j ACCEPT' \
            '-I OUTPUT -d 10.0.0.0/8 -j ACCEPT' \
            '-I OUTPUT -d 172.16.0.0/12 -j ACCEPT' \
            '-I OUTPUT -d 192.168.0.0/16 -j ACCEPT' \
            '-A OUTPUT -j DROP' \
            'COMMIT'

          _apply_restore ip6tables-restore IPv6 \
            '*filter' \
            '-I OUTPUT -o lo -j ACCEPT' \
            '-I OUTPUT -d ::1/128 -j ACCEPT' \
            '-I OUTPUT -d fc00::/7 -j ACCEPT' \
            '-A OUTPUT -j DROP' \
            'COMMIT'

      # THE core AD-13 proof (this story's first Acceptance Criterion):
      # cache evicted to empty, env prefix gone, egress blocked -- if this
      # exits 0, `pixi install --frozen -e platform-dev` resolved the
      # ENTIRE `platform-dev` environment (the mirror-builder step above
      # downloaded its full `linux-64` package set) from the local
      # `file://` mirror alone, through the `.pixi/config.toml` `[mirrors]`
      # rewrite appended above. `-j DROP` silently discards a blocked
      # packet rather than rejecting it, so a genuine network attempt would
      # hang for the full TCP retry/timeout window instead of failing fast
      # -- `timeout 300` bounds that: a real mirror-only resolve completes
      # in well under 5 minutes (428 packages, all local `file://` reads),
      # so hitting the bound at all is itself a failure signal, not a
      # false negative on a slow-but-honest run.
      - name: Prove pixi install --frozen resolves from the mirror alone (egress blocked)
        timeout-minutes: 6
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache-proof-empty
        run: |
          echo "Starting mirror-only pixi install (egress blocked) at $(date -u +%H:%M:%S)"
          (
            while true; do
              sleep 30
              echo "  ... pixi install still running ($(date -u +%H:%M:%S))"
            done
          ) &
          hb=$!
          trap 'kill "$hb" 2>/dev/null || true' EXIT
          timeout 300 pixi install --frozen -e platform-dev || {
            echo "::error::pixi install --frozen -e platform-dev failed to resolve from the mirror-only config under blocked egress (or hit the 300s bound -- a hang here means a real network attempt, not a mirror-only resolve)"
            exit 1
          }
          kill "$hb" 2>/dev/null || true
          echo "Mirror-only pixi install finished at $(date -u +%H:%M:%S)"

      # Only scalar --set overrides, never a second chart/overlay/values
      # file -- same AD-11 discipline as `gke-portability-smoke`'s own
      # step, and the identical two gotchas (image.tag away from "latest";
      # secureSslRedirect off for this bare-HTTP install). Deliberately NO
      # `--wait`, for the identical documented migrate-Job deadlock reason
      # `gke-portability-smoke`'s own helm-install step's comment explains
      # in full -- not re-derived here.
      - name: helm install the unmodified core chart (scalar --set overrides only)
        run: |
          helm install platform src/platform/deploy/charts/platform \
            --namespace platform-airgap \
            --set image.tag=air-gap-smoke \
            --set sidecar.image.tag=air-gap-smoke \
            --set django.secureSslRedirect=False \
            --timeout 5m || {
            echo "::error::helm install failed"
            kubectl get pods,jobs,events -n platform-airgap
            exit 1
          }

      # Load-bearing now that helm install runs without --wait -- same
      # reasoning as `gke-portability-smoke`'s own identical step.
      - name: Wait for the migrate hook Job to complete
        run: |
          kubectl wait --namespace platform-airgap --for=condition=complete job/platform-migrate --timeout=180s || {
            echo "::error::migrate Job did not reach Complete"
            kubectl get pods,jobs,events -n platform-airgap
            kubectl logs -n platform-airgap -l app.kubernetes.io/component=migrate --tail=200 || true
            exit 1
          }

      # The general form of the defect this job was blind to until
      # 2026-08-24: it waited on the migrate Job and curled the web Service,
      # so ANY other pod in the release could sit in ImagePullBackOff --
      # reaching for a registry that, in a real air gap, is not there -- and
      # this job still reported green. That is a false negative against its
      # own core criterion ("any external reference is a FAILING check, not a
      # warning"). The DB-GPT sidecar was the live instance; this step is
      # written against the CLASS so the next unloaded image cannot repeat it.
      #
      # Retries for 60s rather than asserting once: images are node-local
      # here, but kubelet still reports transient `ErrImagePull` before the
      # first successful lookup on a cold node.
      - name: Assert no pod is pulling from a registry (the AD-13 premise)
        run: |
          deadline=$((SECONDS + 60))
          while :; do
            bad="$(kubectl get pods -n platform-airgap \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.containerStatuses[*]}{.state.waiting.reason}{" "}{end}{"\n"}{end}' \
              | grep -E 'ImagePullBackOff|ErrImagePull' || true)"
            if [ -z "$bad" ]; then
              echo "No pod is waiting on an image pull."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::A pod is reaching for a registry inside the air-gap proof -- its image was never loaded node-locally:"
              echo "$bad"
              kubectl get pods -n platform-airgap
              kubectl get events -n platform-airgap --sort-by=.lastTimestamp | tail -30
              exit 1
            fi
            sleep 5
          done

      # `kubectl port-forward` (not Ingress -- 12.2 already proves that
      # path) backgrounded for the two steps below; its PID is captured so
      # Teardown can kill it explicitly rather than relying on the runner
      # tearing the whole VM down anyway. `Host: platform.internal` is
      # still required even through a port-forward: `django.allowedHosts`
      # is not overridden by this job's `--set` list, so production.py's
      # `ALLOWED_HOSTS` would 400 a request whose Host header doesn't match
      # -- the forwarded ADDRESS is still 127.0.0.1, which is what the next
      # step's external-URL scan treats as "local", not this header.
      - name: Start kubectl port-forward to the web Service
        run: |
          kubectl port-forward --namespace platform-airgap svc/platform 8000:8000 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          sleep 3

      - name: Poll / for 200 through the port-forward
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/airgap-home.html -w '%{http_code}' -H 'Host: platform.internal' http://127.0.0.1:8000/ || true)"
            if [ "$code" = "200" ]; then echo "healthy (200)"; exit 0; fi
            sleep 2
          done
          echo "::error::/ through the port-forward never returned 200"
          cat /tmp/port-forward.log || true
          kubectl get pods -n platform-airgap
          exit 1

      # This story's second Acceptance Criterion, extending the `container`
      # job's own `/static/` asset-fetch pattern (derive URLs from the
      # rendered body, never hardcode): any absolute `http(s)://` OR
      # protocol-relative (`//host/...`) reference whose host is not the
      # port-forwarded `127.0.0.1` address fails the job. Case-insensitive
      # (`-i`) and `(https?:)?//` (not bare `https?://`) so an
      # `HTTPS://...` or a scheme-less `//cdn.example/x.js` reference can't
      # silently slip past what would otherwise be a scheme-only match --
      # both are valid, load-bearing CDN reference shapes browsers resolve
      # identically to a fully-qualified URL. Zero-CDN-by-construction
      # (Story 10.1's vendored static assets; the Containerfile's own
      # comment documents stripping CDN `sourceMappingURL` references)
      # means a healthy page has NO matches at all -- WhiteNoise's
      # `{% static %}` rewrite and django-compressor's `/static/CACHE/...`
      # bundles are both host-relative, and `base.html` carries no inline
      # `<script>` content in its actual rendered output (its only
      # `<script>` block sits inside a Django `{% comment %}`, which never
      # renders) -- so this is a real zero-false-positive check for this
      # app's own templates, not merely a theoretical one.
      - name: Scan the served home page for absolute external URL references
        run: |
          external="$(grep -ioE '(https?:)?//[^"'"'"'<> ]+' /tmp/airgap-home.html | grep -viE '^(https?:)?//127\.0\.0\.1(:[0-9]+)?(/|$|[?#])' || true)"
          if [ -n "$external" ]; then
            echo "::error::absolute external URL reference(s) found in / -- AD-13 CDN-reference check failed:"
            printf '%s\n' "$external"
            exit 1
          fi
          echo "no external URL references found"

      - name: Teardown
        if: always()
        run: |
          if [ -f /tmp/port-forward.pid ]; then
            kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          fi
          kind delete cluster --name air-gap-smoke || true
