# Global GitHub Actions master switch for this private repo.
#
# GitHub does not read this file. Apply it with:
#   python scripts/apply_actions_policy.py --fix
# Default (no --fix) is a read-only check that the live repo matches this file.
#
# enabled = false  → PUT actions/permissions enabled=false. No billed minutes.
# enabled = true   → turn Actions back on, then enable ONLY allow_when_enabled
#                    (every other workflow stays disabled_manually).
#
# Already applied live 2026-08-24 (spending limit / failed payment). Flip this
# file and re-run --fix when billing is restored — do not toggle the GitHub
# UI by hand or the file and the live switch will drift.
#
# GitHub-owned "Dependabot Updates" / "Dependency Graph" cannot be disabled
# (API 422). They do not start billed jobs while the master switch is false.

enabled = false

