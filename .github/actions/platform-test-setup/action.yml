name: Platform test job dependencies
description: >
  Install Platform CI test-job dependencies via the slim pixi environment
  `platform-ci-test` (steward Story 16.1 / CAP-5 — pixi is the sole authority;
  the former `pip install -r requirements/local.txt` backend is retired).

# Steward Story 117.43 (spec-pyforge-steward CAP-175): the `test` job also installs `pyforge-warden`, which the
# golden-path tests run, so no worker waits on the `pyforge_warden_env` fixture's install mid-suite. It passes both
# environments and a cache key of its own; the defaults are what every caller installed before, so `checks` keeps
# its own setup and its own cache entry. `platform-ci-test` stays the activated environment either way.
inputs:
  environments:
    description: Space-separated pixi environments to install; platform-ci-test is activated.
    required: false
    default: platform-ci-test
  cache-key:
    description: Prefix of the pixi cache key; one per set of environments.
    required: false
    default: platform-ci-test-

runs:
  using: composite
  steps:
    - name: setup-pixi (platform-ci-test)
      uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.85.0
        environments: ${{ inputs.environments }}
        frozen: true
        cache: true
        cache-key: ${{ inputs.cache-key }}
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        activate-environment: platform-ci-test

