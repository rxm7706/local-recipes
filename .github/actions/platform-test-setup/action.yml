name: Platform test job dependencies
description: >
  Install Platform CI test-job dependencies via the slim pixi environment
  `platform-ci-test` (steward Story 16.1 / CAP-5 — pixi is the sole authority;
  the former `pip install -r requirements/local.txt` backend is retired).

runs:
  using: composite
  steps:
    - name: setup-pixi (platform-ci-test)
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.78.0
        environments: platform-ci-test
        frozen: true
        cache: true
        cache-key: platform-ci-test-
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        activate-environment: platform-ci-test

