# The repo's policy hooks (steward Story 66.2, spec-pyforge-steward CAP-154).
# `steward setup` / `initrepo` install them through `pre-commit install`;
# `default_install_hook_types` makes that bare call install the stages
# below. `pixi run -e pyforge-guild precommit-config-check` (detectors-ci)
# reds this file going missing or losing any policy hook. Every hook is `language: script` on
# purpose: pre-commit stashes unstaged changes while a hook runs, so a hook that invoked pixi
# could re-sync an env against a momentarily reverted pixi.lock (seen 2026-09-20).
# The pre-commit stage carries one hook (steward Story 118.9, spec-pyforge-steward CAP-178): no
# secret-shaped value enters a tracked NIC config under src/platform/deploy/nic/.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: commit-msg-no-attribution
        name: "commit message carries no Co-Authored-By or AI-attribution line (AGENTS.md § Policy)"
        entry: scripts/commit_msg_hook.py
        language: script
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
      - id: nic-config-secret-scan
        name: "no secret-shaped value in a tracked NIC config (the steward keys audit --secrets pattern table)"
        entry: scripts/nic_config_secret_scan.py
        language: script
        stages: [pre-commit]
        files: ^src/platform/deploy/nic/
        pass_filenames: true
      - id: pre-push-preflight
        name: "pr-preflight is green before a push leaves the machine (PYFORGE_PREFLIGHT_SKIP=1 to opt out, journaled)"
        entry: scripts/pre_push_preflight.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
