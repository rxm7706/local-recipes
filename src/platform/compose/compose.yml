# Story 10.3 ("One image, both engines"): local dev/test stack for
# src/platform/ -- originally platform + postgres:17 + redis:7 ONLY
# (spec-python-agent-platform's own Boundaries & Constraints:
# "infrastructure is exactly PostgreSQL + Redis + Kubernetes"). Langflow
# still matches that: Epic 11 mounts it inside the `platform` image as a
# pluggable Django app (Pattern A), never a sidecar. DB-GPT does NOT --
# Story 10.5 (AD-14 Pattern B deviation, dream doc
# docs/dreams/db-gpt-django-plugin.md, 2026-08-21 entry) moved it to its own
# `dbgpt` service below, because `dbgpt-app` transitively pins
# `fastapi <0.113.0` while `langflow-base` (already resident in the shared
# `python-agent-platform` env) needs `fastapi >=0.135.0` -- disjoint ranges,
# no single pixi env can hold both. See `pixi.toml`'s own
# `[feature.dbgpt-sidecar]` comment and
# `src/platform/compose/dbgpt/Containerfile`'s top-of-file comment for the
# full citation; not re-derived here.
#
# Compose Specification syntax (no top-level `version:` key -- dropped by
# the Compose Specification itself and ignored-with-a-warning by `docker
# compose` v2), so this file is portable to both `docker compose` and
# `podman-compose` by construction, not by testing against both (this
# sandbox has no `podman-compose` binary -- see this story's spec Design
# Notes for the honest statement of what was and wasn't locally verified).
#
# Every `environment:` value below is a LOCAL DEV/TEST PLACEHOLDER, never a
# real credential -- CAP-6's "env/secret-mount credentials" clause is about
# real deployments (K8s secrets at run time, `--mount=type=secret` at build
# time); a throwaway compose-local Django `SECRET_KEY` for a database that
# only ever exists inside this compose network is not the credential that
# constraint protects. The `dbgpt` service's own placeholder LLM credentials
# are baked into its own Containerfile, not repeated here -- see that file.
#
# `build.context: ../../..` + `build.dockerfile: src/platform/Containerfile`
# -- deliberately the REPO ROOT as build context, matching the Containerfile
# itself (see that file's own top-of-file comment for why: the builder
# stage's `pixi install --frozen -e python-agent-platform` needs the
# workspace-root `pixi.toml`/`pixi.lock`, which do not exist inside
# `src/platform/`). The `dbgpt` service below uses the identical
# `context: ../../..` for the identical reason (its own Containerfile's
# `pixi install --frozen -e dbgpt-sidecar`).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # config/object_storage.py (Story 50.3, pap:AD-1's 2026-09-10 dated
  # exception): S3-compatible object storage, consumed only -- production
  # target is NetApp StorageGRID, ops-provided. Locally that seam is
  # satisfied by Silo (Story 50.1/50.2's own local-dev backend,
  # `scripts/platform_object_storage.py`'s pixi-process path; this is the
  # container-compose equivalent, same credentials so either path is a
  # drop-in swap for the other). Upstream's official multi-arch image
  # (linux/amd64 + linux/arm64) -- no custom Containerfile needed. `mc`/
  # `mcli ready local` is the documented MinIO-family healthcheck and the
  # only readiness probe this minimal image ships (no curl, no bash);
  # verified live against this exact image.
  objectstorage:
    image: docker.io/pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pyforgeplatformdev
      MINIO_ROOT_PASSWORD: pyforgeplatformdevsecretkey12345
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform:
    build:
      context: ../../..
      dockerfile: src/platform/Containerfile
    # The image's own ENTRYPOINT/CMD never runs `manage.py migrate` -- on
    # Kubernetes/OCP that step belongs to a separate Job/initContainer, not
    # every pod's own startup (concurrent replicas would race the same
    # migration). This LOCAL compose stack has no such job, so without an
    # explicit migrate step here a fresh `docker compose up` boots against a
    # completely unmigrated database (confirmed live in review: `\dt` shows
    # zero relations, and any page touching the ORM -- e.g. `/admin/login/`
    # -- 500s with `relation "django_site" does not exist`; `/ht/`'s
    # Database check still reports OK because it is a bare connectivity
    # probe, not a query against an app table). `exec`'d so gunicorn still
    # replaces this shell as PID 1 for signal handling.
    command: >
      bash -c "python manage.py migrate --noinput &&
               exec gunicorn config.asgi:application --bind 0.0.0.0:8000 --worker-class uvicorn_worker.UvicornWorker"
    # `migrate` runs against a postgres that `depends_on` only guarantees is
    # ANSWERING pg_isready -- which the official image also does during its
    # initdb bootstrap, from a temporary server that then restarts. That
    # narrow race makes migrate exit nonzero and, with no restart policy,
    # leaves the service permanently dead after a `docker compose up` that
    # reported success. `on-failure` retries it.
    #
    # Read the retry bound correctly: the short form below is UNBOUNDED (the
    # bounded form is `on-failure:N`), so a genuinely broken image restarts
    # forever rather than "failing after a few attempts". What still makes
    # `docker compose up --wait` TERMINATE with a nonzero status is the
    # `healthcheck:` right below, not the restart policy -- verified live
    # during exactly such a boot loop in this story, where `--wait` reported
    # `container compose-platform-1 is unhealthy` and exited nonzero. The
    # bound is left off deliberately: the race this absorbs is postgres
    # finishing its initdb restart, whose duration is not something a fixed
    # retry count can be chosen against, and the healthcheck already supplies
    # the terminal verdict a count would otherwise be needed for.
    restart: on-failure
    ports:
      - "8000:8000"
    # postgres and redis both declare a healthcheck; without one here the
    # platform service can only ever report "running", never "healthy" --
    # so `docker compose up --wait` returns as soon as the process exists
    # (before migrate finishes, before gunicorn binds), and this story's own
    # acceptance wording ("brings up platform+postgres+redis all healthy")
    # has nothing to read. Uses the env's own python rather than curl: the
    # UBI9-minimal runtime stage ships no curl, and `/app/entrypoint.sh` is
    # what puts the conda env on PATH.
    healthcheck:
      test:
        - "CMD"
        - "/app/entrypoint.sh"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ht/', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      # Covers the migrate step + gunicorn/uvicorn boot before the first
      # failure is counted against `retries`.
      start_period: 60s
    environment:
      # DJANGO_SETTINGS_MODULE is already baked into the image (Containerfile
      # `ENV`) -- not repeated here.
      DJANGO_SECRET_KEY: local-compose-placeholder-not-a-real-secret
      DJANGO_ADMIN_URL: admin/
      # CAP-3: compose is local development even when the image defaults to
      # production settings — keep stage-1/2 refusals disarmed here.
      COMPONENT_RUNTIME: local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,platform
      # No TLS terminator in this local stack -- SecurityMiddleware would
      # otherwise 301-redirect every request (including the /ht/ health
      # probe) to https, which this stack never serves.
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      # config/object_storage.py's consumption seam (Story 50.3) -- same
      # three settings a real StorageGRID deployment would carry, pointed
      # at the local objectstorage service instead.
      OBJECT_STORAGE_ENDPOINT_URL: http://objectstorage:9000
      OBJECT_STORAGE_ACCESS_KEY: pyforgeplatformdev
      OBJECT_STORAGE_SECRET_KEY: pyforgeplatformdevsecretkey12345
      # CAP-1 / steward 16.5: OIDC-delegated identity (Keycloak local substrate).
      COMPONENT_IDENTITY_CLAIM: sub
      COMPONENT_GROUP_CLAIM: groups
      COMPONENT_STAFF_GROUP: platform-staff
      COMPONENT_SUPERUSER_GROUP: platform-superuser
      COMPONENT_OIDC_ISSUER: http://keycloak:8080/realms/platform
      COMPONENT_OIDC_CLIENT_ID: platform-web
      COMPONENT_OIDC_CLIENT_SECRET: local-compose-keycloak-secret-not-real
      COMPONENT_OIDC_AUDIENCE: platform-web
      COMPONENT_OIDC_PROVIDER_NAME: Platform Keycloak
      MCP_HOST_SIDECAR_BASE_URL: http://mcp-host:8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp-host:
        condition: service_healthy

  # CAP-1 / steward 16.5: Keycloak realm-as-code local substrate (devinfra pattern).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/8080"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Story 11.3 (CAP-4): the Celery worker process itself -- `config/
  # celery_app.py` and `CELERY_BROKER_URL`/`CELERY_RESULT_BACKEND` (derived
  # from `REDIS_URL` above) already existed, and Story 11.2 wrote the first
  # real task (`dbgpt_integration/tasks.py::text_to_sql`), but until this
  # service nothing ever consumed the broker -- every `.delay()` call sat in
  # Redis forever. Mirrors `platform`'s own `build:`/`environment:`/
  # `depends_on:` verbatim (same image, same DB/Redis connectivity a task
  # may need -- e.g. `text_to_sql`'s own Django ORM/settings access), only
  # `command:` differs. No Celery Beat/scheduler service here -- no periodic
  # work is specced (this story's own Boundaries & Constraints).
  worker:
    build:
      context: ../../..
      dockerfile: src/platform/Containerfile
    command: celery -A config worker -l info
    environment:
      DJANGO_SECRET_KEY: local-compose-placeholder-not-a-real-secret
      DJANGO_ADMIN_URL: admin/
      COMPONENT_RUNTIME: local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,platform
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT_URL: http://objectstorage:9000
      OBJECT_STORAGE_ACCESS_KEY: pyforgeplatformdev
      OBJECT_STORAGE_SECRET_KEY: pyforgeplatformdevsecretkey12345
      COMPONENT_IDENTITY_CLAIM: sub
      COMPONENT_GROUP_CLAIM: groups
      COMPONENT_STAFF_GROUP: platform-staff
      COMPONENT_SUPERUSER_GROUP: platform-superuser
      COMPONENT_OIDC_ISSUER: http://keycloak:8080/realms/platform
      COMPONENT_OIDC_CLIENT_ID: platform-web
      COMPONENT_OIDC_CLIENT_SECRET: local-compose-keycloak-secret-not-real
      COMPONENT_OIDC_AUDIENCE: platform-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  # webserver, run as its own container -- see this file's own top-of-file
  # comment for why (disjoint `fastapi` ranges vs. the shared
  # `python-agent-platform` env `platform` builds from). Deliberately no
  # `depends_on: [postgres, redis]`: Story 11.2 investigated wiring this
  # sidecar's OWN metadata store to real PostgreSQL and found a genuine,
  # dual-confirmed upstream limitation (see the `volumes:` comment below) --
  # so this service still boots and migrates its OWN metadata store
  # (SQLite, baked into its Containerfile's own config) independent of this
  # file's `postgres` service, same as Story 10.5 left it. It still joins
  # the same default compose network as every other service here, so
  # `platform`/Celery workers can reach it by service name for the REST
  # calls `dbgpt_integration/tasks.py` drives (a different connection than
  # the metadata store -- see that module's own docstring) -- `depends_on`
  # isn't what puts services on a shared network, only what shared network
  # membership is worth for verification (`docker compose up`, one command).
  dbgpt:
    build:
      context: ../../..
      dockerfile: src/platform/compose/dbgpt/Containerfile
    ports:
      - "5670:5670"
    environment:
      # Story 11.2 (CAP-3 verification): passthrough for the Containerfile's
      # own `${env:DBGPT_LLM_*:-...}` TOML placeholders (baked-in defaults:
      # `proxy/openai` + `gpt-4o` + api.openai.com + a non-functional
      # placeholder key). Bare-name (no `=value`) Compose Specification
      # syntax: the host's value passes through, or the key is left UNSET in
      # the container entirely if the host doesn't export it (NOT set to an
      # empty string -- that distinction matters here, since DB-GPT's own
      # `${env:VAR:-default}` TOML interpolation only falls through to
      # `default` when `VAR` is actually absent from its process
      # environment) -- so no behavior change for anyone not setting these.
      # An operator with a real provider key exports these four before
      # `docker compose up` to drive a genuine LLM-backed round trip through
      # `dbgpt_integration/tasks.py`'s `text_to_sql` task -- verified live
      # this way (Story 11.2) against Google's Gemini OpenAI-compatible
      # endpoint: `DBGPT_LLM_MODEL_PROVIDER=proxy/openai`,
      # `DBGPT_LLM_MODEL_NAME=gemini-3.6-flash`,
      # `DBGPT_LLM_API_BASE=https://generativelanguage.googleapis.com/v1beta/openai/`,
      # `DBGPT_LLM_API_KEY=<a real key>`.
      - DBGPT_LLM_MODEL_NAME
      - DBGPT_LLM_MODEL_PROVIDER
      - DBGPT_LLM_API_BASE
      - DBGPT_LLM_API_KEY
      # Libro is not installed; default NOTE_BOOK_ENABLE=true would log
      # `start libro exception！` on every boot. Same as the image ENV.
      - NOTE_BOOK_ENABLE=false
    # No `command:` override -- the image's own ENTRYPOINT/CMD (`dbgpt start
    # webserver -y -c /app/dbgpt-sidecar-config.toml`) is already the full
    # non-interactive boot sequence; unlike `platform` above, there's no
    # separate migrate step to sequence first (DB-GPT's own alembic
    # migration runs as part of that one CMD) and no postgres readiness race
    # to retry against.
    #
    # `restart:` IS still needed, for the same absorb-a-transient-first-boot-
    # failure reason as `platform`'s own `restart: on-failure` above (see
    # that comment for the full race description) -- this container's CMD
    # runs its own alembic autogenerate/upgrade pass on every boot, and
    # without a restart policy any transient early crash leaves it
    # permanently stopped instead of retried.
    restart: on-failure
    volumes:
      # Durability for DB-GPT's sqlite metadata store. The configured `path`
      # ("pilot/meta_data/dbgpt.db") LOOKS like it resolves under /app/.home,
      # but DB-GPT actually resolves it against $HOME/.dbgpt/workspace
      # (traced into dbgpt/configs/model_config.py -- see the Containerfile's
      # own comment at the point that path is configured for the full
      # citation); confirmed live at
      # /app/.home/.dbgpt/workspace/pilot/meta_data/dbgpt.db. Mounting the
      # parent dir (not just the .db file) also captures the
      # alembic/versions/*.py migration script DB-GPT autogenerates into the
      # same subtree on first boot. So `docker compose down && up` doesn't
      # silently lose all session/conversation state, per
      # docs/dreams/db-gpt-django-plugin.md's own storage rule.
      #
      # Story 10.5 called this "interim, pending Story 11.2's PostgreSQL
      # wiring" -- Story 11.2 investigated that wiring and found it is NOT
      # achievable without forking DB-GPT itself (AD-9 forbids that), so this
      # stays PERMANENT until upstream fixes the blocker. Verified live,
      # dual-confirmed: (1) `dbgpt_app/base.py::_initialize_db_storage`
      # hardcodes SQLite/MySQL/OceanBase as the only supported
      # `[service.web.database]` backends, and `_migration_db_storage` skips
      # DDL init/upgrade entirely for anything else; `dbgpt_app/_cli.py::
      # _get_migration_config` (the standalone `dbgpt db migration` CLI)
      # independently `raise`s "Only SQLite is supported for migration now."
      # (2) working around the app-layer gate by calling DB-GPT's own public
      # `dbgpt.storage.metadata.db_manager.initialize_db()` +
      # `db.create_all()` directly against a real PostgreSQL engine (not a
      # fork -- their own exposed API, used the same way their own sqlite
      # branch uses it) fails with `psycopg2.errors.SyntaxError: type
      # modifier is not allowed for type "text"`: DB-GPT's own SQLAlchemy
      # models declare columns as `Text(length=2147483647)`, a MySQL-only
      # TEXT-length-hint idiom PostgreSQL's DDL grammar rejects outright --
      # 69 occurrences across the installed `dbgpt-sidecar` package set, not
      # a one-off. `dbgpt_integration/apps.py`'s docstring carries the same
      # citation. `DBGPT_DATABASE_URL` (`config/settings/base.py`) is still
      # derived, real, and ready for whenever this is fixed upstream.
      - dbgpt_sqlite_data:/app/.home/.dbgpt/workspace/pilot/meta_data
    healthcheck:
      # Same "use the env's own python, not curl" reasoning as `platform`'s
      # healthcheck above -- UBI9-minimal ships neither curl nor wget, and
      # `/app/entrypoint.sh` is what puts the pixi-materialized `dbgpt-sidecar`
      # env on PATH. `/api/health` (not `/`) is DB-GPT's own dedicated
      # liveness route -- confirmed live via `openapi.json`, returns a bare
      # `{"status": "ok"}` with no DB/service dependency beyond the process
      # having finished booting.
      test:
        - "CMD"
        - "/app/entrypoint.sh"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5670/api/health', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      # A `docker run` of this same image reached `/api/health` in
      # ~20-25s (alembic autogenerate-and-upgrade pass, then loading its
      # `dbgpt_app`/`dbgpt_serve` component set, confirmed live). 90s
      # (vs. `platform`'s 60s) is a deliberately generous margin for a
      # cold, uncached CI runner rather than a value tuned to an observed
      # failure.
      start_period: 90s

  # spec-mcp-era-isolation slice 1: mcp 2.x official-SDK faces. Isolated
  # from Langflow / FastMCP 3 on the platform image (Pattern B sidecar).
  mcp-host:
    build:
      context: ../../..
      dockerfile: src/platform/compose/mcp-host/Containerfile
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - "CMD"
        - "/app/entrypoint.sh"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# Named volume for the `dbgpt` service's sqlite durability (permanent, not
# interim -- see that service's own `volumes:` comment above). `postgres`/
# `redis` deliberately have none: this local compose stack has never
# persisted their data across `down`, and adding it here is out of scope.
volumes:
  dbgpt_sqlite_data:
