project_name: my-nebari-local
domain: nebari.local
certificate:
  type: selfsigned

cluster:
  local:
    node_selectors:
      general:
        kubernetes.io/os: linux
      user:
        kubernetes.io/os: linux
      worker:
        kubernetes.io/os: linux

repository:
  local: {}

packs:
  nebi-pack:
    chart: nebari-nebi-pack
    version: "0.1.0"
    namespace: nebi
  data-science-pack:
    chart: nebari-data-science-pack
    version: "0.1.7"
    namespace: data-science
    values:
      keycloak:
        hostname: keycloak.nebari.local
      sharedStorage:
        nfsServer:
          enabled: true
      nebi:
        remote:
          enabled: true
