# Example SecretStore — edit server URL, auth, and CA before apply.
# Requires External Secrets Operator (https://external-secrets.io/).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: platform
spec:
  provider:
    vault:
      # Replace with your Vault API address (in-cluster Service or external).
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth is common; swap for token, AppRole, etc. per site policy.
        kubernetes:
          mountPath: kubernetes
          role: platform-eso-reader
          serviceAccountRef:
            name: external-secrets
