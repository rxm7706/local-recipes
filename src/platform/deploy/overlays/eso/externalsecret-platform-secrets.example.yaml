# Example ExternalSecret — maps Vault paths into the chart's existingSecret.
# Replace remoteRef.key/property with your Vault layout before apply.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: platform/django
        property: secret_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: platform/postgres
        property: database_url
    - secretKey: MIGRATION_DATABASE_URL
      remoteRef:
        key: platform/postgres
        property: migration_database_url
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: platform/postgres
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: platform/redis
        property: password
    # Story 78.1 / CAP-99: REQUIRED -- the mounted Langflow's superuser password
    # (auto-login is off). A Secret without this key fails at pod creation.
    - secretKey: LANGFLOW_SUPERUSER_PASSWORD
      remoteRef:
        key: platform/langflow
        property: superuser_password
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: platform/keycloak
        property: admin_password
    - secretKey: COMPONENT_OIDC_CLIENT_SECRET
      remoteRef:
        key: platform/oidc
        property: client_secret
    - secretKey: PYFORGE_ASSERTION_PRIVATE_KEY
      remoteRef:
        key: platform/assertion
        property: private_pem
    - secretKey: PYFORGE_ASSERTION_PUBLIC_KEY
      remoteRef:
        key: platform/assertion
        property: public_pem
