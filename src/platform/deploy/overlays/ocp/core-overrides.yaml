# Story 12.1: the OCP value deltas for the CORE chart -- the other half of
# the overlay (the Route itself is the sibling chart/ directory). Apply
# with:
#   helm install platform src/platform/deploy/charts/platform \
#       -f src/platform/deploy/overlays/ocp/core-overrides.yaml
#
# OCP-only: applying this on vanilla K8s would leave the data services
# unable to pass the kubelet's runAsNonRoot verification (the official
# postgres/redis images declare a root USER, so vanilla needs the numeric
# UIDs the core values default to).
#
# mcp-host is required (spec-mcp-era-isolation CAP-4). This overlay does
# not set mcpHost — it inherits the core chart image and the web/worker
# MCP_HOST_SIDECAR_BASE_URL. Do not add mcpHost.enabled.

# The OCP edge is a Route (overlay chart), never an Ingress.
ingress:
  enabled: false

# Keycloak browser OIDC uses a Route in the OCP overlay chart (same pattern
# as web — set keycloak.route.service.name to the Keycloak Service).
keycloak:
  ingress:
    enabled: false

# restricted-v2 assigns arbitrary UIDs at admission and forbids fixing
# one: null the data services' vanilla-K8s UID pins so the SCC assigns
# them. (The platform-image pods never had a UID to null -- the core
# templates hardcode restricted-v2 with no runAsUser anywhere.)
postgres:
  runAsUser: null
  fsGroup: null
redis:
  runAsUser: null

# Story 33.13 / CAP-3: OpenShift CoreDNS lives in openshift-dns, not kube-system.
# Verified live against CRC 4.22.7 (2026-09-12): namespace openshift-dns, pod label
# dns.operator.openshift.io/daemonset-dns=default.
networkPolicy:
  dns:
    namespace: openshift-dns
    podLabels:
      dns.operator.openshift.io/daemonset-dns: default
