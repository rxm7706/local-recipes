{{- range $role := tuple "cache" "broker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.redis.roleFullname" (dict "root" $ "role" $role) }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: redis-{{ $role }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: redis-{{ $role }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" $ | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - web
                  - worker
                  - worker-builds
                  - beat
                  - migrate
                  {{- range $station := uniq $.Values.events.consumers }}
                  - consume-events-{{ $station }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
