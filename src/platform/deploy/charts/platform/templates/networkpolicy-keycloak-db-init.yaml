{{- if and .Values.networkPolicy.enabled (eq .Values.oidc.profile "bundled") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.keycloak.fullname" . }}-db-init-egress
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db-init
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak-db-init
  policyTypes:
    - Egress
  egress:
    {{- include "platform.networkPolicy.egressToPostgres" . | nindent 4 }}
    {{- include "platform.networkPolicy.dnsEgress" . | nindent 4 }}
{{- end }}
