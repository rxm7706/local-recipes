{{- range $role := tuple "cache" "broker" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.redis.roleFullname" (dict "root" $ "role" $role) }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: redis-{{ $role }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "platform.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: redis-{{ $role }}
{{- end }}
