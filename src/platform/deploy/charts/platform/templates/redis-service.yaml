# DNS name behind the computed REDIS_URL
# (redis://<fullname>-redis:6379/0 -- see platform.djangoEnv).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.redis.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
