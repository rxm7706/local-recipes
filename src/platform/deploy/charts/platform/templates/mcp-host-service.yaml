# Internal-only Service for mcp-host (MCP_HOST_SIDECAR_BASE_URL).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.mcpHost.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-host
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-host
