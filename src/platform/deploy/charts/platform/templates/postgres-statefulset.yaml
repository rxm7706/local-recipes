# PostgreSQL 17 (official image), 1 replica -- AD-1's exact
# infrastructure, mirroring compose.yml's `postgres` service. StatefulSet
# + volumeClaimTemplate because this is the one durable store.
#
# Security posture: the restricted fields (runAsNonRoot, seccomp,
# allowPrivilegeEscalation, drop ALL) are FIXED in this template; ONLY
# runAsUser/fsGroup come from values (default 999, the official image's
# step-down UID -- the vanilla-K8s kubelet cannot verify runAsNonRoot
# against this root-USER image without a numeric UID). The OCP overlay
# nulls both so the SCC assigns UIDs instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform.postgres.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  # Textbook StatefulSet shape: the governing Service is HEADLESS
  # (clusterIP: None) so each pod gets its stable per-pod DNS identity
  # (<pod>.<headless-svc>); clients keep using the separate ClusterIP
  # Service (DATABASE_URL unchanged). Both live in postgres-service.yaml.
  serviceName: {{ include "platform.postgres.headlessServiceName" . }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      # The DATA services' own SA (serviceaccount.yaml): an operator
      # granting a laxer SCC to postgres/redis on OCP binds it to this
      # subject without widening the platform pods' restricted-v2 posture.
      serviceAccountName: {{ include "platform.dataServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- /* nil-checks, not `with`-truthiness: an explicit 0 must
             render, only null/absent may drop the key */}}
        {{- if not (kindIs "invalid" .Values.postgres.runAsUser) }}
        runAsUser: {{ .Values.postgres.runAsUser }}
        {{- end }}
        {{- if not (kindIs "invalid" .Values.postgres.fsGroup) }}
        fsGroup: {{ .Values.postgres.fsGroup }}
        {{- end }}
      containers:
        - name: postgres
          image: {{ include "platform.imageRef" (dict "image" .Values.postgres.image "path" "postgres.image") }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            # Password ONLY by reference to the pre-created Secret (AD-12).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.existingSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            # Subdirectory of the mount: the official image requires PGDATA
            # not to be the volume root (lost+found breaks initdb).
            - name: PGDATA
              value: {{ printf "%s/pgdata" .Values.postgres.dataMountPath | quote }}
          {{- if .Values.postgres.backup.enabled }}
          command:
            - docker-entrypoint.sh
          args:
            - postgres
            - -c
            - archive_mode=on
            - -c
            - archive_command=test ! -f {{ .Values.postgres.backup.mountPath }}/wal/%f && cp %p {{ .Values.postgres.backup.mountPath }}/wal/%f
          {{- end }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.auth.username | quote }}
                - -d
                - {{ .Values.postgres.auth.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.auth.username | quote }}
                - -d
                - {{ .Values.postgres.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgres.dataMountPath }}
            {{- if .Values.postgres.backup.enabled }}
            - name: backup
              mountPath: {{ .Values.postgres.backup.mountPath | quote }}
            {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- if .Values.postgres.backup.enabled }}
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: {{ include "platform.postgresBackup.pvcName" . }}
  {{- end }}
