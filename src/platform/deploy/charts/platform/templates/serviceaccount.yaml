# Two ServiceAccounts, never the namespace default, so OCP SCC bindings
# (and any future RBAC) have named subjects -- SPLIT by trust boundary:
# the platform-image pods (web/worker/migrate) share the first; the DATA
# services (postgres/redis) get their own, so an operator granting a
# laxer SCC to the data services on OCP (the official images may need
# one -- deploy/README.md) binds it to the data SA alone and never
# widens the platform pods' restricted-v2 posture.
#
# automountServiceAccountToken: false on BOTH -- nothing in this chart
# calls the Kubernetes API, so no pod needs a token projected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.dataServiceAccountName" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
