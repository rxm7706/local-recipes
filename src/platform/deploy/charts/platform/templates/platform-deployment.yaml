# Web Deployment: the Story 10.3 platform image serving gunicorn on 8000
# (Story 48.2 overrides args for --preload/--workers; NEVER a migrate step:
# that belongs to the hook Job, concurrent replicas must not race
# migrations).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "platform.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "platform.restrictedPodSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "platform.imageRef" (dict "image" .Values.image "path" "image") }}
          imagePullPolicy: {{ include "platform.imagePullPolicy" .Values.image }}
          securityContext:
            {{- include "platform.restrictedContainerSecurityContext" . | nindent 12 }}
          # args (not command): image ENTRYPOINT stays; Story 48.2 adds
          # --preload and an explicit worker count for Langflow memory sharing.
          {{- $workers := required "web.workers is required" .Values.web.workers }}
          {{- if le (int $workers) 0 }}
          {{- fail "web.workers must be > 0" }}
          {{- end }}
          args:
            - gunicorn
            - config.asgi:application
            - --bind
            - 0.0.0.0:8000
            - --worker-class
            - uvicorn_worker.UvicornWorker
            - --workers
            - {{ $workers | quote }}
            {{- if .Values.web.preload }}
            - --preload
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "platform.djangoEnv" . | nindent 12 }}
            - name: ANYIO_MAX_THREADS
              value: {{ required "web.anyioMaxThreads is required" .Values.web.anyioMaxThreads | quote }}
          volumeMounts:
            - name: wagtail-media
              mountPath: {{ .Values.media.mountPath | quote }}
            {{- include "platform.flagsVolumeMount" . | nindent 12 }}
          resources:
            {{- $_ := required "resources.limits.memory is required for web" .Values.resources.limits.memory }}
            {{- toYaml .Values.resources | nindent 12 }}
          # Probe contract (config/urls.py + config/fastapi_app.py):
          #   /api/health = unconditional liveness (no DB/Redis)
          #   /ht/        = DB connectivity + cache = readiness
          # Both need X-Forwarded-Proto: https (SECURE_PROXY_SSL_HEADER +
          # SECURE_SSL_REDIRECT would 301 plain-http probes) and a Host
          # header ALLOWED_HOSTS accepts.
          #
          # startupProbe covers gunicorn/uvicorn boot: compose.yml's
          # measured healthcheck budget is `start_period: 60s`, so 24 x 5s
          # (~120s) gives the same window doubled before the first
          # liveness failure counts; liveness/readiness take over once it
          # succeeds.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "platform.probeHost" . | quote }}
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "platform.probeHost" . | quote }}
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ht/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "platform.probeHost" . | quote }}
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: wagtail-media
          persistentVolumeClaim:
            claimName: {{ include "platform.media.pvcName" . }}
        {{- include "platform.flagsVolume" . | nindent 8 }}
