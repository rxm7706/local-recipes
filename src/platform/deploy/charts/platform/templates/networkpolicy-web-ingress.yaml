{{/*
Story 48.3 / R-19: web accepts HTTP from Route/Ingress controller namespaces
(values-driven) and from same-namespace pods (in-cluster probes, Service mesh).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-ingress-web
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
    {{- range .Values.networkPolicy.webIngressFrom }}
    - from:
        - {{- toYaml . | nindent 10 }}
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
{{- end }}
