{{/*
Story 48.3 / R-19: dbgpt sidecar accepts REST only from platform-image
pods (same client set as redis NetworkPolicy).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.dbgpt.fullname" . }}-ingress
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbgpt
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dbgpt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - web
                  - worker
                  - worker-builds
                  - beat
                  - migrate
                  {{- range $station := uniq .Values.events.consumers }}
                  - consume-events-{{ $station }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: 5670
{{- end }}
