{{- if and .Values.postgres.backup.enabled (not .Values.postgres.external.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.postgresBackup.pvcName" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
spec:
  accessModes:
    {{- toYaml .Values.postgres.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.postgres.backup.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.backup.persistence.size }}
{{- end }}
