# One JSON tree (AD-11 / FR-34). Built from src/platform/config/flags.json
# via `helm --set-file flags.tree=src/platform/config/flags.json`, rendered
# for `flags.environment` with the value-only overlays in
# src/platform/config/flag-overlays.json (`--set-file flags.overlays=...`;
# Story 76.1). Never duplicate either document in values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-flags
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: flags
data:
  flags.json: |
{{- include "platform.flags.rendered" . | nindent 4 }}
