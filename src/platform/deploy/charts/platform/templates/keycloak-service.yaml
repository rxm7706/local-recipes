{{- if eq .Values.oidc.profile "bundled" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.keycloak.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
