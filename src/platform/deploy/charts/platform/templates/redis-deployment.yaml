# Two Redis Deployments, same image class (canopy AD-10 / parent AD-1):
# redis-cache evicts (allkeys-lru); redis-broker does not (noeviction).
# emptyDir only -- Redis stays ephemeral (Story 12.6).
{{- range $role := tuple "cache" "broker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.redis.roleFullname" (dict "root" $ "role" $role) }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: redis-{{ $role }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: redis-{{ $role }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: redis-{{ $role }}
    spec:
      serviceAccountName: {{ include "platform.dataServiceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if not (kindIs "invalid" $.Values.redis.runAsUser) }}
        runAsUser: {{ $.Values.redis.runAsUser }}
        {{- end }}
      containers:
        - name: redis
          image: {{ include "platform.imageRef" (dict "image" $.Values.redis.image "path" "redis.image") }}
          imagePullPolicy: {{ $.Values.redis.image.pullPolicy }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.existingSecretName" $ | quote }}
                  key: {{ required "redis.passwordSecretKey is required" $.Values.redis.passwordSecretKey | quote }}
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            {{- if eq $role "cache" }}
            - --maxmemory
            - {{ required "redis.cache.maxmemory is required" $.Values.redis.cache.maxmemory | quote }}
            - --maxmemory-policy
            - {{ required "redis.cache.maxmemoryPolicy is required" $.Values.redis.cache.maxmemoryPolicy | quote }}
            {{- else }}
            - --maxmemory-policy
            - {{ required "redis.broker.maxmemoryPolicy is required" $.Values.redis.broker.maxmemoryPolicy | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with $.Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
