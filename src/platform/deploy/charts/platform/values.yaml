# Default values for the platform core chart (Story 12.1).
#
# Deliberately lean: only knobs a real deployment needs today. The
# restricted-v2 security fields for the platform-image pods are NOT here --
# they are an invariant, hardcoded in templates/_helpers.tpl (a values knob
# would be an invitation to regress them silently). The ONLY values-driven
# security seam is the data services' runAsUser/fsGroup below, and the OCP
# overlay (deploy/overlays/ocp/core-overrides.yaml) nulls those.

# Web (gunicorn) replicas. The worker has its own count below.
replicaCount: 1

# Story 48.2 / R-18: web is memory-bound (Langflow in-process RSS ~1.5–3 GiB;
# Vizro/BSL dashboard shares this pod). --preload shares bytecode across workers.
web:
  workers: 2
  preload: true
  # Explicit anyio thread-pool ceiling (spec-asgi-multiplexer-monolith residue).
  anyioMaxThreads: 40

# The Story 10.3 platform image. Fully parameterized so the reference is
# registry-relocatable (CAP-6 air-gap: point registry at an internal
# mirror; no default upstream registry is assumed).
image:
  # e.g. "registry.internal.example" -- empty means "use the engine's
  # default resolution" (a local/preloaded image).
  registry: ""
  repository: platform
  # Story 43.4: no default tag -- set image.digest (preferred) or a
  # pinned non-latest tag at deploy time; `latest` is refused.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# Pull credentials for authenticated registries -- CAP-6: an internal
# mirror that requires auth must work through values alone. List of
# {name: <secret>} entries, rendered into EVERY pod spec.
imagePullSecrets: []

# Web container resources (Story 48.2 / R-18). Memory-bound: Langflow +
# Vizro/BSL in one pod; sized for --preload with two uvicorn workers.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

# AD-12 / canopy AD-19 (Story 26.2): the chart NEVER renders a Secret and
# carries no credential defaults — values hold Secret *names and keys*,
# never secret *values*. A check over `helm template` fails if a value
# appears. This names a PRE-CREATED Secret in the release namespace that
# must hold exactly these keys:
#   DJANGO_SECRET_KEY -- Django's SECRET_KEY
#   DATABASE_URL      -- app-role DML URL (settings read it with env.db()),
#                        e.g. postgres://platform_app:<password>@<release>-postgres:5432/platform
#   MIGRATION_DATABASE_URL -- migration-role DDL URL for the Liquibase Job,
#                        e.g. postgres://platform:<password>@<release>-postgres:5432/platform
#                        (must be the postgres Service DNS, not a pooler)
#   POSTGRES_PASSWORD -- the same password, consumed by the postgres
#                        container itself (POSTGRES_USER = migration role)
#   REDIS_PASSWORD    -- Redis AUTH password (Story 12.6); consumed by the
#                        redis container and wired into platform pods'
#                        REDIS_URL via secretKeyRef + env expansion
# Two more keys are wired OPTIONALLY (secretKeyRef optional: true -- their
# absence never blocks a pod from starting): PYFORGE_ASSERTION_PRIVATE_KEY /
# PYFORGE_ASSERTION_PUBLIC_KEY, the host's RS256 keypair for signing/verifying
# CAP-18 service assertions (django_pyforge.assertion.crypto). Without them,
# `mint_assertion()` raises `AssertionRefusedError`, which the mint view's
# except clause maps to the SAME `{"error": "refused"}` 401 as a genuinely bad
# IdP bearer -- there is no separate signal (found running the CAP-3 attended
# CRC exercise: every mint attempt failed this way because this cluster's
# existingSecret never had these two keys, 2026-09-12).
existingSecret: platform-secrets

# Non-secret Django settings surface (mirrors compose.yml's env wiring).
django:
  # Comma-separated, becomes DJANGO_ALLOWED_HOSTS (env.list in settings).
  # The FIRST entry is also the Host header the kubelet probes send --
  # production.py's SECURE_SSL_REDIRECT + ALLOWED_HOSTS would otherwise
  # reject/redirect the probe requests.
  allowedHosts: platform.internal
  # CAP-3: must not be '/', 'admin', or 'admin/' (stage-1 refuses those).
  adminUrl: platform-admin/
  # production.py defaults True; probes still work because they send
  # X-Forwarded-Proto: https (SECURE_PROXY_SSL_HEADER).
  secureSslRedirect: "True"

service:
  type: ClusterIP
  port: 8000

# Vanilla-K8s edge. The OCP overlay disables this and exposes the same
# Service through a Route instead (deploy/overlays/ocp/).
ingress:
  enabled: true
  # IngressClass name; empty uses the cluster default.
  className: ""
  host: platform.internal
  # Standard networking.k8s.io/v1 tls blocks, passed through verbatim.
  tls: []

# Celery worker (same image, `celery -A config worker`, no HTTP surface).
# Story 42.4: this is the GENERAL pool. It consumes `worker.queues` (in
# that order -- `queue_order_strategy=priority` in settings drains the
# list front to back, so `priority` first means Doctor remedies and
# supervisor housekeeping never wait behind a station backlog) and NEVER
# `builds`: the template refuses a list that names it, because a build on
# this pool would be cut off at CELERY_TASK_TIME_LIMIT (300s). The list
# mirrors django_pyforge.queues.WORKER_QUEUES; a test couples the two.
worker:
  replicaCount: 1
  queues:
    - priority
    - default
    - atlas
    - doctor
    - herald
    - marshal
    - mason
    - scribe
    - steward
    - warden
  # Drain budget: CELERY_TASK_TIME_LIMIT = 5 * 60 in
  # config/settings/base.py, so a task started just before SIGTERM may
  # legitimately run 300s; 310 leaves it that plus shutdown slack before
  # the kubelet SIGKILLs mid-task.
  terminationGracePeriodSeconds: 310
  # Story 48.2 / R-18: general pool is CPU-bound (station tasks, not builds).
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # The builds pool (Story 42.4, red-team T-6): a second worker Deployment
  # consuming ONLY `builds`, with an hours-scale hard limit passed as
  # `--time-limit` AND exported as CELERY_BUILDS_TASK_TIME_LIMIT on every
  # platform pod (so the supervisor's worker-lost sweep uses the same
  # number). Its terminationGracePeriodSeconds is DERIVED in the template:
  # taskTimeLimitSeconds + drainSlackSeconds, so raising the limit can
  # never leave the kubelet SIGKILLing a build the limit still allows.
  builds:
    replicaCount: 1
    # 4h. Must exceed 300s (the general pool's limit) or the render fails.
    taskTimeLimitSeconds: 14400
    # Raised inside the task first, so a build can clean up before the
    # hard kill; must be below taskTimeLimitSeconds.
    softTimeLimitSeconds: 14100
    # Shutdown slack added to the limit for the drain budget.
    drainSlackSeconds: 60
    # Story 48.2 / R-18: builds pool is the heaviest CPU consumer.
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi

# Celery beat (Story 42.4): the one scheduler process that fires
# CELERY_BEAT_SCHEDULE (run_state retention from 42.2, the worker-lost
# sweep from 42.4) through django_celery_beat's DatabaseScheduler. Always
# exactly one replica -- a second beat double-fires every entry -- so the
# template hardcodes replicas: 1 and Recreate; no replicaCount knob.
beat:
  # Same empty-default seam rationale as the top-level `resources`.
  resources: {}

# Event consumers (Story 42.3 / canopy AD-8). One Deployment per station
# listed here, running `manage.py consume_events --station <name>` on the
# platform image with the worker's env, security contexts and volumes.
# Consumer group = station token (the template refuses anything else).
# Delete a station from the list to stop consuming for it. The fabric's
# retry/backoff/DLQ knobs are DJANGO_PYFORGE_EVENT_* PROCESS environment
# variables (django_pyforge/events/constants.py); this chart exposes no
# values passthrough for them, so the defaults apply unless the Deployment
# is edited.
events:
  consumers:
    - doctor
    - mason
  replicaCount: 1
  # Drain budget for one in-flight handler: the fabric's handler timeout is
  # an independent literal equal to CELERY_TASK_TIME_LIMIT (300s), so the
  # same arithmetic as the worker above applies.
  terminationGracePeriodSeconds: 310
  # Same empty-default seam rationale as the top-level `resources`.
  resources: {}

# Migrate hook Job (`manage.py migrate --fake --noinput`, hook-weight 0).
# Liquibase (below) applies DDL first; this Job still runs so post_migrate
# fills content types / permissions / sites (FR-24). backoffLimit absorbs
# the postgres-boot race the compose stack documents.
migrate:
  backoffLimit: 6
  # Same empty-default seam rationale as the top-level `resources`.
  resources: {}

# Liquibase hook Job (`python db/liquibase_update.py` → `liquibase update`,
# hook-weight -1, same platform image). No second image, no initContainer.
liquibase:
  backoffLimit: 6
  # Story 48.2 / R-18: Liquibase JVM spike during hook Job.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# PostgreSQL (official image, StatefulSet, 1 replica -- AD-1).
postgres:
  image:
    registry: ""
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    # Non-secret identity; the password comes ONLY from existingSecret's
    # POSTGRES_PASSWORD key (AD-12). username is POSTGRES_USER and the
    # migration role (DDL). appUsername is the DML-only DATABASE_URL role
    # (FR-22); the operator creates it (db/create_app_role.sql).
    username: platform
    appUsername: platform_app
    database: platform
  persistence:
    size: 8Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  # Where the data volume mounts; PGDATA is derived as
  # <dataMountPath>/pgdata. The default matches the OFFICIAL postgres
  # image -- swapping to a Bitnami/Red Hat image requires matching this
  # to THAT image's data dir (see deploy/README.md) or writes land
  # outside the PVC.
  dataMountPath: /var/lib/postgresql/data
  # The official postgres image's step-down UID. Needed on vanilla K8s:
  # the image's USER is root, so the kubelet cannot verify the
  # template-fixed runAsNonRoot without a numeric UID. The OCP overlay
  # nulls both so the SCC assigns them instead (restricted-v2 forbids
  # fixing a UID).
  runAsUser: 999
  fsGroup: 999
  # Same empty-default seam rationale as the top-level `resources`.
  resources: {}
  # Story 51.1: BYO external PostgreSQL. When enabled, the three in-cluster
  # postgres templates (StatefulSet, Service, backup PVC) render nothing;
  # DATABASE_URL / MIGRATION_DATABASE_URL come from existingSecret (or
  # postgres.external.secretName when set) pointing at the external instance.
  external:
    enabled: false
    # Empty uses top-level existingSecret.
    secretName: ""
    databaseUrlKey: DATABASE_URL
    migrationDatabaseUrlKey: MIGRATION_DATABASE_URL
  # Story 41.1: physical base backup + WAL archive to a separate RWX PVC.
  backup:
    enabled: true
    schedule: "0 2 * * *"
    mountPath: /var/lib/postgresql/backup
    persistence:
      size: 50Gi
      storageClassName: ""
      accessModes:
        - ReadWriteMany
    resources: {}

# Redis (official image, two Deployments -- redis-cache evicts on emptyDir;
# redis-broker is durable (AOF on PVC) and bounded; still Redis-the-kind
# under parent AD-1). Story 40.2.
redis:
  image:
    registry: ""
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  # Key in existingSecret holding the Redis AUTH password (Story 12.6).
  passwordSecretKey: REDIS_PASSWORD
  cache:
    maxmemory: 64mb
    maxmemoryPolicy: allkeys-lru
  broker:
    maxmemory: 512mb
    maxmemoryPolicy: noeviction
    appendfsync: everysec
    persistence:
      size: 20Gi
      # Empty uses the cluster's default StorageClass.
      storageClassName: ""
    resources:
      limits:
        memory: 768Mi
  # Same rationale as postgres.runAsUser; nulled by the OCP overlay.
  runAsUser: 999
  # Cache-only resource seam (broker uses redis.broker.resources).
  resources: {}
  # Story 51.2: BYO-external-Redis overlay (default self-hosted). When
  # enabled, redis-deployment/service/broker-pvc templates render empty and
  # platform pods take REDIS_* URLs from these fields instead of in-cluster
  # Service DNS. Password expansion via $(REDIS_PASSWORD) is supported.
  external:
    enabled: false
    brokerUrl: ""
    cacheUrl: ""
    url: ""

# Wagtail media (Story 20.2 / canopy AD-13). ReadWriteMany; Django
# FileSystemStorage. Not an object-store backend. Mounted by every platform
# Deployment, so the claim needs an RWX-capable StorageClass on a multi-node
# cluster; an empty storageClassName is the cluster default, which is often
# RWO-only and leaves the claim Pending. Proven on CRC (hostpath, single-node).
media:
  mountPath: /media
  persistence:
    size: 8Gi
    storageClassName: ""

# DB-GPT sidecar (Story 10.5 image, Story 12.5 chart membership).
# Pattern B: Celery/REST from platform pods, never an ASGI mount. The
# sidecar's OWN metadata store stays on SQLite at metadataMountPath
# (compose.yml + dbgpt Containerfile contract — PostgreSQL wiring is
# structurally impossible upstream; see dbgpt_integration/apps.py).
sidecar:
  image:
    registry: ""
    repository: platform-dbgpt-sidecar
    digest: ""
    tag: ""
    pullPolicy: IfNotPresent
  # DB-GPT resolves `[service.web.database].path` against
  # $HOME/.dbgpt/workspace — with HOME=/app/.home that lands here
  # (compose/dbgpt/Containerfile + compose.yml volume mount).
  metadataMountPath: /app/.home/.dbgpt/workspace/pilot/meta_data
  persistence:
    size: 1Gi
    storageClassName: ""
  # LLM inference is EXTERNAL — Ollama, Tachyon, vLLM, or another HTTP
  # provider reachable at sidecar.llm.apiBase. The platform image does not
  # ship transformers, diffusers, or llama.cpp (red-team S-7).
  llm:
    modelName: ""
    modelProvider: ""
    apiBase: ""
    apiKeySecretKey: ""
  # Story 48.2 / R-18: DB-GPT sidecar (SQLite metadata + REST face).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# MCP-host sidecar (spec-mcp-era-isolation slice 1 / CAP-4). mcp 2.x
# official SDK faces. Web/worker proxy POST /stations/<name>/mcp here.
# No `enabled` knob — empty repository fails helm template.
mcpHost:
  image:
    registry: ""
    repository: platform-mcp-host
    digest: ""
    tag: ""
    pullPolicy: IfNotPresent
  # Story 48.2 / R-18: MCP-host (lightweight uvicorn proxy).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Story 48.2 / R-18: HPA on web and general worker (not worker-builds).
autoscaling:
  web:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  worker:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Story 48.2 / R-18: voluntary-disruption guard for the two scalable tiers.
podDisruptionBudget:
  web:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

# Story 26.4 / canopy AD-11: FILE flags. The JSON tree is NOT stored here —
# pass --set-file flags.tree=src/platform/config/flags.json (the only tree).
flags:
  mountPath: /etc/pyforge
  fileName: flags.json
  tree: ""

# Story 48.5 / R-21: SLO contract alert rules as a vanilla ConfigMap.
observability:
  enabled: true
  thresholds:
    mcpP99Seconds: 2.0
    queueAgeSeconds: 300
    eventLagSeconds: 60

# Story 48.9 / CAP-1: OIDC identity. Default profile deploys Keycloak
# in-cluster (state in existing PostgreSQL); `byo` skips Keycloak and reads
# issuer/JWKS/client from `oidc.byo.*` — the COMPONENT_OIDC_* BYO escape hatch.
oidc:
  # `bundled` (default): chart renders Keycloak and wires COMPONENT_OIDC_*.
  # `byo`: no Keycloak workloads; set oidc.byo.* explicitly.
  profile: bundled
  providerName: Platform Keycloak
  identityClaim: sub
  groupClaim: groups
  staffGroup: platform-staff
  superuserGroup: platform-superuser
  byo:
    issuer: ""
    jwksUrl: ""
    clientId: ""
    audience: ""
    clientSecretKey: COMPONENT_OIDC_CLIENT_SECRET

keycloak:
  image:
    registry: quay.io
    repository: keycloak/keycloak
    tag: "26.4.0"
    pullPolicy: IfNotPresent
  # Browser-facing hostname for OIDC discovery (TLS at ingress).
  ingress:
    enabled: true
    host: auth.platform.internal
    className: ""
    tls: []
  realm: platform
  clientId: platform-web
  # Public client + PKCE — no realm/chart secret sync chicken-egg.
  publicClient: true
  database: keycloak
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Story 48.3 / R-19: default-deny NetworkPolicy envelope with explicit allows.
networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    # A single scalar key/value pair, not a map -- Helm deep-merges nested
    # maps across `-f` files/chart defaults (union of keys, not a replace),
    # so an overlay setting `podLabels: {other-key: val}` would leave this
    # default's `k8s-app: kube-dns` key alive alongside it, producing an
    # AND-matched podSelector neither system's DNS pods actually satisfy
    # (confirmed live: OCP's real CoreDNS carries only
    # `dns.operator.openshift.io/daemonset-dns: default`, never `k8s-app:
    # kube-dns`, so the merged selector matched nothing and silently
    # blocked DNS egress on a real OpenShift cluster with `networkPolicy.
    # enabled: true` -- found running the CAP-3 attended CRC exercise,
    # 2026-09-12). Scalars fully replace on override; a map's sibling keys
    # do not.
    podLabelKey: k8s-app
    podLabelValue: kube-dns
    # Vanilla Kubernetes CoreDNS pods listen on port 53 directly. OpenShift's
    # own dns-default pods do NOT: their own built-in `dns-default`
    # NetworkPolicy (openshift-dns namespace) only has an ingress rule for
    # port 5353 with no source restriction (Service port 53 DNATs to pod
    # targetPort 5353) -- there is no ingress allow for port 53 from other
    # namespaces at all. An egress rule naming port 53 is therefore silently
    # dropped on arrival at a real OpenShift cluster regardless of how
    # correct its podSelector/namespaceSelector are (confirmed live, CAP-3
    # attended CRC exercise, 2026-09-12 -- this was wrong before Story
    # 33.13 touched this block at all, not something that story introduced).
    port: 53
  # Namespaces whose pods may reach web:8000 (Route/Ingress). Defaults cover
  # CRC/OCP (`openshift-ingress`) and vanilla nginx Ingress.
  webIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-ingress
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  workerBuilds:
    # Mason build tasks reach external registries; general worker does not.
    allowExternalEgress: true
  dbgpt:
    # When sidecar.llm.apiBase points at an external LLM, allow HTTPS egress.
    allowLlmEgress: true
