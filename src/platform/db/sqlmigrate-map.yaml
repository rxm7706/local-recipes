# First-party Django migration -> Liquibase changeset seq (canopy AD-9 / FR-23).
# Ids are `<distribution>:<seq>`. Story 41.3 (red-team B-1 / R-12) split the
# single global sequence into one sequence per distribution, so a station's
# schema change no longer serializes through another distribution's numbering.
# `default` is where a first-party Django migration lands when no distribution
# claims it. Rollback policy and the exception process: db/README.md.
default: python-agent-platform
distributions:
  python-agent-platform:
    # Seq 1 is the shared engine-schema changeset; seq 2 is DML grants (no migration).
    migrations:
      langflow_integration.0001_create_langflow_schema: 1
      dbgpt_integration.0001_create_dbgpt_schema: 1
      django_pyforge.0001_supervisor_tables: 3
      django_pyforge.0002_run_result_and_handle_subject: 4
      django_pyforge.0003_run_state_timing: 5
      django_pyforge.0004_run_bounds: 20
      django_pyforge.0005_run_state_tenant: 21
      users.0001_initial: 6
      users.0002_user_idp_subject: 7
      front_door.0001_homepage: 8
      front_door.0002_console_parity: 9
      sites.0001_initial: 10
      sites.0002_alter_domain_unique: 11
      sites.0003_set_site_domain_and_name: 12
      sites.0004_alter_options_ordering_domain: 13
      warden_fabric.0001_initial: 14
  pyforge-mybmad:
    # Story 52.1: consume sidecar schema only (no Django app / no public tables).
    migrations: {}
  pyforge-scribe:
    # Scribe's graph store is not a Django app, so this distribution maps no
    # migrations. It still owns seqs 1-4 in the changelog (pgvector extension,
    # scribe_schema + graph_nodes, guarded app-role grants, and the `stale`
    # back-fill) -- the runtime driver asserts those exist and never creates
    # them (CAP-9 / Story 41.3).
    migrations: {}
