# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
# Story 12.8 github_metrics dlt tests live under ingest/github_projects/ (not
# tests/) so import-linter's tests→pyforge forbidden contract stays intact.
# Platform CI still discovers test_*.py tree-wide — ignore the dlt suite here;
# github-metrics-dlt-test runs it with pytest -c /dev/null under
# python-agent-platform (has dlt).
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib --ignore=ingest/github_projects/test_github_metrics_dlt.py"
# Story 18.1: django-pyforge is a path-installable package; tests also
# resolve it from source so local pytest matches pixi path installs.
pythonpath = [
    "../shared/packages/django-pyforge/src",
    "../shared/packages/django-warden/src",
]
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["platformapp/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# Steward 16.4 / CAP-4: measured 2026-08-23 under platform-ci-test
# (`coverage run -m pytest` → TOTAL 100.00% on the closed include surface).
# Floor equals the observed total so happy path stays green; lowering it is
# deliberate drift caught by tests/policy/test_coverage_policy.py.
[tool.coverage.report]
fail_under = 100

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "UP038", # Checks for uses of isinstance/issubclass that take a tuple
          # of types for comparison.
          # Deactivated because it can make the code slow:
          # https://github.com/astral-sh/ruff/issues/7871
]
# The fixes in extend-unsafe-fixes will require
# provide the `--unsafe-fixes` flag when fixing.
extend-unsafe-fixes = [
  "UP038",
]

[tool.ruff.lint.isort]
force-single-line = true

# Story 12.8 github_projects ingest landed ahead of a ruff-clean pass; main's
# Platform CI `ruff check .` (cwd src/platform) has been red since #646/#648.
# Ignore the remaining style debt on that surface so unrelated stories (e.g.
# steward 13.1) are not blocked. Tighten/remove as 12.x follow-ups land.
[tool.ruff.lint.per-file-ignores]
"ingest/github_projects/**" = [
  "COM812", "E501", "EM101", "EM102", "F402", "I001", "PLR0913", "T201",
  "TC002", "TC003", "TRY003", "TRY004", "UP035",
]
"ingest/github_projects/test_github_metrics_dlt.py" = [
  "COM812", "E501", "E402", "I001", "PLR2004",
]

# ==== import-linter ====
# Story 10.1 / spec-python-agent-platform Boundaries & Constraints: `src/
# platform/` never imports `pyforge.*` -- enforced here, not by convention.
# Mirrors pyforge-marshal's AD-3/AD-4 precedent (src/shared/packages/
# pyforge-marshal/pyproject.toml); tests/meta/test_no_pyforge_import.py
# shells out to `lint-imports` against this config and makes it a real gate.
[tool.importlinter]
root_packages = ["config", "platformapp", "tests"]
# `pyforge` is external to root_packages (it is never a declared dependency
# of this platform host at all -- that is the point of the contract), so
# import-linter requires this flag before it will validate a forbidden
# contract naming it.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Story 10.1: the platform host never imports pyforge.* (factory/platform boundary)"
type = "forbidden"
source_modules = ["config", "platformapp", "tests"]
forbidden_modules = ["pyforge"]
