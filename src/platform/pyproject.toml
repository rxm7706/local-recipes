# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
# Story 12.8 github_metrics dlt tests live under ingest/github_projects/ (not
# tests/) so import-linter's tests→pyforge forbidden contract stays intact.
# Platform CI still discovers test_*.py tree-wide — ignore the dlt suite here;
# github-metrics-dlt-test runs it with pytest -c /dev/null under
# python-agent-platform (has dlt).
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib --ignore=ingest/github_projects/test_github_metrics_dlt.py"
# Story 18.1: django-pyforge is a path-installable package; tests also
# resolve it from source so local pytest matches pixi path installs.
pythonpath = [
    "../shared/packages/django-pyforge/src",
    "../shared/packages/pyforge-core/src",
    "../shared/packages/django-warden/src",
    "../shared/packages/django-atlas/src",
    "../shared/packages/django-doctor/src",
    "../shared/packages/django-herald/src",
    "../shared/packages/django-marshal/src",
    "../shared/packages/django-mason/src",
    "../shared/packages/django-scribe/src",
    "../shared/packages/django-steward/src",
    # Story 23.1: atlas board imports pyforge.steward.dashboard at test time.
    "../shared/packages/pyforge-steward/src",
]
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["platformapp/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# Steward 16.4 / CAP-4: measured 2026-08-23 under platform-ci-test
# (`coverage run -m pytest` → TOTAL 100.00% on the closed include surface).
# Floor equals the observed total so happy path stays green; lowering it is
# deliberate drift caught by tests/policy/test_coverage_policy.py.
[tool.coverage.report]
fail_under = 100

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

# Epics 40-43 (2026-08-31 -> 2026-09-03) landed while GitHub Actions was disabled
# (2026-08-30 -> 2026-09-04): `mypy platformapp config tests` accumulated 114 errors in
# 27 files that no run reported. 2026-09-04 (PR #1043): the unused `type: ignore`s were
# removed at source; the rest is disabled PER MODULE with exactly the error codes each
# module trips (never `ignore_errors`), so the gate is live again for every other module
# and every other code. Same shape as the Ruff per-file block; tighten or drop an entry
# whenever its module is touched.
[[tool.mypy.overrides]]
module = ["platformapp.users.tests.factories", "tests.test_atlas_portal_inventory_row", "tests.test_broker_tls_verified", "tests.test_herald_portal_deck_status", "tests.test_marshal_loop_homes_portal", "tests.test_mason_portal_last_diagnose", "tests.test_restarts_reconcile", "tests.test_station_portal_shells", "tests.test_validation_errors_render_inline", "tests.test_warden_portal_audit_start_get"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["platformapp.users.tests.test_views", "tests.test_idp_revoke_next_request", "tests.test_role_namespaces"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["tests.test_chart_invariants", "tests.test_station_api_seam", "tests.test_station_port_no_loopback"]
disable_error_code = ["index"]

[[tool.mypy.overrides]]
module = ["tests.test_mcp_host_sidecar"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["tests.test_oidc_identity"]
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = ["tests.test_front_door_publish"]
disable_error_code = ["arg-type", "assignment", "attr-defined", "return-value"]

[[tool.mypy.overrides]]
module = ["tests.test_structlog_otel_correlation"]
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.test_django_pyforge_assertion"]
disable_error_code = ["arg-type", "call-overload", "misc"]

[[tool.mypy.overrides]]
module = ["tests.test_django_pyforge_chrome"]
disable_error_code = ["assignment", "attr-defined", "index"]

[[tool.mypy.overrides]]
module = ["platformapp.conftest"]
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = ["tests.test_celery_hardening_and_builds_pool"]
disable_error_code = ["var-annotated"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "UP038", # Checks for uses of isinstance/issubclass that take a tuple
          # of types for comparison.
          # Deactivated because it can make the code slow:
          # https://github.com/astral-sh/ruff/issues/7871
  "COM812", # missing-trailing-comma -- conflicts with ruff's own formatter
            # (ruff's own warning: "may cause conflicts when used with the
            # formatter"), which now gates this project (retro action item
            # 4, 2026-09-05): `ruff format .` removed trailing commas in 53
            # spots COM812 wants back, so the two rules disagree on the same
            # code. The formatter's placement is authoritative once it's
            # gated.
]
# The fixes in extend-unsafe-fixes will require
# provide the `--unsafe-fixes` flag when fixing.
extend-unsafe-fixes = [
  "UP038",
]

[tool.ruff.lint.isort]
force-single-line = true

# Story 12.8 github_projects ingest landed ahead of a ruff-clean pass; main's
# Platform CI `ruff check .` (cwd src/platform) has been red since #646/#648.
# Ignore the remaining style debt on that surface so unrelated stories (e.g.
# steward 13.1) are not blocked. Tighten/remove as 12.x follow-ups land.
[tool.ruff.lint.per-file-ignores]
"ingest/github_projects/**" = [
  "E501", "EM101", "EM102", "F402", "I001", "PLR0913", "T201",
  "TC002", "TC003", "TRY003", "TRY004", "UP035",
]
"ingest/github_projects/test_github_metrics_dlt.py" = [
  "E501", "E402", "I001", "PLR2004",
]

