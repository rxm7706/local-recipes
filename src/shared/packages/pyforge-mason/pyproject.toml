[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-mason"
version = "0.1.0"
description = "The Artisan Builder's CLI — author and build conda recipes, ship packages to PyPI + conda-forge, and resolve conflicting worlds into one lockfile."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# NFR-10 / FR-41: only what `pyforge.mason` actually imports. Standard
# library alone otherwise (argparse, importlib.metadata) -- `packaging` is
# a third-party addition, for engines/__init__.py's `SpecifierSet`
# version-range constants (Story 3.1). pyforge-core is Story 14.3's CAP-5
# dependency -- errors.py's MasonError re-parents to pyforge.core.errors.
# PyforgeError (mirrors pyforge-herald's identical pyforge-core
# run-dependency for the same reason, Story 14.2/14.3). PyYAML>=6.0.3 is
# Story 4.4's engines/condalock.py::check() `metadata.content_hash` parser
# -- justified against NFR-10 the same way pyforge-doctor's own shipped
# `PyYAML>=6.0` was (its pyproject.toml comment: "the epic's own explicit
# departure from [a] hand-rolled-parser precedent"): no stdlib YAML parser
# exists, and no CLI-only way exists to read conda-lock's own hash
# comparison without one. The floor here is `>=6.0.3`, not doctor's `>=6.0`
# (review pass, 2026-08-15: the two are not byte-identical) -- it mirrors
# THIS package's own `pixi.toml` `pyyaml = ">=6.0.3"` conda pin instead.
# Deliberately NO CLI framework: click/typer are forbidden by FR-41, and the
# dispatcher is argparse for the same reason its siblings' are.
dependencies = ["packaging", "pyforge-core", "PyYAML>=6.0.3"]

[project.scripts]
mason = "pyforge.mason.cli:main"

[project.entry-points."pyforge.core.hooks"]
rattler-build = "pyforge.mason.engines.build_hooks:RattlerBuildPlugin"
conda-build = "pyforge.mason.engines.build_hooks:CondaBuildPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 1.9 / AD-16: the whole suite runs against the fixture CFE root
# (tests/fixtures/fake_cfe_root/) with no real conda-forge-expert install,
# network, or `recipes/` dir. The single exception is Story 5.3's FR-46
# delegation-fidelity test, which requires a real CFE installation/subprocess
# dependency outside this suite's fixtures -- it is marked `slow` and
# excluded from the default pyforge-mason-test task (pixi.toml passes
# -m "not slow" there), running instead via the separate
# pyforge-mason-test-slow task (-m slow).
markers = ["slow: requires a real CFE installation/subprocess dependency outside this suite's fixtures; excluded from the default pyforge-mason-test task"]
