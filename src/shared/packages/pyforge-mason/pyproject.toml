[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-mason"
version = "0.1.0"
description = "The Artisan Builder's CLI — author and build conda recipes, ship packages to PyPI + conda-forge, and resolve conflicting worlds into one lockfile."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# NFR-10 / FR-41: only what `pyforge.mason` actually imports. At scaffold stage
# that is the standard library alone — argparse and importlib.metadata.
# Deliberately NO CLI framework: click/typer are forbidden by FR-41, and the
# dispatcher is argparse for the same reason its siblings' are. pyforge-core
# is Story 14.3's CAP-5 dependency -- errors.py's MasonError re-parents to
# pyforge.core.errors.PyforgeError (mirrors pyforge-herald's identical
# pyforge-core run-dependency for the same reason, Story 14.2/14.3).
dependencies = ["pyforge-core"]

[project.scripts]
mason = "pyforge.mason.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 1.9 / AD-16: the whole suite runs against the fixture CFE root
# (tests/fixtures/fake_cfe_root/) with no real conda-forge-expert install,
# network, or `recipes/` dir. The single exception is Story 5.3's FR-46
# delegation-fidelity test, which requires a real CFE installation/subprocess
# dependency outside this suite's fixtures -- it is marked `slow` and
# excluded from the default pyforge-mason-test task (pixi.toml passes
# -m "not slow" there), running instead via the separate
# pyforge-mason-test-slow task (-m slow).
markers = ["slow: requires a real CFE installation/subprocess dependency outside this suite's fixtures; excluded from the default pyforge-mason-test task"]
