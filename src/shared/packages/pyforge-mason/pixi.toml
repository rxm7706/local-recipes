# pyforge-mason (Mason): pixi build workspace member (warden/doctor mirror, Story 1.1).
#
# MEMBER package of the parent workspace — there is deliberately NO [workspace]
# table here. The root ../../../../pixi.toml owns workspace config (channels,
# platforms, environments, `preview = ["pixi-build"]`) and pulls this package in
# via a path dependency in [feature.pyforge-mason.dependencies].
#
# Story 1.1 delivers the build wiring only: the dual-artifact manifest, the PEP
# 420 namespace, and a `mason` entry point that reports its version. The recipe /
# package / environment verbs land story-by-story against
# _bmad-output/projects/pyforge-mason/planning-artifacts/.

[package]
name = "pyforge-mason"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.host-dependencies]
python = ">=3.12"          # AC: requires-python >=3.12 (Mason wraps the CFE craft, which runs on the factory interpreter)
hatchling = "*"

# Story 3.1 (+ Story 3.7's fifth): the five engines Mason will drive
# (pixi/twine/conda-lock/build/gh) are conda run-dependencies, range-pinned
# to the exact minor this codebase has live evidence for (NOT an exact pin
# -- engines come from feedstocks, same NFR-C1-style convention
# pyforge-warden's deptry/osv-scanner pins follow). engines/__init__.py's
# PIXI_VERSION_RANGE/TWINE_VERSION_RANGE/CONDA_LOCK_VERSION_RANGE/
# PYTHON_BUILD_VERSION_RANGE/GH_VERSION_RANGE SpecifierSet constants must
# stay byte-for-byte in sync with these five lines -- enforced by
# tests/meta/test_engine_version_range_sync.py. `packaging` is also a
# run-dependency: engines/__init__.py imports `packaging.specifiers.
# SpecifierSet` for those same constants (FR-41's lean-dependency-set floor).
[package.run-dependencies]
python = ">=3.12"
packaging = "*"
pyyaml = ">=6.0.3"         # Story 4.4: engines/condalock.py imports `yaml` at module scope, on cli.py's own import path (cli -> environment -> engines.condalock) -- without this the built .conda installs without PyYAML and `mason` raises ModuleNotFoundError before parsing argv (mirrors pyforge-doctor/pixi.toml's identical line and its identical reason; matches pyproject.toml's own `PyYAML>=6.0.3` and the root pixi.toml pin). NOT satisfied incidentally by conda-lock's own PyYAML dependency: that is an engine run-dep, not an import guarantee.
pixi = ">=0.80.0,<0.81"   # keep in step with the root requires-pixi floor — this package-level run-dep is NOT in pixi_version_registry.py's 17 sites (recurrence, 2026-09-11: the <0.78 ceiling pinned the mason env's own pixi at 0.77.1 while requires-pixi had moved to >=0.80.0, failing mason's self-hosting build test the same way the 2026-08-21 incident did); still not registered there -- the registry's "floor"-kind sites match a bare `>=VERSION` literal, but this line's ceiling (`<0.81`) would ALSO need to track the master version's next minor, a growth rule the registry doesn't generalize today
twine = ">=7.0.0"   # 2026-09-20: unreasoned ceiling removed (operator ruling: never cap without a reason); floor kept
conda-lock = ">=4.0.2"   # 2026-09-20: unreasoned ceiling removed (operator ruling: never cap without a reason); floor kept
python-build = ">=1.6.0"       # 2026-09-20 (steward Story 63.5, the pyforge-foundry-full union env): the old <1.6 cap conflicted with the >=1.6.0 floors pyforge-ci / pyforge-core / pyforge-testing-kit / local-recipes pin; the union solve surfaced it. Floor only -- no reasoned ceiling (operator ruling: never cap without a reason).
gh = ">=2.97.0"   # 2026-09-20: unreasoned ceiling removed (operator ruling: never cap without a reason); floor kept
pyforge-core = { path = "../pyforge-core" }  # Story 14.3, CAP-5: errors.py's MasonError re-parents to pyforge.core.errors.PyforgeError
