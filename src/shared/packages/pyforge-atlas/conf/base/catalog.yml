# per-build repodata timestamp), never latest_conda_upload; 90-day recency gate. NEVER
# parity-gated (AD-14). Derived from already-fetched data (no new external source).
vcs_release_velocity:
  type: pandas.ParquetDataset
  filepath: data/primary/vcs_release_velocity/vcs_release_velocity.parquet
  metadata:
    layer: primary

# --- Story B10 — conda-forge-bot-data migration-status sources (FR-21) --------
# The data behind conda-forge.org/status/#migrations. AD-14 NEW-SIGNAL family:
# NEVER parity-gated. All fetches route through the EXISTING GITHUB_RAW_BASE_URL
# override point (no new resolve_*_urls helper; enterprise/JFrog mirror routing
# inherited). IO is DATASET-owned via an INJECTED fetcher (default None == OFFLINE
# -> keep last-good + mark stale, AD-13). DELIBERATELY EXCLUDED: version_status.v2.json
# (the bot's version-update queue) — the atlas measures currency itself (Phases H/K).

# Category-list sources — enumerate active/closed/paused migrations; regular +
# longterm drive which per-migration detail partitions exist (so the surface
# generalizes with zero code change: python314 today, python315 tomorrow).
vcs_migration_regular_status_raw:
  type: pyforge.atlas.datasets.MigrationCategoryDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/regular_status.json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_regular_status_raw
  metadata:
    layer: raw

vcs_migration_longterm_status_raw:
  type: pyforge.atlas.datasets.MigrationCategoryDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/longterm_status.json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_longterm_status_raw
  metadata:
    layer: raw

vcs_migration_closed_status_raw:
  type: pyforge.atlas.datasets.MigrationCategoryDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/closed_status.json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_closed_status_raw
  metadata:
    layer: raw

vcs_migration_paused_status_raw:
  type: pyforge.atlas.datasets.MigrationCategoryDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/paused_status.json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_paused_status_raw
  metadata:
    layer: raw

# The summary category (total counts across all migrations).
vcs_migration_total_status_raw:
  type: pyforge.atlas.datasets.MigrationCategoryDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/total_status.json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_total_status_raw
  metadata:
    layer: raw

# Per-migration detail — PARTITIONED by active migration (mirrors the
# partitions.PartitionedDataset shape with the AD-13 offline-safety a stock
# PartitionedDataset cannot provide). The fetch appends /<name>.json to the url;
# one <name>.json partition per active migration the category lists surfaced.
# Consumed by the classify_migration_readiness node.
vcs_migration_detail_raw:
  type: pyforge.atlas.datasets.MigrationDetailDataset
  url: ${globals:endpoint_bases.GITHUB_RAW_BASE_URL}/conda-forge/conda-forge-bot-data/main/status/migration_json
  filepath: ${globals:paths.data_root}/raw/vcs_migration_detail_raw
  metadata:
    layer: raw

# Story B10 output — the FR-21 readiness classification (four-way split +
# blocker buckets + inferred not-in-tracker label + top-unmigrated-by-volume
# rank). AD-14 new-signal PRIMARY: name aligned to B4's fixture-enforced
# EXCLUDED_NEW_SIGNAL_DATASETS ("vcs_migration_readiness", parity/legacy_surface.py).
# NEVER parity-gated (AD-14).
vcs_migration_readiness:
  type: pandas.ParquetDataset
  filepath: data/primary/vcs_migration_readiness/vcs_migration_readiness.parquet
  metadata:
    layer: primary

# =============================================================================
# universal_sbom — user-inventory intake + matching (entry-scoped, § 3.4)
# =============================================================================

# User-supplied manifests/locks/SBOMs/containers — per-invocation ENTRY
# dataset, runtime-parameterized (§ 3.4 "modeled as such in the catalog"):
# `kedro run --params sbom_intake_path=<file>`.
# B7 LANDED the § 4.10 tiered-intake parser: interim json.JSONDataset ->
# SbomIntakeDataset (dataset-owned file parsing, AD-2). No FLIP marker existed
# on this entry, so EXPECTED_FLIP_MARKERS is unchanged (type change only).
sbom_intake_entry:
  type: pyforge.atlas.datasets.SbomIntakeDataset
  filepath: ${runtime_params:sbom_intake_path,data/raw/sbom_intake_entry/intake.json}
  metadata:
    layer: raw

# Transitive resolution of the intake manifest (FR-17). Dataset-owned IO via an
# INJECTED resolver (pip --dry-run --report / py-rattler solve); default offline
# -> `unresolved` marker (AD-13). NEVER imports subprocess (A2 denylist).
sbom_resolution_entry:
  type: pyforge.atlas.datasets.TransitiveResolverDataset
  filepath: ${runtime_params:sbom_intake_path,data/raw/sbom_resolution_entry/intake.json}
  metadata:
    layer: raw

# Normalized CycloneDX BOM (entry-scoped; `cfe:*` properties and the
# `?channel=conda-forge` purl qualifier are NEVER stripped).
sbom_normalized_bom_entry:
  type: json.JSONDataset
  filepath: ${runtime_params:sbom_normalized_out,data/intermediate/sbom_normalized_bom_entry/bom.cdx.json}
  metadata:
    layer: intermediate

# Six-bucket match report (entry-scoped per AD-12; the repo-scope derived
# report is Story F4's dataset to declare, not A2's — recorded).
sbom_match_report_entry:
  type: json.JSONDataset
  filepath: ${runtime_params:sbom_match_report_out,data/primary/sbom_match_report_entry/match_report.json}
  metadata:
    layer: primary

