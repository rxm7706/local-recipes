# pyforge-atlas — Data Catalog (Story A2; spec § 5.1/§ 9, FR-1, AD-2/AD-3/AD-13/AD-15).
#
# Every API source and every persisted output of the seven § 5.2 pipelines is
# declared HERE — no data-access logic ever lives in node functions (AC-2;
# enforced structurally by kedro-catalog-check's no-inline-IO meta-test).
#
# Conventions (spine Consistency rows; asserted by tests/catalog/):
#   - names: `<domain>_<entity>` snake_case; the domain prefix maps 1:1 to a
#     § 5.2 pipeline (core / pypi_intelligence / vulnerability / vcs_health /
#     universal_sbom / seed_gaps / derived_artifacts — map declared once in
#     tests/catalog/conftest.py).
#   - layers: raw / intermediate / primary / derived via `metadata.layer`.
#   - persisted outputs: Parquet under `data/<layer>/<dataset_name>/`
#     (nodes never choose physical layout).
#   - endpoints: every external entry routes through a `${globals:...}`
#     endpoint-base (AD-13) — NO host is ever hardcoded here.
#   - credentials: per-host keys ONLY where the destination host requires
#     them (FR-1/AD-2 — the legacy `_http.py` JFrog leak is FIXED, not
#     ported: no global credential injection exists; a JFrog key may only
#     ever be attached to a dataset whose endpoint-base resolves to an
#     Artifactory host, and the shipped defaults are all public hosts, so
#     NO entry below carries the `jfrog` key).
#   - `# A3: IncrementalParquetDataset` markers: TTL-gated entries declared
#     with standard kedro_datasets types NOW (assumption A2-A1 — the catalog
#     must resolve before A3's class exists); Story A3 flips `type:` on
#     exactly these entries and consumes their `ttls.<name>` parameter.
#
# Deliberately NOT declared (spec § 3.3/§ 3.4): `phase_state` (FR-4 removes
# it), the 5 SQL views (query-time constructs — Waves D/F), dropped post-v25
# tables, gemini_server + recipe-authoring surfaces + template trees +
# authoring-time live fetches, read-CLI internals. § 13.1 Candidate /
# Conditional rows (incl. the unshipped Phase T) are NOT cataloged (AD-19).

