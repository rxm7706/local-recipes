# --- external sources (layer raw) ---

# GitHub REST + GraphQL (Phases E.5/K/N). The ONLY entry carrying the
# per-host github_token credential (FR-1: attaches to this destination
# host only). Review-pass P2: GraphQL requires POST — kedro-datasets 9.5.0
# APIDataset takes `method` as a TOP-LEVEL constructor param (GET/POST/PUT;
# verified live) and feeds `load_args` to requests.request, so the JSON
# body goes in load_args. The query below is a benign placeholder; the
# per-query parameterization (one dataset = one request body) lands with
# the vcs port (B2) as a factory/custom dataset — nodes never build
# requests (AC-2).
vcs_github_api_raw:
  type: api.APIDataset
  url: ${globals:endpoint_bases.GITHUB_API_BASE_URL}/graphql
  method: POST
  load_args:
    json:
      query: "query { rateLimit { remaining } }"
  credentials: github_token
  metadata:
    layer: raw

