# § 3.4 store 1 — AppThreat vdb (~2.5 GB). Story B5 LANDED the flip (was
# `# FLIP(B5)`): VDBStoreDataset is the read-only VDB store class that owns the
# vdb file format (still NOT pickle — the A2 P2 honest-format fix) AND wraps the
# refresh as the SINGLE writer. The vuln-db env is a DECLARED resource requirement
# (AC-3), the fetch is dataset-owned IO via an injected refresher (no shell-out in
# package code), and `coerce_cvss_score` is applied at the read boundary (DW-B2-2)
# so Phases G / G' consume load() -> an already-parsed + coerced per-CVE frame.
# AD-13: an air-gapped / never-refreshed load keeps last-good + surfaces a staleness
# marker rather than crashing.
vulnerability_vdb_store:
  type: pyforge.atlas.datasets.VDBStoreDataset
  filepath: ${globals:paths.vdb_store}
  metadata:
    layer: raw

# § 3.4 store 2 — offline OSV CVE store (`cve/`). Story B5 LANDED the refresh wrap:
# OSVOfflineStoreDataset is the SINGLE writer (dataset-owned IO via the injected
# fetcher + the OSV_VULNS_BUCKET_URL endpoint base — AD-2: no hardcoded host, no HTTP
# client imported in package code). The offline vulnerability scanner / scan-project
# consume load() read-only, air-gapped (AD-13 keep-last-good + staleness marker).
vulnerability_osv_offline_store:
  type: pyforge.atlas.datasets.OSVOfflineStoreDataset
  filepath: ${globals:paths.osv_offline_store}
  bucket_url: ${globals:extra_overrides.OSV_VULNS_BUCKET_URL}
  metadata:
    layer: raw

# FLIP(B8) LANDED — Basilisk conda-native vulnerability source (FR-19). The 20th
# override point BASILISK_BASE_URL (A2 reserved) is now consumed here. IO is
# DATASET-owned: BasiliskBatchDataset owns the POST /v1/querybatch ≤1,000-query
# chunking + an INJECTED fetcher (default None == OFFLINE -> keep last-good + mark
# stale, AD-13). No `# FLIP` marker existed on it (RESERVED, not an interim FLIP),
# so EXPECTED_FLIP_MARKERS is unchanged (type change only).
vulnerability_basilisk_raw:
  type: pyforge.atlas.datasets.BasiliskBatchDataset
  url: ${globals:endpoint_bases.BASILISK_BASE_URL}/v1/querybatch
  filepath: ${globals:paths.data_root}/raw/vulnerability_basilisk_raw
  metadata:
    layer: raw

# Story B8 — the bounded GET /v1/vulns/{id} detail source. BasiliskDetailDataset
# binds the standard atlas rate-limit discipline (concurrency cap + Retry-After +
# jittered backoff, RateLimitedScheduler) via an INJECTED fetcher (default None ==
# OFFLINE, AD-13). Same BASILISK_BASE_URL override point (no new helper).
vulnerability_basilisk_detail_raw:
  type: pyforge.atlas.datasets.BasiliskDetailDataset
  url: ${globals:endpoint_bases.BASILISK_BASE_URL}/v1/vulns
  filepath: ${globals:paths.data_root}/raw/vulnerability_basilisk_detail_raw
  metadata:
    layer: raw

