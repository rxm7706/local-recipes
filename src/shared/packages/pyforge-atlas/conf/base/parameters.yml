# pyforge-atlas — pipeline parameters (Story A2).
#
# `ttls:` — per-dataset fetch TTLs (FR-3; spine AD-5). Story A2 DECLARES
# this namespace; Story A3's IncrementalParquetDataset CONSUMES it (the
# flip list is recorded in the A2 Dev Agent Record). Keyed by catalog
# dataset name; values are SECONDS (day equivalents in the trailing
# comments). NEVER a single global TTL constant (AD-5).
#
# Value sources (all spot-verified against the live tree 2026-07-17):
#   - conda_forge_atlas.py PHASE_*_TTL_DAYS env-var defaults
#     (F=7, G=7, G'=30, H=7, K=7, L=7, N=1, P=30, Q=7, R=7,
#      D-universe=7, ATLAS_CFGRAPH_TTL_DAYS=1)
#   - atlas_phase._TTL_GATED (the F/G/G'/H/K/L gate-column map)
#   - guides/atlas-operations.md cadence table
#   - cve_manager CVE_TTL_DAYS=7, mapping_manager MAPPING_TTL_DAYS=7
#   - spec § FR-3 named values (EPSS 1 d, CWE 90 d, eol 7 d, Phase P 30 d)

ttls:
  # -- core (legacy Phase F fetch: PHASE_F_TTL_DAYS=7; gate column
  #    downloads_fetched_at; Phase I rides the same fetch — FR-2 makes it
  #    an explicit node)
  core_downloads: 604800                        # 7 d
  core_downloads_platform_breakdown: 604800     # 7 d
  core_downloads_pyver_breakdown: 604800        # 7 d
  core_downloads_channel_breakdown: 604800      # 7 d
  core_version_download_history: 604800         # 7 d
  core_cf_graph_raw: 86400                      # 1 d (ATLAS_CFGRAPH_TTL_DAYS cached tarball) [future_consumer: B1 — core backbone nodes cache the tarball fetch]
  # -- pypi_intelligence
  pypi_universe: 604800                         # 7 d (PHASE_D_UNIVERSE_TTL_DAYS; spec FR-3)
  pypi_current_versions: 604800                 # 7 d (PHASE_H_TTL_DAYS; serial-gated, column pypi_version_fetched_at)
  pypi_downloads_monthly: 2592000               # 30 d (PHASE_P_TTL_DAYS; monthly partitions; admin-only)
  pypi_cross_channel_flags: 604800              # 7 d (PHASE_Q_TTL_DAYS)
  pypi_intelligence_enriched: 604800            # 7 d (PHASE_R_TTL_DAYS)
  pypi_conda_map_store: 604800                  # 7 d (MAPPING_TTL_DAYS mapping cache; Q6 pending — B5) [future_consumer: B5 — external-refresh assets wrap the cache refresh]
  pypi_endoflife_raw: 604800                    # 7 d (spec eol cache; lts_registry_gap ttl_days=7) [future_consumer: B2 — pypi_intelligence port gates the eol fetch]
  # -- vulnerability
  # G-4(B2): KEV cadence decision — the A2 Dev Agent Record deferred the KEV
  # fetch-TTL to the vulnerability-pipeline port (this story). CISA publishes
  # the KEV catalog on a rolling basis (typically new entries multiple times a
  # week); a DAILY re-fetch is the reasonable default — cheap (one small JSON),
  # keeps KEV-affecting-current fresh, and matches the EPSS 1 d cadence.
  vulnerability_cisa_kev_raw: 86400             # 1 d (G-4 B2 decision: daily KEV re-fetch) [future_consumer: B2 — vulnerability-pipeline KEV ingest gates the fetch]
  vulnerability_package_rollup: 604800          # 7 d (PHASE_G_TTL_DAYS; gate column vdb_scanned_at)
  vulnerability_package_version_vulns: 2592000  # 30 d (PHASE_GP_TTL_DAYS; legacy reset = row absence)
  vulnerability_epss_raw: 86400                 # 1 d (spec: EPSS daily CSV) [future_consumer: B2 — vulnerability-pipeline port gates the EPSS fetch]
  vulnerability_cwe_catalog_raw: 7776000        # 90 d (spec: CWE catalog) [future_consumer: B2 — vulnerability-pipeline port gates the CWE fetch]
  vulnerability_osv_offline_store: 604800       # 7 d (cve_manager CVE_TTL_DAYS) [future_consumer: B5 — external-refresh assets wrap the OSV store refresh]
  # -- vcs_health
  vcs_upstream_versions: 604800                 # 7 d (PHASE_K_TTL_DAYS; column github_version_fetched_at)
  vcs_registry_versions: 604800                 # 7 d (PHASE_L_TTL_DAYS; legacy tracks per-registry *_fetched_at — a B-wave story may split per source)
  vcs_live_health: 86400                        # 1 d (PHASE_N_TTL_DAYS; live signals change fast)
  # -- upstream_discovery
  trending_candidates: 86400                    # 1 d (daily discovery cadence, no legacy equivalent) [future_consumer: 13.1]
  # Story 21.4 Tier 1 external-refresh cadences: WEEKLY, matching the sibling
  # vcs_registry_versions / vcs_upstream_versions default for slow-moving
  # package-catalog sources (no legacy equivalent to cite — documented as such).
  # Keyed by the CATALOG ENTRY name (kedro-catalog-check rejects a ttls key that
  # is not a catalog entry — the trending_candidates precedent). Consumed by the
  # three refresh_* trigger nodes in pipelines/upstream_discovery/nodes.py.
  # discovery_aoss_free_python_raw deliberately has NO entry: it is a git-tracked
  # seed (config, not a live fetch — mirrors org_audit_candidates having no ttl).
  discovery_anaconda_dist_2026x_raw: 604800     # 7 d (Anaconda Dist 2026.x release-notes scrape + seed fallback) [future_consumer: 21.4]
  discovery_basilisk_packages_raw: 604800       # 7 d (Basilisk GET /v1/packages catalog walk) [future_consumer: 21.4]
  discovery_aoss_premium_python_raw: 604800     # 7 d (Google AOSS premium-tier Python live doc) [future_consumer: 21.4]
  # Story 21.5 (Tier 2, CDO-ENT-CONDA): WEEKLY, not daily — the about README's
  # maintainer/co-maintainer lists change on a manual refresh cadence, not
  # continuously (mirrors the Story 21.4 sibling cadence above, not
  # trending_candidates's daily one).
  discovery_about_maintainers_raw: 604800       # 7 d (rxm7706/about maintainer-list manual-refresh cadence) [future_consumer: 21.5]
  # Story 21.6 (CAP-3, Phase D identity join): WEEKLY, matching the sibling Tier 1/2
  # external-refresh cadences above — the associator index / OpenTeams board /
  # staged-recipes PR listing all change on a similar not-continuous cadence.
  # discovery_local_recipes_raw deliberately has NO entry: LocalRecipesOverlayDataset
  # is a plain filesystem read (no cadence/staleness — always current).
  purl_associator_mappings_raw: 604800          # 7 d (PURL Associator mappings-index.json bootstrap fetch) [future_consumer: 21.6]
  openteams_project_1_board_raw: 604800         # 7 d (OpenTeams project 1 GraphQL board fetch) [future_consumer: 21.6]
  discovery_staged_recipes_prs_raw: 604800      # 7 d (conda-forge/staged-recipes PR REST listing) [future_consumer: 21.6]

# AD-15 consumer-side freshness contract on derived-layer datasets — a
# CONSUMER gate (refuse-stale), distinct from the fetch TTLs above; never
# conflate the two.
freshness:
  stale_after_days: 14

# `refresh_cadences:` — the SCHEDULE cadence (seconds) for the three § 3.4
# external-refresh assets (Story B5; spine AD-6). DECLARATIVE only: C1 consumes this
# to emit the Dagster Schedules (DW-B5-2); B5 asserts it == the legacy TTLs as a
# fixture (pyforge.atlas.datasets.LEGACY_REFRESH_TTLS; schedule-as-fixture, AC-1).
# `dagster` is NEVER imported in package code (AD-1). Keyed by the catalog store
# dataset name. NEVER conflate with `ttls:` (row-level fetch TTL) or `freshness:`
# (AD-15 consumer gate). All three are WEEKLY (spec §5.4: vdb-refresh /
# update-cve-db / update-mapping-cache weekly).
refresh_cadences:
  vulnerability_vdb_store: 604800          # 7 d (vdb-refresh weekly bootstrap; vuln-db env)
  vulnerability_osv_offline_store: 604800  # 7 d (update-cve-db; cve_manager CVE_TTL_DAYS=7)
  pypi_conda_map_store: 604800             # 7 d (update-mapping-cache; mapping_manager MAPPING_TTL_DAYS=7)

# `org_audit_candidates:` — CAP-4's declared org-audit list (Story 13.4, FR-67). A
# git-tracked, hand-curated list of `{repo_full_name}` entries — config-only, edited
# by hand for a future audit batch with NO code change (`load_org_audit_candidates`
# reads it verbatim; `ttls:` above is the sibling declared-config precedent this
# mirrors). NOT committed current scope per SPEC.md's own non-goal ("Treating the
# June-2026 org-audit package list as committed current scope") — the list below is
# seeded from org-audit-precedent.md's June-2026 Microsoft "material gaps" candidates
# purely as illustrative starting data. Every run RE-VERIFIES each entry fresh against
# the current `pypi_conda_mapping`/`pypi_universe`/`pypi_intelligence_enriched` state
# (the SAME `classify_trending_candidates` classifier CAP-2 uses, reused unchanged):
# an entry that has since shipped independently to conda-forge classifies to
# tier="skip"/reason="already-on-conda-forge" automatically and is dropped, never
# re-proposed (FR-67's literal contract).
org_audit_candidates:
  - repo_full_name: "microsoft/edit"
  - repo_full_name: "microsoft/agent-framework"
  - repo_full_name: "microsoft/qlib"
  - repo_full_name: "microsoft/PyRIT"
  - repo_full_name: "microsoft/promptflow"
  - repo_full_name: "microsoft/semantic-kernel"
  - repo_full_name: "microsoft/torchscale"
  - repo_full_name: "microsoft/SEAL"
  - repo_full_name: "microsoft/DiskANN"

# `artifactory:` — Story 15.3 (CAP-4, Epic 15) fetch config for the
# artifactory_downloads pipeline. `virtual_repos` defaults to EMPTY — the
# committed, functionally-inert default that keeps the pipeline structurally
# wired but contacts no live instance (fetch_artifactory_downloads short-
# circuits to an empty DataFrame with zero ArtifactoryConfig/
# ArtifactoryAqlAdapter construction whenever this list is empty). Real
# config/credential resolution for an actual Artifactory instance is a later,
# attended bring-up — out of scope here (Story 15.1 Design Notes).
artifactory:
  virtual_repos: []
