# pyforge-atlas — endpoint-base + path globals (Story A2; spine AD-2/AD-13, FR-1).
#
# Every external host the pipeline touches resolves through exactly one
# `<HOST>_BASE_URL`-style setting below — the legacy `resolve_*_urls`
# convention carried forward as dataset-level endpoint config. Each value
# is env-var-overridable via the `env_or` resolver registered in
# src/pyforge/atlas/settings.py (explicit env always beats the public
# default). Catalog entries reference these via `${globals:...}` and
# NEVER hardcode a host. New sources add exactly one override point
# (spine "Endpoint overrides" row).
#
# `endpoint_bases` carries EXACTLY the 22 override points, pinned as a
# 19+1+2 STRUCTURE (review-pass P7, extended by Story 21.4): 19 LIVE
# `resolve_*_urls` helpers (cf-atlas-legacy @ b18cbb5; spot-verified
# against the live tree 2026-07-17), the RESERVED 20th, BASILISK_BASE_URL
# (FR-19 — no legacy helper backed it; Story B8 landed the nodes), plus the
# 2 Story 21.4 Tier-1 discovery points (ANACONDA_DIST_BASE_URL,
# AOSS_PREMIUM_BASE_URL — genuinely new v1 work with no legacy helper
# either way, following this header's own "new sources add exactly one
# override point" rule, the same path BASILISK_BASE_URL took). Anaconda
# main channeldata and Basilisk /v1/packages REUSE existing points
# (ANACONDA_CHANNEL_BASE_URL / BASILISK_BASE_URL) — no new global.
# `kedro-catalog-check` asserts the 21-live set and the 1-reserved set
# separately, never a bare 22.
#
# Total env-override surface of this file (P7 accounting, +1 by P9's
# data_root, +2 by Story 21.4, +1 extra_override +1 path by Story 21.6):
# endpoint_bases 27 (19 live + 1 reserved + 2 Story 21.4 + 5 Story 23.1) +
# extra_overrides 4 + fetcher_urls 3 + paths 6 = 40. Pinned
# by tests/catalog (EXPECTED_ENV_OVERRIDE_SURFACE).

endpoint_bases:
  CONDA_FORGE_BASE_URL: ${env_or:CONDA_FORGE_BASE_URL,https://conda.anaconda.org/conda-forge}
  # NOTE: the live resolver reads PYPI_BASE_URL (not PYPI_SIMPLE_BASE_URL as
  # the drafting inventory proposed) — corrected against _http.py L456
  # per AD-17 spot-verification (recorded in the Dev Agent Record).
  PYPI_BASE_URL: ${env_or:PYPI_BASE_URL,https://pypi.org/simple}
  PYPI_JSON_BASE_URL: ${env_or:PYPI_JSON_BASE_URL,https://pypi.org}
  GITHUB_BASE_URL: ${env_or:GITHUB_BASE_URL,https://github.com}
  GITHUB_RAW_BASE_URL: ${env_or:GITHUB_RAW_BASE_URL,https://raw.githubusercontent.com}
  NPM_BASE_URL: ${env_or:NPM_BASE_URL,https://registry.npmjs.org}
  CRAN_BASE_URL: ${env_or:CRAN_BASE_URL,https://crandb.r-pkg.org}
  CPAN_BASE_URL: ${env_or:CPAN_BASE_URL,https://fastapi.metacpan.org}
  LUAROCKS_BASE_URL: ${env_or:LUAROCKS_BASE_URL,https://luarocks.org}
  CRATES_BASE_URL: ${env_or:CRATES_BASE_URL,https://crates.io}
  RUBYGEMS_BASE_URL: ${env_or:RUBYGEMS_BASE_URL,https://rubygems.org}
  MAVEN_BASE_URL: ${env_or:MAVEN_BASE_URL,https://search.maven.org}
  NUGET_BASE_URL: ${env_or:NUGET_BASE_URL,https://api.nuget.org}
  ENDOFLIFE_BASE_URL: ${env_or:ENDOFLIFE_BASE_URL,https://endoflife.date}
  GITHUB_API_BASE_URL: ${env_or:GITHUB_API_BASE_URL,https://api.github.com}
  GITLAB_API_BASE_URL: ${env_or:GITLAB_API_BASE_URL,https://gitlab.com/api/v4}
  CODEBERG_API_BASE_URL: ${env_or:CODEBERG_API_BASE_URL,https://codeberg.org/api/v1}
  ANACONDA_CHANNEL_BASE_URL: ${env_or:ANACONDA_CHANNEL_BASE_URL,https://conda.anaconda.org}
  S3_PARQUET_BASE_URL: ${env_or:S3_PARQUET_BASE_URL,https://anaconda-package-data.s3.amazonaws.com}
  BASILISK_BASE_URL: ${env_or:BASILISK_BASE_URL,https://api.basilisk.prefix.dev}
  # Story 21.4 (Tier 1, CAP-2). ANACONDA_DIST_BASE_URL: the anaconda.com docs host
  # whose /docs/getting-started/anaconda/release/2026.x page carries the Anaconda
  # Distribution 2026.x package table (live-verified 2026-08-30: 639 rows).
  # AOSS_PREMIUM_BASE_URL: the Google Cloud docs host whose
  # /security-command-center/docs/aoss-supported-packages-premium page lists the
  # Assured OSS premium-tier Python packages (live 2026-08-30: 2,156 names — the
  # live page works; the inventory quartet's Wayback snapshot URL is not needed).
  # The free-tier list on the same host is a git-tracked seed (air-gap), not a
  # fetch, so it declares no override point.
  ANACONDA_DIST_BASE_URL: ${env_or:ANACONDA_DIST_BASE_URL,https://www.anaconda.com}
  AOSS_PREMIUM_BASE_URL: ${env_or:AOSS_PREMIUM_BASE_URL,https://docs.cloud.google.com}
  # Story 23.1 (Tier 3 OS bulk indexes): host bases for the five discovery_*
  # external-refresh datasets routed to pypi_intelligence.
  HOMEBREW_BASE_URL: ${env_or:HOMEBREW_BASE_URL,https://formulae.brew.sh}
  NIXPKGS_BASE_URL: ${env_or:NIXPKGS_BASE_URL,https://channels.nixos.org}
  SPACK_RAW_BASE_URL: ${env_or:SPACK_RAW_BASE_URL,https://raw.githubusercontent.com}
  DEBIAN_BASE_URL: ${env_or:DEBIAN_BASE_URL,https://deb.debian.org}
  FEDORA_SRC_BASE_URL: ${env_or:FEDORA_SRC_BASE_URL,https://src.fedoraproject.org}

# Additional overrides that ARE current data access but are NOT among the
# 22 endpoint_bases points (19 legacy-helper-backed + 1 reserved + 2 Story
# 21.4). kedro-catalog-check asserts these separately:
#   ANACONDA_API_BASE_URL — Phase F's v7.8.0-era direct env override on the
#     anaconda-api download path (gap A2-G2; live-verified 2026-07-17 at
#     conda_forge_atlas.py L2651/2659/2816/3588).
#   OSV_VULNS_BUCKET_URL — offline-OSV store refresh endpoint (§ 3.4
#     store 2; cve_manager._osv_vulns_bucket_base; Story B5 wraps the
#     refresh as a scheduled asset).
#   BIGQUERY_BASE_URL — Phase P connection base (admin opt-in; the story
#     inventory's "connection config" row — not a helper-backed point; the
#     pypi_bigquery_downloads_raw entry stays a resolvable standard type
#     until the Phase P port story flips it to pandas.GBQQueryDataset —
#     judgment A2-J1).
#   PURL_ASSOCIATOR_BASE_URL — the prefix-dev.github.io Pages host behind
#     purl_associator_mappings_raw (Story 21.6, CAP-3 identity join). A NEW
#     host, not one of the 20 helper-backed endpoint_bases — mirrors how
#     ANACONDA_API_BASE_URL/OSV_VULNS_BUCKET_URL were added above.
extra_overrides:
  ANACONDA_API_BASE_URL: ${env_or:ANACONDA_API_BASE_URL,https://api.anaconda.org}
  OSV_VULNS_BUCKET_URL: ${env_or:OSV_VULNS_BUCKET_URL,https://osv-vulnerabilities.storage.googleapis.com}
  BIGQUERY_BASE_URL: ${env_or:BIGQUERY_BASE_URL,https://bigquery.googleapis.com/bigquery/v2}
  PURL_ASSOCIATOR_BASE_URL: ${env_or:PURL_ASSOCIATOR_BASE_URL,https://prefix-dev.github.io}

# Full feed URLs for the three vulnerability side-catalogs (the inventory's
# "fetcher URL setting" rows — full URLs, not host bases, so they live
# outside the 20-count). Values verified against the live fetcher scripts
# (cisa_kev_fetcher.py / epss_fetcher.py / cwe_catalog_fetcher.py).
fetcher_urls:
  CISA_KEV_URL: ${env_or:CISA_KEV_URL,https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
  EPSS_FEED_URL: ${env_or:EPSS_FEED_URL,https://epss.empiricalsecurity.com/epss_scores-current.csv.gz}
  CWE_CATALOG_URL: ${env_or:CWE_CATALOG_URL,https://cwe.mitre.org/data/csv/1000.csv.zip}

# Filesystem roots. Pipeline-owned persisted outputs live under the
# `data/<layer>/<dataset_name>/` root (spine Parquet-layout row; nodes
# never choose physical layout).
#
# Review-pass P9: relative dataset paths resolve against the PROCESS CWD,
# not against conf/ — and the documented invocation is the pixi task run
# from the REPO ROOT, so every default below is repo-root-relative (the
# old `../../../../` escapes silently depended on a member-dir CWD nobody
# uses). kedro-catalog-check asserts no resolved default escapes the repo
# root. `data_root` is env-overridable like every other path (P9).
#
# CORRECTION (Story 21.8, DW-FU-21-2): the "documented invocation... from the
# REPO ROOT" premise above does not hold for the one real `kedro run` this
# project has — `pyforge-atlas-bootstrap` sets pixi `cwd =
# "src/shared/packages/pyforge-atlas"` (the Kedro member dir; Kedro's own
# project-root discovery requires it). Kedro's `_convert_paths_to_absolute_
# posix` absolutizes every relative `filepath`/`path` catalog value against
# its `project_path` — the member dir — never an assumed repo-root CWD.
# `data_root` (member-relative by design, README "member default") and the
# three derived store paths already resolve correctly under that real
# behavior. `seed_root` did not: a live end-to-end bootstrap run (Story
# 21.8) reproduced the exact `DatasetError` DW-FU-21-2 predicted, so its
# default below is now the member-dir-relative equivalent (a genuine, still-
# needed `../../../../` escape to the true repo root — NOT the same class of
# escape this comment used to disparage, which was about the THREE store
# paths that no longer need to leave the member dir at all).
#
# Story 21.1 (CAP-1, "relocate atlas data defaults"): the three § 3.4
# external-refresh stores used to default OUTSIDE the member, at the
# legacy conda-forge-expert homes (`.claude/data/conda-forge-expert/…`),
# each with its OWN dedicated env override (`VDB_STORE_PATH`, etc.). That
# made Kedro a passenger on a legacy store a fresh clone doesn't have.
# They now live UNDER `${paths.data_root}/stores/…` — a plain (non-
# `env_or`) OmegaConf self-reference to the `data_root` key above, resolved
# within this SAME globals.yml document before the `${globals:...}`
# resolver in catalog.yml ever sees it. There is deliberately no dedicated
# `VDB_STORE_PATH`-style override left for these three any more: the ONE
# override point is `PYFORGE_ATLAS_DATA_ROOT` (spec Boundaries "Always" —
# "All store paths resolve under override"). `pyforge-atlas-bootstrap`
# creates the two directory stores (`stores/vdb`, `stores/osv`) up front;
# the flat `stores/pypi_conda_map.json` file is created on first export.
# Legacy `.claude/data/conda-forge-expert/` keeps working for
# conda-forge-expert's OWN tooling — this only removes Kedro's dependency
# on it (Story 21.2 removes the `cf_atlas.db` SEED dependency separately).
paths:
  data_root: ${env_or:PYFORGE_ATLAS_DATA_ROOT,data}
  # DW-FU-21-2 fix (Story 21.8): member-dir-relative so Kedro's real
  # project_path-anchored resolution lands on the true repo-root seed
  # directory (../../../../ = pyforge-atlas -> packages -> shared -> src ->
  # repo root). PYFORGE_ATLAS_SEED_ROOT still overrides with an absolute
  # path exactly as before — only the shipped default changed.
  seed_root: ${env_or:PYFORGE_ATLAS_SEED_ROOT,../../../../.claude/skills/conda-forge-expert/data}
  vdb_store: ${paths.data_root}/stores/vdb
  osv_offline_store: ${paths.data_root}/stores/osv
  pypi_conda_map: ${paths.data_root}/stores/pypi_conda_map.json
  # Story 21.6 (CAP-3 identity join): the live recipes/ tree LocalRecipesOverlayDataset
  # scans (discovery_local_recipes_raw) — resolves against the process CWD like every
  # other path here, but its REAL invocation differs from data_root/seed_root's: a live
  # `kedro run` (the `pyforge-atlas-bootstrap` pixi task, or a manual `cd
  # src/shared/packages/pyforge-atlas && kedro run`) runs with cwd = the KEDRO PROJECT
  # ROOT (the pyforge-atlas member dir), not the repo root — `kedro` requires its own
  # `conf/`/`pyproject.toml` under cwd. `recipes/` only exists at the actual repo root
  # (verified: no `src/shared/packages/pyforge-atlas/recipes`), four levels above the
  # member dir (pyforge-atlas -> packages -> shared -> src -> repo root) — a bare
  # `recipes` default would silently resolve to an always-empty directory on every real
  # run (review finding). `local_recipes_dir` is therefore member-dir-relative, unlike
  # data_root/seed_root above (repo-root-relative, correct for the pytest-based gates,
  # which run with cwd = repo root) — see tests/catalog/conftest.py's
  # MEMBER_DIR_RELATIVE_PATHS for the containment check this asymmetry requires.
  local_recipes_dir: ${env_or:PYFORGE_ATLAS_LOCAL_RECIPES_DIR,../../../../recipes}
