[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-atlas"
version = "0.1.0"
description = "Kedro/Dagster/DuckDB data-pipeline migration of the cf_atlas orchestrator (pyforge.atlas namespace package beside pyforge.warden)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Lean runtime deps (A1-A2): only what the package imports after Story A1 —
# the full FR-15 stack lives in the pixi envs (root [feature.pyforge-atlas] +
# local-recipes), not in wheel metadata, until stories actually import each
# library (Simplicity First; warden lean-dep doctrine).
dependencies = [
    "kedro>=1.5.0",  # floor matches [tool.kedro] kedro_init_version + the conda run-dep
    # Story A2 (A2-A5): conf/base/catalog.yml declares kedro_datasets types
    # (api.APIDataset / pandas.ParquetDataset / partitions.PartitionedDataset /
    # json / yaml / text) — catalog resolution imports kedro_datasets, so it is
    # a real runtime dependency of the package, not just a pixi-env dep.
    "kedro-datasets>=9.5.0",  # floor matches the member pixi.toml run-dep
    # AUD-REPO-001: present in the member pixi.toml run-deps but missing here, so
    # the WHEEL did not declare it while `orchestration/definitions.py` imports
    # `kedro_dagster` at module level. Restores the "byte-for-byte in step with
    # the member pixi.toml" invariant the block below states.
    "kedro-dagster>=0.7.0",
    # --- AUD-ATLAS-010 (2026-07-27): dependency completeness --------------
    # Kept byte-for-byte in step with the member pixi.toml run-dependencies;
    # PyPI distribution names differ from the conda names in four places, noted
    # inline. Derived by AST scan of module-level imports, floors pinned to the
    # versions resolved in the working env. See the pixi.toml block for the
    # lean-env tension this deliberately accepts.
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "PyYAML>=6.0.3",                  # conda: pyyaml — imported as `yaml`
    "pydantic>=2.13.4",
    "attrs>=26.1.0",                  # imported as `attr`
    "duckdb>=1.5.5",
    "ibis-framework>=12.0.0",
    "pandera>=0.32.1",
    # Story 10.6 (AD-23): `admission.py` imports `filelock` at MODULE level for the
    # per-output-dataset run-admission lock. It was already IN the env — but only
    # TRANSITIVELY, via dagster and ibis-framework-core. AUD-ATLAS-010's doctrine is
    # that an undeclared module-level import is a runtime dependency whether or not
    # the manifest says so, so it is declared here. No new package enters the env.
    "filelock>=3.32.0",
    "vizro>=0.1.59",
    "dagster>=1.13.15",
    # `boring-semantic-layer` is intentionally ABSENT — PyPI-only (no conda-forge
    # candidate), so it cannot be a conda run-dep and is supplied to the env
    # instead. Kept out of the wheel metadata too, so both manifests agree.
    # See the member pixi.toml for the recorded residual.
    "openlineage-python>=1.52.0",     # imported as `openlineage`
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "a2a-sdk>=1.1.2",                 # imported as `a2a`
]

[project.optional-dependencies]
# AC-8: the ONLY cross-package code edge — atlas -> warden (ComplianceReport
# schema/validators, consumed at F4). Installed by default in the in-repo
# `pyforge-atlas` pixi env; external installs may omit it (the F4 gate node
# then fails with an install hint while everything else runs). No reverse
# warden -> atlas import exists.
gate = ["pyforge-warden"]

[project.scripts]
pyforge-atlas = "pyforge.atlas.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.kedro]
package_name = "pyforge.atlas"
project_name = "pyforge-atlas"
kedro_init_version = "1.5.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"
