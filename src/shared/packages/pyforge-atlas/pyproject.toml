[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-atlas"
version = "0.1.0"
description = "Kedro/Dagster/DuckDB data-pipeline migration of the cf_atlas orchestrator (pyforge.atlas namespace package beside pyforge.warden)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Lean runtime deps (A1-A2): only what the package imports after Story A1 —
# the full FR-15 stack lives in the pixi envs (root [feature.pyforge-atlas] +
# local-recipes), not in wheel metadata, until stories actually import each
# library (Simplicity First; warden lean-dep doctrine).
dependencies = [
    "kedro>=1.5.0",  # floor matches [tool.kedro] kedro_init_version + the conda run-dep
    # Story A2 (A2-A5): conf/base/catalog.yml declares kedro_datasets types
    # (api.APIDataset / pandas.ParquetDataset / partitions.PartitionedDataset /
    # json / yaml / text) — catalog resolution imports kedro_datasets, so it is
    # a real runtime dependency of the package, not just a pixi-env dep.
    "kedro-datasets>=9.5.0",  # floor matches the member pixi.toml run-dep
    # AUD-REPO-001: present in the member pixi.toml run-deps but missing here, so
    # the WHEEL did not declare it while `orchestration/definitions.py` imports
    # `kedro_dagster` at module level. Restores the "byte-for-byte in step with
    # the member pixi.toml" invariant the block below states.
    "kedro-dagster>=0.7.0",
    # --- AUD-ATLAS-010 (2026-07-27): dependency completeness --------------
    # Kept byte-for-byte in step with the member pixi.toml run-dependencies;
    # PyPI distribution names differ from the conda names in four places, noted
    # inline. Derived by AST scan of module-level imports, floors pinned to the
    # versions resolved in the working env. See the pixi.toml block for the
    # lean-env tension this deliberately accepts.
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "PyYAML>=6.0.3",                  # conda: pyyaml — imported as `yaml`
    "pydantic>=2.13.4",
    "attrs>=26.1.0",                  # imported as `attr`
    "duckdb>=1.5.5",
    "ibis-framework>=12.0.0",
    "pandera>=0.32.1",
    # Story 10.6 (AD-23): `admission.py` imports `filelock` at MODULE level for the
    # per-output-dataset run-admission lock. It was already IN the env — but only
    # TRANSITIVELY, via dagster and ibis-framework-core. AUD-ATLAS-010's doctrine is
    # that an undeclared module-level import is a runtime dependency whether or not
    # the manifest says so, so it is declared here. No new package enters the env.
    "filelock>=3.32.0",
    "vizro>=0.1.59",
    "dagster>=1.13.15",
    # `boring-semantic-layer` is intentionally ABSENT — PyPI-only (no conda-forge
    # candidate), so it cannot be a conda run-dep and is supplied to the env
    # instead. Kept out of the wheel metadata too, so both manifests agree.
    # See the member pixi.toml for the recorded residual.
    "openlineage-python>=1.52.0",     # imported as `openlineage`
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "a2a-sdk>=1.1.2",                 # imported as `a2a`
    # Story 13.1 (CAP-1): `datasets/upstream_discovery.py` imports `bs4` at MODULE level
    # (the GitHub-trending HTML scrape, stdlib `html.parser` backend — no lxml). Kept
    # byte-for-byte in step with the member pixi.toml run-dependencies (AUD-ATLAS-010).
    "beautifulsoup4>=4.15.0",         # imported as `bs4`
    # Story 14.2 (CAP-2): admission.py/factory/lasuite.py/datasets/{basilisk,
    # migration_status,refresh}.py's mandatory run-dep (atomic_write/atomic_write_text).
    "pyforge-core",
    # Story 14.1 (CAP-1): `views/render.py` hard-imports bokeh to render each static
    # view's `list[dict]` rows as a self-contained `bokeh.embed.components()`
    # script+div fragment. Floor matches the root pixi.toml `bokeh` pin already used
    # by `local-recipes`.
    "bokeh>=3.9.2",
    # Story 14.3 (CAP-2): `views/live.py` hard-imports `bokeh.server.server.Server`
    # (Tornado-backed) and `views/asgi.py` hard-imports `starlette` for the ASGI mounting
    # layer. Kept byte-for-byte in step with the member pixi.toml run-dependencies
    # (AUD-ATLAS-010) — floors pinned to the versions resolved in the working env.
    "tornado>=6.5.8",
    "starlette>=1.6.0",
]

[project.optional-dependencies]
# AC-8: the ONLY cross-package code edge — atlas -> warden (ComplianceReport
# schema/validators, consumed at F4). Installed by default in the in-repo
# `pyforge-atlas` pixi env; external installs may omit it (the F4 gate node
# then fails with an install hint while everything else runs). No reverse
# warden -> atlas import exists.
gate = ["pyforge-warden"]

[project.scripts]
pyforge-atlas = "pyforge.atlas.__main__:main"

# CAP-18 / story 18.1: register today's Kedro backends as default plugins on
# the canonical FR-43 group only. Never add pyforge.atlas.hooks / .plugins.
[project.entry-points."pyforge.core.hooks"]
atlas-catalog-ttl = "pyforge.atlas.cap18:CatalogTtlPlugin"
atlas-pipeline-observability = "pyforge.atlas.cap18:PipelineObservabilityPlugin"
atlas-node-observability = "pyforge.atlas.cap18:NodeObservabilityPlugin"
atlas-node-validation = "pyforge.atlas.cap18:NodeValidationPlugin"
atlas-pipeline-admission = "pyforge.atlas.cap18:PipelineAdmissionPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.kedro]
package_name = "pyforge.atlas"
project_name = "pyforge-atlas"
kedro_init_version = "1.5.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the lint gate `pixi run -e pyforge-guild ruff`
# / `ruff-format` reads THIS block (run from inside the package). Line width is ruff format's job;
# E501 is off because 290 legacy long strings/comments predate the gate -- format keeps code at 120.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"**/tests/**" = ["E402"]    # test modules that bootstrap sys.path before importing the package

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the type gate `pixi run -e pyforge-guild mypy`
# reads THIS block (run from inside the package). The [[tool.mypy.overrides]] entries below are the
# 2026-09-20 baseline: every finding the gate met on its first run, disabled PER MODULE with exactly
# the error codes that module trips -- never `ignore_errors` -- so the gate is live for every other
# module and every other code. Tighten or drop an entry whenever its module is touched.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true   # `pyforge` is a namespace package (no src/pyforge/__init__.py)
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Sibling stations and bmad_loop ship no py.typed marker; their imports are checked as untyped, not refused.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.a2a.schema"
disable_error_code = ["assignment", "return-value"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.dashboard.factory_status"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.basilisk"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.identity_sources"
disable_error_code = ["assignment", "misc"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.refresh"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.request_datasets"
disable_error_code = ["misc", "union-attr"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.tier3_sources"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.upstream_discovery"
disable_error_code = ["assignment", "misc", "var-annotated"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.vcs_sources"
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.datasets.vulnerability_feeds"
disable_error_code = ["dict-item"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.factory.crews"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.factory.personas"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.mcp.parity"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.mcp.server"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.nl.backend"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.pipelines.derived_artifacts.nodes"
disable_error_code = ["assignment", "type-var"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.pipelines.pypi_intelligence.nodes"
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.pipelines.upstream_discovery.nodes"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.pipelines.vcs_health.nodes"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.pipelines.vulnerability.nodes"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.trending_candidates.__main__"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "pyforge.atlas.trending_candidates.handoff_main"
disable_error_code = ["union-attr"]
