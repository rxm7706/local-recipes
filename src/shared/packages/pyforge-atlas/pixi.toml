# pyforge-atlas (Atlas) — pixi build workspace member (warden mirror, Story A1).
#
# This is a MEMBER package of the parent `staged-recipes` workspace: there is
# deliberately NO [workspace] table here. The root ../../../../pixi.toml owns
# workspace config (channels, platforms, environments, the `preview = ["pixi-build"]`
# flag) and pulls this package in via a path dependency in the
# `[feature.pyforge-atlas.dependencies]` table. `pixi-build-python` builds
# this into a conda package.
#
# The Kedro pipeline implementation (Waves A–H) is delivered story-by-story
# against docs/specs/cfe-atlas-datapipeline-kedro-migration.md.

[package]
name = "pyforge-atlas"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.host-dependencies]
python = ">=3.14"          # atlas floor is 3.14 BY DESIGN (warden's is 3.12 — do not "fix")
hatchling = "*"

# Conda-forge run set: what the lean `pyforge-atlas` env needs so `kedro-test`
# (import smokes + Kedro bootstrap seam) passes. Test-only tools (pytest,
# python-build) live at FEATURE level in the root pixi.toml, mirroring warden's
# split. pyforge-warden is deliberately NOT a package run-dep (review 2026-07-17,
# A1-A5 alternative route): baking it into the built .conda would make the
# optional [gate] extra mandatory for external consumers (AC-8: both tools stay
# independently installable). In-repo default install happens at FEATURE level
# in the root pixi.toml instead.
[package.run-dependencies]
python = ">=3.14"
kedro = ">=1.5.0"
kedro-datasets = ">=9.5.0"
kedro-dagster = ">=0.7.0"    # py3.14-unclassified glue — kedro-test import smoke target (AD-16)

# --- AUD-ATLAS-010 (2026-07-27): dependency completeness -------------------
# The package declared 3 run-deps while `pyforge.atlas` HARD-IMPORTS 19
# third-party modules at MODULE level (derived by AST scan of src/pyforge/atlas,
# not from the audit's list). The consequence was concrete: `kedro-test` could
# not collect its own suite — 17 collection errors. An undeclared module-level
# import is a runtime dependency whether or not the manifest says so.
#
# Floors are pinned to the versions resolved in the working `local-recipes` env
# on 2026-07-27, so the declaration is evidence-based rather than aspirational.
#
# TENSION, recorded deliberately: the Spec calls for a LEAN package env so loop
# worktrees never materialize the fat repo env. These are declared anyway
# because they are imported unconditionally — a bare install doing
# `from pyforge.atlas.semantic import metrics` would crash otherwise. Narrowing
# this to optional extras + lazy imports is real work and belongs in its own
# story, not smuggled into a dependency fix.
pandas = ">=3.0.3"
pyarrow = ">=24.0.0"
pyyaml = ">=6.0.3"                    # imported as `yaml`
pydantic = ">=2.13.4"                 # pydantic_core arrives with it
attrs = ">=26.1.0"                    # imported as `attr` (observability.py)
duckdb = ">=1.5.5"
ibis-framework = ">=12.0.0"
pandera = ">=0.32.1"
# Story 10.6 (AD-23): `admission.py` imports `filelock` at MODULE level for the
# per-output-dataset run-admission lock. Already in the env, but only TRANSITIVELY
# (via dagster + ibis-framework-core) — AUD-ATLAS-010: an undeclared module-level
# import is a runtime dependency whether or not the manifest says so. Kept
# byte-for-byte in step with the pyproject.toml [project].dependencies entry.
filelock = ">=3.32.0"
vizro = ">=0.1.59"
dagster = ">=1.13.15"
# NOT declarable here: `boring_semantic_layer`. It is one of the Spec's two
# recorded PyPI-only exceptions (with `kedro-mcp`) and has no conda-forge
# candidate — the solve fails on osx-arm64-min. A conda package's run-deps must
# be conda packages, so it is supplied to the ENV instead (root
# [feature.pyforge-atlas.pypi-dependencies]).
# RESIDUAL, recorded honestly: `semantic/models.py` hard-imports it at module
# level, so a pure-conda install of pyforge-atlas cannot import that module.
# Closing that needs a lazy/guarded import, not a dependency line. The audit did
# not raise this; it surfaced while fixing AUD-ATLAS-010 (2026-07-27).
openlineage-python = ">=1.52.0"       # imported as `openlineage`
opentelemetry-api = ">=1.44.0"
opentelemetry-sdk = ">=1.44.0"
a2a-sdk = ">=1.1.2"                   # imported as `a2a`; brings the `google` namespace
