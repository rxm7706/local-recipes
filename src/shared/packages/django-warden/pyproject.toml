[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "django-warden"
version = "0.1.0"
description = "Warden station portal (reusable Django app): fabric models, upload face, chrome page."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
dependencies = ["django>=5.1,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_warden_fabric"]
