[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-scribe"
version = "0.1.0"
description = "Direct-capture CLI for checked-in team memory (.claude/memory/) -- the append-only write path for team-relevant decisions, ADRs, and project state."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Wave 1 (Story 1.1) is a lean, targeted dependency set: typer for the CLI
# surface, pydantic for the CaptureRecord model. Zero required network calls
# (AD-6) -- capture is pure local file I/O.
dependencies = [
    "typer>=0.27.0",
    "pydantic>=2.13.4",
    "pyforge-core",
]

[project.optional-dependencies]
# Story 33.2 (spec-pyforge-scribe CAP-28): each extra takes the pin the estate carries for it in the root
# pixi.toml's [feature.pyforge-scribe.dependencies], cap included; tests/meta/test_package_metadata_matches_estate.py
# holds them equal. psycopg stays under the PostgreSQL 17 cap (fnd:CAP-12): 3.2.11+ needs libpq 18.
postgres = ["psycopg>=3.2.10,<3.2.11"]
# Story 6.1: the graphify `compile_surface` ingest extra -- off by default
# (AD-6, air-gap); `pyforge.scribe.extras.graphify` imports it lazily.
graphify = ["graphifyy>=0.9.89"]
# Story 6.2: the cocoindex `compile_surface` incremental-ingest extra -- off
# by default (AD-6, air-gap); `pyforge.scribe.extras.cocoindex_flow` imports
# it lazily, and only calls its standalone `memo_fingerprint` primitive
# (never the reactive App/Runner/component runtime -- see that module's
# docstring).
cocoindex = ["cocoindex>=1.0.25"]

[project.scripts]
scribe = "pyforge.scribe.cli:main"

[project.entry-points."pyforge.core.hooks"]
scribe-graphstore-flatfile = "pyforge.scribe.graph_store:FlatFileGraphStorePlugin"
scribe-graphstore-pg = "pyforge.scribe.graph_store_pg:PostgresGraphStorePlugin"
scribe-graphstore-plane = "pyforge.scribe.graph_store_plane:PlaneGraphStorePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 33.1 (spec-pyforge-scribe CAP-31, relay of spec-pyforge-steward:CAP-175): a module that reads the live tree
# outside this package carries `pytestmark = pytest.mark.live_tree`, in the wording steward and doctor use; a test that
# needs the server carries `postgres`. tests/meta/test_live_tree_split.py holds both, and the closed list of skip sites.
markers = [
    "live_tree: the module reads the repository outside its own package (planning artifacts, docs, pixi.toml, the workflows, other stations); it runs in the station's live-tree half and fires on what it reads",
    "postgres: needs PostgreSQL 17 with pgvector at SCRIBE_GRAPH_DSN; fails, never skips, when the server is absent",
]

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the lint gate `pixi run -e pyforge-guild ruff`
# / `ruff-format` reads THIS block (run from inside the package). Line width is ruff format's job;
# E501 is off because 290 legacy long strings/comments predate the gate -- format keeps code at 120.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"**/tests/**" = ["E402"]    # test modules that bootstrap sys.path before importing the package

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the type gate `pixi run -e pyforge-guild mypy`
# reads THIS block (run from inside the package). The [[tool.mypy.overrides]] entries below are the
# 2026-09-20 baseline: every finding the gate met on its first run, disabled PER MODULE with exactly
# the error codes that module trips -- never `ignore_errors` -- so the gate is live for every other
# module and every other code. Tighten or drop an entry whenever its module is touched.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true   # `pyforge` is a namespace package (no src/pyforge/__init__.py)
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Sibling stations and bmad_loop ship no py.typed marker; their imports are checked as untyped, not refused.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pyforge.scribe.extras.graphify"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "pyforge.scribe.promote"
disable_error_code = ["arg-type"]
