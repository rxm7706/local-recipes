[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "django-marshal"
version = "0.1.0"
description = "Marshal station portal (reusable Django app): list provisioned loop homes."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
dependencies = ["django>=5.1,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_marshal_portal"]
