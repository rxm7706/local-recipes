[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-warden"
version = "0.1.0"
description = "Unified dependency-hygiene + vulnerability scanner orchestrating deptry and osv-scanner over Python/Conda/Pixi manifests."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# The scanning engines (deptry, osv-scanner) are conda run-dependencies (see
# pixi.toml). The library uses a lean, targeted dependency set (revised
# architecture: lean-not-stdlib-only) — pure-stdlib as fallback, no execution
# of untrusted input (NFR-S1: yaml.safe_load only, no jinja-render).
dependencies = [
    "PyYAML",
    "packaging",
    "cyclonedx-python-lib",
    "jsonschema",
    "packageurl-python",
    "license-expression",
    "pyforge-core",
]
# Story 9.1/9.2: plugin registration is pyforge.core.hooks only
# (ENTRY_POINT_GROUP). Do not add [project.entry-points."pyforge.warden.hooks"]
# or [project.entry-points."pyforge.warden.plugins"].

[project.scripts]
warden = "pyforge.warden.cli:main"

[project.entry-points."pyforge.core.hooks"]
warden-null = "pyforge.warden.scanner_plugins:NullScanPlugin"
warden-deptry = "pyforge.warden.scanner_plugins:DeptryScanPlugin"
warden-osv = "pyforge.warden.scanner_plugins:OsvScanPlugin"
warden-license = "pyforge.warden.scanner_plugins:LicenseScanPlugin"
warden-currency = "pyforge.warden.scanner_plugins:CurrencyScanPlugin"
warden-checkmarx = "pyforge.warden.scanner_plugins:CheckmarxScanPlugin"
warden-sonar = "pyforge.warden.scanner_plugins:SonarScanPlugin"
warden-blackduck = "pyforge.warden.scanner_plugins:BlackduckScanPlugin"
warden-ghas = "pyforge.warden.scanner_plugins:GhasScanPlugin"
warden-profile-local = "pyforge.warden.scanner_plugins:ProfileLocalScanPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 5.2: the render-based full-corpus differential-oracle
# (test_extraction_oracle.py) and the full-corpus real-engine determinism
# proof (test_corpus_determinism.py) are dominated by real
# rattler-build/conda-build renders or a real osv-scanner subprocess over
# ~1,979 recipes -- too slow for the default pyforge-warden-test task
# (pixi.toml passes -m "not slow" there) to stay a sub-minute loop. They
# still run, just via the separate pyforge-warden-test-corpus-oracle task
# (-m slow).
markers = ["slow: corpus-scale test dominated by real renders/subprocesses (pyforge-warden-test-corpus-oracle task, not the default suite)"]

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the lint gate `pixi run -e pyforge-guild ruff`
# / `ruff-format` reads THIS block (run from inside the package). Line width is ruff format's job;
# E501 is off because 290 legacy long strings/comments predate the gate -- format keeps code at 120.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"**/tests/**" = ["E402"]    # test modules that bootstrap sys.path before importing the package

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the type gate `pixi run -e pyforge-guild mypy`
# reads THIS block (run from inside the package). The [[tool.mypy.overrides]] entries below are the
# 2026-09-20 baseline: every finding the gate met on its first run, disabled PER MODULE with exactly
# the error codes that module trips -- never `ignore_errors` -- so the gate is live for every other
# module and every other code. Tighten or drop an entry whenever its module is touched.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true   # `pyforge` is a namespace package (no src/pyforge/__init__.py)
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Sibling stations and bmad_loop ship no py.typed marker; their imports are checked as untyped, not refused.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pyforge.warden.cli"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "pyforge.warden.currency"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "pyforge.warden.extract.meta_v0"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "pyforge.warden.license"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.warden.report"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "pyforge.warden.scanner_plugins"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "pyforge.warden.verdict"
disable_error_code = ["arg-type"]
