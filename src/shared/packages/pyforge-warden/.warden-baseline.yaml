# pyforge-warden's own dogfood baseline (Story 5.2, epics.md AC3).
#
# This package's pyproject.toml deliberately declares its dependencies
# WITHOUT exact version pins (a library convention, revised architecture's
# "lean, targeted dependency set") and ships no lockfile of its own — so
# Warden's vulnerability/currency axes cannot resolve a concrete version to
# match against the offline OSV DB / endoflife.date snapshot for any of
# them (indeterminate:no-version:/currency:unknown:), and the dogfood scan
# runs with no ambient OSV DB provisioned either
# (indeterminate:offline-db-unavailable:) — the same honest "we don't know"
# signal any Warden-scanned project would get if it were also unpinned and
# unprovisioned. These are grandfathered here, NOT suppressed via
# --warn-only/--fail-under-coverage, so they stay individually visible
# (report.render_text still lists every one) while letting the gate
# proceed on this package's REAL signal: hygiene (deptry) and any
# resolvable license/currency/vulnerability finding for a dependency that
# DOES carry enough information to assess. A genuinely NEW finding (a
# different id — e.g. a newly-added, actually-unused dependency, or an
# import missing from dependencies) is UNAFFECTED by this file and still
# gates normally (test_dogfood.py's seeded-violation half proves this).
#
# Regenerate via: warden scan src/shared/packages/pyforge-warden --baseline-emit
# (review the printed stanza before replacing this file — never blind-copy).
