# pyforge-warden (Warden) — pixi build workspace member (Option B).
#
# This is a MEMBER package of the parent `staged-recipes` workspace: there is
# deliberately NO [workspace] table here. The root ../../../../pixi.toml owns
# workspace config (channels, platforms, environments, the `preview = ["pixi-build"]`
# flag) and pulls this package in via a path dependency in the
# `[feature.pyforge-warden.dependencies]` table. `pixi-build-python` builds
# this into a conda package.
#
# The E1–E4 implementation (extractor, deptry/osv-scanner runners,
# schema-validated ComplianceReport, argparse CLI + exit gate) is delivered by
# bmad-quick-dev against docs/specs/pyforge-warden.md.

[package]
name = "pyforge-warden"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.host-dependencies]
python = ">=3.12"          # explicit build-time interpreter for pixi-build-python (Gemini PR#49)
hatchling = "*"

# Runtime engines are provisioned as conda packages (NFR1/NFR2) — never
# curl-fetched at runtime (OD1). osv-scanner + deptry are consumed from the
# existing conda-forge feedstocks. The library uses a lean, targeted dep set
# (revised architecture): pyyaml, packaging, cyclonedx-python-lib, jsonschema.
# license-expression (Story 6.2): SPDX license-expression parsing/
# normalization for the license axis (license.py) — unpinned.
#
# deptry/osv-scanner (Story 6.6, this pixi.toml's recorded owner — closes
# review-T-a's previously-unowned mitigation): range-pinned, not exact-pinned
# (NFR-C1 — engines come from feedstocks), to the exact minor each already
# has in-repo output-schema evidence for (deptry 0.25.1 — hygiene.py's
# DEP005 docstring; osv-scanner 2.4.0 — vuln.py's "Empirically-verified
# 2.4.0 shape" docstring). engines.py's DEPTRY_VERSION_RANGE/
# OSV_SCANNER_VERSION_RANGE constants must stay in sync with these two
# lines — enforced by tests/meta/test_engine_version_range_sync.py.
[package.run-dependencies]
python = ">=3.12"
deptry = ">=0.25.1,<0.26"
osv-scanner = ">=2.4.0,<2.5"
pyyaml = "*"
packaging = "*"
cyclonedx-python-lib = "*"
jsonschema = "*"
# AUD-WARDEN-010: declared in pyproject.toml but missing here, so the built
# .conda got it only as cyclonedx-python-lib's transitive and would break at
# import the moment cyclonedx re-bounded it. conda-forge ships 0.17.6 (noarch).
packageurl-python = "*"
license-expression = "*"
