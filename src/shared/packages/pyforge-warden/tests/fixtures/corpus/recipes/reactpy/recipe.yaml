# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0b13"
  python_min: "3.11"

package:
  name: reactpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reactpy/reactpy-${{ version }}.tar.gz
  sha256: b780c56f4a08109c0105b0234c6c7a2c3c18f09cea3d63f0fcec488e169eebe1
  patches:
    - patches/0001-keep-prebuilt-pyscript-wheel.patch

build:
  number: 0
  noarch: python
  script:
    env:
      REACTPY_SKIP_PY_WHEEL_BUILD: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-build-scripts >=0.0.4
  run:
    - python >=${{ python_min }}
    - anyio >=3
    - python-fastjsonschema >=2.14.5
    - lxml >=4
    - requests >=2

tests:
  - python:
      imports:
        - reactpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - reactpy/static/index.js
        - reactpy/static/wheels/reactpy-${{ version }}-py3-none-any.whl

about:
  summary: It's React, but in Python
  description: |
    ReactPy is a library for building user interfaces in Python without
    JavaScript. ReactPy interfaces are made from components which look and
    behave similarly to those found in ReactJS. Designed with simplicity in
    mind, ReactPy can be used by those without web development experience
    while also being powerful enough to grow with your ambitions.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/reactive-python/reactpy
  homepage: https://reactpy.dev/
  documentation: https://reactpy.dev/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: reactpy
  cfe-upstream-registry: pypi
  cfe-upstream-name: reactpy
  cfe-purls:
    - pkg:conda/reactpy@${{ version }}?channel=conda-forge
    - pkg:pypi/reactpy@${{ version }}
  cfe-upstream-repo: https://github.com/reactive-python/reactpy
  cfe-upstream-homepage: https://reactpy.dev/
  cfe-import-names: [reactpy]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: true
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/reactpy-feedstock
  cfe-forge-recipe-updates-needed:
    - "v2 bump DELIBERATELY WITHHELD from the feedstock. This local recipe is intentionally AHEAD of the deployed feedstock, which stays at stable 1.1.0."
  cfe-forge-blocker-list:
    - "2.0.0b13 is a PRE-RELEASE. conda has no PEP 440 pre-release exclusion -- unlike pip, its solver ranks 2.0.0b13 as simply newer than 1.1.0 -- so uploading it to the feedstock's main label would silently auto-upgrade every existing `conda install reactpy` user across the breaking v1->v2 boundary. Operator decision 2026-07-14: do NOT touch the feedstock; build v2 local-only. Revisit when 2.0.0 goes stable, or ship betas to a dev/rc label via conda-forge.yml channel_targets."
  cfe-last-checked: 2026-07-14T00:00:00Z
  cfe-generated-by-version: 8.77.0
  cfe-generated-at-datetime: 2026-07-14T00:00:00Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-07-14T19:40:00Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
