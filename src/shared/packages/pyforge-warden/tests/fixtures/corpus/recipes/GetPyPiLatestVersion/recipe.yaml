# source:
#  patches:
#    # 0001-static-version-no-network.patch: upstream's setup.py SELF-VERSIONS
#    # by querying PyPI at build time for its own latest version and adding
#    # one (obtainer(MODULE_NAME) -> version_add_one) — a build-time network
#    # call AND a non-deterministic version that would mislabel the wheel
#    # (G24-class label/dist-info mismatch). The patch replaces the dynamic
#    # block (including the argv-sniffing override, which could misfire on
#    # pip's own arguments) with a static VERSION_NUM. The version string is
#    # HARDCODED in the patch — re-roll it on every version bump.
