  cfe-conda-name: getpypilatestversion
  cfe-upstream-registry: pypi
  cfe-upstream-name: get-pypi-latest-version
  cfe-purls:
    - pkg:conda/getpypilatestversion@${{ version }}?channel=conda-forge
    - pkg:pypi/get-pypi-latest-version@${{ version }}
  cfe-upstream-repo: https://github.com/SWHL/GetPyPiLatestVersion
  cfe-upstream-homepage: https://github.com/SWHL/GetPyPiLatestVersion
  cfe-import-names: [get_pypi_latest_version]
