# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.0"

package:
  name: sqlglotrs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlglotrs/sqlglotrs-${{ version }}.tar.gz
  sha256: ad1ad158234af0f8ba5054ca51bd17a7c1e3f81b4798c7970ebf7953fe08ddcb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlglotrs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: 'Deprecated: use sqlglotc instead'
  license: MIT
  license_file: LICENSE
  homepage: https://sqlglot.com/
  repository: https://github.com/tobymao/sqlglot

extra:
  recipe-maintainers:
    - thewchan

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: sqlglotrs
  cfe-upstream-registry: pypi
  cfe-upstream-name: sqlglotrs
  cfe-purls:
    - pkg:conda/sqlglotrs@${{ version }}?channel=conda-forge
    - pkg:pypi/sqlglotrs@${{ version }}
  cfe-upstream-repo: https://github.com/tobymao/sqlglot
  cfe-upstream-homepage: https://sqlglot.com/
  cfe-import-names: [sqlglotrs]
  cfe-source-kind: pypi-sdist
  cfe-noarch: python
  cfe-pip-check: "true"
  cfe-on-conda-forge-status: confirmed-on-conda-forge
  cfe-on-conda-forge-feedstock: https://github.com/conda-forge/sqlglotrs-feedstock
  cfe-forge-recipe-updates-needed: [reshape-to-noarch-python-stub, version-bump-to-0.13.0]
  cfe-forge-blocker-list: ["feedstock#48 red: recipe still Rust-shaped for what is now a pure-python deprecation stub — reshape diff verified locally"]
