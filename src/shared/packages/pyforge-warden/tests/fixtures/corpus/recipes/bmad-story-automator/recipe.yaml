# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: bmad-story-automator
  version: "1.15.0"
  # Upstream repo (bmad-code-org/bmad-automator) has no release tags as of 2026-04-26.
  # Pinned to the latest main commit; bump both `version` and `commit` together.
  commit: f332173a692ffbabb24734c31dedadfcf78b9ed1

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/bmad-code-org/bmad-automator/archive/${{ commit }}.tar.gz
  sha256: 1e5338ba049b5f0dc5153500da7717bda2da0fd04942df3d5c7fa31adf54e26a

build:
  number: 0
  noarch: generic
  # Upstream is deliberately unix-only (its bin script errors "Unsupported
  # OS: Windows"); skip the win CI leg rather than produce an empty build.
  skip:
    - win

requirements:
  run:
    - nodejs >=18
    - python >=3.10
    # https://github.com/bmad-code-org/bmad-automator/blob/9e7dff8fa388679de4668fadc0318f32245eb0f1/bin/bmad-story-automator#L38
    # console.error("Error: Unsupported OS: Windows (supported: macOS, Linux)");
    # __unix prevents installation on Windows (the bin script spawns bash to
    # run install.sh, which has no Windows code path). The selector is gated
    # on `unix` because conda-forge's v1 linter forbids unconditional run
    # selectors on noarch packages unless conda-forge.yml's noarch_platforms
    # has >1 entries (which ours does: linux_64, osx_64, osx_arm64).
    - if: unix
      then:
        - __unix

tests:
  # Skip tests on win: the noarch artifact built on the win-64 staged-recipes
  # runner won't have __unix in run deps (selector evaluates false), so the
  # test env would solve, but the test script uses unix-only commands. The
  # post-merge feedstock won't run the win runner at all (gated by
  # noarch_platforms in conda-forge.yml).
  - if: unix
    then:
      script:
        - bmad-story-automator --version
        - bmad-story-automator --help
        - test -f "${PREFIX}/lib/node_modules/bmad-story-automator/package.json"
        - test -f "${PREFIX}/lib/node_modules/bmad-story-automator/bin/bmad-story-automator"
        - test -f "${PREFIX}/lib/node_modules/bmad-story-automator/install.sh"
        - test -d "${PREFIX}/lib/node_modules/bmad-story-automator/skills/bmad-story-automator"
        - test -d "${PREFIX}/lib/node_modules/bmad-story-automator/docs"

about:
  homepage: https://github.com/bmad-code-org/bmad-automator
  repository: https://github.com/bmad-code-org/bmad-automator
  license: MIT
  license_file: LICENSE
  summary: BMAD story-automator skill bundle and Python helper runtime installer
  description: |
    bmad-story-automator is the portable installer for the BMAD `bmad-story-automator`
    pure skill bundle. It installs the orchestration skill, the bundled review skill,
    and the Python helper runtime that parses stories, builds state docs, spawns tmux
    child sessions, monitors child agents, and verifies review completion into a
    target BMAD project's `.claude/skills/` tree.

    After installation, run `bmad-story-automator <bmad-project-root>` (or just
    `bmad-story-automator` from inside a BMAD project) to deploy the skill bundle.

extra:
  recipe-maintainers:
    - rxm7706

