# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "6.0.0b1"
  python_min: "3.11"

package:
  name: reactpy-django
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reactpy-django/reactpy_django-${{ version }}.tar.gz
  sha256: 3cdcb0d0a827aedb5002c63ae991995db05b7458336ecc973c65fc3939509501
  patches:
    - patches/0001-use-prebuilt-js-assets.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - channels >=4.0.0
    - django >=4.2.0
    - reactpy >=2.0.0b13,<3.0.0
    - reactpy-router >=3.0.0b1,<4.0.0
    - dill >=0.3.5
    - orjson >=3.6.0
    - typing_extensions

# CFEP-25-justified: Django app — a bare `import reactpy_django` raises
# ImproperlyConfigured because reactpy_django.config reads settings.DEBUG at
# module scope. The script tests below configure settings first and then import
# for real, on python_min and on the newest Python, keeping pip check on both.
tests:
  - script:
      - python -c "from django.conf import settings; settings.configure(DEBUG=False); import reactpy_django; print(reactpy_django.__version__)"
      - pip check
    requirements:
      run:
        - pip
        - python ${{ python_min }}.*
  - script:
      - python -c "from django.conf import settings; settings.configure(DEBUG=False); import reactpy_django; print(reactpy_django.__version__)"
      - pip check
    requirements:
      run:
        - pip
        - python
  - package_contents:
      site_packages:
        - reactpy_django/static/reactpy_django/index.js
        - reactpy_django/static/reactpy_django/morphdom/morphdom.js

about:
  summary: It's React, but in Python. Now with Django integration
  description: |
    ReactPy-Django integrates ReactPy into Django projects. It provides a
    Django template tag for embedding ReactPy components in Django templates,
    a websocket consumer, ORM-aware hooks for querying and mutating models,
    per-component state, and optional client-side execution via PyScript.
  license: MIT AND Apache-2.0
  license_file:
    - LICENSE.md
    - src/js/node_modules/@reactpy/client/LICENSE
    - src/js/node_modules/preact/LICENSE
    - src/js/node_modules/event-to-object/LICENSE
    - src/js/node_modules/json-pointer/LICENSE
    - src/js/node_modules/morphdom/LICENSE
    - src/js/node_modules/@pyscript/core/LICENSE
    - src/js/node_modules/@pyscript/core/src/3rd-party-licenses/
  repository: https://github.com/reactive-python/reactpy-django
  homepage: https://reactive-python.github.io/reactpy-django/
  documentation: https://reactive-python.github.io/reactpy-django/

extra:
  recipe-maintainers:
    - rxm7706

