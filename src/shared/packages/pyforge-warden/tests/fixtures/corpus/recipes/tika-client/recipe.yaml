# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.11.0"

package:
  name: tika-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tika-client/tika_client-${{ version 
    }}.tar.gz
  sha256: c741caaca08bbd715a8db3fe6f0430a54d075fef3d59a441e8b8d810f58de4f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio <5,>=4.12
    - httpx <1,>=0.28
    - typing_extensions

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/tika-client/
  license: MPL-2.0
  license_file: LICENSE.txt
  summary: A modern REST client for Apache Tika server
  description: |
    A modern REST client for Apache Tika server
  repository: https://github.com/stumpylog/tika-client
  documentation: https://github.com/stumpylog/tika-rest-client#readme
extra:
  recipe-maintainers:
    - rxm7706

