#    # binary, so it substitutes — but leaves no ast-grep-cli dist-info,
#    # hence pip_check stays off (reason-coded in cfe-pip-check).
#    # litellm gated to python <3.14 mirroring the upstream env marker
#    # (lazily imported; core paths never touch it).
#    # Only core deps are packaged; upstream [proxy]/[ml]/[code]/[memory]
#    # etc. extras are deliberately omitted (Simplicity First).
