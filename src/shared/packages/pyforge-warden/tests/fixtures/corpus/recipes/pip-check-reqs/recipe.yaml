# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.6"

package:
  name: pip-check-reqs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip-check-reqs/pip_check_reqs-${{ version }}.tar.gz
  sha256: 1a6a016d9925f4ba51a2541dcaa3e7810b86dea49cead347382ef3bdfaeb9157

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pip-extra-reqs = pip_check_reqs.find_extra_reqs:main
      - pip-missing-reqs = pip_check_reqs.find_missing_reqs:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - packaging >=22
    - pip >=23.2

tests:
  - python:
      imports:
        - pip_check_reqs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python
    script:
      - pip-extra-reqs --help
      - pip-missing-reqs --help

about:
  summary: Find packages that should or should not be in requirements for a project
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/adamtheturtle/pip-check-reqs

extra:
  recipe-maintainers:
    - rxm7706
