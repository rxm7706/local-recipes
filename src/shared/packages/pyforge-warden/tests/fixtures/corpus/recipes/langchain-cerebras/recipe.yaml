# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.2"
  python_min: "3.11"

package:
  name: langchain-cerebras
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langchain-cerebras/langchain_cerebras-${{ version }}.tar.gz
  sha256: 1594f87d08955a141269d48527d9a636827f6cb60167c447d8c5969eeaa9c8c7

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<3.13
    - langchain-core >=1.1.0,<2.0.0
    - langchain-openai >=1.0.2,<2.0.0

tests:
  - python:
      imports:
        - langchain_cerebras
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: LangChain partner integration for the Cerebras inference API
  description: |
    langchain-cerebras provides the ChatCerebras integration for LangChain,
    targeting Cerebras wafer-scale inference (OpenAI-compatible endpoint)
    from langchain applications.
  homepage: https://github.com/langchain-ai/langchain-cerebras
  repository: https://github.com/langchain-ai/langchain-cerebras
  documentation: https://python.langchain.com/docs/integrations/chat/cerebras/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

