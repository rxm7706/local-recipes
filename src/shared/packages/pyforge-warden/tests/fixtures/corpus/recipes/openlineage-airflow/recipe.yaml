# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openlineage-airflow
  version: "1.41.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenLineage/OpenLineage/archive/refs/tags/${{ version }}.tar.gz
  sha256: fb188ea7ea7316900f5bb67959d95070255d5d8f69d8ba426dc9719003267780

build:
  number: 0
  noarch: python
  script:
    - cd integration/airflow
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.4,<0.10.0
  run:
    - python >=${{ python_min }},<4.0
    - attrs >=20.0
    - openlineage-integration-common ==1.40.0
    - openlineage-sql ==1.40.0
    - openlineage-python ==1.40.0

  run_constraints:
    - apache-airflow >=2.3

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - apache-airflow >=2.3
        - pip
    script:
      - python -c "import openlineage.airflow, openlineage.airflow.extractors"
      - pip check

about:
  summary: OpenLineage integration with Airflow
  homepage: https://github.com/OpenLineage/OpenLineage
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
