# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.3"

package:
  name: cssbeautifier
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cssbeautifier/cssbeautifier-${{ 
    version }}.tar.gz
  sha256: 2c2fd129342561029de86b1744efa231c9fafe26023dbc988a1deb0ca0f5c845

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jsbeautifier
    - editorconfig >=0.12.2

tests:
  - python:
      imports:
        - cssbeautifier
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://beautifier.io
  license: MIT
  license_file: LICENSE
  summary: CSS unobfuscator and beautifier.
  description: |
    CSS unobfuscator and beautifier.
  repository: https://github.com/beautify-web/js-beautify
extra:
  recipe-maintainers:
    - rxm7706

