# CFE comments
# Header:
#    Packaged as a prerequisite of the reactpy v2 chain. reactpy-router 3.0.0b1
#    requires reactpy[asgi]; conda has no extras (G25), so reactpy's asgi extra
#    (asgi-tools + asgiref + orjson + servestatic) is flattened into
#    reactpy-router's run deps -- which is the only reason this package is
#    needed. Verified compiled per G46/G48: sdist ships asgi_tools/{forms,
#    multipart}.pyx + .pxd, and PyPI publishes 28 per-Python cp3XX wheels with
#    zero py3-none-any fallback.
# build:
#  skip:
#    Upstream requires-python is ">=3.11,<4" but the conda-forge matrix starts
#    at 3.10, so the 3.10 variant would fail at pip install. Skipped with the v1
#    match() form -- the generator emitted `skip: py>=400`, a v0-style selector
#    that v1 silently ignores (G3), so it was doing nothing at all.
#    NOTE: this 3.11 floor is what forces the whole downstream chain to 3.11;
#    it agrees with reactpy 2.x and reactpy-router 3.x, which also require 3.11.
#    The upstream "<4" cap is not mirrored in run: -- the python_abi run_export
#    already pins this per-Python artifact to one exact interpreter.
# requirements:
#  build:
#    stdlib('c') is mandatory alongside compiler('c') and was missing from the
#    generated recipe (STD-001). The generator also emitted `noarch: python`
#    next to compiler('c') -- contradictory; dropped.
#  host:
#    setuptools + wheel + cython are all declared in the sdist's
#    [build-system].requires, so all three stay (not the G8 case). The legacy
#    setup_requires=["wheel"] in setup.py is satisfied by `wheel` in host, so no
#    build-time fetch (G55 addendum). setup.py honors ASGI_TOOLS_NO_EXTENSIONS
#    to force a pure-Python build; unused -- we match upstream's accelerated build.
#  run:
#    Exactly the 4 PEP 621 [project].dependencies. orjson is deliberately NOT
#    listed: it appears only in the [tests] and [orjson] extras, which nothing
#    in this chain activates (G25 says flatten activated extras, not all of them).
# tests:
#    No CFEP-25 cross-version triad -- per-Python compiled artifact (G49).
# about:
#    license_file: LICENSE ships in the sdist (canonical placement pattern 1).
#    Its "Copyright (c) 2020 Kirill Klenov" independently corroborates the
#    reconstructed LICENSE vendored into the sibling http-router recipe (same
#    author, same year). The generator emitted homepage=pypi.org/project/... and
#    an RST image directive as the description; both rewritten.
