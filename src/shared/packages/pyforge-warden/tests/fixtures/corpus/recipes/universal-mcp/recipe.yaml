# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.25"
  python_min: "3.11"

package:
  name: universal-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/universal-mcp/universal_mcp-${{ 
    version }}.tar.gz
  sha256: 1fd51e5221cb51e2791c13fb56431551542e0c86af2be7326fb78452c4c6037e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - agentevals >=0.0.9
    - black >=25.1.0
    - cookiecutter >=2.6.0
    - gql >=4.0.0
    - httpx-aiohttp >=0.1.8
    - jinja2 >=3.1.3
    - jsonref >=1.1.0
    - keyring >=25.6.0
    - langchain-anthropic >=0.3.19
    - langchain-google-genai >=2.1.10
    - langchain-google-vertexai >=2.0.28
    - langchain-mcp-adapters >=0.1.9
    - langchain-openai >=0.3.27
    - langgraph-cli >=0.3.4
    - langgraph-api
    - langgraph-runtime-inmem
    - langgraph >=0.5.2
    - langsmith >=0.4.5
    - loguru >=0.7.3
    - mcp >=1.10.0
    - openevals >=0.1.0
    - posthog >=3.24.0
    - pydantic-settings >=2.8.1
    - pydantic >=2.11.1
    - pyyaml >=6.0.2
    - rich >=14.0.0
    - streamlit >=1.46.1
    - typer >=0.15.2

tests:
  - python:
      imports:
        - universal_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/universal-mcp/
  license: MIT
  license_file: LICENSE
  summary: Universal MCP acts as a middle ware for your API applications. It can
    store your credentials, authorize, enable disable apps on the fly and much 
    more.
  description: |
    Universal MCP acts as a middle ware for your API applications. It can store your credentials, authorize, enable disable apps on the fly and much more.
  repository: https://github.com/universal-mcp/universal-mcp
extra:
  recipe-maintainers:
    - rxm7706

