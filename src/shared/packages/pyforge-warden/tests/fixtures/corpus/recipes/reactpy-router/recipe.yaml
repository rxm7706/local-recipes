    - pkg:pypi/reactpy-router@${{ version }}
  cfe-upstream-repo: https://github.com/reactive-python/reactpy-router
  cfe-upstream-homepage: https://reactive-python.github.io/reactpy-router/latest/
  cfe-import-names: [reactpy_router]
