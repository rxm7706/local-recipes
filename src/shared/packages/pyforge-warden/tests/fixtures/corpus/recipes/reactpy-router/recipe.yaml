# CFE comments
# Header:
#    LOCAL-ONLY. Middle link of the reactpy v2 chain:
#    http-router -> asgi-tools -> reactpy-router 3.0.0b1 -> reactpy-django 6.0.0b1.
#    Authored fresh; the prior local recipe was at 1.0.0 (nodeenv + c/cxx
#    compilers + twine + reactpy<2.0.0) and was ignored per operator direction.
#    The version is forced: reactpy-django 6.0.0b1 pins reactpy-router>=3.0.0b1,
#    and stable 2.0.0 pins reactpy<2.0.0, so only the 3.x beta works with v2.
# context:
#  python_min:
#    3.11 -- upstream requires-python is ">=3.11", above the conda-forge 3.10
#    floor, so it is declared rather than omitted.
# source:
#    PyPI sdist, verified usable per G54: ships 7 .py files AND the prebuilt
#    static/bundle.js, so no fallback to a GitHub tag or the wheel is needed.
#  patches:
#    0001-use-prebuilt-js-bundle.patch removes the build-scripts hook, whose
#    commands are `bun install --cwd src/js` + `bun build ... --minify`. The
#    sdist already ships that hook's output (src/reactpy_router/static/bundle.js,
#    matching the 36,708-byte bundle.js in upstream's own published wheel), so
#    running bun would only reproduce a file we already have while dragging a JS
#    toolchain into the build.
#    Safe to remove precisely BECAUSE this hook declares `artifacts = []`: with an
#    empty artifacts spec, hatch-build-scripts' default clean_artifacts=True
#    matches nothing and deletes nothing, so the prebuilt bundle survives. That is
#    the key difference from the sibling reactpy recipe, whose hook DOES declare
#    artifacts and therefore DID delete its prebuilt wheel -- see that patch.
#    bundle.js is gitignored, but the wheel target's
#    artifacts=["/src/reactpy_router/static/"] un-excludes it.
#    hatch-build-scripts is consequently NOT in host: with the hook config gone
#    hatchling never loads the plugin (pip does not enforce [build-system].requires
#    under --no-build-isolation).
# requirements:
#  run:
#    THE FLATTEN (G25). Upstream declares `reactpy[asgi]>=2.0.0b12,<3.0.0`, but
#    conda has no extras mechanism -- the reactpy conda package is built once,
#    without extras, so a bare `reactpy` dep does NOT drag the asgi extra in.
#    This recipe therefore carries reactpy's asgi extra members directly:
#      asgiref + asgi-tools + servestatic + orjson
#    (read from reactpy 2.0.0b13's [project.optional-dependencies].asgi; all
#    unpinned upstream, so unpinned here). Not optional bookkeeping: pip_check
#    reads this package's wheel METADATA, sees the reactpy[asgi] marker, and
#    FAILS if the extra's members are absent. asgi-tools was the only member
#    missing from conda-forge -- the entire reason the http-router + asgi-tools
#    recipes in this repo exist.
# tests:
#    package_contents guards bundle.js for the same reason as the reactpy recipe:
#    the JS bundle is the point of the package, yet `import reactpy_router` and
#    pip_check both pass without it (G73). Asserting it makes a dropped bundle
#    fail loudly at packaging time.
####
