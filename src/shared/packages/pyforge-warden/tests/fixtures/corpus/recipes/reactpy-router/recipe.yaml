# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0b1"
  python_min: "3.11"

package:
  name: reactpy-router
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reactpy-router/reactpy_router-${{ version }}.tar.gz
  sha256: 94961560d6887721a6adf4d565de7e1c8da97844cf8e26398f132ff72f80f82e
  patches:
    - patches/0001-use-prebuilt-js-bundle.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - reactpy >=2.0.0b12,<3.0.0
    - typing_extensions
    - asgiref
    - asgi-tools
    - servestatic
    - orjson

tests:
  - python:
      imports:
        - reactpy_router
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - reactpy_router/static/bundle.js

about:
  summary: A URL router for ReactPy
  description: |
    reactpy-router provides URL routing for ReactPy applications. It offers a
    browser router along with route, link, and navigate components, plus hooks
    for reading the current location and route parameters, in a form modelled
    on React Router.
  license: MIT
  license_file: LICENSE.md
  repository: https://github.com/reactive-python/reactpy-router
  homepage: https://reactive-python.github.io/reactpy-router/latest/
  documentation: https://reactive-python.github.io/reactpy-router/latest/

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: reactpy-router
  cfe-upstream-registry: pypi
  cfe-upstream-name: reactpy-router
  cfe-purls:
