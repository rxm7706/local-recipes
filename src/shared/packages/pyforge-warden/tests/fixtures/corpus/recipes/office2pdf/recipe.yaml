# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.6.1"

package:
  name: office2pdf
  version: ${{ version }}

source:
  - url: https://github.com/developer0hye/office2pdf/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 57ec6d795d90b3901e08f8cf20f0a7d6ea75679103ed080b035e8593557367b0
    target_directory: _src/office2pdf
    patches:
      - patches/0001-vendor-git-fork-deps.patch
  # Vendored git-fork deps (see build.sh + CFE comments). Pinned by commit.
  - url: https://github.com/developer0hye/umya-spreadsheet/archive/19d82bc244fcc1ef4b741a1b5c1e083d9add5480.tar.gz
    sha256: e97e6b90e3ae9f839298fddc5abe9dcd4f23d5f5395c71c010db744429ebb51c
    target_directory: _src/umya
  - url: https://github.com/developer0hye/docx-rs/archive/c57785df81bd54e2bba023df2c28b852cb8dc50a.tar.gz
    sha256: fd2c85ee83beb20f7e80f49e0ea9e074178ce20b0d051c5a0f2bd7bbc9d5aa45
    target_directory: _src/docxrs

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - office2pdf --help
      - office2pdf --version

about:
  homepage: https://github.com/developer0hye/office2pdf
  repository: https://github.com/developer0hye/office2pdf
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Convert DOCX, XLSX, and PPTX files to PDF using pure Rust
  description: |
    office2pdf is a pure-Rust library and CLI that converts DOCX, XLSX, and
    PPTX files to PDF, powered by Typst. No LibreOffice, Chromium, or Docker
    required — just a single binary.

extra:
  recipe-maintainers:
    - rxm7706

#### CFE metadata AND comments
# CFE metadata
  cfe-conda-name: office2pdf
  cfe-upstream-registry: github
  cfe-upstream-name: developer0hye/office2pdf
  cfe-purls:
    - pkg:conda/office2pdf@${{ version }}?channel=conda-forge
    - pkg:cargo/office2pdf@${{ version }}
    - pkg:github/developer0hye/office2pdf@v${{ version }}
  cfe-upstream-repo: https://github.com/developer0hye/office2pdf
  cfe-upstream-homepage: https://github.com/developer0hye/office2pdf
  cfe-import-names: []
  cfe-source-kind: github-tag
  cfe-noarch: compiled
  cfe-pip-check: "false:not-python"
  cfe-on-conda-forge-status: blocked-pending-prerequisites
  cfe-on-conda-forge-feedstock: none
  cfe-forge-recipe-updates-needed: none
  cfe-forge-blocker-list:
