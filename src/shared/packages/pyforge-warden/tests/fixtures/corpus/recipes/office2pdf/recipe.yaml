# CFE comments
# ==========================================================================
# UPSTREAM FIXES TO FILE (option C) — these remove the vendoring below and
# make office2pdf cleanly conda-forge-submittable. File on
# github.com/developer0hye/office2pdf:
#
#   1. Un-fork the two patched dependencies so released crates.io versions
#      can be used and the [patch.crates-io] block can be DELETED:
#        - umya-spreadsheet: upstream the `fix/panic-safety-v2` changes
#          (currently developer0hye/umya-spreadsheet@19d82bc) and depend on a
#          released 2.x that includes them. crates.io umya-spreadsheet max is
#          3.0.0; office2pdf pins ^2.
#        - docx-rs: upstream the `fix/parse-tolerance` changes (currently
#          developer0hye/docx-rs@c57785df, crate docx-core = docx-rs 0.4.19)
#          to github.com/bokuweb/docx-rs and depend on a released 0.4.x.
#          crates.io docx-rs max is 0.4.20; office2pdf pins ^0.4.
#      Once both are on crates.io, delete [patch.crates-io] from the root
#      Cargo.toml. Then this recipe drops the 2nd/3rd source: entries and the
#      patch-repoint step in build.sh entirely.
#
#   2. Commit a Cargo.lock to the office2pdf repo (it has none). Then the
#      recipe can build with `cargo auditable install --locked` for
#      reproducible builds (currently --locked is omitted).
# ==========================================================================
# source:
#   # 2nd/3rd source: entries are the pinned git-fork deps. GitHub commit-archive
#   # sha256 can drift if GitHub re-gzips (CFE G61) — recompute if the source
#   # fetch fails its checksum.
# build:
#   # The two forks extract as sibling sources at _src/umya and _src/docxrs;
#   # patches/0001-vendor-git-fork-deps.patch repoints office2pdf's
#   # [patch.crates-io] to the relative paths ../umya and ../docxrs/docx-core
#   # (rattler-build strips each archive's top dir under target_directory, so the
#   # layout is deterministic; the forks are outside the office2pdf workspace so
#   # no [workspace] hack is needed). build.sh (unix) / build.bat (win) then just
#   # `cargo auditable install` the office2pdf-cli binary — no python. --locked
#   # omitted (no upstream Cargo.lock; upstream ask #2). VERIFICATION: linux-64
#   # built + tested GREEN locally. macOS should work via build.sh but is
#   # unverified (no host); build.bat is best-effort/unverified (no Windows host)
#   # — both need conda-forge CI before submission.
####
