  cfe-generated-by-version: manual
  cfe-generated-at-datetime: 2026-07-12T02:10:52Z
  cfe-local-build-status: success
  cfe-local-build-datetime: 2026-07-12T02:15:22Z
  cfe-local-build-platform: linux-64
  cfe-local-build-tool: rattler-build
