# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.12"

package:
  name: import-linter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/import-linter/import_linter-${{ 
    version }}.tar.gz
  sha256: 217f0f0f0890b8625389765039d52c215f4c6d4a047f42ea78b6d00ceba1900e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=6
    - grimp >=3.14
    - rich >=14.2.0
    - tomli >=1.2.1
    - typing_extensions >=3.10.0.0

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/import-linter/
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Lint your Python architecture
  description: |
    Lint your Python architecture
  documentation: https://import-linter.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706
    - millsks
    - cshaley
