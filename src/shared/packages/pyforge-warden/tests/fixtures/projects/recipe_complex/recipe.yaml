context:
  name: mypkg
  version: "1.2.3"

recipe:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0

outputs:
  - package:
      name: ${{ name }}-core
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      host:
        - python
      run:
        - python
        - if: linux
          then:
            - numpy >=1.20
          else:
            - numpy
        - ${{ name }}==${{ version | replace(".", "") }}

  - package:
      name: ${{ name }}-extra
    requirements:
      run:
        - ${{ pin_subpackage(name + "-core", exact=True) }}
        - click

about:
  summary: >-
    complex-construct v1 recipe fixture (Story 2.3): compiler/stdlib
    build-tool exclude, if/then/else selector-union (both branches), a
    second output's pin_subpackage intra-recipe exclude, and a
    name-resolved+expression-version degrade -- live-verified via
    rattler_build.Stage0Recipe before being wired into the oracle test.
