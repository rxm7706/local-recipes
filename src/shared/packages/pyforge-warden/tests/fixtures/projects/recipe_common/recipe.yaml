context:
  name: mypkg
  version: "1.2.3"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  noarch: python

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy >=1.20
    - ${{ name }} ==${{ version }}
  run_constraints:
    - scipy >=1.0

tests:
  - script:
      - python -c "import mypkg"
    requirements:
      run:
        - pytest

about:
  summary: common-case v1 recipe fixture (Story 2.2)
