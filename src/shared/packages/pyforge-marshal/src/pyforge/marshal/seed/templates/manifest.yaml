# The V1 extraction manifest (Story 7.5, AD-55) -- the operating model
# declared as data, loaded and validated by
# ``pyforge.marshal.seed.model.manifest.load_manifest`` (Story 7.4).
#
# Companion doc: _bmad-output/planning-artifacts/specs/spec-pyforge-marshal/
# extraction-manifest.md -- the audited classification rationale this file
# encodes as loadable data. PRD section "The Extraction Manifest"
# (FR-66..FR-71) and architecture AD-55 are the normative contracts this
# file is judged against.
#
# 43 entries: 16 referenced, 5 copied-managed, 5 copied-seeded,
# 10 generated-derived, 4 hybrid-managed-region, 3 unclassified-deferred.
#
# Two deliberate dedups (see the companion doc's own Design Notes): the
# `.gitignore` model block and `CLAUDE.md`'s tier head-matter are each ONE
# hybrid-managed-region entry, not also a copied-managed / generated-derived
# entry -- their own PRD rows say so once read past the summary table.

model_version: "1.0.0"

never_write:
  - "docs/dreams/*.md"
  - "**/planning-artifacts/**"
  - "**/implementation-artifacts/**"
  - "docs/specs/*.md"
  - "_bmad/bmm/**"
  - "_bmad/core/**"
  - "_bmad/skf/**"

artifacts:
  # --- REFERENCED (16): not materialized, verified presence + floor only.
  # path is "n/a" for every entry here (Story 7.4's own fixture convention;
  # a referenced artifact has no repo path to name).
  - id: bmad-method
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: upstream product; gains bmad-dev-auto at 6.10; never vendored
    pin: ">=6.10.0"
  - id: bmad-loop
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      Marshal's orchestrator; Genesis declares the floor, Marshal operates
      it. The floor is 0.9.0 because that is the load-bearing requirement:
      pyforge-marshal's own pyproject.toml declares `bmad-loop>=0.9.0,<0.10`
      as a hard runtime dependency, so a repo at 0.8.1 cannot install the
      tool doing the checking. Matches the live pixi.toml.
    pin: ">=0.9.0"
  - id: copier
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: Genesis's own template engine
    pin: ">=9.17,<10"
  - id: tmux
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: the loop spawns agent sessions in it; Linux/macOS only
    pin: ">=3.7b_"
  - id: bmad-installed-skills
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      _bmad/bmm/** and _bmad/core/** are installer-owned, regenerated by
      `bmad-method install`; also in the never-write set.
    pin: ">=6.10.0"
  - id: pixi
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: preview = ["pixi-build"] requires it
    pin: ">=0.76.1"
  - id: bmad-builder
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      custom agents & workflows (BMB); added in the 2026-07-31 re-audit --
      the Dream promised it and the V1 inventory classified it nowhere.
    pin: ">=2.1.0"
  - id: bmad-method-test-architecture-enterprise
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      risk-based test strategy (TEA); added in the 2026-07-31 re-audit.
      Spelled as the real package name -- `id` is the only handle FR-95's
      presence/floor check has on a referenced entry (there is no separate
      `package` field), so an abbreviated id reports a missing dependency
      that is in fact installed and at floor.
    pin: ">=1.19.1"
  - id: bmad-creative-intelligence-suite
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: brainstorming / design thinking (CIS); added in the 2026-07-31 re-audit
    pin: ">=0.2.1"
  - id: bmad-skill-forge
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      Skill Forge (_bmad/skf/**, 59 dirs + 16 skf-* skills), installed via
      `bmad-method install` like bmm/core; also in the never-write set --
      the largest single omission the 2026-07-31 re-audit found.
    pin: ">=6.10.0"
  - id: bmad-dashboard
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: BMad Method UI boards; added in the 2026-07-31 re-audit
    pin: ">=1.2.2.dev0"
  - id: bmad-manticore
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: >-
      installed but barely exercised; keep/wrap/remove is an open operator
      triage call (docs/dreams/one-front-door.md). Classified referenced
      provisionally so coverage can pass honestly rather than by omission.
    pin: ">=2.0.0.dev0"
  - id: bmad-labs-skills
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: installed but barely exercised; same triage-open status as bmad-manticore
    pin: ">=1.0.0.dev0"
  - id: bmad-utility-skills
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: installed but barely exercised; same triage-open status as bmad-manticore
    pin: ">=2.0.0"
  - id: bmad-method-wds-expansion
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: installed but barely exercised; same triage-open status as bmad-manticore
    pin: ">=0.4.3"
  - id: bmad-module-template
    class: referenced
    path: "n/a"
    applies_to: both
    rationale: installed but barely exercised; same triage-open status as bmad-manticore
    pin: ">=0.1.0"

  # --- COPIED-MANAGED (5): materialized, tool-owned, regenerated wholesale.
  - id: bmad-switch
    class: copied-managed
    path: "scripts/bmad-switch"
    applies_to: both
    rationale: >-
      executable model machinery with a known production incident (the
      marker/symlink desync); bug fixes must propagate to installed repos.
  - id: bmad-loop-worktree
    class: copied-managed
    path: "scripts/bmad-loop-worktree"
    applies_to: both
    rationale: concurrent loop homes; same reasoning as bmad-switch
  - id: detector-registry
    class: copied-managed
    path: "scripts/detectors.py"
    applies_to: both
    rationale: >-
      must run locally and offline in the adopting repo's CI; the registry
      discovers detectors from the filesystem rather than naming one by
      hand, because a hand-written list omits the newest detector -- the
      exact defect this registry exists to prevent.
  - id: dreams-readme
    class: copied-managed
    path: "docs/dreams/README.md"
    applies_to: both
    rationale: the Tier-0 contract itself -- Dream frontmatter schema, flow, conventions
  - id: detectors-ci-workflow
    class: copied-managed
    path: ".github/workflows/detectors.yml"
    applies_to: both
    rationale: >-
      mechanical CI wiring that runs `marshal seed check` plus the detector
      registry; no reason for a repo to hand-own it.

  # --- COPIED-SEEDED (5): materialized once, then repo-owned forever.
  - id: starter-dream
    class: copied-seeded
    path: "docs/dreams/{{ slug }}.md"
    applies_to: init
    rationale: it is the repo's content from the moment it is written
  - id: project-config
    class: copied-seeded
    path: "_bmad-output/projects/{{ slug }}/.bmad-config.toml"
    applies_to: both
    rationale: per-project config the team tunes
  - id: bmad-custom-config
    class: copied-seeded
    path: "_bmad/custom/config.toml"
    applies_to: both
    rationale: the global custom config layer exists precisely so teams customize it
  - id: specs-readme
    class: copied-seeded
    path: "_bmad-output/projects/{{ slug }}/planning-artifacts/specs/README.md"
    applies_to: init
    rationale: >-
      the durable-specs convention explainer; the repo extends it with its
      own provenance table.
  - id: deck-scaffolding
    class: copied-seeded
    path: "presentations/{{ slug }}/"
    applies_to: both
    rationale: Herald's surface; Genesis lays the directory, Herald owns the content

  # --- GENERATED-DERIVED (10): computed from the neutral contract and/or
  # repo state, recomputed every run.
  - id: bmad-loop-policy
    class: generated-derived
    path: ".bmad-loop/policy.toml"
    applies_to: both
    rationale: >-
      rendered whole from the canonical EffectivePolicy on every
      `marshal config --write-harness-policy` run (Story 1.10, AD-12/AD-35) --
      review found this manifest's first draft classified it copied-seeded,
      contradicting the already-shipped, gitignored, never-hand-edited
      behavior this exact path has in this repo today.
  - id: cursor-rules
    class: generated-derived
    path: ".cursor/rules/specs.mdc"
    applies_to: both
    rationale: >-
      a mechanical projection of the neutral contract's tier table,
      per-tool framing only.
  - id: gemini-md
    class: generated-derived
    path: "GEMINI.md"
    applies_to: both
    rationale: same projection as cursor-rules, for the Gemini CLI
  - id: copilot-instructions
    class: generated-derived
    path: ".github/copilot-instructions.md"
    applies_to: both
    rationale: same projection as cursor-rules, for GitHub Copilot
  - id: projects-index
    class: generated-derived
    path: "_bmad-output/PROJECTS.md"
    applies_to: both
    rationale: >-
      computed from the set of _bmad-output/projects/*/.bmad-config.toml
      files present.
  - id: planning-artifacts-symlink
    class: generated-derived
    path: "_bmad-output/planning-artifacts"
    applies_to: both
    rationale: >-
      generated by bmad-switch from the active-project marker; Genesis
      ensures it exists and stays gitignored.
  - id: implementation-artifacts-symlink
    class: generated-derived
    path: "_bmad-output/implementation-artifacts"
    applies_to: both
    rationale: >-
      generated by bmad-switch from the active-project marker; Genesis
      ensures it exists and stays gitignored.
  - id: dreams-dir
    class: generated-derived
    path: "docs/dreams/"
    applies_to: both
    rationale: directory skeleton computed from the manifest; created if missing
  - id: specs-dir-legacy
    class: generated-derived
    path: "docs/specs/"
    applies_to: adopt
    rationale: >-
      legacy Tier-1 skeleton, created only when adopting a repo that
      already carries the legacy convention -- a fresh init never creates
      it.
  - id: project-subtree
    class: generated-derived
    path: "_bmad-output/projects/{{ slug }}/"
    applies_to: both
    rationale: directory skeleton computed from the manifest and the project slug

  # --- HYBRID-MANAGED-REGION (4): repo-owned file, tool-owned span inside.
  - id: agents-md
    class: hybrid-managed-region
    path: "AGENTS.md"
    applies_to: both
    rationale: the neutral contract must upgrade; the rest of the file is the repo's own
    format: html
    regions:
      - name: tiers
        anchor: ["## The tiers"]
      - name: portability-contract
        anchor: ["## Portability contract"]
      - name: dream-first-workflow
        anchor: ["## Dream-first workflow"]
  - id: claude-md
    class: hybrid-managed-region
    path: "CLAUDE.md"
    applies_to: both
    rationale: >-
      in an adopting repo this file commonly carries substantial
      repo-specific guidance around a small model core; the core must
      upgrade, the rest must never be touched.
    format: html
    regions:
      - name: tiers
        anchor: ["### Spec-driven, framework-neutral layout"]
      - name: bmad-multiproject
        anchor: ["### Multi-Project Pattern"]
  - id: gitignore
    class: hybrid-managed-region
    path: ".gitignore"
    applies_to: both
    rationale: the tier rules made executable, inside a file every repo owns
    format: hash
    regions:
      - name: model-ignores
        anchor: ["<top>"]
  - id: readme-badge
    class: hybrid-managed-region
    path: "README.md"
    applies_to: both
    rationale: >-
      opt-in, off by default -- no schema field for that exists yet, so
      this is descriptive only, not enforced here.
    format: html
    regions:
      - name: model-badge
        anchor: ["<top>"]

  # --- unclassified-deferred (3): model-adjacent, too repo-specific to
  # classify confidently at V1 -- recorded so deferral is explicit, not a gap.
  - id: claude-skills
    class: unclassified-deferred
    path: ".claude/skills/**"
    applies_to: both
    rationale: skill content is model-adjacent but too repo-specific to classify confidently at V1
  - id: pixi-toml-tasks
    class: unclassified-deferred
    path: "pixi.toml"
    applies_to: both
    rationale: >-
      pixi.toml task blocks are model-adjacent but too repo-specific to
      classify confidently at V1.
  - id: library-llms-full
    class: unclassified-deferred
    path: "docs/reference/library-llms-full.md"
    applies_to: both
    rationale: model-adjacent but too repo-specific to classify confidently at V1
