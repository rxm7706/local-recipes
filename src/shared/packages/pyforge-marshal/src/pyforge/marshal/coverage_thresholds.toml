# Per-station coverage floors for Story 19.3 / FR-131.
#
# Fleet defaults (CAP-4): unit >80%, integration >70%.
# Override a station under [stations.<slug>] only to document a deliberate
# temporary floor; absent keys inherit [defaults].

[defaults]
unit = 80.0
integration = 70.0

# Example override shape (unused — defaults apply to every station today):
# [stations.scribe]
# unit = 80.0
# integration = 70.0

# Per-MODULE exceptions ([modules."<dotted.module>"]) remain supported: a deliberate, dated,
# story-bound floor for one module that a Story retires. It can only LOWER the station floor
# for that module; `until` and `story` are mandatory so the debt is never anonymous. Same
# shape as the per-module mypy baseline (steward Story 66.1). The gate's OK line names every
# module held under an exception.
#
# NONE are held today. The last one — `pyforge.marshal.dispatch_supervisor.__main__` at 35%,
# opened by marshal Story 53.2 on 2026-09-20 — was retired by Story 53.3 the same day: the
# module is ports-driven unit-covered above the fleet floor
# (`tests/unit/test_dispatch_supervisor_main_loop.py`), so marshal carries no named coverage
# debt and the touched-module gate is whole again.
