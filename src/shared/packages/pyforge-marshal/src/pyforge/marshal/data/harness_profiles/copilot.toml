# GitHub Copilot CLI 1.0.80 (Story 22.8, FR-193 CAP-8). EMPIRICALLY
# VERIFIED 2026-08-27 on this machine: `copilot -p "<prompt>"
# --allow-all-tools` runs non-interactively and exits 0 (auth rode the
# existing GitHub credentials -- no login step). `--allow-all-tools` is
# documented as required for non-interactive mode. `-p/--prompt` takes the
# prompt as its VALUE, so `{prompt}` sits directly after it (unlike the
# positional-prompt CLIs).
#
# No cheap non-interactive authcheck exists in this build (no `auth`
# subcommand; probed live 2026-08-27) -- binary presence gates this profile
# and an auth failure surfaces in session.log (authcheck_note below).
#
# No model mapping: this CLI's `--model` vocabulary is its own (`auto`,
# provider-qualified ids) and none of marshal's tier names is a verified
# member, so the model flags are OMITTED with MRS-DISP-029 and the session
# runs on the CLI's default model -- honest over guessed.
#
# The binary ships in the repo's pixi env, not on a bare operator PATH --
# hence the fallback dir below.
name = "copilot"
binary = "copilot"
argv = [
  "-p",
  "{prompt}",
  "--allow-all-tools",
]
fallback_bin_dirs = [".pixi/envs/pyforge-guild/bin"]  # Story 46.12 (spec-pyforge-marshal CAP-263): only pyforge-guild exists at runtime (headroom-ai / the wire wrapper are Guild-feature deps)
authcheck_note ="No cheap non-interactive auth probe in CLI 1.0.80 (no auth subcommand); auth rides GitHub credentials and a failure surfaces at session start in session.log."
verified = true
notes = "Verified 2026-08-27: authenticated via GitHub credentials, smoke-tested -p --allow-all-tools shape (COPILOT-OK, exit 0). Same-day later re-probe reached the service but failed rc=1 'You have no quota' -- an account-quota condition, not an argv defect; nothing non-interactive pre-detects it (see authcheck_note), it surfaces in session.log."

# Story 46.10 (spec-pyforge-marshal CAP-197): wire compression at the harness
# seam, applied ONLY when policy's `[context]` block enables the `wire` layer
# (Story 28.1) with `"auto"` or `true`. Shape read from `headroom wrap
# copilot --help` (headroom-ai 0.37.0 class, the version this estate pins,
# probed live 2026-10-05): `wrap copilot` configures Copilot BYOK routing
# through the local Headroom proxy and passes everything after `--` through
# verbatim — the same argv-prefix contract as `wrap claude --`.
#
# NOT verified against a live wrapped session on this run: doing so costs a
# real premium-request quota round-trip (see notes above). The argv shape is
# read from the installed headroom's own `--help`; the seam is proven by the
# station tests through the packaged profile + an injectable stub wrapper.
#
# Operator caveat (Story 33.8): each dispatch passes a per-worktree
# ``--port {wire_port}`` (8800--9799, hash-derived) so parallel wrapped
# launches do not share headroom's default 8787 proxy.
[wrapper]
binary = "headroom"
argv = ["wrap", "copilot", "--port", "{wire_port}", "--"]
fallback_bin_dirs = [".pixi/envs/pyforge-guild/bin"]
store_env = "HEADROOM_WORKSPACE_DIR"
store_relpath = ".marshal/wire"
reversible = true
notes = "headroom-ai 0.37.0 (Apache-2.0), conda-forge. Live 2026-10-05: `headroom wrap copilot --help` confirms the subcommand; wrapped launch not smoke-tested (quota)."

[wrapper.env]
HEADROOM_MODE = "cache"
