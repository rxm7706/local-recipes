# Claude Code (Story 22.8, FR-193 CAP-8). EMPIRICALLY VERIFIED 2026-08-27 on
# this machine: `claude -p --permission-mode bypassPermissions "<prompt>"`
# runs non-interactively from an arbitrary directory and exits 0 with the
# prompt's output; no trust flag exists or is needed. The worktree is the
# launch cwd (the adapter runs Popen with cwd=<worktree>), so no --add-dir
# is required for in-worktree work.
#
# Detach decision (recorded): Popen-detached `-p`, deliberately NOT
# `--bg`/`--background` -- marshal's dispatch supervisor tracks the exact
# child PID it spawned, and a self-backgrounding CLI would make that PID a
# short-lived launcher (double-detach), orphaning supervision.
name = "claude"
binary = "claude"
# Story 46.11 (spec-pyforge-marshal CAP-262): pin Claude Code's built-in `agents-md`
# mod (2.1.277+) to `claude-md-and-agents-md` for every dispatched session, so nested
# AGENTS.md files (the atlas child) load regardless of the operator's user settings --
# the mod reads its option from user settings or `--settings`, never the project. The
# JSON is one whole token; `render_dispatch_argv` substitutes placeholders by literal
# `str.replace`, never `str.format`, so the braces are safe. An older Claude Code ignores
# the unknown plugin option and still reads AGENTS.md through CLAUDE.md's `@AGENTS.md`.
argv = [
  "-p",
  "--permission-mode",
  "bypassPermissions",
  "--settings",
  '{"pluginConfigs":{"agents-md@builtin":{"options":{"instructionFiles":"claude-md-and-agents-md"}}}}',
  "{model_args}",
  "{prompt}",
]
model_args = ["--model", "{model}"]
# Marshal's model tiers (opus/sonnet/haiku) ARE valid `--model` aliases for
# this CLI -- verbatim passthrough, no map needed.
model_passthrough = true
# `claude auth status` prints JSON incl. `"loggedIn": true` and exits 0 when
# authenticated (verified live 2026-08-27). Output-matched, not
# exit-code-only, per the CAP-8 authcheck contract.
authcheck_args = ["auth", "status"]
authcheck_ok_pattern = "\"loggedIn\":\\s*true"
verified = true
notes = "Verified 2026-08-27: authenticated (claude.ai), smoke-tested -p invocation shape."

# Story 28.2 (SPEC-marshal-token-economy CAP-2): the wire-compression
# wrapper, applied ONLY when policy's `[context]` block enables the `wire`
# layer (Story 28.1). Absent that declaration nothing below is read and the
# launch is byte-identical to pre-28.2.
#
# Shape read from `headroom wrap claude --help` (headroom-ai 0.37.0, the
# version pixi activates here, 2026-08-31): `wrap` starts the compressing
# proxy, points ANTHROPIC_BASE_URL at it, and launches Claude Code with
# everything after `--` passed through verbatim. That `--` is why this
# argv is a legal PREFIX: the profile's own rendered tail (`-p
# --permission-mode bypassPermissions [--model X] <prompt>`) follows it
# unchanged, byte for byte.
#
# `--code-memory none`: `wrap claude` otherwise registers the Serena
# code-memory MCP by default. This spec's own Never forbids standing up a
# second memory store-of-record behind Scribe's back (capture/recall is the
# fleet's only sanctioned memory face), and the code-structure layer is
# CAP-4/codegraph's job, not this one's. `--memory` (headroom's persistent
# cross-session memory) is likewise never passed -- it is off by default
# and stays off.
#
# NOT verified against a live wrapped session: doing so costs a real
# provider round-trip. The argv shape and the two env keys are read from
# the installed 0.37.0's own `--help`; the seam itself is proven by the
# station tests through an injectable stub wrapper.
#
# Operator caveat (updated Story 33.8): each dispatch now passes a per-
# worktree ``--port {wire_port}`` (8800--9799, hash-derived) so parallel
# wrapped launches no longer share headroom's default 8787 proxy. Two
# dispatches on the SAME worktree still share a port by design.
[wrapper]
binary = "headroom"
argv = ["wrap", "claude", "--code-memory", "none", "--port", "{wire_port}", "--"]
fallback_bin_dirs = [".pixi/envs/local-recipes/bin"]
# HEADROOM_WORKSPACE_DIR is headroom's canonical read-write state root
# (headroom/paths.py::workspace_dir), and the CCR store defaults to
# `<workspace>/ccr_store.db` (headroom/cache/compression_store.py::
# _create_default_ccr_backend). Pointing it INSIDE the loop home is what
# makes the store torn down with the worktree. `.marshal/` is gitignored so
# the store never dirties a loop worktree (`bmad-loop run` refuses to start
# on a dirty tree) and no `git add -A` can sweep it into a commit.
store_env = "HEADROOM_WORKSPACE_DIR"
store_relpath = ".marshal/wire"
reversible = true
notes = "headroom-ai 0.37.0 (Apache-2.0), conda-forge. CCR retrieval left ON (no --no-ccr): compression is reversible or it is inadmissible."

[wrapper.env]
# The NFR-14 admission requirement, declared rather than assumed: headroom's
# `cache` mode freezes prior turns to maximise the provider prefix-cache hit
# rate, where `token` mode may rewrite them for extra savings. `cache` is
# also the upstream default -- pinned here so a stray HEADROOM_MODE in an
# operator's environment cannot promote a marshal launch into the
# prefix-rewriting mode the spec declares inadmissible.
HEADROOM_MODE = "cache"
