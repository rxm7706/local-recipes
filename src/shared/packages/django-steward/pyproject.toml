[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "django-steward"
version = "0.1.0"
description = "Steward station portal (reusable Django app): chrome shell."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
dependencies = ["django>=5.1,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_steward_portal"]
