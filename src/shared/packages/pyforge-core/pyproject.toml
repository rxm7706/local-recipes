[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-core"
version = "0.1.0"
description = "Pure-stdlib leaf package shared by every pyforge station; depends on none of them (SPEC-pyforge-core CAP-1)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Leaf: zero third-party runtime dependencies (SPEC-pyforge-core CAP-1).
# Story 32.1 adds the stdlib hook-spec / entry-point loader in this package;
# do not add pluggy or setuptools here.
dependencies = []

[project.scripts]
pyforge = "pyforge.core.dispatch:main"

[project.entry-points."pyforge.core.hooks"]
dummy = "pyforge.core.hooks:DummyPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
