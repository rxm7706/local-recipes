[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-core"
version = "0.1.0"
description = "Pure-stdlib leaf package shared by every pyforge station; depends on none of them (SPEC-pyforge-core CAP-1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Story 14.1 scaffolds an empty leaf: zero third-party runtime dependencies,
# by design (SPEC-pyforge-core Constraints: "Leaf or nothing"). Primitive
# extraction (atomic write, verdict lattice, report envelope, exception
# root, subprocess guard) is Stories 14.2-14.4 and must not add one here.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
