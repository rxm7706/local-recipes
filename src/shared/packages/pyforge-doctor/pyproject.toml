[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-doctor"
version = "0.1.0"
description = "Pre-flight + fleet-watch diagnostics CLI (check/monitor/diagnose) consolidating pyforge-warden + cf_atlas signals into one schema-validated DoctorReport."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Lean, targeted dependency set (mirrors pyforge-warden's own doctrine):
# jsonschema validates the packaged DoctorReport envelope against
# data/report-schema.json. mcp is Story 2.1's primary atlas Watch-axis
# transport (sources/atlas.py, the sole sanctioned import site) -- mirrors
# pyforge-herald's identical mcp>=1.28.1 runtime dependency (pixi.toml's
# in-repo conda pin is the tighter mcp>=2.0.0 floor already in use
# repo-wide). PyYAML is Story 6.6's sources/chain.py frontmatter parser --
# the epic's own explicit departure from 6.4/6.5's hand-rolled-parser
# precedent, matching scripts/dream_chain_check.py's own `import yaml`
# (floor mirrors pixi.toml's own pyyaml>=6.0 in-repo conda pin). pyforge-core
# is Story 14.3's CAP-3/CAP-4 dependency -- verdict.py's Lattice and
# __main__.py's compose(BASE_ENVELOPE_SCHEMA, ...) call (mirrors
# pyforge-warden's identical pyforge-core run-dependency, Story 14.2).
dependencies = [
    "jsonschema",
    "mcp>=1.28.1",
    "PyYAML>=6.0",
    "pyforge-core",
]

[project.optional-dependencies]
# AD-1 (architecture spine): the ONLY cross-package code edge -- doctor ->
# warden (a library call into pyforge.warden.engines.run_doctor_checks, a
# later story). Declared here now (scaffold stage, Story 1.1) per AD-1;
# not yet wired into the root pixi.toml's [feature.pyforge-doctor.*] block
# since no code imports pyforge.warden yet (that lands with Story 1.2,
# which also wires this extra into the in-repo pixi env, mirroring
# pyforge-atlas's identical [gate] extra). This is an in-repo path
# dependency only -- pyforge-warden is not published to PyPI, so `pip
# install pyforge-doctor[gate]` only resolves inside this monorepo. No
# reverse warden -> doctor import may ever exist.
gate = ["pyforge-warden"]

[project.scripts]
doctor = "pyforge.doctor.__main__:main"

[project.entry-points."pyforge.core.hooks"]
doctor-gather = "pyforge.doctor.hooks:DefaultGatherPlugin"
doctor-prescribe = "pyforge.doctor.hooks:DefaultPrescribePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
