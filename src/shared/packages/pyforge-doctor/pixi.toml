# pyforge-doctor (Doctor): pixi build workspace member (warden mirror, Story 1.1).
#
# This is a MEMBER package of the parent `staged-recipes` workspace: there is
# deliberately NO [workspace] table here. The root ../../../../pixi.toml owns
# workspace config (channels, platforms, environments, the `preview = ["pixi-build"]`
# flag) and pulls this package in via a path dependency in the
# `[feature.pyforge-doctor.dependencies]` table. `pixi-build-python` builds
# this into a conda package.
#
# The check/monitor/diagnose implementation lands story-by-story against
# _bmad-output/projects/pyforge-doctor/planning-artifacts/ -- Story 1.1 only
# scaffolds the package layout, the frozen Finding/DoctorReport contract
# (models.py), and Doctor's own sole-owned exit-code projection (verdict.py).

[package]
name = "pyforge-doctor"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.host-dependencies]
python = ">=3.14"          # explicit build-time interpreter for pixi-build-python (matches pyforge-warden/pyforge-atlas)
hatchling = "*"

[package.run-dependencies]
python = ">=3.14"
jsonschema = "*"
pyyaml = ">=6.0"           # Story 6.6: sources/chain.py imports `yaml` at module scope -- without this the built .conda installs without PyYAML and the import raises ModuleNotFoundError (matches pyproject.toml's own `PyYAML>=6.0` and the root pixi.toml pin)
mcp = ">=1.28.1"                         # MCP SDK -- Story 2.1's atlas Watch-axis transport (sources/atlas.py); matches pyproject.toml's own floor (root pixi.toml's [feature.pyforge-doctor.dependencies] pins the dev env tighter at >=2.0.0, mirrors pyforge-herald's identical split)
