[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-steward"
version = "0.1.0"
description = "The Provisioner's CLI — credential lifecycle, deployment, provisioning and budget duties for the factory's platform layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Only what pyforge.steward actually imports. No CLI framework, mirroring the
# sibling stations' argparse dispatchers. PyYAML (Story 1.4): read/write of
# .steward/keys-inventory.yaml — also declared as a pixi run-dependency
# (pixi.toml), mirroring pyforge-warden's own dual declaration for the same
# library.
dependencies = ["PyYAML"]

[project.scripts]
steward = "pyforge.steward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
