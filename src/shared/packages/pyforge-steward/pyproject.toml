[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-steward"
version = "0.1.0"
description = "The Provisioner's CLI — credential lifecycle, deployment, provisioning and budget duties for the factory's platform layer."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Only what pyforge.steward actually imports. No CLI framework, mirroring the
# sibling stations' argparse dispatchers. PyYAML (Story 1.4): read/write of
# .steward/keys-inventory.yaml — also declared as a pixi run-dependency
# (pixi.toml), mirroring pyforge-warden's own dual declaration for the same
# library.
dependencies = ["PyYAML", "pyforge-core"]

[project.optional-dependencies]
# Story 9.1 (AD-1/AD-13): pyforge.steward.dashboard ships ONLY behind this
# extra, never a base dependency -- mirrors the pyforge-atlas -> pyforge-warden
# `[gate]` extra precedent verbatim. Floor matches the architecture Stack
# table's "Django 5.2 LTS"; 5.2 is already resolved and used elsewhere in this
# estate (wagtail/coderedcms), not merely aspirational.
#
# Story 9.5 (CAP-6): channels/daphne/asgiref/channels_redis complete the
# extra to the architecture Stack table's full ASGI runtime -- Django alone
# (Story 9.1's slice) could not yet run behind Channels at all. Floors:
# channels/channels_redis match the shipped version this estate's own local
# recipes pin (recipes/channels/meta.yaml, recipes/channels_redis/meta.yaml,
# both 4.2.0); daphne matches root pixi.toml's pre-existing (unrelated,
# wagtail/coderedcms) `[feature.local-recipes.dependencies]` pin; asgiref
# matches the architecture Stack table's own quote of daphne's transitive
# requirement (`asgiref >=3.5.2,<4`). All four verified to solve against
# this workspace's conda-forge/SelfExplainML channels before landing.
#
# Every pin here MUST stay byte-identical to root pixi.toml's
# `[feature.pyforge-steward.dependencies]` counterpart. That pair is enforced
# by tests/meta/test_invariants.py's pin-sync test (generalized in Story 9.5
# from a django-only check) rather than by a comment asking a human to
# remember (review pass 2 found the previous comment here had already
# drifted from the file it named).
dashboard = [
    "django>=5.2.17,<6",
    "channels>=4.3.2,<5.0",
    "daphne>=4.2.3,<5.0",
    "asgiref>=3.12.1,<4.0",
    "channels_redis>=4.3.0,<5.0",
]

[project.scripts]
steward = "pyforge.steward.cli:main"

# Story 32.2: today's deploy-profile backends are default plugins on the
# shared S-32.1 group. Do not add a parallel pyforge.steward.hooks group.
[project.entry-points."pyforge.core.hooks"]
harness = "pyforge.steward.deploy_profiles:HarnessDeployPlugin"
splunk = "pyforge.steward.deploy_profiles:SplunkDeployPlugin"
storagegrid = "pyforge.steward.deploy_profiles:StoragegridDeployPlugin"
eplx-gha = "pyforge.steward.deploy_profiles:EplxGhaDeployPlugin"
tachyon = "pyforge.steward.deploy_profiles:TachyonDeployPlugin"
jira = "pyforge.steward.deploy_profiles:JiraDeployPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

# Story 14.1: release catalogs (X.Y.Z.yaml) ship beside the upgrade duty. The
# directory carries an __init__.py, so hatchling already packages it through
# `packages = ["src/pyforge"]` above. A `force-include` of the same path used to
# sit here; current hatchling rejects the duplicate ("A second file is being added
# to the wheel archive at the same path"), which broke every pip install of this
# package (pyforge-steward-fresh-clone / five-tier CI, 2026-09-04).

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the lint gate `pixi run -e pyforge-guild ruff`
# / `ruff-format` reads THIS block (run from inside the package). Line width is ruff format's job;
# E501 is off because 290 legacy long strings/comments predate the gate -- format keeps code at 120.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"**/tests/**" = ["E402"]    # test modules that bootstrap sys.path before importing the package

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the type gate `pixi run -e pyforge-guild mypy`
# reads THIS block (run from inside the package). The [[tool.mypy.overrides]] entries below are the
# 2026-09-20 baseline: every finding the gate met on its first run, disabled PER MODULE with exactly
# the error codes that module trips -- never `ignore_errors` -- so the gate is live for every other
# module and every other code. Tighten or drop an entry whenever its module is touched.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true   # `pyforge` is a namespace package (no src/pyforge/__init__.py)
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Sibling stations and bmad_loop ship no py.typed marker; their imports are checked as untyped, not refused.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pyforge.steward.catalog"
disable_error_code = ["arg-type", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "pyforge.steward.dashboard.audit"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.steward.dashboard.migrations.0001_initial"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "pyforge.steward.dashboard.views_htmx"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.steward.deploy"
disable_error_code = ["arg-type", "operator"]

[[tool.mypy.overrides]]
module = "pyforge.steward.provision"
disable_error_code = ["arg-type", "index"]

[[tool.mypy.overrides]]
module = "pyforge.steward.sprint_ledger_query"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "pyforge.steward.suite_advance"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "pyforge.steward.sync"
disable_error_code = ["arg-type", "attr-defined", "index"]

[[tool.mypy.overrides]]
module = "pyforge.steward.upgrade"
disable_error_code = ["assignment", "attr-defined", "unused-ignore"]

[[tool.mypy.overrides]]
module = "pyforge.steward.workspace"
disable_error_code = ["arg-type", "assignment"]
