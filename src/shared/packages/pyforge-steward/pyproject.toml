[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-steward"
version = "0.1.0"
description = "The Provisioner's CLI — credential lifecycle, deployment, provisioning and budget duties for the factory's platform layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Only what pyforge.steward actually imports. No CLI framework, mirroring the
# sibling stations' argparse dispatchers. PyYAML (Story 1.4): read/write of
# .steward/keys-inventory.yaml — also declared as a pixi run-dependency
# (pixi.toml), mirroring pyforge-warden's own dual declaration for the same
# library.
dependencies = ["PyYAML", "pyforge-core"]

[project.optional-dependencies]
# Story 9.1 (AD-1/AD-13): pyforge.steward.dashboard ships ONLY behind this
# extra, never a base dependency -- mirrors the pyforge-atlas -> pyforge-warden
# `[gate]` extra precedent verbatim. Floor matches the architecture Stack
# table's "Django 5.2 LTS"; 5.2 is already resolved and used elsewhere in this
# estate (wagtail/coderedcms), not merely aspirational.
#
# Story 9.5 (CAP-6): channels/daphne/asgiref/channels_redis complete the
# extra to the architecture Stack table's full ASGI runtime -- Django alone
# (Story 9.1's slice) could not yet run behind Channels at all. Floors:
# channels/channels_redis match the shipped version this estate's own local
# recipes pin (recipes/channels/meta.yaml, recipes/channels_redis/meta.yaml,
# both 4.2.0); daphne matches root pixi.toml's pre-existing (unrelated,
# wagtail/coderedcms) `[feature.local-recipes.dependencies]` pin; asgiref
# matches the architecture Stack table's own quote of daphne's transitive
# requirement (`asgiref >=3.5.2,<4`). All four verified to solve against
# this workspace's conda-forge/SelfExplainML channels before landing.
#
# Every pin here MUST stay byte-identical to root pixi.toml's
# `[feature.pyforge-steward.dependencies]` counterpart. That pair is enforced
# by tests/meta/test_invariants.py's pin-sync test (generalized in Story 9.5
# from a django-only check) rather than by a comment asking a human to
# remember (review pass 2 found the previous comment here had already
# drifted from the file it named).
dashboard = [
    "django>=5.2,<6",
    "channels>=4.3.2,<5.0",
    "daphne>=4.2.3,<5.0",
    "asgiref>=3.11.1,<4.0",
    "channels_redis>=4.3.0,<5.0",
]

[project.scripts]
steward = "pyforge.steward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
