# pyforge-steward (Steward): pixi build workspace member (warden mirror, Story 1.1).
#
# MEMBER package — deliberately NO [workspace] table. The root
# ../../../../pixi.toml owns workspace config and pulls this in via a path
# dependency in [feature.pyforge-steward.dependencies].
#
# Story 1.1 delivers the package, the CLI dispatcher, and the Duty contract.
# The four duties (keys / deploy / provision / budget) land epic-by-epic against
# _bmad-output/projects/pyforge-steward/planning-artifacts/.

[package]
name = "pyforge-steward"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.host-dependencies]
python = ">=3.12"
hatchling = "*"

# `age` (Story 1.3): the real encrypt/decrypt engine `keys.py`'s
# `encrypt_file`/`decrypt_file` subprocess-wrap (AD-1/AD-3 — never vendored).
# Range-pinned, not exact-pinned (mirrors pyforge-warden's deptry/osv-scanner
# NFR-C1 precedent), to the exact version already locked repo-wide
# (`age --version` reports "(devel)", so the conda package version from
# pixi.lock/`conda list` — 1.3.1 — is the pin evidence, not the binary's own
# --version output).
[package.run-dependencies]
python = ">=3.12"
age = ">=1.3.1,<1.4"
# pyyaml (Story 1.4): `.steward/keys-inventory.yaml` read/write. Unpinned —
# mirrors pyforge-warden's own convention for this same library (no
# NFR-C1-style version-evidence case exists for a generic data-format
# parser the way there was for `age`).
pyyaml = "*"
