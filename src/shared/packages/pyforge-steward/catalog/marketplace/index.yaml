# BMAD marketplace index — Story 109.3, CAP-171.
#
# schema pyforge.bmad-marketplace/v1. A registry/estate.yaml document
# (source + modules) is the same reviewed-listings file the catalog engine
# already loads; this index is the skill/agent/module list the Pages site
# renders. Trust tier names are the v1 names. Do not put sample commands in
# here that the pilot skills do not actually run — those live in steps.md.
schema: pyforge.bmad-marketplace/v1
compatible_with: registry/estate.yaml
listings:
  - id: mason/environment
    kind: skill
    scope: mason
    slug: environment
    name: "@mason/environment"
    title: Lock and check one environment
    description: >-
      Resolve a teammate project's conda and pip manifests into one lockfile,
      then check that lockfile. No pixi environment name and no path inside
      local-recipes.
    version: "0.1.0"
    trust_tier: unverified
    source: estate-listings
    jobs: [find, install, create]
    path: skills/mason/environment
    contribution_lane: instructions-only
    install:
      targets: [.agents/skills, .claude/skills]
      origins: [github-pages, artifactory]
    requires:
      packages:
        - name: pyforge-mason
          published: false
          note: "PyPI, conda-forge, and SelfExplainML returned 404 on 2026-10-21"
        - name: pyforge-core
          published: false
          note: "Required by pyforge mason dispatch; same 404 check"
  - id: mason/package
    kind: skill
    scope: mason
    slug: package
    name: "@mason/package"
    title: Build a package locally
    description: >-
      Build a wheel and sdist from the project directory. Upload stays behind
      an explicit confirm. No pixi environment name and no path inside
      local-recipes.
    version: "0.1.0"
    trust_tier: unverified
    source: estate-listings
    jobs: [find, install, create]
    path: skills/mason/package
    contribution_lane: code-backed
    install:
      targets: [.agents/skills, .claude/skills]
      origins: [github-pages, artifactory]
    requires:
      packages:
        - name: pyforge-mason
          published: false
          note: "PyPI, conda-forge, and SelfExplainML returned 404 on 2026-10-21"
        - name: pyforge-core
          published: false
          note: "Required by pyforge mason dispatch; same 404 check"
  - id: warden/scan
    kind: skill
    scope: warden
    slug: scan
    name: "@warden/scan"
    title: Scan a project for dependency hygiene
    description: >-
      Run the warden scan gate on the current project. Engine probes are not
      a second verdict. No pixi environment name and no path inside
      local-recipes.
    version: "0.1.0"
    trust_tier: unverified
    source: estate-listings
    jobs: [find, install]
    path: skills/warden/scan
    contribution_lane: instructions-only
    install:
      targets: [.agents/skills, .claude/skills]
      origins: [github-pages, artifactory]
    requires:
      packages:
        - name: pyforge-warden
          published: false
          note: "PyPI, conda-forge, and SelfExplainML returned 404 on 2026-10-21"
        - name: pyforge-core
          published: false
          note: "Required by pyforge warden dispatch; same 404 check"
