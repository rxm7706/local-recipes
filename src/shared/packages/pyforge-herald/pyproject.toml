[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-herald"
version = "0.1.0"
description = "Dream-to-deck bridge CLI — seeds, pulls, and syncs Claude Design decks via the herald deck subcommands."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]

[project.scripts]
herald = "pyforge.herald.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]
