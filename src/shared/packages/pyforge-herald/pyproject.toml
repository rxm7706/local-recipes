[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-herald"
version = "0.1.0"
description = "Dream-to-deck bridge CLI — seeds, pulls, and syncs Claude Design decks via the herald deck subcommands."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Story 1.2 closes the architecture spine's Deferred question in favour of a
# genuine runtime dependency: `McpTransport` is the shipped V1 transport, so
# the MCP SDK ships with the package rather than living feature-side only.
# Story 6.4 declares `httpx2` explicitly even though `mcp` already pulls it
# in transitively (`Requires-Dist: httpx2>=2.5.0`): evidence.py imports it
# directly, so it is this package's own dependency, not an undeclared ride
# on mcp's -- a future mcp release dropping/renaming it should not silently
# break evidence.py.
# Story 14.2: deck_qa.py's render_gate imports `playwright.sync_api` and
# `PIL` directly, so both are real runtime dependencies of this package, not
# just of the pixi env it happens to build in. `pixi.toml`'s
# `[feature.pyforge-herald.dependencies]` splits playwright into two
# conda-forge packages (`playwright` the CLI/driver, `playwright-python` the
# `import playwright` bindings) -- PyPI ships both halves as one
# distribution, still named `playwright`, so that is the name declared here.
# Floor matches `pixi.toml`'s own `playwright` floor exactly (review pass,
# second round: a lower floor here let a `pip install` of the built wheel
# resolve an older playwright than the conda env's own solve -- playwright's
# Python package and its bundled browser build are version-coupled, so a
# mismatch is a real "browser doesn't match driver" failure mode, not just
# a cosmetic drift).
dependencies = [
    "mcp>=1.28.1",
    "httpx2>=2.5.0",
    "pyforge-core",
    "playwright>=1.62.1",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# Story 13.6: the ASGI host `webhook_host.py` mounts behind -- opt-in, not a
# base dependency, mirroring AD-8 ("no adopter may be asked to change
# frameworks to adopt"): only whoever actually runs the webhook as a live
# process (this extra's installer, and `.github/workflows/herald-live-demo.yml`)
# needs `daphne` at all; `webhook.py` itself stays a plain, framework-free
# ASGI3 callable. Floor is byte-identical to pyforge-steward's own
# `[dashboard]` extra's `daphne` pin (its Story 9.5 rationale: terminates
# both HTTP and WebSocket, already verified solvable in this workspace) and
# to root `pixi.toml`'s pre-existing (unrelated, wagtail/coderedcms) pin --
# reusing an already-verified floor rather than deriving a new one.
# `pixi.toml`'s `[feature.pyforge-herald.dependencies]` mirrors this pin,
# per the same extra<->feature convention steward's own `dashboard` extra
# established.
webhook-host = ["daphne>=4.2.2,<5.0"]

[project.scripts]
herald = "pyforge.herald.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 1.2: the FR-21 transport spike (test_live_design_spike.py) is the
# one test that reaches the real claude-design endpoint. The marker both
# carves it out of tests/conftest.py's egress-deny fixture and keeps it
# greppable; its own skipif on HERALD_LIVE_DESIGN is what keeps the default
# pyforge-herald-test gate offline.
#
# Story 13.6: `live_webhook` is the analogous carve-out for
# test_webhook_live_smoke.py -- a genuinely different kind of "live" (a
# real daphne subprocess bound to a real LOOPBACK socket, never reaching
# claude-design or any external host), kept as its own marker rather than
# reusing `live` so each marker's docstring stays literally true. Its own
# skipif on HERALD_LIVE_WEBHOOK is what keeps it out of the default
# pyforge-herald-test gate.
markers = [
    "live: reaches the real claude-design MCP endpoint (opt in with HERALD_LIVE_DESIGN=1)",
    "live_webhook: starts a real daphne subprocess and connects to it over a real loopback socket (opt in with HERALD_LIVE_WEBHOOK=1)",
]
