[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pyforge-herald"
version = "0.1.0"
description = "Dream-to-deck bridge CLI — seeds, pulls, and syncs Claude Design decks via the herald deck subcommands."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
# Story 1.2 closes the architecture spine's Deferred question in favour of a
# genuine runtime dependency: `McpTransport` is the shipped V1 transport, so
# the MCP SDK ships with the package rather than living feature-side only.
# Story 6.4 declares `httpx2` explicitly even though `mcp` already pulls it
# in transitively (`Requires-Dist: httpx2>=2.5.0`): evidence.py imports it
# directly, so it is this package's own dependency, not an undeclared ride
# on mcp's -- a future mcp release dropping/renaming it should not silently
# break evidence.py.
# Story 14.2: deck_qa.py's render_gate imports `playwright.sync_api` and
# `PIL` directly, so both are real runtime dependencies of this package, not
# just of the pixi env it happens to build in. `pixi.toml`'s
# `[feature.pyforge-herald.dependencies]` splits playwright into two
# conda-forge packages (`playwright` the CLI/driver, `playwright-python` the
# `import playwright` bindings) -- PyPI ships both halves as one
# distribution, still named `playwright`, so that is the name declared here.
# Floor matches `pixi.toml`'s own `playwright` floor exactly (review pass,
# second round: a lower floor here let a `pip install` of the built wheel
# resolve an older playwright than the conda env's own solve -- playwright's
# Python package and its bundled browser build are version-coupled, so a
# mismatch is a real "browser doesn't match driver" failure mode, not just
# a cosmetic drift).
# Story 15.1 (2026-08-22): pptx_pipeline.py imports `pptx` (python-pptx)
# directly for the template-parse-then-fill CAP-1 pipeline -- a real runtime
# dependency of this package, not just of the pixi env it builds in. Floor
# matches `pixi.toml`'s own `python-pptx` pin.
dependencies = [
    # Story 21.12: floor matches pixi.toml's own environment-level mcp pin
    # (>=2.2.0). Below 2.2.0 `mcp.client.streamable_http` still exports the
    # pre-rename `streamablehttp_client` this package no longer imports.
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
    "pyforge-core",
    "playwright>=1.62.1",
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
# Story 13.6: the ASGI host `webhook_host.py` mounts behind -- opt-in, not a
# base dependency, mirroring AD-8 ("no adopter may be asked to change
# frameworks to adopt"): only whoever actually runs the webhook as a live
# process (this extra's installer, and `.github/workflows/herald-live-demo.yml`)
# needs `daphne` at all; `webhook.py` itself stays a plain, framework-free
# ASGI3 callable. Floor is byte-identical to pyforge-steward's own
# `[dashboard]` extra's `daphne` pin (its Story 9.5 rationale: terminates
# both HTTP and WebSocket, already verified solvable in this workspace) and
# to root `pixi.toml`'s pre-existing (unrelated, wagtail/coderedcms) pin --
# reusing an already-verified floor rather than deriving a new one.
# `pixi.toml`'s `[feature.pyforge-herald.dependencies]` mirrors this pin,
# per the same extra<->feature convention steward's own `dashboard` extra
# established.
webhook-host = ["daphne>=4.2.2,<5.0"]

[project.scripts]
herald = "pyforge.herald.cli:main"

[project.entry-points."pyforge.core.hooks"]
herald-deck-export-marp = "pyforge.herald.exporters:MarpExportPlugin"
herald-deck-export-pptx = "pyforge.herald.exporters:PptxExportPlugin"
herald-deck-export-dc-html = "pyforge.herald.exporters:DcHtmlExportPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
# Story 1.2: the FR-21 transport spike (test_live_design_spike.py) is the
# one test that reaches the real claude-design endpoint. The marker both
# carves it out of tests/conftest.py's egress-deny fixture and keeps it
# greppable; its own skipif on HERALD_LIVE_DESIGN is what keeps the default
# pyforge-herald-test gate offline.
#
# Story 13.6: `live_webhook` is the analogous carve-out for
# test_webhook_live_smoke.py -- a genuinely different kind of "live" (a
# real daphne subprocess bound to a real LOOPBACK socket, never reaching
# claude-design or any external host), kept as its own marker rather than
# reusing `live` so each marker's docstring stays literally true. Its own
# skipif on HERALD_LIVE_WEBHOOK is what keeps it out of the default
# pyforge-herald-test gate.
markers = [
    "live: reaches the real claude-design MCP endpoint (opt in with HERALD_LIVE_DESIGN=1)",
    "live_webhook: starts a real daphne subprocess and connects to it over a real loopback socket (opt in with HERALD_LIVE_WEBHOOK=1)",
]

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the lint gate `pixi run -e pyforge-guild ruff`
# / `ruff-format` reads THIS block (run from inside the package). Line width is ruff format's job;
# E501 is off because 290 legacy long strings/comments predate the gate -- format keeps code at 120.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"**/tests/**" = ["E402"]    # test modules that bootstrap sys.path before importing the package

# Story 66.1 (spec-pyforge-steward CAP-153, 2026-09-20): the type gate `pixi run -e pyforge-guild mypy`
# reads THIS block (run from inside the package). The [[tool.mypy.overrides]] entries below are the
# 2026-09-20 baseline: every finding the gate met on its first run, disabled PER MODULE with exactly
# the error codes that module trips -- never `ignore_errors` -- so the gate is live for every other
# module and every other code. Tighten or drop an entry whenever its module is touched.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true   # `pyforge` is a namespace package (no src/pyforge/__init__.py)
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Sibling stations and bmad_loop ship no py.typed marker; their imports are checked as untyped, not refused.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pyforge.herald.auth"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "pyforge.herald.cli"
disable_error_code = ["arg-type", "assignment", "list-item", "override"]

[[tool.mypy.overrides]]
module = "pyforge.herald.db"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "pyforge.herald.deck_pipeline"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "pyforge.herald.deck_qa"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.herald.notices"
disable_error_code = ["arg-type", "assignment", "return-value", "unused-ignore"]

[[tool.mypy.overrides]]
module = "pyforge.herald.pptx_pipeline"
disable_error_code = ["arg-type", "misc", "return-value"]

[[tool.mypy.overrides]]
module = "pyforge.herald.state"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "pyforge.herald.station_api"
disable_error_code = ["assignment", "misc"]

[[tool.mypy.overrides]]
module = "pyforge.herald.sync_all"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "pyforge.herald.transport.mcp_transport"
disable_error_code = ["union-attr"]
