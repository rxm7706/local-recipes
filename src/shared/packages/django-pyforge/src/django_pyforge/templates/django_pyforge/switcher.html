<nav class="pyforge-switcher" aria-label="Station switcher">
  <ul>
    {% for portal in pyforge_portals %}
      <li>
        <a href="{{ portal.mount_token }}">{{ portal.station_name }}</a>
      </li>
    {% endfor %}
    {% for sidecar in pyforge_sidecars %}
      <li>
        <a href="{{ sidecar.href }}" rel="noopener noreferrer">{{ sidecar.name }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
