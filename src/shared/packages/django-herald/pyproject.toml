[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "django-herald"
version = "0.1.0"
description = "Herald station portal (reusable Django app): chrome shell + one-slug deck status."
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "rxm7706" }]
dependencies = ["django>=5.1,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_herald_portal"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["E402"]
