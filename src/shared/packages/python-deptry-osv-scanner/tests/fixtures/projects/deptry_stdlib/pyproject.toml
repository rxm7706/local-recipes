# deptry DEP005 fixture (Story 1.3): argparse is declared as a dependency but
# it ships in the Python standard library -> deptry emits DEP005 (stdlib
# dependency), which the default hygiene policy maps to warn (exit 0).
# argparse is ==-pinned + imported so the extractor treats it as a clean,
# decidable component (no version-withhold) and deptry does not also flag it
# DEP002 (unused). Verified message on deptry 0.25.1: "'argparse' is defined
# as a dependency but it is included in the Python standard library."
[project]
name = "deptry-stdlib-fixture"
version = "1.0.0"
dependencies = [
    "argparse==1.4.0",
    "requests==2.31.0",
]
