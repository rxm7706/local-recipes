  "runtime",
  "test",
  "lint",
  "dev",
  "container",
  "local-recipes",
  "agentic",
  "k8s",
  "monorepo-full-stack",
], solve-group = "default" }


# Default environment - absolute minimum (Python + pyyaml only, ~150MB)
# Philosophy: Force explicit environment choice - developers must choose local-dev or dev
# For development, use 'local-dev' (lightweight, no containers) or 'dev' (full stack with containers)
default = { features = ["base"], solve-group = "default" }


# Agentic AI development environment (private air-gapped, deidentified data)
agents = { features = [
  "runtime",
  "agentic",
  "container",
], solve-group = "default" }


# Vendor evaluation environment (public internet, proprietary external data)
vendor = { features = [
  "runtime",
  "test",
  "lint",
  "dev",
  "container",
], solve-group = "default" }


# Full development environment with all tools (testing, linting, dev tools, private air-gapped, deidentified data)
# Use this when you need to run tests, linting, or use development tools (gh, act, copier, etc.)
dev = { features = [
  "runtime",
  "test",
  "lint",
  "dev",
  "container",
], solve-group = "default" }

# Local development environment - same as dev but without container tools
# Use this for lightweight local development without podman/docker dependencies
local-dev = { features = [
  "runtime",
  "test",
  "lint",
  "dev",
  "agentic",
], solve-group = "default" }


