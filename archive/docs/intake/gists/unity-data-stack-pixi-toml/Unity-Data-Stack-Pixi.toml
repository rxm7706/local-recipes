], description = "[local-dev] Test MongoDB server connectivity" }


# Redis server (local-dev)
local-dev-init-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} init'", description = "[local-dev] Initialize Redis data/config directories" }
local-dev-start-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} start'", description = "[local-dev] Start Redis server" }
local-dev-stop-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} stop'", description = "[local-dev] Stop Redis server" }
