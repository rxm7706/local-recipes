# Feature: MonoRepo Full Stack - Compatibility Testing
# ============================================================================
# This environment combines ALL major libraries used across the monorepo
# to test for dependency conflicts and ensure full stack compatibility.
# Use this to validate that the entire technology stack can coexist.
#
# Purpose:
#   - Detect dependency conflicts early
#   - Validate monorepo-wide compatibility
#   - Test upgrades before applying to production
#   - Ensure Django + Dagster + Kedro + dbt can coexist
#
# Note: pixi is NOT included as a dependency (it's the package manager itself,
#       already enforced via requires-pixi = ">=0.59.0")
