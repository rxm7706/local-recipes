local-dev-dev-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} dev'", description = "[local-dev] Run Redis in dev mode" }
local-dev-test-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "[local-dev] Test Redis server connectivity" }
local-dev-cli-redis = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/redis-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} cli'", description = "[local-dev] Open Redis CLI" }


# MLflow server (local-dev)
test-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "Test MLflow server connectivity" }
local-dev-init-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} init-db'", description = "[local-dev] Initialize MLflow backend database" }
local-dev-start-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} start'", depends-on = [
  "local-dev-start-postgres",
], description = "[local-dev] Start MLflow tracking server (after Postgres)" }
local-dev-stop-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} stop'", description = "[local-dev] Stop MLflow tracking server" }
local-dev-status-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} status'", description = "[local-dev] Check MLflow server status" }
local-dev-dev-mlflow = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mlflow-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} dev'", description = "[local-dev] Run MLflow server in dev mode" }
local-dev-test-mlflow = { depends-on = [
  "test-mlflow",
], description = "[local-dev] Test MLflow server connectivity" }


# Dagster server (local-dev)
