# No dev tools, no test tools, no container build tools - minimal production footprint
# Container runtime provided by Kubernetes/OpenShift (CRI-O/containerd)


production = { features = ["runtime"], solve-group = "default" }


# DR (Disaster Recovery) environment - parallel production (main branch, restricted data)
# Mirrors production features but uses separate DR infrastructure
# No dev tools, no test tools, no container build tools - minimal production footprint
# Container runtime provided by Kubernetes/OpenShift (CRI-O/containerd)

dr = { features = ["runtime"], solve-group = "default" }


# OSS contribution environment - open source release (main/*, public data)
# Production-like but for public release/contribution
# No container build tools - images pre-built in CI/CD


oss = { features = ["runtime"], solve-group = "default" }


