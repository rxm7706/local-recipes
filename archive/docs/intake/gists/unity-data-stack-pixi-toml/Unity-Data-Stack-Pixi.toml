# ============================================================================
# Unity Data Stack - Pixi Configuration
# ============================================================================
# Monorepo workspace configuration following pixi best practices.
# Individual packages have their own pixi.toml files with isolated environments.
#
# Quick Start:
#   pixi install              - Install default environment
#   pixi install --all        - Install all environments
#   pixi run test             - Run all tests
#   pixi run lint             - Lint all code
#   pixi run check-all        - Run all quality checks (matches CI)
#
# Documentation:
#   docs/development/pixi-package-management.md
#   https://pixi.sh/latest/
#   pixi upgrade --pinning-strategy latest-up --exclude coloredlogs --exclude pydantic --exclude typer --exclude tomlkit --exclude python --exclude django --exclude wagtail --exclude nodejs --exclude coderedcms --exclude dagster
# ============================================================================

[workspace]
name = "unity-data-stack"
version = "2025.11.0"
description = "A comprehensive data orchestration platform built on Dagster, designed for enterprise-grade data engineering with reproducibility, observability, and developer experience"
authors = ["rxm7706 <95496360+rxm7706@users.noreply.github.com>"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/rxm7706/unity-data-stack"
repository = "https://github.com/rxm7706/unity-data-stack"
documentation = "https://github.com/rxm7706/unity-data-stack/tree/develop/docs"
channels = [
  "conda-forge",   # Primary channel (preferred)
  "SelfExplainML", # SelfExplainML packages (fallback)
] # Override via CONDA_CHANNEL_ALIAS and SELFEXPLAINML_CHANNEL_URL for airgap


platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]


# conda-pypi-map
requires-pixi = "==0.59.0"
solve-strategy = "highest"
channel-priority = "strict"


# ============================================================================
# Workspace Package Organization
# ============================================================================
# This monorepo contains multiple packages with individual pixi.toml files.
# Root pixi.toml provides workspace-level tasks that delegate to packages.
#
# Package Inventory (Clearer Separation of Concerns):
#
#   === Shared Libraries (1 package) ===
#   - src/shared/packages/common               # Core utilities
#
#   === Platform Infrastructure (10 active packages) ===
#   Orchestration & ML:
#   - src/platform/data-platform/infrastructure/dagster-server     # Dagster UI (port 3000)
#   - src/platform/data-platform/infrastructure/mlflow-server      # MLflow tracking (port 5000)
#   - src/platform/data-platform/infrastructure/nebari-server      # JupyterHub (K8s-based)
#
#   Data Storage:
#   - src/platform/data-platform/infrastructure/duckdb-server      # DuckDB analytics (port 8082)
#   - src/platform/data-platform/infrastructure/postgres-server    # PostgreSQL (port 5433)
#   - src/platform/data-platform/infrastructure/mongodb-server     # MongoDB (port 27018)
#   - src/platform/data-platform/infrastructure/redis-server       # Redis cache (port 6380)
#
#   Processing & Storage:
#   - src/platform/data-platform/infrastructure/celery-server      # Celery workers (Flower: 5555)
#   - src/platform/data-platform/infrastructure/minio-server       # MinIO S3 (ports 9000/9001)
#
#   Container Platform:
#   - src/platform/data-platform/infrastructure/ocpk8s-server      # OCP Kubernetes
#
#   === Domain Services (2 packages) ===
#   - src/tech-domains/customer/services/profile-service           # Profile API (port 8001)
#   - src/tech-domains/customer/services/web-app                   # Web app (port 8000)
#
#   === Excluded Services (2 packages - NOT in active use) ===
#   - src/platform/data-platform/infrastructure/airflow-server
#     Reason: SQLAlchemy <2.0 conflict with Dagster
#     Status: DEPRECATED - use Dagster instead
#
#   - src/platform/data-platform/infrastructure/sharepoint-mcp-server
#     Reason: pyjwt version conflict
#     Status: Excluded from default stack
#
#   To use excluded services: cd into directory and run pixi commands directly
#
#   === Empty Tech Domains (11 domains - scaffolding only) ===
#   Future services will be added here:
#   - src/tech-domains/ccibt/, cdo/, cdxo/, ct/, cto/, dti/, eft/,
#     ics/, ohot/, tcoo/
#
# Benefits of This Organization:
#   - Clear separation: shared libs vs platform vs domain services
#   - Package isolation via individual pixi.toml files
#   - Workspace-level tasks coordinate across packages
#   - Explicit documentation of excluded packages and reasons


# ============================================================================
# Airgap and Enterprise Mirrors
# ============================================================================
# For airgap/enterprise deployments, set environment variables to override defaults.
# All settings centralized in config/airgap.conf - no changes to pixi.toml needed!
#
# Package Mirrors:
#   CONDA_CHANNEL_ALIAS       - Override conda-forge channel
#                               (e.g., https://artifactory.example.com/api/conda/conda-forge)
#   SELFEXPLAINML_CHANNEL_URL - Override SelfExplainML channel for airgap
#                               (e.g., https://artifactory.example.com/api/conda/SelfExplainML)
#   PIP_INDEX_URL             - Override PyPI index
#                               (e.g., https://artifactory.example.com/api/pypi/pypi/simple)
#   UV_INDEX_URL              - Override PyPI index for uv (same as PIP_INDEX_URL)
#
# GitHub Enterprise:
#   GHE_HOST             - GitHub Enterprise Server host
#                          (e.g., https://github.example.com)
#   GHE_API_BASE         - Optional API base override
#                          Sets GH_HOST for gh CLI automatically
#
# Apply all settings:
#   source scripts/set-artifactory.sh --apply
#
# Configure in:
#   config/airgap.conf - Single source of truth for all airgap/enterprise settings
#
# See: docs/config/airgap.md for complete airgap configuration guide
#
# Note: GitHub Actions workflows automatically use the GHE instance they run on.
#       No workflow modifications are needed when switching between public/enterprise GitHub.


# ============================================================================
# System Requirements
# ============================================================================
# Document minimum system requirements for this project
# Useful for airgap deployments and ensuring compatibility
[system-requirements]
linux = "3.10" # Minimum Linux kernel version (RHEL 7+, Ubuntu 18.04+)
macos = "11.0" # Minimum macOS version (Big Sur+)


# ============================================================================
# PyPI Options
# ============================================================================
# Default PyPI configuration (overridden by PIP_INDEX_URL env var in airgap mode)
# These settings apply when installing PyPI packages via [pypi-dependencies]
[pypi-options]
# index-url defaults to https://pypi.org/simple (can be overridden by PIP_INDEX_URL)
# extra-index-url for additional package sources (use PIP_EXTRA_INDEX_URL in airgap mode)
# Uncomment for local package development:
# find-links = ["dist/"]  # For local wheel/sdist files


# ============================================================================
# Workspace Environment Variables
# ============================================================================
[activation.env]
PYTHONUNBUFFERED = "1"
PYTHONUTF8 = "1"
# --- Agent-Critical Variables ---
# Sets the default environment if direnv is not present or fails.
UNITY_ENV = "local-dev"
# Ensures Dagster commands work out-of-the-box.
DAGSTER_HOME = ".dagster-home/local-dev"
# Ensures Python can find source modules.
PYTHONPATH = "src"


# ============================================================================
# Base Dependencies - MINIMAL
# ============================================================================
# Only dependencies required by ALL environments
[dependencies]
python = ">=3.12.12,<3.15"
platformdirs = ">=4.5.1"
pixi = "==0.59.0"
pip = ">=25.3"
gitpython = ">=3.1.46"     # Git integration
hatch = ">=1.16.2"         # Modern Python packaging
hatch-vcs = ">=0.5.0"
hatchling = ">=1.28.0"
pyyaml = ">=6.0.3,<7"      # Essential config parsing utility
#
act = ">=0.2.84"
conda = ">=25.11.1"                # Package/environment management
conda-build = ">=25.11.1"
conda-index = ">=0.7.0"
conda-lock = ">=4.0.0"
conda-pack = ">=0.8.1"
rattler-build = ">=0.55.0"
rattler-index = ">=0.27.6"
pixi-pack = ">=0.7.5"
pixi-unpack = ">=0.7.5"
direnv = ">=2.37.1"
gh = ">=2.83.2"
python-build = ">=1.3.0"
setuptools = ">=80.9.0,<81"        # Setuptools version 81 introduces a significant breaking change by removing the pkg_resources
setuptools-scm = ">=9.2.2"
twine = ">=6.2.0"
uv = ">=0.9.21"
uv-build = ">=0.9.21"
uv-dynamic-versioning = ">=0.11.2"
wheel = ">=0.45.1"
beautifulsoup4 = ">=4.14.3"
requests = ">=2.32.5"


# ============================================================================
# Workspace Tasks
# ============================================================================
[tasks]
# ============================================================================
# Agent & Developer Public API
# ============================================================================
# These are the primary entry points for all development and CI.
start = { depends-on = ["local-dev-up"], description = "Start all services for local development." }
stop = { depends-on = ["local-dev-down"], description = "Stop all local development services." }
status = { depends-on = ["local-dev-status-all"], description = "Check the status of all services." }
verify = { depends-on = ["check-all"], description = "Run all verification gates (lint, test, format, etc.)." }

# Composite quality checks - matches CI
check-all = { depends-on = [
  "pre-commit",
  "lint",
  "format-check",
  "test",
  "linkcheck",
  "validate-packages",
  "local-dev-check-services",
], description = "Run all quality checks (matches CI)" }


# Testing
test = { cmd = "pytest src/", description = "Run all tests in workspace" }
test-all = { cmd = "pytest src/", description = "Run all tests in workspace" }
test-packages = { depends-on = [
  "test-common",
  "test-duckdb",
  "test-minio",
  "test-profile",
  "test-webapp-all",
], description = "Test all packages" }


# BDD Tests (Behave)
test-bdd = { cmd = "behave tests/features/ --format progress", description = "Run all BDD tests" }
test-bdd-verbose = { cmd = "behave tests/features/ --no-capture", description = "Run BDD tests with verbose output" }
test-bdd-smoke = { cmd = "behave tests/features/ --tags=@smoke --format progress", description = "Run smoke BDD tests" }
test-bdd-integration = { cmd = "behave tests/features/ --tags=@integration --format progress", description = "Run integration BDD tests" }
test-bdd-api = { cmd = "behave tests/features/api/ --format progress", description = "Run API BDD tests" }
test-bdd-customer = { cmd = "behave tests/features/customer/ --format progress", description = "Run customer domain BDD tests" }


# Linting and type checking
lint = { cmd = "ruff check src/ && pyright src/ && taplo format --check **/*.toml && find . -name '*.yaml' -o -name '*.yml' | grep -v 'vendors/' | grep -v 'knowledgebase/' | grep -v '.pixi/' | grep -v 'node_modules/' | xargs yamllint && prettier --check '**/*.{yaml,yml}'", description = "Run all linting (Python, types, TOML, YAML)" }
lint-all = { cmd = "ruff check src/", description = "Lint all source code" }
lint-toml = { cmd = "taplo format --check **/*.toml", description = "Validate TOML files" }
lint-yaml = { cmd = "find . -name '*.yaml' -o -name '*.yml' | grep -v 'vendors/' | grep -v 'knowledgebase/' | grep -v '.pixi/' | grep -v 'node_modules/' | xargs yamllint", description = "Validate YAML files (rules) - excludes vendors/" }
lint-yaml-format = { cmd = "prettier --check '**/*.{yaml,yml}'", description = "Check YAML formatting (style)" }
lint-packages = { depends-on = [
  "lint-common",
  "lint-duckdb",
  "lint-profile",
  "lint-webapp",
  "lint-webapp-frontend",
], description = "Lint all packages" }


# Formatting
format = { cmd = "ruff format src/ && taplo format **/*.toml && prettier --write '**/*.{yaml,yml}'", description = "Format all code (Python, TOML, YAML)" }
format-all = { cmd = "ruff format src/", description = "Format all source code" }
format-check = { cmd = "ruff format --check src/", description = "Check Python code formatting" }
format-toml = { cmd = "taplo format **/*.toml", description = "Format TOML files" }
format-yaml = { cmd = "prettier --write '**/*.{yaml,yml}'", description = "Format YAML files" }
format-packages = { depends-on = [
  "format-common",
  "format-duckdb",
  "format-profile",
  "format-webapp",
  "format-webapp-frontend",
], description = "Format all packages" }


# Pre-commit and link checking
pre-commit = { cmd = "pre-commit run --all-files --show-diff-on-failure", description = "Run pre-commit hooks on all files" }
linkcheck = { cmd = "sh scripts/test-links.sh || echo '⚠️  Linkcheck found errors (non-blocking - see issue #193)'", description = "Check documentation links (non-blocking)" }
validate-packages = { cmd = """
sh -c 'ROOT=$(pwd) \
  && cd src/shared/packages/common && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/postgres-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/redis-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/mongodb-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/minio-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/duckdb-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/dagster-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/mlflow-server && pixi install --locked \
  && cd $ROOT && cd src/platform/data-platform/infrastructure/celery-server && pixi install --locked \
  && cd $ROOT && cd src/tech-domains/customer/services/profile-service && pixi install --locked'
""", description = "Validate active package pixi.toml files (excludes ocpk8s, nebari, web-app)" }


# ============================================================================
# Package-specific tasks - delegate to package environments
# ============================================================================
# Common package
test-common = { cmd = "sh -c 'cd src/shared/packages/common && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "Test common package" }
lint-common = { cmd = "sh -c 'cd src/shared/packages/common && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} lint'", description = "Lint common package" }
format-common = { cmd = "sh -c 'cd src/shared/packages/common && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} format'", description = "Format common package" }


# DuckDB server (local-dev)
test-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "Test DuckDB server" }
lint-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} lint'", description = "Lint DuckDB server" }
format-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} format'", description = "Format DuckDB server" }
dev-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} dev'", description = "Run DuckDB server in dev mode" }
local-dev-init-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} init-db'", description = "[local-dev] Initialize DuckDB data directories" }
local-dev-start-duckdb-service = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} start'", description = "[local-dev] Start DuckDB server (background)" }
local-dev-stop-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} stop'", description = "[local-dev] Stop DuckDB server" }
local-dev-status-duckdb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/duckdb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} status'", description = "[local-dev] Check DuckDB server status" }
local-dev-test-duckdb = { depends-on = [
  "test-duckdb",
], description = "[local-dev] Test DuckDB server connectivity" }


# PostgreSQL server (local-dev)
test-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "Test PostgreSQL server connectivity" }
local-dev-init-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} init-db'", description = "[local-dev] Initialize PostgreSQL database cluster" }
local-dev-start-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} start'", description = "[local-dev] Start PostgreSQL server" }
local-dev-stop-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} stop'", description = "[local-dev] Stop PostgreSQL server" }
local-dev-status-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} status'", description = "[local-dev] Check PostgreSQL server status" }
local-dev-dev-postgres = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/postgres-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} dev'", description = "[local-dev] Run PostgreSQL server in dev mode" }
local-dev-test-postgres = { depends-on = [
  "test-postgres",
], description = "[local-dev] Test PostgreSQL server connectivity" }


# MongoDB server (local-dev)
test-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} test'", description = "Test MongoDB server connectivity" }
local-dev-init-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} init-db'", description = "[local-dev] Initialize MongoDB data directories" }
local-dev-start-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} start'", description = "[local-dev] Start MongoDB server" }
local-dev-stop-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} stop'", description = "[local-dev] Stop MongoDB server" }
local-dev-status-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} status'", description = "[local-dev] Check MongoDB server status" }
local-dev-dev-mongodb = { cmd = "sh -c 'cd src/platform/data-platform/infrastructure/mongodb-server && SE=${PIXI_ENVIRONMENT_NAME:-default}; case $SE in dev|test) ;; *) SE=default;; esac && pixi run -e ${SE} dev'", description = "[local-dev] Run MongoDB server in dev mode" }
local-dev-test-mongodb = { depends-on = [
