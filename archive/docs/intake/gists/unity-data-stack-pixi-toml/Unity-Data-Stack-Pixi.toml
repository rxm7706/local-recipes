configure-artifactory = { cmd = "sh scripts/set-artifactory.sh", description = "Configure Artifactory" }
verify-artifactory = { cmd = "sh scripts/set-artifactory.sh --verify", description = "Verify Artifactory configuration" }
show-artifactory = { cmd = "sh scripts/set-artifactory.sh --show", description = "Show Artifactory configuration" }

