local-dev-status-all = { depends-on = [
  "local-dev-status-services",
  "local-dev-status-domain-services",
], description = "[local-dev] Check status of ALL services" }


# Health verification - ALL services
local-dev-health-check = { depends-on = [
  "local-dev-check-services",
  "local-dev-check-domain-services",
], description = "[local-dev] Verify health of ALL services (runs connectivity tests)" }


# K8s/Nebari aggregates (dev/containerized) - optional
dev-init-k8s = { depends-on = [
  "dev-init-nebari",
], description = "[dev] Initialize Nebari configuration" }
dev-start-k8s = { depends-on = [
  "dev-start-ocpk8s",
  "dev-deploy-nebari",
], description = "[dev] Start local K8s cluster and deploy Nebari" }
dev-status-k8s = { depends-on = [
  "dev-status-ocpk8s",
  "dev-status-nebari",
], description = "[dev] Status for K8s cluster and Nebari" }
dev-check-k8s = { depends-on = [
  "dev-verify-nebari",
], description = "[dev] Verify Nebari deployment is healthy" }
dev-stop-k8s = { depends-on = [
  "dev-undeploy-nebari",
  "dev-stop-ocpk8s",
], description = "[dev] Stop Nebari and local K8s cluster" }


# Build images
build-domain-service = { cmd = "sh -c '${BUILD_CMD:-pixi exec podman} build -t ${DOMAIN}-${SERVICE} -f src/tech-domains/${DOMAIN}/services/${SERVICE}/Dockerfile .'", description = "Build a specific domain service image" }
build-all = { cmd = "sh -c '${BUILD_CMD:-pixi exec podman} build -t duckdb-server -f src/platform/data-platform/infrastructure/duckdb-server/Dockerfile . && ${BUILD_CMD:-pixi exec podman} build -t postgres-server -f src/platform/data-platform/infrastructure/postgres-server/Dockerfile . && ${BUILD_CMD:-pixi exec podman} build -t minio-server -f src/platform/data-platform/infrastructure/minio-server/Dockerfile . && ${BUILD_CMD:-pixi exec podman} build -t customer-profile-service -f src/tech-domains/customer/services/profile-service/Dockerfile .'", description = "Build all service images" }


# Environment-specific compose
int-up = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile integration up --build'", description = "Start integration environment" }
int-down = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile integration down'", description = "Stop integration environment" }
qa-up = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile testing up --build'", description = "Start QA environment" }
qa-down = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile testing down'", description = "Stop QA environment" }
uat-up = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile uat up --build'", description = "Start UAT environment" }
uat-down = { cmd = "sh -c '$(pixi run -q compose-cmd) -f docker-compose.yml --profile uat down'", description = "Stop UAT environment" }


# Container runtime checks
check-container-runtime = { cmd = "bash scripts/check-container-runtime.sh", description = "Check for available container runtime" }
dev-safe = { cmd = """
  bash -c '
    if bash scripts/check-container-runtime.sh >/dev/null 2>&1; then
      echo "Starting services via containers..."
      pixi run dev
    else
      echo "❌ Container runtime not available in this environment"
      echo "   Use direct service startup instead:"
      echo "     pixi run local-dev-start-duckdb (port 8082)"
      echo "     pixi run local-dev-start-profile (port 8001)"
      exit 1
    fi
  '
""", description = "Start development stack (checks for container support first)" }
dev-direct = { cmd = """
  echo "Starting services directly (no containers)..."
  echo "  - DuckDB server on http://localhost:8082"
  echo "  - Profile service on http://localhost:8001"
  echo ""
  echo "Note: Services will run in foreground. Press Ctrl+C to stop."
  echo "      For background processes, run each in a separate terminal."
""", description = "Show instructions for starting services without containers" }
check-tools = { cmd = "sh -c '(command -v podman >/dev/null 2>&1 || command -v docker >/dev/null 2>&1) && (command -v podman-compose >/dev/null 2>&1 || command -v docker >/dev/null 2>&1) && echo \"Container tools OK\" || (echo \"Missing Podman/Docker or compose support\"; exit 1)'", description = "Verify container tools are available" }
smoke = { cmd = "sh -c 'curl -sf http://localhost:8082/health && curl -sf http://localhost:8001/health'", description = "Run smoke tests" }


# GitHub Actions local testing (act)
act-list = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -l --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -l; elif command -v docker >/dev/null 2>&1; then act -l; else echo \"Error: Neither Podman nor Docker found. Install Podman Desktop or Docker Desktop.\"; exit 1; fi'", description = "List GitHub Actions workflows" }
act-ci-shared = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -W .github/workflows/ci-shared.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -W .github/workflows/ci-shared.yml; elif command -v docker >/dev/null 2>&1; then act -W .github/workflows/ci-shared.yml; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run shared CI workflow locally" }
act-ci-domains = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -W .github/workflows/ci-domains.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -W .github/workflows/ci-domains.yml; elif command -v docker >/dev/null 2>&1; then act -W .github/workflows/ci-domains.yml; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run domains CI workflow locally" }
act-link-check = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -W .github/workflows/link-check.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -W .github/workflows/link-check.yml; elif command -v docker >/dev/null 2>&1; then act -W .github/workflows/link-check.yml; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run link check workflow locally" }
act-constitutional = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -W .github/workflows/constitutional-validation.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -W .github/workflows/constitutional-validation.yml; elif command -v docker >/dev/null 2>&1; then act -W .github/workflows/constitutional-validation.yml; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run constitutional validation workflow locally" }
act-ci-all = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then (act -W .github/workflows/ci-shared.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock && act -W .github/workflows/ci-domains.yml --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock) 2>/dev/null || (act -W .github/workflows/ci-shared.yml && act -W .github/workflows/ci-domains.yml); elif command -v docker >/dev/null 2>&1; then (act -W .github/workflows/ci-shared.yml && act -W .github/workflows/ci-domains.yml); else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run package CI workflows locally (shared + domains)" }
act-pr = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then (act pull_request --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock) 2>/dev/null || act pull_request; elif command -v docker >/dev/null 2>&1; then act pull_request; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Run ALL PR workflows locally (constitutional, CI, configs, naming, etc.)" }
act-dry-run = { cmd = "sh -c 'if command -v podman >/dev/null 2>&1; then act -n --container-daemon-socket unix://$XDG_RUNTIME_DIR/podman/podman.sock 2>/dev/null || act -n; elif command -v docker >/dev/null 2>&1; then act -n; else echo \"Error: Neither Podman nor Docker found.\"; exit 1; fi'", description = "Dry run of GitHub Actions" }
validate-act = { cmd = "python scripts/validate_act_workflows.py", description = "Validate GitHub Actions compatibility" }
validate-act-pr-sync = { cmd = "python scripts/validate-act-pr-sync.py", description = "Validate act-pr workflow coverage" }
check-workflow-sync = { cmd = "python scripts/check_workflow_sync.py", description = "Check GitHub Actions / act sync status (lightweight)" }


