# Marshal project-policy layer for pyforge-genesis.
#
# The MIDDLE layer of AD-16's fixed precedence: Marshal defaults -> THIS FILE ->
# invocation flags, last wins. Found by convention at
# `planning-artifacts/marshal-policy.toml`; `marshal config --project-policy PATH`
# still overrides the lookup.
#
# WHY THIS FILE IS TRACKED WHILE THE RENDERED ONE IS NOT. Story 1.10 correctly made
# `.bmad-loop/policy.toml` a derived artifact (AD-12/AD-35) and untracked it, closing
# the F-1 cross-project bleed. But nothing reachable RENDERED it: the writer's only
# callers were its own tests, `marshal config` merely printed, and no pixi task called
# either. Merging that story then DELETED the file from pyforge-marshal's own loop
# home, leaving it with no policy at all -- the exact state 1.10's SEQUENCING (hard)
# note forbade. A derived artifact needs a governed SOURCE; this is that source.
#
# Only keys that differ from Marshal's built-in defaults appear here. Deliberately
# ABSENT:
#   * `worktree_seed_paths` -- generated from the project slug, so restating it would
#     create a second truth that could drift.
#   * `model_tier_map` -- it maps DIFFICULTY CLASS to {stage: model}, and which
#     difficulty applies to a story is explicitly "a later story's concern", so the
#     vocabulary does not exist yet. The rendered template already carries the stage
#     baselines (`[adapter] model = "sonnet"`, `[adapter.review] model = "fable"`),
#     so per-stage tiering works without it. Populate when FR-51 tier-batching lands.
#
# PROVISIONAL: genesis has no package yet (0/36 stories), so no
# pyforge-genesis-test exists. pyforge-deps-test is a REAL gate (it proves any
# pyforge-* package's manifests are complete) rather than another station's suite,
# which would pass regardless of genesis and guarantee a false green. Replace when
# Story 1.1 creates the package.
#
# ==========================================================================
# RETIRED 2026-07-30 — THIS STATION DOES NOT RUN.
# ==========================================================================
# `pyforge-genesis` is the CONSTITUTIVE project: it records the operating model
# and ships nothing. Its `epics.md` has said so since the 2026-07-28 split
# ("No epics, and that is the contract"). There are no stories here to gate.
#
# The reasoning above was SOUND for the world it was written in, and is kept
# because the pattern is reusable: `pyforge-deps-test` really is the right gate
# for a package-creating story, because it discovers `src/shared/packages/pyforge-*`
# by glob and therefore covers a package the day it lands -- and because a story
# cannot be gated by the pixi env it is creating (`--frozen` forbids the solve).
# What was stale was only its premise line, "genesis has no package yet (0/36
# stories)", which predates the split.
#
# The 36 installer stories moved to pyforge-marshal's feed as epics 7-12, and
# marshal's `verify_commands` gained `pyforge-deps-test` as its second entry for
# exactly this reason. See `pyforge-marshal/planning-artifacts/marshal-policy.toml`.
#
# The feed retirement is the load-bearing half: until 2026-07-30 this project's
# `sprint-status.yaml` still listed all 36 stories, and bmad-loop reads it, so
# launching this home would have built a package for a project that ships none.
#
# `verify_commands` is left EMPTY deliberately rather than deleted. An empty list
# renders an empty `[verify]` block, which bmad-loop treats as "no verify gate" --
# and with no stories to dispatch there is nothing for a gate to protect. If a
# story ever appears in this project's feed again, that is the drift signal
# genesis's own epics.md tells you to check for, not a policy to fill in.

# gate_mode: unattended (operator direction, 2026-07-26). This is the HUMAN approval
# gate ONLY -- the independent reviewer still runs on every story.
gate_mode = "none"


# verify_commands: EMPTY — retired, see the block above. This station has no
# stories; its buildable work runs from pyforge-marshal's feed as epics 7-12.
verify_commands = []
