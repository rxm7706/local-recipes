schema_version: 1

context:
  name: vulture
  version: 2.16

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/vulture-${{ version }}.tar.gz
  sha256: f8d9f6e2af03011664a3c6c240c9765b3f392917d3135fddca6d6a68d359f717

build:
  number: 0
  skip: match(python, "<3.9")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vulture = vulture.core:main

requirements:
  host:
    - python >=3.9
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >=3.9
    - if: match(python, "<3.11")
      then: tomli >=1.1.0

tests:
  - python:
      imports:
        - dev
        - dist
        - vulture
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - vulture --help

about:
  summary: Find dead code
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - rxm7706