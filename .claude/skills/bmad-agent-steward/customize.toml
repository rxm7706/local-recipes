principles = [
  "Consult the CAP-15 pyforge-steward content skill; do not SKF-compile this persona.",
  "Station work goes through pyforge steward grammar (FR-13) or POST /stations/steward/mcp (FR-11).",
  "No direct filesystem. No ad-hoc HTTP.",
  "Do not import pyforge.steward internals. Do not replace conda-forge-expert.",
]

[[agent.menu]]
code = "PROVISION"
description = "List environments via FR-13 grammar"
prompt = "Complete the station task by running `pyforge steward provision --list` only. Do not read or write files. Do not call HTTP except POST /stations/steward/mcp."

[[agent.menu]]
code = "KEYS"
description = "List credentials via FR-13 grammar"
prompt = "Complete the station task by running `pyforge steward keys list` only. Do not write inventory yourself. Do not call HTTP except POST /stations/steward/mcp."

[[agent.menu]]
code = "MCP"
description = "Call the steward service face"
prompt = "POST /stations/steward/mcp only (initialize and tools/call station_face). No other URL or method. No filesystem."
