language: python
description: >
  Direct-capture CLI for checked-in team memory. Agents use the scribe CLI
  (capture, graph compile, recall, index, catalog bmad-estate) rather than
  importing pyforge.scribe internals.
doc_urls:
  - url: _bmad-output/projects/pyforge-scribe/planning-artifacts/specs/spec-pyforge-scribe/contract.md
    label: scribe public contract (verbs, MCP tools, flag, exit codes)
forge_tier: Quick
created: '2026-08-25'
