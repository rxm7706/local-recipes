\u002Fspan>\n        <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em;\">Where it's going<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; opacity:0.7;\">Roadmap · not yet shipped<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px; opacity:0.72; margin-top:8px;\">Everything from here down is roadmap and vision — v1 is the gate described in Parts I–II.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 11 · ROADMAP -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">11<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Beyond v1 — now, next &amp; later<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 22px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">v1 ships the hygiene + security gate. <b>License<\u002Fb> and <b>currency<\u002Fb> complete the four axes next; the same manifest engine and report contract then generalize into a full policy platform — sequenced by how soon each piece lands.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px;\">\n      <div style=\"grid-column:1 / -1; display:flex; align-items:center; gap:14px; margin-top:4px;\">\n        <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.1em; padding:5px 14px; background:var(--color-accent); color:var(--color-bg);\">NOW<\u002Fspan>\n        <span style=\"font-size:14px; font-weight:700;\">v1.x — completes the four axes<\u002Fspan>\n        <span style=\"flex:1; height:2px; background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M5 3h9l5 5v13H5z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6M9 17h6\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">License compliance<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Metadata-based, no source scan — SPDX from the conda recipe <span class=\"code\">about:<\u002Fspan> and PyPI package metadata, normalized with <span class=\"code\">license-expression<\u002Fspan>, gated by allowed families; unknown → indeterminate, and written into the SBOM. <b>(Axis 3)<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Currency &amp; supportability<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Is each dep — and the Python runtime — on a supported line: LTS · N / N-1 · not EOL? Only current versions receive security patches. <b>(Axis 4)<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M4 4v16\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><path d=\"M8 20V13M13 20V9M18 20V15\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Baseline &amp; grandfathering<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Accept existing debt and gate only <b>new<\u002Fb> findings — teams adopt without hitting a wall of red on day one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M6 3v12\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"6\" r=\"3\"><\u002Fcircle><path d=\"M18 9v3a6 6 0 0 1-6 6H9\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Automated fix PRs<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Open remediation pull requests, not just findings — bump the fixed version and route it for review.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / -1; display:flex; align-items:center; gap:14px; margin-top:12px;\">\n        <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.1em; padding:5px 14px; border:2px solid var(--color-text);\">NEXT<\u002Fspan>\n        <span style=\"font-size:14px; font-weight:700;\">v2 — the governance layer<\u002Fspan>\n        <span style=\"flex:1; height:2px; background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M4 5h16M4 12h16M4 19h16\"><\u002Fpath><path d=\"M8 5v14\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Pluggable scanners<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Run multiple security backends behind one report — corroborate findings across engines, not a single source.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M9 11l2 2 4-4\"><\u002Fpath><path d=\"M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Allowlist enforcement<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Check every dependency against an approved-library registry — anything off-list is flagged before it lands.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Maintenance &amp; health<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Is the upstream alive, funded and resilient? Scores cadence, bus-factor and abandonment risk — feeding the OSS give-back loop: fund it, contribute back, or fix at source. <b>(Axis 6)<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M4 5h6M4 12h6M4 19h6\"><\u002Fpath><path d=\"M14 6l2 2 4-4M14 17l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Vendor-support backlog<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Auto-generate a remediation backlog as tracked work items — fix CVE, upgrade to the 3.14 LTS, drop EOL deps.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / -1; display:flex; align-items:center; gap:14px; margin-top:12px;\">\n        <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.1em; padding:5px 14px; background:var(--color-neutral-300);\">LATER<\u002Fspan>\n        <span style=\"font-size:14px; font-weight:700;\">Vision — where it heads<\u002Fspan>\n        <span style=\"flex:1; height:2px; background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 1v4M12 19v4M1 12h4M19 12h4\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Reachability analysis<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Flag a CVE only when the vulnerable code is actually called — the single biggest cut to false positives at fleet scale.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M12 3l9 16H3z\"><\u002Fpath><path d=\"M12 9v5M12 17h.01\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Malicious-package detection<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Install-script and behavior signals, signing and build attestation catch supply-chain attacks that known-CVE feeds miss entirely. <b>(Axis 5 · provenance)<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><path d=\"M16 3h5v5\"><\u002Fpath><path d=\"M4 20L21 3\"><\u002Fpath><path d=\"M21 16v5h-5\"><\u002Fpath><path d=\"M15 15l6 6\"><\u002Fpath><path d=\"M4 4l5 5\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Alternate-library suggestions<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">When a dep is unused, risky or unmaintained, suggest a vetted, better-supported replacement to migrate to.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); border-top:5px solid var(--color-accent); padding:24px 22px; display:flex; flex-direction:column;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.1\" stroke-linecap=\"square\"><circle cx=\"6\" cy=\"6\" r=\"3\"><\u002Fcircle><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M9 6h4a2 2 0 0 1 2 2v1M9 18h4a2 2 0 0 0 2-2v-1\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:18px; font-weight:800; margin-top:14px; line-height:1.1;\">Sibling ecosystems<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:8px 0 0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">The naming convention pays off — <span class=\"code\">js-depcheck-osv<\u002Fspan>, <span class=\"code\">go-&lt;tool&gt;-osv<\u002Fspan> siblings share osv-scanner + the report schema.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART IV -->\n  <div style=\"margin:40px -56px 0; background:var(--color-text); color:var(--color-bg); padding:20px 56px; display:flex; justify-content:space-between; align-items:baseline;\">\n    <div style=\"display:flex; align-items:baseline; gap:16px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.16em; color:var(--color-accent-400);\">PART IV<\u002Fspan>\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em;\">At enterprise scale<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; opacity:0.7;\">Vision · fleet &amp; ecosystem<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- 12 · ENTERPRISE SCALE -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">12<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">At enterprise scale — the control plane<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 24px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Governing a Python OSS footprint across thousands of repos needs more than a per-repo gate. Warden's report contract is the feed for a fleet-wide control plane.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:0; border-top:3px solid var(--color-text); border-left:2px solid var(--color-divider);\">\n\n      <div style=\"border-right:2px solid var(--color-divider); padding:20px 16px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Fleet intelligence<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:15px;\">\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Central estate dashboard<\u002Fb> — every report in one queryable view<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Cross-repo dependency graph<\u002Fb> — instant blast-radius for any CVE<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Risk trend tracking<\u002Fb> — alert when a repo's posture regresses<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>KEV / EPSS enrichment<\u002Fb> — prioritize by real-world exploitability<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Peer benchmarking<\u002Fb> — how your posture compares across the org<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Historical SBOM diff<\u002Fb> — what changed release to release<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Fix-at-source ledger<\u002Fb> — remediation traced to origin (fix → release → repackage), not a local pin<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>License-mix dashboard<\u002Fb> — copyleft / unknown-license exposure across the fleet<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Sponsorship candidates<\u002Fb> — most-depended-on yet under-funded deps, surfaced<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-right:2px solid var(--color-divider); padding:20px 16px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Policy &amp; governance<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:15px;\">\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Policy-as-code, central<\u002Fb> — org rules pushed to every repo, teams inherit<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Golden-path catalog<\u002Fb> — an approved, versioned library registry<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Waiver governance<\u002Fb> — approvals, expiry dashboards, audit trail<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Typosquat detection<\u002Fb> — catch lookalikes &amp; dependency confusion<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>GRC / risk-register sync<\u002Fb> — findings flow to your governance tools<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Deprecation &amp; EOL calendar<\u002Fb> — Python versions, frameworks<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Establish an OSPO<\u002Fb> — a standing office to own OSS policy, review and stewardship<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>License allow/deny families<\u002Fb> — permissive vs copyleft vs unknown, gated<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Outbound-OSS / publishing policy<\u002Fb> — what we may open-source, and how<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-right:2px solid var(--color-divider); padding:20px 16px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Supply-chain integrity<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:15px;\">\n          <div style=\"font-size:13px; line-height:1.4;\"><b>SBOM registry + VEX<\u002Fb> — serve CycloneDX, silence false positives<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Provenance &amp; signing<\u002Fb> — SLSA / Sigstore artifact verification<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Private-index enforcement<\u002Fb> — deps only from your mirror<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Registry / Artifactory gate<\u002Fb> — scan the pip + conda supply; a complete census, not a sample<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Upstream intel → blocklists<\u002Fb> — scan PyPI / conda-forge for malicious, typosquat &amp; stale; auto-build JFrog block/allow lists<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Maintainer risk signals<\u002Fb> — bus-factor, funding, abandonment<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Auditor evidence packs<\u002Fb> — attestation bundles on demand<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Data residency<\u002Fb> — regional / sovereign deployment<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Repackaging patch provenance<\u002Fb> — conda-forge build patches recorded as VEX (the PyPI↔conda delta)<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Source-fix registry<\u002Fb> — every patch we authored, typed: metadata · code · build · security<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Patch attribution &amp; upstreaming<\u002Fb> — each fix linked to its PR / release, ready to send upstream<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-right:2px solid var(--color-divider); padding:20px 16px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Scale &amp; operations<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:15px;\">\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Incremental PR-diff scans<\u002Fb> — re-scan only what changed<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Fleet-wide auto-remediation<\u002Fb> — batch upgrade PRs, rollback-safe<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>SIEM / ticketing<\u002Fb> — Jira, ServiceNow, Splunk, Slack<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>SSO / RBAC + evidence<\u002Fb> — SOC 2 / ISO export; air-gapped DB<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>API + webhooks + Terraform<\u002Fb> — policy as infrastructure<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Notification routing<\u002Fb> — on-call escalation policies<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>PyPI ↔ conda-forge tracking<\u002Fb> — source release then feedstock bump, with lag<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Auto NOTICE / attribution in CI<\u002Fb> — license obligations satisfied every build<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Contribute-back PR automation<\u002Fb> — upstream fixes instead of carrying forks<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px 16px; background:var(--color-accent-100);\">\n        <div style=\"font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Program management<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:15px;\">\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Remediation SLAs &amp; MTTR<\u002Fb> — time-to-fix targets, breach alerts<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Ownership &amp; chargeback<\u002Fb> — every repo/dep tied to an owning team<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Campaign mode<\u002Fb> — org-wide \"eradicate X\" drives with burn-down<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Auto-enrollment<\u002Fb> — new repos onboarded to policy, zero wiring<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>conda-forge onboarding<\u002Fb> — feedstock submission → merge → channel availability<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Python 3.14 support<\u002Fb> — upstream + feedstock compat PRs, tracked per dep<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Stewardship ownership<\u002Fb> — a named accountable owner per dependency<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Sponsorship &amp; funding budget<\u002Fb> — OSS give-back tracked as a program metric<\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.4;\"><b>Contribution OKRs &amp; burn-down<\u002Fb> — upstream work planned and measured<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 · OSS POLICY, GOVERNANCE & SUSTAINABILITY -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">13<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Open-source policy, governance &amp; sustainability<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 24px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Consuming OSS at scale is a stewardship responsibility, not just a risk to gate. Warden feeds the OSPO's policy, obligation and sustainability practice.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 20px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.75;\">OSPO<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:3px;\">Policy<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px; display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Usage &amp; contribution policy<\u002Fb> — one codified standard for adopting, forking and publishing OSS.<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>License allow / deny families<\u002Fb> — permissive vs copyleft vs unknown, enforced at the gate.<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>New-dependency intake<\u002Fb> — a review &amp; approval path before a library enters the estate.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 20px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.75;\">Compliance<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:3px;\">Governance<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px; display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>License-obligation tracking<\u002Fb> — attribution &amp; copyleft notices generated per release.<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Stewardship ownership<\u002Fb> — a named owner and accountable team for every dependency.<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Export-control &amp; provenance<\u002Fb> — origin, jurisdiction and compliance flags on record.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-accent); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-accent); color:var(--color-bg); padding:15px 20px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.85;\">Give back<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:3px;\">Sustainability<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px; display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Upstream funding<\u002Fb> — surface critical deps to sponsor (Tidelift, Sponsors, Open Collective).<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Maintainer &amp; community health<\u002Fb> — bus-factor, release cadence, abandonment risk.<\u002Fdiv>\n          <div style=\"font-size:13.5px; line-height:1.45;\"><b>Contribute-back tracking<\u002Fb> — upstream your fixes instead of forking; retire internal patches.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 · BY PERSONA -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">14<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">What each leader gets<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 24px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">The same report feeds four executive scorecards — each measured on a different outcome.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px;\">\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.72;\">Security &amp; risk<\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; margin-top:3px;\">CISO<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px; display:flex; flex-direction:column;\">\n          <div style=\"font-size:14.5px; font-weight:800; color:var(--color-accent-700); line-height:1.2;\">Provable, board-ready risk reduction<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:14px;\">\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Fleet risk score &amp; exposure heatmap<\u002Fb> — trended by business unit<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>MTTR &amp; SLA compliance<\u002Fb> — KEV / critical burn-down, breach alerts<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Audit evidence on demand<\u002Fb> — SOC 2 / ISO packs, SBOM + VEX, waiver trail<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Zero-day readiness<\u002Fb> — \"who's exposed to X\" in seconds<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.72;\">Developer experience<\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; margin-top:3px;\">CDXO<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px; display:flex; flex-direction:column;\">\n          <div style=\"font-size:14.5px; font-weight:800; color:var(--color-accent-700); line-height:1.2;\">A gate developers don't route around<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:14px;\">\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Gate-friction metrics<\u002Fb> — false-positive rate, PR-wait, override frequency<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Shift-left ergonomics<\u002Fb> — pre-commit / IDE hooks, <span class=\"code\">--explain<\u002Fspan> fixes<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Auto-fix throughput<\u002Fb> — % resolved by bot PRs, engineer hours saved<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Time-to-green<\u002Fb> — golden-path adoption &amp; new-repo onboarding<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.72;\">Portfolio &amp; cost<\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; margin-top:3px;\">CIO<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px; display:flex; flex-direction:column;\">\n          <div style=\"font-size:14.5px; font-weight:800; color:var(--color-accent-700); line-height:1.2;\">One view of the OSS portfolio<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:14px;\">\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Portfolio inventory<\u002Fb> — versions, license mix, EOL exposure, org-wide<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Modernization dashboard<\u002Fb> — version-lag, Python 3.14 migration progress<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Cost &amp; consolidation<\u002Fb> — duplicate deps, license spend, tool savings<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Policy conformance<\u002Fb> — % repos meeting the org baseline, exceptions register<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-accent); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-accent); color:var(--color-bg); padding:15px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.85;\">Data &amp; analytics<\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; margin-top:3px;\">CDAO<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px; display:flex; flex-direction:column;\">\n          <div style=\"font-size:14.5px; font-weight:800; color:var(--color-accent-700); line-height:1.2;\">Governed, reproducible data stacks<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:14px;\">\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Data/ML dependency governance<\u002Fb> — conda/pixi stacks, notebooks, pipelines<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Model &amp; pipeline SBOM lineage<\u002Fb> — which versions produced which dataset/model<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Diffable env reports<\u002Fb> — \"did our env upgrade introduce CVEs?\"<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4;\"><b>Report as a data product<\u002Fb> — the estate, queryable for trends &amp; forecasts<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:15px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.72;\">Platform &amp; operations<\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; margin- round:var(--color-accent); color:var(--color-bg);\">pixi<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      \n        <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider);\"><sc-raw-td style=\"padding:8px 14px; font-weight:700;\" class=\"code\">Allstar (OpenSSF)<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;\">Org security-policy enforcement<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;\">Policy-as-code actuator<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;\"><span style=\"font-size:11px; font-weight:700; padding:2px 8px; border:1.5px solid var(--color-text);\">Candidate<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px; white-space:nowrap;\"><span style=\"display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; margin-right:3px; background:var(--color-accent); color:var(--color-bg);\">pip<\u002Fspan><span style=\"display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; margin-right:3px; background:var(--color-accent); color:var(--color-bg);\">conda<\u002Fspan><span style=\"display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; margin-right:3px; background:var(--color-accent); color:var(--color-bg);\">pixi<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div style=\"margin-top:22px; border:2px solid var(--color-text); padding:18px 22px;\">\n      <div style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700); margin-bottom:12px;\">Standards Warden speaks — the contracts that make it pluggable<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n        <span class=\"tag tag-outline code\">purl<\u002Fspan><span class=\"tag tag-outline code\">vers<\u002Fspan><span class=\"tag tag-outline code\">OSV schema<\u002Fspan><span class=\"tag tag-accent code\">CycloneDX<\u002Fspan><span class=\"tag tag-outline code\">SPDX<\u002Fspan><span class=\"tag tag-outline code\">OpenVEX / CSAF<\u002Fspan><span class=\"tag tag-outline code\">SARIF<\u002Fspan><span class=\"tag tag-outline code\">CVE 5.x<\u002Fspan><span class=\"tag tag-outline code\">CVSS<\u002Fspan><span class=\"tag tag-outline code\">EPSS<\u002Fspan><span class=\"tag tag-outline code\">PEP 740<\u002Fspan><span class=\"tag tag-outline code\">PEP 639<\u002Fspan><span class=\"tag tag-outline code\">SLSA<\u002Fspan><span class=\"tag tag-outline code\">in-toto<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- START HERE -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">→<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Start here — the on-ramp<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 24px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Adoption starts at a terminal, not a pipeline. Three steps from first run to fleet gate.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n      <div style=\"border:2px solid var(--color-text); padding:26px 24px; display:flex; flex-direction:column;\">\n        <div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:44px; font-weight:900; line-height:1; color:var(--color-accent);\">1<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:800; margin:10px 0 8px;\">Try it locally<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.5; margin:0; color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Run <span class=\"code\">warden scan . --warn-only<\u002Fspan> at your terminal — see findings and clear one, no CI wiring needed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); padding:26px 24px; display:flex; flex-direction:column;\">\n        <div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:44px; font-weight:900; line-height:1; color:var(--color-accent);\">2<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:800; margin:10px 0 8px;\">Make it pass, honestly<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.5; margin:0; color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Lock (<span class=\"code\">pixi.lock<\u002Fspan>), file an expiring waiver, or fix the finding. Green is <b>earned<\u002Fb>, never faked.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-accent); padding:26px 24px; display:flex; flex-direction:column; background:var(--color-accent-100);\">\n        <div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:44px; font-weight:900; line-height:1; color:var(--color-accent);\">3<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:800; margin:10px 0 8px;\">Gate in CI<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.5; margin:0; color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Wire the same command — its exit code blocks risky merges. Same lattice, now running fleet-wide.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLOSING POSTER -->\n  <section style=\"margin:40px -56px 0; background:var(--color-accent); color:var(--color-bg); padding:56px;\">\n    <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; opacity:0.85;\">Honest by design — no false greens<\u002Fdiv>\n    <p style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:34px; line-height:1.12; letter-spacing:-0.015em; margin:16px 0 0; max-width:1040px;\">Warden refuses to fake a pass. If it can't prove your dependencies are safe, it fails — until you pin them, formally accept the risk, or explicitly run <span class=\"code\" style=\"font-weight:800;\">--warn-only<\u002Fspan>. An honest \"not verified\" beats a false \"all clear.\"<\u002Fp>\n    <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-top:36px; padding-top:20px; border-top:2px solid var(--color-bg); font-size:13px; font-weight:600;\">\n      <span><b>Warden<\u002Fb> · module <span class=\"code\">pyforge.warden<\u002Fspan> · dist <span class=\"code\">pyforge-warden<\u002Fspan><\u002Fspan>\n      <span>github/app-pyforge /&nbsp; · docs/specs/pyforge-warden.md<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:2200}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
