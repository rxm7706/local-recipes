  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fc5f4579-966c-47c3-b466-f735b98e9408\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"efde8794-2894-43fe-bdcc-edc3128ff2fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"7e5bd3fc-adbe-448b-908c-14a6bcc55d88\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fc5f4579-966c-47c3-b466-f735b98e9408\") format('woff2');\n  unicode-range: U+01 ckground: #cfcccb; }\n  .code { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 0.85em; letter-spacing: -0.01em; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:1240px; margin:0 auto; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); padding:56px 56px 0;\">\n\n  <!-- MASTHEAD -->\n  <header style=\"border-bottom:3px solid var(--color-text); padding-bottom:28px;\">\n    <div style=\"display:flex; justify-content:space-between; align-items:baseline; font-size:12px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; margin-bottom:22px;\">\n      <span style=\"color:var(--color-accent-700);\">BMAD-METHOD TECH SPEC · FULL AGENTIC AI-SDLC USING BMAD-METHOD<\u002Fspan>\n      <span style=\"color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Status — In progress · Planning complete<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:900; font-size:86px; line-height:0.94; letter-spacing:-0.02em; margin:0;\">Warden<\u002Fh1>\n    <div class=\"code\" style=\"font-size:15px; font-weight:700; margin-top:10px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">pyforge-warden<\u002Fdiv>\n    \n    <p style=\"max-width:1000px; font-size:20px; line-height:1.45; margin:20px 0 0; font-weight:500;\">One CLI that guards both Python ecosystems — the <b>PyPI<\u002Fb> world of applications and libraries, and the <b>conda / conda-forge<\u002Fb> world of scientific computing, analytics and ML/AI data platforms. Warden runs pluggable engines across <b>six axes<\u002Fb> — <b>hygiene<\u002Fb>, <b>security<\u002Fb>, <b>license<\u002Fb>, <b>currency<\u002Fb>, <b>provenance<\u002Fb> and <b>maintenance<\u002Fb> — and returns <span style=\"color:var(--color-accent-700); font-weight:700;\">one consolidated report<\u002Fspan>.<\u002Fp><div style=\"display:flex; gap:8px; margin-top:22px; flex-wrap:wrap;\">\n      <span class=\"tag tag-outline code\">&lt;language&gt;-&lt;hygiene-engines&gt;-&lt;security-engines&gt;<\u002Fspan>\n      <span class=\"tag tag-neutral\">Family naming convention<\u002Fspan>\n      <span class=\"tag tag-neutral\">SCA · not SAST<\u002Fspan>\n      <span class=\"tag tag-accent\">CI/CD quality gate<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- META STRIP -->\n  <div style=\"display:grid; grid-template-columns:repeat(5,1fr); border-bottom:2px solid var(--color-divider);\">\n    <div style=\"padding:20px 20px 20px 0; border-right:2px solid var(--color-divider);\">\n      <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Owner<\u002Fdiv>\n      <div style=\"font-size:19px; font-weight:700; margin-top:6px;\">RXM<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px; border-right:2px solid var(--color-divider);\">\n      <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Language<\u002Fdiv>\n      <div style=\"font-size:19px; font-weight:700; margin-top:6px;\">Python 3.12+<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px; border-right:2px solid var(--color-divider);\">\n      <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">CLI<\u002Fdiv>\n      <div style=\"font-size:19px; font-weight:700; margin-top:6px;\">argparse · stdlib<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px; border-right:2px solid var(--color-divider);\">\n      <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Scope<\u002Fdiv>\n      <div style=\"font-size:19px; font-weight:700; margin-top:6px;\">5 epics · 20 stories<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px 0 20px 20px;\">\n      <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Ecosystem<\u002Fdiv>\n      <div style=\"font-size:19px; font-weight:700; margin-top:6px;\">PyPI + conda-forge<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"margin:0 -56px; padding:46px 56px 0; border-bottom:3px solid var(--color-text);\">\n    <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; font-weight:700; color:var(--color-accent-700);\">Why Warden<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:900; font-size:58px; line-height:1.0; letter-spacing:-0.02em; margin:14px 0 0; max-width:1060px;\">One gate. Both Python ecosystems. <span style=\"color:var(--color-accent);\">Six axes of dependency trust.<\u002Fspan><\u002Fh2>\n    <div style=\"display:flex; margin-top:32px; border-top:2px solid var(--color-divider);\">\n      <div style=\"flex:1; padding:16px 14px 18px 0; border-right:2px solid var(--color-divider);\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">01<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">Hygiene<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; padding:16px 14px 18px; border-right:2px solid var(--color-divider);\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">02<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">Security<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; padding:16px 14px 18px; border-right:2px solid var(--color-divider);\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">03<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">License<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; padding:16px 14px 18px; border-right:2px solid var(--color-divider);\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">04<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">Currency<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; padding:16px 14px 18px; border-right:2px solid var(--color-divider);\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">05<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">Provenance<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; padding:16px 0 18px 14px;\"><div style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-size:20px; font-weight:800; color:var(--color-accent);\">06<\u002Fdiv><div style=\"font-size:14px; font-weight:700; margin-top:4px;\">Maintenance<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PART I -->\n  <div style=\"margin:40px -56px 0; background:var(--color-text); color:var(--color-bg); padding:20px 56px; display:flex; justify-content:space-between; align-items:baseline;\">\n    <div style=\"display:flex; align-items:baseline; gap:16px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.16em; color:var(--color-accent-400);\">PART I<\u002Fspan>\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em;\">The tool<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; opacity:0.7;\">Shipping in v1<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- 01 · THE PROBLEM -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:26px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">01<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">The problem<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:0;\">\n      <p style=\"font-size:17px; line-height:1.5; margin:0; padding-right:36px;\">Dependency hygiene and security compliance across enterprise infrastructure require <b>disjointed tools<\u002Fb>. Teams run <b>deptry<\u002Fb> and <b>osv-scanner<\u002Fb> as separate pipelines — friction that grows in Conda- and Pixi-heavy environments where <b>neither engine natively understands those manifests<\u002Fb>.<\u002Fp>\n      <div style=\"border-left:2px solid var(--color-divider); padding:0 28px;\">\n        <div style=\"font-size:48px; font-weight:800; font-family:'Archivo Expanded','Archivo',sans-serif; line-height:1; color:var(--color-accent);\">2<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.4; margin-top:8px;\">disconnected pipelines developers maintain by hand<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:2px solid var(--color-divider); padding:0 0 0 28px;\">\n        <div style=\"font-size:48px; font-weight:800; font-family:'Archivo Expanded','Archivo',sans-serif; line-height:1; color:var(--color-accent);\">0<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.4; margin-top:8px;\">native conda/pixi support in either engine as of 2026-07<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 · TWO ECOSYSTEMS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">02<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Two ecosystems, one gate<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 22px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Python isn't one ecosystem. Warden is built for both — and treats the scanning engines as <b>pluggable<\u002Fb>, not fixed.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n      <div style=\"border:2px solid var(--color-text); padding:28px; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:14px;\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\"><path d=\"M12 3l8 4v10l-8 4-8-4V7z\"><\u002Fpath><path d=\"M4 7l8 4 8-4M12 11v10\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Ecosystem 1 · PyPI<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:23px; font-weight:800; letter-spacing:-0.01em; line-height:1.05;\">Application Python<\u002Fdiv>\n        <div style=\"font-size:12.5px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">~850K packages · open upload, any license (incl. commercial)<\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:700; margin-top:12px; color:var(--color-accent-700);\">20% of footprint : ~400 shipped apps ≈ 2–3K libraries<\u002Fdiv>\n        <p style=\"font-size:14.5px; line-height:1.5; margin:12px 0 0; color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Apps, services, CLIs &amp; libraries. Manifests — <span class=\"code\">pyproject.toml<\u002Fspan>, <span class=\"code\">requirements.txt<\u002Fspan>, lockfiles — are read <b>natively<\u002Fb> by the engines.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-accent); padding:28px; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:14px;\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\" stroke-linecap=\"square\"><path d=\"M9 3h6M10 3v5l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\u002Fpath><path d=\"M7 14h10\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Ecosystem 2 · conda-forge<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:23px; font-weight:800; letter-spacing:-0.01em; line-height:1.05;\">Scientific &amp; Data Python<\u002Fdiv>\n        <div style=\"font-size:12.5px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">~30K feedstocks · curated, centrally governed FOSS-only<\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:700; margin-top:12px; color:var(--color-accent-700);\">80% of footprint : ~10 platforms ≈ 7–8K libraries<\u002Fdiv>\n        <p style=\"font-size:14.5px; line-height:1.5; margin:12px 0 0; color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Analytics, ML/AI, data platforms &amp; scientific computing on conda / pixi (NumPy, PyTorch, RAPIDS, notebooks). Manifests — <span class=\"code\">environment.yml<\u002Fspan>, <span class=\"code\">meta.yaml<\u002Fspan>, <span class=\"code\">recipe.yaml<\u002Fspan>, <span class=\"code\">pixi.toml<\u002Fspan> — which <b>no engine parses<\u002Fb>; Warden's manifest engine bridges them.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:2px solid var(--color-text);\">\n      <div style=\"border-right:2px solid var(--color-text); border-bottom:2px solid var(--color-text); padding:16px 18px;\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 1 · Hygiene<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">v1<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">deptry<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Is it actually used?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-text); border-bottom:2px solid var(--color-text); padding:16px 18px;\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 2 · Security<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">v1<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">osv-scanner<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Any known CVE?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-bottom:2px solid var(--color-text); padding:16px 18px; background:var(--color-accent-100);\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 3 · License<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">v1.x<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">license-expression<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Legally allowed?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-text); padding:16px 18px; background:var(--color-accent-100);\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 4 · Currency<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">v1.x<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">endoflife.date<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Supported / patchable?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-text); padding:16px 18px; background:var(--color-accent-100);\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 5 · Provenance<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">vision<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">Sigstore / SLSA<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Authentic &amp; untampered?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px; background:var(--color-accent-100);\">\n        <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:11px; letter-spacing:0.06em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Axis 6 · Maintenance<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent); color:var(--color-bg);\">vision<\u002Fspan><\u002Fdiv>\n        <div class=\"code\" style=\"font-size:16px; font-weight:700; margin:7px 0 4px;\">OpenSSF Scorecard<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Alive, funded, resilient?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13px; margin-top:12px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Engines are pluggable. <b>v1 ships hygiene + security<\u002Fb>; <b>license &amp; currency<\u002Fb> complete the v1.x gate; <b>provenance &amp; maintenance<\u002Fb> extend it — each axis a different question (used? vulnerable? allowed? patchable? authentic? maintained?), all behind one report.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 · SIX MANIFEST FORMATS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">03<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Six manifest formats — resolved natively<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 22px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">The manifest engine is the wedge: neither scanning engine parses conda/pixi manifests. No untrusted input is ever executed — <span class=\"code\">yaml.safe_load<\u002Fspan> only.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); border-top:2px solid var(--color-divider); border-left:2px solid var(--color-divider);\">\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">pyproject.toml<\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">PEP 621 · Poetry · PDM<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">tomllib<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">pixi.toml<\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">deps · pypi-deps · features<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">tomllib<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">requirements.txt<\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">one requirement per line<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">re / line-parse<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">environment.yml<\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">dependencies: + nested pip:<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">safe_load<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px; position:relative;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">meta.yaml <span style=\"color:var(--color-accent-700);\">v0<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">Jinja + <span class=\"code\"># [selector]<\u002Fspan> lines<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">neutralize → safe_load<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider); padding:20px;\">\n        <div class=\"code\" style=\"font-size:15px; font-weight:700;\">recipe.yaml <span style=\"color:var(--color-accent-700);\">v1<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:8px; color:color-mix(in srgb, var(--color-text) 62%, transparent);\">requirements: run: block<\u002Fdiv>\n        <span class=\"tag tag-neutral code\" style=\"margin-top:12px;\">safe_load<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 · PIPELINE -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:26px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">04<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">One invocation, one pipeline<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:stretch; gap:0;\">\n      <div style=\"flex:1; border:2px solid var(--color-text); padding:18px 16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:var(--color-accent);\">STEP 1<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:6px 0 8px;\">Discovery<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.4;\">Union coverage — every manifest found is scanned and reported per-manifest. No single winner.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; padding:0 8px; font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fdiv>\n      <div style=\"flex:1; border:2px solid var(--color-text); padding:18px 16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:var(--color-accent);\">STEP 2<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:6px 0 8px;\">Extraction<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.4;\">Flatten &amp; de-dup dependency names; filter base packages. No execution of untrusted input.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; padding:0 8px; font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fdiv>\n      <div style=\"flex:1.5; border:2px solid var(--color-accent); padding:14px 16px; background:var(--color-accent-100);\">\n        <div style=\"font-size:11px; font-weight:700; color:var(--color-accent-700);\">STEP 3 · PARALLEL<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:7px; margin-top:9px;\">\n          <div style=\"border:1.5px solid var(--color-accent-700); padding:7px 10px; font-size:12.5px;\"><b>A · Hygiene<\u002Fb> — deptry<\u002Fdiv>\n          <div style=\"border:1.5px solid var(--color-accent-700); padding:7px 10px; font-size:12.5px;\"><b>B · Security<\u002Fb> — osv-scanner<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; padding:0 8px; font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fdiv>\n      <div style=\"flex:1; border:2px solid var(--color-text); padding:18px 16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:var(--color-accent);\">STEP 4<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:6px 0 8px;\">Aggregation<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.4;\">Both branches merge into one <span class=\"code\">ComplianceReport<\u002Fspan> + human summary.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; padding:0 8px; font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fdiv>\n      <div style=\"flex:1; border:2px solid var(--color-text); padding:18px 16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:var(--color-accent);\">STEP 5<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:6px 0 8px;\">Teardown<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.4;\">Ephemeral files removed via <span class=\"code\">try/finally<\u002Fspan> — never mutate host or source.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 · OUTPUTS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:26px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">05<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">What comes out<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-left:2px solid var(--color-divider);\">\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 22px;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">ComplianceReport JSON<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 72%, transparent);\">The canonical artifact — schema-validated against a committed <span class=\"code\">report-schema.json<\u002Fspan> (JSON Schema 2020-12).<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 22px;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">Human summary<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 72%, transparent);\">A scannable stdout rollup for CI logs — the same data, never the source of truth.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 22px;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">CycloneDX SBOM<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 72%, transparent);\">Valid BOM with correct purls (<span class=\"code\">pkg:pypi<\u002Fspan> / <span class=\"code\">pkg:conda<\u002Fspan>) + honest per-manifest coverage.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:0 22px;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">Actionable findings only<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 72%, transparent);\">Package + location for hygiene; advisory ID + affected/fixed version for security. No theoretical noise.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 · VERDICT LATTICE + GATE -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:26px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">06<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">The severity-tiered gate<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1.15fr 1fr; gap:40px;\">\n      <div>\n        <div style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom:14px;\">Verdict lattice — highest wins<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:0; border:2px solid var(--color-text);\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; background:var(--color-accent); color:var(--color-bg);\"><span class=\"code\" style=\"font-weight:700;\">error<\u002Fspan><span style=\"font-size:12px; font-weight:700;\">exit 2 · operational<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; background:var(--color-accent-200); border-top:2px solid var(--color-text);\"><span class=\"code\" style=\"font-weight:700;\">policy-violation<\u002Fspan><span style=\"font-size:12px; font-weight:700;\">exit 1 · blocks merge<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; background:var(--color-accent-200); border-top:2px solid var(--color-divider);\"><span class=\"code\" style=\"font-weight:700;\">indeterminate<\u002Fspan><span style=\"font-size:12px; font-weight:700;\">exit 1 · unproven<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-top:2px solid var(--color-text);\"><span class=\"code\" style=\"font-weight:700;\">warn<\u002Fspan><span style=\"font-size:12px; font-weight:600;\">exit 0 · non-blocking<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-top:2px solid var(--color-divider);\"><span class=\"code\" style=\"font-weight:700;\">bypassed<\u002Fspan><span style=\"font-size:12px; font-weight:600;\">exit 0 · audited waiver<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-top:2px solid var(--color-divider);\"><span class=\"code\" style=\"font-weight:700;\">clean<\u002Fspan><span style=\"font-size:12px; font-weight:600;\">exit 0<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-top:2px solid var(--color-divider); color:color-mix(in srgb, var(--color-text) 62%, transparent);\"><span class=\"code\" style=\"font-weight:700;\">not-applicable<\u002Fspan><span style=\"font-size:12px; font-weight:600;\">exit 0 · non-Python<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px; display:flex; gap:8px; align-items:center;\">\n          <span style=\"font-size:12.5px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Frozen exit enum<\u002Fspan>\n          <span class=\"tag tag-outline code\">0<\u002Fspan><span class=\"tag tag-outline code\">1<\u002Fspan><span class=\"tag tag-outline code\">2<\u002Fspan><span class=\"tag tag-outline code\">130<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-bottom:2px solid var(--color-divider); padding-bottom:18px; margin-bottom:18px;\">\n          <div style=\"font-size:15px; font-weight:700;\">Default policy<\u002Fdiv>\n          <p style=\"font-size:14px; line-height:1.45; margin:8px 0 0;\">v1 blocks on <b>CVSS-critical CVEs only<\u002Fb>; high/medium/low + all hygiene warn. <b>v1.x adds a KEV tier<\u002Fb> — any CISA-KEV-listed advisory affecting a pinned version blocks regardless of CVSS. Configurable via <span class=\"code\">--fail-on<\u002Fspan>, <span class=\"code\">max_critical<\u002Fspan>, <span class=\"code\">--fail-on-kev<\u002Fspan>. Replaces the brittle \"any finding blocks\" gate.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-bottom:2px solid var(--color-divider); padding-bottom:18px; margin-bottom:18px;\">\n          <div style=\"font-size:15px; font-weight:700;\">Waivers as code<\u002Fdiv>\n          <p style=\"font-size:14px; line-height:1.45; margin:8px 0 0;\"><span class=\"code\">--bypass --reason<\u002Fspan> emits an expiring waiver stanza (default <b>14 days<\u002Fb>) the team commits. The tool <b>reads it, never writes the repo<\u002Fb> — loud, recorded, and <span class=\"code\">review_required<\u002Fspan>.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:15px; font-weight:700;\">Typed errors — each with an owner<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;\">\n            <span class=\"tag tag-outline code\">unparsable-manifest<\u002Fspan>\n            <span class=\"tag tag-outline code\">engine-unavailable<\u002Fspan>\n            <span class=\"tag tag-outline code\">engine-crash<\u002Fspan>\n            <span class=\"tag tag-outline code\">internal-error<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART II -->\n  <div style=\"margin:40px -56px 0; background:var(--color-text); color:var(--color-bg); padding:20px 56px; display:flex; justify-content:space-between; align-items:baseline;\">\n    <div style=\"display:flex; align-items:baseline; gap:16px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.16em; color:var(--color-accent-400);\">PART II<\u002Fspan>\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em;\">In practice<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; opacity:0.7;\">Running it today<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- 07 · SCOPE & USERS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:26px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">07<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Who runs it, at what scale<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:0; border-left:2px solid var(--color-divider);\">\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 24px;\">\n        <div style=\"font-size:15px; font-weight:700;\">Platform Engineers<\u002Fdiv>\n        <div style=\"font-size:13.5px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">CI/CD pipelines<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 24px;\">\n        <div style=\"font-size:15px; font-weight:700;\">DevSecOps Engineers<\u002Fdiv>\n        <div style=\"font-size:13.5px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Compliance &amp; SBOM data<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right:2px solid var(--color-divider); padding:0 24px;\">\n        <div style=\"font-size:15px; font-weight:700;\">Python developers<\u002Fdiv>\n        <div style=\"font-size:13.5px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">pip- + conda-sourced, any shape<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:0 0 0 28px; text-align:right;\">\n        <div style=\"font-size:44px; font-weight:800; font-family:'Archivo Expanded','Archivo',sans-serif; line-height:1; color:var(--color-accent);\">20k+<\u002Fdiv>\n        <div style=\"font-size:13px; margin-top:6px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">repo fleet, concurrent<br>(NFR1 scalability)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COVERAGE RINGS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">◎<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Three rings — scan the whole supply chain<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 26px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Warden runs at three depths. The further out it scans, the more it <b>prevents<\u002Fb> rather than reports.<\u002Fp>\n    <div style=\"display:flex; align-items:stretch; gap:0;\">\n      <div style=\"flex:1; border:2px solid var(--color-neutral-400); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-neutral-300); color:var(--color-text); padding:14px 16px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\"><span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Outside the firewall<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-neutral-400);\">vision<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:800; margin-top:4px;\">Public upstream<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 16px; font-size:13px; line-height:1.45; flex:1;\">Scan <b>PyPI &amp; conda-forge<\u002Fb> themselves — malicious packages, typosquats, name-squatting, stale or abandoned feedstocks. Threat intel on the open ecosystem.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 10px;\"><span style=\"font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fspan><span style=\"font-size:10px; font-weight:700; color:var(--color-accent-700); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;\">blocklists<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1; border:2px solid var(--color-accent); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-accent); color:var(--color-bg); padding:14px 16px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\"><span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; opacity:0.85;\">The firewall<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-bg); color:var(--color-accent);\">v1.x<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:800; margin-top:4px;\">Registry perimeter<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 16px; font-size:13px; line-height:1.45; flex:1; background:var(--color-accent-100);\">Turn that intel into <b>block / allow lists on Artifactory / JFrog<\u002Fb> — quarantine bad packages so they never cross the firewall. A census of everything that enters.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 10px;\"><span style=\"font-size:22px; color:var(--color-accent); font-weight:800;\">→<\u002Fspan><span style=\"font-size:10px; font-weight:700; color:var(--color-accent-700); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;\">clean pulls<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1; border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:14px 16px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\"><span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; opacity:0.75;\">Inside<\u002Fspan><span style=\"font-size:10px; font-weight:700; padding:1px 6px; background:var(--color-accent-400); color:var(--color-text);\">today<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:800; margin-top:4px;\">Consumption edge<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 16px; font-size:13px; line-height:1.45; flex:1;\">Scan <b>repos, desktops &amp; CI<\u002Fb> — the six axes on what apps actually pull. Precise per-project, but only sees what you scan.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:2px solid var(--color-text); padding:16px 22px; margin-top:24px; font-size:14px; line-height:1.5;\">Scan the <b>edge<\u002Fb> and you report what you found; scan the <b>supply<\u002Fb> and you prevent what enters. <span style=\"color:color-mix(in srgb, var(--color-text) 62%, transparent);\">The registry &amp; upstream rings are a security · license · provenance census — hygiene (unused deps) stays a repo-side axis.<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 · LOCAL MODE -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">08<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Local &amp; workstation mode<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 24px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">CI is the primary consumer — but the supported <b>first contact is a developer at a terminal<\u002Fb>. Same CLI, same exit codes.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n      <div style=\"border:2px solid var(--color-text); padding:24px 22px;\">\n        <div style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">First contact<\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:800; margin:8px 0; line-height:1.1;\"><span class=\"code\">--warn-only<\u002Fspan> at a terminal<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Trial the gate and clear a finding before wiring CI — adoption realistically starts here, not in a pipeline.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); padding:24px 22px;\">\n        <div style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Waiver authoring<\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:800; margin:8px 0; line-height:1.1;\">Local-only by design<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\"><span class=\"code\">--bypass<\u002Fspan> emits a waiver stanza <b>for the human to commit<\u002Fb> — the tool never writes the repo, so CI can't do this.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:2px solid var(--color-text); padding:24px 22px;\">\n        <div style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:800; color:var(--color-accent-700);\">Environment debugging<\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:800; margin:8px 0; line-height:1.1;\">Reproduce runner failures<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.45; margin:0; color:color-mix(in srgb, var(--color-text) 74%, transparent);\">Chase an <span class=\"code\">engine-unavailable<\u002Fspan> exit 2 outside the runner image; a <span class=\"code\">doctor<\u002Fspan> self-check verifies the engines are present.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:2px solid var(--color-accent); background:var(--color-accent-100); padding:16px 22px; margin-top:24px; font-size:14px; font-weight:600;\">Local mode never softens the gate — same verdict lattice, same exit codes, TTY-colour auto-detect, zero prompts.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 · FLOW PATHS -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">09<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Three ways a repo flows through the scanner<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 26px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">The same one invocation resolves differently by what it finds. Each discovered manifest travels one of these paths — reported per-manifest under union coverage.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px; align-items:stretch;\">\n\n      <!-- PATH A · PyPI -->\n      <div style=\"border:2px solid var(--color-text); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-text); color:var(--color-bg); padding:16px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.75;\">Path A · native<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:4px;\">PyPI project<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px; display:flex; flex-direction:column; flex:1;\">\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent);\">DETECT<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\"><span class=\"code\">pyproject.toml<\u002Fspan> · <span class=\"code\">requirements.txt<\u002Fspan> · <span class=\"code\">*.lock<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent);\">DELEGATE<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\"><b>deptry<\u002Fb> reads the source tree natively · <b>osv-scanner<\u002Fb> reads the native lockfile<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent);\">UNIFY<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\">Both signals merge into one <span class=\"code\">ComplianceReport<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-text); background:var(--color-neutral-200); padding:12px 14px; margin-top:auto;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em;\">OUTCOME<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;\">\n              <span class=\"tag tag-outline code\">clean<\u002Fspan><span class=\"tag tag-outline code\">warn<\u002Fspan><span class=\"tag tag-accent code\">policy-violation<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PATH B · Conda/Pixi wedge -->\n      <div style=\"border:2px solid var(--color-accent); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-accent); color:var(--color-bg); padding:16px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; opacity:0.85;\">Path B · the E1 wedge<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:4px;\">Conda / Pixi project<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px; display:flex; flex-direction:column; flex:1;\">\n          <div style=\"border:2px solid var(--color-accent-300); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent-700);\">DETECT<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\"><span class=\"code\">environment.yml<\u002Fspan> · <span class=\"code\">meta.yaml<\u002Fspan> · <span class=\"code\">recipe.yaml<\u002Fspan> · <span class=\"code\">pixi.toml<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-accent-300); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent-700);\">BRIDGE<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\">Neither engine parses these — the manifest engine extracts deps &amp; synthesizes a version-pinned <span class=\"code\">requirements.txt<\u002Fspan> from <span class=\"code\">pixi.lock<\u002Fspan> / <span class=\"code\">conda-lock<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-accent-300); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent-700);\">UNIFY<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\"><b>deptry<\u002Fb> + <b>osv-scanner<\u002Fb> run over the synthesized input<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-accent); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-accent); background:var(--color-accent-100); padding:12px 14px; margin-top:auto;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-accent-700);\">OUTCOME<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;\">\n              <span class=\"tag tag-outline code\">coverage-flagged<\u002Fspan><span class=\"tag tag-accent code\">indeterminate<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.35; margin-top:8px; color:color-mix(in srgb, var(--color-text) 68%, transparent);\">Name-only fallback records weaker coverage — routes to <span class=\"code\">indeterminate<\u002Fspan>, never a silent pass.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PATH C · Non-Python -->\n      <div style=\"border:2px solid var(--color-neutral-400); display:flex; flex-direction:column;\">\n        <div style=\"background:var(--color-neutral-300); color:var(--color-text); padding:16px 18px;\">\n          <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Path C · out of scope<\u002Fdiv>\n          <div style=\"font-size:19px; font-weight:800; margin-top:4px;\">Non-Python repo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px; display:flex; flex-direction:column; flex:1;\">\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">DETECT<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\">No supported Python / conda manifest at the root<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-neutral-500); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">SKIP<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\">Both engines bypassed — nothing to scan, nothing synthesized<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-neutral-500); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-divider); padding:12px 14px;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">REPORT<\u002Fdiv>\n            <div style=\"font-size:13px; line-height:1.4; margin-top:5px;\">Status recorded honestly so fleet dashboards don't see a failure<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:18px; color:var(--color-neutral-500); font-weight:800; line-height:1.9;\">↓<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-neutral-400); background:var(--color-neutral-200); padding:12px 14px; margin-top:auto;\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:color-mix(in srgb, var(--color-text) 55%, transparent);\">OUTCOME<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;\">\n              <span class=\"tag tag-neutral code\">not-applicable<\u002Fspan><span class=\"tag tag-neutral code\">exit 0<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.35; margin-top:8px; color:color-mix(in srgb, var(--color-text) 68%, transparent);\">Benign by design — a non-Python repo in the fleet never masquerades as a failure.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 · WHICH TOOL -->\n  <section style=\"padding:36px 0 8px;\">\n    <div style=\"display:flex; align-items:baseline; gap:18px; border-bottom:2px solid var(--color-text); padding-bottom:10px; margin-bottom:8px;\">\n      <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:22px; color:var(--color-accent);\">10<\u002Fspan>\n      <h2 style=\"font-size:26px; margin:0; letter-spacing:-0.01em;\">Which tool, when<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:14px; margin:0 0 20px; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Warden is the fleet edge — one of several scanning surfaces. It complements, not replaces, the atlas and container tooling.<\u002Fp>\n    <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:14px;\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"background:var(--color-text); color:var(--color-bg); text-align:left;\">\n          <sc-raw-th style=\"padding:12px 16px; width:60%; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;\">What you have<\u002Fsc-raw-th>\n          <sc-raw-th style=\"padding:12px 16px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;\">Reach for<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr style=\"background:var(--color-accent-100); border-bottom:2px solid var(--color-text);\"><sc-raw-td style=\"padding:12px 16px;\">Any repo, any org, <b>no atlas<\u002Fb> — a CI or terminal gate on your pinned deps (hygiene + CVEs)<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px; font-weight:800;\">Warden <span style=\"font-weight:400; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">(this tool)<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider);\"><sc-raw-td style=\"padding:12px 16px;\">The atlas host — gap / version-lag buckets, freshness-percentile policy, packaging worklists<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px; font-weight:700;\" class=\"code\">inventory-match --policy<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider);\"><sc-raw-td style=\"padding:12px 16px;\">Anything exotic — containers, K8s, live envs, third-party SBOMs, non-Python ecosystems<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px; font-weight:700;\" class=\"code\">scan-project<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"border-bottom:2px solid var(--color-text);\"><sc-raw-td style=\"padding:12px 16px;\">The migrated Kedro pipeline (future)<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px; font-weight:700;\">the FR-18 unified gate <span style=\"font-weight:400; color:color-mix(in srgb, var(--color-text) 60%, transparent);\">— assembles Warden's schema<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fsection>\n\n  <!-- PART III -->\n  <div style=\"margin:40px -56px 0; background:var(--color-text); color:var(--color-bg); padding:20px 56px;\">\n    <div style=\"display:flex; justify-content:space-between; align-items:baseline;\">\n      <div style=\"display:flex; align-items:baseline; gap:16px;\">\n        <span style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.16em; color:var(--color-accent-400);\">PART III<
