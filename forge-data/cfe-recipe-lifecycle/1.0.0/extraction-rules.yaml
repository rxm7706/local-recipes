# Extraction rules used to produce provenance-map.json for cfe-recipe-lifecycle 1.0.0.
# Generated by Story 12.7 (mason Epic 12) for reproducibility -- re-running the same
# extraction against the same source commit should reproduce the same entries[].

language: python
forge_tier: Quick
ast_grep_available: false
extraction_method: python-ast-quick-tier
extraction_tool: "python3 stdlib ast module (ast.parse + ast.unparse), not ast-grep"
extraction_scope:
  # Top-level (module-body) FunctionDef/AsyncFunctionDef -> export_type "function"
  # (non-underscore name) or "internal-function" (underscore-prefixed name).
  # Top-level ClassDef -> export_type "class".
  # Public methods (non-underscore, excluding __init__/__repr__/__str__/__eq__/__hash__)
  # inside a top-level class -> export_type "method", nested as "ClassName.method_name".
  # Underscore-prefixed methods -> export_type "internal-method".
  functions: true
  async_functions: true
  classes: true
  methods: public-and-internal
  dunder_methods: excluded
  nested_functions: excluded  # only module-body and class-body definitions are visited
signature_capture:
  positional_args: true
  posonly_args: true
  vararg: true
  kwonly_args: true
  kwarg: true
  type_annotations: "captured via ast.unparse() when present, else omitted"
  default_values: "presence marked as '...' (values not captured, to avoid leaking secrets/literals verbatim into the provenance map)"
  return_type: "captured via ast.unparse(node.returns) when present, else null"
confidence_tier: T1-low  # Quick tier ceiling -- source read via a deterministic parser,
                          # not the ast-grep-backed T1 extraction Forge/Forge+/Deep tiers use
source_files_scanned: 25
source_commit: ffcdcce7163b05efb701bb0bb11c4e8bfd74dca5
source_ref: local
