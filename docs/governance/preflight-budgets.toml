# Per-lane preflight budgets (spec-pyforge-steward CAP-175 / Story 117.5).
# Values are journal-derived medians from green runs measured 2026-10-27
# (132 runs across worktrees; see spec-pyforge-steward .memlog.md CAP-175).
# preflight-budget warns when a lane's median of the last five green runs
# exceeds 1.5× its budget. Missing lanes inherit [defaults] by run mode.
#
# Story 124.2 (spec-pyforge-steward:CAP-175) added the lanes its split made:
# the live-tree halves of atlas, herald, marshal, mason, scribe and warden, and
# pyforge-core's and the testing kit's two halves, which replace their
# whole-suite lanes (`pyforge-core-test` and `pyforge-testing-kit-test` are
# cmd-less aggregates since steward Story 124.1, so the preflight runs their
# halves). Their values are the first measured medians: three standalone runs
# of `pixi run --frozen -e <env> <task>` each on 2026-11-12 (16 cores, one lane
# at a time; herald's with TMPDIR off tmpfs, as the preflight's lane scratch
# sets it), rounded to the second. Scribe's live half had one red test in each
# run (test_spec_not_behind_memlog, behind until steward Story 122.5 re-derives
# spec-pyforge-steward); its time stands. The preflight runs lanes side by
# side, so its journal medians run higher; the next re-measure reads the journal.
#
# CHANGING THIS FILE IS A GOVERNANCE ACT — same convention as
# coverage-thresholds.toml beside it.

