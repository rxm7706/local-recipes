# Per-lane preflight budgets (spec-pyforge-steward CAP-175 / Stories 117.5 and 117.15).
#
# [lanes] is each lane's wall seconds inside a full preflight. preflight-budget warns
# when a lane's median of the last five green runs exceeds 1.5× its budget; a lane
# with no row inherits [defaults] by run mode.
#
# [work] is each lane's CPU seconds: what its processes used, measured as the lane is
# reaped and journaled as `cpu_seconds`. The run reads both tables to order and size
# the lanes its own journal has no green run of (a fresh worktree): seconds rank a
# lane, work sizes an xdist lane's share of the cores. Neither table moves a verdict.
#
# Re-measured 2026-11-26 (steward Story 117.15, then Story 117.22) from full preflights of all fifty
# lanes on one machine (8 cores, 16 threads; TMPDIR off tmpfs), each lane's median.
# The second measurement follows Stories 117.19 to 117.22, herald 59.1 and doctor
# 67.1, which moved herald's live half (its builds side by side), steward's and
# doctor's live halves, and every lane an agent session starts (bytecode).
# The values before it were medians of 2026-10-27 and 2026-11-12, taken before
# Stories 117.14 to 117.16, mason 48.1, doctor 66.1 and herald 58.1 moved the lanes
# they name. `test-ci@local-recipes` and `lint-types@pyforge-guild` are not preflight
# lanes of a full run and keep their earlier values.
#
# CHANGING THIS FILE IS A GOVERNANCE ACT — same convention as
# coverage-thresholds.toml beside it.

