# Per-lane preflight budgets (spec-pyforge-steward CAP-175 / Story 117.5).
# Values are journal-derived medians from green runs measured 2026-10-27
# (132 runs across worktrees; see spec-pyforge-steward .memlog.md CAP-175).
# preflight-budget warns when a lane's median of the last five green runs
# exceeds 1.5× its budget. Missing lanes inherit [defaults] by run mode.
#
# CHANGING THIS FILE IS A GOVERNANCE ACT — same convention as
# coverage-thresholds.toml beside it.

