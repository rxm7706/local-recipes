version: 1
rows:
- package: bmad-method
  env: pyforge-guild
  realize:
    # {locked} is the version the refresh locked; --package-root lets the apply
    # three-way re-apply local edits to installer-owned files. A target needs a
    # curated catalog under pyforge/steward/data/bmad_core_releases/. The apply
    # switches the checkout to its own review branch, uncommitted.
    steps:
    - - pyforge
      - steward
      - upgrade
      - bmad-core
      - --target
      - '{locked}'
      - --apply
      - --package-root
      - .pixi/envs/pyforge-guild/lib/node_modules/bmad-method
    - - pyforge
      - steward
      - upgrade
      - prove-landed
    operator_gate: true
  probe:
    expect: locked-version
    path: _bmad/_config/manifest.yaml
    key: installation.version
  test:
  - bmad-drift-check
  - bmad-estate-check
  owner: pyforge-steward
  authority: CAP-10
  notes: Core apply then prove-landed
  class: installer-tree
