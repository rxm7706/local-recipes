- package: bmad-method
  env: pyforge-guild
  realize:
    steps:
    - - pyforge
      - steward
      - upgrade
      - bmad-core
      - --apply
    - - pyforge
      - steward
      - upgrade
      - prove-landed
    operator_gate: true
  probe:
    expect: locked-version
    path: _bmad/_config/manifest.yaml
    key: installation.version
  test:
  - bmad-drift-check
  - bmad-estate-check
  owner: pyforge-steward
  authority: CAP-10
  notes: Core apply then prove-landed
  class: installer-tree
