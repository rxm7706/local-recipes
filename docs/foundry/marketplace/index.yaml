# BMAD marketplace index — Story 109.3, CAP-171.
#
# schema pyforge.bmad-marketplace/v1 plus index_version 1 (P2).
# Each skills/<scope>/<slug>/listing.yaml is one row. This file is the
# committed concatenation until `bmp index build` (Story 109.4).
# A registry/estate.yaml document (source + modules) still loads as module
# listings. bmp tier maps onto trust_tier:
#   community -> unverified
#   estate-reviewed -> community-reviewed
#   bmad-certified -> bmad-certified
# These three pilots are community / unverified: no review record, and
# contribution CI has not run. They are code-backed because each requires
# a package. Instructions-only is a skill with no package.
# Sample checksums, example hosts, and the paper card's lock command are
# not copied. steps.md is the runbook.
schema: pyforge.bmad-marketplace/v1
index_version: 1
compatible_with: registry/estate.yaml
generated_by: hand
listings:
  - id: mason/environment
    kind: skill
    scope: mason
    slug: environment
    name: "@mason/environment"
    display_name: Lock and check one environment
    title: Lock and check one environment
    summary: Lock a project into one conda-lock file and check that lockfile.
    description: >-
      Resolve a teammate project's conda and pip manifests into one lockfile,
      then check that lockfile. No pixi environment name and no path inside
      local-recipes.
    version: "0.1.0"
    tasks: [lock-environment, check-lockfile]
    keywords: [conda, pip, lockfile]
    category: development
    subcategory: environments
    owners: ["@rxm7706"]
    author: rxm7706
    type: community
    tier: community
    trust_tier: unverified
    source: estate-listings
    jobs: [find, install, create]
    lane: code-backed
    contribution_lane: code-backed
    path: skills/mason/environment
    adapters: {}
    requires:
      - kind: package
        name: pyforge-mason
        published: false
        installed_by: folder-copy
        note: "PyPI, conda-forge, and SelfExplainML returned 404 on 2026-10-21"
      - kind: package
        name: pyforge-core
        published: false
        installed_by: folder-copy
        note: "Required by pyforge mason dispatch; same 404 check"
    install:
      targets:
        - .agents/skills/mason-environment
        - .claude/skills/mason-environment
      entry: SKILL.md
      origins: [github, artifactory]
    sources:
      github:
        kind: release
        published: false
      artifactory:
        conda:
          published: false
        pip:
          published: false
    verified_at: null
    ci:
      status: pending
    docs:
      steps: steps.md
      card: skills/mason/environment.html
    related: ["@mason/package", "@warden/scan"]
