    - cells:
      - 'B''s regenerated `pyforge-core` passed the core slice of the case list, from the cutover-flag
        default to CLI parity (Story 54.2), on the PR #1344 prototype of 2026-09-14; it has not been
        re-pinned since.'
      - case `k-core-cutover-default`
      mono:
