      never by moving code over.'
  - type: note
    md: The words this section uses. A **Dream** is the written aspiration for a station, in `docs/dreams/`. A **Spec**
      is the contract derived from it; each numbered capability in a Spec is a **CAP**. A **memlog** is a Spec's
      append-only record of decisions. A **Frame** is a pointer file naming a Dream and its memlog; it is not a
      second copy of either. The **capability ledger** lists every capability and how it crosses to B. The **case
      list** is the set of checks B's rebuilt code must pass against A's. An **epic** groups **stories**, the units
