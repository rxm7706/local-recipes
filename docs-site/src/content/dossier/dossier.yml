- id: foundation
  num: '00'
  title: The shared spine
  kind: section
  measured: '2026-11-26'
  blocks:
  - type: lede
    md: 'PyForge is eight **stations**, each a Python package with its own command line, that together take an idea
      from a written Dream to merged, checked code. Every station sits on one small package that depends on none
      of them: `pyforge-core`. It does no station''s job. It holds the mechanisms every station needs — one way
      to write a file safely, one way to turn a verdict into an exit code, one way to register a plugin — so they
      exist once. This is A''s kernel and the oracle: B regenerates its own from the Dream plus its memlog, and
      the case list checks the two against each other (§ A→B).'
  - type: note
    md: Three words recur below. Each station has a **portal**, a Django app named `django-<station>`, mounted in
      **the host**, the Django site under `src/platform/`. A portal exposes a few of its station's commands to agents
      over **MCP** (Model Context Protocol), at `POST /stations/<station>/mcp`. A **flag** is a feature switch in
      `src/platform/config/flags.json`; an unset `PYFORGE_ENVIRONMENT` reads the development overlay, so "off in
      the tree" and "off for you" can differ.
  - type: h3
    num: '00.1'
    text: The eight stations at a glance
  - type: table
    headers:
    - Station
    - What it is for
    - Front door
    rows:
    - cells:
