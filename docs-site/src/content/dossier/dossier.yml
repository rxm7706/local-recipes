- id: foundation
  num: '00'
  title: The shared spine
  kind: section
  measured: '2026-10-14'
  blocks:
  - type: lede
    md: 'Every station sits on one package that depends on none of them: `pyforge-core`, a deliberately
      pure-stdlib leaf. It doesn''t do any station''s job — it owns the mechanisms every station kept
      reinventing separately, until seven of them were consolidated into one place each. The leaf rule
      still holds exactly: `dependencies = []`, with an AST meta-test scanning every module for a non-stdlib
      import and proving itself against synthetic violations. This is A''s kernel and the oracle: B
      regenerates its own from the Dream plus its memlog, and the case list checks the two against each
      other (§ A→B).'
  - type: h3
    num: '00.1'
    text: One CLI, discovered at runtime
  - type: prose
    body:
    - '`pyforge <station> <command>` is a single console script (`pyforge.core.dispatch:main`) that does
      no station work itself — it maps a station token to that station''s own primary console script and
      forwards the rest of argv to it as a subprocess. The map is built by walking installed package metadata
      first (`importlib.metadata.distributions()`), falling back to scanning sibling `pyproject.toml`
      files directly when running from an editable checkout with nothing installed yet. `pyforge-core`
      and `pyforge-testing-kit` are explicitly excluded from the station map — they''re infrastructure,
      not stations.'
    - 'One station is flagged as a known exception to a separate CI introspection check: Atlas''s CLI
      can''t be AST-introspected the way the others can, tracked against a named waiver spec under Steward''s
      own planning artifacts rather than silently ignored.'
  - type: h3
    num: '00.2'
    text: Seven mechanisms, formerly seven copies
  - type: table
    headers:
    - Module
    - What it replaced
    rows:
    - cells:
      - core.verdict.Lattice
      - 'Warden, Marshal, and Doctor each hand-rolled their own rank/exit-domain dict comprehension; Herald
        hand-rolled an `isinstance` dispatch loop. Now: one generic `Lattice` class every station''s own
        enum builds on — confirmed imported by all four.'
      mono:
      - true
      - false
    - cells:
      - core.atomic_write
      - Twenty hand-written tmp-file-then-`os.replace` copies across six stations (Herald 6, Atlas 5,
        Marshal 3, Steward 2, Scribe 1, Warden 3), three different naming conventions, none sharing code.
        Now one callback-shaped primitive.
      mono:
      - true
      - false
    - cells:
      - core.hooks
      - No prior duplication — new in Story 32.1. The *one* plugin-registration surface, one entry-point
        group (`pyforge.core.hooks`), stdlib `importlib.metadata` only, no pluggy. A plugin may only `publish_verdict`
        for the spec it owns — a second attempt raises `SecondVerdictError`.
      mono:
      - true
      - false
    - cells:
      - core.errors.PyforgeError
      - Every station's own exception root re-parents onto this bare marker (Herald's `HeraldError`, Mason's
        `CfeUnresolvedError`) without touching any subclass's own constructor.
      mono:
      - true
      - false
    - cells:
      - core.process
      - Moved **verbatim** from Marshal's own `ports/process.py` + `adapters/process_posix.py` — Marshal's
        own subprocess abstraction became the fleet's shared primitive, chosen over Doctor's simpler two-function
        pair specifically because it never raises on a non-zero exit.
      mono:
      - true
      - false
    - cells:
      - core.report
      - Shared report-envelope schema *data* plus a pure dict-merge — deliberately ships no `jsonschema.validate`
        call (that would break the leaf's own no-third-party-imports rule); each station keeps its own
        validation call site.
      mono:
      - true
      - false
    - cells:
      - core.landing_evidence
      - Every consumer asking "did story X land on main" — Doctor's `story-status`, Marshal's `merged_story_keys`
        and `retire` — spoke a partial dialect of git-fact recognition. Now one shared grammar, importing
        nothing from any station package.
      mono:
      - true
      - false
  - type: callout
    tone: amber
    label: Also present
    body:
    - '`core.assertion` — a host-mint service-assertion client; the CLI never signs locally, it POSTs
      a bearer token to a host view that signs RS256. `pyforge-testing-kit` is a deliberately *separate*
      leaf from `pyforge-core` (not `pyforge.core.testing`) specifically so test fixtures never couple
      into every station''s own runtime install.'
  - type: h3
    num: '00.3'
    text: And a client layer the original framing didn't cover
  - type: prose
    body:
    - '`pyforge-core` has grown from 9 modules to 13, and the three additions are not more consolidations
      — they are a new *kind* of thing. `client.py` is a stdlib-only (`urllib`) HTTP client for host-relative
      `/stations/<name>/api/v<N>/` routes, with an injectable transport so a caller wanting `httpx` supplies
      its own and the leaf stays dependency-free. `station_port.py` is the in-process alternative: a co-located
      portal calls a registered invoker instead of an HTTP loopback, with a `STATION_REMOTE` environment
      variable choosing between them — and the host registers that invoker without importing `pyforge.<station>`
      at all. `published_loop.py` consumes both, reading Marshal''s published per-story loop state over
      an MCP JSON-RPC call and degrading to `None` on any failure rather than raising.'
    - 'The consequence is worth stating plainly: the leaf every station depends on is no longer only a
      box of shared mechanisms. It is also the client surface stations use to reach each other''s HTTP
      APIs. That is a larger role than "owns the mechanisms everyone kept reinventing," and it deserves
      the same scrutiny the seven consolidations got.'
- id: atlas
  kind: station
  mark: A
  accent: --st-atlas
  title: Atlas
  role: The intelligence layer — data, not verdicts
  measured: '2026-10-14'
  blocks:
  - type: quote
    md: '"Atlas provides data… Warden uses that data… the only code edge between them points the other
      way." — the package''s own README'
  - type: stats
    stats:
    - value: 41,217
      label: Source lines · 143 files
      check: src_lines
    - value: 55,279
      label: Test lines
      check: test_lines
    - value: 155 / 40
      label: Stories / epics done
      check: stories_epics
    - value: py3.14
      label: Python floor
      check: python_floor
  - type: prose
    body:
    - 'Atlas is the Kedro/Dagster/DuckDB rewrite of what used to be a single SQLite-backed script (`cf_atlas.db`,
      still documented inside the `conda-forge-expert` skill). It''s a genuine Kedro project — `pyforge-atlas
      <command>` is, under a thin `--version` intercept, literally Kedro''s own CLI routing. There''s
      no atlas-specific command tree to enumerate the way the other stations have one; the real, atlas-specific
      surface is its 13 MCP tools: 8 pipeline triggers, dataset read/list, and two natural-language query
      tools.'
    - '`read_dataset` never hands back raw data — every result is wrapped in a provenance envelope recording
      when the underlying data was actually built (a stored timestamp, a file mtime, or an honest "unavailable"
      and why), deliberately never a read-time clock stand-in. Tool bodies are AST-scan-enforced to contain
      zero business logic — no pandas, numpy, duckdb, or arithmetic is allowed to live at the MCP layer,
      only thin delegation.'
  - type: finding
    label: The load-bearing finding
    accent: --st-atlas
    alarm: false
    body:
    - The legacy SQLite system is **still running, in parallel, right now** — by binding design decision,
      not oversight. The rewrite is code-complete (46 stories, 8 live pipelines), but a documented rule
      states the legacy orchestrator keeps running until a credentialed, human-signed parity event proves
      exact row-count and value parity against the new stack — and the code's own retirement-eligibility
      check currently, correctly, returns `allowed=False`. Parts of Atlas's own dashboard still read `cf_atlas.db`
      directly today, as a live dependency, not a historical fallback.
  - type: h3
    num: A.1
    text: The semantic layer and the two dashboards
  - type: prose
    body:
    - 'A "Boring Semantic Layer" (BSL) is the single translation interface over the canonical Parquet
      store — every metric a dashboard, agent, or MCP caller can ask for is declared once, in Ibis, resolved
      to DuckDB. Atlas ships **one** dashboard code path today: a pure-Kedro `dashboard/` package (Vizro
      pages, one per legacy CLI report — feedstock health, staleness, CVE watch), built so every page
      routes through the BSL seam. A previous pass described a second `views/` legacy-bridge layer rendering
      Bokeh fragments; that package no longer exists and `bokeh` appears nowhere in the source. The bridge
      was removed, not merely bypassed. The dashboard package also independently reads the BMAD fleet''s
      own sprint ledger and epics status — a real overlap with what Marshal and Steward''s own dashboards
      read, not confirmed whether from the same underlying source.'
  - type: chips
    chips:
    - core
    - vcs_health
    - pypi_intelligence
    - vulnerability
    - seed_gaps
    - universal_sbom
    - derived_artifacts
    - upstream_discovery
  - type: note
    md: The 8 MCP-triggerable pipelines. `semantic_packages`, `query_plane_cache`, and an enterprise-JFrog
      `artifactory_downloads` pipeline exist on disk but aren't in the registry yet.
  - type: h3
    num: A.2
    text: Relationships
  - type: h3
    num: A.3
    text: Four subsystems that arrived since the last pass
  - type: prose
    body:
    - The +6,663 lines are not padding on what was already described. `a2a/` is a structured agent-to-agent
      channel between cf_atlas and conda-forge-expert. `rag/` is a DuckDB `vss`-backed retrieval surface
      that defaults to an offline `HashingEmbedder`. `factory/` is an "AI Software Factory" layer — five
      personas, crews, a wiki tree over MinIO/Postgres, and Wagtail CMS sync. `orchestration/` is a dedicated
      `kedro-dagster` glue package, and the only place permitted to import dagster.
    - 'Smaller but load-bearing: `admission.py` adds cross-run write-admission control, closing a design-decision
      claim a prior audit found to be false; `live_attach.py` federates a live Postgres read-only through
      DuckDB''s `ATTACH`; and `artifactory/` is a JFrog AQL adapter backing the still-unregistered `artifactory_downloads`
      pipeline.'
  - type: relations
    items:
    - glyph: →
      md: '**Warden** — the one optional code import (`[gate]` extra), one-directional only; no reverse
        edge exists.'
    - glyph: →
      md: '**Mason** — a named "downstream handoff" from the trending-candidates engine, not independently
        confirmed from Mason''s own side.'
    - glyph: →
      md: '**conda-forge-expert** (the legacy skill, not a station) — a dedicated agent-to-agent bridge
        module hands the analytical layer''s alerts/insights to the recipe-authoring agent.'
    - glyph: →
      md: '**pyforge-core** — heavy, load-bearing: errors, atomic writes, and the shared hook registry
        all confirmed in use across 15 distinct import sites.'
  - type: verify
    md: 'Not verified: the dashboard''s launch mechanism (pixi task name); whether its BMAD-status reads
      share a source with Marshal''s/Steward''s own status reads; roughly a third of Atlas''s own tagged
      design decisions (AD‑1/2/3/5/6/9–12/14–16/21) were seen but not glossed with confidence.'
- id: doctor
  kind: station
  mark: D
  accent: --st-doctor
  title: Doctor
  role: Advisory diagnostics — and the one station that judges Marshal
  measured: '2026-10-14'
  blocks:
  - type: quote
    md: '"Charter §6, ratified 2026-07-28: the Doctor holds the verdict on the Marshal''s own conformance
      — the one station that would otherwise grade itself. The Marshal may not weaken, re-threshold, or
      disable a check that judges the Marshal."'
  - type: stats
    stats:
    - value: 30,120
      label: Source lines · 49 files
      check: src_lines
    - value: 45,988
      label: Test lines
      check: test_lines
    - value: 172 / 54
      label: Stories / epics done
      check: stories_epics
    - value: py3.14
      label: Python floor
      check: python_floor
  - type: prose
    body:
    - 'Doctor''s own description: *"Pre-flight + fleet-watch diagnostics CLI consolidating pyforge-warden
      + cf_atlas signals into one schema-validated DoctorReport."* Five commands: `check` (pre-flight
      — engine availability, env hygiene, plus opt-in-only network-touching categories), `monitor --fleet`
      (pulls cf_atlas Watch axes — staleness and CVE by default), `diagnose --target` (gather plus optional
      root-cause ranking), `backlog-intake` (scans every station''s deferred-work ledger for a given epic/story),
      and `flags kill-switch` — a feature-flag actuator rather than a diagnostic verb, and the one command
      here that does something to the fleet instead of reporting on it. A finding is one of a closed three-state
      `OK/WARN/FAIL`; the exit domain deliberately omits Warden''s policy-gate rung — Doctor reports operability,
      never policy, and a dedicated test asserts its domain stays a strict subset of Warden''s.'
  - type: finding
    label: Why Doctor is structured the way it is
    accent: --st-doctor
    alarm: false
    body:
    - 'Six of Doctor''s own modules exist specifically to judge Marshal''s output — dashboard truthfulness,
      the Dream-to-Code chain, forward-dependency blindness in the story picker, project-doc currency,
      the tracked sprint ledger''s regression-freedom, and Marshal''s own durability record. The largest
      of these, `sources/chain.py`, is 4,964 lines on its own — the single biggest module in the package.
      Every one of them was placed in Doctor *on purpose*, and verified structurally, not just by docstring
      claim: the module that judges Marshal''s durability doesn''t import `pyforge.marshal` at all — it
      reads only git history and journal files. Marshal has no code-level lever over its own verdict.'
  - type: h3
    num: D.1
    text: What it actually watches
  - type: prose
    body:
    - 34 distinct finding sources are registered, each tagged with a *subject* station (whose artifact
      is being judged) and an *owning* station (whose code does the judging) — the mechanism that makes
      the Marshal-oversight rule machine-checked rather than aspirational. `--bmad-core` and `--sibling-dreams`
      are the two categories requiring a genuine live network call (npm registry, GitHub Contents API)
      and are opt-in only, explicitly excluded from the zero-flag default run's speed budget.
  - type: h3
    num: D.2
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**Warden** — the one real code dependency, gated behind an optional extra, wraps Warden''s
        own checks 1:1 into Doctor''s own finding shape.'
    - glyph: ←
