  - type: note
    md: The session default environment, `pyforge-guild`, carries core, doctor, marshal, steward, herald, scribe
      and mason. Atlas and Warden run in their own, `-e pyforge-atlas` and `-e pyforge-warden`. Run every command
      from the repository root.
  - type: h3
    num: '00.2'
    text: One front door
  - type: prose
    body:
    - '`pyforge <station> <command>` is a single console script (`pyforge.core.dispatch:main`). It does no station
      work: it maps the station token to that station''s own console script and forwards the rest of the command
      line to it as a subprocess, so the exit code you see is the station''s. The map comes from installed package
      metadata, and falls back to reading the sibling `pyproject.toml` files in an editable checkout with nothing
      installed. `pyforge-core` and `pyforge-testing-kit` are left out of the map: they are infrastructure, not
      stations.'
    - '`pyforge context …` is an alias that forwards to Marshal. A station on the roster that is not installed in
      the current environment gets a message naming the `-e pyforge-<station>` environment that has it. And the
      front door itself exits 2 for an unknown station and 127 when a station''s script cannot be run.'
