    items:
    - glyph: ←
      md: '**Doctor** and <<←>> **Atlas** — both consume Warden as an optional gate extra; Warden itself
        has no reverse dependency on either.'
    - glyph: —
      md: Registers into the exact same shared plugin-hook group Marshal registers `bmad-loop` into —
        a second, independent confirmation of the shared-mechanism pattern beyond the verdict lattice.
  - type: verify
    md: Warden tags its own decisions differently from the rest of the fleet — Story numbers, FR/NFR codes,
      and single-letter design codes (D2, D8, D12), never `AD-N`. See the synthesis below.
- id: synthesis
  num: 09
  title: Cross-fleet synthesis
  kind: section
  measured: '2026-10-14'
  blocks:
  - type: lede
    md: Investigating all eight stations in one pass surfaces things no single-station read would — patterns
      that only show up as repetition, or as a system quietly checking itself. These patterns are A-side
      evidence for the rebuild on B; where they conflict with a capability's ledger mode, the mode decides.
  - type: h3
    num: '09.1'
    text: Who judges whom
  - type: table
    headers:
    - Relationship
    - Nature
    rows:
    - cells:
      - Doctor → Marshal
      - 'Binding governance ruling (Charter §6): Marshal cannot weaken a check that judges it. Structurally
        enforced — the judging code never imports Marshal''s own package.'
      mono:
      - true
      - false
    - cells:
      - Warden → Doctor, Atlas
      - One-directional optional dependency, twice over. Warden never imports either back.
      mono:
      - true
      - false
    - cells:
      - Steward ← Marshal, Doctor
      - Steward reads Marshal's tracked sprint ledgers as they stand and wraps Doctor's fleet-scan output;
        it derives no story status of its own.
      mono:
      - true
      - false
    - cells:
      - Herald ✗ Warden
      - 'An explicit refusal: publishing a second verdict onto Warden''s own spec is a structural error,
        not just bad practice.'
      mono:
      - true
      - false
    - cells:
      - Herald ✗ Steward
      - An explicit non-dependency for secrets, named and reasoned about directly in Herald's own code.
      mono:
      - true
      - false
  - type: h3
    num: '09.2'
    text: The shared spine, confirmed four times over
  - type: prose
    body:
    - 'The verdict-lattice claim in `pyforge-core`''s own docstring — that Warden, Marshal, and Doctor
      each used to hand-roll this, and Herald hand-rolled something structurally similar — was independently
      confirmed from *every one* of those four stations'' own source in this investigation, not just asserted
      once and trusted. The same held for the shared plugin-hook group: Marshal, Doctor, Atlas, Mason,
      Steward, Scribe, and Warden all register into it, none maintaining a station-specific alternative.'
  - type: h3
    num: '09.3'
    text: A systemic documentation-drift pattern
  - type: callout
    tone: red
    label: Every station's own docs undercount its own surface
    body:
    - Marshal's installed skill documents 4 subcommands against 21 top-level groups and 55 parser registrations.
      Doctor's README still claims "all 28 stories shipped … dispatches the 10 detector sources" while
      its code cites Story 48.5 and its registry holds 34. Steward's README documented 6 duties when the CLI
      registered 15 (2026-10-14; `pyforge steward --help` lists today's). Scribe's README *contradicts itself
      in adjacent paragraphs* — a shipped-header sitting
      directly above a stale "not yet implemented" body, still uncorrected.
    - 'This pass is the second data point, and it settles the question: the drift is not a backlog of
      four typos, it is a rate. Every figure above moved further from the truth in the weeks between passes,
      in the same direction, at every station that ships fast. The README is written once near a milestone
      and never revisited while the surface keeps growing underneath it. The one countermeasure this repository
      now has is mechanical: `docs-site/scripts/verify_claims.py` counts every dossier figure that carries
      `check:` from the source tree and the sprint ledgers at every build, the page shows only what it
      counted, and the build fails on a stat that carries no `check:`.'
  - type: h3
    num: '09.4'
    text: The convention gaps — ten found, each independently, none coordinated
  - type: prose
    body:
    - Every station was built well, on its own terms. What's missing is anything that made one station's
      terms bind on the next one built. None of these are bugs in any single station — each is internally
      consistent. The problem only appears once you've read all eight and try to carry a mental model
      from one to the next.
  - type: table
    headers:
    - Gap
    - What actually varies
    - Why an operator feels it
    rows:
    - cells:
      - Decision tags
      - '`AD-N` (Marshal 61 distinct, reaching AD-72, Atlas 23, Mason 16, Steward some, Scribe 8 — five
        independent registries, zero shared numbering) vs. Story-N.M / FR-N / NFR-N / single-letter D-codes
        (Warden, parts of Steward). An `AD-8` in one station is unrelated to an `AD-8` in another.'
      - '"Why was this built this way" has no single vocabulary to search for across the fleet.'
      mono:
      - true
      - false
      - false
    - cells:
      - Exit codes
      - The same integer means different things per station. `3` is Mason's "CFE unavailable" and Steward's
        reserved-but-inert "budget not configured." `70` exists only in Steward (BSD `EX_SOFTWARE`) —
        no other station distinguishes "crashed" from "failed" at all. Doctor's domain is a deliberate
        subset of Warden's; nothing says whether Marshal's or Mason's are meant to relate to either.
      - A CI step scripted against one station's exit codes silently means something else when pointed
        at another.
      mono:
      - true
      - false
      - false
    - cells:
      - CLI shape
      - Noun-verb trees (Marshal ~40 commands/12 groups, Mason 4 nouns), a flat duty list (Steward),
        four flat subcommands (Doctor), one subcommand behind ~20 flags (Warden), and no custom CLI at
        all — Kedro's own routing (Atlas).
      - Learning one station's command grammar transfers to roughly half the fleet.
      mono:
      - true
      - false
      - false
    - cells:
      - Hook-plugin naming
      - 'The registration mechanism is genuinely shared (`pyforge.core.hooks`, confirmed fleet-wide) —
        but entry-point names aren''t: Atlas/Doctor/Warden/Scribe prefix with the station name (`atlas-catalog-ttl`,
        `warden-deptry`); Mason and Steward register bare names (`rattler-build`, `jira`) with no station
        prefix at all.'
      - Listing installed plugins fleet-wide can't tell which station owns an unprefixed one without opening
        its source.
      mono:
      - true
      - false
      - false
    - cells:
      - MCP hosting
      - '**Two** stations now host a real, confirmed MCP server in their own source: Atlas, and Marshal
        (`mcp/server.py` plus a `marshal-mcp` console script). Herald and Scribe still host none — grepped
        again this pass, zero server code in either — yet both still have a documented `/stations/*/mcp`
        route whose existence is only ever asserted in *other* stations'' test files.'
      - 'Improved but not resolved: the answer to "does this station host an MCP server" now differs per
        station with no rule predicting which, and the phantom routes are unchanged.'
      mono:
      - true
      - false
      - false
    - cells:
      - Boundary concepts
      - 'The "Lane 1 CMS stays Steward" framing exists only as skill-file prose — and it''s wrong: Steward''s
        actual code has no CMS, it owns a `/console/` operator dashboard. Herald''s own source has zero
        code-level acknowledgment of any "Lane" boundary at all.'
      - An operator reading the skill docs forms an incorrect model of what's actually implemented where
        — the docs describe a boundary the code doesn't have.
      mono:
      - true
      - false
      - false
    - cells:
      - Fleet-status sources
      - 'At least four separate surfaces read or show "how''s the fleet doing": Marshal''s own `status`
        (journals, direct), Steward''s console (refuses to compute, reads Marshal + Doctor), Atlas''s
        dashboard (reads the sprint ledger independently, not confirmed same source), and Herald''s own
        React dashboard (a fourth, separate front end).'
      - No single answer to "where do I look" — and no confirmation the four would ever agree if you checked
        all of them at once.
      mono:
      - true
      - false
      - false
    - cells:
      - State storage
      - Flat JSON (Marshal's rendered policy, Herald's deck-bridge state), SQLite (Herald's consolidated
        \`.herald/herald.db\`), DuckDB (Atlas, "the one engine everywhere" by its own rule), journals
        (Marshal's run state), and a genuinely pluggable Protocol (Scribe, alone) — five different answers
        to "where does a station keep what it knows," four of them not pluggable at all.
      - No shared operational playbook for backup, inspection, or migration works across more than one
        or two stations at a time.
      mono:
      - true
      - false
      - false
    - cells:
      - Python floor
      - '**Closed since the last pass.** Every station now requires `>=3.14` — Marshal, Mason, Herald,
        Scribe and Warden all raised their floors to meet Doctor and Atlas. The fleet converged without
        a stated policy forcing it.'
      - No longer felt. Worth recording as the one gap in this table that closed on its own, and worth
        asking whether it stays closed without a written rule.
      mono:
      - true
      - false
      - false
    - cells:
      - Name collision
      - Warden's own `scan --doctor` flag is a same-word, different-thing coincidence with the actual
        `pyforge-doctor` station — Warden's `--doctor` is a local self-check that has nothing to do with
        the Doctor station.
      - 'A small, concrete, easy-to-fix instance of the same root cause as everything else in this table:
        nobody''s checking new work against what the rest of the fleet already calls things.'
      mono:
      - true
      - false
      - false
  - type: callout
    tone: amber
    label: The shared spine proves the fix is already the fleet's own idiom
    body:
    - '`pyforge-core`''s own history is the existence proof that this is fixable without a rewrite: the
      verdict lattice, atomic writes, the exception root, and the process primitive were *all* independently
      duplicated across stations before someone consolidated them into one leaf every station already
      knows how to depend on. Nothing in this table needs new architecture — it needs the same consolidation
      pass applied to conventions instead of code: one decision-tag registry, one exit-code domain contract,
      one CLI-shape idiom doc, one naming rule for hook-plugin ids, one documented answer for where an
      MCP server lives and where fleet status is read from. That''s the shape of the Dream this section
      is written to feed.'
  - type: h3
    num: '09.6'
    text: Scale, side by side
  - type: table
    check: src_lines
    headers:
