title: The PyForge Dossier
eyebrow: THE FLEET AND ITS A→B CUTOVER — 2026-11-26
heading: PyForge
summary: 'PyForge is eight Python command-line tools, called **stations**, that take a change from a written idea
  (a **Dream**) through a contract (a **Spec**) to merged, checked code. It lives in `local-recipes` (**A**) and
  is being rebuilt, not copied, in `python-foundry` (**B**). This page gives the state of that cutover, then the
  kernel the stations share, then one section per station: what it is for, how you drive it, and what its own tests
  hold it to.'
