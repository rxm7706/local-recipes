      - story:steward/67-1=done
  - type: callout
    tone: amber
    label: What the station sections rest on
    body:
    - Each station section states what that station's source, parser, package metadata and meta-tests say on the
      date it carries. The command lines were read from their parsers, not run. "Held by tests" names the test that
      states a rule, not a passing run of it.
    - Every figure in a stats band is counted from the tree and the sprint ledgers at build. No sentence states
      a count of lines, files, stories or epics; where a sentence counts anything else, the things counted are named
      beside it.
    - Which values a deployed environment sets — a flag overlay, a storage backend, a schedule — is outside what
      the source can establish. A section that could not establish something says so at its foot; a section with
      no such note left nothing on the page unestablished.
footer:
  note: 'Each date means one thing: the A→B control plane and § 10 state the cutover as of 2026-11-26; each station
    section''s date is the day its prose was last read against that station''s source; every stats-band figure is
    counted at build.'
  date: '2026-11-26'
