      - false
    - cells:
      - Marshal
      - Runs a story through a coding agent, verifies the result and lands it through a pull request.
      - '`pyforge marshal factory dispatch`'
      mono:
      - true
      - false
      - false
    - cells:
      - Mason
      - Authors and builds conda recipes, and ships packages, by driving the `conda-forge-expert` skill.
      - '`pyforge mason recipe`'
      mono:
      - true
      - false
      - false
    - cells:
      - Scribe
      - Captures team decisions into checked-in memory and recalls them with a citation.
