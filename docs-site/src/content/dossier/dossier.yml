  - type: h3
    num: '00.4'
    text: The leaf rule, and the test kit
  - type: prose
    body:
    - '`pyforge-core` declares `dependencies = []`. A meta-test (`tests/meta/test_leaf_constraint.py`) parses every
      module and fails on an import of another `pyforge` package or of anything outside the standard library, and
      proves itself against planted violations. Its public surface is held to a written contract by `tests/meta/test_public_contract.py`.'
    - '`pyforge-testing-kit` is a separate package, so test fixtures never ride into a station''s runtime install.
      It depends on `pyforge-core` and `openfeature-sdk`, and gives every station''s tests the same doubles: a CLI
      runner, a frozen clock, a fake GitHub API, flag-state fixtures, and the git mechanics behind the whole-branch
      diff guards. No station''s source imports it.'
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - The leaf test reads static imports. `core.flags` loads `openfeature` through `importlib` when it is installed,
      and reads the same flag tree itself when it is not; that test does not see the import. The dependency stays
      optional and undeclared.
    - 'One station is a declared exception to the check that compares a station''s CLI with its MCP tools: Atlas''s
      CLI is Kedro''s and cannot be introspected the same way. The waiver names its story spec, under Atlas''s own
      planning artifacts.'
- id: atlas
  kind: station
  mark: A
  accent: --st-atlas
  title: Atlas
  role: The data station — facts about packages, not verdicts
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Kedro/Dagster/DuckDB data-pipeline migration of the cf_atlas orchestrator (pyforge.atlas namespace package
      beside pyforge.warden)." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Atlas is where the fleet''s knowledge of the conda-forge ecosystem lives. Its pipelines collect facts about
      packages — current versions, upstream repository health, PyPI metadata, known vulnerabilities, what is missing
      from the channel — into one Parquet store, and a semantic layer answers questions over it for dashboards,
      agents and other stations. Atlas provides data and stops there: it never says whether something passes. Warden
      gives that verdict, using Atlas''s data.'
  - type: h3
    num: A.1
    text: Commands
  - type: prose
    body:
    - Atlas is a Kedro project (Kedro is a data-pipeline framework), and it has no command tree of its own. `pyforge
      atlas <command>` is Kedro's project command line — `run`, `ipython`, `package` — behind a `--version` check
      and a flag check. `run` exits 2 while `pyforge.atlas.agent_pipeline_tools` is off, and the `universal_sbom`
      pipeline is registered only while `pyforge.atlas.manifest_inventory` is on.
    - 'The pipeline registry holds the pipelines named below, which MCP can also start, and others that run from
      the command line only: `artifactory_downloads`, `query_plane_cache`, `semantic_packages` and `catalog_index`.
      A plain `run` leaves out `catalog_index`, `query_plane_cache` and `universal_sbom`; name one to run it.'
  - type: note
    md: 'The pipelines MCP can start, each as `run_<name>_pipeline`:'
  - type: chips
    chips:
    - core
    - vcs_health
    - pypi_intelligence
    - vulnerability
    - seed_gaps
    - universal_sbom
    - derived_artifacts
    - upstream_discovery
  - type: prose
    body:
    - The dashboard is one Vizro application, started with `pixi run -e pyforge-atlas dashboard-serve` on `127.0.0.1:8050`.
      Every page reads through the semantic layer (metrics declared once in Ibis and resolved by DuckDB), and a
      page whose data has not been built yet renders as an empty shell rather than failing. The same pages have
      a static export, which is what the Pages site mounts.
    - 'Exit codes: 0 on success, 1 on a failed run, 2 for a usage error or a refused flag, 130 when interrupted.
      The bill-of-materials gate takes its codes from Warden''s.'
  - type: h3
    num: A.2
    text: MCP face
  - type: prose
    body:
    - The server code is in the base package (`pyforge/atlas/mcp/`, on the official `mcp` SDK) and `django-atlas`
      mounts it at `POST /stations/atlas/mcp`. Its tools are the pipeline triggers, `read_atlas_dataset`, `list_atlas_pipelines`,
      `list_atlas_datasets`, `query_vizro_ai` and `query_trending_candidates`.
    - '`read_atlas_dataset` never returns bare rows. Each result comes in an envelope that says when the data was
      built — a stored timestamp, a file''s modification time, or "unavailable" with the reason — and never the
      time of the read. `query_vizro_ai` is the one natural-language tool, and it answers with a "backend not configured"
      advisory unless the environment supplies a language-model backend.'
  - type: h3
    num: A.3
    text: State
  - type: prose
    body:
    - A Parquet store under the data root (`PYFORGE_ATLAS_DATA_ROOT`, default `data`), declared in the Kedro catalog;
      one file-backed DuckDB database, `atlas.duckdb`, written through a single writer module; and file locks that
      stop two runs from writing the same dataset at once. The storage location is set by environment variable and
      catalog, so it moves without a code change.
  - type: h3
    num: A.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**pyforge-core** — a hard dependency: errors, atomic writes, flags, the process port, the hook registry.'
    - glyph: →
      md: '**Warden** — one optional import, installed by an extra named `gate`, used only by the software-bill-of-materials
        gate. Warden imports nothing from Atlas.'
    - glyph: ←
      md: '**Scribe** — Scribe''s optional DuckDB backend imports Atlas''s writer, so compiled team memory can be
        queried beside package data.'
    - glyph: →
      md: '**conda-forge-expert** (a skill, not a station) — an in-process agent-to-agent hand-off passes alerts
        and insights to the recipe-authoring agent.'
    - glyph: →
      md: '**Mason** — the trending-candidates engine writes a hand-off record for Mason. Nothing in Mason''s source
        reads it.'
  - type: h3
    num: A.5
    text: Held by tests
  - type: prose
    body:
    - Layering is checked, not trusted. Dagster (the scheduler) may be imported only by the orchestration package,
      the semantic layer is the only home of its library, Vizro (the dashboard library) stays in the dashboard,
      and no second vector engine may appear (`tests/unit/catalog/test_no_inline_io.py`). DuckDB is the one database
      engine, with no SQLite path (`tests/unit/singularity/`). An MCP tool body may hold no business logic — no
      pandas, numpy, DuckDB or arithmetic — only delegation (`tests/unit/mcp/test_no_business_logic_in_tool_bodies.py`).
      The command line and the MCP tools are compared with each other, and both with the Spec's `contract.md`.
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - 'The `cf_atlas` SQLite orchestrator, which Atlas is the rewrite of, is in the repository with its pixi tasks.
      Atlas''s own code reads none of it. Retiring it is gated: `may_retire_legacy` answers no until a signed comparison,
      run with real credentials, shows the legacy views and Atlas''s agree; none is recorded.'
    - 'Several subsystems are built to run offline and are not wired to a live service: the agent-to-agent channel
      is in-process only, retrieval defaults to an offline embedder, the "factory" crews run deterministically with
      their language-model and Wagtail connections left to be injected, and the Artifactory adapter is exercised
      against a mock.'
    - '`query_plane_cache` reads a source that nothing produces, and the `django-atlas` board page shows fixture
      rows, not Atlas data.'
  - type: verify
    md: 'Not established from source: whether the legacy orchestrator is run anywhere, and whether the Dagster schedules
      are deployed.'
- id: doctor
  kind: station
  mark: D
  accent: --st-doctor
  title: Doctor
  role: Advisory diagnostics — and the station that judges Marshal
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Pre-flight + fleet-watch diagnostics CLI (check/monitor/diagnose) consolidating pyforge-warden + cf_atlas
      signals into one schema-validated DoctorReport." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Doctor answers "is this checkout, and this fleet, in working order — and if not, what is wrong?" It reads;
      it does not fix, and it does not decide policy. Its findings are advisory and are never a second gate on a
      pull request. It has one special duty: under § 6 of the fleet''s charter it holds the checks that judge Marshal''s
      own conformance, so that the station which runs the build loop is not also the one grading it.'
  - type: h3
    num: D.1
    text: Commands
  - type: prose
    body:
    - 'The commands are `check`, `monitor`, `diagnose`, `backlog-intake` and `flags kill-switch`. `check` is the
      pre-flight: with no flags it looks at the scanning engines, the environment and Marshal''s durability record;
      `--bmad-core` and `--sibling-dreams` are opt-in, and the second calls GitHub only when a token is set. `monitor
      --fleet` reads package-watch signals (staleness and vulnerabilities by default; abandonment, adoption and
      behind-upstream on request). `diagnose --target` gathers findings for one target and can rank likely causes
      with `--prescribe`. `backlog-intake` looks an epic or story up in the deferred-work ledgers. `flags kill-switch`
      is the one command that changes something: it turns a feature flag off in the flag tree, with a stated reason,
      and is an operator''s action.'
    - A second entry point, `python -m pyforge.doctor.sources <name>`, runs one finding source by name. `scripts/detectors.py`
      runs the same table of sources in-process, so the repository's detectors (`chain-completeness`, `spec-surface`,
      `story-status` and the rest) are Doctor sources. Each source is registered with the station whose artifact
      it judges and the station whose code does the judging.
    - 'Exit codes: a finding is `ok`, `warn` or `fail`, and Doctor exits 0 for ok and warn, 2 for fail and 130 when
      interrupted. It never exits 1, and a warning never changes the exit code.'
  - type: h3
    num: D.2
    text: MCP face
  - type: prose
    body:
    - 'In `django-doctor`, at `POST /stations/doctor/mcp`: `start_scan` returns a handle and `get_scan` reads the
      result. The pair runs exactly one command, `diagnose --target <name> --json`. The base package holds no MCP
      server; its only MCP code is a client.'
  - type: h3
    num: D.3
    text: State
  - type: prose
    body:
    - 'None of its own. Doctor is read-only by rule, with these sanctioned writes: `monitor --surface PATH` writes
      a fleet summary to the path the caller names, and the kill switch replaces the flag tree file atomically.
      Its output is one `DoctorReport`, validated against a schema shipped in the package.'
  - type: h3
    num: D.4
    text: Relationships
  - type: relations
    items:
    - glyph: ←
      md: '**Marshal** — judged, not judging. Doctor reads Marshal''s output (git history, journals, ledgers, planning
        files) and imports none of its code.'
    - glyph: →
      md: '**Warden** — the one station import, lazy and installed by an extra named `gate`; Doctor wraps Warden''s
        operability checks into its own findings and reports a failure when Warden is absent.'
    - glyph: →
      md: '**Steward** — by subprocess only: `steward ci status --json`, to compare declared CI pauses with what
        is live.'
    - glyph: →
      md: '**Package data** — fleet-watch signals come from the `conda-forge-expert` tooling (its MCP server, with
        a script fallback), not from an import of `pyforge.atlas`.'
    - glyph: →
      md: '**pyforge-core** — a hard dependency: the report envelope, the verdict lattice, exit domains, landing
        evidence, flags.'
  - type: h3
    num: D.5
    text: Held by tests
  - type: prose
    body:
    - No source may import the station it judges, nor `bmad_loop` (`tests/meta/test_source_independence.py`), which
      is what makes the Marshal-oversight rule a checked fact rather than a convention. Doctor's exit domain must
      stay a strict subset of Warden's (`test_verdict_narrows_warden.py`). One module owns the exit-code projection,
      one module may spawn a subprocess, the environment scanner parses code and never executes it, and only the
      two sanctioned sites may write (`test_read_only_guard.py`). The Spec's `contract.md` is compared with the
      code.
    - Most registered sources judge Marshal or the fleet as a whole; the rest judge Atlas, Steward, Warden and Doctor
      itself. The largest single module is `sources/chain.py`, which checks the Dream-to-code chain.
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - '`pages-liveness` makes a live HTTP request and is reachable only through the sources entry point, outside
      `detectors-ci`. `check --scope runtime` returns nothing, since every `check` category is repository-scope.'
  - type: verify
    md: 'Not established from source: that `backlog-intake` covers every station''s ledger (its arguments were read,
      not its body).'
- id: herald
  kind: station
  mark: H
  accent: --st-herald
  title: Herald
  role: The Dream-to-deck bridge, and the fleet's comms desk
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Dream-to-deck bridge CLI — seeds, pulls, and syncs Claude Design decks via the herald deck subcommands."
      — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Herald is how the fleet explains itself. It turns a written Dream into a slide deck through Claude Design
      (Anthropic''s design tool) and keeps the designed deck and the repository''s copy in step. It also keeps the
      records an operator updates as work ships: progress per station, success claims (a stated result with its
      evidence) and notices. Herald also owns the tests and the feature flags behind this Pages site, though the
      site itself is the separate `docs-site/` tree.'
  - type: h3
    num: H.1
    text: Commands
  - type: prose
    body:
    - 'Five top-level commands: `deck`, `progress`, `success`, `notice` and `scheduler`. `deck` carries the verbs
      listed below. `progress [station]` shows a station''s progress record, with `--update` and `--list`. `success`
      has `create`, `review`, `publish`, `list`, `get` and `validate`; `notice` has `list`, `author`, `publish`,
      `get`, `close` and `archive`; `scheduler run` re-validates success claims and writes the progress snapshot
      in one pass, meant for a local cron entry.'
  - type: note
    md: The `herald deck` verbs, in the parser's order. `publish` and `exports` run only with `pyforge.herald.deck_publish`
      on, and `pptx-native` only with `pyforge.herald.deck_export_native` on; a gated verb stays in `--help`, marked
      disabled, and exits 2.
  - type: chips
    chips:
    - seed
    - pull
    - status
    - watch
    - push
    - publish
    - exports
    - sync-all
    - qa
    - pptx-spec
    - pptx-fill
    - pptx-native
  - type: prose
    body:
    - A deck can leave in several forms. The Marp path (Marp turns Markdown into slides) renders HTML and a `.pptx`
      whose slides are images with no editable text. `pptx-spec` and `pptx-fill` read a template into a machine-readable
      spec and fill it through python-pptx's object model. `pptx-native` writes an editable deck through a Node
      driver.
    - 'Exit codes: 0 on success, 1 for an unmapped error or no command, 2 for a usage error or a verb whose flag
      is off, 3 for a seed, pull or export conflict, 4 for a transport failure and 130 when interrupted.'
  - type: h3
    num: H.2
    text: MCP face
  - type: prose
    body:
    - The MCP face lives in `django-herald`, at `POST /stations/herald/mcp`, with the tools `start_notice` and `get_notice`.
      They start and read one command, `herald notice get <target>`, and nothing else. The base package holds no
      MCP server; it is an MCP client of Claude Design's endpoint.
  - type: h3
    num: H.3
    text: State
  - type: prose
    body:
    - Progress, success claims and the notice index share one SQLite file, `.herald/herald.db`, local to the operator
      and ignored by git; notice bodies are Markdown files under `notices/`. The deck bridge keeps its own JSON
      file, `.herald/bridge-state.json`, recording each deck's Design project and what was last pulled. Published
      decks go to an object store behind a `DeckStore` interface with an S3 implementation and an in-memory one.
      The transport to Claude Design and the export formats are both pluggable.
  - type: h3
    num: H.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**pyforge-core** — a hard dependency: flags, errors, the exit-code dispatch, atomic writes, the hook
        registry, the roster, landing evidence.'
    - glyph: ✗
      md: '**Other stations** — Herald''s source imports none of them. For webhook secrets it reads its own `HERALD_WEBHOOK_SECRET`
        and deliberately does not use Steward''s key module.'
    - glyph: ✗
      md: '**Warden** — a deck export can never be mistaken for a compliance verdict: publishing onto a Spec Warden
        owns raises `SecondVerdictError`.'
    - glyph: →
      md: '**django-herald** — the station''s portal: the MCP face, deck listing and viewing pages, and a record
        of each published export.'
    - glyph: —
      md: A React and Vite dashboard under `web/` shows Progress, Success and Operations from JSON snapshots exported
        from `.herald/herald.db`. It has no live API. This Pages site is `docs-site/`, the one generator, and is
        not built from that app.
  - type: h3
    num: H.5
    text: Held by tests
  - type: prose
    body:
    - 'The bridge core names no concrete transport, no inference SDK and no dynamic-import machinery, and importing
      it does not load the transport package (`tests/unit/test_bridge.py`). The base package never imports Django,
      and the portal''s URL module does not import Herald at load. The command line, MCP tools, flag keys, environment
      variables and exit codes are compared with the Spec''s `contract.md` in both directions. For the site: exactly
      one generator exists, and no page reaches a third-party origin for fonts.'
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - Every `pyforge.herald.*` flag is off in the tree and on in the development overlay, which is what an unset
      `PYFORGE_ENVIRONMENT` reads. `deck publish`, `deck exports` and `deck pptx-native` therefore run in a development
      checkout and refuse in production.
    - The operator role that guards `progress --update`, `success publish` and the notice write verbs is a self-declared
      string (an environment variable or a local config file), not a checked credential. The `deck` verbs have no
      role check at all, although `seed` and `push` write to the operator's Claude Design account and `pull` overwrites
      tracked files.
    - The refusal message tells the operator to run `herald auth login`. No such command exists.
    - 'Some writes arrive outside the command line: signature-checked webhooks for a ship and for a closed pull
      request (`/stations/herald/api/v1/webhooks/on-ship` and `on-pr-close`), and `herald-ship-local`, a pixi task.'
- id: marshal
  kind: station
  mark: M
  accent: --st-marshal
  title: Marshal
  role: The build-loop supervisor
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Deterministic BMAD-loop supervisor: wraps bmad-loop with gates-as-objects, run supervision, landing, fleet
      status, and adapter portability." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Marshal is what actually gets a story built. It takes a story from a station''s ledger, hands it to a coding
      agent in its own worktree, watches the run, checks the result against the repository''s gates, and lands it
      through a pull request — and it journals each step so a run can be resumed or audited. It writes no feature
      code itself: its job is to make an unattended run safe. The same package ships Genesis (`marshal seed`), the
      installer that puts this operating model into another repository.'
  - type: h3
    num: M.1
    text: Commands
  - type: prose
    body:
    - 'Marshal supervises the engines below, and neither wraps the other. For **bmad-loop** its job is thin: render
      the policy file whole each time (the file is ignored by git and never edited by hand), start or rejoin the
      run, and read its journals. **bmad-build-auto** supervises nothing itself, so Marshal carries the supervision
      for it: detecting completion, verifying, landing, saving unfinished work, and dispatching across the fleet.
      A **harness** is the coding-agent command line a session runs in.'
  - type: engines
    engines:
    - name: bmad-loop
      verb: '`factory spin / attach / resume / checkpoint`'
      body:
      - A separate program with its own review, retry and landing. Marshal renders its policy and reads its journals.
    - name: bmad-build-auto
      verb: '`factory dispatch / dispatch-attach / dispatch-resume / drain`'
      body:
      - 'Not a program: a workflow prompt given to a harness, chosen from the profiles for claude, cursor, copilot,
        gemini and devin in policy order. Each candidate''s login is checked before it is used.'
  - type: table
    headers:
    - Command
    - What it does
    rows:
    - cells:
      - factory
      - Start, rejoin and resume a run on either engine. `drain` works through every station's ready stories; `checkpoint`
        commits work in progress locally; `challenge` is a fresh-context review of one planning artifact.
      mono:
      - true
      - false
    - cells:
      - init, config, preflight, refresh, teardown
      - A **loop home** is the isolated checkout a project's runs happen in. These create one, print its effective
        policy, check it can run, bring it up to date with `main`, and remove it (refusing when work would be lost).
      mono:
      - true
      - false
    - cells:
      - status, watch, homes
      - 'Read run state: one row per loop home, the operator''s periodic check, and the list of homes.'
      mono:
      - true
      - false
    - cells:
      - check
      - Run the repository's detectors through the front door.
      mono:
      - true
      - false
    - cells:
      - gate evaluate
      - Run the project's declared verify commands.
      mono:
      - true
      - false
    - cells:
      - land, retire, deploy
      - 'Merge a wave of landed stories, sweep branches that are provably safe to delete, and the landing helpers:
        `promote`, `recover-spec`, `land-story`, `batch-pr`, `refresh-feed`, `reconcile-completions`.'
      mono:
      - true
      - false
    - cells:
      - adapters
      - 'Keep each coding agent''s copy of the skills in step with the canonical tree, and record what each agent
        supports: `sync`, `conform`, `probe`, `smoke`, `matrix`, `models`, `entry-files`.'
      mono:
      - true
      - false
    - cells:
      - context
      - 'Build and check the trimmed planning context a session reads instead of whole planning files: `refresh`,
        `retrieve`, `bundle`, `advisory`, `bootstrap`, `pack`.'
      mono:
      - true
      - false
    - cells:
      - seed
      - 'Genesis: `init`, `adopt`, `check`, `kit`, `update`, `accept`, `explain`, `version`. Every file it manages
        carries an ownership class, so a repository''s owner knows whether a file is safe to edit.'
      mono:
      - true
      - false
    - cells:
      - planning chain-regenerate
      - Regenerate one project's planning chain.
      mono:
      - true
      - false
    - cells:
      - benchmark
      - Compare a run's cost with and without the token-saving layers.
      mono:
      - true
      - false
    - cells:
      - preserve
      - Tag, list, push and retire preserved-work refs.
      mono:
      - true
      - false
    - cells:
      - upstream
      - Report the register of contributions owed upstream to bmad-loop.
      mono:
      - true
      - false
    - cells:
      - login
      - Write a local development bearer token for the host.
      mono:
      - true
      - false
  - type: prose
    body:
    - 'Behaviour is set by **policy**: one value per key, folded from the code default, the repository''s defaults,
      the project''s layer and then command-line flags, with the last one winning. A malformed value is skipped
      for that key, and a key outside the closed vocabulary is left out and reported.'
    - 'Exit codes: the verdicts below, with 2 for a usage error and 130 when interrupted.'
  - type: lattice
    rungs:
    - exit: '4'
      name: ERROR
      desc: unexpected failure
      tone: --red-soft
      exit_tone: --red
    - exit: '3'
      name: GATE_FAILED
      desc: a verify command failed
      tone: --amber-soft
      exit_tone: --amber
    - exit: '2'
      name: SCOPE_VIOLATION
      desc: outside declared bounds
      tone: --amber-soft
      exit_tone: --amber
    - exit: '1'
      name: UNEVALUABLE
      desc: could not be judged
      tone: --paper-sunken
      exit_tone: --rail
    - exit: '0'
      name: WARN
      desc: clean, with a caveat
      tone: --green-soft
      exit_tone: --green
    - exit: '0'
      name: CLEAN
      desc: nothing to report
      tone: --green-soft
      exit_tone: --green
    note: 'Marshal''s verdicts, strongest first, with usage 2 and interrupted 130 at the boundary. The numbers are
      read from `pyforge.core.exit_domains`, never spelled in a module. `marshal seed` has a second, separate domain:
      conformance 1, usage 2, precondition 3, never-write 4, state-invalid 5, internal 10.'
  - type: h3
    num: M.2
    text: MCP face
  - type: prose
    body:
    - 'Marshal has a face in each place. The base package ships a stdio server (`marshal-mcp`, on the official `mcp`
      SDK) whose tools each run one Marshal command: `marshal_status`, `marshal_check`, `marshal_homes`, `marshal_preflight`,
      `marshal_upstream`, `marshal_watch`, `marshal_refresh`, `marshal_preserve_list`, `marshal_preserve_push`,
      `marshal_preserve_retire` and `list_marshal_tools`. Most are reads; `marshal_refresh` and the preserve push
      and retire tools change state.'
    - '`django-marshal` serves `POST /stations/marshal/mcp`, which is how run state reaches the host: `start_loop`
      and `get_loop`, the run-state tools `publish_loop_run`, `heartbeat_loop_run` and `complete_loop_run`, `list_loop_story_tasks`,
      and `marshal_watch`.'
  - type: h3
    num: M.3
    text: State
  - type: prose
    body:
    - Each loop has a home under `~/.bmad-loops/<slug>`, holding the rendered policy and an append-only journal
      per run. Genesis keeps `.marshal/seed-state.yml` and a plan file in the seeded repository. Run state is also
      published to the host. All input and output goes through port interfaces with one adapter each; there are
      no alternative backends.
  - type: h3
    num: M.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**bmad-loop** — imported by one adapter module, and by the recall plugin Marshal ships for bmad-loop
        itself to load; the declared range is `>=0.11.0,<0.13`.'
    - glyph: ←
      md: '**Doctor** — judged by it. Marshal has no code-level lever over the checks that grade it.'
    - glyph: →
      md: '**Doctor, Scribe, Steward** — reached by command line only (a detector source, `scribe`, `steward ci
        status`), never by import. Marshal imports no sibling station.'
    - glyph: →
      md: '**pyforge-core** — a hard dependency, and Marshal registers `bmad-loop` in the shared hook group.'
    - glyph: →
      md: '**GitHub and git** — through `gh` and git, each behind its own adapter.'
  - type: h3
    num: M.5
    text: Held by tests
  - type: prose
    body:
    - Import-linter contracts keep the core pure, let only one adapter module import `bmad_loop`, and stop a supervisor
      importing the command line. One module owns the verdict-to-exit-code projection. Separate meta-tests forbid
      importing Doctor's, Steward's, Scribe's or an engine's internals. The MCP server must register every declared
      tool, the rendered policy must stay untracked, every network egress must be in the egress registry, and the
      Spec's `contract.md` must match the code.
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - '`factory challenge` and `preserve push` / `preserve retire` are behind flags that are off. The portal''s
      `start_loop` refuses every caller while `pyforge.steward.start_loop_dispatch` is off, which it is in every
      environment.'
    - The repository's own pixi environments install `bmad-loop >=0.12.0`, narrower than the range the package declares.
    - The default harness order is claude, cursor, copilot, gemini, devin; Marshal's own project layer narrows it
      to cursor.
- id: mason
  kind: station
  mark: Ma
  accent: --st-mason
  title: Mason
  role: The builder — a command line onto conda-forge-expert
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"The Artisan Builder''s CLI — author and build conda recipes, ship packages to PyPI + conda-forge, and
      resolve conflicting worlds into one lockfile." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Mason builds and ships packages. For conda recipes it is deliberately thin: the knowledge of how to write
      and fix a recipe lives in the `conda-forge-expert` skill, and Mason drives that skill''s scripts by subprocess
      rather than copying what they know. On top of that it has two things of its own: building and shipping a Python
      package, and resolving an environment into one lockfile.'
  - type: h3
    num: Ma.1
    text: Commands
  - type: prose
    body:
    - The nouns are `recipe`, `package` and `environment`, with `doctor` as a check. `recipe` has `new`, `validate`,
      `build`, `diagnose`, `optimize`, `scan`, `submit` and `update`, each a wrapper over a `conda-forge-expert`
      script (`build` picks the native or the Docker script, `update` picks the PyPI or the GitHub one). `package`
      has `build` and `ship`; `ship --to` takes `pypi`, `pypi-test`, `conda-forge` or `channel:<name>`. `environment`
      has `lock` and `check`. `doctor` reports whether the skill and each build tool can be found.
    - Every setting resolves the same way — flag, then a `MASON_*` environment variable, then the default — and
      there is no config file.
    - 'Exit codes: 0 for success, 1 for a failure (its own, or a wrapped tool''s), 2 for a usage error, 3 when `conda-forge-expert`
      cannot be found, and 130 when interrupted.'
  - type: h3
    num: Ma.2
    text: MCP face
  - type: prose
    body:
    - 'In `django-mason`, at `POST /stations/mason/mcp`: `start_build` and `get_build`. They run one command, `recipe
      build` on a tracked recipe, and nothing else of the grammar. The base package holds no MCP server.'
  - type: h3
    num: Ma.3
    text: State
  - type: prose
    body:
    - 'The command line keeps none: no config file, no journal. The one store is an index of built artifacts that
      the portal rebuilds at start-up, behind an `IndexStore` interface with a SQLite implementation in the base
      package and a PostgreSQL one in the portal.'
  - type: h3
    num: Ma.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**conda-forge-expert** — the point of the station: by subprocess only, through one adapter module, and
        never forked. Mason''s persona skill forbids writing a skill that replaces it.'
    - glyph: →
      md: '**pyforge-core** — a hard dependency: the error root and the hook registry, where Mason registers its
        build engines, `rattler-build` and `conda-build`.'
    - glyph: →
      md: '**Build tools** — pixi, twine, conda-lock, python-build and `gh`, each behind its own engine module.'
    - glyph: ✗
      md: '**Other stations** — Mason imports none.'
  - type: h3
    num: Ma.5
    text: Held by tests
  - type: prose
    body:
    - 'Only the adapter module may name or run a `conda-forge-expert` script. `package`, `environment` and `doctor`
      must import and run with the skill absent; the one exception, shipping to conda-forge, is pinned as the exception.
      Publish credentials reach twine only by ordinary environment inheritance: no module may pass an `env=` override
      outside the adapter, so Mason cannot hold or log a credential. Mason''s code may contain no recipe knowledge
      of its own. Only `cli.py`, the adapter and the engine modules may import `subprocess`, only `cli.py` and `render.py`
      may write to standard output, and the tool version ranges in code must equal the pixi pins.'
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - '`package ship` and `recipe submit` are dry runs unless `--yes` is given, and an exit of 0 from `ship` does
      not mean shipped: read each target''s state, where `pending` is never shown as success.'
    - The `gh` adapter can find an open pull request, but no ship path calls it; shipping to conda-forge goes through
      `recipe submit`.
    - '`airgap_contract.py` is a contract and an empty registry; it builds nothing.'
    - '`doctor` reports a missing skill or tool as data and still exits 0.'
- id: scribe
  kind: station
  mark: S
  accent: --st-scribe
  title: Scribe
  role: The write path for checked-in team memory
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Direct-capture CLI for checked-in team memory (.claude/memory/) -- the append-only write path for team-relevant
      decisions, ADRs, and project state." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: Scribe is the fleet's memory. When a decision is made — an operator's ruling, a trap someone hit, a pointer
      worth keeping — `scribe capture` writes it as a small file under `.claude/memory/`, where every contributor
      and every agent sees it in review. `scribe recall` then answers a question from that memory and the planning
      record, and only with a source it can cite. If it finds nothing it can ground, it says so.
  - type: h3
    num: S.1
    text: Commands
  - type: prose
    body:
    - 'The work is in layers that never blur. **Capture** is the only path allowed to write under `.claude/memory/`:
      append-only, never overwriting, inside one locked section. `--promote` and `--transcripts` propose entries
      from a personal auto-memory file or from session transcripts and write only on confirmation. **Compile** (`graph
      compile`) rebuilds the whole graph from scratch on every run, from team memory, memlogs, changelogs, retros,
      Herald''s facts ledgers, active Dreams, live Specs, in-flight story specs, planning pointers, named docs,
      the local `git log` and session transcripts. **Recall** reads only what compile produced.'
    - '`recall` ranks by plain token overlap, with no language model and no network. `--mode` narrows it to `planning`,
      `memory` or `code`; `--scope <slug>` to one project; and it never returns a stale or superseded record. `index
      build`, `report` and `refresh` maintain a declared-artifacts index, and `catalog bmad-estate` renders or checks
      `docs/reference/bmad-estate-llms-full.md`.'
    - 'Exit codes: 0 on success, 1 only when `catalog bmad-estate --check` finds drift, and 2 for a usage error
      or anything that stopped it running.'
  - type: h3
    num: S.2
    text: MCP face
  - type: prose
    body:
    - 'In `django-scribe`, at `POST /stations/scribe/mcp`: `start_recall` and `get_recall`, which run `scribe recall`
      on the query. The portal''s one page is a recall form. The base package holds no MCP server.'
  - type: h3
    num: S.3
    text: State
  - type: prose
    body:
    - 'Team memory is tracked: one file per entry under `.claude/memory/<type>/`, and one line in `MEMORY.md`. The
      compiled graph is derived and ignored by git. Where the graph is stored is chosen by `PYFORGE_GRAPHSTORE_OWNER`:
      a flat JSON file by default (owner `scribe`), PostgreSQL with pgvector (owner `steward`), or Atlas''s DuckDB
      file (owner `atlas`). A superseded record is marked ended, never deleted.'
  - type: h3
    num: S.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**pyforge-core** — a hard dependency: atomic writes, flags, errors, and the hook registry through which
        the storage backends are registered.'
    - glyph: →
      md: '**Atlas** — one lazy import, of Atlas''s DuckDB writer, used only by the `atlas` storage backend.'
    - glyph: →
      md: '**Steward** — no import. The PostgreSQL backend''s schema is created by Steward-run changesets, and Scribe
        refuses to run against a database that lacks it.'
    - glyph: ←
      md: '**Marshal and Steward** — both run the `scribe` command line; no station imports Scribe.'
  - type: h3
    num: S.5
    text: Held by tests
  - type: prose
    body:
    - A capture may touch only the memory root. Two compiles of unchanged sources produce identical bytes. Recall
      makes no network call. Every verb, flag, MCP tool, environment variable and exit code in the code must appear
      in the Spec's `contract.md`. No live Spec may be behind its memlog, and the instruction files (`AGENTS.md`,
      `CLAUDE.md` and the per-tool addenda) must agree with each other (`tests/meta/test_instruction_surface_parity.py`).
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - '`recall --semantic` ranks only on the PostgreSQL and DuckDB backends, and by a hashed bag of concepts rather
      than model embeddings. On the default flat-file store it finds nothing and reports no grounded answer.'
    - '`index move-list` is a registered verb that the Spec marks retired: do not build on it.'
    - Identical compiles hold per machine, because session transcripts are per user.
    - '`graph compile` and `index` run in `-e pyforge-scribe`; `capture`, `recall` and `catalog` run in `-e pyforge-guild`.'
  - type: verify
    md: 'Not established from source: which storage backend any deployed environment selects.'
- id: steward
  kind: station
  mark: St
  accent: --st-steward
  title: Steward
  role: The Provisioner — credentials, the machine, CI and the platform layer
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"The Provisioner''s CLI — credential lifecycle, deployment, provisioning and budget duties for the factory''s
      platform layer." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Steward looks after everything the other stations stand on. It is the first thing run on a new machine
      (`steward init` says whether the machine is ready), and it owns the jobs that keep the repository working:
      credentials, worktrees, pausing and resuming CI, building this Pages site, refreshing dependency pins, upgrading
      BMAD (the planning method the fleet runs on), and deployment. Its work is a flat list of **duties**. Each
      duty returns a frozen result — "evidence, not a scratchpad", in the words of its docstring — and none may
      end the process itself.'
  - type: h3
    num: St.1
    text: Commands
  - type: prose
    body:
    - '`pyforge steward --help` lists every duty. By purpose:'
  - type: table
    headers:
    - Duty
    - What it does
    rows:
    - cells:
      - init
      - Says whether this machine is ready, one verdict per profile, with the remedy for each failing check. Read-only.
      mono:
      - true
      - false
    - cells:
      - setup, shell-init, initrepo, validate-fast
      - 'Bootstrap a machine: clone and install, emit the shell snippet, onboard a checkout, and run the fast green
        gate.'
      mono:
      - true
      - false
    - cells:
      - provision, session check
      - Provision an environment, and give one verdict on a session's preconditions.
      mono:
      - true
      - false
    - cells:
      - keys, restore, revoke
      - The credential lifecycle (`encrypt`, `decrypt`, `rotate`, `list`, `audit`, `revoke`, `exec`), a database
        restore drill, and stopping one runaway subject.
      mono:
      - true
      - false
    - cells:
      - workspace
      - 'Landing worktrees: `start`, `ls`, `status`, `clean`.'
      mono:
      - true
      - false
    - cells:
      - preflight verify-deferred
      - List the checks a push deferred to CI, and run the full preflight.
      mono:
      - true
      - false
    - cells:
      - ci
      - 'See, pause and resume CI surfaces: `status`, `vars`, `pause`, `resume`.'
      mono:
      - true
      - false
    - cells:
      - pages
      - 'The one Pages workflow: `build`, `deploy`, `status`.'
      mono:
      - true
      - false
    - cells:
      - ledger-query
      - Query every station's sprint ledger.
      mono:
      - true
      - false
    - cells:
      - estate
      - 'Refresh dependency pins by policy: `plan`, `refresh`, `reconcile`, `verify`, `realize`, `status`.'
      mono:
      - true
      - false
    - cells:
      - upgrade
      - 'Upgrade BMAD''s core: `bmad-core`, `pin-fan-out`, `prove-landed`, `verify`.'
      mono:
      - true
      - false
    - cells:
      - suite, catalog, measure
      - The BMAD suite's packages (`pipeline-truth`, `advance`), the estate's BMAD catalog, and the measure catalog.
      mono:
      - true
      - false
    - cells:
      - guards, track, deck-drift
      - 'Advisory checks: the guard library, one tracked record per run, and silent drift on a pulled deck.'
      mono:
      - true
      - false
    - cells:
      - deploy
      - Perimeter manifests, the static-export publish, and the cluster bring-up (`perimeter`, `static`, `nic`).
      mono:
      - true
      - false
    - cells:
      - sync reconcile
      - Reconcile GitHub Projects with Jira.
      mono:
      - true
      - false
    - cells:
      - budget
      - 'Cost budgets: `set`, `show`, `check`.'
      mono:
      - true
      - false
    - cells:
      - cutover
      - Generate and validate the capability ledger (`plan`), and move the root-of-record flag (`flip`).
      mono:
      - true
      - false
    - cells:
      - load, passport, glass, quarantine
      - 'The **corridor**: idempotent file loads in and out for work from an outside vendor, an identity (a passport)
        for each inbound item, a freshness view, and a shelf for items that arrive without one.'
      mono:
      - true
      - false
  - type: prose
    body:
    - 'Exit codes are a contract. 0 is success. 1 means a duty ran and reported failure, and nothing else. 2 is
      a usage error, or a verb whose kill switch is off. 3 is a documented refusal: a duty that cannot judge, or
      `estate`, `ci` or `pages` with its flag off. 70 is a crash — any uncaught exception — kept apart from 1 on
      purpose, so a crash is never read as a real failure. 130 is an interrupt. The dispatcher is the one place
      that maps a duty''s ending to a code.'
    - '`ledger-query` reads every station''s tracked sprint ledger and `epics.md` as they stand and derives no status
      of its own. Its JSON output is what the Pages fleet board is built from.'
  - type: h3
    num: St.2
    text: MCP face
  - type: prose
    body:
    - 'In `django-steward`, at `POST /stations/steward/mcp`: `start_duty` and `get_duty`, over a closed table of
      read-only targets — `ci-status`, `estate-plan` and `estate-status`. The base package holds no MCP server.'
  - type: h3
    num: St.3
    text: State
  - type: prose
    body:
    - 'Plain files under `.steward/` at the repository root: the key inventory, the workspace register, CI variables
      and status snapshots, the CI pause log, preflight run and skip logs, deployment logs. Django models exist
      only in the optional `dashboard` extra — an audit entry, a work passport, a corridor load and a quarantine
      shelf — and live in the platform host''s database. Output formats and sources for `ledger-query`, and deployment
      profiles, are plugins.'
  - type: h3
    num: St.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**pyforge-core** — the only `pyforge` package Steward''s source imports.'
    - glyph: →
      md: '**Marshal** — by command line only: `marshal watch`, `marshal seed check`, `marshal refresh`. A failure
        there degrades the answer; it never blocks Steward.'
    - glyph: →
      md: '**Scribe** — by command line: a capture when CI is paused or resumed, and the estate catalog render.'
    - glyph: →
      md: '**Herald** — by file: Steward reads the deck bridge''s state file to check deck integrity, and writes
        the fleet-status file the Pages board reads.'
    - glyph: →
      md: '**conda-forge-expert** — `keys` and `sync` load that skill''s HTTP helper, and `deploy`, `suite advance`
        and `estate reconcile` run its scripts.'
    - glyph: —
      md: '**The operator console** at `/console/` is code in the platform host (`src/platform/`), not in the Steward
        package. It reads tracked repository files at request time and a cache of detector verdicts.'
  - type: h3
    num: St.5
    text: Held by tests
  - type: prose
    body:
    - '`tests/meta/test_invariants.py` holds the shape: no duty module calls `sys.exit`; there is no CLI framework
      dependency; no rotation scheduler exists; no provider SDK is imported; `deploy` derives no story status; and
      no module outside `dashboard/` imports Django, Channels or the dashboard at load, so the base package runs
      without the extra. The Spec''s `contract.md` is compared with the code, and another test fails any station
      whose source assumes the `local-recipes` environment.'
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - 'Steward''s `dashboard` extra is not the operator console: it is the corridor, passport and audit application.'
    - '`estate`, `ci` and `pages` are behind flags that are off in the tree and on in the development overlay; while
      off they refuse with exit 3. `keys exec` (`pyforge.steward.ghe_fleet_credentials`) and `glass export` (`pyforge.steward.glass_export`)
      are off in every environment.'
    - '`budget check` has no metered source of spend, so it can only answer "not configured".'
    - '`estate refresh --transitive`, `estate realize --yes` and `deploy nic up --yes` on anything but a local kind
      cluster are operator-only, and the session hook denies them to agents.'
- id: warden
  kind: station
  mark: W
  accent: --st-warden
  title: Warden
  role: The compliance gate — dependency hygiene, vulnerabilities, licenses and age
  measured: '2026-11-26'
  blocks:
  - type: quote
    md: '"Unified dependency-hygiene + vulnerability scanner orchestrating deptry and osv-scanner over Python/Conda/Pixi
      manifests." — the package''s own `pyproject.toml`'
  - type: stats
    stats:
    - value: —
      label: Source lines · 0 files
      check: src_lines
    - value: —
      label: Test lines
      check: test_lines
    - value: —
      label: Stories / epics done
      check: stories_epics
    - value: —
      label: Stories open / blocked
      check: stories_open
  - type: lede
    md: 'Warden answers one question about a project''s dependencies: is this safe to ship? It reads the manifests
      it finds, checks them on the axes below, and reduces everything to a single status and exit code that a CI
      job can gate on. It is the station that gives a verdict; the others report or supply data. A scan works offline
      against data fetched beforehand.'
  - type: h3
    num: W.1
    text: Commands
  - type: prose
    body:
    - 'One command: `warden scan [path]`. Its options shape the gate — what severity fails (`--fail-on`), which
      licenses are allowed or denied, how old a dependency may be (`--max-lag`, `--fail-on-eol`), whether a warning
      fails (`--warn-as-error`), a baseline of accepted findings, and a recorded bypass that needs `--reason`. `scan
      --self-check` is a self-check of Warden''s own tools and data: it touches no network, judges no policy, and exits
      0 or 2. It is unrelated to the Doctor station.'
    - 'The axes are hygiene (deptry: unused, missing and misplaced dependencies), vulnerabilities (osv-scanner,
      gated on severity, on the CISA known-exploited list, and on exploit probability when `--min-epss` is set),
      licenses (SPDX allow and deny lists) and currency (how far behind, and end-of-life). The engines run in parallel
      and their results are applied in a fixed order, so the verdict does not depend on which finishes first.'
    - Warden reads `pyproject.toml`, `pixi.toml`, `pixi.lock`, `conda-lock.yml`, `environment.yml`, and conda recipes
      in both forms, `meta.yaml` and `recipe.yaml`.
    - 'Exit codes: the statuses below, with 130 when interrupted.'
  - type: lattice
    rungs:
    - exit: '2'
      name: ERROR
      desc: the scan could not run
      tone: --red-soft
      exit_tone: --red
    - exit: '1'
      name: POLICY_VIOLATION
      desc: a gate failed
      tone: --amber-soft
      exit_tone: --amber
    - exit: '1'
      name: INDETERMINATE
      desc: an axis could not be assessed
      tone: --amber-soft
      exit_tone: --amber
    - exit: 0\*
      name: WARN
      desc: \*1 with --warn-as-error
      tone: --paper-sunken
      exit_tone: --rail
    - exit: '0'
      name: BYPASSED
      desc: skipped, with a recorded reason
      tone: --green-soft
      exit_tone: --green
    - exit: '0'
      name: CLEAN
      desc: assessed, nothing found
      tone: --green-soft
      exit_tone: --green
    - exit: '0'
      name: NOT_APPLICABLE
      desc: nothing to assess
      tone: --green-soft
      exit_tone: --green
    note: Warden's statuses, strongest first; the strongest one any axis reports is the scan's. An unrecognised
      status is an error, never a silent pass, and an unrecognised vulnerability match level lands on `INDETERMINATE`,
      never `CLEAN`. `--allow-empty` lets a scan that found no dependencies exit 0 while its status stays indeterminate.
  - type: h3
    num: W.2
    text: MCP face
  - type: prose
    body:
    - 'In `django-warden`, at `POST /stations/warden/mcp`: `start_audit` and `get_audit`. They run one command,
      `warden scan <target> --format json`. The MCP face cannot run `--self-check`, a bypass or the fix-PR options.
      The base package holds no MCP server.'
  - type: h3
    num: W.3
    text: State
  - type: prose
    body:
    - No database and no journal. Configuration is `[tool.pyforge-warden]` in `pyproject.toml`; accepted findings
      live in a committed waiver file and an optional baseline file. The offline vulnerability database and the
      feed caches (known-exploited, exploit probability, end-of-life) sit in directories named by environment variables
      and are written by refresh scripts, never by a scan. A scan writes its report to standard output and, on request,
      a CycloneDX bill of materials. The portal keeps Django models for compliance jobs and fleet scans.
  - type: h3
    num: W.4
    text: Relationships
  - type: relations
    items:
    - glyph: →
      md: '**pyforge-core** — the only `pyforge` package Warden imports: the verdict lattice, exit domains, the
        report envelope, flags, the hook registry.'
    - glyph: ←
      md: '**Doctor** and **Atlas** — each imports Warden lazily, installed by its own extra named `gate`. Warden
        imports neither.'
    - glyph: —
      md: Warden's engines register in the same shared hook group as every other station's plugins. Further entries
        — Checkmarx, SonarQube, Black Duck, GitHub Advanced Security and a local profile — are stubs with no vendor
        SDK; a default scan is unaffected by their absence.
  - type: h3
    num: W.5
    text: Held by tests
  - type: prose
    body:
    - One module owns the exit-code projection, and its numbers must equal the declared `warden` domain. One module
      is the only place a subprocess is started. The manifest extractors may import nothing that executes code or
      opens a network connection, and a socket-deny fixture fails any test that opens one. There is no second plugin
      group. The tool version ranges in code must equal the pixi pins, and the Spec's `contract.md` must equal the
      code in both directions.
  - type: callout
    tone: amber
    label: Worth knowing before you rely on it
    body:
    - Failing on a known-exploited vulnerability is on by default. With no known-exploited feed provisioned, a default
      scan is therefore `INDETERMINATE` on the vulnerability axis and exits 1. Run `scan --self-check` first.
    - '`--warn-only` can hide an unprovisioned vulnerability database: the axis goes unassessed and the run exits
      0.'
    - '`--open-fix-prs` is opt-in and runs only after the verdict is final, so it cannot change it. It turns a vulnerability
      into an upgrade proposal and an unused dependency into a removal proposal. Resolving the upgrade target, editing
      the manifest and opening draft pull requests across the fleet''s repositories are each behind a flag.'
    - Lockfiles for other ecosystems (npm, yarn, pnpm, Go, Cargo, Ruby, PHP) are read only with `pyforge.warden.non_python_ecosystems`
      on, and the portal's fleet pages are behind the `pyforge.warden.fleet_*` flags. Every Warden flag is off in
      the tree and in production, and on in the development and staging overlays.
    - '`--deterministic` is accepted and does nothing; `--require-lts` turns the currency gate on and enforces nothing
      specific to long-term-support releases.'
