  - type: prose
    body:
    - 'A strict three-layer pipeline: **capture** (the only path allowed to write under `.claude/memory/`
      — append-only, no-clobber, one locked critical section) → **compile** (a full, non-incremental rebuild
      every run — it resets the store and reconstructs from scratch, never incrementally — now across
      twelve named surfaces, up from six: curated memory files, memlogs, changelogs, retros, a facts ledger,
      dreams, specs, story specs, planning pointers, named docs, local `git log` — read-only, never fetch
      — and session transcripts, plus an optional thirteenth behind a `code` extra) → **recall** (reads
      the compiled result only, never the raw log). Node identity is derived deterministically, so two
      compiles of unchanged sources are byte-identical.'
    - 'Despite the name, the compiled "graph" has no separate edge object — nodes are flat facts, and
      a bi-temporal-lite supersession mechanism (`valid_from`/`valid_until`) marks a superseded record
      ended rather than ever deleting it. `recall` is deliberately dumb by default: pure lexical token-overlap
      scoring, no LLM, no network — an opt-in `--semantic` mode now sits alongside it, but it is a SHA-256
      bag-of-concepts rather than model embeddings, so the no-LLM and no-network guarantees hold in both
      modes — and every ranked candidate is filtered by whether its citation can actually be resolved
      *before* anything is returned. A query that resolves nothing gets an explicit, honest "no grounded
      answer," never a fabricated one.'
