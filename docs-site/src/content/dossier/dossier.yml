    - 'Unlike every other station, Warden''s CLI is essentially one subcommand — `scan`, governed by twenty-four
      flags — plus `--doctor` as a flag, not a subcommand, that only ever checks local operability, never
      touches the network, and can never exit `1`: it "reports operability, not policy," the same phrase
      Doctor''s own gotcha uses independently. Its `Status` lattice has seven ranked rungs (`CLEAN`, `NOT_APPLICABLE`,
      `BYPASSED`, `WARN`, `INDETERMINATE`, `POLICY_VIOLATION`, `ERROR`) — the largest in the fleet — built
      on the exact same shared `Lattice` primitive Marshal and Doctor also import, confirmed directly
      against `pyforge-core`''s own source.'
    - Four real compliance axes — hygiene (deptry), vulnerabilities (osv-scanner, gated on CVSS severity,
      CISA KEV, and a live EPSS exploit-probability threshold), license (SPDX allow/deny lists), and currency
      (staleness/LTS/EOL) — run in parallel worker threads but apply their results back in fixed registration
      order, so a crashing engine's effect on the final verdict is always deterministic regardless of
      which thread finishes first. Four more entries are deliberate commercial-scanner *stubs* (Checkmarx,
      SonarQube, Black Duck, GitHub Advanced Security) registered through the same shared plugin mechanism
      — a default scan stays green with every one of them absent, by design.
  - type: lattice
    rungs:
    - exit: '2'
      name: ERROR
