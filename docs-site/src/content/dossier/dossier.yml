  - type: h3
    num: '09.7'
    text: What the second pass changed
  - type: prose
    body:
    - This dossier was first compiled on 2026-08-30 and re-verified against the working tree on 2026-09-13,
      then again on 2026-10-14. In the second pass three stations — Herald, Mason and Warden — came through
      with every checked claim intact; five did not, and the fleet's total source went from roughly 110,000
      lines to roughly 200,000. The third pass found 17 checked figures stale across all eight stations — no
      station held — and the total at roughly 261,000; Steward nearly doubled (18,978 → 35,770 source lines,
      37 → 74 files) and now stands second only to Marshal.
    - 'Two corrections change conclusions rather than figures. Marshal now hosts its own MCP server, so
      the MCP-hosting gap above is no longer "Atlas, and only Atlas." And Atlas''s second dashboard path
      — the `views/` legacy bridge rendering Bokeh fragments — has been deleted outright; a previous pass
      described code that no longer exists. A third correction is quieter but matters most: `pyforge-core`
      picked up a host/portal client layer, which makes the leaf every station depends on something more
      than the box of shared mechanisms it was introduced as.'
    - 'The reason to record this rather than silently overwrite it: the drift *is* the finding. A dossier
      that only ever shows current numbers would have hidden the one pattern both passes agree on. From
      2026-11-10 the stats bands and the scale table are counted at every build, so this section records what
      each pass found, not current figures.'
- id: verified
  num: '10'
  title: What's verified, what isn't
  kind: section
  measured: '2026-11-11'
  blocks:
  - type: lede
    md: Only what the case list, the capability ledger and CI prove is listed here; each row names its
      evidence (`source`), and each row's `asserts:` is resolved against the steward sprint ledger, the flag
      tree and the capability ledger by herald's test. The station sections are forensic reads of A's
      source, run in full on 2026-09-13; each states the day its prose was last read, its figures are
      counted at every build, and the caveat below names what those reads did not establish.
  - type: table
    headers:
    - Claim
    - Evidence
    rows:
    - cells:
      - '`pyforge.cutover_root` defaults to `local-recipes`: the cutover has not flipped.'
      - case `k-cutover-flag`
      mono:
