# Team override for bmad-build — local-recipes / PyForge estate.
# Personal overrides go in bmad-build.user.toml (gitignored).
#
# Marshal Story 74.3 (spec-feature-flag-governance CAP-6): the Builder mandate
# and a flagged-story review layer live here, never in installer-owned SKILL.md.

[workflow]

persistent_facts = [
  "Feature-flag governance (Builder): on a flagged story read the declared flag key only through `pyforge.core` or `django_pyforge.flags` — never Waffle, an environment variable, or a second tree (`docs/governance/spec-feature-flag-governance/SPEC.md` CAP-6; canopy:AD-11). With the flag OFF the legacy behaviour in the story spec's `flag.fallback` must hold. A CLI verb whose flag is OFF stays listed in `--help`, marked disabled, and refuses with its station's usage exit code and a flag-off message (Q3 in the Guild Spec). The block shape lives in `docs/reference/story-spec-flag-block.md`.",
  "Before any `intent_gap` or `bad_spec` revert, run `marshal preserve tag --producer build --story <slug> <N.M> --from .`, cite the returned tag in the Review Triage Log, and leave pushing the preserve to the dispatch supervisor or the operator — never auto-push from this skill (`.claude/skills/bmad-build/step-04-review.md` intent_gap / bad_spec loopbacks; spec-pyforge-marshal CAP-287 FR-234). When `pyforge.marshal.preserve_refs` is OFF the command refuses with the flag-off message and the session proceeds as today.",
  "Story spec frontmatter (Story 96.1): each frontmatter key appears once — replace the line that holds a key instead of adding a second line, and add a line only when the key is absent. After every frontmatter write, parse the block and confirm no key appears twice (same guard step-04 uses for `deferred:`).",
]

[[workflow.review_layers]]
id = "fr-arrow"
name = "Requirement Arrow Trace"
when = "The unified diff at `{diff_file}` adds or changes a line that defines a PRD requirement (`FR-n`, `NFR-n` or a lettered NFR id opening a heading, bullet or bold line under `_bmad-output/projects/pyforge-<s>/planning-artifacts/prds/`), or adds or changes a `← CAP-m` / `← spec-<x> CAP-m` arrow on one."
instruction = """
On a PRD requirement change, read the unified diff at `{diff_file}` and, for each added or changed requirement line, the station Spec `_bmad-output/projects/pyforge-<s>/planning-artifacts/specs/spec-pyforge-<s>/SPEC.md` (or the Spec a `spec-<x>` prefix names).

Answer only from those sources, one bullet per requirement line:
1. Does the line carry an arrow, and does every item after `←` name a capability (`CAP-m`, optionally `spec-<x> CAP-m`) and nothing else — no Constraint, Charter clause, AD or decision id?
2. Is each cited CAP a *definition* line in the named Spec (`- **CAP-m —` / `### CAP-m`), not a mention?
3. Does the requirement's title or body share its subject with the cited CAP's intent or success — is the arrow traced, not counted? A run of four or more consecutive requirements whose CAP numbers step with their ids, with no shared words, is counted.
4. Is the id hyphenated and defined once in the PRD?

Output a short Markdown list with yes/no and one line of evidence per question. If any answer is no, say what is missing and which CAP the intent/success text points at instead. If the diff touches no PRD requirement line, report zero findings and stop. Rule: spec-one-chain-per-station CAP-5 (amended 2026-10-26), `docs/governance/spec-one-chain-per-station/CHAIN-STANDARD.md` § 2 and § 12; the detector is doctor `fr-without-cap`.
"""

[[workflow.review_layers]]
id = "flag-mandate"
name = "Feature Flag Mandate"
when = "The active story spec is `type: feature` and carries a `flag:` block (not `flag-exempt:`)."
instruction = """
On a flagged story, read the story spec's `flag.key` and the unified diff at `{diff_file}`.

Answer only from those sources:
1. Does the diff read the declared flag key only through sanctioned surfaces (`pyforge.core`, `django_pyforge.flags`, or tests that use `pyforge.testing_kit.flags`) — not a mock of Waffle or an environment variable?
2. Does the story spec's `## Verification` section name a two-state test (flag ON and OFF) for that key?

Output a short Markdown list: one bullet per question with yes/no and one line of evidence each. If either answer is no, say what is missing. If the story is not flagged, report zero findings and stop.

Do not invoke any skill, and do not spawn subagents — you are the reviewer. Return findings as text in your final message only.
"""
