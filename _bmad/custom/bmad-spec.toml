# Team override for bmad-spec — local-recipes / PyForge estate.
# Personal overrides go in bmad-spec.user.toml (gitignored).
#
# Marshal Story 74.3 (spec-feature-flag-governance CAP-6): the Architect mandate
# travels here as a persistent fact, never through an installer-owned SKILL.md.

[workflow]

persistent_facts = [
  "Feature-flag governance (Architect): every story spec of `type: feature` minted on or after 2026-09-28 must declare exactly one of a `flag:` block or a `flag-exempt:` value from the closed list in `docs/governance/guild-roster.json` — see `docs/governance/spec-feature-flag-governance/SPEC.md` CAP-1 and the block shape in `docs/reference/story-spec-flag-block.md`. `fix`, `chore` and `docs` stories need neither. Carrying both, or neither, is a defect.",
  "Requirements derive from capabilities (Spec author; spec-one-chain-per-station CAP-5 as amended 2026-10-26, CHAIN-STANDARD § 2, § 12): a capability is the only thing a PRD requirement may cite, so every WHAT a user or operator can see must be a `CAP-n` with intent and success — a Constraint that promises such a guarantee is minted as a CAP with the Constraint as provenance, and a Constraint that only bends design stays a Constraint and is realized by an AD that names it. Never let a requirement, a story or a memlog line cite a Constraint, a Charter clause, an AD or a decision id as the source of a requirement. When this skill re-derives a station Spec or a PRD arrow (`FR-n ← CAP-m`), trace from the CAP's intent and success; never number arrows in sequence. Capability ids stay stable (Spec Law 6); a fold-damaged title or bullet is restored by memlog correction and an anchor-asserting script render, never by hand.",
]
