    text: What the second pass changed
  - type: prose
    body:
    - This dossier was first compiled on 2026-08-30 and re-verified against the working tree on 2026-09-13.
      Three stations — Herald, Mason and Warden — came through with every checked claim intact. Five did
      not, and the fleet's total source has gone from roughly 110,000 lines to roughly 200,000.
    - 'Two corrections change conclusions rather than figures. Marshal now hosts its own MCP server, so
      the MCP-hosting gap above is no longer "Atlas, and only Atlas." And Atlas''s second dashboard path
      — the `views/` legacy bridge rendering Bokeh fragments — has been deleted outright; a previous pass
      described code that no longer exists. A third correction is quieter but matters most: `pyforge-core`
      picked up a host/portal client layer, which makes the leaf every station depends on something more
      than the box of shared mechanisms it was introduced as.'
    - 'The reason to record this rather than silently overwrite it: the drift *is* the finding. A dossier
      that only ever shows current numbers would have hidden the one pattern both passes agree on.'
- id: verified
  num: '10'
  title: What's verified, what isn't
  kind: section
  blocks:
  - type: lede
    md: Every claim above traces to a file, docstring, or dataclass read directly from source across eight
      independent, parallel investigations, re-run in full on 2026-09-13. Each station section's own caveats
      are noted inline; the pattern worth naming here is what recurs across all eight.
  - type: callout
    tone: amber
    label: Consistent gaps across every investigation
    body:
    - No investigation fully read every module in its station — each prioritized the CLI surface, the
      core domain model, and cross-station coupling, and named the modules it left unread rather than
      inferring their contents. Design-decision registries were only partially glossed everywhere (roughly
      a third to a half of tagged decisions per station had enough surrounding context captured to summarize
      safely). And several cross-station claims — Atlas→Mason's trending handoff, the exact shared meaning
      of "Lane" boundaries, whether Atlas's dashboard reads the same BMAD status source Marshal and Steward
      do — were named from one side only and not independently confirmed from the other.
  - type: callout
    tone: green
    label: What is now checked mechanically
    body:
    - Line counts, file counts, test ratios and Python floors in this dossier are no longer hand-maintained
      prose. `site/tools/verify_claims.py` measures the source tree, compares it against the stat rows
      in this document's own content model, and reports anything that has drifted past a 5% tolerance.
      It runs on every push. It is advisory — it annotates and never blocks a deploy — because deciding
      what a number should *say* is editorial, but noticing that it is wrong no longer depends on anyone
      remembering to look.
