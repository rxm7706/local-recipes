    text: Campaign — four verbs
  - type: prose
    body:
    - 'From B''s README (Unifying Strategy cutover spine): **Launch the Foundry** · **Adopt Frames** ·
      **Build the Intelligence Hub** · **Wire the BMAD-suite**. Launch means B exists *and* a regenerated
      kernel runs — not "A''s tree arrived." Hub objects are invented on A first; B adopts verified rebuilds.'
  - type: callout
    tone: amber
    label: Modes (never move)
    body:
    - '`rebuild` — B re-derives from Frame/Spec; A oracle until `verified-in-foundry`.'
    - '`retire` — must not appear on B; A may keep history.'
    - '`A-only` — allowed on A with expiry (story id or date).'
    - '`B-only` — named on a Spec before done.'
  - type: h3
    num: '01.3'
    text: Target topology
  - type: prose
    body:
    - 'One ASGI Foundry Platform mounts eight Smiths (Herald, Marshal, Atlas, Warden, Mason, Doctor,
      Scribe, Steward). Host is not a ninth station — Steward owns the through-line
      (`docs/dreams/pyforge-unifying-strategy.md` Grounding).'
    - 'Planning: `_bmad-output/projects/pyforge-<station>/`. Foundry + platform Specs sit under
      **steward** (no separate foundry/platform project folders).'
  - type: h3
    num: '01.4'
    text: Laptop SBOM (A-honest)
  - type: prose
    body:
    - '`pyforge-foundry-full` is the checkable laptop compose **on A** (PR #1564 / SBOM Dream). Do not
      read it as proof B already has the same closure.'
    - 'A pins until ledger/Frames absorb them: PostgreSQL **17**; keep `platform-dev`; libpq-17 caps on
      `psycopg` / `pgvector`; never compose fat `local-recipes`; no `desktop-lab`.'
  - type: callout
    tone: amber
    label: Operator watch
    body:
    - 'Epic 44 / `spec-python-foundry-cutover` is the steward sequence. 44.1 move-list blocked on
      solutioning is a control-plane fact — dossier must not imply cutover already flipped.'
    - 'Realization gate: shipped on A ≠ in effect on B. Done means live under the intended root/flag.'
  - type: finding
